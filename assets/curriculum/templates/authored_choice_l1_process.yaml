question_templates:
- id: qt_wset_l1_authored_process
  relation_type: PRINCIPLE_EXPLANATION
  direction: forward
  mode: authored_choice
  variant: l1_vine_and_cellar_decisions
  prompt_template: '{subject.name}'
  parameters:
    item_choices:
      ki_wset_found_annual_order:
        prompt: Which order follows a grapevine from flowering toward harvest?
        options:
        - Harvest, flowering, fruit set, ripening
        - Flowering, fruit set, ripening, harvest
        - Ripening, harvest, flowering, fruit set
        - Fruit set, harvest, flowering, ripening
        correctIndex: 1
        explanation: Flowering precedes berry formation and ripening; harvest comes after the desired composition
          develops.
        sourceCitationId: src_wset_found_nmsu_phenology
      ki_wset_found_cool_warm:
        prompt: Which condition can help a warm-region wine retain acidity?
        options:
        - Hot nights and lower altitude
        - Cool nights or higher altitude
        - Longer exposure to daytime heat
        - A still warmer ripening season
        correctIndex: 1
        explanation: WSET notes that warmer regions often have lower acidity, while altitude and cool nights
          can preserve freshness.
        sourceCitationId: src_wset_found_wset_acid
      ki_wset_found_grape_parts:
        prompt: Which grape part surrounds the juicy pulp and is usually separated early in most white-wine
          production?
        options:
        - The grape skin
        - The cork
        - The label
        - The yeast lees
        correctIndex: 0
        explanation: Skin encloses the pulp; most white-wine routes remove skins from juice before fermentation.
        sourceCitationId: src_wset_found_uga_fermentation
      ki_wset_found_heat_light:
        prompt: What do light and heat contribute to vine growth?
        options:
        - Light causes fermentation in the vineyard while heat creates tannin in barrels
        - Neither matters if the grape has water
        - Heat alone replaces photosynthesis
        - Light supports photosynthesis and heat influences growth and ripening
        correctIndex: 3
        explanation: The vine uses light for photosynthesis; temperature affects whether grapes can mature
          during the growing season.
        sourceCitationId: src_wset_found_nmsu_phenology
      ki_wset_found_pulp_composition:
        prompt: Which pair of grape-pulp measurements helps a grower judge ripeness for a target wine style?
        options:
        - "Berry diameter and fully developed seed colour"
        - "Sugar concentration and acid level"
        - "Pulp volume and berry weight at harvest"
        - "Skin thickness and cluster length at harvest"
        correctIndex: 1
        explanation: Grape pulp contains sugars and acids, whose levels help guide a style-dependent harvest
          decision.
        sourceCitationId: src_wset_found_ucd_pulp
      ki_wset_found_ripening:
        prompt: What generally happens to grape sugar and acid as berries ripen after veraison?
        options:
        - "Sugar falls steadily while acidity rises toward harvest"
        - "Sugar stays steady while acidity rises"
        - "Sugar generally rises while acidity falls"
        - "Sugar and acidity both rise steadily"
        correctIndex: 2
        explanation: The broad trend is more sugar and less acid, though cultivar, weather and picking date
          matter.
        sourceCitationId: src_wset_found_umn_ripeness
      ki_wset_l1_climate_ripeness:
        prompt: With the same grape variety and otherwise suitable conditions, what can greater growing-season
          warmth often allow?
        options:
        - "More sugar accumulation and potentially more alcohol"
        - "Less sugar accumulation and inevitably more acidity"
        - "Sugar remains fixed when the variety stays the same"
        - "Flowering shifts later while ripeness stays unchanged"
        correctIndex: 0
        explanation: More warmth can increase ripeness and sugar, but extreme heat, water stress and harvest
          timing may change the pattern.
        sourceCitationId: src_wset_found_nmsu_phenology
      ki_wset_found_fermentation_sweetness:
        prompt: How can a finished wine retain sweetness from grape sugar?
        options:
        - "Complete sugar consumption leaves acid to produce sweetness"
        - "Oak maturation converts wood compounds into new grape sugar"
        - "Bottle ageing produces new grape sugar after fermentation"
        - "Some grape sugar remains after fermentation"
        correctIndex: 3
        explanation: Residual sugar can remain if fermentation does not consume all sugar; acidity changes
          how sweet it tastes.
        sourceCitationId: src_wset_found_oiv_special
      ki_wset_found_fortified:
        prompt: What distinguishes a fortified wine in production?
        options:
        - "A second fermentation makes it sparkling before bottling"
        - "Grape-origin spirit is added to grape must or wine"
        - "An apple-based ferment is converted to wine by added spirit"
        - "Spirit addition turns it into a sweet red style"
        correctIndex: 1
        explanation: Fortification adds grape-origin spirit or alcohol; sweetness still varies by style and
          timing.
        sourceCitationId: src_wset_found_oiv_special
      ki_wset_found_grape_juice:
        prompt: What does grape juice supply for yeast to produce alcohol during wine fermentation?
        options:
        - Cork dust
        - Oak tannin
        - Fermentable sugars
        - Carbon dioxide from a bottle
        correctIndex: 2
        explanation: Yeast ferments sugars present in grape juice into alcohol and carbon dioxide.
        sourceCitationId: src_wset_found_uga_fermentation
      ki_wset_found_grape_skin:
        prompt: What supplies most of a typical red wine's colour during production?
        options:
        - Contact with black-grape skins
        - Contact with black-grape flesh
        - Contact with toasted oak staves
        - Contact with pressed grape seeds
        correctIndex: 0
        explanation: WSET explains that contact with black-grape skins extracts red colour; the juice itself
          is usually colourless.
        sourceCitationId: src_wset_found_colour_of_wine
      ki_wset_found_red_sequence:
        prompt: Which sequence is typical for making red wine from black grapes?
        options:
        - "Separate skins first, ferment clear juice, then add red colour"
        - "Bottle the must before fermentation and press it afterward"
        - "Ferment black grapes without skins, then age on spent skins"
        - "Ferment with black-grape skins, then separate wine from solids"
        correctIndex: 3
        explanation: Most red wines ferment with black-grape skins before draining and pressing separate wine
          from solids.
        sourceCitationId: src_wset_found_uga_fermentation
      ki_wset_found_rose_sequence:
        prompt: Which route can make a pink rosé from black grapes?
        options:
        - "Ferment black grapes on skins until a deep red develops, then bottle"
        - "Give black grapes brief skin contact, then ferment pink juice without skins"
        - "Ferment clear juice, then rely on bottle ageing to turn it pink"
        - "Distil black-grape must before drawing off the pink juice"
        correctIndex: 1
        explanation: A common rosé route extracts some colour briefly, then ferments separated juice; other
          rosé routes also exist.
        sourceCitationId: src_wset_found_colour_of_wine
      ki_wset_found_white_sequence:
        prompt: For most white wines, when is juice separated from skins?
        options:
        - "After years of maturation with white-grape skins"
        - "After a full red-style skin fermentation"
        - "By pressing before the juice ferments"
        - "After white juice ferments with skins to completion"
        correctIndex: 2
        explanation: Most white wines ferment juice separated from skins by pressing, though skin-contact
          exceptions exist.
        sourceCitationId: src_wset_found_uga_fermentation
      ki_wset_l1_red_route:
        prompt: Which cellar route best fits a typical red wine while allowing producer variation?
        options:
        - "Harvest, ferment with skins, drain and press, then mature and bottle"
        - "Harvest, press off skins, ferment clear juice, mature, bottle"
        - "Harvest, ferment with skins, bottle before draining solids"
        - "Harvest, press off skins, bottle juice, ferment after sale"
        correctIndex: 0
        explanation: A typical red route includes skin fermentation, separation from solids, maturation and
          bottling; crushing and pressing details vary.
        sourceCitationId: src_wset_found_rioja_red
      ki_wset_l1_rose_route:
        prompt: Which order matches WSET's simplified short-maceration rosé sequence?
        options:
        - "Crush black grapes, draw off pale juice before fermentation, then mature and bottle"
        - "Crush black grapes, start skin fermentation, drain pink wine, then mature and bottle"
        - "Crush black grapes, press off pink juice before fermentation, then mature and bottle"
        - "Crush black grapes, ferment on skins to a deep red, then dilute and bottle"
        correctIndex: 1
        explanation: WSET's educator plan begins alcoholic fermentation with crushed black grapes and drains
          the fermenting pink wine from the skins after a few hours. Fermentation then continues apart from
          the skins.
        sourceCitationId: src_wset_close_l2_session
      ki_wset_l1_steps:
        prompt: Which operation applies pressure to grape solids to extract more liquid after free liquid
          has drained?
        options:
        - Maturation
        - Pressing
        - Bottling
        - Fermentation
        correctIndex: 1
        explanation: Draining separates free liquid; pressing then applies pressure to extract additional
          liquid from solids.
        sourceCitationId: src_wset_found_uga_fermentation
      ki_wset_l1_white_route:
        prompt: Which production order is typical for most white wines?
        options:
        - "Harvest, ferment on black-grape skins, press, then bottle"
        - "Harvest, keep white juice on skins through fermentation, then bottle"
        - "Harvest, separate juice from skins, ferment juice, mature, then bottle"
        - "Harvest, ferment whole bunches with skins, press, then bottle"
        correctIndex: 2
        explanation: Most white routes press or drain juice away from skins before fermentation; whole-bunch
          and skin-contact variations exist.
        sourceCitationId: src_wset_found_uga_fermentation
