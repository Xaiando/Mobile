        "scenario_prompts": {
          "n_d3labels_case_us_ava_release": "A fictional New York producer proposes 'Finger Lakes Riesling 2025' for an ordinary Vitis vinifera still wine sold under federal US rules. Batch records supplied for this exercise assign 90% to grapes grown within the named approved AVA,80% to Riesling with all of that qualifying portion grown within it, and 92% to grapes harvested in 2025. It was fully finished in New York, with no class/type-altering exception invoked. The records are invented; their authenticity and any stricter state or other label rules are not established. A shop offers a 300-bottle pilot after full compliant label review. Reprinting costs a fictional $250 and delays dispatch seven days; an early dispatch penalty is $400. Compare the separate federal origin, variety and vintage gates, propose a conditional release, and assess the tradeoff. No actual label approval or sensory-quality evidence is supplied.",
          "n_d3labels_case_au_single_claim": "A fictional Australian cellar proposes one registered Australian GI, Chardonnay and a 2025 harvest date on an ordinary still wine. No foreign GI/place name, excluded sweetening/culture allowance or fortifying spirit affects this exercise. Supplied batch records show 87% from the claimed GI,82% Chardonnay and 86% from 2025. All proportions and trade observations are invented. A buyer will reserve 500 bottles if a compliant approved label meets its Chardonnay brief; revising the grape presentation requires buyer review and a fictional A$180 reprint. Reblending would occupy limited tank space and require fresh analyses with unknown cost and style. Compare the three composition gates, a conditional response, style/quality uncertainty and commercial consequences. Current complete records, other obligations and label approval remain absent.",
