      "parameters": {
        "item_choices": {
          "ki_d3pt_tejo_site_context": {
            "prompt": "Two Tejo lots share a vintage and cultivar but come from recorded Campo and Serras sites. What is a defensible next comparison?",
            "options": [
              "Apply one harvest target to both lots because a shared regional name supplies the same site conditions",
              "Use the Serras schist description to rank the finished wines before reading parcel or sensory records",
              "Compare parcel soils, river exposure and management records with the measured fruit and wine evidence",
              "Classify Campo and Serras as approved protected subdenominations and use those names to confirm both lots"
            ],
            "correctIndex": 2,
            "explanation": "The commission describes Campo alluvial floodplain settings and higher, predominantly schistose Serras terrain. These are contexts for comparing actual parcels. A common regional name does not fix harvest conditions; schist does not establish sensory quality; commission terroirs are not evidence that either lot qualifies for a protected-origin claim.",
            "sourceCitationId": "src_d3pt_cvrtejo_terroir"
          },
          "ki_d3pt_tejo_white_blend": {
            "prompt": "For a Tejo white-blend study, harvest timing, proportions and vessel all differ between trials. What would better test the contribution of blend proportions to the observed acidity and aroma?",
            "options": [
              "Compare different-parcel blends and assign the observed acidity difference exclusively to their Arinto proportions",
              "Run matched comparisons with harvest lot and vessel held constant while changing blend proportions",
              "Compare an earlier steel trial with a later wood trial to isolate the blend proportion effect",
              "Compare buyer price offers for the blends to identify each grape's contribution to acidity and aroma"
            ],
            "correctIndex": 1,
            "explanation": "Matched trials provide a stronger basis for comparing proportions while controlling the other supplied differences. Fernão Pires expression and Arinto acidity are regional starting roles, not fixed outcomes. Different parcels or changed harvest and vessel confound the proportion comparison; buyer price offers do not measure a grape sensory contribution. Controlled presentation and repeat assessment are still needed.",
            "sourceCitationId": "src_d4nw_awri_sensory"
          },
          "ki_d3pt_tejo_label_scope": {
            "prompt": "A Tejo winery supplies its address and a Campo description but no lot certification. How should a proposed protected-origin label be checked?",
            "options": [
              "Approve IG Tejo from the winery address and reserve DO DoTejo for lots described as Serras",
              "Treat DO DoTejo and IG Tejo as interchangeable labels when the same variety appears in the lot",
              "Use the commission terroir description in place of certification when a sample shows the expected style",
              "Check lot provenance and certification against the proposed DO DoTejo or IG Tejo category"
            ],
            "correctIndex": 3,
            "explanation": "IG Tejo is an IGP and DO DoTejo a distinct PDO claim. The proposed category needs its own lot provenance and certification evidence. An address does not supply that evidence; the categories are not interchangeable; neither a commission terroir name nor a sensory impression replaces category-specific checks. No current numerical eligibility threshold is supplied by this question.",
            "sourceCitationId": "src_d3pt_ivv_ig_tejo_2026"
          },
          "ki_d3pt_setubal_site_context": {
            "prompt": "A buyer compares Península de Setúbal lots from a Sado plain and an Arrábida-area slope. Which comparison uses the regional account appropriately?",
            "options": [
              "Compare parcel soil, water and maturity records within the differing relief, river and maritime contexts",
              "Apply the regional maritime description to both lots and schedule an identical harvest without consulting parcel maturity",
              "Use the mountain name to assign the slope lot a later harvest before reviewing its fruit",
              "Use the plain soil description alone to rank the finished quality of both lots"
            ],
            "correctIndex": 0,
            "explanation": "The regional overview distinguishes mountain and plain settings with maritime, river and soil influences. Actual parcel soil, water and maturity records are needed. The maritime description cannot establish identical maturity, a mountain name cannot supply the harvest date, and a soil label alone does not rank finished quality.",
            "sourceCitationId": "src_d3pt_ivv_setubal_profile"
          },
          "ki_d3pt_setubal_castelao_red": {
            "prompt": "A buyer is offered a dry Península de Setúbal Castelão red without extraction, wood or sensory records. What does that information establish?",
            "options": [
              "It establishes longer skin contact because a listed red cultivar determines the required extraction method",
              "It establishes new-wood ageing because a regional Castelão label specifies vessel and drinking window",
              "It supplies a regional cultivar context; request lot and sensory evidence before deciding style or price",
              "It establishes a justified premium price because varietal identity confirms market demand and ageing suitability"
            ],
            "correctIndex": 2,
            "explanation": "Castelão has an important regional role and is listed for the IGP. That information gives cultivar context, not the lot extraction method, wood treatment, drinking window or justified price. Those decisions need actual production and sensory evidence; market demand is not established by the cultivar name.",
            "sourceCitationId": "src_d3pt_ivv_ig_setubal"
          },
          "ki_d3pt_setubal_product_boundary": {
            "prompt": "A dry Castelão red is described only as from Península de Setúbal. Which protected-origin conclusion stays within the supplied evidence?",
            "options": [
              "Approve Setúbal DOP because Setúbal, Palmela and the regional IGP denote the same product category",
              "Setúbal DOP licoroso identity does not approve this dry red; check any other category claim separately",
              "Approve Palmela DOP because Castelão appears in the regional overview, without requesting lot provenance or certification",
              "Reject an IGP route because the regional name belongs only to licoroso wines and cannot describe a dry red"
            ],
            "correctIndex": 1,
            "explanation": "The regional overview identifies Setúbal DOP with licoroso wines, separately from Palmela DOP and the broader regional IGP. The regional name does not approve a dry-red Setúbal DOP claim. Palmela eligibility still needs category-specific evidence, while the IGP is not limited to licoroso wines. This exercise establishes no current composition minimum or individual lot certification.",
            "sourceCitationId": "src_d3pt_ivv_setubal_profile"
          }
        }
      }
    }
