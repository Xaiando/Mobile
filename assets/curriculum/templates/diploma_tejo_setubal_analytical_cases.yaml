        "scenario_prompts": {
          "n_d3pt_case_tejo_white": "An invented producer has sound same-vintage Fernão Pires from a Campo parcel with a supplied high-vigour log, and Arinto from a sandy Charneca parcel with a supplied dry-season water log. The buyer brief is a fresh, aromatic dry white for launch in seven weeks. Trial A is 60:40 Fernão Pires:Arinto, earlier Fernão Pires harvest and steel; trial B is 80:20, later Fernão Pires harvest and a wood vessel. A preliminary coded panel finds A closer to the brief; estimated readiness is week five for A and week ten for B. Those are supplied observations, not effects assigned to one variable. A distributor requests 1,800 bottles with payment 45 days after shipment; a bottling bill is due in 21 days. Another buyer offers a 300-bottle prepaid pilot with producer delivery and follow-up. Cash on hand, full costs, selling prices, repeat panel/stability results, staff capacity and protected-origin approval are missing. All parcels, proportions, findings, volumes, timings and offers are fictional and are not law, standard Tejo trade terms or market data. Recommend a conditional action, explain its evidence, weigh the production and commercial tradeoff, and identify what must still be checked.",
          "n_d3pt_case_setubal_still_red": "An invented producer has sound same-vintage Castelão lots with different parcel ripeness records. Its brief is a dry red with fresh fruit and moderate tannin for a restaurant launch in nine weeks. Pilot C combines one lot, shorter skin contact and an older wood vessel; pilot D combines another lot, longer contact and new wood. A preliminary coded panel finds C closer to the brief; C is estimated ready in week six and D in week twelve. The lots, contact and vessel differ, so this is not a controlled single-variable extraction trial. A partner offers a 1,200-bottle placement, payment after 60 days and delivery work, but supplies no credit references or account-sales evidence. A direct restaurant trial is 240 bottles paid before delivery with winery tastings and follow-up. The supplier bill falls due after 28 days; liquidity, complete prices/costs and staff availability are unknown. Draft labels alternately claim Palmela DOP, Península de Setúbal IGP and Setúbal DOP, without category/provenance/certification records. All production and business inputs are fictional; no actual Palmela composition or other legal numerical minimum is supplied. Recommend a conditional action, explain its evidence, weigh the production and commercial tradeoff, and identify what must still be checked."
        },
        "distractors": {
          "n_d3pt_case_tejo_white": [
            {
              "summary": "Reserve B for the seven-week launch because its later harvest and wood vessel establish a premium Tejo style.",
              "explanation": "The supplied readiness is week ten, and preliminary brief fit is poorer. Those methods cannot guarantee quality, demand or premium price."
            },
            {
              "summary": "Ship the entire distributor request and treat its promised receipt as cash available for the earlier bottling bill.",
              "explanation": "The assumed 45-day receipt follows the 21-day bill. Existing cash or finance could alter feasibility but is not supplied."
            }
          ],
          "n_d3pt_case_setubal_still_red": [
            {
              "summary": "Release D at a higher price because longer contact and new wood establish superior Castelão quality and a nine-week launch.",
              "explanation": "D readiness is week twelve. The supplied lot and methods are confounded, and neither a quality hierarchy nor willingness to pay is established."
            },
            {
              "summary": "Approve Setúbal DOP for the dry red and treat the partner placement as proved downstream sales.",
              "explanation": "The identified Setúbal DOP product category is licoroso, and the dry-red origin claim lacks records. Initial placement is not account or consumer sell-through."
            }
          ]
        }
