# New D3 decisions on existing cited regional evidence; all remain expert-unverified.
question_templates:
  - id: qt_d3rt_regional_choice
    relation_type: PRINCIPLE_EXPLANATION
    direction: forward
    mode: authored_choice
    variant: d3_regional_theory
    prompt_template: '{subject.name}'
    parameters:
      item_choices:
        ki_reg_sa_maule_trial_scope:
          prompt: A 2015 Maule study compares old rainfed bush-vine Carignan in ten localities. Which limit belongs in a buyer's interpretation?
          options:
            - One season and selected vineyards do not establish a permanent ranking for other sites or varieties
            - Ten localities prove that every Maule vineyard has identical water storage
            - The study automatically describes irrigated vines in all later vintages
            - A measured difference certifies one locality's wine as higher quality
          correctIndex: 0
          explanation: The study sampled representative old rainfed bush-vine Carignan sites in 2015; its selection limits extrapolation across seasons, varieties and irrigation systems.
          sourceCitationId: src_reg_sa_maule_research
        ki_reg_sa_maule_carignan:
          prompt: A Maule Carignan offer cites old, head-trained vines grown without irrigation. What do those facts establish?
          options:
            - Every old vine yields the same volume and superior wine
            - They describe a rainfed growing system and vineyard resource, not a quality guarantee
            - Carignan cannot grow in head-trained vineyards
            - Vine age alone identifies the finished wine's price
          correctIndex: 1
          explanation: The regional evidence describes old, dry-farmed head-trained Carignan, while yield and quality still require wine and vineyard evidence.
          sourceCitationId: src_reg_sa_vigno
        ki_reg_oa_adelaide_m3_process:
          prompt: A 2025 M3 Chardonnay record mentions final blending in stainless steel. Why does that not establish an unoaked wine?
          options:
            - Stainless blending retroactively removes all oak influence
            - The vineyard name forbids malolactic fermentation
            - The recorded alcoholic and malolactic fermentations used French oak before stainless assembly
            - Every Adelaide Hills Chardonnay follows the same producer route
          correctIndex: 2
          explanation: The producer separates whole-bunch pressing, French-oak fermentations and final stainless assembly; a later vessel does not erase earlier oak use.
          sourceCitationId: src_reg_oa_m3
        ki_reg_oa_adelaide_m3_sources:
          prompt: A buyer attributes a 2025 M3 Chardonnay's whole profile to one Adelaide Hills vineyard. What qualification is required?
          options:
            - The label proves only Piccadilly fruit was used
            - Every Adelaide Hills parcel has identical soil and elevation
            - A multi-site blend identifies the effect of a single vineyard
            - The wine draws on several named sites and growers; inspect sourcing before a single-site claim
          correctIndex: 3
          explanation: The producer records Lenswood, Piccadilly and Lobethal plus selected growers, so the blend cannot isolate one vineyard's contribution.
          sourceCitationId: src_reg_oa_m3
        ki_reg_ib_douro_terrain:
          prompt: Which price mechanism could matter for a steep Douro still-wine vineyard?
          options:
            - Terrace access can increase labour and equipment constraints
            - A steep site automatically commands a profitable premium
            - A slope removes all vineyard labour
            - Terrain determines the retail price without buyer demand
          correctIndex: 0
          explanation: The IVDP describes terraced-vineyard operations; production cost can rise, while achieved price depends on the market and wine.
          sourceCitationId: src_reg_ib_douro_viti
        ki_reg_oa_pinotage_sort_cap:
          prompt: Fairview's Primo Pinotage 2018 used hand sorting, open-top fermentation and manual punch downs. What is the sound interpretation?
          options:
            - These are documented handling choices for one dry-farmed Paarl wine, not rules for all Pinotage
            - Hand sorting guarantees higher quality in every vintage
            - All Pinotage legally requires open-top fermentation and manual punch downs
            - Dry farming makes fruit health and extraction choices irrelevant
          correctIndex: 0
          explanation: The 2018 producer record documents selected sorting and cap work, without establishing a universal Pinotage method or quality result.
          sourceCitationId: src_reg_oa_primo18
        ki_reg_sa_itata_grapes:
          prompt: A sommelier describes Itata only through Cabernet-family reds and coastal Sauvignon Blanc. Which correction is supported?
          options:
            - The region legally forbids traditional grape varieties
            - País and Moscatel de Alejandría are traditional associations, with Cinsault also documented
            - All current Itata vineyards are planted only to Pinot Noir
            - A selected traditional list proves every permitted variety
          correctIndex: 1
          explanation: The regional account identifies these selected varieties; it is not an exhaustive legal planting list.
          sourceCitationId: src_reg_am_chile
        ki_reg_ib_bairrada_baga_ripening:
          prompt: A cool, wet Bairrada September threatens Baga. Which pairing of cause and response is best?
          options:
            - Early ripening and no rot risk; ignore the forecast
            - Low tannin in every vintage; increase extraction automatically
            - Warm drought; irrigate regardless of water status
            - Late ripening and rot risk; check maturity and sort affected fruit
          correctIndex: 3
          explanation: Baga ripens late and can suffer rot in September rain; only block evidence supports the harvest and sorting plan.
          sourceCitationId: src_reg_ib_baga
        ki_reg_sh_cab_maritime:
          prompt: Margaret River and Coonawarra both grow Cabernet Sauvignon. What is a defensible climate comparison?
          options:
            - Maritime moderation occurs in both, but local sites and conditions differ
            - They have one identical mesoclimate because both are Australian
            - Ocean influence forbids Cabernet ripening in either
            - A maritime label guarantees equal wine price
          correctIndex: 0
          explanation: Moderation is useful context, not proof of equal site conditions or wine quality.
          sourceCitationId: src_reg_sh_margaret
        ki_reg_sh_tasmania_hazards:
          prompt: A Tasmanian Chardonnay producer sees a cool-site advantage. What hazard review still matters?
          options:
            - None; the island name guarantees a sound crop
            - Only summer heat; frost never occurs
            - Spring frost and humidity-related disease exposure
            - Soil colour alone, which predicts all disease
          correctIndex: 2
          explanation: Tasmania's cool conditions can retain acidity, while spring frost and humidity create site and season risks.
          sourceCitationId: src_reg_sh_tasmania
        ki_reg_sa_torrontes_identity:
          prompt: A buyer treats Torrontés Riojano, Sanjuanino and Mendocino as one interchangeable grape because their names match. What does the cultivar evidence show?
          options:
            - The three names prove identical genetics and growing performance
            - Each name guarantees a vineyard's geographic origin
            - They identify genetically different cultivars; name similarity does not make them interchangeable
            - No Torrontés variety is grown in Argentina
          correctIndex: 2
          explanation: The Argentine wine institute distinguishes three cultivars genetically and does not equate their names with vineyard location.
          sourceCitationId: src_reg_sa_torrontes
        ki_reg_oa_adelaide_sauvignon:
          prompt: An Adelaide Hills Sauvignon Blanc has tropical and herbal notes. What is the better explanation?
          options:
            - A regional cool setting can coexist with ripe fruit and varying harvest choices
            - Tropical notes prove the wine came from a hot inland GI
            - All Sauvignon Blanc there must taste identical
            - Herbal notes prove a wine fault
          correctIndex: 0
          explanation: Wine Australia's Adelaide Hills profile describes a range of Sauvignon Blanc expressions; fruit and cellar records refine the cause.
          sourceCitationId: src_reg_oa_adelaide
        ki_reg_oa_canterbury_riesling:
          prompt: A North Canterbury Riesling label does not state sweetness. What can be concluded?
          options:
            - It must be dry because Canterbury is cool
            - It must be sweet because the grape is Riesling
            - The region makes dry through dessert styles; verify this bottle's residual sugar
            - Sweetness is fixed by the vineyard's altitude alone
          correctIndex: 2
          explanation: New Zealand Winegrowers describes a dry-to-dessert range; origin and variety cannot identify the individual finished sweetness.
          sourceCitationId: src_reg_oa_canterbury
        ki_reg_oa_canterbury_pinot:
          prompt: Why should a buyer taste two North Canterbury Pinot Noirs rather than infer one standard style?
          options:
            - Pinot Noir cannot ripen in the region
            - The regional account spans lighter perfumed to darker more substantial expressions
            - Every bottle has identical extraction by law
            - The darker bottle is necessarily higher quality
          correctIndex: 1
          explanation: Site and production choices can give different Pinot expressions; colour alone does not grade quality.
          sourceCitationId: src_reg_oa_canterbury
        ki_reg_oa_gisborne_patutahi:
          prompt: A Gisborne grower proposes Gewürztraminer at warmer inland Patutahi. Which rationale is grounded?
          options:
            - Patutahi is a cold coastal site with no sunlight
            - All Gisborne sites have identical rainfall
            - Gewürztraminer is legally compulsory in Gisborne
            - Patutahi's warmer, lower-rainfall setting has documented rich examples
          correctIndex: 3
          explanation: New Zealand Winegrowers distinguishes Patutahi from coastal Gisborne; the producer still needs parcel and wine evidence.
          sourceCitationId: src_reg_oa_gisborne
        ki_reg_oa_mclaren_ceramic:
          prompt: A buyer compares Yangarra's 2024 Ovitelli and Old Vine Grenache bottlings. Which cellar distinction and inference limit are documented?
          options:
            - Both are legally required to mature only in new oak
            - Ovitelli is an unoaked concrete wine, so vessel alone proves every flavour difference
            - Old Vine uses only ceramic eggs, while Ovitelli uses new barrels
            - Ovitelli uses ceramic without oak; Old Vine includes older oak and nonwood vessels, but other production choices also differ
          correctIndex: 3
          explanation: The producer identifies ceramic for Ovitelli and mixed older-oak/nonwood handling for Old Vine; parcel and extraction differences prevent a vessel-only conclusion.
          sourceCitationId: src_reg_oa_yangarra_egg
        ki_reg_sa_leyda_canopy:
          prompt: A Leyda Sauvignon Blanc parcel faces cool coastal influence. What vineyard detail should be checked before claiming a standard aromatic result?
          options:
            - Only the country name
            - The proposed export price
            - Fruit-zone exposure and actual harvested maturity
            - Whether all Chilean wine is made in clay
          correctIndex: 2
          explanation: A documented producer canopy strategy is site-specific; fruit exposure and maturity can affect the finished style.
          sourceCitationId: src_reg_sa_leyda_2023
        ki_reg_sa_salta_grapes:
          prompt: Why are the Calchaquí Valleys a useful Argentine comparison with Mendoza?
          options:
            - They have identical altitude and grape mix by law
            - Their high-altitude setting and Torrontés association require separate site and style analysis
            - They are a coastal Chilean white-wine region
            - Altitude alone certifies higher quality and price
          correctIndex: 1
          explanation: Wines of Argentina identifies a distinct high-altitude Salta context and grape associations; production and tasting remain necessary.
          sourceCitationId: src_reg_sa_salta
        ki_reg_sa_pedernal_exposure:
          prompt: Two Pedernal Valley slopes face different directions. What inference is best supported?
          options:
            - Morning versus afternoon sun may shift ripening and harvest decisions
            - Aspect cannot matter in the Southern Hemisphere
            - Both slopes must produce identical wine flavours
            - A named slope guarantees a retail premium
          correctIndex: 0
          explanation: The producer account describes opposing exposures; actual block fruit and season data test the inferred effect.
          sourceCitationId: src_reg_sa_pedernal
