        "scenario_prompts": {
          "n_d12depth_case_season": "A fictional vineyard has rapid spring shoot growth, a shaded fruit zone at flowering and healthy leaves after an early harvest. It can fund one spring canopy pass and limited post-harvest water. A manager proposes waiting until shoots become woody to thin them and stopping all care on picking day. Compare seasonal priorities and explain the next-season consequence. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence.",
          "n_d12depth_case_berry": "Fictional Block A goes from 21 to 23 Brix while average berry mass falls from 2.0 to 1.6 g; titratable acidity falls and sensory samples remain uneven. Block B stays at 21 Brix with stable mass and representative samples meeting its fresh-white target. Water status and weather forecasts are incomplete. Compare harvesting and further sampling without declaring the sweeter sample the better wine. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence.",
          "n_d12depth_case_site": "Two fictional 4 ha sites have the same regional warmth index. A costs EUR 120,000 and has observed cold-air pooling and a restrictive wet subsoil; B costs EUR 150,000 with better observed air drainage and a dry shallow root zone. A drainage quote is EUR 20,000; B's reliable water supply and delivery cost are unknown. Compare establishment costs, site risks and climate evidence. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence.",
          "n_d12depth_case_hazard": "Fictional estate: a frost forecast follows budburst; a 6 ha sprinkler system has dependable water for only 3 ha throughout the event. A distant smoke event also affected two separate lots, and next week's hail risk is uncertain. Budget supports a 3 ha protected priority area, smoke sampling and one netted trial. Explain priorities, contingency and residual risk; no perfect protection is promised. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence.",
          "n_d12depth_case_pests": "Fictional block has dusty access roads, bronzed leaves with both pest and predator mites, moth-trap captures and some larvae in bunches. Powdery mildew scouting and virus-status records are incomplete. A manager proposes one blanket spray and declares all remaining pests controlled. Compare a monitoring-led response across these distinct risks; no chemical product or legal permission is supplied. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence.",
          "n_d12depth_case_approaches": "Fictional dry slope compares current IPM with a seasonal cover and mapped targeted inputs. Trial results show erosion loss falling, water stress rising in permanent-cover rows, and EUR 400/ha extra monitoring labour. Scheme status and sensory results are not supplied. Evaluate seasonal cover timing, monitored zones and full cost while comparing all named approach goals. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence.",
          "n_d12depth_case_planting": "Fictional replant: soil testing finds compaction and nematodes. A supplier offers named scion/rootstock material with health records at EUR 4/vine or untested layered own-rooted vines at EUR 1/vine. The plan is 2 ha at 4,000 vines/ha with 2.5 m machinery access. Soil preparation, water equipment and non-bearing-year cash are not quoted. Compare material, layout and capital before ordering. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence.",
          "n_d12depth_case_budget": "Fictional 3 ha vineyard budget: crop need 40 mm, effective rain 10 mm and usable stored soil water 15 mm; irrigation delivery efficiency is 75%. Tissue results indicate adequate nitrogen, while one patch has compacted roots and abnormal pH. Fertiliser and water permissions are not supplied. Calculate the gross water volume (1 mm over 1 ha = 10 m3), compare intervention timing and identify missing evidence. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence.",
          "n_d12depth_case_canopy": "Fictional A is humid, vigorous and shaded at 5,000 vines/ha with 2 kg/vine; B is hot and water-limited at 2,000 vines/ha with 3 kg/vine. One crew is available. A's equipment fits its rows; B's layout requires hand work. Compare canopy timing, crop numbers and labour without using yield as a quality score. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence.",
          "n_d12depth_case_harvest": "Fictional 12 t crop meets a fresh-white maturity target today; rain risk rises tomorrow. Hand picking can deliver 2 t/hour of intact bunches for six hours; a booked machine can deliver 4 t/hour of berries, but the whole-bunch press plan cannot use that fruit unchanged. A separate drying trial loses 30% fruit mass. Compare timing, method and the independent sweet-fruit trial; no legal name eligibility is supplied. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence.",
          "n_d12depth_case_components": "Fictional pilot wines share 12% alcohol. A has 2 g/L residual sugar and firmer acidity; B has 12 g/L sugar and lower acidity. A glycerol measurement differs, but blind tasting finds B sweeter without consistent preference. One label says natural; its processing and stability records are incomplete. Compare component balance and method evidence. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence.",
          "n_d12depth_case_intake": "Fictional 24 t intake arrives over three hours at 8 t/hour; press capacity is 4 t/hour. Sound and damaged fruit are separate. Cold settling occupies a tank overnight; a supplier's flotation trial clears the same juice in four hours, with extra rental cost. Press fractions and solids analyses are not yet complete. Compare reception and clarification separately. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence.",
          "n_d12depth_case_fermentation": "Fictional juice is 25 Brix with low measured YAN and uneven fermentation temperatures in an uncooled vessel. A cooled tank quote is EUR 500; a nutrient proposal has no dose justification. Acid trials change both pH and taste, while a concentration proposal raises sugar further. Applicable process permission and strain specifications are not supplied. Compare a monitored plan. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence.",
          "n_d12depth_case_workflow": "Fictional cellar has crushed red fruit for extraction, intact bunches for a small aroma pilot, black grapes for pale rose and a white ferment stopped by chilling at its intended 15 g/L sugar. A membrane integrity result is missing. Compare skin-separation and fermentation workflows, and decide what must precede releasing the sweet lot. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence.",
          "n_d12depth_case_mlf": "Fictional A is a red wine intended for complete MLF; B is a fresh white intended to retain malic acid. A's malic result is declining but still detected; B has residual malate and an uncertain microbial result. Both report identical total SO2, but free levels and pH differ. Compare completion, avoidance and later protection without specifying a universal addition. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence.",
          "n_d12depth_case_maturation": "Fictional barrel pilot costs EUR 900 and a neutral-tank/oak-piece pilot EUR 300. The barrel wine also receives lees stirring and MLF, while the tank control does not. A 60:40 blend meets the panel's style target, but stability is untested; one option holds stock six months longer. Compare trial interpretation, blend release and inventory costs. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence.",
          "n_d12depth_case_quality": "Fictional finished blend is visually clear but its membrane integrity check failed. An unrelated lot has crystals and another a volatile-acidity signal. Packaging records cannot identify all affected pallets. Compare diagnosis, containment, release evidence and the distinction between spoilage and a site-validated safety hazard. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence.",
          "n_d12depth_case_nolo": "Fictional 1,000 L sound base: A's vacuum pilot costs EUR 200 and B's membrane pilot EUR 240 under supplied quotes. Both reach the commissioned alcohol target; A has more aroma loss in the panel and B needs an extra hygiene step. Final stability and destination product-name eligibility are unknown. Compare route choice and release criteria. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence.",
          "n_d12depth_case_package": "Fictional early-drinking 1,000 L wine compares glass, PET, bag-in-box, bricks, pouches and cans. Supplier data cover only three packages; all six have different quotes and intended use periods. Bulk shipment and destination fill total EUR 1,000, versus EUR 1,200 origin fill plus packaged freight. Closure compatibility, total package oxygen and hot-route shelf-life trials are incomplete. Recommend a bounded trial. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence."
