{
  "question_templates": [
    {
      "id": "qt_d12depth_d1_choices",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "direction": "forward",
      "mode": "authored_choice",
      "variant": "d12depth_d1_choices",
      "prompt_template": "{subject.name}",
      "parameters": {
        "item_choices": {
          "ki_d12depth_season_anatomy": {
            "prompt": "Which distinction should guide dormant pruning and spring canopy work?",
            "options": [
              "Retained one-year wood supplies buds; new shoots form this season's canopy",
              "Roots are the year's fruit-bearing shoots",
              "All permanent arms must be replaced at every harvest",
              "Green shoot thinning is the same operation as retaining dormant canes"
            ],
            "correctIndex": 0,
            "explanation": "Perennial trunk, arms and roots provide the framework and stored reserves. A lignified shoot becomes a cane; retained buds on one-year wood produce new shoots. Pruning retained wood and thinning green shoots act at different stages.",
            "sourceCitationId": "src_vit_phenology"
          },
          "ki_d12depth_season_timing": {
            "prompt": "Why should a vineyard management diary record developmental stage rather than rely on a fixed calendar?",
            "options": [
              "A single harvest date determines next year's whole crop",
              "Stage and actual conditions govern the timing of interventions",
              "Every variety flowers on the same calendar date",
              "Post-harvest leaves have no continuing management purpose"
            ],
            "correctIndex": 1,
            "explanation": "Phenological stages connect budburst, flowering, fruit set, veraison and harvest to management. Current conditions affect this crop while bud development influences the next; dates from one region are not a universal schedule.",
            "sourceCitationId": "src_vit_phenology"
          },
          "ki_d12depth_berry_concentration": {
            "prompt": "A berry sample has higher sugar concentration but lower mean berry mass after a dry week. What remains unresolved?",
            "options": [
              "The sugar reading proves every berry accumulated more sugar",
              "Shrivelling necessarily increases usable juice yield",
              "How much reflects sugar accumulation versus water loss",
              "Acid, flavour and vine water evidence are now irrelevant"
            ],
            "correctIndex": 2,
            "explanation": "A concentration rise can accompany berry shrivelling. Combine representative berry mass and composition data with vine water status; a sugar reading alone does not establish improved flavour, phenolic maturity or wine quality.",
            "sourceCitationId": "src_vit_sampling"
          },
          "ki_d12depth_berry_stage": {
            "prompt": "Which evidence best avoids treating veraison as the completion of harvest maturity?",
            "options": [
              "Harvest every variety at its first coloured berry",
              "Declare seeds, acids and aromas identical at veraison",
              "Use one sun-exposed bunch to certify the block",
              "Track composition, berry condition and intended style after ripening begins"
            ],
            "correctIndex": 3,
            "explanation": "Veraison marks softening and the start of ripening, not one complete harvest criterion. Assess sugar, acidity, pH, flavour, skin and seed condition together and repeat representative sampling across the block.",
            "sourceCitationId": "src_vit_maturity"
          },
          "ki_d12depth_site_scale": {
            "prompt": "Two blocks share a climate classification. What additional evidence is needed for site selection?",
            "options": [
              "Block weather, topography, soil constraints and operational access",
              "Their frost exposure and drainage must be identical",
              "The classification replaces all soil inspection",
              "The cheaper site must produce the highest quality"
            ],
            "correctIndex": 0,
            "explanation": "Regional warmth does not identify a block's cold-air pooling, aspect, water supply or soil restrictions. Evaluate site records and root-zone conditions alongside land, access, drainage and management costs.",
            "sourceCitationId": "src_wset_prod_site"
          },
          "ki_d12depth_site_trend": {
            "prompt": "How should one unusually hot vintage inform a long-lived planting decision?",
            "options": [
              "Treat one hot day as a complete climate forecast",
              "Compare long-term patterns, extreme-event evidence and adaptable choices",
              "Assume warming improves every variety in every site",
              "Ignore extreme events because the long-term average exists"
            ],
            "correctIndex": 1,
            "explanation": "Climate describes longer-term patterns and weather the actual season. A hot year informs risk management but does not by itself quantify the future site climate; compare records and feasible adaptation rather than assume a guaranteed benefit.",
            "sourceCitationId": "src_wset_prod_latitude_weather_noaa"
          },
          "ki_d12depth_hazard_capacity": {
            "prompt": "What makes a hazard response plan operationally credible?",
            "options": [
              "Buying equipment proves protection in every weather type",
              "An inversion method must protect in any windy freeze",
              "Match hazard timing and mechanism to reliable equipment and backup capacity",
              "A supplier's headline capacity replaces a site assessment"
            ],
            "correctIndex": 2,
            "explanation": "Identify the hazard and susceptible vine stage, then check system capacity, power, water, labour and contingency. An inversion-dependent frost method cannot be assumed effective in a windy advective freeze.",
            "sourceCitationId": "src_vit_frost_ncsu"
          },
          "ki_d12depth_hazard_smoke": {
            "prompt": "Why separate fire-injured vines from smoke-risk grape lots?",
            "options": [
              "Every intact vine proves its grapes are smoke-free",
              "All smoke-exposed fruit must have identical future sensory impact",
              "A green shoot inspection alone diagnoses bottled wine taint",
              "Vine survival and potential wine contamination require different evidence"
            ],
            "correctIndex": 3,
            "explanation": "Burnt vine tissues need injury assessment; smoke-exposed fruit needs suitable analytical and sensory assessment. A visually intact vine or an early clean taste does not eliminate a grape lot's smoke-related risk.",
            "sourceCitationId": "src_d1vp_awri_fire"
          },
          "ki_d12depth_pests_mites": {
            "prompt": "What is missing from a plan that treats every bronzed grape leaf with the same broad spray?",
            "options": [
              "Species identification, pest and predator counts, pressure and permitted control choice",
              "All bronzing proves one mite species",
              "Predatory mites are always the pests to remove",
              "A disruptive spray has no consequences for natural enemies"
            ],
            "correctIndex": 0,
            "explanation": "UC grape guidance separates pest mite species and integrates biological, cultural and chemical controls. Dust and vine stress can worsen problems, while disruptive applications may harm predators; verify the pest before responding.",
            "sourceCitationId": "src_d12depth_mites"
          },
          "ki_d12depth_pests_moths": {
            "prompt": "Why must a grape moth or leafroller plan connect scouting with development stage?",
            "options": [
              "One calendar date controls every moth in every region",
              "Trap and larval evidence inform species-specific timing rather than one universal date",
              "A moth trap alone quantifies every damaged bunch",
              "Late bunch damage and early larval prevention are identical"
            ],
            "correctIndex": 1,
            "explanation": "UC leafroller guidance uses monitoring and pest development to time interventions. Eggs, young larvae and established damaged bunches are different targets; a Californian example is not a universal pesticide prescription or treatment threshold.",
            "sourceCitationId": "src_d12depth_leafroller"
          },
          "ki_d12depth_approaches_comparison": {
            "prompt": "How can named vineyard approaches be compared without inventing a quality ranking?",
            "options": [
              "Rank every approach by its name alone",
              "Treat a map as proof of improved flavour",
              "Specify practices, site constraints, measured outcomes and the claim being assessed",
              "Assume every sustainable scheme is organic certification"
            ],
            "correctIndex": 2,
            "explanation": "Conventional/IPM, sustainable, organic, biodynamic, regenerative and precision labels answer different management or scheme questions. Compare actual inputs, soil, vine and business outcomes; a name alone is not an environmental score or sensory result.",
            "sourceCitationId": "src_d1target_awri_cover"
          },
          "ki_d12depth_approaches_trial": {
            "prompt": "A cover-crop trial reduces erosion but increases dry-season vine stress. What evaluation is justified?",
            "options": [
              "Erosion improvement proves all outcomes improved",
              "Water competition must be impossible in regenerative practice",
              "Extra labour proves higher quality",
              "Weigh both outcomes and adapt cover timing or area against costs"
            ],
            "correctIndex": 3,
            "explanation": "A floor treatment can bring soil benefits while competing for water. Record erosion, soil moisture, vine status, yield, inputs and labour against a comparison area; adapt the intervention before generalising its success.",
            "sourceCitationId": "src_d1target_awri_cover"
          },
          "ki_d12depth_planting_sequence": {
            "prompt": "Why should soil constraints and planting-material identity be checked before ordering vines?",
            "options": [
              "They influence rootstock, scion, preparation, layout and long-lived investment",
              "A prestigious clone makes sanitary records unnecessary",
              "Rootstock identity cannot affect site suitability",
              "Planting density replaces soil preparation"
            ],
            "correctIndex": 0,
            "explanation": "Prepare an establishment plan joining root-zone and site limitations with variety, clone/rootstock suitability and true-to-type high-health supply. Planting a famous clone does not resolve drainage, pest, water or machinery requirements.",
            "sourceCitationId": "src_d12depth_planting"
          },
          "ki_d12depth_planting_capital": {
            "prompt": "Fictional 2 ha planting uses 4,000 vines/ha at EUR 4 per plant. What is the plant-purchase subtotal?",
            "options": [
              "EUR 8,000 and no further establishment cost",
              "EUR 32,000; other establishment and operating costs remain additional",
              "EUR 16,000 as a complete budget",
              "EUR 32,000 proves immediate profitable production"
            ],
            "correctIndex": 1,
            "explanation": "2 x 4,000 x 4 = EUR 32,000 for plants alone. Land preparation, trellis, water, labour, failed plants and non-bearing years are excluded; a higher density changes the budget and operations without proving better wine.",
            "sourceCitationId": "src_wset_prod_site"
          },
          "ki_d12depth_budget_water": {
            "prompt": "A fictional period needs 40 mm usable water, has 10 mm effective rain and 15 mm usable soil supply. What is the net irrigation shortfall?",
            "options": [
              "65 mm because all supplies should be added",
              "15 mm is automatically the same as gross pumped water",
              "15 mm net; gross delivery depends on efficiency and site constraints",
              "The calculation grants water access"
            ],
            "correctIndex": 2,
            "explanation": "40 - 10 - 15 = 15 mm under the supplied simplified budget. At a stated 75% delivery efficiency this requires 20 mm gross application. This accounting does not determine a universal vine requirement or permission to irrigate.",
            "sourceCitationId": "src_wset_prod_irrigation"
          },
          "ki_d12depth_budget_nutrition": {
            "prompt": "What should precede a nutrient application in a weak patch with unusual soil pH?",
            "options": [
              "Weak growth always proves nitrogen deficiency",
              "Ignore soil pH because only total nutrient mass matters",
              "Add every nutrient until canopy growth stops increasing",
              "Representative soil and vine evidence identifying the actual limitation"
            ],
            "correctIndex": 3,
            "explanation": "Soil structure, pH, nutrient supply, salinity and root health can constrain growth differently. Use soil and plant results to identify needs and timing; a weak canopy does not prove nitrogen deficiency or justify unlimited fertiliser.",
            "sourceCitationId": "src_d12depth_soil"
          },
          "ki_d12depth_canopy_yield": {
            "prompt": "Fictional A yields 2 kg/vine at 5,000 vines/ha; B yields 3 kg/vine at 2,000 vines/ha. Which has higher tonnes/ha?",
            "options": [
              "A: 10 t/ha versus B: 6 t/ha",
              "B: higher kg/vine must mean higher t/ha",
              "Both must have the same area yield",
              "A: higher area yield proves higher sensory quality"
            ],
            "correctIndex": 0,
            "explanation": "Yield per area combines yield per vine and vine density: A = 10,000 kg/ha; B = 6,000 kg/ha. The lower per-vine yield produces the larger area yield here; neither quantity alone proves quality.",
            "sourceCitationId": "src_vit_balance"
          },
          "ki_d12depth_canopy_exposure": {
            "prompt": "Why can the same severe fruit-zone leaf removal be unsuitable in two different sites?",
            "options": [
              "Exposure benefits every site without a trade-off",
              "Disease pressure, exposure timing and heat/sunburn risk differ",
              "All leaf area should be removed to maximise photosynthesis",
              "Training systems have no interaction with labour or equipment"
            ],
            "correctIndex": 1,
            "explanation": "Canopy work changes light, air movement and operations. Opening a humid shaded zone can help drying and access, whereas suddenly exposing hot-site fruit may add sunburn risk. Match training, pruning and passes to vigour, weather and fruit condition.",
            "sourceCitationId": "src_vit_leaf_removal"
          },
          "ki_d12depth_harvest_route": {
            "prompt": "Which comparison keeps sweet-fruit routes distinct?",
            "options": [
              "All concentrated fruit must be noble-rot fruit",
              "Artificial chilling proves every ice-wine label eligible",
              "Drying, beneficial rot and natural freezing concentrate by different processes",
              "Drying necessarily preserves the original juice volume"
            ],
            "correctIndex": 2,
            "explanation": "Drying removes water before or after picking. Suitable noble rot changes and concentrates fruit under particular conditions; natural on-vine freezing separates frozen water at pressing. Artificial freezing is a distinct treatment and cannot by itself establish an ice-wine claim.",
            "sourceCitationId": "src_wset_prod_drying"
          },
          "ki_d12depth_harvest_capacity": {
            "prompt": "Why should a whole-bunch style be planned before harvest method is booked?",
            "options": [
              "Any machine harvest supplies intact bunches by definition",
              "Hand harvest guarantees every quality target",
              "Picking can be scheduled without checking winery reception",
              "Intact-fruit needs must match collection, transport and processing capacity"
            ],
            "correctIndex": 3,
            "explanation": "Ordinary berry-removing machine harvest and intact-bunch picking deliver different material. Compare style needs with crop condition, transport time, labour and press capacity; neither method name is a universal quality verdict.",
            "sourceCitationId": "src_wset_prod_harvest_cost"
          },
          "ki_d12depth_components_balance": {
            "prompt": "Two wines have equal alcohol but different acidity, sugar and tannin. What follows?",
            "options": [
              "Alcohol alone cannot describe their complete balance",
              "Their sensory balance must be identical",
              "Their glycerol must be identical",
              "Their production method and quality must be identical"
            ],
            "correctIndex": 0,
            "explanation": "Assess components together: sugar affects sweetness, acids freshness, phenolics colour or structure, and alcohol body or warmth. Sensory interactions and individual sensitivity make an isolated measurement an incomplete style or quality judgment.",
            "sourceCitationId": "src_wset_taste_awri"
          },
          "ki_d12depth_components_method": {
            "prompt": "What evidence supports comparing natural, conventional, organic or biodynamic winemaking?",
            "options": [
              "A natural label establishes microbial stability",
              "Actual processes, fruit, analyses and tasting rather than a name alone",
              "Organic means every wine contains no sulfur dioxide",
              "A conventional method proves lower sensory quality"
            ],
            "correctIndex": 1,
            "explanation": "A named approach does not replace a description of handling, fermentation, additions and stability controls. Compare the measured wines and documented practices; organic certification and a sensory assessment answer different questions.",
            "sourceCitationId": "src_win_fermentation"
          },
          "ki_d12depth_intake_throughput": {
            "prompt": "Fictional arrivals are 8 t/hour and the available press processes 4 t/hour. What is the immediate logistics issue?",
            "options": [
              "The queue falls by 4 t/hour",
              "Flotation alone doubles pressing capacity",
              "Fruit accumulates at 4 t/hour unless arrival or processing capacity changes",
              "Arrival and pressing rates are irrelevant"
            ],
            "correctIndex": 2,
            "explanation": "Arrival exceeds pressing by 4 t/hour under the supplied rates. Schedule loads, protect waiting fruit and verify sorting/chilling capacity; a faster clarification stage cannot alone remove the press bottleneck.",
            "sourceCitationId": "src_d1method_awri_flotation"
          },
          "ki_d12depth_intake_clarification": {
            "prompt": "Which distinction belongs in a pre-fermentation clarification comparison?",
            "options": [
              "All clarification mechanisms are identical settling",
              "All solids must always be removed before yeast can ferment",
              "Air and nitrogen flotation necessarily have identical oxidation effects",
              "Separation mechanism, solids target, throughput and fruit/oxygen response"
            ],
            "correctIndex": 3,
            "explanation": "Settling uses gravity; flotation lifts aggregated solids with gas; centrifugation uses centrifugal force. Compare a suitable solids target and capacity rather than equate visual brilliance with successful fermentation.",
            "sourceCitationId": "src_d1method_awri_flotation"
          },
          "ki_d12depth_fermentation_nutrition": {
            "prompt": "Why measure YAN before designing a high-sugar must fermentation?",
            "options": [
              "Sugar, strain needs and available nutrients affect the plan",
              "Every must needs the same nitrogen dose",
              "DAP supplies every vitamin and micronutrient",
              "Additions late in fermentation are always fully absorbed"
            ],
            "correctIndex": 0,
            "explanation": "Measure yeast-assimilable nitrogen and consider sugar, chosen strain and micronutrients. Late rescue additions may be poorly used, while excessive early additions can alter kinetics and spoilage risk; no universal dose is supplied.",
            "sourceCitationId": "src_win_yan"
          },
          "ki_d12depth_fermentation_trial": {
            "prompt": "What makes a must-adjustment plan defensible?",
            "options": [
              "A target pH proves permission for every adjustment",
              "A lawful proposed treatment tested for its measured and sensory response",
              "Concentration and sugar addition are identical operations",
              "One trial guarantees identical results at every vessel scale"
            ],
            "correctIndex": 1,
            "explanation": "Bench trials and monitoring should inform enrichment, concentration or acidity choices. Concentrating must and adding fermentable sugar are different operations; a desired analysis does not itself establish a permitted process or stable finished wine.",
            "sourceCitationId": "src_wset_prod_acid"
          },
          "ki_d12depth_workflow_routes": {
            "prompt": "Why does the description 'whole-bunch fermentation' not prove that all fermentation is intracellular?",
            "options": [
              "Every whole-bunch ferment is wholly yeast-free",
              "Whole-bunch wording guarantees exclusively intracellular fermentation",
              "Whole-bunch methods can combine intracellular berry activity with yeast fermentation; the actual workflow matters",
              "All cap management can be ignored whenever whole fruit is present"
            ],
            "correctIndex": 2,
            "explanation": "Carbonic, semi-carbonic and whole bunches in crushed fruit use different fruit forms and fermentation premises. Yeast fermentation completes the wine; whole-bunch wording alone does not establish wholly intracellular fermentation or a guaranteed sensory result.",
            "sourceCitationId": "src_wset_prod_carbonic"
          },
          "ki_d12depth_workflow_arrest": {
            "prompt": "Why is cooling a sweet fermentation only one part of a finished-wine plan?",
            "options": [
              "Cooling proves every yeast cell has been removed",
              "Visual clarity proves no refermentation can occur",
              "Residual sugar protects the wine from all microorganisms",
              "Cooling slows activity; residual fermentable sugar still needs stability controls"
            ],
            "correctIndex": 3,
            "explanation": "A chosen residual-sugar endpoint needs monitoring and suitable microbial controls through filtration, hygiene and packaging. Cooling does not by itself remove viable yeast or permanently stabilise the wine.",
            "sourceCitationId": "src_wset_prod_filter"
          },
          "ki_d12depth_mlf_decision": {
            "prompt": "What distinguishes encouraging MLF from preserving a malic-acid-driven style?",
            "options": [
              "A style-specific plan with compatible organisms, conditions and monitoring",
              "MLF is always a mandatory quality improvement",
              "MLF and alcoholic fermentation consume the same substrate identically",
              "Avoiding inoculation proves future MLF impossible"
            ],
            "correctIndex": 0,
            "explanation": "MLF converts malic acid to lactic acid. When desired, consider strain compatibility, alcohol, pH, temperature and sulfur; when avoided, manage organisms and substrates through appropriate controls rather than assume it cannot start later.",
            "sourceCitationId": "src_win_mlf"
          },
          "ki_d12depth_mlf_sulfur": {
            "prompt": "Two wines have equal total SO2 but different pH and free SO2. What follows?",
            "options": [
              "Equal total SO2 proves equal protection at every pH",
              "Total SO2 alone does not establish equivalent protection",
              "Bound SO2 always replaces free SO2 in the same way",
              "pH has no relevance after adding sulfur"
            ],
            "correctIndex": 1,
            "explanation": "Free and bound sulfur forms differ, and pH affects molecular antimicrobial action. Use suitable measurements and wine-specific monitoring; equal total SO2 is not proof of identical microbial or oxidation control.",
            "sourceCitationId": "src_win_sulfur"
          },
          "ki_d12depth_maturation_trial": {
            "prompt": "A lees pilot also undergoes MLF while its control does not. What can the comparison establish?",
            "options": [
              "Every sensory difference must be caused only by lees",
              "The trial proves stirring always improves every wine",
              "The combined treatment differs; it cannot isolate lees as the sole cause",
              "MLF status is irrelevant to a lees comparison"
            ],
            "correctIndex": 2,
            "explanation": "AWRI's Chardonnay trial disclosed a lees-plus-MLF confound. A useful sensory comparison records all changed variables, oxygen and vessel conditions; intended treatment labels do not prove a single causal mechanism.",
            "sourceCitationId": "src_win_lees"
          },
          "ki_d12depth_maturation_blend": {
            "prompt": "Why test a completed blend after each component appeared stable?",
            "options": [
              "Stable components mathematically prove a stable final blend",
              "Oak pieces reproduce every barrel effect",
              "More components automatically mean higher quality",
              "Mixing changes the resulting composition and may alter stability"
            ],
            "correctIndex": 3,
            "explanation": "Trial blends can address balance, consistency, style or cost, but the final wine needs suitable sensory and analytical checks. Oak pieces, barrels and neutral vessels do not provide interchangeable oxygen, evaporation and flavour conditions.",
            "sourceCitationId": "src_wset_prod_blend"
          },
          "ki_d12depth_quality_diagnosis": {
            "prompt": "Why distinguish a tartrate deposit from an unexplained haze before treatment?",
            "options": [
              "Different causes require appropriate tests and controls",
              "Every haze is harmless tartrate",
              "Every deposit proves a food-safety critical control point",
              "One coarse filter guarantees all forms of stability"
            ],
            "correctIndex": 0,
            "explanation": "A visible deposit or haze is an observation, not a complete diagnosis. Protein, crystals, viable organisms and other material call for different investigation; clarification alone does not establish microbiological or package stability.",
            "sourceCitationId": "src_win_protein"
          },
          "ki_d12depth_quality_release": {
            "prompt": "What joins fruit, cellar and packaging quality control into an auditable workflow?",
            "options": [
              "All sensory faults must be food-safety CCPs",
              "Defined sampling, decision criteria, records and tested traceability",
              "A named ISO standard proves the winery is certified",
              "A release decision can omit lot and process evidence"
            ],
            "correctIndex": 1,
            "explanation": "Hygiene prerequisites and site-specific hazard analysis support controls; lot records connect materials and processes to destinations. A quality fault does not automatically become a safety CCP, and mentioning ISO does not prove certification.",
            "sourceCitationId": "src_d1target_oiv_haccp"
          },
          "ki_d12depth_nolo_compare": {
            "prompt": "How should two alcohol-removal routes be evaluated for the same sound base wine?",
            "options": [
              "The method name guarantees sensory equivalence",
              "Alcohol removal may be used to certify a faulty base as sound",
              "Compare achieved analysis, sensory retention, stability, throughput and full cost",
              "An OIV technical admission settles every country's product name"
            ],
            "correctIndex": 2,
            "explanation": "OIV lists vacuum evaporation, membrane techniques and distillation as routes under specialist oversight. Process names do not quantify aroma, mouthfeel, microbial control or destination eligibility; examine actual trial results.",
            "sourceCitationId": "src_d1target_oiv_dealc"
          },
          "ki_d12depth_nolo_cost": {
            "prompt": "Fictional route A costs EUR 100 setup plus EUR 0.10/L; B costs EUR 40 plus EUR 0.20/L. At 1,000 L which quoted treatment cost is lower?",
            "options": [
              "B at EUR 40 because only setup counts",
              "A at EUR 100 because volume cost can be ignored",
              "A's lower quoted cost proves superior sensory results",
              "A at EUR 200 versus B at EUR 240, before omitted costs"
            ],
            "correctIndex": 3,
            "explanation": "A = 100 + 100; B = 40 + 200. These supplied treatment quotations omit testing, adjustment, losses, packaging and finance; cheaper treatment is not a complete product or quality decision.",
            "sourceCitationId": "src_d1target_oiv_dealc"
          },
          "ki_d12depth_package_assembly": {
            "prompt": "What should a closure comparison specify beyond its material name?",
            "options": [
              "The wine, complete bottle/closure assembly, filling conditions and intended use period",
              "Every screwcap has the same oxygen performance",
              "All glass stoppers fit all bottle mouths",
              "A material name removes the need to validate the filler"
            ],
            "correctIndex": 0,
            "explanation": "Natural or technical cork, synthetic closures, screwcaps and glass systems differ by design and performance. Bottle compatibility, seals and equipment settings matter; a class name alone does not determine oxygen ingress, taint risk or shelf life.",
            "sourceCitationId": "src_wset_prod_closure"
          },
          "ki_d12depth_package_landed": {
            "prompt": "A fictional 1,000 L bulk route costs EUR 300 freight plus EUR 700 destination fill/assurance; packaged freight costs EUR 600 plus EUR 600 origin fill. Which supplied total is lower?",
            "options": [
              "Bulk costs EUR 300 in total",
              "Bulk at EUR 1,000 versus packaged at EUR 1,200",
              "Packaged costs EUR 600 in total",
              "Bulk is universally cheaper at all volumes and destinations"
            ],
            "correctIndex": 1,
            "explanation": "The supplied comparison gives 300 + 700 = 1,000 and 600 + 600 = 1,200. Compare transfers, oxygen, temperature, lot records and shelf life too; fictional costs do not make bulk universally cheapest.",
            "sourceCitationId": "src_wset_prod_package"
          },
          "ki_d12depth_components_glycerol": {
            "prompt": "How should glycerol be distinguished from residual grape sugar when interpreting a fermented wine?",
            "options": [
              "Glycerol is exactly the same analytical measure as residual glucose/fructose",
              "Higher glycerol proves that all wines have identical perceived body",
              "Yeast can produce glycerol during fermentation; its concentration alone does not establish residual glucose/fructose or perceived body",
              "Glycerol concentration alone guarantees improved wine quality"
            ],
            "correctIndex": 2,
            "explanation": "Glycerol is a fermentation-derived component rather than a measure of unfermented glucose/fructose. AWRI yeast trials connect metabolism with glycerol and other metabolites. Interpret sweetness/body with the whole wine and sensory evidence rather than assuming that more glycerol guarantees superior texture.",
            "sourceCitationId": "src_d12depth_glycerol"
          },
          "ki_d12depth_workflow_coferment": {
            "prompt": "What distinguishes combining different grape varieties before fermentation from blending finished wines?",
            "options": [
              "Co-fermentation and finished-wine blending occur at the same stage",
              "Co-fermentation joins the grape components during fermentation; finished-wine blending joins separately fermented wines later",
              "Adding white grapes invariably increases final colour",
              "Co-fermentation makes different harvest dates irrelevant"
            ],
            "correctIndex": 1,
            "explanation": "Co-fermentation joins grape components before/during fermentation, while later blending preserves separately fermented components for trials. Different ripening dates can complicate co-fermentation; colour, aroma and quality outcomes depend on materials and process rather than being guaranteed by the method.",
            "sourceCitationId": "src_d12depth_coferment"
          }
        }
      }
    },
