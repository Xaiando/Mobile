question_templates:
- id: qt_wset_l1_authored_more_core
  relation_type: PRINCIPLE_EXPLANATION
  direction: forward
  mode: authored_choice
  variant: l1_grapes_service_tasting
  prompt_template: '{subject.name}'
  parameters:
    item_choices:
      ki_wset_grape_cabernet_sauvignon_beginner:
        prompt: Which description can fit a typical Cabernet Sauvignon red wine?
        options:
        - A light white with no tannin
        - A medium- to full-bodied red with firm tannins and possible blackcurrant fruit
        - A sweet sparkling wine made only from white grapes
        - A red that must be low in tannin and pale in colour
        correctIndex: 1
        explanation: Cabernet Sauvignon commonly makes structured, medium- to full-bodied reds; blackcurrant
          is one possible fruit note. Region changes the expression.
        sourceCitationId: src_wset_grape_wa_cabernet
      ki_wset_grape_chardonnay_beginner:
        prompt: Which statement best reflects the range of Chardonnay styles?
        options:
        - Every Chardonnay must be strongly oaked
        - Only cool regions can make Chardonnay
        - Chardonnay is always a red wine with firm tannin
        - It can be a fresh, lighter white or a fuller, riper white; oak use varies
        correctIndex: 3
        explanation: Chardonnay's body and fruit profile vary with growing conditions, and the winemaker may
          use oak or make an unoaked style.
        sourceCitationId: src_wset_grape_wa_chardonnay
      ki_wset_grape_merlot_beginner:
        prompt: Which tasting note could describe a Merlot-based red?
        options:
        - Cherry or plum fruit with a rounded texture
        - Lime zest in a high-acid white with no red grapes
        - Only smoke and no fruit in every example
        - A guarantee of vigorous bubbles and high sweetness
        correctIndex: 0
        explanation: Bordeaux's grape profile describes Merlot with cherry and plum notes and a supple, rounded
          texture, while its red styles vary in weight.
        sourceCitationId: src_reg_fr_merlot
      ki_wset_grape_pinot_gris_beginner:
        prompt: Which description could fit a Pinot Gris d'Alsace?
        options:
        - A black-grape red with compulsory heavy tannin
        - A white that must always be light and lean
        - A rich, full-bodied white with weight and a rounded palate
        - A wine that must be sparkling because of its grape name
        correctIndex: 2
        explanation: The Alsace regional source describes Pinot Gris d'Alsace as an ample, rounded and full-bodied
          white.
        sourceCitationId: src_wset_grape_civa_pinot_gris
      ki_wset_grape_pinot_noir_beginner:
        prompt: Which profile is often associated with a still red Pinot Noir?
        options:
        - A white with no red-fruit character
        - A light- to medium-bodied red with cherry or strawberry fruit
        - A fortified red whose sweetness is compulsory
        - A wine that must always be full-bodied and strongly tannic
        correctIndex: 1
        explanation: Wine Australia describes still red Pinot Noir as often light to medium in body, with
          cherry and strawberry fruit; examples vary.
        sourceCitationId: src_wset_grape_wa_pinot_noir
      ki_wset_grape_riesling_beginner:
        prompt: Which statement about Riesling is accurate?
        options:
        - It is a black grape used only for red wine
        - It must taste sweet in every bottle
        - It has low acidity by definition
        - It can make citrus-scented, high-acid white wine in dry or sweeter styles
        correctIndex: 3
        explanation: Wine Australia describes Riesling as typically high-acid with vibrant citrus fruit and
          notes both dry and sweeter styles.
        sourceCitationId: src_wset_grape_wa_riesling
      ki_wset_grape_sauvignon_blanc_beginner:
        prompt: Which profile is a common Sauvignon Blanc expression?
        options:
        - High-acid white with grassy character
        - Low-acid white with blackcurrant fruit
        - High-tannin red with grassy character
        - Low-tannin red with tropical fruit
        correctIndex: 0
        explanation: WSET describes Sauvignon Blanc as a white variety often showing high acidity and green
          or grassy aromas.
        sourceCitationId: src_wset_grape_wset_sauvignon
      ki_wset_grape_syrah_beginner:
        prompt: What does the name Shiraz refer to in the Wine Australia grape profile?
        options:
        - A synonym for Chardonnay
        - A red-wine production method rather than a grape
        - The same grape variety also called Syrah
        - A legally required blend of three different grapes
        correctIndex: 2
        explanation: Wine Australia identifies Shiraz as Syrah; the wines' body and flavours vary by region
          and winemaking.
        sourceCitationId: src_wset_grape_wa_shiraz
      ki_wset_srv_champagne_temperature:
        prompt: Using WSET Level 1's service-temperature descriptions, how should sparkling Champagne be served?
        options:
        - Room temperature
        - Well chilled
        - Lightly chilled
        - Chilled
        correctIndex: 1
        explanation: Sparkling wine is in WSET Level 1's well-chilled category; Comité Champagne recommends
          serving Champagne chilled at about 8–10°C, without making it ice-cold.
        sourceCitationId: src_wset_srv_champagne
      ki_wset_srv_sparkling_glass:
        prompt: Which glass shape does Comité Champagne recommend to show Champagne's aromas and bubbles?
        options:
        - A flat, wide coupe
        - A completely sealed vessel
        - A tall, bulbous tulip that narrows at the top
        - An opaque cup with no visible bowl
        correctIndex: 2
        explanation: The Comité recommends a tall, bulbous, tulip-shaped glass with a narrower top.
        sourceCitationId: src_wset_srv_champagne
      ki_wset_srv_spark_stopper:
        prompt: How should an unfinished bottle of Champagne be kept for later service?
        options:
        - Leave it open on the table
        - Place a spoon in its neck and store it warm
        - Use a still-wine vacuum pump to pull out the bubbles
        - Fit a purpose-made sparkling-wine stopper and keep it cool
        correctIndex: 3
        explanation: Comité Champagne recommends a special sparkling-wine stopper and cool storage; a spoon
          does not preserve bubbles.
        sourceCitationId: src_wset_srv_champagne
      ki_wset_srv_preserve_cool:
        prompt: How should an opened bottle of still red wine be stored if some remains?
        options:
        - Reclose it and refrigerate it to slow oxidation
        - Leave it uncorked beside a heater
        - Keep it warm because only white wine can be refrigerated
        - Freeze it solid before each later pour
        correctIndex: 0
        explanation: WSET advises refrigerating recorked opened red as well as white wine; cooler temperatures
          slow oxidation.
        sourceCitationId: src_wset_srv_preserve
      ki_wset_srv_preserve_vacuum:
        prompt: What does a still-wine vacuum preservation device do?
        options:
        - Adds new fruit flavour to aged wine
        - Removes some air before the bottle is resealed
        - Creates bubbles through a second fermentation
        - Raises the wine's alcohol level
        correctIndex: 1
        explanation: A vacuum pump reduces the air in an opened still-wine bottle and helps delay deterioration.
        sourceCitationId: src_wset_srv_preserve
      ki_wset_srv_preserve_air:
        prompt: Why can transferring leftover still wine to a smaller, sealed bottle help preserve it?
        options:
        - The smaller bottle removes all acids
        - It guarantees the wine will improve for years
        - It leaves less air space around the wine
        - It converts the wine to a sparkling style
        correctIndex: 2
        explanation: A smaller sealed bottle reduces the volume of air above leftover wine and therefore its
          oxygen exposure.
        sourceCitationId: src_wset_srv_preserve
      ki_wset_srv_spark_no_vacuum:
        prompt: Why avoid using a still-wine vacuum pump on an opened sparkling wine?
        options:
        - It can remove dissolved gas and leave the wine flat
        - It makes the wine sweeter by adding sugar
        - It turns the wine red
        - It raises the serving temperature automatically
        correctIndex: 0
        explanation: WSET warns that a vacuum pump can pull the bubbles out of sparkling wine.
        sourceCitationId: src_wset_srv_preserve
      ki_wset_srv_ice_water:
        prompt: Why add water to an ice bucket before chilling a wine bottle?
        options:
        - It replaces insulating air around the bottle
        - It slows heat transfer between bottle and ice
        - It protects the capsule from melting ice
        - It prevents the ice cubes from melting
        correctIndex: 0
        explanation: WSET advises equal amounts of ice and water so cold water surrounds the bottle and transfers
          heat better than air gaps.
        sourceCitationId: src_wset_srv_temperature
      ki_wset_srv_white_temperature:
        prompt: Using WSET Level 1's service-temperature descriptions, how should a full-bodied white wine
          be served?
        options:
        - Chilled
        - Room temperature
        - Well chilled
        - Lightly chilled
        correctIndex: 3
        explanation: WSET calls full-bodied whites lightly chilled; its public service guide gives about 10–13°C
          for an oaked Chardonnay example.
        sourceCitationId: src_wset_srv_temperature
      ki_wset_srv_red_cold:
        prompt: A full-bodied red has been served too cold. What is a gentle way to warm it?
        options:
        - Place its bottle on a radiator
        - Add hot water to the glass
        - Hold the bowl of the glass in your hands
        - Shake the glass until the wine foams
        correctIndex: 2
        explanation: WSET suggests warming the bowl gently in the hands and warns against sudden extreme heat.
        sourceCitationId: src_wset_srv_temperature
      ki_wset_found_still:
        prompt: A wine is neither sparkling nor fortified. Which basic WSET type fits?
        options:
        - Sparkling wine
        - Fortified wine
        - Aromatised wine
        - Still wine
        correctIndex: 3
        explanation: WSET defines still wine as wine that is not sparkling; it can be white, red or rosé.
        sourceCitationId: src_wset_found_wset_styles
      ki_wset_taste_aroma_train:
        prompt: Which exercise can help a beginner recognise wine aromas?
        options:
        - Compare familiar smells and several wines side by side
        - Memorise bottle prices instead of smelling
        - Taste only one wine and avoid comparison
        - Read a grape name and assume every aroma is present
        correctIndex: 0
        explanation: WSET recommends smelling familiar things and comparing contrasting wines side by side
          to build aroma recognition.
        sourceCitationId: src_wset_taste_intro
      ki_wset_taste_palate_flavours:
        prompt: In a tasting note, how should fruit-flavour intensity be recorded?
        options:
        - As a direct measure of the wine's sugar level
        - As a direct measure of the wine's tannin level
        - Separately from structural sensations
        - As a direct measure of the wine's alcohol level
        correctIndex: 2
        explanation: WSET separates the identification and intensity of flavours from structural components
          such as acidity, tannin and alcohol.
        sourceCitationId: src_wset_taste_intro
      ki_wset_taste_sequence_look:
        prompt: What is the usual order in WSET's systematic approach to tasting wine?
        options:
        - Price, label, score
        - Palate, nose, appearance
        - Appearance, nose, palate
        - Region, vintage, alcohol label
        correctIndex: 2
        explanation: WSET describes evaluating appearance first, followed by the nose and then the palate.
        sourceCitationId: src_wset_taste_intro
      ki_wset_taste_sweet_acid_balance:
        prompt: A sweet wine still makes the mouth water. Which conclusion fits?
        options:
        - Sweetness means the wine has lost its acidity
        - Mouthwatering indicates sugar rather than acid
        - High acidity means the wine cannot taste sweet
        - Sweetness and high acidity can occur together
        correctIndex: 3
        explanation: WSET explains that high residual sugar can balance high acidity, which can still make
          the mouth water.
        sourceCitationId: src_wset_found_wset_acid
      ki_wset_taste_conditions_bias:
        prompt: To reduce expectation bias in a blind practice tasting, when should a taster record observations?
        options:
        - Before learning the wine's identity
        - Only after reading the producer's tasting note
        - Only after seeing a critic's score
        - After choosing the preferred grape from the label
        correctIndex: 0
        explanation: The Australian Wine Research Institute advises assessing a wine without prior identity
          cues, then retasting after its identity is revealed.
        sourceCitationId: src_wset_taste_awri
