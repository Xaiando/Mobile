# Diploma D3 comparisons for source-linked regional assertions that otherwise
# have only recall formats. Each decision remains conditional on the stated
# site, wine or vintage; the underlying assertions await expert verification.
question_templates:
  - id: qt_d3_geography_principle_closure_24
    relation_type: PRINCIPLE_EXPLANATION
    direction: forward
    mode: authored_choice
    variant: d3_geography_principle_closure
    prompt_template: '{subject.name}'
    parameters:
      item_choices:
        ki_reg_ah_styria_context:
          prompt: A Südsteiermark Sauvignon Blanc grower plans fruit-health monitoring. Which regional evidence belongs in the plan?
          options:
            - Relatively wet southern and western Styria can bring fog, storms or hail alongside ripening concerns
            - Sauvignon Blanc's aromatic profile establishes that seasonal rain and harvest storms cannot alter fruit health in Südsteiermark
            - A Styrian origin establishes dry harvest conditions at this hillside without rainfall or storm observations
            - Only eventual wine aroma can establish whether hail reached the vineyard
          correctIndex: 0
          explanation: The regional climate account identifies wetter southern and western Styria and possible fog, storms and hail. Plot and vintage records remain necessary.
          sourceCitationId: src_reg_ah_styria_climate
        ki_reg_ah_styria_microclimates:
          prompt: Two Südsteiermark Sauvignon Blanc plots lie in Kitzeck-Sausal and Gamlitz. What is the sound ripening comparison?
          options:
            - Assign both plots the same harvest date because the DAC name establishes equivalent exposure and maturity in Kitzeck-Sausal and Gamlitz
            - Compare each plot's exposure and measured maturity
            - Use altitude alone to declare the Gamlitz plot later ripening
            - Treat a sheltered Gamlitz basin and an exposed hill as one mesoclimate
          correctIndex: 1
          explanation: The regional body distinguishes Kitzeck-Sausal's longer season and Gamlitz's sheltered basins, exposed hills and stream influence. Actual plot data decide the comparison.
          sourceCitationId: src_reg_ah_styria_sites
        ki_reg_de_saale_unstrut_sheltered_slopes:
          prompt: A Saale-Unstrut grower screens sites for spring frost risk. Which site feature is relevant?
          options:
            - Latitude alone makes ripening impossible in the region
            - Valley floors face less frost risk than slopes
            - Sheltered, south-facing valley slopes may create more favourable local conditions
            - Terracing removes the need for frost records
          correctIndex: 2
          explanation: The German Wine Institute describes severe winters and late-spring frost risk with sheltered southern slopes and locally warmer valleys. Exposure and local records still matter.
          sourceCitationId: src_reg_de_saale_unstrut
        ki_reg_de_sachsen_day_night:
          prompt: How should a student assess the ripening potential of a Sachsen Elbe terrace?
          options:
            - Predict the finished wine's quality from latitude alone
            - Assume terraces make daily temperatures uniform
            - Warm summer days settle terrace ripeness
            - Examine its exposure, weather and fruit in a continental setting with warm days and cool nights
          correctIndex: 3
          explanation: Sachsen's continental day-night contrast and terraced Elbe slopes provide context, not a fixed maturity or quality result.
          sourceCitationId: src_reg_de_sachsen
        ki_reg_fe_jura_chardonnay:
          prompt: A Jura Chardonnay is labelled without a maturation detail. What can be inferred before seeing the producer record?
          options:
            - Chardonnay can support varied fruit-led whites, but the grape does not disclose topping-up or sous-voile treatment
            - Chardonnay establishes sous-voile maturation
            - Adaptability proves every Chardonnay parcel gives the same ripeness
            - The grape name proves the wine is a Vin Jaune
          correctIndex: 0
          explanation: The Jura wine body describes adaptable Chardonnay and varied white expressions; the cellar route requires wine-specific evidence.
          sourceCitationId: src_reg_fe_jura_grapes
        ki_reg_fe_jura_exposure:
          prompt: Two Jura parcels share a regional climate label but differ in slope and aspect. What should the site comparison emphasise?
          options:
            - The shared regional climate gives both parcels the same ripening conditions
            - Compare relief, exposure and altitude by parcel
            - A limestone label determines the finished wine's mineral flavour
            - South-facing aspect removes all vintage weather differences
          correctIndex: 1
          explanation: Jura relief, exposure, altitude and slope create local contrasts. The broad climate or soil name alone is insufficient.
          sourceCitationId: src_reg_fe_jura_sites
        ki_reg_fe_jura_savagnin:
          prompt: A buyer finds a Jura Savagnin white but no cellar record. Which description stays within the evidence?
          options:
            - Savagnin confirms sous-voile maturation
            - The grape name confirms a topped-up wine
            - Savagnin ripens slowly and can be made topped-up or sous voile; check this bottling's production
            - Sous-voile maturation is required for every Jura white
          correctIndex: 2
          explanation: The Jura grape profile describes slow-ripening Savagnin and both topped-up and sous-voile expressions. The actual wine's route needs confirmation.
          sourceCitationId: src_reg_fe_jura_grapes
        ki_reg_fe_jura_season:
          prompt: A grower compares a wet Jura spring with a warm summer. Which planning inference is justified?
          options:
            - Spring rain predicts a dry harvest in the same parcels without checking the rest of the season
            - Seasonal climate labels replace plot records
            - Warm summer conditions mean every site ripens on the same date
            - Seasonal contrasts inform monitoring, while this vintage's plot weather and fruit still decide actions
          correctIndex: 3
          explanation: The Jura regional account describes often rainy springs and generally warm, dry summers. A specific vineyard requires current evidence.
          sourceCitationId: src_reg_fe_jura_sites
        ki_reg_gr_amyndeon_lakes:
          prompt: An Amyndeon Xinomavro plot is compared with a lower Naoussa slope. Which variables merit joint review?
          options:
            - Review elevation, lake influence and site records
            - Their shared northern Greek origin establishes equivalent growing temperatures and fruit maturity regardless of plateau height or lake proximity
            - Elevation alone, because lakes cannot affect the local setting
            - The finished wine's tannin alone, because it measures vineyard temperature
          correctIndex: 0
          explanation: Research describes Amyndeon's elevated plateau and adjacent lakes. Their influence must be considered with site and vintage records.
          sourceCitationId: src_reg_gr_north_research
        ki_reg_gr_crete_northern_influence:
          prompt: A tasting group calls every Cretan vineyard uniformly hot. What is the best correction?
          options:
            - Northern Cretan vineyards occupy the same low coastal altitude, so sea breezes and mountain mesoclimates cannot produce site variation
            - Northern maritime breezes, shelter from southern winds and mountain mesoclimates can vary site conditions
            - Altitude and aspect have no role on Mediterranean islands
            - Sea proximity fixes acidity in every Cretan wine
          correctIndex: 1
          explanation: The regional accounts describe northern exposure to maritime breezes and varied altitude, aspect and cooler mountain sites; parcel evidence remains essential.
          sourceCitationId: src_reg_gr_liatiko
        ki_reg_gr_north_soil_textures:
          prompt: A study compares sandy-loamy Amyndeon and heavier-textured Naoussa Xinomavro parcels. What can the soil evidence support?
          options:
            - Soil texture alone fixes Xinomavro flavour
            - One invariant regional style across all parcels
            - A hypothesis about rooting and water supply to test alongside climate, elevation and cellar records
            - A quality ranking without tasting or vineyard data
          correctIndex: 2
          explanation: The GiESCO comparison identifies broad soil-texture differences, not an isolated causal effect on flavour or a regional quality rank.
          sourceCitationId: src_reg_gr_north_research
        ki_reg_gr_robola_slope_context:
          prompt: A Cefalonian Robola buyer sees vineyards around Omala and Mount Aenos. Which geographic note is useful?
          options:
            - Limestone on Aenos slopes transmits a single mineral flavour to finished wine independent of producer handling
            - Cefalonia's island location renders elevation, slope and marine exposure too similar to distinguish parcels around Mount Aenos
            - Every Robola vineyard has identical maritime exposure
            - Aenos slopes vary in elevation, marine influence and mesoclimate, so compare actual parcels
          correctIndex: 3
          explanation: The cooperative describes slopes, elevation, marine influence and varied mesoclimates in the Robola zone; site checks prevent a uniform-island assumption.
          sourceCitationId: src_reg_gr_robola_sites
        ki_reg_inc_alto_adige_air:
          prompt: Why is Alpine location alone an incomplete Alto Adige climate description?
          options:
            - Alpine shelter and warmer southern air both matter
            - Alpine shelter excludes warmer southern air from the valleys, so regional conditions follow from mountain location alone
            - Southern air proves every valley has the same temperature
            - Mountain altitude fixes each vineyard's harvest date
          correctIndex: 0
          explanation: The Alto Adige regional account describes both Alpine shelter and warmer air arriving from the south.
          sourceCitationId: src_reg_inc_alto_adige
        ki_reg_inc_bolgheri_breeze:
          prompt: A Bolgheri parcel is compared with an inland Tuscan parcel. What coastal factor deserves attention?
          options:
            - Bolgheri's seaside location establishes higher finished-wine quality than inland Tuscany without controlling vineyard or vintage
            - Tyrrhenian breezes cool and ventilate Bolgheri vines
            - Breezes establish an exact acidity level without fruit testing
            - Inland Tuscany receives the same coastal ventilation at every site
          correctIndex: 1
          explanation: Bolgheri's Tyrrhenian position brings cooling, ventilating sea breezes; no fixed wine outcome follows from that fact alone.
          sourceCitationId: src_reg_inc_bolgheri
        ki_reg_inc_bolgheri_soils:
          prompt: A merchant labels every Bolgheri vineyard with one soil type. Which correction follows the regional zonation?
          options:
            - Marine origin is absent from the region
            - Marine or alluvial soil origin directly specifies each cuvée's aroma without checking grapes, cellar work or vintage
            - Marine and alluvial origins vary by parcel
            - Diverse soils prove all producers use the same grape blend
          correctIndex: 2
          explanation: The Bolgheri consortium describes marine and alluvial origins and small-scale variation; grape choice and style require producer evidence.
          sourceCitationId: src_reg_inc_bolgheri
        ki_reg_inc_dolcetto_dry:
          prompt: A guest asks whether Dolcetto must be a sweet red. Which reply is grounded?
          options:
            - The grape name indicates residual sugar in this bottling without consulting its label or analysis
            - Dolcetto's modest acidity prevents structured dry expressions, so its name specifies a youthful sweet style for each producer
            - Only oak-aged Dolcetto is legally dry
            - Dolcetto is commonly dry; structure varies with site
          correctIndex: 3
          explanation: The Piedmont consortium describes dry Dolcetto, modest acidity and variation with growing site and winemaking.
          sourceCitationId: src_reg_inc_dolcetto
        ki_reg_inc_friuli_ponca:
          prompt: What can a Friuli Colli Orientali vineyard map of marl, sandstone and terraces support?
          options:
            - A terrain and vineyard-work comparison, without assigning a mineral flavour directly from the rock
            - Sandstone and marl names identify a unique mineral aroma for each mapped parcel regardless of vine water supply or production
            - Terraces remove the practical need for slope-management work in these marl and sandstone vineyards
            - The same depth and water supply for every hillside
          correctIndex: 0
          explanation: The consortium describes alternating marl and sandstone and grower-shaped terraces. Geology alone does not establish sensory transfer.
          sourceCitationId: src_reg_inc_friuli
        ki_reg_inc_friuli_position:
          prompt: What regional position should a Colli Orientali grower consider before comparing two sites?
          options:
            - The Adriatic is too remote to affect ventilation at a Colli Orientali site, leaving the Julian Alps as its sole airflow context
            - Julian Alpine shelter and Adriatic ventilation
            - The Julian Alps produce identical cold-air movement in the two plots despite distinct local exposures
            - Both sites must share one mesoclimate because they are within the DOC
          correctIndex: 1
          explanation: The regional body describes Alpine shelter and Adriatic-facing ventilation as broad context, not a uniform plot condition.
          sourceCitationId: src_reg_inc_friuli
        ki_reg_inc_matelica_inland:
          prompt: How should a Verdicchio comparison distinguish Matelica from Castelli di Jesi?
          options:
            - Matelica is the sea-influenced counterpart while Castelli di Jesi is an inland mountain site, fixing each bottle's profile
            - The two origins imply identical weather in each vintage
            - Matelica has a more inland mountain setting; Jesi is more sea-influenced, with wine-specific evidence still needed
            - Matelica origin alone proves a higher quality wine
          correctIndex: 2
          explanation: The regional account contrasts inland mountain Matelica with more maritime Jesi; it does not rank all wines.
          sourceCitationId: src_reg_inc_verdicchio
        ki_reg_inc_orvieto_grapes:
          prompt: A learner describes Orvieto as a single-variety wine. Which regional blend note is supported?
          options:
            - Grechetto is excluded from Orvieto whites
            - Procanico is the sole grape in each Orvieto white, so Grechetto is an optional flavour rather than a blend component
            - Every Orvieto uses one fixed blend percentage
            - Procanico and Grechetto are central white grapes, with other varieties possible in actual blends
          correctIndex: 3
          explanation: The Orvieto consortium names Procanico and Grechetto as central components with other whites; a given recipe needs producer records.
          sourceCitationId: src_reg_inc_orvieto
        ki_reg_inc_orvieto_sweetness:
          prompt: A restaurant orders Orvieto for a strictly dry slot. What should its buyer verify?
          options:
            - The actual cuvée's sweetness, because Orvieto also includes sweeter styles and special expressions
            - Nothing, because the origin name certifies a dry finish
            - Its Procanico and Grechetto proportions, which alone fix residual sugar regardless of fermentation or special expression
            - The bottle colour, which identifies a noble-rot wine
          correctIndex: 0
          explanation: Orvieto includes secco through dolce styles plus late-harvest and noble-rot expressions; the particular bottle's style must be checked.
          sourceCitationId: src_reg_inc_orvieto
        ki_reg_inc_rosso_youth:
          prompt: A buyer contrasts Brunello and Rosso di Montalcino from Sangiovese. Which broad Rosso expectation is sound?
          options:
            - Rosso's earlier-drinking position establishes lower quality than Brunello regardless of producer or vintage
            - Rosso commonly emphasises fruit and earlier drinking, while particular wines may be more structured
            - Rosso's earlier-drinking description requires consumption immediately after release, even for structured examples
            - The shared grape makes all maturation choices identical
          correctIndex: 1
          explanation: The Montalcino body presents Rosso as generally fresher and suited to younger drinking, with producer and vintage variation.
          sourceCitationId: src_reg_inc_montalcino
        ki_reg_oa_adelaide_m3_sources:
          prompt: Which sourcing set does Shaw + Smith document for its 2025 M3 Chardonnay?
          options:
            - Only Lenswood fruit; the producer record excludes Piccadilly, Lobethal and all selected growers
            - Piccadilly vineyard fruit alone
            - Lenswood, Piccadilly and Lobethal fruit, supplemented by selected growers
            - Lobethal and selected growers, with no other vineyard sources
          correctIndex: 2
          explanation: Shaw + Smith's 2025 M3 record identifies Lenswood, Piccadilly and Lobethal fruit supplemented by selected growers. The sourcing record therefore describes several contributing sites and growers.
          sourceCitationId: src_reg_oa_m3
        ki_reg_sa_itata_grapes:
          prompt: A regional guide lists País, Moscatel de Alejandría and Cinsault for Itata. What can that list establish?
          options:
            - The currently authorised planting share of each variety in every Itata vineyard
            - A ban on any grape that the guide omits
            - A uniform obligation to use those three varieties in every Itata wine, regardless of appellation rules or wine category
            - Selected regional grape associations; an exhaustive legal planting list needs other evidence
          correctIndex: 3
          explanation: The regional account documents selected traditional associations and Cinsault. It does not supply an exhaustive current list of legally permitted grape varieties.
          sourceCitationId: src_reg_am_chile
