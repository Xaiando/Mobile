        ],
        "scenario_prompts": {
          "n_d12depth_case_market": "Fictional wine market: opening stock 500 hL, new output 100 hL, domestic releases 120 hL; assume no trade or loss. Retail buyers report weaker purchasing power and altered preferences, but the size of demand change and inventories elsewhere are unknown. A supplier predicts a fixed 20% price rise from the smaller harvest. Compare stock and price evidence. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence.",
          "n_d12depth_case_cost": "Fictional winery sells at EUR10 per bottle with EUR6 variable cost and EUR12,000 fixed annual cost within capacity up to 4,000 bottles. It plans 3,500 bottles and a EUR20,000 equipment purchase; half customer payments arrive next period. A delayed lot incurs EUR0.50 extra variable storage per bottle. Compare base contribution, cost sensitivity, profit assumptions and funding. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence.",
          "n_d12depth_case_landed": "Fictional exporter compares one commissioned Scotland quote and another market with unknown current duty, trade restrictions, label and support eligibility. For the import budget, wine EUR1,000, freight EUR200, duty EUR100 and fully later-recoverable tax EUR260 are explicitly stipulated. A colleague treats a retail floor, customs duty and a conditional grant as interchangeable guaranteed producer income. Explain cost, funding and distinct legal mechanisms without deciding eligibility. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence.",
          "n_d12depth_case_fx": "Fictional exporter expects EUR1,000. A committed forward pays home-currency 850, an option floors conversion at 850 with premium 20, and spot conversion could be 800 or 900. Customer payment may be late. The winery also owes EUR400 on the expected receipt date. Quotes ignore all other fees. Compare matching, downside and upside outcomes without recommending speculation. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence.",
          "n_d12depth_case_cash": "Fictional cellar starts with EUR5,000, pays EUR6,000 on day10 and EUR3,000 on day20, and expects EUR8,000 on day30. An extra EUR1,000 recoverable-tax payment is due day15 and recovery is day45. No other flows exist. Buyer payment may slip to day50. Calculate peak funding and discuss a stock-release or finance response without treating recoverable tax as permanent cost. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence.",
          "n_d12depth_case_models": "Fictional grower can sell fruit immediately; a grower-producer can invest EUR80,000 in equipment; a merchant can buy bulk wine; a virtual brand can commission a custom facility for EUR3/bottle excluding marketing. A cooperative pools processing and marketing with member decisions; a larger group proposes shared purchasing but separate brand budgets. Compare capital, sourcing, control and commercial duties for these models. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence.",
          "n_d12depth_case_channels": "Fictional options: full-service partner pays EUR8/bottle on 500 bottles after60days; broker charges EUR400 plus EUR1 per sold bottle while a separately paid service importer handles stock; a JV pools promotion at shared cost; a direct-seller order offers EUR7 prepaid but requires a clearing route. Full costs and buyer demand are incomplete. A 500-bottle shipment has only 100 documented downstream sales. Compare roles, timing and evidence. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence.",
          "n_d12depth_case_outlets": "Fictional winery compares DTC receipt EUR20, wine cost EUR8, fulfilment EUR4 and acquisition/service EUR6 per bottle with wholesale receipt EUR10, wine cost EUR8 and service EUR1. It also tests EUR8 DTC acquisition/service. Cellar-door/events need staff time; clubs need retention and records; online/hybrid needs fulfilment. Specialist bars and fine-dining accounts request training, while convenience and casual outlets propose quick-repeat formats. Travel and investment buyers request different stock/provenance conditions. No route has validated demand. Compare two feasible pilots and a full-cost sensitivity. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence.",
          "n_d12depth_case_marketing": "Fictional wine brand targets restaurant buyers as a business segment, based only on existing club gift-carton responses. A EUR2,000 budget could fund target-buyer tastings, sales training, sample formats or broad advertising. Competitor prices are dated; current staffing covers only ten accounts a week. Set a target, positioning and coordinated plan without assuming every restaurant shares club preferences. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence.",
          "n_d12depth_case_campaign": "Fictional A adds100 orders with EUR8 contribution each and EUR600 promotion cost; B adds80 with EUR10 each and EUR300 promotion cost. Counts are stated as incremental against a matched baseline, and costs include fulfillment/service except later returns. A has more impressions; repeat and returns data are pending. Compare net contribution, discount sensitivity and a review decision. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence."
        },
