# Original self-checked cases; each full prompt equals its subject node name.
question_templates:
  - id: qt_reg_cn_case_ningxia_training_budget
    relation_type: CASE_ACTION
    direction: forward
    mode: short_answer
    variant: reg_cn_ningxia_training_budget
    prompt_template: A Ningxia grower is planning a new Cabernet Gernischt block that will need winter protection.
      A contractor offers a conventional vertical system and a low slant-trunk system intended to make
      mechanical soil burial easier. The slant system has a higher quoted establishment cost and a projected
      annual handling saving; both installation quotes fit available funds, but the saving has not been
      demonstrated on this site. Existing blocks have recorded winter bending damage and high handling hours.
      The grower can establish a small comparison, record work and canopy development, monitor winter
      conditions and inspect buds in spring. Neither option guarantees survival. Propose an action, explain a
      reason, weigh a tradeoff and state a limitation before committing the entire block.
    parameters:
      scope_node_ids:
        - n_reg_cn_case_ningxia_training_budget
      key_points:
        CASE_ACTION: Defensible action
        CASE_REASON: Mechanism and rationale
        CASE_TRADEOFF: Tradeoff
        CASE_LIMITATION: Limitation or evidence needed
  - id: qt_reg_cn_case_shandong_water_budget
    relation_type: CASE_ACTION
    direction: forward
    mode: short_answer
    variant: reg_cn_shandong_water_budget
    prompt_template: A hypothetical Shandong terraced winery has recorded storm runoff damaging vineyard paths and
      two later dry seasons requiring supplementary vine water. An engineer confirms that either a small
      retention pond or a larger pond can be built and supplies itemised capital and maintenance quotes; both
      installation costs fit current funds. Catchment inflow, storage losses and future seasonal vine demand
      still need assessment, and neither quote is in the operating cash-flow forecast. The larger pond uses
      space currently available for vineyard access. The manager claims monsoon rain makes later irrigation
      unnecessary and that the larger pond must be more profitable. Propose an action, explain a reason, weigh
      a tradeoff and state a limitation.
    parameters:
      scope_node_ids:
        - n_reg_cn_case_shandong_water_budget
      key_points:
        CASE_ACTION: Defensible action
        CASE_REASON: Mechanism and rationale
        CASE_TRADEOFF: Tradeoff
        CASE_LIMITATION: Limitation or evidence needed
  - id: qt_reg_cn_case_xinjiang_shade_style
    relation_type: CASE_ACTION
    direction: forward
    mode: short_answer
    variant: reg_cn_xinjiang_shade_style
    prompt_template: A Xinjiang Cabernet Sauvignon producer runs a one-vintage split-block trial with partial
      canopy shade and an unshaded control. Cultivar, vine age, crop preparation, irrigation and nutrition are
      matched. The shaded treatment ripens more slowly, has higher measured acidity and lower harvest weight.
      Matched dry, fault-free pilot wines are repeatedly tasted under blind codes; the shaded wine is judged
      fresher but less deeply coloured in these pilots. A buyer’s stated brief asks for fresher acidity with
      acceptable colour, but the buyer has not tasted the pilots. Full-scale yield costs and margins have not
      been calculated. The manager proposes shading every block because a cooler wine must be better. Propose
      an action, explain a reason, weigh a tradeoff and state a limitation.
    parameters:
      scope_node_ids:
        - n_reg_cn_case_xinjiang_shade_style
      key_points:
        CASE_ACTION: Defensible action
        CASE_REASON: Mechanism and rationale
        CASE_TRADEOFF: Tradeoff
        CASE_LIMITATION: Limitation or evidence needed
  - id: qt_reg_cn_case_yunnan_blend_evidence
    relation_type: CASE_ACTION
    direction: forward
    mode: short_answer
    variant: reg_cn_yunnan_blend_evidence
    prompt_template: A Yunnan mountain winery has two Cabernet Sauvignon lots from contrasting village parcels.
      The lots are dry and fault-free and used the same documented fermentation and maturation programme.
      Measured acidity and repeated blind tasting show Lot A has more body and Lot B more freshness. A coded
      pilot blend meets the winery’s stated balance target better than either lot alone. Both lots are
      available in sufficient quantity; blending capacity fits the budget. Separate parcel handling and manual
      harvest have higher recorded costs than consolidating operations, and no buyers have yet evaluated the
      blend or its proposed price. The manager says the highest parcel and highest labour cost guarantee a
      premium wine and that tasting proves village origin. Propose an action, explain a reason, weigh a
      tradeoff and state a limitation.
    parameters:
      scope_node_ids:
        - n_reg_cn_case_yunnan_blend_evidence
      key_points:
        CASE_ACTION: Defensible action
        CASE_REASON: Mechanism and rationale
        CASE_TRADEOFF: Tradeoff
        CASE_LIMITATION: Limitation or evidence needed
