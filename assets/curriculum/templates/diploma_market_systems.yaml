        ],
        "scenario_prompts": {
          "n_d2market_case_us_entry": "Hypothetical overseas winery: a partner proposes importing wine into the US, wholesaling in Texas and selling to restaurant retailers. It offers an 800-bottle launch paid 60 days after delivery. A second offer is a 200-bottle prepaid Texas pilot with producer-funded tastings and follow-up. A supplier bill is due in 30 days, but available cash, full costs and account demand are unknown. The first partner claims its federal permit makes the same route available in every state. All volumes, dates and offers are fictional. Compare the roles, recommend a conditional launch, explain the evidence, weigh a trade-off and identify what could change the decision. No actual transaction permission is supplied.",
          "n_d2market_case_ew_retail": "Hypothetical independent wine shop in England and Wales: its manager holds a personal licence. The shop proposes takeaway bottles and a small paid on-site tasting area, but nobody has checked premises authorisation, conditions or the operating schedule. Bottles for each activity come from the same sound stock. A tasting proposal adds quoted staff and seating costs; its demand and incremental revenue are unknown. A bottle-only proposal has fewer supplied operating tasks but no profit estimate. All commercial inputs are fictional. Recommend a conditional operating model, explain the licensing-role distinction, weigh the customer and resource trade-off, and identify missing evidence. Do not infer permission from the manager's licence alone.",
          "n_d2market_case_sweden_access": "Hypothetical overseas producer considering Sweden: one proposal uses a Swedish supplier to seek Systembolaget access; another targets restaurant accounts with producer tastings and follow-up. No listing, buyer demand, commercial prices, costs, supplier approval or venue permissions have been supplied. A colleague proposes direct unrestricted consumer sales because farm sales were introduced in 2025. The producer has no Swedish production or visit arrangements in this case. All business proposals are fictional. Recommend a conditional route investigation, explain the retail, supplier and serving distinction, weigh the trade-off in access and workload, and identify what still needs checking. Do not decide individual eligibility from the news."
        },
        "distractors": {
          "n_d2market_case_us_entry": [
            {
              "summary": "Accept nationwide access because the federal permit settles every destination's retail rules.",
              "explanation": "Federal permitting does not establish all state or local channel permissions."
            },
            {
              "summary": "Spend the 60-day receipt on the bill due in 30 days without checking cash.",
              "explanation": "The later assumed receipt cannot itself pay the earlier bill; other liquidity has not been supplied."
            }
          ],
          "n_d2market_case_ew_retail": [
            {
              "summary": "Open both activities because the manager's personal licence covers all premises uses.",
              "explanation": "An individual's licence does not itself establish the premises' authorised activities or conditions."
            },
            {
              "summary": "Choose tastings because adding customer engagement proves higher net profit.",
              "explanation": "Demand and incremental revenue are missing; additional costs alone do not establish profit."
            }
          ],
          "n_d2market_case_sweden_access": [
            {
              "summary": "Use unrestricted direct retail because the farm-sales change abolished every restriction.",
              "explanation": "The change provides a restricted permit and visit framework, not blanket permission."
            },
            {
              "summary": "Treat the supplier's relationship with Systembolaget as proof that every restaurant may serve the wine.",
              "explanation": "The operator's supplier model does not establish the restaurant's serving permissions."
            }
          ]
        }
      }
