question_templates:
- id: qt_wset_l1_authored_service_observation
  relation_type: PRINCIPLE_EXPLANATION
  direction: forward
  mode: authored_choice
  variant: l1_service_observation
  prompt_template: '{subject.name}'
  parameters:
    item_choices:
      ki_wset_srv_bottle_identity:
        prompt: Before opening a selected bottle at the table, what should the server confirm with the guest?
        options:
        - Only the bottle's weight
        - The producer and vintage shown on the bottle
        - Only the glass shape
        - The guest's preferred corkscrew brand
        correctIndex: 1
        explanation: The Court of Master Sommeliers service standard calls for presenting the label and reconfirming
          the wine's producer and vintage before opening.
        sourceCitationId: src_wset_srv_cms
      ki_wset_srv_foil:
        prompt: Where should the foil be cut when opening a cork-closed still wine?
        options:
        - Around the neck just above the top lip
        - Around the neck below the second lip
        - Across the capsule at the bottle shoulder
        - Across the capsule beside the cork top
        correctIndex: 1
        explanation: Court of Master Sommeliers service standards direct cutting below the second lip, then
          removing the foil and wiping the cork top.
        sourceCitationId: src_wset_srv_cms
      ki_wset_srv_glass_clean:
        prompt: What should be checked before placing wine glasses for guests?
        options:
        - That each glass is clean and free from odour
        - That every glass contains a scented polish
        - That fingerprints are visible on the bowl
        - That the wine label matches the glass maker
        correctIndex: 0
        explanation: The CMS service standard specifies clean, odour-free glassware so the wine is not distorted
          by residues or smells.
        sourceCitationId: src_wset_srv_cms
      ki_wset_srv_light_red_temperature:
        prompt: Using WSET Level 1's service-temperature descriptions, how should a light-bodied red wine
          be served?
        options:
        - Lightly chilled
        - Well chilled
        - Room temperature
        - Chilled
        correctIndex: 0
        explanation: WSET calls light-bodied red service lightly chilled; the CMS service table places a light
          red such as Gamay around 10–13°C.
        sourceCitationId: src_wset_srv_cms
      ki_wset_srv_light_white_temperature:
        prompt: Using WSET Level 1's service-temperature descriptions, how should a light-bodied white or
          rosé wine be served?
        options:
        - Room temperature
        - Well chilled
        - Chilled
        - Lightly chilled
        correctIndex: 2
        explanation: WSET calls light- and medium-bodied whites and rosés chilled; the CMS service table gives
          around 7–10°C for light white and rosé wine.
        sourceCitationId: src_wset_srv_cms
      ki_wset_srv_storage_provenance:
        prompt: Which set best checks an older bottle's prior care and present condition?
        options:
        - Storage history, leakage and fill level
        - Bottle shape, glass weight and foil colour
        - Producer name, grape variety and retail price
        - Capsule design, label art and cork brand
        correctIndex: 0
        explanation: Court of Master Sommeliers standards say to ask how older bottles were stored and inspect
          leakage and ullage.
        sourceCitationId: src_wset_srv_cms
      ki_wset_srv_sweet_temperature:
        prompt: Using WSET Level 1's service-temperature descriptions, how should a sweet white wine be served?
        options:
        - Chilled
        - Lightly chilled
        - Room temperature
        - Well chilled
        correctIndex: 3
        explanation: WSET calls sweet wines well chilled; the CMS service table gives around 6–8°C for sweet
          white wine.
        sourceCitationId: src_wset_srv_cms
      ki_wset_srv_cork_fragile:
        prompt: An old natural cork seems fragile. Which tool can help lift it gently?
        options:
        - A foil knife pressed through the cork
        - A standard spiral driven quickly through the cork
        - A bottle capper used as a lever
        - A two-prong Ah-So opener placed beside the cork
        correctIndex: 3
        explanation: WSET describes the Ah-So's two prongs sliding between cork and neck to extract a delicate
          older cork.
        sourceCitationId: src_wset_srv_tools
      ki_wset_srv_food_acid_soft:
        prompt: A tomato-rich dish has noticeable acidity. How may it affect the acidity of a wine tasted
          with it?
        options:
        - It chemically removes all acids from the wine
        - It can make the wine seem less acidic
        - It guarantees the wine tastes sweeter than dessert wine
        - It has no possible effect on wine perception
        correctIndex: 1
        explanation: WSET notes that acidic foods can reduce the perceived acidity of wine; a low-acid wine
          may then seem flat.
        sourceCitationId: src_wset_srv_sweet
      ki_wset_srv_food_sweet_choice:
        prompt: For a sweet dessert, which wine choice often helps keep the pairing balanced?
        options:
        - A much drier wine regardless of the dessert
        - The most tannic red available
        - A wine at least as sweet as the dessert
        - Any wine served much warmer than usual
        correctIndex: 2
        explanation: Sweet food can make wine seem drier, so WSET's introductory pairing advice favours a
          sweeter wine with dessert.
        sourceCitationId: src_wset_srv_sweet
      ki_wset_srv_food_chilli_alcohol:
        prompt: Which wine component should be reduced to avoid adding warmth to a chilli dish?
        options:
        - Alcohol strength
        - Acidity level
        - Residual sugar
        - Tannin intensity
        correctIndex: 0
        explanation: WSET explains that hot spice intensifies the perception of alcohol, so lower-alcohol
          drinks can avoid amplifying the burn.
        sourceCitationId: src_wset_srv_spice
      ki_wset_srv_food_chilli_sweet:
        prompt: How can a touch of sweetness in wine affect the heat of a chilli dish?
        options:
        - It raises the wine's tannin content
        - It makes the chilli chemically disappear
        - It necessarily increases the burn
        - It can soften the perceived heat
        correctIndex: 3
        explanation: WSET notes that some residual sweetness can calm the perceived intensity of chilli heat.
        sourceCitationId: src_wset_srv_spice
      ki_wset_srv_food_chilli_tannin:
        prompt: For a very hot chilli dish, which tannin level may feel more comfortable?
        options:
        - The strongest tannin available, because spice always softens it
        - Lower tannin, because hot spice can make tannins feel harsher
        - Tannin level is irrelevant to any spicy pairing
        - A red wine whose tannins have been replaced by sugar
        correctIndex: 1
        explanation: WSET warns that tannins can feel harsh with hot spice and suggests lower-tannin drinks
          in that context.
        sourceCitationId: src_wset_srv_spice
      ki_wset_srv_food_umami_choice:
        prompt: A dish has pronounced umami. Which approach is a reasonable starting point when choosing a red wine?
        options:
        - Lower tannin and enough fruit, with acidity and salt checked in the pairing
        - Lower tannin and enough fruit, with acidity and salt ignored in the pairing
        - Higher tannin and enough fruit, with acidity and salt checked in the pairing
        - Lower tannin and little fruit, with acidity and salt checked in the pairing
        correctIndex: 0
        explanation: With pronounced umami, consider lower tannin and sufficient fruit intensity, then check
          acidity, salt and the actual match rather than assuming a fixed acidity rule.
        sourceCitationId: src_wset_srv_umami
      ki_wset_srv_food_intensity_match:
        prompt: A dish has strong seasoning and sauce. What wine characteristic helps it remain noticeable?
        options:
        - Enough flavour intensity to stand beside the dish
        - The weakest possible aroma regardless of preference
        - A low fill level in the bottle
        - A guarantee that the wine and food are the same colour
        correctIndex: 0
        explanation: WSET notes that strongly flavoured food can overwhelm delicate wine, so consider wine
          intensity alongside the dish.
        sourceCitationId: src_wset_srv_umami
      ki_wset_srv_storage_closure:
        prompt: For longer storage, how may a conventional natural-cork bottle be positioned?
        options:
        - Always upside down with the neck submerged in water
        - On its side so the cork stays in contact with wine
        - Upright only because every cork must dry out
        - Directly in sunlight to strengthen the cork
        correctIndex: 1
        explanation: WSET advises side storage for cork-closed bottles to keep corks moist; screwcap bottles
          can stand upright.
        sourceCitationId: src_wset_srv_temperature
      ki_wset_srv_temp_masking:
        prompt: Why allow a very cold white wine to warm slightly before judging it?
        options:
        - Cold always increases its actual sugar
        - Warming creates new grape aromas from nothing
        - Over-chilling can mask flavours
        - Its colour cannot be seen below 6°C
        correctIndex: 2
        explanation: WSET cautions that temperatures below about 6°C can mask flavour in white, rosé and sparkling
          wines.
        sourceCitationId: src_wset_srv_temperature
      ki_wset_srv_spark_chill:
        prompt: What is sensible preparation before opening a bottle of Champagne?
        options:
        - Shake it to loosen the cork
        - Warm it beside a radiator
        - Point the cork toward guests to show the label
        - Chill it and avoid shaking it
        correctIndex: 3
        explanation: Comité Champagne calls for serving Champagne chilled and warns that a shaken bottle's
          pressure can launch the cork.
        sourceCitationId: src_wset_srv_champagne
      ki_wset_srv_spark_rotate:
        prompt: Once the wire cage is loosened on Champagne, what is a controlled opening motion?
        options:
        - Hold the cork firmly and gently rotate the bottle
        - Let go of the cork and pull the bottle straight down
        - Shake until the cork flies out
        - Use a still-wine corkscrew through the cork
        correctIndex: 0
        explanation: Comité Champagne instructs the server to restrain the cork while gently rotating the
          bottle and easing the cork out.
        sourceCitationId: src_wset_srv_champagne
      ki_wset_found_colour:
        prompt: If a wine is described as white, rosé or red, what is being described?
        options:
        - Its exact sugar level
        - Its colour family
        - Its guaranteed age
        - Whether it is sparkling
        correctIndex: 1
        explanation: WSET uses white, rosé and red as colour categories; sweetness and bubbles are separate
          style features.
        sourceCitationId: src_wset_found_wset_styles
      ki_wset_found_other_aromas:
        prompt: Besides fruit and oak, which kind of note may appear in a wine description?
        options:
        - Only the bottle's glass type
        - Only its retail price
        - Floral or herbal impressions
        - Only the length of its cork
        correctIndex: 2
        explanation: Wine Australia's introductory guide includes floral and herbal wine descriptors alongside
          fruit and oak examples.
        sourceCitationId: src_wset_found_wa_intro
      ki_wset_taste_acidity:
        prompt: Which sensation tests acidity more directly than a citrus aroma?
        options:
        - Mouthwatering after tasting
        - Drying grip after tasting
        - A warming sensation after tasting
        - Sweetness after tasting
        correctIndex: 0
        explanation: WSET describes salivation as direct sensory evidence of acidity; a fruit aroma alone
          does not establish it.
        sourceCitationId: src_wset_found_wset_acid
      ki_wset_taste_aroma_observe:
        prompt: Which beginner tasting-note approach is sound when smelling a wine?
        options:
        - Describe familiar aromas actually perceived in the glass
        - Copy a producer's aroma list without smelling
        - Name a grape from one smell with certainty
        - Assume every wine must show the same spice notes
        correctIndex: 0
        explanation: WSET recommends building aroma recognition from familiar smells and noting what the individual
          taster perceives.
        sourceCitationId: src_wset_taste_intro
      ki_wset_taste_conditions_glass:
        prompt: Which setup helps reduce interference in a practice tasting?
        options:
        - A perfumed glass under strongly coloured lighting
        - A clean, odour-free glass in neutral light
        - A glass with detergent residue beside strong cooking smells
        - An opaque glass with no chance to inspect appearance
        correctIndex: 1
        explanation: The OIV sensory-analysis guide calls for neutral-coloured surroundings and glasses checked
          for odours before use.
        sourceCitationId: src_srv_oiv_sensory
