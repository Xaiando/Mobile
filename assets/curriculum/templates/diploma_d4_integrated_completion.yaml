        "scenario_prompts": {
          "n_d456_case_champagne_stock": "Original fictional Champagne planning exercise. Grower fruit contracted from two sites arrives after different ripening rates; the early-picked lot has higher measured acidity. A house's brief is a consistent, fresh non-vintage blend, not a single-vintage claim. Separate first and later press fractions have coded trial notes; a reserve blend meets the brief better than this year's unblended lot. Its usable yield is 8% lower and storage space is limited. A merchant offers payment after 60 days; cellar-door orders are prepaid but require producer delivery. These figures, findings and offers are invented. No complete costing, credit check or certification evidence is supplied. Recommend a conditional vineyard/press/blend and sales plan, explaining sensory evidence, cost and uncertainty.",
          "n_d456_case_cremant_loire": "Original fictional comparison of Crémant d'Alsace, Crémant de Bourgogne, Crémant de Loire, Saumur and Vouvray. Supplier dossiers identify the actual grape blends, whole-bunch handling, parcel harvest dates, acidity, malolactic choices, reserve use and bottle-fermentation records. A fresh aperitif brief and a fuller food-pairing brief are separate. A coded tasting favours an Alsace lot for the first and a Chenin-led Vouvray lot for the second; Bourgogne, Loire and Saumur alternatives cost less but their samples have not arrived. All supplier findings, price rankings and preferences are fictional, not regional rankings. Two suppliers require larger minimum orders and later delivery. Design a comparison and conditional purchase decision without assuming that appellation establishes taste or margin.",
          "n_d456_case_prosecco_supply": "Original fictional Prosecco comparison. An accessible plain-site Glera lot has mechanised-harvest access and quick cellar transport; a named hillside supplier quotes more hand labour. Trial tank-fermented A fits a fresh-fruit launch in six weeks, while the hillside B proposal needs ten weeks and has no sample. The supplier proposes a Rive statement but has supplied no supporting records. A retailer requests a large discounted promotion with payment after 45 days; a specialist offers a small prepaid pilot. All site records, timings, offers and trial results are fictional. Neither actual permitted yields nor grape percentages are stated. Recommend a conditional production and market plan.",
          "n_d456_case_asti_aroma": "Original fictional aromatic sparkling exercise, not an authentic Asti or Moscato d'Asti tasting. A supplier describes chilled aromatic Muscat must with fermentation stopped to preserve sweetness; the confirmed sample is sweet, aromatic and low in alcohol. Another supplier's traditional-method dry blend has more developed lees notes. A buyer asks for a sweet aromatic aperitif, while a restaurant asks for a dry savoury pairing. Must-storage cost, filtration/stability records and package pressure are missing. An advertising draft treats Asti and Moscato d'Asti as identical pressure and alcohol categories. All observations, requests and missing-record assumptions are fictional. Evaluate the two separate briefs and the unsupported category claim.",
          "n_d456_case_italian_bottle": "Original fictional Franciacorta and Trentodoc comparison. A Franciacorta supplier's parcel record shows moderate harvest acidity, while the Trentino mountain parcel records cooler nights and higher acidity that season. Both dossiers describe bottle fermentation; MLF use, base-wine oak and reserve proportions differ. The supplied panel finds one rounder and the other sharper, but fruit source and cellar methods also differ. The buyer wants freshness with some developed complexity at a fixed landed budget. One quoted older release ties up twice the buyer's stock budget and arrives too late for the first launch. All observations, times and amounts are hypothetical, not appellation-wide claims.",
          "n_d456_case_lambrusco_pairing": "Original fictional Lambrusco comparison. Sorbara, Salamino and Grasparossa supplier records identify grape, plain or foothill source, harvest date, extraction and residual sweetness; the buyer cannot use 'Lambrusco' as a sweetness test. Coded A is pale, dry and fresh; B is darker, more tannic and dry; C is sweeter. The supplied panel prefers A for a light lunch and B for a richer dish. A cellar proposal increases maceration for A without a new trial, while a promotion proposes C for all guests because it has the lowest unit price. All observations, site details and offers are invented and do not establish universal styles.",
          "n_d456_case_cava_water": "Original fictional Cava vineyard and release exercise. A grower dossier records a dry season, water stress in Xarel-lo and variable disease pressure in a second parcel. Supplier A has complete organic certification and traceability records; supplier B only supplies a marketing claim. A preliminary base blend meets the acidity and structure brief, but the producer plans a longer-held category and cash is insufficient for the quoted storage bill. A merchant asks for a low-price early launch; a specialist offers a small later allocation. All agronomic records, costs, sample findings and offers are fictional. Current category compliance is to be independently checked; no new numeric ageing rule is supplied.",
          "n_d456_case_british_vintage": "Original fictional England and Wales harvest/stock planning exercise. Two Chardonnay/Pinot Noir growers supply weather, budburst and frost logs for their actual parcels; the English parcel lost 25% of expected fruit and the Welsh parcel did not. The planned sparkling blend needs sound acidic fruit; base-wine trials are promising but wet harvest weather is forecast. Emergency fruit offers differ in ripeness and traceability. A launch promise assumes last year's volume and a uniform British vintage. All loss, forecasts, offers and findings are invented. Propose a contingent harvest and release plan, accounting for quality checks, vineyard protection costs and customer communication.",
          "n_d456_case_us_site_method": "Original fictional California, Oregon and Washington comparison. Three Chardonnay/Pinot Noir base dossiers provide actual coastal cooling, Willamette seasonal rain and eastern Washington irrigation logs, respectively. Harvest acidity differs; trials also differ in MLF, oak and lees holding. A coded panel prefers California A for a fresh aperitif and Oregon B for a developed style; Washington C has no final sample. These are invented site-specific findings, not statewide rankings. A custom processor can bottle small lots for a fee; an estate facility has available equipment but insufficient storage for the full holding plan. Orders differ in price and payment delay. Compare the production and business options without inferring fermentation method from state origin.",
          "n_d456_case_chile_method": "Original fictional Chilean sparkling plan. A coastal Casablanca Chardonnay parcel's supplied log records slow ripening and sound acidic fruit; an inland lot's log shows riper fruit and less acidity. A tank trial gives the requested fresh-fruit profile and readiness in eight weeks. A bottle-fermented trial is intended for later lees development and cannot meet the same launch. The two lots also use different yeast and MLF choices, so this is not a controlled method trial. Export demand is a tentative enquiry with no deposit; domestic restaurant demand is confirmed for a smaller quantity. All findings, timings and demand are invented. Evaluate a contingent production allocation.",
          "n_d456_case_argentina_capacity": "Original fictional Argentine producer exercise. Mendoza Chardonnay/Pinot Noir parcels supply harvest sugar/acidity and irrigation records; another parcel offers later riper fruit for a different blend. A tested fresh tank-fermented blend is ready for a domestic launch. A larger bottle-fermented proposal needs additional storage and unresolved cash financing. A distributor cites the INV's 2023 dispatch report as proof of current demand for this producer's premium export lot. The report is historical; no current orders, prices or source-origin records are supplied. All parcel findings, production schedules and commercial offers are fictional. Compare the allocation and the claim, distinguishing measured past dispatch from current lot eligibility and demand.",
          "n_d456_case_australia_portfolio": "Original fictional Australian portfolio exercise. Supplier dossiers compare Adelaide Hills Chardonnay/Pinot Noir, a Victorian lot, a Tasmanian lot and a multi-region South Eastern Australia blend, with actual site, harvest, acidity and frost records. A separate Shiraz offer supplies ripe red-fruit and tannin notes. One documented transfer-method lot underwent bottle fermentation followed by bulk clarification; another underwent tank secondary fermentation. The coded panel fits the fresh white brief with A and a red-food slot with Shiraz. The longer-held Tasmanian proposal requires more capital than available. All supplied results, budgets and orders are invented. Choose a contingent portfolio and explain method, costs and quality limits.",
          "n_d456_case_nz_harvest_blend": "Original fictional New Zealand comparison. Marlborough, Hawke's Bay and Central Otago Chardonnay/Pinot Noir supplier dossiers provide their own season, water, crop and harvest records. Trial A is crisp and fruit-led; B is broader; C retains acidity but has less available volume after a supplied frost event. Different MLF, lees and dosage choices accompany the different sites. A separate aromatic-variety tank sample fits a short-term fresh-fruit slot. A buyer wants a consistent non-vintage style, a modest launch quantity and affordable stock holding. All findings, hazards, schedules and prices are hypothetical rather than universal regional descriptions. Evaluate source and blend choices.",
          "n_d456_case_cap_classique_route": "Original fictional Cap Classique buying and production exercise. Two Cape growers supply different Chardonnay/Pinot Noir and Chenin Blanc parcel records, with harvest acidity, water stress and bunch-health observations. Documented bottle-fermented A has the preferred balance in a coded panel; a longer-held B has no sample and costs more to hold. A's supplier is an association member. A restaurant programme requests training and small frequent deliveries; a supermarket proposes a large promotion with a discount and delayed payment. All parcel findings, preferences and offers are invented. Compare a conditional allocation and marketing plan without taking membership as certification of this wine's excellence."
