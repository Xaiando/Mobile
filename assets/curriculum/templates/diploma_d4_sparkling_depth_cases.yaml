  relation_type: CASE_ACTION
  direction: forward
  mode: short_answer
  variant: d4depth_cava_upgrade
  prompt_template: A Cava producer wants to launch a 2025-harvest Guarda Superior Reserva. Its base wine has good
    acidity and 18 months of cellar capacity, but some contracted vineyards are not certified organic. Recommend
    the next category and sourcing decision, explain why, give a tradeoff and name missing evidence.
