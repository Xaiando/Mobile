# Original, source-cited D4 practice. Expert review pending.
question_templates:
- id: qt_d4depth_case_champagne_house
  relation_type: CASE_ACTION
  direction: forward
  mode: short_answer
  variant: d4depth_champagne_house
  prompt_template: A Champagne house wants its non-vintage Brut to remain recognisable after a warm harvest. It
    has older reserve wines but limited cellar space; a sales team also wants more vintage-labelled stock immediately.
    Recommend a blending and release decision, explain why, give a commercial tradeoff and state what evidence is
    still missing.
  parameters:
    scope_node_ids:
    - n_d4depth_case_champagne_house
    key_points:
      CASE_ACTION: Defensible action
      CASE_REASON: Source-grounded rationale
      CASE_TRADEOFF: Resource or alternative cost
      CASE_LIMITATION: Missing evidence or uncertainty
