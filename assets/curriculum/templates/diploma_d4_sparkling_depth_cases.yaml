- id: qt_d4depth_case_british_frost
  relation_type: CASE_ACTION
  direction: forward
  mode: short_answer
  variant: d4depth_british_frost
  prompt_template: An English traditional-method producer needs to promise stable non-vintage supply for two years.
    Budburst is early and spring frost risk has increased; existing reserve stocks are modest. Recommend a production
    and sales commitment, explain why, give a tradeoff and state what remains unknown.
  parameters:
