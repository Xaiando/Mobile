      CASE_LIMITATION: Missing evidence or uncertainty
- id: qt_d4depth_case_rive_offer
  relation_type: CASE_ACTION
  direction: forward
  mode: short_answer
  variant: d4depth_rive_offer
  prompt_template: A restaurant compares a costly Conegliano Valdobbiadene Rive Extra Brut with a lower-priced broad
    Prosecco DOC Extra Dry for a fruit-led aperitif. The Rive offer provides named origin and hand-harvest documentation,
    but the team has tasted neither. Recommend a listing trial, explain the style and label rationale, give a tradeoff
    and identify missing evidence.
  parameters:
