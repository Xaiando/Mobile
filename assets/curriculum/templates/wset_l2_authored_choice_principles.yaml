# Cited WSET Level 2 principle practice.
question_templates:
  - id: qt_wset_l2_authored_principles
    relation_type: PRINCIPLE_EXPLANATION
    direction: forward
    mode: authored_choice
    variant: l2_viticulture_winemaking_service_tasting
    prompt_template: "{subject.name}"
    parameters:
      item_choices:
        ki_wset_found_pulp_sampling:
          prompt: "Which set of measurements gives a fuller harvest-ripeness picture than sugar alone?"
          options: ["Bottle pressure, cork length and glass tint", "Juice sugar, pH and titratable acidity, considered with fruit taste", "Only berry colour from one exposed bunch", "Only the calendar date of the previous harvest"]
          correctIndex: 1
          explanation: "University of Minnesota Extension recommends sugar, pH and titratable-acidity readings plus qualitative fruit assessment."
          sourceCitationId: src_wset_found_umn_ripeness
        ki_wset_found_water_roots:
          prompt: "What is a likely effect of severe shortage of available soil water in the vine root zone?"
          options: ["It guarantees better ripeness regardless of severity", "It immediately converts malic acid to lactic acid", "Vine growth can slow dramatically or nearly stop", "It makes irrigation unnecessary for young vines"]
          correctIndex: 2
          explanation: "New Mexico State University reports that insufficient root-zone moisture greatly reduces growth and heavy stress can nearly halt it."
          sourceCitationId: src_wset_found_nmsu_water
        ki_wset_found_vine_canopy:
          prompt: "Why should leaf exposure be balanced against fruit protection in a vine canopy?"
          options: ["All leaves should be stripped so fruit receives maximum sunlight", "Shading has no effect on sugar accumulation", "Fruit should be fully hidden from all light", "Leaves support photosynthesis, but excessive fruit exposure can cause sunburn"]
          correctIndex: 3
          explanation: "NMSU describes leaf carbohydrate production and the need to avoid overexposed, sunburned berries."
          sourceCitationId: src_wset_found_nmsu_phenology
        ki_wset_found_veraison:
          prompt: "Which change marks the start of veraison?"
          options: ["Berries soften and change colour as ripening begins", "Winter pruning of dormant canes", "The first opening of flowers", "The final removal of yeast lees from bottles"]
          correctIndex: 0
          explanation: "University of Minnesota Extension identifies colour change, berry softening and sugar accumulation at veraison."
          sourceCitationId: src_wset_found_umn_ripeness
        ki_wset_found_unripe:
          prompt: "Compared with a suitable harvest target, what may result from picking fruit too early?"
          options: ["Automatically higher sugar and lower acidity", "Lower sugar and relatively higher acidity", "Guaranteed noble rot", "No effect on juice balance"]
          correctIndex: 1
          explanation: "University of Minnesota Extension warns that early-picked fruit can have insufficient sugar and elevated acidity."
          sourceCitationId: src_wset_found_umn_ripeness
        ki_wset_found_ripe_style:
          prompt: "Why can the target Brix level differ between two intended wine styles?"
          options: ["Brix always measures wine tannin", "All wine styles require one legally fixed harvest sugar level", "The intended wine style and variety influence the desired harvest sugar balance", "Brix is measured only after bottling"]
          correctIndex: 2
          explanation: "University of Minnesota Extension says Brix targets vary with cultivar and the intended wine style or method."
          sourceCitationId: src_wset_found_umn_ripeness
        ki_wset_found_sample_representative:
          prompt: "What sampling choice best avoids a misleading vineyard-ripeness result?"
          options: ["Choose only the most sun-exposed clusters", "Sample one berry from the first vine", "Sample only berries damaged by birds", "Collect berries across multiple clusters and canopy positions"]
          correctIndex: 3
          explanation: "University of Minnesota Extension warns that only sampling exposed clusters can overstate crop maturity."
          sourceCitationId: src_wset_found_umn_ripeness
        ki_wset_found_crop_load:
          prompt: "What can overcropping reduce in a grapevine before the following growing season?"
          options: ["Stored carbohydrate reserves", "The need for photosynthesis", "The number of days in veraison", "The requirement for a root system"]
          correctIndex: 0
          explanation: "NMSU links overcropping with reduced carbohydrate reserves available to support next spring's growth."
          sourceCitationId: src_wset_found_nmsu_phenology
        ki_wset_structure_merlot_vineyard:
          prompt: "Which ripening contrast between Merlot and Cabernet Sauvignon is useful in Bordeaux?"
          options: ["Merlot is always harvested after Cabernet Sauvignon", "Merlot generally ripens earlier than Cabernet Sauvignon", "Neither grape ripens in Bordeaux", "The two grapes have identical ripening dates by rule"]
          correctIndex: 1
          explanation: "The Bordeaux wine body describes Merlot as an earlier-ripening variety than Cabernet Sauvignon, though seasons and sites vary."
          sourceCitationId: src_reg_fr_merlot
        ki_fault_glass_protection:
          prompt: "For a light-sensitive white wine on a bright retail shelf, which bottle choice generally gives more light protection?"
          options: ["Colourless flint glass regardless of thickness", "An uncovered, clear glass carafe", "Suitable dark green glass that blocks relevant wavelengths", "The same protection from every glass colour"]
          correctIndex: 2
          explanation: "AWRI measurements found much greater transmission at damaging wavelengths through flint glass than through suitable green glass; composition and thickness also matter."
          sourceCitationId: src_srv_awri_light
        ki_win_mlf_conversion:
          prompt: "During malolactic fermentation, what converts the wine's malic acid?"
          options: ["Bottling pressure converts it directly to sugar", "Oak toasting turns it into ethanol", "Yeast alone converts it to carbon dioxide", "Lactic acid bacteria convert it to lactic acid"]
          correctIndex: 3
          explanation: "AWRI identifies bacterial conversion of L-malic to L-lactic acid as the defining MLF reaction."
          sourceCitationId: src_win_mlf_style
        ki_win_mlf_butter:
          prompt: "Which compound can contribute a buttery note during malolactic fermentation?"
          options: ["Diacetyl", "Tartaric acid crystals", "Carbon dioxide", "Anthocyanin"]
          correctIndex: 0
          explanation: "AWRI links diacetyl from bacterial citric-acid metabolism to buttery aroma, depending on concentration and wine matrix."
          sourceCitationId: src_win_mlf_style
        ki_win_oak_flavours:
          prompt: "Which aroma set can oak contact contribute to wine?"
          options: ["Only cut grass and gooseberry", "Vanilla, coconut, spice or toast", "Only wet stone and sea salt", "Only fresh rose petals with no wood character"]
          correctIndex: 1
          explanation: "Penn State identifies coconut, vanilla, spice, caramel and smoke among aromas associated with oak ageing."
          sourceCitationId: src_win_oak_flavour
        ki_win_oak_variables:
          prompt: "Why does an oak barrel's country of origin alone fail to predict its full effect on wine?"
          options: ["Only the grape variety can change flavour", "All barrels have identical wood chemistry", "Species, toast, barrel age and size, and cooperage also affect extraction", "Oak origin determines only the wine's legal appellation"]
          correctIndex: 2
          explanation: "Iowa State Extension lists oak species, toast, barrel age and size, and cooperage alongside origin as important variables."
          sourceCitationId: src_win_oak
        ki_win_oak_reuse:
          prompt: According to Iowa State, how does repeated barrel use affect the American-versus-European oak distinction in wine?
          options:
          - The origin distinction becomes more pronounced
          - The origin distinction remains exactly unchanged
          - The origin distinction reverses in a fixed pattern
          - The origin distinction becomes less pronounced
          correctIndex: 3
          explanation: Iowa State Extension says differences between wine aged in American and European oak become less distinct as barrels are reused.
          sourceCitationId: src_win_oak
        ki_win_lees_release:
          prompt: "How can managed contact with yeast lees affect wine texture?"
          options: ["Released yeast compounds, including polysaccharides, can enhance texture", "It necessarily removes all acidity", "It always forces a second alcoholic fermentation", "It can only add red pigment"]
          correctIndex: 0
          explanation: "AWRI reports release of yeast-derived compounds and improved texture or flavour integration during managed lees ageing."
          sourceCitationId: src_win_lees
        ki_spark_traditional:
          prompt: For Champagne, where does the bubble-producing second fermentation occur?
          options:
          - In a tank before transfer to the sale bottle
          - In the same bottle in which Champagne is sold
          - In a barrel before transfer to the sale bottle
          - In the sale bottle only after disgorgement
          correctIndex: 1
          explanation: Comité Champagne explains that Champagne's second fermentation takes place in the bottle that is later sold to the consumer.
          sourceCitationId: src_spark_tirage
        ki_spark_tirage:
          prompt: "What does liqueur de tirage supply before the second fermentation?"
          options: ["Only fining clay and acid", "Only aged reserve wine", "Sugar and yeast in a wine mixture", "A final consumer sweetness label"]
          correctIndex: 2
          explanation: "Comité Champagne describes tirage as adding still wine, sugar and yeast before the bottle's second fermentation."
          sourceCitationId: src_spark_tirage
        ki_spark_tank:
          prompt: "Where does the conventional tank method retain carbon dioxide from its second fermentation?"
          options: ["In an open press", "In a sealed oak cask with no yeast", "In individual open glasses", "In a sealed pressure tank"]
          correctIndex: 3
          explanation: "Wine Australia describes sugar and yeast added to wine in a sealed tank to trap second-fermentation carbon dioxide."
          sourceCitationId: src_spark_australian_methods
        ki_spark_autolysis:
          prompt: "What is yeast autolysis during sparkling-wine maturation on lees?"
          options: ["Dead yeast cells decompose and release compounds into the wine", "Fresh grapes are crushed before fermentation", "Yeast is added to sweeten the finished wine", "Sediment is expelled by pressure after riddling"]
          correctIndex: 0
          explanation: "Comité Champagne describes yeast death and decomposition after second fermentation, with released molecules contributing to maturation."
          sourceCitationId: src_spark_maturation
        ki_spark_riddling:
          prompt: "What is the purpose of riddling a traditional-method sparkling bottle?"
          options: ["To add dosage sugar", "To move sediment gradually into the neck", "To press whole grape bunches", "To evaporate the wine's alcohol"]
          correctIndex: 1
          explanation: "Comité Champagne describes rotating and tilting bottles so their lees collect in the neck before disgorgement."
          sourceCitationId: src_spark_riddling
        ki_spark_disgorgement:
          prompt: "What does disgorgement remove from a prepared sparkling bottle?"
          options: ["All dissolved carbon dioxide", "The unopened cork only", "Sediment collected in the neck, often as a frozen plug", "The grape skins left in the press"]
          correctIndex: 2
          explanation: "Comité Champagne describes freezing the neck and using bottle pressure to expel the lees plug."
          sourceCitationId: src_spark_disgorgement
        ki_spark_dosage:
          prompt: "At what stage is Champagne dosage added?"
          options: ["Before grapes flower", "Before the base wine's first fermentation", "During riddling, to move sediment", "After disgorgement and before final corking"]
          correctIndex: 3
          explanation: "Comité Champagne describes dosage as the final wine-and-sugar addition after sediment removal and before corking."
          sourceCitationId: src_spark_dosage
        ki_wset_prod_deacidification:
          prompt: "Which cellar action can lower a wine's acidity by neutralising some of its acids?"
          options: ["A permitted carbonate deacidification treatment", "Adding more tartaric acid", "Removing the label", "Increasing bottle pressure"]
          correctIndex: 0
          explanation: "AWRI describes chemical deacidification with permitted carbonate agents and recommends trials to measure the actual pH and acidity response."
          sourceCitationId: src_wset_prod_deacid
        ki_wset_prod_destem_crush:
          prompt: "What does destemming remove before certain winemaking routes?"
          options: ["All juice sugar", "Grape bunch stems", "Finished-wine sediment", "Dissolved carbon dioxide"]
          correctIndex: 1
          explanation: "The German Wine Institute defines destemming as separating grapes from their stems before pressing in some routes."
          sourceCitationId: src_wset_prod_dwi_cellar
        ki_wset_prod_enrichment:
          prompt: "What is the purpose of adding permitted fermentable sugar to must before fermentation?"
          options: ["To create oak aromas", "To lower all acidity to zero", "To increase potential alcohol when yeast ferments the added sugar", "To add final sweetness after every fermentation"]
          correctIndex: 2
          explanation: "UK government wine-production guidance describes enrichment as adding sugar to must to increase eventual alcohol rather than simply sweeten the finished wine."
          sourceCitationId: src_wset_prod_enrichment
        ki_wset_sf_prosecco_style:
          prompt: "In the conventional Conegliano Valdobbiadene Prosecco Superiore route, where are the bubbles formed?"
          options: ["By a mandatory third fermentation in every sale bottle", "Only by gas injection into finished wine", "In the press before the base wine exists", "By a second fermentation in large pressurised tanks"]
          correctIndex: 3
          explanation: "The Conegliano Valdobbiadene consortium describes base-wine re-fermentation with sugar and yeast in pressurised autoclaves."
          sourceCitationId: src_wset_sf_prosecco_academy
        ki_fault_oxidative_style:
          prompt: How does Iowa State distinguish oxidative character between these white wine styles?
          options:
          - Desirable in Vin Jaune; usually unwanted in fresh white table wine
          - Unwanted in Vin Jaune; usually desirable in fresh white table wine
          - Desirable in both Vin Jaune and most fresh white table wine
          - Unwanted in both Vin Jaune and fresh white table wine
          correctIndex: 0
          explanation: Iowa State Extension names Vin Jaune as a style where oxidative character can be desirable while treating oxidation in ordinary fresh white table wine as unwanted.
          sourceCitationId: src_fault_oxidation_white
        ki_fault_h2s_descriptor:
          prompt: "Which odour is a common sensory clue to hydrogen sulfide in wine?"
          options: ["Fresh-cut grass", "Rotten egg", "New oak vanilla", "Ripe strawberry"]
          correctIndex: 1
          explanation: "AWRI identifies hydrogen sulfide with a rotten-egg odour while noting that interpretation depends on concentration and other wine compounds."
          sourceCitationId: src_fault_sulfur
        ki_wset_close_red_ageing_colour:
          prompt: "Which colour shift can occur as a red wine develops?"
          options: ["Garnet always becomes purple", "Red wine must become colourless", "Youthful purple or ruby can develop garnet or tawny tones", "All older reds become bright green"]
          correctIndex: 2
          explanation: "WSET's tasting guide places purple and ruby at the youthful end of the red colour scale and garnet or tawny toward more developed appearances."
          sourceCitationId: src_wset_taste_concepts
        ki_wset_close_white_ageing_colour:
          prompt: A white wine can deepen from lemon toward gold. How should amber/brown be interpreted?
          options:
          - It indicates deliberate oxidation and excludes an old wine
          - It indicates an old wine and excludes deliberate oxidation
          - It fixes the wine's exact age, regardless of wine style
          - It may reflect age or deliberate oxidation; context matters
          correctIndex: 3
          explanation: WSET places lemon, gold, amber and brown on the white appearance scale, but very old or deliberately oxidative styles mean deeper colour needs context.
          sourceCitationId: src_wset_taste_concepts
        ki_wset_grape_gewurztraminer_profile:
          prompt: "Which aroma and structure pairing is typical of Alsace Gewurztraminer?"
          options: ["Rose or lychee, broad body and relatively discreet freshness", "Blackcurrant, firm red tannin and deep ruby colour", "Only lemon, very light body and no floral aroma", "Neutral aroma with mandatory bottle-fermented bubbles"]
          correctIndex: 0
          explanation: "The Alsace wine body describes rose, lychee and spice aromas, full body, and freshness that is less prominent than in many other Alsace wines."
          sourceCitationId: src_wset_grape_civa_gewurztraminer
        ki_wset_grape_syrah_profile:
          prompt: "Which regional expression does Wine Australia describe for Barossa Shiraz?"
          options: ["A pale, dry Riesling-style white", "Full body with blackberry, pepper and spice", "Only light red-fruit rosé", "Only sweet fortified wine"]
          correctIndex: 1
          explanation: "Wine Australia describes Barossa Shiraz as full-bodied and richly textured with blackberry, pepper and spice."
          sourceCitationId: src_wset_grape_wa_shiraz
        ki_wset_grape_syrah_variation:
          prompt: Which Australian Shiraz production range does Wine Australia describe?
          options:
          - Early styles always need new oak; GSM blends are uncommon
          - Early styles can avoid oak; blending must exclude Grenache
          - Early styles can avoid oak; some wines use oak or GSM blends
          - Early styles require oak; mature styles require tank fermentation
          correctIndex: 2
          explanation: Wine Australia describes some fresh early-drinking Shiraz without oak, oak maturation in other styles, and the established Grenache–Shiraz–Mourvèdre blend.
          sourceCitationId: src_wset_grape_wa_shiraz
