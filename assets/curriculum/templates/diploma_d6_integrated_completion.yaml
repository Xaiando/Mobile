{
  "question_templates": [
    {
      "id": "qt_d6c_integrated_criteria",
      "relation_type": "CASE_ACTION",
      "direction": "forward",
      "prompt_template": "{subject.name}",
      "mode": "case_criteria",
      "variant": "d6c_integrated_criteria",
      "parameters": {
        "scope_node_ids": [
          "n_d456_case_research_denominators",
          "n_d456_case_research_competing",
          "n_d456_case_research_revision"
        ],
        "scenario_prompts": {
          "n_d456_case_research_denominators": "Original fictional D6 method packet, not an issued assignment or submission. Your practice inquiry asks whether younger adults in Region R are buying more wine directly from wineries. A voluntary online survey of 80 cellar-door visitors reports that 60% intend to buy again. A winery association reports direct-sales value rose 12%, but excludes nonmembers and does not provide prices, volume or ages. A retail survey covers shop purchases in another region. A draft treats these as proof that all young adults increased direct wine volume. All places, samples and figures are invented. Plan source appraisal and a bounded claim, then name evidence that could test a rival interpretation.",
          "n_d456_case_research_competing": "Original fictional D6 argument packet. A practice inquiry compares winery lightweight-bottle programmes. Eight self-selecting wineries report lower outbound freight spending after a package change; the same period also brought a carrier discount, lower dispatched volume and a different export mix. A bottle supplier's brochure attributes the entire saving to its glass. Two independent operators report no per-bottle saving but use different shipping distances. All sources, programmes and findings are invented and carry no actual emissions or transport calculations. Construct an argument outline that distinguishes observation, a plausible packaging mechanism, conflicting evidence and the limits of causal attribution; propose a useful follow-up.",
          "n_d456_case_research_revision": "Original fictional D6 revision exercise. A learner's own practice brief asks for a bounded comparison of wine-sales channels. Their draft claims that a region switched to direct sales, citing a trade article that repeats a voluntary winery survey. The paragraph includes paraphrased survey data without a citation, a quotation with no page or section record, and an unsupported concluding claim about all consumers. The source log has a URL but no author, date or method note. Word count is within the learner's practice target; that does not establish compliance with any current official brief. All claims and brief wording are invented. Design a revision checklist without writing an assessed submission."
        },
        "distractors": {
          "n_d456_case_research_denominators": [
            {
              "summary": "Interpret the 60% as observed repeat purchases by all young adults.",
              "explanation": "Intentions among selected visitors are neither observed behaviour nor a regional population estimate."
            },
            {
              "summary": "Use sales-value growth as wine-volume growth without price evidence.",
              "explanation": "Value can change through price or mix as well as volume."
            }
          ],
          "n_d456_case_research_competing": [
            {
              "summary": "Attribute the complete freight saving to the supplier's bottle because spending fell afterwards.",
              "explanation": "The supplied concurrent changes and selection confound the attribution."
            },
            {
              "summary": "Reject every report solely because two operators found different outcomes.",
              "explanation": "Different distances and baselines may explain differences; appraisal should examine comparability."
            }
          ],
          "n_d456_case_research_revision": [
            {
              "summary": "Delete references to save words because paraphrases are original writing.",
              "explanation": "Paraphrased findings still require traceable attribution."
            },
            {
              "summary": "Mark the assignment complete because the word count fits.",
              "explanation": "Length alone cannot establish inquiry quality, compliance or assessed performance."
            }
          ]
        }
      }
    },
