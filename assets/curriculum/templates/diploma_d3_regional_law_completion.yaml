          "n_d3law_case_china_gi_dossier"
        ],
        "scenario_prompts": {
          "n_d3law_case_jura_release_inventory": "A fictional Côtes du Jura lot from grapes harvested in 2026 seeks the Vin Jaune mention. For this exercise, all other PDO and product conditions are satisfied and recorded. The cellar records oak maturation without topping-up through 15 December 2032, with 64 completed months under veil by that date. The buyer proposes consumer launch on 20 December 2032. A conditional replacement launch on 1 January 2033 is available after complete record and label review. No sensory results or confirmed selling pace are supplied. The pilot buyer would purchase 100 clavelins from the supplier at the lawful launch, each with a stated net fill of 62 cl, at a quote of EUR 40 per bottle payable on dispatch. Independently supplied additional holding cost for 16 December 2032 through 31 December 2032 is a fixed EUR 240 for the lot, contractually borne by the pilot buyer in this exercise; it is not a monthly rate. Packaging and launch facts, prices and costs are invented. Explain the calendar and veil conditions, the consumer launch decision, the reserved bottle identity and the pilot's quantity/cost arithmetic. The bottle-reservation clause alone is not a premise that all other sizes are forbidden. Quotes omit delivery, tax and other costs.",
          "n_d3law_case_tokaj_label_release": "A fictional Tokaj Aszú lot is made from grapes harvested on 15 September 2025. Assume all other PDO and Aszú production conditions are documented and satisfied for this exercise. Its residual sugar is 135 g/L; records show 18 completed months in wood from 1 December 2025 to 1 June 2027. The proposal is a 6 puttonyos label and consumer dispatch on 1 July 2027. The buyer will reconsider an Aszú presentation without that numbered claim and a 1 January 2028 launch, subject to complete current label/record review and a repeat tasting. The pilot buyer bears a fictional EUR 180 reprint charge. Holding stock from 1 July 2027 through 31 December 2027 costs the pilot buyer a stipulated EUR 60 per whole calendar month for six months. The pilot buyer would buy 100 bottles from the supplier at EUR 25 each, paying the supplier on dispatch. The buyer's future receipts from selling to its own customers are unknown. There is no confirmed selling revenue, demand or tasting result. Compare the applicable vintage scope, sugar and optional wording, wood and earliest consumer-date gates, action, supplied costs and limits. All market observations and prices are invented.",
          "n_d3law_case_china_gi_dossier": "A fictional Chinese producer intends to sell a still grape wine using the special mark for a hypothetical recognised GI product under CNIPA Order 80's product-protection route. The prompt stipulates this product is officially recognised; it does not name or invent a real wine's GI status. The producer provides the current GB/T15037-2006 status-page reference, an ordinary laboratory report and a winery address. It provides no corresponding protected-product specification, source-origin dossier or producer mark-use approval/registration evidence. A merchant will reconsider 200 bottles after supported presentation and product sampling. Option A holds the protected-mark packaging while seeking the missing dossier; supplied record work costs CNY 600 and a stipulated whole-month holding interval costs CNY 200. Option B uses a revised presentation omitting that unsupported protected mark/name only after full lawful ordinary-label review and buyer agreement; reprinting costs CNY 500. Neither option is approved in this exercise; completion times, sensory results and final acceptance are unknown. A hypothetical purchase quote is CNY 50 per bottle for either option before additional listed costs. Compare standard status, actual protected-product conformity, producer mark-use approval, the conditional route and listed cost arithmetic. Other wine/food/import requirements and parallel GI-trademark routes remain outside the supplied dossier."
        },
        "distractors": {
          "n_d3law_case_jura_release_inventory": [
            {
              "summary": "Dispatch to consumers on 20 December 2032 because the oak and veil records already satisfy maturation.",
              "explanation": "The separate consumer-market gate is 1 January 2033 for this 2026 harvest; completing maturation does not remove that gate."
            },
            {
              "summary": "Treat 62 cl as proof of exactly 38% loss, declare all 75 cl formats illegal from the reservation clause alone, and guarantee a premium price.",
              "explanation": "Neither a fixed evaporation proportion, a reverse universal bottle-size mandate nor a quality or price guarantee follows from the cited reservation."
            }
          ],
          "n_d3law_case_tokaj_label_release": [
            {
              "summary": "Keep 6 puttonyos and dispatch in July 2027 because 135 g/L exceeds 120 g/L and 18 months wood are completed.",
              "explanation": "The 6 wording needs 150 g/L and the separate consumer date is 1 January 2028; this proposal misses both conditions."
            },
            {
              "summary": "Reject every Aszú label with 3 or 4 puttonyos as currently banned and use the historical 3=60 or 4=90 sugar scale for any alternative.",
              "explanation": "Version 10 lists optional 3/4 wording while all current Aszú still needs 120 g/L. Neither the proposed blanket ban nor obsolete lower minima follows."
            }
          ],
          "n_d3law_case_china_gi_dossier": [
            {
              "summary": "Use the special mark immediately because the ordinary lab report passes and the winery has a regional address.",
              "explanation": "Those documents do not establish the recognised product's source/specification conformity or this producer's special-mark approval."
            },
            {
              "summary": "Declare both options fully cleared because the current wine standard is recommended, and guaranteeB's lower listed cost means higher profit.",
              "explanation": "Recommended status does not waive other duties; neither route is approved, and the limited supplied costs contain no selling revenue or complete profit evidence."
            }
          ]
        }
