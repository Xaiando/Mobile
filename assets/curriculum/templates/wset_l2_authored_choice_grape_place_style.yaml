          - "Dry Sémillon-Sauvignon Blanc blends and sweet Bordeaux; botrytis reduces sugar in the sweet style."
          - "Dry Sémillon-Sauvignon Blanc blends and sweet Bordeaux; oak supplies the sugar in the sweet style."
          - "Dry Sémillon-Sauvignon Blanc blends and sweet Bordeaux; blending with Sauvignon Blanc itself makes the sweet style."
          correctIndex: 0
          explanation: "Bordeaux describes Sémillon in dry Sauvignon Blanc blends and sweet wines; botrytis can concentrate sugars in grapes used for sweet styles."
          sourceCitationId: src_wset_grape_civb_semillon
        ki_wset_origin_condrieu_viognier:
          prompt: "Which grape is the signature white variety of Condrieu in the northern Rhône?"
          options: ["Marsanne", "Viognier", "Grenache Blanc", "Chardonnay"]
          correctIndex: 1
          explanation: "Inter Rhône identifies Condrieu with Viognier and describes its dry aromatic white-wine style."
