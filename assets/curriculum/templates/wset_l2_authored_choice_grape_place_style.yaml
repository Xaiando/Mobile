          - Mostly red Pinot Noir, with rare white Chardonnay
          - Mostly white Aligoté, with rare red Pinot Noir
          correctIndex: 2
          explanation: The Bourgogne wine board says Nuits-Saint-Georges is overwhelmingly red Pinot Noir but also produces a small amount of white Chardonnay.
