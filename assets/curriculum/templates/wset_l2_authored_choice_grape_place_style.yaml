          - "Chablis; white Sauvignon Blanc"
          correctIndex: 1
          explanation: "The Bourgogne wine board places Gevrey-Chambertin in the Côte de Nuits and lists red Pinot Noir exclusively."
          sourceCitationId: src_wset_origin_gevrey
