        "scenario_prompts": {
          "n_d456_case_sherry_cellar": "Original fictional Jerez/Manzanilla production and sales exercise. Grower logs document heat, water status and grape health. Separate first and later press fractions are classified by trial; the lighter candidate is assigned to a flor-directed plan and the more structured candidate to an oxidative plan. A Sanlúcar bodega's supplied temperature and humidity records differ from another cellar. A mature solera withdrawal proposal exceeds the producer's replenishment budget. The buyer requests dry wines but a draft lists Oloroso, Amontillado and Palo Cortado as automatically sweet because they are dark. Naturally sweet PX and a blended Cream are separate offers. All observations, volumes, budgets and offers are fictional, not legal standards. Evaluate production, stock and customer fit.",
          "n_d456_case_port_extraction_stock": "Original fictional Port production and portfolio exercise. Two Douro parcels have different rainfall, water-status, access and harvest-ripeness logs. A short pre-fortification fermentation requires extraction choices suited to its fruit. A robotic-treading pilot and a hand-treading pilot have comparable panel outcomes but different quoted labour and equipment costs. Youthful ruby, longer wood-held tawny, LBV, Vintage and Colheita release proposals have different actual storage, bottling and cash schedules. A white lot was fermented longer for a drier slot. All trial outcomes, costs and timings are invented; no declaration or category approval is supplied. A buyer ranks all dated wines as equivalent and assumes hand work always tastes better. Design a conditional allocation.",
          "n_d456_case_madeira_working_capital": "Original fictional Madeira site-to-release exercise. Fragmented steep parcels supply measured crew-hours, water-delivery and grape-health records. A Tinta Negra lot has a tested medium-sweet brief; separately documented Sercial, Verdelho, Boal and Malvasia lots support different actual sweetness slots. An estufagem trial needs controlled heating and a finishing/stability review. A canteiro proposal uses wood and a longer producer-planned holding period. Neither programme has complete category approval. A supplier says canteiro must always be more profitable and that every bottle bearing a grape name has the same sweetness. A prepaid tourist-retail pilot and a later export order compete for limited cash. All observations, schedules and offers are invented. Evaluate a conditional plan.",
          "n_d456_case_vdn_style_stock": "Original fictional VDN comparison. Muscat de Rivesaltes and Muscat de Frontignan supplier lots have aromatic-fruit trials; Grenache-led Maury, Banyuls and Rivesaltes lots have different skin-contact, fortification and oxygen/wood records. A steep Banyuls parcel's log records more harvest labour than an accessible parcel that season. Youthful protected-from-oxygen A fits a fresh-fruit dessert brief; oxidative B fits a developed dried-fruit brief. These observations, comparisons, staffing and offers are invented, not appellation-wide norms. A buyer proposes giving every VDN the same price and using any Maury bottle as a dry still wine. An older release needs extra stock finance. Evaluate production and route choices.",
          "n_d456_case_rutherglen_replenishment": "Original fictional Rutherglen Muscat exercise. Brown Muscat parcels supply actual heat, water-status, late-ripeness and bunch-health logs. Fermentation/fortification records and separate cask stocks are available. Bench trial A adds a measured younger parcel to a mature component and fits the requested freshness/concentration balance; B maximises the old component and is too heavy for that brief. The old stock is limited and the producer has no funded replacement plan. A merchant wants a large discount; cellar-door guests have only sampled small pours. Proposed classification tier and reference-age records are incomplete. All observations, ratios, stock and offers are invented rather than a producer recipe. Plan a conditional blend and sales release."
        },
        "distractors": {
          "n_d456_case_sherry_cellar": [
            {
              "summary": "List all dark dry Sherry as sweet and substitute it for PX.",
              "explanation": "Darkness and oxidative development do not establish residual sweetness."
