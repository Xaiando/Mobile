            }
          ],
          "n_d456_case_vdn_style_stock": [
            {
              "summary": "Use the supplied sweet Maury lot as a dry wine because every Maury is dry.",
              "explanation": "The packet explicitly identifies sweet fortified evidence and product identity needs checking."
            },
            {
              "summary": "Charge every VDN one price because its production costs must be identical.",
              "explanation": "The supplied labour, holding and style plans differ."
            }
          ],
          "n_d456_case_rutherglen_replenishment": [
            {
              "summary": "Release B because the oldest component necessarily makes the best blended wine.",
              "explanation": "The supplied bench trial does not fit the brief and spends limited stock."
            },
            {
              "summary": "Allocate all scarce old stock to the largest discounted order without replenishment.",
              "explanation": "Volume ignores lost future blending options and uncosted sales contribution."
            }
          ]
        }
      }
