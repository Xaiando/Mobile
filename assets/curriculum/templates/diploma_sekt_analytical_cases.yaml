        "scenario_prompts": {
          "n_d4sekt_case_winzersekt_allocation": "An invented estate in the Pfalz has sound, hand-picked Riesling lots from the same harvest: one lot from a sheltered sandstone terrace and another from a loess slope. The estate brief is a brisk, autolytic sparkling wine for release in 12 months. Lot A underwent traditional bottle fermentation (Klassische Flaschengärung) with estate fruit, currently planned for 10 months on lees and disgorgement in month 11. Lot B was vinified by contract pressurised tank fermentation (Deutscher Sekt b.A.) that has already completed its statutory six-month production duration, permitting immediate commercial packaging and release within week 8. A preliminary coded sensory panel judges Lot A closer to the autolytic brief; Lot B is judged fruit-forward and simpler. A specialised wine merchant offers a prepaid order for 360 bottles at a premium unit price with required estate staff attendance at two promotional tastings. A regional wholesale distributor requests an allocation of 2,400 bottles of Lot B with payment 60 days after shipment, but provides no credit history or account sell-through data. A bottling and press leasing instalment of 8,500 EUR is due in 24 days. Liquid cash balances, full production cost accounting, repeat panel stability records, official A.P.-Nr. certification for the lots, and distributor credit references are missing. All lots, methods, timings, volumes and financial terms are fictional and do not represent statutory norms or guaranteed returns. Recommend a conditional production and sales action, explain the technical and comparative evidence, weigh the operational and commercial tradeoffs, and identify the unresolved variables that must be verified.",
          "n_d4sekt_case_extended_lees_positioning": "An invented Rheingau estate evaluates two Pinot Noir and Chardonnay sparkling base blends from single-vineyard parcels: Lot C is a non-vintage (NV) cuvée, and Lot D is a single-vintage cuvée. The strategic brief is a high-prestige sparkling cuvée for on-premise gastronomy placement in 18 months. Lot C has completed 15 months on lees in bottle (conforming to the baseline non-vintage VDP.SEKT standard of 15 months minimum; vintage releases require at least 24 months), with estimated sensory readiness and disgorgement in month 16. Lot D is held for extended 36-month lees aging (conforming to the VDP.SEKT.PRESTIGE benchmark of 36 months minimum), estimated ready for market release in month 38. A preliminary sensory panel finds Lot C shows crisp citrus, red berry and light pastry notes, ready for near-term service; Lot D is judged tightly wound with developing yeast autolysis and chalky minerality, but unready for release within the 18-month target. A luxury fine-dining restaurant group offers a standing prepaid order for 240 bottles of Lot C with sommelier training workshops. An export broker requests 1,800 bottles of Lot D on a 90-day consignment/credit arrangement for an overseas market, without providing secondary market price realisation or account sell-through history. A cellar storage and climate-control lease invoice falls due in 30 days. Liquid reserves, total cellaring and inventory holding costs, disgorgement dosage trials, formal association certification, and overseas broker solvency are unknown. All parameters are fictional. Recommend a conditional commercial and cellar action, explain the enological and timing evidence, weigh the working-capital and channel tradeoffs, and specify the critical factors that require formal verification."
