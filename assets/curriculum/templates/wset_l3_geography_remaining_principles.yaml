      ki_wset_role_trincadeira_style:
        prompt: An Alentejo red blend includes Trincadeira. Which tasting hypothesis should be checked against
          fruit ripeness?
        options:
        - Underripe fruit reduces herbal notes while ripe fruit amplifies them here
