      ki_wset_role_zweigelt:
        prompt: A learner uses Zweigelt’s parentage to predict one compulsory wine style. Which corrected account
          fits Austrian Wine?
        options:
        - A Blaufränkisch–Pinot Noir cross with red styles fixed by parentage
        - A Sankt Laurent–Riesling cross used chiefly for aromatic whites
        - A Pinot Noir clone tied to a single Austrian red style
        - A Blaufränkisch–Sankt Laurent cross with diverse red styles
        correctIndex: 3
        explanation: Austrian Wine identifies the crossing and a range from young fruit-led to stronger wood-matured
          wines; parentage is not a style rule.
        sourceCitationId: src_wset_role_austria_grapes
