        sourceCitationId: src_wset_role_welschriesling
      ki_wset_role_welschriesling_sweet:
        prompt: A merchant sees a Burgenland late-harvest Welschriesling beside a fresh dry example. What explains
          the style difference?
        options:
        - The same harvest route yields both styles through extra oak ageing
        - Dry grapes become sweet after fermentation by lees stirring
        - Late-harvest fruit can yield sweet wine while retaining acidity
        - A later bottle age converts dry Welschriesling into a sweet style
        correctIndex: 2
        explanation: The Austrian government and wine body describe both dry and late-harvest sweet Welschriesling,
