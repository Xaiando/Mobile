        options:
        - Muscat of Alexandria used for neutral dry white wines within Tokaj’s main blends
        - Muscat Blanc à Petits Grains; its aromatic wines may be made dry or sweet
        - Hárslevelű under an aromatic local name used only for Aszú
        - Furmint under its regional name used for Tokaj base wines
        correctIndex: 1
        explanation: The Tokaj wine body identifies Sárga Muskotály with Muscat Blanc à Petits Grains and describes
