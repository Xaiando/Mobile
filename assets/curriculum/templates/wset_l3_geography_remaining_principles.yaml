      ki_wset_role_trincadeira_vine:
        prompt: A Tejo grower assumes hot dry conditions make Trincadeira disease-free. Which vineyard plan
          is safer?
        options:
        - Manage vigorous foliage growth and rot risk at warm, dry sites
        - Ignore vigorous foliage and focus only on cellar temperature
