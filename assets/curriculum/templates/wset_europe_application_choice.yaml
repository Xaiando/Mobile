        correctIndex: 3
        explanation: The Bourgogne wine board distinguishes regional AOCs from village AOCs named for
          communes. A label does not by itself grade every bottle's quality.
        sourceCitationId: src_wset_eu_burgundy_hierarchy
      ki_wset_eu_it_doc_docg:
        prompt: What do DOC and DOCG names identify on Italian wine labels?
