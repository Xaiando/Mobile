        - AOC ranks a French estate; AOP names its protected wine origin
        - AOC names a village site; AOP names the broader wine region
        correctIndex: 0
        explanation: INAO treats AOC as the French national appellation terminology and AOP as its European
          protected-origin counterpart. A named appellation carries a delimited origin and specification.
        sourceCitationId: src_wset_eu_fr_aoc
      ki_wset_eu_fr_igp_identity:
        prompt: A French bottle bears the Pays d'Oc IGP name. Which interpretation is supported?
        options:
        - It is an AOP appellation with a single permitted grape variety
        - It is a protected geographical indication with an origin specification
        - It is a Vin de France category that does not name a region
        - It is a producer-owned region brand outside protected-origin rules
        correctIndex: 1
        explanation: INAO describes IGP as a protected geographical indication linked to origin, reputation
          or characteristics and governed by a specification. Pays d'Oc is an IGP example.
        sourceCitationId: src_wset_eu_fr_igp
      ki_wset_eu_burgundy_regional_village:
        prompt: Bourgogne and Gevrey-Chambertin appear on two bottles. How do their named origins compare?
        options:
