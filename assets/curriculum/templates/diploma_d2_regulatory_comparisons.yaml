              "A label accepted in one market automatically authorises sale in every market",
              "A general label example proves every formulation and claim lawful"
            ],
            "correctIndex": 1,
            "explanation": "27U.S.C.205(e) requires conforming packaging/labeling for the covered commerce and directs consumer information, including identity, contents and responsible business. The applicable regulations and label review remain necessary; one compliant-looking design is not proof of all-market access.",
            "sourceCitationId": "src_d12depth_us_label"
          }
