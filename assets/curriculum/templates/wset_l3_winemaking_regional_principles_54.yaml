        correctIndex: 1
        explanation: "New York's wine body describes both dry and sweet Riesling; aroma and origin cannot replace residual-sugar evidence."
        sourceCitationId: src_wset_nw_finger_riesling
      ki_wset_nwa_gisborne_chardonnay:
        prompt: "A ripe Gisborne Chardonnay lot is split into fruit-led and fuller trial wines. Which change is useful for the fuller trial?"
        options: ["Remove fruit by pushing oxidative handling", "Keep both trials identical in vessel and maturation", "Evaluate lees, oak or malolactic fermentation", "Use the regional name to assign final body"]
        correctIndex: 2
        explanation: "Lees, oak and malolactic fermentation are optional texture and flavour variables to trial against the fruit's balance."
        sourceCitationId: src_win_lees
      ki_wset_nwa_great_southern_red:
        prompt: "Two Great Southern red lots differ in concentration. How should an extraction schedule be chosen?"
        options: ["Use the region's largest standard tank schedule", "Assign more oak in advance based on regional reputation rather than the lot", "Treat Cabernet and Shiraz as a single fixed recipe", "Compare cap-work trials with each lot's tannin and fruit"]
        correctIndex: 3
        explanation: "AWRI describes fermentation temperature and skin contact as extraction controls; individual fruit concentration matters."
        sourceCitationId: src_win_temperature
      ki_wset_nwa_great_southern_riesling:
        prompt: "A Great Southern Riesling is destined for a fresh style, but the buyer asks whether it is dry. What evidence is needed?"
        options: ["Residual sugar and acid balance in the finished sample", "The cool-region name and Riesling grape identity as measures of final sugar", "A colour reading as proof of fermentation completion", "The vessel material as the final sweetness measure"]
        correctIndex: 0
        explanation: "Wine Australia describes regional Riesling styles; finished sweetness must be checked rather than inferred from origin."
        sourceCitationId: src_wset_grape_wa_riesling
      ki_wset_nwa_leyda_san_antonio_white:
        prompt: "A Leyda Sauvignon Blanc trial compares neutral steel and lees-aged portions. Which inference respects the coastal origin?"
