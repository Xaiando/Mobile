        correctIndex: 3
        explanation: "Red extraction and oak can alter structure and aroma; the ripe lot's balance and target style determine the route."
        sourceCitationId: src_win_oak
      ki_wset_nwa_cachapoal_carmenere:
        prompt: "A ripe Cachapoal Carmenère lot shows firmer tannin than the fruit-led brief requires. Which cap-work response merits trial?"
