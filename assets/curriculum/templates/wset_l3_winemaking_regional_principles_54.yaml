      ki_wset_eu_dolcetto_alba_use:
        prompt: "A Piedmont list needs an earlier-drinking red beside a firmly tannic Nebbiolo. Which Dolcetto decision is defensible?"
        options: ["Use the wine’s age and Piedmont origin as proof that its tannin is already soft", "Mature both wines for an identical fixed period", "Assume any Dolcetto is ready without tasting", "Trial a fruit-led Dolcetto and assess its actual grip"]
        correctIndex: 3
