      ki_wset_eu_frascati_steel_lees:
        prompt: "A Frascati Superiore producer sheet reports stainless fermentation followed by lees ageing. Which combined effect is plausible?"
        options: ["Fresh fruit retention with added texture from fine lees", "Fresh fruit retention with less texture after lees ageing", "Oak spice from steel and a stronger acid bite from lees", "Fruit removal by steel followed by new-barrel toast"]
        correctIndex: 0
        explanation: "The producer documents temperature-controlled steel fermentation and lees ageing in its own Frascati example."
        sourceCitationId: src_wset_eu_frascati_producer
      ki_wset_eu_penedes_xarello_oak:
        prompt: "A Penedès Xarel·lo example has barrel treatment. What should a comparison with a fresh steel-made white examine?"
        options: ["The appellation profile in place of a paired tasting", "Fruit, texture and wood notes in the finished wines", "A fixed oak aroma attributed to the Xarel·lo grape", "The assumption that both wines share a vessel route"]
