        correctIndex: 0
        explanation: "AWRI describes extraction as responsive to temperature and skin contact; the actual tannin result guides the next cap-work step."
        sourceCitationId: src_win_temperature
      ki_wset_nwa_finger_lakes_riesling:
        prompt: "A Finger Lakes Riesling smells fruity, but the menu needs a dry option. Which check settles the service claim?"
