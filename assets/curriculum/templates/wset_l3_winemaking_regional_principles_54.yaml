        correctIndex: 1
        explanation: "Dry and off-dry briefs differ in residual sugar; a sweetened or arrested lot also needs microbial stability control."
        sourceCitationId: src_win_packaging
      ki_wset_nwa_curico_maule_white:
        prompt: "Curicó and Maule Sauvignon Blanc lots are intended as fresh whites. Which common route limits unwanted skin extraction?"
