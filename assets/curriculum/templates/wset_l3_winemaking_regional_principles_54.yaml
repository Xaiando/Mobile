# Fifty-four source-linked Level 3 regional production decisions and evidence
# checks. These are bounded objective prompts on existing unverified assertions.
question_templates:
- id: qt_wset_l3_winemaking_regional_principles_54
  relation_type: PRINCIPLE_EXPLANATION
  direction: forward
  mode: authored_choice
  variant: wset_l3_winemaking_regional_principles_54
  prompt_template: '{subject.name}'
  parameters:
    item_choices:
      ki_reg_ah_neusiedler_zweigelt:
        prompt: "A Neusiedlersee Zweigelt is intended as a fresh, fruit-led red. Which cellar brief best fits that goal?"
        options: ["Trial steel or restrained wood and check fruit balance", "Use prolonged new oak until mature spice and savoury notes outweigh floral fruit", "Choose oxidative handling to replace the primary fruit", "Set residual sugar to mask a loss of red-fruit aroma"]
        correctIndex: 0
        explanation: "The Neusiedlersee regional body describes Zweigelt and both steel and wood routes; vessel and maturation should follow the intended fruit-led style."
        sourceCitationId: src_reg_ah_neusiedler_wines
      ki_reg_ah_tokaj_cellar:
        prompt: "A Tokaj wine matures in a cool underground cellar and an oak cask. How should a tasting comparison separate the two influences?"
        options: ["Credit the cask-derived aromas mainly to cool cellar air", "Track stable storage conditions separately from oak contact", "Assume the oak cask fixes maturation regardless of temperature", "Treat cool storage as proof that the wine needs no monitoring"]
        correctIndex: 1
        explanation: "The Tokaj regional council describes cool, stable underground cellars; oak contact is a separate variable in maturation."
        sourceCitationId: src_reg_ah_tokaj_maturing
      ki_reg_de_baden_pinot_light:
        prompt: "A Baden Spätburgunder looks relatively pale and tastes gently tannic. What is the sound first interpretation?"
        options: ["The colour proves the fruit was unripe at harvest", "Mild tannin calls for extended ageing before service", "This can be a valid Pinot style; assess the actual balance", "The appearance establishes a lower quality tier without tasting"]
        correctIndex: 2
        explanation: "DWI describes a lighter-coloured, milder-tannin Spätburgunder expression; colour alone does not establish quality."
        sourceCitationId: src_reg_de_spatburgunder
      ki_reg_de_baden_pinot_wood:
        prompt: "A second Baden Spätburgunder shows deeper colour, firmer tannin and vanilla. Which production explanation is worth checking?"
        options: ["Bottle age better explains the vanilla than oak contact", "A different Pinot clone explains the vanilla notes", "Warmer vineyard conditions, rather than the small-oak maturation, explain the vanilla", "Extraction and small-oak maturation may have shaped the style"]
        correctIndex: 3
        explanation: "DWI describes more deeply coloured Spätburgunder expressions and vanilla or spice from small-oak maturation."
        sourceCitationId: src_reg_de_spatburgunder
      ki_reg_de_franken_muller_fresh:
        prompt: "A Franken Müller-Thurgau is planned for early release with light floral fruit. Which route is a plausible starting trial?"
        options: ["Cool, neutral-vessel fermentation with balance checked in the lot", "New-oak fermentation and ageing for mature toast and spice aromas", "Warmer neutral-vessel fermentation for broader, less floral fruit", "Extended lees ageing to build a creamy, weightier palate"]
        correctIndex: 0
        explanation: "DWI describes Müller-Thurgau's gentle acidity and floral, Muscat-like aromas, often presented as a fresh wine."
        sourceCitationId: src_reg_de_muller
      ki_reg_de_rheinhessen_grauburgunder_vessels:
        prompt: "Two Rheinhessen Grauburgunders differ in texture and acid profile. Which production records would best test a cellar explanation?"
        options: ["Regional name and visual colour, with picking dates in place of cellar records", "Vessel choice and whether malolactic fermentation occurred", "Picking dates and fruit chemistry for the two lots", "Site exposure and grape maturity without the cellar log"]
        correctIndex: 1
        explanation: "DWI describes steel, larger wood and barrique routes for Grauburgunder, including possible biological acid reduction."
        sourceCitationId: src_reg_de_grauburgunder
      ki_reg_de_rheinhessen_silvaner_range:
        prompt: "A restaurant lists an unfamiliar Rheinhessen Silvaner. Which information matters before promising a crisp, unoaked glass?"
        options: ["The producer's vineyard aspect and average slope", "The vintage ripeness and grape analysis at harvest", "The wine's sweetness, vessel and maturation details", "The typical grape profile without that cuvée's cellar record"]
        correctIndex: 2
        explanation: "DWI describes Silvaner from fresh light examples to creamy wood-matured wines; the grape name does not fix the route."
        sourceCitationId: src_reg_de_silvaner
      ki_reg_fe_beaujolais_maturation:
        prompt: "Two Gamay wines share a Beaujolais cru name but differ in structure. Which cellar evidence should be compared first?"
        options: ["The cru name as the extraction record", "The vineyards' exposure and grape maturity at harvest", "The grape material and vine age in each parcel", "Their extraction work and maturation vessels"]
        correctIndex: 3
        explanation: "Inter Beaujolais describes variable extraction practices and maturation in vats, casks or barrels."
        sourceCitationId: src_reg_fe_beaujolais_work
      ki_reg_fe_beaujolais_pressing:
        prompt: "A Beaujolais producer presses a carbonic-style Gamay lot earlier than a comparison lot. What style effect is plausible?"
        options: ["Lower phenolic extraction with a more supple, fruit-led tannin profile", "Higher tannin because pressing leaves juice against the skins for longer", "Similar tannin because fermentation temperature dominates the result", "Lower fruit aroma because a shorter maceration gives yeast less time"]
        correctIndex: 0
        explanation: "IFV explains how pressing time in carbonic maceration affects extraction; earlier separation can support a supple style."
        sourceCitationId: src_reg_fe_carbonic
      ki_reg_fm_bandol_structure:
        prompt: "A pale Bandol rosé is described as structured. Which response best reconciles colour with palate?"
        options: ["Pale colour suggests a very light, thin palate", "Direct pressing can yield a pale wine without fixing its body", "Its structure proves the wine was fermented as a red", "A darker colour would establish Mourvèdre dominance and a firmly tannic palate"]
        correctIndex: 1
        explanation: "The Bandol growers describe pale direct-pressed rosé with structure; appearance and palate must be judged separately."
        sourceCitationId: src_reg_fm_bandol_styles
      ki_reg_fm_maury_structure:
        prompt: "A Maury Sec buyer sees a regional description of dark fruit and tannin. What additional evidence is needed before buying for ageing?"
        options: ["The regional name, with maturation treated as a minor detail", "The harvest year and site exposure without a sample or cellar record", "The actual wine's balance, extraction and maturation record", "A standard oak estimate taken from another Maury Sec"]
        correctIndex: 2
        explanation: "CIVR gives a regional style profile but notes maturation influence; individual balance cannot be inferred from the name."
        sourceCitationId: src_reg_fm_maury_sec
      ki_reg_fr_chablis_quality:
        prompt: "Two Chablis wines share an origin and vessel type, yet one is faulty. Which judgment is defensible?"
        options: ["The shared origin points to an identical hygiene history", "The same vessel guarantees equal protection from faults", "The regional name and a neutral vessel establish quality before the wine is tasted", "Fruit condition, hygiene and vinification still affect quality"]
        correctIndex: 3
        explanation: "The Chablis wine board treats fruit and cellar handling as part of producing sound wine; origin and vessel alone are insufficient."
        sourceCitationId: src_reg_fr_chablis_cellar
      ki_reg_fs_savennieres_dry:
        prompt: "A Chenin lot from well-exposed Savennières slopes is harvested ripe. Which finished-style claim follows?"
        options: ["It may make dry wine; finished sweetness needs separate evidence", "Full maturity predicts a sweet finish despite complete fermentation of grape sugars", "Well-exposed slopes suggest a fixed off-dry finish", "A ripe harvest can stand in for finished-sugar testing"]
        correctIndex: 0
        explanation: "InterLoire describes predominantly dry Savennières from ripe Chenin, with smaller sweeter styles; ripeness and final sweetness differ."
        sourceCitationId: src_fr_atlas_loire_guide
      ki_reg_gr_agiorgitiko_young:
        prompt: "A Nemea buyer wants an approachable red for early drinking. Which Agiorgitiko brief is a reasonable trial?"
        options: ["Maximise extraction and oak before assessing the fruit", "Preserve fresh red fruit and supple tannin, then taste", "Demand bottle age before judging any Agiorgitiko", "Treat youthful fruit as proof of inferior grapes"]
        correctIndex: 1
        explanation: "Wines of Greece describes a fresh, softer young Agiorgitiko expression alongside more structured styles."
        sourceCitationId: src_reg_gr_agiorgitiko
      ki_reg_gr_naoussa_style_choices:
        prompt: "Two Naoussa Xinomavro samples differ: one is long-macerated and wood-matured, the other fruit-driven. Which comparison is fair?"
        options: ["The wood-matured sample defines the regional style", "The fruit-driven sample deserves a lower score because its oak maturation was shorter", "Cellar choices can change early approachability; taste both", "The same origin makes their maturation choices irrelevant"]
        correctIndex: 2
        explanation: "Wines of Greece describes more austere traditional and earlier approachable fruit-driven Naoussa expressions."
        sourceCitationId: src_reg_gr_naoussa
      ki_reg_gr_nemea_extraction_oak:
        prompt: "GAIA's Nemea Estate red uses extended post-fermentation maceration and new French oak. How should a student use that record?"
        options: ["As the standard production recipe for Nemea", "As evidence that extra new oak reliably improves a wine's balance", "As evidence that regional climate fixes the wine's tannin", "As one producer route to structure and oak influence"]
        correctIndex: 3
        explanation: "GAIA's technical account is a specific producer example; its extraction and oak choices need not describe all Nemea."
        sourceCitationId: src_reg_gr_gaia_estate
      ki_reg_gr_xinomavro_structure:
        prompt: "A relatively pale Xinomavro tastes firm and acidic. Which note risks misreading its structure?"
        options: ["Inferring soft tannin from its relatively pale red colour", "Using the palate's firm tannin as a separate observation", "Comparing its maturation record with the tasted sample", "Recording bright acidity alongside the colour description"]
        correctIndex: 0
        explanation: "Wines of Greece describes Xinomavro as sometimes pale yet firm in tannin and acidity; colour is a weak structure proxy."
        sourceCitationId: src_reg_gr_xinomavro
      ki_reg_ib_montsant_controls:
        prompt: "A Montsant trial matches vine age, harvest maturity and steel vinification across parcels. What can that design support?"
        options: ["Strong proof that soil drove the observed flavour gap", "A more useful comparison with several confounders reduced", "A ranking of Garnatxa and Carinyena across Montsant", "Removal of vineyard and vintage variation from the comparison"]
        correctIndex: 1
        explanation: "The Montsant technical programme used matched conditions to compare sites, while its design cannot isolate every cause."
        sourceCitationId: src_reg_ib_montsant_research
      ki_reg_na_oregon_series_controls:
        prompt: "Cristom compares whole-cluster percentages from one Louise Vineyard harvest with similar oak and maturation. What is the cautious inference?"
        options: ["The observed stem effect transfers across Oregon producers and later vintages", "One tasting series proves a universal stem effect", "Matched records help compare stems, without proving causality", "The matching harvest date resolves the wine-style difference"]
        correctIndex: 2
        explanation: "Cristom reports shared vineyard, harvest and maturation conditions; that strengthens a comparison but is not replicated causal proof."
        sourceCitationId: src_reg_na_cristom_series
      ki_reg_na_slh_chardonnay_range:
        prompt: "A Santa Lucia Highlands Chardonnay label arrives without a production sheet. Which service promise is supportable?"
        options: ["It is probably lean because the regional climate is cool and coastal", "It is probably rich because Chardonnay is grown on these slopes", "Its oak level follows the region's average cellar practice", "Check the actual bottle; the region spans crisp to richer styles"]
        correctIndex: 3
        explanation: "The Santa Lucia Highlands regional body describes a range of Chardonnay expressions rather than one fixed style."
        sourceCitationId: src_reg_na_slh_glass
      ki_reg_sa_leyda_cellar:
        prompt: "Leyda's Garuma Sauvignon Blanc combines whole-bunch pressing with a macerated portion and varied vessels. What does the record show?"
        options: ["Handling and lees or vessel choices can shape a coastal white", "The coastal origin accounts for texture despite the recorded cellar treatments", "Used barrels supply the same flavour as a wholly new-oak regime", "Whole-bunch pressing would prevent later lees maturation"]
        correctIndex: 0
        explanation: "Viña Leyda's 2023 technical sheet documents split fruit handling, steel, used barrels and lees stirring for one wine."
        sourceCitationId: src_reg_sa_leyda_2023
      ki_reg_sa_mendoza_cellar_response:
        prompt: "After a variable Mendoza harvest, a cellar receives lots with different grape analyses. What is a justified production response?"
        options: ["Use the vintage summary to select one extraction schedule for the received lots", "Adjust fermentation and pressing plans to the actual lots", "Apply the longest maceration to the riper parcels first", "Assume early picking alone explains the finished style"]
        correctIndex: 1
        explanation: "Wines of Argentina's harvest report documents producers using grape analyses and adapting fermentation, maceration and press work."
        sourceCitationId: src_reg_sa_mendoza_2020
      ki_reg_sa_mendoza_source_factor:
        prompt: "An INTA Malbec trial varies grape source and yeast. What must a comparison of pH, alcohol and colour consider?"
        options: ["Yeast treatment as the dominant source of measured variation", "A permanent quality ranking of Mendoza subregions", "Both fruit origin and yeast treatment as contributors", "A sensory origin claim based on one unmatched wine"]
        correctIndex: 2
        explanation: "The INTA-led experiment found grape-source differences in measured chemistry while also testing yeast treatments."
        sourceCitationId: src_reg_sa_mendoza_yeast
      ki_reg_sa_mendoza_yeast_factor:
        prompt: "The same INTA Malbec study finds chemistry and fermentation-duration differences among yeast treatments, but no significant sensory-panel separation. Which report is accurate?"
        options: ["The panel proved a preferred flavour for each yeast", "Fermentation duration was unaffected by yeast choice", "Measured chemistry depends principally on grape origin despite yeast treatments", "Yeast affected measured outcomes; sensory claims stay qualified"]
        correctIndex: 3
        explanation: "The INTA-led study reports chemical and duration effects of yeast treatments; descriptive sensory differences were not statistically significant."
        sourceCitationId: src_reg_sa_mendoza_yeast
      ki_wset_apply_alentejo_production:
        prompt: "A ripe Alentejo Aragonez and Alicante Bouschet lot is intended for a fruit-led red. How should cap work be set?"
        options: ["Trial moderate extraction against the lot's tannin and fruit", "Extend cap work until darker colour develops despite the current tannin record", "Delay red-skin contact until after primary fermentation", "Choose a fixed extraction schedule from the region name"]
        correctIndex: 0
        explanation: "AWRI describes skin contact and cap work as extraction controls; observed fruit and tannin should guide this Alentejo lot."
        sourceCitationId: src_win_skin_contact
      ki_wset_apply_levante_white_route:
        prompt: "A Valencia grower supplies sound white grapes for a fresh, aromatic early release. Which first cellar route fits?"
        options: ["Extend skin contact to build a more phenolic white", "Press juice gently away from skins and ferment it cool", "Use warm barrel fermentation for a mature, spiced white", "Keep the crushed white grapes on skins for an amber-style texture"]
        correctIndex: 1
        explanation: "White-juice separation and cool fermentation are a reasonable fresh-white route; the regional origin does not mandate it."
        sourceCitationId: src_win_white_temperature
      ki_wset_apply_niederosterreich_production:
        prompt: "A Niederösterreich Grüner Veltliner lot has a fresh-fruit brief. What trial offers a useful baseline before adding texture?"
        options: ["New barrique fermentation and oxidative handling to build mature spice notes", "Extended skin contact to pursue a phenolic amber-wine style", "Cool neutral-vessel fermentation, then compare separate lees trials", "Warm fermentation and heavy lees stirring for a broader wine"]
        correctIndex: 2
        explanation: "Cool neutral fermentation can preserve fruit; AWRI describes lees as a separate texture variable to trial."
