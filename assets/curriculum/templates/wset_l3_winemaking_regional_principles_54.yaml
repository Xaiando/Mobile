        correctIndex: 0
        explanation: "Cap management changes phenolic extraction; reducing intensity is a sensible trial when measured tannin exceeds the brief."
        sourceCitationId: src_win_temperature
      ki_wset_nwa_canterbury_riesling:
        prompt: "A Canterbury Riesling producer wants two versions from sound fruit: dry and off-dry. What needs a distinct endpoint plan?"
