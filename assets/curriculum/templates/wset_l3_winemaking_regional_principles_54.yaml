        prompt: "A cellar receives Maule Cabernet Sauvignon and Southern Region Riesling. Which handling distinction addresses their different briefs?"
        options: ["Ferment the Riesling on red skins for its white brief", "Separate Cabernet juice from skins before colour develops", "Use identical warm maceration for both fermentations", "Extract Cabernet on skins; press Riesling for white juice"]
