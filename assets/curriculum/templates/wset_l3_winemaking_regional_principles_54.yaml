        correctIndex: 3
        explanation: "AWRI documents lees contact as a cellar variable; Elim's coastal setting does not prescribe it."
        sourceCitationId: src_win_lees
      ki_wset_nwa_elqui_syrah:
        prompt: "An Elqui Syrah tank reaches the desired colour but tannin is already firm. What extraction decision fits a fruit-led brief?"
