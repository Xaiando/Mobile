      ki_wset_nw_goulburn_heat_water:
        prompt: "A Goulburn Valley Shiraz parcel ripens under inland warmth with managed irrigation. What remains a separate cellar decision?"
        options: ["Whether the grapes came from a warm Australian region", "Whether the local rivers have any cooling influence", "How extraction and oak shape the finished red wine", "Whether white grapes can ripen in the warm valley"]
        correctIndex: 2
        explanation: "Wine Australia describes the warm irrigated regional setting; extraction and oak treatment are separate style choices."
        sourceCitationId: src_wset_nw_goulburn
      ki_wset_nw_inland_water_costs:
        prompt: "An inland Australian grower compares irrigation plans for two wine-grape contracts. Which decision record is most useful?"
        options: ["Water use alone, regardless of delivered fruit quality", "The highest possible yield without a cost estimate", "The variety name without price or vineyard inputs", "Water cost, yield, fruit target and contract return"]
        correctIndex: 3
        explanation: "Wine Australia's Murray-Darling benchmarking considers water costs, yields, varieties and management together."
        sourceCitationId: src_wset_nw_au_water_costs
      ki_wset_nw_lodi_style_choices:
        prompt: "Two Lodi Zinfandels differ: one is lighter and fruit-led, the other riper and oak-influenced. What best explains the range?"
        options: ["Vineyard selection and cellar choices can differ", "The Lodi name calls for the same new-oak maturation across both styles", "Old-vine status establishes the final sweetness", "The region alone dictates identical extraction"]
