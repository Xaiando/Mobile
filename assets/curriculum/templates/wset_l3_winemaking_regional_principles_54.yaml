        correctIndex: 1
        explanation: "Ontario's appellation authority requires grapes to freeze naturally on the vine and be pressed while frozen for Icewine."
        sourceCitationId: src_wset_nw_ontario_labels
      ki_wset_nw_worcester_wine_context:
        prompt: "A Worcester cellar handles grapes for both brandy and wine labels. Which production brief should be confirmed first?"
