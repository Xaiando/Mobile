        correctIndex: 2
        explanation: "AWRI describes skin contact as an extraction variable; juice separation suits a fresh-white brief when fruit is sound."
        sourceCitationId: src_win_skin_contact
      ki_wset_nwa_elim_sauvignon:
        prompt: "An Elim Sauvignon Blanc lot has a fresh aromatic brief. Which trial most directly tests an optional lees-texture effect?"
