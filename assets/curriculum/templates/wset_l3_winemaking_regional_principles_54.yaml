      ki_wset_nwa_mendocino_chardonnay:
        prompt: "A Mendocino Chardonnay trial with lees and oak tastes fuller than a neutral-vessel control. What is the cautious explanation?"
        options: ["Maturation choices may affect texture and wood aroma", "The county name by itself caused the toast note", "Oak aroma establishes greater intrinsic grape quality", "Lees contact changes vineyard rainfall after harvest"]
        correctIndex: 0
        explanation: "AWRI describes lees effects on mouthfeel; the item also cites oak-wood research for the wood-aroma contribution."
        sourceCitationId: src_win_lees
      ki_wset_nwa_monterey_chardonnay:
        prompt: "A brisk Monterey Chardonnay is considered for a richer style. Which operation can lower malic acidity?"
        options: ["Cold storage of sealed bottles after release", "A monitored malolactic fermentation trial plan", "A longer label approval period before bottling", "A neutral-vessel alcoholic fermentation alone"]
        correctIndex: 1
        explanation: "AWRI explains that malolactic fermentation converts malic acid; this is a choice, not a Monterey requirement."
        sourceCitationId: src_win_white_mlf
