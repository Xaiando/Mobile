  WSET_L4:
    name: WSET Level 4 Diploma in Wines
    body: Wine & Spirit Education Trust
    source:
      title: WSET Level 4 Diploma in Wines, Specification
      url: https://www.wsetglobal.com/media/17609/wset_l4wines_specification_en_august-2025.pdf
      version: "2025, Issue 1.4"
      checked_on: "2026-09-26"
    # Editorial study groups, not copied learning outcomes or assessment text.
    # Diploma uses existing WSET_L3 mappings through the cumulative track chain.
    # covers measures authored support, never completion of a Diploma unit.
    # DIP-1 through DIP-6 retain the unimplemented depth and assessment work.
