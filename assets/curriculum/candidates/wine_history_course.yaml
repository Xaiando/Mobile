knowledge_items:
  - id: ki_hcourse_evidence_residue
    subject_id: n_hcourse_evidence
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_hcourse_evidence_residue
    domain_id: service
    assertion_text: "The Georgian finds are chemical residues of grape wine in pottery, about 6000–5800 BC. A residue does not show a press, a vat, and storage jars used together, and it does not prove that no older fermented drink exists."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_evidence_later
    subject_id: n_hcourse_evidence
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_hcourse_evidence_later
    domain_id: service
    assertion_text: "Areni-1 is an installation with jars from around 4000 calibrated BCE and malvidin in that production context. It is later than the Georgian residues. It is not the oldest wine merely because the installation is more complete."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_rome_rank
    subject_id: n_hcourse_rome
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_hcourse_rome_rank
    domain_id: service
    assertion_text: "Pliny ranks Falernian as the highest wine of his own day and distinguishes a dry, a sweet, and a light style, with Caucinian, Faustian, and Falernian named by place on the slope. That is one author's ranking, not a modern appellation."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_rome_site
    subject_id: n_hcourse_rome
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_hcourse_rome_site
    domain_id: service
    assertion_text: "Columella says the vine responds to care except in icy cold and burning heat, and that the farmer should match the variety to the place: mist and frost on level ground, drought and wind on a hillside, a slender vine on fat land, a prolific vine on lean land. He treats climate as a stronger influence than the soil choice alone, and he says cuttings from another district are less at home than stock raised on the farm. One vintage does not prove a vine."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_rome_not_law
    subject_id: n_hcourse_rome
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_hcourse_rome_not_law
    domain_id: service
    assertion_text: "Neither Pliny's ranking nor Columella's husbandry fixes a production area, a grape list, a yield, or a minimum strength. Those controls appear in the later French appellation rules and in the EU definition of wine, not in these Roman books."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_commerce_duty
    subject_id: n_hcourse_commerce
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_hcourse_commerce_duty
    domain_id: service
    assertion_text: "The treaty of 27 December 1703 cut the British duty on Portuguese wine to one third below the duty on the same measure of French wine, in peace or war, and admitted British woollen cloth into Portugal. It did not demarcate the Douro and it did not define Port."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_commerce_charter
    subject_id: n_hcourse_commerce
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_hcourse_commerce_charter
    domain_id: service
    assertion_text: "The charter of 10 September 1756 created a company to control Douro quality and prices and to demarcate vineyards. Chianti in 1716 and Tokaj in 1737 are earlier delimited zones on the Portuguese monuments inventory, so 1756 is not the first vineyard line, and the charter is not today's boundary."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_names_blockade
    subject_id: n_hcourse_names
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_hcourse_names_blockade
    domain_id: service
    assertion_text: "Napoleon I's Berlin Decree of 21 November 1806 blockaded the British Isles and banned commerce with them. It is not a wine classification."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_names_list
    subject_id: n_hcourse_names
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_hcourse_names_list
    domain_id: service
    assertion_text: "The 1855 ranking was requested by Napoleon III. Brokers used reputation and recent prices. It covers Médoc reds, Haut-Brion, and Sauternes and Barsac. It does not cover Saint-Émilion or Pomerol, and it was not commissioned by Napoleon I."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_names_age
    subject_id: n_hcourse_names
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_hcourse_names_age
    domain_id: service
    assertion_text: "On the BNIC list, Napoleon on a Cognac is an ageing mention of at least six years, counted on the youngest eau-de-vie. It is not Napoleon I, not Napoleon III, and not the 1855 classification."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_sparkling_paper
    subject_id: n_hcourse_sparkling
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_hcourse_sparkling_paper
    domain_id: service
    assertion_text: "On 17 December 1662 Merrett described English wine-coopers adding sugar and molasses to make wine brisk and sparkling. That is a production note. It is not a distillation method and it is not a claim that no one else ever made a wine referment."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_sparkling_myth
    subject_id: n_hcourse_sparkling
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_hcourse_sparkling_myth
    domain_id: service
    assertion_text: "Pérignon became cellar master at Hautvillers after Merrett's paper. The Royal College of Physicians account says his task included preventing bubbles. That account does not make him the inventor of the method in the 1662 paper, and the stars slogan is not in that paper."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_phylloxera_root
    subject_id: n_hcourse_phylloxera
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_hcourse_phylloxera_root
    domain_id: service
    assertion_text: "Phylloxera feeds on the roots of Vitis vinifera and can stunt or kill the vine. The opened University of California page treats resistant American rootstocks, including Vitis riparia, Vitis rupestris, and their hybrids, as the effective control, and it does not treat insecticides as a complete remedy."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_phylloxera_limit
    subject_id: n_hcourse_phylloxera
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_hcourse_phylloxera_limit
    domain_id: service
    assertion_text: "The University of California page does not date the European epidemic. Do not take a year from that page or from memory. A separate INRAE page does state a French range, and that range is its own item, with the over-broad clause in the same sentence left untaught as a count."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_modern_aoc
    subject_id: n_hcourse_modern
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_hcourse_modern_aoc
    domain_id: service
    assertion_text: "The French wine code as published for 25 November 1967 ties controlled appellations for wines and eaux-de-vie to the decree of 30 July 1935. The stated conditions include area, grapes, yield per hectare, a minimum strength from vinification without enrichment, and methods of growing and making. A controlled name is not a promise that every bottle tastes the same. EU wine, in the 18 March 2026 consolidation of Regulation 1308/2013, is the alcoholic fermentation of fresh grapes or grape must, not a distillate."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_modern_ban
    subject_id: n_hcourse_modern
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_hcourse_modern_ban
    domain_id: service
    assertion_text: "US national Prohibition took effect on 16 January 1920 and the Twenty-first Amendment repealed the Eighteenth on 5 December 1933. Repeal restored a legal trade. It did not enact a quality classification, and section 2 still lets a state bar transport of intoxicating liquor into that state."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_modern_tasting
    subject_id: n_hcourse_modern
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_hcourse_modern_tasting
    domain_id: service
    assertion_text: "On 24 May 1976 a blind tasting in Paris placed the 1973 Chateau Montelena Chardonnay and the 1973 Stag's Leap Wine Cellars S.L.V. Cabernet first in their groups. That result does not rewrite appellation law, does not explain Prohibition, and is not a permanent ranking of every wine."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_case_oldest_action
    subject_id: n_hcourse_case_oldest
    relation_type: CASE_ACTION
    object_id: n_hcourse_case_oldest_action
    domain_id: service
    assertion_text: "Tell the guest that Georgia is the older chemical evidence and that Areni-1 is a later production installation. Do not answer with a single oldest wine."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_case_oldest_reason
    subject_id: n_hcourse_case_oldest
    relation_type: CASE_REASON
    object_id: n_hcourse_case_oldest_reason
    domain_id: service
    assertion_text: "The Georgian paper reports residues about 6000–5800 BC. The Areni paper reports installations around 4000 calibrated BCE. The dates and the kinds of evidence are both different."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_case_oldest_tradeoff
    subject_id: n_hcourse_case_oldest
    relation_type: CASE_TRADEOFF
    object_id: n_hcourse_case_oldest_tradeoff
    domain_id: service
    assertion_text: "A shorter reply is easier for the guest, but collapsing the two papers teaches the misconception the question was meant to correct."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_case_oldest_limit
    subject_id: n_hcourse_case_oldest
    relation_type: CASE_LIMITATION
    object_id: n_hcourse_case_oldest_limit
    domain_id: service
    assertion_text: "Neither paper proves that no older grape wine will be found. The reply is about the evidence in hand, not a final history of fermentation."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_case_napoleon_action
    subject_id: n_hcourse_case_napoleon
    relation_type: CASE_ACTION
    object_id: n_hcourse_case_napoleon_action
    domain_id: service
    assertion_text: "Ask which Napoleon the guest means, then match it: the 1806 blockade, the 1855 ranking, or the Cognac age mention of at least six years."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_case_napoleon_reason
    subject_id: n_hcourse_case_napoleon
    relation_type: CASE_REASON
    object_id: n_hcourse_case_napoleon_reason
    domain_id: service
    assertion_text: "The three uses have different dates, different actors, and different jobs. Treating them as one event answers a question the guest did not separate."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_case_napoleon_tradeoff
    subject_id: n_hcourse_case_napoleon
    relation_type: CASE_TRADEOFF
    object_id: n_hcourse_case_napoleon_tradeoff
    domain_id: service
    assertion_text: "Stopping to split the name slows service, but a single answer will be wrong for at least two of the three uses."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_case_napoleon_limit
    subject_id: n_hcourse_case_napoleon
    relation_type: CASE_LIMITATION
    object_id: n_hcourse_case_napoleon_limit
    domain_id: service
    assertion_text: "Knowing that Cognac Napoleon means at least six years does not authenticate the bottle, the house, or the vintage."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_case_boundary_action
    subject_id: n_hcourse_case_boundary
    relation_type: CASE_ACTION
    object_id: n_hcourse_case_boundary_action
    domain_id: service
    assertion_text: "Correct the guest: the 1703 treaty is a British duty preference, and the 1756 charter is the Douro company demarcation."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_case_boundary_reason
    subject_id: n_hcourse_case_boundary
    relation_type: CASE_REASON
    object_id: n_hcourse_case_boundary_reason
    domain_id: service
    assertion_text: "A lower customs rate can shift trade without mapping vineyards. A demarcation company is a later and different instrument."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_case_boundary_tradeoff
    subject_id: n_hcourse_case_boundary
    relation_type: CASE_TRADEOFF
    object_id: n_hcourse_case_boundary_tradeoff
    domain_id: service
    assertion_text: "Calling 1756 the first regulated Douro company can be defended from the charter. Calling it the first vineyard line cannot, because Chianti 1716 and Tokaj 1737 are earlier delimited zones on the inventory used here."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_case_boundary_limit
    subject_id: n_hcourse_case_boundary
    relation_type: CASE_LIMITATION
    object_id: n_hcourse_case_boundary_limit
    domain_id: service
    assertion_text: "Neither document fixes the modern Douro boundary or the modern definition of Port."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_case_bubble_action
    subject_id: n_hcourse_case_bubble
    relation_type: CASE_ACTION
    object_id: n_hcourse_case_bubble_action
    domain_id: service
    assertion_text: "Do not credit Pérignon with inventing the sugared sparkling method Merrett described in 1662. Say the inventor story is later than that paper and is not what the college account of his task supports."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_case_bubble_reason
    subject_id: n_hcourse_case_bubble
    relation_type: CASE_REASON
    object_id: n_hcourse_case_bubble_reason
    domain_id: service
    assertion_text: "The dated paper is 17 December 1662. Pérignon's appointment is later. The college account says the task included preventing bubbles."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_case_bubble_tradeoff
    subject_id: n_hcourse_case_bubble
    relation_type: CASE_TRADEOFF
    object_id: n_hcourse_case_bubble_tradeoff
    domain_id: service
    assertion_text: "He can still be discussed as a cellar master. That is a different claim from inventing the sparkling method."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_case_bubble_limit
    subject_id: n_hcourse_case_bubble
    relation_type: CASE_LIMITATION
    object_id: n_hcourse_case_bubble_limit
    domain_id: service
    assertion_text: "This correction uses the 1662 paper and one institutional history. It does not survey every French archive, and it does not say no one in Champagne worked on bubbles."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true

  - id: ki_hcourse_phylloxera_year
    subject_id: n_hcourse_phylloxera
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_hcourse_phylloxera_year
    domain_id: service
    assertion_text: "An INRAE encyclopaedia page, published 27 April 2021 and modified 22 May 2024, says that between 1863 and 1893 the insect destroyed a very large part of the French vineyard. The same sentence also says this caused the disappearance of European grape varieties and vineyards. Do not teach that second clause as a count. The page hedges the introduction with the words it seems, and it names Vitis riparia. It calls grafting Vitis vinifera onto American rootstocks one solution, names sandy soil as another, and says chemical control has little or no effect. It does not give a spray programme. This range is not the University of California page, which still has no year."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_case_phylloxera_action
    subject_id: n_hcourse_case_phylloxera
    relation_type: CASE_ACTION
    object_id: n_hcourse_case_phylloxera_action
    domain_id: service
    assertion_text: "Do not let the guest leave with 1863 as the year every European vine died. Give the INRAE range for a very large part of the French vineyard, and refuse the disappearance clause as a census."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_case_phylloxera_reason
    subject_id: n_hcourse_case_phylloxera
    relation_type: CASE_REASON
    object_id: n_hcourse_case_phylloxera_reason
    domain_id: service
    assertion_text: "The range and the disappearance clause are one sentence. Quoting the date without the limit repeats the page's over-wide claim as if it had been measured."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_case_phylloxera_tradeoff
    subject_id: n_hcourse_case_phylloxera
    relation_type: CASE_TRADEOFF
    object_id: n_hcourse_case_phylloxera_tradeoff
    domain_id: service
    assertion_text: "1863 to 1893 can be taught as that page's French range. Grafting onto American rootstocks remains the control already supported by the California page. Sandy soil is this INRAE page's other stated solution, not a planting plan."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_case_phylloxera_limit
    subject_id: n_hcourse_case_phylloxera
    relation_type: CASE_LIMITATION
    object_id: n_hcourse_case_phylloxera_limit
    domain_id: service
    assertion_text: "One encyclopaedia page is not a census and not every history of the outbreak. The introduction is hedged. A press release that gives a different fraction was not opened for this item. The California page still contributes no year."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true

