# Thresholds for each track and domain, as a count or a share of the
# metric's base (the items, or the core items for a core_ metric). The
# report shows them now; the release gate (R3) enforces them (COV-3,
# stage 3). The numbers are provisional (COV-4).
thresholds:
  all:
    core_flashcard_only: { max: 0 }
    core_useful_practice: { min: 90% }
  domains:
    viticulture:
      core_reasoning: { min: 50% }
    winemaking:
      core_reasoning: { min: 50% }
    service:
      core_reasoning: { min: 50% }
    tasting:
      core_reasoning: { min: 50% }
