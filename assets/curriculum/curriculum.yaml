  - { relation_type: HAS_SOIL, subject_node_type: appellation, object_node_type: soil }
  - { relation_type: HAS_CLIMATE, subject_node_type: appellation, object_node_type: climate }
  - { relation_type: SUSCEPTIBLE_TO, subject_node_type: appellation, object_node_type: hazard }
