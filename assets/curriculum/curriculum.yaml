# Sommelier curriculum dataset: the manifest of one release, in the
# canonical format of docs/domain-model.md §7.
#
# A release is split into files (architecture audit DL-4): one per area under
# areas/, and one per question format under templates/. Each section is named
# after its table and each key is a column. A section may appear in several
# files; a row's key is unique across them. Ingestion computes name_norm, one
# checksum over every file, and the generated tables (questions and their
# distractors). User data never appears here. Expert reviews are recorded in
# reviews/, which the app does not bundle (tool/curriculum/verify.dart).
#
# Content rules (docs/architecture-audit.md §11: D3 and D10):
# - Every fact comes from a public primary legal text, is cited per item, and
#   stays `unverified` (the default) until a qualified reviewer checks it.
# - Where INAO's homologated text could not be downloaded, the facts were
#   read in the version published for the national opposition procedure.
#   The reviewer confirms them against the homologated text.
# - valid_from 1900-01-01 means the effective date is not curated yet. The
#   fact is treated as in force.
# - Certification mappings are editorial study-planning judgements. They
#   never reproduce syllabus text (CM-7).
# - mcq_disabled marks items whose wrong answers could be defensible, e.g.
#   overlapping climate types.
# - Any change to any file of the release needs a new dataset_version.

dataset_version: "0.7.0"
published_at: "2026-09-26T23:00:00.000Z"

includes:
  - areas/foundations.yaml
  - areas/principles.yaml
  - areas/grapes.yaml
  - areas/france.yaml
  - areas/italy.yaml
  - areas/tasting.yaml
  - areas/geography.yaml
  - templates/flashcard.yaml
  - templates/mcq.yaml
  - templates/map.yaml
  - templates/typed.yaml
  - templates/short_answer.yaml

# The map layers and node geometries, generated by tool/geography (backlog
# G1). Ingestion checks each layer's asset against its SHA-256 (G2).
geography: ../geography/manifest.yaml
