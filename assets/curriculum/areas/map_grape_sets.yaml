# Complete legal grape unions used by map_grape to establish wrong answers.
# Every variety in each cited list has a current PERMITS_GRAPE edge.
# Existing positive grape facts alone do not establish completeness.
#
# No Austrian DAC assertion is made here: Weinviertel, Mittelburgenland and
# Kamptal tolerate up to 15% other quality-wine varieties, so their named
# headline varieties are not the complete legal union.
# No Santorini assertion is made: Vinsanto permits further minor varieties
# beyond Assyrtiko, Aidani, Athiri and Muscat Blanc a Petits Grains.

