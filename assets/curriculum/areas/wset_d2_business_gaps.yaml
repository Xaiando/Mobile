# Original Diploma D2 principles for three explicit 2025-syllabus gaps.
# Curation is not qualified expert verification. Prices in practice are hypothetical.
knowledge_nodes:
  - id: n_d2_supply_demand_shift
    node_type: production_principle
    name: How can a change in market supply affect wine price if demand is unchanged?
  - id: n_d2_supply_demand_shift_point
    node_type: learning_point
    name: A smaller supply tends to raise equilibrium price, subject to conditions
  - id: n_d2_import_cost_stack
    node_type: production_principle
    name: Why is an imported wine's producer quote not its complete route-to-sale cost?
  - id: n_d2_import_cost_stack_point
    node_type: learning_point
    name: Check transport, applicable duties and tax treatment, handling and route margins
  - id: n_d2_marketing_mix
    node_type: production_principle
    name: How should the five marketing Ps serve a target wine customer?
  - id: n_d2_marketing_mix_point
    node_type: learning_point
    name: Coordinate product, price, place, people and promotion around the objective
