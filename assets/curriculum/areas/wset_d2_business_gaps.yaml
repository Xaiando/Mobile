knowledge_items:
  - id: ki_d2_supply_demand_shift
    subject_id: n_d2_supply_demand_shift
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d2_supply_demand_shift_point
    domain_id: business
    assertion_text: With demand and other conditions held constant, a decrease in market supply tends to increase the equilibrium price; the size of a harvest alone cannot establish an exact price or a producer's realised return.
    verification_status: unverified
    last_verified_at: 2026-09-29T10:00:00.000Z
    mcq_disabled: true
  - id: ki_d2_import_cost_stack
    subject_id: n_d2_import_cost_stack
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d2_import_cost_stack_point
    domain_id: business
    assertion_text: An imported wine's producer quote omits route costs and may omit applicable duties and tax accounting. In the UK example, alcohol duty and customs/VAT procedures must be checked for the product, origin, route and date; recoverable VAT is not automatically a permanent unit cost.
    verification_status: unverified
    last_verified_at: 2026-09-29T10:00:00.000Z
    mcq_disabled: true
  - id: ki_d2_marketing_mix
    subject_id: n_d2_marketing_mix
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d2_marketing_mix_point
    domain_id: business
    assertion_text: The five marketing Ps are product, price, place, people and promotion. A wine business should coordinate these choices with its target customer and objective; promotion alone cannot correct a mismatched offer or channel.
    verification_status: unverified
    last_verified_at: 2026-09-29T10:00:00.000Z
    mcq_disabled: true
