knowledge_items:
  - id: ki_cms_beer_mash
    subject_id: n_cms_beer_brewhouse
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_beer_mash
    domain_id: service
    assertion_text: "In a basic malt-brewing sequence, crushed malt and warm water are mixed in a mash tun. Malt enzymes convert grain starch into sugars. A mash tun is not the vessel where yeast makes alcohol."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_beer_wort
    subject_id: n_cms_beer_brewhouse
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_beer_wort
    domain_id: service
    assertion_text: "The sweet liquid separated from spent grain is wort. It goes to the brew kettle, traditionally called a copper, where it is boiled before cooling and yeast fermentation. Brewers may use other process designs, so this is a teaching sequence, not one mandatory plant layout."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_beer_hops
    subject_id: n_cms_beer_brewhouse
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_beer_hops
    domain_id: service
    assertion_text: "Hops added at different points in the kettle boil can contribute bitterness, flavour and aroma. A hop name or a bitterness number alone does not prove how a particular beer tastes; assess the finished beer."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_beer_hop_types
    subject_id: n_cms_beer_brewhouse
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_beer_hop_types
    domain_id: service
    assertion_text: "Saaz, a Czech aroma variety, is described by hop merchant BarthHaas as mild with spicy and woody notes; Cascade, bred in the United States, is described as fruitier and citrus-like. Variety profile is a useful clue, but crop year, product form and timing of the hop addition still affect the finished beer."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_beer_yeast
    subject_id: n_cms_beer_brewhouse
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_beer_yeast
    domain_id: service
    assertion_text: "After wort has cooled, brewer's yeast converts fermentable sugars into alcohol and carbon dioxide. Ale and lager yeast are common broad groups; the recipe, handling and fermentation conditions also affect the final beer."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_beer_ale_lager
    subject_id: n_cms_beer_style_compare
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_beer_ale_lager
    domain_id: service
    assertion_text: "Ale and lager are broad fermentation traditions, not a colour or quality ranking. The American Homebrewers Association lists porter and stout among common ale-yeast styles, and Pilsner and Bock among common lager-yeast styles; those examples do not define every beer."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_beer_porter_stout
    subject_id: n_cms_beer_style_compare
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_beer_porter_stout
    domain_id: service
    assertion_text: "In BJCP's reference descriptions, English Porter is dark brown and can show chocolate, caramel and restrained roast. Irish Stout is usually black with more pronounced coffee-like roast and can finish dry and bitter. Historical and commercial versions vary; neither word by itself tells you the exact flavour."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_beer_wheat_fruit
    subject_id: n_cms_beer_style_compare
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_beer_wheat_fruit
    domain_id: service
    assertion_text: "BJCP describes German Weissbier as a wheat beer with banana-and-clove yeast character, while Belgian Witbier is often spiced with coriander and orange peel. 'Fruit beer' is a broad family: check the base beer and fruit ingredient rather than assuming all fruit beers are sweet or sour."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_beer_cask_live
    subject_id: n_cms_beer_condition
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_beer_cask_live
    domain_id: service
    assertion_text: "CAMRA describes cask-conditioned beer as a living beer that continues to develop condition with yeast in the pub cellar and is served without injected carbon dioxide. Its gently carbonated service needs stable cellar temperature, undisturbed cask storage and clean lines. Cask beer is not simply any beer poured from a barrel."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_beer_cask_terms
    subject_id: n_cms_beer_condition
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_beer_cask_terms
    domain_id: service
    assertion_text: "Stillage is the frame on which a cask rests while conditioning or serving, according to CAMRA's glossary. Venting opens the cask's shive to manage condition, while tapping inserts a tap through the keystone for dispense. These are different tasks and their exact timing depends on the cask and cellar; do not treat a glossary as a universal schedule."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_beer_package
    subject_id: n_cms_beer_condition
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_beer_package
    domain_id: service
    assertion_text: "Beer may be conditioned by live yeast in a package or cask, or stabilised through processes such as pasteurisation or sterile filtration. A can, bottle or keg does not by itself prove pasteurisation, and package conditioning must be controlled to avoid excess pressure."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_cider_apples
    subject_id: n_cms_cider_process
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_cider_apples
    domain_id: service
    assertion_text: "Cider apples can be selected for different sugar, acidity and tannin contributions. BJCP describes bittersweet and bittersharp apples in many traditional English and French cider styles, while other cider styles may use table or heirloom apples. A named apple type does not by itself set the finished cider's sweetness."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_cider_press
    subject_id: n_cms_cider_process
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_cider_press
    domain_id: service
    assertion_text: "The National Association of Cider Makers describes sorting, washing, milling and pressing ripe apples, then fermenting their sugar-rich juice with wild or selected yeast. It also describes blending and packaging. This is a common production outline, not a guarantee that every maker uses the same fruit source, yeast or packaging method."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_cider_practice
    subject_id: n_cms_cider_process
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_cider_practice
    domain_id: service
    assertion_text: "The National Association of Cider Makers describes fresh apples being milled and pressed, and notes that some traditional ciders stay hazy while many products are filtered. UK HMRC guidance also permits concentrated or reconstituted apple or pear juice under its cider rules. These are different production options: neither haze nor a can proves a traditional or a concentrate-based recipe, and UK rules are not worldwide definitions."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_cider_style
    subject_id: n_cms_cider_process
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_cider_style
    domain_id: service
    assertion_text: "Cider and pear perry are fermented-fruit drinks. The BJCP 2025 style framework asks judges to consider sweetness and carbonation as separate attributes, and includes traditional, strong and specialty ciders as well as perry. These are judging categories, not legal names or a claim that every cider is sweet or sparkling."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_belgian_wit
    subject_id: n_cms_belgian_styles
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_belgian_wit
    domain_id: service
    assertion_text: "BJCP's Belgian Witbier reference is a pale, hazy wheat beer whose yeast character is complemented by subtle spice and citrus; coriander and orange peel are typical ingredients. It contrasts with German Weissbier's prominent banana-and-clove yeast character. Those are style guides, not legal composition tests."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_belgian_dubbel_tripel
    subject_id: n_cms_belgian_styles
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_belgian_dubbel_tripel
    domain_id: service
    assertion_text: "In BJCP's Belgian reference styles, Dubbel is a deep reddish-copper to dark ale with rich dark-fruit and malty notes, while Tripel is a strong pale ale with spicy-fruity aromatics, firmer bitterness and a dry finish. The names are not a simple two-times/three-times alcohol formula; compare the actual labelled beer."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_belgian_saison
    subject_id: n_cms_belgian_styles
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_belgian_saison
    domain_id: service
    assertion_text: "The BJCP Saison reference describes a highly attenuated, dry, refreshing Belgian ale with fruity and peppery yeast character, often with moderate bitterness. Saison can vary in colour and strength; one label cannot promise the same flavour for every producer."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_beer_food_intensity
    subject_id: n_cms_beer_food
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_beer_food_intensity
    domain_id: service
    assertion_text: "The Brewers Association's beer-and-food guide starts with the flavour intensity of both beer and food. A subtle dish can be overwhelmed by a forceful beer, while a mild beer can disappear beside a strongly flavoured dish. Intensity is a starting test, not a fixed style prescription."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_beer_food_link
    subject_id: n_cms_beer_food
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_beer_food_link
    domain_id: service
    assertion_text: "The Brewers Association guide asks for both complementary flavour links and useful contrasts such as carbonation or bitterness against richness. A match should explain which feature matters in the finished dish and the chosen beer, rather than relying on colour or a memorised style pairing alone."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_beer_food_trial
    subject_id: n_cms_beer_food
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_beer_food_trial
    domain_id: service
    assertion_text: "Beer-and-food pairings in a guide are suggestions, not absolute rules. Ask about the guest's preference and the finished plate, then taste the actual beer if possible; spice, sauce, sweetness and bitterness can change the result."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_beer_case_cask_action
    subject_id: n_cms_beer_case_cask
    relation_type: CASE_ACTION
    object_id: n_cms_beer_case_cask_action
    domain_id: service
    assertion_text: "Check the cask's cellar condition and local service procedure before offering it. If it is not settled or service-ready, let it rest and tell the guest when the team expects a quality check."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_beer_case_cask_reason
    subject_id: n_cms_beer_case_cask
    relation_type: CASE_REASON
    object_id: n_cms_beer_case_cask_reason
    domain_id: service
    assertion_text: "CAMRA describes cask beer developing condition with live yeast in the cellar and recommends steady temperature and an undisturbed cask. A newly handled cask is not made ready simply by attaching a tap."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_beer_case_cask_tradeoff
    subject_id: n_cms_beer_case_cask
    relation_type: CASE_TRADEOFF
    object_id: n_cms_beer_case_cask_tradeoff
    domain_id: service
    assertion_text: "Offer a suitable packaged beer while the cask is checked. The replacement may have different carbonation and flavour; describe that difference rather than presenting it as the same product."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_beer_case_cask_limit
    subject_id: n_cms_beer_case_cask
    relation_type: CASE_LIMITATION
    object_id: n_cms_beer_case_cask_limit
    domain_id: service
    assertion_text: "A general cask guide does not set a universal ready-to-serve time. Staff must check the actual cask, temperature, clarity and service method and follow local safety and cellar procedure."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_beer_case_pair_action
    subject_id: n_cms_beer_case_pair
    relation_type: CASE_ACTION
    object_id: n_cms_beer_case_pair_action
    domain_id: service
    assertion_text: "Ask how hot and rich the curry is, then trial a beer with enough flavour to remain present; a wheat beer or a suitably fruity ale could be candidates if available. State the choice as a test, not the one correct style."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_beer_case_pair_reason
    subject_id: n_cms_beer_case_pair
    relation_type: CASE_REASON
    object_id: n_cms_beer_case_pair_reason
    domain_id: service
    assertion_text: "The Brewers Association's pairing guide asks for comparable impact and a complement or contrast. Here, the beer must hold up to the curry and might offer refreshing carbonation or a flavour link. The precise dish and beer were not tested by that guide."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_beer_case_pair_tradeoff
    subject_id: n_cms_beer_case_pair
    relation_type: CASE_TRADEOFF
    object_id: n_cms_beer_case_pair_tradeoff
    domain_id: service
    assertion_text: "Another beer may balance the dish differently: sweetness, bitterness, carbonation and the guest's tolerance for heat matter. The guide's suggested style examples are options, not an unconditional ranking."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_beer_case_pair_limit
    subject_id: n_cms_beer_case_pair
    relation_type: CASE_LIMITATION
    object_id: n_cms_beer_case_pair_limit
    domain_id: service
    assertion_text: "The exact curry, spice level and beer were not evaluated together in the cited guide. Ask the guest's preference and, where possible, taste the finished pairing before making a confident recommendation."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_beer_case_belgian_action
    subject_id: n_cms_beer_case_belgian
    relation_type: CASE_ACTION
    object_id: n_cms_beer_case_belgian_action
    domain_id: service
    assertion_text: "Explain that Dubbel and Tripel are different Belgian reference styles, then compare the offered bottles' colour, flavour and label. Do not re-label a dark Dubbel as a Tripel simply because its alcohol is high."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_beer_case_belgian_reason
    subject_id: n_cms_beer_case_belgian
    relation_type: CASE_REASON
    object_id: n_cms_beer_case_belgian_reason
    domain_id: service
    assertion_text: "BJCP describes Dubbel as dark and rich in malt and dark-fruit impressions, and Tripel as strong, pale, fruity-spicy and relatively dry with firmer bitterness. These profiles explain the distinction better than the names' numbers."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_beer_case_belgian_tradeoff
    subject_id: n_cms_beer_case_belgian
    relation_type: CASE_TRADEOFF
    object_id: n_cms_beer_case_belgian_tradeoff
    domain_id: service
    assertion_text: "If the guest mainly wants strength rather than a named style, discuss the actual beers and preferences. Alcohol content alone does not express the expected malt, fruit, spice or bitterness profile."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_beer_case_belgian_limit
    subject_id: n_cms_beer_case_belgian
    relation_type: CASE_LIMITATION
    object_id: n_cms_beer_case_belgian_limit
    domain_id: service
    assertion_text: "BJCP is a competition reference, not a legal certification of every beer. Verify the producer's description and the poured beer before promising an exact flavour or strength."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"

