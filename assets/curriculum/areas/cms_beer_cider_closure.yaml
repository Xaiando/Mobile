# CMS Europe 2026/27 Introductory and Certified beer/cider scope.
# Competition style descriptions are reference vocabulary, not law or guarantees
# about an individual product. These CMS-only facts remain expert-unverified.
knowledge_nodes:
  - { id: n_cms_beer_brewhouse, node_type: production_principle, name: "How do mash, wort, kettle, hops and yeast fit together?" }
  - { id: n_cms_beer_mash, node_type: learning_point, name: "Mashing releases fermentable sugars from malt" }
  - { id: n_cms_beer_wort, node_type: learning_point, name: "Wort is the liquid before yeast fermentation" }
  - { id: n_cms_beer_hops, node_type: learning_point, name: "Hop addition can contribute bitterness, flavour and aroma" }
  - { id: n_cms_beer_hop_types, node_type: learning_point, name: "Saaz and Cascade illustrate different hop-variety aroma profiles" }
  - { id: n_cms_beer_yeast, node_type: learning_point, name: "Yeast converts wort sugars to alcohol and carbon dioxide" }
  - { id: n_cms_beer_style_compare, node_type: production_principle, name: "How do common beer style names guide a first comparison?" }
  - { id: n_cms_beer_ale_lager, node_type: learning_point, name: "Ale and lager name different fermentation traditions" }
  - { id: n_cms_beer_porter_stout, node_type: learning_point, name: "Porter and stout can both be dark, but their reference profiles differ" }
  - { id: n_cms_beer_wheat_fruit, node_type: learning_point, name: "Wheat and fruit beers require a closer style and label check" }
  - { id: n_cms_beer_condition, node_type: production_principle, name: "What do packaged-beer conditioning and cask handling mean?" }
  - { id: n_cms_beer_cask_live, node_type: learning_point, name: "Cask-conditioned beer develops in cask with live yeast" }
  - { id: n_cms_beer_cask_terms, node_type: learning_point, name: "Stillage, venting and tapping name different cask tasks" }
  - { id: n_cms_beer_package, node_type: learning_point, name: "Pasteurisation, filtration and live conditioning are distinct choices" }
  - { id: n_cms_cider_process, node_type: production_principle, name: "How are cider and perry made and distinguished?" }
  - { id: n_cms_cider_apples, node_type: learning_point, name: "Apple sugar, acid and tannin varieties affect cider balance" }
  - { id: n_cms_cider_press, node_type: learning_point, name: "Apple pressing precedes juice fermentation" }
  - { id: n_cms_cider_practice, node_type: learning_point, name: "Fresh-pressed, concentrated and filtered practices must be distinguished" }
  - { id: n_cms_cider_style, node_type: learning_point, name: "Cider and perry can vary in sweetness and carbonation" }
  - { id: n_cms_belgian_styles, node_type: production_principle, name: "How can Belgian specialty beer styles be compared?" }
  - { id: n_cms_belgian_wit, node_type: learning_point, name: "Witbier is a pale hazy spiced wheat-beer reference style" }
  - { id: n_cms_belgian_dubbel_tripel, node_type: learning_point, name: "Dubbel and tripel differ in colour and flavour balance, not only a number" }
  - { id: n_cms_belgian_saison, node_type: learning_point, name: "Saison is a dry and expressive Belgian ale reference style" }
  - { id: n_cms_beer_food, node_type: production_principle, name: "How should a Certified candidate reason through beer and food?" }
  - { id: n_cms_beer_food_intensity, node_type: learning_point, name: "Compare flavour intensity before proposing a beer" }
  - { id: n_cms_beer_food_link, node_type: learning_point, name: "Look for a complement and a useful contrast" }
  - { id: n_cms_beer_food_trial, node_type: learning_point, name: "Test the finished dish and the specific beer" }
  - { id: n_cms_beer_case_cask, node_type: production_case, name: "A new cask is offered for immediate service while unsettled" }
  - { id: n_cms_beer_case_cask_action, node_type: learning_point, name: "Check cellar condition and allow the cask to settle" }
  - { id: n_cms_beer_case_cask_reason, node_type: learning_point, name: "Live cask beer develops condition in the cellar" }
  - { id: n_cms_beer_case_cask_tradeoff, node_type: learning_point, name: "A packaged beer can cover service while the cask settles" }
  - { id: n_cms_beer_case_cask_limit, node_type: learning_point, name: "Do not infer a safe serving time from a general guide" }
  - { id: n_cms_beer_case_pair, node_type: production_case, name: "A guest wants beer with a strongly spiced curry" }
  - { id: n_cms_beer_case_pair_action, node_type: learning_point, name: "Trial a beer with enough flavour to accompany the dish" }
  - { id: n_cms_beer_case_pair_reason, node_type: learning_point, name: "Intensity and complement-or-contrast are pairing tests" }
  - { id: n_cms_beer_case_pair_tradeoff, node_type: learning_point, name: "Different bitterness and sweetness levels change the match" }
  - { id: n_cms_beer_case_pair_limit, node_type: learning_point, name: "Ask about heat level and taste the actual beer" }
  - { id: n_cms_beer_case_belgian, node_type: production_case, name: "A guest calls a dark Dubbel a Tripel because it is strong" }
  - { id: n_cms_beer_case_belgian_action, node_type: learning_point, name: "Describe both reference profiles without assigning a label by strength alone" }
  - { id: n_cms_beer_case_belgian_reason, node_type: learning_point, name: "Tripel is typically pale and dry; Dubbel is typically dark and malty" }
  - { id: n_cms_beer_case_belgian_tradeoff, node_type: learning_point, name: "Actual producers and bottles can vary" }
  - { id: n_cms_beer_case_belgian_limit, node_type: learning_point, name: "A competition guide does not certify the bottle's style" }

