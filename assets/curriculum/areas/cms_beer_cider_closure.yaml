question_templates:
  - id: qt_cms_beer_case_cask
    relation_type: CASE_ACTION
    direction: forward
    mode: short_answer
    variant: cms_beer_cask
    prompt_template: >-
      A cask has just arrived and has been moved repeatedly. A guest asks for it now.
      Explain your service decision, the cask-conditioning reason, a short-term
      alternative and what you still need to check before a pour.
    parameters:
      scope_node_ids: [n_cms_beer_case_cask]
      key_points: {CASE_ACTION: Cellar check, CASE_REASON: Live condition, CASE_TRADEOFF: Alternative, CASE_LIMITATION: Bottle-specific limit}
  - id: qt_cms_beer_case_pair
    relation_type: CASE_ACTION
    direction: forward
    mode: short_answer
    variant: cms_beer_pair
    prompt_template: >-
      A guest asks for beer with a strongly spiced curry. Make a tentative choice.
      Explain its flavour impact, one complement or contrast, an alternative and
      the dish or beer detail that could change your recommendation.
    parameters:
      scope_node_ids: [n_cms_beer_case_pair]
      key_points: {CASE_ACTION: Conditional choice, CASE_REASON: Pairing mechanism, CASE_TRADEOFF: Alternative, CASE_LIMITATION: Required trial}
  - id: qt_cms_beer_case_belgian
    relation_type: CASE_ACTION
    direction: forward
    mode: short_answer
    variant: cms_beer_belgian
    prompt_template: >-
      A guest calls a dark Belgian Dubbel a Tripel because it is strong. Explain
      how the two reference styles differ, what the guest may really want, and
      what you would check on the actual bottle.
    parameters:
      scope_node_ids: [n_cms_beer_case_belgian]
      key_points: {CASE_ACTION: Style response, CASE_REASON: Sensory distinction, CASE_TRADEOFF: Guest goal, CASE_LIMITATION: Actual bottle}
