# Original regional comparisons; all await qualified review.
# MCQ disabled: qualified site/style explanations and case actions permit defensible alternatives.
# Dates record curation, not the start of these regional conditions.
knowledge_nodes:
  - id: n_reg_sh_principle_au_barossa_eden
    node_type: production_principle
    name: How do Barossa Valley and Eden Valley growing conditions help explain Shiraz style differences?
  - id: n_reg_sh_point_barossa_floor
    node_type: learning_point
    name: Warmer Barossa floor supports ripe, full-bodied Shiraz
  - id: n_reg_sh_point_eden_sites
    node_type: learning_point
    name: Cooler Eden ripening remains site dependent
  - id: n_reg_sh_principle_au_riesling
    node_type: production_principle
    name: Which contrasting cooling features matter when comparing Clare Valley and Eden Valley Riesling?
  - id: n_reg_sh_point_clare_cooling
    node_type: learning_point
    name: Clare cooling breezes and cool nights support acidity
  - id: n_reg_sh_point_eden_riesling
    node_type: learning_point
    name: Eden altitude and aspect support varied Riesling ripening
  - id: n_reg_sh_principle_au_cabernet
    node_type: production_principle
    name: Which site and style considerations connect Margaret River and Coonawarra Cabernet Sauvignon?
  - id: n_reg_sh_point_cab_maritime
    node_type: learning_point
    name: Both Cabernet regions have maritime moderation
  - id: n_reg_sh_point_cab_styles
    node_type: learning_point
    name: Comparable Cabernet structure does not identify origin
  - id: n_reg_sh_principle_au_pinot_chardonnay
    node_type: production_principle
    name: What distinguishes Yarra Valley and Mornington Peninsula site influences on Pinot Noir and
      Chardonnay?
  - id: n_reg_sh_point_yarra_mesoclimate
    node_type: learning_point
    name: Yarra altitude and aspect create cool-site differences
  - id: n_reg_sh_point_mornington_maritime
    node_type: learning_point
    name: Mornington ocean exposure moderates cool-climate sites
  - id: n_reg_sh_principle_au_tasmania
    node_type: production_principle
    name: How do Tasmania’s growing conditions support still-wine styles while creating vineyard challenges?
  - id: n_reg_sh_point_tasmania_chardonnay
    node_type: learning_point
    name: Cool Tasmania supports Chardonnay with natural acidity
  - id: n_reg_sh_point_tasmania_hazards
    node_type: learning_point
    name: Tasmanian spring frost and humidity require site management
  - id: n_reg_sh_principle_au_price
    node_type: production_principle
    name: When comparing similarly rated Australian regional wines, what should a defensible price
      explanation consider?
  - id: n_reg_sh_point_price_costs
    node_type: learning_point
    name: Production and route-to-market costs affect price requirements
  - id: n_reg_sh_point_price_demand
    node_type: learning_point
    name: Customer value and competing offers affect achievable price
  - id: n_reg_sh_principle_nz_marlborough
    node_type: production_principle
    name: How do Marlborough’s Wairau and Awatere settings complicate a single Sauvignon Blanc style
      prediction?
  - id: n_reg_sh_point_marlborough_wairau
    node_type: learning_point
    name: Wairau combines inland, stony and coastal sites
  - id: n_reg_sh_point_marlborough_awatere
    node_type: learning_point
    name: Awatere is generally cooler, drier and windier
  - id: n_reg_sh_principle_nz_hawkes
    node_type: production_principle
    name: How does Hawke’s Bay support red blends while retaining sites suited to cooler-style whites?
  - id: n_reg_sh_point_hawkes_reds
    node_type: learning_point
    name: Sunny Hawke’s Bay supports selected red-blend sites
  - id: n_reg_sh_point_hawkes_cool
    node_type: learning_point
    name: Coastal and higher Hawke’s Bay sites broaden white styles
  - id: n_reg_sh_principle_nz_otago
    node_type: production_principle
    name: Why can Central Otago Pinot Noir show different ripening and style patterns between Gibbston and
      Bannockburn?
  - id: n_reg_sh_point_otago_gibbston
    node_type: learning_point
    name: Higher, cooler Gibbston tends to ripen later
  - id: n_reg_sh_point_otago_bannockburn
    node_type: learning_point
    name: Warm, dry Bannockburn can ripen earlier
  - id: n_reg_sh_principle_nz_martinborough
    node_type: production_principle
    name: Which Martinborough and wider Wairarapa features support a qualified Pinot Noir comparison?
  - id: n_reg_sh_point_martinborough_setting
    node_type: learning_point
    name: Cool, dry Martinborough has free-draining sites
  - id: n_reg_sh_point_wairarapa_variation
    node_type: learning_point
    name: Wairarapa subregions differ in frost, terrace and ripening context
  - id: n_reg_sh_principle_za_stellenbosch
    node_type: production_principle
    name: Which contrasting site influences help explain Cabernet Sauvignon diversity within Stellenbosch?
  - id: n_reg_sh_point_stellenbosch_heat
    node_type: learning_point
    name: Sunlight and warmth support Cabernet ripening
  - id: n_reg_sh_point_stellenbosch_aspect
    node_type: learning_point
    name: Aspect and slope alter exposure and drainage
  - id: n_reg_sh_principle_za_swartland
    node_type: production_principle
    name: How do Swartland heat and locally adapted vineyard practices interact in regional wine comparisons?
  - id: n_reg_sh_point_swartland_variation
    node_type: learning_point
    name: Warm Swartland still contains sea-breeze and elevation contrasts
  - id: n_reg_sh_point_swartland_shade
    node_type: learning_point
    name: Bush-vine canopy can shelter grapes from summer heat
  - id: n_reg_sh_principle_za_cool_whites
    node_type: production_principle
    name: How do Elgin and Walker Bay’s Hemel-en-Aarde offer contrasting cool-site contexts for Chardonnay
      and Pinot Noir?
  - id: n_reg_sh_point_elgin_ripening
    node_type: learning_point
    name: Elgin elevation, wind and cloud extend ripening
  - id: n_reg_sh_point_hemel_maritime
    node_type: learning_point
    name: Hemel-en-Aarde ocean proximity moderates day and season temperatures
  - id: n_reg_sh_principle_za_chenin
    node_type: production_principle
    name: What distinguishes fresh and richer South African Chenin Blanc styles when comparing Swartland and
      Stellenbosch examples?
  - id: n_reg_sh_point_chenin_fresh
    node_type: learning_point
    name: Fresh Chenin is a style choice, not a fixed regional rule
  - id: n_reg_sh_point_chenin_oak
    node_type: learning_point
    name: Barrel fermentation can support richer Chenin expression
  - id: n_reg_sh_case_au_shiraz_selection
    node_type: production_case
    name: An Australian tasting-class organiser has a ripe, full-bodied Barossa Valley Shiraz and an Eden
      Valley Shiraz from a cooler high site. Both are the same vintage and had comparable maturation;
      individual vineyard records are available. Plan a comparison that explains a possible climatic
      contribution, a tradeoff and a limitation. Do not assume the Eden wine must be pepper-dominant.
  - id: n_reg_sh_point_case_au_shiraz_selection_action
    node_type: learning_point
    name: Compare vineyard climate records and the two wines together
  - id: n_reg_sh_point_case_au_shiraz_selection_reason
    node_type: learning_point
    name: Cooler Eden ripening is a plausible contrast to a warmer Barossa site
  - id: n_reg_sh_point_case_au_shiraz_selection_tradeoff
    node_type: learning_point
    name: A climate-led comparison simplifies a complex site and cellar interaction
  - id: n_reg_sh_point_case_au_shiraz_selection_limitation
    node_type: learning_point
    name: Check the actual profile because Eden Shiraz need not be peppery
  - id: n_reg_sh_case_au_cabernet_price
    node_type: production_case
    name: Two Cabernet Sauvignon wines, one from Margaret River and one from Coonawarra, receive similar
      sensory evaluations for balance and persistence. The first producer supplies evidence of higher
      production and selling costs, and proposes a higher price. Explain how to assess that proposal,
      linking wine style, quality and price, with a tradeoff and a limitation. No actual market price is
      given.
  - id: n_reg_sh_point_case_au_cabernet_price_action
    node_type: learning_point
    name: Examine cost evidence and test the proposed price with its customer segment
  - id: n_reg_sh_point_case_au_cabernet_price_reason
    node_type: learning_point
    name: Higher costs can raise the required price without raising sensory quality
  - id: n_reg_sh_point_case_au_cabernet_price_tradeoff
    node_type: learning_point
    name: Recovering costs may reduce competitiveness in the target segment
  - id: n_reg_sh_point_case_au_cabernet_price_limitation
    node_type: learning_point
    name: Overlapping Cabernet styles and regional names do not fix price premiums
  - id: n_reg_sh_case_nz_white_comparison
    node_type: production_case
    name: A study group compares an Awatere Valley Marlborough Sauvignon Blanc, fermented in stainless steel
      for a fresh fruit-led style, with a Hawke’s Bay Chardonnay fermented in barrel for a fuller style.
      The wines differ in both grape and cellar treatment. Design a useful regional comparison, give a
      rationale, and discuss a tradeoff and a limitation on attributing the sensory differences.
  - id: n_reg_sh_point_case_nz_white_comparison_action
    node_type: learning_point
    name: Separate regional conditions from grape and cellar-treatment variables
  - id: n_reg_sh_point_case_nz_white_comparison_reason
    node_type: learning_point
    name: Awatere cool windy sites and Hawke’s Bay varied sites supply distinct context
  - id: n_reg_sh_point_case_nz_white_comparison_tradeoff
    node_type: learning_point
    name: A vivid teaching contrast introduces grape and production confounding
  - id: n_reg_sh_point_case_nz_white_comparison_limitation
    node_type: learning_point
    name: Do not infer that all Marlborough or Hawke’s Bay whites follow these styles
  - id: n_reg_sh_case_za_chenin_purchasing
    node_type: production_case
    name: A buyer compares a fresh, fruit-led Stellenbosch Chenin Blanc with a barrel-fermented Swartland
      Chenin Blanc that tastes fuller. The target customers prefer a fresh style; both supplier prices
      meet the stated budget. Propose a defensible selection process, a rationale, a tradeoff and a
      limitation. The fuller wine has no independently established quality advantage.
  - id: n_reg_sh_point_case_za_chenin_purchasing_action
    node_type: learning_point
    name: Choose after a comparative trial with the target customers
  - id: n_reg_sh_point_case_za_chenin_purchasing_reason
    node_type: learning_point
    name: Fresh and rich Chenin expressions serve different style expectations
  - id: n_reg_sh_point_case_za_chenin_purchasing_tradeoff
    node_type: learning_point
    name: Fresh-style fit may forgo the fuller texture sought by another segment
  - id: n_reg_sh_point_case_za_chenin_purchasing_limitation
    node_type: learning_point
    name: One pair cannot establish fixed Chenin styles or a quality ranking by origin
