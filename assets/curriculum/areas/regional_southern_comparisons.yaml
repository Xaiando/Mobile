    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_case_za_chenin_purchasing_reason
    subject_id: n_reg_sh_case_za_chenin_purchasing
    relation_type: CASE_REASON
    object_id: n_reg_sh_point_case_za_chenin_purchasing_reason
    domain_id: winemaking
    assertion_text: Fresh fruit-led and fuller barrel-fermented Chenin serve different expectations. Match
      the wine to the stated preference rather than a presumed regional or quality hierarchy.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_case_za_chenin_purchasing_tradeoff
    subject_id: n_reg_sh_case_za_chenin_purchasing
    relation_type: CASE_TRADEOFF
    object_id: n_reg_sh_point_case_za_chenin_purchasing_tradeoff
    domain_id: geography
    assertion_text: The fresher choice fits these customers but may forgo fuller texture or oak complexity
      sought by another segment. That is a style tradeoff, not proof of lower quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_case_za_chenin_purchasing_limitation
    subject_id: n_reg_sh_case_za_chenin_purchasing
    relation_type: CASE_LIMITATION
    object_id: n_reg_sh_point_case_za_chenin_purchasing_limitation
    domain_id: geography
    assertion_text: One Stellenbosch and one Swartland example cannot establish fixed regional styles or a
      quality ranking. Check actual production and customer evidence; oak richness alone does not prove
      superiority.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
