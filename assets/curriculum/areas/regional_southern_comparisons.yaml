knowledge_items:
  - id: ki_reg_sh_barossa_floor
    subject_id: n_reg_sh_principle_au_barossa_eden
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sh_point_barossa_floor
    domain_id: geography
    assertion_text: Barossa Valley’s warmer valley-floor conditions support ripe, full-bodied Shiraz,
      although surrounding hills have cooler sites and balance depends on vineyard and winery choices.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_eden_sites
    subject_id: n_reg_sh_principle_au_barossa_eden
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sh_point_eden_sites
    domain_id: geography
    assertion_text: Eden Valley generally ripens and harvests grapes in cooler conditions than Barossa
      Valley; altitude, aspect and slope modify its sites. Its Shiraz need not have a pepper-dominant
      profile.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_clare_cooling
    subject_id: n_reg_sh_principle_au_riesling
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sh_point_clare_cooling
    domain_id: geography
    assertion_text: Clare Valley combines warm summer days with cooling breezes and substantial day–night
      temperature variation. This helps explain acid retention despite warm daytime conditions; a single
      regional temperature average is insufficient.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_eden_riesling
    subject_id: n_reg_sh_principle_au_riesling
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sh_point_eden_riesling
    domain_id: geography
    assertion_text: Eden Valley’s hilly terrain creates cooler and warmer sites through altitude and aspect;
      Riesling is an established local variety with lime-led youthful examples that can develop toasty
      and marmalade notes with age.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_cab_maritime
    subject_id: n_reg_sh_principle_au_cabernet
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sh_point_cab_maritime
    domain_id: geography
    assertion_text: Margaret River and Coonawarra both experience maritime moderation, through different
      local conditions. This supports comparison of ripening environments without assuming identical
      temperature patterns or wine styles.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_cab_styles
    subject_id: n_reg_sh_principle_au_cabernet
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sh_point_cab_styles
    domain_id: geography
    assertion_text: Regional references describe medium- to full-bodied Cabernet Sauvignon in both Margaret
      River and Coonawarra, with dark-fruit characters. These overlapping traits require site, harvest
      and production context rather than a definitive blind-origin rule.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_yarra_mesoclimate
    subject_id: n_reg_sh_principle_au_pinot_chardonnay
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sh_point_yarra_mesoclimate
    domain_id: geography
    assertion_text: Yarra Valley’s altitude and aspect create substantial differences in mesoclimate; its
      cool sites support Pinot Noir and Chardonnay. Comparing named sites is more informative than
      assuming the valley has one uniform ripening environment.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_mornington_maritime
    subject_id: n_reg_sh_principle_au_pinot_chardonnay
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sh_point_mornington_maritime
    domain_id: geography
    assertion_text: Mornington Peninsula has a strongly maritime but site-specific climate. Pinot Noir and
      Chardonnay are established varieties; a restrained, fresh style is plausible, while harvest and
      cellar decisions still influence the finished wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_tasmania_chardonnay
    subject_id: n_reg_sh_principle_au_tasmania
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sh_point_tasmania_chardonnay
    domain_id: geography
    assertion_text: Tasmania’s cool conditions support Chardonnay with high natural acidity and relatively
      delicate Pinot Noir styles. Site variation and the producer’s choices remain relevant; cool climate
      alone is not a quality grade.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_tasmania_hazards
    subject_id: n_reg_sh_principle_au_tasmania
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sh_point_tasmania_hazards
    domain_id: viticulture
    assertion_text: Tasmania’s regional reference identifies spring frost and high humidity as growing
      conditions. A regional comparison should consider vineyard exposure and disease or frost management
      alongside the opportunity to retain acidity.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_price_costs
    subject_id: n_reg_sh_principle_au_price
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sh_point_price_costs
    domain_id: business
    assertion_text: For an Australian regional wine comparison, analyse actual production and selling costs
      when estimating a sustainable price. Higher costs can raise the required selling price without
      proving that consumers will accept it or that sensory quality is higher.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_price_demand
    subject_id: n_reg_sh_principle_au_price
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sh_point_price_demand
    domain_id: business
    assertion_text: An achievable price also depends on the target customer’s perceived value, competing
      offers and market testing. A regional reputation can be part of positioning, but its name alone
      cannot establish a fixed price premium.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_marlborough_wairau
    subject_id: n_reg_sh_principle_nz_marlborough
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sh_point_marlborough_wairau
    domain_id: geography
    assertion_text: Marlborough’s Wairau Valley contains inland, early-ripening stony and
      sea-breeze-moderated coastal sites. Sauvignon Blanc’s regional association is useful, but does not
      establish one uniform ripeness or aroma profile.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_marlborough_awatere
    subject_id: n_reg_sh_principle_nz_marlborough
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sh_point_marlborough_awatere
    domain_id: geography
    assertion_text: Awatere Valley is generally cooler, drier and windier than the Wairau setting, often with
      elevated sites. These conditions help frame aromatic Sauvignon Blanc comparisons, while individual
      vineyards and harvest choices still matter.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_hawkes_reds
    subject_id: n_reg_sh_principle_nz_hawkes
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sh_point_hawkes_reds
    domain_id: geography
    assertion_text: Hawke’s Bay’s temperate, sunny environment supports Cabernet-based red blends and Syrah
      at suitable sites; free-draining alluvial plains and gravel terraces are important contexts, but
      the entire region is not one soil or mesoclimate.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_hawkes_cool
    subject_id: n_reg_sh_principle_nz_hawkes
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sh_point_hawkes_cool
    domain_id: geography
    assertion_text: Coastal and higher-altitude Hawke’s Bay sites support Chardonnay and other whites, with
      cooler inland areas also offering Pinot Noir potential. Compare site and picking decisions before
      assigning the whole region a rich white-wine style.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_otago_gibbston
    subject_id: n_reg_sh_principle_nz_otago
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sh_point_otago_gibbston
    domain_id: geography
    assertion_text: Gibbston’s higher, cooler setting tends to ripen Pinot Noir later than neighbouring
      Central Otago subregions and can yield lighter styles. This is a site tendency rather than a
      guaranteed body or quality result.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_otago_bannockburn
    subject_id: n_reg_sh_principle_nz_otago
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sh_point_otago_bannockburn
    domain_id: geography
    assertion_text: Bannockburn occupies some of Central Otago’s warmer, drier sites and can harvest earlier
      than cooler subregions. Its ripening context is a useful contrast with Gibbston, with vintage and
      vineyard decisions still affecting style.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_martinborough_setting
    subject_id: n_reg_sh_principle_nz_martinborough
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sh_point_martinborough_setting
    domain_id: geography
    assertion_text: Martinborough’s cool, dry environment and free-draining soils support established Pinot
      Noir production. These regional conditions supply context, but cannot uniquely identify an unknown
      Pinot Noir or rank it above another origin.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_wairarapa_variation
    subject_id: n_reg_sh_principle_nz_martinborough
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sh_point_wairarapa_variation
    domain_id: geography
    assertion_text: "Martinborough should not stand for all Wairarapa: Masterton’s frost exposure and
      day–night variation, and Gladstone’s cooler river-terrace sites, add different growing contexts.
      Pinot Noir style needs the actual vineyard and production record."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_stellenbosch_heat
    subject_id: n_reg_sh_principle_za_stellenbosch
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sh_point_stellenbosch_heat
    domain_id: geography
    assertion_text: Stellenbosch’s warmth and sunlight support Cabernet Sauvignon ripening, while sea breezes
      moderate heat at exposed sites. This combination supplies a mechanism for ripe fruit with
      freshness, not a guarantee of balance in every vintage.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_stellenbosch_aspect
    subject_id: n_reg_sh_principle_za_stellenbosch
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sh_point_stellenbosch_aspect
    domain_id: viticulture
    assertion_text: Stellenbosch vineyard aspect and slope affect sunlight, sea-breeze exposure and drainage.
      Their interaction with varied soils means that two Cabernet vineyards can differ in ripening and
      vine growth despite sharing a regional name.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_swartland_variation
    subject_id: n_reg_sh_principle_za_swartland
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sh_point_swartland_variation
    domain_id: geography
    assertion_text: Swartland contains hot, dry summer settings around Malmesbury alongside sites cooled by
      Atlantic breezes or elevation. Regional heat is useful context, but does not establish one ripeness
      profile for all Chenin Blanc or Syrah.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_swartland_shade
    subject_id: n_reg_sh_principle_za_swartland
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sh_point_swartland_shade
    domain_id: viticulture
    assertion_text: In the cited Swartland producer account, a bush-vine canopy shades fruit to reduce summer
      sun exposure. This is a relevant mechanism to assess; bush training alone does not prove water
      sufficiency, freshness or superior quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_elgin_ripening
    subject_id: n_reg_sh_principle_za_cool_whites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sh_point_elgin_ripening
    domain_id: geography
    assertion_text: Elgin’s elevated terrain, coastal influence and cooling winds or cloud can extend
      ripening while retaining acidity, supporting Chardonnay and Pinot Noir. Varying slopes create
      different sites; cooler conditions are not sufficient evidence of higher quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_hemel_maritime
    subject_id: n_reg_sh_principle_za_cool_whites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sh_point_hemel_maritime
    domain_id: geography
    assertion_text: Hemel-en-Aarde within Walker Bay has strong ocean and summer-wind influence that
      moderates temperatures. Its Pinot Noir and Chardonnay focus is a useful comparison with Elgin,
      while soil and elevation differences remain relevant within the area.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_chenin_fresh
    subject_id: n_reg_sh_principle_za_chenin
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sh_point_chenin_fresh
    domain_id: geography
    assertion_text: South African Chenin Blanc ranges from fresh, fruit-led styles to fuller examples. A
      Swartland or Stellenbosch origin alone does not establish which style is present; compare the
      actual wine and production details.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_chenin_oak
    subject_id: n_reg_sh_principle_za_chenin
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sh_point_chenin_oak
    domain_id: winemaking
    assertion_text: Barrel fermentation is one route to a richer, more complex Chenin Blanc expression. Oak
      treatment should be considered alongside fruit and texture when comparing South African regions,
      without treating oak influence as proof of higher quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_case_au_shiraz_selection_action
    subject_id: n_reg_sh_case_au_shiraz_selection
    relation_type: CASE_ACTION
    object_id: n_reg_sh_point_case_au_shiraz_selection_action
    domain_id: geography
    assertion_text: Compare site temperatures, altitude and harvest conditions alongside the two wines. Treat
      the cooler Eden premise as a possible explanatory factor rather than selecting style from a label.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_case_au_shiraz_selection_reason
    subject_id: n_reg_sh_case_au_shiraz_selection
    relation_type: CASE_REASON
    object_id: n_reg_sh_point_case_au_shiraz_selection_reason
    domain_id: geography
    assertion_text: Eden’s cooler ripening contrasts with a warmer Barossa site’s potential for fuller, riper
      Shiraz. Similar maturation reduces one confounding variable without eliminating all others.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_case_au_shiraz_selection_tradeoff
    subject_id: n_reg_sh_case_au_shiraz_selection
    relation_type: CASE_TRADEOFF
    object_id: n_reg_sh_point_case_au_shiraz_selection_tradeoff
    domain_id: geography
    assertion_text: The climate contrast helps organise the comparison, but site, soil and winery differences
      remain possible explanations. A regional generalisation loses this detail.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_case_au_shiraz_selection_limitation
    subject_id: n_reg_sh_case_au_shiraz_selection
    relation_type: CASE_LIMITATION
    object_id: n_reg_sh_point_case_au_shiraz_selection_limitation
    domain_id: geography
    assertion_text: "Check the actual wines: Eden Valley’s regional reference describes Shiraz that need not
      be pepper-dominant. Cooler origin does not guarantee that aroma or higher quality."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_case_au_cabernet_price_action
    subject_id: n_reg_sh_case_au_cabernet_price
    relation_type: CASE_ACTION
    object_id: n_reg_sh_point_case_au_cabernet_price_action
    domain_id: business
    assertion_text: Check the producer’s costs and target customer, then test the proposed price against
      competing offers. Similar sensory assessments do not make required or achievable prices identical.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_case_au_cabernet_price_reason
    subject_id: n_reg_sh_case_au_cabernet_price
    relation_type: CASE_REASON
    object_id: n_reg_sh_point_case_au_cabernet_price_reason
    domain_id: business
    assertion_text: Higher unit production and selling costs can raise the price needed to cover costs
      despite similar sensory assessments. The break-even calculation does not measure wine quality or
      willingness to pay.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_case_au_cabernet_price_tradeoff
    subject_id: n_reg_sh_case_au_cabernet_price
    relation_type: CASE_TRADEOFF
    object_id: n_reg_sh_point_case_au_cabernet_price_tradeoff
    domain_id: business
    assertion_text: A higher price may aid cost recovery but weaken competitiveness if customers prefer
      comparable alternatives. Test demand rather than assuming regional reputation removes price
      sensitivity.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_case_au_cabernet_price_limitation
    subject_id: n_reg_sh_case_au_cabernet_price
    relation_type: CASE_LIMITATION
    object_id: n_reg_sh_point_case_au_cabernet_price_limitation
    domain_id: geography
    assertion_text: Both regions can supply medium- to full-bodied dark-fruited Cabernet. These traits cannot
      determine a fixed premium; producer, channel and customer evidence remain relevant.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:42.000Z
  - id: ki_reg_sh_case_nz_white_comparison_action
