knowledge_items:
  -
    id: "ki_d5madeira_poios"
    subject_id: "n_d5madeira_principle_poios"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_d5madeira_point_poios"
    domain_id: "viticulture"
    assertion_text: "IVBAM describes steep agricultural land terraced into poios. For work planning, this identifies terrain and terrace layout, not a guarantee of easy access, machine suitability or wine quality. Inspect the parcel before estimating effort."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  -
    id: "ki_d5madeira_levadas"
    subject_id: "n_d5madeira_principle_levadas"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_d5madeira_point_levadas"
    domain_id: "viticulture"
    assertion_text: "The regional account identifies levadas as channels distributing irrigation water captured higher on the island. A grower still needs to check the parcel connection, available supply and timing; a channel name does not establish dependable water delivery in every season."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  -
    id: "ki_d5madeira_latada"
    subject_id: "n_d5madeira_principle_latada"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_d5madeira_point_latada"
    domain_id: "viticulture"
    assertion_text: "IVBAM describes traditional latada as horizontal vine training and presents espalier as an option for gentler land. A redesign therefore needs the actual terrain, canopy and access assessed. Neither term establishes a grape variety, a fixed harvest cost or the finished sweetness."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  -
    id: "ki_d5madeira_harvest"
    subject_id: "n_d5madeira_principle_harvest"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_d5madeira_point_harvest"
    domain_id: "viticulture"
    assertion_text: "The regional description connects difficult harvesting with steep terrain and small fragmented holdings, and describes harvest by hand. This supports checking crew availability, routes and handling effort in a proposed budget. It supplies neither a universal labour rate nor proof that manual picking produces a superior wine."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  -
    id: "ki_d5madeira_verdelho"
    subject_id: "n_d5madeira_principle_verdelho"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_d5madeira_point_verdelho"
    domain_id: "winemaking"
    assertion_text: "IVBAM associates Verdelho with an off-dry style and describes it as slightly fuller and less acidic than Sercial. Use that as comparative context, then assess a bottle's actual sweetness, body and acidity. The page's approximate growing elevation is descriptive, not a legal boundary or a diagnostic proof of identity."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  -
    id: "ki_d5madeira_boal"
    subject_id: "n_d5madeira_principle_boal"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_d5madeira_point_boal"
    domain_id: "winemaking"
    assertion_text: "IVBAM describes Boal as semi-sweet, medium-bodied and rich, with balance between acidity and sweetness. Compared with the off-dry Verdelho reference, sweetness is a useful observed distinction, but body, flavour or a growing-elevation description cannot independently authenticate the grape or rank two bottles' quality."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  -
    id: "ki_d5madeira_case_terrace_logistics_action"
    subject_id: "n_d5madeira_case_terrace_logistics"
    relation_type: "CASE_ACTION"
    object_id: "n_d5madeira_point_case_terrace_logistics_action"
    domain_id: "business"
    assertion_text: "Inspect access, terrace layout and the latada; request an itemised hand-crew and grape-handling quote and check delivery through the assumed levada connection. Treat the proposed machine price as unvalidated for A rather than adopting one rate for both parcels. These are actions for the invented constraints, not instructions to replace a real grower's assessment."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  -
    id: "ki_d5madeira_case_terrace_logistics_reason"
    subject_id: "n_d5madeira_case_terrace_logistics"
    relation_type: "CASE_REASON"
    object_id: "n_d5madeira_point_case_terrace_logistics_reason"
    domain_id: "business"
    assertion_text: "The IVBAM regional account describes steep poios, horizontal latada, levada water distribution and demanding hand harvesting across fragmented holdings. Those mechanisms make a site visit and separate handling and water checks relevant to this hypothetical plan. They do not establish the contractor's actual capability."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  -
    id: "ki_d5madeira_case_terrace_logistics_tradeoff"
    subject_id: "n_d5madeira_case_terrace_logistics"
    relation_type: "CASE_TRADEOFF"
    object_id: "n_d5madeira_point_case_terrace_logistics_tradeoff"
    domain_id: "business"
    assertion_text: "A crew and access plan for A may commit more time or handling resources than the assumed accessible B. Compare measured crew hours, routes, training requirements and quotes before choosing a work allocation. The source supplies no fixed cost difference, and easier access does not itself prove superior grapes or wine."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  -
    id: "ki_d5madeira_case_terrace_logistics_limitation"
    subject_id: "n_d5madeira_case_terrace_logistics"
    relation_type: "CASE_LIMITATION"
    object_id: "n_d5madeira_point_case_terrace_logistics_limitation"
    domain_id: "business"
    assertion_text: "The invented connection does not prove seasonal water delivery; the available crew does not establish the time required. Site measurements, water records, crew availability and a contractor feasibility assessment are missing. Neither the regional description nor the fixed offer proves a universal price, machine suitability or finished-wine quality."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  -
    id: "ki_d5madeira_case_style_comparison_action"
    subject_id: "n_d5madeira_case_style_comparison"
    relation_type: "CASE_ACTION"
    object_id: "n_d5madeira_point_case_style_comparison_action"
    domain_id: "tasting"
    assertion_text: "On the invented observations, provisionally shortlist A for the guest's off-dry preference and explain the observed sweetness and acidity. Check the label and producer details before naming a grape or committing to a listed bottle. This is an original service decision under stated assumptions, not evidence that A is Verdelho."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  -
    id: "ki_d5madeira_case_style_comparison_reason"
    subject_id: "n_d5madeira_case_style_comparison"
    relation_type: "CASE_REASON"
    object_id: "n_d5madeira_point_case_style_comparison_reason"
    domain_id: "tasting"
    assertion_text: "The Verdelho page describes an off-dry style, while the Boal page describes semi-sweet wine with acidity/sweetness balance. Those references make the invented A/B contrast compatible with a Verdelho/Boal comparison, without identifying either sample or assigning an exact sugar interval."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  -
    id: "ki_d5madeira_case_style_comparison_tradeoff"
    subject_id: "n_d5madeira_case_style_comparison"
    relation_type: "CASE_TRADEOFF"
    object_id: "n_d5madeira_point_case_style_comparison_tradeoff"
    domain_id: "tasting"
    assertion_text: "A is the closer match to this invented off-dry brief; B's greater sweetness and rich impression may suit a guest seeking a sweeter style. Neither preference is a quality verdict. If the purchasing decision changes, compare actual bottles, prices and sensory evidence rather than assuming the sweeter sample is better."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  -
    id: "ki_d5madeira_case_style_comparison_limitation"
    subject_id: "n_d5madeira_case_style_comparison"
    relation_type: "CASE_LIMITATION"
    object_id: "n_d5madeira_point_case_style_comparison_limitation"
    domain_id: "tasting"
    assertion_text: "The coded observations cannot authenticate Verdelho or Boal, establish measured residual sugar or recover a vineyard's exact elevation. IVBAM's indicative growing elevations are not legal planting limits or tasting diagnostics. The colleague's quality ranking also lacks a full quality assessment and repeat evidence; request labels, records, analyses or further tasting appropriate to the claim."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
