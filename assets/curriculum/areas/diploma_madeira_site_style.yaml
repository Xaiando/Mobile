# Original Diploma-only Madeira site and intermediate-style comparisons. Expert review pending.
knowledge_nodes:
  -
    id: "n_d5madeira_principle_poios"
    node_type: "production_principle"
    name: "What do poios explain about planning vineyard work in Madeira?"
  -
    id: "n_d5madeira_point_poios"
    node_type: "learning_point"
    name: "Poios are terraces on steep agricultural land; access must be assessed separately"
  -
    id: "n_d5madeira_principle_levadas"
    node_type: "production_principle"
    name: "What role do levadas play in Madeira vineyard water supply?"
  -
    id: "n_d5madeira_point_levadas"
    node_type: "learning_point"
    name: "Levadas carry irrigation water from higher parts of the island"
  -
    id: "n_d5madeira_principle_latada"
    node_type: "production_principle"
    name: "How does latada differ from the espalier option in Madeira?"
  -
    id: "n_d5madeira_point_latada"
    node_type: "learning_point"
    name: "Latada trains vines horizontally; espalier is associated with gentler slopes"
  -
    id: "n_d5madeira_principle_harvest"
    node_type: "production_principle"
    name: "Why does a Madeira hand-harvest budget need parcel evidence?"
  -
    id: "n_d5madeira_point_harvest"
    node_type: "learning_point"
    name: "Steep, fragmented holdings can make manual harvest demanding; costs need local evidence"
  -
    id: "n_d5madeira_principle_verdelho"
    node_type: "production_principle"
    name: "Where does Verdelho sit in a source-bounded Madeira style comparison?"
  -
    id: "n_d5madeira_point_verdelho"
    node_type: "learning_point"
    name: "Verdelho is associated with off-dry wine, slightly fuller and less acidic than Sercial"
  -
    id: "n_d5madeira_principle_boal"
    node_type: "production_principle"
    name: "How does the Boal description extend a Verdelho/Boal Madeira comparison?"
  -
    id: "n_d5madeira_point_boal"
    node_type: "learning_point"
    name: "Boal is associated with a rich semi-sweet style balanced by acidity"
  -
    id: "n_d5madeira_case_terrace_logistics"
    node_type: "production_case"
    name: "Hypothetical Madeira work-planning case. The following parcel and budget details are invented: parcel A has steep, small fragmented poios, narrow access, a latada and a levada connection; the available hand crew has limited working days. Parcel B has gentler, accessible land. A contractor offers one fixed machine-harvest price for both without visiting either. No crew-time measurements, water-delivery records or itemised quotes are available. Recommend a conditional plan for A, explain the regional mechanisms, compare its resource commitments with B and identify the evidence needed before committing funds."
  -
    id: "n_d5madeira_point_case_terrace_logistics_action"
    node_type: "learning_point"
    name: "Inspect parcel A and obtain a crew, access and water plan before committing its budget"
  -
    id: "n_d5madeira_point_case_terrace_logistics_reason"
    node_type: "learning_point"
    name: "Terrain, fragmented holdings, vine training and water access affect the proposed work plan"
  -
    id: "n_d5madeira_point_case_terrace_logistics_tradeoff"
    node_type: "learning_point"
    name: "Compare crew and handling demands with accessible-land options using actual quotes"
  -
    id: "n_d5madeira_point_case_terrace_logistics_limitation"
    node_type: "learning_point"
    name: "Missing site, water, crew and contractor evidence prevents a firm cost or quality conclusion"
  -
    id: "n_d5madeira_case_style_comparison"
    node_type: "production_case"
    name: "Hypothetical Madeira comparison. The observations below are invented rather than results from an authenticated flight. Two coded samples are served in clean matched glasses at the same temperature. A is off-dry, with noticeable acidity and moderate body. B is clearly sweeter, with acidity balancing a rich, medium-bodied impression. A guest asks for an off-dry choice. There are no bottle labels, grape or vineyard records, sugar analyses, prices or repeat tastings. A colleague labels A Verdelho and B Boal, then assigns exact growing altitudes and a higher quality grade to B. Recommend a response to the guest, explain the useful style comparison, give a preference tradeoff and identify unsupported conclusions."
  -
    id: "n_d5madeira_point_case_style_comparison_action"
    node_type: "learning_point"
    name: "Provisionally offer A for the off-dry brief and verify the bottle before naming its grape"
  -
    id: "n_d5madeira_point_case_style_comparison_reason"
    node_type: "learning_point"
    name: "Off-dry Verdelho and semi-sweet Boal references guide a provisional sweetness comparison"
  -
    id: "n_d5madeira_point_case_style_comparison_tradeoff"
    node_type: "learning_point"
    name: "Sweeter B may suit a different preference; guest fit and quality are separate judgements"
  -
    id: "n_d5madeira_point_case_style_comparison_limitation"
    node_type: "learning_point"
    name: "These observations cannot authenticate grape, exact sugar, altitude or a higher quality grade"
