  "knowledge_items": [
    {
      "id": "ki_d2_calc_unit_contribution",
      "subject_id": "n_d2_calc_unit_contribution",
      "relation_type": "CALCULATED_VALUE",
      "object_id": "n_qty_d2_calc_unit_contribution",
      "domain_id": "business",
      "assertion_text": "Variable cost = 13 + 2 + 1 = EUR 16. Unit contribution = 24 - 16 = EUR 8. This is contribution, not net profit or a gross margin percentage; fixed costs, tax and interest are outside the supplied unit inputs.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-09-30T12:18:13.000Z"
    },
    {
      "id": "ki_d2_calc_breakeven_bottles",
      "subject_id": "n_d2_calc_breakeven_bottles",
      "relation_type": "CALCULATED_VALUE",
      "object_id": "n_qty_d2_calc_breakeven_bottles",
      "domain_id": "business",
      "assertion_text": "Unit contribution = 24 - 16 = EUR 8. The fractional threshold is 10001 / 8 = 1250.125, so the minimum whole-bottle coverage threshold is 1251 bottles. At 1250 bottles contribution is EUR 10,000 and fails to cover EUR 10,001; at 1251 it is EUR 10,008. These original assumptions use one product, constant price and variable cost, and sufficient stated capacity; the whole-unit threshold is not the fractional algebraic break-even point.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-09-30T12:18:13.000Z"
    },
    {
      "id": "ki_d2_calc_fx_receipt",
      "subject_id": "n_d2_calc_fx_receipt",
      "relation_type": "CALCULATED_VALUE",
      "object_id": "n_qty_d2_calc_fx_receipt",
      "domain_id": "business",
      "assertion_text": "Each invoiced USD buys the supplied EUR 0.75: 10000 x 75 / 100 = EUR 7500. The quote direction is explicit and is not inverted. This is a fictional settlement receipt, with full payment and no fees; it is not a current exchange rate or a recommendation about hedging.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-09-30T12:18:13.000Z"
    },
    {
      "id": "ki_d2_calc_fx_receipt_reduction",
      "subject_id": "n_d2_calc_fx_receipt_reduction",
      "relation_type": "CALCULATED_VALUE",
      "object_id": "n_qty_d2_calc_fx_receipt_reduction",
      "domain_id": "business",
      "assertion_text": "At the supplied comparison quote, 10000 x 80 / 100 = EUR 8000. At settlement, 10000 x 75 / 100 = EUR 7500. The positive receipt reduction is 8000 - 7500 = EUR 500, not the final receipt or a percentage. The two rates, full payment and absence of fees are original fictional assumptions.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-09-30T12:18:13.000Z"
    },
    {
      "id": "ki_d2_calc_landed_cost_per_bottle",
      "subject_id": "n_d2_calc_landed_cost_per_bottle",
      "relation_type": "CALCULATED_VALUE",
      "object_id": "n_qty_d2_calc_landed_cost_per_bottle",
      "domain_id": "business",
      "assertion_text": "The supplied nonrecoverable stack is 9000 + 1000 + 500 + 500 + 2000 = EUR 13,000. Divide by the stated 1,000 saleable bottles: 13000 / 1000 = EUR 13 per bottle. All charges and VAT recoverability are fictional premises, not a jurisdictional tariff or tax ruling. Recoverability does not imply that no tax cash needs funding; this target is nonrecoverable unit cost, not cash required or selling price.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-09-30T12:18:13.000Z"
    },
    {
      "id": "ki_d2_calc_cash_gap_days",
      "subject_id": "n_d2_calc_cash_gap_days",
      "relation_type": "CALCULATED_VALUE",
      "object_id": "n_qty_d2_calc_cash_gap_days",
      "domain_id": "business",
      "assertion_text": "Elapsed cash gap = 47 - 12 = 35 days. Day 47 is the receipt time, not the duration; inclusive counting would answer a different question. The original supplied interval compares actual outflow and receipt timing, without specifying an interest rate, funding amount or recommendation.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-09-30T12:18:13.000Z"
    }
  ],
