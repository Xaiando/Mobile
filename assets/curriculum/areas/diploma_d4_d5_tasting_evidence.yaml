# Original Diploma analytical tasting cases; the sensory packets are hypothetical.
# Category sources support context, never the identity or quality of the coded samples.
# Expert review and physical tasting feedback remain required.
knowledge_nodes:
  - id: n_d45taste_case_sparkling_lees
    node_type: production_case
    name: >-
      Hypothetical sparkling comparison: two blind-coded wines are freshly poured at the same
      temperature into matching clean glasses. Sample A shows pear and green apple, brisk acidity, a
      light texture and a short fruit finish. Sample B shows lemon, toasted bread and hazelnut, a
      creamier texture, retained freshness and a longer layered finish. No appellation, grape,
      production record, maturation time or price is supplied. Explain a defensible development or
      method hypothesis, the sensory reason, a competing interpretation or style trade-off, and a
      limit on quality or origin claims. These invented notes are a reasoning exercise; more than
      one qualified conclusion may be justified.
  - id: n_d45taste_sparkling_lees_action_point
    node_type: learning_point
    name: "Describe B as more developed and investigate a lees-ageing explanation"
  - id: n_d45taste_sparkling_lees_reason_point
    node_type: learning_point
    name: "Bread-like aromas and texture are compatible with lees maturation"
  - id: n_d45taste_sparkling_lees_tradeoff_point
    node_type: learning_point
    name: "Development adds a comparison dimension but does not replace style fit"
  - id: n_d45taste_sparkling_lees_limitation_point
    node_type: learning_point
    name: "No sensory resemblance authenticates the method, place or ageing duration"
  - id: n_d45taste_case_sparkling_quality
    node_type: production_case
    name: >-
      Hypothetical sparkling quality review: the same panel tastes two blind-coded samples twice,
      using fresh pours, matching clean glasses and one serving temperature. Sample C has vigorous
      bubbles and bright fruit initially, but acidity dominates the palate and the finish quickly
      becomes only heat. Sample D has gentler mousse, clear citrus and nutty flavours, acidity
      integrated with fruit, and a persistent flavour finish. No faults are recorded. A colleague
      calls C better because it bubbles more and guarantees D will improve for ten years. Explain a
      justified comparative judgement, its evidence, a preference or readiness trade-off, and what
      remains unknown. These invented notes do not measure your palate or establish an official
      quality grade.
  - id: n_d45taste_sparkling_quality_action_point
    node_type: learning_point
    name: "Support D's comparative quality from the stated whole-palate evidence"
  - id: n_d45taste_sparkling_quality_reason_point
    node_type: learning_point
    name: "D combines integrated acidity with a persistent flavour finish"
  - id: n_d45taste_sparkling_quality_tradeoff_point
    node_type: learning_point
    name: "Present enjoyment and possible development are different decisions"
  - id: n_d45taste_sparkling_quality_limitation_point
    node_type: learning_point
    name: "One packet cannot guarantee a ten-year drinking window or official grade"
  - id: n_d45taste_case_sherry_sweetness
    node_type: production_case
    name: >-
      Hypothetical fortified comparison: two coded Sherry samples are presented at the same
      temperature. Sample E is chestnut-coloured with walnut and orange-peel aromas, a rounded body,
      marked alcohol and a dry palate. Sample F is dark brown with raisin and caramel aromas,
      pronounced sweetness and a viscous texture. Both have persistent flavour; their labels, exact
      categories and cellar records are withheld. A diner wants nutty complexity without pronounced
      sweetness, and a colleague says every dark, full-bodied Sherry must be sweet. Explain a
      provisional selection, the sensory reason, a preference or alternative trade-off, and an
      identification or ageing limitation. The observations are invented, not a blind tasting
      result.
  - id: n_d45taste_sherry_sweetness_action_point
    node_type: learning_point
    name: "Provisionally select E for the stated dry and nutty brief"
  - id: n_d45taste_sherry_sweetness_reason_point
    node_type: learning_point
    name: "Observed dryness matters more than dark colour or rounded body"
  - id: n_d45taste_sherry_sweetness_tradeoff_point
    node_type: learning_point
    name: "F's sweetness may suit another brief without making it inferior"
  - id: n_d45taste_sherry_sweetness_limitation_point
    node_type: learning_point
    name: "The packet cannot identify an exact Sherry type or remaining lifespan"
  - id: n_d45taste_case_port_development
    node_type: production_case
    name: >-
      Hypothetical Port development comparison: sample G is deep ruby with intense blackberry and
      cherry flavours, firm tannin, sweetness and a long fruit finish. Sample H is tawny-gold with
      dried-fruit and nut aromas, a smooth texture, sweetness and a long developed-flavour finish.
      The panel finds the alcohol integrated in both. Labels, harvest years, bottling dates,
      filtration and storage records are withheld. A learner calls H an exact twenty-year-old Tawny
      and says both samples should be cellared for another decade. Explain a cautious development
      and readiness comparison, the sensory reason, an enjoyment or ageing trade-off, and the
      information still required. These sample notes and claims are invented.
  - id: n_d45taste_port_development_action_point
    node_type: learning_point
    name: "Compare fruit-led G with developed H and qualify the cellar plan"
  - id: n_d45taste_port_development_reason_point
    node_type: learning_point
    name: "IVDP separates fruit-preserving Ruby styles from cask-developed Tawny styles"
  - id: n_d45taste_port_development_tradeoff_point
    node_type: learning_point
    name: "Cellaring possible development competes with enjoying the current profile"
  - id: n_d45taste_port_development_limitation_point
    node_type: learning_point
    name: "A Tawny-like profile cannot prove an age indication or storage suitability"
