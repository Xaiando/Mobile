knowledge_items:
  - id: ki_d45taste_sparkling_lees_action
    subject_id: n_d45taste_case_sparkling_lees
    relation_type: CASE_ACTION
    object_id: n_d45taste_sparkling_lees_action_point
    domain_id: tasting
    assertion_text: >-
      Describe the observed difference first, then tentatively investigate whether lees maturation
      contributed to B's bread-like aromas and texture. Keep A's fruit-led character separate from
      any tank-method claim; neither production route is supplied in this hypothetical packet.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: '2026-09-29T23:00:00.000Z'
  - id: ki_d45taste_sparkling_lees_reason
    subject_id: n_d45taste_case_sparkling_lees
    relation_type: CASE_REASON
    object_id: n_d45taste_sparkling_lees_reason_point
    domain_id: tasting
    assertion_text: >-
      The Comité Champagne describes yeast breakdown during lees maturation and the development of
      mature aromas. That offers a mechanism compatible with B's stated evidence, while its lemon
      freshness and layered finish are observations in the invented packet, not results reported by
      the source.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: '2026-09-29T23:00:00.000Z'
  - id: ki_d45taste_sparkling_lees_tradeoff
    subject_id: n_d45taste_case_sparkling_lees
    relation_type: CASE_TRADEOFF
    object_id: n_d45taste_sparkling_lees_tradeoff_point
    domain_id: tasting
    assertion_text: >-
      B's developed profile may suit a learner seeking complexity, while A's fresh fruit-led
      expression can suit another brief. Lees-associated development is one comparison dimension;
      neither greater maturity nor a personal preference establishes a universally better wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: '2026-09-29T23:00:00.000Z'
  - id: ki_d45taste_sparkling_lees_limitation
    subject_id: n_d45taste_case_sparkling_lees
    relation_type: CASE_LIMITATION
    object_id: n_d45taste_sparkling_lees_limitation_point
    domain_id: tasting
    assertion_text: >-
      The supplied tasting notes cannot authenticate Champagne origin, prove bottle rather than tank
      fermentation, or calculate months on lees. Require production or provenance records for those
      claims and assess sensory quality from fuller comparable tasting evidence rather than a bread
      descriptor alone.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: '2026-09-29T23:00:00.000Z'
  - id: ki_d45taste_sparkling_quality_action
    subject_id: n_d45taste_case_sparkling_quality
    relation_type: CASE_ACTION
    object_id: n_d45taste_sparkling_quality_action_point
    domain_id: tasting
    assertion_text: >-
      Under the supplied repeated observations, justify D's stronger comparative quality using
      integrated acidity, clear flavours and their persistence. Record both wines' mousse rather
      than assigning quality from the quantity of bubbles, and state any preference separately.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: '2026-09-29T23:00:00.000Z'
  - id: ki_d45taste_sparkling_quality_reason
    subject_id: n_d45taste_case_sparkling_quality
    relation_type: CASE_REASON
    object_id: n_d45taste_sparkling_quality_reason_point
    domain_id: tasting
    assertion_text: >-
      In the invented packet, D's flavours remain after tasting while C's finish becomes only heat
      and its acidity dominates. These different observations support the comparative reasoning;
      AWRI's assessment guidance asks tasters to justify quality decisions rather than substitute
      style preference for evidence.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: '2026-09-29T23:00:00.000Z'
  - id: ki_d45taste_sparkling_quality_tradeoff
    subject_id: n_d45taste_case_sparkling_quality
    relation_type: CASE_TRADEOFF
    object_id: n_d45taste_sparkling_quality_tradeoff_point
    domain_id: tasting
    assertion_text: >-
      D may be enjoyable now, and a taster can discuss further development conditionally from its
      fruit and structure. A learner who prefers vigorous mousse may still personally choose C.
      Present enjoyment, stylistic preference and future development are different judgements.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: '2026-09-29T23:00:00.000Z'
  - id: ki_d45taste_sparkling_quality_limitation
    subject_id: n_d45taste_case_sparkling_quality
    relation_type: CASE_LIMITATION
    object_id: n_d45taste_sparkling_quality_limitation_point
    domain_id: tasting
    assertion_text: >-
      Neither these fictional observations nor greater effervescence establish an official quality
      grade, market value or a guaranteed ten-year improvement. An ageing judgement also needs
      bottle condition and storage context; qualified tasting feedback is still needed to assess a
      learner's actual sensory accuracy.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: '2026-09-29T23:00:00.000Z'
  - id: ki_d45taste_sherry_sweetness_action
    subject_id: n_d45taste_case_sherry_sweetness
    relation_type: CASE_ACTION
    object_id: n_d45taste_sherry_sweetness_action_point
    domain_id: tasting
    assertion_text: >-
      From the supplied observations, shortlist E for the diner seeking nutty complexity without
      pronounced sweetness, then check the bottle and the diner's response before service. Correct
      the claim that dark colour or rounded body necessarily means sweetness; do not rename the
      coded wine as an exact category.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: '2026-09-29T23:00:00.000Z'
  - id: ki_d45taste_sherry_sweetness_reason
    subject_id: n_d45taste_case_sherry_sweetness
    relation_type: CASE_REASON
    object_id: n_d45taste_sherry_sweetness_reason_point
    domain_id: tasting
    assertion_text: >-
      E is explicitly dry in the packet despite its chestnut colour and rounded body. The Consejo
      describes Palo Cortado as a dry Sherry with developed colour and a rounded palate, providing a
      real counterexample to the colleague's universal claim without proving that E is Palo Cortado.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: '2026-09-29T23:00:00.000Z'
  - id: ki_d45taste_sherry_sweetness_tradeoff
    subject_id: n_d45taste_case_sherry_sweetness
    relation_type: CASE_TRADEOFF
    object_id: n_d45taste_sherry_sweetness_tradeoff_point
    domain_id: tasting
    assertion_text: >-
      F's pronounced sweetness conflicts with this diner’s stated brief but may suit someone seeking
      a sweet, raisined style. Both samples have persistent flavour in the packet, so the
      recommendation expresses sensory fit and preference rather than a universal quality hierarchy.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: '2026-09-29T23:00:00.000Z'
  - id: ki_d45taste_sherry_sweetness_limitation
    subject_id: n_d45taste_case_sherry_sweetness
    relation_type: CASE_LIMITATION
    object_id: n_d45taste_sherry_sweetness_limitation_point
    domain_id: tasting
    assertion_text: >-
      A chestnut colour and nutty profile do not distinguish every dry oxidative Sherry category or
      authenticate a coded bottle. Confirm the label and records for category claims; the packet
      also lacks storage and bottle-condition evidence for a precise future drinking window.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: '2026-09-29T23:00:00.000Z'
  - id: ki_d45taste_port_development_action
    subject_id: n_d45taste_case_port_development
    relation_type: CASE_ACTION
    object_id: n_d45taste_port_development_action_point
    domain_id: tasting
    assertion_text: >-
      Describe G as fruit-led and H as showing a developed, Tawny-like profile from the supplied
      evidence. Discuss possible bottle development for G only after checking its actual category
      and condition; H's developed profile can support present enjoyment without assuming another
      decade will improve it.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: '2026-09-29T23:00:00.000Z'
  - id: ki_d45taste_port_development_reason
    subject_id: n_d45taste_case_port_development
    relation_type: CASE_REASON
    object_id: n_d45taste_port_development_reason_point
    domain_id: tasting
    assertion_text: >-
      IVDP describes Ruby-style production as retaining young fruit and colour, while Tawny-style
      cask maturation develops colour and dried-fruit or wood-related aromas. These published
      tendencies support the G/H comparison but do not establish the coded samples' legal categories
      or exact ages.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: '2026-09-29T23:00:00.000Z'
  - id: ki_d45taste_port_development_tradeoff
    subject_id: n_d45taste_case_port_development
    relation_type: CASE_TRADEOFF
    object_id: n_d45taste_port_development_tradeoff_point
    domain_id: tasting
    assertion_text: >-
      Holding a suitable bottle for further development postpones enjoyment of its current fruit or
      developed character and depends on the desired style. IVDP describes marketed Tawny styles as
      ready to drink and notes differing bottle-development behaviour among Ruby categories, so one
      cellar plan need not suit both samples.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: '2026-09-29T23:00:00.000Z'
  - id: ki_d45taste_port_development_limitation
    subject_id: n_d45taste_case_port_development
    relation_type: CASE_LIMITATION
    object_id: n_d45taste_port_development_limitation_point
    domain_id: tasting
    assertion_text: >-
      Colour, dried-fruit aromas and smoothness cannot assign H an exact twenty-year age indication
      or identify G as Vintage rather than another Ruby category. Check the actual labels, bottling
      information and storage condition before a category-specific cellar recommendation; no
      guaranteed decade of improvement follows from these notes.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: '2026-09-29T23:00:00.000Z'
