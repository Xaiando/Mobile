# Original Diploma-only channel comparisons and two conditional written cases.
# All items await qualified review; timestamps record curation, not expert verification.
# Generic MCQ disabled: channel choices depend on supplied roles, costs, capabilities and demand.
# No universal profitability, legal requirement, payment default or current market statistic.
knowledge_nodes:
  - id: n_biz_routes_dtc_resources
    node_type: production_principle
    name: Why can winery-run online sales remain resource-intensive even when no distributor sells the order?
  - id: n_biz_routes_dtc_resources_point
    node_type: learning_point
    name: Fulfilment and customer-service work remains to be organised
  - id: n_biz_routes_dtc_records
    node_type: production_principle
    name: How can separate cellar-door, wine-club and website contacts constrain winery-led repeat selling?
  - id: n_biz_routes_dtc_records_point
    node_type: learning_point
    name: Disconnected customer records can limit cross-channel follow-up
  - id: n_biz_routes_downstream_sales
    node_type: production_principle
    name: Why are winery shipments into an intermediary an incomplete test of a wine's route to market?
  - id: n_biz_routes_downstream_sales_point
    node_type: learning_point
    name: Track downstream buying alongside initial placement
  - id: n_biz_routes_service_scope
    node_type: production_principle
    name: When comparing full-service wine representation with a logistics-only proposal, what role
      distinction matters?
  - id: n_biz_routes_service_scope_point
    node_type: learning_point
    name: Storage and fulfilment do not by themselves provide active selling
  - id: n_biz_routes_retail_access
    node_type: production_principle
    name: For a wine offer sold through an independent retailer's own shops and website, what access and
      commercial trade-off should a winery test?
  - id: n_biz_routes_retail_access_point
    node_type: learning_point
    name: Buyer outlet reach with negotiated trade terms
  - id: n_biz_routes_ontrade_fit
    node_type: production_principle
    name: Why should a winery's approach to a restaurant account address more than gaining a listing?
  - id: n_biz_routes_ontrade_fit_point
    node_type: learning_point
    name: Match wine-list and food fit with reliable replenishment
  - id: n_biz_routes_partner_fit
    node_type: production_principle
    name: Why can a large wine distributor be unsuitable for a winery's intended channel?
  - id: n_biz_routes_partner_fit_point
    node_type: learning_point
    name: Match portfolio, target-account access and sales capacity
  - id: n_biz_routes_reviewable_roles
    node_type: production_principle
    name: What should a winery clarify before relying on a wine partner's promised channel expansion?
  - id: n_biz_routes_reviewable_roles_point
    node_type: learning_point
    name: Agree selling responsibilities and reviewable performance measures
  - id: n_biz_routes_case_dtc_capacity
    node_type: production_case
    name: "Hypothetical winery: an existing mailing list generates repeat website orders beyond cellar-door
      visitors, but packing and customer-support delays exceed its small team's capacity. It can retain
      DTC and buy quoted outsourced packing and delivery, with customer support still its responsibility,
      or supply an independent retailer at a negotiated trade price. The retailer would handle its own
      consumer orders through its stores and website without sharing individual customer contacts. All
      routes are assumed available; wine quality and available stock are unchanged, and no demand, margin
      or net-profit estimate is supplied. Explain a defensible route or trial, why the responsibilities
      matter, a customer-access/control trade-off and a limitation. More than one approach may be
      justified."
  - id: n_biz_routes_case_dtc_capacity_action_point
    node_type: learning_point
    name: Trial a route matched to fulfilment and support capacity
  - id: n_biz_routes_case_dtc_capacity_reason_point
    node_type: learning_point
    name: Customer acquisition, service and delivery remain channel functions
  - id: n_biz_routes_case_dtc_capacity_tradeoff_point
    node_type: learning_point
    name: Retailer reach and order handling against direct customer contact
  - id: n_biz_routes_case_dtc_capacity_limitation_point
    node_type: learning_point
    name: Quoted channel costs and actual demand are still needed
  - id: n_biz_routes_case_downstream_review
    node_type: production_case
    name: "Hypothetical winery: a distribution partner has placed wine in several independent retail shops,
      but the winery receives only its own shipments-to-partner data and no outlet reorders or
      consumer-sales reports. The partner represents competing brands and offers access to restaurants as
      well as retail. A restaurant buyer says the wine might fit its menu if reliable replenishment and a
      concise staff tasting can be arranged. The winery has a limited promotional budget and wants
      sustained consumer demand rather than initial listings alone. All routes are assumed available, and
      no sales guarantee, exclusivity rule or current law is specified. Explain a defensible review or
      channel trial, the sales-flow reason, a resource trade-off and a limitation. More than one approach
      may be justified."
  - id: n_biz_routes_case_downstream_review_action_point
    node_type: learning_point
    name: Request downstream reports and test account-specific support
  - id: n_biz_routes_case_downstream_review_reason_point
    node_type: learning_point
    name: Winery sell-in does not establish continuing downstream demand
  - id: n_biz_routes_case_downstream_review_tradeoff_point
    node_type: learning_point
    name: Focused account support against limited promotional capacity
  - id: n_biz_routes_case_downstream_review_limitation_point
    node_type: learning_point
    name: Channel access and information do not guarantee purchase or reorder
