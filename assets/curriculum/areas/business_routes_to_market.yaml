knowledge_items:
  - id: ki_biz_routes_dtc_resources
    subject_id: n_biz_routes_dtc_resources
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_biz_routes_dtc_resources_point
    domain_id: business
    assertion_text: Winery-run online selling still needs order handling, packaging, delivery and a
      customer-response plan. Removing a selling intermediary does not remove those functions or
      establish lower total costs; the winery must resource them or arrange suitable services.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T14:30:20.000Z"
  - id: ki_biz_routes_dtc_records
    subject_id: n_biz_routes_dtc_records
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_biz_routes_dtc_records_point
    domain_id: business
    assertion_text: Wine Australia describes how a central customer database can connect cellar-door, club
      and online touchpoints for follow-up and cross-selling. Separate records can limit those
      opportunities; integration is a commercial capability, not a guarantee of repeat purchases.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T14:30:20.000Z"
  - id: ki_biz_routes_downstream_sales
    subject_id: n_biz_routes_downstream_sales
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_biz_routes_downstream_sales_point
    domain_id: business
    assertion_text: Initial shipment or listing establishes placement, not sustained downstream demand. A
      winery should distinguish its own sales to a partner from that partner's account sales and, where
      available, consumer buying rather than assume each stage has occurred.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T14:30:20.000Z"
  - id: ki_biz_routes_service_scope
    subject_id: n_biz_routes_service_scope
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_biz_routes_service_scope_point
    domain_id: business
    assertion_text: In Wine Australia's contrasting service examples, a full-service partner supports sales
      and marketing while a clearing/logistics service may handle storage and fulfilment without actively
      selling. Check the agreed role rather than assume a warehousing appointment supplies customer
      acquisition.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T14:30:20.000Z"
  - id: ki_biz_routes_retail_access
    subject_id: n_biz_routes_retail_access
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_biz_routes_retail_access_point
    domain_id: business
    assertion_text: A retailer can provide a consumer-facing route through its own stores or website. The
      winery should weigh that outlet access against negotiated purchasing terms and target-customer fit;
      winning a retail order does not give the winery the retailer's consumer-facing role.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T14:30:20.000Z"
  - id: ki_biz_routes_ontrade_fit
    subject_id: n_biz_routes_ontrade_fit
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_biz_routes_ontrade_fit_point
    domain_id: business
    assertion_text: Restaurant buyers may weigh cuisine compatibility, wine information and business needs
      when considering a wine. A relevant tasting and workable delivery arrangements can support the
      account; a listing alone does not ensure continuing sales or make every restaurant an appropriate
      outlet.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T14:30:20.000Z"
  - id: ki_biz_routes_partner_fit
    subject_id: n_biz_routes_partner_fit
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_biz_routes_partner_fit_point
    domain_id: business
    assertion_text: Partner evaluation should check comparable wines and price points, relationships with
      desired accounts, sales-team capacity and suitable facilities. Distributor size alone does not
      establish fit with a winery's intended channels or the attention its wine will receive.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T14:30:20.000Z"
  - id: ki_biz_routes_reviewable_roles
    subject_id: n_biz_routes_reviewable_roles
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_biz_routes_reviewable_roles_point
    domain_id: business
    assertion_text: Clarify who undertakes selling, promotion, ordering and delivery, and agree useful
      targets and review arrangements. Role clarity and performance measures help assess a partnership;
      they do not create a universal contract duration, automatic exit right or guaranteed sales.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T14:30:20.000Z"
  - id: ki_biz_routes_case_dtc_capacity_action
    subject_id: n_biz_routes_case_dtc_capacity
    relation_type: CASE_ACTION
    object_id: n_biz_routes_case_dtc_capacity_action_point
    domain_id: business
    assertion_text: Compare the work and quoted services required for each route, then test
      fulfilment-supported DTC, retailer supply or a justified mix. Any DTC trial still needs a
      customer-support plan because outsourcing packing does not remove that stated responsibility.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T14:30:20.000Z"
  - id: ki_biz_routes_case_dtc_capacity_reason
    subject_id: n_biz_routes_case_dtc_capacity
    relation_type: CASE_REASON
    object_id: n_biz_routes_case_dtc_capacity_reason_point
    domain_id: business
    assertion_text: "The routes allocate different functions: DTC requires the winery to organise consumer
      service and fulfilment, while the proposed retailer handles its own consumer orders. A direct selling
      receipt alone does not establish a better result once these tasks and costs are considered."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T14:30:20.000Z"
  - id: ki_biz_routes_case_dtc_capacity_tradeoff
    subject_id: n_biz_routes_case_dtc_capacity
    relation_type: CASE_TRADEOFF
    object_id: n_biz_routes_case_dtc_capacity_tradeoff_point
    domain_id: business
    assertion_text: The retailer offers its own outlet access and consumer-order handling but, under the
      supplied terms, does not share individual contacts. Retaining DTC preserves direct follow-up
      opportunities while leaving the winery to resource support and arrange fulfilment.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T14:30:20.000Z"
  - id: ki_biz_routes_case_dtc_capacity_limitation
    subject_id: n_biz_routes_case_dtc_capacity
    relation_type: CASE_LIMITATION
    object_id: n_biz_routes_case_dtc_capacity_limitation_point
    domain_id: business
    assertion_text: The premise gives no complete channel-cost or demand comparison, so it cannot establish
      which route earns more. Include packaging, delivery and support resources and test customer
      response; a negotiated trade price and a DTC receipt are not like-for-like net outcomes.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T14:30:20.000Z"
  - id: ki_biz_routes_case_downstream_review_action
    subject_id: n_biz_routes_case_downstream_review
    relation_type: CASE_ACTION
    object_id: n_biz_routes_case_downstream_review_action_point
    domain_id: business
    assertion_text: Request account-sales or reorder information and, where available, consumer-sales
      evidence; agree a review with the partner. A restaurant tasting and replenishment trial is
      defensible if the winery and partner can resource it; reviewing the existing retail route is also
      defensible.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T14:30:20.000Z"
  - id: ki_biz_routes_case_downstream_review_reason
    subject_id: n_biz_routes_case_downstream_review
    relation_type: CASE_REASON
    object_id: n_biz_routes_case_downstream_review_reason_point
    domain_id: business
    assertion_text: Winery shipments show sales into the partner, not whether retail customers buy the wine
      or accounts reorder. The stated objective therefore requires downstream evidence and attention to
      the buyer's menu and service conditions rather than listing counts alone.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T14:30:20.000Z"
  - id: ki_biz_routes_case_downstream_review_tradeoff
    subject_id: n_biz_routes_case_downstream_review
    relation_type: CASE_TRADEOFF
    object_id: n_biz_routes_case_downstream_review_tradeoff_point
    domain_id: business
    assertion_text: A restaurant tasting and reliable replenishment use staff time and coordination; those
      resources may compete with supporting retail outlets. Allocating the limited budget should reflect
      target-account fit and partner capability rather than assume that more listings always create more
      demand.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T14:30:20.000Z"
  - id: ki_biz_routes_case_downstream_review_limitation
    subject_id: n_biz_routes_case_downstream_review
    relation_type: CASE_LIMITATION
    object_id: n_biz_routes_case_downstream_review_limitation_point
    domain_id: business
    assertion_text: The partner's access and the restaurant's interest do not guarantee sales, and detailed
      downstream reports may be unavailable. Confirm what can be reported, agree realistic performance
      measures and assess actual response before claiming that either channel has succeeded.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T14:30:20.000Z"
