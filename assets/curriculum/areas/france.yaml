knowledge_items:
  # Burgundy
  - id: ki_chablis_location
    subject_id: n_geo_chablis
    relation_type: LOCATED_IN
    object_id: n_geo_burgundy
    domain_id: geography
    assertion_text: "Chablis is a Burgundy appellation on the slopes of the Serein valley, in the Yonne department."
    last_verified_at: "2026-09-24T12:00:00.000Z"
  - id: ki_chablis_grape
    subject_id: n_geo_chablis
    relation_type: PERMITS_PRINCIPAL_GRAPE
    object_id: n_grape_chardonnay
    domain_id: geography
    assertion_text: "Chablis is made exclusively from Chardonnay."
    last_verified_at: "2026-09-24T12:00:00.000Z"
  - id: ki_chablis_soil
    subject_id: n_geo_chablis
    relation_type: HAS_SOIL
    object_id: n_soil_kimmeridgian_marl
    domain_id: viticulture
    assertion_text: "The Chablis vineyards lie on Kimmeridgian marls, rich in fossil oysters (Exogyra virgula)."
    last_verified_at: "2026-09-24T12:00:00.000Z"
  - id: ki_chablis_climate
    subject_id: n_geo_chablis
    relation_type: HAS_CLIMATE
    object_id: n_clim_oceanic_continental
    domain_id: viticulture
    assertion_text: "Chablis has an oceanic climate modified by continental influences, with moderate rainfall and cool temperatures."
    last_verified_at: "2026-09-24T12:00:00.000Z"
    mcq_disabled: true
  - id: ki_chablis_frost
    subject_id: n_geo_chablis
    relation_type: SUSCEPTIBLE_TO
    object_id: n_hazard_spring_frost
    domain_id: viticulture
    assertion_text: "Chablis has a high risk of winter and spring frost; growers protect the vines with water sprinklers and heaters."
    last_verified_at: "2026-09-24T12:00:00.000Z"
    mcq_disabled: true
  - id: ki_volnay_location
    subject_id: n_geo_volnay
    relation_type: LOCATED_IN
    object_id: n_geo_cote_de_beaune
    domain_id: geography
    assertion_text: "Volnay is a red-wine appellation of the Côte de Beaune in Burgundy."
    last_verified_at: "2026-09-24T12:00:00.000Z"
  - id: ki_volnay_grape
    subject_id: n_geo_volnay
    relation_type: PERMITS_PRINCIPAL_GRAPE
    object_id: n_grape_pinot_noir
    domain_id: geography
    assertion_text: "Pinot Noir is the principal grape variety of Volnay."
    last_verified_at: "2026-09-24T12:00:00.000Z"
  - id: ki_volnay_accessory_chardonnay
    subject_id: n_geo_volnay
    relation_type: PERMITS_ACCESSORY_GRAPE
    object_id: n_grape_chardonnay
    domain_id: geography
    assertion_text: "Chardonnay is an accessory variety in Volnay: accessory varieties may only be interplanted, at most 15% of each plot."
    last_verified_at: "2026-09-24T12:00:00.000Z"
