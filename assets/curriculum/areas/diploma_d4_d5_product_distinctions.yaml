knowledge_items:
- id: ki_d4d5_bourgogne_base
  subject_id: n_d4d5_principle_bourgogne_base
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d4d5_point_bourgogne_base
  domain_id: winemaking
  assertion_text: The Bourgogne wine body describes earlier picking than for still wines to retain acidity,
    followed by a second fermentation in bottle. Variety and site still affect the final wine.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4d5_saumur_bottle
  subject_id: n_d4d5_principle_saumur_bottle
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d4d5_point_saumur_bottle
  domain_id: winemaking
  assertion_text: The Saumur appellation specification requires sparkling wines to be made exclusively by second
    fermentation in bottle; the region name alone does not fix sweetness or quality.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4d5_trento_riserva
  subject_id: n_d4d5_principle_trento_riserva
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d4d5_point_trento_riserva
  domain_id: winemaking
  assertion_text: The Trento DOC Institute describes at least 36 months on lees for Riserva, compared with
    15 months for non-vintage and 24 months for Millesimato. This is a release-time constraint, not a blind-tasting
    score.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4d5_sorbara_dry
  subject_id: n_d4d5_principle_sorbara_dry
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d4d5_point_sorbara_dry
  domain_id: winemaking
  assertion_text: The Lambrusco consortium describes Sorbara as light red or rosé, fresh and elegant, and lists
    dry through sweet versions. A wine list should ask for the actual producer and sweetness style.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4d5_grasparossa_body
  subject_id: n_d4d5_principle_grasparossa_body
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d4d5_point_grasparossa_body
  domain_id: winemaking
  assertion_text: The Lambrusco consortium describes Grasparossa di Castelvetro as more full-bodied and tannic
    than the lighter Sorbara profile. This category comparison does not substitute for tasting a particular
    bottle.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4d5_palo_route
  subject_id: n_d4d5_principle_palo_route
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d4d5_point_palo_route
  domain_id: winemaking
  assertion_text: The Sherry Consejo describes a wine initially fortified for flor, then selected after sobretabla,
    fortified above 17% and redirected to oxidative maturation. A Palo Cortado is not made by merely sweetening
    Oloroso.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4d5_palo_dry
  subject_id: n_d4d5_principle_palo_dry
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d4d5_point_palo_dry
  domain_id: winemaking
  assertion_text: The Consejo classifies Palo Cortado among dry Sherries and publishes a low residual-sugar
    range; its roundness and colour do not make it a sweet dessert wine.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4d5_lbv_vintage
  subject_id: n_d4d5_principle_lbv_vintage
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d4d5_point_lbv_vintage
  domain_id: winemaking
  assertion_text: IVDP describes both LBV and Vintage Port as single-harvest Ruby styles, with LBV held four
    to six years before bottling and Vintage bottled two to three years after harvest. Their specific drinking
    windows still need label and bottle evidence.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4d5_colheita_cask
  subject_id: n_d4d5_principle_colheita_cask
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d4d5_point_colheita_cask
  domain_id: winemaking
  assertion_text: IVDP describes Colheita as a single-harvest Tawny with at least seven years in cask, in contrast
    to the earlier-bottled Vintage Ruby route. A date alone does not establish the maturation style.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4d5_white_port_age
  subject_id: n_d4d5_principle_white_port_age
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d4d5_point_white_port_age
  domain_id: winemaking
  assertion_text: IVDP lists Reserve White, age-indicated White Port and White Colheita among special wood-aged
    white categories. White Port should not be taught as only a youthful chilled aperitif.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4d5_case_italian_list_action
  subject_id: n_d4d5_case_italian_list
  relation_type: CASE_ACTION
  object_id: n_d4d5_point_case_italian_list_action
  domain_id: winemaking
  assertion_text: A defensible list decision compares sample quality and actual landed margin against the restaurant
    brief rather than buying by category name.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4d5_case_italian_list_reason
  subject_id: n_d4d5_case_italian_list
  relation_type: CASE_REASON
  object_id: n_d4d5_point_case_italian_list_reason
  domain_id: winemaking
  assertion_text: Trentodoc's published Riserva minimum is 36 months on lees, while the Lambrusco consortium
    lists dry, light-coloured Sorbara styles.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4d5_case_italian_list_tradeoff
  subject_id: n_d4d5_case_italian_list
  relation_type: CASE_TRADEOFF
  object_id: n_d4d5_point_case_italian_list_tradeoff
  domain_id: winemaking
  assertion_text: The long-lees white sparkling and fresh red sparkling fulfil different list roles; carrying
    one foregoes the other and stock cost remains conditional.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4d5_case_italian_list_limitation
  subject_id: n_d4d5_case_italian_list
  relation_type: CASE_LIMITATION
  object_id: n_d4d5_point_case_italian_list_limitation
  domain_id: winemaking
  assertion_text: The published category descriptions cannot establish which individual offer tastes better,
    sells faster or yields a viable margin.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4d5_case_port_release_action
  subject_id: n_d4d5_case_port_release
  relation_type: CASE_ACTION
  object_id: n_d4d5_point_case_port_release_action
  domain_id: winemaking
  assertion_text: Compare actual samples, bottling and storage records and costs before selecting a dated Port
    for near-term service.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4d5_case_port_release_reason
  subject_id: n_d4d5_case_port_release
  relation_type: CASE_REASON
  object_id: n_d4d5_point_case_port_release_reason
  domain_id: winemaking
  assertion_text: IVDP describes LBV as four to six years before bottling, Vintage as earlier bottled for bottle
    development, and Colheita as single-harvest Tawny cask-aged at least seven years.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4d5_case_port_release_tradeoff
  subject_id: n_d4d5_case_port_release
  relation_type: CASE_TRADEOFF
  object_id: n_d4d5_point_case_port_release_tradeoff
  domain_id: winemaking
  assertion_text: Holding a Vintage for bottle development can tie up hotel inventory, while a ready-to-list
    LBV or Colheita changes the service plan; the cost direction needs quotes.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4d5_case_port_release_limitation
  subject_id: n_d4d5_case_port_release
  relation_type: CASE_LIMITATION
  object_id: n_d4d5_point_case_port_release_limitation
  domain_id: winemaking
  assertion_text: A common vintage does not prove current bottle condition, sweetness balance, quality ranking
    or achievable selling price.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
