# Original D4/D5 product comparisons. Source bounded; expert review pending.
knowledge_nodes:
- id: n_d4d5_principle_bourgogne_base
  node_type: production_principle
  name: Why does a Crémant de Bourgogne base-wine brief differ from a still-wine harvest brief?
- id: n_d4d5_point_bourgogne_base
  node_type: learning_point
  name: Earlier picking can preserve base-wine acidity for bottle fermentation
- id: n_d4d5_principle_saumur_bottle
  node_type: production_principle
  name: Can Saumur mousseux be described as a generic tank-fermented Loire sparkling wine?
- id: n_d4d5_point_saumur_bottle
  node_type: learning_point
  name: The Saumur mousseux rules require second fermentation in bottle
- id: n_d4d5_principle_trento_riserva
  node_type: production_principle
  name: What does the Trento DOC Riserva claim establish for cellar planning?
- id: n_d4d5_point_trento_riserva
  node_type: learning_point
  name: Riserva requires a longer lees holding period than standard Trento DOC
- id: n_d4d5_principle_sorbara_dry
