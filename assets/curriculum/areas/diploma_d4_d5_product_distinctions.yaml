  name: What cellar decision distinguishes the classic Palo Cortado route?
- id: n_d4d5_point_palo_route
  node_type: learning_point
  name: A fine flor-directed wine is reclassified and redirected to oxidative ageing
- id: n_d4d5_principle_palo_dry
