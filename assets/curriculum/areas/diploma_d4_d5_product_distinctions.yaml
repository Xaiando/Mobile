  name: Why is a dated Colheita distinct from Vintage Port despite a shared harvest year?
- id: n_d4d5_point_colheita_cask
  node_type: learning_point
  name: Colheita is a single-harvest Tawny aged in cask for at least seven years
- id: n_d4d5_principle_white_port_age
  node_type: production_principle
  name: Can White Port carry an age indication or Colheita designation?
- id: n_d4d5_point_white_port_age
  node_type: learning_point
  name: IVDP recognises wood-aged White Port categories as well as youthful styles
