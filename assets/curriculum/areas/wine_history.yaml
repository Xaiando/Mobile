knowledge_items:
  - id: ki_hist_georgia_wine
    subject_id: n_hist_georgia_wine
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_hist_georgia_wine_point
    domain_id: service
    assertion_text: "McGovern and colleagues report the earliest biomolecular evidence they obtained for grape wine in the Near East, about 6000–5800 BC, from pottery at Shulaveris Gora and Gadachrili Gora in Georgia. That is chemical evidence of grape wine, not a complete winery, and it does not prove no older fermented drink will be found."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hist_areni_cave
    subject_id: n_hist_areni_cave
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_hist_areni_cave_point
    domain_id: service
    assertion_text: "Areni-1 in Armenia has installations and jars from around 4000 calibrated BCE, and malvidin on pottery from that production context. It is evidence of a wine-making installation. It is not the oldest wine residue: the Georgian grape-wine residues are older."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hist_pliny_falernian
    subject_id: n_hist_pliny_falernian
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_hist_pliny_falernian_point
    domain_id: service
    assertion_text: "In Natural History book 14, Pliny says no wine of his own day ranked higher than Falernian. He describes a dry, a sweet and a light style, and a slope order of Caucinian on the hilltops, Faustian halfway up and Falernian at the bottom. This is a Roman literary ranking, not a modern appellation."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hist_merret_1662
    subject_id: n_hist_merret_1662
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_hist_merret_1662_point
    domain_id: service
    assertion_text: "On 17 December 1662 Christopher Merrett told the Royal Society that English wine-coopers used large amounts of sugar and molasses to make wines brisk and sparkling. That is a documented description of deliberately making wine sparkling. It is not a distillation method."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hist_perignon_myth
    subject_id: n_hist_perignon_myth
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_hist_perignon_myth_point
    domain_id: service
    assertion_text: "Pierre Pérignon became cellar master at Hautvillers after Merrett's 1662 paper. The Royal College of Physicians account says his task included preventing bubbles. That account does not make him the inventor of the method Merrett had already described, and the later slogan that he was tasting the stars is not part of the 1662 paper."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hist_douro_1756
    subject_id: n_hist_douro_1756
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_hist_douro_1756_point
    domain_id: service
    assertion_text: "A royal charter of 10 September 1756 instituted the Companhia Geral da Agricultura das Vinhas do Alto Douro, under the future Marquis of Pombal, to control quality and prices and to demarcate the vineyards. The Portuguese monuments inventory notes earlier delimited zones, including Chianti in 1716 and Tokaj in 1737, so this charter is not the first line ever drawn around vines."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hist_berlin_1806
    subject_id: n_hist_berlin_1806
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_hist_berlin_1806_point
    domain_id: service
    assertion_text: "Napoleon I's Berlin Decree of 21 November 1806 declared the British Isles blockaded and prohibited commerce and correspondence with them. It is a trade blockade. It is not a Bordeaux classification, and it is not the work of Napoleon III."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hist_classement_1855
    subject_id: n_hist_classement_1855
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_hist_classement_1855_point
    domain_id: service
    assertion_text: "For the Paris Universal Exhibition of 1855, Napoleon III asked Bordeaux's brokers to rank the region's wines by reputation and by the prices of recent vintages. The ranking covers Médoc red wines, the Graves red wine Château Haut-Brion, and the sweet wines of Sauternes and Barsac. It does not include Saint-Émilion or Pomerol, and it was not commissioned by Napoleon I."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hist_phylloxera_graft
    subject_id: n_hist_phylloxera_graft
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_hist_phylloxera_graft_point
    domain_id: service
    assertion_text: "Grape phylloxera is an aphid-like insect that feeds on the roots of Vitis vinifera and can stunt or kill the vine. University of California guidance treats resistant American rootstocks, including Vitis riparia, Vitis rupestris and their hybrids, as the effective control, and it does not treat insecticides as a complete remedy."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hist_prohibition_18th
    subject_id: n_hist_prohibition_18th
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_hist_prohibition_18th_point
    domain_id: service
    assertion_text: "The US National Archives records the Eighteenth Amendment as passed by Congress on 18 December 1917 and ratified on 16 January 1919. National Prohibition then took effect on 16 January 1920. The same record says the Twenty-first Amendment later repealed it."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hist_repeal_21st
    subject_id: n_hist_repeal_21st
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_hist_repeal_21st_point
    domain_id: service
    assertion_text: "The Twenty-first Amendment was passed by Congress on 20 February 1933 and ratified on 5 December 1933. Its first section repeals the Eighteenth Amendment. Its second section still prohibits transporting intoxicating liquors into a state in violation of that state's own law."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hist_eu_wine_definition
    subject_id: n_hist_eu_wine_definition
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_hist_eu_wine_definition_point
    domain_id: service
    assertion_text: "In the consolidated text of Regulation (EU) No 1308/2013, wine means the product obtained exclusively from the total or partial alcoholic fermentation of fresh grapes, whether or not crushed, or of grape must. The ordinary minimum actual strength is 8.5 percent in zones A and B and 9 percent elsewhere, with a derogation to 4.5 percent for some protected wines, and total strength is normally not above 15 percent, with stated exceptions. Wine in that definition is not a distilled spirit."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hist_methuen_1703
    subject_id: n_hist_methuen_1703
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_hist_methuen_1703_point
    domain_id: service
    assertion_text: "The commercial treaty concluded in Lisbon on 27 December 1703 admitted British woollen cloth into Portugal and admitted wine of Portuguese growth into Britain at a duty one third below the duty on the same measure of French wine, in peace or war. It is a customs treaty. It is not the 1756 Douro demarcation, and it does not by itself define Port."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hist_aoc_1935
    subject_id: n_hist_aoc_1935
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_hist_aoc_1935_point
    domain_id: service
    assertion_text: "The French wine code, in the text published for 25 November 1967, records a category of controlled appellations of origin for wines and eaux-de-vie and ties that category to the decree of 30 July 1935. The stated conditions include the production area, the grape varieties, the yield per hectare, a minimum alcoholic strength from vinification without enrichment, and the methods of growing and making the wine."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hist_paris_1976
    subject_id: n_hist_paris_1976
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_hist_paris_1976_point
    domain_id: service
    assertion_text: "On 24 May 1976 Steven Spurrier and Patricia Gallagher organized a blind tasting in Paris. Nine French judges compared six California Chardonnays with four white Burgundies, and six California Cabernet Sauvignons with four red Bordeaux. The Smithsonian records that the 1973 Chateau Montelena Chardonnay and the 1973 Stag's Leap Wine Cellars S.L.V. Cabernet Sauvignon scored first in their groups. That is the result of that tasting. It is not a permanent ranking of every wine."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true

