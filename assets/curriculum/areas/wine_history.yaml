# Essential wine history, from the earliest cited grape-wine residues to the
# current EU definition. Authored 27 September 2026. Every item is unverified.
# These are study points, not a complete world history and not map boundaries.
# None are mapped to WSET Levels 1–3. Codex owns those levels.
knowledge_nodes:
  - { id: n_hist_georgia_wine, node_type: production_principle, name: "What is the earliest cited chemical evidence of grape wine in the Near East?" }
  - { id: n_hist_georgia_wine_point, node_type: learning_point, name: "Georgian Neolithic grape-wine residues" }
  - { id: n_hist_areni_cave, node_type: production_principle, name: "What did Areni-1 add to the history of wine, and what did it not?" }
  - { id: n_hist_areni_cave_point, node_type: learning_point, name: "Areni-1 wine installation, not the oldest residue" }
  - { id: n_hist_pliny_falernian, node_type: production_principle, name: "How does Pliny rank Falernian in his own day?" }
  - { id: n_hist_pliny_falernian_point, node_type: learning_point, name: "Pliny ranks Falernian in his own day" }
  - { id: n_hist_merret_1662, node_type: production_principle, name: "Who documented sugar being added to make wine sparkling, and when?" }
  - { id: n_hist_merret_1662_point, node_type: learning_point, name: "Merrett described sparkling wine in 1662" }
  - { id: n_hist_perignon_myth, node_type: production_principle, name: "Did Dom Pérignon invent the sparkling method Merrett described?" }
  - { id: n_hist_perignon_myth_point, node_type: learning_point, name: "Dom Pérignon is not the documented inventor" }
  - { id: n_hist_douro_1756, node_type: production_principle, name: "What did the Douro charter of 1756 do, and what did it not?" }
  - { id: n_hist_douro_1756_point, node_type: learning_point, name: "1756 Douro charter, not the first vineyard line" }
  - { id: n_hist_berlin_1806, node_type: production_principle, name: "What was Napoleon I's Berlin Decree, in wine history?" }
  - { id: n_hist_berlin_1806_point, node_type: learning_point, name: "Berlin Decree is a blockade, not a classification" }
  - { id: n_hist_classement_1855, node_type: production_principle, name: "Who commissioned the 1855 Bordeaux ranking, and which wines did it cover?" }
  - { id: n_hist_classement_1855_point, node_type: learning_point, name: "1855 ranking under Napoleon III" }
  - { id: n_hist_phylloxera_graft, node_type: production_principle, name: "How is grape phylloxera controlled on Vitis vinifera?" }
  - { id: n_hist_phylloxera_graft_point, node_type: learning_point, name: "Phylloxera is controlled by resistant rootstocks" }
  - { id: n_hist_prohibition_18th, node_type: production_principle, name: "When did US national Prohibition take effect?" }
  - { id: n_hist_prohibition_18th_point, node_type: learning_point, name: "Eighteenth Amendment national prohibition" }
  - { id: n_hist_repeal_21st, node_type: production_principle, name: "What did the Twenty-first Amendment do to Prohibition?" }
  - { id: n_hist_repeal_21st_point, node_type: learning_point, name: "Twenty-first Amendment repealed prohibition" }
  - { id: n_hist_eu_wine_definition, node_type: production_principle, name: "What does current EU law mean by wine?" }
  - { id: n_hist_eu_wine_definition_point, node_type: learning_point, name: "EU wine is fermented fresh grapes or must" }
  - { id: n_hist_methuen_1703, node_type: production_principle, name: "What did the 1703 Methuen commercial treaty do for Portuguese wine?" }
  - { id: n_hist_methuen_1703_point, node_type: learning_point, name: "Methuen cut the British duty on Portuguese wine" }
