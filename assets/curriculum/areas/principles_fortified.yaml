knowledge_items:
  - id: "ki_fort_port_sugar"
    subject_id: "n_fort_principle_port_sugar"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_port_sugar"
    domain_id: "winemaking"
    assertion_text: "Adding grape spirit interrupts fermentation; the timing influences how much grape sugar remains."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_port_stop"
    subject_id: "n_fort_principle_port_stop"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_port_stop"
    domain_id: "winemaking"
    assertion_text: "Spirit raises alcohol and arrests fermentation before all fermentable grape sugar has been consumed."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_port_ruby"
    subject_id: "n_fort_principle_port_ruby"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_port_ruby"
    domain_id: "winemaking"
    assertion_text: "Ruby-style maturation aims to restrain colour evolution and retain the fruit character of young wine."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_port_tawny"
    subject_id: "n_fort_principle_port_tawny"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_port_tawny"
    domain_id: "winemaking"
    assertion_text: "Cask maturation develops tawny colour and dried-fruit characters; this is a different aim from preserving young Ruby fruit."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_port_vintage"
    subject_id: "n_fort_principle_port_vintage"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_port_vintage"
    domain_id: "winemaking"
    assertion_text: "Vintage Port can evolve substantially in bottle; cask-aged Tawny styles are usually prepared for drinking when released."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_port_lbv"
    subject_id: "n_fort_principle_port_lbv"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_port_lbv"
    domain_id: "winemaking"
    assertion_text: "IVDP describes most LBV as ready when purchased while some continue to develop in bottle; the label matters."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_port_colheita"
    subject_id: "n_fort_principle_port_colheita"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_port_colheita"
    domain_id: "winemaking"
    assertion_text: "Colheita is a single-harvest Tawny-style wine; usual Tawny blends combine wines of different years."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_port_white_dry"
    subject_id: "n_fort_principle_port_white_dry"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_port_white_dry"
    domain_id: "winemaking"
    assertion_text: "Allowing more fermentation before fortification consumes more sugar and supports a drier White Port style."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_sherry_classify"
    subject_id: "n_fort_principle_sherry_classify"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_sherry_classify"
    domain_id: "winemaking"
    assertion_text: "Tasting and analysis help identify delicate wines for flor ageing and more structured wines for oxidative ageing."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_sherry_flor_level"
    subject_id: "n_fort_principle_sherry_flor_level"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_sherry_flor_level"
    domain_id: "winemaking"
    assertion_text: "Traditional fortification for flor-aged styles permits flor to persist; stronger fortification can prevent flor and redirect the wine to oxidative ageing."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_sherry_flor_ethanol"
    subject_id: "n_fort_principle_sherry_flor_ethanol"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_sherry_flor_ethanol"
    domain_id: "winemaking"
    assertion_text: "During biological ageing, flor yeasts use ethanol and oxygen and produce acetaldehyde; this is distinct from alcoholic fermentation."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_sherry_acetaldehyde"
    subject_id: "n_fort_principle_sherry_acetaldehyde"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_sherry_acetaldehyde"
    domain_id: "winemaking"
    assertion_text: "Flor metabolism increases acetaldehyde, contributing to the characteristic pungent aroma of biologically aged wines."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_sherry_glycerol"
    subject_id: "n_fort_principle_sherry_glycerol"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_sherry_glycerol"
    domain_id: "winemaking"
    assertion_text: "Flor consumes glycerol among other wine components; this helps explain the comparatively lean texture of biologically aged wines."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_sherry_ullage"
    subject_id: "n_fort_principle_sherry_ullage"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_sherry_ullage"
    domain_id: "winemaking"
    assertion_text: "A wine surface beneath an air space allows flor development and oxygen access; completely filling the butt defeats that biological objective."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_sherry_amontillado"
    subject_id: "n_fort_principle_sherry_amontillado"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_sherry_amontillado"
    domain_id: "winemaking"
    assertion_text: "Amontillado develops first beneath flor and subsequently without it; the balance reflects the duration of the two phases."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_sherry_oloroso"
    subject_id: "n_fort_principle_sherry_oloroso"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_sherry_oloroso"
    domain_id: "winemaking"
    assertion_text: "Oloroso is made from completely fermented base wine and aged oxidatively; rich body does not itself prove residual sweetness."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_sherry_solera"
    subject_id: "n_fort_principle_sherry_solera"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_sherry_solera"
    domain_id: "winemaking"
    assertion_text: "Partial withdrawals and refreshments mix wines across successive ageing stages, helping maintain a recognisable house style."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_sherry_saca"
    subject_id: "n_fort_principle_sherry_saca"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_sherry_saca"
    domain_id: "winemaking"
    assertion_text: "Wine for bottling is taken from the oldest scale; progressively younger criaderas replenish the space through successive refreshments."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_sherry_refresh"
    subject_id: "n_fort_principle_sherry_refresh"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_sherry_refresh"
    domain_id: "winemaking"
    assertion_text: "Younger wine provides nutrients used by the active flor population; inadequate refreshment can contribute to declining flor and oxidation."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_sherry_px"
    subject_id: "n_fort_principle_sherry_px"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_sherry_px"
    domain_id: "winemaking"
    assertion_text: "Asoleo turns ripe Pedro Ximénez grapes towards raisins, concentrating sugars before pressing and a fermentation interrupted by spirit."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_sherry_cream"
    subject_id: "n_fort_principle_sherry_cream"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_sherry_cream"
    domain_id: "winemaking"
    assertion_text: "One common route blends an oxidatively aged dry wine, often Oloroso, with a naturally sweet component such as Pedro Ximénez."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_madeira_sweetness"
    subject_id: "n_fort_principle_madeira_sweetness"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_madeira_sweetness"
    domain_id: "winemaking"
    assertion_text: "Partial or fuller fermentation before spirit addition helps determine residual sweetness; Madeira is produced in several sweetness styles."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_madeira_estufagem"
    subject_id: "n_fort_principle_madeira_estufagem"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_madeira_estufagem"
    domain_id: "winemaking"
    assertion_text: "The described estufagem route heats wine in stainless-steel tanks using hot-water coils; heating is part of production rather than accidental storage damage."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_madeira_canteiro"
    subject_id: "n_fort_principle_madeira_canteiro"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_madeira_canteiro"
    domain_id: "winemaking"
    assertion_text: "Canteiro matures wine in casks in warm cellar areas, often upper floors, with oxidative development over an extended period."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_madeira_rest"
    subject_id: "n_fort_principle_madeira_rest"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_madeira_rest"
    domain_id: "winemaking"
    assertion_text: "IVBAM describes a resting stage after heating before the winemaker assesses and finishes the wine for bottling."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_madeira_concentration"
    subject_id: "n_fort_principle_madeira_concentration"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_madeira_concentration"
    domain_id: "winemaking"
    assertion_text: "Loss of water and wine volume during warm cask maturation can concentrate remaining components; managing losses is part of cellar work."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_madeira_locations"
    subject_id: "n_fort_principle_madeira_locations"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_madeira_locations"
    domain_id: "winemaking"
    assertion_text: "The described cellar practice includes moving wine from warmer to cooler warehouses and sometimes using larger vessels to reduce evaporative losses."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_vdn_mutage"
    subject_id: "n_fort_principle_vdn_mutage"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_vdn_mutage"
    domain_id: "winemaking"
    assertion_text: "Adding wine-derived alcohol during fermentation stops yeast before all grape sugar is converted; the sweetness is retained from the fruit."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_vdn_marc"
    subject_id: "n_fort_principle_vdn_marc"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_vdn_marc"
    domain_id: "winemaking"
    assertion_text: "Fortifying while skins remain, followed by maceration in the alcoholic medium, supports extraction of colour, flavour and structure."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_vdn_young"
    subject_id: "n_fort_principle_vdn_young"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_vdn_young"
    domain_id: "winemaking"
    assertion_text: "The CIVR contrasts early-bottled Muscat de Rivesaltes with long air-contact maturation for oxidative VDN styles; the desired expression guides the choice."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_vdn_oxidative"
    subject_id: "n_fort_principle_vdn_oxidative"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_vdn_oxidative"
    domain_id: "winemaking"
    assertion_text: "CIVR describes Ambré and Tuilé styles developing through air-contact maturation in wood or tanks rather than the early-bottled youthful route."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_ruth_spirit"
    subject_id: "n_fort_principle_ruth_spirit"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_ruth_spirit"
    domain_id: "winemaking"
    assertion_text: "Chambers uses neutral grape spirit to stop a partial fermentation while allowing varietal fruit expression; this is a producer-specific choice."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_ruth_sugar"
    subject_id: "n_fort_principle_ruth_sugar"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_ruth_sugar"
    domain_id: "winemaking"
    assertion_text: "Chambers describes ripe, high-sugar fruit and only partial fermentation before fortification, retaining substantial natural grape sugar."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_ruth_parcels"
    subject_id: "n_fort_principle_ruth_parcels"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_ruth_parcels"
    domain_id: "winemaking"
    assertion_text: "Separate parcels permit bench trials and selection for the final blend; keeping them separate initially does not mean selling a single-vintage wine."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_ruth_casks"
    subject_id: "n_fort_principle_ruth_casks"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_ruth_casks"
    domain_id: "winemaking"
    assertion_text: "Chambers describes ageing in old, large casks; this supports maturation without making new-oak flavour the central objective."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_ruth_classification"
    subject_id: "n_fort_principle_ruth_classification"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_ruth_classification"
    domain_id: "winemaking"
    assertion_text: "The described regional progression considers richness, complexity and flavour intensity; age supplies a clue rather than the sole classification criterion."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_ruth_youthful_blend"
    subject_id: "n_fort_principle_ruth_youthful_blend"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_fort_point_ruth_youthful_blend"
    domain_id: "winemaking"
    assertion_text: "Pfeiffer blends cask-aged parcels to retain a youthful, fresh character while adding complexity and concentration; other producers have their own house styles."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_case_port_fruit_action"
    subject_id: "n_fort_case_port_fruit"
    relation_type: "CASE_ACTION"
    object_id: "n_fort_point_case_port_fruit_action"
    domain_id: "winemaking"
    assertion_text: "Choose parcels and maturation directed towards preserving Ruby-style fruit and colour rather than relying on strongly oxidative Tawny-style stocks."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_case_port_fruit_reason"
    subject_id: "n_fort_case_port_fruit"
    relation_type: "CASE_REASON"
    object_id: "n_fort_point_case_port_fruit_reason"
    domain_id: "winemaking"
    assertion_text: "The Ruby objective retains young fruit and deep colour; long oxidative maturation instead promotes the mature colour and dried-fruit profile."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_case_port_fruit_tradeoff"
    subject_id: "n_fort_case_port_fruit"
    relation_type: "CASE_TRADEOFF"
    object_id: "n_fort_point_case_port_fruit_tradeoff"
    domain_id: "winemaking"
    assertion_text: "Selecting a youthful profile sacrifices some of the dried-fruit and mature complexity sought in Tawny-style wines; neither profile is inherently preferable."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_case_port_fruit_limitation"
    subject_id: "n_fort_case_port_fruit"
    relation_type: "CASE_LIMITATION"
    object_id: "n_fort_point_case_port_fruit_limitation"
    domain_id: "winemaking"
    assertion_text: "Vintage and some LBV wines can develop in bottle; choosing a Ruby-style objective alone does not determine release readiness or drinking maturity."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_case_flor_oxygen_action"
    subject_id: "n_fort_case_flor_oxygen"
    relation_type: "CASE_ACTION"
    object_id: "n_fort_point_case_flor_oxygen_action"
    domain_id: "winemaking"
    assertion_text: "Keep a suitable wine surface and air space for flor while assessing refreshment and cellar conditions; completely filling the butt conflicts with biological ageing."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_case_flor_oxygen_reason"
    subject_id: "n_fort_case_flor_oxygen"
    relation_type: "CASE_REASON"
    object_id: "n_fort_point_case_flor_oxygen_reason"
    domain_id: "winemaking"
    assertion_text: "Flor requires oxygen at the wine surface and uses it in metabolism; excluding all oxygen would undermine the intended biological activity."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_case_flor_oxygen_tradeoff"
    subject_id: "n_fort_case_flor_oxygen"
    relation_type: "CASE_TRADEOFF"
    object_id: "n_fort_point_case_flor_oxygen_tradeoff"
    domain_id: "winemaking"
    assertion_text: "Healthy flor protects wine against direct oxidation, so retaining an air space while flor is weak calls for monitoring rather than assuming full protection."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_case_flor_oxygen_limitation"
    subject_id: "n_fort_case_flor_oxygen"
    relation_type: "CASE_LIMITATION"
    object_id: "n_fort_point_case_flor_oxygen_limitation"
    domain_id: "winemaking"
    assertion_text: "Oxygen access alone is insufficient: nutrient refreshment, temperature, humidity and yeast adaptation also influence flor persistence."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_case_madeira_slow_action"
    subject_id: "n_fort_case_madeira_slow"
    relation_type: "CASE_ACTION"
    object_id: "n_fort_point_case_madeira_slow_action"
    domain_id: "winemaking"
    assertion_text: "Retain a cask-maturation plan for the chosen canteiro objective and assess the wine's development; do not equate a brief heating treatment with that route."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_case_madeira_slow_reason"
    subject_id: "n_fort_case_madeira_slow"
    relation_type: "CASE_REASON"
    object_id: "n_fort_point_case_madeira_slow_reason"
    domain_id: "winemaking"
    assertion_text: "The chosen process combines naturally warm cellar conditions and oxidative cask maturation; it is a development process rather than simply a heat dose."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_case_madeira_slow_tradeoff"
    subject_id: "n_fort_case_madeira_slow"
    relation_type: "CASE_TRADEOFF"
    object_id: "n_fort_point_case_madeira_slow_tradeoff"
    domain_id: "winemaking"
    assertion_text: "Long warm-cask storage can lose volume and concentrate the wine, creating a yield tradeoff alongside the desired mature character."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_case_madeira_slow_limitation"
    subject_id: "n_fort_case_madeira_slow"
    relation_type: "CASE_LIMITATION"
    object_id: "n_fort_point_case_madeira_slow_limitation"
    domain_id: "winemaking"
    assertion_text: "Cellar location and vessel choices can manage losses; a heating-method name alone does not establish the wine's finished balance or readiness."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_case_vdn_fresh_action"
    subject_id: "n_fort_case_vdn_fresh"
    relation_type: "CASE_ACTION"
    object_id: "n_fort_point_case_vdn_fresh_action"
    domain_id: "winemaking"
    assertion_text: "Use a maturation and bottling plan directed at the young Muscat style rather than adopting prolonged oxidative VDN maturation."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_case_vdn_fresh_reason"
    subject_id: "n_fort_case_vdn_fresh"
    relation_type: "CASE_REASON"
    object_id: "n_fort_point_case_vdn_fresh_reason"
    domain_id: "winemaking"
    assertion_text: "Young Muscat is described with fresh fruit and floral expression, whereas ageing deepens colour and shifts its aromas towards honey and preserved fruit."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_case_vdn_fresh_tradeoff"
    subject_id: "n_fort_case_vdn_fresh"
    relation_type: "CASE_TRADEOFF"
    object_id: "n_fort_point_case_vdn_fresh_tradeoff"
    domain_id: "winemaking"
    assertion_text: "The youthful route gives up some aromatic evolution and complexity associated with longer maturation; this follows the selected style objective."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_case_vdn_fresh_limitation"
    subject_id: "n_fort_case_vdn_fresh"
    relation_type: "CASE_LIMITATION"
    object_id: "n_fort_point_case_vdn_fresh_limitation"
    domain_id: "winemaking"
    assertion_text: "Mutage retains grape sugar by stopping fermentation, but it does not itself fix the later maturation style; an older Muscat can be intentional."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_case_ruth_balance_action"
    subject_id: "n_fort_case_ruth_balance"
    relation_type: "CASE_ACTION"
    object_id: "n_fort_point_case_ruth_balance_action"
    domain_id: "winemaking"
    assertion_text: "Compare measured bench blends using fresher parcels and smaller mature contributions before deciding the blend; the proportions depend on the house objective."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_case_ruth_balance_reason"
    subject_id: "n_fort_case_ruth_balance"
    relation_type: "CASE_REASON"
    object_id: "n_fort_point_case_ruth_balance_reason"
    domain_id: "winemaking"
    assertion_text: "Pfeiffer describes the foundation style as youthful and fresh while retaining some complexity; a blend can be adjusted to fit that objective."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_case_ruth_balance_tradeoff"
    subject_id: "n_fort_case_ruth_balance"
    relation_type: "CASE_TRADEOFF"
    object_id: "n_fort_point_case_ruth_balance_tradeoff"
    domain_id: "winemaking"
    assertion_text: "Reducing the contribution of mature rich parcels can reduce concentration and rancio intensity; those characters suit other style objectives."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-26T23:29:32.000Z"
  - id: "ki_fort_case_ruth_balance_limitation"
    subject_id: "n_fort_case_ruth_balance"
    relation_type: "CASE_LIMITATION"
    object_id: "n_fort_point_case_ruth_balance_limitation"
