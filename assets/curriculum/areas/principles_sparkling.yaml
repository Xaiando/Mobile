knowledge_items:
  - id: ki_spark_traditional
    subject_id: n_spark_principle_traditional
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_traditional
    domain_id: winemaking
    assertion_text: The traditional method creates its second alcoholic fermentation in bottle, retaining the
      fermentation gas in the wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_tirage
    subject_id: n_spark_principle_tirage
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_tirage
    domain_id: winemaking
    assertion_text: Tirage supplies fermentable sugar and yeast to the base wine; this differs from sweetness
      adjustment after disgorgement.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_more_alcohol
    subject_id: n_spark_principle_more_alcohol
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_more_alcohol
    domain_id: winemaking
    assertion_text: Yeast converts tirage sugar into alcohol and carbon dioxide, increasing alcohol above that
      of the base wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_tank
    subject_id: n_spark_principle_tank
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_tank
    domain_id: winemaking
    assertion_text: In the conventional tank method, sugar and yeast initiate a second fermentation in a sealed
      tank that retains the gas.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_tank_filter
    subject_id: n_spark_principle_tank_filter
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_tank_filter
    domain_id: winemaking
    assertion_text: Tank-fermented wine is filtered before bottling; individual-bottle riddling is unnecessary
      for this clear tank-method process.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_transfer_bottle
    subject_id: n_spark_principle_transfer_bottle
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_transfer_bottle
    domain_id: winemaking
    assertion_text: Transfer-method wine undergoes second fermentation in bottles before being moved to a tank
      for finishing.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_transfer_tank
    subject_id: n_spark_principle_transfer_tank
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_transfer_tank
    domain_id: winemaking
    assertion_text: Following bottle fermentation and lees contact, transfer-method wine is pooled in tank and
      filtered to remove yeast before rebottling.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_transfer_lees
    subject_id: n_spark_principle_transfer_lees
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_transfer_lees
    domain_id: winemaking
    assertion_text: Transfer processing follows a period on bottle lees; transferring later does not erase the
      earlier lees contact.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_ancestral
    subject_id: n_spark_principle_ancestral
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_ancestral
    domain_id: winemaking
    assertion_text: In an ancestral process, the original fermentation continues after bottling, consuming
      remaining grape sugar and retaining its gas.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_ancestral_disgorge
    subject_id: n_spark_principle_ancestral_disgorge
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_ancestral_disgorge
    domain_id: winemaking
    assertion_text: Troon documents disgorging its ancestral-method wine after bottle ageing; retaining all
      sediment is not inherent to every ancestral wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_carbonation
    subject_id: n_spark_principle_carbonation
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_carbonation
    domain_id: winemaking
    assertion_text: Force carbonation introduces carbon dioxide directly into wine rather than generating that
      gas through a new fermentation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_carbonation_fermentation
    subject_id: n_spark_principle_carbonation_fermentation
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_carbonation_fermentation
    domain_id: winemaking
    assertion_text: Injecting gas does not itself require more yeast fermentation; any earlier lees character
      depends on the base wine and its handling.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_cool_solubility
    subject_id: n_spark_principle_cool_solubility
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_cool_solubility
    domain_id: winemaking
    assertion_text: At lower temperatures carbon dioxide is more soluble in wine; temperature therefore matters
      when managing gas retention.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_agitation
    subject_id: n_spark_principle_agitation
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_agitation
    domain_id: winemaking
    assertion_text: Agitation promotes escape of dissolved carbon dioxide; bubbles represent gas leaving
      solution, rather than the dissolved gas itself.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_white_press
    subject_id: n_spark_principle_white_press
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_white_press
    domain_id: winemaking
    assertion_text: Gentle pressing and limited skin contact restrict colour extraction when a pale base wine is
      intended; rosé objectives differ.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_press_fractions
    subject_id: n_spark_principle_press_fractions
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_press_fractions
    domain_id: winemaking
    assertion_text: Press fractions have different characteristics; keeping them separate allows selection and
      blending for the intended style.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_base_acidity
    subject_id: n_spark_principle_base_acidity
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_base_acidity
    domain_id: winemaking
    assertion_text: Early picking can retain acidity for a fresh sparkling base, but a useful harvest decision
      still follows the intended wine style.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_base_alcohol
    subject_id: n_spark_principle_base_alcohol
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_base_alcohol
    domain_id: winemaking
    assertion_text: A relatively low-alcohol base allows for alcohol added during second fermentation; the
      intended final style determines the target.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_blending
    subject_id: n_spark_principle_blending
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_blending
    domain_id: winemaking
    assertion_text: Different base wines can contribute complementary aromas and structure; the blend follows
      the producer’s intended style.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_multivintage
    subject_id: n_spark_principle_multivintage
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_multivintage
    domain_id: winemaking
    assertion_text: A non-vintage sparkling blend may combine wines from different years, adding complementary
      characters rather than expressing only one harvest.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_mlf_optional
    subject_id: n_spark_principle_mlf_optional
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_mlf_optional
    domain_id: winemaking
    assertion_text: Champagne producers may complete, partly conduct or avoid MLF according to the desired
      style; it is distinct from alcoholic fermentation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_autolysis
    subject_id: n_spark_principle_autolysis
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_autolysis
    domain_id: winemaking
    assertion_text: Yeast cells break down and release compounds into the wine during autolysis; this differs
      from active sugar fermentation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_lees_style
    subject_id: n_spark_principle_lees_style
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_lees_style
    domain_id: winemaking
    assertion_text: Lees contact and slow wine evolution can contribute mature aroma and fullness; duration
      alone does not guarantee a preferred style.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_riddling
    subject_id: n_spark_principle_riddling
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_riddling
    domain_id: winemaking
    assertion_text: Riddling rotates and progressively tilts bottles to collect sediment in the neck for later removal.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_automated_riddling
    subject_id: n_spark_principle_automated_riddling
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_automated_riddling
    domain_id: business
    assertion_text: Automated riddling moves batches of bottles through sediment collection; hand turning is not
      essential to the process.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_disgorgement
    subject_id: n_spark_principle_disgorgement
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_disgorgement
    domain_id: winemaking
    assertion_text: Opening the prepared bottle expels the lees gathered at its neck; mechanised disgorgement
      can use a frozen sediment plug.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_disgorge_oxygen
    subject_id: n_spark_principle_disgorge_oxygen
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_disgorge_oxygen
    domain_id: winemaking
    assertion_text: Disgorgement opens the bottle to outside air; this changes oxygen exposure and can affect
      subsequent wine evolution.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_dosage
    subject_id: n_spark_principle_dosage
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_dosage
    domain_id: winemaking
    assertion_text: Dosage can add wine and sugar after sediment removal, adjusting the finishing profile before
      final sealing; it is not tirage.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_dosage_aroma
    subject_id: n_spark_principle_dosage_aroma
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_dosage_aroma
    domain_id: winemaking
    assertion_text: A neutral dosage wine or a more characterful reserve wine can influence the final aromatic
      style as well as sweetness.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_liner
    subject_id: n_spark_principle_liner
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_liner
    domain_id: winemaking
    assertion_text: A crown closure can control oxygen entry; its seal permeability also affects carbon dioxide
      loss during bottle ageing.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:42:47.784Z
  - id: ki_spark_low_liner
    subject_id: n_spark_principle_low_liner
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_low_liner
    domain_id: winemaking
    assertion_text: A less gas-permeable seal can help retain carbonation; the research-partner model also
      identifies storage temperature as a factor.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:42:47.784Z
  - id: ki_spark_lees_decline
    subject_id: n_spark_principle_lees_decline
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_lees_decline
    domain_id: winemaking
    assertion_text: Original Cava research observed declining oxygen consumption by ageing lees, indicating that
      their protective capacity can weaken with time.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:42:47.784Z
  - id: ki_spark_bidule
    subject_id: n_spark_principle_bidule
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_bidule
    domain_id: winemaking
    assertion_text: PE.DI describes its polyethylene bidule as an insert used with a crown closure to support
      sealing and facilitate disgorgement.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:42:47.784Z
  - id: ki_spark_gushing_solids
    subject_id: n_spark_principle_gushing_solids
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_gushing_solids
    domain_id: winemaking
    assertion_text: Solid particles can nucleate bubbles and promote rapid degassing; gushing is not evidence of
      excessive sugar alone.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_alcohol_tartrate
    subject_id: n_spark_principle_alcohol_tartrate
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_alcohol_tartrate
    domain_id: winemaking
    assertion_text: Additional fermentation alcohol reduces potassium hydrogen tartrate solubility; stability of
      the unchanged base may not represent the finished wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_counterpressure
    subject_id: n_spark_principle_counterpressure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_counterpressure
    domain_id: winemaking
    assertion_text: Counter-pressure helps keep fermentation-derived carbon dioxide in solution while wine moves
      through tank processing.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_gas_return
    subject_id: n_spark_principle_gas_return
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_gas_return
    domain_id: business
    assertion_text: Returning gas displaced from the receiving tank can reduce purchased carbon dioxide used to
      refill the emptying tank’s headspace.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_gas_cost
    subject_id: n_spark_principle_gas_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_spark_point_gas_cost
    domain_id: business
    assertion_text: Fermentation supplies wine bubbles, but maintaining headspace pressure during processing can
      consume bought gas and add operating cost.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_case_fruit_tank_action
    subject_id: n_spark_case_fruit_tank
    relation_type: CASE_ACTION
    object_id: n_spark_point_case_fruit_tank_action
    domain_id: winemaking
    assertion_text: Use the available tank method with short finishing time, while protecting the base wine’s
      fresh character.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_case_fruit_tank_reason
    subject_id: n_spark_case_fruit_tank
    relation_type: CASE_REASON
    object_id: n_spark_point_case_fruit_tank_reason
    domain_id: winemaking
    assertion_text: Tank fermentation and bulk finishing can suit a fresh style without requiring prolonged
      maturation in individual bottles.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_case_fruit_tank_tradeoff
    subject_id: n_spark_case_fruit_tank
    relation_type: CASE_TRADEOFF
    object_id: n_spark_point_case_fruit_tank_tradeoff
    domain_id: winemaking
    assertion_text: Short release allows less time for mature lees-related evolution than a deliberately
      extended bottle-ageing plan.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_case_fruit_tank_limitation
    subject_id: n_spark_case_fruit_tank
    relation_type: CASE_LIMITATION
    object_id: n_spark_point_case_fruit_tank_limitation
    domain_id: winemaking
    assertion_text: Filtration and filling still require controlled counter-pressure; method choice alone does
      not ensure gas retention or a good finished wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_case_transfer_batch_action
    subject_id: n_spark_case_transfer_batch
    relation_type: CASE_ACTION
    object_id: n_spark_point_case_transfer_batch_action
    domain_id: winemaking
    assertion_text: Transfer the bottle-aged wine to a suitable tank, remove lees by bulk filtration and
      rebottle under controlled pressure.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_case_transfer_batch_reason
    subject_id: n_spark_case_transfer_batch
    relation_type: CASE_REASON
    object_id: n_spark_point_case_transfer_batch_reason
    domain_id: winemaking
    assertion_text: Transfer follows bottle fermentation and lees contact while replacing individual-bottle
      sediment finishing with a bulk process.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_case_transfer_batch_tradeoff
    subject_id: n_spark_case_transfer_batch
    relation_type: CASE_TRADEOFF
    object_id: n_spark_point_case_transfer_batch_tradeoff
    domain_id: winemaking
    assertion_text: Tank processing consumes counter-pressure gas; include this operating demand when comparing
      finishing options rather than assuming cost disappears.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_case_transfer_batch_limitation
    subject_id: n_spark_case_transfer_batch
    relation_type: CASE_LIMITATION
    object_id: n_spark_point_case_transfer_batch_limitation
    domain_id: winemaking
    assertion_text: Assess the actual finished wine against the style target; simpler bulk finishing is an
      option, not a guarantee of the desired result.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_case_long_closure_action
    subject_id: n_spark_case_long_closure
    relation_type: CASE_ACTION
    object_id: n_spark_point_case_long_closure_action
    domain_id: winemaking
    assertion_text: Select a suitably low-permeability closure and manage storage temperature for the stated
      gas-retention and evolution targets.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:42:47.784Z
  - id: ki_spark_case_long_closure_reason
    subject_id: n_spark_case_long_closure
    relation_type: CASE_REASON
    object_id: n_spark_point_case_long_closure_reason
    domain_id: winemaking
    assertion_text: Seal permeability influences carbonation loss, while higher storage temperature can
      accelerate it; crown-closure choice can also control oxygen entry.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:42:47.784Z
  - id: ki_spark_case_long_closure_tradeoff
    subject_id: n_spark_case_long_closure
    relation_type: CASE_TRADEOFF
    object_id: n_spark_point_case_long_closure_tradeoff
    domain_id: winemaking
    assertion_text: Climate-controlled storage has economic and environmental costs; balance those resources
      against the intended retention and ageing outcome.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:42:47.784Z
  - id: ki_spark_case_long_closure_limitation
    subject_id: n_spark_case_long_closure
    relation_type: CASE_LIMITATION
    object_id: n_spark_point_case_long_closure_limitation
    domain_id: winemaking
    assertion_text: The Cava study observed oxygen consumption by lees tending to decline with age; the plan
      still needs monitoring rather than assuming permanent protection.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:42:47.784Z
  - id: ki_spark_case_gushing_batch_action
    subject_id: n_spark_case_gushing_batch
    relation_type: CASE_ACTION
    object_id: n_spark_point_case_gushing_batch_action
    domain_id: winemaking
    assertion_text: Investigate cold stability and the effectiveness of riddling and disgorgement, alongside
      checking the gas-generating addition.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_case_gushing_batch_reason
    subject_id: n_spark_case_gushing_batch
    relation_type: CASE_REASON
    object_id: n_spark_point_case_gushing_batch_reason
    domain_id: winemaking
    assertion_text: Crystals and remaining lees supply nucleation sites that can trigger rapid gas release even
      when the planned gas addition seems appropriate.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_case_gushing_batch_tradeoff
    subject_id: n_spark_case_gushing_batch
    relation_type: CASE_TRADEOFF
    object_id: n_spark_point_case_gushing_batch_tradeoff
    domain_id: winemaking
    assertion_text: Investigation may lead to replacement or reworking of affected bottles, adding cost while
      addressing the defect.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_case_gushing_batch_limitation
    subject_id: n_spark_case_gushing_batch
    relation_type: CASE_LIMITATION
    object_id: n_spark_point_case_gushing_batch_limitation
    domain_id: winemaking
    assertion_text: Other causes include excessive dissolved gas, foreign solids and unsuitable gas handling;
      one observed particle does not establish the complete cause.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_case_dosage_trial_action
    subject_id: n_spark_case_dosage_trial
    relation_type: CASE_ACTION
    object_id: n_spark_point_case_dosage_trial_action
    domain_id: winemaking
    assertion_text: Compare controlled dosage options in the actual blend before choosing its final sweetness
      and aromatic profile.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_case_dosage_trial_reason
    subject_id: n_spark_case_dosage_trial
    relation_type: CASE_REASON
    object_id: n_spark_point_case_dosage_trial_reason
    domain_id: winemaking
    assertion_text: Dosage changes sweetness, and the wine component can preserve or add aromatic character
      according to the intended style.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_case_dosage_trial_tradeoff
    subject_id: n_spark_case_dosage_trial
    relation_type: CASE_TRADEOFF
    object_id: n_spark_point_case_dosage_trial_tradeoff
    domain_id: winemaking
    assertion_text: A characterful reserve-wine dosage can add aromas, trading a more neutral expression for the
      chosen finishing character.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
  - id: ki_spark_case_dosage_trial_limitation
    subject_id: n_spark_case_dosage_trial
    relation_type: CASE_LIMITATION
    object_id: n_spark_point_case_dosage_trial_limitation
    domain_id: winemaking
    assertion_text: Post-disgorgement dosage does not recreate the earlier time-dependent lees maturation; the
      underlying base and ageing still shape the result.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:33:57.518Z
