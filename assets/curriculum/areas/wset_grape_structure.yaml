knowledge_items:
  - id: ki_wset_structure_chardonnay_structure
    subject_id: n_wset_structure_principle_chardonnay_structure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_chardonnay_structure
    domain_id: tasting
    assertion_text: Chardonnay white wine can be pale yellow or deeper gold, depending on style and development.
      The grape can accumulate substantial sugar while retaining acidity; cooler or earlier-picked lots
      often have less potential alcohol and more acidity than riper comparable lots. Colour and body do not
      establish whether oak was used.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_sauvignon_blanc_structure
    subject_id: n_wset_structure_principle_sauvignon_blanc_structure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_sauvignon_blanc_structure
    domain_id: tasting
    assertion_text: A young Sauvignon Blanc white can be pale yellow and mouthwatering. In a suitable site, an
      earlier-picked lot usually retains more acidity and less sugar than a riper comparable lot, which can
      yield more alcohol if fermented dry. Its herbaceous or ripe-fruit aroma is a separate observation from
      sweetness, alcohol and colour.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_pinot_gris_structure
    subject_id: n_wset_structure_principle_pinot_gris_structure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_pinot_gris_structure
    domain_id: tasting
    assertion_text: Ripe Pinot Gris can accumulate much sugar with low to moderate acidity, supporting a
      powerful dry wine if fermented. Alsace examples can be yellow-gold and broad, yet retain balancing
      acidity; fresher Italian Pinot Grigio need not have the same weight. Short skin contact gives a
      different colour result from copper-coloured ramato.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_riesling_structure
    subject_id: n_wset_structure_principle_riesling_structure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_riesling_structure
    domain_id: tasting
    assertion_text: A youthful Riesling white may be pale yellow and become more golden with development. High
      acidity is a useful grape tendency. An earlier, lower-sugar harvest or fermentation stopped with sugar
      remaining can give lower alcohol than a ripe dry version; very concentrated fruit does not prescribe
      one finished sweetness or alcohol level.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_cabernet_sauvignon_structure
    subject_id: n_wset_structure_principle_cabernet_sauvignon_structure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_cabernet_sauvignon_structure
    domain_id: tasting
    assertion_text: At suitable maturity, Cabernet Sauvignon can give deeply coloured red wine with substantial
      tannin and naturally high acidity. Cooler or less ripe examples may retain greener aromas; riper
      suitable sites can supply more sugar and potential alcohol. Extraction, blending with softer Merlot
      and maturation alter the finished structure; no bottle is guaranteed a fixed level.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_merlot_structure
    subject_id: n_wset_structure_principle_merlot_structure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_merlot_structure
    domain_id: tasting
    assertion_text: Merlot can give richly coloured reds with supple tannin and lower acidity than a comparable
      Cabernet Sauvignon. Ripe fruit can contain substantial sugar and yield a fuller, higher-alcohol dry
      style. Cooler sites, harvest timing, extraction and blends can make lighter or firmer wines, so supple
      does not mean tannin-free.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_pinot_noir_structure
    subject_id: n_wset_structure_principle_pinot_noir_structure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_pinot_noir_structure
    domain_id: tasting
    assertion_text: A cool-site Pinot Noir red often has lighter ruby colour, fresh acidity and less tannin than
      Cabernet Sauvignon. Very ripe Pinot Noir can accumulate high sugar while losing acidity; warm or more
      extracted wines may be fuller and firmer. Thin skins and lighter colour do not prevent complexity, nor
      prove a wine is ready to drink.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_syrah_structure
    subject_id: n_wset_structure_principle_syrah_structure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_syrah_structure
    domain_id: tasting
    assertion_text: Syrah can make intensely coloured reds with substantial tannin. Cooler Northern Rhône
      expressions can have fresher acidity and less alcohol than ripe warm-site Shiraz; the cultivar can
      also give relatively low acidity at maturity. Sugar, harvest choice, extraction and blending change
      the balance, so deep colour does not guarantee high acidity.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_gamay_structure
    subject_id: n_wset_structure_principle_gamay_structure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_gamay_structure
    domain_id: tasting
    assertion_text: Gamay reds often combine moderate red colour, fresh acidity and relatively gentle tannin,
      particularly with whole-berry or whole-bunch maceration. A riper lot has more potential alcohol than a
      lower-sugar comparable lot; extraction and blending can change the structure. Fresh strawberry or
      cherry aromas do not establish residual sugar.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_grenache_structure
    subject_id: n_wset_structure_principle_grenache_structure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_grenache_structure
    domain_id: tasting
    assertion_text: Grenache can accumulate much sugar, supporting high alcohol in ripe dry wines, and often has
      relatively low acidity. It commonly gives lighter red colour and supple tannin; clone, yield and
      extraction can make more structured examples. Warm-site ripe fruit and blends explain why a
      Grenache-led wine need not be light-bodied.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_tempranillo_structure
    subject_id: n_wset_structure_principle_tempranillo_structure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_tempranillo_structure
    domain_id: tasting
    assertion_text: Tempranillo can give deeply coloured, tannic reds when suitably ripe and extracted. In hot
      sites it may lack acidity, while cooler elevated conditions can preserve more freshness. Fruit with
      more fermentable sugar has more potential alcohol; neither oak-age labels nor the grape name establish
      the actual alcohol or acid level.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_nebbiolo_structure
    subject_id: n_wset_structure_principle_nebbiolo_structure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_nebbiolo_structure
    domain_id: tasting
    assertion_text: Nebbiolo can have comparatively modest ruby colour yet substantial tannin and acidity. A
      suitable long ripening season allows sugar accumulation and can give substantial alcohol in a dry
      wine. Extraction and development change texture and hue; pale-looking Nebbiolo is not evidence of weak
      structure or inferior quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_barbera_structure
    subject_id: n_wset_structure_principle_barbera_structure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_barbera_structure
    domain_id: tasting
    assertion_text: Barbera can give deeply coloured reds with marked acidity but relatively little grape
      tannin. Its colour-rich anthocyanins do not imply Nebbiolo-like tannin. Riper fruit can support a
      fuller, higher-alcohol dry style than a lower-sugar comparable lot; extraction, oak and blending can
      add or change the finished tannin.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_sangiovese_structure
    subject_id: n_wset_structure_principle_sangiovese_structure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_sangiovese_structure
    domain_id: tasting
    assertion_text: Sangiovese-led Chianti Classico has ruby-red colour, sometimes more garnet with development,
      and pronounced acidity with drying tannin. Comparable fruit harvested at higher sugar has greater
      potential alcohol if fermented dry. Site, blend, extraction and age change its cherry-led profile and
      texture; colour intensity is not a quality grade.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_corvina_structure
    subject_id: n_wset_structure_principle_corvina_structure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_corvina_structure
    domain_id: tasting
    assertion_text: Corvina has relatively limited red pigment and moderate skin tannin, with fresh acidity.
      Young Corvina-led Valpolicella can therefore be lighter red and cherry-scented. Drying grapes
      concentrates sugar and other components, supporting a fuller, higher-alcohol dry Amarone route;
      fermentation stopped with sugar remaining instead gives a sweet target.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_montepulciano_structure
    subject_id: n_wset_structure_principle_montepulciano_structure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_montepulciano_structure
    domain_id: tasting
    assertion_text: Montepulciano d’Abruzzo is typically an intensely ruby-coloured red with fruit, spice and
      noticeable tannin, becoming more garnet with development. Masciarelli’s Linea Classica is a named
      example with a taut palate and pleasant acidity supporting freshness; not every Montepulciano has the
      same acid balance. Higher-sugar fruit raises potential alcohol and can yield more actual alcohol when
      fermented dry than a comparable lower-sugar lot.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_zinfandel_structure
    subject_id: n_wset_structure_principle_zinfandel_structure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_zinfandel_structure
    domain_id: tasting
    assertion_text: For red Zinfandel, skin contact supplies colour and tannin. Its unevenly ripening bunches
      can include less ripe berries that supply bright acidity beside ripe or raisined fruit. Riper
      high-sugar fruit supports greater potential alcohol, while soft or strongly extracted styles have
      different acid and tannin balances. An earlier rosé or sweet blush has a different colour and
      structure.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_pinotage_structure
    subject_id: n_wset_structure_principle_pinotage_structure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_pinotage_structure
    domain_id: tasting
    assertion_text: Pinotage can give deeply coloured reds with substantial tannin, but extraction can produce a
      softer early-release style. Ripe high-sugar fruit supports greater potential alcohol; acid and pH need
      checking rather than assuming one level. Southern Right’s 2020 Pinotage is a documented medium-bodied,
      bright-acid, lightly chewy example, illustrating variation rather than a universal recipe.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_carmenere_structure
    subject_id: n_wset_structure_principle_carmenere_structure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_carmenere_structure
    domain_id: tasting
    assertion_text: Carménère can produce richly coloured reds with substantial grape tannin and relatively low
      acidity at good maturity. Finished examples can have more moderate tannin after extraction and
      maturation choices. Inadequate ripening can retain green flavours; suitable warm-site sugar
      accumulation can support a fuller, higher-alcohol dry wine, without fixing every Chilean bottle’s
      levels.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_malbec_structure
    subject_id: n_wset_structure_principle_malbec_structure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_malbec_structure
    domain_id: tasting
    assertion_text: Malbec can give intensely coloured red wine with substantial tannin. Argentine higher or
      cooler sites can retain more acidity and floral freshness than warmer comparable sites; texture also
      depends on extraction. A ripe high-sugar lot has more potential alcohol than a comparable lower-sugar
      lot, but elevation alone does not establish alcohol or quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_chenin_blanc_structure
    subject_id: n_wset_structure_principle_chenin_blanc_structure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_chenin_blanc_structure
    domain_id: tasting
    assertion_text: Chenin Blanc can make pale-yellow dry whites or more golden developed and concentrated
      styles. Marked acidity is a useful tendency. Ripe or concentrated grapes contain more sugar than less
      ripe comparable fruit, but fermentation can leave part as residual sugar; a sweet Chenin is not
      automatically a higher-alcohol wine than a dry one.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_semillon_structure
    subject_id: n_wset_structure_principle_semillon_structure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_semillon_structure
    domain_id: tasting
    assertion_text: Sémillon can give pale-yellow young whites and more golden developed or concentrated wines.
      Ripe Sémillon can accumulate substantial sugar with relatively modest acidity, supporting broad dry or
      sweet styles. Early-picked Hunter Sémillon instead can have ripe flavour at lower sugar, high acidity
      and lower alcohol; ripeness and fermentation determine the actual balance.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_viognier_structure
    subject_id: n_wset_structure_principle_viognier_structure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_viognier_structure
    domain_id: tasting
    assertion_text: Ripe Viognier can accumulate much sugar and often has relatively low acidity, giving a
      broad, higher-alcohol dry white. Its white colour can range from pale yellow to richer gold with style
      and development. Picking earlier may preserve freshness but flavour maturity still matters; peach or
      apricot aromas do not prove sweetness.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_gewurztraminer_structure
    subject_id: n_wset_structure_principle_gewurztraminer_structure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_gewurztraminer_structure
    domain_id: tasting
    assertion_text: Gewurztraminer can make yellow to golden whites with pronounced aroma and broad body. It can
      accumulate substantial sugar while acidity is often moderate, making ripe dry examples comparatively
      rich. Concentrated late or botrytis-affected fruit can also make sweet wine; fermentation determines
      how much sugar becomes alcohol and how much remains.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_verdicchio_structure
    subject_id: n_wset_structure_principle_verdicchio_structure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_verdicchio_structure
    domain_id: tasting
    assertion_text: Verdicchio dei Castelli di Jesi can be straw-yellow with green reflections and an explicitly
      acidic, fresh palate. Earlier picking can give a lighter, citrus-led expression; suitably riper fruit
      offers more sugar and therefore greater potential alcohol if fermented dry. Fuller or developed
      versions need not have the same colour intensity or body.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_cortese_structure
    subject_id: n_wset_structure_principle_cortese_structure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_cortese_structure
    domain_id: tasting
    assertion_text: Cortese in Gavi gives a pale straw-yellow, often green-tinged, dry white with fresh acidity
      and delicate fruit or flowers. Its ripeness and sugar determine potential alcohol rather than a fixed
      grape-name level. Compare a fresher lower-sugar lot with a riper lot; greater ripeness may add weight
      without guaranteeing better balance.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_garganega_structure
    subject_id: n_wset_structure_principle_garganega_structure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_garganega_structure
    domain_id: tasting
    assertion_text: Garganega-led dry Soave is a straw-yellow white with freshness; the grape’s acidity is
      generally balanced rather than exceptionally marked. A suitably riper lot can have greater sugar and
      potential alcohol than an earlier comparable lot. Drying healthy grapes concentrates sugar for richer
      Recioto, whose retained sweetness also depends on fermentation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_fiano_structure
    subject_id: n_wset_structure_principle_fiano_structure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_fiano_structure
    domain_id: tasting
    assertion_text: Fiano di Avellino can be straw-yellow with marked acidity and medium structure, with white
      fruit, flowers and hazelnut. If comparable fruit reaches higher sugar before harvest, its potential
      alcohol rises when fermented dry; finished weight also depends on cellar choices. Wood and bottle
      development can broaden aroma without proving a higher-quality wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_albarino_structure
    subject_id: n_wset_structure_principle_albarino_structure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_albarino_structure
    domain_id: tasting
    assertion_text: "Albariño whites can be pale straw-yellow and fresh, with good natural acidity and citrus or
      stone-fruit aromas. The cultivar’s moderate sugar-accumulation tendency does not fix bottle alcohol:
      site, harvest and dry fermentation matter. More mature comparable fruit has greater potential alcohol;
      lees, malolactic and wood choices can alter texture and acid impression."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_furmint_structure
    subject_id: n_wset_structure_principle_furmint_structure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_furmint_structure
    domain_id: tasting
    assertion_text: "Furmint has marked acidity with moderate ordinary sugar-accumulation potential; raisining
      or noble rot can concentrate sugar for sweet styles. Its dry whites can be straw-yellow or golden:
      Grand Tokaj’s 2024 Terroir Selection is a documented bright-gold, tight-acid example. More
      concentrated fruit does not prescribe alcohol, because fermentation may retain sugar."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_chardonnay_vineyard
    subject_id: n_wset_structure_principle_chardonnay_vineyard
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_chardonnay_vineyard
    domain_id: viticulture
    assertion_text: "Chardonnay adapts to cool and warmer suitable sites. Compare an earlier harvest intended
      for fresh acidity with riper fruit intended for a fuller dry wine: flavour, sugar and acid must be
      evaluated together. It can accumulate sugar while retaining useful acidity, but extreme drought or
      unsuitable conditions can impair the crop."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_sauvignon_blanc_vineyard
    subject_id: n_wset_structure_principle_sauvignon_blanc_vineyard
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_sauvignon_blanc_vineyard
    domain_id: viticulture
    assertion_text: Vigorous Sauvignon Blanc needs canopy and crop management that gives the bunches an
      appropriate microclimate. In cool or moderate suitable conditions it can retain herbaceous character
      and acidity; riper fruit can shift towards stone or tropical fruit. Later or noble-rot fruit may suit
      sweet wine, rather than the same early-release dry target.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_pinot_gris_vineyard
    subject_id: n_wset_structure_principle_pinot_gris_vineyard
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_pinot_gris_vineyard
    domain_id: viticulture
    assertion_text: Pinot Gris can accumulate high sugar; earlier picking can support a fresher style, while
      riper fruit can support a richer dry or sweet target. Compact bunches need attention to rot risk.
      Selected late or noble-rot fruit is a concentration route in Alsace; grey-pink skin alone does not
      prescribe sweetness or copper-coloured wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_riesling_vineyard
    subject_id: n_wset_structure_principle_riesling_vineyard
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_riesling_vineyard
    domain_id: viticulture
    assertion_text: Riesling’s high acidity permits contrasting dry and sweet targets as sugar accumulates.
      Appropriate cooler sites and exposures can support a long ripening period; earlier picking, ripe dry
      fermentation and selected overripe or noble-rot fruit create different balances. Healthy fruit,
      flavour and sugar must be assessed together rather than using the variety name as a harvest date.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_cabernet_sauvignon_vineyard
    subject_id: n_wset_structure_principle_cabernet_sauvignon_vineyard
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_cabernet_sauvignon_vineyard
    domain_id: viticulture
    assertion_text: "Cabernet Sauvignon ripens relatively late and needs suitable warmth and a long enough
      growing season. Insufficient maturity can leave green flavours with firm tannin; adequately ripe fruit
      gives deeper colour and a more mature flavour balance. Compare sugar, acid and tannin maturity before
      picking: greater heat or later harvest is not automatically better."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_merlot_vineyard
    subject_id: n_wset_structure_principle_merlot_vineyard
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_merlot_vineyard
    domain_id: viticulture
    assertion_text: Merlot generally ripens earlier than Cabernet Sauvignon, helping explain its use in suitable
      Bordeaux sites where a later grape may struggle to mature. Its early budbreak can expose growth to
      spring frost, and severe drought is a risk. Picking time still changes sugar, acidity and flavour;
      earlier-ripening does not mean every wine is light.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_pinot_noir_vineyard
    subject_id: n_wset_structure_principle_pinot_noir_vineyard
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_pinot_noir_vineyard
    domain_id: viticulture
    assertion_text: Pinot Noir is suited to temperate growing conditions; in hot weather it can ripen rapidly,
      lose acidity or suffer berry sunburn and shrivelling. Comparing suitable cooler and warmer sites
      explains fresh red fruit versus greater ripeness and alcohol potential. Flavour, acid and sugar checks
      matter especially when the intended red wine relies on finesse.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_syrah_vineyard
    subject_id: n_wset_structure_principle_syrah_vineyard
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_syrah_vineyard
    domain_id: viticulture
    assertion_text: Syrah’s shoots benefit from careful support, and its interval from veraison to maturity can
      be short. In a suitable moderate or warm site, monitor flavour, sugar, acidity and berry condition as
      harvest approaches. Riper fruit can favour fuller dry wine with lower acidity; cooler sites can retain
      a different pepper, freshness and alcohol balance.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_chardonnay_ageing
    subject_id: n_wset_structure_principle_chardonnay_ageing
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_chardonnay_ageing
    domain_id: tasting
    assertion_text: Some balanced, concentrated Chardonnay can develop nutty or honeyed complexity as fresh
      fruit recedes and white colour deepens during bottle age. Oak can add toast earlier in production, so
      toast alone does not identify bottle age. A straightforward fruit-led Chardonnay may be better enjoyed
      young; storage and the actual cuvée matter.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_sauvignon_blanc_ageing
    subject_id: n_wset_structure_principle_sauvignon_blanc_ageing
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_sauvignon_blanc_ageing
    domain_id: tasting
    assertion_text: Many fresh Sauvignon Blanc wines are intended for youth, while some concentrated or
      oak-influenced styles and Sémillon blends can develop honeyed or nutty character with age. The
      original herbaceous or fruit profile may recede. Oak spice is a cellar contribution and does not by
      itself prove that the bottle has aged well.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_pinot_gris_ageing
    subject_id: n_wset_structure_principle_pinot_gris_ageing
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_pinot_gris_ageing
    domain_id: tasting
    assertion_text: "A fresh, light Pinot Grigio may suit early drinking, whereas a balanced, concentrated
      Alsace Pinot Gris can be suitable for keeping. For a supplied Alsace lot with sufficient flavour and
      acid balance, apply the white-wine ageing comparison: fresh fruit may recede, colour may deepen and
      developed aromas may emerge. A grape name alone cannot guarantee improvement."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_cabernet_sauvignon_ageing
    subject_id: n_wset_structure_principle_cabernet_sauvignon_ageing
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_cabernet_sauvignon_ageing
    domain_id: tasting
    assertion_text: A balanced, concentrated Cabernet Sauvignon with sufficient structure can develop beyond
      fresh black fruit towards dried-fruit, earthy or tobacco-like complexity while tannin texture softens.
      Barrel-derived vanilla or cedar may already be present before bottle age. Deep colour and strong
      tannin alone do not establish that keeping this bottle will improve it.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_structure_merlot_ageing
    subject_id: n_wset_structure_principle_merlot_ageing
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_structure_point_merlot_ageing
    domain_id: tasting
    assertion_text: A light, fruit-led Merlot may suit early drinking; a suitably concentrated and balanced
      structured wine can develop dried-fruit or tobacco-like complexity with softer tannin during ageing.
      Oak can add separate wood-derived aromas. Neither supple texture nor the Merlot name tells you that
      every bottle should be kept, and poor storage can spoil development.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
