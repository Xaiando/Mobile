    node_type: "learning_point"
    name: "Northern Rhône steep terraces impose labour constraints"
  - id: "n_reg_fr_point_rhone_south_varied"
    node_type: "learning_point"
    name: "Southern Rhône combines Mediterranean conditions and varied landforms"
  - id: "n_reg_fr_case_chardonnay_buy"
    node_type: "production_case"
    name: "Chablis, Meursault and Mâconnais Chardonnay buying with actual samples and cellar details. A restaurant wants a fresh, dry Chardonnay with restrained oak for its main white-wine slot. It has current samples and producer details for a tank-matured Chablis, a barrel-influenced Meursault and a Mâconnais Chardonnay. All three quotes fit the purchase budget. Propose a defensible selection process, explain relevant regional and cellar contrasts, discuss one tradeoff and state a limitation. No sample tasting result is given."
  - id: "n_reg_fr_point_case_chardonnay_buy_action"
    node_type: "learning_point"
    name: "Compare the three coded Chardonnay samples before selecting"
  - id: "n_reg_fr_point_case_chardonnay_buy_reason"
    node_type: "learning_point"
    name: "Separate Chardonnay growing conditions from vessel effects"
  - id: "n_reg_fr_point_case_chardonnay_buy_tradeoff"
    node_type: "learning_point"
    name: "Weigh customer preference alongside the Chardonnay quote"
  - id: "n_reg_fr_point_case_chardonnay_buy_limitation"
    node_type: "learning_point"
    name: "Assess the actual Chardonnay cuvée rather than a regional stereotype"
  - id: "n_reg_fr_case_bordeaux_blend"
    node_type: "production_case"
    name: "Bordeaux blending trial with ripe Merlot and firm Cabernet Sauvignon. A Bordeaux producer has two sound, ripe lots: Cabernet Sauvignon with marked tannic firmness and Merlot with a rounder texture. The target is a balanced red for drinking relatively young. Both lots are available for blending and no appellation-compliance decision is requested. Propose a defensible blending trial, explain the grape contributions, discuss a tradeoff and state a limitation. Do not assume a fixed Left Bank or Right Bank recipe."
  - id: "n_reg_fr_point_case_bordeaux_blend_action"
    node_type: "learning_point"
    name: "Run coded Bordeaux blend trials across several proportions"
  - id: "n_reg_fr_point_case_bordeaux_blend_reason"
    node_type: "learning_point"
    name: "Use Merlot roundness to balance the firm Cabernet lot"
  - id: "n_reg_fr_point_case_bordeaux_blend_tradeoff"
    node_type: "learning_point"
    name: "More Merlot can change the intended Cabernet emphasis"
  - id: "n_reg_fr_point_case_bordeaux_blend_limitation"
    node_type: "learning_point"
    name: "Ripe Merlot does not guarantee immediate Bordeaux readiness"
  - id: "n_reg_fr_case_loire_list"
    node_type: "production_case"
    name: "Loire buying for separate dry and sweet wine-list slots. A buyer needs one dry, fresh Loire white for a by-the-glass slot and one sweet Loire white for a dessert slot. Offers include a Centre-Loire Sauvignon, a Vouvray labelled sec and a Vouvray labelled moelleux. Current samples, cuvée specifications and landed quotes are available, but no tasting results are provided. Propose a defensible allocation process, explain why grape and origin alone are insufficient, discuss a tradeoff and give a limitation."
  - id: "n_reg_fr_point_case_loire_list_action"
    node_type: "learning_point"
    name: "Check cuvée specifications and taste the Loire candidates"
  - id: "n_reg_fr_point_case_loire_list_reason"
    node_type: "learning_point"
    name: "Chenin in Vouvray offers different sweetness styles"
  - id: "n_reg_fr_point_case_loire_list_tradeoff"
    node_type: "learning_point"
    name: "Evaluate Loire style fit against each landed quote"
  - id: "n_reg_fr_point_case_loire_list_limitation"
    node_type: "learning_point"
    name: "A Loire style name does not reveal every cuvée characteristic"
  - id: "n_reg_fr_case_rhone_cost"
    node_type: "production_case"
    name: "Rhône buying with a documented terrace-cost premium and broader-region alternative. A supplier offers a northern Rhône Syrah from steep terraces and a southern Rhône Grenache-led blend from a site suited to mechanised work. Producer records attribute part of the higher northern quote to manual vineyard work. The restaurant needs an affordable, ripe-fruit red and can sample both. Explain a defensible buying process, the terrain and grape context, a cost/style tradeoff and a limitation. Do not assume all northern vineyards are steep or all southern sites are mechanisable."
  - id: "n_reg_fr_point_case_rhone_cost_action"
    node_type: "learning_point"
    name: "Taste both Rhône samples against the value and style brief"
  - id: "n_reg_fr_point_case_rhone_cost_reason"
    node_type: "learning_point"
    name: "Steep Rhône terrace work can explain part of a documented cost"
  - id: "n_reg_fr_point_case_rhone_cost_tradeoff"
    node_type: "learning_point"
    name: "Terrace production features may carry a cost premium"
  - id: "n_reg_fr_point_case_rhone_cost_limitation"
    node_type: "learning_point"
    name: "Neither Rhône latitude nor labour cost guarantees quality"
