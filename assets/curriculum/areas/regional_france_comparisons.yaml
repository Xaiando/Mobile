    node_type: "production_principle"
    name: "How does Loire white-wine range make grape or appellation names insufficient for choosing a specific sweetness style?"
  - id: "n_reg_fr_point_centre_sauvignon"
    node_type: "learning_point"
    name: "Centre-Loire Sauvignon commonly expresses freshness"
  - id: "n_reg_fr_point_vouvray_range"
    node_type: "learning_point"
    name: "Vouvray Chenin spans dry, off-dry, sweet and sparkling styles"
