    assertion_text: "Increasing Merlot can reduce the prominence of the Cabernet lot’s structure and character; retain enough to meet the intended style while avoiding excessive firmness."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T00:26:13.000Z"
  - id: "ki_reg_fr_case_bordeaux_blend_limitation"
    subject_id: "n_reg_fr_case_bordeaux_blend"
    relation_type: "CASE_LIMITATION"
    object_id: "n_reg_fr_point_case_bordeaux_blend_limitation"
    domain_id: "winemaking"
    assertion_text: "Merlot can also produce dense, ageworthy wines; reassess the finished blend after maturation instead of guaranteeing drinking readiness from its proportion."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T00:26:13.000Z"
  - id: "ki_reg_fr_case_loire_list_action"
    subject_id: "n_reg_fr_case_loire_list"
    relation_type: "CASE_ACTION"
    object_id: "n_reg_fr_point_case_loire_list_action"
    domain_id: "geography"
    assertion_text: "Confirm each cuvée’s sweetness and taste the samples; consider Sauvignon or sec Vouvray for the dry slot and moelleux for the sweet slot when they meet the briefs."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T00:26:13.000Z"
  - id: "ki_reg_fr_case_loire_list_reason"
    subject_id: "n_reg_fr_case_loire_list"
    relation_type: "CASE_REASON"
    object_id: "n_reg_fr_point_case_loire_list_reason"
    domain_id: "geography"
    assertion_text: "The two Vouvrays use Chenin but can meet different sweetness briefs; Sauvignon freshness and Chenin origin do not replace cuvée-specific checks."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T00:26:13.000Z"
  - id: "ki_reg_fr_case_loire_list_tradeoff"
    subject_id: "n_reg_fr_case_loire_list"
    relation_type: "CASE_TRADEOFF"
    object_id: "n_reg_fr_point_case_loire_list_tradeoff"
    domain_id: "business"
    assertion_text: "Selecting for the two different briefs may require different purchase and selling prices; use the actual landed quotes and customer demand rather than a grape-based value rank."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T00:26:13.000Z"
  - id: "ki_reg_fr_case_loire_list_limitation"
    subject_id: "n_reg_fr_case_loire_list"
    relation_type: "CASE_LIMITATION"
    object_id: "n_reg_fr_point_case_loire_list_limitation"
    domain_id: "geography"
    assertion_text: "A dry or sweet style indication helps allocate the slot but does not establish overall balance, quality or suitability; assess each sample and vintage."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T00:26:13.000Z"
  - id: "ki_reg_fr_case_rhone_cost_action"
    subject_id: "n_reg_fr_case_rhone_cost"
    relation_type: "CASE_ACTION"
    object_id: "n_reg_fr_point_case_rhone_cost_action"
    domain_id: "geography"
    assertion_text: "Assess both samples and quotes against the affordable, ripe-fruit target; either can be selected if its actual style and price meet the brief."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T00:26:13.000Z"
  - id: "ki_reg_fr_case_rhone_cost_reason"
    subject_id: "n_reg_fr_case_rhone_cost"
    relation_type: "CASE_REASON"
    object_id: "n_reg_fr_point_case_rhone_cost_reason"
    domain_id: "business"
    assertion_text: "Steep, narrow northern terraces can require demanding manual work; this supports the supplied producer’s cost explanation without determining the whole quoted price."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T00:26:13.000Z"
  - id: "ki_reg_fr_case_rhone_cost_tradeoff"
    subject_id: "n_reg_fr_case_rhone_cost"
    relation_type: "CASE_TRADEOFF"
    object_id: "n_reg_fr_point_case_rhone_cost_tradeoff"
    domain_id: "business"
    assertion_text: "Paying the documented terrace premium may displace a lower-cost option meeting the fruit target; consider whether customers value the extra features enough."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T00:26:13.000Z"
  - id: "ki_reg_fr_case_rhone_cost_limitation"
    subject_id: "n_reg_fr_case_rhone_cost"
    relation_type: "CASE_LIMITATION"
    object_id: "n_reg_fr_point_case_rhone_cost_limitation"
    domain_id: "geography"
    assertion_text: "North-south grape and site patterns provide context; labour cost and latitude alone do not establish sensory quality, value or the best purchase."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T00:26:13.000Z"
