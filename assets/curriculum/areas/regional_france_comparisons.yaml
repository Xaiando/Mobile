    node_type: "learning_point"
    name: "Hautes Côtes vineyards occupy higher inland plateaus"
  - id: "n_reg_fr_point_cote_aspect"
    node_type: "learning_point"
    name: "Main Côte hillside exposure supports ripening and drainage"
  - id: "n_reg_fr_principle_bordeaux_ripening"
    node_type: "production_principle"
    name: "How does the ripening sequence of Cabernet Sauvignon and Merlot influence Bordeaux harvest decisions?"
  - id: "n_reg_fr_point_cabernet_late"
    node_type: "learning_point"
    name: "Cabernet Sauvignon typically ripens later than Merlot"
  - id: "n_reg_fr_point_merlot_early"
    node_type: "learning_point"
    name: "Merlot is naturally earlier ripening"
  - id: "n_reg_fr_principle_bordeaux_soils"
    node_type: "production_principle"
    name: "How do site and variety patterns help explain Left Bank and Right Bank Bordeaux without imposing absolute rules?"
  - id: "n_reg_fr_point_cabernet_gravel"
    node_type: "learning_point"
    name: "Warm Left Bank gravel suits Cabernet Sauvignon"
  - id: "n_reg_fr_point_merlot_clay"
    node_type: "learning_point"
    name: "Right Bank clay and limestone often accompany Merlot"
  - id: "n_reg_fr_principle_bordeaux_blends"
    node_type: "production_principle"
    name: "How can Cabernet Sauvignon and Merlot make complementary contributions to a Bordeaux red blend?"
  - id: "n_reg_fr_point_cabernet_structure"
    node_type: "learning_point"
    name: "Cabernet Sauvignon can supply tannic structure"
  - id: "n_reg_fr_point_merlot_roundness"
    node_type: "learning_point"
    name: "Merlot can add roundness to a Cabernet blend"
  - id: "n_reg_fr_principle_bordeaux_2024"
    node_type: "production_principle"
    name: "What does CIVB’s dated Bordeaux 2024 account illustrate about vintage conditions and ripeness decisions?"
