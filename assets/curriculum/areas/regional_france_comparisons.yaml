    node_type: "learning_point"
    name: "Syrah is emblematic of northern Rhône reds"
  - id: "n_reg_fr_point_rhone_south_blends"
    node_type: "learning_point"
    name: "Southern Rhône often uses Grenache with Syrah and Mourvèdre"
  - id: "n_reg_fr_principle_rhone_terrain"
    node_type: "production_principle"
