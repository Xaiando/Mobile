    node_type: "production_principle"
    name: "Why can two Centre-Loire Sauvignon sites produce different outcomes within a shared regional climate?"
  - id: "n_reg_fr_point_centre_slow"
    node_type: "learning_point"
    name: "Centre-Loire conditions can support slow Sauvignon ripening"
  - id: "n_reg_fr_point_centre_microclimates"
