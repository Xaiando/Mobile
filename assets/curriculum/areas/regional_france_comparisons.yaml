# Original regional comparisons and conditional buying/blending decisions.
# All items remain unverified pending qualified review.
# MCQ is disabled throughout: site, vintage, producer and aims admit plausible alternatives.
# Valid-from is the UTC curation date, not an effective law date.
knowledge_nodes:
  - id: "n_reg_fr_principle_chardonnay_climate"
    node_type: "production_principle"
    name: "How do the broad growing conditions of Chablis and the Mâconnais contrast for Chardonnay?"
  - id: "n_reg_fr_point_chablis_cool"
    node_type: "learning_point"
    name: "Cooler Chablis with spring frost exposure"
  - id: "n_reg_fr_point_macon_warm"
    node_type: "learning_point"
    name: "Warmer, drier Mâconnais with faster typical ripening"
  - id: "n_reg_fr_principle_chablis_elevage"
    node_type: "production_principle"
    name: "How can Chablis cellar choices qualify a comparison with a barrel-influenced Côte de Beaune Chardonnay?"
  - id: "n_reg_fr_point_chablis_vessels"
    node_type: "learning_point"
    name: "Chablis can ferment or mature in vats or barrels"
  - id: "n_reg_fr_point_chablis_new_oak"
    node_type: "learning_point"
    name: "Often restrained new oak in Chablis"
  - id: "n_reg_fr_principle_chablis_mlf"
    node_type: "production_principle"
    name: "How do malolactic fermentation and harvest/cellar choices qualify a Chablis freshness and quality comparison?"
  - id: "n_reg_fr_point_chablis_mlf_acid"
    node_type: "learning_point"
    name: "Chablis MLF lowers acidity without defining all freshness"
  - id: "n_reg_fr_point_chablis_quality"
    node_type: "learning_point"
    name: "Harvest and cellar practice also affect Chablis quality"
  - id: "n_reg_fr_principle_cotes_grapes"
    node_type: "production_principle"
    name: "How do the grape and colour emphases of Côte de Nuits and Côte de Beaune contrast?"
  - id: "n_reg_fr_point_nuits_pinot"
    node_type: "learning_point"
    name: "Côte de Nuits mainly red Pinot Noir with some whites"
  - id: "n_reg_fr_point_beaune_mix"
    node_type: "learning_point"
    name: "Côte de Beaune combines Pinot Noir reds and Chardonnay whites"
  - id: "n_reg_fr_principle_climat_comparison"
    node_type: "production_principle"
    name: "Why compare named Burgundy Climats as sites rather than treat every Pinot Noir from a village as identical?"
  - id: "n_reg_fr_point_climat_site"
    node_type: "learning_point"
    name: "A Climat has distinctive soil, water and exposure conditions"
  - id: "n_reg_fr_point_climat_separate"
    node_type: "learning_point"
    name: "Separate Climat vinification preserves site comparisons"
  - id: "n_reg_fr_principle_hautes_cotes"
    node_type: "production_principle"
