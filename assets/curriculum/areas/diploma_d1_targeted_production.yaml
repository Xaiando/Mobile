knowledge_items:
  - id: ki_d1target_regen_cover
    subject_id: n_d1target_regen_cover
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d1target_regen_cover_point
    domain_id: viticulture
    assertion_text: "The OIV's agroecology resolution describes a regenerative purpose through cover crops, reduced soil disturbance, compost and lower reliance on persistent inputs. These are vineyard management aims, not a certification label or proof that a given wine is better."
    verification_status: unverified
    last_verified_at: "2026-09-29T11:32:00.000Z"
    mcq_disabled: true
  - id: ki_d1target_regen_water
    subject_id: n_d1target_regen_water
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d1target_regen_water_point
    domain_id: viticulture
    assertion_text: "Cover crops can help soil structure, infiltration and erosion control, but AWRI cautions that some permanent under-vine species can compete heavily with vines and reduce yield. Match species, sowing area and mowing date to water supply and frost risk; monitor vine response before claiming a quality or cost benefit."
    verification_status: unverified
    last_verified_at: "2026-09-29T11:32:00.000Z"
    mcq_disabled: true
  - id: ki_d1target_precision_zones
    subject_id: n_d1target_precision_zones
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d1target_precision_zones_point
    domain_id: viticulture
    assertion_text: "Wine Australia's precision-site project maps vines, rows and canopy variation and can overlay soil and irrigation records. Use mapped zones to target field sampling or a variable-rate trial, then check soil, vine water status and fruit in each zone. A map identifies variation; it does not by itself identify its cause or prove a better wine."
    verification_status: unverified
    last_verified_at: "2026-09-29T11:32:00.000Z"
    mcq_disabled: true
  - id: ki_d1target_precision_cost
    subject_id: n_d1target_precision_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d1target_precision_cost_point
    domain_id: viticulture
    assertion_text: "Precision management can distinguish zones for targeted inputs or separate harvests, but mapping, interpretation and extra passes cost resources. Compare the actual saving or separately valued fruit with those costs, and taste resulting wines before treating a vigour map or extra spend as a style or quality ranking."
    verification_status: unverified
    last_verified_at: "2026-09-29T11:32:00.000Z"
    mcq_disabled: true
  - id: ki_d1target_nolo_route
    subject_id: n_d1target_nolo_route
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d1target_nolo_route_point
    domain_id: winemaking
    assertion_text: "The OIV admits supervised separation of alcohol from sound wine through partial vacuum evaporation, membrane techniques or distillation. The process should not be used to mask an organoleptic fault. The target strength and product name still require the destination's applicable rules and measured final alcohol."
    verification_status: unverified
    last_verified_at: "2026-09-29T11:32:00.000Z"
    mcq_disabled: true
  - id: ki_d1target_nolo_balance
    subject_id: n_d1target_nolo_balance
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d1target_nolo_balance_point
    domain_id: winemaking
    assertion_text: "Removing ethanol can alter perceived aroma, taste and mouthfeel and reduce one preservative contribution. Compare a trial's sensory balance and microbiological stability with the base wine, then price the separation, adjustment and packaging controls; a low number on an alcohol test is not a wine-quality result."
    verification_status: unverified
    last_verified_at: "2026-09-29T11:32:00.000Z"
    mcq_disabled: true
  - id: ki_d1target_qc_haccp
    subject_id: n_d1target_qc_haccp
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d1target_qc_haccp_point
    domain_id: winemaking
    assertion_text: "OIV's wine-safety guide treats cleaning and other good hygiene practices as prerequisites to a site-specific HACCP analysis. Hazard analysis considers significant safety hazards and selects appropriate preventive controls, operational prerequisites or critical control points; not every spoilage observation automatically becomes a food-safety CCP."
    verification_status: unverified
    last_verified_at: "2026-09-29T11:32:00.000Z"
    mcq_disabled: true
  - id: ki_d1target_qc_iso_trace
    subject_id: n_d1target_qc_iso_trace
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d1target_qc_iso_trace_point
    domain_id: winemaking
    assertion_text: "ISO 22000:2018 sets requirements for a food-safety management system and may be certified, but mentioning ISO is not evidence that a winery is certified. Wine traceability links inputs, process and packaged lots to destinations so an affected lot can be investigated and contained; the actual records and controls must be tested."
    verification_status: unverified
    last_verified_at: "2026-09-29T11:32:00.000Z"
    mcq_disabled: true
  - id: ki_d1target_pack_barrier
    subject_id: n_d1target_pack_barrier
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d1target_pack_barrier_point
    domain_id: winemaking
    assertion_text: "For glass, PET or bag-in-box, compare the intended consumption window with package and closure oxygen performance, filling oxygen and wine stability. AWRI's manufacturing guide calls for low dissolved oxygen and format-specific shelf-life checks; a light pack is not automatically suitable for long ageing."
    verification_status: unverified
    last_verified_at: "2026-09-29T11:32:00.000Z"
    mcq_disabled: true
  - id: ki_d1target_pack_freight
    subject_id: n_d1target_pack_freight
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d1target_pack_freight_point
    domain_id: winemaking
    assertion_text: "Bulk shipment and destination packaging may reduce shipped glass weight and freight cost, but adds transfers, destination filling and assurance work. AWRI trials found no consistent sensory preference between flexi- and ISO-tank shipments under their tested conditions; protect wine against oxygen and temperature exposure and compare actual landed cost rather than promise that one route always improves quality."
    verification_status: unverified
    last_verified_at: "2026-09-29T11:32:00.000Z"
    mcq_disabled: true
  - id: ki_d1target_case_vineyard_action
    subject_id: n_d1target_case_vineyard
    relation_type: CASE_ACTION
    object_id: n_d1target_case_vineyard_action
    domain_id: viticulture
    assertion_text: "For the dry erosion-prone block, pilot a seasonally managed cover on part of the slope and map contrasting vine zones. Ground-check soil moisture, canopy, yield and fruit before adjusting cover or a variable-rate input; compare with an untreated area rather than convert the entire block on one map."
    verification_status: unverified
    last_verified_at: "2026-09-29T11:32:00.000Z"
    mcq_disabled: true
  - id: ki_d1target_case_vineyard_reason
    subject_id: n_d1target_case_vineyard
    relation_type: CASE_REASON
    object_id: n_d1target_case_vineyard_reason
    domain_id: viticulture
    assertion_text: "OIV identifies cover and soil-health goals; AWRI documents erosion and water-competition effects; Wine Australia shows how mapped variation can target site checks. Combining these sources makes the decision conditional on actual slope, water and vine responses rather than a slogan about regenerative or precision methods."
    verification_status: unverified
    last_verified_at: "2026-09-29T11:32:00.000Z"
    mcq_disabled: true
  - id: ki_d1target_case_vineyard_tradeoff
    subject_id: n_d1target_case_vineyard
    relation_type: CASE_TRADEOFF
    object_id: n_d1target_case_vineyard_tradeoff
    domain_id: viticulture
    assertion_text: "A cover may reduce erosion yet compete for scarce water and reduce yield if poorly timed; a zone map may focus labour or inputs yet require mapping, interpretation and machinery costs. Judge style and quality from ripeness, fruit health and resulting wine alongside those costs."
    verification_status: unverified
    last_verified_at: "2026-09-29T11:32:00.000Z"
    mcq_disabled: true
  - id: ki_d1target_case_vineyard_limit
    subject_id: n_d1target_case_vineyard
    relation_type: CASE_LIMITATION
    object_id: n_d1target_case_vineyard_limit
    domain_id: viticulture
    assertion_text: "The sources do not establish this block's water reserve, the cause of its mapped vigour zones, resulting grape composition or the sale price of separated lots. Monitor and compare those outcomes before scaling; neither practice guarantees a quality tier."
    verification_status: unverified
    last_verified_at: "2026-09-29T11:32:00.000Z"
    mcq_disabled: true
  - id: ki_d1target_case_nolo_action
    subject_id: n_d1target_case_nolo
    relation_type: CASE_ACTION
    object_id: n_d1target_case_nolo_action
    domain_id: winemaking
    assertion_text: "For a hypothetical very low-alcohol export line, trial OIV-described separation on sound base wine under a qualified oenologist or technician. Set the target with the importer, measure final alcohol, assess sensory and microbial stability, and check destination naming and labelling before a commercial run."
    verification_status: unverified
    last_verified_at: "2026-09-29T11:32:00.000Z"
    mcq_disabled: true
  - id: ki_d1target_case_nolo_reason
    subject_id: n_d1target_case_nolo
    relation_type: CASE_REASON
    object_id: n_d1target_case_nolo_reason
    domain_id: winemaking
    assertion_text: "OIV permits vacuum, membrane and distillation routes for alcohol reduction from sound wine; its technical account notes that removing ethanol can change aroma and mouthfeel. Trial results, not the process name alone, show whether the requested fresh style survives."
    verification_status: unverified
    last_verified_at: "2026-09-29T11:32:00.000Z"
    mcq_disabled: true
  - id: ki_d1target_case_nolo_tradeoff
    subject_id: n_d1target_case_nolo
    relation_type: CASE_TRADEOFF
    object_id: n_d1target_case_nolo_tradeoff
    domain_id: winemaking
    assertion_text: "Separation, skilled oversight, repeated sensory trials and stability controls add cost. Lower alcohol can change body and aroma and shelf stability, so compare the target style and price with a less extensive reduction or a different product brief; do not infer that more removal is automatically better."
    verification_status: unverified
    last_verified_at: "2026-09-29T11:32:00.000Z"
    mcq_disabled: true
  - id: ki_d1target_case_nolo_limit
    subject_id: n_d1target_case_nolo
    relation_type: CASE_LIMITATION
    object_id: n_d1target_case_nolo_limit
    domain_id: winemaking
    assertion_text: "No source here establishes the hypothetical base wine's flavour, viable shelf life, achieved final strength, consumer preference or destination's current legal category. These require measured trials and local legal review, not a universal low-alcohol label claim."
    verification_status: unverified
    last_verified_at: "2026-09-29T11:32:00.000Z"
    mcq_disabled: true
  - id: ki_d1target_case_qc_action
    subject_id: n_d1target_case_qc
    relation_type: CASE_ACTION
    object_id: n_d1target_case_qc_action
    domain_id: winemaking
    assertion_text: "Stop release and identify affected filling lots when a new line shows a contamination signal and a broken lot link. Verify cleaning and sanitation records, sample the line and product, reconstruct input-to-output and destination records, and apply the winery's hazard analysis before deciding corrective action and release."
    verification_status: unverified
    last_verified_at: "2026-09-29T11:32:00.000Z"
    mcq_disabled: true
  - id: ki_d1target_case_qc_reason
    subject_id: n_d1target_case_qc
    relation_type: CASE_REASON
    object_id: n_d1target_case_qc_reason
    domain_id: winemaking
    assertion_text: "OIV and Codex put basic hygiene before HACCP critical-control decisions. AWRI describes packaging-line microbial investigations; traceable lot and dispatch records let the team bound affected wine. ISO 22000 describes a system for controlling food-safety hazards, not a substitute for line evidence."
    verification_status: unverified
    last_verified_at: "2026-09-29T11:32:00.000Z"
    mcq_disabled: true
  - id: ki_d1target_case_qc_tradeoff
    subject_id: n_d1target_case_qc
    relation_type: CASE_TRADEOFF
    object_id: n_d1target_case_qc_tradeoff
    domain_id: winemaking
    assertion_text: "Holding wine and checking the filler delay cash recovery and may require cleaning or repackaging, but a premature release can enlarge the affected lot and cost. Distinguish sensory spoilage from a proven safety hazard; use results to decide whether rework, disposal or release protects quality and consumers."
    verification_status: unverified
    last_verified_at: "2026-09-29T11:32:00.000Z"
    mcq_disabled: true
  - id: ki_d1target_case_qc_limit
    subject_id: n_d1target_case_qc
    relation_type: CASE_LIMITATION
    object_id: n_d1target_case_qc_limit
    domain_id: winemaking
    assertion_text: "A generic case cannot designate a CCP or set its critical limit without the winery's product, process and hazard analysis. An ISO reference does not establish certification, and incomplete lot records prevent a precise recall boundary until investigated."
    verification_status: unverified
    last_verified_at: "2026-09-29T11:32:00.000Z"
    mcq_disabled: true
  - id: ki_d1target_case_pack_action
    subject_id: n_d1target_case_pack
    relation_type: CASE_ACTION
    object_id: n_d1target_case_pack_action
    domain_id: winemaking
    assertion_text: "For an early-drinking distant-market white, compare local glass bottling with a trial of controlled bulk transport and destination filling into a suitable lighter format. Specify drinking window, package oxygen and stability tests, transport temperature records, lot traceability and both routes' full landed costs before choosing."
    verification_status: unverified
    last_verified_at: "2026-09-29T11:32:00.000Z"
    mcq_disabled: true
  - id: ki_d1target_case_pack_reason
    subject_id: n_d1target_case_pack
    relation_type: CASE_REASON
    object_id: n_d1target_case_pack_reason
    domain_id: winemaking
    assertion_text: "AWRI's packaging guidance connects oxygen control and format-specific shelf-life to wine condition, while its transport trials show why temperature, vessel and hold-back samples matter. Shipping unpackaged wine can avoid transporting glass, but destination filling is a further quality-control step."
    verification_status: unverified
    last_verified_at: "2026-09-29T11:32:00.000Z"
    mcq_disabled: true
  - id: ki_d1target_case_pack_tradeoff
    subject_id: n_d1target_case_pack
    relation_type: CASE_TRADEOFF
    object_id: n_d1target_case_pack_tradeoff
    domain_id: winemaking
    assertion_text: "Bulk plus a lighter pack may lower freight weight and cost, yet adds destination bottling, validation and possible oxygen or taint exposure. Glass may support a different ageing and presentation brief but ships more weight. Compare sensory condition, package life and actual total cost rather than price a container alone."
    verification_status: unverified
    last_verified_at: "2026-09-29T11:32:00.000Z"
    mcq_disabled: true
  - id: ki_d1target_case_pack_limit
    subject_id: n_d1target_case_pack
    relation_type: CASE_LIMITATION
    object_id: n_d1target_case_pack_limit
    domain_id: winemaking
    assertion_text: "AWRI's bulk trial did not prove that every route or wine withstands heat, oxygen or time equally. A lighter package does not guarantee a longer shelf life or legal suitability in the destination; validate the chosen wine-pack combination and obtain current market requirements."
    verification_status: unverified
    last_verified_at: "2026-09-29T11:32:00.000Z"
    mcq_disabled: true

