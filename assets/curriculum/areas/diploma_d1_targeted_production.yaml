# Original D1 decisions against the 2025 Diploma production range.
# A named approach or system is not a sensory score, legal status or certification.
# All assertions await qualified subject review.
knowledge_nodes:
  - {id: n_d1target_regen_cover, node_type: production_principle, name: "What does a regenerative vineyard floor approach try to improve?"}
  - {id: n_d1target_regen_cover_point, node_type: learning_point, name: "Protect soil with cover and less disturbance"}
  - {id: n_d1target_regen_water, node_type: production_principle, name: "Why must cover cropping be adapted to water supply?"}
  - {id: n_d1target_regen_water_point, node_type: learning_point, name: "Ground cover may compete with vines in a dry site"}
  - {id: n_d1target_precision_zones, node_type: production_principle, name: "How does precision viticulture inform a vineyard intervention?"}
  - {id: n_d1target_precision_zones_point, node_type: learning_point, name: "Map variation and verify its cause on the ground"}
  - {id: n_d1target_precision_cost, node_type: production_principle, name: "When can a precision intervention earn its cost?"}
  - {id: n_d1target_precision_cost_point, node_type: learning_point, name: "Compare the cost of data and action with measured outcomes"}
  - {id: n_d1target_nolo_route, node_type: production_principle, name: "Which production routes can reduce wine alcohol?"}
  - {id: n_d1target_nolo_route_point, node_type: learning_point, name: "Sound base wine can undergo supervised separation"}
  - {id: n_d1target_nolo_balance, node_type: production_principle, name: "What else must be checked after alcohol removal?"}
  - {id: n_d1target_nolo_balance_point, node_type: learning_point, name: "Reassess aroma mouthfeel stability cost and labelling"}
  - {id: n_d1target_qc_haccp, node_type: production_principle, name: "How do winery hygiene and HACCP differ?"}
  - {id: n_d1target_qc_haccp_point, node_type: learning_point, name: "Hygiene is a prerequisite; hazard analysis determines controls"}
  - {id: n_d1target_qc_iso_trace, node_type: production_principle, name: "What do ISO 22000 and traceability add?"}
  - {id: n_d1target_qc_iso_trace_point, node_type: learning_point, name: "A management system and lot trail support control and response"}
  - {id: n_d1target_pack_barrier, node_type: production_principle, name: "How should a wine package be matched to intended shelf life?"}
  - {id: n_d1target_pack_barrier_point, node_type: learning_point, name: "Compare oxygen exposure closure and validated use period"}
  - {id: n_d1target_pack_freight, node_type: production_principle, name: "What changes when wine travels in bulk rather than packaged?"}
  - {id: n_d1target_pack_freight_point, node_type: learning_point, name: "Freight cost and package weight trade against transfer control"}
  - {id: n_d1target_case_vineyard, node_type: production_case, name: "Dry erosion-prone block with mapped vigour variation"}
  - {id: n_d1target_case_vineyard_action, node_type: learning_point, name: "Pilot site-specific cover and intervention"}
  - {id: n_d1target_case_vineyard_reason, node_type: learning_point, name: "Use soil and vine evidence together"}
  - {id: n_d1target_case_vineyard_tradeoff, node_type: learning_point, name: "Protect soil without worsening water stress or costs"}
  - {id: n_d1target_case_vineyard_limit, node_type: learning_point, name: "No map or practice guarantees wine quality"}
  - {id: n_d1target_case_nolo, node_type: production_case, name: "An importer requests a very low-alcohol line"}
  - {id: n_d1target_case_nolo_action, node_type: learning_point, name: "Pilot a compliant supervised reduction from sound wine"}
  - {id: n_d1target_case_nolo_reason, node_type: learning_point, name: "Separation changes alcohol and can change sensory balance"}
  - {id: n_d1target_case_nolo_tradeoff, node_type: learning_point, name: "Equipment and stability checks affect cost and style"}
  - {id: n_d1target_case_nolo_limit, node_type: learning_point, name: "A process cannot guarantee label eligibility or acceptance"}
  - {id: n_d1target_case_qc, node_type: production_case, name: "New filler has a contamination signal and an unclear lot record"}
  - {id: n_d1target_case_qc_action, node_type: learning_point, name: "Hold affected wine and investigate the line and lot trail"}
  - {id: n_d1target_case_qc_reason, node_type: learning_point, name: "Separate routine hygiene from hazard-based controls"}
  - {id: n_d1target_case_qc_tradeoff, node_type: learning_point, name: "Release delay costs less than an unbounded failure"}
  - {id: n_d1target_case_qc_limit, node_type: learning_point, name: "Do not assume every defect is a CCP or an ISO certificate"}
  - {id: n_d1target_case_pack, node_type: production_case, name: "Distant market seeks a lighter early-drinking wine pack"}
  - {id: n_d1target_case_pack_action, node_type: learning_point, name: "Compare validated local fill with bulk and destination fill"}
  - {id: n_d1target_case_pack_reason, node_type: learning_point, name: "Oxygen temperature and package barrier affect style preservation"}
  - {id: n_d1target_case_pack_tradeoff, node_type: learning_point, name: "Freight savings may add fill and assurance costs"}
  - {id: n_d1target_case_pack_limit, node_type: learning_point, name: "No package or route is always cheapest or highest quality"}

