question_templates:
  - id: qt_cms_pairing_case_oysters
    relation_type: CASE_ACTION
    direction: forward
    mode: short_answer
    variant: cms_pairing_oysters
    prompt_template: >-
      A guest who likes crisp dry white wine orders oysters with a lemon-and-vinegar
      accompaniment. Explain how you would assess Muscadet as a first wine to trial
      with the dressed oyster and this guest.
    parameters:
      scope_node_ids: [n_cms_pairing_case_oysters]
      key_points:
        CASE_ACTION: Conditional wine recommendation
        CASE_REASON: Dish-and-wine reason
        CASE_TRADEOFF: Alternative or tradeoff
        CASE_LIMITATION: Condition or tasting follow-up
  - id: qt_cms_pairing_case_chocolate
    relation_type: CASE_ACTION
    direction: forward
    mode: short_answer
    variant: cms_pairing_chocolate
    prompt_template: >-
      A guest who enjoys fortified wine orders a high-cocoa chocolate tart with
      salted caramel. Explain how you would assess Tawny Port as a tentative wine
      trial with this tart and topping.
    parameters:
      scope_node_ids: [n_cms_pairing_case_chocolate]
      key_points:
        CASE_ACTION: Conditional wine recommendation
        CASE_REASON: Dish-and-wine reason
        CASE_TRADEOFF: Sensory tradeoff
        CASE_LIMITATION: Limit of the tested source example
