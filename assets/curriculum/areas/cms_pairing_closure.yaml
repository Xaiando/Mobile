knowledge_items:
  - id: ki_cms_pairing_browning
    subject_id: n_cms_pairing_cooking
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_pairing_point_browning
    domain_id: service
    assertion_text: >-
      High-heat browning can add toasted or roasted aromas to food. Before carrying
      over a wine suggestion from a gently cooked version, assess whether those
      new flavours now lead the finished dish; browning alone does not prescribe a wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_pairing_preparation
    subject_id: n_cms_pairing_cooking
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_pairing_point_preparation
    domain_id: service
    assertion_text: >-
      Preparation and seasoning can change the useful pairing brief. WSET suggests
      aromatic Sauvignon Blanc for stronger-flavoured smoked salmon, but Chablis
      for grilled sea bass with lemon. These are different fish dishes, not a
      controlled comparison of one ingredient cooked two ways; assess each plate.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_pairing_sauce
    subject_id: n_cms_pairing_cooking
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_pairing_point_sauce
    domain_id: service
    assertion_text: >-
      Check the finished sauce and condiments as well as the central ingredient.
      They can supply the strongest flavour or acid on the plate and change which
      wine is worth trialling. Ask how the dish will actually be served.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_pairing_vinegar
    subject_id: n_cms_pairing_vinegar
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_pairing_point_vinegar
    domain_id: service
    assertion_text: >-
      With oysters dressed in sharp lemon or vinegar, WSET suggests high-acid
      Muscadet or Champagne. Use that as a starting choice for the dressed oyster,
      then check how much condiment the guest uses and which style they prefer.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_pairing_chocolate
    subject_id: n_cms_pairing_chocolate
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_pairing_point_chocolate
    domain_id: service
    assertion_text: >-
      Chocolate's sweetness can mute a dry wine's fruit and make it seem more
      bitter or hollow. WSET offers sweet Ruby or Tawny Port and Recioto as
      possibilities with high-cocoa chocolate, not guaranteed matches for every
      chocolate dessert or guest.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_pairing_caramel
    subject_id: n_cms_pairing_caramel
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_pairing_point_caramel
    domain_id: service
    assertion_text: >-
      In a salted-caramel dessert, evaluate sweetness and salt separately: sweet
      food can make a wine seem drier and more bitter, while salt can soften
      perceived bitterness. This combines WSET's general sensory guidance; it
      does not establish a particular wine as the correct salted-caramel match.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_pairing_oysters_action
    subject_id: n_cms_pairing_case_oysters
    relation_type: CASE_ACTION
    object_id: n_cms_pairing_point_oysters_action
    domain_id: service
    assertion_text: >-
      Offer the guest a small trial of Muscadet alongside an oyster with the
      intended amount of lemon-and-vinegar accompaniment.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_pairing_oysters_reason
    subject_id: n_cms_pairing_case_oysters
    relation_type: CASE_REASON
    object_id: n_cms_pairing_point_oysters_reason
    domain_id: service
    assertion_text: >-
      WSET explains that tangy lemon or vinegar with oysters can soften a
      high-acid Muscadet's perceived acidity. This links the finished bite to
      a wine choice that respects the guest's crisp, dry-white preference.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_pairing_oysters_tradeoff
    subject_id: n_cms_pairing_case_oysters
    relation_type: CASE_TRADEOFF
    object_id: n_cms_pairing_point_oysters_tradeoff
    domain_id: service
    assertion_text: >-
      Champagne is another WSET-suggested option for the tangy oyster. It may
      suit a guest who wants sparkling wine, while Muscadet follows this guest's
      request for a crisp still white; neither is automatically superior.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_pairing_oysters_limitation
    subject_id: n_cms_pairing_case_oysters
    relation_type: CASE_LIMITATION
    object_id: n_cms_pairing_point_oysters_limitation
    domain_id: service
    assertion_text: >-
      Ask whether the guest will use the sharp dressing and taste the actual
      bite with the available wine if possible. WSET's example does not prove
      every oyster preparation or every bottle of Muscadet will please this guest.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_pairing_chocolate_action
    subject_id: n_cms_pairing_case_chocolate
    relation_type: CASE_ACTION
    object_id: n_cms_pairing_point_chocolate_action
    domain_id: service
    assertion_text: >-
      If a sample is available, trial a small pour of Tawny Port with a bite of
      the high-cocoa chocolate tart and its salted caramel, then ask the guest
      how the combination tastes.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_pairing_chocolate_reason
    subject_id: n_cms_pairing_case_chocolate
    relation_type: CASE_REASON
    object_id: n_cms_pairing_point_chocolate_reason
    domain_id: service
    assertion_text: >-
      Sweet food can make a dry wine seem less fruity and more bitter, so WSET
      suggests sweet Tawny Port as a possible partner for high-cocoa chocolate.
      The salted-caramel topping changes the bite and still needs tasting.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_pairing_chocolate_tradeoff
    subject_id: n_cms_pairing_case_chocolate
    relation_type: CASE_TRADEOFF
    object_id: n_cms_pairing_point_chocolate_tradeoff
    domain_id: service
    assertion_text: >-
      The tart's sweetness could still make the wine seem drier or less fruity;
      its salt could soften bitterness. Compare both effects rather than relying
      on Tawny Port's sweetness alone.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_pairing_chocolate_limitation
    subject_id: n_cms_pairing_case_chocolate
    relation_type: CASE_LIMITATION
    object_id: n_cms_pairing_point_chocolate_limitation
    domain_id: service
    assertion_text: >-
      The cited WSET sources discuss high-cocoa chocolate, sweet wine, and the
      sensory effects of sweetness and salt separately. They do not test this
      exact chocolate tart with salted caramel and Tawny Port; keep the proposed
      pairing tentative and respond to the guest's tasting result.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"

