# CMS Certified pairing practice. Cases are conditional applications, not universal menu rules.
knowledge_nodes:
  - { id: n_cms_pairing_cooking, node_type: production_principle, name: "How can cooking and the finished plate change a wine recommendation?" }
  - { id: n_cms_pairing_point_browning, node_type: learning_point, name: "Browning changes the food's aroma" }
  - { id: n_cms_pairing_point_preparation, node_type: learning_point, name: "Compare preparation and seasoning, not the food name alone" }
  - { id: n_cms_pairing_point_sauce, node_type: learning_point, name: "A sauce or condiment may set the dominant flavour" }
  - { id: n_cms_pairing_vinegar, node_type: production_principle, name: "How should a sharp vinegar accompaniment affect a wine choice?" }
  - { id: n_cms_pairing_point_vinegar, node_type: learning_point, name: "Assess the acidity of the finished bite" }
  - { id: n_cms_pairing_chocolate, node_type: production_principle, name: "Why is a chocolate dessert a difficult match for dry wine?" }
  - { id: n_cms_pairing_point_chocolate, node_type: learning_point, name: "Chocolate sweetness can change the wine's apparent fruit and bitterness" }
  - { id: n_cms_pairing_caramel, node_type: production_principle, name: "What should be checked with salted caramel?" }
  - { id: n_cms_pairing_point_caramel, node_type: learning_point, name: "Consider both sweetness and salt before recommending a wine" }
  - id: n_cms_pairing_case_oysters
    node_type: production_case
    name: >-
      A guest who likes crisp dry white wine orders oysters with a lemon-and-vinegar
      accompaniment. Assess a Muscadet trial for the finished bite and the guest.
  - { id: n_cms_pairing_point_oysters_action, node_type: learning_point, name: "Trial Muscadet with the dressed oyster" }
  - { id: n_cms_pairing_point_oysters_reason, node_type: learning_point, name: "The sharp accompaniment informs the choice" }
  - { id: n_cms_pairing_point_oysters_tradeoff, node_type: learning_point, name: "Champagne is another sourced option" }
  - { id: n_cms_pairing_point_oysters_limitation, node_type: learning_point, name: "Taste the actual dressing and ask the guest" }
  - id: n_cms_pairing_case_chocolate
    node_type: production_case
    name: >-
      A guest who enjoys fortified wine orders a high-cocoa chocolate tart with
      salted caramel. Assess a tentative Tawny Port trial for the finished bite.
  - { id: n_cms_pairing_point_chocolate_action, node_type: learning_point, name: "Trial a small taste of Tawny Port with the tart" }
  - { id: n_cms_pairing_point_chocolate_reason, node_type: learning_point, name: "High-cocoa chocolate and Tawny Port are a sourced possibility" }
  - { id: n_cms_pairing_point_chocolate_tradeoff, node_type: learning_point, name: "Dessert sweetness and salt can pull perception in different directions" }
  - { id: n_cms_pairing_point_chocolate_limitation, node_type: learning_point, name: "This exact tart-and-wine combination was not tested by the cited sources" }

