# Original Diploma D1 decisions. OIV definitions are technical references, not a
# claim of legal permission in every market. All assertions await subject review.
knowledge_nodes:
  - {id: n_d1vp_topwork, node_type: production_principle, name: "When can an established vine be topworked?"}
  - {id: n_d1vp_topwork_point, node_type: learning_point, name: "Change the fruiting variety while retaining a viable trunk and root system"}
  - {id: n_d1vp_layer, node_type: production_principle, name: "How does vineyard layering replace a missing vine?"}
  - {id: n_d1vp_layer_point, node_type: learning_point, name: "Root a neighbouring cane while it remains attached to the parent vine"}
  - {id: n_d1vp_massal, node_type: production_principle, name: "What material does massal selection propagate?"}
  - {id: n_d1vp_massal_point, node_type: learning_point, name: "Shoots from several selected source vines rather than one clone"}
  - {id: n_d1vp_massal_health, node_type: production_principle, name: "What must a massal selection programme verify?"}
  - {id: n_d1vp_massal_health_point, node_type: learning_point, name: "Selection does not by itself exclude transmissible viruses"}
  - {id: n_d1vp_fire, node_type: production_principle, name: "What is the first vineyard response after direct fire damage?"}
  - {id: n_d1vp_fire_point, node_type: learning_point, name: "Restore water access and audit vine and infrastructure injury"}
  - {id: n_d1vp_smoke, node_type: production_principle, name: "How is smoke-exposed fruit assessed before harvest?"}
  - {id: n_d1vp_smoke_point, node_type: learning_point, name: "Test both volatile phenols and bound glycosides, then assess wine risk"}
  - {id: n_d1vp_cryo, node_type: production_principle, name: "How does cryoextraction concentrate must?"}
  - {id: n_d1vp_cryo_point, node_type: learning_point, name: "Freeze harvested grapes artificially and press out concentrated must"}
  - {id: n_d1vp_ice, node_type: production_principle, name: "How does the OIV distinguish ice wine from cryoextraction?"}
  - {id: n_d1vp_ice_point, node_type: learning_point, name: "Ice-wine grapes freeze naturally on the vine and are pressed frozen"}
  - {id: n_d1vp_pouch, node_type: production_principle, name: "What must be established before a wine pouch launch?"}
  - {id: n_d1vp_pouch_point, node_type: learning_point, name: "Validate oxygen, flavour and shelf-life performance for the actual pack"}
  - {id: n_d1vp_can, node_type: production_principle, name: "Why is a wine-can liner a critical decision?"}
  - {id: n_d1vp_can_point, node_type: learning_point, name: "Protect wine from aluminium contact and test the double seam"}
  - {id: n_d1vp_glass, node_type: production_principle, name: "What is tested when choosing a glass stopper?"}
  - {id: n_d1vp_glass_point, node_type: learning_point, name: "The bottle, stopper and sealing ring work as one closure system"}
  - {id: n_d1vp_case_vines, node_type: production_case, name: "A producer must renew gaps and change part of a healthy block's cultivar"}
  - {id: n_d1vp_case_vines_action, node_type: learning_point, name: "Separate sound vines for topworking from gaps needing replacement"}
  - {id: n_d1vp_case_vines_reason, node_type: learning_point, name: "Grafting changes the top; layering roots an attached cane in a gap"}
  - {id: n_d1vp_case_vines_tradeoff, node_type: learning_point, name: "Retaining established vines may save establishment time but needs skilled labour"}
  - {id: n_d1vp_case_vines_limit, node_type: learning_point, name: "Check virus status and own-rooted phylloxera risk"}
  - {id: n_d1vp_case_smoke, node_type: production_case, name: "A vineyard has fire-damaged rows and smoke-exposed but unburnt rows"}
  - {id: n_d1vp_case_smoke_action, node_type: learning_point, name: "Restore irrigation and audit damage; sample unburnt fruit for smoke markers"}
  - {id: n_d1vp_case_smoke_reason, node_type: learning_point, name: "Structural injury and fruit smoke exposure require different evidence"}
  - {id: n_d1vp_case_smoke_tradeoff, node_type: learning_point, name: "Sampling and segregated trials cost time but protect harvest decisions"}
  - {id: n_d1vp_case_smoke_limit, node_type: learning_point, name: "No single marker or clean early taste proves a safe final wine"}
  - {id: n_d1vp_case_pack, node_type: production_case, name: "A winery compares pouch, can and glass-stopper formats for a fresh white"}
  - {id: n_d1vp_case_pack_action, node_type: learning_point, name: "Run format-specific fill, compatibility and shelf-life trials"}
  - {id: n_d1vp_case_pack_reason, node_type: learning_point, name: "Pouch barriers, can lining and glass-stopper seals fail in different ways"}
  - {id: n_d1vp_case_pack_tradeoff, node_type: learning_point, name: "Weight and convenience must be weighed against target shelf life"}
  - {id: n_d1vp_case_pack_limit, node_type: learning_point, name: "No format has a universal oxygen or ageing outcome"}

