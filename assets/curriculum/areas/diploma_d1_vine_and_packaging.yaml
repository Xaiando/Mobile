knowledge_items:
  - {id: ki_d1vp_topwork, subject_id: n_d1vp_topwork, relation_type: PRINCIPLE_EXPLANATION, object_id: n_d1vp_topwork_point, domain_id: viticulture, assertion_text: "Topworking grafts a new fruiting cultivar onto an established vine, retaining a viable trunk and root system. It can change the block's variety without planting every vine again, but the existing vine must be sound enough to justify conversion.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T20:00:00.000Z"}
  - {id: ki_d1vp_layer, subject_id: n_d1vp_layer, relation_type: PRINCIPLE_EXPLANATION, object_id: n_d1vp_layer_point, domain_id: viticulture, assertion_text: "Layering bends a long cane from a neighbouring vine into a vacant planting position and buries part of it. The cane remains nourished by the parent while it develops roots, then can be detached. A layered Vitis vinifera scion forms its own roots, so local phylloxera risk matters even if the parent was grafted on resistant rootstock.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T20:00:00.000Z"}
  - {id: ki_d1vp_massal, subject_id: n_d1vp_massal, relation_type: PRINCIPLE_EXPLANATION, object_id: n_d1vp_massal_point, domain_id: viticulture, assertion_text: "Massal selection identifies several desirable vines in a population, takes shoots from them and propagates that material. Its aim can be to conserve valued variation in an old block; it is not necessarily more diverse than a well-chosen mixture of tested clones.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T20:00:00.000Z"}
  - {id: ki_d1vp_massal_health, subject_id: n_d1vp_massal_health, relation_type: PRINCIPLE_EXPLANATION, object_id: n_d1vp_massal_health_point, domain_id: viticulture, assertion_text: "Visual selection of mother vines cannot establish that propagation wood is free of important viruses. A massal programme should pair observed performance with suitable sanitary testing; certified clonal material offers a different documented health pathway.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T20:00:00.000Z"}
  - {id: ki_d1vp_fire, subject_id: n_d1vp_fire, relation_type: PRINCIPLE_EXPLANATION, object_id: n_d1vp_fire_point, domain_id: viticulture, assertion_text: "Where flames have directly damaged a vineyard, restore water delivery promptly and audit vine trunks, canopies and infrastructure before deciding whether vines can recover. This physical injury assessment is separate from testing smoke-exposed fruit.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T20:00:00.000Z"}
  - {id: ki_d1vp_smoke, subject_id: n_d1vp_smoke, relation_type: PRINCIPLE_EXPLANATION, object_id: n_d1vp_smoke_point, domain_id: viticulture, assertion_text: "After smoke exposure, representative grape samples can be analysed for free volatile phenols and non-volatile glycoside markers before harvest. Interpret them against relevant background data and use a small-lot ferment and sensory assessment where possible; exposure alone does not establish the final wine's sensory outcome.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T20:00:00.000Z"}
  - {id: ki_d1vp_cryo, subject_id: n_d1vp_cryo, relation_type: PRINCIPLE_EXPLANATION, object_id: n_d1vp_cryo_point, domain_id: winemaking, assertion_text: "In OIV usage, cryoextraction freezes harvested grapes artificially, such as in a cold room or with liquid nitrogen, then presses them to collect a more concentrated must. It is a concentration technique, with costs and sensory results to assess for the actual fruit.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T20:00:00.000Z"}
  - {id: ki_d1vp_ice, subject_id: n_d1vp_ice, relation_type: PRINCIPLE_EXPLANATION, object_id: n_d1vp_ice_point, domain_id: winemaking, assertion_text: "The OIV's ice-wine definition requires grapes that froze naturally on the vine, were harvested frozen and were pressed in that state, without artificial freezing. Artificially freezing harvested grapes for cryoextraction must not be presented as meeting that definition; market rules still need checking.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T20:00:00.000Z"}
  - {id: ki_d1vp_pouch, subject_id: n_d1vp_pouch, relation_type: PRINCIPLE_EXPLANATION, object_id: n_d1vp_pouch_point, domain_id: winemaking, assertion_text: "AWRI reports limited performance information for plastic wine pouches. A producer should test the proposed film, seal and filled wine for oxygen ingress, aroma loss or taint, transport integrity and the required shelf life rather than assign a universal pouch ageing period.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T20:00:00.000Z"}
  - {id: ki_d1vp_can, subject_id: n_d1vp_can, relation_type: PRINCIPLE_EXPLANATION, object_id: n_d1vp_can_point, domain_id: winemaking, assertion_text: "A sealed aluminium can can greatly limit oxygen ingress, but the internal liner must prevent wine-metal contact. Liner or double-seam defects can promote corrosion and hydrogen sulfide; wine composition and filled-can shelf life need compatibility trials with the supplier.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T20:00:00.000Z"}
  - {id: ki_d1vp_glass, subject_id: n_d1vp_glass, relation_type: PRINCIPLE_EXPLANATION, object_id: n_d1vp_glass_point, domain_id: winemaking, assertion_text: "A glass stopper is not a bare-glass seal: a compatible bottle neck and resilient sealing ring create the closure interface, with a capsule used for transport security in the cited system. Test the assembled package's fit, retention and oxygen performance for the intended wine and storage period.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T20:00:00.000Z"}
  - {id: ki_d1vp_case_vines_action, subject_id: n_d1vp_case_vines, relation_type: CASE_ACTION, object_id: n_d1vp_case_vines_action, domain_id: viticulture, assertion_text: "Map healthy established vines, missing positions and disease symptoms first. Trial topworking only viable vines for the new cultivar; compare layering into gaps with nursery replacement, using selected and health-screened plant material.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T20:00:00.000Z"}
  - {id: ki_d1vp_case_vines_reason, subject_id: n_d1vp_case_vines, relation_type: CASE_REASON, object_id: n_d1vp_case_vines_reason, domain_id: viticulture, assertion_text: "A graft changes the scion on an established root system; a layer roots a still-attached cane into a gap. Massal selection describes the source of propagation wood and does not itself replace either field operation.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T20:00:00.000Z"}
  - {id: ki_d1vp_case_vines_tradeoff, subject_id: n_d1vp_case_vines, relation_type: CASE_TRADEOFF, object_id: n_d1vp_case_vines_tradeoff, domain_id: viticulture, assertion_text: "Retaining sound roots may reduce re-establishment time, but graft success, skilled labour and later uniformity must be weighed against replanting. Layering also ties the replacement to a neighbouring vine during establishment.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T20:00:00.000Z"}
  - {id: ki_d1vp_case_vines_limit, subject_id: n_d1vp_case_vines, relation_type: CASE_LIMITATION, object_id: n_d1vp_case_vines_limit, domain_id: viticulture, assertion_text: "Do not topwork an unsound trunk or infer virus freedom from appearance or massal origin. If a Vitis vinifera scion is layered, assess the risk of own-rooted vines in a phylloxera-prone site. Verify mother-vine health, graft take and replacement survival.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T20:00:00.000Z"}
  - {id: ki_d1vp_case_smoke_action, subject_id: n_d1vp_case_smoke, relation_type: CASE_ACTION, object_id: n_d1vp_case_smoke_action, domain_id: viticulture, assertion_text: "Re-establish irrigation and audit the directly burnt rows for structural injury. Segregate the unburnt smoke-exposed rows, take representative pre-harvest samples for both marker classes and make a small-lot ferment for sensory assessment where possible.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T20:00:00.000Z"}
  - {id: ki_d1vp_case_smoke_reason, subject_id: n_d1vp_case_smoke, relation_type: CASE_REASON, object_id: n_d1vp_case_smoke_reason, domain_id: viticulture, assertion_text: "Fire can damage vine tissue and water infrastructure; smoke can leave volatile phenols and glycoside precursors in fruit even without direct burning. The two decisions need different observations and tests.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T20:00:00.000Z"}
  - {id: ki_d1vp_case_smoke_tradeoff, subject_id: n_d1vp_case_smoke, relation_type: CASE_TRADEOFF, object_id: n_d1vp_case_smoke_tradeoff, domain_id: viticulture, assertion_text: "Segregation, lab tests and microferments consume labour and lead time but give better grounds for selective harvest or diversion than either harvesting everything or rejecting every exposed row.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T20:00:00.000Z"}
  - {id: ki_d1vp_case_smoke_limit, subject_id: n_d1vp_case_smoke, relation_type: CASE_LIMITATION, object_id: n_d1vp_case_smoke_limit, domain_id: viticulture, assertion_text: "Compare markers with appropriate background and recognise that glycoside methods differ between laboratories; an early clean aroma alone cannot rule out later sensory impact in the finished wine.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T20:00:00.000Z"}
  - {id: ki_d1vp_case_pack_action, subject_id: n_d1vp_case_pack, relation_type: CASE_ACTION, object_id: n_d1vp_case_pack_action, domain_id: winemaking, assertion_text: "Define the white wine's time to consumption and distribution conditions, then fill pilot runs in each proposed pouch, can and glass-stopper bottle; measure package oxygen, seal integrity, wine composition and sensory change over the intended shelf life.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T20:00:00.000Z"}
  - {id: ki_d1vp_case_pack_reason, subject_id: n_d1vp_case_pack, relation_type: CASE_REASON, object_id: n_d1vp_case_pack_reason, domain_id: winemaking, assertion_text: "A pouch's film and seals, a can's liner and seam, and a glass stopper's sealing ring and bottle neck set different oxygen and compatibility risks. Bare material names do not specify the performance of a filled pack.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T20:00:00.000Z"}
  - {id: ki_d1vp_case_pack_tradeoff, subject_id: n_d1vp_case_pack, relation_type: CASE_TRADEOFF, object_id: n_d1vp_case_pack_tradeoff, domain_id: winemaking, assertion_text: "Light packs can reduce transport weight and improve convenience; a glass bottle may support longer planned cellaring. Cost, breakage, market positioning and verified shelf life must be compared for this wine and route.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T20:00:00.000Z"}
  - {id: ki_d1vp_case_pack_limit, subject_id: n_d1vp_case_pack, relation_type: CASE_LIMITATION, object_id: n_d1vp_case_pack_limit, domain_id: winemaking, assertion_text: "AWRI says pouch performance information is limited and can compatibility depends on the wine and coating. A glass stopper also depends on its assembled seal; no format guarantees a universal oxygen rate or safe ageing period.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T20:00:00.000Z"}

