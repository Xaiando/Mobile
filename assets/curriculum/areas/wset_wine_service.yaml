knowledge_items:
  - id: ki_wset_srv_storage_cool
    subject_id: n_wset_srv_principle_storage
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_storage_cool
    domain_id: service
    assertion_text: Keep unopened wine cool and at a stable temperature; prolonged heat or large temperature
      swings can damage it.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_storage_dark
    subject_id: n_wset_srv_principle_storage
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_storage_dark
    domain_id: service
    assertion_text: Protect stored wine from strong light; heating and light-driven reactions can harm its character.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_storage_closure
    subject_id: n_wset_srv_principle_storage
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_storage_closure
    domain_id: service
    assertion_text: For conventional cork-closed still wines, side storage maintains cork contact with wine;
      screwcaps can stand upright.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_storage_provenance
    subject_id: n_wset_srv_principle_storage
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_storage_provenance
    domain_id: service
    assertion_text: Before buying an older bottle, ask about storage and inspect leakage, fill level and bottle condition.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_red_temperature
    subject_id: n_wset_srv_principle_red_temp
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_red_temperature
    domain_id: service
    assertion_text: Use roughly 15–18°C for full-bodied reds; a heated room above this range is not the intended
      service condition.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_red_cold
    subject_id: n_wset_srv_principle_red_temp
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_red_cold
    domain_id: service
    assertion_text: Excessive chilling can make a full-bodied red seem thin and harsh; warm it gently rather than
      beside a heater.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_white_temperature
    subject_id: n_wset_srv_principle_red_temp
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_white_temperature
    domain_id: service
    assertion_text: A fuller-bodied white can be lightly chilled around 10–13°C; extreme cold masks aroma and flavour.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_light_white_temperature
    subject_id: n_wset_srv_principle_other_temp
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_light_white_temperature
    domain_id: service
    assertion_text: A useful service range for light whites and rosés is about 7–10°C; adjust to the actual wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_light_red_temperature
    subject_id: n_wset_srv_principle_other_temp
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_light_red_temperature
    domain_id: service
    assertion_text: Light reds can be served slightly chilled, around 10–13°C, rather than at a warm room temperature.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_sweet_temperature
    subject_id: n_wset_srv_principle_other_temp
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_sweet_temperature
    domain_id: service
    assertion_text: Sweet whites can be well chilled around 6–8°C; temperature remains a style guideline rather
      than a legal requirement.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_champagne_temperature
    subject_id: n_wset_srv_principle_other_temp
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_champagne_temperature
    domain_id: service
    assertion_text: Comité Champagne recommends about 8–10°C for drinking Champagne; source-specific ranges need
      not be identical for every sparkling wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_ice_water
    subject_id: n_wset_srv_principle_cooling
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_ice_water
    domain_id: service
    assertion_text: "Use both ice and water: contact with cold water transfers heat more effectively than gaps of
      air between ice cubes."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_temp_masking
    subject_id: n_wset_srv_principle_cooling
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_temp_masking
    domain_id: service
    assertion_text: Serving below roughly 6°C can suppress white, rosé and sparkling aromas; allow a very cold
      sample to warm before judging it.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_glass_clean
    subject_id: n_wset_srv_principle_glass
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_glass_clean
    domain_id: service
    assertion_text: Use clean, odour-free glasses so residues do not distort the wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_bottle_identity
    subject_id: n_wset_srv_principle_glass
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_bottle_identity
    domain_id: service
    assertion_text: Confirm the wine and vintage before opening; inspect and smell the wine before continuing service.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_sparkling_glass
    subject_id: n_wset_srv_principle_glass
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_sparkling_glass
    domain_id: service
    assertion_text: A tulip-shaped glass gives Champagne aroma space while its narrowing rim helps retain aroma and bubbles.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_foil
    subject_id: n_wset_srv_principle_still_open
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_foil
    domain_id: service
    assertion_text: Cut the foil below the second lip and remove it; wipe the top of the cork before drawing it,
      then wipe the bottle top again before pouring.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_corkscrew
    subject_id: n_wset_srv_principle_still_open
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_corkscrew
    domain_id: service
    assertion_text: Insert the corkscrew worm just off centre, twist slowly until its tip is just short of the
      cork's bottom, then lever the cork out gently.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_cork_fragile
    subject_id: n_wset_srv_principle_still_open
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_cork_fragile
    domain_id: service
    assertion_text: Older corks can break under a normal spiral; a two-prong opener or combined tool can support
      gentler extraction.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_cork_taint_distinct
    subject_id: n_wset_srv_principle_still_open
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_cork_taint_distinct
    domain_id: service
    assertion_text: A broken cork is a physical problem; cork taint is a sensory taint, so assess the wine rather
      than infer taint from fragments.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_spark_chill
    subject_id: n_wset_srv_principle_spark_open
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_spark_chill
    domain_id: service
    assertion_text: Chill sparkling wine before opening and avoid shaking the bottle.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_spark_control
    subject_id: n_wset_srv_principle_spark_open
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_spark_control
    domain_id: service
    assertion_text: Keep a firm hand on the cork while loosening the wire; point the bottle away from people.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_spark_rotate
    subject_id: n_wset_srv_principle_spark_open
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_spark_rotate
    domain_id: service
    assertion_text: Restrain the cork and gently rotate the bottle; ease the cork out without letting it fly.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_preserve_cool
    subject_id: n_wset_srv_principle_preservation
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_preserve_cool
    domain_id: service
    assertion_text: Reclose opened still wine and refrigerate it, including red wine; cooling slows oxidation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_preserve_air
    subject_id: n_wset_srv_principle_preservation
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_preserve_air
    domain_id: service
    assertion_text: A smaller, clean sealed bottle reduces air space around leftover still wine; handle
      hygienically and label the opening date.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_preserve_vacuum
    subject_id: n_wset_srv_principle_preservation
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_preserve_vacuum
    domain_id: service
    assertion_text: A vacuum device removes some air before resealing; it delays deterioration rather than
      restoring damaged wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_preserve_gas
    subject_id: n_wset_srv_principle_preservation
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_preserve_gas
    domain_id: service
    assertion_text: An appropriate inert-gas system limits oxygen exposure; its benefit depends on the seal, wine
      and correct operation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_spark_stopper
    subject_id: n_wset_srv_principle_spark_preserve
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_spark_stopper
    domain_id: service
    assertion_text: Use a purpose-made sparkling-wine stopper and keep the opened bottle cool; a spoon in the neck
      does not preserve bubbles.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_spark_no_vacuum
    subject_id: n_wset_srv_principle_spark_preserve
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_spark_no_vacuum
    domain_id: service
    assertion_text: A still-wine vacuum pump can remove dissolved gas and flatten sparkling wine; use equipment
      designed for carbonation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_preserve_check
    subject_id: n_wset_srv_principle_spark_preserve
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_preserve_check
    domain_id: service
    assertion_text: Opening a bottle starts loss of aroma and flavour; preservation can delay deterioration but
      does not guarantee indefinite freshness.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_decant_deposit
    subject_id: n_wset_srv_principle_decant
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_decant_deposit
    domain_id: service
    assertion_text: Some aged or less-filtered reds form a deposit; gentle decanting separates clear wine from sediment.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_decant_gently
    subject_id: n_wset_srv_principle_decant
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_decant_gently
    domain_id: service
    assertion_text: Avoid disturbing sediment; watch the neck in good light and stop pouring before the deposit
      enters the decanter.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_decant_air
    subject_id: n_wset_srv_principle_decant
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_decant_air
    domain_id: service
    assertion_text: Extra air may change aroma, but fragile older wines can lose character; assess rather than
      impose a fixed long aeration.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_crystals
    subject_id: n_wset_srv_principle_decant
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_crystals
    domain_id: service
    assertion_text: Harmless tartrate crystals or normal red sediment do not by themselves show that wine is spoiled.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_fault_cork
    subject_id: n_wset_srv_principle_faults
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_fault_cork
    domain_id: service
    assertion_text: Cork-type taint may smell musty and suppress fruit; TCA can arise without contact with a cork.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_fault_oxidation
    subject_id: n_wset_srv_principle_faults
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_fault_oxidation
    domain_id: service
    assertion_text: Unwanted oxidation can dull fruit and introduce stale or sherry-like notes; oxidative styles
      must be judged in their intended context.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_fault_va
    subject_id: n_wset_srv_principle_faults
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_fault_va
    domain_id: service
    assertion_text: Strong vinegar or solvent-like notes can indicate excessive volatile acidity; concentration
      and the wine context affect judgement.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_fault_recheck
    subject_id: n_wset_srv_principle_faults
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_fault_recheck
    domain_id: service
    assertion_text: When wine seems faulty, swirl and smell it, then taste if needed; people differ in sensitivity
      to off aromas, so respond to the concern without insisting on a universal threshold.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_pairing_person
    subject_id: n_wset_srv_principle_pairing_preference
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_pairing_person
    domain_id: service
    assertion_text: Ask about preferred sweetness, body and flavours, the dish and budget before recommending;
      personal preference can outweigh a conventional pairing.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_pairing_perception
    subject_id: n_wset_srv_principle_pairing_preference
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_pairing_perception
    domain_id: service
    assertion_text: Food can change how the same wine tastes without changing the liquid’s composition; compare a
      sip before and after a bite.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_food_sweet_dry
    subject_id: n_wset_srv_principle_food_sweet
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_food_sweet_dry
    domain_id: service
    assertion_text: Sweet food can make wine seem less sweet and fruity and more bitter; this is a common
      perception effect, not a guarantee.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_food_sweet_choice
    subject_id: n_wset_srv_principle_food_sweet
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_food_sweet_choice
    domain_id: service
    assertion_text: For a sweet dish, a wine at least as sweet often preserves balance; check the actual dish,
      wine and person’s preference.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_food_acid_soft
    subject_id: n_wset_srv_principle_food_acid
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_food_acid_soft
    domain_id: service
    assertion_text: An acidic dish can make wine acidity seem softer; a low-acid wine may then seem flat.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_food_acid_choice
    subject_id: n_wset_srv_principle_food_acid
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_food_acid_choice
    domain_id: service
    assertion_text: Try a wine with enough acidity to retain freshness after the dish; taste both together rather
      than choose only by food colour.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_food_salt_soft
    subject_id: n_wset_srv_principle_food_salt
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_food_salt_soft
    domain_id: service
    assertion_text: Salt can reduce perceived acidity and bitterness and make fruit more evident; individual
      sensitivity varies.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_food_salt_not_rule
    subject_id: n_wset_srv_principle_food_salt
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_food_salt_not_rule
    domain_id: service
    assertion_text: Salt is only one component; sweetness, umami and the sauce may pull the pairing in different directions.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_food_umami_bitter
    subject_id: n_wset_srv_principle_food_umami
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_food_umami_bitter
    domain_id: service
    assertion_text: Umami-rich food can make wine seem more bitter and less fruity; tannic wines may be
      particularly challenging.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_food_umami_choice
    subject_id: n_wset_srv_principle_food_umami
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_food_umami_choice
    domain_id: service
    assertion_text: With pronounced umami, consider lower tannin and sufficient fruit intensity, then check
      acidity, salt and the actual pairing.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_food_fat_fresh
    subject_id: n_wset_srv_principle_food_fat
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_food_fat_fresh
    domain_id: service
    assertion_text: Wine acidity can give a refreshing contrast with a fatty dish; the fat can make tannin seem less harsh.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_food_fat_complete
    subject_id: n_wset_srv_principle_food_fat
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_food_fat_complete
    domain_id: service
    assertion_text: Assess the fatty dish’s sauce and seasoning too; fat alone cannot select one grape or appellation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_food_chilli_alcohol
    subject_id: n_wset_srv_principle_food_chilli
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_food_chilli_alcohol
    domain_id: service
    assertion_text: Alcohol can intensify the burning sensation with chilli; a lower-alcohol wine may suit someone
      seeking gentler heat.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_food_chilli_tannin
    subject_id: n_wset_srv_principle_food_chilli
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_food_chilli_tannin
    domain_id: service
    assertion_text: Strong tannin with hot spice can feel harsher; a softer-tannin option may be more comfortable.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_food_chilli_sweet
    subject_id: n_wset_srv_principle_food_chilli
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_food_chilli_sweet
    domain_id: service
    assertion_text: A little sweetness can soften perceived chilli heat; the diner’s tolerance and preferred
      sweetness still matter.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_food_intensity_match
    subject_id: n_wset_srv_principle_food_intensity
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_food_intensity_match
    domain_id: service
    assertion_text: A very intense dish can obscure a delicate wine; compare flavour intensity and texture,
      including the sauce.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_food_intensity_preference
    subject_id: n_wset_srv_principle_food_intensity
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_food_intensity_preference
    domain_id: service
    assertion_text: Matching aromas or contrasting weight can both work; use the intended experience and the
      diner’s preference to choose.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_alcohol_risk
    subject_id: n_wset_srv_principle_responsible
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_alcohol_risk
    domain_id: service
    assertion_text: Alcohol can cause dependence, disease and injury; even low intake carries risk, and greater
      consumption generally increases harm.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_alcohol_pregnancy
    subject_id: n_wset_srv_principle_responsible
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_alcohol_pregnancy
    domain_id: service
    assertion_text: Alcohol during pregnancy can harm fetal development; support an alcohol-free choice without
      pressuring the customer.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_alcohol_driving
    subject_id: n_wset_srv_principle_responsible
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_alcohol_driving
    domain_id: service
    assertion_text: Alcohol contributes to road injuries; arrange an alcohol-free option and discourage driving
      after drinking.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_alcohol_wine_not_health
    subject_id: n_wset_srv_principle_responsible_context
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_alcohol_wine_not_health
    domain_id: service
    assertion_text: Expensive or high-quality wine still contains ethanol; do not present wine as a treatment or a
      risk-free health choice.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_alcohol_individual
    subject_id: n_wset_srv_principle_responsible_context
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_srv_point_alcohol_individual
    domain_id: service
    assertion_text: Risk also depends on health, amount, drinking pattern and context; a server should not invent
      a personally safe limit.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_case_chilli_action
    subject_id: n_wset_srv_case_chilli
    relation_type: CASE_ACTION
    object_id: n_wset_srv_point_case_chilli_action
    domain_id: service
    assertion_text: Offer a small trial of the lower-alcohol, lightly sweet wine if its style fits the guest.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_case_chilli_reason
    subject_id: n_wset_srv_case_chilli
    relation_type: CASE_REASON
    object_id: n_wset_srv_point_case_chilli_reason
    domain_id: service
    assertion_text: Lower alcohol avoids amplifying heat while some sweetness can soften the burning sensation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_case_chilli_tradeoff
    subject_id: n_wset_srv_case_chilli
    relation_type: CASE_TRADEOFF
    object_id: n_wset_srv_point_case_chilli_tradeoff
    domain_id: service
    assertion_text: The sweeter option may reduce heat but conflict with a preference for dry wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_case_chilli_limitation
    subject_id: n_wset_srv_case_chilli
    relation_type: CASE_LIMITATION
    object_id: n_wset_srv_point_case_chilli_limitation
    domain_id: service
    assertion_text: Taste with the actual dish and ask the guest; heat tolerance and flavour balance vary.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_case_dessert_action
    subject_id: n_wset_srv_case_dessert
    relation_type: CASE_ACTION
    object_id: n_wset_srv_point_case_dessert_action
    domain_id: service
    assertion_text: Trial the sweet, fresh sample alongside the pudding and ask which balance is preferred.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_case_dessert_reason
    subject_id: n_wset_srv_case_dessert
    relation_type: CASE_REASON
    object_id: n_wset_srv_point_case_dessert_reason
    domain_id: service
    assertion_text: The pudding may make the dry wine seem drier and less fruity; sufficient wine sweetness can
      retain balance.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_case_dessert_tradeoff
    subject_id: n_wset_srv_case_dessert
    relation_type: CASE_TRADEOFF
    object_id: n_wset_srv_point_case_dessert_tradeoff
    domain_id: service
    assertion_text: Extra wine sweetness can fit dessert while still needing enough acidity for freshness.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_case_dessert_limitation
    subject_id: n_wset_srv_case_dessert
    relation_type: CASE_LIMITATION
    object_id: n_wset_srv_point_case_dessert_limitation
    domain_id: service
    assertion_text: The pudding’s actual sweetness, acidity and flavour intensity and the guest’s taste determine the result.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_case_older_red_action
    subject_id: n_wset_srv_case_older_red
    relation_type: CASE_ACTION
    object_id: n_wset_srv_point_case_older_red_action
    domain_id: service
    assertion_text: If separating the deposit, decant gently just before serving and stop when sediment approaches the neck.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_case_older_red_reason
    subject_id: n_wset_srv_case_older_red
    relation_type: CASE_REASON
    object_id: n_wset_srv_point_case_older_red_reason
    domain_id: service
    assertion_text: The purpose is separating sediment rather than imposing prolonged aeration on fragile fruit.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_case_older_red_tradeoff
    subject_id: n_wset_srv_case_older_red
    relation_type: CASE_TRADEOFF
    object_id: n_wset_srv_point_case_older_red_tradeoff
    domain_id: service
    assertion_text: Decanting improves clarity but increases handling and oxygen contact; keep both controlled.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_srv_case_older_red_limitation
    subject_id: n_wset_srv_case_older_red
    relation_type: CASE_LIMITATION
    object_id: n_wset_srv_point_case_older_red_limitation
    domain_id: service
    assertion_text: Age does not prove a benefit from aeration; monitor the actual wine and serve promptly.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
