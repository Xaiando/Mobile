knowledge_items:
  - id: ki_wset_nw_california_variation
    subject_id: n_wset_nw_principle_california_variation
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_california_variation
    domain_id: viticulture
    assertion_text: "California includes warm inland and marine-cooled vineyards. Sonoma illustrates this range:
      Cabernet ripens in warmer areas, while Pinot Noir and Chardonnay suit cooler ones. A state label alone
      cannot fix body or ripeness."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_napa_cabernet
    subject_id: n_wset_nw_principle_napa_cabernet
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_napa_cabernet
    domain_id: winemaking
    assertion_text: Napa Cabernet Sauvignon can show black cherry, plum and currant with dense youthful structure.
      Oak ageing can add spice; expression varies by site.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_napa_merlot
    subject_id: n_wset_nw_principle_napa_merlot
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_napa_merlot
    domain_id: winemaking
    assertion_text: Napa Merlot may be bottled alone or blended with Cabernet, contributing softer fruit and body.
      Ripe cherry and plum, texture and weight vary by site and cellar choices.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_napa_chardonnay
    subject_id: n_wset_nw_principle_napa_chardonnay
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_napa_chardonnay
    domain_id: winemaking
    assertion_text: Napa Chardonnay ranges from crisp to rich. Barrel fermentation, lees stirring and malolactic
      conversion can change texture and aromas; cooler Los Carneros supports slower ripening.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_napa_sauvignon
    subject_id: n_wset_nw_principle_napa_sauvignon
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_napa_sauvignon
    domain_id: geography
    assertion_text: Napa Sauvignon Blanc often uses neutral vessels to preserve herbal and fruit character with
      lively acidity. Some oak-fermented or aged examples have more texture and may be labelled Fumé Blanc.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_oakville_setting
    subject_id: n_wset_nw_principle_oakville_setting
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_oakville_setting
    domain_id: viticulture
    assertion_text: Oakville is moderately warm, with morning fog and cooling from San Pablo Bay. Cabernet
      Sauvignon and Merlot are important grapes; vineyard position still matters.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_rutherford_setting
    subject_id: n_wset_nw_principle_rutherford_setting
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_rutherford_setting
    domain_id: viticulture
    assertion_text: Rutherford has a moderately warm growing setting, with less fog than Oakville. Cabernet
      Sauvignon and Merlot are important; the regional name does not prescribe a wine flavour.
    verification_status: unverified
    mcq_disabled: true
