    assertion_text: Riverland Shiraz can show plum and dark berries; Cabernet and Merlot fruit expression changes
      with season. Chardonnay may be ripe and oak influenced, with actual cellar choices determining the
      result.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_riverina_sweet_exception
    subject_id: n_wset_nw_principle_riverina_sweet_exception
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_riverina_sweet_exception
    domain_id: winemaking
    assertion_text: Riverina’s hot summer suits ripe dry wines. Later-season humidity can favour noble rot in
      selected Semillon, concentrating fruit for sweet wine; this requires suitable fruit and conditions.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_riverina_dry_styles
    subject_id: n_wset_nw_principle_riverina_dry_styles
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_riverina_dry_styles
    domain_id: viticulture
    assertion_text: Riverina Chardonnay can be generously flavoured, with oak contributing to some examples.
      Shiraz is another important grape; selected sweet Semillon does not define all wines from the region.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_south_eastern_range
    subject_id: n_wset_nw_principle_south_eastern_range
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_south_eastern_range
    domain_id: geography
    assertion_text: South Eastern Australia is a broad GI containing many growing settings. Fruit-led Shiraz and
      Chardonnay are useful examples; the name alone cannot establish one climate, maturity level, quality or
      cellar method.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_inland_water_costs
    subject_id: n_wset_nw_principle_inland_water_costs
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_inland_water_costs
    domain_id: winemaking
    assertion_text: Irrigation benchmarking in Riverland, Riverina and Sunraysia links water costs, yield,
      varieties and management. Compare actual costs and fruit objectives; high output or water efficiency
      alone does not ensure profit.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_barossa_gsm
    subject_id: n_wset_nw_principle_barossa_gsm
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_barossa_gsm
    domain_id: winemaking
    assertion_text: Barossa’s Grenache may be varietal or blended with Shiraz and Mataro. Blending changes the
      fruit, body and structure balance; Shiraz’s reputation does not make every Barossa red pure Shiraz.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_barossa_semillon_range
    subject_id: n_wset_nw_principle_barossa_semillon_range
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_barossa_semillon_range
    domain_id: winemaking
    assertion_text: Barossa Valley Semillon has traditionally included rich, ripe, oak-influenced styles. Earlier
      picking and avoiding oak can produce lighter, crisper wines; both styles belong in the comparison.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_clare_riesling_style
    subject_id: n_wset_nw_principle_clare_riesling_style
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_clare_riesling_style
    domain_id: viticulture
    assertion_text: Clare Valley Riesling is commonly dry, with citrus and floral expression and firm acidity. Age
      can add toast and developed complexity; producer, site and storage affect the result.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_eden_riesling_setting
    subject_id: n_wset_nw_principle_eden_riesling_setting
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_eden_riesling_setting
    domain_id: viticulture
    assertion_text: Eden Valley’s elevated, varied terrain creates cooler growing conditions than many Barossa
      Valley sites. Riesling is important; aspect and local conditions still affect ripening.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_margaret_merlot_blend
    subject_id: n_wset_nw_principle_margaret_merlot_blend
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_margaret_merlot_blend
    domain_id: winemaking
    assertion_text: Margaret River Cabernet is often blended with Merlot. Medium-to-full body and cassis-like
      fruit are regional references; blend proportion, harvest and production affect texture and style.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_margaret_white_range
    subject_id: n_wset_nw_principle_margaret_white_range
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_margaret_white_range
    domain_id: winemaking
    assertion_text: Margaret River Chardonnay can combine intense fruit with lime-like acidity. Sauvignon
      Blanc–Semillon blends range with ripeness, proportions and oak treatment; freshness and texture depend
      on those choices.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_yarra_wine_range
    subject_id: n_wset_nw_principle_yarra_wine_range
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_yarra_wine_range
    domain_id: winemaking
    assertion_text: Yarra Valley Pinot Noir often ranges from light to medium bodied with plum, strawberry or
      cherry. Chardonnay can show peach, melon or fig; cellar choices create further variation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_adelaide_chardonnay
    subject_id: n_wset_nw_principle_adelaide_chardonnay
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_adelaide_chardonnay
    domain_id: viticulture
    assertion_text: Adelaide Hills Chardonnay commonly shows citrus, freshness and structured fruit. Cooler sites
      are useful contrasts with warm inland examples; oak and malolactic conversion still depend on the
      producer.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_hunter_shiraz_style
    subject_id: n_wset_nw_principle_hunter_shiraz_style
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_hunter_shiraz_style
    domain_id: viticulture
    assertion_text: Young Hunter Shiraz is often medium bodied, with red and dark berries, spice and supple
      tannin. Bottle age can bring earthy or leathery notes and smoother texture.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_mclaren_environment
    subject_id: n_wset_nw_principle_mclaren_environment
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_mclaren_environment
    domain_id: viticulture
    assertion_text: McLaren Vale has a warm Mediterranean setting moderated by nearby water and local elevation.
      Grenache, Shiraz and Cabernet are important; parcel and harvest choices explain variation within those
      associations.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_geelong_range
    subject_id: n_wset_nw_principle_geelong_range
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_geelong_range
    domain_id: viticulture
    assertion_text: Geelong’s water influence and long ripening season support Pinot Noir and Chardonnay. Northern
      sites are more continental; Pinot can show plum or strawberry while Chardonnay weight varies by locality
      and producer.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_heathcote_shiraz
    subject_id: n_wset_nw_principle_heathcote_shiraz
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_heathcote_shiraz
    domain_id: viticulture
    assertion_text: Heathcote is known for rich, dark-fruited Shiraz with ripe tannin. Cooling southeasterly
      airflow around the Mount Camel range moderates the warm setting; soil colour does not prove a specific
      flavour.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_goulburn_heat_water
    subject_id: n_wset_nw_principle_goulburn_heat_water
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_goulburn_heat_water
    domain_id: winemaking
    assertion_text: Goulburn Valley’s inland warmth is moderated locally by rivers and lakes, with irrigation
      important. Shiraz and Chardonnay can show ripe fruit; oak use and bottle age alter the finished style.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_great_southern_sites
    subject_id: n_wset_nw_principle_great_southern_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_great_southern_sites
    domain_id: viticulture
    assertion_text: Great Southern’s coastal Denmark and Albany differ from more inland settings including Mount
      Barker, Porongurup and Frankland River. Riesling, Cabernet, Shiraz and Chardonnay suit different sites;
      coastal Pinot is another reference.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_great_southern_styles
    subject_id: n_wset_nw_principle_great_southern_styles
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_great_southern_styles
    domain_id: viticulture
    assertion_text: Great Southern Riesling can be lean and citrus led. Cabernet may be structured and dark
      fruited; Shiraz can show pepper and spice. Origin alone does not fix body, oak or ageing potential.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_australia_gi_levels
    subject_id: n_wset_nw_principle_australia_gi_levels
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_australia_gi_levels
    domain_id: geography
    assertion_text: Australia registers zones, regions and subregions. Barossa is a zone containing Barossa Valley
      and Eden Valley regions. Hunter Valley is a zone and Hunter is a region; the names are not
      interchangeable.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_marlborough_sauvignon_style
    subject_id: n_wset_nw_principle_marlborough_sauvignon_style
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_marlborough_sauvignon_style
    domain_id: viticulture
    assertion_text: Marlborough Sauvignon Blanc commonly combines vivid herbal and tropical fruit aromas with
      fresh acidity. Subregion, harvest and cellar choices change intensity and texture; one aroma cannot
      prove origin.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_marlborough_chardonnay_range
    subject_id: n_wset_nw_principle_marlborough_chardonnay_range
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_marlborough_chardonnay_range
    domain_id: winemaking
    assertion_text: Marlborough Chardonnay can show citrus and stone fruit with structured freshness. It is made
      in oaked and unoaked styles; assess the bottle rather than assign butter or vanilla from the region.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_marlborough_pinot_style
    subject_id: n_wset_nw_principle_marlborough_pinot_style
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_marlborough_pinot_style
    domain_id: viticulture
    assertion_text: Marlborough Pinot Noir commonly has cherry and plum, with spice and a fine tannin frame.
      Midweight examples are useful references, but site and extraction affect the finished wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_marlborough_aromatics
    subject_id: n_wset_nw_principle_marlborough_aromatics
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_marlborough_aromatics
    domain_id: viticulture
    assertion_text: Marlborough Pinot Gris and Riesling include dry through sweet expressions, with leaner or
      richer textures. Grape and producer information are needed to determine sweetness and body.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_hawkes_cab_merlot
    subject_id: n_wset_nw_principle_hawkes_cab_merlot
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_hawkes_cab_merlot
    domain_id: winemaking
    assertion_text: Hawke’s Bay Merlot can contribute fleshy fruit, while Cabernet brings dark fruit and structure
      to blends. Careful site choice and suitable seasons matter for these later-ripening reds.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_hawkes_chardonnay
    subject_id: n_wset_nw_principle_hawkes_chardonnay
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_hawkes_chardonnay
    domain_id: viticulture
    assertion_text: Hawke’s Bay Chardonnay can be rich and full bodied, with acidity balancing the weight. Site
      and cellar choices change the style; full body does not automatically indicate oak.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_hawkes_syrah_pinot_gris
    subject_id: n_wset_nw_principle_hawkes_syrah_pinot_gris
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_hawkes_syrah_pinot_gris
    domain_id: viticulture
    assertion_text: Hawke’s Bay Syrah can be perfumed and spicy with supple tannin. Pinot Gris can show ripe
      aromatic fruit and spice with greater weight; these are regional references, not fixed recipes.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_martinborough_pinot_style
    subject_id: n_wset_nw_principle_martinborough_pinot_style
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_martinborough_pinot_style
    domain_id: viticulture
    assertion_text: Martinborough Pinot Noir can show fragrant fruit with fuller texture and structure. Its cool,
      dry setting does not guarantee light tannin; producer and vintage still matter.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_otago_pinot_style
    subject_id: n_wset_nw_principle_otago_pinot_style
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_otago_pinot_style
    domain_id: viticulture
    assertion_text: Central Otago Pinot can combine ripe fruit with taut structure. Hot days, cool nights and
      varied subregions create contrasting expressions; cooler Gibbston and warmer Bannockburn are
      comparisons, not rigid style rules.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_otago_aromatics
    subject_id: n_wset_nw_principle_otago_aromatics
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_otago_aromatics
    domain_id: viticulture
    assertion_text: Central Otago Riesling and Pinot Gris include dry through sweet aromatic wines. Ripeness and
      residual sugar vary; the continental region name alone cannot determine the sweetness.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_nelson_wine_styles
    subject_id: n_wset_nw_principle_nelson_wine_styles
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_nelson_wine_styles
    domain_id: viticulture
    assertion_text: Nelson Pinot Noir can be perfumed with fine ripe tannin; Moutere and Waimea differ in weight.
      Sauvignon Blanc may combine crisp fruit with texture, while Chardonnay and Pinot Gris add further
      white-wine variety.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_gisborne_wine_styles
    subject_id: n_wset_nw_principle_gisborne_wine_styles
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_gisborne_wine_styles
    domain_id: viticulture
    assertion_text: Sunny Gisborne is an important Chardonnay setting, producing fruity aromatic through more
      intense examples. Pinot Gris can be rich and spicy; Merlot requires suitable sites and seasons.
      Individual sweetness and oak still need evidence.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_canterbury_style_range
    subject_id: n_wset_nw_principle_canterbury_style_range
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_canterbury_style_range
    domain_id: viticulture
    assertion_text: Canterbury Pinot Noir ranges from lighter fragrant wines to darker, fuller expressions.
      Chardonnay, Pinot Gris and Sauvignon Blanc offer fresh white references; Waipara and cooler plains
      differ in exposure and shelter.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_nw_california_zinfandel_range
    subject_id: n_wset_nw_principle_california_zinfandel_range
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nw_point_california_zinfandel_range
    domain_id: winemaking
    assertion_text: California Zinfandel includes ripe, spicy dry reds and sweeter White Zinfandel rosé. Lighter
      red examples also occur; harvest and production determine weight, colour and sweetness.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
