    assertion_text: Recioto della Valpolicella is a sweet red dried-grape wine in the Corvina-associated Valpolicella family. The current blend rules allow Corvina and/or Corvinone with Rondinella and limited other varieties, so the name does not mean pure Corvina or establish the exact proportion in a bottle. Drying concentrates the grapes and the finished wine retains grape sugar; this sweet result contrasts with dry Amarone and fresh young Valpolicella.
