    {
      "id": "n_d3pt_case_tejo_white",
      "node_type": "production_case",
      "name": "An invented producer has sound same-vintage Fernão Pires from a Campo parcel with a supplied high-vigour log, and Arinto from a sandy Charneca parcel with a supplied dry-season water log. The buyer brief is a fresh, aromatic dry white for launch in seven weeks. Trial A is 60:40 Fernão Pires:Arinto, earlier Fernão Pires harvest and steel; trial B is 80:20, later Fernão Pires harvest and a wood vessel. A preliminary coded panel finds A closer to the brief; estimated readiness is week five for A and week ten for B. Those are supplied observations, not effects assigned to one variable. A distributor requests 1,800 bottles with payment 45 days after shipment; a bottling bill is due in 21 days. Another buyer offers a 300-bottle prepaid pilot with producer delivery and follow-up. Cash on hand, full costs, selling prices, repeat panel/stability results, staff capacity and protected-origin approval are missing. All parcels, proportions, findings, volumes, timings and offers are fictional and are not law, standard Tejo trade terms or market data. Recommend a conditional action, explain its evidence, weigh the production and commercial tradeoff, and identify what must still be checked."
    },
    {
      "id": "n_d3pt_case_tejo_white_action",
      "node_type": "learning_point",
      "name": "Repeat the brief-aligned pilot, check release and origin evidence, and make a workable conditional stock and cash plan"
    },
    {
      "id": "n_d3pt_case_tejo_white_reason",
      "node_type": "learning_point",
      "name": "The supplied fit and date support A for this brief; changed harvest, blend and vessel prevent a single-cause conclusion"
    },
    {
      "id": "n_d3pt_case_tejo_white_tradeoff",
      "node_type": "learning_point",
      "name": "The prepaid trial needs estate work; the larger request needs verified partner capacity, and later receipts do not fund the earlier bill"
    },
    {
      "id": "n_d3pt_case_tejo_white_limitation",
      "node_type": "learning_point",
      "name": "Origin approval, stability, repeated sensory results, full costs, real receipts, partner performance and service capacity remain unconfirmed"
    },
    {
      "id": "n_d3pt_case_setubal_still_red",
      "node_type": "production_case",
      "name": "An invented producer has sound same-vintage Castelão lots with different parcel ripeness records. Its brief is a dry red with fresh fruit and moderate tannin for a restaurant launch in nine weeks. Pilot C combines one lot, shorter skin contact and an older wood vessel; pilot D combines another lot, longer contact and new wood. A preliminary coded panel finds C closer to the brief; C is estimated ready in week six and D in week twelve. The lots, contact and vessel differ, so this is not a controlled single-variable extraction trial. A partner offers a 1,200-bottle placement, payment after 60 days and delivery work, but supplies no credit references or account-sales evidence. A direct restaurant trial is 240 bottles paid before delivery with winery tastings and follow-up. The supplier bill falls due after 28 days; liquidity, complete prices/costs and staff availability are unknown. Draft labels alternately claim Palmela DOP, Península de Setúbal IGP and Setúbal DOP, without category/provenance/certification records. All production and business inputs are fictional; no actual Palmela composition or other legal numerical minimum is supplied. Recommend a conditional action, explain its evidence, weigh the production and commercial tradeoff, and identify what must still be checked."
    },
    {
      "id": "n_d3pt_case_setubal_still_red_action",
      "node_type": "learning_point",
      "name": "Pilot the brief-aligned red conditionally, verify the origin category and compare feasible buyer and cash plans before assigning stock"
    },
    {
      "id": "n_d3pt_case_setubal_still_red_reason",
      "node_type": "learning_point",
      "name": "The supplied C fits the deadline; the regional name and confounded cellar trial do not establish a dry-red Setúbal DOP or single cause"
    },
    {
      "id": "n_d3pt_case_setubal_still_red_tradeoff",
      "node_type": "learning_point",
      "name": "Partner delivery may reduce estate work but delays receipts and concentrates exposure; a prepaid trial needs estate labour and leaves stock"
    },
    {
      "id": "n_d3pt_case_setubal_still_red_limitation",
      "node_type": "learning_point",
      "name": "Current category eligibility, repeated wine evidence, full costs and cash, buyer sell-through and staff capacity remain missing"
    }
  ],
