  "knowledge_items": [
    {
      "id": "ki_d3pt_tejo_site_context",
      "subject_id": "n_d3pt_principle_tejo_site_context",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d3pt_point_tejo_site_context",
      "domain_id": "geography",
      "assertion_text": "Tejo comparisons need the parcel soil, river exposure and management context. Campo has fertile alluvial floodplain settings, Bairro clay-limestone, Charneca sandy soils and Serras higher schistose terrain. These commission terroirs contextualise decisions without guaranteeing wine style or establishing a protected-origin claim.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-01T02:34:06.539Z"
    },
    {
      "id": "ki_d3pt_tejo_white_blend",
      "subject_id": "n_d3pt_principle_tejo_white_blend",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d3pt_point_tejo_white_blend",
      "domain_id": "geography",
      "assertion_text": "Fernão Pires can contribute aromatic expression and Arinto acidity to a Tejo white blend. Compare parcel and harvest records with matched blend trials for the actual brief; changes in lot, harvest, proportions and vessel together cannot isolate one cause. The regional roles do not establish a compulsory recipe, fixed result or price.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-01T02:34:06.539Z"
    },
    {
      "id": "ki_d3pt_tejo_label_scope",
      "subject_id": "n_d3pt_principle_tejo_label_scope",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d3pt_point_tejo_label_scope",
      "domain_id": "geography",
      "assertion_text": "IG Tejo and DO DoTejo identify different protected-origin categories. Commission terroir names and a winery address do not establish a lot eligibility; proposed origin claims need category-specific provenance and certification evidence.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-01T02:34:06.539Z"
    },
    {
      "id": "ki_d3pt_setubal_site_context",
      "subject_id": "n_d3pt_principle_setubal_site_context",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d3pt_point_setubal_site_context",
      "domain_id": "geography",
      "assertion_text": "Península de Setúbal includes plains and mountain settings with heterogeneous soils and influences from the Atlantic, Tejo, Sado and Arrábida relief. Regional context cannot replace the parcel ripening, water and soil evidence needed for a production decision.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-01T02:34:06.539Z"
    },
    {
      "id": "ki_d3pt_setubal_castelao_red",
      "subject_id": "n_d3pt_principle_setubal_castelao_red",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d3pt_point_setubal_castelao_red",
      "domain_id": "geography",
      "assertion_text": "Castelão is an important Península de Setúbal red grape and is listed for the IGP. Judge a supplied still-red lot by its fruit and sensory evidence; cultivar or regional origin alone cannot determine extraction, oak, drinking window or price.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-01T02:34:06.539Z"
    },
    {
      "id": "ki_d3pt_setubal_product_boundary",
      "subject_id": "n_d3pt_principle_setubal_product_boundary",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d3pt_point_setubal_product_boundary",
      "domain_id": "geography",
      "assertion_text": "IGP Península de Setúbal accommodates several product categories; Palmela and Setúbal are distinct DOPs, with Setúbal DOP devoted to licoroso wines. A dry regional Castelão red does not gain Setúbal DOP status from its place name, and another origin claim still requires its own evidence.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-01T02:34:06.539Z"
    },
    {
      "id": "ki_d3pt_case_tejo_white_action",
      "subject_id": "n_d3pt_case_tejo_white",
      "relation_type": "CASE_ACTION",
      "object_id": "n_d3pt_case_tejo_white_action",
      "domain_id": "winemaking",
      "assertion_text": "Progress A only as a conditional pilot for the seven-week brief, repeat the coded comparison and check release readiness, origin approval and an executable sales/cash plan before committing the remaining stock.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-01T02:34:06.539Z"
    },
    {
      "id": "ki_d3pt_case_tejo_white_reason",
      "subject_id": "n_d3pt_case_tejo_white",
      "relation_type": "CASE_REASON",
      "object_id": "n_d3pt_case_tejo_white_reason",
      "domain_id": "winemaking",
      "assertion_text": "The supplied A result and week-five estimate align better with this brief; Fernão Pires expression, Arinto acidity and site/harvest evidence matter, but changing proportion, harvest and vessel together does not identify a single cause.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-01T02:34:06.539Z"
    },
    {
      "id": "ki_d3pt_case_tejo_white_tradeoff",
      "subject_id": "n_d3pt_case_tejo_white",
      "relation_type": "CASE_TRADEOFF",
      "object_id": "n_d3pt_case_tejo_white_tradeoff",
      "domain_id": "winemaking",
      "assertion_text": "A prepaid small trial could bring earlier receipts but needs winery fulfilment work and leaves stock; the larger later-paying request depends on verified partner selling and fulfilment capability and agreed responsibilities. That request does not itself establish capacity or fund a bill due earlier. Neither route establishes net profit without complete inputs.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-01T02:34:06.539Z"
    },
    {
      "id": "ki_d3pt_case_tejo_white_limitation",
      "subject_id": "n_d3pt_case_tejo_white",
      "relation_type": "CASE_LIMITATION",
      "object_id": "n_d3pt_case_tejo_white_limitation",
      "domain_id": "winemaking",
      "assertion_text": "Obtain repeated sensory/stability evidence, lot and origin records, actual cash/costs, buyer credit and account-sales evidence and staff availability. The preliminary panel and planned receipts do not demonstrate enduring demand, legal approval or solvency.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-01T02:34:06.539Z"
    },
    {
      "id": "ki_d3pt_case_setubal_still_red_action",
      "subject_id": "n_d3pt_case_setubal_still_red",
      "relation_type": "CASE_ACTION",
      "object_id": "n_d3pt_case_setubal_still_red_action",
      "domain_id": "business",
      "assertion_text": "Pilot C conditionally for the brief and deadline, verify sensory/stability and the category-specific origin claim, then compare evidenced partner terms with an operationally feasible prepaid trial before assigning remaining stock.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-01T02:34:06.539Z"
    },
    {
      "id": "ki_d3pt_case_setubal_still_red_reason",
      "subject_id": "n_d3pt_case_setubal_still_red",
      "relation_type": "CASE_REASON",
      "object_id": "n_d3pt_case_setubal_still_red_reason",
      "domain_id": "business",
      "assertion_text": "C fits the supplied sensory brief and schedule, while D is later and less suitable on the supplied evidence. The dry red cannot obtain Setúbal DOP merely by regional origin, and changing lot, contact and vessel prevents a single-cause explanation.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-01T02:34:06.539Z"
    },
    {
      "id": "ki_d3pt_case_setubal_still_red_tradeoff",
      "subject_id": "n_d3pt_case_setubal_still_red",
      "relation_type": "CASE_TRADEOFF",
      "object_id": "n_d3pt_case_setubal_still_red_tradeoff",
      "domain_id": "business",
      "assertion_text": "A partner can reduce estate delivery work and offer larger placement, while later payment ties up stock/cash and concentrates exposure; the small prepaid route needs producer labour and leaves stock. Supplied dates show a timing issue, not a measured cash deficit or net-profit winner.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-01T02:34:06.539Z"
    },
    {
      "id": "ki_d3pt_case_setubal_still_red_limitation",
      "subject_id": "n_d3pt_case_setubal_still_red",
      "relation_type": "CASE_LIMITATION",
      "object_id": "n_d3pt_case_setubal_still_red_limitation",
      "domain_id": "business",
      "assertion_text": "Check current Palmela or IGP requirements and lot eligibility, repeated sensory/stability evidence, the actual price/cost/cash plan, buyer references and sell-through, and staff capacity. Variety, origin name, longer extraction or new wood cannot substitute for those checks.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-01T02:34:06.539Z"
    }
  ],
