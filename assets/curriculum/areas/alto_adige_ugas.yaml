knowledge_items:
  - id: ki_alto_adige_uga_buchholz_location
    subject_id: n_geo_alto_adige_uga_buchholz
    relation_type: LOCATED_IN
    object_id: n_geo_alto_adige
    domain_id: geography
    assertion_text: "Buchholz is an additional geographical unit that may follow Alto Adige, or Südtirol, on a label. The decree places it in Salorno. The marker is the Pochi settlement, whose GeoNames alternate name is Buchholz. It is not the Salurn-Pfatten unit, and it is not a boundary."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:55:00.000Z"
  - id: ki_alto_adige_uga_girlan_location
    subject_id: n_geo_alto_adige_uga_girlan
    relation_type: LOCATED_IN
    object_id: n_geo_alto_adige
    domain_id: geography
    assertion_text: "Girlan is an additional geographical unit that may follow Alto Adige, or Südtirol, on a label. The decree places it in Appiano. The marker is the Cornaiano settlement, whose GeoNames alternate name is Girlan. It is not the Girlan-Gschleier unit, and it is not a boundary."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:55:00.000Z"
  - id: ki_alto_adige_uga_gries_location
    subject_id: n_geo_alto_adige_uga_gries
    relation_type: LOCATED_IN
    object_id: n_geo_alto_adige
    domain_id: geography
    assertion_text: "Gries is an additional geographical unit that may follow Alto Adige, or Südtirol, on a label. The decree places it in Bolzano. The marker is the Gries settlement in Bolzano. It is not the Gries-Moritzing unit, and it is not a boundary."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:55:00.000Z"
  - id: ki_alto_adige_uga_penon_location
    subject_id: n_geo_alto_adige_uga_penon
    relation_type: LOCATED_IN
    object_id: n_geo_alto_adige
    domain_id: geography
    assertion_text: "Penon is an additional geographical unit that may follow Alto Adige, or Südtirol, on a label. The decree places it in Cortaccia. The marker is the Penone settlement, whose GeoNames alternate name is Penon. It is not Penon-Kofl or Penon-Hofstatt, and it is not a boundary."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:55:00.000Z"
  - id: ki_alto_adige_uga_rain_location
    subject_id: n_geo_alto_adige_uga_rain
    relation_type: LOCATED_IN
    object_id: n_geo_alto_adige
    domain_id: geography
    assertion_text: "Rain is an additional geographical unit that may follow Alto Adige, or Südtirol, on a label. The decree places it in Cortaccia. The marker is the Rain settlement in Cortaccia. It is not Goldrain in Laces, and it is not a boundary."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:55:00.000Z"

