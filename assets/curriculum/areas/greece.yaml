    relation_type: LOCATED_IN
    object_id: n_geo_greece
    domain_id: geography
    assertion_text: "The Peloponnese is a wine-growing region of southern Greece."
    last_verified_at: "2026-09-26T08:00:00.000Z"
  - id: ki_macedonia_location
    subject_id: n_geo_macedonia
    relation_type: LOCATED_IN
    object_id: n_geo_greece
    domain_id: geography
    assertion_text: "The Greek wine-growing region of Macedonia lies in northern Greece."
    last_verified_at: "2026-09-26T08:00:00.000Z"
  - id: ki_cyclades_location
    subject_id: n_geo_cyclades
    relation_type: LOCATED_IN
    object_id: n_geo_greece
    domain_id: geography
    assertion_text: "The Cyclades are a Greek island group in the Aegean Sea."
    last_verified_at: "2026-09-26T08:00:00.000Z"
  - id: ki_nemea_location
    subject_id: n_geo_nemea
    relation_type: LOCATED_IN
    object_id: n_geo_peloponnese
    domain_id: geography
    assertion_text: "Nemea PDO lies in the Peloponnese, with its delimited vineyards in Corinthia and Argolis."
    last_verified_at: "2026-09-26T08:00:00.000Z"
  - id: ki_naoussa_location
    subject_id: n_geo_naoussa
    relation_type: LOCATED_IN
    object_id: n_geo_macedonia
    domain_id: geography
    assertion_text: "Naoussa PDO lies in the Greek region of Macedonia, in Imathia."
    last_verified_at: "2026-09-26T08:00:00.000Z"
  - id: ki_santorini_location
    subject_id: n_geo_santorini
    relation_type: LOCATED_IN
    object_id: n_geo_cyclades
    domain_id: geography
    assertion_text: "Santorini PDO is in the Cyclades; its delimited area comprises the islands of Thira and Thirasia."
    last_verified_at: "2026-09-26T08:00:00.000Z"
  - id: ki_halkidiki_location
    subject_id: n_geo_halkidiki
    relation_type: LOCATED_IN
    object_id: n_geo_macedonia
    domain_id: geography
    assertion_text: "Halkidiki, including its Sithonia peninsula, lies in the Greek wine region of Macedonia."
    verification_status: unverified
    last_verified_at: "2026-09-28T08:00:00.000Z"
  - id: ki_sithonia_location
    subject_id: n_geo_sithonia
    relation_type: LOCATED_IN
    object_id: n_geo_halkidiki
    domain_id: geography
    assertion_text: "Sithonia is a peninsula of Halkidiki and contains the slopes of Mount Meliton."
    verification_status: unverified
    last_verified_at: "2026-09-28T08:00:00.000Z"
  - id: ki_slopes_of_meliton_location
    subject_id: n_geo_slopes_of_meliton
    relation_type: LOCATED_IN
    object_id: n_geo_sithonia
    domain_id: geography
    assertion_text: "Slopes of Meliton PDO is around Neos Marmaras on Sithonia in Halkidiki."
    verification_status: unverified
    last_verified_at: "2026-09-28T08:00:00.000Z"
  - id: ki_achaea_location
    subject_id: n_geo_achaea
    relation_type: LOCATED_IN
    object_id: n_geo_peloponnese
    domain_id: geography
    assertion_text: "Achaea is a wine-growing area in the northern Peloponnese."
    verification_status: unverified
    last_verified_at: "2026-09-28T08:00:00.000Z"
  - id: ki_patra_location
    subject_id: n_geo_patra
    relation_type: LOCATED_IN
    object_id: n_geo_achaea
    domain_id: geography
    assertion_text: "Patra PDO covers specified communities in Achaea, including places around Patras, Aigio and Akrata."
    verification_status: unverified
    last_verified_at: "2026-09-28T08:00:00.000Z"
  - id: ki_slopes_of_meliton_assyrtiko
    subject_id: n_geo_slopes_of_meliton
    relation_type: PERMITS_GRAPE
    object_id: n_grape_assyrtiko
    domain_id: geography
    assertion_text: "The Slopes of Meliton PDO technical file lists Assyrtiko among its wine grapes; the PDO describes dry white and dry red wines."
    verification_status: unverified
    last_verified_at: "2026-09-28T08:00:00.000Z"
  - id: ki_patra_roditis
    subject_id: n_geo_patra
    relation_type: PERMITS_GRAPE
    object_id: n_grape_roditis
    domain_id: geography
    assertion_text: "The Patra PDO technical file lists Roditis for white wines, which may be dry, medium-dry or medium-sweet."
    # Wines of Greece describes Roditis as pink-skinned:
    # https://winesofgreece.org/varieties/roditis/
    # The catalog lacks three safe same-colour MCQ distractors.
    # Map, typed and flashcard practice remain available.
    mcq_disabled: true
    verification_status: unverified
    last_verified_at: "2026-09-28T08:00:00.000Z"
  - id: ki_nemea_grape
    subject_id: n_geo_nemea
    relation_type: PERMITS_GRAPE
    object_id: n_grape_agiorgitiko
    domain_id: geography
    assertion_text: "The grape variety specified for Nemea PDO is Agiorgitiko."
    last_verified_at: "2026-09-26T08:00:00.000Z"
  - id: ki_naoussa_grape
    subject_id: n_geo_naoussa
    relation_type: PERMITS_GRAPE
    object_id: n_grape_xinomavro
    domain_id: geography
    assertion_text: "The grape variety specified for Naoussa PDO is Xinomavro."
    last_verified_at: "2026-09-26T08:00:00.000Z"
  - id: ki_santorini_grape
    subject_id: n_geo_santorini
    relation_type: PERMITS_GRAPE
    object_id: n_grape_assyrtiko
    domain_id: geography
    assertion_text: "Assyrtiko is the main grape of Santorini PDO: dry white wines contain at least 85 % Assyrtiko, with the remainder from Aidani and Athiri."
    last_verified_at: "2026-09-26T08:00:00.000Z"

