knowledge_items:
  - id: ki_wset_nwa_mendocino_chardonnay
    subject_id: n_wset_nwa_principle_mendocino_chardonnay
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_mendocino_chardonnay
    domain_id: winemaking
    assertion_text: Given a sound Mendocino Chardonnay lot, compare a neutral-vessel fruit-led trial with a
      trial using lees and suitable oak. Lees can change mouthfeel; oak may add toast or vanilla. Evaluate
      actual acidity and fruit rather than prescribing one route to the whole county.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_monterey_chardonnay
    subject_id: n_wset_nwa_principle_monterey_chardonnay
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_monterey_chardonnay
    domain_id: winemaking
    assertion_text: For a supplied Monterey Chardonnay lot with brisk acidity, a cool neutral-vessel
      fermentation can support a fresh fruit-led target. Malolactic fermentation can reduce malic acidity
      and may add buttery character; it is an option to trial, not a consequence of the Monterey name.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_santa_cruz_pinot
    subject_id: n_wset_nwa_principle_santa_cruz_pinot
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_santa_cruz_pinot
    domain_id: winemaking
    assertion_text: Given ripe Santa Cruz Mountains Pinot Noir for a red-fruit-led brief, trial restrained cap
      work against a more intensive extraction schedule. Temperature, contact time and cap management affect
      phenolic extraction and tannin texture. Judge the actual fruit and wine; more extraction does not
      necessarily improve balance.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_paso_santa_maria_routes
    subject_id: n_wset_nwa_principle_paso_santa_maria_routes
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_paso_santa_maria_routes
    domain_id: winemaking
    assertion_text: For supplied Paso Robles Cabernet Sauvignon and Santa Maria Valley Chardonnay lots, red
      fermentation on skins extracts colour and tannin, whereas pressing white juice away from skins limits
      that extraction. Oak and lees choices can subsequently alter flavour or texture. These lot choices do
      not make San Luis Obispo County and Santa Maria Valley identical styles.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_finger_lakes_riesling
    subject_id: n_wset_nwa_principle_finger_lakes_riesling
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_finger_lakes_riesling
    domain_id: winemaking
    assertion_text: Finger Lakes Riesling can be dry or retain sweetness. Cool fermentation in a neutral vessel
      helps protect its delicate fruit aromas; the producer must also set the intended residual sugar and
      ensure stability. A lake-origin label alone does not identify sweetness, and sweeter wine need not be
      less acidic.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_elqui_syrah
    subject_id: n_wset_nwa_principle_elqui_syrah
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_elqui_syrah
    domain_id: winemaking
    assertion_text: Given ripe Elqui Syrah for a dry red brief, ferment with skins and choose temperature and
      cap work for the measured fruit and desired tannin. More intensive extraction may increase phenolics;
      suitable oak can add spice or toast. Arid growing conditions do not prescribe either strong extraction
      or a heavily oaked wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_limari_chardonnay
    subject_id: n_wset_nwa_principle_limari_chardonnay
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_limari_chardonnay
    domain_id: winemaking
    assertion_text: For a supplied fresh Limarí Chardonnay lot, neutral-vessel fermentation can retain a
      fruit-led profile. A fuller trial may use lees, suitable wood or malolactic fermentation, which can
      change texture, flavour or acidity. Coastal cooling provides context; it does not require all Limarí
      wines to be unoaked or mineral-tasting.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_aconcagua_red
    subject_id: n_wset_nwa_principle_aconcagua_red
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_aconcagua_red
    domain_id: winemaking
    assertion_text: Given ripe Aconcagua Valley Cabernet Sauvignon, skin fermentation provides colour and tannin
      for a dry red. Purchased oak may add wood aromas and reshape texture during maturation; a fruit-led
      earlier release is another brief. Taste for balance before selecting a route rather than equating
      inland warmth with one oak level.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_leyda_san_antonio_white
    subject_id: n_wset_nwa_principle_leyda_san_antonio_white
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_leyda_san_antonio_white
    domain_id: winemaking
    assertion_text: For sound Sauvignon Blanc lots from San Antonio or its Leyda zone, cool neutral-vessel
      fermentation with controlled oxygen exposure can protect a fresh aromatic target. Lees may add texture
      in a trial. Coastal fruit and the origin name do not oblige every producer to use the same
      fermentation vessel or time on lees.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_cachapoal_carmenere
    subject_id: n_wset_nwa_principle_cachapoal_carmenere
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_cachapoal_carmenere
    domain_id: winemaking
    assertion_text: Given sound, ripe Cachapoal Carmenère for a dry red, skin fermentation extracts colour and
      tannin. Adjust cap work to observed tannin and the intended fruit-led or longer-matured brief; wood
      can contribute additional aromas. Cellar choices cannot substitute for ripe fruit or establish one
      style for every Cachapoal site.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_curico_maule_white
    subject_id: n_wset_nwa_principle_curico_maule_white
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_curico_maule_white
    domain_id: winemaking
    assertion_text: Given Curicó and Maule Sauvignon Blanc lots intended for freshness, press the white juice
      away from skins and manage fermentation temperature and oxygen. These choices can retain fruit aromas
      and limit unwanted phenolic extraction. Actual ripeness and vessel or lees choices still vary; neither
      valley name promises a single weight or sweetness.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_maule_southern_red
    subject_id: n_wset_nwa_principle_maule_southern_red
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_maule_southern_red
    domain_id: winemaking
    assertion_text: For supplied Maule Cabernet Sauvignon and Southern Region Riesling lots, red skin
      fermentation builds colour and tannin, while white juice fermentation can preserve a lighter aromatic
      profile. Temperature and contact choices affect the outcome. These are contrasting grape-and-lot
      briefs, not a claim that the Southern Region grows only white varieties.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_western_cape_environment
    subject_id: n_wset_nwa_principle_western_cape_environment
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_western_cape_environment
    domain_id: viticulture
    assertion_text: "Much of the Western Cape has winter rain and warm, relatively dry summers. Cool coastal
      water and sea breezes can moderate summer heat, while mountains, aspect and distance inland create
      different vineyard conditions. Compare the actual site: Western Cape is a broad origin, not one
      temperature or a guarantee of drought-free growing."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_south_coast_chardonnay
    subject_id: n_wset_nwa_principle_south_coast_chardonnay
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_south_coast_chardonnay
    domain_id: winemaking
    assertion_text: Given Elgin and Walker Bay Chardonnay lots, trial a fresh neutral-vessel route against lees,
      suitable oak and malolactic fermentation for a fuller style. Lees can affect mouthfeel; malolactic
      fermentation reduces malic acidity. Hemel-en-Aarde wards supply local context within Walker Bay, not a
      compulsory recipe for every Cape South Coast wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_elim_sauvignon
    subject_id: n_wset_nwa_principle_elim_sauvignon
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_elim_sauvignon
    domain_id: winemaking
    assertion_text: For a supplied sound Elim Sauvignon Blanc lot, cool neutral-vessel fermentation and
      controlled oxygen exposure support a fresh aromatic brief. Longer lees contact is a texture choice to
      trial. Wind and coastal cooling affect growing conditions but do not dictate a dry, unoaked or
      uniformly herbaceous finished wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_clare_eden_riesling
    subject_id: n_wset_nwa_principle_clare_eden_riesling
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_clare_eden_riesling
    domain_id: winemaking
    assertion_text: For Clare Valley or Eden Valley Riesling intended to show citrus fruit and lively acidity,
      cool fermentation in a neutral vessel is a suitable route. Completing fermentation gives a dry target;
      retaining residual sugar requires a different endpoint and stability control. Oak is not needed to
      produce later bottle complexity.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_great_southern_riesling
    subject_id: n_wset_nwa_principle_great_southern_riesling
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_great_southern_riesling
    domain_id: winemaking
    assertion_text: Given a Great Southern Riesling lot, cool neutral-vessel fermentation can emphasise fruit; a
      texture-focused trial may instead include suitable lees or larger wood. Measure residual sugar and
      acidity rather than inferring them from the regional name. Neither the origin nor a Riesling label
      guarantees one sweetness level.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_great_southern_red
    subject_id: n_wset_nwa_principle_great_southern_red
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_great_southern_red
    domain_id: winemaking
    assertion_text: For supplied Great Southern Cabernet Sauvignon or Shiraz, fermenting on skins provides red
      colour and tannin. Trial extraction intensity and oak against the lot’s fruit concentration and
      intended balance; stronger cap work can increase phenolic extraction. A large diverse origin does not
      specify one red-wine cellar treatment.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_martinborough_pinot
    subject_id: n_wset_nwa_principle_martinborough_pinot
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_martinborough_pinot
    domain_id: winemaking
    assertion_text: Given ripe Martinborough Pinot Noir, compare restrained skin extraction with a
      firmer-texture trial before choosing cap work. Contact, temperature and handling affect extracted
      colour and tannin; suitable oak may add spice or toast. Preserve the lot’s fruit and balance rather
      than assuming the origin requires maximum extraction.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_otago_pinot
    subject_id: n_wset_nwa_principle_otago_pinot
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_otago_pinot
    domain_id: winemaking
    assertion_text: "For a supplied Central Otago Pinot Noir lot, ripe fruit allows a dry red route with skin
      fermentation. Tasting trials can guide cap-work intensity and wood use: extraction affects tannin,
      while oak can add aromas. Gibbston and Bannockburn conditions may differ, so one regional Pinot recipe
      is insufficient."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_nelson_aromatics
    subject_id: n_wset_nwa_principle_nelson_aromatics
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_nelson_aromatics
    domain_id: winemaking
    assertion_text: Given a Nelson Pinot Gris or Sauvignon Blanc lot for a fruit-led brief, cool neutral-vessel
      fermentation and controlled oxygen exposure can preserve aroma. Lees contact may alter texture. Actual
      residual sugar, ripeness and trials determine the result; the Nelson name does not make all aromatic
      whites dry or identical.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_gisborne_chardonnay
    subject_id: n_wset_nwa_principle_gisborne_chardonnay
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_gisborne_chardonnay
    domain_id: winemaking
    assertion_text: "Given a ripe Gisborne Chardonnay lot, compare a fruit-led early release with a
      texture-focused trial using lees, suitable oak or malolactic fermentation. Oak may contribute wood
      aromas; malolactic fermentation can lower malic acidity. Evaluate actual balance before choosing: warm
      fruit does not require heavy oak or the removal of all acidity."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_canterbury_riesling
    subject_id: n_wset_nwa_principle_canterbury_riesling
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_canterbury_riesling
    domain_id: winemaking
    assertion_text: Given a sound Canterbury Riesling lot, cool neutral-vessel fermentation can retain fresh
      fruit. A dry brief requires completion of sugar fermentation; an off-dry brief retains sugar and needs
      stability control. Balance actual acidity and sweetness. A Canterbury or North Canterbury origin alone
      does not select the fermentation endpoint.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_california_cost
    subject_id: n_wset_nwa_principle_california_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_california_cost
    domain_id: business
    assertion_text: Given comparable California Chardonnay lots, a fruit-led early release and a
      purchased-new-oak, longer-held cuvée incur different wood and inventory commitments. Evaluate their
      taste and customers separately; the extra spending does not establish superior balance or a guaranteed
      selling price.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_napa_cost
    subject_id: n_wset_nwa_principle_napa_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_napa_cost
    domain_id: business
    assertion_text: For otherwise comparable Napa Valley Cabernet Sauvignon lots, buying new barrels and selling
      later commits extra cash and cellar capacity. Choose the style after tasting fruit and tannin; an AVA
      name or additional oak expenditure does not establish the retail price or make every lot suitable for
      ageing.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_sonoma_cost
    subject_id: n_wset_nwa_principle_sonoma_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_sonoma_cost
    domain_id: business
    assertion_text: Given a Sonoma Pinot Noir lot needing more hand sorting than an otherwise comparable lot,
      additional labour and rejected berries raise the cost of usable wine. Selection aims for sound fruit,
      not a guaranteed premium; judge balance and market demand independently of the county or AVA name.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_coast_cost
    subject_id: n_wset_nwa_principle_coast_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_coast_cost
    domain_id: business
    assertion_text: Given Santa Barbara County and Monterey Chardonnay lots with identical base costs, repeated
      sorting reduces usable fruit and increases labour in the affected lot. A longer lees-held route also
      occupies cellar capacity. Compare the actual fruit and target style; coastal geography alone sets
      neither cost nor quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_lodi_cost
    subject_id: n_wset_nwa_principle_lodi_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_lodi_cost
    domain_id: business
    assertion_text: For a supplied Lodi Zinfandel plot with uneven ripeness, selective picking requires more
      passes than the specified single-pass alternative. Budget the extra labour against the usable fruit
      and intended dry-red style. Vine age and selection effort alone do not prove higher quality or a
      premium market price.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_oregon_cost
    subject_id: n_wset_nwa_principle_oregon_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_oregon_cost
    domain_id: business
    assertion_text: Given comparable Willamette Valley Chardonnay lots, a longer wood-and-lees cuvée occupies
      capacity and delays revenue compared with earlier fruit-led release. Taste balance and justify the
      target market before choosing. Time in the cellar is a cost condition, not proof that the more
      expensive route produces the better wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_washington_cost
    subject_id: n_wset_nwa_principle_washington_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_washington_cost
    domain_id: business
    assertion_text: For a supplied Columbia Valley or Yakima Valley vineyard needing irrigation, water delivery,
      energy and maintenance form part of growing cost. Compare the actual water requirement and fruit
      outcome with the stated alternative. Irrigation expense enables vine function but does not by itself
      establish wine quality or retail price.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_finger_lakes_cost
    subject_id: n_wset_nwa_principle_finger_lakes_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_finger_lakes_cost
    domain_id: business
    assertion_text: "Given equal-volume Finger Lakes Riesling lots, extra sorting and longer cellar holding add
      labour and inventory commitments to the specified later-release wine. Retaining sweetness also
      requires stability care. Assess balance and demand separately: added work or a sweeter finish is not a
      price or sensory-quality ranking."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_niagara_cost
    subject_id: n_wset_nwa_principle_niagara_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_niagara_cost
    domain_id: business
    assertion_text: In a supplied Niagara Peninsula comparison, selective naturally frozen-fruit harvesting and
      a smaller pressing yield require more effort per saleable litre than the stated ordinary-harvest lot.
      Cost the actual volumes and labour. Concentration and sweetness are stylistic consequences; neither
      guarantees fault-free balance or a particular market price.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_okanagan_cost
    subject_id: n_wset_nwa_principle_okanagan_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_okanagan_cost
    domain_id: business
    assertion_text: Given comparable Okanagan Valley Cabernet Sauvignon lots, purchased wood and extended
      holding add expenditure and capacity needs to the longer-matured brief. Check fruit, tannin and the
      intended customers before committing. Warm southern sites provide ripening context, not an automatic
      premium or a rule that all British Columbia Cabernet needs heavy oak.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_chile_central_cost
    subject_id: n_wset_nwa_principle_chile_central_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_chile_central_cost
    domain_id: business
    assertion_text: For supplied Maipo Cabernet Sauvignon and Colchagua Carmenère lots, budget actual fruit
      selection, purchased wood and holding time separately from an early-release Central Valley red brief.
      These choices can change usable volume and style. A smaller origin or longer maturation does not by
      itself justify a higher selling price.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_chile_coastal_cost
    subject_id: n_wset_nwa_principle_chile_coastal_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_chile_coastal_cost
    domain_id: business
    assertion_text: Given equal-volume Casablanca Sauvignon Blanc lots, a specified longer lees-held release
      uses capacity and postpones income compared with early bottling. Evaluate the texture gained against
      freshness and customers. Ocean influence and lees time do not establish one market tier or guarantee
      better balance.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_chile_north_cost
    subject_id: n_wset_nwa_principle_chile_north_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_chile_north_cost
    domain_id: business
    assertion_text: Given an Elqui Syrah plot requiring water delivery and a Limarí Chardonnay lot assigned
      longer wood maturation, budget those supplied inputs separately. Compare the actual fruit and intended
      wine, not latitude alone. Additional growing or cellar expense can raise cost without guaranteeing
      balance, concentration or a premium market.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_chile_aconcagua_cost
    subject_id: n_wset_nwa_principle_chile_aconcagua_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_chile_aconcagua_cost
    domain_id: business
    assertion_text: Given an Aconcagua Valley Cabernet lot assigned purchased oak and a San Antonio/Leyda
      Sauvignon lot assigned early release, cost each stated plan from its own inputs. They produce
      different style briefs rather than a universal price ladder. Local origin and extra expenditure cannot
      substitute for tasting or market demand.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_chile_south_cost
    subject_id: n_wset_nwa_principle_chile_south_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_chile_south_cost
    domain_id: business
    assertion_text: For supplied Curicó Sauvignon Blanc, Maule Cabernet and Cachapoal Carmenère lots, compare
      early release against extra selection and holding only where those conditions are specified. Selection
      can reduce usable volume; holding commits capacity. Southern Region origin alone does not make wine
      cheap or expensive, and cost does not determine balance.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_mendoza_cost
    subject_id: n_wset_nwa_principle_mendoza_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_mendoza_cost
    domain_id: business
    assertion_text: Given comparable Mendoza Malbec lots, hand selection and purchased oak for a longer-held
      cuvée add commitments compared with a fruit-led early release. Judge fruit, acidity, tannin and the
      intended customers. Mendoza origin, altitude or extra spending alone does not prove superior quality
      or set a price.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_argentina_diverse_cost
    subject_id: n_wset_nwa_principle_argentina_diverse_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_argentina_diverse_cost
    domain_id: business
    assertion_text: Given a demanding Salta hillside, an easier-access San Juan plot and a Patagonia site
      requiring wind protection, cost the actual specified labour, equipment and protection separately.
      Geography helps identify questions to investigate; it does not establish a universal cost ranking.
      Assess fruit balance and demand before expecting a premium.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_western_cape_cost
    subject_id: n_wset_nwa_principle_western_cape_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_western_cape_cost
    domain_id: business
    assertion_text: Given comparable Western Cape Chenin Blanc lots, a fruit-led early release and a
      lees-and-purchased-oak cuvée have different capacity and input requirements. Test the texture and
      freshness against the intended market. A broad origin, extra wood or additional time does not
      establish better quality or a mandatory price tier.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_stellenbosch_cost
    subject_id: n_wset_nwa_principle_stellenbosch_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_stellenbosch_cost
    domain_id: business
    assertion_text: Given a Stellenbosch Cabernet Sauvignon lot requiring extra selection and new wood, budget
      those conditions against a comparable fruit-led lot. Rejected fruit reduces usable volume and wood
      adds expenditure. Evaluate actual ripeness and balance; slope, reputation and spending do not by
      themselves guarantee a premium price.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_cape_cool_cost
    subject_id: n_wset_nwa_principle_cape_cool_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_cape_cool_cost
    domain_id: business
    assertion_text: Given a Constantia Sauvignon lot for early release and Elgin or Walker Bay Chardonnay lots
      held longer on lees or in purchased wood, cost the supplied routes separately. Compare fresh aromas
      with texture after tasting. Cooling context is useful, but neither an origin name nor additional
      maturation proves greater sensory quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_coastal_region_cost
    subject_id: n_wset_nwa_principle_coastal_region_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_coastal_region_cost
    domain_id: business
    assertion_text: Given a Paarl plot needing water delivery, Durbanville fruit requiring selection and a
      Swartland lot with a longer-holding brief, identify those separate cost inputs. Measure fruit and wine
      outcomes before deciding value. These are supplied Coastal Region cases, not evidence that every
      vineyard in each district has the same costs.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_breede_cost
    subject_id: n_wset_nwa_principle_breede_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_breede_cost
    domain_id: business
    assertion_text: Given a Worcester Chenin lot needing water delivery and a Robertson Chardonnay lot assigned
      early neutral-vessel release, budget actual growing and cellar requirements. Purchased wood or longer
      holding would change the specified budget and possibly style. Neither irrigation nor the Breede River
      Valley origin establishes quality or selling price alone.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_marlborough_cost
    subject_id: n_wset_nwa_principle_marlborough_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_marlborough_cost
    domain_id: business
    assertion_text: Given comparable Marlborough Sauvignon Blanc lots, extra sorting and a longer lees-held
      release add labour and capacity commitments to the specified cuvée. Compare its texture and freshness
      with early release before deciding value. A subregional name or greater spending alone does not
      guarantee superior quality or price.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_hawkes_cost
    subject_id: n_wset_nwa_principle_hawkes_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_hawkes_cost
    domain_id: business
    assertion_text: Given comparable Hawke’s Bay Merlot/Cabernet lots, purchasing barrels and holding one cuvée
      longer commits more resources than the supplied fruit-led release. Compare ripe fruit and tannin
      balance as well as customers. A Bordeaux-style blend or extra oak expenditure is not by itself a
      sensory-quality grade or a retail-price guarantee.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_martinborough_cost
    subject_id: n_wset_nwa_principle_martinborough_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_martinborough_cost
    domain_id: business
    assertion_text: Given equal-volume Martinborough Pinot Noir lots, extra hand selection and purchased wood
      for later release increase the specified labour, input and capacity commitments. Taste fruit and
      tannin before choosing. A small origin or additional effort may support a particular brief, but
      neither proves superior balance or guarantees demand.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_otago_cost
    subject_id: n_wset_nwa_principle_otago_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_otago_cost
    domain_id: business
    assertion_text: For a supplied Central Otago vineyard requiring frost protection, budget the actual
      equipment, energy and labour in that plan. Compare avoided crop loss and fruit outcome rather than
      assuming altitude sets quality. Wood and cellar holding are separate choices; neither the protection
      expense nor the origin guarantees a selling price.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_nelson_cost
    subject_id: n_wset_nwa_principle_nelson_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_nelson_cost
    domain_id: business
    assertion_text: Given comparable Nelson Pinot Gris lots, longer lees holding occupies capacity and delays
      the specified sale compared with early release. Tasting may show a texture difference, but time alone
      does not rank quality. Evaluate actual sweetness, freshness and the target customers before expecting
      any premium.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_gisborne_cost
    subject_id: n_wset_nwa_principle_gisborne_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_gisborne_cost
    domain_id: business
    assertion_text: Given comparable Gisborne Chardonnay lots, extra selection and new barrels add labour and
      material commitments to the assigned fuller cuvée. Judge actual fruit and acidity against the intended
      style. Sunshine, the origin name and greater expenditure do not independently prove better balance or
      determine its shelf price.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_canterbury_cost
    subject_id: n_wset_nwa_principle_canterbury_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_canterbury_cost
    domain_id: business
    assertion_text: Given Canterbury Riesling fruit requiring extra sorting after wet weather, budget the stated
      labour and reduction in usable volume. For sound lots, a longer-held brief also delays sale. Compare
      sweetness, acidity and demand separately; a local origin or additional cost does not itself establish
      superior sensory quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_argentina_origin_terms
    subject_id: n_wset_nwa_principle_argentina_origin_terms
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_argentina_origin_terms
    domain_id: geography
    assertion_text: Argentina protects wine origins through Indicación de Procedencia (IP), Indicación
      Geográfica (IG) and Denominación de Origen Controlada (DOC). IG identifies a recognised geographic
      origin; DOC adds conditions for production in its delimited area. These terms are origin frameworks,
      not grape names or a guarantee of a particular sensory score or price.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_argentina_ig_examples
    subject_id: n_wset_nwa_principle_argentina_ig_examples
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_argentina_ig_examples
    domain_id: geography
    assertion_text: The INV register recognises Mendoza, Maipú, Valle de Uco, Salta, San Juan and Patagonia as
      IGs, alongside smaller recognised places. Valle de Uco is within Mendoza; Patagonia is an
      interprovincial origin. A smaller name identifies geography rather than automatically promising
      greater concentration, oak use or quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_lujan_doc_distinction
    subject_id: n_wset_nwa_principle_lujan_doc_distinction
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_lujan_doc_distinction
    domain_id: geography
    assertion_text: Luján de Cuyo appears in the INV register as both an IG and a DOC. The DOC designation has
      its own approved conditions; wine merely grown in Luján de Cuyo is not automatically a DOC wine. Read
      the actual designation rather than treating a place name or Malbec variety label as proof of DOC
      status.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_nz_enduring_origins
    subject_id: n_wset_nwa_principle_nz_enduring_origins
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_nz_enduring_origins
    domain_id: geography
    assertion_text: "New Zealand, North Island and South Island are the three enduring New Zealand geographical
      indications. Smaller registered wine GIs protect defined regional names, such as Marlborough and
      Martinborough. Check the register: an application is not the same as a registered indication, and a
      protected origin alone specifies neither a compulsory grape nor a sensory-quality score."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_nwa_nz_origin_label
    subject_id: n_wset_nwa_principle_nz_origin_label
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_nwa_point_nz_origin_label
    domain_id: geography
    assertion_text: For an ordinary New Zealand grape-wine label stating one area, variety or vintage, at least
      85% of the wine must meet the stated claim. Thus Marlborough describes area, Sauvignon Blanc describes
      variety and a year describes harvest vintage; none identifies sweetness or oak use. Export labelling
      can have specified destination-related exceptions.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
