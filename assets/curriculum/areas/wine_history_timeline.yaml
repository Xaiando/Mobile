knowledge_items:
  - id: ki_htime_greek_symposium_krater
    subject_id: n_htime_greek_symposium
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_htime_greek_symposium_krater
    domain_id: service
    assertion_text: "The Metropolitan Museum of Art dates an Attic terracotta column-krater attributed to Lydos to about 550 BCE and describes the krater as a vessel in which wine was diluted with water at a Greek symposium. It documents pre-Roman wine service, not the invention of mixing wine or the way every Greek drank."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_htime_roman_trade_amphora
    subject_id: n_htime_roman_trade
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_htime_roman_trade_amphora
    domain_id: service
    assertion_text: "The Metropolitan Museum of Art dates its Roman terracotta transport amphora to the late first through mid-second century CE and says this type was frequently used to export wine. The object shows a transport technology and distribution, not a modern bottle, a DOC, or the recipe for every Roman wine."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_htime_burgundy_medieval_abbeys
    subject_id: n_htime_burgundy_medieval
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_htime_burgundy_medieval_abbeys
    domain_id: service
    assertion_text: "UNESCO connects the High Medieval Burgundy Climats to Benedictine and Cistercian orders and the Valois dukes. The present parcel system accumulated over time; no single monk drew all the modern legal boundaries."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_htime_burgundy_medieval_clos
    subject_id: n_htime_burgundy_medieval
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_htime_burgundy_medieval_clos
    domain_id: service
    assertion_text: "The Burgundy Climats historical account links Cistercian self-sufficient production with an enclosed plot and cellar model, using Clos de Vougeot in the twelfth century as its example. This is a dated model, not a claim that its current château was entirely built in one year."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_htime_aquitaine_trade
    subject_id: n_htime_aquitaine
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_htime_aquitaine_trade
    domain_id: service
    assertion_text: "Bordeaux's wine council dates the union of Eleanor of Aquitaine and Henry Plantagenet to 1152 and connects it to Bordeaux wine's outward history. The page gives no shipment volume and does not show that the marriage created the vineyard or a modern appellation."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_htime_ducal_rule_gamay
    subject_id: n_htime_ducal_rule
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_htime_ducal_rule_gamay
    domain_id: service
    assertion_text: "The Burgundy Climats timeline says Philip the Bold banned Gamay on his lands in 1395 in favour of Pinot noir. This was a ducal rule tied to his lands, not a universal prohibition of Gamay or a present-day AOC specification."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_htime_vessels_glass1650
    subject_id: n_htime_vessels
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_htime_vessels_glass1650
    domain_id: service
    assertion_text: "Corning Museum of Glass holds a dark-green English wine bottle with an applied seal dated about 1650-1660. It establishes a surviving glass wine vessel by that period; it does not date the first glass bottle or prove that all wine then travelled in bottles."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_htime_vessels_cork1730
    subject_id: n_htime_vessels
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_htime_vessels_cork1730
    domain_id: service
    assertion_text: "Corning Museum of Glass holds an English wine bottle dated 1730 with liquid, a cork, a foil seal and a paper label. It documents this combination in one surviving object, not the invention of cork closure or a universal replacement of casks."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_htime_cape_station
    subject_id: n_htime_cape
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_htime_cape_station
    domain_id: service
    assertion_text: "Wines of South Africa links the Cape wine industry to the Dutch East India Company's provisioning station established in 1652. The station is context for later planting, not a claim that Cape wine was already made that year."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_htime_cape_first1659
    subject_id: n_htime_cape
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_htime_cape_first1659
    domain_id: service
    assertion_text: "Wines of South Africa cites Jan van Riebeeck's diary for wine made from Cape-grown grapes on 2 February 1659. The date is the account's first recorded Cape-grape wine, not the first wine ever made in Africa."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_htime_australia_origins_first1788
    subject_id: n_htime_australia_origins
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_htime_australia_origins_first1788
    domain_id: service
    assertion_text: "Wine Australia says First Fleet vines were planted at Sydney Cove in 1788. This dates an early planting, not a successful commercial vintage or the first use of grapevine in the Pacific."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_htime_australia_origins_busby1832
    subject_id: n_htime_australia_origins
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_htime_australia_origins_busby1832
    domain_id: service
    assertion_text: "Wine Australia's old-vines guide dates the arrival of James Busby's significant collection of European vine cuttings to 1832; its New South Wales page explains how his collection spread to other Australian regions. This is later than the First Fleet planting and is not the same event."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_htime_south_america_colonial
    subject_id: n_htime_south_america
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_htime_south_america_colonial
    domain_id: service
    assertion_text: "The Government of Argentina traces wine production to the colonial period in Santiago del Estero and says vines had reached several other provinces by 1598. The country's wine history therefore did not begin with Malbec in the nineteenth century."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_htime_south_america_malbec1853
    subject_id: n_htime_south_america
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_htime_south_america_malbec1853
    domain_id: service
    assertion_text: "An Argentine government account dates a proposed Mendoza agricultural school to 17 April 1853 and credits Michel Aime Pouget with introducing European varieties including Malbec. The date marks a proposal and introduction context, not the first grape grown in Argentina."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_htime_revolution_owners
    subject_id: n_htime_revolution
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_htime_revolution_owners
    domain_id: service
    assertion_text: "The Burgundy Climats historical account says vineyards belonging to clergy and nobility were confiscated during the French Revolution and later bought by merchants, traders and other producers. Ownership changed, but the source does not say every old parcel boundary vanished."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_htime_pasteur_fermentation
    subject_id: n_htime_pasteur
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_htime_pasteur_fermentation
    domain_id: service
    assertion_text: "Institut Pasteur dates Pasteur's fermentation research to 1857-1862 and reports his conclusion that alcoholic fermentation is due to a living ferment. This is a microbiological explanation, not a claim that Pasteur invented wine or fermentation."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_htime_pasteur_wine_disease
    subject_id: n_htime_pasteur
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_htime_pasteur_wine_disease
    domain_id: service
    assertion_text: "Institut Pasteur says Napoleon III asked Pasteur in 1863 to study wine diseases and records his wine-preservation patent of 11 April 1865. Pasteur linked spoilage to microbial contaminants and developed a heat-preservation process; the institution says this method is rarely used for wine today because it can affect taste."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_htime_modern_origin_cape_wo
    subject_id: n_htime_modern_origin
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_htime_modern_origin_cape_wo
    domain_id: service
    assertion_text: "Wines of South Africa says Wine of Origin legislation was formulated in 1972 and the certification scheme was officially instituted in 1973. The two dates describe stages of one system; neither is a first Cape vintage."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_htime_modern_origin_usa_ava
    subject_id: n_htime_modern_origin
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_htime_modern_origin_usa_ava
    domain_id: service
    assertion_text: "The US regulator's establishment list dates Augusta, Missouri to 20 June 1980 and Napa Valley to 28 January 1981. Augusta heads that AVA list. The 1976 Paris tasting is a tasting, not the rule that established either AVA."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_htime_modern_origin_australia_gi
    subject_id: n_htime_modern_origin
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_htime_modern_origin_australia_gi
    domain_id: service
    assertion_text: "Part VIB of the Wine Australia Act 2013, in the 21 February 2025 compilation, establishes a Geographical Indications Committee and empowers it to determine Australian regional or local wine GIs. The act's short title is not a claim that all Australian GIs were first created in 2013."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_htime_present_chile2024
    subject_id: n_htime_present
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_htime_present_chile2024
    domain_id: service
    assertion_text: "Chile's agriculture-policy office reported a July 2024 announcement to add varieties and origin designations to decree 464. It recorded proposed or admissible changes; the announcement alone does not prove that a named bottle already exists or replace the legal text."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_htime_present_oiv2024
    subject_id: n_htime_present
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_htime_present_oiv2024
    domain_id: service
    assertion_text: "The OIV adopted resolution OIV-VITI 680-2024 with agroecological principles for winegrowing, including biodiversity, soil health and adaptation to climate change. This is an international recommendation, not a claim that every vineyard follows it."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_htime_present_oiv2026
    subject_id: n_htime_present
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_htime_present_oiv2026
    domain_id: service
    assertion_text: "On 12 May 2026 the OIV reported on the 2025 world wine sector. It cited a third consecutive low-production vintage, climate events in both hemispheres, weaker consumption and trade-policy pressures. Those are dated observations, not a prediction for every future harvest."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_htime_case_greek_roman_vessels_action
    subject_id: n_htime_case_greek_roman_vessels
    relation_type: CASE_ACTION
    object_id: n_htime_case_greek_roman_vessels_action
    domain_id: service
    assertion_text: "Identify the Met's Greek krater of about 550 BCE as a wine-and-water mixing vessel for a symposium. Identify its late first- to mid-second-century CE Roman amphora as a transport vessel resembling a type frequently used to export wine."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_htime_case_greek_roman_vessels_reason
    subject_id: n_htime_case_greek_roman_vessels
    relation_type: CASE_REASON
    object_id: n_htime_case_greek_roman_vessels_reason
    domain_id: service
    assertion_text: "The Greek catalog explains a way to serve wine at a symposium; the Roman catalog describes a transport type. The records support different functions for the two vessels."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_htime_case_greek_roman_vessels_tradeoff
    subject_id: n_htime_case_greek_roman_vessels
    relation_type: CASE_TRADEOFF
    object_id: n_htime_case_greek_roman_vessels_tradeoff
    domain_id: service
    assertion_text: "The dated objects make a useful pre-Roman-to-Roman comparison of wine service and distribution, but they do not measure how common either vessel or practice was."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_htime_case_greek_roman_vessels_limit
    subject_id: n_htime_case_greek_roman_vessels
    relation_type: CASE_LIMITATION
    object_id: n_htime_case_greek_roman_vessels_limit
    domain_id: service
    assertion_text: "Neither object dates the first wine dilution, the invention of a krater or an amphora, or the beginning of wine trade. The Roman object's resemblance to an export type does not establish what this particular vessel carried."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_htime_case_vessel_story_action
    subject_id: n_htime_case_vessel_story
    relation_type: CASE_ACTION
    object_id: n_htime_case_vessel_story_action
    domain_id: service
    assertion_text: "Separate a Roman transport amphora from a surviving English glass bottle of about 1650-1660 and a corked English bottle of 1730. Give each artifact its own date."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_htime_case_vessel_story_reason
    subject_id: n_htime_case_vessel_story
    relation_type: CASE_REASON
    object_id: n_htime_case_vessel_story_reason
    domain_id: service
    assertion_text: "The Met identifies an amphora used to move wine; Corning catalogs glass and corked-glass vessels from later periods. A surviving example establishes use by its date, not a world-wide first."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_htime_case_vessel_story_tradeoff
    subject_id: n_htime_case_vessel_story
    relation_type: CASE_TRADEOFF
    object_id: n_htime_case_vessel_story_tradeoff
    domain_id: service
    assertion_text: "The three objects let a learner contrast pottery transport and later glass packaging, but do not measure the percentage of wine carried in any vessel type."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_htime_case_vessel_story_limit
    subject_id: n_htime_case_vessel_story
    relation_type: CASE_LIMITATION
    object_id: n_htime_case_vessel_story_limit
    domain_id: service
    assertion_text: "Neither museum catalog dates the first cork, the first wine bottle, or the disappearance of casks. Say only what those cataloged objects document."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_htime_case_newworld_names_action
    subject_id: n_htime_case_newworld_names
    relation_type: CASE_ACTION
    object_id: n_htime_case_newworld_names_action
    domain_id: service
    assertion_text: "Give the 1976 Paris tasting as one blind comparison, the 1972-1973 Cape Wine of Origin sequence, and the US regulator's 1980 Augusta and 1981 Napa Valley AVA dates."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_htime_case_newworld_names_reason
    subject_id: n_htime_case_newworld_names
    relation_type: CASE_REASON
    object_id: n_htime_case_newworld_names_reason
    domain_id: service
    assertion_text: "A tasting compares selected wines on a day; Wine of Origin and AVA records concern protected geographical names. The chronology itself rules out the tasting creating the earlier Cape scheme."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_htime_case_newworld_names_tradeoff
    subject_id: n_htime_case_newworld_names
    relation_type: CASE_TRADEOFF
    object_id: n_htime_case_newworld_names_tradeoff
    domain_id: service
    assertion_text: "Australia's later statutory GI process is another origin-name system. Its 2013 Act title should not be used as the founding date for every Australian region."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_htime_case_newworld_names_limit
    subject_id: n_htime_case_newworld_names
    relation_type: CASE_LIMITATION
    object_id: n_htime_case_newworld_names_limit
    domain_id: service
    assertion_text: "A protected origin name identifies a regulated place. It does not, by itself, rank all wines from that place or reproduce the judges' 1976 scores."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true

