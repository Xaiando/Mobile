# Additional chronological wine-history evidence, from Greek vessels to the 2026 OIV report.
# The registered Areni-1, Pliny, Napoleon and later core remains in wine_history.yaml.
# Every item is unverified, is secondary enrichment and stays off WSET Levels 1-3.
