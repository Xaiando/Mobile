knowledge_items:
  - id: ki_wset_found_grape_parts
    subject_id: n_wset_found_principle_grape_parts
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_grape_parts
    domain_id: viticulture
    assertion_text: The skin encloses the juicy pulp. Juice is separated from skins early for most white wines;
      red wine normally ferments with skins.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_grape_skin
    subject_id: n_wset_found_principle_grape_skin
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_grape_skin
    domain_id: winemaking
    assertion_text: Skin contact supplies red colour and can extract tannin and flavour; black-grape flesh alone
      usually does not explain a red wine colour.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_grape_juice
    subject_id: n_wset_found_principle_grape_juice
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_grape_juice
    domain_id: winemaking
    assertion_text: Grape juice supplies the sugars that yeast converts into alcohol during wine fermentation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_flower_to_fruit
    subject_id: n_wset_found_principle_flower_to_fruit
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_flower_to_fruit
    domain_id: viticulture
    assertion_text: "After flowering and successful fertilisation, flowers can develop into young grape berries: fruit set."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_ripening
    subject_id: n_wset_found_principle_ripening
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_ripening
    domain_id: viticulture
    assertion_text: As berries ripen after veraison, sugars generally increase and acids decline; cultivar,
      weather and intended wine style affect harvest timing.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_annual_order
    subject_id: n_wset_found_principle_annual_order
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_annual_order
    domain_id: viticulture
    assertion_text: Flowering precedes berry formation and ripening; harvest follows when the fruit reaches the
      composition wanted for the wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_cool_warm
    subject_id: n_wset_found_principle_cool_warm
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_cool_warm
    domain_id: viticulture
    assertion_text: Cooler conditions commonly slow ripening and retain acidity. Warm-region wines can remain
      fresh where altitude, cool nights or other cooling influences help.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_heat_light
    subject_id: n_wset_found_principle_heat_light
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_heat_light
    domain_id: viticulture
    assertion_text: Light supports photosynthesis and heat influences growth and ripening; a variety must reach
      suitable maturity within its local growing season.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_fermentation
    subject_id: n_wset_found_principle_fermentation
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_fermentation
    domain_id: winemaking
    assertion_text: Yeast transforms fermentable grape sugars into ethyl alcohol and carbon dioxide during
      alcoholic fermentation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_fermentation_sweetness
    subject_id: n_wset_found_principle_fermentation_sweetness
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_fermentation_sweetness
    domain_id: winemaking
    assertion_text: Sweetness can remain when fermentation does not consume all available sugars; the amount left
      and the wine acidity affect perceived sweetness.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_white_sequence
    subject_id: n_wset_found_principle_white_sequence
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_white_sequence
    domain_id: winemaking
    assertion_text: For most white wine, pressing separates juice from skins before the juice ferments. Deliberate
      skin-contact white styles are an exception.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_red_sequence
    subject_id: n_wset_found_principle_red_sequence
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_red_sequence
    domain_id: winemaking
    assertion_text: Most red wine ferments in contact with black-grape skins, extracting colour and tannin, before
      the liquid is separated from the solids.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_rose_sequence
    subject_id: n_wset_found_principle_rose_sequence
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_rose_sequence
    domain_id: winemaking
    assertion_text: Brief contact with black-grape skins extracts a smaller amount of colour; the pink juice is
      separated and normally fermented without those skins.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_still
    subject_id: n_wset_found_principle_still
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_still
    domain_id: tasting
    assertion_text: Still wine does not have the pronounced bubbles that characterise sparkling wine. Still wines
      can be white, rosé or red.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_sparkling
    subject_id: n_wset_found_principle_sparkling
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_sparkling
    domain_id: tasting
    assertion_text: Sparkling wine releases dissolved carbon dioxide as bubbles when opened and poured; colour or
      sweetness alone does not define this wine type.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_fortified
    subject_id: n_wset_found_principle_fortified
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_fortified
    domain_id: winemaking
    assertion_text: Fortified wines receive added spirit or alcohol of grape origin. Their sweetness varies with
      the production method and style.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_colour
    subject_id: n_wset_found_principle_colour
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_colour
    domain_id: tasting
    assertion_text: White, rosé and red describe wine colour; these colour families can occur across different
      sweetness and production styles.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_sweetness
    subject_id: n_wset_found_principle_sweetness
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_sweetness
    domain_id: tasting
    assertion_text: Dry describes little or no perceived sweetness. Ripe fruit aromas alone do not establish that
      a wine contains noticeable residual sugar.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_acidity
    subject_id: n_wset_found_principle_acidity
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_acidity
    domain_id: tasting
    assertion_text: Acidity tastes sour and encourages salivation; compare the mouth-watering sensation with the
      wine sweetness rather than judging acidity from aroma alone.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_tannin
    subject_id: n_wset_found_principle_tannin
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_tannin
    domain_id: tasting
    assertion_text: Tannin can create a drying, gripping or astringent mouth sensation. This differs from the
      salivation caused by acidity.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_alcohol
    subject_id: n_wset_found_principle_alcohol
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_alcohol
    domain_id: tasting
    assertion_text: Alcohol can give a warming sensation and contribute to wine body; the sensation varies with
      alcohol level and the balance of other components.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_body
    subject_id: n_wset_found_principle_body
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_body
    domain_id: tasting
    assertion_text: Body is the impression of weight or fullness in the mouth, described from light to full;
      several components contribute to that impression.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_fruit_aromas
    subject_id: n_wset_found_principle_fruit_aromas
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_fruit_aromas
    domain_id: tasting
    assertion_text: Apple, citrus, berry and other fruit terms describe aroma or flavour impressions; they do not
      imply that those fruits were added to grape wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_oak_aromas
    subject_id: n_wset_found_principle_oak_aromas
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_oak_aromas
    domain_id: tasting
    assertion_text: Oak maturation can contribute vanilla, toast or sweet spice aromas; their presence and
      strength depend on the wood and the way it is used.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_other_aromas
    subject_id: n_wset_found_principle_other_aromas
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_other_aromas
    domain_id: tasting
    assertion_text: Wine descriptions can include floral, herbal or earthy impressions as well as fruit and oak;
      descriptors are examples rather than compulsory features.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_familiar_sancerre
    subject_id: n_wset_found_principle_familiar_sancerre
