    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_familiar_champagne
    subject_id: n_wset_found_principle_familiar_champagne
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_familiar_champagne
    domain_id: geography
    assertion_text: Champagne is a sparkling wine from Champagne in France, with bubbles developed through a
      second fermentation in the bottle.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_familiar_sauternes
    subject_id: n_wset_found_principle_familiar_sauternes
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_familiar_sauternes
    domain_id: geography
    assertion_text: Sauternes is a sweet white Bordeaux wine, usually based on Sémillon with supporting varieties
      such as Sauvignon Blanc.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_familiar_white_zinfandel
    subject_id: n_wset_found_principle_familiar_white_zinfandel
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_familiar_white_zinfandel
