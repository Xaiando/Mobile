  - id: ki_wset_found_familiar_beaujolais
    subject_id: n_wset_found_principle_familiar_beaujolais
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_familiar_beaujolais
    domain_id: geography
    assertion_text: Red Beaujolais is made from Gamay, commonly with fresh red fruit and relatively gentle
      tannins, although structure differs across wines and sites.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_familiar_cotes_rhone
    subject_id: n_wset_found_principle_familiar_cotes_rhone
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_familiar_cotes_rhone
    domain_id: geography
    assertion_text: The familiar red Côtes du Rhône example is a still red Rhône wine, often blended from
      varieties including Grenache and Syrah; white and rosé also exist.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_familiar_chianti
    subject_id: n_wset_found_principle_familiar_chianti
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_familiar_chianti
    domain_id: geography
    assertion_text: Chianti is a Tuscan red wine centred on Sangiovese; accompanying varieties and maturation
      produce different expressions.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_familiar_rioja
    subject_id: n_wset_found_principle_familiar_rioja
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_familiar_rioja
    domain_id: geography
    assertion_text: Tempranillo is especially associated with red Rioja. Rioja offers young fruit-focused reds and
      matured styles, as well as other wine colours.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_familiar_chateauneuf
    subject_id: n_wset_found_principle_familiar_chateauneuf
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_familiar_chateauneuf
    domain_id: geography
    assertion_text: The familiar Châteauneuf-du-Pape example is a southern Rhône still red wine involving black
      grapes such as Grenache; the appellation also makes still white wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_familiar_prosecco
    subject_id: n_wset_found_principle_familiar_prosecco
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_familiar_prosecco
    domain_id: geography
    assertion_text: The usual Prosecco example is an Italian sparkling wine based on Glera. Semi-sparkling and
      still Prosecco styles also exist, and sweetness varies.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_familiar_cava
    subject_id: n_wset_found_principle_familiar_cava
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_familiar_cava
    domain_id: geography
    assertion_text: Cava is a Spanish sparkling wine made using the traditional method, in which the second
      fermentation occurs in the bottle.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_familiar_sherry
    subject_id: n_wset_found_principle_familiar_sherry
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_familiar_sherry
    domain_id: geography
    assertion_text: Sherry includes dry fortified styles and naturally sweet or blended sweet styles; the Sherry
      name alone does not specify its sweetness.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_familiar_port
    subject_id: n_wset_found_principle_familiar_port
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_familiar_port
    domain_id: geography
    assertion_text: Port is fortified during fermentation with grape spirit. Familiar red Ports are sweet, but
      Port also occurs in white and other colour and sweetness styles.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_seeds_stems
    subject_id: n_wset_found_principle_seeds_stems
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_seeds_stems
    domain_id: viticulture
    assertion_text: Seeds and stems contain tannins that can be extracted during winemaking; their inclusion and
      the extraction method affect wine texture.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_skin_flavour
    subject_id: n_wset_found_principle_skin_flavour
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_skin_flavour
    domain_id: viticulture
    assertion_text: Grape skins contain many flavour and phenolic compounds. Contact time and handling influence
      how much enters the wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_pulp_sampling
    subject_id: n_wset_found_principle_pulp_sampling
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_pulp_sampling
    domain_id: viticulture
    assertion_text: Growers measure juice sugar, pH and titratable acidity alongside taste and other indicators;
      sugar alone does not describe complete fruit maturity.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_vine_resources
    subject_id: n_wset_found_principle_vine_resources
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_vine_resources
    domain_id: viticulture
    assertion_text: Vines need light and suitable warmth, water, mineral nutrients and carbon dioxide; shortages
      or excesses can limit growth and fruit development.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_water_roots
    subject_id: n_wset_found_principle_water_roots
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_water_roots
    domain_id: viticulture
    assertion_text: Irrigation supplies water when available soil moisture is insufficient. Severe water shortage
      can greatly slow vine growth; needs depend on site and conditions.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_nutrients
    subject_id: n_wset_found_principle_nutrients
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_nutrients
    domain_id: viticulture
    assertion_text: Mineral nutrients support normal vine growth. Site and plant assessments guide additions
      rather than assuming more fertiliser always improves the crop.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_vine_canopy
    subject_id: n_wset_found_principle_vine_canopy
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_vine_canopy
    domain_id: viticulture
    assertion_text: Well-exposed leaves supply carbohydrates through photosynthesis; the canopy must also protect
      fruit from excessive exposure where sunburn is a risk.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_veraison
    subject_id: n_wset_found_principle_veraison
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_veraison
    domain_id: viticulture
    assertion_text: Veraison marks the onset of berry ripening, including softening and colour change; it follows
      flowering and fruit set.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_unripe
    subject_id: n_wset_found_principle_unripe
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_unripe
    domain_id: viticulture
    assertion_text: Fruit picked too early may have insufficient sugar and relatively high acidity; the desired
      balance differs for sparkling, still and other wine styles.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_ripe_style
    subject_id: n_wset_found_principle_ripe_style
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_ripe_style
    domain_id: viticulture
    assertion_text: A suitable harvest point depends on the required sugar, acidity and flavour profile; the
      ripeness target is not identical for every wine style.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_late_harvest_risk
    subject_id: n_wset_found_principle_late_harvest_risk
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_late_harvest_risk
    domain_id: viticulture
    assertion_text: Longer hang time may develop flavour but increases exposure to disease, predators, late rain
      or frost and berry dehydration.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_sample_representative
    subject_id: n_wset_found_principle_sample_representative
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_sample_representative
    domain_id: viticulture
    assertion_text: Clusters differ in exposure and crop load; representative sampling avoids judging the whole
      crop from unusually ripe exposed berries.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_site_climate
    subject_id: n_wset_found_principle_site_climate
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_site_climate
    domain_id: viticulture
    assertion_text: Match variety and rootstock with local climate and the intended wine. Cold sensitivity,
      ripening time and disease pressure affect site suitability.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_slope_air
    subject_id: n_wset_found_principle_slope_air
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_slope_air
    domain_id: viticulture
    assertion_text: A site with good air drainage lets dense cold air move away rather than collect around vines;
      local terrain still determines the frost risk.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_aspect
    subject_id: n_wset_found_principle_aspect
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_aspect
    domain_id: viticulture
    assertion_text: In Pennsylvania, south- or east-facing slopes can improve sun exposure and drying. The best
      aspect depends on hemisphere, climate and the vineyard objective.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_soil_drainage
    subject_id: n_wset_found_principle_soil_drainage
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_soil_drainage
    domain_id: viticulture
    assertion_text: Well-drained soil supports healthy roots; persistent waterlogging can favour damaging root
      diseases, so water availability and drainage must both be considered.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_hail_heat
    subject_id: n_wset_found_principle_hail_heat
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_hail_heat
    domain_id: viticulture
    assertion_text: Hail can physically damage vines and berries; excessive sunlight and heat can burn fruit.
      Protective measures must suit the hazard and site.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_training
    subject_id: n_wset_found_principle_training
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_training
    domain_id: viticulture
    assertion_text: Training establishes the vine framework and positions growth on supports, making canopy
      exposure and vineyard operations more manageable.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_pruning
    subject_id: n_wset_found_principle_pruning
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_pruning
    domain_id: viticulture
    assertion_text: Annual pruning controls the amount and position of retained growth and future crop-bearing
      shoots; appropriate pruning depends on variety and training system.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_weeds
    subject_id: n_wset_found_principle_weeds
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_weeds
    domain_id: viticulture
    assertion_text: Weeds compete with young vines for water and nutrients; vineyard floor management balances
      competition control with other site needs.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_canopy_disease
    subject_id: n_wset_found_principle_canopy_disease
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_canopy_disease
    domain_id: viticulture
    assertion_text: A dense canopy restricts airflow and shades fruit. Suitable shoot and leaf management improves
      exposure and drying while avoiding overexposure.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_crop_load
    subject_id: n_wset_found_principle_crop_load
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_crop_load
    domain_id: viticulture
    assertion_text: An excessive crop relative to functional leaf area can delay balanced maturity and deplete
      vine reserves; yield alone does not establish wine quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_concentrated_fruit
    subject_id: n_wset_found_principle_concentrated_fruit
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_concentrated_fruit
    domain_id: viticulture
    assertion_text: Raisining removes water from ripe grapes and concentrates the remaining components; dried
      fruit can be used for sweet wine or other concentrated styles.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_noble_rot
    subject_id: n_wset_found_principle_noble_rot
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_noble_rot
    domain_id: viticulture
    assertion_text: Under suitable conditions, Botrytis affects berry skins and promotes water loss, concentrating
      sugars; harmful bunch rot remains a different production outcome.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_frozen_fruit
    subject_id: n_wset_found_principle_frozen_fruit
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_frozen_fruit
    domain_id: viticulture
    assertion_text: For OIV-defined icewine, grapes freeze naturally on the vine and are harvested and pressed in
      that state, separating concentrated juice from much of the frozen water.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_pulp_composition
    subject_id: n_wset_found_principle_pulp_composition
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_pulp_composition
    domain_id: viticulture
    assertion_text: Grape pulp contains water, sugars, acids and aroma compounds; sugar and acid levels help
      growers judge ripeness for a chosen wine style.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
