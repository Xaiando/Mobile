    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_familiar_chablis
    domain_id: geography
    assertion_text: Chablis is a Chardonnay white wine from northern Burgundy, commonly showing citrus or
      green-apple fruit and a fresh, taut character.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_familiar_white_burgundy
    subject_id: n_wset_found_principle_familiar_white_burgundy
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_familiar_white_burgundy
    domain_id: geography
    assertion_text: Chardonnay is the central white Burgundy example. Styles differ from fresh Chablis to fuller
      Côte de Beaune examples; oak influence varies.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_familiar_red_burgundy
    subject_id: n_wset_found_principle_familiar_red_burgundy
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_found_point_familiar_red_burgundy
    domain_id: geography
    assertion_text: The central red Burgundy example is Pinot Noir, commonly showing red-fruit character; site,
      vintage, extraction and maturation affect the finished style.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_found_familiar_bordeaux
