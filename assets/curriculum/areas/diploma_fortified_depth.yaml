  node_type: learning_point
  name: Request current samples, bottling details and landed quotes before choosing a category
- id: n_d5f_point_case_port_offer_reason
  node_type: learning_point
  name: Contrast multi-harvest age-indicated Tawny with single-harvest cask-aged Colheita
- id: n_d5f_point_case_port_offer_tradeoff
  node_type: learning_point
  name: Compare the quoted cask-age inventory cost and expected stock turnover
- id: n_d5f_point_case_port_offer_limitation
  node_type: learning_point
  name: Neither label supplies tasting quality, bottle condition or local demand
