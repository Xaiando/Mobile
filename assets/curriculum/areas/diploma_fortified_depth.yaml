knowledge_items:
- id: ki_d5f_port_gradient
  subject_id: n_d5f_principle_port_gradient
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d5f_point_port_gradient
  domain_id: winemaking
  assertion_text: IVDP describes a broad decrease in rainfall eastwards through the Douro; sub-region alone does not establish
    a parcel's water status or final wine quality.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d5f_port_terraces
  subject_id: n_d5f_principle_port_terraces
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d5f_point_port_terraces
  domain_id: winemaking
  assertion_text: IVDP says very steep Douro slopes must be shaped into terraces before planting, creating a site preparation
    requirement that should be costed rather than assumed for every Douro parcel.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d5f_port_beneficio
  subject_id: n_d5f_principle_port_beneficio
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d5f_point_port_beneficio
  domain_id: winemaking
  assertion_text: IVDP distinguishes vineyards authorised for Port and the benefício allocation from all land under vines;
    a grower cannot assume every harvested litre is eligible for Port.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d5f_sherry_press
  subject_id: n_d5f_principle_sherry_press
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d5f_point_sherry_press
  domain_id: winemaking
  assertion_text: The Consejo describes primera yema must as suited to biological ageing and more structured segunda yema
    must as better suited to oxidative development; final allocation still requires base-wine assessment.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d5f_sherry_manzanilla
  subject_id: n_d5f_principle_sherry_manzanilla
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d5f_point_sherry_manzanilla
  domain_id: winemaking
  assertion_text: The Consejo identifies Manzanilla as Palomino wine aged under flor in Sanlúcar de Barrameda; a flor-aged
    wine from another Jerez town cannot be relabelled Manzanilla merely because its method resembles Fino.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d5f_sherry_vos
  subject_id: n_d5f_principle_sherry_vos
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d5f_point_sherry_vos
  domain_id: winemaking
  assertion_text: The Consejo says V.O.S. certification is granted to an individual saca with average age over twenty years,
    rather than proving that each drop or all future releases under a brand is exactly twenty years old.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d5f_madeira_tinta
  subject_id: n_d5f_principle_madeira_tinta
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d5f_point_madeira_tinta
  domain_id: winemaking
  assertion_text: IVBAM lists Tinta Negra among the principal varieties used for Madeira alongside Sercial, Verdelho, Boal,
    Malvasia and Terrantez; the four classic style names are not the only grape sources used.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d5f_madeira_sweetness
  subject_id: n_d5f_principle_madeira_sweetness
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d5f_point_madeira_sweetness
  domain_id: winemaking
  assertion_text: IVBAM describes Sercial Madeira as a dry style and Malvasia Madeira as a sweet style; a buyer must still
    confirm the individual wine's category, condition and suitability.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d5f_madeira_categories
  subject_id: n_d5f_principle_madeira_categories
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d5f_point_madeira_categories
  domain_id: winemaking
  assertion_text: IVBAM presents blends with an age indication separately from the date-specific Colheita and Frasqueira categories;
    an age number on a blend is not a harvest year.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d5f_vdn_muscat
  subject_id: n_d5f_principle_vdn_muscat
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d5f_point_vdn_muscat
  domain_id: winemaking
  assertion_text: INAO identifies both Muscat à Petits Grains and Muscat d'Alexandrie for Muscat de Rivesaltes; grape identity
    alone does not determine the finished blend or its quality.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d5f_vdn_maury
  subject_id: n_d5f_principle_vdn_maury
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d5f_point_vdn_maury
  domain_id: winemaking
  assertion_text: CIVR describes Maury Grenat with dark-fruit notes and Maury Tuilé with oxidative maturation and dried-fruit,
    cacao and coffee notes; the named styles should not be treated as interchangeable.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d5f_vdn_banyuls_style
  subject_id: n_d5f_principle_vdn_banyuls_style
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d5f_point_vdn_banyuls_style
  domain_id: winemaking
  assertion_text: INAO describes red Banyuls Rimage as protected from air to retain fruit, while contact with air develops
    the amber or tuilé traditional profile; this is a style contrast, not a universal quality ranking.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d5f_vdn_banyuls_labour
  subject_id: n_d5f_principle_vdn_banyuls_labour
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d5f_point_vdn_banyuls_labour
  domain_id: winemaking
  assertion_text: INAO describes the Banyuls vineyard as steep schist with extensive walls and says its rugged terrain prevents
    mechanisation; that supports a labour-cost consideration, not a claim that every bottle commands a premium.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d5f_ruth_variety
  subject_id: n_d5f_principle_ruth_variety
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d5f_point_ruth_variety
  domain_id: winemaking
  assertion_text: Winemakers of Rutherglen identifies Muscat à Petits Grains Rouge, locally Rutherglen Brown Muscat, as the
    grape for its classified Muscat; Muscadelle is a separate fortified local style.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d5f_ruth_hang
  subject_id: n_d5f_principle_ruth_hang
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d5f_point_ruth_hang
  domain_id: winemaking
  assertion_text: The Rutherglen growers' association describes prolonged ripening and shrivelling to build sugar and flavour,
    with exposure to botrytis and early autumn rain; later picking is a risk-managed choice, not a quality guarantee.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d5f_ruth_tiers
  subject_id: n_d5f_principle_ruth_tiers
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d5f_point_ruth_tiers
  domain_id: winemaking
  assertion_text: The regional association describes Rutherglen, Classic, Grand and Rare as a progression of richness, complexity,
    age and intensity; age is only one factor and the classification is distinct from the geographical indication boundary.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d5f_case_port_offer_action
  subject_id: n_d5f_case_port_offer
  relation_type: CASE_ACTION
  object_id: n_d5f_point_case_port_offer_action
  domain_id: winemaking
  assertion_text: A defensible purchase needs the actual wines and landed terms, not a category ranking.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d5f_case_port_offer_reason
  subject_id: n_d5f_case_port_offer
  relation_type: CASE_REASON
  object_id: n_d5f_point_case_port_offer_reason
  domain_id: winemaking
  assertion_text: IVDP describes Colheita as a single-vintage cask-aged Tawny-style category, unlike usual blended age-indicated
    Tawny.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d5f_case_port_offer_tradeoff
  subject_id: n_d5f_case_port_offer
  relation_type: CASE_TRADEOFF
  object_id: n_d5f_point_case_port_offer_tradeoff
  domain_id: winemaking
  assertion_text: A longer-held stock may tie up inventory; compare actual supplier quotes and demand rather than presume
    category price.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d5f_case_port_offer_limitation
  subject_id: n_d5f_case_port_offer
  relation_type: CASE_LIMITATION
  object_id: n_d5f_point_case_port_offer_limitation
  domain_id: winemaking
  assertion_text: IVDP category descriptions identify production route; they do not establish the better current restaurant
    purchase.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d5f_case_sherry_vos_stock_action
  subject_id: n_d5f_case_sherry_vos_stock
  relation_type: CASE_ACTION
  object_id: n_d5f_point_case_sherry_vos_stock_action
  domain_id: winemaking
  assertion_text: With 1,500 L before withdrawal, x can be no more than 1,500 divided by 21, or about 71.4 L, if 20x must
    remain.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d5f_case_sherry_vos_stock_reason
  subject_id: n_d5f_case_sherry_vos_stock
  relation_type: CASE_REASON
