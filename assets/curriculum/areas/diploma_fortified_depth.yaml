  node_type: production_case
  name: How should the sherry vos stock decision be evaluated?
- id: n_d5f_point_case_sherry_vos_stock_action
  node_type: learning_point
  name: Reduce the proposed V.O.S. saca to at most about 71.4 L before further checks
- id: n_d5f_point_case_sherry_vos_stock_reason
  node_type: learning_point
  name: A 100 L withdrawal leaves only 1,400 L, less than twenty times the sold volume
- id: n_d5f_point_case_sherry_vos_stock_tradeoff
  node_type: learning_point
  name: Retain more long-aged stock in exchange for a smaller immediate release
- id: n_d5f_point_case_sherry_vos_stock_limitation
  node_type: learning_point
  name: The volume arithmetic does not itself certify the batch's age or tasting quality
- id: n_d5f_case_fortified_list
  node_type: production_case
  name: How should the fortified list decision be evaluated?
- id: n_d5f_point_case_fortified_list_action
  node_type: learning_point
  name: Sample the Maury Tuilé and Rutherglen Muscat against the brief, while checking actual sweetness and quotes
- id: n_d5f_point_case_fortified_list_reason
  node_type: learning_point
  name: Sercial is a dry Madeira lead while the other two are stronger sweet mature leads
- id: n_d5f_point_case_fortified_list_tradeoff
  node_type: learning_point
  name: The single slot forces a choice between oxidative Grenache character and mature Muscat richness
- id: n_d5f_point_case_fortified_list_limitation
  node_type: learning_point
  name: No label or regional description replaces current tasting, sweetness specification and landed margin
