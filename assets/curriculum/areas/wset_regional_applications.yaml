knowledge_items:
  - id: ki_wset_apply_bordeaux_white_cost
    subject_id: n_wset_apply_principle_bordeaux_white_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_apply_point_bordeaux_white_cost
    domain_id: business
    assertion_text: For comparable dry Bordeaux white lots, new barrels, lees handling and later sale can increase
      cellar cost and add texture or wood character. Compare the intended style and trial wine before paying
      for the longer route; higher cost does not ensure better balance.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_apply_bordeaux_maritime
    subject_id: n_wset_apply_principle_bordeaux_maritime
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_apply_point_bordeaux_maritime
    domain_id: viticulture
    assertion_text: The Atlantic, Gironde estuary and Garonne/Dordogne valleys moderate Bordeaux temperatures;
      that influence weakens farther inland. Rainfall and autumn weather vary by vintage, affecting disease
      pressure and harvest ripeness. Dry-white and sweet-white producers therefore assess their actual site
      and fruit condition rather than relying on one regional climate label.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_apply_sauternes_environment
    subject_id: n_wset_apply_principle_sauternes_environment
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_apply_point_sauternes_environment
    domain_id: viticulture
    assertion_text: The Ciron/Garonne setting can create humid morning mist followed by drier sunny afternoons,
      favouring noble rot on ripe grapes. Persistent wet conditions can instead cause destructive rot;
      selective picking and actual vintage conditions matter. These are Sauternes sweet-wine conditions, not a
      recipe for every Bordeaux white.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_apply_sauternes_selection_cost
    subject_id: n_wset_apply_principle_sauternes_selection_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_apply_point_sauternes_selection_cost
    domain_id: business
    assertion_text: Successive selective hand-picking passes for suitable Sauternes fruit require labour, while
      concentration and rejected berries can reduce usable juice. At otherwise similar costs, less saleable
      wine raises cost per unit. Noble rot does not guarantee an excellent wine or a particular market price.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_apply_muscadet_rainfall
    subject_id: n_wset_apply_principle_muscadet_rainfall
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_apply_point_muscadet_rainfall
    domain_id: viticulture
    assertion_text: The oceanic Nantais provides a generally cool, moist growing context for Melon. Wet weather
      can increase fungal pressure and hinder ripe, sound fruit; drainage, canopy ventilation and picking
      decisions help manage that risk. Ocean proximity does not guarantee identical acidity in every Muscadet
      vintage.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_apply_north_italian_white_cost
    subject_id: n_wset_apply_principle_north_italian_white_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_apply_point_north_italian_white_cost
    domain_id: business
    assertion_text: For a Cortese di Gavi or Soave lot intended for freshness, compare early release with a
      longer-held cuvée after a sensory trial. Holding inventory delays income and occupies capacity; lees or
      wood may change texture. Developed complexity must justify the intended style and budget, not merely a
      longer duration.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_apply_veneto_local_cooling
    subject_id: n_wset_apply_principle_veneto_local_cooling
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_apply_point_veneto_local_cooling
    domain_id: viticulture
    assertion_text: In Valpolicella, nearby Lake Garda moderates temperature extremes, while hill and valley
      breezes create local cooling differences. Inland plain, hill and lake-influenced sites should be
      compared separately. These conditions affect ripening choices; they do not make every Veneto vineyard
      equally cool or eliminate disease and hail risk.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_apply_abruzzo_cost
    subject_id: n_wset_apply_principle_abruzzo_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_apply_point_abruzzo_cost
    domain_id: business
    assertion_text: Given a Montepulciano d’Abruzzo fruit-led early-release brief, compare it with a lot held
      longer in purchased barrels. Extra wood and storage can raise cost and alter flavour or tannin texture.
      Judge fruit balance and demand before choosing; red grape identity does not oblige that maturation
      route.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_apply_aragon_cost
    subject_id: n_wset_apply_principle_aragon_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_apply_point_aragon_cost
    domain_id: business
    assertion_text: For comparable Calatayud or Cariñena Garnacha plots with the same annual cost, selecting fewer
      usable grapes can raise cost per litre; it does not automatically improve quality. Compare concentration
      with freshness. Additional purchased wood is a separate cost and style choice, not a consequence of the
      origin name.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_apply_duero_cost
    subject_id: n_wset_apply_principle_duero_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_apply_point_duero_cost
    domain_id: business
    assertion_text: For a Toro Tinta de Toro or Ribera del Duero Tempranillo lot, compare young fruit-led release
      with a suitable oak-matured route. Wood, handling and holding time add costs; maturation can reshape
      tannin and flavours. Retain fruit balance and assess demand rather than assuming more oak earns a higher
      price.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_apply_northwest_cost
    subject_id: n_wset_apply_principle_northwest_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_apply_point_northwest_cost
    domain_id: business
    assertion_text: In a supplied Rías Baixas pergola plot needing repeated hand work, extra labour increases
      growing cost compared with an otherwise comparable easier plot. Sound fruit is the aim, not a guaranteed
      premium. Compare an early-release Albariño lot with longer lees holding only after tasting and costing
      the delay.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_apply_levante_white_route
    subject_id: n_wset_apply_principle_levante_white_route
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_apply_point_levante_white_route
    domain_id: winemaking
    assertion_text: Given sound white grapes grown for a fresh Valencia white, separate juice from skins and
      consider cool fermentation with limited oxygen exposure. A fuller target might use lees or suitable
      wood. This is a conditional cellar plan, not a mandatory regional technique or a claim that warm-climate
      whites must be heavy.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_apply_levante_cost
    subject_id: n_wset_apply_principle_levante_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_apply_point_levante_cost
    domain_id: business
    assertion_text: For Jumilla or Yecla Monastrell lots, compare a fruit-led early-release plan with a
      longer-matured plan after judging ripe fruit and tannin. Longer holding delays sale and new wood
      requires expenditure. Harvest selection can reduce usable volume; higher cost needs a suitable style and
      customers, not an assumed regional premium.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_apply_mancha_cost
    subject_id: n_wset_apply_principle_mancha_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_apply_point_mancha_cost
    domain_id: business
    assertion_text: For a supplied accessible, machine-suitable Airén vineyard in La Mancha, mechanised picking
      can collect fruit quickly with fewer pickers. Compare equipment cost and fruit condition with selective
      hand picking. Temperature control supports a fresh target but also consumes resources; neither volume
      nor the harvesting method establishes quality alone.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_apply_alentejo_production
    subject_id: n_wset_apply_principle_alentejo_production
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_apply_point_alentejo_production
    domain_id: winemaking
    assertion_text: For a ripe Aragonez/Alicante Bouschet Alentejo red lot, more intensive skin contact can
      increase phenolic extraction; choose contact and cap management for the observed tannin and intended
      fruit-led or structured style. Longer contact can over-extract some lots. Strong extraction or oak is
      not compulsory because the region is warm.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_apply_alentejo_cost
    subject_id: n_wset_apply_principle_alentejo_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_apply_point_alentejo_cost
    domain_id: business
    assertion_text: Given a supplied easier-access Alentejo plot and a more demanding Portalegre hillside, budget
      the actual labour and equipment needs separately. Longer cellar holding adds capacity and cash demands.
      Cooler elevation may alter freshness, but access costs and taste must be established rather than
      presumed from altitude.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_apply_lisboa_cost
    subject_id: n_wset_apply_principle_lisboa_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_apply_point_lisboa_cost
    domain_id: business
    assertion_text: Given coastal Lisboa fruit requiring repeated sorting after wet weather, budget the extra
      labour and reduced usable volume. For sound lots, compare fresh release with a longer-held blend using
      trials. Wind and broad origin alone do not set cost, sensory quality or the shelf price.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_apply_rheinhessen_cost
    subject_id: n_wset_apply_principle_rheinhessen_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_apply_point_rheinhessen_cost
    domain_id: business
    assertion_text: For comparable Rheinhessen Grauburgunder lots, steel and purchased smaller oak vessels offer
      different flavour, texture and handling choices. Added wood and longer holding can raise cellar cost.
      Compare acidity, fruit and the target style; a barrique label or more expenditure does not guarantee
      superior balance.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_apply_niederosterreich_production
    subject_id: n_wset_apply_principle_niederosterreich_production
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_apply_point_niederosterreich_production
    domain_id: winemaking
    assertion_text: For a supplied Niederösterreich Riesling or Grüner Veltliner lot, cool fermentation in a
      neutral vessel is one way to retain a fresh fruit-led target. Lees contact or suitable larger wood can
      change texture. Evaluate fruit, acidity and trials; neither grape nor origin dictates one identical
      cellar treatment.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
