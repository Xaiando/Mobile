knowledge_items:
  -
    id: "ki_d4commercial_case_us_offer_action"
    subject_id: "n_d4commercial_case_us_offer"
    relation_type: "CASE_ACTION"
    object_id: "n_d4commercial_point_us_offer_action"
    domain_id: "business"
    assertion_text: "Request California offer B's fermentation and lees records, arrange a controlled panel trial of both lots against the brief and compare delivered costs and payment dates before committing. Oregon offer A's documentation gives a testable style hypothesis, not an automatic quality advantage; reserve a listing decision until the evidence fits the launch."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T00:00:00.000Z"
  -
    id: "ki_d4commercial_case_us_offer_reason"
    subject_id: "n_d4commercial_case_us_offer"
    relation_type: "CASE_REASON"
    object_id: "n_d4commercial_point_us_offer_reason"
    domain_id: "business"
    assertion_text: "A's supplied bottle-fermentation and lees records describe this fictional lot; B's California label does not fill its record gap. Public US sources show varied California sparkling styles and a specific Oregon traditional-method example, rather than one national or state recipe. Equal EUR 18 bottle quotes also do not settle delivered cost or cash timing."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T00:00:00.000Z"
  -
    id: "ki_d4commercial_case_us_offer_tradeoff"
    subject_id: "n_d4commercial_case_us_offer"
    relation_type: "CASE_TRADEOFF"
    object_id: "n_d4commercial_point_us_offer_tradeoff"
    domain_id: "business"
    assertion_text: "Under the stated terms A ties up purchase cash before a six-week delivery, while B offers current stock and payment 14 days after delivery. Waiting for B's records and testing both uses staff time but can avoid a poor fit. Faster availability or deferred payment is a commercial benefit to assess separately from sensory quality and eventual profit."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T00:00:00.000Z"
  -
    id: "ki_d4commercial_case_us_offer_limitation"
    subject_id: "n_d4commercial_case_us_offer"
    relation_type: "CASE_LIMITATION"
    object_id: "n_d4commercial_point_us_offer_limitation"
    domain_id: "business"
    assertion_text: "Neither sample's fit has been measured, B's method is unknown and freight is omitted from both quotes. Net selling revenue, other costs, sales pace, supplier reliability and customer receipt dates are also missing, so no final margin or cash forecast is established. A's documented route cannot be generalized to every Oregon wine, and B's label cannot establish every California wine's method."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T00:00:00.000Z"
  -
    id: "ki_d4commercial_case_andes_offer_action"
    subject_id: "n_d4commercial_case_andes_offer"
    relation_type: "CASE_ACTION"
    object_id: "n_d4commercial_point_andes_offer_action"
    domain_id: "business"
    assertion_text: "Taste A against the fruit-led brief and consider a limited launch order only if it meets the brief and its two-week delivery is confirmed. Taste B as a later option, but its stated eight-week arrival misses the six-week opening. Do not replace this venue's demand evidence with the supplier's claim about an aggregate 2023 Argentine report."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T00:00:00.000Z"
  -
    id: "ki_d4commercial_case_andes_offer_reason"
    subject_id: "n_d4commercial_case_andes_offer"
    relation_type: "CASE_REASON"
    object_id: "n_d4commercial_point_andes_offer_reason"
    domain_id: "business"
    assertion_text: "A and B differ by their supplied method records and delivery commitments, not simply by Chile or Argentina. Wines of Chile describes both tank and bottle routes, so Chilean origin alone does not identify A's method. INV's October 2024 publication reports 2023 aggregate dispatches; it does not demonstrate this lot's current quality, future local demand or likely sales pace."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T00:00:00.000Z"
  -
    id: "ki_d4commercial_case_andes_offer_tradeoff"
    subject_id: "n_d4commercial_case_andes_offer"
    relation_type: "CASE_TRADEOFF"
    object_id: "n_d4commercial_point_andes_offer_tradeoff"
    domain_id: "business"
    assertion_text: "A's stated earlier availability makes a small opening trial possible, but testing and a limited order consume samples and buying time. Waiting for B forgoes the planned opening slot; retaining it for a later comparison preserves an alternative style without assuming bottle fermentation is automatically better. This scheduling choice does not guarantee either offer's sales."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T00:00:00.000Z"
  -
    id: "ki_d4commercial_case_andes_offer_limitation"
    subject_id: "n_d4commercial_case_andes_offer"
    relation_type: "CASE_LIMITATION"
    object_id: "n_d4commercial_point_andes_offer_limitation"
    domain_id: "business"
    assertion_text: "The scenario gives no tasting result, venue sales history, net selling price, complete delivered cost, payment terms or repeat-supply evidence. Confirm the quoted delivery commitment and run a limited local sales review before expanding. The INV report is dated, aggregated context; it neither certifies this fictional Argentine lot nor establishes current demand at the venue."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T00:00:00.000Z"
  -
    id: "ki_d4commercial_case_oceania_africa_offer_action"
    subject_id: "n_d4commercial_case_oceania_africa_offer"
    relation_type: "CASE_ACTION"
    object_id: "n_d4commercial_point_oceania_africa_offer_action"
    domain_id: "business"
    assertion_text: "Use the stated charges to compare A's EUR 16 unit cost with B's EUR 17, then taste both lots under controlled conditions against the brief. Do not select B solely for its lower EUR 12 bottle quote or longer lees period. A commitment should follow the panel result and realistic selling and supply checks, rather than a country or category ranking."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T00:00:00.000Z"
  -
    id: "ki_d4commercial_case_oceania_africa_offer_reason"
    subject_id: "n_d4commercial_case_oceania_africa_offer"
    relation_type: "CASE_REASON"
    object_id: "n_d4commercial_point_oceania_africa_offer_reason"
    domain_id: "business"
    assertion_text: "Under the deliberately simplified inputs, A costs EUR 16 and produces EUR 18 illustrative gross profit at EUR 34 net revenue; B costs EUR 17 and produces EUR 17. This is gross profit, not net profit. New Zealand Winegrowers describes a prominent traditional-method route and the Cap Classique association describes bottle fermentation; these contexts and the supplied lees records justify comparison, not an automatic preferred-quality result."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T00:00:00.000Z"
  -
    id: "ki_d4commercial_case_oceania_africa_offer_tradeoff"
    subject_id: "n_d4commercial_case_oceania_africa_offer"
    relation_type: "CASE_TRADEOFF"
    object_id: "n_d4commercial_point_oceania_africa_offer_tradeoff"
    domain_id: "business"
    assertion_text: "At the same stated net revenue, A retains EUR 1 more illustrative gross profit per bottle. B's supplied longer lees period offers a different maturation hypothesis: yeast breakdown during lees ageing can change aroma and texture, but duration alone does not prove better balance or list fit. A panel may prefer either, so assess any extra cost against the style benefit actually observed."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T00:00:00.000Z"
  -
    id: "ki_d4commercial_case_oceania_africa_offer_limitation"
    subject_id: "n_d4commercial_case_oceania_africa_offer"
    relation_type: "CASE_LIMITATION"
    object_id: "n_d4commercial_point_oceania_africa_offer_limitation"
    domain_id: "business"
    assertion_text: "The exercise's invented charges are not a complete real-world import or tax quotation. Actual handling, deductions, operating expenses, currency exposure, repeat supply, customer demand and the panel result remain to be established. No net-profit forecast follows from illustrative gross profit, and the given 24/36-month records are not legal category minima or descriptions of every New Zealand or Cap Classique bottle."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T00:00:00.000Z"
