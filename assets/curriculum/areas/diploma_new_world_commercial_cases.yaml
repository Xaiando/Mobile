# Original fictional D4 purchasing comparisons; expert review remains outstanding.
# Published trade sources support bounded mechanisms, not invented offers or national quality rankings.
# Existing source IDs are reused; no GI permission, legal maturation minimum or public price is asserted.
knowledge_nodes:
  -
    id: "n_d4commercial_case_us_offer"
    node_type: "production_case"
    name: "Fictional buying exercise: a venue launches a fresh-fruit and some lees-complexity sparkling slot in eight weeks. Offer A is labelled Oregon; its supplied lot records state traditional bottle fermentation and 24 months on lees, with delivery in six weeks and payment now. Offer B is labelled California, is in stock and payable 14 days after delivery, but supplies no fermentation or lees records. Each quote is EUR 18 per bottle before freight. The panel has tasted neither and can trial both. Recommend the next action, explain the evidence, compare the commercial tradeoff and identify unresolved checks. These invented records and terms describe only these offers."
  -
    id: "n_d4commercial_point_us_offer_action"
    node_type: "learning_point"
    name: "Trial both lots, obtain B's missing production records and compare full delivered costs before committing"
  -
    id: "n_d4commercial_point_us_offer_reason"
    node_type: "learning_point"
    name: "A's records describe its method; origin labels and equal bottle quotes leave important differences unresolved"
  -
    id: "n_d4commercial_point_us_offer_tradeoff"
    node_type: "learning_point"
    name: "A requires earlier cash and a six-week wait; B offers stock and later payment but weaker method evidence"
  -
    id: "n_d4commercial_point_us_offer_limitation"
    node_type: "learning_point"
    name: "Actual sensory fit, freight, full selling economics, supplier reliability and receipts remain unknown"
  -
    id: "n_d4commercial_case_andes_offer"
    node_type: "production_case"
    name: "Fictional buying exercise: a fruit-led sparkling slot opens in six weeks. Chilean offer A supplies tank-fermentation records and a two-week delivery commitment. Argentine offer B supplies traditional bottle-fermentation records and an eight-week delivery commitment. Both quotes are within the stated purchasing budget; samples can be tasted now and a small trial order is possible. The B supplier cites INV's 2023 Argentine domestic sparkling dispatch report as proof that this lot will sell faster at this venue. No local demand data or panel results exist. Recommend a launch decision, rationale, tradeoff and missing evidence without turning country or historical volume into a quality or sales guarantee."
  -
    id: "n_d4commercial_point_andes_offer_action"
    node_type: "learning_point"
    name: "Trial A for a limited launch order if it fits; keep B for a later comparison rather than promise unavailable stock"
  -
    id: "n_d4commercial_point_andes_offer_reason"
    node_type: "learning_point"
    name: "The supplied method records and delivery dates matter; a 2023 national report does not forecast this lot's sales"
  -
    id: "n_d4commercial_point_andes_offer_tradeoff"
    node_type: "learning_point"
    name: "A can support the opening with less commitment; B remains a later style option, with opportunity and sampling costs"
  -
    id: "n_d4commercial_point_andes_offer_limitation"
    node_type: "learning_point"
    name: "Panel fit, local demand, repeat supply, delivered economics and reliable commitments remain to be checked"
  -
    id: "n_d4commercial_case_oceania_africa_offer"
    node_type: "production_case"
    name: "Fictional buying exercise: offer A is a New Zealand traditional bottle-fermented sparkling lot with 24 months on lees, quoted at EUR 15 plus EUR 1 freight per bottle. Offer B is a South African Cap Classique lot with supplied bottle-fermentation records and 36 months on lees, quoted at EUR 12 plus EUR 5 freight. Both can arrive in three weeks on identical payment terms. The proposed net selling revenue is EUR 34 per bottle. For this illustrative gross-profit comparison only, treat the supplied bottle and freight charges as the entire cost of goods sold, with no other deductions; this is not a real tax or landed-cost schedule. The panel has tasted neither; the brief requires fresh fruit and some lees complexity. Recommend the comparison, explain the cost and method evidence, weigh the tradeoff and state what is still unknown."
  -
    id: "n_d4commercial_point_oceania_africa_offer_action"
    node_type: "learning_point"
    name: "Compare the EUR 16 and EUR 17 supplied unit costs, taste both and choose only after fit and sales checks"
  -
    id: "n_d4commercial_point_oceania_africa_offer_reason"
    node_type: "learning_point"
    name: "B's lower bottle quote becomes the higher supplied unit cost; bottle fermentation and lees time do not prove preferred quality"
  -
    id: "n_d4commercial_point_oceania_africa_offer_tradeoff"
    node_type: "learning_point"
    name: "A has EUR 1 more illustrative gross profit; B offers a longer supplied lees period whose value requires tasting"
  -
    id: "n_d4commercial_point_oceania_africa_offer_limitation"
    node_type: "learning_point"
    name: "The simplified costs and method descriptions leave real landed costs, net profit, sensory fit and demand unresolved"
