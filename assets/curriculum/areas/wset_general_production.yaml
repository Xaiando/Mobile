knowledge_items:
  - id: ki_wset_prod_species_variety
    subject_id: n_wset_prod_principle_species_variety
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_species_variety
    domain_id: viticulture
    assertion_text: Vitis vinifera is a vine species containing wine varieties such as Chardonnay and Cabernet Sauvignon. A variety is not a separate species; cultivar choice must match the site and intended wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_clone_selection
    subject_id: n_wset_prod_principle_clone_selection
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_clone_selection
    domain_id: viticulture
    assertion_text: Clonal selection propagates vines vegetatively from a selected source within a variety. Selected lines may differ in traits; a nursery selection number alone does not guarantee superior performance.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_cross_hybrid
    subject_id: n_wset_prod_principle_cross_hybrid
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_cross_hybrid
    domain_id: viticulture
    assertion_text: A crossing combines parent varieties by sexual reproduction; in common wine-study terminology, an intraspecific crossing uses parents of the same species, while an interspecific hybrid combines different vine species.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_graft_not_cross
    subject_id: n_wset_prod_principle_graft_not_cross
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_graft_not_cross
    domain_id: viticulture
    assertion_text: Grafting joins a fruiting scion to a rootstock. The scion retains its variety identity; joining plant parts is different from breeding a seedling through a cross.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_climate_types
    subject_id: n_wset_prod_principle_climate_types
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_climate_types
    domain_id: viticulture
    assertion_text: Maritime influence moderates seasonal temperatures; continental climates have greater seasonal extremes; Mediterranean climates typically combine dry summers with milder wetter winters. These patterns describe more than growing-season warmth alone.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_warmth_categories
    subject_id: n_wset_prod_principle_warmth_categories
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_warmth_categories
    domain_id: viticulture
    assertion_text: Cool, moderate, warm and hot describe growing-season temperature conditions. Maritime, continental and Mediterranean describe broader seasonal patterns; a maritime site need not always be cool.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_continental_diurnal
    subject_id: n_wset_prod_principle_continental_diurnal
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_continental_diurnal
    domain_id: viticulture
    assertion_text: Continentality compares seasonal temperatures over the year; diurnal range compares daytime and night-time temperatures. A large day-to-night difference does not by itself establish a continental climate.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_latitude_altitude
    subject_id: n_wset_prod_principle_latitude_altitude
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_latitude_altitude
    domain_id: viticulture
    assertion_text: Latitude influences seasonal light and heat; increasing elevation generally lowers temperature. Local exposure and air movement can modify either effect, so a regional average cannot prove one vineyard’s ripeness.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_water_moderation
    subject_id: n_wset_prod_principle_water_moderation
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_water_moderation
    domain_id: viticulture
    assertion_text: Large water bodies change temperature more slowly than land, moderating nearby extremes. Ocean currents and winds also matter; protection from winter cold can coexist with cooler growing-season days.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_site_fog
    subject_id: n_wset_prod_principle_site_fog
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_site_fog
    domain_id: viticulture
    assertion_text: Fog can reduce incoming sunlight and daytime heat and delay ripening while increasing humidity. Its effects depend on persistence, timing and whether the fruit zone subsequently dries.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_climate_weather
    subject_id: n_wset_prod_principle_climate_weather
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_climate_weather
    domain_id: viticulture
    assertion_text: Climate describes longer-term patterns; weather is the actual sequence of heat, rain, wind and frost in a season. Harvest condition and style may differ between vintages within the same region.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_soil_heat
    subject_id: n_wset_prod_principle_soil_heat
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_soil_heat
    domain_id: viticulture
    assertion_text: Soil colour, stones and moisture influence heat absorption and release. Soil warmth can affect vine development, but a soil name alone does not guarantee ripeness or a specific wine flavour.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_head_cordon
    subject_id: n_wset_prod_principle_head_cordon
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_head_cordon
    domain_id: viticulture
    assertion_text: Head training concentrates retained growth around the top of the trunk. Cordon training retains permanent arms along which fruiting positions are arranged; either framework must suit the variety and site.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_spur_cane
    subject_id: n_wset_prod_principle_spur_cane
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_spur_cane
    domain_id: viticulture
    assertion_text: Spur pruning retains short sections of one-year wood with a few buds. Replacement-cane pruning retains longer one-year canes for the coming crop and renews them in later dormant seasons.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_trellis_untrellis
    subject_id: n_wset_prod_principle_trellis_untrellis
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_trellis_untrellis
    domain_id: viticulture
    assertion_text: Trellis wires support and position shoots for exposure, airflow and access. Untrellised bush vines arrange shoots around the head without those wires; suitability depends on vigour, water, climate and operations.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_planting_density
    subject_id: n_wset_prod_principle_planting_density
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_planting_density
    domain_id: viticulture
    assertion_text: Closer spacing increases vine numbers and establishment work, while competition and canopy management depend on water, vigour and training. Row width must also accommodate equipment; density alone does not establish wine quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_winter_hilling
    subject_id: n_wset_prod_principle_winter_hilling
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_winter_hilling
    domain_id: viticulture
    assertion_text: Mounding soil over the graft union can insulate this vulnerable point from severe winter cold. It protects a different hazard from spring frost damage to newly emerged green shoots.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_hazard_hail
    subject_id: n_wset_prod_principle_hazard_hail
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_hazard_hail
    domain_id: viticulture
    assertion_text: Hail can damage shoots and split berries, reducing crop and increasing infection risk. Netting can limit damage but has cost and operational trade-offs; spreading sites can reduce exposure to one local storm.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_hazard_animals
    subject_id: n_wset_prod_principle_hazard_animals
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_hazard_animals
    domain_id: viticulture
    assertion_text: Bird netting protects ripening fruit, while suitable fencing can exclude browsing deer. Protection needs maintenance and species-appropriate design; no barrier makes all vineyard losses impossible.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_virus_bacteria
    subject_id: n_wset_prod_principle_virus_bacteria
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_virus_bacteria
    domain_id: viticulture
    assertion_text: Systemic infections may reduce yield or ripening and can persist in propagation material. Tested clean stock, removal of affected vines and management of disease vectors or contaminated roots depend on the pathogen.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_conventional_ipm
    subject_id: n_wset_prod_principle_conventional_ipm
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_conventional_ipm
    domain_id: viticulture
    assertion_text: Conventional growers may use permitted synthetic inputs, but integrated pest management monitors risk and combines cultural, biological and targeted chemical controls. Product choice and application must follow local rules.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_sustainable
    subject_id: n_wset_prod_principle_sustainable
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_sustainable
    domain_id: viticulture
    assertion_text: Sustainable viticulture considers environmental impact, worker and community responsibilities and economic viability. Monitoring water, soil, energy and pest risk supports improvement; a sustainability scheme is distinct from organic certification.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_organic
    subject_id: n_wset_prod_principle_organic
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_organic
    domain_id: viticulture
    assertion_text: Organic production restricts inputs and relies on soil and ecosystem management, but permitted treatments still exist. Certification and labelling rules differ by market; organic does not mean no pest management.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_organic_winery
    subject_id: n_wset_prod_principle_organic_winery
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_organic_winery
    domain_id: viticulture
    assertion_text: Organic wine claims may require cellar rules as well as organically grown grapes. EU organic wine rules restrict processes and additives and permit limited sulphites; organic does not universally mean sulphite-free.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_biodynamic
    subject_id: n_wset_prod_principle_biodynamic
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_biodynamic
    domain_id: viticulture
    assertion_text: Biodynamic farming treats the farm as an interconnected system, using specified preparations and management of fertility, biodiversity and rhythms. Certifier standards define the claim; the label alone does not establish sensory quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_hand_machine
    subject_id: n_wset_prod_principle_hand_machine
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_hand_machine
    domain_id: viticulture
    assertion_text: Hand picking permits selective collection of bunches or berries; mechanical harvesting can collect a large crop quickly with fewer pickers. Terrain, vine layout, fruit condition and intended processing determine suitability.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_harvest_whole_bunch
    subject_id: n_wset_prod_principle_harvest_whole_bunch
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_harvest_whole_bunch
    domain_id: viticulture
    assertion_text: Whole-bunch pressing or whole-bunch fermentation requires intact bunches at intake. Ordinary berry-removing machine harvesting does not deliver the same material, so harvest and cellar decisions must be planned together.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_harvest_cost_quality
    subject_id: n_wset_prod_principle_harvest_cost_quality
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_harvest_cost_quality
    domain_id: viticulture
    assertion_text: Hand selection adds labour and may allow repeated passes; machine harvesting can lower labour cost and speed collection. Either can suit a good wine; fruit condition and the chosen style determine the outcome.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_irrigation_methods
    subject_id: n_wset_prod_principle_irrigation_methods
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_irrigation_methods
    domain_id: viticulture
    assertion_text: Drip delivers water near vines, sprinklers cover a wider area, and flood irrigation wets land through surface flow. Water availability, soil infiltration, evaporation, equipment and local permission govern the choice.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_nutrition_test
    subject_id: n_wset_prod_principle_nutrition_test
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_nutrition_test
    domain_id: viticulture
    assertion_text: Soil and vine tissue tests help distinguish nutrient deficiency from other causes of weak growth. Fertiliser should meet demonstrated needs; excessive nutrient supply may increase unwanted vigour rather than improve fruit.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_juice_clarification
    subject_id: n_wset_prod_principle_juice_clarification
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_juice_clarification
    domain_id: winemaking
    assertion_text: Settling lets suspended grape solids fall before clear juice is transferred. Clarification can support a chosen style, but excessive removal of solids may deprive yeast of useful components and impair fermentation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_racking_gross_lees
    subject_id: n_wset_prod_principle_racking_gross_lees
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_racking_gross_lees
    domain_id: winemaking
    assertion_text: Racking moves clear wine away from settled material. Removing heavy gross lees after fermentation differs from intentionally retaining fine yeast lees for maturation; the choice depends on wine condition and style.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_red_extraction_stages
    subject_id: n_wset_prod_principle_red_extraction_stages
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_red_extraction_stages
    domain_id: winemaking
    assertion_text: A cold soak precedes alcoholic fermentation, cap management extracts during it, and extended maceration retains skins after it. Temperature, alcohol, time and fruit condition alter extraction; longer contact is not always better.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_red_press_timing
    subject_id: n_wset_prod_principle_red_press_timing
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_red_press_timing
    domain_id: winemaking
    assertion_text: Skin contact during red fermentation supplies colour and tannin. Pressing then separates liquid from the solids; press fractions can be kept apart for later decisions about structure and balance.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_carbonic
    subject_id: n_wset_prod_principle_carbonic
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_carbonic
    domain_id: winemaking
    assertion_text: Intact berries in an oxygen-free carbon-dioxide atmosphere undergo intracellular reactions producing some alcohol and distinctive aromas. The fruit is subsequently pressed or crushed and yeast fermentation completes the wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_semi_carbonic
    subject_id: n_wset_prod_principle_semi_carbonic
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_semi_carbonic
    domain_id: winemaking
    assertion_text: Some lower berries break and their juice ferments with yeast, generating carbon dioxide around intact fruit above. Intracellular reactions and conventional fermentation therefore coexist; it is not a wholly yeast-free process.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_whole_bunch_crushed
    subject_id: n_wset_prod_principle_whole_bunch_crushed
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_whole_bunch_crushed
    domain_id: winemaking
    assertion_text: Whole bunches mixed with crushed fruit combine ordinary juice fermentation, contact with stems and some intact-berry reactions. The result depends on proportions and management; whole bunch alone does not prove full carbonic maceration.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_rose_direct_short
    subject_id: n_wset_prod_principle_rose_direct_short
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_rose_direct_short
    domain_id: winemaking
    assertion_text: Direct pressing extracts limited colour as black grapes are pressed. Short maceration deliberately holds juice with skins before separation; both usually ferment the separated juice without prolonged red-style skin contact.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_rose_blending
    subject_id: n_wset_prod_principle_rose_blending
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_rose_blending
    domain_id: winemaking
    assertion_text: Red-and-white blending can make pink wine, but permission varies by country and wine category. It is a recognised sparkling rosé route; no universal permission or prohibition applies to every still rosé.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_sweet_routes
    subject_id: n_wset_prod_principle_sweet_routes
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_sweet_routes
    domain_id: winemaking
    assertion_text: Sweet wine can retain grape sugar after partial fermentation, receive a permitted sweetening component, or start with concentrated grape sugars. The production route and final sweetness must be distinguished from fruit aroma.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_sweet_stability
    subject_id: n_wset_prod_principle_sweet_stability
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_sweet_stability
    domain_id: winemaking
    assertion_text: Residual or added fermentable sugar can support renewed yeast activity. Chilling slows fermentation but is not permanent stability; appropriate yeast removal, hygiene and permitted preservation protect the packaged wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_enrichment
    subject_id: n_wset_prod_principle_enrichment
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_enrichment
    domain_id: winemaking
    assertion_text: Adding permitted fermentable sugar before or during fermentation increases potential alcohol if yeast consumes it. This differs from sweetening finished wine to retain sugar; allowed materials and limits depend on wine law.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_acidification
    subject_id: n_wset_prod_principle_acidification
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_acidification
    domain_id: winemaking
    assertion_text: Permitted acid addition can increase acidity and change pH, affecting taste and stability. Tartaric acid is a common option, but the measured response depends on wine composition and should be checked rather than assumed.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_deacidification
    subject_id: n_wset_prod_principle_deacidification
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_deacidification
    domain_id: winemaking
    assertion_text: Permitted deacidification can neutralise some acids; blending with a less acidic wine is another option. Malolactic conversion reduces malic acidity through a different biological route. Local law limits which adjustments are allowed.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_adjustment_trials
    subject_id: n_wset_prod_principle_adjustment_trials
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_adjustment_trials
    domain_id: winemaking
    assertion_text: Bench trials compare treated samples using acidity, pH and taste. Buffering and acid composition mean equal additions need not give equal responses; adjustments can also change later tartrate stability.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_neutral_vessels
    subject_id: n_wset_prod_principle_neutral_vessels
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_neutral_vessels
    domain_id: winemaking
    assertion_text: Stainless steel and suitable concrete vessels can hold wine without supplying new-oak flavours. Vessel material, lining, size and temperature control affect handling; neutral maturation does not mean the wine cannot change.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_vessel_temperature
    subject_id: n_wset_prod_principle_vessel_temperature
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_vessel_temperature
    domain_id: winemaking
    assertion_text: Fermentation generates heat. Vessel surface area, material, insulation and cooling equipment influence removal of that heat, so the same cooling plan cannot be assumed for steel tanks, concrete tanks and barrels.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_oak_alternatives
    subject_id: n_wset_prod_principle_oak_alternatives
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_oak_alternatives
    domain_id: winemaking
    assertion_text: Permitted oak pieces can supply wood-derived compounds in another vessel. This does not reproduce every effect of barrel maturation, including its vessel geometry and oxygen exposure; wood form and heating influence the result.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_blend_balance
    subject_id: n_wset_prod_principle_blend_balance
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_blend_balance
    domain_id: winemaking
    assertion_text: Blending can combine components with complementary acidity, tannin, aroma or body to reach a chosen style. A blend is assessed as a whole; simply adding more components does not guarantee higher quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_blend_consistency
    subject_id: n_wset_prod_principle_blend_consistency
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_blend_consistency
    domain_id: winemaking
    assertion_text: Different parcels, varieties or permitted vintages can be combined to keep a target style despite variable components. The permitted origins, varieties and vintages still depend on the label and production rules.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_blend_trials
    subject_id: n_wset_prod_principle_blend_trials
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_blend_trials
    domain_id: winemaking
    assertion_text: Combining components changes composition and may change stability or filterability. Sensory trials guide balance, and the finished blend needs appropriate analysis; stability of each separate wine does not automatically prove stability together.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_sedimentation_fining
    subject_id: n_wset_prod_principle_sedimentation_fining
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_sedimentation_fining
    domain_id: winemaking
    assertion_text: Sedimentation lets suspended solids settle under gravity before racking. Fining adds a suitable agent that binds or removes selected material; it is not another name for allowing wine to settle.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_depth_surface
    subject_id: n_wset_prod_principle_depth_surface
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_depth_surface
    domain_id: winemaking
    assertion_text: Depth filtration retains particles through a filter matrix; surface filtration retains them at a defined membrane surface. Coarse clarification and validated microbial removal have different aims and cannot be assumed interchangeable.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_clarity_stability
    subject_id: n_wset_prod_principle_clarity_stability
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_clarity_stability
    domain_id: winemaking
    assertion_text: Wine can look clear while still containing viable microorganisms. A suitable final membrane, demonstrated integrity and hygienic packaging support microbial control; visual clarity alone does not prevent refermentation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_glass_pet_bib
    subject_id: n_wset_prod_principle_glass_pet_bib
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_glass_pet_bib
    domain_id: winemaking
    assertion_text: Glass, PET plastic and bag-in-box differ in weight, breakage risk, barrier properties and dispensing. Package design, filling oxygen and storage affect shelf life; an inexpensive format need not imply poor initial wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_package_oxygen
    subject_id: n_wset_prod_principle_package_oxygen
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_package_oxygen
    domain_id: winemaking
    assertion_text: PET and bag-in-box barrier properties and oxygen ingress vary by construction. Producers match the package to intended storage time and protect wine during filling; suitability cannot be inferred from material name alone.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_closure_types
    subject_id: n_wset_prod_principle_closure_types
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_closure_types
    domain_id: winemaking
    assertion_text: Natural cork is cut from cork bark; technical cork combines processed cork elements; synthetic cork uses manufactured polymers; screwcaps use a threaded cap and liner. Their specifications and performance vary within each category.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_closure_performance
    subject_id: n_wset_prod_principle_closure_performance
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_closure_performance
    domain_id: winemaking
    assertion_text: Closure oxygen transmission, sealing consistency and wine composition influence development. Cork-related taint and oxidation risks differ by product; a screwcap can suit ageing, and no closure guarantees that every wine will improve.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_cost_land_establishment
    subject_id: n_wset_prod_principle_cost_land_establishment
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_cost_land_establishment
    domain_id: business
    assertion_text: Land access, vines, trellis and site preparation require investment before a mature crop is available. More intensive planting or difficult access can increase costs; cost alone does not establish wine quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_cost_yield
    subject_id: n_wset_prod_principle_cost_yield
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_cost_yield
    domain_id: business
    assertion_text: If similar vineyard costs are spread over fewer usable grapes, cost per unit can rise. Selection or damaged fruit may also reduce saleable volume; lower yield does not universally improve wine quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_cost_cellar
    subject_id: n_wset_prod_principle_cost_cellar
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_cost_cellar
    domain_id: business
    assertion_text: Longer storage occupies cellar capacity and delays sale. Smaller vessels may require more handling for the same volume, while new wood adds purchasing cost; the chosen treatment must still suit the intended wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_price_chain
    subject_id: n_wset_prod_principle_price_chain
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_price_chain
    domain_id: business
    assertion_text: Winery operations, packaging, transport, taxes and distribution or retail margins contribute to a shelf price. Demand and market positioning also affect the price achievable; a higher price does not prove proportionally higher sensory quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_frost_heaters
    subject_id: n_wset_prod_principle_frost_heaters
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_frost_heaters
    domain_id: viticulture
    assertion_text: Heaters supply heat around the vine zone, while wind machines redistribute available warmer air from an inversion. Both require suitable conditions and operating resources; active protection has costs and cannot guarantee safety in every freeze.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_dry_on_off_vine
    subject_id: n_wset_prod_principle_dry_on_off_vine
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_dry_on_off_vine
    domain_id: viticulture
    assertion_text: Drying reduces berry water, concentrating the remaining juice. Grapes may shrivel on the vine or be dried after harvest; airflow and sorting limit damaging mould, and reduced juice volume can increase production cost.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_destem_crush
    subject_id: n_wset_prod_principle_destem_crush
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_destem_crush
    domain_id: winemaking
    assertion_text: Destemming removes bunch stems, crushing breaks berries to release juice, and pressing separates liquid from grape solids. Whole-bunch routes omit early destemming or crushing; these steps should not be treated as synonyms.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_arrest_chill
    subject_id: n_wset_prod_principle_arrest_chill
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_arrest_chill
    domain_id: winemaking
    assertion_text: Cooling an active ferment can interrupt yeast activity before all sugar is consumed, retaining grape sweetness. Subsequent yeast removal and microbial control matter because warming can permit renewed fermentation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
  - id: ki_wset_prod_dormancy_budburst
    subject_id: n_wset_prod_principle_dormancy_budburst
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_prod_point_dormancy_budburst
    domain_id: viticulture
    assertion_text: During winter dormancy the vine retains buds on woody growth. At budburst, new green shoots emerge from buds; their frost vulnerability differs from damage to dormant buds, trunks or graft unions during a severe winter freeze.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T17:00:00.000Z
