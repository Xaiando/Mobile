# Original D3 regional decisions; hypothetical premises, expert review pending.
knowledge_nodes:
- id: n_d3rt_case_bairrada_rain
  node_type: production_case
  name: A Bairrada grower has two Baga parcels before forecast September rain. Parcel A is ripe and sound;
    B is less ripe and shows isolated rot. One crew can harvest A now. A second, more expensive crew can
    sort B later, but buyer demand for a premium B bottling is untested. Recommend a harvest and sorting
    sequence, explain the style and quality mechanism, weigh cost against potential value, and name missing
    evidence.
- id: n_d3rt_point_bairrada_rain_action
  node_type: learning_point
  name: Harvest sound ripe A now; resample B and sort or divert unsound fruit before treating it as a
    premium separate lot.
- id: n_d3rt_point_bairrada_rain_reason
  node_type: learning_point
  name: Late-ripening, high-acid and tannic Baga can suffer rot in September rain; actual ripeness and
    fruit health determine the red-wine opportunity.
- id: n_d3rt_point_bairrada_rain_tradeoff
  node_type: learning_point
  name: A second crew and sorting can protect a sound lot but add cost that a buyer may not repay.
- id: n_d3rt_point_bairrada_rain_limitation
  node_type: learning_point
  name: B's post-rain health, finished sensory quality, yield and buyer demand remain unknown.
- id: n_d3rt_case_ribeira_offer
  node_type: production_case
  name: A buyer compares two sound, blind-tasted Mencía offers. The Ribeira Sacra terraced grower quotes
    higher harvest labour cost and a higher wholesale price; the other offer meets the list's target margin.
    The tasting panel prefers the terraced wine slightly, but forecast demand and supply reliability are
    unknown. Recommend a listing decision process, explain the regional cost mechanism, weigh margin against
    sensory preference, and identify missing evidence.
- id: n_d3rt_point_ribeira_offer_action
  node_type: learning_point
  name: Run a bounded sales and supply trial before committing the full list position.
- id: n_d3rt_point_ribeira_offer_reason
  node_type: learning_point
  name: Steep terraces restrict easy mechanisation and can raise vineyard labour, while the panel's preference
    applies only to these sampled wines.
- id: n_d3rt_point_ribeira_offer_tradeoff
  node_type: learning_point
  name: The preferred wine may justify a smaller margin only if customer response and supply support it.
- id: n_d3rt_point_ribeira_offer_limitation
  node_type: learning_point
  name: Origin and one panel result do not establish demand, repeatable supply or final profitability.
- id: n_d3rt_case_margaret_blend
  node_type: production_case
  name: A Margaret River winery has sound Semillon and Sauvignon Blanc lots. Two coded trials vary blend
    proportion and a restrained oak component. The fruit-led version meets a buyer's fresh brief; the
    oak-influenced version is preferred by a small cellar panel but takes longer and costs more to mature.
    No consumer test or order exists. Select a next step, explain the style mechanism, weigh cost against
    possible premium, and state an evidence limit.
- id: n_d3rt_point_margaret_blend_action
  node_type: learning_point
  name: Test both finished wines with the target buyer and compare landed margin before scaling the more
    expensive route.
- id: n_d3rt_point_margaret_blend_reason
  node_type: learning_point
  name: Grape proportion, ripeness and oak can change freshness and texture; a small cellar panel cannot
    establish market fit.
- id: n_d3rt_point_margaret_blend_tradeoff
  node_type: learning_point
  name: Oak handling and time can support a distinct wine but create cost and inventory exposure.
- id: n_d3rt_point_margaret_blend_limitation
  node_type: learning_point
  name: The premise lacks consumer response, an order, supply assessment and an evidenced premium price.
- id: n_d3rt_case_otago_frost
  node_type: production_case
  name: A Central Otago producer can lease either a cooler Gibbston slope or a warmer Bannockburn block
    for Pinot Noir. The Gibbston site has documented spring frost exposure and needs a protection budget;
    Bannockburn has higher quoted rent. Both have promising trial fruit, but from different seasons. The
    target is a fresh, ripe red at a viable margin. Recommend what to compare before signing, explain
    ripening and frost mechanisms, weigh costs, and state a limitation.
- id: n_d3rt_point_otago_frost_action
  node_type: learning_point
  name: Compare multi-season site records, fruit chemistry, frost-control feasibility and projected margins
    before leasing.
- id: n_d3rt_point_otago_frost_reason
  node_type: learning_point
  name: Gibbston is generally cooler and later-ripening, while spring frost and warmer Bannockburn conditions
    alter yield and ripening risks.
- id: n_d3rt_point_otago_frost_tradeoff
  node_type: learning_point
  name: Protection on one site and higher rent on the other are different cost exposures, neither a quality
    guarantee.
- id: n_d3rt_point_otago_frost_limitation
  node_type: learning_point
  name: Different-season fruit cannot isolate site effects or establish repeatable wine quality and demand.
