knowledge_items:
  - id: ki_d6_research_brief
    subject_id: n_d6_principle_brief
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d6_point_brief
    domain_id: business
    assertion_text: >-
      For a research assignment on a specified wine-related subject, use the issued
      title and brief to fix the scope and required presentation. Check the current
      submission details before writing; these practice cases are not issued titles.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T21:10:00.000Z"
  - id: ki_d6_research_question
    subject_id: n_d6_principle_question
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d6_point_question
    domain_id: business
    assertion_text: >-
      Turn the specified subject into bounded subquestions about the relevant place,
      period, actors and proposed relationship. Keep those subquestions subordinate to
      the issued title; the research plan must answer the assigned question.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T21:10:00.000Z"
  - id: ki_d6_research_provenance
    subject_id: n_d6_principle_provenance
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d6_point_provenance
    domain_id: business
    assertion_text: >-
      Appraise each proposed source's author or publisher, purpose, date, original
      evidence, method and fit to the question. A credible institution alone does not
      make an out-of-scope measure support a particular wine claim.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T21:10:00.000Z"
  - id: ki_d6_research_origin
    subject_id: n_d6_principle_origin
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d6_point_origin
    domain_id: business
    assertion_text: >-
      Follow a repeated claim back to the data or analysis it describes. Two articles
      repeating one producer survey do not provide two independent measurements;
      inspect the original survey's coverage and limitations before citing a result.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T21:10:00.000Z"
  - id: ki_d6_research_claim
    subject_id: n_d6_principle_claim
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d6_point_claim
    domain_id: business
    assertion_text: >-
      Record separately what a source measured, what its author concluded and what
      the researcher infers for the assignment. This prevents a limited observation
      from silently becoming a wider or causal claim in the researcher's own prose.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T21:10:00.000Z"
  - id: ki_d6_research_comparable
    subject_id: n_d6_principle_comparable
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d6_point_comparable
    domain_id: business
    assertion_text: >-
      Before treating wine-market reports as confirming or contradicting one another,
      check whether they cover the same period, place, population, sales channel and
      measure. A difference between retailer sales and winery direct orders may be a
      scope difference rather than a genuine disagreement.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T21:10:00.000Z"
  - id: ki_d6_research_counter
    subject_id: n_d6_principle_counter
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d6_point_counter
    domain_id: business
    assertion_text: >-
      Seek credible findings or mechanisms that challenge the preferred explanation.
      Address their relevance and quality, then retain, narrow or revise the conclusion
      according to the combined evidence rather than hiding inconvenient material.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T21:10:00.000Z"
  - id: ki_d6_research_structure
    subject_id: n_d6_principle_structure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d6_point_structure
    domain_id: business
    assertion_text: >-
      An analytical paragraph states a claim, cites relevant evidence, explains why
      that evidence bears on the claim and gives its limits or counterreading. A list
      of sourced facts alone does not explain an argument or justify a conclusion.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T21:10:00.000Z"
  - id: ki_d6_research_reference
    subject_id: n_d6_principle_reference
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d6_point_reference
    domain_id: business
    assertion_text: >-
      Keep enough bibliographic and location detail to let a reader trace every
      paraphrased, summarised or quoted finding to its source. Distinguish source
      views from original analysis, and follow the assigned brief's presentation
      requirements rather than assuming one fixed citation style.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T21:10:00.000Z"
  - id: ki_d6_case_channel_action
    subject_id: n_d6_case_channel_evidence
    relation_type: CASE_ACTION
    object_id: n_d6_case_channel_action_point
    domain_id: business
    assertion_text: >-
      Limit the present finding to more website orders among the 18 reporting wineries,
      then seek comparable multi-year data covering a defined regional population and
      direct-sales channels before testing the region-wide demand statement.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T21:10:00.000Z"
  - id: ki_d6_case_channel_reason
    subject_id: n_d6_case_channel_evidence
    relation_type: CASE_REASON
    object_id: n_d6_case_channel_reason_point
    domain_id: business
    assertion_text: >-
      The article repeats the group's data and is not independent corroboration. The
      retailer measures a different channel and period, so its flat shop result does
      not directly refute or validate the website-order result.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T21:10:00.000Z"
  - id: ki_d6_case_channel_tradeoff
    subject_id: n_d6_case_channel_evidence
    relation_type: CASE_TRADEOFF
    object_id: n_d6_case_channel_tradeoff_point
    domain_id: business
    assertion_text: >-
      The winery group supplies direct observations of its own orders but selected
      participation limits generalisation. The retailer contributes an outside view
      of a separate route, useful as context but not a like-for-like DTC measure.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T21:10:00.000Z"
  - id: ki_d6_case_channel_limitation
    subject_id: n_d6_case_channel_evidence
    relation_type: CASE_LIMITATION
    object_id: n_d6_case_channel_limit_point
    domain_id: business
    assertion_text: >-
      The packet does not show the region's full winery population, how the 18 were
      selected, total direct-sales value or equivalent time periods for other routes.
      It therefore cannot establish a region-wide demand trend.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T21:10:00.000Z"
  - id: ki_d6_case_campaign_action
    subject_id: n_d6_case_campaign_argument
    relation_type: CASE_ACTION
    object_id: n_d6_case_campaign_action_point
    domain_id: business
    assertion_text: >-
      A defensible outline says that participating wineries' orders increased after
      the campaign, while the supplied comparison does not isolate the campaign's
      effect. Present that narrower conclusion rather than asserting causation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T21:10:00.000Z"
  - id: ki_d6_case_campaign_reason
    subject_id: n_d6_case_campaign_argument
    relation_type: CASE_REASON
    object_id: n_d6_case_campaign_reason_point
    domain_id: business
    assertion_text: >-
      Growth among participants supplies temporal association, while growth among
      non-participants is a relevant rival observation. The two groups' different
      starting volumes and channels make a direct effect estimate unsound here.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T21:10:00.000Z"
  - id: ki_d6_case_campaign_tradeoff
    subject_id: n_d6_case_campaign_argument
    relation_type: CASE_TRADEOFF
    object_id: n_d6_case_campaign_tradeoff_point
    domain_id: business
    assertion_text: >-
      A campaign might plausibly help its participants, yet a wider demand shift could
      raise orders for both groups. The argument should show both interpretations and
      state what evidence would distinguish them.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T21:10:00.000Z"
  - id: ki_d6_case_campaign_limitation
    subject_id: n_d6_case_campaign_argument
    relation_type: CASE_LIMITATION
    object_id: n_d6_case_campaign_limit_point
    domain_id: business
    assertion_text: >-
      Request comparable pre- and post-campaign periods, channel definitions, order
      volumes and group-selection details. Without them, the packet cannot estimate
      how much growth, if any, the campaign caused.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T21:10:00.000Z"

