# Original D6 research-practice lessons. These teach a method, not an issued
# assignment title or a model submission. The two source packets are fictional.
# All items await qualified review; curation timestamps are not expert approval.
# Research is practised through wine-business cases within the current six-domain
# curriculum model. Generic MCQ is disabled because plausible alternatives vary.
knowledge_nodes:
  - {id: n_d6_principle_brief, node_type: production_principle, name: "What governs the scope and presentation of a D6 research assignment?"}
  - {id: n_d6_point_brief, node_type: learning_point, name: Use the issued title and its current assignment brief as the controlling task}
  - {id: n_d6_principle_question, node_type: production_principle, name: "How can a broad D6 title become a researchable inquiry?"}
  - {id: n_d6_point_question, node_type: learning_point, name: Derive bounded subquestions without substituting another title}
  - {id: n_d6_principle_provenance, node_type: production_principle, name: "Which checks make a wine-research source usable?"}
  - {id: n_d6_point_provenance, node_type: learning_point, name: Check author purpose date methods evidence and relevance before using a source}
  - {id: n_d6_principle_origin, node_type: production_principle, name: "Why must repeated wine-market claims be traced to their original evidence?"}
  - {id: n_d6_point_origin, node_type: learning_point, name: A repeated report is not independent corroboration of its underlying data}
  - {id: n_d6_principle_claim, node_type: production_principle, name: "How should a D6 researcher separate a source finding from an interpretation?"}
  - {id: n_d6_point_claim, node_type: learning_point, name: Label the measured result the author's claim and your own inference separately}
  - {id: n_d6_principle_comparable, node_type: production_principle, name: "What must be aligned before two wine-industry sources can be compared?"}
  - {id: n_d6_point_comparable, node_type: learning_point, name: Align place period population channel and measure before treating results as conflicting}
  - {id: n_d6_principle_counter, node_type: production_principle, name: "How can counterevidence improve a D6 argument?"}
  - {id: n_d6_point_counter, node_type: learning_point, name: Test credible alternative explanations and revise the strength of the conclusion}
  - {id: n_d6_principle_structure, node_type: production_principle, name: "What connects a claim to evidence in a research argument?"}
  - {id: n_d6_point_structure, node_type: learning_point, name: Explain why the cited evidence supports the claim and state the limits}
  - {id: n_d6_principle_reference, node_type: production_principle, name: "What keeps another person's wine-research finding distinguishable from your own view?"}
  - {id: n_d6_point_reference, node_type: learning_point, name: Record traceable citations for sourced findings and separate them from original analysis}

  - id: n_d6_case_channel_evidence
    node_type: production_case
    name: >-
      Fictional practice packet, not an issued WSET title. Assess the statement
      "direct wine demand rose across Region A". A voluntary group of 18 wineries
      reports more website orders in 2025 than in 2024; it does not include cellar-door
      sales or wineries outside the group. A trade article repeats the group's headline
      without new data. A retailer reports flat sales in ten shops over a different
      period; it does not measure direct orders. Plan the inquiry, state what the
      evidence can support, weigh a competing reading, and identify a needed check.
  - {id: n_d6_case_channel_action_point, node_type: learning_point, name: Narrow the direct-demand claim and seek a comparable regional series}
  - {id: n_d6_case_channel_reason_point, node_type: learning_point, name: Trace the repeated article to its source and keep sales channels distinct}
  - {id: n_d6_case_channel_tradeoff_point, node_type: learning_point, name: Weigh first-hand but selected orders against independent but different-channel data}
  - {id: n_d6_case_channel_limit_point, node_type: learning_point, name: Do not generalise eighteen volunteers to the whole region}

  - id: n_d6_case_campaign_argument
    node_type: production_case
    name: >-
      Fictional practice packet, not an issued WSET title. A regional export campaign
      ran from January to June. Seven participating wineries report increased orders
      afterward. Four non-participating wineries also report an increase, but their
      starting volumes and customer channels differ. A draft conclusion says the
      campaign caused the participating wineries' growth. Build a short argument
      outline that uses the supplied evidence, considers a rival explanation,
      qualifies the conclusion and names a test that would strengthen it.
  - {id: n_d6_case_campaign_action_point, node_type: learning_point, name: Replace the causal assertion with a qualified evidence-led conclusion}
  - {id: n_d6_case_campaign_reason_point, node_type: learning_point, name: Compare participant growth with nonparticipant growth before inferring campaign effect}
  - {id: n_d6_case_campaign_tradeoff_point, node_type: learning_point, name: Weigh a campaign mechanism against a shared wider trend}
  - {id: n_d6_case_campaign_limit_point, node_type: learning_point, name: Check comparable baselines periods channels and selection before estimating an effect}

