knowledge_items:
  - { id: ki_cms_bg_danubian_location, subject_id: n_geo_danubian_plain_bg, relation_type: LOCATED_IN, object_id: n_geo_bulgaria, domain_id: geography, assertion_text: "The Danubian Plain PGI covers named localities in northern Bulgaria; Pleven is a reference town within its listed area.", verification_status: unverified, last_verified_at: "2026-09-28T08:50:00.000Z" }
  - { id: ki_cms_bg_thracian_location, subject_id: n_geo_thracian_lowlands_bg, relation_type: LOCATED_IN, object_id: n_geo_bulgaria, domain_id: geography, assertion_text: "Thracian Lowlands is one of Bulgaria's two protected wine PGIs, rather than one of its many smaller PDOs.", verification_status: unverified, last_verified_at: "2026-09-28T08:50:00.000Z" }
  - { id: ki_cms_bg_melnik_location, subject_id: n_geo_melnik_pdo, relation_type: LOCATED_IN, object_id: n_geo_bulgaria, domain_id: geography, assertion_text: "The Melnik PDO's delimited production area includes named settlements around Sandanski, Petrich, Strumyani and Kresna in southwestern Bulgaria; the Sandanski town marker is a reference point.", verification_status: unverified, last_verified_at: "2026-09-28T08:50:00.000Z" }
  - { id: ki_cms_bg_lyubimets_location, subject_id: n_geo_lyubimets_pdo, relation_type: LOCATED_IN, object_id: n_geo_bulgaria, domain_id: geography, assertion_text: "The Lyubimets PDO is a Bulgarian designation whose delimited production area includes Lyubimets and other Haskovo-region settlements.", verification_status: unverified, last_verified_at: "2026-09-28T08:50:00.000Z" }
  - { id: ki_cms_ro_tarnave_location, subject_id: n_geo_tarnave, relation_type: LOCATED_IN, object_id: n_geo_romania, domain_id: geography, assertion_text: "Târnave DOC belongs to Romania's Transylvanian Plateau wine region; Mediaș is a named subdesignation and map reference.", verification_status: unverified, last_verified_at: "2026-09-28T08:50:00.000Z" }
  - { id: ki_cms_ro_cotnari_location, subject_id: n_geo_cotnari, relation_type: LOCATED_IN, object_id: n_geo_romania, domain_id: geography, assertion_text: "Cotnari DOC belongs to Romania's Moldavian Hills wine region.", verification_status: unverified, last_verified_at: "2026-09-28T08:50:00.000Z" }
  - { id: ki_cms_ro_dealu_mare_location, subject_id: n_geo_dealu_mare, relation_type: LOCATED_IN, object_id: n_geo_romania, domain_id: geography, assertion_text: "Dealu Mare DOC belongs to Romania's Muntenia and Oltenia Hills wine region; Urlați is one of its named subdesignations and a map reference.", verification_status: unverified, last_verified_at: "2026-09-28T08:50:00.000Z" }
  - { id: ki_cms_ro_murfatlar_location, subject_id: n_geo_murfatlar, relation_type: LOCATED_IN, object_id: n_geo_romania, domain_id: geography, assertion_text: "Murfatlar DOC belongs to Romania's Dobrogea Hills wine region.", verification_status: unverified, last_verified_at: "2026-09-28T08:50:00.000Z" }
  - { id: ki_cms_ro_recas_location, subject_id: n_geo_recas, relation_type: LOCATED_IN, object_id: n_geo_romania, domain_id: geography, assertion_text: "Recaș DOC belongs to Romania's Banat wine region.", verification_status: unverified, last_verified_at: "2026-09-28T08:50:00.000Z" }
  - { id: ki_cms_bg_danubian_gamza, subject_id: n_geo_danubian_plain_bg, relation_type: PERMITS_GRAPE, object_id: n_grape_gamza, domain_id: geography, assertion_text: "The Danubian Plain PGI lists Gamza, also called Kadarka, among its authorised wine grapes.", verification_status: unverified, last_verified_at: "2026-09-28T08:50:00.000Z" }
  - { id: ki_cms_bg_lyubimets_mavrud, subject_id: n_geo_lyubimets_pdo, relation_type: PERMITS_GRAPE, object_id: n_grape_mavrud, domain_id: geography, assertion_text: "The Lyubimets PDO specification lists Mavrud for red and rosé wines.", verification_status: unverified, last_verified_at: "2026-09-28T08:50:00.000Z" }
  - { id: ki_cms_bg_melnik_shiroka, subject_id: n_geo_melnik_pdo, relation_type: PERMITS_GRAPE, object_id: n_grape_shiroka_melnishka_loza, domain_id: geography, assertion_text: "The approved Melnik PDO specification lists Shiroka Melnishka Loza for red and rosé wines; this does not mean every Melnik wine uses it.", verification_status: unverified, last_verified_at: "2026-09-28T08:50:00.000Z" }
  - { id: ki_cms_ro_tarnave_feteasca_regala, subject_id: n_geo_tarnave, relation_type: PERMITS_GRAPE, object_id: n_grape_feteasca_regala, domain_id: geography, assertion_text: "The Târnave DOC specification includes Fetească Regală and describes it as a representative wine grape of the district.", verification_status: unverified, last_verified_at: "2026-09-28T08:50:00.000Z" }
  - { id: ki_cms_ro_cotnari_grasa, subject_id: n_geo_cotnari, relation_type: PERMITS_GRAPE, object_id: n_grape_grasa_de_cotnari, domain_id: geography, assertion_text: "The Cotnari DOC specification includes Grasă de Cotnari among its wine grapes.", verification_status: unverified, last_verified_at: "2026-09-28T08:50:00.000Z" }
  - { id: ki_cms_ro_dealu_mare_feteasca_neagra, subject_id: n_geo_dealu_mare, relation_type: PERMITS_GRAPE, object_id: n_grape_feteasca_neagra, domain_id: geography, assertion_text: "The Dealu Mare DOC specification permits Fetească Neagră for red and rosé wine.", verification_status: unverified, last_verified_at: "2026-09-28T08:50:00.000Z" }

