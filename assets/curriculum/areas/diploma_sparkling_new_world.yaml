# Original D4 New World comparisons. Regional descriptions and dated market data
# support analysis, not a claim that a GI guarantees method, taste, quality or price.
# These items await qualified review. No legal boundary is inferred from a marker.
knowledge_nodes:
  - id: n_d4nw_principle_au_south_australia
    node_type: production_principle
    name: How do Adelaide Hills site and method choices qualify a South Australian sparkling comparison?
  - id: n_d4nw_point_au_south_australia
    node_type: learning_point
    name: Elevated cooler sites support sparkling bases, but method and site still require evidence
  - id: n_d4nw_principle_au_victoria
    node_type: production_principle
    name: Why does Victoria not describe one sparkling-wine climate or style?
  - id: n_d4nw_point_au_victoria
    node_type: learning_point
    name: Victorian regions differ; Yarra is one cool-climate example
  - id: n_d4nw_principle_au_tasmania
    node_type: production_principle
    name: What do cool conditions explain and fail to explain in Tasmanian sparkling wine?
  - id: n_d4nw_point_au_tasmania
    node_type: learning_point
    name: Acidity and bottle-fermented potential coexist with frost and site risk
  - id: n_d4nw_principle_au_sea_label
    node_type: production_principle
    name: What can South Eastern Australia on a sparkling label establish?
  - id: n_d4nw_point_au_sea_label
    node_type: learning_point
    name: Broad protected origin allows multi-region sourcing but does not state method
  - id: n_d4nw_principle_nz_regions
    node_type: production_principle
    name: How might Marlborough, Hawke's Bay and Central Otago sparkling bases differ?
  - id: n_d4nw_point_nz_regions
    node_type: learning_point
    name: Compare sunshine, weight and diurnal range without assigning one national taste
  - id: n_d4nw_principle_nz_method
    node_type: production_principle
    name: Why must New Zealand sparkling method be read separately from origin?
  - id: n_d4nw_point_nz_method
    node_type: learning_point
    name: Traditional Pinot Noir and Chardonnay are prominent, not exhaustive
  - id: n_d4nw_principle_za_association
    node_type: production_principle
    name: What does the Cap Classique association communicate about category and method?
  - id: n_d4nw_point_za_association
    node_type: learning_point
    name: A South African bottle-fermented category and producer association
  - id: n_d4nw_principle_za_variation
    node_type: production_principle
    name: Which evidence is still needed to compare two Cap Classique wines?
  - id: n_d4nw_point_za_variation
    node_type: learning_point
    name: Grape source, lees time and dosage can vary within the category
  - id: n_d4nw_principle_us_california
    node_type: production_principle
    name: Why does California sparkling require a narrower origin and production brief?
  - id: n_d4nw_point_us_california
    node_type: learning_point
    name: Many producers and varieties; Chardonnay and Pinot Noir are prominent, not exclusive
  - id: n_d4nw_principle_us_oregon
    node_type: production_principle
    name: What does a Willamette Valley traditional-method example prove about Oregon sparkling wine?
  - id: n_d4nw_point_us_oregon
    node_type: learning_point
    name: Bottle-fermented Oregon examples exist without defining every Oregon bottle
  - id: n_d4nw_principle_us_washington
    node_type: production_principle
    name: How should Washington's climate and irrigation inform sparkling-base selection?
  - id: n_d4nw_point_us_washington
    node_type: learning_point
    name: Warm days, cool nights and water management demand site and harvest evidence
  - id: n_d4nw_principle_chile_coast_method
    node_type: production_principle
    name: Why can Chilean coastal sparkling wines differ by both origin and method?
  - id: n_d4nw_point_chile_coast_method
    node_type: learning_point
    name: Pacific moderation and separate tank or bottle routes influence outcomes
  - id: n_d4nw_principle_argentina_market
    node_type: production_principle
    name: How should a dated Argentine sparkling market figure be used?
  - id: n_d4nw_point_argentina_market
    node_type: learning_point
    name: Mendoza dominated a measured 2023 flow; the figure is not a timeless style rule
  - id: n_d4nw_principle_argentina_terms
    node_type: production_principle
    name: How do current Argentine sparkling and Pet Nat definitions differ?
  - id: n_d4nw_point_argentina_terms
    node_type: learning_point
    name: A second closed-vessel fermentation differs from continuous grape-sugar fermentation
  - id: n_d4nw_case_australian_offer
    node_type: production_case
    name: A buyer compares a Tasmania traditional-method offer with a South Eastern Australia tank-method offer.
      The first costs more and has a documented longer lees period; the second meets the price ceiling.
      Neither has been tasted by the buying panel. The list brief asks for fresh fruit and some lees
      complexity, and there is room to trial both. Recommend the next decision, rationale, tradeoff and
      missing evidence without treating origin or production cost as a quality score.
  - id: n_d4nw_point_case_australian_offer_action
    node_type: learning_point
    name: Trial both Australian offers against the style and price brief before listing
  - id: n_d4nw_point_case_australian_offer_reason
    node_type: learning_point
    name: Label, method and maturation suggest hypotheses, not the panel's sensory result
  - id: n_d4nw_point_case_australian_offer_tradeoff
    node_type: learning_point
    name: A comparative trial uses samples and time before a purchase commitment
  - id: n_d4nw_point_case_australian_offer_limitation
    node_type: learning_point
    name: Supply, actual sensory balance and landed margin remain unmeasured

