knowledge_items:
  - id: ki_d4nw_au_south_australia
    subject_id: n_d4nw_principle_au_south_australia
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d4nw_point_au_south_australia
    domain_id: winemaking
    assertion_text: Adelaide Hills altitude creates cooler sites where Chardonnay and Pinot Noir can retain useful acidity for sparkling bases. Compare site, picking date, method and lees handling before inferring style, quality or price from South Australia alone.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-28T00:00:00.000Z
  - id: ki_d4nw_au_victoria
    subject_id: n_d4nw_principle_au_victoria
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d4nw_point_au_victoria
    domain_id: winemaking
    assertion_text: Victoria includes contrasting climates and sparkling styles. Yarra Valley supplies a cool-site Chardonnay and Pinot Noir example, but a broad Victoria origin alone cannot establish grape source conditions, fermentation route or a uniform fresh profile. Request a narrower site and production record for comparison.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-28T00:00:00.000Z
  - id: ki_d4nw_au_tasmania
    subject_id: n_d4nw_principle_au_tasmania
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d4nw_point_au_tasmania
    domain_id: winemaking
    assertion_text: Tasmania's cool conditions can yield Chardonnay and Pinot Noir bases with natural acidity suited to traditional-method wine. Spring frost and site or vintage variation can affect yield and ripeness, so an island origin does not guarantee the same quality each year. Bottle lees time and selection also affect cost and character.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-28T00:00:00.000Z
  - id: ki_d4nw_au_sea_label
    subject_id: n_d4nw_principle_au_sea_label
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d4nw_point_au_sea_label
    domain_id: winemaking
    assertion_text: South Eastern Australia is a protected GI spanning all of New South Wales, Victoria and Tasmania and parts of South Australia and Queensland. It may accommodate fruit from several smaller GIs within it. The broad claim alone does not identify a cool vineyard, grape, sparkling method or quality tier; compare the actual sourcing and production specification.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-28T00:00:00.000Z
  - id: ki_d4nw_nz_regions
    subject_id: n_d4nw_principle_nz_regions
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d4nw_point_nz_regions
    domain_id: winemaking
    assertion_text: Marlborough is a major New Zealand sparkling source; its cool climate and sunshine can support crisp, defined fruit. Hawke's Bay can provide weightier base wines, while Central Otago's marked day-night range offers another balance of freshness and depth. These are regional tendencies, not guarantees for a particular bottle.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-28T00:00:00.000Z
  - id: ki_d4nw_nz_method
    subject_id: n_d4nw_principle_nz_method
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d4nw_point_nz_method
    domain_id: winemaking
    assertion_text: Traditional-method Pinot Noir and Chardonnay form a prominent New Zealand sparkling route, with bottle lees ageing able to add savoury complexity to fruit and acidity. The national category also spans diverse styles and regions, so establish method, grape blend and maturation rather than infer them from New Zealand on a label.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-28T00:00:00.000Z
  - id: ki_d4nw_za_association
    subject_id: n_d4nw_principle_za_association
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d4nw_point_za_association
    domain_id: winemaking
    assertion_text: The Cap Classique Producers Association promotes South African sparkling wines made by traditional bottle fermentation. That association and method distinguish the category from simply carbonated wine; they do not specify one district, grape mix, price or achieved sensory quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-28T00:00:00.000Z
  - id: ki_d4nw_za_variation
    subject_id: n_d4nw_principle_za_variation
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d4nw_point_za_variation
    domain_id: winemaking
    assertion_text: Cap Classique's common bottle-fermented route can produce different outcomes according to base-wine source and balance, blend, time on lees and dosage. Compare these recorded choices and a tasting before claiming that an example is more mature, better or necessarily more expensive than another.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-28T00:00:00.000Z
  - id: ki_d4nw_us_california
    subject_id: n_d4nw_principle_us_california
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d4nw_point_us_california
    domain_id: winemaking
    assertion_text: California has many sparkling producers and styles. Chardonnay and Pinot Noir are traditional grapes, but other varieties occur. Cooler-source examples such as Carneros and Anderson Valley warrant narrower site analysis; a California origin alone does not demonstrate traditional method, lees time or a single style or price.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-28T00:00:00.000Z
  - id: ki_d4nw_us_oregon
    subject_id: n_d4nw_principle_us_oregon
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d4nw_point_us_oregon
    domain_id: winemaking
    assertion_text: Willamette Valley producers document traditional-method sparkling wines from Pinot Noir, Chardonnay and sometimes Pinot Blanc. This demonstrates an Oregon production route, not a rule for all Oregon sparkling wine. Establish the particular wine's base fruit, bottle-fermentation and lees record before judging style or cost.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-28T00:00:00.000Z
  - id: ki_d4nw_us_washington
    subject_id: n_d4nw_principle_us_washington
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d4nw_point_us_washington
    domain_id: winemaking
    assertion_text: Washington's eastern vineyards commonly have long warm days, cool nights and managed irrigation. Those conditions can support ripe fruit while retaining acidity, but sparkling-base suitability depends on site, season and an appropriately early harvest. Traditional-method producers exist; neither Washington nor Columbia Valley alone specifies method or flavour.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-28T00:00:00.000Z
  - id: ki_d4nw_chile_coast_method
    subject_id: n_d4nw_principle_chile_coast_method
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d4nw_point_chile_coast_method
    domain_id: winemaking
    assertion_text: Wines of Chile identifies Pacific-cooled Limari, Casablanca and Leyda among sparkling contexts and describes both tank and traditional bottle-fermentation routes. Coastal moderation can support acidity, while the two routes may emphasise fresher fruit or more lees complexity. Compare fruit source, method and maturation rather than assign one Chilean style.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-28T00:00:00.000Z
  - id: ki_d4nw_argentina_market
    subject_id: n_d4nw_principle_argentina_market
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d4nw_point_argentina_market
    domain_id: winemaking
    assertion_text: An Argentine wine authority report found Mendoza accounted for most sparkling wine dispatched to Argentina's domestic market in 2023, while smaller volumes came from several other provinces. This dated commercial evidence makes Mendoza a useful study anchor; it does not establish today's share, fruit origin, method or style for an individual bottle.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-28T00:00:00.000Z
  - id: ki_d4nw_argentina_terms
    subject_id: n_d4nw_principle_argentina_terms
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d4nw_point_argentina_terms
    domain_id: winemaking
    assertion_text: Argentina's INV digest effective from January 2026 defines sparkling wine by carbon dioxide from a second alcoholic fermentation in a closed vessel, with at least four atmospheres at 20 C. Its lightly sparkling Pet Nat definition instead concerns continuous fermentation of remaining grape sugar and one to three atmospheres. Method and pressure terms should not be treated as interchangeable or inferred from province.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-28T00:00:00.000Z
  - id: ki_d4nw_case_australian_offer_action
    subject_id: n_d4nw_case_australian_offer
    relation_type: CASE_ACTION
    object_id: n_d4nw_point_case_australian_offer_action
    domain_id: winemaking
    assertion_text: Keep both offers for a controlled panel tasting against the requested fresh-fruit and lees-complexity brief, then check the landed price and supply. Do not select the Tasmania bottle solely because its origin and lees time sound premium, or the broad-GI bottle solely because it fits the price ceiling.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-28T00:00:00.000Z
  - id: ki_d4nw_case_australian_offer_reason
    subject_id: n_d4nw_case_australian_offer
    relation_type: CASE_REASON
    object_id: n_d4nw_point_case_australian_offer_reason
    domain_id: winemaking
    assertion_text: Regional origin, tank or bottle fermentation and lees time are evidence for likely style and cost mechanisms, but the missing sensory trial and commercial figures determine whether either wine meets this list's actual brief.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-28T00:00:00.000Z
  - id: ki_d4nw_case_australian_offer_tradeoff
    subject_id: n_d4nw_case_australian_offer
    relation_type: CASE_TRADEOFF
    object_id: n_d4nw_point_case_australian_offer_tradeoff
    domain_id: winemaking
    assertion_text: A side-by-side trial consumes samples and staff time and postpones the immediate purchase; it can prevent a costlier mismatch between the brief and the selected wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-28T00:00:00.000Z
  - id: ki_d4nw_case_australian_offer_limitation
    subject_id: n_d4nw_case_australian_offer
    relation_type: CASE_LIMITATION
    object_id: n_d4nw_point_case_australian_offer_limitation
    domain_id: winemaking
    assertion_text: The scenario provides no panel results, volumes, landed margins or supplier terms. Even a preferred sample cannot be listed responsibly until those points are checked; neither offer establishes the normal style of its whole GI.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-28T00:00:00.000Z

