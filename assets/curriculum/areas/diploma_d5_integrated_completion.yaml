{
  "knowledge_nodes": [
    {
      "id": "n_d5c_style_price_principle",
      "node_type": "production_principle",
      "name": "Does a longer fortified maturation record establish a profitable selling price?"
    },
    {
      "id": "n_d5c_style_price_point",
      "node_type": "learning_point",
      "name": "Maturation describes stock commitment; profitability also needs yield, costs and realised sales."
    },
    {
      "id": "n_d456_case_sherry_cellar",
      "node_type": "production_case",
      "name": "Original fictional Jerez/Manzanilla production and sales exercise. Grower logs document heat, water status and grape health. Separate first and later press fractions are classified by trial; the lighter candidate is assigned to a flor-directed plan and the more structured candidate to an oxidative plan. A Sanlúcar bodega's supplied temperature and humidity records differ from another cellar. A mature solera withdrawal proposal exceeds the producer's replenishment budget. The buyer requests dry wines but a draft lists Oloroso, Amontillado and Palo Cortado as automatically sweet because they are dark. Naturally sweet PX and a blended Cream are separate offers. All observations, volumes, budgets and offers are fictional, not legal standards. Evaluate production, stock and customer fit."
    },
    {
      "id": "n_d456_sherry_cellar_action_point",
      "node_type": "learning_point",
      "name": "Retain trial-based dry and sweet routes separately and limit withdrawals to a documented replenishment and cash plan."
    },
    {
      "id": "n_d456_sherry_cellar_reason_point",
      "node_type": "learning_point",
      "name": "Press-fraction, flor and oxidative records help explain different styles; colour alone cannot establish sweetness."
    },
    {
      "id": "n_d456_sherry_cellar_tradeoff_point",
      "node_type": "learning_point",
      "name": "Mature releases can meet demand but drawing too much without suitable refresh stock threatens the continuing blend and finances."
    },
    {
      "id": "n_d456_sherry_cellar_limitation_point",
      "node_type": "learning_point",
      "name": "Verify sensory and sugar evidence, cellar health, category approval, actual withdrawal/refresh capacity and costed sales before commitment."
    },
    {
      "id": "n_d456_case_port_extraction_stock",
      "node_type": "production_case",
      "name": "Original fictional Port production and portfolio exercise. Two Douro parcels have different rainfall, water-status, access and harvest-ripeness logs. A short pre-fortification fermentation requires extraction choices suited to its fruit. A robotic-treading pilot and a hand-treading pilot have comparable panel outcomes but different quoted labour and equipment costs. Youthful ruby, longer wood-held tawny, LBV, Vintage and Colheita release proposals have different actual storage, bottling and cash schedules. A white lot was fermented longer for a drier slot. All trial outcomes, costs and timings are invented; no declaration or category approval is supplied. A buyer ranks all dated wines as equivalent and assumes hand work always tastes better. Design a conditional allocation."
    },
    {
      "id": "n_d456_port_extraction_stock_action_point",
      "node_type": "learning_point",
      "name": "Select the tested extraction route using actual costs and allocate distinct release styles only after category and cash checks."
    },
    {
      "id": "n_d456_port_extraction_stock_reason_point",
      "node_type": "learning_point",
      "name": "The short extraction window, actual parcel fruit and comparable pilots matter; the shared harvest year does not make wood and bottle routes equivalent."
    },
    {
      "id": "n_d456_port_extraction_stock_tradeoff_point",
      "node_type": "learning_point",
      "name": "Labour and equipment have different cash demands; long-held wood stock and future bottle development serve different release objectives."
    },
    {
      "id": "n_d456_port_extraction_stock_limitation_point",
      "node_type": "learning_point",
      "name": "Confirm spirit and fermentation records, authentic approvals, usable yield, storage and repeat panel/market evidence; no method guarantees superiority."
    },
    {
      "id": "n_d456_case_madeira_working_capital",
      "node_type": "production_case",
      "name": "Original fictional Madeira site-to-release exercise. Fragmented steep parcels supply measured crew-hours, water-delivery and grape-health records. A Tinta Negra lot has a tested medium-sweet brief; separately documented Sercial, Verdelho, Boal and Malvasia lots support different actual sweetness slots. An estufagem trial needs controlled heating and a finishing/stability review. A canteiro proposal uses wood and a longer producer-planned holding period. Neither programme has complete category approval. A supplier says canteiro must always be more profitable and that every bottle bearing a grape name has the same sweetness. A prepaid tourist-retail pilot and a later export order compete for limited cash. All observations, schedules and offers are invented. Evaluate a conditional plan."
    },
    {
      "id": "n_d456_madeira_working_capital_action_point",
      "node_type": "learning_point",
      "name": "Budget actual parcel labour and water, trial the specified sweetness slots, and release only funded, compliant finished lots."
    },
    {
      "id": "n_d456_madeira_working_capital_reason_point",
      "node_type": "learning_point",
      "name": "Documented fruit and fortification/heat/wood choices explain candidate differences; the tasting and records establish each actual bottle's fit."
    },
    {
      "id": "n_d456_madeira_working_capital_tradeoff_point",
      "node_type": "learning_point",
      "name": "Longer holding and losses need finance; the stated tourist prepayment brings receipts earlier, but compare the actual staffing, selling and export duties and costs for both offers before selecting a route."
    },
    {
      "id": "n_d456_madeira_working_capital_limitation_point",
      "node_type": "learning_point",
      "name": "Check cultivar/category provenance, actual sugar and sensory results, stability, approved release timing and total realised costs before any profit claim."
    },
    {
      "id": "n_d456_case_vdn_style_stock",
      "node_type": "production_case",
      "name": "Original fictional VDN comparison. Muscat de Rivesaltes and Muscat de Frontignan supplier lots have aromatic-fruit trials; Grenache-led Maury, Banyuls and Rivesaltes lots have different skin-contact, fortification and oxygen/wood records. A steep Banyuls parcel's log records more harvest labour than an accessible parcel that season. Youthful protected-from-oxygen A fits a fresh-fruit dessert brief; oxidative B fits a developed dried-fruit brief. These observations, comparisons, staffing and offers are invented, not appellation-wide norms. A buyer proposes giving every VDN the same price and using any Maury bottle as a dry still wine. An older release needs extra stock finance. Evaluate production and route choices."
    },
    {
      "id": "n_d456_vdn_style_stock_action_point",
      "node_type": "learning_point",
      "name": "Keep fresh and developed style slots separate, authenticate the sweet/fortified product records, and price actual costs and demand."
    },
    {
      "id": "n_d456_vdn_style_stock_reason_point",
      "node_type": "learning_point",
      "name": "Fortification, skin contact and recorded oxygen exposure help explain the supplied wines; a name alone does not settle sweet versus dry product identity."
    },
    {
      "id": "n_d456_vdn_style_stock_tradeoff_point",
      "node_type": "learning_point",
      "name": "Steep-parcel labour and mature-stock holding may raise costs, while a youthful offer can serve another brief and sales timetable."
    },
    {
      "id": "n_d456_vdn_style_stock_limitation_point",
      "node_type": "learning_point",
      "name": "Verify actual product approvals, grape/fortification records, sensory and sugar evidence, stock finance and buyer uptake; no universal price follows from VDN."
    },
    {
      "id": "n_d456_case_rutherglen_replenishment",
      "node_type": "production_case",
      "name": "Original fictional Rutherglen Muscat exercise. Brown Muscat parcels supply actual heat, water-status, late-ripeness and bunch-health logs. Fermentation/fortification records and separate cask stocks are available. Bench trial A adds a measured younger parcel to a mature component and fits the requested freshness/concentration balance; B maximises the old component and is too heavy for that brief. The old stock is limited and the producer has no funded replacement plan. A merchant wants a large discount; cellar-door guests have only sampled small pours. Proposed classification tier and reference-age records are incomplete. All observations, ratios, stock and offers are invented rather than a producer recipe. Plan a conditional blend and sales release."
    },
    {
      "id": "n_d456_rutherglen_replenishment_action_point",
      "node_type": "learning_point",
      "name": "Pilot A with authenticated category and replenishment records and scale sales to funded stocks."
    },
    {
      "id": "n_d456_rutherglen_replenishment_reason_point",
      "node_type": "learning_point",
      "name": "Actual bench evidence supports this balance; the age or concentration of one component cannot prove the blended wine's quality."
    },
    {
      "id": "n_d456_rutherglen_replenishment_tradeoff_point",
      "node_type": "learning_point",
      "name": "Using more old stock spends scarce future blending capacity, while younger refresh may preserve balance but requires sound consistent supply."
    },
    {
      "id": "n_d456_rutherglen_replenishment_limitation_point",
      "node_type": "learning_point",
      "name": "Check repeat blend/stability results, tier approval, spirit and stock records, full costs and actual repeat buying before expansion."
    }
  ],
