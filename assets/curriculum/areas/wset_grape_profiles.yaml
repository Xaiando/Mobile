    domain_id: tasting
    assertion_text: Verdicchio includes fresh youthful wines and more structured Riserva examples capable of
      developing additional complexity with age.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_grape_cortese_variation
    subject_id: n_wset_grape_principle_cortese_variation
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_grape_point_cortese_variation
    domain_id: tasting
    assertion_text: Gavi Cortese ranges from fresh fruit-and-flower styles to fuller Riserva wines with developed
      complexity; maturation changes expression without changing the variety.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_grape_garganega_variation
    subject_id: n_wset_grape_principle_garganega_variation
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_grape_point_garganega_variation
    domain_id: tasting
    assertion_text: Garganega is associated with dry Soave and dried-grape sweet Recioto di Soave; fruit drying
      and fermentation choices change concentration and sweetness.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_grape_fiano_variation
    subject_id: n_wset_grape_principle_fiano_variation
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_grape_point_fiano_variation
    domain_id: tasting
    assertion_text: Fiano can retain flowers and fresh fruit in steel or gain greater weight from oak; bottle
      evolution can develop honey, wax or nutty notes.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_grape_albarino_variation
    subject_id: n_wset_grape_principle_albarino_variation
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_grape_point_albarino_variation
    domain_id: tasting
    assertion_text: Rías Baixas producers can retain acidity or use malolactic conversion for a rounder style;
      lees contact and selected oak use also change Albariño texture.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_grape_furmint_variation
    subject_id: n_wset_grape_principle_furmint_variation
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_grape_point_furmint_variation
    domain_id: tasting
    assertion_text: Furmint can be dry, oak-influenced or made into concentrated sweet Tokaj wines; high acidity
      can balance residual sugar in sweeter styles.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_grape_zinfandel_identity
    subject_id: n_wset_grape_principle_zinfandel_identity
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_grape_point_zinfandel_identity
    domain_id: tasting
    assertion_text: UC Davis DNA work identifies Zinfandel and Primitivo as the same grape variety, although
      clones can show differences in vineyard performance and wine character.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_grape_descriptor_context
    subject_id: n_wset_grape_principle_descriptor_context
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_grape_point_descriptor_context
    domain_id: tasting
    assertion_text: "A grape name is a starting point for a wine profile: site, ripeness, blending and winemaking
      can change body, acidity, tannin and aroma, so profiles describe tendencies."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
