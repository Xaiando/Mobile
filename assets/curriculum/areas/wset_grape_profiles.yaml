knowledge_items:
  - id: ki_wset_grape_chardonnay_beginner
    subject_id: n_wset_grape_principle_chardonnay_beginner
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_grape_point_chardonnay_beginner
    domain_id: tasting
    assertion_text: Chardonnay produces white wines ranging from fresh, lighter examples to fuller wines with ripe
      fruit; oak influence depends on winemaking.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_grape_sauvignon_blanc_beginner
    subject_id: n_wset_grape_principle_sauvignon_blanc_beginner
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_grape_point_sauvignon_blanc_beginner
    domain_id: tasting
    assertion_text: Sauvignon Blanc commonly makes aromatic, high-acid white wine; citrus, green fruit and herbs
      can occur, with riper tropical fruit in some examples.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_grape_pinot_gris_beginner
    subject_id: n_wset_grape_principle_pinot_gris_beginner
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_grape_point_pinot_gris_beginner
    domain_id: tasting
    assertion_text: Pinot Grigio and Pinot Gris name the same variety. Familiar Italian examples are often fresh
      and fruity, while Alsace examples can be richer and fuller.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_grape_riesling_beginner
    subject_id: n_wset_grape_principle_riesling_beginner
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_grape_point_riesling_beginner
    domain_id: tasting
    assertion_text: Riesling commonly makes light- to medium-bodied, high-acid white wine with citrus aromas. It
      can be dry, off-dry or sweet.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_grape_cabernet_sauvignon_beginner
    subject_id: n_wset_grape_principle_cabernet_sauvignon_beginner
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_grape_point_cabernet_sauvignon_beginner
    domain_id: tasting
    assertion_text: Cabernet Sauvignon commonly gives medium- to full-bodied red wine with black-fruit aromas and
      noticeable tannic structure; ripeness and region affect the balance.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_grape_merlot_beginner
    subject_id: n_wset_grape_principle_merlot_beginner
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_grape_point_merlot_beginner
    domain_id: tasting
    assertion_text: Merlot commonly makes red wine with plum or cherry fruit and a rounded texture; examples range
      from lighter wines to dense, structured styles.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_grape_pinot_noir_beginner
    subject_id: n_wset_grape_principle_pinot_noir_beginner
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_grape_point_pinot_noir_beginner
    domain_id: tasting
    assertion_text: Pinot Noir commonly makes light- to medium-bodied red wine with cherry or strawberry aromas.
      Extraction, ripeness and maturation change its structure.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_grape_syrah_beginner
    subject_id: n_wset_grape_principle_syrah_beginner
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_grape_point_syrah_beginner
    domain_id: tasting
    assertion_text: Syrah and Shiraz are names for the same black grape. Wines can show dark fruit and pepper or
      spice, with body varying by region and method.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_grape_chardonnay_profile
    subject_id: n_wset_grape_principle_chardonnay_profile
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_grape_point_chardonnay_profile
    domain_id: tasting
    assertion_text: Cool-site Chardonnay commonly shows citrus or green fruit and higher acidity; warmer-site
      examples can show riper fruit and fuller body.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_grape_sauvignon_blanc_profile
    subject_id: n_wset_grape_principle_sauvignon_blanc_profile
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_grape_point_sauvignon_blanc_profile
    domain_id: tasting
    assertion_text: Cooler New Zealand Sauvignon Blanc often combines high acidity with gooseberry or capsicum;
      warmer-site examples may be fuller and show melon or stone fruit.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_grape_pinot_gris_profile
    subject_id: n_wset_grape_principle_pinot_gris_profile
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_grape_point_pinot_gris_profile
    domain_id: tasting
    assertion_text: Fresh northeastern Italian Pinot Grigio contrasts with fuller Alsace Pinot Gris, which can
      show dried apricot, honey, smoky or spicy notes.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_grape_riesling_profile
    subject_id: n_wset_grape_principle_riesling_profile
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_grape_point_riesling_profile
    domain_id: tasting
    assertion_text: Australian Riesling commonly has high acidity and lemon or lime aromas; a dry wine need not
      taste sweet despite its fruit intensity.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_grape_cabernet_sauvignon_profile
    subject_id: n_wset_grape_principle_cabernet_sauvignon_profile
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_grape_point_cabernet_sauvignon_profile
    domain_id: tasting
    assertion_text: Coonawarra Cabernet commonly combines blackcurrant or plum with firm tannins; Margaret River
      examples can show blackcurrant, cedar and violet.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_grape_merlot_profile
    subject_id: n_wset_grape_principle_merlot_profile
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_grape_point_merlot_profile
    domain_id: tasting
    assertion_text: Bordeaux Merlot commonly combines moderate acidity with cherry, plum or fig and supple
      texture; greater concentration can support a powerful ageworthy style.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_grape_pinot_noir_profile
    subject_id: n_wset_grape_principle_pinot_noir_profile
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_grape_point_pinot_noir_profile
    domain_id: tasting
    assertion_text: Cool Australian Pinot Noir commonly shows cherry or strawberry and a light to medium body;
      site and winemaking affect flavour concentration and texture.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_grape_syrah_profile
    subject_id: n_wset_grape_principle_syrah_profile
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_grape_point_syrah_profile
    domain_id: tasting
    assertion_text: Shiraz body varies from medium to full; warm Barossa examples can show blackberry and spice,
      while other regions give less weight or more savoury character.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_grape_gamay_profile
    subject_id: n_wset_grape_principle_gamay_profile
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_grape_point_gamay_profile
    domain_id: tasting
    assertion_text: Beaujolais Gamay commonly shows red fruit, freshness and delicate tannin; some sites produce
      more structured examples.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T12:00:00.000Z
  - id: ki_wset_grape_grenache_profile
    subject_id: n_wset_grape_principle_grenache_profile
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_grape_point_grenache_profile
