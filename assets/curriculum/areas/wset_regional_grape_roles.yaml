knowledge_items:
  - id: ki_wset_role_dornfelder_style
    subject_id: n_wset_role_principle_dornfelder_style
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_role_point_dornfelder_style
    domain_id: geography
    assertion_text: Dornfelder is important in Rheinhessen and the Pfalz. Its deeply coloured reds may
      emphasise sour-cherry and dark-berry fruit for young drinking, or use wood maturation for a
      more structured expression. It is commonly dry but other sweetness levels occur; colour alone
      does not establish quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_role_dornfelder_vine
    subject_id: n_wset_role_principle_dornfelder_vine
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_role_point_dornfelder_vine
    domain_id: geography
    assertion_text: Dornfelder can crop heavily, so growers balance fruit load with ripening rather than
      equating high yield with a fixed quality result. Loose bunches reduce rot susceptibility, but
      frost-prone sites remain a concern. These vineyard decisions help explain variation beyond its
      dark colour.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_role_welschriesling_dry
    subject_id: n_wset_role_principle_welschriesling_dry
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_role_point_welschriesling_dry
    domain_id: geography
    assertion_text: Welschriesling is a separate grape from Rhine Riesling. In Austria it can make fresh
      dry whites with green-apple and citrus impressions and marked acidity; that acidity also
      supports blends and sparkling bases. A similar grape name does not imply Riesling’s complete
      aromatic or ageing profile.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_role_welschriesling_sweet
    subject_id: n_wset_role_principle_welschriesling_sweet
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_role_point_welschriesling_sweet
    domain_id: geography
    assertion_text: Late-harvest Welschriesling in Burgenland can make concentrated sweet wines while
      retaining useful acidity. The harvest condition and sweet-wine route differ from a fresh
      early-drinking dry example. Appropriate ripe or botrytised fruit and cellar decisions are
      needed; the variety name alone does not prove sweetness.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_role_saint_laurent
    subject_id: n_wset_role_principle_saint_laurent
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_role_point_saint_laurent
    domain_id: geography
    assertion_text: Saint Laurent, called Sankt Laurent in Austria, is associated particularly with the
      Thermenregion. It can bring berry, morello-cherry and plum aromas with velvety tannins to
      varietal wines or blends. Demanding vineyard cultivation makes careful management important;
      it should not simply be labelled Pinot Noir.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_role_arinto
    subject_id: n_wset_role_principle_arinto
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_role_point_arinto
    domain_id: geography
    assertion_text: Arinto, called Pedernã in Vinho Verde, is valued for marked acidity and restrained
      apple and citrus aromas. It is important at Bucelas and can add freshness to warmer Alentejo
      or Tejo blends. Its contribution explains a blend’s balance without requiring every Arinto
      wine to be light or unoaked.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_role_alfrocheiro
    subject_id: n_wset_role_principle_alfrocheiro
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_role_point_alfrocheiro
    domain_id: geography
    assertion_text: Alfrocheiro is associated with Dão and has spread to southern Portuguese regions. It
      can retain useful acidity in warm conditions while contributing colour, firm ripe tannins and
      berry fruit. Vigorous growth and susceptibility to powdery mildew and botrytis mean that
      vineyard management still affects the healthy fruit available.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_role_jaen_identity
    subject_id: n_wset_role_principle_jaen_identity
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_role_point_jaen_identity
    domain_id: geography
    assertion_text: Portugal’s IVV identifies Jaen as traditionally grown in Dão and lists Mencía in
      Spain as its synonym. Use that identified grape when comparing Dão blends with Spanish Mencía
      wines. A shared identity does not make regional styles identical, and it does not identify
      every unrelated legal entry containing Jaén.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_role_jaen_blend
    subject_id: n_wset_role_principle_jaen_blend
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_role_point_jaen_blend
    domain_id: geography
    assertion_text: Jaen can contribute perfume and a softer, moderate structural expression alongside
      Touriga Nacional and Alfrocheiro in Dão. IVV describes early ripening and relatively low
      acidity, so ripeness, grape proportions and the other varieties matter to balance. Its
      blending role is more informative than assuming every Dão red is pure Touriga Nacional.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_role_trincadeira_style
    subject_id: n_wset_role_principle_trincadeira_style
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_role_point_trincadeira_style
    domain_id: geography
    assertion_text: Trincadeira, called Tinta Amarela in the Douro, can bring colour, acidity and
      raspberry, herbal or spicy complexity when ripe. It is an important Alentejo blending variety.
      Under-ripe fruit may be overtly herbaceous, so the grape’s inclusion alone does not establish
      a balanced finished wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_role_trincadeira_vine
    subject_id: n_wset_role_principle_trincadeira_vine
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_role_point_trincadeira_vine
    domain_id: geography
    assertion_text: Trincadeira grows vigorous foliage and is sensitive to rot and other vineyard
      diseases. Hot, dry Alentejo and Tejo conditions reduce some wet-season disease pressures,
      while canopy control helps healthy ripening. These mechanisms explain its regional suitability
      without claiming that dry heat eliminates disease or that every year gives the same crop.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_role_bonarda_identity
    subject_id: n_wset_role_principle_bonarda_identity
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_role_point_bonarda_identity
    domain_id: geography
    assertion_text: Argentina’s Bonarda is the Corbeau/Douce Noir variety, also called Charbono, rather
      than the different Italian grape names that caused the confusion. Use the qualified Argentine
      identity when studying its wines; the word Bonarda by itself is insufficient for a
      cross-country grape comparison.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_role_bonarda_style
    subject_id: n_wset_role_principle_bonarda_style
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_role_point_bonarda_style
    domain_id: geography
    assertion_text: Bonarda is important in warm, dry Mendoza and San Juan, where it can produce
      approachable fruity reds and useful blending fruit. It also appears in more concentrated or
      fresher producer-selected styles. Vineyard source, harvest and cellar choices should explain
      that range instead of treating it as a lesser Malbec.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_role_petit_verdot
    subject_id: n_wset_role_principle_petit_verdot
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_role_point_petit_verdot
    domain_id: geography
    assertion_text: Petit Verdot is a late-ripening Bordeaux grape that can contribute deep colour, firm
      tannins and spicy aromatic depth even at a small proportion in a blend. A suitable warm season
      and site help it ripen. Using more does not automatically improve balance; the contribution
      must suit the other components.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_role_graciano
    subject_id: n_wset_role_principle_graciano
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_role_point_graciano
    domain_id: geography
    assertion_text: Graciano can contribute pronounced acidity, colour, tannin and aromatic intensity to
      Rioja red blends. It ripens late, so site warmth and season matter. Its contribution can
      support a structured wine’s development, but successful ageing still depends on ripe fruit,
      balance and cellar handling.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_role_mazuelo
    subject_id: n_wset_role_principle_mazuelo
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_role_point_mazuelo
    domain_id: geography
    assertion_text: Mazuelo is the Rioja name for Carignan. It can supply substantial acidity, tannin
      and stable colour to a red blend. A small structural addition may complement Tempranillo’s
      fruit, but extraction and proportions must preserve balance; legal authorisation alone does
      not demonstrate that contribution in every bottle.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_role_sarga_muskotaly
    subject_id: n_wset_role_principle_sarga_muskotaly
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_role_point_sarga_muskotaly
    domain_id: geography
    assertion_text: Sárga Muskotály is Muscat Blanc à Petits Grains in Tokaj. Its pronounced varietal
      perfume can add aromatic character to late-harvest or Aszú wines alongside Furmint and
      Hárslevelű. The sweet route depends on fruit selection and production; an aromatic grape name
      alone is not proof of residual sugar.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_role_blaufrankisch
    subject_id: n_wset_role_principle_blaufrankisch
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_role_point_blaufrankisch
    domain_id: geography
    assertion_text: Blaufränkisch is important in Burgenland, including Mittelburgenland, Leithaberg and
      Eisenberg. Its late ripening benefits from a suitable warm season; dark-berry and spicy wines
      can retain distinct acidity and firm tannins. Site and maturation affect the resulting
      balance, rather than a single fixed style following the grape name.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_role_zweigelt
    subject_id: n_wset_role_principle_zweigelt
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_role_point_zweigelt
    domain_id: geography
    assertion_text: Zweigelt is an Austrian crossing of Blaufränkisch and Sankt Laurent. It can make
      fresh cherry-fruited reds with a round palate or more structured, wood-matured examples, and
      it is useful in blends. The parents identify the crossing; they do not force a single flavour,
      tannin level or maturation choice.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_role_saumur_champigny_identity
    subject_id: n_wset_role_principle_saumur_champigny_identity
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_role_point_saumur_champigny_identity
    domain_id: geography
    assertion_text: Saumur-Champigny is a still red Loire origin associated with Cabernet Franc. Fruit,
      floral impressions, freshness and a fine tannin texture are useful style tendencies. The
      Champigny name should not be substituted for Chenin-based Saumur whites or Saumur sparkling;
      related geography does not make their grape and production routes identical.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_role_saumur_champigny_cellar
    subject_id: n_wset_role_principle_saumur_champigny_cellar
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_role_point_saumur_champigny_cellar
    domain_id: geography
    assertion_text: For Saumur-Champigny Cabernet Franc, extraction should match the ripeness and
      desired tannin texture. A young fruit-led release and a selected wine kept longer for
      development pursue different objectives. Longer storage uses space and capital; it does not
      guarantee better quality, and freshness, ripeness and balance must be assessed in the actual
      wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_role_friuli_identity
    subject_id: n_wset_role_principle_friuli_identity
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_role_point_friuli_identity
    domain_id: geography
    assertion_text: Friuli Colli Orientali is a northeastern Italian DOC distinct from Friuli Grave and
      Collio. Its white range includes Pinot Grigio, Sauvignon Blanc, Chardonnay and Friulano, so
      the origin should not be reduced to one international grape. Read the complete origin and
      grape to distinguish these styles.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_role_friuli_white_styles
    subject_id: n_wset_role_principle_friuli_white_styles
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_role_point_friuli_white_styles
    domain_id: geography
    assertion_text: Friuli Colli Orientali Pinot Grigio can be a dry white with body, or acquire a
      copper tint through skin contact. Friulano often shows restrained floral or apple notes, a
      rounded texture, moderate acidity and an almond-like finish. These are comparison tendencies,
      not compulsory aromas for every producer or vintage.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_role_friuli_cellar_cost
    subject_id: n_wset_role_principle_friuli_cellar_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_role_point_friuli_cellar_cost
    domain_id: geography
    assertion_text: A Friuli Colli Orientali Friulano example at La Viarte is fermented in
      temperature-controlled steel and matured on fine lees. Such a route can preserve fruit while
      influencing texture without requiring new-oak flavour. Fine-lees handling and storage use
      resources; the regional name alone establishes neither a fixed oak treatment nor a retail
      price.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_role_castilla_igp_identity
    subject_id: n_wset_role_principle_castilla_igp_identity
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_role_point_castilla_igp_identity
    domain_id: geography
    assertion_text: Vino de la Tierra de Castilla y León is a protected geographical indication covering
      the broader autonomous region. It is distinct from narrower DO labels such as Ribera del Duero
      or Toro. Read IGP origin separately from grape, colour, sweetness and oak treatment; the
      category is not a tasting score.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_role_castilla_environment
    subject_id: n_wset_role_principle_castilla_environment
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_role_point_castilla_environment
    domain_id: geography
    assertion_text: "Much of Castilla y León is a high inland plateau with continental Mediterranean
      conditions: cold winters, warm dry summers and late-frost risk. Site elevation and day–night
      differences affect ripening, while limited rainfall makes water supply important. The broad
      IGP spans varied sites, so these mechanisms should not erase local differences such as
      Bierzo’s Atlantic influence."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_role_castilla_styles
    subject_id: n_wset_role_principle_castilla_styles
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_role_point_castilla_styles
    domain_id: geography
    assertion_text: Castilla y León IGP includes white, rosé and red wines made from different
      authorised grapes; it is not a synonym for Tempranillo red. Fruit-preserving white production,
      skin extraction for reds and optional wood maturation pursue different styles. Wood and
      storage can increase costs, while the broad origin label alone proves neither an oak route nor
      a quality ranking.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
