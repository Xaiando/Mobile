    name: Kremstal combines Pannonian warmth, northern cooling and Danube moderation
  - id: n_reg_ah_point_kremstal_water
    node_type: learning_point
    name: Kremstal’s documented soil profiles differ in water-holding capacity
  - id: n_reg_ah_principle_kamptal
    node_type: production_principle
    name: Which climatic and soil differences should a Kamptal site comparison examine?
  - id: n_reg_ah_point_kamptal_climate
