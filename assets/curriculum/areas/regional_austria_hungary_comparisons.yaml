  - id: n_reg_ah_principle_wachau
    node_type: production_principle
    name: How do Wachau air movements and terrace maintenance explain growing conditions and production
      effort?
  - id: n_reg_ah_point_wachau_air
    node_type: learning_point
    name: Wachau combines warm eastern air with cooler forest-valley currents
  - id: n_reg_ah_point_wachau_walls
