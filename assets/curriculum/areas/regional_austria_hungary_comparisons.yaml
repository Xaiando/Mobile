knowledge_items:
  - id: ki_reg_ah_wachau_air
    subject_id: n_reg_ah_principle_wachau
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ah_point_wachau_air
    domain_id: geography
    assertion_text: Wachau receives warm Pannonian influence from the east and cooler, wetter air
      descending through forested valleys from the Waldviertel and Dunkelsteinerwald. These
      interacting currents explain local variation; an eastern or western address alone does not
      establish a plot’s ripeness.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_wachau_walls
    subject_id: n_reg_ah_principle_wachau
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ah_point_wachau_walls
    domain_id: viticulture
    assertion_text: Wachau’s dry-stone terraces retain soil on slopes and help limit erosion.
      Construction and upkeep require skilled labour and suitable stones, adding operational demands
      that differ from easier-access flat sites; maintenance expense does not itself prove a
      better-tasting wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_kremstal_air
    subject_id: n_reg_ah_principle_kremstal
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ah_point_kremstal_air
    domain_id: geography
    assertion_text: Kremstal often warms rapidly by day while cooler Waldviertel air contributes to
      night cooling. The Danube moderates temperature, cooling in summer and releasing heat as
      conditions turn cold. These influences can aid ripening with acid retention, without
      eliminating frost or vintage variation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_kremstal_water
    subject_id: n_reg_ah_principle_kremstal
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ah_point_kremstal_water
    domain_id: viticulture
    assertion_text: The Kremstal committee describes deep silty loess at Frechau–Sandgrube as strongly
      water-retentive, whereas the shallow, stony Grillenparz profile is prone to summer drought.
      These named profiles show why rooting depth and water storage need assessment beyond one
      regional geology label.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_kamptal_climate
    subject_id: n_reg_ah_principle_kamptal
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ah_point_kamptal_climate
    domain_id: geography
    assertion_text: Kamptal combines hot, dry Pannonian influence arriving through the Danube corridor
      with cooler influence from the northwestern Waldviertel. Warm summer days, cooler nights and a
      potentially long autumn frame ripening, rather than setting one compulsory harvest date.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_kamptal_soils
    subject_id: n_reg_ah_principle_kamptal
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ah_point_kamptal_soils
    domain_id: viticulture
    assertion_text: Kamptal’s hill soils include brown earth over gneiss with variable depth; loess and
      clay-rich loam occur in other settings, including beside the Kamp. A vineyard assessment
      should distinguish profile depth and texture, rather than infer a wine’s flavour or quality
      from the rock name.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_weinviertel_sites
    subject_id: n_reg_ah_principle_weinviertel
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ah_point_weinviertel_sites
    domain_id: geography
    assertion_text: Around Retz, the eastern flank of the Manhartsberg creates a rain-shadow setting.
      Southeastern Weinviertel receives stronger Pannonian warmth from the south and southeast.
      These local contrasts qualify a single warm, dry regional description and require
      site-specific weather and water assessment.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_weinviertel_gv
    subject_id: n_reg_ah_principle_weinviertel
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ah_point_weinviertel_gv
    domain_id: viticulture
    assertion_text: Grüner Veltliner is Weinviertel’s central grape association, with peppery and fruity
      expressions across lighter and fuller styles. Its relatively late ripening makes suitable
      autumn conditions relevant; the variety or regional name alone does not establish final body,
      maturity or sweetness.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_mittel_water
    subject_id: n_reg_ah_principle_burgenland_red_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ah_point_mittel_water
    domain_id: viticulture
    assertion_text: Mittelburgenland’s surrounding hills shelter a landscape open to eastern Pannonian
      influence. Deep, heavy loam can store water for its important Blaufränkisch vineyards, while
      sand and other local variations remain relevant. Water storage is a physical benefit to
      assess, not immunity from drought.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_eisenberg_access
    subject_id: n_reg_ah_principle_burgenland_red_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ah_point_eisenberg_access
    domain_id: business
    assertion_text: Eisenberg includes steep, stony vineyards and narrow plots shaped by repeated
      inheritance division. Growers commonly work these sites by hand, so access and plot shape can
      increase labour demands compared with mechanisable vineyards; a regional cost or quality
      ranking needs actual business evidence.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_leithaberg_climate
    subject_id: n_reg_ah_principle_leithaberg
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ah_point_leithaberg_climate
    domain_id: geography
    assertion_text: Near Leithaberg, Lake Neusiedl acts as a heat store while the wooded ridge
      contributes cooler air, particularly relevant to the autumn ripening setting. Exposure and
      seasonal conditions must still be examined; neither proximity to the lake nor the ridge
      guarantees complete maturity.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_leithaberg_grapes
    subject_id: n_reg_ah_principle_leithaberg
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ah_point_leithaberg_grapes
    domain_id: geography
    assertion_text: Leithaberg associates whites such as Pinot Blanc, Chardonnay, Neuburger and Grüner
      Veltliner with reds centred on Blaufränkisch. These selected associations make grape and
      colour part of any style comparison, alongside site and cellar choices; they are not an
      exhaustive legal permission list.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_neusiedler_botrytis
    subject_id: n_reg_ah_principle_neusiedler_styles
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ah_point_neusiedler_botrytis
    domain_id: geography
    assertion_text: Lake-associated humidity and autumn mist can favour botrytis development around
      Neusiedlersee, helping explain the regional sweet-wine association. Fruit condition and
      subsequent drying weather still distinguish useful noble rot from damaging decay; this
      environment does not guarantee sweet-wine material every year.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_neusiedler_zweigelt
    subject_id: n_reg_ah_principle_neusiedler_styles
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ah_point_neusiedler_zweigelt
    domain_id: winemaking
    assertion_text: Zweigelt is a prominent red-wine association at Neusiedlersee, distinct from its
      sweet white wines. The regional body describes steel and wood among its cellar routes. Vessel
      choice and maturation contribute to style, rather than the lake setting explaining every
      finished wine or making more wood inherently better.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_styria_context
    subject_id: n_reg_ah_principle_south_styria
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ah_point_styria_context
    domain_id: geography
    assertion_text: Sauvignon Blanc is a major Südsteiermark association. Styria’s southern and western
      areas receive relatively high rainfall, with fog, storms and hail also possible. The growing
      setting therefore requires fruit-health and weather assessment as well as ripening assessment;
      regional prestige cannot replace vineyard evidence.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_styria_microclimates
    subject_id: n_reg_ah_principle_south_styria
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ah_point_styria_microclimates
    domain_id: geography
    assertion_text: The regional body describes Kitzeck-Sausal as open towards the Alps with a
      comparatively long growing season. Gamlitz includes warmer sheltered basins as well as exposed
      hills and stream-influenced settings. Compare actual plots and maturity rather than use
      altitude alone or assign one date to all Südsteiermark.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_vienna_joint
    subject_id: n_reg_ah_principle_vienna_field_mix
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ah_point_vienna_joint
    domain_id: winemaking
    assertion_text: Vienna’s traditional Gemischter Satz approach grows different white varieties
      together and harvests and processes them jointly. This creates a combined fruit lot before
      fermentation, a different process from blending separately finished varietal wines; no current
      composition threshold is asserted here.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_vienna_varied
    subject_id: n_reg_ah_principle_vienna_field_mix
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ah_point_vienna_varied
    domain_id: viticulture
    assertion_text: The Wiener Wein account links mixed varieties with different flowering and
      development patterns. Their condition at a joint harvest can therefore vary, requiring an
      assessment of the combined lot and component balance. Diversity spreads some biological
      differences but cannot guarantee a sound crop or balanced wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_tokaj_continental
    subject_id: n_reg_ah_principle_tokaj_climate
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ah_point_tokaj_continental
    domain_id: geography
    assertion_text: Tokaj’s continental setting includes hot, potentially dry summers and cold winters.
      The Zemplén hills shelter some southern slopes from cold northeastern winds. This local
      shelter qualifies the regional description without removing winter, frost or summer water
      risks from every vineyard.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_tokaj_autumn
    subject_id: n_reg_ah_principle_tokaj_climate
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ah_point_tokaj_autumn
    domain_id: viticulture
    assertion_text: Bodrog and Tisza waters and damp lowlands contribute autumn humidity in Tokaj.
      Suitable ripe fruit can develop desirable noble rot when humid conditions are followed by
      sufficient dry weather for shrivelling and concentration; persistent wetness is not
      interchangeable with that sequence.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_tokaj_furmint
    subject_id: n_reg_ah_principle_tokaj_grapes
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ah_point_tokaj_furmint
    domain_id: viticulture
    assertion_text: Furmint is a central Tokaj grape associated with marked acidity and relatively
      restrained varietal perfume, often described through apple, pear or citrus fruit. This makes
      acidity and flavour development relevant to comparisons of dry and sweet expressions; it is
      not a guarantee of one bottle’s balance.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_tokaj_hars
    subject_id: n_reg_ah_principle_tokaj_grapes
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ah_point_tokaj_hars
    domain_id: viticulture
    assertion_text: The regional account describes Hárslevelű as softer and more aromatic than Furmint,
      with floral, linden and honey associations. Its contribution can provide a contrast within
      Tokaj, but maturity, botrytis, proportion and cellar choices remain necessary to explain an
      actual finished wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_tokaj_volcanic
    subject_id: n_reg_ah_principle_tokaj_soils
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ah_point_tokaj_volcanic
    domain_id: geography
    assertion_text: Tokaj includes varied volcanic parent material and weathered tuffs associated with
      brown forest and clay-rich soils. Different weathering, profile development and slope
      positions mean that a single volcanic label cannot describe every growing environment or
      transfer a mineral taste into wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_tokaj_loess
    subject_id: n_reg_ah_principle_tokaj_soils
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ah_point_tokaj_loess
    domain_id: geography
    assertion_text: Loess is important around Tokaj Hill and nearby Tokaj, Tarcal and Bodrogkeresztúr,
      contrasting with other volcanic-derived settings in the region. This is a geographical
      distinction for site investigation, not proof that one soil group always produces a better,
      sweeter or more aromatic wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_tokaj_dry_target
    subject_id: n_reg_ah_principle_tokaj_harvest
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ah_point_tokaj_dry_target
    domain_id: viticulture
    assertion_text: Dry Tokaj production can target ripe, healthy Furmint or Hárslevelű fruit rather
      than wait for the concentrated berries sought for aszú. Harvest timing follows the intended
      style, maturity and health of the lot; dry production does not require a botrytis outcome.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_tokaj_aszu_selection
    subject_id: n_reg_ah_principle_tokaj_harvest
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ah_point_tokaj_aszu_selection
    domain_id: viticulture
    assertion_text: Aszú berries can develop in successive stages within bunches, so workers selectively
      collect suitably shrivelled berries in repeated passes while leaving others to develop. This
      increases selection and labour demands relative to a single ripe-fruit harvest; it does not
      promise useful botrytis or a fixed number of passes.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_tokaj_oak
    subject_id: n_reg_ah_principle_tokaj_maturation
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ah_point_tokaj_oak
    domain_id: winemaking
    assertion_text: Oak-barrel maturation is part of Tokaj’s traditional sweet-wine production context
      and can affect aroma and colour. Oak influence and the wine’s evolving balance require
      assessment; a longer period or stronger oak expression does not automatically improve a given
      wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_tokaj_cellar
    subject_id: n_reg_ah_principle_tokaj_maturation
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ah_point_tokaj_cellar
    domain_id: winemaking
    assertion_text: Tokaj’s traditional underground cellars provide relatively cool, stable conditions
      for storing and maturing wines. That storage environment differs from the effects of oak
      contact itself; maturation still needs wine assessment and cannot be explained solely by
      cellar depth or barrel origin.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_case_vienna_action
    subject_id: n_reg_ah_case_vienna_harvest
    relation_type: CASE_ACTION
    object_id: n_reg_ah_point_case_vienna_action
    domain_id: viticulture
    assertion_text: Assess representative component samples and a combined trial for sugar, acidity, pH,
      flavour and health before fixing the joint harvest. Judge the intended mixed white’s balance
      rather than let the sweetest component alone determine the date.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_case_vienna_reason
    subject_id: n_reg_ah_case_vienna_harvest
    relation_type: CASE_REASON
    object_id: n_reg_ah_point_case_vienna_reason
    domain_id: winemaking
    assertion_text: Different varieties can develop differently, but the planned joint harvest brings
      their fruit into one processed lot. The supplied sweeter component therefore cannot by itself
      describe the combined acidity or flavour readiness of the intended wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_case_vienna_tradeoff
    subject_id: n_reg_ah_case_vienna_harvest
    relation_type: CASE_TRADEOFF
    object_id: n_reg_ah_point_case_vienna_tradeoff
    domain_id: business
    assertion_text: The combined trial and extra measurements use staff time but can reduce the risk of
      selecting an unsuitable date from one component. Waiting for less-developed fruit may change
      the sweeter component’s balance or health, so evaluate the compromise with weather and labour
      conditions.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_case_vienna_limitation
    subject_id: n_reg_ah_case_vienna_harvest
    relation_type: CASE_LIMITATION
    object_id: n_reg_ah_point_case_vienna_limitation
    domain_id: viticulture
    assertion_text: The combined lot’s acid, pH and flavour evidence is missing, as is the weather
      outlook. Sound fruit now and one high sugar reading do not establish an optimal date; the
      trial informs this lot rather than a universal rule for every Vienna field mix.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_case_styria_action
    subject_id: n_reg_ah_case_styria_crew
    relation_type: CASE_ACTION
    object_id: n_reg_ah_point_case_styria_action
    domain_id: viticulture
    assertion_text: Prioritise the sampled, ready Gamlitz block in the available hand-harvest window,
      while monitoring health and readiness in Kitzeck-Sausal and planning its next feasible
      operation. Confirm that the supplied forecast and access conditions still hold before
      committing the crew.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_case_styria_reason
    subject_id: n_reg_ah_case_styria_crew
    relation_type: CASE_REASON
    object_id: n_reg_ah_point_case_styria_reason
    domain_id: business
    assertion_text: The case establishes one ready lot and insufficient labour to finish both before
      rain. Steep-site hand work makes crew capacity material. Kitzeck-Sausal’s generally longer
      season provides context, but the actual sample results, rather than a regional calendar,
      justify this priority.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_case_styria_tradeoff
    subject_id: n_reg_ah_case_styria_crew
    relation_type: CASE_TRADEOFF
    object_id: n_reg_ah_point_case_styria_tradeoff
    domain_id: viticulture
    assertion_text: Leaving Kitzeck-Sausal for further development avoids knowingly harvesting it below
      the supplied flavour target, but leaves that fruit exposed to forecast rain and possible
      damage while labour is occupied. The proposed priority manages a constraint rather than
      removing the risk.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_case_styria_limitation
    subject_id: n_reg_ah_case_styria_crew
    relation_type: CASE_LIMITATION
    object_id: n_reg_ah_point_case_styria_limitation
    domain_id: viticulture
    assertion_text: The forecast does not quantify rainfall or its effect on the remaining block, and
      future fruit health and crew availability are unknown. Reassess after conditions change;
      neither regional rainfall nor a longer average season proves that waiting will be safe.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_case_tokaj_selection_action
    subject_id: n_reg_ah_case_tokaj_berry_selection
    relation_type: CASE_ACTION
    object_id: n_reg_ah_point_case_tokaj_selection_action
    domain_id: viticulture
    assertion_text: Use the qualified assessment to distinguish suitable shrivelled berries, healthy
      fruit and damaged fruit, then plan selective collection and separate handling during the
      drying window. Reject the premise that every affected berry belongs in the same sweet-wine
      lot; reassess remaining fruit as conditions change.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_case_tokaj_selection_reason
    subject_id: n_reg_ah_case_tokaj_berry_selection
    relation_type: CASE_REASON
    object_id: n_reg_ah_point_case_tokaj_selection_reason
    domain_id: viticulture
    assertion_text: Humidity can help initiate infection, while sufficient subsequent drying helps
      produce useful shrivelling and concentration. The case explicitly distinguishes desirable
      berries from confirmed damaging decay, so shared river influence cannot make those fruit
      categories interchangeable.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_case_tokaj_selection_tradeoff
    subject_id: n_reg_ah_case_tokaj_berry_selection
    relation_type: CASE_TRADEOFF
    object_id: n_reg_ah_point_case_tokaj_selection_tradeoff
    domain_id: business
    assertion_text: Selection and separate handling require more labour than collecting everything
      together, and uncollected fruit remains exposed to renewed rain. Those costs buy better
      control of fruit suitability for the chosen lot, without guaranteeing that later passes will
      produce additional usable berries.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_case_tokaj_selection_limitation
    subject_id: n_reg_ah_case_tokaj_berry_selection
    relation_type: CASE_LIMITATION
    object_id: n_reg_ah_point_case_tokaj_selection_limitation
    domain_id: viticulture
    assertion_text: The case gives no quantities in each fruit category or confirmed outcome of the
      forecast drying window. These affect staffing and viable lot size. Qualified selection today
      cannot establish a guaranteed yield, a successful later pass or one universal harvest
      schedule.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_case_tokaj_cash_action
    subject_id: n_reg_ah_case_tokaj_maturation_cash
    relation_type: CASE_ACTION
    object_id: n_reg_ah_point_case_tokaj_cash_action
    domain_id: business
    assertion_text: Set review points for the proposed aroma and colour change and prepare a cash
      forecast covering extra storage and staff costs plus delayed buyer receipts. Assess whether
      the optional extension fits the wine target and available cash before committing the full lot.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_case_tokaj_cash_reason
    subject_id: n_reg_ah_case_tokaj_maturation_cash
    relation_type: CASE_REASON
    object_id: n_reg_ah_point_case_tokaj_cash_reason
    domain_id: business
    assertion_text: Further oak contact can change the wine’s expression, while postponing delivery
      postpones buyer payment under the supplied terms. Continuing costs still need cash, so an
      intended sensory change and eventual sale value cannot substitute for a forecast of payment
      timing.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_case_tokaj_cash_tradeoff
    subject_id: n_reg_ah_case_tokaj_maturation_cash
    relation_type: CASE_TRADEOFF
    object_id: n_reg_ah_point_case_tokaj_cash_tradeoff
    domain_id: business
    assertion_text: The extension offers an opportunity to pursue the team’s stated sensory aim, but
      keeps the stock unsold longer and adds costs before buyer receipts. The current wine is
      already balanced, so compare any confirmed benefit with the extra cash commitment rather than
      assume more time adds value.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
  - id: ki_reg_ah_case_tokaj_cash_limitation
    subject_id: n_reg_ah_case_tokaj_maturation_cash
    relation_type: CASE_LIMITATION
    object_id: n_reg_ah_point_case_tokaj_cash_limitation
    domain_id: business
    assertion_text: No later tasting result, committed buyer, price uplift or quantified cash reserve is
      supplied. The forecast can test affordability but cannot prove that the sensory change will be
      better or saleable. This case considers an optional programme, not statutory maturation or
      release requirements.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T10:47:26.822Z"
