    name: Kamptal sits between warmer Pannonian and cooler Waldviertel influences
  - id: n_reg_ah_point_kamptal_soils
    node_type: learning_point
    name: Kamptal includes variable-depth hill soils, loess and riverside loam
  - id: n_reg_ah_principle_weinviertel
    node_type: production_principle
    name: How do Weinviertel’s local climatic contrasts and Grüner Veltliner’s ripening inform regional
      style comparisons?
  - id: n_reg_ah_point_weinviertel_sites
    node_type: learning_point
    name: Retz rain-shadow conditions differ from southeastern Weinviertel exposure
  - id: n_reg_ah_point_weinviertel_gv
    node_type: learning_point
    name: Grüner Veltliner’s late ripening supports a range of Weinviertel styles
  - id: n_reg_ah_principle_burgenland_red_sites
    node_type: production_principle
    name: What contrasts distinguish a Mittelburgenland and Eisenberg Blaufränkisch vineyard explanation?
  - id: n_reg_ah_point_mittel_water
    node_type: learning_point
    name: Mittelburgenland’s sheltered setting and heavy loam affect the growing environment
  - id: n_reg_ah_point_eisenberg_access
    node_type: learning_point
    name: Eisenberg’s narrow steep plots can restrict mechanisation
  - id: n_reg_ah_principle_leithaberg
    node_type: production_principle
    name: How do Leithaberg’s lake-and-forest setting and grape choices qualify a single regional style
      description?
  - id: n_reg_ah_point_leithaberg_climate
    node_type: learning_point
    name: Leithaberg combines lake heat storage with cooling forest-ridge air
  - id: n_reg_ah_point_leithaberg_grapes
    node_type: learning_point
    name: Leithaberg’s selected white grapes and Blaufränkisch require separate comparisons
  - id: n_reg_ah_principle_neusiedler_styles
    node_type: production_principle
    name: Why should Neusiedlersee’s sweet-wine environment and Zweigelt cellar choices be explained
