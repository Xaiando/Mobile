  - id: n_reg_ah_point_neusiedler_botrytis
    node_type: learning_point
    name: Neusiedlersee autumn humidity can favour botrytis-based sweet-wine production
  - id: n_reg_ah_point_neusiedler_zweigelt
    node_type: learning_point
    name: Neusiedlersee Zweigelt can follow different cellar routes
  - id: n_reg_ah_principle_south_styria
    node_type: production_principle
    name: Which within-Südsteiermark conditions matter when comparing Sauvignon Blanc vineyard choices?
  - id: n_reg_ah_point_styria_context
    node_type: learning_point
    name: Südsteiermark’s Sauvignon Blanc context includes relatively wet growing conditions
  - id: n_reg_ah_point_styria_microclimates
    node_type: learning_point
    name: Kitzeck-Sausal’s longer season differs from Gamlitz’s varied sheltered and exposed sites
  - id: n_reg_ah_principle_vienna_field_mix
    node_type: production_principle
    name: How does Vienna’s field-mixed wine connect mixed planting, joint harvest and combined
      processing?
  - id: n_reg_ah_point_vienna_joint
    node_type: learning_point
    name: Vienna’s field-mixed approach combines grapes grown and processed together
  - id: n_reg_ah_point_vienna_varied
    node_type: learning_point
    name: Mixed varieties can differ in seasonal development at the joint harvest
  - id: n_reg_ah_principle_tokaj_climate
    node_type: production_principle
    name: How do Tokaj’s continental setting and autumn humidity create different ripening and noble-rot
      considerations?
  - id: n_reg_ah_point_tokaj_continental
    node_type: learning_point
    name: Tokaj has hot summers and cold winters with local wind shelter
  - id: n_reg_ah_point_tokaj_autumn
    node_type: learning_point
    name: Tokaj noble rot depends on humid infection conditions followed by drying
  - id: n_reg_ah_principle_tokaj_grapes
    node_type: production_principle
    name: How can Furmint and Hárslevelű contribute differently to a Tokaj wine comparison?
  - id: n_reg_ah_point_tokaj_furmint
    node_type: learning_point
    name: Furmint contributes marked acidity with relatively restrained varietal perfume
  - id: n_reg_ah_point_tokaj_hars
    node_type: learning_point
    name: Hárslevelű offers a more aromatic contrast to Furmint
  - id: n_reg_ah_principle_tokaj_soils
    node_type: production_principle
    name: Which two soil settings should a Tokaj geography explanation distinguish without predicting
      mineral flavours?
  - id: n_reg_ah_point_tokaj_volcanic
    node_type: learning_point
    name: Much of Tokaj’s terrain derives from varied weathered volcanic material
  - id: n_reg_ah_point_tokaj_loess
    node_type: learning_point
    name: Tokaj Hill and nearby settlements include significant loess settings
  - id: n_reg_ah_principle_tokaj_harvest
    node_type: production_principle
    name: How do dry-wine fruit targets and selective aszú-berry harvesting differ in Tokaj?
  - id: n_reg_ah_point_tokaj_dry_target
    node_type: learning_point
    name: Dry Tokaj uses a ripe sound-fruit target distinct from aszú selection
  - id: n_reg_ah_point_tokaj_aszu_selection
    node_type: learning_point
    name: Aszú berry development can require repeated selective vineyard passes
  - id: n_reg_ah_principle_tokaj_maturation
    node_type: production_principle
    name: How do oak contact and cellar conditions contribute different explanations of Tokaj maturation?
  - id: n_reg_ah_point_tokaj_oak
    node_type: learning_point
    name: Tokaj oak maturation can affect aroma and colour
  - id: n_reg_ah_point_tokaj_cellar
    node_type: learning_point
    name: Tokaj underground cellars provide relatively stable cool storage conditions
  - id: n_reg_ah_case_vienna_harvest
    node_type: production_case
    name: A Vienna producer plans a joint harvest for a field-mixed white wine. Representative checks
      find that one component is much sweeter than the others, while the combined lot has not yet
      been assessed for acidity, pH or flavour balance. The manager proposes setting the date from
      the sweetest component alone. The fruit is presently sound and the team can make a small
      combined trial. Propose an assessment step, explain its mechanism, and discuss a tradeoff and
      a limitation.
  - id: n_reg_ah_point_case_vienna_action
    node_type: learning_point
    name: Assess the mixed lot and its components before fixing the joint harvest
  - id: n_reg_ah_point_case_vienna_reason
    node_type: learning_point
    name: Jointly processed fruit makes component balance part of the decision
  - id: n_reg_ah_point_case_vienna_tradeoff
    node_type: learning_point
    name: Additional mixed-lot assessment uses time while reducing one-component bias
  - id: n_reg_ah_point_case_vienna_limitation
    node_type: learning_point
    name: The Vienna case lacks the combined balance and forecast needed for a date
  - id: n_reg_ah_case_styria_crew
    node_type: production_case
    name: A Südsteiermark producer has one hand-harvest crew for two Sauvignon Blanc blocks before
      forecast rain. Representative sampling confirms that the Gamlitz block meets the intended
      dry-white balance, while the Kitzeck-Sausal block needs more flavour development. Both blocks
      are sound, steep access prevents substituting a machine, and the crew can finish only one
      block in the available window. Propose a scheduling response, explain why, and discuss a
      tradeoff and a limitation.
  - id: n_reg_ah_point_case_styria_action
    node_type: learning_point
    name: Prioritise the ready Südsteiermark lot while monitoring the less-developed lot
  - id: n_reg_ah_point_case_styria_reason
    node_type: learning_point
    name: Confirmed maturity and restricted labour determine the supplied Styria choice
  - id: n_reg_ah_point_case_styria_tradeoff
    node_type: learning_point
    name: Delaying the less-ready Styria lot preserves development opportunity but leaves exposure
  - id: n_reg_ah_point_case_styria_limitation
    node_type: learning_point
    name: Forecast rainfall does not specify the subsequent condition of the Styria fruit
  - id: n_reg_ah_case_tokaj_berry_selection
    node_type: production_case
    name: A Tokaj grower has ripe fruit containing some suitably shrivelled noble-rot berries, some
      still-healthy berries, and some wet berries with damaging decay confirmed by a qualified
      vineyard assessment. A short drying window is forecast before renewed rain. The manager
      proposes collecting everything together because river humidity supposedly makes every affected
      berry useful for sweet wine. Propose a defensible response, explain the mechanism, and discuss
      a tradeoff and a limitation.
  - id: n_reg_ah_point_case_tokaj_selection_action
    node_type: learning_point
    name: Separate suitability decisions instead of combining all affected Tokaj berries
  - id: n_reg_ah_point_case_tokaj_selection_reason
    node_type: learning_point
    name: Noble-rot usefulness requires fruit condition and drying rather than humidity alone
  - id: n_reg_ah_point_case_tokaj_selection_tradeoff
    node_type: learning_point
    name: Selective Tokaj passes use labour and leave uncollected fruit exposed
  - id: n_reg_ah_point_case_tokaj_selection_limitation
    node_type: learning_point
    name: The Tokaj case gives no volume or future weather outcome for a production plan
  - id: n_reg_ah_case_tokaj_maturation_cash
    node_type: production_case
    name: A Tokaj sweet-wine producer considers an optional extension of the planned oak-maturation
      programme after the wine has already been cleared for release. Current tasting finds the wine
      balanced, but the team wants to assess a further change in aroma and colour. The business must
      pay continuing storage and staff costs, buyers would pay only after delivery, and no buyer has
      committed to the extended programme. Explain a defensible decision process, its rationale, a
      tradeoff and a limitation.
  - id: n_reg_ah_point_case_tokaj_cash_action
    node_type: learning_point
    name: Evaluate the optional Tokaj extension with wine reviews and a cash forecast
  - id: n_reg_ah_point_case_tokaj_cash_reason
    node_type: learning_point
    name: Optional maturation changes both wine exposure and the timing of receipts
  - id: n_reg_ah_point_case_tokaj_cash_tradeoff
    node_type: learning_point
    name: Tokaj’s optional extension may change expression while tying up wine and funds
  - id: n_reg_ah_point_case_tokaj_cash_limitation
    node_type: learning_point
    name: The Tokaj case cannot establish the extension’s sensory or commercial benefit
