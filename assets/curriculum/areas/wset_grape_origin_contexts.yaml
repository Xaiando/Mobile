knowledge_items:
  - id: ki_wset_origin_condrieu_viognier
    subject_id: n_wset_origin_principle_condrieu_viognier
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_origin_point_condrieu_viognier
    domain_id: geography
    assertion_text: Condrieu is a northern Rhône white wine made from Viognier. A typical dry example is
      aromatic, with yellow or stone fruit and a supple, creamy texture; richness does not establish
      sweetness. Viognier used in a Côte-Rôtie red blend is a different wine context.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T20:00:00.000Z
  - id: ki_wset_origin_touraine_sauvignon
    subject_id: n_wset_origin_principle_touraine_sauvignon
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_origin_point_touraine_sauvignon
    domain_id: geography
    assertion_text: "The usual still Touraine blanc study wine is Sauvignon Blanc: dry, fresh and
      aromatic, with citrus, sometimes tropical fruit and floral notes. It differs from Vouvray’s
      Chenin Blanc range. Check the full designation because the wider Touraine area also has other
      wine colours, sparkling wines and named denominations."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T20:00:00.000Z
  - id: ki_wset_origin_provence_grenache
    subject_id: n_wset_origin_principle_provence_grenache
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_origin_point_provence_grenache
    domain_id: geography
    assertion_text: Grenache is a real Côtes de Provence rosé association, including La Londe, where it
      can contribute red-fruit aromas and palate breadth beside Cinsault and other grapes. The usual
      dry Provence rosé is fresh and fruit-led. Direct pressing or brief skin contact controls
      colour and extraction; a fruity aroma does not make it sweet.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T20:00:00.000Z
  - id: ki_wset_origin_rioja_garnacha
    subject_id: n_wset_origin_principle_rioja_garnacha
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_origin_point_rioja_garnacha
    domain_id: geography
    assertion_text: Rioja Garnacha can contribute ripe red fruit or plum, alcohol and a round palate to
      blends, and also appears in varietal wines. Environmental conditions and ripeness affect its
      expression. Tempranillo’s importance in Rioja does not make every Rioja red entirely
      Tempranillo.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T20:00:00.000Z
  - id: ki_wset_origin_priorat_grenache
    subject_id: n_wset_origin_principle_priorat_grenache
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_origin_point_priorat_grenache
    domain_id: geography
    assertion_text: Grenache and Carignan are leading native red grapes in Priorat. Ripe fruit and skin
      maceration can give concentrated flavour and structure; blends, site, extraction and
      maturation create different expressions. The steep vineyard setting helps explain labour,
      while it does not itself establish a fixed alcohol level or quality score.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T20:00:00.000Z
  - id: ki_wset_origin_ribera_tempranillo
    subject_id: n_wset_origin_principle_ribera_tempranillo
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_origin_point_ribera_tempranillo
    domain_id: geography
    assertion_text: Ribera del Duero’s main red grape is Tempranillo, locally called Tinto Fino or Tinta
      del País. It can give deeply coloured reds with blackberry or other dark fruit and structured
      tannin. Fruit maturity, extraction and wood maturation change the result; its elevated
      continental setting is a separate explanation of growing conditions.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T20:00:00.000Z
  - id: ki_wset_origin_stellenbosch_merlot
    subject_id: n_wset_origin_principle_stellenbosch_merlot
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_origin_point_stellenbosch_merlot
    domain_id: geography
    assertion_text: Stellenbosch makes Merlot reds as well as Cabernet-led wines. Meerlust’s 2022 Merlot
      is a documented dry, full-bodied example with plum and dark-cherry fruit, separate parcel
      fermentation and wood maturation. This proves a local grape/style association; it does not
      prescribe the body, blend or barrel treatment of every Stellenbosch Merlot.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T20:00:00.000Z
  - id: ki_wset_origin_western_cape_chardonnay
    subject_id: n_wset_origin_principle_western_cape_chardonnay
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_origin_point_western_cape_chardonnay
    domain_id: geography
    assertion_text: Western Cape Chardonnay includes Robertson, Stellenbosch, Elgin and Walker Bay
      examples. Styles range from fresh fruit-led unoaked wines to richer barrel-influenced wines,
      with lees and malolactic choices also changing texture. De Wetshof’s Robertson Limestone Hill
      uses steel and stirred lees without barrel ageing. Western Cape is a broad origin, so neither
      richness nor oak is guaranteed.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T20:00:00.000Z
  - id: ki_wset_origin_gevrey_pinot
    subject_id: n_wset_origin_principle_gevrey_pinot
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_origin_point_gevrey_pinot
    domain_id: geography
    assertion_text: Gevrey-Chambertin is a Côte de Nuits village appellation for Pinot Noir reds,
      including Premier Cru wines. Site and vinification affect structure and fruit expression.
      Gevrey-Chambertin village/Premier Cru names are distinct from the separate Grand Cru names of
      the commune; the shared grape does not make those origin labels interchangeable.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T20:00:00.000Z
  - id: ki_wset_origin_nuits_pinot
    subject_id: n_wset_origin_principle_nuits_pinot
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_origin_point_nuits_pinot
    domain_id: geography
    assertion_text: Nuits-Saint-Georges is mainly Pinot Noir red in the Côte de Nuits, with some
      Chardonnay white. Its reds can show cherry, strawberry or blackcurrant with substantial
      structure; bottle development can bring earthier aromas and softer texture. The commune and
      vintage vary, so Pinot Noir does not imply a uniformly light red.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T20:00:00.000Z
  - id: ki_wset_origin_beaune_pinot
    subject_id: n_wset_origin_principle_beaune_pinot
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_origin_point_beaune_pinot
    domain_id: geography
    assertion_text: "Beaune in the Côte de Beaune makes Pinot Noir reds and Chardonnay whites. The Pinot
      Noir study examples can combine red or dark fruit with a defined tannin structure, and gain
      developed aromas with age. Read colour and the full appellation: Côte de Beaune’s reputation
      for Chardonnay does not turn a red Beaune into a white wine."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T20:00:00.000Z
  - id: ki_wset_origin_pommard_pinot
    subject_id: n_wset_origin_principle_pommard_pinot
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_origin_point_pommard_pinot
    domain_id: geography
    assertion_text: Pommard is a Côte de Beaune Pinot Noir red origin. Berry or plum fruit and firm,
      sometimes chewy tannin make it a useful structured Pinot comparison; age can soften texture
      and add leather-like or spicy development. Plot, vintage and vinification vary, so the name is
      not a guarantee of identical weight in every wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T20:00:00.000Z
  - id: ki_wset_origin_meursault_chardonnay
    subject_id: n_wset_origin_principle_meursault_chardonnay
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_origin_point_meursault_chardonnay
    domain_id: geography
    assertion_text: White Meursault is Chardonnay from the Côte de Beaune. It can show citrus, floral
      and nutty or buttery notes with a rich texture balanced by freshness; fruit ripeness and
      cellar choices influence those impressions. Meursault also makes a small amount of Pinot Noir
      red, so check the colour rather than assume every bottle is white.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T20:00:00.000Z
  - id: ki_wset_origin_puligny_chardonnay
    subject_id: n_wset_origin_principle_puligny_chardonnay
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_origin_point_puligny_chardonnay
    domain_id: geography
    assertion_text: White Puligny-Montrachet is a Chardonnay wine of the Côte de Beaune. Green-apple,
      floral and hazelnut-like notes can accompany a defined, textured palate; site and cellar
      choices affect intensity and development. A small red Pinot Noir production also exists.
      Puligny-Montrachet village or Premier Cru is not the same origin label as a separate
      Montrachet Grand Cru.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T20:00:00.000Z
  - id: ki_wset_origin_carneros_pinot
    subject_id: n_wset_origin_principle_carneros_pinot
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_origin_point_carneros_pinot
    domain_id: geography
    assertion_text: Los Carneros is a genuine still Pinot Noir origin as well as a Chardonnay and
      sparkling-wine source. Marine moderation provides growing context; Domaine Carneros’ 2023
      estate Pinot is a documented red-fruited, supple, barrel-aged example. This producer example
      does not fix the body, harvest timing or barrel treatment of every Carneros Pinot Noir.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T20:00:00.000Z
  - id: ki_wset_origin_barbera_asti
    subject_id: n_wset_origin_principle_barbera_asti
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_origin_point_barbera_asti
    domain_id: geography
    assertion_text: Barbera d’Asti is a Piedmont red-wine origin based on Barbera. The grape’s marked
      acidity supports a fresh fruit-led style, while riper fruit and wood maturation can give a
      fuller expression. It is a different grape and wine family from the tannic Nebbiolo reds of
      Barolo and Barbaresco; colour depth alone cannot rank their quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T20:00:00.000Z
  - id: ki_wset_origin_cava_basic_style
    subject_id: n_wset_origin_principle_cava_basic_style
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_origin_point_cava_basic_style
    domain_id: geography
    assertion_text: "Cava is a Spanish sparkling wine made by the traditional bottle-fermentation
      method. Its familiar Macabeo, Xarel·lo and Parellada blend combines fruit, body and freshness;
      other grapes and rosé styles also occur. Bottle lees contact can add mature aromas and
      texture. Read the sweetness designation separately: Cava or traditional method alone does not
      mean every example is Brut."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T20:00:00.000Z
