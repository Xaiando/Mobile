knowledge_items:
  - id: ki_reg_fs_muscadet_melon
    subject_id: n_reg_fs_principle_loire_muscadet
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fs_point_muscadet_melon
    domain_id: geography
    assertion_text: Melon de Bourgogne is the established grape association for Muscadet in the oceanic
      Nantais. This connects a generally fresh white-wine brief with a specific growing context, while
      vintage, picking and cellar choices prevent every bottle having the same acidity or aroma.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_muscadet_lees
    subject_id: n_reg_fs_principle_loire_muscadet
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fs_point_muscadet_lees
    domain_id: winemaking
    assertion_text: Muscadet producers use fine-lees contact to develop palate fullness and complexity;
      shorter and longer maturation offer different stylistic possibilities. Duration is one production
      variable, not a guarantee that the longest-aged wine is best or that every fresh Muscadet has had
      identical treatment.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_anjou_oceanic
    subject_id: n_reg_fs_principle_loire_anjou_saumur
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fs_point_anjou_oceanic
    domain_id: geography
    assertion_text: Anjou’s broadly oceanic setting includes mild winters, sunny summers and relatively
      limited seasonal temperature variation, with locally dry microclimates. Regional oceanic influence
      therefore does not establish equal rain or ripening conditions in every Chenin or Cabernet Franc
      parcel.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_saumur_season
    subject_id: n_reg_fs_principle_loire_anjou_saumur
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fs_point_saumur_season
    domain_id: geography
    assertion_text: Hills partly shelter Saumur from western winds, giving it a semi-oceanic climate with
      greater seasonal temperature variation than Anjou. This is a useful within-Loire comparison;
      exposure, river proximity and the actual season still matter before predicting an individual wine’s
      freshness.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_saumur_thermal
    subject_id: n_reg_fs_principle_loire_saumur_champigny
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fs_point_saumur_thermal
    domain_id: geography
    assertion_text: The Loire’s thermal inertia and valley air circulation can moderate summer heat and
      reduce frost intensity around Saumur-Champigny. This helps frame Cabernet Franc ripening
      conditions, but river influence varies with the parcel and cannot guarantee freedom from damaging
      frost.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_saumur_water
    subject_id: n_reg_fs_principle_loire_saumur_champigny
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fs_point_saumur_water
    domain_id: viticulture
    assertion_text: Porous tuffeau can absorb water during wet periods and release it gradually in drier
      conditions, alongside drainage. This physical mechanism helps explain water availability at
      relevant Saumur-Champigny sites; it does not prove a limestone flavour in the wine or adequate
      supply in every drought.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_chinon_sites
    subject_id: n_reg_fs_principle_loire_chinon
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fs_point_chinon_sites
    domain_id: geography
    assertion_text: Chinon contains contrasting Vienne alluvial terraces, limestone slopes and hillocks, and
      clay-flint plateaus. Record the individual parcel when comparing Cabernet Franc ripeness and
      structure; the appellation name alone cannot identify the site or prove that its geology caused a
      particular flavour.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_chinon_grapes
    subject_id: n_reg_fs_principle_loire_chinon
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fs_point_chinon_grapes
    domain_id: geography
    assertion_text: Cabernet Franc is Chinon’s established red and rosé association, while small pockets of
      Chenin produce dry whites. A Chinon comparison must therefore specify colour and grape before
      interpreting acidity, tannin or aroma; a regional label does not imply that every wine is red.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_layon_selection
    subject_id: n_reg_fs_principle_loire_chenin_harvest
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fs_point_layon_selection
    domain_id: viticulture
    assertion_text: Well-exposed, ventilated Coteaux du Layon Villages slopes provide context for
      concentrated Chenin harvests selected in successive passes. Noble rot may contribute, but the
      regional reference explicitly describes concentration with or without it; actual weather and berry
      condition determine the harvest opportunity.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_savennieres_dry
    subject_id: n_reg_fs_principle_loire_chenin_harvest
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fs_point_savennieres_dry
    domain_id: winemaking
    assertion_text: Savennières is associated predominantly with dry Chenin from well-exposed Loire slopes
      and harvests at full maturity; smaller sweeter styles also exist. Compare maturity with the
      intended finished sweetness rather than equating ripe Chenin with a sweet wine or treating all
      Savennières as identical.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_syrah_timing
    subject_id: n_reg_fs_principle_rhone_syrah_grenache
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fs_point_syrah_timing
    domain_id: viticulture
    assertion_text: Inter Rhône describes Syrah as earlier ripening and favouring cooler slopes, compared
      with Grenache’s intermediate timing. Those tendencies help compare harvest opportunities, but
      clone, site and vintage can alter the actual order and maturity of individual blocks.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_grenache_water
    subject_id: n_reg_fs_principle_rhone_syrah_grenache
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fs_point_grenache_water
    domain_id: viticulture
    assertion_text: "Grenache is associated with dry sites and resistance to drought and wind in southern
      Rhône references. Treat this as an adaptation tendency, not immunity: Rhône technical work still
      measures water constraint in Grenache and at parcel level to inform vineyard decisions."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_marsanne_palate
    subject_id: n_reg_fs_principle_rhone_white_grapes
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fs_point_marsanne_palate
    domain_id: geography
    assertion_text: Marsanne is associated with broad, powerful whites, commonly with moderate to low acidity
      and floral aromas that may develop nutty notes with ageing. These expectations help compare a Rhône
      white blend, while picking, other grapes and maturation prevent a fixed sensory or ageing outcome.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_roussanne_sensitivity
    subject_id: n_reg_fs_principle_rhone_white_grapes
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fs_point_roussanne_sensitivity
    domain_id: viticulture
    assertion_text: Roussanne can contribute floral aromas and structure to Rhône whites and is often
      partnered with Marsanne. Its susceptibility to powdery mildew and grey rot makes grape condition
      and season relevant to the comparison; the grape name alone cannot guarantee a successful aromatic
      or ageworthy wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_chateauneuf_variation
    subject_id: n_reg_fs_principle_rhone_chateauneuf_lirac
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fs_point_chateauneuf_variation
    domain_id: geography
    assertion_text: "Châteauneuf-du-Pape combines Mediterranean heat and a cold, dry Mistral influence with
      varied clay, rolled-pebble, sand and sandstone settings. Record the actual parcel when explaining a
      Grenache-led red: a photograph of large stones is not a complete growing-condition or quality
      explanation."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_lirac_variation
    subject_id: n_reg_fs_principle_rhone_chateauneuf_lirac
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fs_point_lirac_variation
    domain_id: geography
    assertion_text: Across the Rhône in the Gard, Lirac includes limestone plateaus, old alluvial terraces
      with pebbles and clay, and sandier terrace slopes. This supplies a meaningful site comparison with
      Châteauneuf-du-Pape, while blends and cellar choices prevent origin or soil type alone fixing
      tannin, freshness or price.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_gigondas_exposure
    subject_id: n_reg_fs_principle_rhone_gigondas
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fs_point_gigondas_exposure
    domain_id: geography
    assertion_text: The Dentelles de Montmirail create varied exposures and rising and descending breezes in
      Gigondas; many west or northwest-facing sites avoid some excessive summer heat. This can moderate
      the regional hot, dry context, but actual aspect and season are needed before predicting acidity or
      ripeness.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_gigondas_soils
    subject_id: n_reg_fs_principle_rhone_gigondas
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fs_point_gigondas_soils
    domain_id: viticulture
    assertion_text: Gigondas includes permeable clay-sandy alluvial terraces and marl-limestone hillside
      terraces with surface debris that can aid water infiltration. These physical differences are
      relevant to vineyard water assessment; they do not establish one moisture level, mineral taste or
      automatic quality advantage for every parcel.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_cahors_terraces
    subject_id: n_reg_fs_principle_southwest_cahors
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fs_point_cahors_terraces
    domain_id: geography
    assertion_text: Cahors’s Lot valley contains stepped alluvial terraces, with relatively deep sandy-silty
      soils nearer the river and more clay and stones near limestone slopes. This explains why two
      Malbec-based wines need parcel records; one valley label cannot establish uniform growing
      conditions or wine structure.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_cahors_causses
    subject_id: n_reg_fs_principle_southwest_cahors
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fs_point_cahors_causses
    domain_id: viticulture
    assertion_text: Cahors’s higher limestone Causses include shallow stony clay-limestone soils where rock
      fissures affect rooting depth, alongside more variable marl-derived soils. Investigate the actual
      root zone when discussing water access and ripening; a plateau origin does not guarantee drought
      resistance or a particular flavour.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_madiran_tannat
    subject_id: n_reg_fs_principle_southwest_madiran
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fs_point_madiran_tannat
    domain_id: viticulture
    assertion_text: Madiran-associated Tannat is late ripening and rich in polyphenols, so fruit maturity
      matters when assessing the potential for firm red-wine structure. The grape supplies a starting
      point rather than a guarantee of harsh tannins, successful ageing or a fixed quality level.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_madiran_extraction
    subject_id: n_reg_fs_principle_southwest_madiran
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fs_point_madiran_extraction
    domain_id: winemaking
    assertion_text: Madiran producers manage tannins through fruit maturity, maceration duration and
      extraction practices, including trials of shorter and longer skin contact. This helps explain
      different approachable and structured styles; maximum extraction is not automatically the best
      match for a wine or customer brief.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_jurancon_cycle
    subject_id: n_reg_fs_principle_southwest_jurancon
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fs_point_jurancon_cycle
    domain_id: viticulture
    assertion_text: Clos Lapeyre describes Petit and Gros Manseng as distinct grapes with early budbreak,
      late maturity and a long growing cycle, supported by substantial trellising. This frames Jurançon
      vineyard work and harvest timing, while the producer’s dry and sweet wines show that a long season
      alone does not define sweetness.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_jurancon_foehn
    subject_id: n_reg_fs_principle_southwest_jurancon
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fs_point_jurancon_foehn
    domain_id: geography
    assertion_text: Jurançon has a broadly mild, humid oceanic setting modified by the Pyrenees. Warm, dry
      autumn foehn can assist on-vine drying and later harvests; slope and exposure matter, and the
      possibility of that weather pattern cannot guarantee healthy concentrated fruit in a particular
      year.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_pacherenc_grapes
    subject_id: n_reg_fs_principle_southwest_pacherenc
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fs_point_pacherenc_grapes
    domain_id: geography
    assertion_text: Pacherenc references associate Gros Manseng especially with dry whites and Petit Manseng
      especially with concentrated sweet wines, while blends may include other local grapes. These are
      production tendencies, not an exclusive legal grape list or a rule that either Manseng can make
      only one style.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_pacherenc_harvest
    subject_id: n_reg_fs_principle_southwest_pacherenc
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fs_point_pacherenc_harvest
    domain_id: viticulture
    assertion_text: Pacherenc’s dry-wine brief emphasizes fresh fruit, whereas sweet examples use on-vine
      passerillage and manual harvest to obtain concentrated grapes with balancing acidity. Compare the
      fruit and harvest aim rather than assuming the same calendar or concentration outcome for every
      producer and season.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_bergerac_dry
    subject_id: n_reg_fs_principle_southwest_bergerac
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fs_point_bergerac_dry
    domain_id: geography
    assertion_text: "Bergerac dry whites commonly associate Sauvignon’s fruit and citrus expression with
      Sémillon’s fuller palate in an oceanic-influenced region with varied sites. Blend and production
      records are necessary: proximity to Bordeaux does not establish identical style, quality or price."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_monbazillac_selection
    subject_id: n_reg_fs_principle_southwest_bergerac
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fs_point_monbazillac_selection
    domain_id: viticulture
    assertion_text: Monbazillac’s Dordogne-side slopes can experience alternating morning mist and sunshine
      favourable to noble rot, with successive selective harvests for sweet wines. Those conditions offer
      a concentration opportunity, not a guarantee that all rot is beneficial or that every vineyard will
      yield the same sweetness and quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_case_loire_muscadet_inventory_action
    subject_id: n_reg_fs_case_loire_muscadet_inventory
    relation_type: CASE_ACTION
    object_id: n_reg_fs_point_case_loire_muscadet_inventory_action
    domain_id: business
    assertion_text: Test whether the fuller lot suits the target customers and budget vat occupancy, ongoing
      bills and later sales before committing the whole volume. The sensory trial informs style; customer
      interest alone does not establish dependable cash inflow.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_case_loire_muscadet_inventory_reason
    subject_id: n_reg_fs_case_loire_muscadet_inventory
    relation_type: CASE_REASON
    object_id: n_reg_fs_point_case_loire_muscadet_inventory_reason
    domain_id: winemaking
    assertion_text: Fine-lees maturation can develop palate fullness, consistent with the stated trial.
      Comparable base wine and cellar treatment make this pair informative, while maturation duration
      remains a possible contributor rather than proof of a universal quality improvement.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_case_loire_muscadet_inventory_tradeoff
    subject_id: n_reg_fs_case_loire_muscadet_inventory
    relation_type: CASE_TRADEOFF
    object_id: n_reg_fs_point_case_loire_muscadet_inventory_tradeoff
    domain_id: business
    assertion_text: The fuller style may satisfy an additional market, but the stated later bottling delays
      sales, occupies vats and requires cash for bills. Earlier sale of the shorter-held lot gives up
      possible development while easing the holding-period cash requirement.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_case_loire_muscadet_inventory_limitation
    subject_id: n_reg_fs_case_loire_muscadet_inventory
    relation_type: CASE_LIMITATION
    object_id: n_reg_fs_point_case_loire_muscadet_inventory_limitation
    domain_id: business
    assertion_text: One split-lot trial cannot establish the best duration for other vintages, future
      customer demand or sufficient sales to fund the delay. Repeat sensory and customer checks, and
      update costs and cash-flow assumptions before expanding the programme.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_case_rhone_harvest_water_action
    subject_id: n_reg_fs_case_rhone_harvest_water
    relation_type: CASE_ACTION
    object_id: n_reg_fs_point_case_rhone_harvest_water_action
    domain_id: viticulture
    assertion_text: Assess ripeness and water constraint separately for each block, and review the proposed
      common date against the recorded fruit and wine aims. Use qualified vineyard advice where needed;
      drought adaptation is insufficient evidence to ignore the Grenache measurements.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_case_rhone_harvest_water_reason
    subject_id: n_reg_fs_case_rhone_harvest_water
    relation_type: CASE_REASON
    object_id: n_reg_fs_point_case_rhone_harvest_water_reason
    domain_id: viticulture
    assertion_text: Earlier Syrah and intermediate Grenache timing make the observed maturity difference
      plausible. The measured constraint matters even for adapted Grenache; variety tendencies cannot
      replace the actual samples or prove that both blocks will meet the same target on one date.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_case_rhone_harvest_water_tradeoff
    subject_id: n_reg_fs_case_rhone_harvest_water
    relation_type: CASE_TRADEOFF
    object_id: n_reg_fs_point_case_rhone_harvest_water_tradeoff
    domain_id: viticulture
    assertion_text: Separate picking complicates scheduling compared with one operation, but accommodates the
      different recorded maturity. Waiting for Grenache may improve target alignment while extending its
      exposure to the stated worsening constraint; neither immediate nor delayed picking is automatically
      best.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_case_rhone_harvest_water_limitation
    subject_id: n_reg_fs_case_rhone_harvest_water
    relation_type: CASE_LIMITATION
    object_id: n_reg_fs_point_case_rhone_harvest_water_limitation
    domain_id: viticulture
    assertion_text: No water-status values, forecast, soil/rootstock records or sensory berry assessments are
      supplied beyond the stated target result. They limit a final harvest prescription; the exercise
      supports separate assessment, not a guaranteed date, quality outcome or right to irrigate.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_case_southwest_madiran_extraction_action
    subject_id: n_reg_fs_case_southwest_madiran_extraction
    relation_type: CASE_ACTION
    object_id: n_reg_fs_point_case_southwest_madiran_extraction_action
    domain_id: winemaking
    assertion_text: Select the shorter-contact trial provisionally for this customer, then check repeat
      samples and production consistency before scaling it. The stated preference and balance assessment
      justify that choice more directly than maximum colour or extraction.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_case_southwest_madiran_extraction_reason
    subject_id: n_reg_fs_case_southwest_madiran_extraction
    relation_type: CASE_REASON
    object_id: n_reg_fs_point_case_southwest_madiran_extraction_reason
    domain_id: winemaking
    assertion_text: Tannat supplies polyphenol-rich fruit, while maceration and extraction choices help
      manage the resulting tannins. This supports investigating the observed texture contrast; it does
      not prove that contact time alone caused every difference.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_case_southwest_madiran_extraction_tradeoff
    subject_id: n_reg_fs_case_southwest_madiran_extraction
    relation_type: CASE_TRADEOFF
    object_id: n_reg_fs_point_case_southwest_madiran_extraction_tradeoff
    domain_id: winemaking
    assertion_text: The approachable lot meets the current brief but forgoes the firmer, darker lot’s
      different stylistic possibilities. Greater structure may suit another audience, while absent mature
      evidence prevents claiming that the longer-contact lot will age better.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_case_southwest_madiran_extraction_limitation
    subject_id: n_reg_fs_case_southwest_madiran_extraction
    relation_type: CASE_LIMITATION
    object_id: n_reg_fs_point_case_southwest_madiran_extraction_limitation
    domain_id: winemaking
    assertion_text: One fruit batch cannot define an optimum for other Tannat maturity levels, vintages or
      customers. Repeat controlled comparisons and check unrecorded fermentation variables before
      treating shorter contact as the universal Madiran recipe.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_case_southwest_sweet_process_action
    subject_id: n_reg_fs_case_southwest_sweet_process
    relation_type: CASE_ACTION
    object_id: n_reg_fs_point_case_southwest_sweet_process_action
    domain_id: business
    assertion_text: Separate the drying and noble-rot process descriptions from the documented lot costs,
      then test whether the higher-priced offer gives the buyer additional valued benefits. Meeting the
      same stated tasting brief does not establish either process as universally superior.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_case_southwest_sweet_process_reason
    subject_id: n_reg_fs_case_southwest_sweet_process
    relation_type: CASE_REASON
    object_id: n_reg_fs_point_case_southwest_sweet_process_reason
    domain_id: geography
    assertion_text: Warm, dry conditions can assist on-vine concentration in Jurançon, whereas alternating
      mist and sunshine can favour Monbazillac noble rot and selective picking. These different
      mechanisms can both supply suitable sweet wine, as the stated tasting confirms for this pair.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_case_southwest_sweet_process_tradeoff
    subject_id: n_reg_fs_case_southwest_sweet_process
    relation_type: CASE_TRADEOFF
    object_id: n_reg_fs_point_case_southwest_sweet_process_tradeoff
    domain_id: business
    assertion_text: The documented extra picking labour may support a higher cost-recovery price for this
      lot, but buyers may prefer the lower-priced wine that also meets their brief. Test demand rather
      than assuming production effort creates equal willingness to pay.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
  - id: ki_reg_fs_case_southwest_sweet_process_limitation
    subject_id: n_reg_fs_case_southwest_sweet_process
    relation_type: CASE_LIMITATION
    object_id: n_reg_fs_point_case_southwest_sweet_process_limitation
    domain_id: business
    assertion_text: These lot-specific costs and tastings cannot rank all Jurançon, Monbazillac, passerillé
      or noble-rot wines. Weather, fruit selection, wine quality and customers differ; the case contains
      no evidence for a universal process premium or assured future demand.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:21:10.000Z
