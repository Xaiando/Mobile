# Original Loire, Rhône and southwest comparisons; all await qualified review.
# MCQ disabled: qualified site/style explanations and case actions permit defensible alternatives.
# Dates record curation, not the start of these regional conditions.
knowledge_nodes:
  - id: n_reg_fs_principle_loire_muscadet
    node_type: production_principle
    name: How do Melon de Bourgogne and fine-lees maturation explain different Muscadet styles in the
      Atlantic-influenced Nantais?
  - id: n_reg_fs_point_muscadet_melon
    node_type: learning_point
    name: Melon de Bourgogne frames Muscadet in an oceanic growing context
  - id: n_reg_fs_point_muscadet_lees
    node_type: learning_point
    name: Fine-lees contact can broaden Muscadet texture
  - id: n_reg_fs_principle_loire_anjou_saumur
    node_type: production_principle
    name: Why should a Chenin or Cabernet Franc comparison distinguish Anjou’s oceanic conditions from
      Saumur’s more sheltered seasonal climate?
  - id: n_reg_fs_point_anjou_oceanic
    node_type: learning_point
    name: Anjou has mild oceanic conditions with local dry microclimates
  - id: n_reg_fs_point_saumur_season
    node_type: learning_point
    name: Saumur shelter increases seasonal contrast relative to Anjou
  - id: n_reg_fs_principle_loire_saumur_champigny
    node_type: production_principle
    name: How do Loire river moderation and porous tuffeau provide different physical explanations of
      Cabernet Franc growing conditions in Saumur-Champigny?
  - id: n_reg_fs_point_saumur_thermal
    node_type: learning_point
    name: The Loire can moderate heat and frost intensity around Saumur-Champigny
  - id: n_reg_fs_point_saumur_water
    node_type: learning_point
    name: Porous tuffeau offers a water-storage mechanism for some Saumur sites
  - id: n_reg_fs_principle_loire_chinon
    node_type: production_principle
    name: Which site and grape differences should be recorded before treating two Chinon wines as one uniform
      Cabernet Franc comparison?
  - id: n_reg_fs_point_chinon_sites
    node_type: learning_point
    name: Chinon includes alluvial terraces, limestone slopes and clay-flint plateaus
  - id: n_reg_fs_point_chinon_grapes
    node_type: learning_point
    name: Chinon’s Cabernet Franc reds contrast with small Chenin-white production
  - id: n_reg_fs_principle_loire_chenin_harvest
    node_type: production_principle
    name: How do selective concentrated Chenin harvests in Coteaux du Layon Villages contrast with the
      predominantly dry, fully ripe Chenin brief in Savennières?
  - id: n_reg_fs_point_layon_selection
    node_type: learning_point
    name: Layon sweet-wine concentration combines suitable slopes with selective harvest
  - id: n_reg_fs_point_savennieres_dry
    node_type: learning_point
    name: Savennières shows that fully ripe Chenin need not imply sweetness
  - id: n_reg_fs_principle_rhone_syrah_grenache
    node_type: production_principle
    name: How do Syrah and Grenache differ in ripening timing and dry-site adaptation without making variety
      a substitute for checking the vineyard?
  - id: n_reg_fs_point_syrah_timing
    node_type: learning_point
    name: Earlier Syrah ripening makes it a different harvest comparison from Grenache
  - id: n_reg_fs_point_grenache_water
    node_type: learning_point
    name: Grenache dry-site adaptation does not remove water-constraint monitoring
  - id: n_reg_fs_principle_rhone_white_grapes
    node_type: production_principle
    name: How do Marsanne’s typical palate and ageing expression differ from Roussanne’s floral character and
      vineyard sensitivities in a Rhône white comparison?
  - id: n_reg_fs_point_marsanne_palate
    node_type: learning_point
    name: Marsanne can combine a broad palate with moderate to low acidity
  - id: n_reg_fs_point_roussanne_sensitivity
    node_type: learning_point
    name: Roussanne floral structure comes with disease-sensitive vineyard context
  - id: n_reg_fs_principle_rhone_chateauneuf_lirac
    node_type: production_principle
    name: Which site differences matter when comparing Châteauneuf-du-Pape and Lirac instead of reducing both
      to hot vineyards covered in large stones?
  - id: n_reg_fs_point_chateauneuf_variation
    node_type: learning_point
    name: Châteauneuf-du-Pape’s Mediterranean vineyards include more than rolled pebbles
  - id: n_reg_fs_point_lirac_variation
    node_type: learning_point
    name: Lirac contrasts limestone plateaus, old terraces and sandy slopes
  - id: n_reg_fs_principle_rhone_gigondas
    node_type: production_principle
    name: How do Gigondas’s Dentelles exposures and contrasting soil permeability complicate one simple hot
      southern Rhône ripening rule?
  - id: n_reg_fs_point_gigondas_exposure
    node_type: learning_point
    name: Dentelles exposures and local breezes can temper Gigondas heat
  - id: n_reg_fs_point_gigondas_soils
    node_type: learning_point
    name: Gigondas terrace and slope soils differ in drainage and infiltration context
  - id: n_reg_fs_principle_southwest_cahors
    node_type: production_principle
    name: How do Lot valley terraces and limestone Causses provide different site contexts for comparing
      Malbec-based Cahors reds?
  - id: n_reg_fs_point_cahors_terraces
    node_type: learning_point
    name: Cahors Lot terraces contain varied, relatively deep alluvial soils
  - id: n_reg_fs_point_cahors_causses
    node_type: learning_point
    name: Cahors Causses rooting depends on limestone fissures and soil depth
  - id: n_reg_fs_principle_southwest_madiran
    node_type: production_principle
    name: Why do Tannat ripening and extraction choices both matter when comparing an approachable young
      Madiran with a more structured example?
  - id: n_reg_fs_point_madiran_tannat
    node_type: learning_point
    name: Tannat’s late ripening and polyphenols make fruit maturity consequential
  - id: n_reg_fs_point_madiran_extraction
    node_type: learning_point
    name: Madiran producers vary maceration and extraction to manage tannins
  - id: n_reg_fs_principle_southwest_jurancon
    node_type: production_principle
    name: How do Manseng’s long season and Jurançon’s oceanic–Pyrenean climate create opportunities and
      constraints for dry and concentrated sweet whites?
  - id: n_reg_fs_point_jurancon_cycle
    node_type: learning_point
    name: Mansengs combine early budbreak with late maturity in a long season
  - id: n_reg_fs_point_jurancon_foehn
    node_type: learning_point
    name: Autumn foehn can assist Jurançon concentration within an oceanic climate
  - id: n_reg_fs_principle_southwest_pacherenc
    node_type: production_principle
    name: How do Gros and Petit Manseng tendencies and contrasting harvest aims help distinguish dry from
      passerillé sweet Pacherenc du Vic-Bilh?
  - id: n_reg_fs_point_pacherenc_grapes
    node_type: learning_point
    name: Manseng traits help distinguish Pacherenc dry and sweet production briefs
  - id: n_reg_fs_point_pacherenc_harvest
    node_type: learning_point
    name: Pacherenc harvest aims contrast fresh dry fruit with on-vine concentration
  - id: n_reg_fs_principle_southwest_bergerac
    node_type: production_principle
    name: How do Bergerac’s dry-white blends and Monbazillac’s selective sweet harvests separate grape
      contribution from weather-dependent concentration?
  - id: n_reg_fs_point_bergerac_dry
    node_type: learning_point
    name: Bergerac dry whites combine different grape contributions in an oceanic context
  - id: n_reg_fs_point_monbazillac_selection
    node_type: learning_point
    name: Monbazillac noble-rot opportunities depend on mist, sunshine and selection
  - id: n_reg_fs_case_loire_muscadet_inventory
    node_type: production_case
    name: A Muscadet producer divides the same finished base wine between fine-lees maturation for six months
      and eighteen months, with otherwise similar cellar treatment. Trials show the longer-held lot has a
      fuller palate; customers have expressed interest but have not committed to purchases. Bottling the
      longer-held lot later would occupy vats and delay sales, and the producer must pay ongoing bills
      during that period. Assess the longer-maturation option with an action, reason, tradeoff and
      limitation; neither lot has an established quality advantage.
  - id: n_reg_fs_point_case_loire_muscadet_inventory_action
    node_type: learning_point
    name: Evaluate the fuller Muscadet with customers and budget the holding period
  - id: n_reg_fs_point_case_loire_muscadet_inventory_reason
    node_type: learning_point
    name: Fine-lees maturation makes the observed palate contrast plausible
  - id: n_reg_fs_point_case_loire_muscadet_inventory_tradeoff
    node_type: learning_point
    name: Holding the fuller Muscadet delays sales and occupies production capacity
  - id: n_reg_fs_point_case_loire_muscadet_inventory_limitation
    node_type: learning_point
    name: One split-lot trial cannot establish demand or optimal lees duration
  - id: n_reg_fs_case_rhone_harvest_water
    node_type: production_case
    name: Two southern Rhône trial blocks contain Syrah and Grenache. Current berry samples show that Syrah
      meets the producer’s chosen ripeness target while Grenache does not; monitoring also records
      worsening water constraint in the Grenache block. The manager proposes one harvest date for both
      because Grenache is drought-adapted. Assess that proposal with an action, reason, tradeoff and
      limitation. The target is balanced fruit for two separately vinified dry reds, and no irrigation
      permission or universal maturity threshold is supplied.
  - id: n_reg_fs_point_case_rhone_harvest_water_action
    node_type: learning_point
    name: Make separate block harvest assessments rather than using one variety slogan
  - id: n_reg_fs_point_case_rhone_harvest_water_reason
    node_type: learning_point
    name: Different phenology and recorded water constraint undermine a fixed common date
  - id: n_reg_fs_point_case_rhone_harvest_water_tradeoff
    node_type: learning_point
    name: Separate picking increases logistics while respecting different fruit aims
  - id: n_reg_fs_point_case_rhone_harvest_water_limitation
    node_type: learning_point
    name: Monitoring and fruit targets are incomplete for a final harvest prescription
  - id: n_reg_fs_case_southwest_madiran_extraction
    node_type: production_case
    name: A Madiran producer divides ripe Tannat fruit into two trial lots. The shorter skin-contact lot is
      less astringent and meets a restaurant’s preference for an approachable young red; the
      longer-contact lot has more colour and firmer tannins but no better rating for balance. Other
      recorded cellar treatments are similar, and the producer has no mature samples from either
      treatment. Choose a provisional route for this customer and explain a reason, tradeoff and
      limitation without treating the darkest wine as inherently best.
  - id: n_reg_fs_point_case_southwest_madiran_extraction_action
    node_type: learning_point
    name: Choose the suitable shorter-contact Tannat provisionally and confirm consistency
  - id: n_reg_fs_point_case_southwest_madiran_extraction_reason
    node_type: learning_point
    name: Tannat potential and maceration choices both influence the texture comparison
  - id: n_reg_fs_point_case_southwest_madiran_extraction_tradeoff
    node_type: learning_point
    name: Approachable young texture may forgo the firmer lot’s different style potential
  - id: n_reg_fs_point_case_southwest_madiran_extraction_limitation
    node_type: learning_point
    name: One trial cannot make shorter contact the universal Madiran recipe
  - id: n_reg_fs_case_southwest_sweet_process
    node_type: production_case
    name: "A buyer receives two sweet-white offers: a Jurançon made from on-vine dried Manseng fruit and a
      Monbazillac made from selectively picked noble-rotted fruit. Both currently meet the buyer’s
      sweetness and freshness brief in tasting. The Monbazillac supplier documents more picking passes
      and higher harvest labour cost for these specific lots, but asks the buyer to accept a higher price
      solely because noble rot is supposedly better. Compare the processes and assess the claim with an
      action, reason, tradeoff and limitation; customer willingness to pay is unknown."
  - id: n_reg_fs_point_case_southwest_sweet_process_action
    node_type: learning_point
    name: Compare process evidence, actual costs and buyer value before accepting the premium
  - id: n_reg_fs_point_case_southwest_sweet_process_reason
    node_type: learning_point
    name: Different concentration processes can both meet a balanced sweet-wine brief
  - id: n_reg_fs_point_case_southwest_sweet_process_tradeoff
    node_type: learning_point
    name: Recovering the documented selective-harvest cost may reduce buyer demand
  - id: n_reg_fs_point_case_southwest_sweet_process_limitation
    node_type: learning_point
    name: The two offers cannot rank all passerillé and noble-rot sweet wines
