{
  "knowledge_nodes": [
    {
      "id": "n_d12depth_market_balance",
      "node_type": "production_principle",
      "name": "A fictional market opens with 500 hL, produces 100 hL and releases 120 hL domestically with no other flows. What closing stock follows?"
    },
    {
      "id": "n_d12depth_market_balance_point",
      "node_type": "learning_point",
      "name": "480 hL under the supplied complete flow assumptions"
    },
    {
      "id": "n_d12depth_market_drivers",
      "node_type": "production_principle",
      "name": "What comparison avoids deriving a fixed price from a small harvest?"
    },
    {
      "id": "n_d12depth_market_drivers_point",
      "node_type": "learning_point",
      "name": "Define the market and compare supply, demand, stocks and responsiveness"
    },
    {
      "id": "n_d12depth_case_market",
      "node_type": "production_case",
      "name": "Fictional wine market: opening stock 500 hL, new output 100 hL, domestic releases 120 hL; assume no trade or loss. Retail buyers report weaker purchasing power and altered preferences, but the size of demand change and inventories elsewhere are unknown. A supplier predicts a fixed 20% price rise from the smaller harvest. Compare stock and price evidence. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence."
    },
    {
      "id": "n_d12depth_case_market_action_point",
      "node_type": "learning_point",
      "name": "Calculate 480 hL closing stock and seek dated comparable demand and trade data before changing price commitments"
    },
    {
      "id": "n_d12depth_case_market_reason_point",
      "node_type": "learning_point",
      "name": "The supplied balance includes inventories; a supply fall alongside weakening demand does not imply a fixed price change"
    },
    {
      "id": "n_d12depth_case_market_tradeoff_point",
      "node_type": "learning_point",
      "name": "Holding stock may retain future sales opportunity but commits cash and storage resources in a weaker market"
    },
    {
      "id": "n_d12depth_case_market_limitation_point",
      "node_type": "learning_point",
      "name": "Domestic releases are not necessarily final consumption; omitted flows and relative elasticities prevent the 20% prediction"
    },
    {
      "id": "n_d12depth_cost_capacity",
      "node_type": "production_principle",
      "name": "Fictional net price EUR10 and variable cost EUR6 fund EUR12,000 annual fixed cost. What whole-bottle break-even follows within the stated constant-cost range?"
    },
    {
      "id": "n_d12depth_cost_capacity_point",
      "node_type": "learning_point",
      "name": "3,000 bottles at EUR4 contribution each"
    },
    {
      "id": "n_d12depth_cost_statements",
      "node_type": "production_principle",
      "name": "Why is positive contribution not proof of profit or solvency?"
    },
    {
      "id": "n_d12depth_cost_statements_point",
      "node_type": "learning_point",
      "name": "Other expenses and payment timing still affect results and cash"
    },
    {
      "id": "n_d12depth_case_cost",
      "node_type": "production_case",
      "name": "Fictional winery sells at EUR10 per bottle with EUR6 variable cost and EUR12,000 fixed annual cost within capacity up to 4,000 bottles. It plans 3,500 bottles and a EUR20,000 equipment purchase; half customer payments arrive next period. A delayed lot incurs EUR0.50 extra variable storage per bottle. Compare base contribution, cost sensitivity, profit assumptions and funding. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence."
    },
    {
      "id": "n_d12depth_case_cost_action_point",
      "node_type": "learning_point",
      "name": "Calculate EUR2,000 base surplus before omitted costs and compare the delay case while preparing a dated cash plan for equipment"
    },
    {
      "id": "n_d12depth_case_cost_reason_point",
      "node_type": "learning_point",
      "name": "3,500 x EUR4 - EUR12,000 = EUR2,000; EUR0.50 extra cost reduces that to EUR250 under the supplied range"
    },
    {
      "id": "n_d12depth_case_cost_tradeoff_point",
      "node_type": "learning_point",
      "name": "Owning equipment and maturing stock may support production but require capital and financing; delay sharply reduces the contribution buffer"
    },
    {
      "id": "n_d12depth_case_cost_limitation_point",
      "node_type": "learning_point",
      "name": "These numbers are not full accounting profit or cash availability; depreciation, finance, tax, payment dates and feasible demand are incomplete"
    },
    {
      "id": "n_d12depth_landed_recoverable",
      "node_type": "production_principle",
      "name": "A fictional import pays EUR1,000 wine, EUR200 freight and EUR100 duty, plus EUR260 tax explicitly stipulated fully recoverable later. What distinction follows?"
    },
    {
      "id": "n_d12depth_landed_recoverable_point",
      "node_type": "learning_point",
      "name": "EUR1,300 supplied net cost versus EUR1,560 initial cash outflow"
    },
    {
      "id": "n_d12depth_landed_floor",
      "node_type": "production_principle",
      "name": "Which mechanism distinguishes Scotland's minimum unit price from a duty?"
    },
    {
      "id": "n_d12depth_landed_floor_point",
      "node_type": "learning_point",
      "name": "A legal retail-price floor tied to alcohol content, rather than a tax charge"
    },
    {
      "id": "n_d12depth_case_landed",
      "node_type": "production_case",
      "name": "Fictional exporter compares one commissioned Scotland quote and another market with unknown current duty, trade restrictions, label and support eligibility. For the import budget, wine EUR1,000, freight EUR200, duty EUR100 and fully later-recoverable tax EUR260 are explicitly stipulated. A colleague treats a retail floor, customs duty and a conditional grant as interchangeable guaranteed producer income. Explain cost, funding and distinct legal mechanisms without deciding eligibility. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence."
    },
    {
      "id": "n_d12depth_case_landed_action_point",
      "node_type": "learning_point",
      "name": "Budget EUR1,560 initial cash and EUR1,300 stipulated permanent cost, then verify destination rules and any grant terms separately"
    },
    {
      "id": "n_d12depth_case_landed_reason_point",
      "node_type": "learning_point",
      "name": "Duty can add import cost, a retail floor constrains selling price, and support depends on program conditions; these mechanisms answer different questions"
    },
    {
      "id": "n_d12depth_case_landed_tradeoff_point",
      "node_type": "learning_point",
      "name": "Freight, insurance, compliance work and delayed recovery affect resources and price competitiveness even where a grant might apply"
    },
    {
      "id": "n_d12depth_case_landed_limitation_point",
      "node_type": "learning_point",
      "name": "Only the named Scottish instrument is taught as a dated law; all fictional charges and tax recovery are assumptions, and other markets require current legal evidence"
    },
    {
      "id": "n_d12depth_fx_instrument",
      "node_type": "production_principle",
      "name": "What distinguishes a purchased currency option from a forward?"
    },
    {
      "id": "n_d12depth_fx_instrument_point",
      "node_type": "learning_point",
      "name": "An option buys a right without an exchange obligation; a forward commits its agreed exchange"
    },
    {
      "id": "n_d12depth_fx_matching",
      "node_type": "production_principle",
      "name": "How can a foreign-currency account or matched currency costs affect exposure?"
    },
    {
      "id": "n_d12depth_fx_matching_point",
      "node_type": "learning_point",
      "name": "Matched receipts can fund same-currency costs, while any unmatched balance retains risk"
    },
    {
      "id": "n_d12depth_case_fx",
      "node_type": "production_case",
      "name": "Fictional exporter expects EUR1,000. A committed forward pays home-currency 850, an option floors conversion at 850 with premium 20, and spot conversion could be 800 or 900. Customer payment may be late. The winery also owes EUR400 on the expected receipt date. Quotes ignore all other fees. Compare matching, downside and upside outcomes without recommending speculation. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence."
    },
    {
      "id": "n_d12depth_case_fx_action_point",
      "node_type": "learning_point",
      "name": "Compare the net EUR600 exposure after a genuinely matched EUR400 payment and choose a conditional hedge on supplied terms and timing"
    },
    {
      "id": "n_d12depth_case_fx_reason_point",
      "node_type": "learning_point",
      "name": "For the full EUR1,000 illustration, forward gives 850; option gives 830 at the low spot or 880 at the high spot after premium"
    },
    {
      "id": "n_d12depth_case_fx_tradeoff_point",
      "node_type": "learning_point",
      "name": "The option retains upside at a paid premium; a forward fixes conversion but commits amount/date, while matching needs aligned flows"
    },
    {
      "id": "n_d12depth_case_fx_limitation_point",
      "node_type": "learning_point",
      "name": "The quotes are fictional and payment is uncertain; fees, cancellation, late receipts and unmatched balances can change the result"
    },
    {
      "id": "n_d12depth_cash_peak",
      "node_type": "production_principle",
      "name": "Fictional opening cash EUR5,000 pays EUR6,000 on day10 and EUR3,000 on day20 before EUR8,000 arrives day30. What minimum extra funding avoids a negative balance?"
    },
    {
      "id": "n_d12depth_cash_peak_point",
      "node_type": "learning_point",
      "name": "EUR4,000 before day20, ignoring all other flows"
    },
    {
      "id": "n_d12depth_cash_stock",
      "node_type": "production_principle",
      "name": "What does increasing wine maturation inventory change before sale?"
    },
    {
      "id": "n_d12depth_cash_stock_point",
      "node_type": "learning_point",
      "name": "Cash remains tied to production and storage until receipts arrive"
    },
    {
      "id": "n_d12depth_case_cash",
      "node_type": "production_case",
      "name": "Fictional cellar starts with EUR5,000, pays EUR6,000 on day10 and EUR3,000 on day20, and expects EUR8,000 on day30. An extra EUR1,000 recoverable-tax payment is due day15 and recovery is day45. No other flows exist. Buyer payment may slip to day50. Calculate peak funding and discuss a stock-release or finance response without treating recoverable tax as permanent cost. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence."
    },
    {
      "id": "n_d12depth_case_cash_action_point",
      "node_type": "learning_point",
      "name": "Arrange at least EUR5,000 temporary funding before day20 under the stipulated sequence and stress-test late payment"
    },
    {
      "id": "n_d12depth_case_cash_reason_point",
      "node_type": "learning_point",
      "name": "Balances fall to -1,000, -2,000 and -5,000 before receipts; the later tax recovery cannot fund earlier due dates"
    },
    {
      "id": "n_d12depth_case_cash_tradeoff_point",
      "node_type": "learning_point",
      "name": "Finance costs and earlier release or discounts can reduce a gap but may affect margin, stock and intended maturation"
    },
    {
      "id": "n_d12depth_case_cash_limitation_point",
      "node_type": "learning_point",
      "name": "EUR5,000 is a supplied-flow minimum, not a complete lending decision; timing, interest, missed receipts and release suitability must be checked"
    },
    {
      "id": "n_d12depth_models_ownership",
      "node_type": "production_principle",
      "name": "How can grower, merchant and virtual producer proposals be compared without ranking labels?"
    },
    {
      "id": "n_d12depth_models_ownership_point",
      "node_type": "learning_point",
      "name": "Specify who owns fruit/assets and controls production, brand and selling"
    },
    {
      "id": "n_d12depth_models_group",
      "node_type": "production_principle",
      "name": "What should a cooperative or multi-business group comparison specify?"
    },
    {
      "id": "n_d12depth_models_group_point",
      "node_type": "learning_point",
      "name": "Governance, pooling, capital, decision rights and business-unit performance"
    },
    {
      "id": "n_d12depth_case_models",
      "node_type": "production_case",
      "name": "Fictional grower can sell fruit immediately; a grower-producer can invest EUR80,000 in equipment; a merchant can buy bulk wine; a virtual brand can commission a custom facility for EUR3/bottle excluding marketing. A cooperative pools processing and marketing with member decisions; a larger group proposes shared purchasing but separate brand budgets. Compare capital, sourcing, control and commercial duties for these models. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence."
    },
    {
      "id": "n_d12depth_case_models_action_point",
      "node_type": "learning_point",
      "name": "Cost each proposal's actual fruit/assets/services and identify retained brand, sales and governance duties before choosing a feasible model"
    },
    {
      "id": "n_d12depth_case_models_reason_point",
      "node_type": "learning_point",
      "name": "Buying service capacity reduces owned-plant commitment but does not supply demand, marketing or automatic sourcing control"
    },
    {
      "id": "n_d12depth_case_models_tradeoff_point",
      "node_type": "learning_point",
      "name": "Owned equipment, pooling or group procurement can bring control or scale alongside capital, governance and shared-resource dependence"
    },
    {
      "id": "n_d12depth_case_models_limitation_point",
      "node_type": "learning_point",
      "name": "The fictional labels and EUR3 quote do not establish all inclusions, full costs, permissions, customer demand or quality ranking"
    },
    {
      "id": "n_d12depth_channels_duties",
      "node_type": "production_principle",
      "name": "Why is appointing a broker different from proving full importer/distributor service?"
    },
    {
      "id": "n_d12depth_channels_duties_point",
      "node_type": "learning_point",
      "name": "Sales representation and import, stock, compliance or distribution duties need explicit allocation"
    },
    {
      "id": "n_d12depth_channels_evidence",
      "node_type": "production_principle",
      "name": "What should a channel review request beyond the initial shipment?"
    },
    {
      "id": "n_d12depth_channels_evidence_point",
      "node_type": "learning_point",
      "name": "Downstream sales, stock, reorder, payment and agreed activity evidence"
    },
    {
      "id": "n_d12depth_case_channels",
      "node_type": "production_case",
      "name": "Fictional options: full-service partner pays EUR8/bottle on 500 bottles after60days; broker charges EUR400 plus EUR1 per sold bottle while a separately paid service importer handles stock; a JV pools promotion at shared cost; a direct-seller order offers EUR7 prepaid but requires a clearing route. Full costs and buyer demand are incomplete. A 500-bottle shipment has only 100 documented downstream sales. Compare roles, timing and evidence. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence."
    },
    {
      "id": "n_d12depth_case_channels_action_point",
      "node_type": "learning_point",
      "name": "Define import, inventory, sales and payment duties in each offer and review downstream movement before scaling the 500-bottle launch"
    },
    {
      "id": "n_d12depth_case_channels_reason_point",
      "node_type": "learning_point",
      "name": "Only 100 downstream sales are documented; a broker quote is separate from importer and stock duties"
    },
    {
      "id": "n_d12depth_case_channels_tradeoff_point",
      "node_type": "learning_point",
      "name": "Prepayment and lower unit receipts trade against cash and workload, while shared promotion can add governance dependence"
    },
    {
      "id": "n_d12depth_case_channels_limitation_point",
      "node_type": "learning_point",
      "name": "The supplied offers do not prove permissions, full margin, guaranteed demand or contractual enforceability"
    },
    {
      "id": "n_d12depth_outlets_fit",
      "node_type": "production_principle",
      "name": "What connects retail, hospitality, travel and investment-channel comparisons?"
    },
    {
      "id": "n_d12depth_outlets_fit_point",
      "node_type": "learning_point",
      "name": "Match the buyer's task and offer to service, stock, fulfilment and full costs"
    },
    {
      "id": "n_d12depth_outlets_return",
      "node_type": "production_principle",
      "name": "Fictional DTC receipt EUR20 has EUR8 product cost, EUR4 fulfilment and EUR6 acquisition/service; wholesale receipt EUR10 has EUR8 product cost and EUR1 support. Which supplied contribution is higher?"
    },
    {
      "id": "n_d12depth_outlets_return_point",
      "node_type": "learning_point",
      "name": "DTC EUR2 versus wholesale EUR1, before fixed and omitted costs"
    },
    {
      "id": "n_d12depth_case_outlets",
      "node_type": "production_case",
      "name": "Fictional winery compares DTC receipt EUR20, wine cost EUR8, fulfilment EUR4 and acquisition/service EUR6 per bottle with wholesale receipt EUR10, wine cost EUR8 and service EUR1. It also tests EUR8 DTC acquisition/service. Cellar-door/events need staff time; clubs need retention and records; online/hybrid needs fulfilment. Specialist bars and fine-dining accounts request training, while convenience and casual outlets propose quick-repeat formats. Travel and investment buyers request different stock/provenance conditions. No route has validated demand. Compare two feasible pilots and a full-cost sensitivity. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence."
    },
    {
      "id": "n_d12depth_case_outlets_action_point",
      "node_type": "learning_point",
      "name": "Compare two offers against their buyer tasks, capacity and measured repeat demand, using the EUR2 versus EUR1 supplied contribution cautiously"
    },
    {
      "id": "n_d12depth_case_outlets_reason_point",
      "node_type": "learning_point",
      "name": "DTC has a higher headline receipt but also fulfilment and acquisition/service costs; each outlet demands distinct support"
    },
    {
      "id": "n_d12depth_case_outlets_tradeoff_point",
      "node_type": "learning_point",
      "name": "Training, stock and fulfilment resources may improve fit but constrain scale; raising DTC service/acquisition to EUR8 removes its contribution"
    },
    {
      "id": "n_d12depth_case_outlets_limitation_point",
      "node_type": "learning_point",
      "name": "No named route guarantees lawful access, net profit, investment return or customer demand; full terms and evidence remain needed"
    },
    {
      "id": "n_d12depth_marketing_position",
      "node_type": "production_principle",
      "name": "What should a wine positioning statement join?"
    },
    {
      "id": "n_d12depth_marketing_position_point",
      "node_type": "learning_point",
      "name": "A defined intended buyer, benefit and evidence of difference from competing offers"
    },
    {
      "id": "n_d12depth_marketing_plan",
      "node_type": "production_principle",
      "name": "What turns a broad awareness idea into a reviewable launch plan?"
    },
    {
      "id": "n_d12depth_marketing_plan_point",
      "node_type": "learning_point",
      "name": "A measurable time-bound goal, budget, activities, owners and review baseline"
    },
    {
      "id": "n_d12depth_case_marketing",
      "node_type": "production_case",
      "name": "Fictional wine brand targets restaurant buyers as a business segment, based only on existing club gift-carton responses. A EUR2,000 budget could fund target-buyer tastings, sales training, sample formats or broad advertising. Competitor prices are dated; current staffing covers only ten accounts a week. Set a target, positioning and coordinated plan without assuming every restaurant shares club preferences. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence."
    },
    {
      "id": "n_d12depth_case_marketing_action_point",
      "node_type": "learning_point",
      "name": "Research intended buyer tasks, update competing offers and pilot a measurable account/reorder target within the ten-account weekly capacity"
    },
    {
      "id": "n_d12depth_case_marketing_reason_point",
      "node_type": "learning_point",
      "name": "Club gift preferences do not establish restaurant demand; positioning and the offer must fit the target's service and buying tasks"
    },
    {
      "id": "n_d12depth_case_marketing_tradeoff_point",
      "node_type": "learning_point",
      "name": "Focused research/training uses budget and initially limits reach but improves evidence and fulfilment fit"
    },
    {
      "id": "n_d12depth_case_marketing_limitation_point",
      "node_type": "learning_point",
      "name": "Small pilot response, dated rival prices and a stated capacity do not establish whole-market demand, optimal price or net profit"
    },
    {
      "id": "n_d12depth_campaign_net",
      "node_type": "production_principle",
      "name": "Fictional campaign A delivers 100 incremental orders at EUR8 contribution before campaign cost of EUR600. What modeled net contribution remains?"
    },
    {
      "id": "n_d12depth_campaign_net_point",
      "node_type": "learning_point",
      "name": "EUR200, before all omitted costs"
    },
    {
      "id": "n_d12depth_campaign_discount",
      "node_type": "production_principle",
      "name": "A discount reduces contribution from EUR4 to EUR2 per bottle with unchanged fixed costs. What volume replaces the old contribution from 1,000 bottles?"
    },
    {
      "id": "n_d12depth_campaign_discount_point",
      "node_type": "learning_point",
      "name": "2,000 bottles before additional support or capacity effects"
    },
    {
      "id": "n_d12depth_case_campaign",
      "node_type": "production_case",
      "name": "Fictional A adds100 orders with EUR8 contribution each and EUR600 promotion cost; B adds80 with EUR10 each and EUR300 promotion cost. Counts are stated as incremental against a matched baseline, and costs include fulfillment/service except later returns. A has more impressions; repeat and returns data are pending. Compare net contribution, discount sensitivity and a review decision. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence."
    },
    {
      "id": "n_d12depth_case_campaign_action_point",
      "node_type": "learning_point",
      "name": "Use EUR200 for A and EUR500 for B under the supplied basis, then review returns and repeat before allocating the next budget"
    },
    {
      "id": "n_d12depth_case_campaign_reason_point",
      "node_type": "learning_point",
      "name": "100 x8 -600 and80 x10 -300 compare contributions rather than impressions; B's modeled net is higher"
    },
    {
      "id": "n_d12depth_case_campaign_tradeoff_point",
      "node_type": "learning_point",
      "name": "A reaches more people while B's supplied economics are stronger; repeat, returns and future acquisition can change the decision"
    },
    {
      "id": "n_d12depth_case_campaign_limitation_point",
      "node_type": "learning_point",
      "name": "A matched baseline and fictional inputs do not guarantee causality, lasting demand, final accounting profit or unchanged scale costs"
    },
    {
      "id": "n_d12depth_fx_prefund",
      "node_type": "production_principle",
      "name": "A fictional EUR1,000 supplier payment can be prefunded today for home-currency850. What does this accomplish under the supplied quote?"
    },
    {
      "id": "n_d12depth_fx_prefund_point",
      "node_type": "learning_point",
      "name": "It obtains the stated euro amount now but uses cash early; an account holding does not create profit or protect against supplier failure"
    }
  ],
