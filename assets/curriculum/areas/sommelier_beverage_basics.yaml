knowledge_items:
  - id: ki_somm_basic_beer_ingredients
    subject_id: n_somm_basic_beer
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_somm_basic_beer_ingredients
    domain_id: service
    assertion_text: "The Brewers Association's beginner course identifies malted barley, water, hops and yeast as four key beer ingredients. The selection and use of ingredients helps create different styles. This is a useful starting vocabulary, not a world law requiring every beer to contain only those four things."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_basic_beer_glass
    subject_id: n_somm_basic_beer
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_somm_basic_beer_glass
    domain_id: service
    assertion_text: "The Brewers Association's draught-beer retail manual starts with a freshly cleaned glass free of visible soil, foam-killing residues and lingering cleaner or sanitizer aromas. A marked or greasy glass can impair foam or aroma; check the glass before treating the beer itself as faulty. This is trade service guidance, not a diagnosis of a specific draught system."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_basic_cider_perry
    subject_id: n_somm_basic_cider
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_somm_basic_cider_perry
    domain_id: service
    assertion_text: "The National Association of Cider Makers describes cider as fermented apple juice and perry as fermented juice from particular pear varieties. It says 'pear cider' is an alternative term for perry, and both drinks can have different styles. This trade description does not replace a jurisdiction's excise or labelling definition and does not tell you whether an individual bottle is dry or sweet."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_basic_sake_parallel
    subject_id: n_somm_basic_sake
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_somm_basic_sake_parallel
    domain_id: service
    assertion_text: "The Japan Sake and Shochu Makers Association describes sake as a fermented drink made from rice, koji and water. Koji helps turn rice starch into sugar while yeast turns the sugar into alcohol in the same mash; this is multiple parallel fermentation. Sake is therefore not distilled rice spirit or grape wine."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_basic_sake_temperature
    subject_id: n_somm_basic_sake
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_somm_basic_sake_temperature
    domain_id: service
    assertion_text: "The Japan Sake and Shochu Makers Association presents chilled, room-temperature and warmed sake as service choices. Temperature can change the flavours and aromas perceived in the same sake. Its illustrative ranges are chilled 8–15°C, room temperature 15–25°C and warmed 40–50°C; they are not a rule that every sake must be hot."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_basic_cigar_shape
    subject_id: n_somm_basic_cigar
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_somm_basic_cigar_shape
    domain_id: service
    assertion_text: "On Habanos' shapes page, parejo describes a straight-sided cigar. Its Piramide, popularly called a torpedo, is a figurado with a tapered head and shoulders; a double figurado is pointed at both ends. These are shape terms on the Habanos catalogue, not proof of protected origin, quality or safety."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_basic_cigar_gauge
    subject_id: n_somm_basic_cigar
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_somm_basic_cigar_gauge
    domain_id: service
    assertion_text: "Habanos states that ring gauge measures cigar diameter in sixty-fourths of an inch. A vitola de galera is its factory size name, while vitola de salida is the market name on a box; these need not match, and the same market name can describe different sizes across brands. A size name does not establish tobacco safety."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_basic_liqueur_identity
    subject_id: n_somm_basic_liqueur
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_somm_basic_liqueur_identity
    domain_id: service
    assertion_text: "In the consolidated EU spirit-drink regulation, Annex I category 33 describes liqueur as a sweetened spirit drink made using agricultural alcohol, an agricultural distillate or one or more spirit drinks, plus flavouring, agricultural products or foodstuffs. Its minimum strength is 15% vol. Strength alone does not make an unknown drink a liqueur, and this is the EU category rather than a world definition."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_basic_liqueur_exception
    subject_id: n_somm_basic_liqueur
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_somm_basic_liqueur_exception
    domain_id: service
    assertion_text: "The same EU category uses at least 100 grams per litre of sweetening products, expressed as invert sugar, in the ordinary case. It expressly gives lower 70- and 80-gram exceptions for specified cherry and plant-flavoured liqueurs. Do not teach 100 grams as a universal floor, infer a bottle's sweetness from its name alone, or apply this EU text worldwide."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_basic_aperitif_wine
    subject_id: n_somm_basic_aperitif
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_somm_basic_aperitif_wine
    domain_id: service
    assertion_text: "Under Regulation (EU) No 251/2014, aromatised wine is a flavoured wine-sector product in which the specified grapevine products make up at least 75% of total volume. Alcohol may be added. This EU wine-based category is distinct from the spirit-drink categories in Regulation (EU) 2019/787; 'aperitif' by itself does not determine the legal category."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_basic_aperitif_vermouth
    subject_id: n_somm_basic_aperitif
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_somm_basic_aperitif_vermouth
    domain_id: service
    assertion_text: "The vermouth description in Annex II of Regulation (EU) No 251/2014 is an aromatised wine to which alcohol may have been added and whose characteristic taste has been obtained using appropriate substances of Artemisia species. Vermouth is therefore an aromatised wine category in this EU framework, not simply any bitter spirit."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_basic_aperitif_bitter
    subject_id: n_somm_basic_aperitif
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_somm_basic_aperitif_bitter
    domain_id: service
    assertion_text: "In Annex I category 30 of Regulation (EU) 2019/787, a bitter-tasting spirit drink or bitter is a predominantly bitter spirit drink made by flavouring agricultural alcohol, an agricultural distillate or both. Its minimum strength is 15% vol. This category differs from vermouth's aromatised-wine framework; a bitter flavour alone does not classify an unexamined bottle."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_case_clean_glass_action
    subject_id: n_somm_case_clean_glass
    relation_type: CASE_ACTION
    object_id: n_somm_case_clean_glass_action
    domain_id: service
    assertion_text: "Offer a fresh draught sample in a freshly cleaned beer glass and check whether the foam problem recurs. Do not dismiss the guest's observation."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_case_clean_glass_reason
    subject_id: n_somm_case_clean_glass
    relation_type: CASE_REASON
    object_id: n_somm_case_clean_glass_reason
    domain_id: service
    assertion_text: "The Brewers Association manual says grease and other residues can destroy beer foam and that a beer-clean glass is free of lingering cleaner aromas."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_case_clean_glass_tradeoff
    subject_id: n_somm_case_clean_glass
    relation_type: CASE_TRADEOFF
    object_id: n_somm_case_clean_glass_tradeoff
    domain_id: service
    assertion_text: "If the problem recurs in a clean glass, investigate the dispense system or beer condition instead of assuming the glass was the only cause."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_case_clean_glass_limit
    subject_id: n_somm_case_clean_glass
    relation_type: CASE_LIMITATION
    object_id: n_somm_case_clean_glass_limit
    domain_id: service
    assertion_text: "The manual's glass-cleanliness section supports this first check; it cannot diagnose the particular tap or batch without further inspection."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_case_perry_action
    subject_id: n_somm_case_perry
    relation_type: CASE_ACTION
    object_id: n_somm_case_perry_action
    domain_id: service
    assertion_text: "Explain that the requested perry is fermented pear juice and offer a perry or 'pear cider' bottle if one is actually available; do not quietly substitute apple cider."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_case_perry_reason
    subject_id: n_somm_case_perry
    relation_type: CASE_REASON
    object_id: n_somm_case_perry_reason
    domain_id: service
    assertion_text: "The cider-makers' association distinguishes fermented apple cider from pear perry and notes that 'pear cider' is another term used for perry."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_case_perry_tradeoff
    subject_id: n_somm_case_perry
    relation_type: CASE_TRADEOFF
    object_id: n_somm_case_perry_tradeoff
    domain_id: service
    assertion_text: "The UK Finance (No. 2) Act 2023 can group qualifying apple- and pear-juice drinks under 'cider' for alcohol duty; that does not erase the useful apple-versus-pear distinction in a guest conversation."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_case_perry_limit
    subject_id: n_somm_case_perry
    relation_type: CASE_LIMITATION
    object_id: n_somm_case_perry_limit
    domain_id: service
    assertion_text: "The category alone does not establish whether a particular bottle is dry, sweet, still or sparkling. Check its label and actual stock rather than inventing those details."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_case_sake_temp_action
    subject_id: n_somm_case_sake_temp
    relation_type: CASE_ACTION
    object_id: n_somm_case_sake_temp_action
    domain_id: service
    assertion_text: "Ask the guest's preference and offer a sensible chilled, room-temperature or warmed tasting choice rather than claiming all sake must be hot."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_case_sake_temp_reason
    subject_id: n_somm_case_sake_temp
    relation_type: CASE_REASON
    object_id: n_somm_case_sake_temp_reason
    domain_id: service
    assertion_text: "The Japan Sake and Shochu Makers Association lists all three service ranges and explains that temperature changes flavour and aroma in the same sake."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_case_sake_temp_tradeoff
    subject_id: n_somm_case_sake_temp
    relation_type: CASE_TRADEOFF
    object_id: n_somm_case_sake_temp_tradeoff
    domain_id: service
    assertion_text: "Warming may bring out a different character; it remains a valid option when the guest wants it. Chilled service is also possible and is not a defect."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_case_sake_temp_limit
    subject_id: n_somm_case_sake_temp
    relation_type: CASE_LIMITATION
    object_id: n_somm_case_sake_temp_limit
    domain_id: service
    assertion_text: "The three ranges are illustrative, not a guarantee that the particular bottle or diner will prefer a temperature. A production class on the label does not by itself require hot service."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_case_shape_action
    subject_id: n_somm_case_shape
    relation_type: CASE_ACTION
    object_id: n_somm_case_shape_action
    domain_id: service
    assertion_text: "Explain, without arguing over a market nickname, that Habanos calls the tapered Piramide a figurado and uses parejo for straight-sided shapes."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_case_shape_reason
    subject_id: n_somm_case_shape
    relation_type: CASE_REASON
    object_id: n_somm_case_shape_reason
    domain_id: service
    assertion_text: "The Habanos shapes page explicitly places its Piramide after the straight-sided examples and labels it a figurado."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_case_shape_tradeoff
    subject_id: n_somm_case_shape
    relation_type: CASE_TRADEOFF
    object_id: n_somm_case_shape_tradeoff
    domain_id: service
    assertion_text: "The same catalogue distinguishes factory vitola de galera from market vitola de salida and says market names can vary by brand; use the observed shape as well as the printed name."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_case_shape_limit
    subject_id: n_somm_case_shape
    relation_type: CASE_LIMITATION
    object_id: n_somm_case_shape_limit
    domain_id: service
    assertion_text: "Shape and ring gauge do not establish protected origin, quality or safety. The registered tobacco-harm warning still applies to all cigars."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_case_liqueur_action
    subject_id: n_somm_case_liqueur
    relation_type: CASE_ACTION
    object_id: n_somm_case_liqueur_action
    domain_id: service
    assertion_text: "Check the bottle's actual legal name and available product information before calling it an EU liqueur. Fifteen percent alcohol is a floor for that category, not a complete definition; an ingredient list may not be available on the bottle."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_case_liqueur_reason
    subject_id: n_somm_case_liqueur
    relation_type: CASE_REASON
    object_id: n_somm_case_liqueur_reason
    domain_id: service
    assertion_text: "Annex I category 33 of the EU spirit-drink regulation requires a sweetened product from specified agricultural alcohol, distillate or spirit bases with flavouring, food or agricultural products, in addition to the minimum alcoholic strength."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_case_liqueur_tradeoff
    subject_id: n_somm_case_liqueur
    relation_type: CASE_TRADEOFF
    object_id: n_somm_case_liqueur_tradeoff
    domain_id: service
    assertion_text: "Do not turn the ordinary 100-gram-per-litre sweetening floor into a universal test: category 33 specifies 70- and 80-gram exceptions for certain liqueurs."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_case_liqueur_limit
    subject_id: n_somm_case_liqueur
    relation_type: CASE_LIMITATION
    object_id: n_somm_case_liqueur_limit
    domain_id: service
    assertion_text: "A regulation describes a category, not the unexamined bottle. Do not infer its exact sweetness or make a claim about other jurisdictions from this EU text."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_case_vermouth_action
    subject_id: n_somm_case_vermouth
    relation_type: CASE_ACTION
    object_id: n_somm_case_vermouth_action
    domain_id: service
    assertion_text: "Explain that the EU rules describe vermouth under aromatised wines and bitter-tasting spirit drink under spirit drinks. Check the products' actual labels instead of calling them the same legal category."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_case_vermouth_reason
    subject_id: n_somm_case_vermouth
    relation_type: CASE_REASON
    object_id: n_somm_case_vermouth_reason
    domain_id: service
    assertion_text: "Regulation (EU) No 251/2014 puts vermouth in its aromatised-wine list, permits added alcohol and requires characteristic Artemisia flavouring; Regulation (EU) 2019/787 category 30 defines a separate bitter-tasting spirit drink."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_case_vermouth_tradeoff
    subject_id: n_somm_case_vermouth
    relation_type: CASE_TRADEOFF
    object_id: n_somm_case_vermouth_tradeoff
    domain_id: service
    assertion_text: "Both products can be discussed as aperitif choices and may have bitter flavours; sharing a use or sensory term does not merge their EU legal categories."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true
  - id: ki_somm_case_vermouth_limit
    subject_id: n_somm_case_vermouth
    relation_type: CASE_LIMITATION
    object_id: n_somm_case_vermouth_limit
    domain_id: service
    assertion_text: "These are EU definitions, not a worldwide naming rule or an inspection of the particular bottles. The label and product specification must settle a borderline case."
    last_verified_at: "2026-09-28T00:00:00.000Z"
    verification_status: unverified
    mcq_disabled: true

