# CMS beverage fundamentals and applied service cases. These are educational
# category and presentation facts, not a claim of professional certification.
# No WSET Levels 1-3 or Diploma mappings; every item remains unverified.
knowledge_nodes:
  - { id: n_somm_basic_beer, node_type: production_principle, name: "What are beer's basic ingredients and glass-quality checks?" }
  - { id: n_somm_basic_beer_ingredients, node_type: learning_point, name: "Malt, water, hops and yeast are a useful starting vocabulary" }
  - { id: n_somm_basic_beer_glass, node_type: learning_point, name: "A beer-clean glass has no foam-killing residue" }
  - { id: n_somm_basic_cider, node_type: production_principle, name: "How do cider and perry differ?" }
  - { id: n_somm_basic_cider_perry, node_type: learning_point, name: "Apple cider and pear perry are fermented drinks" }
  - { id: n_somm_basic_sake, node_type: production_principle, name: "How is sake made and served?" }
  - { id: n_somm_basic_sake_parallel, node_type: learning_point, name: "Koji and yeast work in parallel" }
  - { id: n_somm_basic_sake_temperature, node_type: learning_point, name: "Chilled, room-temperature and warm service are choices" }
  - { id: n_somm_basic_cigar, node_type: production_principle, name: "What do Habano shape and size terms describe?" }
  - { id: n_somm_basic_cigar_shape, node_type: learning_point, name: "Parejo is straight-sided and figurado is shaped" }
  - { id: n_somm_basic_cigar_gauge, node_type: learning_point, name: "Ring gauge and vitola names describe size" }
  - { id: n_somm_basic_liqueur, node_type: production_principle, name: "What does the EU liqueur category require?" }
  - { id: n_somm_basic_liqueur_identity, node_type: learning_point, name: "Liqueur is a sweetened spirit-drink category" }
  - { id: n_somm_basic_liqueur_exception, node_type: learning_point, name: "The common sugar minimum has specified exceptions" }
  - { id: n_somm_basic_aperitif, node_type: production_principle, name: "How do vermouth and bitter spirit drinks differ?" }
  - { id: n_somm_basic_aperitif_wine, node_type: learning_point, name: "EU aromatised wine is built from grapevine products" }
  - { id: n_somm_basic_aperitif_vermouth, node_type: learning_point, name: "Vermouth's characteristic taste uses Artemisia" }
  - { id: n_somm_basic_aperitif_bitter, node_type: learning_point, name: "An EU bitter spirit drink is a separate category" }
  - { id: n_somm_case_clean_glass, node_type: production_case, name: "A draught beer loses its foam in a marked glass" }
  - { id: n_somm_case_clean_glass_action, node_type: learning_point, name: "Replace the glass and check the next pour" }
  - { id: n_somm_case_clean_glass_reason, node_type: learning_point, name: "Residue can destroy beer foam" }
  - { id: n_somm_case_clean_glass_tradeoff, node_type: learning_point, name: "A persistent problem may have another cause" }
  - { id: n_somm_case_clean_glass_limit, node_type: learning_point, name: "A glass check is not a draught-system diagnosis" }
  - { id: n_somm_case_perry, node_type: production_case, name: "A guest asks for perry and is offered apple cider" }
  - { id: n_somm_case_perry_action, node_type: learning_point, name: "Offer a pear-fermented perry if available" }
  - { id: n_somm_case_perry_reason, node_type: learning_point, name: "The fruit names identify different drinks" }
  - { id: n_somm_case_perry_tradeoff, node_type: learning_point, name: "Some UK duty language groups cider and perry" }
  - { id: n_somm_case_perry_limit, node_type: learning_point, name: "Do not infer the bottle's sweetness from the category" }
  - { id: n_somm_case_sake_temp, node_type: production_case, name: "A guest says all sake must be served hot" }
  - { id: n_somm_case_sake_temp_action, node_type: learning_point, name: "Offer a temperature choice" }
  - { id: n_somm_case_sake_temp_reason, node_type: learning_point, name: "Temperature changes the same sake's expression" }
  - { id: n_somm_case_sake_temp_tradeoff, node_type: learning_point, name: "Warm service is a valid option, not the only one" }
  - { id: n_somm_case_sake_temp_limit, node_type: learning_point, name: "Ask preference and assess the actual bottle" }
  - { id: n_somm_case_shape, node_type: production_case, name: "A guest calls a tapered Piramide a straight-sided parejo" }
  - { id: n_somm_case_shape_action, node_type: learning_point, name: "Explain the Habanos shape vocabulary" }
  - { id: n_somm_case_shape_reason, node_type: learning_point, name: "A Piramide is a figurado on the producer page" }
  - { id: n_somm_case_shape_tradeoff, node_type: learning_point, name: "Market and factory names may differ" }
  - { id: n_somm_case_shape_limit, node_type: learning_point, name: "Shape is not a health or quality guarantee" }
  - { id: n_somm_case_liqueur, node_type: production_case, name: "A guest calls any fifteen-percent spirit a liqueur" }
  - { id: n_somm_case_liqueur_action, node_type: learning_point, name: "Check the legal category beyond strength" }
  - { id: n_somm_case_liqueur_reason, node_type: learning_point, name: "EU liqueur also has sweetening and ingredient rules" }
  - { id: n_somm_case_liqueur_tradeoff, node_type: learning_point, name: "The common sugar floor has exceptions" }
  - { id: n_somm_case_liqueur_limit, node_type: learning_point, name: "Category text cannot authenticate an unknown bottle" }
  - { id: n_somm_case_vermouth, node_type: production_case, name: "A guest is told vermouth and bitter spirit are the same category" }
  - { id: n_somm_case_vermouth_action, node_type: learning_point, name: "Separate aromatised wine from spirit drink" }
  - { id: n_somm_case_vermouth_reason, node_type: learning_point, name: "The EU places them under different rules" }
  - { id: n_somm_case_vermouth_tradeoff, node_type: learning_point, name: "Both may taste bitter or be used as aperitifs" }
  - { id: n_somm_case_vermouth_limit, node_type: learning_point, name: "The name alone cannot classify another bottle" }

