    mcq_disabled: true
    last_verified_at: 2026-09-27T15:00:00.000Z
  - id: ki_wset_eu_navarra_rose_skin
    subject_id: n_wset_eu_principle_navarra
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_eu_point_navarra_rose_skin
    domain_id: winemaking
    assertion_text: Navarra’s Garnacha rosés illustrate how a red grape can make a pink wine. Shorter skin contact limits colour and tannin extraction compared with a red wine; fruit ripeness, extraction and cellar choices still vary among producers.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T15:00:00.000Z
  - id: ki_wset_eu_it_classico_origin
    subject_id: n_wset_eu_principle_italian_label_terms
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_eu_point_it_classico_origin
    domain_id: geography
    assertion_text: Classico refers to a defined traditional production area where the appellation’s rules permit the term. Chianti Classico is a separate appellation from Chianti. Classico does not identify an oak treatment, a grape variety or a universal ageing period.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T15:00:00.000Z
  - id: ki_wset_eu_it_riserva_maturation
    subject_id: n_wset_eu_principle_italian_label_terms
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_eu_point_it_riserva_maturation
    domain_id: geography
    assertion_text: Riserva signals additional requirements in an appellation’s specification, including maturation. Chianti Classico Riserva, for example, has a longer minimum maturation than Annata. Check the particular appellation; Riserva does not have one identical duration or oak programme across every Italian wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T15:00:00.000Z
  - id: ki_wset_eu_at_qualitaetswein
    subject_id: n_wset_eu_principle_austrian_origin_categories
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_eu_point_at_qualitaetswein
    domain_id: geography
    assertion_text: Austrian Qualitätswein belongs to the protected-origin wine framework, using permitted grapes from a specified wine-growing region and official approval. DAC identifies prescribed regional typicity within that framework; it is not merely the Austrian spelling for a grape variety.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T15:00:00.000Z
  - id: ki_wset_eu_at_predikatswein
    subject_id: n_wset_eu_principle_austrian_origin_categories
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_eu_point_at_predikatswein
    domain_id: geography
    assertion_text: Austrian Prädikatswein is Qualitätswein with specified ripeness or harvesting conditions. Names such as Spätlese, Beerenauslese, Eiswein and Trockenbeerenauslese refer to different conditions; do not confuse them with the origin information provided by a DAC name.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T15:00:00.000Z
  - id: ki_wset_eu_trentino_varieties
    subject_id: n_wset_eu_principle_trentino
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_eu_point_trentino_varieties
    domain_id: geography
    assertion_text: Trentino grows local grapes such as Nosiola, Marzemino and Teroldego alongside international varieties. Chardonnay is important for both still wines and traditional-method sparkling wines; the grape name alone does not identify the wine’s method or origin designation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T15:00:00.000Z
  - id: ki_wset_eu_trentino_sites
    subject_id: n_wset_eu_principle_trentino
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_eu_point_trentino_sites
    domain_id: viticulture
    assertion_text: Trentino vineyards range from valleys near Lake Garda to elevated terraces. Mountains, lakes, altitude and exposure create different growing conditions, so grape selection and harvest decisions need a particular site rather than one fixed climate description for all Trentino.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T15:00:00.000Z
  - id: ki_wset_eu_friuli_grave_varieties
    subject_id: n_wset_eu_principle_friuli_named_origins
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_eu_point_friuli_grave_varieties
    domain_id: geography
    assertion_text: Friuli Grave is a distinct appellation in Friuli-Venezia Giulia. Its board lists Pinot Grigio, Sauvignon, Chardonnay and Friulano whites, alongside red varietal wines. Reading the complete origin and grape name is more informative than assuming that every Friuli wine is Pinot Grigio.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T15:00:00.000Z
  - id: ki_wset_eu_collio_white_identity
    subject_id: n_wset_eu_principle_friuli_named_origins
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_eu_point_collio_white_identity
    domain_id: geography
    assertion_text: Collio is a separate hill appellation in Friuli-Venezia Giulia, strongly associated with white varieties including Friulano and Pinot Grigio. Its hillside setting and cellar choices can produce different textures and aromatic styles; it is not an alternative label for the flatter Friuli Grave area.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T15:00:00.000Z
  - id: ki_wset_eu_languedoc_red_blends
    subject_id: n_wset_eu_principle_languedoc_named_styles
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_eu_point_languedoc_red_blends
    domain_id: geography
    assertion_text: Minervois and Corbières reds commonly blend Mediterranean grapes including Syrah, Grenache, Mourvèdre and Carignan. Fitou is a red-wine appellation associated with this grape family. Blend proportions, site ripeness, extraction and maturation influence the actual fruit, tannin and body.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T15:00:00.000Z
  - id: ki_wset_eu_minervois_corbieres_colours
    subject_id: n_wset_eu_principle_languedoc_named_styles
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_eu_point_minervois_corbieres_colours
    domain_id: geography
    assertion_text: Minervois and Corbières are not exclusively red-wine appellations. They also make rosés and whites, using different grape families and skin-contact choices. Their whites can include Grenache Blanc, Marsanne, Roussanne and Bourboulenc; identify the wine colour and actual cuvée before predicting style.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T15:00:00.000Z
