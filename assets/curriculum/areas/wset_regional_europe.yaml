knowledge_items:
  - id: ki_wset_eu_fr_aoc_identity
    subject_id: n_wset_eu_principle_fr_origin
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_eu_point_fr_aoc_identity
    domain_id: geography
    assertion_text: For French wine, AOC is the national appellation terminology and AOP is its European protected-origin counterpart. A named appellation has a delimited origin and a production specification; it is not the name of a grape.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T15:00:00.000Z
  - id: ki_wset_eu_fr_igp_identity
    subject_id: n_wset_eu_principle_fr_origin
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_eu_point_fr_igp_identity
    domain_id: geography
    assertion_text: IGP protects a geographical indication linked to origin, reputation or characteristics. It still has a specification; Pays d’Oc is an IGP example, not an unregulated synonym for all southern French wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T15:00:00.000Z
  - id: ki_wset_eu_fr_vin_de_france
    subject_id: n_wset_eu_principle_fr_origin
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_eu_point_fr_vin_de_france
    domain_id: geography
    assertion_text: Vin de France identifies French provenance without a protected regional geographical indication. A varietal or vintage on an eligible label supplies different information from an AOP or IGP name.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T15:00:00.000Z
  - id: ki_wset_eu_bordeaux_dry_white
    subject_id: n_wset_eu_principle_bordeaux_white
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_eu_point_bordeaux_dry_white
    domain_id: winemaking
    assertion_text: Bordeaux, Graves and Pessac-Léognan dry whites commonly use Sauvignon Blanc and Sémillon. Cool fermentation can preserve fruit; barrel fermentation or maturation and lees contact can add texture and oak character, so check the cuvée rather than assume every white is oaked.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T15:00:00.000Z
  - id: ki_wset_eu_bordeaux_sweet_white
    subject_id: n_wset_eu_principle_bordeaux_white
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_eu_point_bordeaux_sweet_white
    domain_id: geography
    assertion_text: Sauternes and Barsac are associated with sweet whites from Sémillon, Sauvignon Blanc and Muscadelle, with noble rot central to the classic style. Concentrated fruit and retained sugar give sweetness, while acidity remains important to balance.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T15:00:00.000Z
  - id: ki_wset_eu_bordeaux_white_mlf
    subject_id: n_wset_eu_principle_bordeaux_white
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_eu_point_bordeaux_white_mlf
    domain_id: winemaking
    assertion_text: Allowing malolactic conversion can soften acidity and alter flavour; avoiding it can retain a sharper acid profile. Bordeaux white production includes both approaches according to fruit and target style.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T15:00:00.000Z
  - id: ki_wset_eu_bordeaux_superieur_identity
