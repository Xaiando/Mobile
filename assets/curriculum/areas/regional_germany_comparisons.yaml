# Original Germany regional comparisons and conditional decisions.
# All points are unverified; curation dates do not assert legal effective dates.
# MCQ disabled: qualified explanations and conditional decisions permit defensible alternatives.
knowledge_nodes:
  - id: n_reg_de_principle_mosel_slope_work
    node_type: production_principle
    name: How does a Mosel site comparison distinguish steep-vineyard working demands from the broader, less steep
      southern valley setting?
  - id: n_reg_de_point_mosel_steep_work
    node_type: learning_point
    name: Steep Mosel sites involve substantial manual vineyard work
  - id: n_reg_de_point_mosel_upper_setting
    node_type: learning_point
    name: The southern Mosel valley includes broader, less steep sites
  - id: n_reg_de_principle_saar_ruwer_sites
    node_type: production_principle
    name: Why should a Saar–Ruwer comparison examine exposure and relative elevation rather than infer one uniform
      Mosel growing condition?
  - id: n_reg_de_point_saar_exposure
    node_type: learning_point
    name: Saar vineyards occupy south-facing side-valley sites
  - id: n_reg_de_point_ruwer_relative_height
    node_type: learning_point
    name: Ruwer sites share a higher setting than the Mosel valley
  - id: n_reg_de_principle_mosel_riesling_elbling
    node_type: production_principle
    name: How do Riesling and Elbling present different ripening, berry and style considerations within Mosel
      study?
  - id: n_reg_de_point_mosel_riesling_energy
    node_type: learning_point
    name: Slow-ripening Riesling needs a site that supplies ripening energy
  - id: n_reg_de_point_mosel_elbling_berries
    node_type: learning_point
    name: Early Elbling ripening accompanies thin skins and fungal attention
  - id: n_reg_de_principle_nahe_shelter_diversity
    node_type: production_principle
    name: How do Nahe climatic shelter and diverse vineyard geology support a comparison without giving all its
      Rieslings one soil-derived flavour?
  - id: n_reg_de_point_nahe_shelter
    node_type: learning_point
    name: The Hunsrück shelters Nahe vineyards from cold winds
  - id: n_reg_de_point_nahe_site_variety
    node_type: learning_point
    name: Nahe geological and grape diversity calls for parcel and cellar evidence
  - id: n_reg_de_principle_rheingau_exposure_reds
    node_type: production_principle
    name: How do Rheingau exposure and the Assmannshausen red-wine association help compare wines without making
      the region uniformly Riesling?
  - id: n_reg_de_point_rheingau_riesling_exposure
    node_type: learning_point
    name: South-facing Rheingau slopes support Riesling’s long ripening
  - id: n_reg_de_point_rheingau_assmannshausen_red
    node_type: learning_point
    name: Assmannshausen provides a Rheingau Spätburgunder comparison
  - id: n_reg_de_principle_rheinhessen_climate_terrain
    node_type: production_principle
    name: How can Rheinhessen’s regional climatic shelter coexist with varied hill and terrace conditions?
  - id: n_reg_de_point_rheinhessen_shelter
    node_type: learning_point
    name: Western uplands shelter Rheinhessen’s warm summer setting
  - id: n_reg_de_point_rheinhessen_terrain
    node_type: learning_point
    name: Rheinhessen hills and Rhine terraces require local site comparison
  - id: n_reg_de_principle_rheinhessen_silvaner_grauburgunder
    node_type: production_principle
    name: What grape and cellar contrast is useful between Rheinhessen Silvaner and Grauburgunder without
      assigning fixed sweetness or quality?
  - id: n_reg_de_point_rheinhessen_silvaner_range
    node_type: learning_point
    name: Rheinhessen Silvaner permits restrained fresh or richer wood styles
  - id: n_reg_de_point_rheinhessen_grauburgunder_vessels
    node_type: learning_point
    name: Grauburgunder allows steel, larger wood and barrique choices
  - id: n_reg_de_principle_pfalz_shelter_styles
    node_type: production_principle
    name: Why does Pfalz shelter not imply one grape, sweetness or cellar expression for the region?
  - id: n_reg_de_point_pfalz_forest_shelter
    node_type: learning_point
