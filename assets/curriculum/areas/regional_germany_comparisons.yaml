  - id: n_reg_de_point_baden_pinot_light
    node_type: learning_point
    name: DWI describes a lighter, milder-tannin Spätburgunder expression
  - id: n_reg_de_point_baden_pinot_wood
    node_type: learning_point
    name: Spätburgunder can also show firmer colour and wood-derived aromas
  - id: n_reg_de_principle_ahr_pinot_work
    node_type: production_principle
    name: How do Ahr steep-site working demands and earlier Frühburgunder ripening offer different evidence for a
