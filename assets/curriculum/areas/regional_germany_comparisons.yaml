  - id: n_reg_de_point_wuerttemberg_lemberger_season
    node_type: learning_point
    name: Lemberger combines early budding and late ripening with varied structure
  - id: n_reg_de_principle_eastern_exposure_frost
    node_type: production_principle
    name: How do Saale-Unstrut and Sachsen support eastern German site comparisons without assuming latitude makes
      ripening impossible?
  - id: n_reg_de_point_saale_unstrut_sheltered_slopes
    node_type: learning_point
    name: Saale-Unstrut frost constraints make sheltered exposure important
  - id: n_reg_de_point_sachsen_day_night
    node_type: learning_point
    name: Sachsen combines continental day–night contrasts with terraced sites
  - id: n_reg_de_case_mosel_steep_budget
    node_type: production_case
    name: A Mosel winery compares two sound Riesling blocks of comparable current ripeness. The steep block has
      recorded manual-work hours and access expenses above those of the easier-access block; both can supply
      the planned volume. No finished-wine quality difference, customer demand or attainable price premium has
      been established. The winery has its own yield, labour and overhead records and can test customer
      interest. Propose an action, explain a reason, weigh a tradeoff and state a limitation before enlarging
      the steep-block programme.
  - id: n_reg_de_point_case_mosel_steep_budget_action
    node_type: learning_point
    name: Cost the Mosel steep-block programme and test customer demand
  - id: n_reg_de_point_case_mosel_steep_budget_reason
    node_type: learning_point
    name: Mosel slope can increase working demands without proving sensory value
  - id: n_reg_de_point_case_mosel_steep_budget_tradeoff
    node_type: learning_point
    name: Balance the Mosel programme’s target against its recorded cost burden
  - id: n_reg_de_point_case_mosel_steep_budget_limitation
    node_type: learning_point
    name: A Mosel cost comparison cannot establish an attainable premium
  - id: n_reg_de_case_riesling_sweetness_evidence
    node_type: production_case
    name: A wine educator is buying a Mosel Riesling and a Rheingau Riesling to demonstrate contrasting sweetness
      while keeping variety constant. Both producer quotes fit the budget, but no current samples,
      residual-sugar analyses or palate assessments have yet been obtained. A supplier calls Mosel Riesling
      always sweet and Rheingau Riesling always dry. Both producers can provide specifications and samples;
      producers and vineyard sites differ. Propose an action, explain a reason, discuss a tradeoff and state a
      limitation before assigning the two wines their tasting roles.
  - id: n_reg_de_point_case_riesling_sweetness_evidence_action
    node_type: learning_point
    name: Obtain the Riesling specifications and assess comparable coded samples
  - id: n_reg_de_point_case_riesling_sweetness_evidence_reason
    node_type: learning_point
    name: Riesling’s style range makes regional sweetness stereotypes unreliable
  - id: n_reg_de_point_case_riesling_sweetness_evidence_tradeoff
    node_type: learning_point
    name: A two-region Riesling demonstration trades accessibility for confounding
  - id: n_reg_de_point_case_riesling_sweetness_evidence_limitation
    node_type: learning_point
    name: The Riesling pair cannot prove region causes sweetness
  - id: n_reg_de_case_baden_pinot_cellar_trial
    node_type: production_case
    name: A Baden winery splits one sound Spätburgunder lot between a tank trial and a new-oak barrel trial. Coded
      assessments report that both trials are balanced; the tank trial meets a cherry-fruit brief with
      moderate tannin, while the barrel trial also shows vanilla and cinnamon. Recorded barrel and handling
      expenses exceed those of the tank route. The intended customers want clear cherry fruit, and no higher
      selling price for the oak version is established. Propose an action, explain a reason, weigh a tradeoff
      and state a limitation before scaling either route.
  - id: n_reg_de_point_case_baden_pinot_cellar_trial_action
    node_type: learning_point
    name: Use the Baden trial results and costs to choose a route for the brief
  - id: n_reg_de_point_case_baden_pinot_cellar_trial_reason
    node_type: learning_point
    name: Small oak can explain the Pinot trial’s vanilla and cinnamon
  - id: n_reg_de_point_case_baden_pinot_cellar_trial_tradeoff
    node_type: learning_point
    name: Weigh the oak trial’s confirmed aroma change against costs and demand
  - id: n_reg_de_point_case_baden_pinot_cellar_trial_limitation
    node_type: learning_point
    name: The Baden split trial cannot establish all barrel or tank outcomes
  - id: n_reg_de_case_saale_unstrut_frost_site
    node_type: production_case
    name: A Saale-Unstrut grower compares two proposed vineyard blocks before planting. Records identify repeated
      spring frost and poor air movement in the lower basin block; the other block is higher relative to that
      basin, faces south and has better observed air movement. Its quoted establishment cost is higher,
      although both fit the available capital budget. Comparable soil and water assessments are pending, and
      no block is guaranteed frost-free. Local temperature histories, intended-variety bud-break records and
      technical site advice can be obtained. Propose an action, explain a reason, weigh a tradeoff and state a
      limitation before committing to a block.
  - id: n_reg_de_point_case_saale_unstrut_frost_site_action
    node_type: learning_point
    name: Assess both Saale-Unstrut blocks before planting
  - id: n_reg_de_point_case_saale_unstrut_frost_site_reason
    node_type: learning_point
    name: Relative topography and air movement influence radiational frost risk
  - id: n_reg_de_point_case_saale_unstrut_frost_site_tradeoff
    node_type: learning_point
    name: Balance the higher block’s risk evidence against its additional cost
  - id: n_reg_de_point_case_saale_unstrut_frost_site_limitation
    node_type: learning_point
    name: A south-facing higher block is not protection from every freeze
