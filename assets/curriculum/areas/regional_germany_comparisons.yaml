  - id: n_reg_de_point_franken_silvaner_palate
    node_type: learning_point
    name: Franken Silvaner offers restrained aromas and generally mild acidity
  - id: n_reg_de_point_franken_muller_fresh
    node_type: learning_point
    name: Early Müller-Thurgau can supply a fresh, gently aromatic contrast
