knowledge_items:
  - id: ki_reg_de_mosel_steep_work
    subject_id: n_reg_de_principle_mosel_slope_work
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_de_point_mosel_steep_work
    domain_id: viticulture
    assertion_text: Steep Mosel and terraced sites involve substantial manual vineyard work. Slope and access
      therefore merit labour investigation; the landscape alone supplies neither a finished-wine score nor a
      premium that recovers those costs.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_mosel_upper_setting
    subject_id: n_reg_de_principle_mosel_slope_work
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_de_point_mosel_upper_setting
    domain_id: geography
    assertion_text: Moselwein describes a broader, less steep southern Mosel valley than the narrow terraced
      landscape downstream. Compare actual block slope and access rather than assign every Mosel vineyard the
      same labour conditions; this contrast does not rank wine quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_saar_exposure
    subject_id: n_reg_de_principle_saar_ruwer_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_de_point_saar_exposure
    domain_id: geography
    assertion_text: Saar vineyards include south-facing side-valley slopes between Serrig and Konz. Exposure is
      useful site context for a Riesling comparison, but the regional name alone cannot fix parcel ripeness,
      sweetness or quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_ruwer_relative_height
    subject_id: n_reg_de_principle_saar_ruwer_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_de_point_ruwer_relative_height
    domain_id: geography
    assertion_text: Moselwein describes Ruwer vineyards on south-facing slopes and, like Saar sites, at a higher
      elevation than the Mosel valley. Relative height and exposure deserve checking together; this is not
      proof that every Ruwer parcel is colder or every Saar wine tastes alike.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_mosel_riesling_energy
    subject_id: n_reg_de_principle_mosel_riesling_elbling
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_de_point_mosel_riesling_energy
    domain_id: viticulture
    assertion_text: "Riesling ripens slowly and retains marked acidity, so suitable exposure and site energy
      matter. Its Mosel association does not fix sweetness: Riesling has dry and sweet expressions, and the
      actual wine needs checking."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_mosel_elbling_berries
    subject_id: n_reg_de_principle_mosel_riesling_elbling
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_de_point_mosel_elbling_berries
    domain_id: viticulture
    assertion_text: Elbling, associated especially with the upper Mosel, ripens early and has thin skins requiring
      attention to fungal disease. DWI describes light, fresh examples; early maturity does not remove health
      monitoring or guarantee identical wines.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_nahe_shelter
    subject_id: n_reg_de_principle_nahe_shelter_diversity
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_de_point_nahe_shelter
    domain_id: geography
    assertion_text: The Hunsrück shelters the Nahe from cold winds, contributing to the region’s mild, sunny and
      relatively dry setting. Seasonal and parcel evidence still matters; shelter is context rather than a
      guarantee of successful ripening.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_nahe_site_variety
    subject_id: n_reg_de_principle_nahe_shelter_diversity
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_de_point_nahe_site_variety
    domain_id: geography
    assertion_text: Nahe vineyards include contrasting slate, porphyry, loess and loam settings, with Riesling and
      Pinot-family wines. Compare parcel and cellar records rather than infer one flavour from the region or
      transfer a soil’s minerals directly into wine aromas.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_rheingau_riesling_exposure
    subject_id: n_reg_de_principle_rheingau_exposure_reds
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_de_point_rheingau_riesling_exposure
    domain_id: geography
    assertion_text: The westward Rhine bend gives Rheingau vineyards prominent south-facing exposures; DWI
      connects these slopes with Riesling’s long ripening. Actual vintage and parcel records still determine
      maturity, rather than the regional name alone.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_rheingau_assmannshausen_red
    subject_id: n_reg_de_principle_rheingau_exposure_reds
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_de_point_rheingau_assmannshausen_red
    domain_id: geography
    assertion_text: Assmannshausen is an established Rheingau Spätburgunder association alongside regional
      Riesling. It offers a red comparison, but actual grape composition, extraction and maturation need
      checking before predicting the individual wine’s structure.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_rheinhessen_shelter
    subject_id: n_reg_de_principle_rheinhessen_climate_terrain
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_de_point_rheinhessen_shelter
    domain_id: geography
    assertion_text: Western uplands shelter Rheinhessen from heavier rain; DWI describes warm summers and
      comparatively mild winters. This frames regional growing conditions, while current rain and temperature
      observations remain necessary for a particular vintage.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_rheinhessen_terrain
    subject_id: n_reg_de_principle_rheinhessen_climate_terrain
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_de_point_rheinhessen_terrain
    domain_id: geography
    assertion_text: Rheinhessen combines rolling hills with Rhine-terrace and other local settings. Such varied
      terrain calls for local exposure and parcel evidence; the regional climate description cannot establish
      identical conditions or a uniform style for all vineyards.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_rheinhessen_silvaner_range
    subject_id: n_reg_de_principle_rheinhessen_silvaner_grauburgunder
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_de_point_rheinhessen_silvaner_range
    domain_id: winemaking
    assertion_text: Silvaner is an established Rheinhessen variety with generally mild acidity and restrained
      herbal or gooseberry aromas. Examples range from fresh light wines to creamy wood-matured styles; a
      Silvaner label does not settle the cellar treatment.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_rheinhessen_grauburgunder_vessels
    subject_id: n_reg_de_principle_rheinhessen_silvaner_grauburgunder
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_de_point_rheinhessen_grauburgunder_vessels
    domain_id: winemaking
    assertion_text: Grauburgunder, also grown in Rheinhessen, can be made in steel, larger wood or barrique,
      including biological acid reduction. Its often dry, moderately acidic profile has richer or sweeter
      alternatives; check the cuvée rather than impose one treatment or sweetness.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_pfalz_forest_shelter
    subject_id: n_reg_de_principle_pfalz_shelter_styles
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_de_point_pfalz_forest_shelter
    domain_id: geography
    assertion_text: Pfalz vineyards lie between the Rhine plain and Haardt under the shelter of the Pfälzerwald.
      That broad setting informs site assessment but does not replace block-level exposure, weather or
      fruit-condition observations.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_pfalz_grape_style_range
    subject_id: n_reg_de_principle_pfalz_shelter_styles
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_de_point_pfalz_grape_style_range
    domain_id: geography
    assertion_text: "Pfalz’s Riesling and white and red Pinot range prevents one uniform style: Riesling’s acidity
      and varied sweetness differ from Spätburgunder’s tannin and wood-treatment possibilities. Check actual
      variety and cellar details rather than impose one palate profile on the whole region."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_franken_silvaner_palate
    subject_id: n_reg_de_principle_franken_silvaner_muller
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_de_point_franken_silvaner_palate
    domain_id: geography
    assertion_text: Silvaner is closely associated with Franken and can show subtle herbal or gooseberry character
      and mild acidity. This is a palate comparison expectation, not proof of a specific soil flavour, cellar
      treatment or superior regional quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_franken_muller_fresh
    subject_id: n_reg_de_principle_franken_silvaner_muller
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_de_point_franken_muller_fresh
    domain_id: winemaking
    assertion_text: "Müller-Thurgau supplies a Franken alternative: early ripening, gentle acidity and lightly
      floral or muscat-like aromas. Stainless-steel production can preserve a fresh style, but neither the
      grape nor vessel guarantees balance or low quality."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_baden_kaiserstuhl_warm
    subject_id: n_reg_de_principle_baden_site_grapes
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_de_point_baden_kaiserstuhl_warm
    domain_id: geography
    assertion_text: The Kaiserstuhl has a notably warm Baden setting, while the long region contains varied
      climatic conditions. It is a useful comparison site, rather than proof that every Baden vineyard has
      identical heat, ripening or harvest conditions.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_baden_grape_context
    subject_id: n_reg_de_principle_baden_site_grapes
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_de_point_baden_grape_context
    domain_id: geography
    assertion_text: DWI describes northern Baden Riesling, Rivaner and Schwarzriesling associations, and stronger
      Pinot-family associations farther south, with Gutedel in Markgräflerland. Compare local variety and site
      evidence; these selected patterns neither form a legal grape list nor fix wine quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_baden_pinot_light
    subject_id: n_reg_de_principle_baden_pinot_cellar
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_de_point_baden_pinot_light
    domain_id: winemaking
    assertion_text: DWI describes a classic Spätburgunder expression with lighter colour and milder tannin. This
      supplies a Baden red comparison expectation, while actual extraction, ripeness and sample assessment are
      needed; pale colour does not establish poor quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_baden_pinot_wood
    subject_id: n_reg_de_principle_baden_pinot_cellar
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_de_point_baden_pinot_wood
    domain_id: winemaking
    assertion_text: Other Spätburgunders show stronger colour and tannin, sometimes with small-oak maturation. Oak
      can add vanilla or cinnamon notes. These cellar and style differences merit checking for Baden wines
      rather than treating darker colour or new wood as inherently better.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_ahr_steep_red_work
    subject_id: n_reg_de_principle_ahr_pinot_work
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_de_point_ahr_steep_red_work
    domain_id: viticulture
    assertion_text: Ahr’s steep red-wine sites involve demanding manual vine care and harvest, with Spätburgunder
      an established association. Cost records help assess that working burden; slope alone proves neither
      more complex flavour nor a profitable selling premium.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_ahr_fruehburgunder_timing
    subject_id: n_reg_de_principle_ahr_pinot_work
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_de_point_ahr_fruehburgunder_timing
    domain_id: viticulture
    assertion_text: Ahr also has a Frühburgunder specialty; DWI describes this Pinot relative as ripening earlier
      than Spätburgunder. Earlier maturity changes the harvest comparison, but does not itself guarantee sound
      fruit, frost avoidance, a particular sweetness or higher quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_wuerttemberg_trollinger_ripening
    subject_id: n_reg_de_principle_wuerttemberg_red_comparison
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_de_point_wuerttemberg_trollinger_ripening
    domain_id: viticulture
    assertion_text: Trollinger is a Württemberg red association that ripens late and needs suitable warmth. DWI
      commonly describes light, fresh reds with pale colour and delicate fruit; a lighter palate does not mean
      the variety ripens early or lacks site demands.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_wuerttemberg_lemberger_season
    subject_id: n_reg_de_principle_wuerttemberg_red_comparison
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_de_point_wuerttemberg_lemberger_season
    domain_id: viticulture
    assertion_text: Lemberger in Württemberg buds early and ripens late, favouring warm, sheltered sites. It can
      range from lighter fruit-led wines to more concentrated, tannic expressions; the name alone cannot
      settle frost damage, extraction or finished structure.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_saale_unstrut_sheltered_slopes
    subject_id: n_reg_de_principle_eastern_exposure_frost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_de_point_saale_unstrut_sheltered_slopes
    domain_id: geography
    assertion_text: Saale-Unstrut’s severe winters and late-spring frost risk make sheltered, south-facing slopes
      important. The valleys can form local warm settings; evaluate the actual site rather than assume every
      eastern German vineyard has the same frost or ripening outcome.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_sachsen_day_night
    subject_id: n_reg_de_principle_eastern_exposure_frost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_de_point_sachsen_day_night
    domain_id: geography
    assertion_text: DWI describes Sachsen’s continental setting with warm days and cool nights, and terraced Elbe
      slopes. These conditions allow meaningful local wine comparisons, but weather, exposure and fruit
      evidence are still needed before predicting maturity or assigning quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_case_mosel_steep_budget_action
    subject_id: n_reg_de_case_mosel_steep_budget
    relation_type: CASE_ACTION
    object_id: n_reg_de_point_case_mosel_steep_budget_action
    domain_id: business
    assertion_text: Compare the recorded block expenses, saleable volume and overhead allocation, then test demand
      at realistic prices before expanding. Use the winery’s evidence rather than assign an automatic
      steep-site premium.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_case_mosel_steep_budget_reason
    subject_id: n_reg_de_case_mosel_steep_budget
    relation_type: CASE_REASON
    object_id: n_reg_de_point_case_mosel_steep_budget_reason
    domain_id: viticulture
    assertion_text: Steep Mosel working conditions involve substantial hand work. The supplied hours and access
      expenses explain this case’s extra cost, but neither terrain nor labour is evidence of a superior
      finished wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_case_mosel_steep_budget_tradeoff
    subject_id: n_reg_de_case_mosel_steep_budget
    relation_type: CASE_TRADEOFF
    object_id: n_reg_de_point_case_mosel_steep_budget_tradeoff
    domain_id: business
    assertion_text: Keeping the steep-block programme may suit a customer proposition that testing confirms, but
      its higher recorded expenses reduce financial room at equal prices. Easier access lowers this case’s
      cost burden; it supplies no automatic quality advantage.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_case_mosel_steep_budget_limitation
    subject_id: n_reg_de_case_mosel_steep_budget
    relation_type: CASE_LIMITATION
    object_id: n_reg_de_point_case_mosel_steep_budget_limitation
    domain_id: business
    assertion_text: Costing and demand trials need updating as yields, expenses and customer response change. No
      supplied evidence establishes a finished-wine advantage or a premium sufficient to cover expansion;
      compare actual wines and sales evidence.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_case_riesling_sweetness_evidence_action
    subject_id: n_reg_de_case_riesling_sweetness_evidence
    relation_type: CASE_ACTION
    object_id: n_reg_de_point_case_riesling_sweetness_evidence_action
    domain_id: geography
    assertion_text: Request current wine specifications and assess coded samples under comparable conditions
      before assigning sweetness roles. Purchase a demonstrable contrast rather than accept the supplier’s
      regional stereotypes.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_case_riesling_sweetness_evidence_reason
    subject_id: n_reg_de_case_riesling_sweetness_evidence
    relation_type: CASE_REASON
    object_id: n_reg_de_point_case_riesling_sweetness_evidence_reason
    domain_id: geography
    assertion_text: Riesling has dry and sweet expressions. Acidity and fruit aroma are useful context, but
      neither the Mosel nor Rheingau name supplies this pair’s missing sugar and palate evidence.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_case_riesling_sweetness_evidence_tradeoff
    subject_id: n_reg_de_case_riesling_sweetness_evidence
    relation_type: CASE_TRADEOFF
    object_id: n_reg_de_point_case_riesling_sweetness_evidence_tradeoff
    domain_id: geography
    assertion_text: Keeping Riesling constant makes the sweetness lesson accessible, but the pair changes producer
      and vineyard as well as region. A narrower matched comparison could reduce confounding while showing
      less regional breadth; inspect specifications and records.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_case_riesling_sweetness_evidence_limitation
    subject_id: n_reg_de_case_riesling_sweetness_evidence
    relation_type: CASE_LIMITATION
    object_id: n_reg_de_point_case_riesling_sweetness_evidence_limitation
    domain_id: geography
    assertion_text: Two samples can demonstrate their own sweetness contrast once assessed, but cannot establish a
      regional cause, identify unknown origin or classify every Riesling. Production records and broader
      sampling would be needed to test regional patterns.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_case_baden_pinot_cellar_trial_action
    subject_id: n_reg_de_case_baden_pinot_cellar_trial
    relation_type: CASE_ACTION
    object_id: n_reg_de_point_case_baden_pinot_cellar_trial_action
    domain_id: winemaking
    assertion_text: Use the supplied coded assessments to favour the tank trial for the cherry-fruit brief,
      checking repeat samples and recorded costs before scaling. Preserve the oak trial as a separately
      evaluated option if customer testing supports it.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_case_baden_pinot_cellar_trial_reason
    subject_id: n_reg_de_case_baden_pinot_cellar_trial
    relation_type: CASE_REASON
    object_id: n_reg_de_point_case_baden_pinot_cellar_trial_reason
    domain_id: winemaking
    assertion_text: DWI identifies vanilla and cinnamon as possible wood-derived Spätburgunder notes. That context
      explains the barrel trial’s supplied aroma observations, without proving oak caused every sensory
      difference or that tank wines always have the same flavour.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_case_baden_pinot_cellar_trial_tradeoff
    subject_id: n_reg_de_case_baden_pinot_cellar_trial
    relation_type: CASE_TRADEOFF
    object_id: n_reg_de_point_case_baden_pinot_cellar_trial_tradeoff
    domain_id: business
    assertion_text: The oak route offers the observed additional wood expression but costs more in this case and
      may obscure the intended fruit emphasis. The tank route matches the supplied brief; neither option has a
      proven price or universal quality advantage.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_case_baden_pinot_cellar_trial_limitation
    subject_id: n_reg_de_case_baden_pinot_cellar_trial
    relation_type: CASE_LIMITATION
    object_id: n_reg_de_point_case_baden_pinot_cellar_trial_limitation
    domain_id: winemaking
    assertion_text: The results concern one lot and current trials. Reassess condition, batch consistency and
      customer response before scaling; they establish neither a universal oak benefit, an inevitable tank
      style nor the market performance of all Baden Pinot Noir.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_case_saale_unstrut_frost_site_action
    subject_id: n_reg_de_case_saale_unstrut_frost_site
    relation_type: CASE_ACTION
    object_id: n_reg_de_point_case_saale_unstrut_frost_site_action
    domain_id: viticulture
    assertion_text: Commission a site comparison using local temperature and air-drainage histories,
      intended-variety bud timing and the pending soil and water assessments. The supplied basin record flags
      risk; investigate the higher block before choosing it solely for exposure.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_case_saale_unstrut_frost_site_reason
    subject_id: n_reg_de_case_saale_unstrut_frost_site
    relation_type: CASE_REASON
    object_id: n_reg_de_point_case_saale_unstrut_frost_site_reason
    domain_id: viticulture
    assertion_text: Frost-prone low-airflow sites and height relative to surrounding terrain matter for
      radiational frost exposure. Saale-Unstrut’s regional spring-frost context makes these records relevant,
      while the case’s observed air movement is local evidence.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_case_saale_unstrut_frost_site_tradeoff
    subject_id: n_reg_de_case_saale_unstrut_frost_site
    relation_type: CASE_TRADEOFF
    object_id: n_reg_de_point_case_saale_unstrut_frost_site_tradeoff
    domain_id: business
    assertion_text: The higher block has more favourable supplied air-movement evidence, but needs more
      establishment spending. Both fit capital limits; compare that extra cost with a locally evidenced
      reduction in risk rather than treat affordable planting as proof of profitable returns.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
  - id: ki_reg_de_case_saale_unstrut_frost_site_limitation
    subject_id: n_reg_de_case_saale_unstrut_frost_site
    relation_type: CASE_LIMITATION
    object_id: n_reg_de_point_case_saale_unstrut_frost_site_limitation
    domain_id: viticulture
    assertion_text: Relative elevation and airflow can reduce some radiational frost exposure but do not eliminate
      windborne freeze or vulnerable bud stages. Pending site evidence and variable seasons prevent a
      guaranteed crop, fixed loss reduction or profitable-return prediction.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:35:19.637Z
