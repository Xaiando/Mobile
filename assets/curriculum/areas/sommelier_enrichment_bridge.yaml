knowledge_items:
  - id: ki_enrich_sake_pairing_intensity
    subject_id: n_enrich_sake_pairing
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_enrich_sake_pairing_intensity
    domain_id: service
    assertion_text: "The Japan Sake and Shochu Makers Association suggests starting with the relative intensity of both sake and food: delicate with delicate, rich with rich. It also suggests matching aromas, such as a roasted note in a sake with grilled or stewed food. These are pairing approaches, not a promise that any category name predicts the taste of a particular bottle."
    verification_status: unverified
    last_verified_at: "2026-09-29T10:59:00.000Z"
    mcq_disabled: true
  - id: ki_enrich_sake_pairing_temperature
    subject_id: n_enrich_sake_pairing
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_enrich_sake_pairing_temperature
    domain_id: service
    assertion_text: "The same trade-association guide gives temperature and contrast as other pairing options: chilled sake with chilled dishes, warm sake with warm dishes, or a sweet sake against an acidic or bitter dish. A sommelier should ask the guest's preference and test the actual sake and dish instead of claiming one mandatory pairing."
    verification_status: unverified
    last_verified_at: "2026-09-29T10:59:00.000Z"
    mcq_disabled: true
  - id: ki_enrich_case_sake_pairing_action
    subject_id: n_enrich_case_sake_pairing
    relation_type: CASE_ACTION
    object_id: n_enrich_case_sake_pairing_action
    domain_id: service
    assertion_text: "If the listed options are a delicate sake and a richer sake with roasted aromas, offer the delicate one as a first trial with the delicate fish and the richer roasted one with assertively grilled vegetables. Describe the two bottles to the guest and ask which direction they prefer; do not present either match as compulsory."
    verification_status: unverified
    last_verified_at: "2026-09-29T10:59:00.000Z"
    mcq_disabled: true
  - id: ki_enrich_case_sake_pairing_reason
    subject_id: n_enrich_case_sake_pairing
    relation_type: CASE_REASON
    object_id: n_enrich_case_sake_pairing_reason
    domain_id: service
    assertion_text: "The trade-association guide proposes matching intensity and echoing an aroma, including a roasted sake note with stewed or grilled food. Those features justify a starting comparison for these stated dishes and bottles, rather than a universal fish or vegetable rule."
    verification_status: unverified
    last_verified_at: "2026-09-29T10:59:00.000Z"
    mcq_disabled: true
  - id: ki_enrich_case_sake_pairing_tradeoff
    subject_id: n_enrich_case_sake_pairing
    relation_type: CASE_TRADEOFF
    object_id: n_enrich_case_sake_pairing_tradeoff
    domain_id: service
    assertion_text: "One guest may prefer a contrasting taste or a different serving temperature. The guide includes contrast and temperature as options, so explain the recommendation and let the guest choose, including one sake for both dishes if that is their preference."
    verification_status: unverified
    last_verified_at: "2026-09-29T10:59:00.000Z"
    mcq_disabled: true
  - id: ki_enrich_case_sake_pairing_limit
    subject_id: n_enrich_case_sake_pairing
    relation_type: CASE_LIMITATION
    object_id: n_enrich_case_sake_pairing_limit
    domain_id: service
    assertion_text: "The source describes general pairing ideas, not the taste of these hypothetical stocked bottles or this guest's reaction. Verify the actual list and food preparation, and avoid promising that the proposed match will work for everyone."
    verification_status: unverified
    last_verified_at: "2026-09-29T10:59:00.000Z"
    mcq_disabled: true
  - id: ki_enrich_cigar_service_identity
    subject_id: n_enrich_cigar_service
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_enrich_cigar_service_identity
    domain_id: service
    assertion_text: "Habanos' official authenticity tool can check the code on packaging claimed to be a Habano. It is a check for that protected product, not a universal identification system for non-Cuban cigars; a band, dark wrapper or shape alone does not authenticate a claimed Habano. Check the maker's own evidence for another cigar rather than applying a Habanos code to it."
    verification_status: unverified
    last_verified_at: "2026-09-29T10:59:00.000Z"
    mcq_disabled: true
  - id: ki_enrich_cigar_service_storage
    subject_id: n_enrich_cigar_service
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_enrich_cigar_service_storage
    domain_id: service
    assertion_text: "Habanos recommends storing its cigars at 16–18°C and 65–70% relative humidity with conditions kept steady. Its guidance says a household refrigerator is dry and can pass on smells, so a monitored humidor is the appropriate comparison for a claimed Habano. These are Habanos' product-care targets, not a statutory rule for every cigar."
    verification_status: unverified
    last_verified_at: "2026-09-29T10:59:00.000Z"
    mcq_disabled: true
  - id: ki_enrich_cigar_service_preparation
    subject_id: n_enrich_cigar_service
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_enrich_cigar_service_preparation
    domain_id: service
    assertion_text: "For a Habano where service is lawful and wanted, Habanos describes a cut just above the cap seam to retain the wrapper while opening a draw, and an odourless flame for lighting. Ask before any preparation, respect the venue's smoke-free rules, and do not imply that careful cutting, lighting or lack of inhalation makes tobacco safe; the WHO states all tobacco use and second-hand smoke exposure are harmful."
    verification_status: unverified
    last_verified_at: "2026-09-29T10:59:00.000Z"
    mcq_disabled: true
  - id: ki_enrich_case_cigar_service_action
    subject_id: n_enrich_case_cigar_service
    relation_type: CASE_ACTION
    object_id: n_enrich_case_cigar_service_action
    domain_id: service
    assertion_text: "Check the box's Habanos verification code if the seller claims protected origin, explain that the kitchen fridge is not Habanos' recommended storage, and offer suitable monitored humidor care if available. Confirm the guest wants any preparation and that local and venue rules allow it before cutting or lighting at a table."
    verification_status: unverified
    last_verified_at: "2026-09-29T10:59:00.000Z"
    mcq_disabled: true
  - id: ki_enrich_case_cigar_service_reason
    subject_id: n_enrich_case_cigar_service
    relation_type: CASE_REASON
    object_id: n_enrich_case_cigar_service_reason
    domain_id: service
    assertion_text: "The official code tool addresses the claimed Habano identity; the manufacturer's storage page says a refrigerator is dry and transmits smells. The separate service page describes a cap-preserving cut and odourless flame, while the WHO warns that tobacco and second-hand smoke remain harmful."
    verification_status: unverified
    last_verified_at: "2026-09-29T10:59:00.000Z"
    mcq_disabled: true
  - id: ki_enrich_case_cigar_service_tradeoff
    subject_id: n_enrich_case_cigar_service
    relation_type: CASE_TRADEOFF
    object_id: n_enrich_case_cigar_service_tradeoff
    domain_id: service
    assertion_text: "If compliant storage or permitted smoking space is unavailable, explain that limit and offer to leave the cigar unprepared; the guest may decline service. The manufacturer's cutting method is an option for an adult guest who requests it, not a reason to bypass venue policy or expose others to smoke."
    verification_status: unverified
    last_verified_at: "2026-09-29T10:59:00.000Z"
    mcq_disabled: true
  - id: ki_enrich_case_cigar_service_limit
    subject_id: n_enrich_case_cigar_service
    relation_type: CASE_LIMITATION
    object_id: n_enrich_case_cigar_service_limit
    domain_id: service
    assertion_text: "A packaging-code lookup does not establish the cigar's present condition or prove that a different maker's cigar is a Habano. The Habanos care guidance is product-specific. WHO's harm statement still applies; neither storage nor service makes tobacco or second-hand smoke safe."
    verification_status: unverified
    last_verified_at: "2026-09-29T10:59:00.000Z"
    mcq_disabled: true
  - id: ki_enrich_amarna_labels_content
    subject_id: n_enrich_amarna_labels
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_enrich_amarna_labels_content
    domain_id: service
    assertion_text: "University College London's Digital Egypt catalog describes Amarna wine labels as inscriptions on amphora shoulders that can name a production year, a vintner and a vineyard. Amarna belongs to Akhenaten's fourteenth-century BCE period. These are surviving records of wine provenance, not a modern appellation law or proof that wine began in Egypt."
    verification_status: unverified
    last_verified_at: "2026-09-29T10:59:00.000Z"
    mcq_disabled: true
  - id: ki_enrich_amarna_labels_object
    subject_id: n_enrich_amarna_labels
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_enrich_amarna_labels_object
    domain_id: service
    assertion_text: "The British Museum's Egyptian collection note describes inscribed pottery fragment EA 59337 as identifying a regnal year 6 wine from the Aten estate on the western river and naming the head vintner. This is one fragmentary label, not a complete surviving filled jar, a first-vintage claim or a certified geographic indication."
    verification_status: unverified
    last_verified_at: "2026-09-29T10:59:00.000Z"
    mcq_disabled: true
  - id: ki_enrich_case_ancient_evidence_action
    subject_id: n_enrich_case_ancient_evidence
    relation_type: CASE_ACTION
    object_id: n_enrich_case_ancient_evidence_action
    domain_id: service
    assertion_text: "Distinguish Areni-1's wine-production installation around 4000 calibrated BCE, Amarna's fourteenth-century BCE written wine provenance and the Met's Greek symposium krater of about 550 BCE. Put them in that order and name installation, inscription and service vessel, rather than calling all three appellation laws."
    verification_status: unverified
    last_verified_at: "2026-09-29T10:59:00.000Z"
    mcq_disabled: true
  - id: ki_enrich_case_ancient_evidence_reason
    subject_id: n_enrich_case_ancient_evidence
    relation_type: CASE_REASON
    object_id: n_enrich_case_ancient_evidence_reason
    domain_id: service
    assertion_text: "Areni's excavated installation supports a production setting, the Amarna inscriptions support labelled years and provenance, and the Greek krater catalog describes wine-and-water service. Each source addresses a different type of surviving evidence."
    verification_status: unverified
    last_verified_at: "2026-09-29T10:59:00.000Z"
    mcq_disabled: true
  - id: ki_enrich_case_ancient_evidence_tradeoff
    subject_id: n_enrich_case_ancient_evidence
    relation_type: CASE_TRADEOFF
    object_id: n_enrich_case_ancient_evidence_tradeoff
    domain_id: service
    assertion_text: "The Amarna estate and vineyard words make a useful bridge from production evidence to recorded provenance, but they should be described as ancient inscriptions rather than projected backwards as today's PDO, DOC or AVA systems."
    verification_status: unverified
    last_verified_at: "2026-09-29T10:59:00.000Z"
    mcq_disabled: true
  - id: ki_enrich_case_ancient_evidence_limit
    subject_id: n_enrich_case_ancient_evidence
    relation_type: CASE_LIMITATION
    object_id: n_enrich_case_ancient_evidence_limit
    domain_id: service
    assertion_text: "None of these artifacts proves the first wine, the first use of a label, how all people drank, or an unbroken legal chain to modern origin designations. The dates are dates of the cited contexts or objects, not invention dates."
    verification_status: unverified
    last_verified_at: "2026-09-29T10:59:00.000Z"
    mcq_disabled: true

