{
  "knowledge_nodes": [
    {
      "id": "n_d6c_denominator_principle",
      "node_type": "production_principle",
      "name": "What denominator check belongs before interpreting a wine-sales percentage?"
    },
    {
      "id": "n_d6c_denominator_point",
      "node_type": "learning_point",
      "name": "Identify what is counted, its baseline, coverage and units."
    },
    {
      "id": "n_d6c_causal_principle",
      "node_type": "production_principle",
      "name": "What limits a cause-and-effect conclusion from a before-and-after winery comparison?"
    },
    {
      "id": "n_d6c_causal_point",
      "node_type": "learning_point",
      "name": "Check selection, concurrent changes and a suitable comparison before attributing an effect."
    },
    {
      "id": "n_d6c_synthesis_principle",
      "node_type": "production_principle",
      "name": "What distinguishes research synthesis from a list of wine-source summaries?"
    },
    {
      "id": "n_d6c_synthesis_point",
      "node_type": "learning_point",
      "name": "Organise sources around a claim and weigh their agreement, conflict and limits."
    },
    {
      "id": "n_d6c_revision_principle",
      "node_type": "production_principle",
      "name": "What must happen when revising a paragraph that paraphrases a wine-market source?"
    },
    {
      "id": "n_d6c_revision_point",
      "node_type": "learning_point",
      "name": "Keep its citation, separate your inference and recheck the actual brief."
    },
    {
      "id": "n_d456_case_research_denominators",
      "node_type": "production_case",
      "name": "Original fictional D6 method packet, not an issued assignment or submission. Your practice inquiry asks whether younger adults in Region R are buying more wine directly from wineries. A voluntary online survey of 80 cellar-door visitors reports that 60% intend to buy again. A winery association reports direct-sales value rose 12%, but excludes nonmembers and does not provide prices, volume or ages. A retail survey covers shop purchases in another region. A draft treats these as proof that all young adults increased direct wine volume. All places, samples and figures are invented. Plan source appraisal and a bounded claim, then name evidence that could test a rival interpretation."
    },
    {
      "id": "n_d456_research_denominators_action_point",
      "node_type": "learning_point",
      "name": "Narrow the claim to what each sample measures and seek age-specific comparable direct-purchase volume evidence."
    },
    {
      "id": "n_d456_research_denominators_reason_point",
      "node_type": "learning_point",
      "name": "Visitor intentions, selected members' sales value and another region's retail sales measure different populations and outcomes."
    },
    {
      "id": "n_d456_research_denominators_tradeoff_point",
      "node_type": "learning_point",
      "name": "The sources may inform hypotheses cheaply but cannot replace missing representative observed behaviour."
    },
    {
      "id": "n_d456_research_denominators_limitation_point",
      "node_type": "learning_point",
      "name": "Check recruitment, nonresponse, age definitions, dates, price changes and raw denominators; repeated summaries do not make independent data."
    },
    {
      "id": "n_d456_case_research_competing",
      "node_type": "production_case",
      "name": "Original fictional D6 argument packet. A practice inquiry compares winery lightweight-bottle programmes. Eight self-selecting wineries report lower outbound freight spending after a package change; the same period also brought a carrier discount, lower dispatched volume and a different export mix. A bottle supplier's brochure attributes the entire saving to its glass. Two independent operators report no per-bottle saving but use different shipping distances. All sources, programmes and findings are invented and carry no actual emissions or transport calculations. Construct an argument outline that distinguishes observation, a plausible packaging mechanism, conflicting evidence and the limits of causal attribution; propose a useful follow-up."
    },
    {
      "id": "n_d456_research_competing_action_point",
      "node_type": "learning_point",
      "name": "State the observed spending change narrowly and compare plausible explanations before estimating a packaging effect."
    },
    {
      "id": "n_d456_research_competing_reason_point",
      "node_type": "learning_point",
      "name": "Carrier price, dispatched volume and export mix also changed. The wineries self-selected, which limits generalisation, but the packet does not establish a change in selection between periods. Different shipping distances make the independent reports imperfect comparators."
    },
    {
      "id": "n_d456_research_competing_tradeoff_point",
      "node_type": "learning_point",
      "name": "Commercial first-hand records are useful but interested and confounded; independent sources add challenge without automatically settling causation."
    },
    {
      "id": "n_d456_research_competing_limitation_point",
      "node_type": "learning_point",
      "name": "Request comparable per-bottle weights, shipments, routes and tariffs across periods plus uncertainty; no emissions saving or whole-sector effect can be estimated from this packet."
    },
    {
      "id": "n_d456_case_research_revision",
      "node_type": "production_case",
      "name": "Original fictional D6 revision exercise. A learner's own practice brief asks for a bounded comparison of wine-sales channels. Their draft claims that a region switched to direct sales, citing a trade article that repeats a voluntary winery survey. The paragraph includes paraphrased survey data without a citation, a quotation with no page or section record, and an unsupported concluding claim about all consumers. The source log has a URL but no author, date or method note. Word count is within the learner's practice target; that does not establish compliance with any current official brief. All claims and brief wording are invented. Design a revision checklist without writing an assessed submission."
    },
    {
      "id": "n_d456_research_revision_action_point",
      "node_type": "learning_point",
      "name": "Trace and cite the original survey, qualify the regional claim and revise the paragraph against the learner's actual brief."
    },
    {
      "id": "n_d456_research_revision_reason_point",
      "node_type": "learning_point",
      "name": "The current paragraph conceals selected-sample limits and does not separate sourced findings from the learner's inference."
    },
    {
      "id": "n_d456_research_revision_tradeoff_point",
      "node_type": "learning_point",
      "name": "A clearer bounded conclusion may be less dramatic but is more traceable; checking sources and references consumes revision time."
    },
    {
      "id": "n_d456_research_revision_limitation_point",
      "node_type": "learning_point",
      "name": "Confirm original author/date/method, exact quotation location, claim relevance and current presentation rules; the app checklist cannot judge originality or award a mark."
    }
  ],
