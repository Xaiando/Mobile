# Two original conditional frost paths; small Diploma-only climate/weather reasoning extension.
# All points await qualified review. Premises are hypothetical controls, not reported experiments.
# Generic MCQ is disabled because qualified mechanisms require the explicit cited contrasts below.
# Existing causal types and generic forward recall templates are reused without redeclaration.
knowledge_nodes:
  - id: n_climate_frost_wind_premise
    node_type: causal_premise
    name: On a clear, calm radiation-frost night, vineyard measurements show a warmer air layer within the
      intake reach of a correctly sited wind machine, above colder air at vine level. The fan mixes that
      reachable layer into the protected canopy before tissue reaches its damaging temperature. Compare
      with the same canopy without mixing while other heat losses are matched. No heaters or overhead
      sprinklers operate; there is no strong advective wind or ice fog. Trace only this measured
      inversion-mixing route, without assuming complete frost prevention.
  - id: n_climate_frost_wind_mixing
    node_type: causal_state
    name: Warmer inversion air is mixed into colder vine-level air
  - id: n_climate_frost_wind_warming
    node_type: causal_state
    name: Higher canopy-air temperature through redistribution of the existing warmer air
  - id: n_climate_frost_wind_wrong_new_heat
    node_type: causal_state
    name: Heat generation by the fan's mixing instead of redistribution of existing air heat
  - id: n_climate_frost_wind_wrong_cooling
    node_type: causal_state
    name: Lower canopy-air temperature from mixing with the measured warmer air
  - id: n_climate_frost_wind_wrong_strength_independent
    node_type: causal_state
    name: An inversion-mixing temperature gain independent of inversion strength
  - id: n_climate_frost_sprinkler_premise
    node_type: causal_premise
    name: A wine-grape block is exposed to frost while a designed overhead sprinkler system applies
      freshwater uniformly to vulnerable tissue. The supply is uninterrupted, the re-wetting interval is
      short enough to maintain an unfrozen water/ice interface, and water keeps freezing in contact with
      the coated tissue. Application rate and coverage are adequate to offset radiative and evaporative
      heat losses at the observed wind and minimum wet-bulb conditions, which remain within the system's
      design capacity. Wet-bulb and tissue-risk criteria governed starting before damaging cooling, and
      operation will continue until safe stopping conditions are confirmed. No wind machine operates.
      Trace the ongoing freezing mechanism, without assuming an ice coat alone guarantees protection.
  - id: n_climate_frost_sprinkler_freezing_heat
    node_type: causal_state
    name: Latent heat released as applied water freezes on the wetted tissue
  - id: n_climate_frost_sprinkler_temperature
    node_type: causal_state
    name: Near-freezing temperature at adequately wetted tissue while the specified supply and heat balance
      persist
  - id: n_climate_frost_sprinkler_wrong_melting_only
    node_type: causal_state
    name: Protective latent heat supplied only when the applied ice melts
  - id: n_climate_frost_sprinkler_wrong_stopped_supply
    node_type: causal_state
    name: Unchanged freezing-based protection after water supply stops during continuing heat loss
  - id: n_climate_frost_sprinkler_wrong_dry_bulb_stop
    node_type: causal_state
    name: Safe sprinkler shutoff from dry-bulb air above freezing alone despite unsafe wet-bulb conditions
