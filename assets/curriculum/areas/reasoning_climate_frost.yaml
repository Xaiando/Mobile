knowledge_items:
  - id: ki_climate_frost_wind_mixing
    subject_id: n_climate_frost_wind_premise
    relation_type: CAUSES_STATE
    object_id: n_climate_frost_wind_mixing
    domain_id: viticulture
    assertion_text: Under the measured reachable warm inversion and supplied fan operation, warmer air aloft
      is mixed into colder vine-level air. This premise isolates that mixing route, rather than assuming
      any frost event is suitable.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T13:36:39.000Z"
  - id: ki_climate_frost_wind_warming
    subject_id: n_climate_frost_wind_mixing
    relation_type: LEADS_TO
    object_id: n_climate_frost_wind_warming
    domain_id: viticulture
    assertion_text: Redistributing the existing warmer air raises canopy-air temperature relative to the
      matched unmixed comparison. The attainable gain depends on inversion characteristics and does not
      guarantee that every tissue remains above its injury threshold.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T13:36:39.000Z"
  - id: ki_climate_frost_wind_contra_new_heat
    subject_id: n_climate_frost_wind_premise
    relation_type: CONTRADICTS
    object_id: n_climate_frost_wind_wrong_new_heat
    domain_id: viticulture
    assertion_text: For this fan-mixing route, protection comes from redistribution of sensible heat already
      present in the air, not production of new heat by mixing; supplemental heaters are excluded.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T13:36:39.000Z"
  - id: ki_climate_frost_wind_contra_cooling
    subject_id: n_climate_frost_wind_premise
    relation_type: CONTRADICTS
    object_id: n_climate_frost_wind_wrong_cooling
    domain_id: viticulture
    assertion_text: The measured source layer is warmer than vine-level air. Mixing it into the canopy
      supplies warmer air, contradicting cooling caused by that mixing when other heat losses are
      matched.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T13:36:39.000Z"
  - id: ki_climate_frost_wind_contra_strength_independent
    subject_id: n_climate_frost_wind_premise
    relation_type: CONTRADICTS
    object_id: n_climate_frost_wind_wrong_strength_independent
    domain_id: viticulture
    assertion_text: The benefit from warm-layer mixing depends on inversion strength and characteristics. The
      premise therefore does not justify a temperature gain independent of that measured heat source.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T13:36:39.000Z"
  - id: ki_climate_frost_sprinkler_freezing_heat
    subject_id: n_climate_frost_sprinkler_premise
    relation_type: CAUSES_STATE
    object_id: n_climate_frost_sprinkler_freezing_heat
    domain_id: viticulture
    assertion_text: Applied water freezing in contact with the wetted tissue releases latent heat of fusion.
      The premise specifies ongoing freezing, sufficient rate and uniform re-wetting rather than a dry,
      static ice coating.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T13:36:39.000Z"
  - id: ki_climate_frost_sprinkler_temperature
    subject_id: n_climate_frost_sprinkler_freezing_heat
    relation_type: LEADS_TO
    object_id: n_climate_frost_sprinkler_temperature
    domain_id: viticulture
    assertion_text: With adequate continued freezing and the specified heat balance, the liquid-water/ice
      interface maintains coated tissue near freezing. Insufficient rate, uneven coverage, long
      re-wetting intervals or weather beyond design capacity can allow damaging cooling.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T13:36:39.000Z"
  - id: ki_climate_frost_sprinkler_contra_melting_only
    subject_id: n_climate_frost_sprinkler_premise
    relation_type: CONTRADICTS
    object_id: n_climate_frost_sprinkler_wrong_melting_only
    domain_id: viticulture
    assertion_text: Freezing releases the protective latent heat while irrigation continues. Melting ice
      requires heat input, so protection is not supplied only when the ice melts.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T13:36:39.000Z"
  - id: ki_climate_frost_sprinkler_contra_stopped_supply
    subject_id: n_climate_frost_sprinkler_premise
    relation_type: CONTRADICTS
    object_id: n_climate_frost_sprinkler_wrong_stopped_supply
    domain_id: viticulture
    assertion_text: A static ice coat does not maintain the stated freezing heat supply after application
      stops. Continuing radiation and evaporation or sublimation can cool coated tissue; interruption can
      worsen injury rather than preserve unchanged protection.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T13:36:39.000Z"
  - id: ki_climate_frost_sprinkler_contra_dry_bulb_stop
    subject_id: n_climate_frost_sprinkler_premise
    relation_type: CONTRADICTS
    object_id: n_climate_frost_sprinkler_wrong_dry_bulb_stop
    domain_id: viticulture
    assertion_text: Wet tissue can cool toward a wet-bulb temperature below dry-bulb air temperature.
      Dry-bulb warming above freezing alone therefore does not prove safe shutoff while wet-bulb
      conditions remain unsafe.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T13:36:39.000Z"
