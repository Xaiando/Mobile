knowledge_items:
  - id: ki_wset_l1_white_route
    subject_id: n_wset_l1_principle_white_route
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_l1_point_white_route
    domain_id: winemaking
    assertion_text: "For a typical white wine: harvest, crush if used, drain and press to separate juice from
      skins, ferment the juice, mature as intended, then prepare and bottle. Whole-bunch pressing can omit
      crushing; orange wines use a different skin-contact route."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_l1_red_route
    subject_id: n_wset_l1_principle_red_route
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_l1_point_red_route
    domain_id: winemaking
    assertion_text: "For a typical red wine: harvest, crush if used, ferment with skins, drain the wine and press
      the remaining solids, mature as intended, then prepare and bottle. Whole-berry or whole-bunch routes can
      omit crushing, and pressing time varies."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_l1_rose_route
    subject_id: n_wset_l1_principle_rose_route
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_l1_point_rose_route
    domain_id: winemaking
    assertion_text: A common rosé route is harvest, crush black grapes if used, allow brief skin contact, drain
      and press off the skins, ferment the separated juice, mature briefly as intended, then prepare and
      bottle. Direct pressing and other rosé routes also exist.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_l1_steps
    subject_id: n_wset_l1_principle_steps
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_l1_point_steps
    domain_id: winemaking
    assertion_text: Crushing breaks berries to release juice; draining separates free liquid, while pressing
      applies pressure to extract more liquid from solids. Fermentation converts sugar into alcohol and carbon
      dioxide. Maturation holds the wine before release; bottling fills and closes its final bottle.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_l1_chianti_style
    subject_id: n_wset_l1_principle_chianti_style
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_l1_point_chianti_style
    domain_id: tasting
    assertion_text: A typical young Chianti is a dry red with cherry or red-berry and sometimes floral character,
      lively acidity and noticeable drying tannin. It is often medium-bodied; blending, site, extraction and
      age change the profile, and mature tannins can soften.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_l1_cotes_rhone_style
    subject_id: n_wset_l1_principle_cotes_rhone_style
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_l1_point_cotes_rhone_style
    domain_id: tasting
    assertion_text: A typical Grenache-led red Côtes du Rhône is dry, fruity and medium- to full-bodied, with red
      fruit, warmth and sometimes spice. Syrah and Mourvèdre can add firmer structure. The blend, growing
      conditions and winemaking affect the actual tannin and body.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_l1_chateauneuf_style
    subject_id: n_wset_l1_principle_chateauneuf_style
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_l1_point_chateauneuf_style
    domain_id: tasting
    assertion_text: A typical red Châteauneuf-du-Pape is dry, Grenache-led and full-bodied, with ripe fruit,
      spice, alcohol warmth and substantial structure. The blend and producer change its tannin texture and
      flavour; age can bring more developed character. The appellation also makes white wines.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_l1_rioja_style
    subject_id: n_wset_l1_principle_rioja_style
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_l1_point_rioja_style
    domain_id: tasting
    assertion_text: Tempranillo-led Rioja can show red or black fruit with drying tannin and medium to full body.
      Young wines may emphasise fresh fruit; oak-matured styles can add vanilla or other wood-related
      character and softer tannin. Maturation and blend matter; not every Rioja tastes of oak.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_l1_climate_ripeness
    subject_id: n_wset_l1_principle_climate_ripeness
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_l1_point_climate_ripeness
    domain_id: viticulture
    assertion_text: Cool and warm describe relative growing-season temperatures. With the same variety and
      suitable growing conditions, greater warmth often allows more ripening and sugar accumulation; more
      grape sugar gives higher potential alcohol if fermented. Cooler sites often retain more acidity. Water
      stress, extreme heat, harvest timing and local cooling can change this pattern.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
