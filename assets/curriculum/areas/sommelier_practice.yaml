  - id: ki_somm_astr_mechanism
    subject_id: n_somm_astr
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_somm_astr_mechanism
    domain_id: service
    assertion_text: "A 2011 review by McRae and Kennedy says astringency is the drying and puckering sensation in the mouth. It says the sensation is generally thought to come from wine tannins interacting with salivary proteins, then from aggregation and precipitation of those complexes, which increases friction. It also says the exact mechanisms are not well understood. A cited experiment found that soluble aggregates of hydrolysable tannins with gelatin were astringent, so precipitation is not always required. The review says tannin structure and amount, polysaccharides, residual sugar, acidity, and ethanol can change the sensation. Reports on ethanol do not agree: some found that higher ethanol lowered perceived astringency in model wines, and one report found an increase. Do not teach one ethanol direction as settled."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_astr_not_food
    subject_id: n_somm_astr
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_somm_astr_not_food
    domain_id: service
    assertion_text: "The proteins in that account are salivary proteins. The review does not say that tannin binds the protein in meat or fish, and it does not name a correct dish. A harsh match is a reason to offer another wine. It is not proof that one food was chemically required."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
