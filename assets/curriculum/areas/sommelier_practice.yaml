    assertion_text: "The same review says salivary flow and the concentration of particular saliva proteins differ between people, and that a higher flow and higher concentrations of those proteins generally reduce perceived astringency. Two guests can disagree about one glass. The review does not make either of them wrong."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
