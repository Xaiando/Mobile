# CMS beverage and service practice; include in a new dataset release.
# CMS_CERTIFIED follows the Europe 2026/27 track in track_scope.yaml. These
# explanations supply beverage identity and service reasoning, not an official
# examination or performance assessment. Exam pages are not fact sources.
# No WSET Level 1–3 mappings. WSET_L4 is limited to wine-label and
# astringency items already selected by the original candidate.
# Reuses src_bev_eu_spirits_2019, src_bev_cognac_bnic, and src_wset_srv_who_cancer.
# Do not copy those URLs into this file. All items unverified.
# mcq_disabled because several careful wordings can be right.
# All facts are unverified; content and runtime validation remain required.
knowledge_nodes:
  - { id: n_somm_tequila, node_type: production_principle, name: "What must be true before a bottle is tequila?" }
  - { id: n_somm_tequila_plant, node_type: learning_point, name: "Blue agave, the appellation, and the strength band" }
  - { id: n_somm_tequila_place, node_type: learning_point, name: "The Council's account of the 1974 area" }
  - { id: n_somm_tequila_split, node_type: learning_point, name: "100 percent and the 51 percent category are different" }
  - { id: n_somm_tequila_age, node_type: learning_point, name: "Use the maturation paragraph, not the conflicting card" }
  - { id: n_somm_tequila_other, node_type: learning_point, name: "Another agave liquor is not tequila" }
  - { id: n_somm_grape, node_type: production_principle, name: "How do wine spirit, grape marc, and Cognac differ?" }
  - { id: n_somm_grape_wine, node_type: learning_point, name: "Wine spirit is distilled from wine" }
  - { id: n_somm_grape_marc, node_type: learning_point, name: "Grape marc spirit is not wine spirit" }
  - { id: n_somm_grape_cognac, node_type: learning_point, name: "Generic brandy ageing is not Cognac" }
  - { id: n_somm_beer, node_type: production_principle, name: "What do the modern beer-yeast names prove?" }
  - { id: n_somm_beer_species, node_type: learning_point, name: "Lager yeast in this paper is a hybrid" }
  - { id: n_somm_beer_hypothesis, node_type: learning_point, name: "1602 is a hypothesis, not an invention date" }
  - { id: n_somm_label, node_type: production_principle, name: "What does an allergen line require, and what does it not prove?" }
  - { id: n_somm_label_sulfite, node_type: learning_point, name: "Sulphites over 10 milligrams must be declared" }
  - { id: n_somm_label_fish, node_type: learning_point, name: "The isinglass exception is not a medical clearance" }
  - { id: n_somm_service, node_type: production_principle, name: "Which service limits are sourced, and which are not?" }
  - { id: n_somm_service_offence, node_type: learning_point, name: "England and Wales: do not knowingly sell to a drunk person" }
  - { id: n_somm_service_pairing, node_type: learning_point, name: "Do not invent a pairing mechanism" }
  - { id: n_somm_case_mix, node_type: production_case, name: "A guest treats every tequila as 100 percent agave" }
  - { id: n_somm_case_mix_action, node_type: learning_point, name: "Separate the two categories" }
  - { id: n_somm_case_mix_reason, node_type: learning_point, name: "Origin bottling and the sugar share are the split" }
  - { id: n_somm_case_mix_tradeoff, node_type: learning_point, name: "The 51 percent category can still be legal tequila" }
  - { id: n_somm_case_mix_limit, node_type: learning_point, name: "The page does not audit this bottle" }
  - { id: n_somm_case_card, node_type: production_case, name: "A guest ages reposado from the English class card" }
  - { id: n_somm_case_card_action, node_type: learning_point, name: "Refuse the one-year reposado figure" }
  - { id: n_somm_case_card_reason, node_type: learning_point, name: "The maturation paragraph says two months" }
  - { id: n_somm_case_card_tradeoff, node_type: learning_point, name: "Do not lock the card's barrel volume either" }
  - { id: n_somm_case_card_limit, node_type: learning_point, name: "The standard itself was not opened" }
  - { id: n_somm_case_marc, node_type: production_case, name: "A guest is poured Cognac when they asked for a marc spirit" }
  - { id: n_somm_case_marc_action, node_type: learning_point, name: "Say the raw materials differ" }
  - { id: n_somm_case_marc_reason, node_type: learning_point, name: "Marc is fermented grape marc, not wine" }
  - { id: n_somm_case_marc_tradeoff, node_type: learning_point, name: "Both are grape-derived spirits" }
  - { id: n_somm_case_marc_limit, node_type: learning_point, name: "The annex does not define grappa" }
  - { id: n_somm_case_oak, node_type: production_case, name: "A guest calls six months in small oak Cognac" }
  - { id: n_somm_case_oak_action, node_type: learning_point, name: "Keep generic brandy apart from Cognac" }
  - { id: n_somm_case_oak_reason, node_type: learning_point, name: "The ageing floors and the sale strengths differ" }
  - { id: n_somm_case_oak_tradeoff, node_type: learning_point, name: "A Cognac can also meet a generic description" }
  - { id: n_somm_case_oak_limit, node_type: learning_point, name: "Neither page authenticates the glass" }
  - { id: n_somm_case_yeast, node_type: production_case, name: "A guest says beer is one yeast" }
  - { id: n_somm_case_yeast_action, node_type: learning_point, name: "Give the two modern names" }
  - { id: n_somm_case_yeast_reason, node_type: learning_point, name: "The paper assigns them to different fermentations" }
  - { id: n_somm_case_yeast_tradeoff, node_type: learning_point, name: "A hybrid still has an ale-yeast parent" }
  - { id: n_somm_case_yeast_limit, node_type: learning_point, name: "One review is not every brewery" }
  - { id: n_somm_case_date, node_type: production_case, name: "A guest says lager was invented in 1602" }
  - { id: n_somm_case_date_action, node_type: learning_point, name: "Call 1602 a hypothesis" }
  - { id: n_somm_case_date_reason, node_type: learning_point, name: "The paper itself says bottom fermentation was older" }
  - { id: n_somm_case_date_tradeoff, node_type: learning_point, name: "The place can stay in the story as a proposal" }
  - { id: n_somm_case_date_limit, node_type: learning_point, name: "Do not teach a purity-law text from this paper" }
  - { id: n_somm_case_so2, node_type: production_case, name: "A guest reads contains sulphites as a maximum dose" }
  - { id: n_somm_case_so2_action, node_type: learning_point, name: "Call it a declaration threshold" }
  - { id: n_somm_case_so2_reason, node_type: learning_point, name: "The annex says more than 10 milligrams" }
  - { id: n_somm_case_so2_tradeoff, node_type: learning_point, name: "The line still matters to the guest" }
  - { id: n_somm_case_so2_limit, node_type: learning_point, name: "The wine ceiling is a different regulation" }
  - { id: n_somm_case_fish, node_type: production_case, name: "A guest with a fish allergy asks about isinglass" }
  - { id: n_somm_case_fish_action, node_type: learning_point, name: "State the exception and do not clear the wine" }
  - { id: n_somm_case_fish_reason, node_type: learning_point, name: "The annex excepts that fining use from the fish entry" }
  - { id: n_somm_case_fish_tradeoff, node_type: learning_point, name: "Offer another bottle rather than a medical answer" }
  - { id: n_somm_case_fish_limit, node_type: learning_point, name: "Labelling law is not clinical advice" }
  - { id: n_somm_case_drunk, node_type: production_case, name: "A drunk guest in England asks for another bottle" }
  - { id: n_somm_case_drunk_action, node_type: learning_point, name: "Do not knowingly make the sale" }
  - { id: n_somm_case_drunk_reason, node_type: learning_point, name: "Section 141 is the offence, not a health slogan" }
  - { id: n_somm_case_drunk_tradeoff, node_type: learning_point, name: "The statute does not define drunk" }
  - { id: n_somm_case_drunk_limit, node_type: learning_point, name: "The section is not a world rule" }
  - { id: n_somm_case_pair, node_type: production_case, name: "A guest demands the scientific reason a match failed" }
  - { id: n_somm_case_pair_action, node_type: learning_point, name: "Change the wine and skip the unsourced mechanism" }
  - { id: n_somm_case_pair_reason, node_type: learning_point, name: "No opened page here states a tannin rule" }
  - { id: n_somm_case_pair_tradeoff, node_type: learning_point, name: "A preference can be met without a theory" }
  - { id: n_somm_case_pair_limit, node_type: learning_point, name: "A later source could support a mechanism" }

  - { id: n_somm_calvados, node_type: production_principle, name: "What is Calvados on the INAO note, and what count is not?" }
  - { id: n_somm_calvados_distillate, node_type: learning_point, name: "A distillate of cider and perry, aged two years" }
  - { id: n_somm_calvados_area, node_type: learning_point, name: "The note's two area counts disagree" }
  - { id: n_somm_case_cider, node_type: production_case, name: "A guest is poured cider and told it is Calvados" }
  - { id: n_somm_case_cider_action, node_type: learning_point, name: "Name the distillate, not the cider" }
  - { id: n_somm_case_cider_reason, node_type: learning_point, name: "INAO ages the spirit for two years in oak" }
  - { id: n_somm_case_cider_tradeoff, node_type: learning_point, name: "The fruit can be the same" }
  - { id: n_somm_case_cider_limit, node_type: learning_point, name: "This note states no sale strength" }
  - { id: n_somm_case_count, node_type: production_case, name: "A guest memorizes one commune count" }
  - { id: n_somm_case_count_action, node_type: learning_point, name: "Refuse both counts" }
  - { id: n_somm_case_count_reason, node_type: learning_point, name: "The same note prints two different areas" }
  - { id: n_somm_case_count_tradeoff, node_type: learning_point, name: "The department names can still be discussed as the note" }
  - { id: n_somm_case_count_limit, node_type: learning_point, name: "Only the cahier is the legal text" }
  - { id: n_somm_armagnac, node_type: production_principle, name: "What may be said about Armagnac without describing a still?" }
  - { id: n_somm_armagnac_identity, node_type: learning_point, name: "A continuous still for most, and 40 percent at sale" }
  - { id: n_somm_armagnac_oak, node_type: learning_point, name: "The oak is not only Gascon" }
  - { id: n_somm_case_plates, node_type: production_case, name: "A guest asks for the plate-by-plate method" }
  - { id: n_somm_case_plates_action, node_type: learning_point, name: "Do not repeat the still path" }
  - { id: n_somm_case_plates_reason, node_type: learning_point, name: "The page's path is a process, not the lesson" }
  - { id: n_somm_case_plates_tradeoff, node_type: learning_point, name: "The 95 percent figure can still be stated" }
  - { id: n_somm_case_plates_limit, node_type: learning_point, name: "This page is not the cahier" }
  - { id: n_somm_case_oakwood, node_type: production_case, name: "A guest says Armagnac oak is only Gascon" }
  - { id: n_somm_case_oakwood_action, node_type: learning_point, name: "Name both forests and the sale strength" }
  - { id: n_somm_case_oakwood_reason, node_type: learning_point, name: "The page says mostly Gascony or Limousin" }
  - { id: n_somm_case_oakwood_tradeoff, node_type: learning_point, name: "Gascony can still be the larger share" }
  - { id: n_somm_case_oakwood_limit, node_type: learning_point, name: "Mostly is not a ban, and 95 percent is not a statute" }

  - { id: n_somm_astr, node_type: production_principle, name: "What does the opened astringency review support?" }
  - { id: n_somm_astr_mechanism, node_type: learning_point, name: "Drying and puckering, generally linked to saliva" }
  - { id: n_somm_astr_not_food, node_type: learning_point, name: "Saliva protein is not a menu rule" }
  - { id: n_somm_astr_guests, node_type: learning_point, name: "Two guests can differ" }
  - { id: n_somm_case_steak, node_type: production_case, name: "A guest says only steak can match a tannic red" }
  - { id: n_somm_case_steak_action, node_type: learning_point, name: "Refuse the only-steak rule" }
  - { id: n_somm_case_steak_reason, node_type: learning_point, name: "The review never tested a dish" }
  - { id: n_somm_case_steak_tradeoff, node_type: learning_point, name: "The guest may still drink the wine with steak" }
  - { id: n_somm_case_steak_limit, node_type: learning_point, name: "Food protein was not the experiment" }
  - { id: n_somm_case_two, node_type: production_case, name: "Two guests disagree about the same red wine" }
  - { id: n_somm_case_two_action, node_type: learning_point, name: "Do not award the argument" }
  - { id: n_somm_case_two_reason, node_type: learning_point, name: "Saliva differs" }
  - { id: n_somm_case_two_tradeoff, node_type: learning_point, name: "You can still describe the wine" }
  - { id: n_somm_case_two_limit, node_type: learning_point, name: "The review did not test these guests" }

