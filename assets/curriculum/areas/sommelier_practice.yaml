    subject_id: n_somm_case_steak
    relation_type: CASE_ACTION
    object_id: n_somm_case_steak_action
    domain_id: service
    assertion_text: "Do not agree that steak is the only match for a tannic red wine. Give the salivary-protein account, and say the review did not test a dish."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_case_steak_reason
    subject_id: n_somm_case_steak
    relation_type: CASE_REASON
    object_id: n_somm_case_steak_reason
    domain_id: service
    assertion_text: "The opened review explains a mouthfeel through saliva. Turning that into a rule that red wine requires red meat adds a food the paper did not study."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_case_steak_tradeoff
    subject_id: n_somm_case_steak
    relation_type: CASE_TRADEOFF
    object_id: n_somm_case_steak_tradeoff
    domain_id: service
    assertion_text: "The guest may still drink the wine with steak. The correction is the word only, not a ban on the combination they like."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_case_steak_limit
    subject_id: n_somm_case_steak
    relation_type: CASE_LIMITATION
    object_id: n_somm_case_steak_limit
    domain_id: service
    assertion_text: "A later cheese-and-wine experiment was not opened for this item. Do not rank cheeses or claim that food fat was measured here. The ethanol reports still disagree."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_case_two_action
    subject_id: n_somm_case_two
    relation_type: CASE_ACTION
    object_id: n_somm_case_two_action
    domain_id: service
    assertion_text: "Do not tell one guest that the other has the correct mouth. Say that the review expects perceived astringency to vary with saliva."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_case_two_reason
    subject_id: n_somm_case_two
    relation_type: CASE_REASON
    object_id: n_somm_case_two_reason
    domain_id: service
    assertion_text: "Higher salivary flow and higher concentrations of particular saliva proteins generally reduce the sensation in the review's account. The guests are reporting perception, not failing a test."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_case_two_tradeoff
    subject_id: n_somm_case_two
    relation_type: CASE_TRADEOFF
    object_id: n_somm_case_two_tradeoff
    domain_id: service
    assertion_text: "You can still describe the wine as tannic in the review's sense, drying and puckering, without declaring a winner between the guests."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_case_two_limit
    subject_id: n_somm_case_two
    relation_type: CASE_LIMITATION
    object_id: n_somm_case_two_limit
    domain_id: service
    assertion_text: "The review did not sample these two people. A disagreement can also be about bitterness, which the review treats as a different route for small condensed tannins. Do not collapse the two words."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true

