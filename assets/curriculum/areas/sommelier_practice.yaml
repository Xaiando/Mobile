knowledge_items:
  - id: ki_somm_tequila_plant
    subject_id: n_somm_tequila
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_somm_tequila_plant
    domain_id: service
    assertion_text: "The Tequila Regulatory Council's English page says a beverage is tequila only if it is produced in the areas authorized by the appellation, made from Agave tequilana Weber blue variety, and has an alcoholic content between 35% and 55% Alc. Vol. The page names NOM-006-SCFI-2012 as the standard. This item does not transcribe that standard and does not give cooking temperatures or a distillation procedure."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_tequila_place
    subject_id: n_somm_tequila
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_somm_tequila_place
    domain_id: service
    assertion_text: "The Council's appellation page says the area is 181 municipalities in Jalisco, Michoacán, Guanajuato, Nayarit, and Tamaulipas, and that the General Declaration of Protection was published on 9 December 1974. That is the Council's account of the declaration, not a transcription of the Official Gazette."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_tequila_split
    subject_id: n_somm_tequila
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_somm_tequila_split
    domain_id: service
    assertion_text: "The Council separates two categories. Tequila 100% agave is made from 100% of the sugars of Agave tequilana Weber blue and is bottled at origin. The category it calls Tequila uses at least 51% of the sugars of that agave and up to 49% other reducing sugars, and it may be bottled inside or outside the appellation. The CRT-hosted courtesy translation of NOM-006-SCFI-2012 says that 49% may not be sugars from any species of agave, and that the 51% may only be blue agave grown in the declaration territory. It also says cold mixing is not permitted, and it defines cold mixing as adding an alcoholic beverage other than tequila. Both categories can be tequila. They are not the same category. This is the courtesy translation, not the Diario Oficial, which was not opened."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_tequila_age
    subject_id: n_somm_tequila
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_somm_tequila_age
    domain_id: service
    assertion_text: "The Spanish Council page, the English maturation paragraph, and section 6.4 of the CRT courtesy translation of NOM-006 agree. Reposado is at least 2 months in oak or encino oak. Añejo is at least 1 year, and extra añejo at least 3 years, in containers whose maximum capacity is 600 litres. Section 6.4 does not put that 600-litre cap on reposado. The Spanish reposado card says barricas or a pipón and does not state 600 litres. The English class cards are the conflict: they give reposado a minimum of 1 year. Do not teach those cards. Section 4.36.1 says blanco, or silver, has no additives, its commercial strength is adjusted with water, and it may have been aged for less than two months. Do not teach that blanco never touched wood. Joven is a blend of white tequila with reposado, añejo, or extra añejo. The courtesy translation is not the Diario Oficial."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_tequila_other
    subject_id: n_somm_tequila
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_somm_tequila_other
    domain_id: service
    assertion_text: "The Council says that if there is no label it is not tequila, and that agave liquors, agave spirits, and agave elixirs are not tequila. The word agave does not by itself make a bottle tequila."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_grape_wine
    subject_id: n_somm_grape
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_somm_grape_wine
    domain_id: service
    assertion_text: "In the adopted Annex I of Regulation (EU) 2019/787, wine spirit is produced exclusively by distillation at less than 86% vol. of wine, of wine fortified for distillation, or of wine distillate distilled at less than 86% vol. It has at least 125 grams of volatile substances per hectolitre of 100% vol. alcohol, no more than 200 grams of methanol per hectolitre of 100% vol. alcohol, and a minimum strength of 37.5% vol. No alcohol is added and it is not flavoured. These are category rules, not a method to copy. The adopted text may since have been updated."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_grape_marc
    subject_id: n_somm_grape
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_somm_grape_marc
    domain_id: service
    assertion_text: "In that adopted annex, grape marc spirit is produced exclusively from grape marc fermented and distilled, either directly by water vapour or after water has been added. Every distillation is below 86% vol., and the first is in the presence of the marc. Lees may be added up to 25 kg per 100 kg of marc, and alcohol from the lees must not exceed 35% of the alcohol in the finished product. Volatile substances are at least 140 grams per hectolitre of 100% vol. alcohol, methanol is at most 1,000 grams per hectolitre, and the minimum strength is 37.5% vol. No alcohol is added. It is not flavoured, without precluding traditional methods. Caramel may be added only to adjust colour. Sweetening may round the taste, but the finished product must not exceed 20 grams of sweetening products per litre, expressed as invert sugar. It is not wine spirit. The annex does not define the name grappa. These figures are category rules, not a still to build."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_grape_cognac
    subject_id: n_somm_grape
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_somm_grape_cognac
    domain_id: service
    assertion_text: "Adopted Annex I makes brandy, or Weinbrand, from wine spirit. Wine distillate may be added only if it was distilled below 94.8% vol. and is no more than 50% of the finished product's alcohol. Brandy matures at least one year in oak receptacles of at least 1,000 litres, or six months in oak casks below 1,000 litres. Its minimum strength is 36% vol. No alcohol is added and it is not flavoured, without precluding traditional methods. Caramel may adjust colour only. Sweetening must not exceed 35 grams per litre as invert sugar. The BNIC account of Cognac is stricter and different: the youngest eau-de-vie spends at least two years in oak, and the spirit is sold at a minimum of 40% vol. Six months in small oak can satisfy generic brandy and still not be Cognac. The 94.8% figure is a legal ceiling on that optional distillate, not a target."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_beer_species
    subject_id: n_somm_beer
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_somm_beer_species
    domain_id: service
    assertion_text: "The 2023 FEMS Yeast Research paper uses the modern names this way: lager beer is made by a cold fermentation with Saccharomyces pastorianus, and ale is fermented at warmer temperatures with Saccharomyces cerevisiae. It states that S. pastorianus is a hybrid of S. cerevisiae and cold-tolerant Saccharomyces eubayanus. That is a species contrast, not a fermentation schedule and not a temperature law."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_beer_hypothesis
    subject_id: n_somm_beer
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_somm_beer_hypothesis
    domain_id: service
    assertion_text: "The same paper proposes, as a hypothesis, that the hybrid formed at the Munich Hofbräuhaus between 1602 and 1615. It also says bottom fermentation in parts of Bavaria was older than that date, and that modern species names should not be read back onto medieval yeast slurries. Do not teach 1602 as the invention of lager. The paper mentions the 1516 Bavarian purity ordinance in its historical narrative. This item does not transcribe that ordinance and does not treat it as current beer law."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_label_sulfite
    subject_id: n_somm_label
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_somm_label_sulfite
    domain_id: service
    assertion_text: "Revised Annex II of Regulation (EU) No 1169/2011, as published on legislation.gov.uk, lists sulphur dioxide and sulphites where the concentration is more than 10 mg/kg or 10 mg/litre of total SO2, calculated for the product as proposed ready for consumption or as reconstituted. That is a declaration threshold. It is not the maximum sulphur dioxide allowed in wine, and it does not say that a lower level is safe. The page reports no known outstanding UK effects on this annex. It is the UK publication of the EU regulation, not a check of every member-state text."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_label_fish
    subject_id: n_somm_label
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_somm_label_fish
    domain_id: service
    assertion_text: "The same annex lists fish and products thereof, then excepts fish gelatine or isinglass used as a fining agent in beer and wine. The exception concerns the allergen list. It is not a clinical guarantee that no fish protein remains, and it is not a reason to dismiss a guest who reports a fish allergy."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_service_offence
    subject_id: n_somm_service
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_somm_service_offence
    domain_id: service
    assertion_text: "Section 141 of the Licensing Act 2003, marked for England and Wales, makes it an offence, on relevant premises, knowingly to sell or attempt to sell alcohol to a person who is drunk, or to allow that sale. The opened subsection applies to staff with authority to sell the alcohol, the premises-licence holder, the designated premises supervisor, a club member or officer who is present and can prevent the sale, and the premises user for a temporary event. Supply of alcohol by a club to a member is covered as a sale is covered. The penalty stated is a fine not exceeding level 3 on the standard scale. The section does not define drunk. The page says it is up to date with changes in force on or before 27 September 2026 and also lists changes to the section that are not yet applied. It is not a rule for every country. The World Health Organization statement that there is no safe level of alcohol is a separate claim. It does not write this offence, and this offence does not replace that warning."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_service_pairing
    subject_id: n_somm_service
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_somm_service_pairing
    domain_id: service
    assertion_text: "A guest who dislikes a match still has a service problem, and the astringency account is a separate item. Offer another wine. The allergen declaration and, where section 141 applies, the duty not to sell to a person who is drunk remain in force. Changing the wine is not a claim that any amount of alcohol is safe."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_case_mix_action
    subject_id: n_somm_case_mix
    relation_type: CASE_ACTION
    object_id: n_somm_case_mix_action
    domain_id: service
    assertion_text: "Tell the guest that a bottle labelled only as tequila is not, on that word alone, the 100% agave category. Ask which category is in the glass before treating them as the same thing."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_case_mix_reason
    subject_id: n_somm_case_mix
    relation_type: CASE_REASON
    object_id: n_somm_case_mix_reason
    domain_id: service
    assertion_text: "The Council requires the 100% category to use only sugars of Agave tequilana Weber blue and to be bottled at origin. The other category may use up to 49% other reducing sugars and may be bottled outside the appellation. The courtesy translation adds that those other sugars may not come from any species of agave."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_case_mix_tradeoff
    subject_id: n_somm_case_mix
    relation_type: CASE_TRADEOFF
    object_id: n_somm_case_mix_tradeoff
    domain_id: service
    assertion_text: "Do not tell the guest the 51% category is fake. The Council still calls it tequila when the sugar share, the agave variety, the place, and the strength are met."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_case_mix_limit
    subject_id: n_somm_case_mix
    relation_type: CASE_LIMITATION
    object_id: n_somm_case_mix_limit
    domain_id: service
    assertion_text: "The Council pages explain the categories. They do not inspect the bottle on the table, and this item does not confirm a NOM number that has not been read."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_case_card_action
    subject_id: n_somm_case_card
    relation_type: CASE_ACTION
    object_id: n_somm_case_card_action
    domain_id: service
    assertion_text: "Do not agree that reposado means at least one year. The English class card says that. The English maturation paragraph and the Spanish Council page both say at least two months."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_case_card_reason
    subject_id: n_somm_case_card
    relation_type: CASE_REASON
    object_id: n_somm_case_card_reason
    domain_id: service
    assertion_text: "The conflict is inside the English page. Its maturation paragraph matches the Spanish page: two months, one year, and three years. Only the English class card collapses reposado and añejo onto one year."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_case_card_tradeoff
    subject_id: n_somm_case_card
    relation_type: CASE_TRADEOFF
    object_id: n_somm_case_card_tradeoff
    domain_id: service
    assertion_text: "Do not throw out every barrel figure because the English card is wrong. Section 6.4 of the courtesy translation, and the Spanish añejo and extra añejo cards, state a maximum of 600 litres for those two classes. Reposado is not given that cap. Keep the distinction."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_case_card_limit
    subject_id: n_somm_case_card
    relation_type: CASE_LIMITATION
    object_id: n_somm_case_card_limit
    domain_id: service
    assertion_text: "The courtesy translation hosted by the Council was opened. The Diario Oficial text of NOM-006 was not. Until that gazette is open, the two-month reposado rule and the 600-litre cap on añejo and extra añejo are the translation's wording, not a certified official-journal transcription. The one-year reposado card stays out."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_case_marc_action
    subject_id: n_somm_case_marc
    relation_type: CASE_ACTION
    object_id: n_somm_case_marc_action
    domain_id: service
    assertion_text: "Do not serve Cognac as if it answered a request for a grape-marc spirit. Say that one category starts from wine and the other from fermented grape marc, and ask which the guest wants."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_case_marc_reason
    subject_id: n_somm_case_marc
    relation_type: CASE_REASON
    object_id: n_somm_case_marc_reason
    domain_id: service
    assertion_text: "Adopted Annex I defines wine spirit from wine, wine fortified for distillation, or wine distillate. Grape marc spirit is defined from fermented grape marc. Cognac, on the BNIC page, is an aged wine-spirit appellation, not the marc category."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_case_marc_tradeoff
    subject_id: n_somm_case_marc
    relation_type: CASE_TRADEOFF
    object_id: n_somm_case_marc_tradeoff
    domain_id: service
    assertion_text: "Both drinks are grape-derived spirits, so the guest is not asking for an unrelated category such as a grain whisky. The correction is the raw material, not a claim that one is more authentic in the abstract."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_case_marc_limit
    subject_id: n_somm_case_marc
    relation_type: CASE_LIMITATION
    object_id: n_somm_case_marc_limit
    domain_id: service
    assertion_text: "The annex does not define grappa, Armagnac, or Calvados. Do not fill those names from memory. The adopted text may have been updated, and neither page proves what is in the glass."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_case_oak_action
    subject_id: n_somm_case_oak
    relation_type: CASE_ACTION
    object_id: n_somm_case_oak_action
    domain_id: service
    assertion_text: "Correct the guest. Six months in an oak cask under 1,000 litres can meet the adopted brandy rule. It does not meet the BNIC Cognac minimum of two years on the youngest eau-de-vie."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_case_oak_reason
    subject_id: n_somm_case_oak
    relation_type: CASE_REASON
    object_id: n_somm_case_oak_reason
    domain_id: service
    assertion_text: "Generic brandy's minimum strength in the adopted annex is 36% vol. The BNIC states 40% vol. at sale for Cognac, and age stops at bottling. The numbers answer different questions."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_case_oak_tradeoff
    subject_id: n_somm_case_oak
    relation_type: CASE_TRADEOFF
    object_id: n_somm_case_oak_tradeoff
    domain_id: service
    assertion_text: "A Cognac can satisfy the generic idea of brandy and still be a geographical indication with its own floor. Do not say brandy and Cognac are unrelated, and do not say they are the same rule."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_case_oak_limit
    subject_id: n_somm_case_oak
    relation_type: CASE_LIMITATION
    object_id: n_somm_case_oak_limit
    domain_id: service
    assertion_text: "The BNIC page is the interprofession account used in the registered pack, not a reading of every line of the 2026 order. The adopted EU text may have changed. Neither source tastes the glass."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_case_yeast_action
    subject_id: n_somm_case_yeast
    relation_type: CASE_ACTION
    object_id: n_somm_case_yeast_action
    domain_id: service
    assertion_text: "Separate the modern names. In this paper, ale fermentation uses Saccharomyces cerevisiae and lager fermentation uses Saccharomyces pastorianus. Do not answer with one yeast for every beer."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_case_yeast_reason
    subject_id: n_somm_case_yeast
    relation_type: CASE_REASON
    object_id: n_somm_case_yeast_reason
    domain_id: service
    assertion_text: "The paper says S. pastorianus is the hybrid used for bottom-fermented lager and that it came from S. cerevisiae and Saccharomyces eubayanus. Ale, in the modern sense it uses, is the warmer fermentation with S. cerevisiae."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_somm_case_yeast_tradeoff
