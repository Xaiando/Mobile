{
  "knowledge_nodes": [
    {
      "id": "n_d12depth_season_anatomy",
      "node_type": "production_principle",
      "name": "Which distinction should guide dormant pruning and spring canopy work?"
    },
    {
      "id": "n_d12depth_season_anatomy_point",
      "node_type": "learning_point",
      "name": "Retained one-year wood supplies buds; new shoots form this season's canopy"
    },
    {
      "id": "n_d12depth_season_timing",
      "node_type": "production_principle",
      "name": "Why should a vineyard management diary record developmental stage rather than rely on a fixed calendar?"
    },
    {
      "id": "n_d12depth_season_timing_point",
      "node_type": "learning_point",
      "name": "Stage and actual conditions govern the timing of interventions"
    },
    {
      "id": "n_d12depth_case_season",
      "node_type": "production_case",
      "name": "A fictional vineyard has rapid spring shoot growth, a shaded fruit zone at flowering and healthy leaves after an early harvest. It can fund one spring canopy pass and limited post-harvest water. A manager proposes waiting until shoots become woody to thin them and stopping all care on picking day. Compare seasonal priorities and explain the next-season consequence. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence."
    },
    {
      "id": "n_d12depth_case_season_action_point",
      "node_type": "learning_point",
      "name": "Schedule the canopy pass while shoots are manageable, then monitor post-harvest leaf and water status"
    },
    {
      "id": "n_d12depth_case_season_reason_point",
      "node_type": "learning_point",
      "name": "Spring canopy evidence and continuing leaf function link today's operations with bud development and reserves"
    },
    {
      "id": "n_d12depth_case_season_tradeoff_point",
      "node_type": "learning_point",
      "name": "Timely labour and water cost resources that must be weighed against vine balance and future crop risk"
    },
    {
      "id": "n_d12depth_case_season_limitation_point",
      "node_type": "learning_point",
      "name": "Neither a timely pass nor healthy leaves guarantee next year's yield; weather, buds, vine status and resources still matter"
    },
    {
      "id": "n_d12depth_berry_concentration",
      "node_type": "production_principle",
      "name": "A berry sample has higher sugar concentration but lower mean berry mass after a dry week. What remains unresolved?"
    },
    {
      "id": "n_d12depth_berry_concentration_point",
      "node_type": "learning_point",
      "name": "How much reflects sugar accumulation versus water loss"
    },
    {
      "id": "n_d12depth_berry_stage",
      "node_type": "production_principle",
      "name": "Which evidence best avoids treating veraison as the completion of harvest maturity?"
    },
    {
      "id": "n_d12depth_berry_stage_point",
      "node_type": "learning_point",
      "name": "Track composition, berry condition and intended style after ripening begins"
    },
    {
      "id": "n_d12depth_case_berry",
      "node_type": "production_case",
      "name": "Fictional Block A goes from 21 to 23 Brix while average berry mass falls from 2.0 to 1.6 g; titratable acidity falls and sensory samples remain uneven. Block B stays at 21 Brix with stable mass and representative samples meeting its fresh-white target. Water status and weather forecasts are incomplete. Compare harvesting and further sampling without declaring the sweeter sample the better wine. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence."
    },
    {
      "id": "n_d12depth_case_berry_action_point",
      "node_type": "learning_point",
      "name": "Sample both blocks representatively and match picking to each style and condition before delaying A"
    },
    {
      "id": "n_d12depth_case_berry_reason_point",
      "node_type": "learning_point",
      "name": "A's concentration and mass change may include dehydration; B's suitability is stated for a different target"
    },
    {
      "id": "n_d12depth_case_berry_tradeoff_point",
      "node_type": "learning_point",
      "name": "Waiting may improve some flavour development but risks further juice loss, acid change, disease and processing cost"
    },
    {
      "id": "n_d12depth_case_berry_limitation_point",
      "node_type": "learning_point",
      "name": "These measurements cannot quantify sugar per berry or guarantee sensory quality without more compositional and representative evidence"
    },
    {
      "id": "n_d12depth_site_scale",
      "node_type": "production_principle",
      "name": "Two blocks share a climate classification. What additional evidence is needed for site selection?"
    },
    {
      "id": "n_d12depth_site_scale_point",
      "node_type": "learning_point",
      "name": "Block weather, topography, soil constraints and operational access"
    },
    {
      "id": "n_d12depth_site_trend",
      "node_type": "production_principle",
      "name": "How should one unusually hot vintage inform a long-lived planting decision?"
    },
    {
      "id": "n_d12depth_site_trend_point",
      "node_type": "learning_point",
      "name": "Compare long-term patterns, extreme-event evidence and adaptable choices"
    },
    {
      "id": "n_d12depth_case_site",
      "node_type": "production_case",
      "name": "Two fictional 4 ha sites have the same regional warmth index. A costs EUR 120,000 and has observed cold-air pooling and a restrictive wet subsoil; B costs EUR 150,000 with better observed air drainage and a dry shallow root zone. A drainage quote is EUR 20,000; B's reliable water supply and delivery cost are unknown. Compare establishment costs, site risks and climate evidence. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence."
    },
    {
      "id": "n_d12depth_case_site_action_point",
      "node_type": "learning_point",
      "name": "Compare A's EUR 140,000 stated land-plus-drainage subtotal with B's EUR 150,000 before resolving water and other costs"
    },
    {
      "id": "n_d12depth_case_site_reason_point",
      "node_type": "learning_point",
      "name": "Matching warmth indices conceal distinct cold-air and root-zone evidence relevant to vine health and ripening"
    },
    {
      "id": "n_d12depth_case_site_tradeoff_point",
      "node_type": "learning_point",
      "name": "A's lower stated subtotal may add frost and drainage exposure; B may require water investment despite better air drainage"
    },
    {
      "id": "n_d12depth_case_site_limitation_point",
      "node_type": "learning_point",
      "name": "Neither subtotal is a full budget or proves suitability; variety, extremes, permissions, water, planting and operational data remain needed"
    },
    {
      "id": "n_d12depth_hazard_capacity",
      "node_type": "production_principle",
      "name": "What makes a hazard response plan operationally credible?"
    },
    {
      "id": "n_d12depth_hazard_capacity_point",
      "node_type": "learning_point",
      "name": "Match hazard timing and mechanism to reliable equipment and backup capacity"
    },
    {
      "id": "n_d12depth_hazard_smoke",
      "node_type": "production_principle",
      "name": "Why separate fire-injured vines from smoke-risk grape lots?"
    },
    {
      "id": "n_d12depth_hazard_smoke_point",
      "node_type": "learning_point",
      "name": "Vine survival and potential wine contamination require different evidence"
    },
    {
      "id": "n_d12depth_case_hazard",
      "node_type": "production_case",
      "name": "Fictional estate: a frost forecast follows budburst; a 6 ha sprinkler system has dependable water for only 3 ha throughout the event. A distant smoke event also affected two separate lots, and next week's hail risk is uncertain. Budget supports a 3 ha protected priority area, smoke sampling and one netted trial. Explain priorities, contingency and residual risk; no perfect protection is promised. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence."
    },
    {
      "id": "n_d12depth_case_hazard_action_point",
      "node_type": "learning_point",
      "name": "Protect only a defensible area with verified continuous capacity and keep smoke lots separate for assessment"
    },
    {
      "id": "n_d12depth_case_hazard_reason_point",
      "node_type": "learning_point",
      "name": "The stated water capacity limits reliable sprinkler coverage; smoke evidence answers a different hazard question"
    },
    {
      "id": "n_d12depth_case_hazard_tradeoff_point",
      "node_type": "learning_point",
      "name": "Prioritisation spends scarce money on selected blocks and tests while leaving some frost and hail exposure"
    },
    {
      "id": "n_d12depth_case_hazard_limitation_point",
      "node_type": "learning_point",
      "name": "Forecasts, equipment reliability, hazard type and laboratory interpretation can change the plan; the supplied capacity is hypothetical"
    },
    {
      "id": "n_d12depth_pests_mites",
      "node_type": "production_principle",
      "name": "What is missing from a plan that treats every bronzed grape leaf with the same broad spray?"
    },
    {
      "id": "n_d12depth_pests_mites_point",
      "node_type": "learning_point",
      "name": "Species identification, pest and predator counts, pressure and permitted control choice"
    },
    {
      "id": "n_d12depth_pests_moths",
      "node_type": "production_principle",
      "name": "Why must a grape moth or leafroller plan connect scouting with development stage?"
    },
    {
      "id": "n_d12depth_pests_moths_point",
      "node_type": "learning_point",
      "name": "Trap and larval evidence inform species-specific timing rather than one universal date"
    },
    {
      "id": "n_d12depth_case_pests",
      "node_type": "production_case",
      "name": "Fictional block has dusty access roads, bronzed leaves with both pest and predator mites, moth-trap captures and some larvae in bunches. Powdery mildew scouting and virus-status records are incomplete. A manager proposes one blanket spray and declares all remaining pests controlled. Compare a monitoring-led response across these distinct risks; no chemical product or legal permission is supplied. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence."
    },
    {
      "id": "n_d12depth_case_pests_action_point",
      "node_type": "learning_point",
      "name": "Identify organisms and assess block pressure before selecting targeted controls, reducing dust and filling disease evidence gaps"
    },
    {
      "id": "n_d12depth_case_pests_reason_point",
      "node_type": "learning_point",
      "name": "Mites, larvae, fungi and systemic infections have different biology; predator counts and timing affect the response"
    },
    {
      "id": "n_d12depth_case_pests_tradeoff_point",
      "node_type": "learning_point",
      "name": "Targeted scouting and dust management cost labour but may preserve useful predators and avoid unnecessary treatment"
    },
    {
      "id": "n_d12depth_case_pests_limitation_point",
      "node_type": "learning_point",
      "name": "The case supplies no local threshold, registered product, resistance plan or proof of control for every pest and disease"
    },
    {
      "id": "n_d12depth_approaches_comparison",
      "node_type": "production_principle",
      "name": "How can named vineyard approaches be compared without inventing a quality ranking?"
    },
    {
      "id": "n_d12depth_approaches_comparison_point",
      "node_type": "learning_point",
      "name": "Specify practices, site constraints, measured outcomes and the claim being assessed"
    },
    {
      "id": "n_d12depth_approaches_trial",
      "node_type": "production_principle",
      "name": "A cover-crop trial reduces erosion but increases dry-season vine stress. What evaluation is justified?"
    },
    {
      "id": "n_d12depth_approaches_trial_point",
      "node_type": "learning_point",
      "name": "Weigh both outcomes and adapt cover timing or area against costs"
    },
    {
      "id": "n_d12depth_case_approaches",
      "node_type": "production_case",
      "name": "Fictional dry slope compares current IPM with a seasonal cover and mapped targeted inputs. Trial results show erosion loss falling, water stress rising in permanent-cover rows, and EUR 400/ha extra monitoring labour. Scheme status and sensory results are not supplied. Evaluate seasonal cover timing, monitored zones and full cost while comparing all named approach goals. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence."
    },
    {
      "id": "n_d12depth_case_approaches_action_point",
      "node_type": "learning_point",
      "name": "Adapt the cover's area or seasonal timing and continue a controlled comparison with ground-checked zones"
    },
    {
      "id": "n_d12depth_case_approaches_reason_point",
      "node_type": "learning_point",
      "name": "The supplied trial shows both a soil benefit and water competition; mapping can target investigation but not establish its cause alone"
    },
    {
      "id": "n_d12depth_case_approaches_tradeoff_point",
      "node_type": "learning_point",
      "name": "Labour and cover costs may buy soil protection and input savings, but water and yield effects can offset them"
    },
    {
      "id": "n_d12depth_case_approaches_limitation_point",
      "node_type": "learning_point",
      "name": "No scheme certification, universal environmental superiority or wine-quality ranking follows from the supplied trial"
    },
    {
      "id": "n_d12depth_planting_sequence",
      "node_type": "production_principle",
      "name": "Why should soil constraints and planting-material identity be checked before ordering vines?"
    },
    {
      "id": "n_d12depth_planting_sequence_point",
      "node_type": "learning_point",
      "name": "They influence rootstock, scion, preparation, layout and long-lived investment"
    },
    {
      "id": "n_d12depth_planting_capital",
      "node_type": "production_principle",
      "name": "Fictional 2 ha planting uses 4,000 vines/ha at EUR 4 per plant. What is the plant-purchase subtotal?"
    },
    {
      "id": "n_d12depth_planting_capital_point",
      "node_type": "learning_point",
      "name": "EUR 32,000; other establishment and operating costs remain additional"
    },
    {
      "id": "n_d12depth_case_planting",
      "node_type": "production_case",
      "name": "Fictional replant: soil testing finds compaction and nematodes. A supplier offers named scion/rootstock material with health records at EUR 4/vine or untested layered own-rooted vines at EUR 1/vine. The plan is 2 ha at 4,000 vines/ha with 2.5 m machinery access. Soil preparation, water equipment and non-bearing-year cash are not quoted. Compare material, layout and capital before ordering. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence."
    },
    {
      "id": "n_d12depth_case_planting_action_point",
      "node_type": "learning_point",
      "name": "Resolve soil preparation and species-specific rootstock suitability, then cost the high-health 8,000-vine option against the full plan"
    },
    {
      "id": "n_d12depth_case_planting_reason_point",
      "node_type": "learning_point",
      "name": "Identity and health evidence reduce avoidable uncertainty; own-rooted propagation does not supply the named grafted/rootstock option"
    },
    {
      "id": "n_d12depth_case_planting_tradeoff_point",
      "node_type": "learning_point",
      "name": "The stated plant outlay is EUR 32,000 versus EUR 8,000, but cheaper stock may add health, replacement and crop risks"
    },
    {
      "id": "n_d12depth_case_planting_limitation_point",
      "node_type": "learning_point",
      "name": "Health and identity records do not prove species-specific nematode protection, compatibility, a full budget or immediate yield"
    },
    {
      "id": "n_d12depth_budget_water",
      "node_type": "production_principle",
      "name": "A fictional period needs 40 mm usable water, has 10 mm effective rain and 15 mm usable soil supply. What is the net irrigation shortfall?"
    },
    {
      "id": "n_d12depth_budget_water_point",
      "node_type": "learning_point",
      "name": "15 mm net; gross delivery depends on efficiency and site constraints"
    },
    {
      "id": "n_d12depth_budget_nutrition",
      "node_type": "production_principle",
      "name": "What should precede a nutrient application in a weak patch with unusual soil pH?"
    },
    {
      "id": "n_d12depth_budget_nutrition_point",
      "node_type": "learning_point",
      "name": "Representative soil and vine evidence identifying the actual limitation"
    },
    {
      "id": "n_d12depth_case_budget",
      "node_type": "production_case",
      "name": "Fictional 3 ha vineyard budget: crop need 40 mm, effective rain 10 mm and usable stored soil water 15 mm; irrigation delivery efficiency is 75%. Tissue results indicate adequate nitrogen, while one patch has compacted roots and abnormal pH. Fertiliser and water permissions are not supplied. Calculate the gross water volume (1 mm over 1 ha = 10 m3), compare intervention timing and identify missing evidence. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence."
    },
    {
      "id": "n_d12depth_case_budget_action_point",
      "node_type": "learning_point",
      "name": "Plan the stated 20 mm gross equivalent, or 600 m3 over 3 ha, while investigating root-zone and pH constraints before adding nitrogen"
    },
    {
      "id": "n_d12depth_case_budget_reason_point",
      "node_type": "learning_point",
      "name": "The fictional shortfall is 15 mm net and efficiency changes pumping; adequate tissue nitrogen does not support a deficiency diagnosis"
    },
    {
      "id": "n_d12depth_case_budget_tradeoff_point",
      "node_type": "learning_point",
      "name": "Water delivery, soil work and repeated measurements cost resources; extra nitrogen may add costs without solving the observed constraint"
    },
    {
      "id": "n_d12depth_case_budget_limitation_point",
      "node_type": "learning_point",
      "name": "The budget excludes deeper reserves, runoff, leaching needs and future rain; vine status and actual access must still be checked"
    },
    {
      "id": "n_d12depth_canopy_yield",
      "node_type": "production_principle",
      "name": "Fictional A yields 2 kg/vine at 5,000 vines/ha; B yields 3 kg/vine at 2,000 vines/ha. Which has higher tonnes/ha?"
    },
    {
      "id": "n_d12depth_canopy_yield_point",
      "node_type": "learning_point",
      "name": "A: 10 t/ha versus B: 6 t/ha"
    },
    {
      "id": "n_d12depth_canopy_exposure",
      "node_type": "production_principle",
      "name": "Why can the same severe fruit-zone leaf removal be unsuitable in two different sites?"
    },
    {
      "id": "n_d12depth_canopy_exposure_point",
      "node_type": "learning_point",
      "name": "Disease pressure, exposure timing and heat/sunburn risk differ"
    },
    {
      "id": "n_d12depth_case_canopy",
      "node_type": "production_case",
      "name": "Fictional A is humid, vigorous and shaded at 5,000 vines/ha with 2 kg/vine; B is hot and water-limited at 2,000 vines/ha with 3 kg/vine. One crew is available. A's equipment fits its rows; B's layout requires hand work. Compare canopy timing, crop numbers and labour without using yield as a quality score. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence."
    },
    {
      "id": "n_d12depth_case_canopy_action_point",
      "node_type": "learning_point",
      "name": "Prioritise a measured opening of A's dense zone while retaining protective exposure management for B and planning its hand labour"
    },
    {
      "id": "n_d12depth_case_canopy_reason_point",
      "node_type": "learning_point",
      "name": "A is 10 t/ha and B 6 t/ha; disease, heat, water and layout premises differ"
    },
    {
      "id": "n_d12depth_case_canopy_tradeoff_point",
      "node_type": "learning_point",
      "name": "A pass costs labour but may improve airflow; removing B's protection can raise exposure risk and requires hand resources"
    },
    {
      "id": "n_d12depth_case_canopy_limitation_point",
      "node_type": "learning_point",
      "name": "No crop number or selected system establishes wine quality, optimal yield or selling price without vine, fruit and market evidence"
    },
    {
      "id": "n_d12depth_harvest_route",
      "node_type": "production_principle",
      "name": "Which comparison keeps sweet-fruit routes distinct?"
    },
    {
      "id": "n_d12depth_harvest_route_point",
      "node_type": "learning_point",
      "name": "Drying, beneficial rot and natural freezing concentrate by different processes"
    },
    {
      "id": "n_d12depth_harvest_capacity",
      "node_type": "production_principle",
      "name": "Why should a whole-bunch style be planned before harvest method is booked?"
    },
    {
      "id": "n_d12depth_harvest_capacity_point",
      "node_type": "learning_point",
      "name": "Intact-fruit needs must match collection, transport and processing capacity"
    },
    {
      "id": "n_d12depth_case_harvest",
      "node_type": "production_case",
      "name": "Fictional 12 t crop meets a fresh-white maturity target today; rain risk rises tomorrow. Hand picking can deliver 2 t/hour of intact bunches for six hours; a booked machine can deliver 4 t/hour of berries, but the whole-bunch press plan cannot use that fruit unchanged. A separate drying trial loses 30% fruit mass. Compare timing, method and the independent sweet-fruit trial; no legal name eligibility is supplied. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence."
    },
    {
      "id": "n_d12depth_case_harvest_action_point",
      "node_type": "learning_point",
      "name": "Match the 12 t reception plan to six hours of intact-bunch picking or deliberately redesign the berry-processing route before choosing the machine"
    },
    {
      "id": "n_d12depth_case_harvest_reason_point",
      "node_type": "learning_point",
      "name": "The supplied capacities and fruit forms differ; a separate drying trial does not establish this fresh-white crop's desired style"
    },
    {
      "id": "n_d12depth_case_harvest_tradeoff_point",
      "node_type": "learning_point",
      "name": "Hand selection and intact fruit use more picking time; rapid machine delivery may shift sorting, pressing and oxidation-management tasks"
    },
    {
      "id": "n_d12depth_case_harvest_limitation_point",
      "node_type": "learning_point",
      "name": "Forecast, actual ripeness and recovery may change the plan; 30% mass loss is not a measured sugar, juice or legal category result"
    },
    {
      "id": "n_d12depth_components_balance",
      "node_type": "production_principle",
      "name": "Two wines have equal alcohol but different acidity, sugar and tannin. What follows?"
    },
    {
      "id": "n_d12depth_components_balance_point",
      "node_type": "learning_point",
      "name": "Alcohol alone cannot describe their complete balance"
    },
    {
      "id": "n_d12depth_components_method",
      "node_type": "production_principle",
      "name": "What evidence supports comparing natural, conventional, organic or biodynamic winemaking?"
    },
    {
      "id": "n_d12depth_components_method_point",
      "node_type": "learning_point",
      "name": "Actual processes, fruit, analyses and tasting rather than a name alone"
    },
    {
      "id": "n_d12depth_case_components",
      "node_type": "production_case",
      "name": "Fictional pilot wines share 12% alcohol. A has 2 g/L residual sugar and firmer acidity; B has 12 g/L sugar and lower acidity. A glycerol measurement differs, but blind tasting finds B sweeter without consistent preference. One label says natural; its processing and stability records are incomplete. Compare component balance and method evidence. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence."
    },
    {
      "id": "n_d12depth_case_components_action_point",
      "node_type": "learning_point",
      "name": "Describe measured balance and blind observations while requesting the natural lot's process and stability records"
    },
    {
      "id": "n_d12depth_case_components_reason_point",
      "node_type": "learning_point",
      "name": "Equal alcohol does not imply equal sugar-acid balance, aroma or texture; a label is not the tasting result"
    },
    {
      "id": "n_d12depth_case_components_tradeoff_point",
      "node_type": "learning_point",
      "name": "Different handling and stability controls may change resource use and expression, but their costs and outcomes need records"
    },
    {
      "id": "n_d12depth_case_components_limitation_point",
      "node_type": "learning_point",
      "name": "One glycerol result or small tasting cannot isolate every sensory cause or establish universal quality or certified status"
    },
    {
      "id": "n_d12depth_intake_throughput",
      "node_type": "production_principle",
      "name": "Fictional arrivals are 8 t/hour and the available press processes 4 t/hour. What is the immediate logistics issue?"
    },
    {
      "id": "n_d12depth_intake_throughput_point",
      "node_type": "learning_point",
      "name": "Fruit accumulates at 4 t/hour unless arrival or processing capacity changes"
    },
    {
      "id": "n_d12depth_intake_clarification",
      "node_type": "production_principle",
      "name": "Which distinction belongs in a pre-fermentation clarification comparison?"
    },
    {
      "id": "n_d12depth_intake_clarification_point",
      "node_type": "learning_point",
      "name": "Separation mechanism, solids target, throughput and fruit/oxygen response"
    },
    {
      "id": "n_d12depth_case_intake",
      "node_type": "production_case",
