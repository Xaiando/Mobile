knowledge_items:
  # Piedmont
  - id: ki_barolo_location
    subject_id: n_geo_barolo
    relation_type: LOCATED_IN
    object_id: n_geo_langhe
    domain_id: geography
    assertion_text: "Barolo is produced in the Langhe hills of Piedmont, a few kilometres south of Alba."
    last_verified_at: "2026-09-24T12:00:00.000Z"
  - id: ki_barolo_grape
    subject_id: n_geo_barolo
    relation_type: PERMITS_PRINCIPAL_GRAPE
    object_id: n_grape_nebbiolo
    domain_id: geography
    assertion_text: "Barolo is made exclusively from Nebbiolo."
    last_verified_at: "2026-09-24T12:00:00.000Z"
  - id: ki_barolo_soil
    subject_id: n_geo_barolo
    relation_type: HAS_SOIL
    object_id: n_soil_tortonian_marl
    domain_id: viticulture
    assertion_text: "Most of the Barolo zone lies on Tortonian marls and sands."
    last_verified_at: "2026-09-24T12:00:00.000Z"
  - id: ki_barolo_min_ageing
    subject_id: n_geo_barolo
    relation_type: MIN_AGEING
    object_id: n_qty_38_months
    domain_id: winemaking
    assertion_text: "Barolo must age at least 38 months from 1 November of the harvest year, 18 of them in wood; Barolo Riserva needs 62 months."
    last_verified_at: "2026-09-24T12:00:00.000Z"
    is_distinctive: true
  - id: ki_barolo_min_wood_ageing
    subject_id: n_geo_barolo
    relation_type: MIN_WOOD_AGEING
    object_id: n_qty_18_months
    domain_id: winemaking
    assertion_text: "At least 18 of Barolo's 38 months of minimum ageing must be spent in wood."
    last_verified_at: "2026-09-24T12:00:00.000Z"
  - id: ki_barbaresco_grape
    subject_id: n_geo_barbaresco
    relation_type: PERMITS_PRINCIPAL_GRAPE
    object_id: n_grape_nebbiolo
    domain_id: geography
    assertion_text: "Barbaresco is made exclusively from Nebbiolo."
    last_verified_at: "2026-09-24T12:00:00.000Z"
  - id: ki_barbaresco_soil
    subject_id: n_geo_barbaresco
    relation_type: HAS_SOIL
    object_id: n_soil_tortonian_marl
    domain_id: viticulture
    assertion_text: "Most of the Barbaresco zone lies on Tortonian marls and sands."
    last_verified_at: "2026-09-24T12:00:00.000Z"
  - id: ki_barbaresco_min_ageing
    subject_id: n_geo_barbaresco
    relation_type: MIN_AGEING
    object_id: n_qty_26_months
    domain_id: winemaking
    assertion_text: "Barbaresco must age at least 26 months from 1 November of the harvest year, 9 of them in wood; Barbaresco Riserva needs 50 months."
    last_verified_at: "2026-09-24T12:00:00.000Z"
    is_distinctive: true
  - id: ki_barbaresco_min_wood_ageing
    subject_id: n_geo_barbaresco
    relation_type: MIN_WOOD_AGEING
    object_id: n_qty_9_months
    domain_id: winemaking
    assertion_text: "At least 9 of Barbaresco's 26 months of minimum ageing must be spent in wood."
    last_verified_at: "2026-09-24T12:00:00.000Z"
  # Tuscany
  - id: ki_brunello_di_montalcino_grape
    subject_id: n_geo_brunello_di_montalcino
    relation_type: PERMITS_PRINCIPAL_GRAPE
    object_id: n_grape_sangiovese
    domain_id: geography
    assertion_text: "Brunello di Montalcino is made exclusively from Sangiovese, known in Montalcino as Brunello."
    last_verified_at: "2026-09-24T12:00:00.000Z"
  - id: ki_brunello_di_montalcino_min_wood_ageing
    subject_id: n_geo_brunello_di_montalcino
    relation_type: MIN_WOOD_AGEING
    object_id: n_qty_24_months
    domain_id: winemaking
    assertion_text: "Brunello di Montalcino must spend at least two years in oak."
    last_verified_at: "2026-09-24T12:00:00.000Z"
  - id: ki_chianti_classico_location
    subject_id: n_geo_chianti_classico
    relation_type: LOCATED_IN
    object_id: n_geo_tuscany
    domain_id: geography
    assertion_text: "The Chianti Classico zone lies in the centre of Tuscany, in the provinces of Florence and Siena."
    last_verified_at: "2026-09-24T12:00:00.000Z"
  - id: ki_chianti_classico_grape
    subject_id: n_geo_chianti_classico
    relation_type: PERMITS_PRINCIPAL_GRAPE
    object_id: n_grape_sangiovese
    domain_id: geography
    assertion_text: "Chianti Classico must contain 80–100% Sangiovese, and Chianti Classico Gran Selezione at least 90%."
    last_verified_at: "2026-09-24T12:00:00.000Z"
  - id: ki_chianti_classico_soil
    subject_id: n_geo_chianti_classico
    relation_type: HAS_SOIL
    object_id: n_soil_galestro
    domain_id: viticulture
    assertion_text: "The Chianti Classico hills are built largely of galestro, a friable clay schist, alternating with alberese limestone."
    last_verified_at: "2026-09-24T12:00:00.000Z"
  - id: ki_chianti_classico_climate
    subject_id: n_geo_chianti_classico
    relation_type: HAS_CLIMATE
    object_id: n_clim_continental
    domain_id: viticulture
    assertion_text: "The Chianti Classico production rules describe a continental climate, with very cold winters and hot, dry summers."
    last_verified_at: "2026-09-24T12:00:00.000Z"
    # Tuscany is also often called Mediterranean.
    mcq_disabled: true

