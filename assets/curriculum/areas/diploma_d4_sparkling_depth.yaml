knowledge_items:
- id: ki_d4depth_champ_reserve
  subject_id: n_d4depth_principle_champ_reserve
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d4depth_point_champ_reserve
  domain_id: winemaking
  assertion_text: Champagne houses retain reserve wines and blend across years to support a recognizable house style
    despite vintage variation. Maintaining reserves ties up wine and storage; the label alone does not prove the
    blend or sensory quality.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_champ_vintage
  subject_id: n_d4depth_principle_champ_vintage
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d4depth_point_champ_vintage
  domain_id: winemaking
  assertion_text: A vintage Champagne uses grapes from the stated harvest and requires at least three years of cellar
    ageing from bottling, compared with at least 15 months for non-vintage Champagne. The extra inventory time can
    add carrying cost; vintage does not guarantee superior quality.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_champ_rose
  subject_id: n_d4depth_principle_champ_rose
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d4depth_point_champ_rose
  domain_id: winemaking
  assertion_text: Rosé Champagne can gain colour from macerating dark-skinned grapes or by blending red Champagne
    wine into the white base before secondary fermentation. Colour route alone does not specify sweetness, lees
    time or quality.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_alsace_grapes
  subject_id: n_d4depth_principle_alsace_grapes
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d4depth_point_alsace_grapes
  domain_id: winemaking
  assertion_text: Pinot Blanc is a major white Crémant d’Alsace grape; Riesling, Pinot Gris and Chardonnay can change
    fruit, weight and freshness, while rosé is from Pinot Noir. The appellation does not imply one grape or flavour
    profile.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_alsace_harvest
  subject_id: n_d4depth_principle_alsace_harvest
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d4depth_point_alsace_harvest
  domain_id: winemaking
  assertion_text: Crémant d’Alsace grapes are hand-harvested as whole bunches and pressed without crushing or destemming.
    Those handling requirements protect delicate base juice but add a labour and handling constraint.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_loire_variety
  subject_id: n_d4depth_principle_loire_variety
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d4depth_point_loire_variety
  domain_id: winemaking
  assertion_text: The Loire interprofessional body describes single-variety Vouvray sparkling, made from Chenin,
    beside multi-variety Crémant de Loire. Both use traditional-method rules; a buyer should request the actual
    grapes and lees record rather than infer identical style from method.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_cava_age
  subject_id: n_d4depth_principle_cava_age
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d4depth_point_cava_age
  domain_id: winemaking
  assertion_text: D.O. Cava lists minimum ageing periods of 9 months for Guarda, 18 for Guarda Superior Reserva,
    30 for Gran Reserva and 36 for Paraje Calificado. Longer mandated stockholding can affect release timing and
    price, but does not alone rank tasted quality.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_cava_grapes
  subject_id: n_d4depth_principle_cava_grapes
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d4depth_point_cava_grapes
  domain_id: winemaking
  assertion_text: The classic Cava blend can use Macabeo for light floral fruit, Xarel-lo for structure and body,
    and Parellada for finesse and freshness. The exact proportions are producer choices; the grape names do not
    guarantee a quality tier.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_cava_organic
  subject_id: n_d4depth_principle_cava_organic
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d4depth_point_cava_organic
  domain_id: winemaking
  assertion_text: D.O. Cava states that from 2025, Guarda Superior Reserva, Gran Reserva and Paraje Calificado production
    is organic and uses specifically selected certified organic vineyards. A buyer must verify the category and
    certification, not infer the claim from bottle age alone.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_cava_paraje
  subject_id: n_d4depth_principle_cava_paraje
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d4depth_point_cava_paraje
  domain_id: winemaking
  assertion_text: Cava de Paraje Calificado adds a designated estate, hand harvest, vintage dating, traceability
    and other controls to a 36-month minimum. The narrower sourcing and release delay can constrain supply; the
    category does not replace blind sensory evaluation.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_prosecco_tank
  subject_id: n_d4depth_principle_prosecco_tank
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d4depth_point_prosecco_tank
  domain_id: winemaking
  assertion_text: Conegliano Valdobbiadene Prosecco Superiore commonly gains sparkle through second fermentation
    in pressurised tanks; this route aims to keep Glera fruit and floral aromas prominent. Tank use alone neither
    proves cheap wine nor a fixed quality level.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_prosecco_rive
  subject_id: n_d4depth_principle_prosecco_rive
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d4depth_point_prosecco_rive
  domain_id: winemaking
  assertion_text: A Conegliano Valdobbiadene Rive bottling draws grapes from one named commune or hamlet area, requires
    hand picking and shows a vintage. Steep slopes can increase labour needs; Rive identifies a more specific origin
    and controls, not a guaranteed tasting rank.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_prosecco_rose
  subject_id: n_d4depth_principle_prosecco_rose
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d4depth_point_prosecco_rose
  domain_id: winemaking
  assertion_text: Prosecco DOC Rosé blends Glera with 10–15% red-vinified Pinot Nero and requires at least 60 days
    for the tank second fermentation, compared with 30 days for standard DOC styles. That production difference
    affects scheduling without fixing quality.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_franciacorta_method
  subject_id: n_d4depth_principle_franciacorta_method
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d4depth_point_franciacorta_method
  domain_id: winemaking
  assertion_text: Franciacorta DOCG is made by secondary fermentation in bottle followed by disgorgement. The standard
    non-vintage style has a shorter minimum lees period than Satèn or Rosé, so category and lees record matter when
    comparing price and maturity.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_franciacorta_saten
  subject_id: n_d4depth_principle_franciacorta_saten
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d4depth_point_franciacorta_saten
  domain_id: winemaking
  assertion_text: Franciacorta Satèn uses Chardonnay and possibly Pinot Bianco, with a lower-pressure bottle fermentation
    than standard Franciacorta and at least 24 months on lees. Lower pressure can support a softer mousse; tasting
    is still needed to judge balance.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_asti_moscato
  subject_id: n_d4depth_principle_asti_moscato
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d4depth_point_asti_moscato
  domain_id: winemaking
  assertion_text: For Moscato d’Asti, cooled, filtered fermentation is stopped around 5% actual alcohol, retaining
    natural sweetness and a lower pressure than Asti Spumante. A sweetness or price comparison therefore needs the
    precise Asti label, not just the grape.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_sekt_winemaker
  subject_id: n_d4depth_principle_sekt_winemaker
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d4depth_point_sekt_winemaker
  domain_id: winemaking
  assertion_text: The German Wine Institute describes Winzersekt as traditionally bottle-fermented and matured on
    lees for at least nine months. The term supports a method expectation; grape, origin and achieved quality still
    need separate evidence.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_sekt_vdp
  subject_id: n_d4depth_principle_sekt_vdp
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d4depth_point_sekt_vdp
  domain_id: winemaking
  assertion_text: The current VDP.SEKT statute requires estate fruit, traditional bottle fermentation and at least
    15 months on lees; VDP.SEKT.PRESTIGE requires at least 36 months. These private-association tiers indicate production
    commitments, not a universal sensory ranking for all German Sekt.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_britain_variety
  subject_id: n_d4depth_principle_britain_variety
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d4depth_point_britain_variety
  domain_id: winemaking
  assertion_text: WineGB describes traditional-method Chardonnay, Pinot Noir and Meunier as prominent in England
    and Wales, alongside alternative grapes and styles. Cool climate can support acidity, but the country name alone
    does not establish grapes, method, lees age or quality.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_britain_frost
  subject_id: n_d4depth_principle_britain_frost
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d4depth_point_britain_frost
  domain_id: winemaking
  assertion_text: WineGB reports current budburst modelling to help vineyards manage frost risk. For a long-lees
    sparkling programme, variable crop volume can complicate reserve stocks and release plans; the model does not
    predict any single wine’s quality.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_au_shiraz
  subject_id: n_d4depth_principle_au_shiraz
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d4depth_point_au_shiraz
  domain_id: winemaking
  assertion_text: Australian Sparkling Shiraz starts with red-wine skin contact for colour and tannin; producers
    may use traditional, transfer, tank or carbonation methods, yielding styles from fruity off-dry to dry and complex.
    The category name alone cannot establish method or sweetness.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_nz_aromatic
  subject_id: n_d4depth_principle_nz_aromatic
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d4depth_point_nz_aromatic
  domain_id: winemaking
  assertion_text: New Zealand Winegrowers records traditional, transfer, tank and carbonated sparkling routes, including
    aromatic Sauvignon Blanc styles. For a primary-fruit brief, tank production can be considered, but a label with
    country or grape alone does not disclose the method.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_za_chenin
  subject_id: n_d4depth_principle_za_chenin
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d4depth_point_za_chenin
  domain_id: winemaking
  assertion_text: South African Cap Classique began with Chenin Blanc and now commonly uses Chardonnay, Pinot Noir
    and sometimes Meunier. Bottle fermentation defines the category more than a mandatory Champagne-style blend;
    grape mix can change the style.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_us_blend
  subject_id: n_d4depth_principle_us_blend
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_d4depth_point_us_blend
  domain_id: winemaking
  assertion_text: A Schramsberg Blanc de Blancs technical sheet describes adding small barrel-fermented and malolactic
    lots to steel-fermented Chardonnay before bottle second fermentation and roughly two years on lees. This is
    a documented producer choice, not a rule for California wine.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_case_champagne_house_action
  subject_id: n_d4depth_case_champagne_house
  relation_type: CASE_ACTION
  object_id: n_d4depth_point_case_champagne_house_action
  domain_id: winemaking
  assertion_text: Blend trial cuvées with measured reserve-wine options before fixing non-vintage release; plan
    vintage stock separately.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_case_champagne_house_reason
  subject_id: n_d4depth_case_champagne_house
  relation_type: CASE_REASON
  object_id: n_d4depth_point_case_champagne_house_reason
  domain_id: winemaking
  assertion_text: Reserve wines can offset vintage variation and support the house profile; vintage Champagne must
    use one harvest and mature longer.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_case_champagne_house_tradeoff
  subject_id: n_d4depth_case_champagne_house
  relation_type: CASE_TRADEOFF
  object_id: n_d4depth_point_case_champagne_house_tradeoff
  domain_id: winemaking
  assertion_text: Holding reserves and vintage bottles uses cellar capacity and delays cash conversion, so allocation
    must match the intended market.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_case_champagne_house_limitation
  subject_id: n_d4depth_case_champagne_house
  relation_type: CASE_LIMITATION
  object_id: n_d4depth_point_case_champagne_house_limitation
  domain_id: winemaking
  assertion_text: Neither a warm harvest nor the reserve percentage proves balance or saleability; taste the trials
    and confirm stocks, price and demand.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_case_cava_upgrade_action
  subject_id: n_d4depth_case_cava_upgrade
  relation_type: CASE_ACTION
  object_id: n_d4depth_point_case_cava_upgrade_action
  domain_id: winemaking
  assertion_text: Verify certified organic source lots and use only eligible fruit for the intended Guarda Superior
    claim; otherwise revise the category plan.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_case_cava_upgrade_reason
  subject_id: n_d4depth_case_cava_upgrade
  relation_type: CASE_REASON
  object_id: n_d4depth_point_case_cava_upgrade_reason
  domain_id: winemaking
  assertion_text: Reserva needs the 18-month minimum and current Guarda Superior sourcing is certified organic from
    2025.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_case_cava_upgrade_tradeoff
  subject_id: n_d4depth_case_cava_upgrade
  relation_type: CASE_TRADEOFF
  object_id: n_d4depth_point_case_cava_upgrade_tradeoff
  domain_id: winemaking
  assertion_text: Restricting source lots or delaying release reduces immediate volume and ties up stock; changing
    category may alter the price proposition.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_case_cava_upgrade_limitation
  subject_id: n_d4depth_case_cava_upgrade
  relation_type: CASE_LIMITATION
  object_id: n_d4depth_point_case_cava_upgrade_limitation
  domain_id: winemaking
  assertion_text: The premise does not prove lot traceability, certification, finished balance or achievable margin;
    check these before launch.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_case_rive_offer_action
  subject_id: n_d4depth_case_rive_offer
  relation_type: CASE_ACTION
  object_id: n_d4depth_point_case_rive_offer_action
  domain_id: winemaking
  assertion_text: Taste both blind against the aperitif brief and costed list margin before choosing a listing.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_case_rive_offer_reason
  subject_id: n_d4depth_case_rive_offer
  relation_type: CASE_REASON
  object_id: n_d4depth_point_case_rive_offer_reason
  domain_id: winemaking
  assertion_text: Rive adds specific origin, hand harvest and vintage, while dosage category and tank handling may
    lead to a different fruit-sweetness balance.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_case_rive_offer_tradeoff
  subject_id: n_d4depth_case_rive_offer
  relation_type: CASE_TRADEOFF
  object_id: n_d4depth_point_case_rive_offer_tradeoff
  domain_id: winemaking
  assertion_text: The Rive may justify a higher story and labour-linked cost, but higher purchase price risks missing
    the by-the-glass margin.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_case_rive_offer_limitation
  subject_id: n_d4depth_case_rive_offer
  relation_type: CASE_LIMITATION
  object_id: n_d4depth_point_case_rive_offer_limitation
  domain_id: winemaking
  assertion_text: Origin and production documents do not establish sensory fit, supply reliability or price acceptance;
    obtain samples and commercial terms.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_case_british_frost_action
  subject_id: n_d4depth_case_british_frost
  relation_type: CASE_ACTION
  object_id: n_d4depth_point_case_british_frost_action
  domain_id: winemaking
  assertion_text: Build a conditional volume plan using site frost measures and a cautious reserve allocation before
    promising fixed supply.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_case_british_frost_reason
  subject_id: n_d4depth_case_british_frost
  relation_type: CASE_REASON
  object_id: n_d4depth_point_case_british_frost_reason
  domain_id: winemaking
  assertion_text: Budburst and frost affect harvest volume; reserve wines can help blend across variable years for
    a non-vintage style.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_case_british_frost_tradeoff
  subject_id: n_d4depth_case_british_frost
  relation_type: CASE_TRADEOFF
  object_id: n_d4depth_point_case_british_frost_tradeoff
  domain_id: winemaking
  assertion_text: Reserving wine and avoiding overcommitment constrain current sales, while frost protection and
    cellar holding consume resources.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
- id: ki_d4depth_case_british_frost_limitation
  subject_id: n_d4depth_case_british_frost
  relation_type: CASE_LIMITATION
  object_id: n_d4depth_point_case_british_frost_limitation
  domain_id: winemaking
  assertion_text: No actual frost outcome, grape yield, base-wine quality or buyer demand is given; confirm them
    before locking volumes or price.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-29T00:00:00.000Z'
