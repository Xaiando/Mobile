knowledge_items:
- id: ki_wset_close_red_ageing_colour
  subject_id: n_wset_close_principle_red_ageing_colour
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_wset_close_point_red_ageing_colour
  domain_id: tasting
  assertion_text: A youthful red may show purple or ruby colours; development can introduce garnet or
    tawny shades, particularly at the rim, and very old or oxidised wine may appear brown. Colour also
    depends on the grape, production and storage, so it cannot establish an exact age or prove improved
    quality.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-27T00:00:00.000Z'
- id: ki_wset_close_white_ageing_colour
  subject_id: n_wset_close_principle_white_ageing_colour
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_wset_close_point_white_ageing_colour
  domain_id: tasting
  assertion_text: A pale lemon-coloured white can become deeper gold as it develops; very old or oxidised
    examples may acquire amber or brown tones. Initial colour, production and storage also matter, so
    a deeper colour alone proves neither a precise bottle age nor beneficial development.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-27T00:00:00.000Z'
- id: ki_wset_close_vintage_label
  subject_id: n_wset_close_principle_vintage_label
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_wset_close_point_vintage_label
  domain_id: geography
  assertion_text: The vintage identifies the year the grapes were harvested, rather than the year the
    wine was bottled or released. Local rules determine what proportion must come from that harvest. The
    year alone does not establish quality; weather, place, grapes and production must be considered together.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-27T00:00:00.000Z'
- id: ki_wset_close_old_vine_label
  subject_id: n_wset_close_principle_old_vine_label
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_wset_close_point_old_vine_label
  domain_id: viticulture
  assertion_text: Vieilles vignes means old vines. Vine age can be relevant to yield and fruit character,
    but the wording alone guarantees neither concentration nor quality. Definitions, certification and
    enforceable labelling conditions differ by jurisdiction or scheme; check the producer and applicable
    rules rather than assume one worldwide legal threshold.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-27T00:00:00.000Z'
- id: ki_wset_close_oiv_old_vine
  subject_id: n_wset_close_principle_oiv_old_vine
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_wset_close_point_oiv_old_vine
  domain_id: viticulture
  assertion_text: The OIV adopted a definition of an individual old vine with officially documented age
    of at least 35 years; for a grafted plant, the scion–rootstock union must also have remained intact
    for at least 35 years. This international recommendation does not automatically impose the same labelling
    law in every country.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-27T00:00:00.000Z'
- id: ki_wset_close_oiv_old_vineyard
  subject_id: n_wset_close_principle_oiv_old_vineyard
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_wset_close_point_oiv_old_vineyard
  domain_id: viticulture
  assertion_text: In the OIV 2024 definition, an old vineyard is a homogeneous, continuous and legally
    delimited vineyard parcel with at least 85% of its vines meeting the individual old-vine definition,
    producing vitivinicultural products eligible for lawful certification by a competent authority.
    A qualifying vine and a qualifying whole parcel are distinct; this recommendation is not an automatic
    worldwide labelling permission.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-27T00:00:00.000Z'
- id: ki_wset_close_late_harvest_label
  subject_id: n_wset_close_principle_late_harvest_label
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_wset_close_point_late_harvest_label
  domain_id: viticulture
  assertion_text: Late harvest indicates grapes left on the vine for a later harvest, usually seeking
    greater ripeness or concentration; Vendanges Tardives is the French wording. The term does not universally
    require noble rot or guarantee the same finished sweetness. Named origins apply their own conditions,
    and fermentation determines how much sugar remains.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-27T00:00:00.000Z'
- id: ki_wset_close_gi_label
  subject_id: n_wset_close_principle_gi_label
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_wset_close_point_gi_label
  domain_id: geography
  assertion_text: A wine geographical indication identifies an origin associated with the grapes and wine,
    whereas a varietal name identifies a grape. An origin may also carry production rules, and the grape
    need not appear on the label. Reading a named origin requires learning its permitted or characteristic
    grapes and styles.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-27T00:00:00.000Z'
- id: ki_wset_close_eu_wine_pdo
  subject_id: n_wset_close_principle_eu_wine_pdo
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_wset_close_point_eu_wine_pdo
  domain_id: geography
  assertion_text: PDO means protected designation of origin. For EU wine, the grapes come exclusively
    from the specified geographical area and the wine is produced there under its specification. The protected
    name links the product to its place; it does not by itself certify that a taster will prefer it to
    every PGI wine.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-27T00:00:00.000Z'
- id: ki_wset_close_eu_wine_pgi
  subject_id: n_wset_close_principle_eu_wine_pgi
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_wset_close_point_eu_wine_pgi
  domain_id: geography
  assertion_text: PGI means protected geographical indication. For EU wine, at least 85% of the grapes
    come from the specified area and the wine is produced there under its specification, compared with
    exclusively local grapes for PDO. These wine rules differ from the simpler one-production-stage explanation
    used for many food products.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-27T00:00:00.000Z'
- id: ki_wset_close_white_ripeness_flavour
  subject_id: n_wset_close_principle_white_ripeness_flavour
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_wset_close_point_white_ripeness_flavour
  domain_id: viticulture
  assertion_text: 'For suitable varieties, less ripe fruit can suggest citrus or green/orchard-fruit character,
    while riper fruit can suggest stone or tropical fruit and very ripe fruit may appear dried or cooked.
    These are comparative tendencies: variety, site and winemaking matter, and every white grape does
    not follow one identical sequence.'
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-27T00:00:00.000Z'
- id: ki_wset_close_black_ripeness_flavour
  subject_id: n_wset_close_principle_black_ripeness_flavour
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_wset_close_point_black_ripeness_flavour
  domain_id: viticulture
  assertion_text: Within a suitable variety, less ripe fruit may retain herbaceous or tart fruit character;
    riper fruit can show fuller ripe-fruit character, and extra-ripe fruit may suggest dried or cooked
    fruit. Red-fruit versus black-fruit associations also depend on variety and growing conditions; neither
    colour descriptor is a universal ripeness measurement.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-27T00:00:00.000Z'
- id: ki_wset_close_phenolic_maturity
  subject_id: n_wset_close_principle_phenolic_maturity
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_wset_close_point_phenolic_maturity
  domain_id: viticulture
  assertion_text: Sugar accumulation, flavour development and seed/skin phenolic maturity need not progress
    at the same rate. As seeds mature and brown, their tannins can become less extractable; skin and seed
    observations help assess the intended red-wine style. No single Brix value, seed colour or taste proves
    complete ripeness or guarantees a soft finished wine.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-27T00:00:00.000Z'
- id: ki_wset_close_vine_wood
  subject_id: n_wset_close_principle_vine_wood
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_wset_close_point_vine_wood
  domain_id: viticulture
  assertion_text: A shoot is current-season green growth. Mature portions become woody canes; a cane retained
    from the previous growing season is one-year wood carrying buds for the next season. The trunk and
    retained arms or cordons form older permanent structure. These parts are distinguished by age and
    function, rather than treated as interchangeable stems.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-27T00:00:00.000Z'
- id: ki_wset_close_vine_green_parts
  subject_id: n_wset_close_principle_vine_green_parts
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_wset_close_point_vine_green_parts
  domain_id: viticulture
  assertion_text: Current green shoots carry leaves, buds and tendrils, together with inflorescences that
    can develop into grape bunches. Leaves supply photosynthate through photosynthesis. Green seasonal
    growth is distinct from the retained woody framework that supports growth in later years.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-27T00:00:00.000Z'
- id: ki_wset_close_oak_size
  subject_id: n_wset_close_principle_oak_size
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_wset_close_point_oak_size
  domain_id: winemaking
  assertion_text: For similarly shaped vessels with comparable wood, age, toast and contact time, a smaller
    oak vessel exposes each litre of wine to more wood surface than a larger one, favouring greater extraction
    of oak compounds. A large old vessel can therefore support maturation with little oak flavour; size
    alone does not determine the result.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-27T00:00:00.000Z'
- id: ki_wset_close_oak_toast
  subject_id: n_wset_close_principle_oak_toast
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_wset_close_point_oak_toast
  domain_id: winemaking
  assertion_text: Heating oak during coopering changes the wood compounds available to the wine, altering
    aromas such as toast or smoke and the character of oak tannins. Heating time and intensity, wood and
    extraction conditions matter; a heavier toast is not simply more of every oak aroma and is not a quality
    ranking.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-27T00:00:00.000Z'
- id: ki_wset_close_blending_complexity
  subject_id: n_wset_close_principle_blending_complexity
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_wset_close_point_blending_complexity
  domain_id: winemaking
  assertion_text: Blending components with complementary aromas, flavours or textures can create additional
    sensory layers in the finished wine. Components may come from different varieties, parcels or vessels,
    including the same variety. The aim differs from balancing acidity or maintaining a house style; adding
    more components does not automatically improve complexity or quality.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-27T00:00:00.000Z'
- id: ki_wset_close_pump_over
  subject_id: n_wset_close_principle_pump_over
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_wset_close_point_pump_over
  domain_id: winemaking
  assertion_text: A pump over removes fermenting liquid from below the floating skin cap and returns it
    over the cap, wetting the solids and renewing liquid–skin contact. This can aid extraction and redistribute
    heat; oxygen exposure depends on the setup. Frequency and intensity are selected for the grapes and
    intended style, rather than maximised automatically.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-27T00:00:00.000Z'
- id: ki_wset_close_punch_down
  subject_id: n_wset_close_principle_punch_down
  relation_type: PRINCIPLE_EXPLANATION
  object_id: n_wset_close_point_punch_down
  domain_id: winemaking
  assertion_text: A punch down pushes the floating skins down into the fermenting liquid instead of pumping
    liquid over them. Renewed contact helps extract colour and tannin and manage the cap. The effect depends
    on timing, force, frequency and fruit; either operation must be adapted to the desired wine rather
    than assumed intrinsically gentler or better.
  verification_status: unverified
  mcq_disabled: true
  last_verified_at: '2026-09-27T00:00:00.000Z'
