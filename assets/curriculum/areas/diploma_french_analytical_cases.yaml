  "knowledge_items": [
    {
      "id": "ki_d3fr_case_pinot_climat_action",
      "subject_id": "n_d3fr_case_pinot_climat",
      "relation_type": "CASE_ACTION",
      "object_id": "n_d3fr_point_pinot_climat_action",
      "domain_id": "winemaking",
      "assertion_text": "Keep A and B identifiable through matched, separate small-vat trials, repeat A's promising gentler treatment and obtain B's trial results before setting a cellar policy. Check the claimed Climat's parcel entitlement, traceability and applicable label requirements before approving release. Consider the limited restaurant trial only after sensory fit, eligible stock and delivery capacity are confirmed; neither route is a final profit decision.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-09-30T13:54:26.000Z"
    },
    {
      "id": "ki_d3fr_case_pinot_climat_reason",
      "subject_id": "n_d3fr_case_pinot_climat",
      "relation_type": "CASE_REASON",
      "object_id": "n_d3fr_point_pinot_climat_reason",
      "domain_id": "winemaking",
      "assertion_text": "Burgundy Climats identify plots with particular geological, water and exposure characteristics; Pinot Noir alone does not erase their differences. Cap contact affects extraction, and the supplied A panel result supports the gentler treatment for this brief, not a universal Pinot recipe or proof of site causation. The proposed origin label cannot establish legal entitlement or the tasted lot's quality, and a larger trade request does not establish consumer sell-through.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-09-30T13:54:26.000Z"
    },
    {
      "id": "ki_d3fr_case_pinot_climat_tradeoff",
      "subject_id": "n_d3fr_case_pinot_climat",
      "relation_type": "CASE_TRADEOFF",
      "object_id": "n_d3fr_point_pinot_climat_tradeoff",
      "domain_id": "business",
      "assertion_text": "Under the supplied terms, the 120-bottle restaurant trial limits initial stock commitment but requires producer tasting/delivery work and payment 30 days after delivery. Trade requests 600 bottles and pays 14 days after delivery at a lower unit receipt. Its earlier payment could help cash timing, but allocating more stock and accepting lower receipts must be weighed against actual capacity, costs and demand; neither order size nor payment timing guarantees profit.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-09-30T13:54:26.000Z"
    },
    {
      "id": "ki_d3fr_case_pinot_climat_limitation",
      "subject_id": "n_d3fr_case_pinot_climat",
      "relation_type": "CASE_LIMITATION",
      "object_id": "n_d3fr_point_pinot_climat_limitation",
      "domain_id": "business",
      "assertion_text": "Only A's preliminary trial observations are supplied; B has not been tested and matching the cellar treatments does not control every vineyard difference. The exercise cannot isolate geology as a cause of flavour or predict another vintage. Parcel entitlement, traceability, current applicable label requirements, saleable quantities, full costs, actual selling outcomes and buyer reliability remain unresolved. A Climat name or appellation tier is not a sensory-quality or price guarantee.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-09-30T13:54:26.000Z"
    },
    {
      "id": "ki_d3fr_case_chinon_extract_action",
      "subject_id": "n_d3fr_case_chinon_extract",
      "relation_type": "CASE_ACTION",
      "object_id": "n_d3fr_point_chinon_extract_action",
      "domain_id": "winemaking",
      "assertion_text": "Repeat the matched gentler treatment for A, complete B's paired comparison and retain the parcel identities while evaluating the restaurant brief. Consider a limited restaurant launch only if final sensory fit, saleable stock, the two-week service commitment and current appellation-compliance evidence are satisfactory. Review the larger trade option against staff capacity and its actual economics rather than escalating extraction or committing untested B automatically.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-09-30T13:54:26.000Z"
    },
    {
      "id": "ki_d3fr_case_chinon_extract_reason",
      "subject_id": "n_d3fr_case_chinon_extract",
      "relation_type": "CASE_REASON",
      "object_id": "n_d3fr_point_chinon_extract_reason",
      "domain_id": "winemaking",
      "assertion_text": "Chinon includes contrasting alluvial terraces, limestone slopes and clay-flint plateaus, while Cabernet Franc is its established red and rosé association. The supplied matched A trial makes extraction a testable cellar variable for this red-wine brief. Cap contact influences colour and tannin, but extending it does not necessarily keep increasing colour; these observations do not establish that terrace geology caused the taste or that every Chinon Cabernet Franc should receive the same treatment.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-09-30T13:54:26.000Z"
    },
    {
      "id": "ki_d3fr_case_chinon_extract_tradeoff",
      "subject_id": "n_d3fr_case_chinon_extract",
      "relation_type": "CASE_TRADEOFF",
      "object_id": "n_d3fr_point_chinon_extract_tradeoff",
      "domain_id": "business",
      "assertion_text": "The supplied restaurant route initially allocates 120 bottles but needs producer tasting/delivery work and collects payment 30 days after delivery. Trade asks for 600 bottles, pays 14 days after delivery and offers a lower unit receipt; the scenario allows staff to service only one initial route. Earlier payment may help cash timing, whereas a larger allocation increases commitment. Choosing the smaller trial can preserve capacity and test demand but may forgo the larger order; neither route is proven more profitable.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-09-30T13:54:26.000Z"
    },
    {
      "id": "ki_d3fr_case_chinon_extract_limitation",
      "subject_id": "n_d3fr_case_chinon_extract",
      "relation_type": "CASE_LIMITATION",
      "object_id": "n_d3fr_point_chinon_extract_limitation",
      "domain_id": "business",
      "assertion_text": "B's unfinished comparison and the preliminary nature of A's panel evidence prevent a universal site or treatment conclusion. The exercise specifies Cabernet Franc red wine but does not provide current legal-compliance records or prove that any proposed amended rule is enacted. Staff capacity, eligible quantities, full prices and costs, buyer reliability and consumer sell-through must be established before scaling; the invented delivery and payment terms are not Chinon market norms.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-09-30T13:54:26.000Z"
    }
  ],
