{
  "knowledge_nodes": [
    {
      "id": "n_d3fr_case_pinot_climat",
      "node_type": "production_case",
      "name": "Fictional Burgundy Pinot Noir exercise: an estate has sound, same-vintage fruit from two individually recorded Côte de Beaune parcels. Parcel A is on a southeast-facing slope; B is on a lower, less exposed site. Their soil and water records differ; these supplied details do not describe every Burgundy parcel. Two spare small vats permit matched, separate trials. In a preliminary coded comparison of A, the gentler cap-contact treatment met a restaurant brief for fresh fruit and moderate drying tannin; the intensive treatment was judged too drying for that brief. B has not been trialled. Proposed labels name a Climat, but no parcel entitlement or approved label evidence is supplied. A direct restaurant route offers a 120-bottle trial, payment 30 days after delivery and producer tasting/delivery work. A trade route requests 600 bottles, offers payment 14 days after delivery and a lower unit receipt. Final eligible quantities, buyer sell-through, full prices and costs are unknown. These fictional records and terms are not regional norms or a profit forecast. Recommend a production and release process, explain the site, extraction and origin evidence, weigh the channel/cash tradeoff, and identify follow-up checks."
    },
    {
      "id": "n_d3fr_point_pinot_climat_action",
      "node_type": "learning_point",
      "name": "Keep parcel trials separate, compare matched treatments and verify eligibility before a limited release"
    },
    {
      "id": "n_d3fr_point_pinot_climat_reason",
      "node_type": "learning_point",
      "name": "Site and extraction evidence support a conditional trial, while origin and volume do not prove quality or sales"
    },
    {
      "id": "n_d3fr_point_pinot_climat_tradeoff",
      "node_type": "learning_point",
      "name": "The restaurant trial reduces initial commitment but needs delivery work and later payment; trade requests more stock"
    },
    {
      "id": "n_d3fr_point_pinot_climat_limitation",
      "node_type": "learning_point",
      "name": "B remains untested, site causation is unresolved, and label entitlement, costs and customer demand are missing"
    },
    {
      "id": "n_d3fr_case_chinon_extract",
      "node_type": "production_case",
      "name": "Fictional Chinon Cabernet Franc red-wine exercise: a producer has sound, same-vintage lots from a recorded Vienne alluvial terrace A and a limestone slope B. Within each lot, paired small-vat trials keep harvest lot, stem inclusion, yeast, fermentation temperature and maturation constant, varying cap contact only. A's coded preliminary panel preferred the gentler treatment for a restaurant brief of a fresh red with moderate drying tannin; the intensive treatment was more drying without a preferred colour gain. B's comparison is unfinished. One restaurant proposes a 120-bottle trial, delivery in two weeks, payment 30 days after delivery and producer tasting/delivery work. A trade buyer requests 600 bottles on the same delivery schedule, payment 14 days after delivery and a lower unit receipt. Staff can service only one initial route. No complete costs, sell-through forecast or current appellation-compliance records are supplied. The parcel, panel and commercial details are invented, not typical outcomes or enacted production rules. Recommend a conditional production/launch choice, explain the evidence, discuss a tradeoff and identify the checks needed before expansion."
    },
    {
      "id": "n_d3fr_point_chinon_extract_action",
      "node_type": "learning_point",
      "name": "Repeat the matched gentler trial, complete the slope comparison and verify stock and compliance before a small launch"
    },
    {
      "id": "n_d3fr_point_chinon_extract_reason",
      "node_type": "learning_point",
      "name": "Cap contact affects extraction; the terrace trial supports this brief without predicting every Chinon parcel"
    },
    {
      "id": "n_d3fr_point_chinon_extract_tradeoff",
      "node_type": "learning_point",
      "name": "A small restaurant launch uses less stock but more producer service; the larger trade request offers earlier payment"
    },
    {
      "id": "n_d3fr_point_chinon_extract_limitation",
      "node_type": "learning_point",
      "name": "Unfinished slope trials, legal records, staff capacity, full costs and sell-through limit any expansion decision"
    }
  ],
