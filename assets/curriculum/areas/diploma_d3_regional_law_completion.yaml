{
  "knowledge_nodes": [
    {
      "id": "n_d3law_principle_jura_cellar_calendar",
      "node_type": "production_principle",
      "name": "Which calendar condition applies to Côtes du Jura wine seeking the Vin Jaune mention under the adopted 2022 specification?"
    },
    {
      "id": "n_d3law_point_jura_cellar_calendar",
      "node_type": "learning_point",
      "name": "After vinification, Côtes du Jura Vin Jaune requires oak maturation without topping-up through 15 December of the sixth year after the harvest year, including at least 60 months under a yeast veil. The calendar end and veil-duration conditions must both be checked."
    },
    {
      "id": "n_d3law_principle_jura_veil_duration",
      "node_type": "production_principle",
      "name": "A Côtes du Jura 2026 Vin Jaune lot remains in non-topped oak through 15 December 2032 but records only 58 months under veil. What does the supplied evidence establish?"
    },
    {
      "id": "n_d3law_point_jura_veil_duration",
      "node_type": "learning_point",
      "name": "The supplied calendar end is reached but the recorded 58 months misses the separate minimum 60 months under veil. Reaching 15 December 2032 alone does not establish this maturation eligibility; additional records and conformity review are needed."
    },
    {
      "id": "n_d3law_principle_jura_consumer_release",
      "node_type": "production_principle",
      "name": "When may an otherwise eligible Côtes du Jura 2026 Vin Jaune reach the consumer under the adopted specification?"
    },
    {
      "id": "n_d3law_point_jura_consumer_release",
      "node_type": "learning_point",
      "name": "After required maturation, Côtes du Jura Vin Jaune may be put on the consumer market from 1 January of the seventh year after the harvest year. For a 2026 harvest this gives 1 January 2033; completing the sixth-year 15 December cellar date does not itself authorise earlier consumer sale."
    },
    {
      "id": "n_d3law_principle_jura_clavelin_reserved",
      "node_type": "production_principle",
      "name": "What does the adopted Côtes du Jura clavelin clause actually establish?"
    },
    {
      "id": "n_d3law_point_jura_clavelin_reserved",
      "node_type": "learning_point",
      "name": "The approximately 62 cl clavelin or Vin Jaune bottle is reserved for wines of this AOC bearing the Vin Jaune mention. That reservation identifies permitted use of this format; by itself it does not prove that every other bottle size is forbidden or that every cellar loses exactly 38% of its wine."
    },
    {
      "id": "n_d3law_principle_tokaj_applicability",
      "node_type": "production_principle",
      "name": "Which Tokaj specification is used for the supplied 2025 harvest case?"
    },
    {
      "id": "n_d3law_point_tokaj_applicability",
      "node_type": "learning_point",
      "name": "Tokaj specification version 10 applies to products from grapes harvested after 1 August 2025. Use that stated harvest scope for the supplied September 2025 case. Different historical vintages require their actually applicable specification; current sugar or release rules cannot be projected indiscriminately onto older harvests."
    },
    {
      "id": "n_d3law_principle_tokaj_aszu_sugar",
      "node_type": "production_principle",
      "name": "What current sugar prerequisite is set for Tokaj Aszú in the applicable version 10 specification?"
    },
    {
      "id": "n_d3law_point_tokaj_aszu_sugar",
      "node_type": "learning_point",
      "name": "For Tokaj Aszú under the post 1 August 2025 harvest specification, the residual-sugar minimum is 120 g/L. Meeting this analytical prerequisite does not establish the whole PDO claim, sensory balance or a quality score."
    },
    {
      "id": "n_d3law_principle_tokaj_optional_puttonyos",
      "node_type": "production_principle",
      "name": "How should optional numbered puttonyos wording be interpreted for the current Tokaj Aszú case?"
    },
    {
      "id": "n_d3law_point_tokaj_optional_puttonyos",
      "node_type": "learning_point",
      "name": "Version 10 lists optional 3, 4, 5 or 6 puttonyos wording for Aszú, with 6 puttonyos requiring at least 150 g/L residual sugar. All such current Aszú must meet its 120 g/L minimum; do not infer the old 3=60 or 4=90 scale or claim the current specification simply bans 3 and 4 wording."
    },
    {
      "id": "n_d3law_principle_tokaj_consumer_release",
      "node_type": "production_principle",
      "name": "Why must a 2025-harvest Tokaj Aszu meet both wood maturation and the separate placing-on-market date?"
    },
    {
      "id": "n_d3law_point_tokaj_consumer_release",
      "node_type": "learning_point",
      "name": "Version 10 sets earliest placing-on-market release for Aszú at 1 January of the third year after harvest, separately from its 18 month minimum wood maturation. A 2025 harvest therefore cannot reach that market before 1 January 2028 merely because 18 months wood have been completed."
    },
    {
      "id": "n_d3law_principle_china_standard_status",
      "node_type": "production_principle",
      "name": "What status does the official current page give GB/T15037-2006 Wines?"
    },
    {
      "id": "n_d3law_point_china_standard_status",
      "node_type": "learning_point",
      "name": "SAMR/SAC lists GB/T15037-2006 as current and notes its conversion from mandatory to recommended status on 23 March 2017. This official status page does not supply the full standard's substantive clauses and does not by itself establish that all other wine, food, label or market rules are optional."
    },
    {
      "id": "n_d3law_principle_china_gi_requirements",
      "node_type": "production_principle",
      "name": "How does a protected product origin differ from a generic wine-standard reference under CNIPA Order 80?"
    },
    {
      "id": "n_d3law_point_china_gi_requirements",
      "node_type": "learning_point",
      "name": "In the GI-product protection route effective 1 February 2024, protected products link characteristics or reputation to a specific geographic origin, and their corresponding product standard must respect recognised name, type, origin and quality requirements. A generic wine-standard identifier or winery address alone does not demonstrate the protected product's conformity."
    },
    {
      "id": "n_d3law_principle_china_special_mark",
      "node_type": "production_principle",
      "name": "What evidence process applies to producer use of the protected-product GI special mark under Order 80?"
    },
    {
      "id": "n_d3law_point_china_special_mark",
      "node_type": "learning_point",
      "name": "The GI-product route requires producer application with origin and testing evidence, official review, and approval, registration and announcement for special-mark use. A standard reference or ordinary laboratory result alone does not show that this producer is authorised to use the mark."
    },
    {
      "id": "n_d3law_principle_china_claim_scope",
      "node_type": "production_principle",
      "name": "Why must a China origin-claim teaching case state its protection route and recognised product premise?"
    },
    {
      "id": "n_d3law_point_china_claim_scope",
      "node_type": "learning_point",
      "name": "Order 80's GI-product route governs recognised protected-product conditions and use of its name or special mark; it is not a complete account of parallel collective/certification trademark routes or all market rules. A case must identify this route and supply the recognised product premise rather than invent a real wine's GI status or infer full label clearance."
    },
    {
      "id": "n_d3law_case_jura_release_inventory",
      "node_type": "production_case",
      "name": "A fictional Côtes du Jura lot from grapes harvested in 2026 seeks the Vin Jaune mention. For this exercise, all other PDO and product conditions are satisfied and recorded. The cellar records oak maturation without topping-up through 15 December 2032, with 64 completed months under veil by that date. The buyer proposes consumer launch on 20 December 2032. A conditional replacement launch on 1 January 2033 is available after complete record and label review. No sensory results or confirmed selling pace are supplied. The pilot buyer would purchase 100 clavelins from the supplier at the lawful launch, each with a stated net fill of 62 cl, at a quote of EUR 40 per bottle payable on dispatch. Independently supplied additional holding cost for 16 December 2032 through 31 December 2032 is a fixed EUR 240 for the lot, contractually borne by the pilot buyer in this exercise; it is not a monthly rate. Packaging and launch facts, prices and costs are invented. Explain the calendar and veil conditions, the consumer launch decision, the reserved bottle identity and the pilot's quantity/cost arithmetic. The bottle-reservation clause alone is not a premise that all other sizes are forbidden. Quotes omit delivery, tax and other costs."
    },
    {
      "id": "n_d3law_point_case_jura_release_inventory_action",
      "node_type": "learning_point",
      "name": "Hold the proposed 20 December 2032 consumer launch and conditionally reschedule to 1 January 2033 after required record and label review. Check the specified Vin Jaune identity for the reserved clavelin format and request a repeat sample against the buyer's brief; supplied conformity premises do not establish sensory fit or full commercial success."
    },
    {
      "id": "n_d3law_point_case_jura_release_inventory_reason",
      "node_type": "learning_point",
      "name": "For this 2026 harvest Côtes du Jura Vin Jaune, the recorded non-topped oak calendar reaches 15 December 2032 and 64 veil months exceed the 60 month floor. Consumer sale has a separate earliest date of 1 January 2033 after ageing. The approximately 62 cl clavelin is reserved for this AOC's Vin Jaune mention; that wording alone does not establish a universal ban on every other size."
    },
    {
      "id": "n_d3law_point_case_jura_release_inventory_tradeoff",
      "node_type": "learning_point",
      "name": "The pilot buyer would pay the supplier EUR 4,000 for 100 bottles at EUR 40 each. At the supplied 62 cl net fill, these contain 62 litres: EUR 4,000 / 62 is approximately EUR 64.52 per litre before omitted costs. The buyer also bears the stipulated EUR 240 holding charge, giving EUR 4,240 in listed buyer costs, about EUR 68.39 per litre. Moving dispatch postpones the supplier's receipt of this purchase payment and the buyer's possible customer receipts; the buyer's selling revenue and sales pace remain unknown. These listed costs are not a producer-profit forecast."
    },
    {
      "id": "n_d3law_point_case_jura_release_inventory_limitation",
      "node_type": "learning_point",
      "name": "The case records, quote and holding cost are fictional. Meeting these specified cellar, consumer-date and bottle-identity conditions is not an actual release authorisation, an independent whole-label review, a quality score, a fixed 38% evaporation calculation or a profit guarantee. The calendar is scoped to Côtes du Jura, not every Jura AOC."
    },
    {
      "id": "n_d3law_case_tokaj_label_release",
      "node_type": "production_case",
      "name": "A fictional Tokaj Aszú lot is made from grapes harvested on 15 September 2025. Assume all other PDO and Aszú production conditions are documented and satisfied for this exercise. Its residual sugar is 135 g/L; records show 18 completed months in wood from 1 December 2025 to 1 June 2027. The proposal is a 6 puttonyos label and consumer dispatch on 1 July 2027. The buyer will reconsider an Aszú presentation without that numbered claim and a 1 January 2028 launch, subject to complete current label/record review and a repeat tasting. The pilot buyer bears a fictional EUR 180 reprint charge. Holding stock from 1 July 2027 through 31 December 2027 costs the pilot buyer a stipulated EUR 60 per whole calendar month for six months. The pilot buyer would buy 100 bottles from the supplier at EUR 25 each, paying the supplier on dispatch. The buyer's future receipts from selling to its own customers are unknown. There is no confirmed selling revenue, demand or tasting result. Compare the applicable vintage scope, sugar and optional wording, wood and earliest consumer-date gates, action, supplied costs and limits. All market observations and prices are invented."
    },
    {
      "id": "n_d3law_point_case_tokaj_label_release_action",
      "node_type": "learning_point",
      "name": "Hold the proposed 6 puttonyos wording and 1 July 2027 consumer dispatch. Seek a supported Aszú presentation without that numbered claim, full current record/label review and a repeat tasting, then conditionally schedule the buyer's pilot from 1 January 2028; a revised label still needs the buyer's agreement."
    },
    {
      "id": "n_d3law_point_case_tokaj_label_release_reason",
      "node_type": "learning_point",
      "name": "The supplied 15 September 2025 harvest is within version 10's post 1 August 2025 scope. 135 g/L exceeds the current Aszú 120 g/L minimum but misses the separate 150 g/L prerequisite for 6 puttonyos. The current specification lists optional 3, 4, 5 and 6 wording; it does not justify a blanket 3/4 ban or historical lower sugar minima. 18 months wood are supplied as completed, but the separate placing-on-market gate for 2025 is 1 January 2028."
    },
    {
      "id": "n_d3law_point_case_tokaj_label_release_tradeoff",
      "node_type": "learning_point",
      "name": "The pilot buyer would pay the supplier 100 times EUR 25, or EUR 2,500, on dispatch. The buyer also bears six stipulated holding months at EUR 60, or EUR 360, plus a EUR 180 reprint charge: EUR 3,040 in listed buyer costs before omitted expenses. Rescheduling dispatch postpones that purchase outflow and the supplier's matching receipt. The buyer bears the stated interim costs while its eventual customer receipts, selling revenue, full costs and sales pace remain unknown; this is not a profit calculation."
    },
    {
      "id": "n_d3law_point_case_tokaj_label_release_limitation",
      "node_type": "learning_point",
      "name": "Fictional composition and cellar records do not authenticate origin or approve a real label. Clearing the specified sugar and dates does not prove balance, quality, demand or profitability. Apply this stated harvest-period version, preserve different historic vintage applicability, and obtain complete compliance and buyer review."
    },
    {
      "id": "n_d3law_case_china_gi_dossier",
      "node_type": "production_case",
      "name": "A fictional Chinese producer intends to sell a still grape wine using the special mark for a hypothetical recognised GI product under CNIPA Order 80's product-protection route. The prompt stipulates this product is officially recognised; it does not name or invent a real wine's GI status. The producer provides the current GB/T15037-2006 status-page reference, an ordinary laboratory report and a winery address. It provides no corresponding protected-product specification, source-origin dossier or producer mark-use approval/registration evidence. A merchant will reconsider 200 bottles after supported presentation and product sampling. Option A holds the protected-mark packaging while seeking the missing dossier; supplied record work costs CNY 600 and a stipulated whole-month holding interval costs CNY 200. Option B uses a revised presentation omitting that unsupported protected mark/name only after full lawful ordinary-label review and buyer agreement; reprinting costs CNY 500. Neither option is approved in this exercise; completion times, sensory results and final acceptance are unknown. A hypothetical purchase quote is CNY 50 per bottle for either option before additional listed costs. Compare standard status, actual protected-product conformity, producer mark-use approval, the conditional route and listed cost arithmetic. Other wine/food/import requirements and parallel GI-trademark routes remain outside the supplied dossier."
    },
    {
      "id": "n_d3law_point_case_china_gi_dossier_action",
      "node_type": "learning_point",
      "name": "Hold the proposed protected-product mark/name presentation. Seek the corresponding recognised-product specification, source-origin and conformity evidence, and producer mark-use approval/registration records. Consider either a documented protected claim after review or a revised ordinary presentation after separate full lawful-label review and buyer agreement; request a sample before treating either route as commercially suitable."
    },
    {
      "id": "n_d3law_point_case_china_gi_dossier_reason",
      "node_type": "learning_point",
      "name": "GB/T15037-2006 is officially listed current with recommended status after 23 March 2017; its status page is not a protected-product specification or mark-use authorisation. Under Order 80's GI-product route, recognised origin/product conditions and producer special-mark approval are separate evidential gates. An address and ordinary report do not establish both."
    },
    {
      "id": "n_d3law_point_case_china_gi_dossier_tradeoff",
      "node_type": "learning_point",
      "name": "The 200 bottles at CNY 50 give CNY 10,000 in the supplied purchase quote. OptionA's specified record and holding costs add CNY 800, for CNY 10,800 in listed costs. OptionB's reprint adds CNY 500, for CNY 10,500. The CNY 300 difference compares only these stipulated costs; uncertain timing, samples, buyer acceptance, other costs and selling revenue prevent a profit or guaranteed-cheaper-route conclusion."
    },
    {
      "id": "n_d3law_point_case_china_gi_dossier_limitation",
      "node_type": "learning_point",
      "name": "The recognised product is an explicit hypothetical premise, and no real GI status or mark approval is inferred. Neither generic standard status nor dossier conformity proves sensory quality or saleability. Recommended standard status does not make other legal duties optional. This is the GI-product route only, not all GI-trademark, label, food or import law; no substantive standard percentages were read from the status page."
    }
  ],
