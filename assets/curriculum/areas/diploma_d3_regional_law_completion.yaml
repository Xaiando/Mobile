      "last_verified_at": "2026-10-03T02:56:53.000Z"
    },
    {
      "id": "ki_d3law_tokaj_aszu_sugar",
      "subject_id": "n_d3law_principle_tokaj_aszu_sugar",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d3law_point_tokaj_aszu_sugar",
      "domain_id": "geography",
      "assertion_text": "For Tokaj Aszú under the post 1 August 2025 harvest specification, the residual-sugar minimum is 120 g/L. Meeting this analytical prerequisite does not establish the whole PDO claim, sensory balance or a quality score.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-03T02:56:53.000Z"
    },
    {
      "id": "ki_d3law_tokaj_optional_puttonyos",
      "subject_id": "n_d3law_principle_tokaj_optional_puttonyos",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d3law_point_tokaj_optional_puttonyos",
      "domain_id": "geography",
      "assertion_text": "Version 10 lists optional 3, 4, 5 or 6 puttonyos wording for Aszú, with 6 puttonyos requiring at least 150 g/L residual sugar. All such current Aszú must meet its 120 g/L minimum; do not infer the old 3=60 or 4=90 scale or claim the current specification simply bans 3 and 4 wording.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-03T02:56:53.000Z"
    },
    {
      "id": "ki_d3law_tokaj_consumer_release",
      "subject_id": "n_d3law_principle_tokaj_consumer_release",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d3law_point_tokaj_consumer_release",
      "domain_id": "geography",
      "assertion_text": "Version 10 sets earliest placing-on-market release for Aszú at 1 January of the third year after harvest, separately from its 18 month minimum wood maturation. A 2025 harvest therefore cannot reach that market before 1 January 2028 merely because 18 months wood have been completed.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-03T02:56:53.000Z"
    },
    {
      "id": "ki_d3law_china_standard_status",
      "subject_id": "n_d3law_principle_china_standard_status",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d3law_point_china_standard_status",
      "domain_id": "geography",
      "assertion_text": "SAMR/SAC lists GB/T15037-2006 as current and notes its conversion from mandatory to recommended status on 23 March 2017. This official status page does not supply the full standard's substantive clauses and does not by itself establish that all other wine, food, label or market rules are optional.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-03T02:56:53.000Z"
    },
    {
      "id": "ki_d3law_china_gi_requirements",
      "subject_id": "n_d3law_principle_china_gi_requirements",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d3law_point_china_gi_requirements",
      "domain_id": "geography",
      "assertion_text": "In the GI-product protection route effective 1 February 2024, protected products link characteristics or reputation to a specific geographic origin, and their corresponding product standard must respect recognised name, type, origin and quality requirements. A generic wine-standard identifier or winery address alone does not demonstrate the protected product's conformity.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-03T02:56:53.000Z"
    },
    {
      "id": "ki_d3law_china_special_mark",
      "subject_id": "n_d3law_principle_china_special_mark",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d3law_point_china_special_mark",
      "domain_id": "geography",
      "assertion_text": "The GI-product route requires producer application with origin and testing evidence, official review, and approval, registration and announcement for special-mark use. A standard reference or ordinary laboratory result alone does not show that this producer is authorised to use the mark.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-03T02:56:53.000Z"
    },
    {
      "id": "ki_d3law_china_claim_scope",
      "subject_id": "n_d3law_principle_china_claim_scope",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d3law_point_china_claim_scope",
      "domain_id": "geography",
      "assertion_text": "Order 80's GI-product route governs recognised protected-product conditions and use of its name or special mark; it is not a complete account of parallel collective/certification trademark routes or all market rules. A case must identify this route and supply the recognised product premise rather than invent a real wine's GI status or infer full label clearance.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-03T02:56:53.000Z"
    },
    {
      "id": "ki_d3law_case_jura_release_inventory_action",
      "subject_id": "n_d3law_case_jura_release_inventory",
      "relation_type": "CASE_ACTION",
      "object_id": "n_d3law_point_case_jura_release_inventory_action",
      "domain_id": "geography",
      "assertion_text": "Hold the proposed 20 December 2032 consumer launch and conditionally reschedule to 1 January 2033 after required record and label review. Check the specified Vin Jaune identity for the reserved clavelin format and request a repeat sample against the buyer's brief; supplied conformity premises do not establish sensory fit or full commercial success.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-03T02:56:53.000Z"
    },
    {
      "id": "ki_d3law_case_jura_release_inventory_reason",
      "subject_id": "n_d3law_case_jura_release_inventory",
      "relation_type": "CASE_REASON",
      "object_id": "n_d3law_point_case_jura_release_inventory_reason",
      "domain_id": "geography",
      "assertion_text": "For this 2026 harvest Côtes du Jura Vin Jaune, the recorded non-topped oak calendar reaches 15 December 2032 and 64 veil months exceed the 60 month floor. Consumer sale has a separate earliest date of 1 January 2033 after ageing. The approximately 62 cl clavelin is reserved for this AOC's Vin Jaune mention; that wording alone does not establish a universal ban on every other size.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-03T02:56:53.000Z"
    },
    {
      "id": "ki_d3law_case_jura_release_inventory_tradeoff",
      "subject_id": "n_d3law_case_jura_release_inventory",
      "relation_type": "CASE_TRADEOFF",
      "object_id": "n_d3law_point_case_jura_release_inventory_tradeoff",
      "domain_id": "geography",
      "assertion_text": "The pilot buyer would pay the supplier EUR 4,000 for 100 bottles at EUR 40 each. At the supplied 62 cl net fill, these contain 62 litres: EUR 4,000 / 62 is approximately EUR 64.52 per litre before omitted costs. The buyer also bears the stipulated EUR 240 holding charge, giving EUR 4,240 in listed buyer costs, about EUR 68.39 per litre. Moving dispatch postpones the supplier's receipt of this purchase payment and the buyer's possible customer receipts; the buyer's selling revenue and sales pace remain unknown. These listed costs are not a producer-profit forecast.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-03T02:56:53.000Z"
    },
    {
      "id": "ki_d3law_case_jura_release_inventory_limitation",
      "subject_id": "n_d3law_case_jura_release_inventory",
      "relation_type": "CASE_LIMITATION",
      "object_id": "n_d3law_point_case_jura_release_inventory_limitation",
      "domain_id": "geography",
      "assertion_text": "The case records, quote and holding cost are fictional. Meeting these specified cellar, consumer-date and bottle-identity conditions is not an actual release authorisation, an independent whole-label review, a quality score, a fixed 38% evaporation calculation or a profit guarantee. The calendar is scoped to Côtes du Jura, not every Jura AOC.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-03T02:56:53.000Z"
    },
    {
      "id": "ki_d3law_case_tokaj_label_release_action",
      "subject_id": "n_d3law_case_tokaj_label_release",
      "relation_type": "CASE_ACTION",
      "object_id": "n_d3law_point_case_tokaj_label_release_action",
      "domain_id": "geography",
      "assertion_text": "Hold the proposed 6 puttonyos wording and 1 July 2027 consumer dispatch. Seek a supported Aszú presentation without that numbered claim, full current record/label review and a repeat tasting, then conditionally schedule the buyer's pilot from 1 January 2028; a revised label still needs the buyer's agreement.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-03T02:56:53.000Z"
    },
    {
      "id": "ki_d3law_case_tokaj_label_release_reason",
      "subject_id": "n_d3law_case_tokaj_label_release",
      "relation_type": "CASE_REASON",
      "object_id": "n_d3law_point_case_tokaj_label_release_reason",
      "domain_id": "geography",
      "assertion_text": "The supplied 15 September 2025 harvest is within version 10's post 1 August 2025 scope. 135 g/L exceeds the current Aszú 120 g/L minimum but misses the separate 150 g/L prerequisite for 6 puttonyos. The current specification lists optional 3, 4, 5 and 6 wording; it does not justify a blanket 3/4 ban or historical lower sugar minima. 18 months wood are supplied as completed, but the separate placing-on-market gate for 2025 is 1 January 2028.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-03T02:56:53.000Z"
    },
    {
      "id": "ki_d3law_case_tokaj_label_release_tradeoff",
      "subject_id": "n_d3law_case_tokaj_label_release",
      "relation_type": "CASE_TRADEOFF",
      "object_id": "n_d3law_point_case_tokaj_label_release_tradeoff",
      "domain_id": "geography",
      "assertion_text": "The pilot buyer would pay the supplier 100 times EUR 25, or EUR 2,500, on dispatch. The buyer also bears six stipulated holding months at EUR 60, or EUR 360, plus a EUR 180 reprint charge: EUR 3,040 in listed buyer costs before omitted expenses. Rescheduling dispatch postpones that purchase outflow and the supplier's matching receipt. The buyer bears the stated interim costs while its eventual customer receipts, selling revenue, full costs and sales pace remain unknown; this is not a profit calculation.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-03T02:56:53.000Z"
    },
    {
      "id": "ki_d3law_case_tokaj_label_release_limitation",
      "subject_id": "n_d3law_case_tokaj_label_release",
      "relation_type": "CASE_LIMITATION",
      "object_id": "n_d3law_point_case_tokaj_label_release_limitation",
      "domain_id": "geography",
      "assertion_text": "Fictional composition and cellar records do not authenticate origin or approve a real label. Clearing the specified sugar and dates does not prove balance, quality, demand or profitability. Apply this stated harvest-period version, preserve different historic vintage applicability, and obtain complete compliance and buyer review.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-03T02:56:53.000Z"
    },
    {
      "id": "ki_d3law_case_china_gi_dossier_action",
      "subject_id": "n_d3law_case_china_gi_dossier",
      "relation_type": "CASE_ACTION",
      "object_id": "n_d3law_point_case_china_gi_dossier_action",
      "domain_id": "geography",
      "assertion_text": "Hold the proposed protected-product mark/name presentation. Seek the corresponding recognised-product specification, source-origin and conformity evidence, and producer mark-use approval/registration records. Consider either a documented protected claim after review or a revised ordinary presentation after separate full lawful-label review and buyer agreement; request a sample before treating either route as commercially suitable.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-03T02:56:53.000Z"
    },
    {
      "id": "ki_d3law_case_china_gi_dossier_reason",
      "subject_id": "n_d3law_case_china_gi_dossier",
      "relation_type": "CASE_REASON",
      "object_id": "n_d3law_point_case_china_gi_dossier_reason",
      "domain_id": "geography",
      "assertion_text": "GB/T15037-2006 is officially listed current with recommended status after 23 March 2017; its status page is not a protected-product specification or mark-use authorisation. Under Order 80's GI-product route, recognised origin/product conditions and producer special-mark approval are separate evidential gates. An address and ordinary report do not establish both.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-03T02:56:53.000Z"
    },
    {
      "id": "ki_d3law_case_china_gi_dossier_tradeoff",
      "subject_id": "n_d3law_case_china_gi_dossier",
      "relation_type": "CASE_TRADEOFF",
      "object_id": "n_d3law_point_case_china_gi_dossier_tradeoff",
      "domain_id": "geography",
      "assertion_text": "The 200 bottles at CNY 50 give CNY 10,000 in the supplied purchase quote. OptionA's specified record and holding costs add CNY 800, for CNY 10,800 in listed costs. OptionB's reprint adds CNY 500, for CNY 10,500. The CNY 300 difference compares only these stipulated costs; uncertain timing, samples, buyer acceptance, other costs and selling revenue prevent a profit or guaranteed-cheaper-route conclusion.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-03T02:56:53.000Z"
    },
    {
      "id": "ki_d3law_case_china_gi_dossier_limitation",
      "subject_id": "n_d3law_case_china_gi_dossier",
      "relation_type": "CASE_LIMITATION",
      "object_id": "n_d3law_point_case_china_gi_dossier_limitation",
      "domain_id": "geography",
      "assertion_text": "The recognised product is an explicit hypothetical premise, and no real GI status or mark approval is inferred. Neither generic standard status nor dossier conformity proves sensory quality or saleability. Recommended standard status does not make other legal duties optional. This is the GI-product route only, not all GI-trademark, label, food or import law; no substantive standard percentages were read from the status page.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-03T02:56:53.000Z"
    }
  ],
