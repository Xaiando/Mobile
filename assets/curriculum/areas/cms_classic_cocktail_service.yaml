knowledge_items:
  -
    id: "ki_cms_cocktail_dry_martini"
    subject_id: "n_cms_cocktail_dry_martini"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_cms_cocktail_dry_martini_point"
    domain_id: "service"
    assertion_text: "The IBA Dry Martini reference combines 60 ml gin with 10 ml dry vermouth, stirred with ice and strained into a chilled Martini glass. Lemon-peel oil or a requested olive supplies the garnish. This is one named reference; check the guest's preferred gin, vermouth proportion and garnish rather than assuming all Martinis are identical."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  -
    id: "ki_cms_cocktail_manhattan"
    subject_id: "n_cms_cocktail_manhattan"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_cms_cocktail_manhattan_point"
    domain_id: "service"
    assertion_text: "In the IBA Manhattan reference, 50 ml rye whiskey is combined with 20 ml sweet red vermouth and one dash of Angostura bitters. It is stirred with ice, strained into a chilled cocktail glass and garnished with a cocktail cherry. This reference distinguishes it from the gin and dry-vermouth Martini without making rye mandatory for every venue's Manhattan variant."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  -
    id: "ki_cms_cocktail_negroni"
    subject_id: "n_cms_cocktail_negroni"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_cms_cocktail_negroni_point"
    domain_id: "service"
    assertion_text: "IBA's Negroni uses equal 30 ml portions of gin, Campari and sweet red vermouth. The ingredients go into a chilled Old Fashioned glass with ice and are stirred gently; the garnish is half an orange slice. Equal parts describe this named reference, not a universal rule for every bar's variation."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  -
    id: "ki_cms_cocktail_daiquiri"
    subject_id: "n_cms_cocktail_daiquiri"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_cms_cocktail_daiquiri_point"
    domain_id: "service"
    assertion_text: "IBA's Daiquiri reference uses 60 ml white Cuban rum, 20 ml fresh lime juice and two bar spoons of superfine sugar. Dissolve the sugar with the liquids, then add ice, shake and strain into a chilled cocktail glass. The source specifies neither an orange liqueur nor a mandatory garnish; frozen and other venue variants need separate clarification."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  -
    id: "ki_cms_cocktail_margarita"
    subject_id: "n_cms_cocktail_margarita"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_cms_cocktail_margarita_point"
    domain_id: "service"
    assertion_text: "The IBA Margarita reference combines 50 ml 100% agave tequila, 20 ml triple sec and 15 ml fresh lime juice, shaken with ice and strained into a chilled cocktail glass. A half salt rim is optional. Confirm the guest's rim preference and the actual venue recipe rather than treating a salted rim or a particular orange-liqueur brand as universal."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  -
    id: "ki_cms_cocktail_old_fashioned"
    subject_id: "n_cms_cocktail_old_fashioned"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_cms_cocktail_old_fashioned_point"
    domain_id: "service"
    assertion_text: "IBA's Old Fashioned reference uses 45 ml bourbon or rye whiskey with one sugar cube, a few dashes of Angostura bitters and a few dashes of plain water. Dissolve the bitters-soaked sugar with water in the serving glass, add ice and whiskey, then stir gently. Orange slice or zest and a cocktail cherry are listed garnishes. Vermouth is not part of this reference."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  -
    id: "ki_cms_cocktail_whiskey_sour"
    subject_id: "n_cms_cocktail_whiskey_sour"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_cms_cocktail_whiskey_sour_point"
    domain_id: "service"
    assertion_text: "The IBA Whiskey Sour reference uses 45 ml bourbon, 25 ml fresh lemon juice and 20 ml sugar syrup, shaken with ice. A few drops of egg white are optional. It is strained into a cobbler glass or, for service on the rocks, an ice-filled Old Fashioned glass. An optional reference ingredient is not proof that the actual bar's drink is egg-free; confirm the recipe before answering an ingredient request."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  -
    id: "ki_cms_cocktail_americano"
    subject_id: "n_cms_cocktail_americano"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_cms_cocktail_americano_point"
    domain_id: "service"
    assertion_text: "IBA's Americano combines 30 ml Campari and 30 ml sweet red vermouth with a splash of soda water, gently stirred over ice in an Old Fashioned glass. Its garnish includes half an orange slice and lemon zest. Unlike the cited Negroni, this reference adds soda rather than gin; it is still an alcoholic drink, and a splash is not a fixed millilitre amount."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  -
    id: "ki_cms_cocktail_aperitif_action"
    subject_id: "n_cms_cocktail_case_aperitif"
    relation_type: "CASE_ACTION"
    object_id: "n_cms_cocktail_aperitif_action"
    domain_id: "service"
    assertion_text: "Offer an Americano provisionally, explain that the cited recipe combines Campari, sweet red vermouth and soda without added gin, and confirm the venue can prepare that version."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  -
    id: "ki_cms_cocktail_aperitif_reason"
    subject_id: "n_cms_cocktail_case_aperitif"
    relation_type: "CASE_REASON"
    object_id: "n_cms_cocktail_aperitif_reason"
    domain_id: "service"
    assertion_text: "Both cited references use Campari and sweet red vermouth. IBA's Americano adds a splash of soda; its Negroni adds gin instead, so a Negroni would conflict with this guest's stated no-gin preference."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  -
    id: "ki_cms_cocktail_aperitif_tradeoff"
    subject_id: "n_cms_cocktail_case_aperitif"
    relation_type: "CASE_TRADEOFF"
    object_id: "n_cms_cocktail_aperitif_tradeoff"
    domain_id: "service"
    assertion_text: "If the guest changes their preference and wants gin, discuss the Negroni as a different option. Keep its gin component explicit rather than substituting it without agreement; do not calculate an exact strength from an unspecified soda splash."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  -
    id: "ki_cms_cocktail_aperitif_limit"
    subject_id: "n_cms_cocktail_case_aperitif"
    relation_type: "CASE_LIMITATION"
    object_id: "n_cms_cocktail_aperitif_limit"
    domain_id: "service"
    assertion_text: "Confirm the actual bar recipe, bottles and availability before serving. The IBA Americano has no added gin but includes alcoholic Campari and vermouth; its reference cannot certify this venue's substitutions or suitability for a dietary request."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  -
    id: "ki_cms_cocktail_rum_citrus_action"
    subject_id: "n_cms_cocktail_case_rum_citrus"
    relation_type: "CASE_ACTION"
    object_id: "n_cms_cocktail_rum_citrus_action"
    domain_id: "service"
    assertion_text: "Offer the Daiquiri provisionally and confirm the guest wants the venue's rum, lime and sugar version. Ask about the desired balance before service instead of treating a cocktail name as a complete specification."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  -
    id: "ki_cms_cocktail_rum_citrus_reason"
    subject_id: "n_cms_cocktail_case_rum_citrus"
    relation_type: "CASE_REASON"
    object_id: "n_cms_cocktail_rum_citrus_reason"
    domain_id: "service"
    assertion_text: "The cited Daiquiri uses white Cuban rum, fresh lime and superfine sugar. The cited Margarita uses 100% agave tequila, triple sec and lime, so it changes both the requested spirit and the reference's sweetening ingredient."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  -
    id: "ki_cms_cocktail_rum_citrus_tradeoff"
    subject_id: "n_cms_cocktail_case_rum_citrus"
    relation_type: "CASE_TRADEOFF"
    object_id: "n_cms_cocktail_rum_citrus_tradeoff"
    domain_id: "service"
    assertion_text: "A Margarita may be discussed if the guest changes their preference to tequila and accepts triple sec. Explain those changes and ask about the optional half salt rim rather than presenting it as an equivalent rum cocktail."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  -
    id: "ki_cms_cocktail_rum_citrus_limit"
    subject_id: "n_cms_cocktail_case_rum_citrus"
    relation_type: "CASE_LIMITATION"
    object_id: "n_cms_cocktail_rum_citrus_limit"
    domain_id: "service"
    assertion_text: "Check the actual recipe and ingredients: the IBA Daiquiri lists two bar spoons of sugar, not an exact millilitre conversion. Its reference does not establish the venue's substitutions, finished sweetness or the guest's preferred balance."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
