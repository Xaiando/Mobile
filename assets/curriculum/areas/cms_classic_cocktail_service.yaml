# Original CMS Certified cocktail identities and guest-recommendation cases.
# IBA recipes are named references; venue variants and guest preference remain explicit.
# All facts are unverified pending qualified review. No WSET or Introductory mappings.
knowledge_nodes:
  -
    id: "n_cms_cocktail_dry_martini"
    node_type: "production_principle"
    name: "How does the IBA Dry Martini reference identify its recipe and service?"
  -
    id: "n_cms_cocktail_dry_martini_point"
    node_type: "learning_point"
    name: "Gin and dry vermouth, stirred rather than shaken"
  -
    id: "n_cms_cocktail_manhattan"
    node_type: "production_principle"
    name: "How does the IBA Manhattan reference identify its recipe and service?"
  -
    id: "n_cms_cocktail_manhattan_point"
    node_type: "learning_point"
    name: "Rye whiskey, sweet red vermouth and Angostura bitters"
  -
    id: "n_cms_cocktail_negroni"
    node_type: "production_principle"
    name: "How does the IBA Negroni reference identify its recipe and service?"
  -
    id: "n_cms_cocktail_negroni_point"
    node_type: "learning_point"
    name: "Equal gin, Campari and sweet red vermouth, stirred in the serving glass"
  -
    id: "n_cms_cocktail_daiquiri"
    node_type: "production_principle"
    name: "How does the IBA Daiquiri reference identify its recipe and service?"
  -
    id: "n_cms_cocktail_daiquiri_point"
    node_type: "learning_point"
    name: "White Cuban rum, lime and sugar, shaken after the sugar dissolves"
  -
    id: "n_cms_cocktail_margarita"
    node_type: "production_principle"
    name: "How does the IBA Margarita reference identify its recipe and service?"
  -
    id: "n_cms_cocktail_margarita_point"
    node_type: "learning_point"
    name: "100% agave tequila, triple sec and lime, shaken; half salt rim optional"
  -
    id: "n_cms_cocktail_old_fashioned"
    node_type: "production_principle"
    name: "How does the IBA Old Fashioned reference identify its recipe and service?"
  -
    id: "n_cms_cocktail_old_fashioned_point"
    node_type: "learning_point"
    name: "Bourbon or rye with a sugar cube, bitters and a little water"
  -
    id: "n_cms_cocktail_whiskey_sour"
    node_type: "production_principle"
    name: "How does the IBA Whiskey Sour reference identify its recipe and service?"
  -
    id: "n_cms_cocktail_whiskey_sour_point"
    node_type: "learning_point"
    name: "Bourbon, lemon and sugar syrup; egg white is optional"
  -
    id: "n_cms_cocktail_americano"
    node_type: "production_principle"
    name: "How does the IBA Americano reference identify its recipe and service?"
  -
    id: "n_cms_cocktail_americano_point"
    node_type: "learning_point"
    name: "Campari and sweet red vermouth with soda, without added gin"
  -
    id: "n_cms_cocktail_case_aperitif"
    node_type: "production_case"
    name: "A guest requests Campari and vermouth with soda but does not want gin"
  -
    id: "n_cms_cocktail_aperitif_action"
    node_type: "learning_point"
    name: "Offer the Americano provisionally and confirm the venue recipe"
  -
    id: "n_cms_cocktail_aperitif_reason"
    node_type: "learning_point"
    name: "The Americano adds soda where the Negroni includes gin"
  -
    id: "n_cms_cocktail_aperitif_tradeoff"
    node_type: "learning_point"
    name: "Discuss a Negroni only if the guest changes the no-gin preference"
  -
    id: "n_cms_cocktail_aperitif_limit"
    node_type: "learning_point"
    name: "A reference does not establish the stocked recipe or ingredient suitability"
  -
    id: "n_cms_cocktail_case_rum_citrus"
    node_type: "production_case"
    name: "A guest wants a rum-and-lime cocktail without orange liqueur"
  -
    id: "n_cms_cocktail_rum_citrus_action"
    node_type: "learning_point"
    name: "Offer the Daiquiri provisionally and confirm the guest's balance preference"
  -
    id: "n_cms_cocktail_rum_citrus_reason"
    node_type: "learning_point"
    name: "Daiquiri uses rum and sugar while Margarita uses tequila and triple sec"
  -
    id: "n_cms_cocktail_rum_citrus_tradeoff"
    node_type: "learning_point"
    name: "Discuss Margarita only if the guest accepts tequila and triple sec"
  -
    id: "n_cms_cocktail_rum_citrus_limit"
    node_type: "learning_point"
    name: "Reference measures do not guarantee this guest's preferred final balance"
