  - id: n_reg_na_case_lodi_sampling_triage
    node_type: production_case
    name: A Lodi Zinfandel grower has one crew day before a booked crush slot. Block A has healthy fruit and
      consistent maturity checks matching the intended fresh red style. Block B has a dense canopy and
      noticeably mixed berry maturity; inspection finds some damaged bunches. The crew can either harvest A or
      spend the day sampling and selectively opening B’s canopy, but cannot complete both. Another crew is
      available later at a higher quoted cost, and the next crush slot is unconfirmed. No regional name
      guarantees ripeness or sound fruit. Propose an action, explain a reason, weigh a tradeoff and state a
      limitation.
  - id: n_reg_na_point_case_lodi_sampling_triage_action
    node_type: learning_point
    name: Use the confirmed slot for the checked Lodi block and separately assess the uncertain fruit
  - id: n_reg_na_point_case_lodi_sampling_triage_reason
    node_type: learning_point
    name: Lodi cluster and canopy variation makes representative assessment relevant
  - id: n_reg_na_point_case_lodi_sampling_triage_tradeoff
    node_type: learning_point
    name: The triage protects the checked lot but leaves extra work and capacity uncertainty
  - id: n_reg_na_point_case_lodi_sampling_triage_limitation
    node_type: learning_point
    name: Canopy work does not guarantee damaged or uneven fruit becomes suitable
  - id: n_reg_na_case_oregon_stem_trial
    node_type: production_case
    name: An Oregon Pinot Noir producer can split one sound, uniformly sampled parcel lot into matched vessels. A
      small pilot using destemmed fruit has the bright fruit and lighter grip wanted for one product; a pilot
      retaining half the bunches has more spice and firmer grip wanted for another. The pilots were tasted
      blind and have no detected faults. Harvest, vessel size, temperature, extraction and oak programme can
      be kept the same for the split, and both proposed routes fit the budget. Full-scale consistency and
      customer demand remain untested. Propose an action, explain a reason, weigh a tradeoff and state a
      limitation before scaling stem use.
  - id: n_reg_na_point_case_oregon_stem_trial_action
    node_type: learning_point
    name: Run a controlled Oregon split and assess each proposed style before scaling
  - id: n_reg_na_point_case_oregon_stem_trial_reason
    node_type: learning_point
    name: Stem inclusion offers a plausible explanation for the pilot texture and spice contrast
  - id: n_reg_na_point_case_oregon_stem_trial_tradeoff
    node_type: learning_point
    name: Different stem routes serve different briefs and still require a commercial choice
  - id: n_reg_na_point_case_oregon_stem_trial_limitation
    node_type: learning_point
    name: One Oregon pilot cannot validate future stem proportions or market performance
  - id: n_reg_na_case_county_protection_budget
    node_type: production_case
    name: A Prince Edward County grower compares soil burial and geotextile protection for the same cultivar on
      one block before winter. Both can be installed before the forecast cold period. A local contractor
      quotes textile installation and storage at a higher upfront cost; both options fit the available budget.
      Last year’s neighbouring plots used different pruning and experienced different exposures, so their
      bud-survival results are not a controlled comparison. The grower can obtain local technical advice,
      monitor cover and temperature, and inspect buds in spring. The target is preserving viable fruiting buds
      while limiting annual handling work. Propose an action, explain a reason, weigh a tradeoff and state a
      limitation.
  - id: n_reg_na_point_case_county_protection_budget_action
    node_type: learning_point
    name: Compare locally suitable County protection with a monitored block trial
  - id: n_reg_na_point_case_county_protection_budget_reason
    node_type: learning_point
    name: Textile and soil cover address winter insulation while spring handling remains relevant
  - id: n_reg_na_point_case_county_protection_budget_tradeoff
    node_type: learning_point
    name: Weigh the quoted textile outlay against the target of limiting soil handling
  - id: n_reg_na_point_case_county_protection_budget_limitation
    node_type: learning_point
    name: Unmatched County bud-survival observations cannot establish the better method
  - id: n_reg_na_case_niagara_preplant_drainage
    node_type: production_case
    name: A Niagara bench grower compares two unplanted parcels for Riesling. Parcel A’s local assessment reports
      workable soil drainage and no persistent standing water. Parcel B has documented standing water and
      equipment ruts after rain; a specialist proposes drainage installation before planting. Both have
      suitable local heat and exposure records for the intended grape, but root-zone assessments for B are
      incomplete. The quoted installation would exceed the current capital budget unless planting B is
      delayed. The grower can plant A this season or defer B until investigation and funding are complete. No
      limestone or bench label establishes wine flavour or quality. Propose an action, explain a reason, weigh
      a tradeoff and state a limitation.
  - id: n_reg_na_point_case_niagara_preplant_drainage_action
    node_type: learning_point
    name: Use the assessed Niagara parcel or defer drainage-dependent planting
  - id: n_reg_na_point_case_niagara_preplant_drainage_reason
    node_type: learning_point
    name: Wet root zones can restrict growth despite a suitable Niagara heat setting
  - id: n_reg_na_point_case_niagara_preplant_drainage_tradeoff
    node_type: learning_point
    name: Deferral trades time for completing a feasible drainage and capital plan
  - id: n_reg_na_point_case_niagara_preplant_drainage_limitation
    node_type: learning_point
    name: Regional bench descriptions cannot certify a parcel’s drainage or wine quality
