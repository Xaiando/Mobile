knowledge_items:
  - id: ki_reg_na_sta_rita_grapes
    subject_id: n_reg_na_principle_santa_barbara_grape_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_na_point_sta_rita_grapes
    domain_id: viticulture
    assertion_text: Sta. Rita Hills combines morning fog and afternoon ocean airflow with Pinot Noir and
      Chardonnay plantings. This provides a cooler-site grape comparison within Santa Barbara, while a
      particular wine’s ripeness still depends on its parcel and harvest.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_happy_later_grapes
    subject_id: n_reg_na_principle_santa_barbara_grape_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_na_point_happy_later_grapes
    domain_id: viticulture
    assertion_text: Happy Canyon’s more inland position creates a warmer growing setting than western marine
      sites. Its Cabernet Sauvignon and other Bordeaux-variety associations illustrate an opportunity for
      later-ripening grapes; the regional description does not guarantee complete maturity in every season.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_slh_morning_aspect
    subject_id: n_reg_na_principle_slh_aspect_style
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_na_point_slh_morning_aspect
    domain_id: viticulture
    assertion_text: Santa Lucia Highlands benches face east and receive morning sunshine before the afternoon
      maritime airflow. This combines exposure with cooling in a site assessment, rather than treating a cool
      regional label as evidence that grapes receive little sunlight.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_slh_chardonnay_range
    subject_id: n_reg_na_principle_slh_aspect_style
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_na_point_slh_chardonnay_range
    domain_id: winemaking
    assertion_text: The regional body describes Santa Lucia Highlands Chardonnay ranging from leaner, crisp
      examples to richer expressions. Local elevation and exposure vary; the actual wine and its production
      record are needed before assigning a fixed body or oak character from the region alone.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_santa_cruz_east
    subject_id: n_reg_na_principle_santa_cruz_slopes
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_na_point_santa_cruz_east
    domain_id: viticulture
    assertion_text: The Santa Cruz Mountains’ inland eastern side is described as warmer and less windy, with
      Cabernet, Merlot and Zinfandel associations. These are broad site-grape tendencies rather than an
      exclusive list or a claim that every eastern parcel ripens identically.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_santa_cruz_coastal
    subject_id: n_reg_na_principle_santa_cruz_slopes
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_na_point_santa_cruz_coastal
    domain_id: viticulture
    assertion_text: The coastal side and exposed ridge sites receive ocean breezes and fog and are associated with
      Pinot Noir and Chardonnay. Compare the actual exposure and elevation with inland parcels; the press
      kit’s soil-to-mineral-flavour claims are unnecessary for this climatic explanation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_lodi_loose_selection
    subject_id: n_reg_na_principle_lodi_cluster_canopy
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_na_point_lodi_loose_selection
    domain_id: viticulture
    assertion_text: A 2018 Lodi grower feature describes Primitivo selections with looser, longer clusters and
      lower rot pressure than more tightly packed Zinfandel selections. Cluster architecture can inform
      selection and monitoring; clone identity alone does not guarantee freedom from disease.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_lodi_canopy_air
    subject_id: n_reg_na_principle_lodi_cluster_canopy
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_na_point_lodi_canopy_air
    domain_id: viticulture
    assertion_text: At TruLux in 2018, the grower used shoot thinning and leaf removal to increase air movement
      and some bunch light, aiming to reduce mould and rot pressure. This is a local management example;
      intensity must follow the actual canopy and season rather than a universal removal recipe.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_amador_water_storage
    subject_id: n_reg_na_principle_amador_water_training
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_na_point_amador_water_storage
    domain_id: viticulture
    assertion_text: The Amador regional body describes sandy-clay loams containing decomposed granite and
      sufficient rainwater retention for many growers to dry farm. Stored soil water is a physical explanation
      to investigate; it does not establish that every block can avoid irrigation in every year.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_amador_training_range
    subject_id: n_reg_na_principle_amador_water_training
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_na_point_amador_training_range
    domain_id: viticulture
    assertion_text: Amador vineyards include head-trained, spur-pruned vines as well as bilateral cordons and
      vertical trellises. These different systems warrant checking the actual pruning and canopy-work plan;
      neither the regional name nor an old-vine description establishes one training system or superior
      quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_red_mountain_sun
    subject_id: n_reg_na_principle_red_mountain_exposure_air
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_na_point_red_mountain_sun
    domain_id: viticulture
    assertion_text: Red Mountain’s broad southwest-facing slopes receive strong summer sun, and the regional
      profile associates that warm setting with red grapes, notably Cabernet Sauvignon. This is a grape-site
      opportunity, not proof of optimal ripeness, tannin or quality in every wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_red_mountain_air
    subject_id: n_reg_na_principle_red_mountain_exposure_air
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_na_point_red_mountain_air
    domain_id: viticulture
    assertion_text: The Washington Wine Commission describes temperature moderation and continual airflow near the
      Yakima River at Red Mountain. These can inform comparison with nearby frost-prone sites, but local
      exposure and the weather event still matter; continual airflow is not a frost-free guarantee.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_walla_cobble_heat
    subject_id: n_reg_na_principle_walla_profile_contrasts
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_na_point_walla_cobble_heat
    domain_id: viticulture
    assertion_text: In parts of the lower Walla Walla valley, cobbles and gravel provide well-drained ground and
      absorb daytime heat that is released later. These physical properties can affect the growing
      environment; they do not prove a particular aroma, superior wine or identical water status across all
      valley sites.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_walla_loess_depth
    subject_id: n_reg_na_principle_walla_profile_contrasts
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_na_point_walla_loess_depth
    domain_id: viticulture
    assertion_text: Walla Walla includes deeper wind-deposited silt profiles and steeper hills with thinner loess
      over weathered basalt. The contrasting depths justify parcel-specific root-zone and water assessment,
      rather than applying one soil description or automatic mineral flavour to the whole valley.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_oregon_whole_cluster_effect
    subject_id: n_reg_na_principle_oregon_stem_comparison
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_na_point_oregon_whole_cluster_effect
    domain_id: winemaking
    assertion_text: Cristom describes whole-cluster Pinot Noir as adding a tannin dimension and possible spicy or
      herbaceous aromatic expression, with effects varying by site and vintage. This is one Oregon producer’s
      technique, not a requirement for Oregon Pinot Noir or a guarantee of greater quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_oregon_series_controls
    subject_id: n_reg_na_principle_oregon_stem_comparison
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_na_point_oregon_series_controls
    domain_id: winemaking
    assertion_text: Cristom’s 2022 Louise Vineyard series compares different whole-cluster proportions while
      reporting the same vineyard, harvest date and maturation duration/new-oak share. Such shared conditions
      make a focused stem comparison more useful than comparing unrelated bottles, although the sheet alone
      does not establish replicated causal proof.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_long_island_merlot_timing
    subject_id: n_reg_na_principle_long_island_grape_timing
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_na_point_long_island_merlot_timing
    domain_id: viticulture
    assertion_text: The New York grape profile associates Merlot with Long Island and describes early budding,
      which increases spring-frost exposure, alongside early ripening that can reduce exposure to autumn rain.
      The different seasonal risks require local timing records; earlier maturity does not prevent all rain or
      frost losses.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_long_island_cab_franc_style
    subject_id: n_reg_na_principle_long_island_grape_timing
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_na_point_long_island_cab_franc_style
    domain_id: winemaking
    assertion_text: The New York grape profile associates Cabernet Franc with Long Island and notes that vineyard
      practices can influence a more fruity or vegetal expression. This makes canopy and fruit-maturity
      evidence relevant when comparing reds; bell-pepper or red-fruit notes alone cannot establish origin or a
      quality rank.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_niagara_slope_air
    subject_id: n_reg_na_principle_niagara_bench_physics
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_na_point_niagara_slope_air
    domain_id: viticulture
    assertion_text: Shaw’s Niagara technical explanation describes cold air moving downslope on clear, calm
      radiation-frost nights, with warmer air replacing it above. Bench-site assessment should consider slope
      and air pathways; the mechanism does not eliminate every frost event or apply identically to flat
      ground.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_niagara_soil_moisture
    subject_id: n_reg_na_principle_niagara_bench_physics
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_na_point_niagara_soil_moisture
    domain_id: viticulture
    assertion_text: The Niagara Escarpment overview describes deep clay/silt and calcareous clay-loam soils with
      water-holding capacity, groundwater input and natural slope drainage. Drainage and retained moisture are
      different properties to assess together; neither a limestone label nor drainage alone establishes the
      wine’s flavour.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_county_insulating_cover
    subject_id: n_reg_na_principle_county_winter_spring
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_na_point_county_insulating_cover
    domain_id: viticulture
    assertion_text: Traynor’s dated Prince Edward County account contrasts covering vines with geotextiles and
      burying them with soil as insulating winter-protection options. These are local examples requiring site
      and cultivar assessment; the account does not prove that either method protects every vine from every
      cold event.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_county_unbury_timing
    subject_id: n_reg_na_principle_county_winter_spring
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_na_point_county_unbury_timing
    domain_id: viticulture
    assertion_text: Ontario’s spring-vineyard guidance warns that swelling buds become more cold-sensitive,
      handling can damage emerging shoots, and budburst while buried can damage buds. Applied to soil-covered
      County vines, this creates a timing decision based on development and weather rather than a fixed date
      for all vineyards.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_erie_shallow_heat
    subject_id: n_reg_na_principle_erie_heat_soils
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_na_point_erie_shallow_heat
    domain_id: viticulture
    assertion_text: The Lake Erie North Shore overview describes shallow water warming rapidly in summer and a
      long growing season that supports grape maturation. This heat context differs from a generic assumption
      that every nearby lake produces equal cooling; parcel records remain necessary before choosing a
      late-ripening grape.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_erie_light_drainage
    subject_id: n_reg_na_principle_erie_heat_soils
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_na_point_erie_light_drainage
    domain_id: viticulture
    assertion_text: Lake Erie North Shore soils are described as relatively light textured, including sandy loam
      and gravel with areas over limestone or shale. Well-drained profiles are useful physical site evidence,
      but texture and bedrock alone do not establish stored water, an irrigation budget or a specific wine
      aroma.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_similkameen_wind_pressure
    subject_id: n_reg_na_principle_similkameen_wind_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_na_point_similkameen_wind_pressure
    domain_id: viticulture
    assertion_text: The Similkameen overview links persistent wind with lower vineyard disease pressure. Airflow
      is useful growing context, but neither windy conditions nor an organic reputation demonstrates freedom
      from infection or removes the need to monitor a particular canopy and season.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_similkameen_shade_grapes
    subject_id: n_reg_na_principle_similkameen_wind_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_na_point_similkameen_shade_grapes
    domain_id: viticulture
    assertion_text: The regional overview associates cooler shaded Similkameen sites with Riesling or Gamay and
      sunnier slopes with Cabernet varieties. These local exposure differences help compare planting or
      sourcing opportunities; warm regional summers do not make every parcel equally suitable for
      later-ripening grapes.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_okanagan_north_aromatic
    subject_id: n_reg_na_principle_okanagan_specific_grapes
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_na_point_okanagan_north_aromatic
    domain_id: viticulture
    assertion_text: The Okanagan overview associates its cooler northern reaches with aromatic whites including
      Riesling and with Pinot Noir. This is a selected grape-site comparison within the valley; it does not
      mean every northern wine is dry, light-bodied or identically acidic.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_okanagan_warm_cabernet
    subject_id: n_reg_na_principle_okanagan_specific_grapes
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_na_point_okanagan_warm_cabernet
    domain_id: viticulture
    assertion_text: Wine Growers of BC identifies warmer Okanagan sites near Osoyoos, including eastern slopes, as
      suitable Cabernet Sauvignon settings. Compare actual exposure and fruit maturity with cooler northern
      sites; warm-site suitability does not establish a fixed tannin level, successful harvest or universal
      quality advantage.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_case_lodi_sampling_triage_action
    subject_id: n_reg_na_case_lodi_sampling_triage
    relation_type: CASE_ACTION
    object_id: n_reg_na_point_case_lodi_sampling_triage_action
    domain_id: viticulture
    assertion_text: Use the available crew and confirmed slot for A, whose supplied health and maturity evidence
      fit the brief. Arrange separate inspection, representative maturity sampling and appropriately targeted
      canopy work for B before assigning a harvest date; do not mix its uncertain fruit into A solely to fill
      capacity.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_case_lodi_sampling_triage_reason
    subject_id: n_reg_na_case_lodi_sampling_triage
    relation_type: CASE_REASON
    object_id: n_reg_na_point_case_lodi_sampling_triage_reason
    domain_id: viticulture
    assertion_text: The dated Lodi interviews report varied stages of ripening and targeted canopy opening for air
      and bunch light. That context supports checking B rather than assuming its regional or variety identity
      establishes uniform maturity; the observed damage and A’s suitability are supplied hypothetical
      evidence.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_case_lodi_sampling_triage_tradeoff
    subject_id: n_reg_na_case_lodi_sampling_triage
    relation_type: CASE_TRADEOFF
    object_id: n_reg_na_point_case_lodi_sampling_triage_tradeoff
    domain_id: business
    assertion_text: The action uses a confirmed opportunity for suitable fruit but postpones B’s assessment and
      may require the later, dearer crew and another crush arrangement. Compare the added expense with actual
      recoverable fruit and capacity; the premise does not prove those costs can be recovered through a higher
      bottle price.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_case_lodi_sampling_triage_limitation
    subject_id: n_reg_na_case_lodi_sampling_triage
    relation_type: CASE_LIMITATION
    object_id: n_reg_na_point_case_lodi_sampling_triage_limitation
    domain_id: viticulture
    assertion_text: Recheck B’s fruit condition, maturity and actual crush availability before committing. Opening
      the canopy cannot establish that already damaged bunches are sound or that the whole block will reach
      the intended style in time; the 2018 example is not a forecast for this hypothetical season.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_case_oregon_stem_trial_action
    subject_id: n_reg_na_case_oregon_stem_trial
    relation_type: CASE_ACTION
    object_id: n_reg_na_point_case_oregon_stem_trial_action
    domain_id: winemaking
    assertion_text: Keep the supplied shared conditions matched and compare destemmed and partial whole-cluster
      splits against their separate product briefs. Repeat blind assessment of finished wines before scaling;
      use the pilot observations as provisional style evidence rather than select one method as universally
      better.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_case_oregon_stem_trial_reason
    subject_id: n_reg_na_case_oregon_stem_trial
    relation_type: CASE_REASON
    object_id: n_reg_na_point_case_oregon_stem_trial_reason
    domain_id: winemaking
    assertion_text: Cristom’s account describes an extra tannin dimension and possible spicy or herbaceous
      expression from whole clusters. That offers a plausible mechanism for the supplied pilots’ contrast,
      without proving stems caused every observation or guaranteeing identical effects in another lot.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_case_oregon_stem_trial_tradeoff
    subject_id: n_reg_na_case_oregon_stem_trial
    relation_type: CASE_TRADEOFF
    object_id: n_reg_na_point_case_oregon_stem_trial_tradeoff
    domain_id: business
    assertion_text: Partial whole clusters fit the supplied firmer, spicier pilot brief while destemming fits the
      lighter-fruit pilot. Both are affordable here, so compare production consistency and demand for each
      product before allocating the full lot; the stronger grip has no demonstrated price premium.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_case_oregon_stem_trial_limitation
    subject_id: n_reg_na_case_oregon_stem_trial
    relation_type: CASE_LIMITATION
    object_id: n_reg_na_point_case_oregon_stem_trial_limitation
    domain_id: winemaking
    assertion_text: One lot and small pilots do not establish repeatability across vintages, parcels or scale.
      Confirm condition, consistency and customer response; keep the production comparison distinct from a
      claim of regional origin, superior quality or inevitable whole-cluster flavour.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_case_county_protection_budget_action
    subject_id: n_reg_na_case_county_protection_budget
    relation_type: CASE_ACTION
    object_id: n_reg_na_point_case_county_protection_budget_action
    domain_id: viticulture
    assertion_text: Use technical advice to establish that each cover option suits the block and cultivar, then
      choose or trial a manageable allocation with recorded exposure, installation and spring bud outcomes. Do
      not justify a blanket switch solely from the unmatched neighbouring results.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_case_county_protection_budget_reason
    subject_id: n_reg_na_case_county_protection_budget
    relation_type: CASE_REASON
    object_id: n_reg_na_point_case_county_protection_budget_reason
    domain_id: viticulture
    assertion_text: Traynor illustrates textile and soil insulation for County winter protection. Ontario’s
      guidance makes spring bud stage and unburying relevant to soil-covered vines. Thus cover choice and
      later handling both bear on the stated viable-bud objective; neither regional precedent establishes
      guaranteed survival.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_case_county_protection_budget_tradeoff
    subject_id: n_reg_na_case_county_protection_budget
    relation_type: CASE_TRADEOFF
    object_id: n_reg_na_point_case_county_protection_budget_tradeoff
    domain_id: business
    assertion_text: Textiles require the supplied higher upfront installation/storage spending, while soil cover
      entails annual burial and removal. Compare the actual labour plan and feasible handling burden with
      those quotes; no quantified survival improvement, lower lifetime cost or bottle-price benefit has been
      demonstrated.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_case_county_protection_budget_limitation
    subject_id: n_reg_na_case_county_protection_budget
    relation_type: CASE_LIMITATION
    object_id: n_reg_na_point_case_county_protection_budget_limitation
    domain_id: viticulture
    assertion_text: Different pruning and exposure confound the neighbouring bud-survival results. Evaluate local
      temperature and bud outcomes after comparable management before inferring a method effect; one monitored
      winter still cannot promise protection in every future cold event.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_case_niagara_preplant_drainage_action
    subject_id: n_reg_na_case_niagara_preplant_drainage
    relation_type: CASE_ACTION
    object_id: n_reg_na_point_case_niagara_preplant_drainage_action
    domain_id: viticulture
    assertion_text: Proceed with A only after normal planting checks, or defer B until the incomplete root-zone
      assessment and drainage/funding plan are resolved. Do not plant B this season merely because its bench
      identity and heat records are favourable; those premises do not remove its recorded water problem.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_case_niagara_preplant_drainage_reason
    subject_id: n_reg_na_case_niagara_preplant_drainage
    relation_type: CASE_REASON
    object_id: n_reg_na_point_case_niagara_preplant_drainage_reason
    domain_id: viticulture
    assertion_text: Ontario’s preplant guidance explains that wet soils can reduce root growth, impair cold
      acclimation and be prone to compaction. Those mechanisms make B’s supplied standing-water evidence
      relevant independently of its suitable heat record, whereas the general bench overview does not diagnose
      that individual parcel.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_case_niagara_preplant_drainage_tradeoff
    subject_id: n_reg_na_case_niagara_preplant_drainage
    relation_type: CASE_TRADEOFF
    object_id: n_reg_na_point_case_niagara_preplant_drainage_tradeoff
    domain_id: business
    assertion_text: Deferring B loses the proposed planting opportunity this season but allows investigation and
      funding of work that currently exceeds budget. A offers the supplied assessed route; weigh the actual
      time and investment against the business plan rather than assume a prestigious bench name repays
      installation costs.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
  - id: ki_reg_na_case_niagara_preplant_drainage_limitation
    subject_id: n_reg_na_case_niagara_preplant_drainage
    relation_type: CASE_LIMITATION
    object_id: n_reg_na_point_case_niagara_preplant_drainage_limitation
    domain_id: viticulture
    assertion_text: The root-zone assessment and specialist design are still needed for B. Even properly installed
      drainage does not demonstrate a guaranteed crop, wine aroma or financial return; the supplied regional,
      heat and limestone information cannot substitute for those missing parcel and business observations.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:08:43.579Z"
