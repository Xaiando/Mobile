# Original corrections from the Level 2 named-scope audit.
# Existing Prädikat legal definitions stay in germany.yaml; these points add
# the missing Kabinett context and two storage-fault sensory mechanisms.
knowledge_nodes:
  - { id: n_wset_l2_kabinett_context, node_type: production_principle, name: 'What does Kabinett tell you about grape must weight, and what does it leave unknown?' }
  - { id: n_wset_l2_kabinett_context_point, node_type: learning_point, name: 'Lowest must-weight level within Prädikatswein; finished sweetness needs separate evidence' }
  - { id: n_wset_l2_closure_failure, node_type: production_principle, name: 'How can a failed closure change a wine intended to remain fresh and fruity?' }
  - { id: n_wset_l2_closure_failure_point, node_type: learning_point, name: 'Excess oxygen can fade fruit and develop oxidised aromas' }
  - { id: n_wset_l2_heat_damage, node_type: production_principle, name: 'What sensory deterioration can prolonged hot storage cause?' }
  - { id: n_wset_l2_heat_damage_point, node_type: learning_point, name: 'Fresh fruit can fade, leaving a dull, stale taste' }

