  - { subject_id: n_wset_l2_closure_failure, relation_type: PRINCIPLE_EXPLANATION, object_id: n_wset_l2_closure_failure_point, valid_from: '2026-09-30' }
  - { subject_id: n_wset_l2_heat_damage, relation_type: PRINCIPLE_EXPLANATION, object_id: n_wset_l2_heat_damage_point, valid_from: '2026-09-30' }

knowledge_items:
  - id: ki_wset_l2_kabinett_must_weight
    subject_id: n_wset_l2_kabinett_context
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_l2_kabinett_context_point
    domain_id: viticulture
    assertion_text: >-
      Kabinett occupies the lowest must-weight level within Prädikatswein.
      That harvest classification alone does not establish the finished wine's
      sweetness; check a sweetness indication or product information separately.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: '2026-09-30T00:20:00.000Z'
  - id: ki_wset_l2_closure_failure_sensory
    subject_id: n_wset_l2_closure_failure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_l2_closure_failure_point
    domain_id: service
    assertion_text: >-
      A failed closure can admit excess oxygen. In a wine intended to remain
      fresh and fruity, oxidation can fade fruit, darken colour and develop
      bruised-apple or nut aromas; these observations alone do not prove the cause.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: '2026-09-30T00:20:00.000Z'
  - id: ki_wset_l2_heat_damage_sensory
    subject_id: n_wset_l2_heat_damage
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_l2_heat_damage_point
    domain_id: service
    assertion_text: >-
      Prolonged hot storage or transport can reduce fresh-fruit character and
      leave a dull, stale taste. This is a possible heat-damage effect, not a
      diagnosis established by one aroma or by the bottle's current temperature.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: '2026-09-30T00:20:00.000Z'

