knowledge_items:
  - id: ki_reason_water_co2_entry
    subject_id: n_reason_water_premise
    relation_type: CAUSES_STATE
    object_id: n_reason_water_co2_entry
    domain_id: viticulture
    assertion_text: Under the supplied closing-stomata response, restricted gas exchange reduces stomatal CO₂
      entry; open stomata normally admit CO₂ for photosynthesis.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T12:22:12.000Z"
  - id: ki_reason_water_assimilation
    subject_id: n_reason_water_co2_entry
    relation_type: LEADS_TO
    object_id: n_reason_water_assimilation
    domain_id: viticulture
    assertion_text: Reduced stomatal CO₂ supply limits photosynthetic carbon assimilation in this controlled
      comparison; the premise does not establish a universal response magnitude.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T12:22:12.000Z"
  - id: ki_reason_water_contra_more_co2
    subject_id: n_reason_water_premise
    relation_type: CONTRADICTS
    object_id: n_reason_water_wrong_more_co2
    domain_id: viticulture
    assertion_text: Closing stomata restrict the CO₂ entry route, contradicting increased stomatal CO₂ supply
      under these conditions.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T12:22:12.000Z"
  - id: ki_reason_water_contra_more_assimilation
    subject_id: n_reason_water_premise
    relation_type: CONTRADICTS
    object_id: n_reason_water_wrong_more_assimilation
    domain_id: viticulture
    assertion_text: A closure that limits CO₂ entry does not increase photosynthesis through that route; the
      guide identifies inhibition of photosynthesis when water supply fails to meet demand.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T12:22:12.000Z"
  - id: ki_reason_water_contra_more_cooling
    subject_id: n_reason_water_premise
    relation_type: CONTRADICTS
    object_id: n_reason_water_wrong_more_cooling
    domain_id: viticulture
    assertion_text: Stomatal closure restricts water-vapour loss; severe water limitation can reduce the
      leaf’s capacity for transpiration cooling, rather than enhance it.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T12:22:12.000Z"
  - id: ki_reason_bloom_carbohydrate
    subject_id: n_reason_bloom_premise
    relation_type: CAUSES_STATE
    object_id: n_reason_bloom_carbohydrate
    domain_id: viticulture
    assertion_text: Removing active basal source leaves around bloom can restrict carbohydrate supply to
      inflorescences; the supplied scenario rules out compensation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T12:22:12.000Z"
  - id: ki_reason_bloom_set
    subject_id: n_reason_bloom_carbohydrate
    relation_type: LEADS_TO
    object_id: n_reason_bloom_set
    domain_id: viticulture
    assertion_text: A shortage of carbohydrate resources during flowering can reduce the proportion of
      flowers that develop into berries; weather and cultivar also influence this response.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T12:22:12.000Z"
  - id: ki_reason_bloom_berries
    subject_id: n_reason_bloom_set
    relation_type: LEADS_TO
    object_id: n_reason_bloom_berries
    domain_id: viticulture
    assertion_text: Under this fruit-set mechanism, fewer flowers develop into berries, so fewer berries per
      cluster are expected; no exact yield reduction is predicted.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T12:22:12.000Z"
  - id: ki_reason_bloom_contra_more_carbohydrate
    subject_id: n_reason_bloom_premise
    relation_type: CONTRADICTS
    object_id: n_reason_bloom_wrong_more_carbohydrate
    domain_id: viticulture
    assertion_text: Around bloom, active basal leaves supply carbohydrates. Removing them without replacement
      reduces that source, contradicting increased supply from the removal itself.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T12:22:12.000Z"
  - id: ki_reason_bloom_contra_more_set
    subject_id: n_reason_bloom_premise
    relation_type: CONTRADICTS
    object_id: n_reason_bloom_wrong_more_set
    domain_id: viticulture
    assertion_text: The cited carbohydrate-limitation mechanism reduces fruit set; it does not increase set
      by depriving inflorescences of that supply.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T12:22:12.000Z"
  - id: ki_reason_bloom_contra_cluster_thinning
    subject_id: n_reason_bloom_premise
    relation_type: CONTRADICTS
    object_id: n_reason_bloom_wrong_cluster_thinning
    domain_id: viticulture
    assertion_text: Early leaf removal can reduce cluster weight through fewer or smaller berries. Removing
      whole clusters is the separate mechanism of cluster thinning and is excluded by this premise.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T12:22:12.000Z"
  - id: ki_reason_mlf_conversion
    subject_id: n_reason_mlf_premise
    relation_type: CAUSES_STATE
    object_id: n_reason_mlf_conversion
    domain_id: winemaking
    assertion_text: Successful malolactic conversion decreases malic acid and produces lactic acid; the
      supplied scenario isolates this reaction from other acid changes.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T12:22:12.000Z"
  - id: ki_reason_mlf_acidity
    subject_id: n_reason_mlf_conversion
    relation_type: LEADS_TO
    object_id: n_reason_mlf_acidity
    domain_id: winemaking
    assertion_text: Lactic acid contributes less titratable acidity than the malic acid it replaces, so the
      isolated conversion lowers TA; whole-wine changes need not follow a fixed numerical prediction.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T12:22:12.000Z"
  - id: ki_reason_mlf_contra_more_malic
    subject_id: n_reason_mlf_premise
    relation_type: CONTRADICTS
    object_id: n_reason_mlf_wrong_more_malic
    domain_id: winemaking
    assertion_text: MLF consumes malic acid; monitoring follows declining malic acid, contradicting increased
      malate caused by this conversion.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T12:22:12.000Z"
  - id: ki_reason_mlf_contra_no_lactic
    subject_id: n_reason_mlf_premise
    relation_type: CONTRADICTS
    object_id: n_reason_mlf_wrong_no_lactic
    domain_id: winemaking
    assertion_text: The stated malolactic reaction converts L-malic acid to L-lactic acid, contradicting the
      claim that it forms no lactate.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T12:22:12.000Z"
  - id: ki_reason_mlf_contra_more_acidity
    subject_id: n_reason_mlf_premise
    relation_type: CONTRADICTS
    object_id: n_reason_mlf_wrong_more_acidity
    domain_id: winemaking
    assertion_text: The replacement acid contributes less TA than the malic acid it replaces; an increase in
      TA from this isolated replacement contradicts that mechanism.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T12:22:12.000Z"
  - id: ki_reason_so2_molecular
    subject_id: n_reason_so2_premise
    relation_type: CAUSES_STATE
    object_id: n_reason_so2_molecular
    domain_id: winemaking
    assertion_text: At the same free SO₂, alcohol and temperature, higher pH shifts the equilibrium towards a
      lower molecular SO₂ concentration.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T12:22:12.000Z"
  - id: ki_reason_so2_protection
    subject_id: n_reason_so2_molecular
    relation_type: LEADS_TO
    object_id: n_reason_so2_protection
    domain_id: winemaking
    assertion_text: A lower molecular SO₂ concentration weakens the antimicrobial contribution of that SO₂;
      equal free SO₂ alone does not establish equal protection at different pH values.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T12:22:12.000Z"
  - id: ki_reason_so2_contra_more_molecular
    subject_id: n_reason_so2_premise
    relation_type: CONTRADICTS
    object_id: n_reason_so2_wrong_more_molecular
    domain_id: winemaking
    assertion_text: With free SO₂, alcohol and temperature fixed, molecular SO₂ is less abundant at higher
      pH, contradicting an increase from pH alone.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T12:22:12.000Z"
  - id: ki_reason_so2_contra_ph_independent
    subject_id: n_reason_so2_premise
    relation_type: CONTRADICTS
    object_id: n_reason_so2_wrong_ph_independent
    domain_id: winemaking
    assertion_text: The molecular-to-bisulfite equilibrium depends on pH, contradicting a pH-independent
      molecular fraction within these wine conditions.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T12:22:12.000Z"
  - id: ki_reason_so2_contra_less_free
    subject_id: n_reason_so2_premise
    relation_type: CONTRADICTS
    object_id: n_reason_so2_wrong_less_free
    domain_id: winemaking
    assertion_text: For equivalent SO₂ antimicrobial protection, a higher-pH wine requires more free SO₂, all
      else equal; requiring less contradicts the pH mechanism.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T12:22:12.000Z"
