# Small original Diploma causal-reasoning starter; all points await qualified review.
# Hypothetical premises isolate the stated mechanism; they are not claimed source observations.
# MCQ disabled: generic relation distractors cannot resolve these conditional causal claims;
# the reasoning format instead uses three explicit cited contradictions for each target.
node_types:
  - id: causal_premise
    label: conditional premise
  - id: causal_state
    label: causal state
relation_types:
  - id: CAUSES_STATE
    label: produces the conditional state
    reverse_label: is produced under the premise
    cardinality: many
    default_domain_id: winemaking
  - id: LEADS_TO
    label: supports the downstream state
    reverse_label: follows from the causal state
    cardinality: many
    default_domain_id: winemaking
  - id: CONTRADICTS
    label: contradicts the proposed conclusion
    reverse_label: is contradicted by the premise
    cardinality: many
    default_domain_id: winemaking
relation_type_signatures:
  - relation_type: CAUSES_STATE
    subject_node_type: causal_premise
    object_node_type: causal_state
  - relation_type: LEADS_TO
    subject_node_type: causal_state
    object_node_type: causal_state
  - relation_type: CONTRADICTS
    subject_node_type: causal_premise
    object_node_type: causal_state
knowledge_nodes:
  - id: n_reason_water_premise
    node_type: causal_premise
    name: A grapevine block has a sustained water deficit relative to evaporative demand. Measurements show
      that its stomata are closing sufficiently to restrict CO₂ entry. Compare it with adequately watered
      vines of the same cultivar under the same light, atmospheric CO₂ and controlled leaf temperature;
      leaves are otherwise healthy. Consider the stomatal route, without assuming that every cultivar
      responds identically.
  - id: n_reason_water_co2_entry
    node_type: causal_state
    name: Less CO₂ enters the leaves through stomata
  - id: n_reason_water_assimilation
    node_type: causal_state
    name: Reduced photosynthetic carbon assimilation through stomatal limitation
  - id: n_reason_water_wrong_more_co2
    node_type: causal_state
    name: Greater CO₂ entry through the closing stomata
  - id: n_reason_water_wrong_more_assimilation
    node_type: causal_state
    name: Increased carbon assimilation because the stomata close
  - id: n_reason_water_wrong_more_cooling
    node_type: causal_state
    name: Greater capacity for cooling by transpiration through the closing stomata
  - id: n_reason_bloom_premise
    node_type: causal_premise
    name: In a carbohydrate-sensitive wine-grape block, photosynthetically active basal leaves are removed
      just before bloom. These leaves were an important carbohydrate source for the inflorescences, and
      their supply is not compensated by other leaves or stored reserves during the comparison. Cultivar
      and flowering weather are matched to an untreated control, and no whole clusters are removed. Trace
      the carbohydrate-limitation mechanism, rather than assuming the treatment has the same effect in
      every block.
  - id: n_reason_bloom_carbohydrate
    node_type: causal_state
    name: Reduced carbohydrate supply to the inflorescences
  - id: n_reason_bloom_set
    node_type: causal_state
    name: Reduced fruit set through carbohydrate limitation
  - id: n_reason_bloom_berries
    node_type: causal_state
    name: Fewer berries per cluster through reduced fruit set
  - id: n_reason_bloom_wrong_more_carbohydrate
    node_type: causal_state
    name: Greater carbohydrate supply from removing the active basal leaves
  - id: n_reason_bloom_wrong_more_set
    node_type: causal_state
    name: Increased fruit set because carbohydrate supply is restricted
  - id: n_reason_bloom_wrong_cluster_thinning
    node_type: causal_state
    name: Reduced crop by removing whole clusters rather than reducing berries per cluster
  - id: n_reason_mlf_premise
    node_type: causal_premise
    name: "A dry wine containing L-malic acid undergoes successful malolactic conversion. For this
      comparison, isolate the conversion of L-malic acid to L-lactic acid: no acid addition, blending,
      sugar-derived acid production, dilution or tartrate precipitation changes the acidity. Compare
      before and after this conversion, without assuming a buttery aroma or complete microbiological
      stability."
  - id: n_reason_mlf_conversion
    node_type: causal_state
    name: L-malic acid is converted to L-lactic acid
  - id: n_reason_mlf_acidity
    node_type: causal_state
    name: Lower titratable acidity from the isolated malic-to-lactic conversion
  - id: n_reason_mlf_wrong_more_malic
    node_type: causal_state
    name: Increased L-malic acid caused by successful malolactic conversion
  - id: n_reason_mlf_wrong_no_lactic
    node_type: causal_state
    name: No L-lactic acid formation during the malic-acid conversion
  - id: n_reason_mlf_wrong_more_acidity
    node_type: causal_state
    name: Higher titratable acidity from replacing malic acid with lactic acid
  - id: n_reason_so2_premise
    node_type: causal_premise
    name: Two otherwise comparable wines have the same accurately measured free SO₂ concentration, alcohol
      and temperature, but wine B has a higher pH within the normal wine-pH range. Compare only the
      molecular-SO₂ contribution to antimicrobial protection; microbial strain, population and all other
      barriers are held constant. Do not infer a universal killing threshold or an oxidation result.
  - id: n_reason_so2_molecular
    node_type: causal_state
    name: Lower molecular SO₂ concentration in the higher-pH wine
  - id: n_reason_so2_protection
    node_type: causal_state
    name: Weaker molecular-SO₂ antimicrobial protection at the same free SO₂
  - id: n_reason_so2_wrong_more_molecular
    node_type: causal_state
    name: Greater molecular SO₂ concentration in the higher-pH wine
  - id: n_reason_so2_wrong_ph_independent
    node_type: causal_state
    name: A molecular SO₂ fraction independent of wine pH
  - id: n_reason_so2_wrong_less_free
    node_type: causal_state
    name: Less free SO₂ needed at higher pH for equivalent antimicrobial protection
