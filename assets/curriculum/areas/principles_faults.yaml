knowledge_items:
  - id: ki_fault_oxidative_style
    subject_id: n_fault_principle_oxidative_style
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_oxidative_style
    domain_id: tasting
    assertion_text: Oxidative character may suit an intentionally oxidative style, whereas loss of freshness can
      be unwanted in a fresh table wine. The style supplies the context.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_oxidative_aroma
    subject_id: n_fault_principle_oxidative_aroma
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_oxidative_aroma
    domain_id: tasting
    assertion_text: Excess oxidation can reduce fruit expression, deepen colour and produce aldehydic aromas; no
      single colour or aroma proves the full production history.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_chemical_oxidation
    subject_id: n_fault_principle_chemical_oxidation
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_chemical_oxidation
    domain_id: winemaking
    assertion_text: Phenolic oxidation can generate hydrogen peroxide, which can then oxidise ethanol to
      acetaldehyde. This pathway differs from enzyme-mediated browning in grape must.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_enzymatic_browning
    subject_id: n_fault_principle_enzymatic_browning
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_enzymatic_browning
    domain_id: winemaking
    assertion_text: Crushing releases grape polyphenol oxidase, which catalyses oxidation of susceptible
      phenolic substrates in must. Browning depends on composition and handling.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_h2s_descriptor
    subject_id: n_fault_principle_h2s_descriptor
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_h2s_descriptor
    domain_id: tasting
    assertion_text: Hydrogen sulfide commonly evokes rotten egg. A descriptor is a sensory clue, and
      confirmation of compounds or treatment suitability needs further assessment.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_sulfur_stress
    subject_id: n_fault_principle_sulfur_stress
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_sulfur_stress
    domain_id: winemaking
    assertion_text: Yeast strain, sulfur residues and several nutritional or compositional stresses can affect
      hydrogen-sulfide production; nitrogen deficiency is one possible contributor.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_mercaptans
    subject_id: n_fault_principle_mercaptans
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_mercaptans
    domain_id: winemaking
    assertion_text: Mercaptans are thiols containing an SH group. Some volatile thiols contribute unwanted
      sulfur characters, while others support desirable fruit aromas.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_aeration_risk
    subject_id: n_fault_principle_aeration_risk
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_aeration_risk
    domain_id: winemaking
    assertion_text: Aeration can oxidise some unwanted thiols into disulfides that do not directly respond to
      copper fining; aeration is therefore not a universal remedy.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_copper_carryover
    subject_id: n_fault_principle_copper_carryover
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_copper_carryover
    domain_id: winemaking
    assertion_text: Some copper-sulfur species can remain dissolved after treatment and filtration. The older
      assumption of complete precipitation and removal is unreliable.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_late_copper
    subject_id: n_fault_principle_late_copper
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_late_copper
    domain_id: winemaking
    assertion_text: Late copper additions can increase haze and later reductive-aroma risk. Existing copper and
      treatment response should be assessed before a bulk addition.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_brett_organism
    subject_id: n_fault_principle_brett_organism
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_brett_organism
    domain_id: winemaking
    assertion_text: Brettanomyces is a yeast capable of producing spoilage-associated volatile phenols in wine.
      Its presence and its sensory effects are related but distinct observations.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_brett_ep
    subject_id: n_fault_principle_brett_ep
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_brett_ep
    domain_id: tasting
    assertion_text: 4-ethylphenol is commonly associated with medicinal or sticking-plaster character. Such a
      description alone does not identify live Brettanomyces in the sample.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_brett_eg
    subject_id: n_fault_principle_brett_eg
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_brett_eg
    domain_id: tasting
    assertion_text: 4-ethylguaiacol can contribute smoky or spicy notes. Interactions with other compounds
      affect the overall impression, and oak can give similar descriptors.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_brett_masking
    subject_id: n_fault_principle_brett_masking
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_brett_masking
    domain_id: tasting
    assertion_text: Other wine components can mask or accentuate Brett-associated phenols; a concentration is
      not a universal sensory or rejection threshold.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_brett_misdiagnosis
    subject_id: n_fault_principle_brett_misdiagnosis
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_brett_misdiagnosis
    domain_id: tasting
    assertion_text: Sulfur characters, reduced fruit from oxidation and smoke taint may be confused with Brett
      character. Targeted assessment avoids assuming that savouriness establishes one cause.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_brett_cells_phenols
    subject_id: n_fault_principle_brett_cells_phenols
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_brett_cells_phenols
    domain_id: winemaking
    assertion_text: Appropriate filtration targets yeast cells, whereas removal of dissolved Brett-associated
      volatiles needs a different treatment strategy. Stopping growth does not erase past sensory effects.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_va_acid
    subject_id: n_fault_principle_va_acid
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_va_acid
    domain_id: winemaking
    assertion_text: Acetic acid is the principal contributor to volatile acidity. Small amounts arise in normal
      fermentation, so its mere presence does not establish a faulty wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_ethyl_acetate
    subject_id: n_fault_principle_ethyl_acetate
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_ethyl_acetate
    domain_id: tasting
    assertion_text: Ethyl acetate is an ester associated with solvent-like character at elevated concentration;
      lower amounts can contribute fruit character. It differs chemically from acetic acid.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_acetic_bacteria
    subject_id: n_fault_principle_acetic_bacteria
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_acetic_bacteria
    domain_id: winemaking
    assertion_text: Acetic acid bacteria can convert ethanol into acetic acid when oxygen is available. Exposed
      stored wine is therefore at increased risk.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_va_analysis
    subject_id: n_fault_principle_va_analysis
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_va_analysis
    domain_id: tasting
    assertion_text: A standard volatile-acidity result measures volatile acids, whereas ethyl acetate is an
      ester. Its aroma can dominate the impression without being the same analytical measurement.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_tca_compound
    subject_id: n_fault_principle_tca_compound
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_tca_compound
    domain_id: tasting
    assertion_text: TCA is a major contributor to musty cork-type taint. A musty observation requires assessment
      because other compounds can give similar sensory descriptions.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_tca_non_cork
    subject_id: n_fault_principle_tca_non_cork
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_tca_non_cork
    domain_id: winemaking
    assertion_text: TCA-contaminated barrels or other oak products can taint wine before bottling; a non-cork
      closure therefore does not rule out TCA.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_musty_alternatives
    subject_id: n_fault_principle_musty_alternatives
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_musty_alternatives
    domain_id: tasting
    assertion_text: Geosmin, methylisoborneol and other compounds may give earthy or musty impressions. Sensory
      similarity does not prove that a sample contains TCA.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_tca_fruit
    subject_id: n_fault_principle_tca_fruit
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_tca_fruit
    domain_id: tasting
    assertion_text: TCA can suppress desirable fruit character, so a subdued wine can require closer comparison
      even when mustiness is not obvious.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_light_reaction
    subject_id: n_fault_principle_light_reaction
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_light_reaction
    domain_id: winemaking
    assertion_text: Light can activate riboflavin, enabling reactions involving sulfur-containing amino acids
      and formation of unwanted volatile sulfur compounds.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_glass_protection
    subject_id: n_fault_principle_glass_protection
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_glass_protection
    domain_id: service
    assertion_text: Clear glass can transmit more damaging wavelengths than protective coloured glass.
      Protection also depends on glass composition, thickness and the actual lighting.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_light_intensity
    subject_id: n_fault_principle_light_intensity
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_light_intensity
    domain_id: service
    assertion_text: Both spectral output and intensity influence lightstrike risk; lighting names alone do not
      define a universal safe exposure time.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_heat_seal
    subject_id: n_fault_principle_heat_seal
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_heat_seal
    domain_id: service
    assertion_text: Heat can expand wine and move a closure or cause leakage, but those physical signs alone do
      not prove that flavour quality has deteriorated.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_heat_comparison
    subject_id: n_fault_principle_heat_comparison
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_heat_comparison
    domain_id: service
    assertion_text: Comparing suspect stock with the same wine retained under known conditions strengthens
      chemical, physical and sensory evaluation of possible heat damage.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_refermentation
    subject_id: n_fault_principle_refermentation
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_refermentation
    domain_id: winemaking
    assertion_text: Viable fermentative yeast can grow where sufficient fermentable sugar remains, leading to
      unwanted fermentation in package. Sugar alone does not prove active spoilage.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_packaging_inputs
    subject_id: n_fault_principle_packaging_inputs
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_packaging_inputs
    domain_id: winemaking
    assertion_text: Packaging audits assess wine, rinse water, dry goods and internal contact surfaces because
      contamination can enter through several routes after wine treatment.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_packaging_biofilms
    subject_id: n_fault_principle_packaging_biofilms
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_packaging_biofilms
    domain_id: winemaking
    assertion_text: Valves, seals, filler heads and other difficult contact points can harbour contamination
      after final filtration. Filter performance does not replace line hygiene.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_haze_diagnosis
    subject_id: n_fault_principle_haze_diagnosis
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_haze_diagnosis
    domain_id: winemaking
    assertion_text: A haze may contain viable microorganisms as well as other material; its composition should
      be investigated before microbial risk is dismissed.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_mousy_delay
    subject_id: n_fault_principle_mousy_delay
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_mousy_delay
    domain_id: tasting
    assertion_text: Mousy character can emerge late after tasting and persist; a quick sniff alone can miss it,
      and perception timing differs between tasters.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_mousy_ph
    subject_id: n_fault_principle_mousy_ph
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_mousy_ph
    domain_id: tasting
    assertion_text: The responsible compounds are less aroma-active at wine pH; increased pH in the mouth can
      reveal retronasal character during or after tasting.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_mousy_sensitivity
    subject_id: n_fault_principle_mousy_sensitivity
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_mousy_sensitivity
    domain_id: tasting
    assertion_text: Sensitivity to mousiness varies substantially. Assessment by a taster known to perceive it
      can help when the first assessor is insensitive.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_threshold_limits
    subject_id: n_fault_principle_threshold_limits
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_threshold_limits
    domain_id: tasting
    assertion_text: A detection threshold describes a particular test, wine matrix and group of assessors;
      individuals and interacting compounds may produce different responses.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_threshold_rejection
    subject_id: n_fault_principle_threshold_rejection
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_fault_point_threshold_rejection
    domain_id: tasting
    assertion_text: Detection asks whether a difference can be perceived; rejection concerns acceptability. TCA
      research reports separate detection and rejection measures rather than one universal fault boundary.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_case_sulfur_before_bottling_action
    subject_id: n_fault_case_sulfur_before_bottling
    relation_type: CASE_ACTION
    object_id: n_fault_point_case_sulfur_before_bottling_action
    domain_id: winemaking
    assertion_text: Characterise the sulfur problem, measure current copper and run controlled laboratory trials
      before choosing any bulk treatment; allow time to reassess stability before packaging.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_case_sulfur_before_bottling_reason
    subject_id: n_fault_case_sulfur_before_bottling
    relation_type: CASE_REASON
    object_id: n_fault_point_case_sulfur_before_bottling_reason
    domain_id: winemaking
    assertion_text: Sulfhydryls can respond to copper, whereas disulfides do not directly do so. Diagnosis helps
      avoid a treatment that does not address the compounds present.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_case_sulfur_before_bottling_tradeoff
    subject_id: n_fault_case_sulfur_before_bottling
    relation_type: CASE_TRADEOFF
    object_id: n_fault_point_case_sulfur_before_bottling_tradeoff
    domain_id: winemaking
    assertion_text: A copper-based treatment can diminish desirable fruity thiol or flinty expression, so
      improvement of an unwanted aroma should be weighed against the intended wine style.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_case_sulfur_before_bottling_limitation
    subject_id: n_fault_case_sulfur_before_bottling
    relation_type: CASE_LIMITATION
    object_id: n_fault_point_case_sulfur_before_bottling_limitation
    domain_id: winemaking
    assertion_text: "A good immediate aroma response does not establish later stability: dissolved copper
      species can remain, and excess or late copper can increase haze or later sulfur-aroma risk."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_case_brett_rising_action
    subject_id: n_fault_case_brett_rising
    relation_type: CASE_ACTION
    object_id: n_fault_point_case_brett_rising_action
    domain_id: winemaking
    assertion_text: Assess sanitation, sugar, pH and sulfur dioxide together, and consider appropriate
      cell-removing filtration. Separately assess whether the existing volatile-phenol effect is acceptable
      or warrants a trial.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_case_brett_rising_reason
    subject_id: n_fault_case_brett_rising
    relation_type: CASE_REASON
    object_id: n_fault_point_case_brett_rising_reason
    domain_id: winemaking
    assertion_text: Viable Brett cells can produce further volatile phenols, including after packaging.
      Controlling viable cells addresses future formation rather than simply masking current aroma.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_case_brett_rising_tradeoff
    subject_id: n_fault_case_brett_rising
    relation_type: CASE_TRADEOFF
    object_id: n_fault_point_case_brett_rising_tradeoff
    domain_id: winemaking
    assertion_text: If reverse-osmosis remediation is trialled for existing phenols, positive volatiles may also
      be reduced. Comparative sensory checks are needed as treatment proceeds.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_case_brett_rising_limitation
    subject_id: n_fault_case_brett_rising
    relation_type: CASE_LIMITATION
    object_id: n_fault_point_case_brett_rising_limitation
    domain_id: winemaking
    assertion_text: Removal or inhibition of cells does not establish that already formed phenols are gone;
      their sensory effect depends on the wine matrix and must be assessed separately.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_case_lit_display_action
    subject_id: n_fault_case_lit_display
    relation_type: CASE_ACTION
    object_id: n_fault_point_case_lit_display_action
    domain_id: service
    assertion_text: Move sale stock to protected storage and use a display arrangement that limits relevant
      light reaching wine, such as protected bottles or non-sale display examples.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_case_lit_display_reason
    subject_id: n_fault_case_lit_display
    relation_type: CASE_REASON
    object_id: n_fault_point_case_lit_display_reason
    domain_id: service
    assertion_text: Light-activated riboflavin can promote reactions of sulfur-containing amino acids, producing
      volatile sulfur compounds associated with lightstruck aroma.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_case_lit_display_tradeoff
    subject_id: n_fault_case_lit_display
    relation_type: CASE_TRADEOFF
    object_id: n_fault_point_case_lit_display_tradeoff
    domain_id: service
    assertion_text: Clear bottles and illuminated displays support visual presentation but transmit relevant
      light; protective glass or shielding changes that display choice.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_case_lit_display_limitation
    subject_id: n_fault_case_lit_display
    relation_type: CASE_LIMITATION
    object_id: n_fault_point_case_lit_display_limitation
    domain_id: service
    assertion_text: Cabbage-like descriptors can arise from several sulfur compounds. Compare affected and
      protected stock and exposure history before attributing the observation solely to lightstrike.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_case_hot_delivery_action
    subject_id: n_fault_case_hot_delivery
    relation_type: CASE_ACTION
    object_id: n_fault_point_case_hot_delivery_action
    domain_id: service
    assertion_text: Assess suspect stock against same-lot holdbacks using physical, sensory and appropriate
      chemical checks, recording exposure and bottle differences before deciding disposition.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_case_hot_delivery_reason
    subject_id: n_fault_case_hot_delivery
    relation_type: CASE_REASON
    object_id: n_fault_point_case_hot_delivery_reason
    domain_id: service
    assertion_text: Elevated temperature can accelerate undesirable wine development and cause thermal expansion
      that stresses closures; both liquid quality and package condition need assessment.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_case_hot_delivery_tradeoff
    subject_id: n_fault_case_hot_delivery
    relation_type: CASE_TRADEOFF
    object_id: n_fault_point_case_hot_delivery_tradeoff
    domain_id: service
    assertion_text: A documented comparison uses stock, testing effort and time while its outcome is uncertain;
      a smaller hurried check offers less evidence for the disposition decision.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_case_hot_delivery_limitation
    subject_id: n_fault_case_hot_delivery
    relation_type: CASE_LIMITATION
    object_id: n_fault_point_case_hot_delivery_limitation
    domain_id: service
    assertion_text: Leakage or cork movement is evidence of package stress, not conclusive sensory damage.
      Effects depend on exposure, wine and bottle, so one observation cannot settle the lot.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_case_sporadic_sweet_spoilage_action
    subject_id: n_fault_case_sporadic_sweet_spoilage
    relation_type: CASE_ACTION
    object_id: n_fault_point_case_sporadic_sweet_spoilage_action
    domain_id: winemaking
    assertion_text: Assess affected and unaffected bottles for viable microbes, review final-filter integrity,
      and investigate inputs, filler heads, seals and sanitation across the packaging path.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_case_sporadic_sweet_spoilage_reason
    subject_id: n_fault_case_sporadic_sweet_spoilage
    relation_type: CASE_REASON
    object_id: n_fault_point_case_sporadic_sweet_spoilage_reason
    domain_id: winemaking
    assertion_text: Residual fermentable sugar can support unwanted fermentation when viable yeast is present;
      microbial contamination may enter after the final filter, so that filter is not the only possible
      source.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_case_sporadic_sweet_spoilage_tradeoff
    subject_id: n_fault_case_sporadic_sweet_spoilage
    relation_type: CASE_TRADEOFF
    object_id: n_fault_point_case_sporadic_sweet_spoilage_tradeoff
    domain_id: winemaking
    assertion_text: Sampling and auditing multiple contact points use time and resources, but a narrow
      investigation may miss contamination routes and allow the problem to recur.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
  - id: ki_fault_case_sporadic_sweet_spoilage_limitation
    subject_id: n_fault_case_sporadic_sweet_spoilage
    relation_type: CASE_LIMITATION
    object_id: n_fault_point_case_sporadic_sweet_spoilage_limitation
    domain_id: winemaking
    assertion_text: Spoilage can be sporadic. A few apparently clear bottles or a satisfactory filter result do
      not establish that every bottle remained free of viable contaminating organisms.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T23:28:43.000Z
