knowledge_items:
  - id: ki_reg_gr_naoussa_seasons
    subject_id: n_reg_gr_principle_naoussa_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_gr_point_naoussa_seasons
    domain_id: geography
    assertion_text: Naoussa has a temperate Mediterranean climate with continental influences, including cold
      winters and relatively hot summers. This differs from assuming that every Greek vineyard has mild
      coastal conditions; weather and ripening records remain necessary for the actual Xinomavro vintage.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_naoussa_variation
    subject_id: n_reg_gr_principle_naoussa_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_gr_point_naoussa_variation
    domain_id: geography
    assertion_text: Naoussa’s vineyards on Mount Vermio slopes differ in elevation, orientation and soil,
      sometimes within one vineyard. These physical differences make parcel-level comparisons useful;
      neither a Naoussa label nor a soil name establishes uniform ripening, a mineral flavour or superior
      quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_xinomavro_structure
    subject_id: n_reg_gr_principle_naoussa_styles
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_gr_point_xinomavro_structure
    domain_id: winemaking
    assertion_text: Xinomavro can produce relatively pale red wines with firm tannins and bright acidity.
      Colour depth alone therefore cannot measure structure or quality. Tasting the actual wine and
      checking extraction and maturation provide better evidence than predicting softness from a pale
      appearance.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_naoussa_style_choices
    subject_id: n_reg_gr_principle_naoussa_styles
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_gr_point_naoussa_style_choices
    domain_id: winemaking
    assertion_text: The regional profile contrasts longer-macerated, wood-matured Naoussa wines that can be
      austere when young with more fruit-driven expressions that may be approachable earlier. This is a
      qualified style comparison, not a rule that every traditional wine is harsh or every modern wine is
      better; maturity, site and cellar details matter.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_amyndeon_lakes
    subject_id: n_reg_gr_principle_amyndeon_context
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_gr_point_amyndeon_lakes
    domain_id: geography
    assertion_text: Amyndeon’s elevated plateau has an inland, partly continental climate, while nearby lakes
      modify the local growing environment. Elevation and water bodies jointly matter when comparing it
      with lower Naoussa slopes; a northern origin alone cannot identify one temperature pattern or
      guarantee ripe fruit.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_north_soil_textures
    subject_id: n_reg_gr_principle_amyndeon_context
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_gr_point_north_soil_textures
    domain_id: geography
    assertion_text: The GiESCO comparison describes generally sandy-loamy Amyndeon soils and heavier-textured
      Naoussa soils, alongside different climate and elevation. This identifies variables to investigate
      for rooting and water supply, not a controlled proof that soil texture alone determines wine
      flavour or an invariant regional style.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_xinomavro_late_weather
    subject_id: n_reg_gr_principle_northern_harvest
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_gr_point_xinomavro_late_weather
    domain_id: viticulture
    assertion_text: The Imathia profile describes late-ripening Xinomavro as vulnerable in cold, rainy years,
      with a more pronounced tannic character. Waiting may support maturity but also extends weather
      exposure; calendar habit alone cannot replace fruit-condition measurements and a vintage-specific
      harvest decision.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_amyndeon_2022_selection
    subject_id: n_reg_gr_principle_northern_harvest
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_gr_point_amyndeon_2022_selection
    domain_id: viticulture
    assertion_text: In its 2022 Amyndeon report, Kir-Yianni describes hail, later rain and a restricted
      harvest window, then prioritizing mature parcels and those at greater damage risk. This dated
      producer example illustrates selective scheduling rather than a universal Amyndeon recipe or a
      claim that cooler conditions prevent disease and weather damage.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_nemea_altitude
    subject_id: n_reg_gr_principle_nemea_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_gr_point_nemea_altitude
    domain_id: geography
    assertion_text: Nemea includes lower and higher vineyards with varied soils and orientation. The regional
      profile describes differences in ripening timing and fruit characteristics across this elevation
      range. These are comparison variables, not an official three-tier quality hierarchy or a rule that
      the highest vineyards produce the best reds.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_nemea_inland_nights
    subject_id: n_reg_gr_principle_nemea_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_gr_point_nemea_inland_nights
    domain_id: geography
    assertion_text: The national terroir account places the Nemea uplands among inland sites with continental
      climatic features and marked day–night temperature variation. Higher elevation and distance from
      large water bodies qualify a simple warm-coastal model; actual temperatures, exposure and vintage
      still determine the fruit’s ripening context.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_agiorgitiko_young
    subject_id: n_reg_gr_principle_nemea_styles
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_gr_point_agiorgitiko_young
    domain_id: winemaking
    assertion_text: Agiorgitiko’s young dry-red expression can combine fresh red-fruit aromas, moderate
      acidity and soft tannins. This provides a plausible brief for an approachable Nemea red, while more
      structured expressions also exist. A consumer preference for youthful fruit does not prove inferior
      quality or exclude ageworthy wines.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_nemea_extraction_oak
    subject_id: n_reg_gr_principle_nemea_styles
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_gr_point_nemea_extraction_oak
    domain_id: winemaking
    assertion_text: GAIA describes extended post-fermentation maceration and maturation in new French oak for
      its Nemea Estate wine. This producer example shows how extraction and wood choices can pursue a
      structured, oak-influenced expression. Its recipe is not required for all Nemea, and neither more
      extraction nor new oak guarantees balance or a justified premium.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_mantinia_cool_ripening
    subject_id: n_reg_gr_principle_mantinia_white
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_gr_point_mantinia_cool_ripening
    domain_id: viticulture
    assertion_text: Mantinia’s elevated plateau has Mediterranean conditions with continental influences.
      Cooler temperatures support slower ripening and later harvest, while spring hail and frost remain
      risks. This provides a different white-grape context from hot dry island sites; exact harvest
      timing and freshness depend on parcel and season.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_moschofilero_white
    subject_id: n_reg_gr_principle_mantinia_white
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_gr_point_moschofilero_white
    domain_id: winemaking
    assertion_text: Moschofilero has reddish-to-greyish berries yet is widely used for aromatic dry whites,
      including Mantinia. Rose-petal, citrus and green-fruit aromas can accompany a light palate and
      lively acidity. Skin colour or floral intensity alone therefore cannot establish the wine’s colour
      category, sweetness or geographical origin.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_santorini_wind_drought
    subject_id: n_reg_gr_principle_santorini_training
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_gr_point_santorini_wind_drought
    domain_id: geography
    assertion_text: Santorini’s growing environment includes hot dry Mediterranean summers and strong
      northerly winds. These create a different exposure and water-management context from sheltered
      inland vineyards. Regional humidity observations cannot establish that every vine receives adequate
      water or that drought has no effect on yield and maturity.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_santorini_kouloura
    subject_id: n_reg_gr_principle_santorini_training
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_gr_point_santorini_kouloura
    domain_id: viticulture
    assertion_text: Santorini’s kouloura trains the vine close to the ground in a basket form, sheltering
      grape bunches against strong winds. SantoWines also describes manual vineyard work and slope
      terraces. These practices explain adaptation and labour considerations, without proving that every
      parcel uses one identical system or produces superior wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_assyrtiko_acidity
    subject_id: n_reg_gr_principle_santorini_white_styles
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_gr_point_assyrtiko_acidity
    domain_id: viticulture
    assertion_text: Assyrtiko can retain notable acidity in hot dry conditions while producing substantial
      body and alcohol. This is a useful varietal contrast with assuming that heat necessarily makes a
      white wine soft. Fruit maturity and cellar records remain needed for actual balance; the grape is
      not a guarantee against heat or water stress.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_santorini_lees_oak
    subject_id: n_reg_gr_principle_santorini_white_styles
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_gr_point_santorini_lees_oak
    domain_id: winemaking
    assertion_text: The Santorini profile describes fine-lees maturation, sometimes with oak, as choices for
      a creamier, richer dry-white expression. Compare those cellar choices as well as fruit and vintage
      before attributing all texture differences to volcanic soil. A broader palate is a style option,
      not proof of greater quality or a necessary feature of every bottling.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_robola_slope_context
    subject_id: n_reg_gr_principle_cefalonia_robola
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_gr_point_robola_slope_context
    domain_id: geography
    assertion_text: The Cefalonian cooperative describes Robola vineyards around Omala and Mount Aenos with
      slopes, elevation, marine influence and varied mesoclimates, often on gravelly limestone soils.
      These are growing-condition observations to check by parcel, not evidence that limestone directly
      creates flavour or that all island whites face identical heat.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_robola_handling
    subject_id: n_reg_gr_principle_cefalonia_robola
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_gr_point_robola_handling
    domain_id: winemaking
    assertion_text: The national profile describes Robola as drought-sensitive and prone to oxidation, with
      careful vinification commonly in stainless steel. Compare fruit water status and handling when
      assessing a fresh dry example. A tank does not itself prevent oxidation, and neither mountain
      origin nor an island label guarantees freshness.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_samos_terraces
    subject_id: n_reg_gr_principle_samos_dry_context
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_gr_point_samos_terraces
    domain_id: viticulture
    assertion_text: Samos’s cooperative describes small-berried white Muscat on mountainous sites and narrow
      dry-stone terraces, with sea breezes and varying elevation. These features matter for access, fruit
      assessment and harvest planning. Terrace origin alone cannot quantify labour cost or establish that
      one parcel produces better wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_samos_dry_muscat
    subject_id: n_reg_gr_principle_samos_dry_context
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_gr_point_samos_dry_muscat
    domain_id: winemaking
    assertion_text: The Samos cooperative presents High Peaks in its dry collection, sourced from elevated
      terrace vineyards and made from small-berried white Muscat. Its floral and fruity character
      illustrates that Muscat perfume need not imply a dessert wine. This is a named producer example,
      not a claim that dry Muscat has the same appellation rights as sweet Samos wines.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_crete_northern_influence
    subject_id: n_reg_gr_principle_crete_site_liatiko
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_gr_point_crete_northern_influence
    domain_id: geography
    assertion_text: Wines of Crete describes many vineyards on the island’s northern side, receiving maritime
      breezes and shelter from warmer southern winds. The national account also emphasizes varied
      altitude and exposure and cooler mountain mesoclimates. These influences make site records
      necessary rather than assigning one uniform heat level to all Cretan grapes.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_liatiko_dry_expression
    subject_id: n_reg_gr_principle_crete_site_liatiko
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_gr_point_liatiko_dry_expression
    domain_id: winemaking
    assertion_text: Dry Liatiko can be pale with ripe or dried-red-fruit aromas, a fuller palate and
      soft-to-moderate tannins; fresher fruit-forward examples also occur. Liatiko therefore differs from
      assuming deep colour is necessary for substance. Ripe aroma does not establish residual sugar, and
      the variety also appears in separate sweet-wine styles.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_vidiano_palate
    subject_id: n_reg_gr_principle_crete_white_grapes
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_gr_point_vidiano_palate
    domain_id: winemaking
    assertion_text: Wines of Crete associates Vidiano with apricot and a fuller, creamy palate. This is a
      regional varietal expectation to compare with lighter Vilana, not proof that every Vidiano was
      oaked, underwent malolactic conversion or comes from one altitude. Check production and tasting
      evidence before assigning the cause of texture.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_vilana_palate
    subject_id: n_reg_gr_principle_crete_white_grapes
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_gr_point_vilana_palate
    domain_id: winemaking
    assertion_text: Wines of Crete describes Vilana as lighter on the palate with lemon-scented acidity and
      associates it with Peza and Sitia wines. This supplies a contrasting regional profile alongside
      fuller Vidiano, while maturity and vinification can change the result. The descriptions neither
      rank quality nor form definitive blind-origin tests.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_kotsifali_softness
    subject_id: n_reg_gr_principle_crete_red_blending
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_gr_point_kotsifali_softness
    domain_id: winemaking
    assertion_text: The national profile describes Kotsifali as relatively pale, aromatic and soft in tannins
      and acidity, often blended with Mandilaria in Crete. It can contribute roundness to a dry-red
      blend. This is a potential component role, not a complete appellation grape list or a claim that
      every Kotsifali wine is ready immediately.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_mandilaria_structure
    subject_id: n_reg_gr_principle_crete_red_blending
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_gr_point_mandilaria_structure
    domain_id: winemaking
    assertion_text: Mandilaria, called Mandilari in Crete, can give darker colour and firm tannins and is
      often combined with softer Kotsifali. Its contrasting structure helps explain blending trials, but
      more colour or tannin is not automatically more balanced. Choose proportions by the actual
      components and intended style rather than inventing a universal legal or quality ratio.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_case_north_comparison_action
    subject_id: n_reg_gr_case_north_comparison
    relation_type: CASE_ACTION
    object_id: n_reg_gr_point_case_north_comparison_action
    domain_id: geography
    assertion_text: Record vintage, parcel climate, fruit maturity and extraction/maturation, then seek
      comparable wines or trials with these variables better matched. Accept the supplied texture
      difference as an observation about these two wines, without accepting region as its sole cause.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_case_north_comparison_reason
    subject_id: n_reg_gr_case_north_comparison
    relation_type: CASE_REASON
    object_id: n_reg_gr_point_case_north_comparison_reason
    domain_id: geography
    assertion_text: Naoussa and Amyndeon differ in elevation, climate and typical soil texture, while
      Xinomavro style also varies with cellar choices. The stated vintage, extraction and oak differences
      therefore confound the supplier’s one-cause explanation; a relevant site contrast is not proof that
      it caused all the observed texture.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_case_north_comparison_tradeoff
    subject_id: n_reg_gr_case_north_comparison
    relation_type: CASE_TRADEOFF
    object_id: n_reg_gr_point_case_north_comparison_tradeoff
    domain_id: business
    assertion_text: Seeking comparable vintages and cellar treatments takes more sourcing effort and may
      narrow the buyer’s available selection. Buying the current wines instead preserves their documented
      customer-use differences but cannot establish a recurring regional rule. The extra sourcing effort
      is a consequence of the hypothetical comparison design, not a regional labour statistic.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_case_north_comparison_limitation
    subject_id: n_reg_gr_case_north_comparison
    relation_type: CASE_LIMITATION
    object_id: n_reg_gr_point_case_north_comparison_limitation
    domain_id: geography
    assertion_text: Two confounded examples cannot prove that all Naoussa is firmer, all Amyndeon softer, or
      that either is better value. More comparable vintages, parcels and maturation records are needed;
      the exercise does not support a definitive blind-origin diagnosis or a guaranteed future tasting
      result.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_case_nemea_customer_action
    subject_id: n_reg_gr_case_nemea_customer
    relation_type: CASE_ACTION
    object_id: n_reg_gr_point_case_nemea_customer_action
    domain_id: business
    assertion_text: Choose the younger offer provisionally for the current brief and start with an order
      compatible with the cash budget and demand testing. Evaluate the firmer offer for another customer
      or later use; higher documented production cost does not override present tasting and service
      requirements.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_case_nemea_customer_reason
    subject_id: n_reg_gr_case_nemea_customer
    relation_type: CASE_REASON
    object_id: n_reg_gr_point_case_nemea_customer_reason
    domain_id: winemaking
    assertion_text: Young Agiorgitiko can be fruit-driven and softer, while extended extraction and new oak
      are documented Nemea production choices for a more structured expression. These mechanisms make the
      supplied style contrast plausible, but the panel result for these offers establishes current
      suitability rather than universal stylistic quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_case_nemea_customer_tradeoff
    subject_id: n_reg_gr_case_nemea_customer
    relation_type: CASE_TRADEOFF
    object_id: n_reg_gr_point_case_nemea_customer_tradeoff
    domain_id: business
    assertion_text: The initial order meets present service needs and limits cash tied up in untested demand.
      It forgoes the second wine’s different style for another audience or future development. The
      documented barrel/storage costs may affect its price, but whether diners value those costs enough
      to pay more remains untested.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_case_nemea_customer_limitation
    subject_id: n_reg_gr_case_nemea_customer
    relation_type: CASE_LIMITATION
    object_id: n_reg_gr_point_case_nemea_customer_limitation
    domain_id: business
    assertion_text: One panel and two offers cannot rank all tank- and oak-matured Nemea, establish future
      ageing success or predict by-the-glass demand. Record supply consistency, customer response and
      saleable stock before increasing orders; the supplier’s higher cost is evidence of cost, not an
      independent quality measurement.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_case_santorini_training_action
    subject_id: n_reg_gr_case_santorini_training
    relation_type: CASE_ACTION
    object_id: n_reg_gr_point_case_santorini_training_action
    domain_id: viticulture
    assertion_text: Retain the functioning baskets while testing a limited, appropriately designed comparison
      of the proposed trellis, with parcel wind exposure, fruit health and maturity recorded. Assess
      dry-wine balance and the quoted cost before a whole-parcel change; reduced pruning hours alone are
      not evidence of equivalent crop performance.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_case_santorini_training_reason
    subject_id: n_reg_gr_case_santorini_training
    relation_type: CASE_REASON
    object_id: n_reg_gr_point_case_santorini_training_reason
    domain_id: viticulture
    assertion_text: The low basket shelters bunches from Santorini’s strong winds, and terraces support
      access on slopes. Replacing it changes exposure context as well as work practices. The proposed
      trellis has no stated local performance evidence, so its labour claim cannot establish equivalent
      protection or balanced fruit.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_case_santorini_training_tradeoff
    subject_id: n_reg_gr_case_santorini_training
    relation_type: CASE_TRADEOFF
    object_id: n_reg_gr_point_case_santorini_training_tradeoff
    domain_id: business
    assertion_text: The proposed system might save the forecast labour, but conversion requires cash before
      harvest and may change wind damage or maturity. A limited trial slows any full savings while
      reducing the scale of the untested commitment. Compare measured total costs and saleable output
      rather than assuming manual heritage guarantees a price premium.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_case_santorini_training_limitation
    subject_id: n_reg_gr_case_santorini_training
    relation_type: CASE_LIMITATION
    object_id: n_reg_gr_point_case_santorini_training_limitation
    domain_id: viticulture
    assertion_text: The scenario lacks measured labour, multiseason wind performance, fruit yield and
      quality, and customer response. It cannot determine a universal optimum or guarantee that baskets
      or taller trellises are better everywhere. Physical adaptation supports the comparison design, not
      an entitlement to a particular premium.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_case_aromatic_whites_action
    subject_id: n_reg_gr_case_aromatic_whites
    relation_type: CASE_ACTION
    object_id: n_reg_gr_point_case_aromatic_whites_action
    domain_id: winemaking
    assertion_text: Shortlist the Mantinia and Samos offers because the supplied analysis and tasting meet
      the dry, aromatic, light-bodied brief. Check quantity, consistency and service trials before
      selecting an order. Keep Vidiano as a possible fuller-texture alternative rather than treating its
      current mismatch as inferior wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_case_aromatic_whites_reason
    subject_id: n_reg_gr_case_aromatic_whites
    relation_type: CASE_REASON
    object_id: n_reg_gr_point_case_aromatic_whites_reason
    domain_id: winemaking
    assertion_text: The regional sources document fragrant dry Moschofilero and a dry Samos Muscat example,
      while Vidiano is associated with fuller texture. Thus floral or apricot perfume does not prove
      residual sweetness; the supplied product records and tasting establish dryness and palate
      suitability for these three wines.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_case_aromatic_whites_tradeoff
    subject_id: n_reg_gr_case_aromatic_whites
    relation_type: CASE_TRADEOFF
    object_id: n_reg_gr_point_case_aromatic_whites_tradeoff
    domain_id: business
    assertion_text: The stated lower landed cost may improve purchase economics if saleable quantity,
      consistency and demand are adequate. Choosing it forgoes the Mantinia offer’s different aroma
      profile; retaining both broadens choice while increasing stock complexity. Neither aroma difference
      nor terrace labour proves a required price rank.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
  - id: ki_reg_gr_case_aromatic_whites_limitation
    subject_id: n_reg_gr_case_aromatic_whites
    relation_type: CASE_LIMITATION
    object_id: n_reg_gr_point_case_aromatic_whites_limitation
    domain_id: winemaking
    assertion_text: These analyses and tasting records establish the supplied offers, not every Muscat,
      Moschofilero or Vidiano wine. Maturity, winemaking, vintage and customer preference can change
      style. Recheck analytical and sensory evidence for replacements; matching an aroma description
      alone neither identifies origin nor predicts demand.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T10:26:56.000Z
