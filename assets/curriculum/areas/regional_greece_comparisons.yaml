# Original Greek regional comparisons; all await qualified review.
# MCQ disabled: contextual site/style explanations and case actions permit defensible alternatives.
# Dates record curation, not the beginning of regional conditions.
knowledge_nodes:
  - id: n_reg_gr_principle_naoussa_sites
    node_type: production_principle
    name: How do Naoussa’s seasonal climate and varied Vermio vineyard sites complicate a single
      growing-condition explanation for Xinomavro?
  - id: n_reg_gr_point_naoussa_seasons
    node_type: learning_point
    name: Naoussa combines Mediterranean conditions with continental seasonal influence
  - id: n_reg_gr_point_naoussa_variation
    node_type: learning_point
    name: Vermio slopes vary in altitude, aspect and soils within Naoussa
  - id: n_reg_gr_principle_naoussa_styles
    node_type: production_principle
    name: Why can a pale Xinomavro from Naoussa have firm structure, and how do traditional and more
      fruit-forward cellar styles alter its young expression?
  - id: n_reg_gr_point_xinomavro_structure
    node_type: learning_point
    name: Pale Xinomavro colour can coexist with firm tannins and bright acidity
  - id: n_reg_gr_point_naoussa_style_choices
    node_type: learning_point
    name: Naoussa offers contrasting austere and more approachable young expressions
  - id: n_reg_gr_principle_amyndeon_context
    node_type: production_principle
    name: Which elevation, lake and soil-texture differences should be recorded when comparing Amyndeon and
      Naoussa Xinomavro grown in northern Greece?
  - id: n_reg_gr_point_amyndeon_lakes
    node_type: learning_point
    name: Elevated Amyndeon combines cooler inland conditions with nearby lake moderation
  - id: n_reg_gr_point_north_soil_textures
    node_type: learning_point
    name: The research comparison describes generally lighter Amyndeon and heavier Naoussa soils
  - id: n_reg_gr_principle_northern_harvest
    node_type: production_principle
    name: How do late Xinomavro ripening and a producer’s contrasting northern Greek harvest experiences
      qualify the idea that waiting always improves fruit?
  - id: n_reg_gr_point_xinomavro_late_weather
    node_type: learning_point
    name: Late Naoussa Xinomavro ripening can increase exposure to cold rainy seasons
  - id: n_reg_gr_point_amyndeon_2022_selection
    node_type: learning_point
    name: Kir-Yianni’s 2022 Amyndeon report prioritized parcel maturity and damage risk
  - id: n_reg_gr_principle_nemea_sites
    node_type: production_principle
    name: Why should an Agiorgitiko comparison distinguish Nemea’s lower vineyards from its higher inland
      sites rather than treating all Peloponnese reds as equally warm?
  - id: n_reg_gr_point_nemea_altitude
    node_type: learning_point
    name: Nemea altitude and orientation variation alter the ripening comparison
  - id: n_reg_gr_point_nemea_inland_nights
    node_type: learning_point
    name: Higher inland Nemea sites can show stronger night-time cooling
  - id: n_reg_gr_principle_nemea_styles
    node_type: production_principle
    name: What grape and cellar evidence separates a fresh young Agiorgitiko brief from a more extracted,
      oak-matured Nemea red without assigning an automatic quality rank?
  - id: n_reg_gr_point_agiorgitiko_young
    node_type: learning_point
    name: Young Agiorgitiko can offer red fruit, moderate acidity and softer tannins
  - id: n_reg_gr_point_nemea_extraction_oak
    node_type: learning_point
    name: GAIA Estate illustrates extended extraction and new-oak maturation in Nemea
  - id: n_reg_gr_principle_mantinia_white
    node_type: production_principle
    name: How do Mantinia’s cool plateau and Moschofilero’s coloured skins help explain an aromatic dry white
      without assuming pink berries require a rosé?
  - id: n_reg_gr_point_mantinia_cool_ripening
    node_type: learning_point
    name: Mantinia’s cool elevated setting slows Moschofilero ripening and retains weather risks
  - id: n_reg_gr_point_moschofilero_white
    node_type: learning_point
    name: Coloured Moschofilero skins can yield floral dry whites with lively acidity
  - id: n_reg_gr_principle_santorini_training
    node_type: production_principle
    name: How do Santorini’s dry windy conditions and low basket training create a vineyard-management
      comparison distinct from a sheltered inland Greek site?
  - id: n_reg_gr_point_santorini_wind_drought
    node_type: learning_point
    name: Santorini combines hot dry summers with strong northerly winds
  - id: n_reg_gr_point_santorini_kouloura
    node_type: learning_point
    name: Low kouloura baskets shelter Santorini grape bunches from strong winds
  - id: n_reg_gr_principle_santorini_white_styles
    node_type: production_principle
    name: How can Assyrtiko acidity and fine-lees or oak choices create contrasting dry Santorini whites
      without making volcanic geology a flavour guarantee?
  - id: n_reg_gr_point_assyrtiko_acidity
    node_type: learning_point
    name: Assyrtiko can retain crisp acidity in hot dry growing conditions
  - id: n_reg_gr_point_santorini_lees_oak
    node_type: learning_point
    name: Lees contact and sometimes oak can broaden dry Santorini texture
  - id: n_reg_gr_principle_cefalonia_robola
    node_type: production_principle
    name: Which Cefalonian site and Robola handling details distinguish a mountain-grown dry white from a
      generic warm-island wine comparison?
  - id: n_reg_gr_point_robola_slope_context
    node_type: learning_point
    name: Cefalonian Robola includes Aenos slopes with varied altitude and mesoclimates
  - id: n_reg_gr_point_robola_handling
    node_type: learning_point
    name: Robola drought sensitivity and oxidation risk call for careful site and cellar assessment
  - id: n_reg_gr_principle_samos_dry_context
    node_type: production_principle
    name: How do Samos’s mountain Muscat terraces and a documented dry bottling distinguish regional vineyard
      context from an assumption that every fragrant Muscat must be sweet?
  - id: n_reg_gr_point_samos_terraces
    node_type: learning_point
    name: Samos Muscat grows on narrow mountain terraces with maritime influence
  - id: n_reg_gr_point_samos_dry_muscat
    node_type: learning_point
    name: High Peaks is a documented dry aromatic Muscat example from Samos
  - id: n_reg_gr_principle_crete_site_liatiko
    node_type: production_principle
    name: How do Cretan site differences and pale dry Liatiko qualify the shortcuts that all southern island
      vineyards are uniformly hot and all pale reds lack substance?
  - id: n_reg_gr_point_crete_northern_influence
    node_type: learning_point
    name: Cretan northern vineyards and mountainous mesoclimates qualify a uniform heat rule
  - id: n_reg_gr_point_liatiko_dry_expression
    node_type: learning_point
    name: Pale dry Liatiko can have ripe-fruit expression and a fuller palate
  - id: n_reg_gr_principle_crete_white_grapes
    node_type: production_principle
    name: Which aroma and palate differences make Vidiano and Vilana useful contrasting starting points for a
      dry Cretan white comparison?
  - id: n_reg_gr_point_vidiano_palate
    node_type: learning_point
    name: Vidiano is associated with apricot aroma and a fuller creamy palate
  - id: n_reg_gr_point_vilana_palate
    node_type: learning_point
    name: Vilana is associated with a lighter palate and lemon-scented freshness
  - id: n_reg_gr_principle_crete_red_blending
    node_type: production_principle
    name: How can softer Kotsifali and firmer, darker Mandilaria supply complementary components in a Cretan
      dry-red blend without making a fixed blend ratio a quality rule?
  - id: n_reg_gr_point_kotsifali_softness
    node_type: learning_point
    name: Kotsifali can contribute aromatic roundness with softer tannins and acidity
  - id: n_reg_gr_point_mandilaria_structure
    node_type: learning_point
    name: Mandilaria can contribute darker colour and firm tannins to Cretan blends
  - id: n_reg_gr_case_north_comparison
    node_type: production_case
    name: "A buyer is offered two dry Xinomavro reds: one from a clay-rich Naoussa parcel and one from a
      sandy-loamy Amyndeon parcel. They are from different vintages; the Naoussa wine had longer
      extraction and new oak, while the Amyndeon wine had shorter extraction and older barrels. In the
      current tasting the Naoussa wine is firmer and the Amyndeon wine more immediately supple. The
      supplier attributes the difference entirely to region and promises the same contrast every year.
      Propose an action, reason, tradeoff and limitation for a defensible regional comparison; no matched
      trial or parcel weather records are supplied."
  - id: n_reg_gr_point_case_north_comparison_action
    node_type: learning_point
    name: Collect matched fruit and cellar evidence before accepting the regional claim
  - id: n_reg_gr_point_case_north_comparison_reason
    node_type: learning_point
    name: Northern site contrasts and cellar differences can jointly affect the comparison
  - id: n_reg_gr_point_case_north_comparison_tradeoff
    node_type: learning_point
    name: Better control reduces confounding but samples may be harder to obtain
  - id: n_reg_gr_point_case_north_comparison_limitation
    node_type: learning_point
    name: Two differently made wines cannot prove fixed origin or future regional texture
  - id: n_reg_gr_case_nemea_customer
    node_type: production_case
    name: A restaurant seeks a dry Nemea Agiorgitiko for immediate by-the-glass service, with fresh red fruit
      and gentle tannins. Its panel confirms that a younger, tank-matured offer fits the brief. A second
      offer, made with extended extraction and new oak, has firmer tannins and noticeable wood that the
      panel finds less suitable now. The second supplier documents higher barrel and storage costs and
      proposes a larger order, claiming the extra cost proves higher quality. The restaurant’s cash
      budget is limited and future demand is unknown. Give an action, reason, tradeoff and limitation
      without treating either style as universally superior.
  - id: n_reg_gr_point_case_nemea_customer_action
    node_type: learning_point
    name: Choose the panel-approved young Nemea in a demand-tested order size
  - id: n_reg_gr_point_case_nemea_customer_reason
    node_type: learning_point
    name: Agiorgitiko versatility and extraction/oak choices support different service styles
  - id: n_reg_gr_point_case_nemea_customer_tradeoff
    node_type: learning_point
    name: Buying immediate suitability forgoes the alternative and limits tied-up cash
  - id: n_reg_gr_point_case_nemea_customer_limitation
    node_type: learning_point
    name: Current panel fit cannot rank all Nemea or predict future sales and ageing
  - id: n_reg_gr_case_santorini_training
    node_type: production_case
    name: A Santorini grower supplies Assyrtiko for dry whites from an exposed, terraced parcel currently
      trained in low kouloura baskets. A consultant proposes replacing all baskets with a taller trellis
      solely to reduce pruning hours. The grower has records of strong winds but no local trial comparing
      wind damage, fruit maturity or wine balance under the two systems. The quoted conversion cost is
      payable before harvest; forecast labour savings and buyer demand are untested. Give an action,
      reason, tradeoff and limitation for this parcel rather than assuming either training system is
      universally best.
  - id: n_reg_gr_point_case_santorini_training_action
    node_type: learning_point
    name: Test the proposed Santorini training change before converting the whole parcel
  - id: n_reg_gr_point_case_santorini_training_reason
    node_type: learning_point
    name: Santorini basket training serves wind protection as well as labour organization
  - id: n_reg_gr_point_case_santorini_training_tradeoff
    node_type: learning_point
    name: Possible pruning savings must be weighed against upfront cost and crop uncertainty
  - id: n_reg_gr_point_case_santorini_training_limitation
    node_type: learning_point
    name: No local trellis trial establishes the best long-term Santorini system
  - id: n_reg_gr_case_aromatic_whites
    node_type: production_case
    name: A buyer compares a still dry Moschofilero from Mantinia, a still dry Muscat from elevated Samos
      terraces and a still dry Vidiano from Crete. Producer analyses and the tasting panel confirm all
      three as dry. The panel records rose/citrus and a light palate for the Mantinia, floral/apricot and
      a light palate for the Samos, and apricot with a fuller palate for the Vidiano. For an aromatic but
      light-bodied by-the-glass brief, both Mantinia and Samos fit; Vidiano is less suitable for this
      specific texture brief. The Samos offer has a lower landed cost in this comparison, but available
      bottle quantities and demand are not yet checked. Explain an action, reason, tradeoff and
      limitation without calling Muscat automatically sweet or identifying origin from aroma alone.
  - id: n_reg_gr_point_case_aromatic_whites_action
    node_type: learning_point
    name: Check supply and choose between the two suitable aromatic light dry whites
  - id: n_reg_gr_point_case_aromatic_whites_reason
    node_type: learning_point
    name: Aromatic Muscat and Moschofilero can both be dry while Vidiano offers a different palate
  - id: n_reg_gr_point_case_aromatic_whites_tradeoff
    node_type: learning_point
    name: The cheaper suitable Samos offer may suit cost goals but needs supply and demand checks
  - id: n_reg_gr_point_case_aromatic_whites_limitation
    node_type: learning_point
    name: Three documented offers cannot define all Greek aromatic whites or blind origins
