knowledge_items:
  - {id: ki_d1method_hyper, subject_id: n_d1method_hyper, relation_type: PRINCIPLE_EXPLANATION, object_id: n_d1method_hyper_point, domain_id: winemaking, assertion_text: "Hyperoxidation deliberately adds oxygen to white must before clarification and fermentation. Oxidised phenolics can polymerise and be removed during clarification, lowering later browning potential; this is not a direction to oxidise the finished wine.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T18:40:00.000Z"}
  - {id: ki_d1method_hyper_risk, subject_id: n_d1method_hyper_risk, relation_type: PRINCIPLE_EXPLANATION, object_id: n_d1method_hyper_risk_point, domain_id: winemaking, assertion_text: "AWRI advises against routine hyperoxidation when Botrytis is present because its laccase can drive broader, aggressive oxidation. Assess and sort the fruit rather than assume deliberate air exposure improves every white must.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T18:40:00.000Z"}
  - {id: ki_d1method_flotation, subject_id: n_d1method_flotation, relation_type: PRINCIPLE_EXPLANATION, object_id: n_d1method_flotation_point, domain_id: winemaking, assertion_text: "Flotation introduces gas into juice so bubbles carry suspended particles upward for removal before fermentation. It can clarify more quickly than chilled settling, but must still be matched to the desired juice-solids level and available equipment.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T18:40:00.000Z"}
  - {id: ki_d1method_flotation_gas, subject_id: n_d1method_flotation_gas, relation_type: PRINCIPLE_EXPLANATION, object_id: n_d1method_flotation_gas_point, domain_id: winemaking, assertion_text: "Nitrogen flotation limits added oxygen; flotation with air can promote oxidation and phenolic precipitation. Gas choice is therefore a style and risk decision as well as a clarification decision, not proof that either gas always produces better wine.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T18:40:00.000Z"}
  - {id: ki_d1method_flash, subject_id: n_d1method_flash, relation_type: PRINCIPLE_EXPLANATION, object_id: n_d1method_flash_point, domain_id: winemaking, assertion_text: "Flash detente heats red-grape must then applies vacuum; rapid water vaporisation disrupts grape tissue and speeds extraction before fermentation. It can shorten skin-contact and fermenter time, but the sensory profile may change and needs a trial against the intended style.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T18:40:00.000Z"}
  - {id: ki_d1method_microox, subject_id: n_d1method_microox, relation_type: PRINCIPLE_EXPLANATION, object_id: n_d1method_microox_point, domain_id: winemaking, assertion_text: "Micro-oxygenation meters oxygen into wine more slowly than the treated wine consumes it, so oxygen should not accumulate. In a suitable red wine it can support pigment stabilisation and maturation, but requires monitoring of wine condition and oxygen exposure.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T18:40:00.000Z"}
  - {id: ki_d1method_oak_pieces, subject_id: n_d1method_oak_pieces, relation_type: PRINCIPLE_EXPLANATION, object_id: n_d1method_oak_pieces_point, domain_id: winemaking, assertion_text: "Pieces of oak wood can introduce selected wood constituents to wine. Their use is a separate choice from ageing in a wooden vessel; the cellar must also check the rules and label requirements that apply in the intended market.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T18:40:00.000Z"}
  - {id: ki_d1method_oak_compare, subject_id: n_d1method_oak_compare, relation_type: PRINCIPLE_EXPLANATION, object_id: n_d1method_oak_compare_point, domain_id: winemaking, assertion_text: "A small oak barrel supplies wood constituents while also allowing controlled oxygen exchange and some evaporation during maturation. Oak pieces in an inert tank mainly address wood extraction; matching barrel character may require separate oxygen management and cannot be assumed equivalent.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T18:40:00.000Z"}
  - {id: ki_d1method_case_white_action, subject_id: n_d1method_case_white, relation_type: CASE_ACTION, object_id: n_d1method_case_white_action, domain_id: winemaking, assertion_text: "Assess and sort the rot-affected intake, then run a small protected-flotation comparison for the sound white juice instead of applying hyperoxidation to the entire lot.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T18:40:00.000Z"}
  - {id: ki_d1method_case_white_reason, subject_id: n_d1method_case_white, relation_type: CASE_REASON, object_id: n_d1method_case_white_reason, domain_id: winemaking, assertion_text: "Flotation raises suspended solids with gas; nitrogen limits oxygen input while a Botrytis/laccase risk makes deliberate juice oxidation a poor default.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T18:40:00.000Z"}
  - {id: ki_d1method_case_white_tradeoff, subject_id: n_d1method_case_white, relation_type: CASE_TRADEOFF, object_id: n_d1method_case_white_tradeoff, domain_id: winemaking, assertion_text: "Rapid flotation may save tank time and chilling energy, but equipment, fining aids, foam control and a changed solids level can affect cost and wine style.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T18:40:00.000Z"}
  - {id: ki_d1method_case_white_limit, subject_id: n_d1method_case_white, relation_type: CASE_LIMITATION, object_id: n_d1method_case_white_limit, domain_id: winemaking, assertion_text: "Test the actual juice and finished trial wine for oxidation, clarity and sensory fit; sorting and nitrogen do not erase every risk from affected fruit.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T18:40:00.000Z"}
  - {id: ki_d1method_case_red_action, subject_id: n_d1method_case_red, relation_type: CASE_ACTION, object_id: n_d1method_case_red_action, domain_id: winemaking, assertion_text: "Compare a barrel lot with controlled tank trials of oak pieces and, only if suitable, monitored micro-oxygenation; define the intended red-wine profile first.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T18:40:00.000Z"}
  - {id: ki_d1method_case_red_reason, subject_id: n_d1method_case_red, relation_type: CASE_REASON, object_id: n_d1method_case_red_reason, domain_id: winemaking, assertion_text: "Wood extraction and slow oxygen supply are separable effects. OIV describes wood pieces for oak constituents, barrels for gradual oxygenation and wood extraction, and micro-oxygenation for oxygen input below consumption.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T18:40:00.000Z"}
  - {id: ki_d1method_case_red_tradeoff, subject_id: n_d1method_case_red, relation_type: CASE_TRADEOFF, object_id: n_d1method_case_red_tradeoff, domain_id: winemaking, assertion_text: "Tank-based wood and oxygen control may lower barrel inventory and handling cost, but extraction, evaporation and oxygen kinetics may yield a different sensory result.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T18:40:00.000Z"}
  - {id: ki_d1method_case_red_limit, subject_id: n_d1method_case_red, relation_type: CASE_LIMITATION, object_id: n_d1method_case_red_limit, domain_id: winemaking, assertion_text: "Monitor oxygen, colour, aroma and palate in each trial, and check local use and labelling rules. No oak or oxygen treatment guarantees barrel equivalence or wine quality.", verification_status: unverified, mcq_disabled: true, last_verified_at: "2026-09-29T18:40:00.000Z"}

