knowledge_nodes:
  - {id: n_d1method_hyper, node_type: production_principle, name: "When should white-must hyperoxidation occur, and why?"}
  - {id: n_d1method_hyper_point, node_type: learning_point, name: "Oxidise must phenolics before clarification and fermentation"}
  - {id: n_d1method_hyper_risk, node_type: production_principle, name: "Why reconsider hyperoxidation when Botrytis is present?"}
  - {id: n_d1method_hyper_risk_point, node_type: learning_point, name: "Laccase can intensify unwanted oxidation"}
  - {id: n_d1method_flotation, node_type: production_principle, name: "How does flotation clarify grape juice?"}
  - {id: n_d1method_flotation_point, node_type: learning_point, name: "Gas lifts suspended solids before fermentation"}
  - {id: n_d1method_flotation_gas, node_type: production_principle, name: "Why does flotation gas choice matter?"}
  - {id: n_d1method_flotation_gas_point, node_type: learning_point, name: "Air and nitrogen create different oxygen exposure"}
  - {id: n_d1method_flash, node_type: production_principle, name: "What does flash detente change in a red-wine production plan?"}
  - {id: n_d1method_flash_point, node_type: learning_point, name: "Faster extraction can shorten skin-contact time"}
  - {id: n_d1method_microox, node_type: production_principle, name: "What separates micro-oxygenation from an uncontrolled oxygen dose?"}
  - {id: n_d1method_microox_point, node_type: learning_point, name: "Add oxygen below the wine's consumption rate"}
  - {id: n_d1method_oak_pieces, node_type: production_principle, name: "What can oak pieces contribute during wine maturation?"}
  - {id: n_d1method_oak_pieces_point, node_type: learning_point, name: "Wood-derived constituents without a barrel vessel"}
  - {id: n_d1method_oak_compare, node_type: production_principle, name: "Why are oak pieces not equivalent to barrel ageing?"}
  - {id: n_d1method_oak_compare_point, node_type: learning_point, name: "Barrel ageing also changes oxygen exposure and evaporation"}
  - {id: n_d1method_case_white, node_type: production_case, name: "White juice requires rapid clarification after rot pressure"}
  - {id: n_d1method_case_white_action, node_type: learning_point, name: "Trial protected flotation after sorting and fruit assessment"}
  - {id: n_d1method_case_white_reason, node_type: learning_point, name: "Gas lifts solids while nitrogen limits added oxygen"}
  - {id: n_d1method_case_white_tradeoff, node_type: learning_point, name: "Speed and tank capacity trade against equipment and style"}
  - {id: n_d1method_case_white_limit, node_type: learning_point, name: "Botrytis risk and final wine need direct testing"}
  - {id: n_d1method_case_red, node_type: production_case, name: "Red-wine maturation needs wood character and colour control"}
  - {id: n_d1method_case_red_action, node_type: learning_point, name: "Compare barrel with oak-piece and controlled-oxygen trials"}
  - {id: n_d1method_case_red_reason, node_type: learning_point, name: "Wood extraction and oxygen exposure are distinct mechanisms"}
  - {id: n_d1method_case_red_tradeoff, node_type: learning_point, name: "Tank options may save barrel cost but alter the style"}
  - {id: n_d1method_case_red_limit, node_type: learning_point, name: "Monitor the actual wine; neither process guarantees quality"}

