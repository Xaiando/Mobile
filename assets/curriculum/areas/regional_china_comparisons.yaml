knowledge_items:
  - id: ki_reg_cn_helan_sun
    subject_id: n_reg_cn_principle_helan_sun_water
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_cn_point_helan_sun
    domain_id: viticulture
    assertion_text: The primary Helan foothill account describes abundant sunshine. This provides growing-season
      context, while a parcel’s actual maturity and intended wine style still require observation rather than
      a sunshine-based quality guarantee.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_helan_water
    subject_id: n_reg_cn_principle_helan_sun_water
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_cn_point_helan_water
    domain_id: viticulture
    assertion_text: The same account describes limited precipitation and Yellow River irrigation in the Helan
      foothills. Irrigation access and rainfall provide water-supply context; neither establishes the
      appropriate water regime for every vineyard.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_hongsibu_burial
    subject_id: n_reg_cn_principle_hongsibu_winter_work
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_cn_point_hongsibu_burial
    domain_id: viticulture
    assertion_text: Research based on a March 2019 Hongsibu survey describes burying vines for winter cold
      protection. This is a dated local practice, not evidence that one burial depth or calendar suits all
      Chinese vineyards.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_hongsibu_cost
    subject_id: n_reg_cn_principle_hongsibu_winter_work
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_cn_point_hongsibu_cost
    domain_id: business
    assertion_text: The Hongsibu study identifies burial as an added production cost and an obstacle to
      mechanisation. A business comparison therefore needs actual winter-work costs, rather than assuming the
      region’s growing opportunity removes annual handling burdens.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_ningxia_training_work
    subject_id: n_reg_cn_principle_ningxia_training
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_cn_point_ningxia_training_work
    domain_id: viticulture
    assertion_text: The Ningxia training study treats convenient winter lay-down and fruit exposure as linked
      design questions. Low or slanting trunks can aid burial operations, but a training choice must also
      consider its canopy arrangement.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_ningxia_training_trial
    subject_id: n_reg_cn_principle_ningxia_training
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_cn_point_ningxia_training_trial
    domain_id: viticulture
    assertion_text: In the 2016 Yuquanying Cabernet Gernischt trial, slant-trunk training changed canopy density,
      leaf photosynthesis and measured berry composition. These cultivar/site/vintage results do not
      demonstrate superior finished-wine taste.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_ningxia_deficit_crop
    subject_id: n_reg_cn_principle_ningxia_deficit_irrigation
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_cn_point_ningxia_deficit_crop
    domain_id: viticulture
    assertion_text: In the 2015–16 Yinchuan Cabernet Sauvignon experiment, the stronger deficit treatments reduced
      yield, berry weight and titratable acidity relative to full irrigation. This bounds a possible
      water-saving tradeoff, rather than prescribing one deficit for Ningxia.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_ningxia_deficit_chemistry
    subject_id: n_reg_cn_principle_ningxia_deficit_irrigation
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_cn_point_ningxia_deficit_chemistry
    domain_id: winemaking
    assertion_text: The same experiment found irrigation-related differences in grape amino acids and derived wine
      volatiles. Composition measurements inform fermentation and style assessment; they do not establish a
      universally preferred taste or an optimal water dose.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_shandong_typhoon
    subject_id: n_reg_cn_principle_shandong_storm_storage
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_cn_point_shandong_typhoon
    domain_id: viticulture
    assertion_text: Long Dai’s Shandong account describes typhoons bringing rain and potential terrace damage.
      Storm water requires local monitoring and protection; its arrival does not guarantee usable water at the
      time vines later need it.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_shandong_pond
    subject_id: n_reg_cn_principle_shandong_storm_storage
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_cn_point_shandong_pond
    domain_id: viticulture
    assertion_text: Long Dai’s 2022–23 sustainability account describes retaining monsoon runoff in a pond for
      occasional drip support in the driest years. This is an estate water-storage example, not a promise of
      permanent supply sufficiency.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_shandong_terrace_work
    subject_id: n_reg_cn_principle_shandong_small_lots
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_cn_point_shandong_terrace_work
    domain_id: viticulture
    assertion_text: Long Dai describes adapting vineyard work to heterogeneous terraced lots, with more manual
      handling and suitable machinery. Parcel differences affect operating arrangements rather than
      guaranteeing a particular wine flavour.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_shandong_separate_ferments
    subject_id: n_reg_cn_principle_shandong_small_lots
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_cn_point_shandong_separate_ferments
    domain_id: winemaking
    assertion_text: The producer describes small temperature-controlled stainless-steel vats for separate
      small-lot fermentations. Keeping lots separate preserves production choices before blending; it does not
      itself prove greater quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_shandong_blend
    subject_id: n_reg_cn_principle_shandong_grapes_extraction
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_cn_point_shandong_blend
    domain_id: winemaking
    assertion_text: Long Dai describes Cabernet Sauvignon, Marselan and Cabernet Franc in its red blend. This is a
      producer example, not a complete list of legally permitted grapes or every Shandong wine’s composition.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_shandong_marselan_extraction
    subject_id: n_reg_cn_principle_shandong_grapes_extraction
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_cn_point_shandong_marselan_extraction
    domain_id: winemaking
    assertion_text: Long Dai describes gentle Marselan extraction alongside traditional Bordeaux methods for its
      emblematic varieties. The practice illustrates adapting extraction to a grape and product, without
      promising a fixed tannin level in every resulting wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_china_model_transfer
    subject_id: n_reg_cn_principle_china_phenology_models
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_cn_point_china_model_transfer
    domain_id: viticulture
    assertion_text: A five-region Chinese comparison, including Changli, found model performance depended on site
      and cultivar. Limited observations support checking local growth-stage predictions rather than importing
      one air-temperature model unchanged across Chinese regions.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_china_model_burial
    subject_id: n_reg_cn_principle_china_phenology_models
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_cn_point_china_model_burial
    domain_id: viticulture
    assertion_text: The comparison explains that buried buds experience soil rather than station-air temperatures
      during cover. Burial and uncovering can therefore alter budburst prediction; the paper does not supply a
      universally safe spring uncovering date.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_xinjiang_shade_growth
    subject_id: n_reg_cn_principle_xinjiang_shade
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_cn_point_xinjiang_shade_growth
    domain_id: viticulture
    assertion_text: In the 2018 Manas trial, partial canopy shading reduced radiation and bunch-zone temperature,
      but also photosynthesis and yield. Cooler exposure therefore came with a crop-output tradeoff in that
      treatment and vintage.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_xinjiang_shade_style
    subject_id: n_reg_cn_principle_xinjiang_shade
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_cn_point_xinjiang_shade_style
    domain_id: winemaking
    assertion_text: Shading delayed ripening and slowed soluble-solids accumulation at matched sampling dates in
      the Manas trial; respective-harvest soluble solids did not differ significantly. Acidity and wine
      compounds also changed. These measurements require style assessment; chemical aroma indicators do not
      demonstrate consumer preference.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_xinjiang_cover_material
    subject_id: n_reg_cn_principle_xinjiang_nonburial_cover
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_cn_point_xinjiang_cover_material
    domain_id: viticulture
    assertion_text: The 2023–24 Shihezi experiment compared a tarpaulin with an insulating blanket at different
      covering heights. Insulation depended on material and airspace configuration; the blanket performed
      better thermally in that local comparison.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_xinjiang_cover_monitoring
    subject_id: n_reg_cn_principle_xinjiang_nonburial_cover
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_cn_point_xinjiang_cover_monitoring
    domain_id: viticulture
    assertion_text: The experiment monitored cane and soil temperatures and fitted temperature predictions. These
      measurements support local cover assessment, but one winter’s thermal model is not proof that a chosen
      configuration protects all vines in future winters.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_xinjiang_soil_nitrogen
    subject_id: n_reg_cn_principle_xinjiang_water_nitrogen
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_cn_point_xinjiang_soil_nitrogen
    domain_id: viticulture
    assertion_text: In the 2018 Xinjiang trial, total vine nitrogen uptake did not differ significantly among
      treatments, and much uptake came from soil nitrogen. More fertilizer input therefore did not demonstrate
      greater total uptake in that experiment.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_xinjiang_water_nitrogen_response
    subject_id: n_reg_cn_principle_xinjiang_water_nitrogen
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_cn_point_xinjiang_water_nitrogen_response
    domain_id: viticulture
    assertion_text: At the same nitrogen input, the trial’s higher irrigation treatment had a higher measured
      fertilizer-nitrogen utilization fraction. The highest nitrogen input had a lower measured fraction than
      the lowest input and left more soil residue; not all utilization contrasts were statistically
      significant. Water and nutrition need joint assessment, without treating these trial doses as regional
      recommendations.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_yunnan_village_temperature
    subject_id: n_reg_cn_principle_yunnan_village_exposure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_cn_point_yunnan_village_temperature
    domain_id: viticulture
    assertion_text: Ao Yun describes lower, southwest-facing Xidang as its warmest village setting and higher,
      northwest-facing Adong as its coolest. This estate comparison concerns combined elevation and exposure,
      without isolating either as the sole cause.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_yunnan_mountain_ripening
    subject_id: n_reg_cn_principle_yunnan_village_exposure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_cn_point_yunnan_mountain_ripening
    domain_id: viticulture
    assertion_text: The producer describes mountain shading limiting sunshine and cooler nights extending ripening
      at its sites. Such local conditions need parcel and seasonal assessment; a national latitude or
      elevation label cannot establish one harvest date.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_yunnan_manual_work
    subject_id: n_reg_cn_principle_yunnan_work_blend
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_cn_point_yunnan_manual_work
    domain_id: business
    assertion_text: The producer describes manual vineyard and harvest work in steep mountain conditions. These
      operating constraints matter to labour planning and costs, but do not establish a universal
      mountain-wine price premium.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_yunnan_2017_blend
    subject_id: n_reg_cn_principle_yunnan_work_blend
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_cn_point_yunnan_2017_blend
    domain_id: winemaking
    assertion_text: Ao Yun’s explicitly dated 2017 blend includes Cabernet Sauvignon, Cabernet Franc, Syrah, Petit
      Verdot and Merlot. This demonstrates one producer’s blending choices, without defining all vintages or
      all Yunnan wines.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_grace_2025_causality
    subject_id: n_reg_cn_principle_grace_2025_comparison
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_cn_point_grace_2025_causality
    domain_id: viticulture
    assertion_text: Grace reports ripening-period rain in Shanxi and both drip changes and differing block vigour
      in Ningxia in 2025. The writer explicitly calls for more seasons before attributing changes to one
      cause.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_grace_2025_logistics
    subject_id: n_reg_cn_principle_grace_2025_comparison
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_cn_point_grace_2025_logistics
    domain_id: business
    assertion_text: In Grace’s 2025 report, Shanxi finished before Ningxia, allowing serial crew work; reception,
      sorting and pressing were scheduled separately. This is dated operational evidence, not a permanent
      regional harvest order.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_case_ningxia_training_budget_action
    subject_id: n_reg_cn_case_ningxia_training_budget
    relation_type: CASE_ACTION
    object_id: n_reg_cn_point_case_ningxia_training_budget_action
    domain_id: viticulture
    assertion_text: A defensible route is a small burial-operability and canopy comparison, recording actual
      labour, damage and spring bud condition. Include establishment payments and recurring work in the
      cash-flow forecast before selecting a whole-block system.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_case_ningxia_training_budget_reason
    subject_id: n_reg_cn_case_ningxia_training_budget
    relation_type: CASE_REASON
    object_id: n_reg_cn_point_case_ningxia_training_budget_reason
    domain_id: viticulture
    assertion_text: The low/slant trunk is intended to simplify lay-down for burial, while training also changes
      canopy exposure. The supplied handling problems justify testing both operating convenience and growth
      rather than relying only on the contractor’s saving projection.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_case_ningxia_training_budget_tradeoff
    subject_id: n_reg_cn_case_ningxia_training_budget
    relation_type: CASE_TRADEOFF
    object_id: n_reg_cn_point_case_ningxia_training_budget_tradeoff
    domain_id: business
    assertion_text: The higher establishment payment buys a possible recurring handling saving, with a canopy
      reconfiguration to assess. Actual saving and crop performance determine the tradeoff; available
      installation funds alone do not establish lifetime profitability.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_case_ningxia_training_budget_limitation
    subject_id: n_reg_cn_case_ningxia_training_budget
    relation_type: CASE_LIMITATION
    object_id: n_reg_cn_point_case_ningxia_training_budget_limitation
    domain_id: viticulture
    assertion_text: Monitor repeated winters and finished-wine performance before broad adoption. The cited
      Yuquanying evidence concerns one cultivar/site/vintage’s canopy and berries, not guaranteed survival,
      wine preference or the contractor’s projected savings.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_case_shandong_water_budget_action
    subject_id: n_reg_cn_case_shandong_water_budget
    relation_type: CASE_ACTION
    object_id: n_reg_cn_point_case_shandong_water_budget_action
    domain_id: business
    assertion_text: Estimate usable inflow, losses, vine demand and payment timing for both options before
      selecting capacity. Protect access and monitor runoff; a staged smaller investment is defensible if the
      larger option’s additional value remains unproven.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_case_shandong_water_budget_reason
    subject_id: n_reg_cn_case_shandong_water_budget
    relation_type: CASE_REASON
    object_id: n_reg_cn_point_case_shandong_water_budget_reason
    domain_id: viticulture
    assertion_text: Monsoon runoff can cause damage yet be unavailable when vines later need supplementary water.
      Long Dai’s storm account and dated storage example illustrate why rain timing and usable retained supply
      must be assessed separately.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_case_shandong_water_budget_tradeoff
    subject_id: n_reg_cn_case_shandong_water_budget
    relation_type: CASE_TRADEOFF
    object_id: n_reg_cn_point_case_shandong_water_budget_tradeoff
    domain_id: business
    assertion_text: The larger pond offers more potential storage but commits additional capital and maintenance
      and consumes access space. Compare usable supply benefits with those supplied costs and operational
      constraints rather than assuming capacity alone guarantees profit.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_case_shandong_water_budget_limitation
    subject_id: n_reg_cn_case_shandong_water_budget
    relation_type: CASE_LIMITATION
    object_id: n_reg_cn_point_case_shandong_water_budget_limitation
    domain_id: viticulture
    assertion_text: The pond example does not quantify this hypothetical catchment’s dependable inflow or future
      demand. Repeated local records and the engineer’s site-specific assessment are needed; neither monsoon
      rain nor available funds establish guaranteed water sufficiency or profitability.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_case_xinjiang_shade_style_action
    subject_id: n_reg_cn_case_xinjiang_shade_style
    relation_type: CASE_ACTION
    object_id: n_reg_cn_point_case_xinjiang_shade_style_action
    domain_id: business
    assertion_text: Retain a limited matched comparison, obtain buyer feedback on the supplied freshness/colour
      tradeoff and calculate yield costs before expanding shade. The buyer’s brief gives a target, while the
      missing tasting and margin evidence prevent a blanket commercial conclusion.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_case_xinjiang_shade_style_reason
    subject_id: n_reg_cn_case_xinjiang_shade_style
    relation_type: CASE_REASON
    object_id: n_reg_cn_point_case_xinjiang_shade_style_reason
    domain_id: viticulture
    assertion_text: The Manas experiment links partial shade with lower temperature and photosynthesis and altered
      ripening. These mechanisms make the supplied slower development plausible, while the pilot’s own
      measurements establish its particular wine-style response.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_case_xinjiang_shade_style_tradeoff
    subject_id: n_reg_cn_case_xinjiang_shade_style
    relation_type: CASE_TRADEOFF
    object_id: n_reg_cn_point_case_xinjiang_shade_style_tradeoff
    domain_id: business
    assertion_text: The supplied fresher pilot also has less colour and lower harvest weight. Assess whether buyer
      acceptance and achievable returns cover the output loss; neither the tasting preference nor shade itself
      guarantees a profitable product.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_case_xinjiang_shade_style_limitation
    subject_id: n_reg_cn_case_xinjiang_shade_style
    relation_type: CASE_LIMITATION
    object_id: n_reg_cn_point_case_xinjiang_shade_style_limitation
    domain_id: winemaking
    assertion_text: Repeat the comparison across seasons and at production scale. The supplied panel preference is
      specific to its samples and brief; the cited study’s chemical indicators do not establish all consumers’
      preferences or superior quality for every shaded Chinese wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_case_yunnan_blend_evidence_action
    subject_id: n_reg_cn_case_yunnan_blend_evidence
    relation_type: CASE_ACTION
    object_id: n_reg_cn_point_case_yunnan_blend_evidence_action
    domain_id: winemaking
    assertion_text: Confirm the blend’s balance in repeated coded production trials, document lot proportions and
      obtain buyer feedback before fixing price and release volume. The supplied blend result supports a
      product trial; it does not establish market acceptance or village authenticity.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_case_yunnan_blend_evidence_reason
    subject_id: n_reg_cn_case_yunnan_blend_evidence
    relation_type: CASE_REASON
    object_id: n_reg_cn_point_case_yunnan_blend_evidence_reason
    domain_id: winemaking
    assertion_text: Ao Yun’s village account shows that elevation and orientation can accompany different
      temperature settings. Here, the supplied acidity and tasting establish the two lots’ complementary
      roles; the regional example does not predict their body or taste automatically.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_case_yunnan_blend_evidence_tradeoff
    subject_id: n_reg_cn_case_yunnan_blend_evidence
    relation_type: CASE_TRADEOFF
    object_id: n_reg_cn_point_case_yunnan_blend_evidence_tradeoff
    domain_id: business
    assertion_text: Keeping parcels separate preserves blending choices but incurs the supplied manual-harvest and
      handling costs. Assess whether the chosen product and buyer response justify those costs; expense alone
      does not establish greater quality or a viable premium.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
  - id: ki_reg_cn_case_yunnan_blend_evidence_limitation
    subject_id: n_reg_cn_case_yunnan_blend_evidence
    relation_type: CASE_LIMITATION
    object_id: n_reg_cn_point_case_yunnan_blend_evidence_limitation
    domain_id: winemaking
    assertion_text: Retain traceable lot records for provenance; coded tasting evaluates the supplied wines, not
      village identity. One vintage’s comparison cannot isolate altitude from exposure and other parcel
      factors or prove a universal mountain quality hierarchy.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:47:12.467Z"
