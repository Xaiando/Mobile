  - id: n_reg_cn_case_ningxia_training_budget
    node_type: production_case
    name: A Ningxia grower is planning a new Cabernet Gernischt block that will need winter protection. A
      contractor offers a conventional vertical system and a low slant-trunk system intended to make
      mechanical soil burial easier. The slant system has a higher quoted establishment cost and a projected
      annual handling saving; both installation quotes fit available funds, but the saving has not been
      demonstrated on this site. Existing blocks have recorded winter bending damage and high handling hours.
      The grower can establish a small comparison, record work and canopy development, monitor winter
      conditions and inspect buds in spring. Neither option guarantees survival. Propose an action, explain a
      reason, weigh a tradeoff and state a limitation before committing the entire block.
  - id: n_reg_cn_point_case_ningxia_training_budget_action
    node_type: learning_point
    name: Pilot training and compare real operations before full commitment
  - id: n_reg_cn_point_case_ningxia_training_budget_reason
    node_type: learning_point
    name: Winter convenience and canopy function are linked
  - id: n_reg_cn_point_case_ningxia_training_budget_tradeoff
    node_type: learning_point
    name: Initial investment competes with possible annual labour savings
  - id: n_reg_cn_point_case_ningxia_training_budget_limitation
    node_type: learning_point
    name: One local comparison cannot assure future winter performance
  - id: n_reg_cn_case_shandong_water_budget
    node_type: production_case
    name: A hypothetical Shandong terraced winery has recorded storm runoff damaging vineyard paths and two later
      dry seasons requiring supplementary vine water. An engineer confirms that either a small retention pond
      or a larger pond can be built and supplies itemised capital and maintenance quotes; both installation
      costs fit current funds. Catchment inflow, storage losses and future seasonal vine demand still need
      assessment, and neither quote is in the operating cash-flow forecast. The larger pond uses space
      currently available for vineyard access. The manager claims monsoon rain makes later irrigation
      unnecessary and that the larger pond must be more profitable. Propose an action, explain a reason, weigh
      a tradeoff and state a limitation.
  - id: n_reg_cn_point_case_shandong_water_budget_action
    node_type: learning_point
    name: Assess seasonal water demand and cash flow before selecting capacity
  - id: n_reg_cn_point_case_shandong_water_budget_reason
    node_type: learning_point
    name: Storm water and later vine water needs occur at different times
  - id: n_reg_cn_point_case_shandong_water_budget_tradeoff
    node_type: learning_point
    name: Extra storage competes with capital, upkeep and vineyard access
  - id: n_reg_cn_point_case_shandong_water_budget_limitation
    node_type: learning_point
    name: An estate example cannot establish this catchment’s future supply
  - id: n_reg_cn_case_xinjiang_shade_style
    node_type: production_case
    name: A Xinjiang Cabernet Sauvignon producer runs a one-vintage split-block trial with partial canopy shade
      and an unshaded control. Cultivar, vine age, crop preparation, irrigation and nutrition are matched. The
      shaded treatment ripens more slowly, has higher measured acidity and lower harvest weight. Matched dry,
      fault-free pilot wines are repeatedly tasted under blind codes; the shaded wine is judged fresher but
      less deeply coloured in these pilots. A buyer’s stated brief asks for fresher acidity with acceptable
      colour, but the buyer has not tasted the pilots. Full-scale yield costs and margins have not been
      calculated. The manager proposes shading every block because a cooler wine must be better. Propose an
      action, explain a reason, weigh a tradeoff and state a limitation.
  - id: n_reg_cn_point_case_xinjiang_shade_style_action
    node_type: learning_point
    name: Use a limited style trial and buyer assessment before blanket shading
  - id: n_reg_cn_point_case_xinjiang_shade_style_reason
    node_type: learning_point
    name: Shade can alter assimilation and ripening as well as heat exposure
  - id: n_reg_cn_point_case_xinjiang_shade_style_tradeoff
    node_type: learning_point
    name: Preferred freshness may compete with crop output and colour targets
  - id: n_reg_cn_point_case_xinjiang_shade_style_limitation
    node_type: learning_point
    name: One vintage and a pilot panel do not define regional quality
  - id: n_reg_cn_case_yunnan_blend_evidence
    node_type: production_case
    name: A Yunnan mountain winery has two Cabernet Sauvignon lots from contrasting village parcels. The lots are
      dry and fault-free and used the same documented fermentation and maturation programme. Measured acidity
      and repeated blind tasting show Lot A has more body and Lot B more freshness. A coded pilot blend meets
      the winery’s stated balance target better than either lot alone. Both lots are available in sufficient
      quantity; blending capacity fits the budget. Separate parcel handling and manual harvest have higher
      recorded costs than consolidating operations, and no buyers have yet evaluated the blend or its proposed
      price. The manager says the highest parcel and highest labour cost guarantee a premium wine and that
      tasting proves village origin. Propose an action, explain a reason, weigh a tradeoff and state a
      limitation.
  - id: n_reg_cn_point_case_yunnan_blend_evidence_action
    node_type: learning_point
    name: Confirm the blend under controlled tasting and test buyer acceptance
  - id: n_reg_cn_point_case_yunnan_blend_evidence_reason
    node_type: learning_point
    name: Village exposure can vary while the actual lots determine the blend
  - id: n_reg_cn_point_case_yunnan_blend_evidence_tradeoff
    node_type: learning_point
    name: Separate mountain lots preserve choices at added operating cost
  - id: n_reg_cn_point_case_yunnan_blend_evidence_limitation
    node_type: learning_point
    name: Blind tasting does not authenticate a village or isolate altitude
