knowledge_items:
  - id: ki_cms_loire_saint_pourcain_location
    subject_id: n_geo_saint_pourcain
    relation_type: LOCATED_IN
    object_id: n_geo_loire_valley
    domain_id: geography
    assertion_text: Saint-Pourçain is a protected wine appellation in Allier's Bourbonnais, in the wider Loire wine region; its designated area spans 19 communes, including Saint-Pourçain-sur-Sioule.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-28T08:00:00.000Z
  - id: ki_cms_loire_cheverny_location
    subject_id: n_geo_cheverny
    relation_type: LOCATED_IN
    object_id: n_geo_loire_valley
    domain_id: geography
    assertion_text: Cheverny is a protected wine appellation south of Blois in Loir-et-Cher, in the Loire wine region. The named town is an orientation reference, not the appellation boundary.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-28T08:00:00.000Z
  - id: ki_cms_loire_orleans_location
    subject_id: n_geo_orleans_aoc
    relation_type: LOCATED_IN
    object_id: n_geo_loire_valley
    domain_id: geography
    assertion_text: Orléans is a protected wine appellation along the Loire in Loiret; its designated area includes the commune of Orléans, but the municipality marker is not a vineyard boundary.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-28T08:00:00.000Z
  - id: ki_cms_loire_saint_pourcain_red_rose
    subject_id: n_cms_loire_principle_saint_pourcain_wines
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_loire_point_saint_pourcain_red_rose
    domain_id: geography
    assertion_text: Saint-Pourçain AOC produces still red, rosé and white wines. Its reds use Gamay and Pinot Noir; the INAO describes red as the largest share of production.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-28T08:00:00.000Z
  - id: ki_cms_loire_saint_pourcain_white
    subject_id: n_cms_loire_principle_saint_pourcain_wines
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_loire_point_saint_pourcain_white
    domain_id: geography
    assertion_text: Saint-Pourçain AOC white wines blend Chardonnay with Tressallier, the local name for Sacy.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-28T08:00:00.000Z
  - id: ki_cms_loire_cheverny_red_rose
    subject_id: n_cms_loire_principle_cheverny_wines
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_loire_point_cheverny_red_rose
    domain_id: geography
    assertion_text: Cheverny AOC produces dry still red, rosé and white wines. Its reds blend Gamay and Pinot Noir.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-28T08:00:00.000Z
  - id: ki_cms_loire_cheverny_white
    subject_id: n_cms_loire_principle_cheverny_wines
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_loire_point_cheverny_white
    domain_id: geography
    assertion_text: Under the Cheverny AOC specification approved on 5 December 2025, white wines blend at least one of Sauvignon Blanc or Sauvignon Gris with at least one complementary grape from Chardonnay, Chenin or Orbois. Chardonnay is a permitted partner, not a compulsory component of every white blend.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-29T23:34:52.000Z
  - id: ki_cms_loire_orleans_red_rose
    subject_id: n_cms_loire_principle_orleans_wines
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_loire_point_orleans_red_rose
    domain_id: geography
    assertion_text: Orléans AOC produces dry still red, rosé and white wines. Its reds blend Meunier (Pinot Meunier) and Pinot Noir.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-28T08:00:00.000Z
  - id: ki_cms_loire_orleans_white
    subject_id: n_cms_loire_principle_orleans_wines
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_loire_point_orleans_white
    domain_id: geography
    assertion_text: Orléans AOC dry white wines are predominantly Chardonnay.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-28T08:00:00.000Z

