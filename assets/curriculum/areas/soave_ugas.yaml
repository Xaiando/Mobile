    subject_id: n_geo_soave_uga_brognoligo
    relation_type: LOCATED_IN
    object_id: n_geo_soave
    domain_id: geography
    assertion_text: "Brognoligo is one of the 33 additional geographical units that may be named on a Soave, Soave Classico or Soave Colli Scaligeri label. The marker is the Brognoligo settlement in Monteforte d'Alpone. It is not the Costalunga unit, and it is not a boundary."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:20:00.000Z"
