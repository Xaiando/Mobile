  - id: n_reg_fm_point_bandol_structure
    node_type: learning_point
    name: Bandol rosé can be pale yet structured
  - id: n_reg_fm_case_picpoul_harvest
    node_type: production_case
    name: A Picpoul de Pinet grower samples a northern Piochs block and a lagoon-facing plateau block on
      the same morning. The sugar readings match, but acidity and flavour development differ. The
      aim is a balanced dry white, and neither block has yet been sampled across its shaded and
      exposed fruit. Propose a defensible harvest-assessment step, explain why one shared date is
      uncertain, and discuss a tradeoff and a limitation.
  - id: n_reg_fm_point_case_picpoul_harvest_action
    node_type: learning_point
    name: Resample Picpoul blocks representatively before choosing their harvest dates
  - id: n_reg_fm_point_case_picpoul_harvest_reason
    node_type: learning_point
    name: Picpoul site differences and several maturity dimensions matter
  - id: n_reg_fm_point_case_picpoul_harvest_tradeoff
    node_type: learning_point
    name: Separate Picpoul decisions improve targeting but complicate harvest logistics
  - id: n_reg_fm_point_case_picpoul_harvest_limitation
    node_type: learning_point
    name: Picpoul’s regional tendency cannot replace representative block data
  - id: n_reg_fm_case_faugeres_pests
    node_type: production_case
    name: A Faugères grower confirms that last season’s berry damage came from the moth species targeted
      by a local mating-disruption programme. A coordinated plan for next season offers pheromone
      dispensers and repeated monitoring, with installation labour in the budget. Another adviser
      claims that this programme will remove the need to check all other pests and diseases. Propose
      a defensible planning response, give the mechanism, and explain one tradeoff and one
      limitation without prescribing pesticide use.
  - id: n_reg_fm_point_case_faugeres_pests_action
    node_type: learning_point
    name: Assess the targeted Faugères plan while retaining wider vineyard surveillance
  - id: n_reg_fm_point_case_faugeres_pests_reason
    node_type: learning_point
    name: Pheromone disruption hinders target moth mating
  - id: n_reg_fm_point_case_faugeres_pests_tradeoff
    node_type: learning_point
    name: Targeted Faugères management still requires installation and monitoring labour
  - id: n_reg_fm_point_case_faugeres_pests_limitation
    node_type: learning_point
    name: A Faugères programme still needs pest-pressure and coverage assessment
  - id: n_reg_fm_case_collioure_maintenance
    node_type: production_case
    name: A Collioure producer finds erosion and damaged retaining walls after intense autumn rain on a
      steep terraced block. A qualified site assessment recommends repairs to preserve the vineyard;
      narrow access limits machinery. The producer has cost estimates but no evidence that repairs
      will raise bottle quality or customers’ willingness to pay. Explain a defensible operational
      assessment, the terrain mechanism, a tradeoff and a limitation.
  - id: n_reg_fm_point_case_collioure_maintenance_action
    node_type: learning_point
    name: Evaluate Collioure repairs and costs from the supplied site assessment
  - id: n_reg_fm_point_case_collioure_maintenance_reason
    node_type: learning_point
    name: Collioure terraces resist erosion while narrow access restricts mechanisation
  - id: n_reg_fm_point_case_collioure_maintenance_tradeoff
    node_type: learning_point
    name: Repair expense supports vineyard continuity but puts pressure on returns
  - id: n_reg_fm_point_case_collioure_maintenance_limitation
    node_type: learning_point
    name: Collioure repair costs cannot prove a sensory or market premium
  - id: n_reg_fm_case_rose_selection
    node_type: production_case
    name: A Provence producer trials direct pressing and controlled pre-fermentation skin maceration on
      the same sound fruit. Both trials meet the desired balance and freshness, but the direct-press
      trial is paler. Customers have asked for a pale rosé, while the cellar can manage either
      method within budget. Propose a defensible selection, explain the colour mechanism, and
      discuss a tradeoff and a limitation.
  - id: n_reg_fm_point_case_rose_selection_action
    node_type: learning_point
    name: Select the Provence rosé trial for its supplied sensory and customer aim
  - id: n_reg_fm_point_case_rose_selection_reason
    node_type: learning_point
    name: Different skin-contact treatment can explain the Provence trial colours
  - id: n_reg_fm_point_case_rose_selection_tradeoff
    node_type: learning_point
    name: The pale Provence choice forgoes the other trial’s expression
  - id: n_reg_fm_point_case_rose_selection_limitation
    node_type: learning_point
    name: One Provence rosé trial and pale colour cannot establish general quality
