# Original selected French Mediterranean explanations and conditional cases; all await qualified review.
# MCQ disabled: qualified site/style explanations and defensible case decisions admit alternatives.
# Dates record curation, not the start of environmental conditions or legal validity.
# Selected still-wine scope; no geographic nodes, containment or complete legal permission lists.
