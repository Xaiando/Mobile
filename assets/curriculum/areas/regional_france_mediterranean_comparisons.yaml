knowledge_items:
  - id: ki_reg_fm_languedoc_mediterranean
    subject_id: n_reg_fm_principle_languedoc_climate
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fm_point_languedoc_mediterranean
    domain_id: geography
    assertion_text: Languedoc has predominantly Mediterranean conditions, with hot dry summers and
      generally milder other seasons. This is a regional starting point for ripening and water
      assessment, not a prediction of every plot or vintage.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_languedoc_west
    subject_id: n_reg_fm_principle_languedoc_climate
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fm_point_languedoc_west
    domain_id: geography
    assertion_text: At the western end of Languedoc, Cabardès and Limoux combine Mediterranean and
      oceanic influences. A regional comparison should therefore distinguish these western settings
      from a uniformly hot, dry interpretation of the entire region.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_picpoul_variety
    subject_id: n_reg_fm_principle_picpoul_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fm_point_picpoul_variety
    domain_id: viticulture
    assertion_text: Piquepoul Blanc is the white grape associated with Picpoul de Pinet beside the Thau
      lagoon. The syndicate describes a long, relatively late growing cycle and retention of
      pronounced acidity at maturity; actual picking decisions still require fruit assessment.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_picpoul_exposure
    subject_id: n_reg_fm_principle_picpoul_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fm_point_picpoul_exposure
    domain_id: geography
    assertion_text: Picpoul de Pinet includes northern limestone hillocks whose relief attenuates
      maritime influence and a lower plateau extending towards Thau. Late-summer maritime air and
      local exposure matter, so proximity to a lagoon does not establish identical growing
      conditions in every vineyard.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_cabardes_climate
    subject_id: n_reg_fm_principle_cabardes_transition
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fm_point_cabardes_climate
    domain_id: geography
    assertion_text: Cabardès lies on the Montagne Noire foothills northwest of Carcassonne, in a
      transition between Mediterranean and Atlantic influences. This is a useful within-Languedoc
      contrast, not an entirely oceanic label or a fixed sensory prediction.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_cabardes_grapes
    subject_id: n_reg_fm_principle_cabardes_transition
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fm_point_cabardes_grapes
    domain_id: geography
    assertion_text: The INAO profile associates Cabardès with Merlot and cabernets alongside Syrah and
      Grenache. Their presence makes grape composition part of the comparison with
      Mediterranean-dominant Languedoc blends; climate alone cannot explain every difference between
      the finished wines.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_pic_climate
    subject_id: n_reg_fm_principle_pic_saint_loup
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fm_point_pic_climate
    domain_id: geography
    assertion_text: Pic Saint Loup lies north of Montpellier near the Cévennes foothills. Its syndicate
      describes Mediterranean and continental influences, relatively wet autumns and winters, and
      marked day–night temperature differences around veraison; neither ripeness nor freedom from
      water stress is guaranteed.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_pic_syrah
    subject_id: n_reg_fm_principle_pic_saint_loup
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fm_point_pic_syrah
    domain_id: geography
    assertion_text: Syrah is prominent in Pic Saint Loup, with Grenache and Mourvèdre also important in
      its red and rosé expressions. These grape associations and local growing conditions offer a
      basis for comparison, while proportions and producer choices remain necessary to explain an
      actual bottle.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_larzac_nights
    subject_id: n_reg_fm_principle_larzac_variation
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fm_point_larzac_nights
    domain_id: geography
    assertion_text: Terrasses du Larzac lies around the Larzac foothills and Hérault terraces. Its
      syndicate describes Mediterranean conditions moderated by the nearby plateau, including
      relatively fresh nights; this specific local influence does not mean every elevated vineyard
      is always cool.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_larzac_soils
    subject_id: n_reg_fm_principle_larzac_variation
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fm_point_larzac_soils
    domain_id: geography
    assertion_text: Terrasses du Larzac has varied sedimentary soils and red-wine grape associations
      including Grenache, Mourvèdre, Syrah and Carignan. Soil variation, grape composition and
      producer practice must be considered together; geological names do not directly supply wine
      flavours or quality rankings.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_faugeres_water
    subject_id: n_reg_fm_principle_faugeres_viticulture
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fm_point_faugeres_water
    domain_id: viticulture
    assertion_text: The Faugères syndicate describes roots using fissures in its schist bedrock to reach
      water. This is a physical growing-condition explanation that still requires plot assessment;
      it does not prove immunity to drought or transfer a mineral flavour into the wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_faugeres_targeted
    subject_id: n_reg_fm_principle_faugeres_viticulture
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fm_point_faugeres_targeted
    domain_id: viticulture
    assertion_text: Faugères growers use pheromone dispensers that hinder male moths locating females,
      aiming to reduce subsequent grape damage. The method targets particular moth pests and
      requires surveillance; it is not a treatment for every insect or vine disease.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_roussillon_seasons
    subject_id: n_reg_fm_principle_roussillon_conditions
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fm_point_roussillon_seasons
    domain_id: geography
    assertion_text: Roussillon lies between the Mediterranean and mountain ranges in the
      Pyrénées-Orientales. Its Mediterranean climate has hot summers and rainfall concentrated in
      spring and autumn, so a broad sunny-climate label does not remove seasonal or site-specific
      water concerns.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_roussillon_wind
    subject_id: n_reg_fm_principle_roussillon_conditions
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fm_point_roussillon_wind
    domain_id: viticulture
    assertion_text: The Tramontane is a prominent dry northerly wind in Roussillon. Dry air can limit
      humidity-related disease pressure, but local conditions, weather and surveillance still
      matter; the wind does not guarantee disease-free fruit or eliminate the need for a management
      plan.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_roussillon_colours
    subject_id: n_reg_fm_principle_roussillon_styles
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fm_point_roussillon_colours
    domain_id: geography
    assertion_text: Côtes du Roussillon includes white, rosé and red still wines. White references
      include Grenache Blanc, Macabeu and Tourbat, while Grenache Noir, Carignan, Syrah and
      Mourvèdre are red-wine associations; select the actual colour and blend before comparing
      styles.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_villages_red
    subject_id: n_reg_fm_principle_roussillon_styles
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fm_point_villages_red
    domain_id: geography
    assertion_text: Côtes du Roussillon Villages supplies a red still-wine comparison with Grenache,
      Carignan, Syrah and Mourvèdre among its grape associations and varied river-terrace and
      hillside settings. The word Villages alone does not establish superior quality over every
      broader Côtes du Roussillon wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_maury_dry
    subject_id: n_reg_fm_principle_maury_sec
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fm_point_maury_dry
    domain_id: geography
    assertion_text: Maury Sec is a dry red-wine reference northwest of Perpignan, with Grenache Noir
      prominent and other varieties contributing to blends. The full wine name and category should
      be checked rather than assuming every wine from Maury is sweet or fortified.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_maury_structure
    subject_id: n_reg_fm_principle_maury_sec
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fm_point_maury_structure
    domain_id: winemaking
    assertion_text: The CIVR describes Maury Sec with dark-fruit expression, substantial volume and
      tannin, influenced by maturation. Assess the actual wine’s balance and production history; a
      regional description does not guarantee identical extraction, oak treatment or ageing
      potential in every bottle.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_collioure_erosion
    subject_id: n_reg_fm_principle_collioure_terraces
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fm_point_collioure_erosion
    domain_id: viticulture
    assertion_text: Collioure’s Côte Vermeille setting combines steep coastal terrain with dry summers
      and potentially intense spring or autumn rain. Terrace construction helps resist soil erosion;
      these conditions require attention to each plot rather than a claim that schist itself
      guarantees wine quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_collioure_work
    subject_id: n_reg_fm_principle_collioure_terraces
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fm_point_collioure_work
    domain_id: business
    assertion_text: Collioure’s terrace system preserves soil on steep slopes, and the historical
      specification notes that terraces are rarely mechanisable. Where a producer documents extra
      maintenance or hand work, include it in costs; difficult terrain alone does not prove a higher
      sensory-quality rating.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_provence_maritime
    subject_id: n_reg_fm_principle_provence_climate
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fm_point_provence_maritime
    domain_id: geography
    assertion_text: Provence has Mediterranean conditions and varied coastal and interior settings.
      Maritime influence and topography can alter local growing conditions, so neither one
      warm-climate label nor the presence of the Mistral fully describes every vineyard.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_varois_inland
    subject_id: n_reg_fm_principle_provence_climate
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fm_point_varois_inland
    domain_id: geography
    assertion_text: Around Brignoles, Coteaux Varois en Provence includes interior basins and narrow
      valleys shielded from maritime influence by surrounding ranges. The CIVP describes more
      continental seasonal contrasts, including hot summers and colder winters; elevation alone does
      not establish a cool growing season.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_rose_direct
    subject_id: n_reg_fm_principle_rose_methods
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fm_point_rose_direct
    domain_id: winemaking
    assertion_text: Direct pressing separates juice without a separate pre-maceration period, although
      colour can still transfer from skins during pressing. In Provence this method tends to give
      paler rosés than skin maceration; grape material, pressing and temperature still affect the
      result.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_rose_maceration
    subject_id: n_reg_fm_principle_rose_methods
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fm_point_rose_maceration
    domain_id: winemaking
    assertion_text: Controlled pre-fermentation skin contact extracts pigments and flavours before the
      juice is pressed off. The Provence method choice depends on fruit condition, ripeness, grape
      composition and intended sensory profile; stronger colour is not by itself a judgement of
      higher or lower quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_rose_ripeness
    subject_id: n_reg_fm_principle_rose_harvest
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fm_point_rose_ripeness
    domain_id: viticulture
    assertion_text: For vineyards specialising in Provence rosé, harvest decisions consider the intended
      alcohol–acidity balance and grape condition. The CIVP describes picking often earlier than for
      red or white aims; this is a style-related tendency, not a universal date or a rule that
      earlier always means better.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_rose_cooling
    subject_id: n_reg_fm_principle_rose_harvest
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fm_point_rose_cooling
    domain_id: business
    assertion_text: The CIVP describes early-morning harvesting and keeping Provence rosé fruit cool to
      limit deterioration. Cooler incoming fruit can require less cellar cooling energy; evaluate
      the actual labour, transport, equipment and schedule rather than assuming identical savings
      for all producers.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_bandol_late
    subject_id: n_reg_fm_principle_bandol_mourvedre
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fm_point_bandol_late
    domain_id: viticulture
    assertion_text: Mourvèdre is a late-ripening reference for Bandol, where sunlight, maritime
      influences and local exposure help frame a ripening assessment. Check the fruit and season
      rather than treating a southern coastal origin as a guarantee of complete maturity.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_bandol_structure
    subject_id: n_reg_fm_principle_bandol_mourvedre
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fm_point_bandol_structure
    domain_id: winemaking
    assertion_text: Bandol’s growers associate Mourvèdre with tannic structure in red wines and describe
      structured pale rosés from direct pressing, with Grenache and Cinsault also contributing.
      Colour, tannin and intended use must be compared separately; pale colour does not mean every
      rosé is structurally light.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_case_picpoul_harvest_action
    subject_id: n_reg_fm_case_picpoul_harvest
    relation_type: CASE_ACTION
    object_id: n_reg_fm_point_case_picpoul_harvest_action
    domain_id: viticulture
    assertion_text: Resample each block across representative fruit positions and exposures, checking
      sugar, acidity, pH and flavour development. Use block results, fruit health and forecast
      conditions to assess separate harvest dates for the stated dry-white aim.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_case_picpoul_harvest_reason
    subject_id: n_reg_fm_case_picpoul_harvest
    relation_type: CASE_REASON
    object_id: n_reg_fm_point_case_picpoul_harvest_reason
    domain_id: viticulture
    assertion_text: The regional source describes differences in maritime exposure between the northern
      relief and lagoon-facing plateau. Equal sugar cannot establish equal acid or flavour
      readiness, especially when the supplied samples differ and do not yet represent all fruit
      exposures.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_case_picpoul_harvest_tradeoff
    subject_id: n_reg_fm_case_picpoul_harvest
    relation_type: CASE_TRADEOFF
    object_id: n_reg_fm_point_case_picpoul_harvest_tradeoff
    domain_id: business
    assertion_text: Separate decisions can better target the two blocks’ balance, but require additional
      sampling and potentially separate harvest operations. Waiting for flavour progress also leaves
      fruit exposed to weather or damage; assess those consequences alongside labour availability.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_case_picpoul_harvest_limitation
    subject_id: n_reg_fm_case_picpoul_harvest
    relation_type: CASE_LIMITATION
    object_id: n_reg_fm_point_case_picpoul_harvest_limitation
    domain_id: viticulture
    assertion_text: The present samples are incomplete and the case supplies no pH, weather outlook or
      fruit-health assessment. Piquepoul’s acidity-retention tendency and a plot’s proximity to Thau
      cannot establish one optimal date for both blocks.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_case_faugeres_pests_action
    subject_id: n_reg_fm_case_faugeres_pests
    relation_type: CASE_ACTION
    object_id: n_reg_fm_point_case_faugeres_pests_action
    domain_id: viticulture
    assertion_text: Assess participation with the qualified local adviser, retaining monitoring and
      separate checks for other pests and diseases. Plan timing and coverage before the next
      season’s flights; the supplied target match and installation budget do not justify abandoning
      wider surveillance.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_case_faugeres_pests_reason
    subject_id: n_reg_fm_case_faugeres_pests
    relation_type: CASE_REASON
    object_id: n_reg_fm_point_case_faugeres_pests_reason
    domain_id: viticulture
    assertion_text: Pheromone dispensers make it harder for target male moths to locate females. This
      aims to reduce mating and the next generation’s berry damage, rather than acting as a general
      cure for every organism in the vineyard.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_case_faugeres_pests_tradeoff
    subject_id: n_reg_fm_case_faugeres_pests
    relation_type: CASE_TRADEOFF
    object_id: n_reg_fm_point_case_faugeres_pests_tradeoff
    domain_id: business
    assertion_text: The targeted method can reduce reliance on broad insect-control interventions for
      this pest, but installing dispensers and repeated insect counts consume labour. The supplied
      budget addresses installation only; include continuing surveillance in the operational
      assessment.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_case_faugeres_pests_limitation
    subject_id: n_reg_fm_case_faugeres_pests
    relation_type: CASE_LIMITATION
    object_id: n_reg_fm_point_case_faugeres_pests_limitation
    domain_id: viticulture
    assertion_text: Effectiveness depends on initial pest pressure and coordinated coverage as well as
      the target match. The case lacks those details, and outcomes need monitoring; no conclusion
      about all other pests, diseases or required treatments follows.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_case_collioure_maintenance_action
    subject_id: n_reg_fm_case_collioure_maintenance
    relation_type: CASE_ACTION
    object_id: n_reg_fm_point_case_collioure_maintenance_action
    domain_id: business
    assertion_text: Use the qualified assessment to plan repairs and establish labour, access, timing
      and cost implications. Evaluate how the added expense fits the business; the premise supplies
      a vineyard-preservation need, not a demonstrated quality premium.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_case_collioure_maintenance_reason
    subject_id: n_reg_fm_case_collioure_maintenance
    relation_type: CASE_REASON
    object_id: n_reg_fm_point_case_collioure_maintenance_reason
    domain_id: viticulture
    assertion_text: Steep terrain and intense rain can cause erosion, while terrace walls help retain
      soil. Restricted mechanisation can add hand-work needs; these mechanisms connect the supplied
      damage and repairs without claiming that rock chemistry creates wine flavour.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_case_collioure_maintenance_tradeoff
    subject_id: n_reg_fm_case_collioure_maintenance
    relation_type: CASE_TRADEOFF
    object_id: n_reg_fm_point_case_collioure_maintenance_tradeoff
    domain_id: business
    assertion_text: Repair expense supports continued vineyard use, while higher costs put pressure on
      returns at a given selling price and volume. Explore costs and pricing with customer evidence
      rather than assuming every added euro can be passed on.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_case_collioure_maintenance_limitation
    subject_id: n_reg_fm_case_collioure_maintenance
    relation_type: CASE_LIMITATION
    object_id: n_reg_fm_point_case_collioure_maintenance_limitation
    domain_id: business
    assertion_text: Cost estimates and difficult access do not establish improved sensory quality or
      greater willingness to pay. Demand and wine assessment require their own evidence; this
      hypothetical case supplies neither a real market price nor a guaranteed premium.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_case_rose_selection_action
    subject_id: n_reg_fm_case_rose_selection
    relation_type: CASE_ACTION
    object_id: n_reg_fm_point_case_rose_selection_action
    domain_id: winemaking
    assertion_text: If the supplied trial and customer preference are confirmed, favour direct pressing
      for the requested paler style. Keep balance and freshness in the assessment rather than
      selecting by colour alone.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_case_rose_selection_reason
    subject_id: n_reg_fm_case_rose_selection
    relation_type: CASE_REASON
    object_id: n_reg_fm_point_case_rose_selection_reason
    domain_id: winemaking
    assertion_text: The trials share sound fruit but differ in skin-contact treatment. Pre-fermentation
      maceration extracts pigments and flavours before pressing, whereas direct pressing usually
      gives a lighter colour; the case’s observed difference is consistent with that mechanism.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_case_rose_selection_tradeoff
    subject_id: n_reg_fm_case_rose_selection
    relation_type: CASE_TRADEOFF
    object_id: n_reg_fm_point_case_rose_selection_tradeoff
    domain_id: winemaking
    assertion_text: Choosing the paler trial meets the supplied preference but gives up the other
      trial’s deeper colour and any different flavour expression confirmed by tasting, which a
      different customer segment might value. Neither method is universally preferable.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
  - id: ki_reg_fm_case_rose_selection_limitation
    subject_id: n_reg_fm_case_rose_selection
    relation_type: CASE_LIMITATION
    object_id: n_reg_fm_point_case_rose_selection_limitation
    domain_id: winemaking
    assertion_text: The case states that both trials meet balance and freshness. Paler colour therefore
      does not establish better quality, and one fruit lot cannot set the best method for every
      variety, harvest condition or customer group.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:15:23.000Z
