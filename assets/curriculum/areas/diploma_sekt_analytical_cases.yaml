      "domain_id": "winemaking",
      "assertion_text": "Lot C meets the 18-month target window and VDP.SEKT lees requirement, whereas Lot D requires 38 months to fulfill the Prestige profile and would miss the deadline. The parcel variations and differing lees durations confound direct quality ranking without standardized disgorgement and dosage trials.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-01T02:34:06.539Z"
    },
    {
      "id": "ki_d4sekt_case_extended_lees_positioning_tradeoff",
      "subject_id": "n_d4sekt_case_extended_lees_positioning",
      "relation_type": "CASE_TRADEOFF",
