  "knowledge_items": [
    {
      "id": "ki_d4sekt_origin_hierarchy",
      "subject_id": "n_d4sekt_principle_origin_hierarchy",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d4sekt_point_origin_hierarchy",
      "domain_id": "winemaking",
      "assertion_text": "Under German wine regulations and DWI specifications, generic Sekt permits base wine sourced from any EU country with second fermentation in Germany. Deutscher Sekt requires 100% German-harvested base wine. Deutscher Sekt b.A. restricts grape origin to one of the 13 specified Anbaugebiete and must pass official testing to receive an Amtliche Prüfungsnummer (A.P.-Nr.). A generic Sekt label does not establish German grape origin.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-01T02:34:06.539Z"
    },
    {
      "id": "ki_d4sekt_winzersekt_standards",
      "subject_id": "n_d4sekt_principle_winzersekt_standards",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d4sekt_point_winzersekt_standards",
      "domain_id": "winemaking",
      "assertion_text": "Winzersekt represents estate-produced sparkling wine under DWI regulations. All base grapes must be grown by the producer or member cooperative, vinified by traditional bottle fermentation (Klassische Flaschengärung), matured on lees for a minimum of nine months, disgorged, and labelled with the grape variety, vintage year, and producer name. Winzersekt defines method and estate origin; sensory balance still requires lot evaluation.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-01T02:34:06.539Z"
    },
    {
      "id": "ki_d4sekt_vdp_classification",
      "subject_id": "n_d4sekt_principle_vdp_classification",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d4sekt_point_vdp_classification",
      "domain_id": "winemaking",
      "assertion_text": "The private VDP.SEKT classification framework establishes stricter production rules for member estates: traditional bottle fermentation, estate-grown fruit, hand picking, and whole-bunch pressing. VDP.SEKT requires at least 15 months on lees (24 months for vintage releases), while VDP.SEKT.PRESTIGE requires single-vineyard origin (Erste Lage or Grosse Lage) and a minimum of 36 months on lees. These association standards indicate production commitments, not an official statutory guarantee across all producers.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-01T02:34:06.539Z"
    },
    {
      "id": "ki_d4sekt_base_wine_selection",
      "subject_id": "n_d4sekt_principle_base_wine_selection",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d4sekt_point_base_wine_selection",
      "domain_id": "winemaking",
      "assertion_text": "Base wines for German sparkling production require early harvest to capture healthy, botrytis-free grapes with preserved high natural acidity and moderate potential alcohol (around 9.5% to 11.5% abv), leaving headroom for second fermentation (+1.2–1.5% abv). Whole-cluster gentle pneumatic pressing separates the delicate cuvée fraction from phenolic press fractions. Grapes with late-harvest botrytis or overripe phenolic extraction compromise foam stability and sparkling longevity.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-01T02:34:06.539Z"
    },
    {
      "id": "ki_d4sekt_autolysis_vs_fruit",
      "subject_id": "n_d4sekt_principle_autolysis_vs_fruit",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d4sekt_point_autolysis_vs_fruit",
      "domain_id": "winemaking",
      "assertion_text": "Tank (autoclave/Charmat) fermentation preserves primary varietal aromatics (such as green apple, peach and floral notes in aromatic Riesling) with fast cellar turnaround and lower working capital. Traditional bottle fermentation subjects the wine to extended yeast autolysis (starting around 9–12 months), releasing mannoproteins and amino acids that enrich texture, soften the perception of cool-climate acidity, and introduce brioche and biscuit notes while muting primary fruit.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-01T02:34:06.539Z"
    },
    {
      "id": "ki_d4sekt_dosage_style",
      "subject_id": "n_d4sekt_principle_dosage_style",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d4sekt_point_dosage_style",
      "domain_id": "winemaking",
      "assertion_text": "Under EU and German sparkling wine regulations, sweetness categories range from Brut Nature (<3 g/L without added sugar) and Extra Brut (0–6 g/L) to Brut (<12 g/L), Extra Trocken (12–17 g/L) and Trocken (17–32 g/L). High natural cool-climate German acidity often requires judicious liqueur d'expédition dosage to achieve harmonious sensory balance; however, dosage cannot conceal oxidation, premature autolytic decay, or harsh phenolic press fractions.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-01T02:34:06.539Z"
    },
    {
      "id": "ki_d4sekt_case_winzersekt_allocation_action",
      "subject_id": "n_d4sekt_case_winzersekt_allocation",
      "relation_type": "CASE_ACTION",
      "object_id": "n_d4sekt_case_winzersekt_allocation_action",
      "domain_id": "winemaking",
      "assertion_text": "Progress Lot A as a conditional pilot for the autolytic brief, complete required A.P.-Nr. testing and stability checks, accept the prepaid merchant order to cover immediate operational needs, and verify distributor creditworthiness before committing inventory to extended payment terms.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-01T02:34:06.539Z"
    },
    {
      "id": "ki_d4sekt_case_winzersekt_allocation_reason",
      "subject_id": "n_d4sekt_case_winzersekt_allocation",
      "relation_type": "CASE_REASON",
      "object_id": "n_d4sekt_case_winzersekt_allocation_reason",
      "domain_id": "winemaking",
      "assertion_text": "The 10-month traditional lees aging of Lot A aligns with the Winzersekt autolytic brief and deadline; Lot B's tank method preserves fruit rather than autolysis. The different terroir lots and secondary fermentation routes represent confounded variables that prevent attributing sensory differences to lees aging alone.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-01T02:34:06.539Z"
    },
    {
      "id": "ki_d4sekt_case_winzersekt_allocation_tradeoff",
      "subject_id": "n_d4sekt_case_winzersekt_allocation",
      "relation_type": "CASE_TRADEOFF",
      "object_id": "n_d4sekt_case_winzersekt_allocation_tradeoff",
      "domain_id": "winemaking",
      "assertion_text": "The prepaid merchant order yields immediate cash flow to meet the impending 24-day lease payment but demands estate promotional labour and leaves unsold stock; the distributor order absorbs volume but ties up working capital, delays cash collection beyond the payment deadline, and exposes the estate to unverified credit risk.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-01T02:34:06.539Z"
    },
    {
      "id": "ki_d4sekt_case_winzersekt_allocation_limitation",
      "subject_id": "n_d4sekt_case_winzersekt_allocation",
      "relation_type": "CASE_LIMITATION",
      "object_id": "n_d4sekt_case_winzersekt_allocation_limitation",
      "domain_id": "winemaking",
      "assertion_text": "Official A.P.-Nr. quality wine certification, repeat panel and cold stability data, full bottle-cost accounting, distributor downstream sell-through rates, and estate staffing capacity remain unconfirmed and cannot be inferred from the preliminary trial.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-01T02:34:06.539Z"
    },
    {
      "id": "ki_d4sekt_case_extended_lees_positioning_action",
      "subject_id": "n_d4sekt_case_extended_lees_positioning",
      "relation_type": "CASE_ACTION",
      "object_id": "n_d4sekt_case_extended_lees_positioning_action",
      "domain_id": "winemaking",
      "assertion_text": "Disgorge and release Lot C conditionally for the 18-month restaurant brief, secure the prepaid gastronomy contract to assist near-term cash requirements, and maintain Lot D on lees until maturity while verifying export market demand and distributor credit before committing the extended inventory.",
      "verification_status": "unverified",
      "mcq_disabled": true,
