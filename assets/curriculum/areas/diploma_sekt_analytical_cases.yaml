    {
      "id": "n_d4sekt_case_winzersekt_allocation",
      "node_type": "production_case",
      "name": "An invented estate in the Pfalz has sound, hand-picked Riesling lots from the same harvest: one lot from a sheltered sandstone terrace and another from a loess slope. The estate brief is a brisk, autolytic sparkling wine for release in 12 months. Lot A underwent traditional bottle fermentation (Klassische Flaschengärung) with estate fruit, currently planned for 10 months on lees and disgorgement in month 11. Lot B was vinified by contract pressurised tank fermentation (Deutscher Sekt b.A.) for rapid release in week 8. A preliminary coded sensory panel judges Lot A closer to the autolytic brief; Lot B is judged fruit-forward and simpler. A specialised wine merchant offers a prepaid order for 360 bottles at a premium unit price with required estate staff attendance at two promotional tastings. A regional wholesale distributor requests an allocation of 2,400 bottles of Lot B with payment 60 days after shipment, but provides no credit history or account sell-through data. A bottling and press leasing instalment of 8,500 EUR is due in 24 days. Liquid cash balances, full production cost accounting, repeat panel stability records, official A.P.-Nr. certification for the lots, and distributor credit references are missing. All lots, methods, timings, volumes and financial terms are fictional and do not represent statutory norms or guaranteed returns. Recommend a conditional production and sales action, explain the technical and comparative evidence, weigh the operational and commercial tradeoffs, and identify the unresolved variables that must be verified."
    },
    {
      "id": "n_d4sekt_case_winzersekt_allocation_action",
      "node_type": "learning_point",
      "name": "Progress Lot A as a conditional pilot for the autolytic brief, complete required A.P.-Nr. testing and stability checks, accept the prepaid merchant order to cover immediate operational needs, and verify distributor creditworthiness before committing inventory to extended payment terms"
    },
    {
      "id": "n_d4sekt_case_winzersekt_allocation_reason",
      "node_type": "learning_point",
      "name": "The 10-month traditional lees aging of Lot A aligns with the Winzersekt autolytic brief and deadline; Lot B's tank method preserves fruit rather than autolysis. The different terroir lots and secondary fermentation routes represent confounded variables that prevent attributing sensory differences to lees aging alone"
    },
    {
      "id": "n_d4sekt_case_winzersekt_allocation_tradeoff",
      "node_type": "learning_point",
      "name": "The prepaid merchant order yields immediate cash flow to meet the impending 24-day lease payment but demands estate promotional labour and leaves unsold stock; the distributor order absorbs volume but ties up working capital, delays cash collection beyond the payment deadline, and exposes the estate to unverified credit risk"
    },
    {
      "id": "n_d4sekt_case_winzersekt_allocation_limitation",
      "node_type": "learning_point",
      "name": "Official A.P.-Nr. quality wine certification, repeat panel and cold stability data, full bottle-cost accounting, distributor downstream sell-through rates, and estate staffing capacity remain unconfirmed and cannot be inferred from the preliminary trial"
    },
    {
      "id": "n_d4sekt_case_extended_lees_positioning",
      "node_type": "production_case",
      "name": "An invented Rheingau estate evaluates two vintage Pinot Noir and Chardonnay sparkling base blends from single-vineyard parcels. The strategic brief is a high-prestige sparkling cuvée for on-premise gastronomy placement in 18 months. Lot C has completed 15 months on lees in bottle (conforming to the baseline VDP.SEKT standard), with estimated sensory readiness and disgorgement in month 16. Lot D is held for extended 36-month lees aging (conforming to the VDP.SEKT.PRESTIGE benchmark), estimated ready for market release in month 38. A preliminary sensory panel finds Lot C shows crisp citrus, red berry and light pastry notes, ready for near-term service; Lot D is judged tightly wound with developing yeast autolysis and chalky minerality, but unready for release within the 18-month target. A luxury fine-dining restaurant group offers a standing prepaid order for 240 bottles of Lot C with sommelier training workshops. An export broker requests 1,800 bottles of Lot D on a 90-day consignment/credit arrangement for an overseas market, without providing secondary market price realisation or account sell-through history. A cellar storage and climate-control lease invoice falls due in 30 days. Liquid reserves, total cellaring and inventory holding costs, disgorgement dosage trials, formal association certification, and overseas broker solvency are unknown. All parameters are fictional. Recommend a conditional commercial and cellar action, explain the enological and timing evidence, weigh the working-capital and channel tradeoffs, and specify the critical factors that require formal verification."
    },
    {
      "id": "n_d4sekt_case_extended_lees_positioning_action",
      "node_type": "learning_point",
      "name": "Disgorge and release Lot C conditionally for the 18-month restaurant brief, secure the prepaid gastronomy contract to assist near-term cash requirements, and maintain Lot D on lees until maturity while verifying export market demand and distributor credit before committing the extended inventory"
    },
    {
      "id": "n_d4sekt_case_extended_lees_positioning_reason",
      "node_type": "learning_point",
      "name": "Lot C meets the 18-month target window and VDP.SEKT lees requirement, whereas Lot D requires 38 months to fulfill the Prestige profile and would miss the deadline. The parcel variations and differing lees durations confound direct quality ranking without standardized disgorgement and dosage trials"
    },
    {
      "id": "n_d4sekt_case_extended_lees_positioning_tradeoff",
      "node_type": "learning_point",
      "name": "The restaurant allocation generates upfront cash to meet the 30-day lease bill but requires winery training resources and moves modest volume; the export consignment contract moves larger volume but ties up substantial working capital for 38+ months, defers cash collection by 90 days, and concentrates exposure in an unproven overseas channel"
    },
    {
      "id": "n_d4sekt_case_extended_lees_positioning_limitation",
      "node_type": "learning_point",
      "name": "Association certification status, repeat disgorgement dosage trials, full inventory holding and riddling costs, export account sell-through evidence, and winery labour capacity remain unverified and cannot be substituted by prestige label terminology"
    }
  ],
