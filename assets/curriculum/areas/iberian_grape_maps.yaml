# Spanish mapped appellations: complete neutral legal grape unions, checked 26 September 2026.
# Includes historical and conditional varieties so map clues never classify them as prohibited.
# Core/secondary mappings are editorial study priorities; source-backed items remain unverified.
# 1900-01-01 is the project sentinel for uncurated effective dates, not an assertion of historical law.
# Ribera Pirulé (Jaén) is a qualified legal entry; no unsupported identity with Portuguese Jaen/Mencía is asserted.
# Palomino and Listán Blanco/Palomino Fino remain distinct legal entries in the May 2026 Jerez register.
# Torrontés (Galicia) is separate from Rioja Turruntés/Albillo Mayor and Argentine Torrontés.
# The Cava completeness citation uses the live MAPA register; council harvest-2024 spec URL now returns 404.

# Physical berry colours below use explicit primary cultivar fields, not white/red wine categories.
# Pirulé (Jaén) remains unknown; its permission and the small pink Gewürztraminer pool disable MCQ only.

