knowledge_items:
  - id: ki_biz_gross_profit
    subject_id: n_biz_gross_profit
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_biz_gross_profit_point
    domain_id: business
    assertion_text: Gross profit deducts the cost of goods sold from net sales; it is not the amount
      remaining after every business expense.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_gross_margin
    subject_id: n_biz_gross_margin
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_biz_gross_margin_point
    domain_id: business
    assertion_text: Gross margin percentage expresses gross profit as a share of net sales, multiplied
      by 100. Its denominator is sales, not the cost of the wine.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_markup
    subject_id: n_biz_markup
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_biz_markup_point
    domain_id: business
    assertion_text: Markup percentage expresses the excess of selling price over purchase or production
      cost as a share of that cost, multiplied by 100. It does not use sales as its denominator.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_fixed_cost
    subject_id: n_biz_fixed_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_biz_fixed_cost_point
    domain_id: business
    assertion_text: A fixed cost does not change with production or sales volume within the specified
      period and capacity; an agreed cellar lease is an example. A new capacity level or contract
      can change it.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_variable_cost
    subject_id: n_biz_variable_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_biz_variable_cost_point
    domain_id: business
    assertion_text: A cost that varies with output is a variable cost; bottles consumed for each
      additional bottle filled are an example. This classification describes cost behaviour, not
      whether the cost is important.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_mixed_cost
    subject_id: n_biz_mixed_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_biz_mixed_cost_point
    domain_id: business
    assertion_text: A cost with a fixed component and a volume-dependent component is a mixed or
      semi-variable cost. Separating the components improves a simplified break-even estimate.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_contribution
    subject_id: n_biz_contribution
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_biz_contribution_point
    domain_id: business
    assertion_text: Unit contribution is the selling price per unit less its variable cost. In a simple
      break-even model, positive contribution first covers fixed costs before producing operating
      profit.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_breakeven
    subject_id: n_biz_breakeven
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_biz_breakeven_point
    domain_id: business
    assertion_text: For a single product with constant price and unit variable cost, break-even units
      equal period fixed costs divided by positive unit contribution. Sales mix and capacity changes
      require revisiting the assumptions.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_profit_cash
    subject_id: n_biz_profit_cash
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_biz_profit_cash_point
    domain_id: business
    assertion_text: Profit measures income less expenses for a period; cash flow tracks money received
      and paid. Non-cash charges and the timing of customer or supplier payments can make the two
      differ.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_working_capital
    subject_id: n_biz_working_capital
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_biz_working_capital_point
    domain_id: business
    assertion_text: Working capital is current assets less current liabilities. It includes assets other
      than cash, so a positive figure alone does not prove every upcoming payment can be met
      immediately.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_inventory_turnover
    subject_id: n_biz_inventory_turnover
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_biz_inventory_turnover_point
    domain_id: business
    assertion_text: Inventory turnover compares cost of sales with average inventory at cost for the
      same period. Using sales revenue against cost-valued stock produces a different ratio.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_inventory_cash
    subject_id: n_biz_inventory_cash
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_biz_inventory_cash_point
    domain_id: business
    assertion_text: Wine purchased but not yet sold uses cash that is unavailable for other payments.
      Aligning stock purchases with expected demand can reduce this tie-up, subject to delivery
      times and availability.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_stocktake
    subject_id: n_biz_stocktake
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_biz_stocktake_point
    domain_id: business
    assertion_text: Comparing a physical stock count with inventory records helps identify shortages,
      excess ordering and slow-selling stock; recording sales alone cannot confirm what is
      physically in the cellar.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_payment_timing
    subject_id: n_biz_payment_timing
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_biz_payment_timing_point
    domain_id: business
    assertion_text: Payment terms determine when a customer is expected to pay. Forecasting that timing
      alongside supplier payments helps assess liquidity even when the sale is profitable.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_cost_plus
    subject_id: n_biz_cost_plus
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_biz_cost_plus_point
    domain_id: business
    assertion_text: Cost-plus pricing starts with the costs of making and supplying the product,
      including labour and overheads, then adds an allowance for profit. Bottle purchase cost alone
      omits other costs of selling wine.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_value_pricing
    subject_id: n_biz_value_pricing
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_biz_value_pricing_point
    domain_id: business
    assertion_text: Value-based pricing considers the benefits customers value and tests willingness to
      pay. High production cost alone does not establish that customers will accept a premium.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_competitor_pricing
    subject_id: n_biz_competitor_pricing
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_biz_competitor_pricing_point
    domain_id: business
    assertion_text: Competitor prices provide a market benchmark; a business should also consider its
      own costs and the value of its offer rather than copying a competitor price mechanically.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_discount_contribution
    subject_id: n_biz_discount_contribution
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_biz_discount_contribution_point
    domain_id: business
    assertion_text: With unit variable cost unchanged, reducing the selling price lowers contribution
      per bottle. Selling more bottles after a discount does not by itself establish higher total
      contribution.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_price_review
    subject_id: n_biz_price_review
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_biz_price_review_point
    domain_id: business
    assertion_text: Changes in supply costs or market conditions warrant reviewing prices and their
      assumptions. A historic percentage markup does not guarantee the same cash result after costs
      change.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_customer_segment
    subject_id: n_biz_customer_segment
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_biz_customer_segment_point
    domain_id: business
    assertion_text: A target segment identifies the customers the offer aims to serve. Its needs,
      purchasing context and alternatives should guide market research rather than assuming every
      wine buyer wants the same offer.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_primary_research
    subject_id: n_biz_primary_research
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_biz_primary_research_point
    domain_id: business
    assertion_text: Surveys, interviews or focus groups can examine customers directly about a specific
      offer. Existing broad statistics may help describe a market but may not answer that
      offer-specific question.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_channel_mix
    subject_id: n_biz_channel_mix
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_biz_channel_mix_point
    domain_id: business
    assertion_text: A business plan identifies the channels used to reach customers and earn revenue.
      Choosing direct sales or intermediary routes depends on the offer, customers and available
      resources; one route is not universally best.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_tasting_room_relationship
    subject_id: n_biz_tasting_room_relationship
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_biz_tasting_room_relationship_point
    domain_id: business
    assertion_text: A tasting room can connect customers with a winery and encourage purchases and
      repeat contact. A visit does not guarantee a sale, and the facility still needs resources to
      operate.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_fx_receivable
    subject_id: n_biz_fx_receivable
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_biz_fx_receivable_point
    domain_id: business
    assertion_text: If the foreign invoice currency weakens before payment, a fixed unhedged receivable
      converts into less home currency. If it strengthens, the same fixed receivable converts into
      more.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_home_currency_invoice
    subject_id: n_biz_home_currency_invoice
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_biz_home_currency_invoice_point
    domain_id: business
    assertion_text: Requiring payment in the exporter's home currency shifts conversion exposure to the
      buyer. It can reduce competitiveness or strain the buyer's ability to pay; it does not remove
      every commercial risk.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_forward_exchange
    subject_id: n_biz_forward_exchange
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_biz_forward_exchange_point
    domain_id: business
    assertion_text: A forward exchange contract fixes the rate for exchanging a stated foreign-currency
      amount on a specified future date. It addresses that exchange-rate exposure, not whether the
      buyer actually pays.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_srv_heat_ageing
    subject_id: n_srv_heat_ageing
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_srv_heat_ageing_point
    domain_id: service
    assertion_text: Elevated storage temperature accelerates many ageing reactions and can cause adverse
      sensory changes. It is not a reliable shortcut to beneficial bottle development.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_srv_heat_so2
    subject_id: n_srv_heat_so2
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_srv_heat_so2_point
    domain_id: service
    assertion_text: Free sulfur dioxide normally declines during bottle storage, and elevated
      temperature accelerates its loss. Its depletion changes the protection available against
      oxidative reactions.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_srv_lightstruck
    subject_id: n_srv_lightstruck
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_srv_lightstruck_point
    domain_id: service
    assertion_text: Light exposure can generate volatile sulfur compounds associated with lightstruck
      aroma. The risk depends on the wine, bottle and exposure; clear glass does not itself prove
      the wine is damaged.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_srv_holdback
    subject_id: n_srv_holdback
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_srv_holdback_point
    domain_id: service
    assertion_text: A retained sample stored under known conditions provides a comparison when
      investigating transport or storage damage. It helps assess differences without proving a
      particular party caused them.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_srv_glass_odour
    subject_id: n_srv_glass_odour
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_srv_glass_odour_point
    domain_id: service
    assertion_text: For controlled sensory assessment, glasses should be cleaned without residual odours
      and checked before use. Detergent or cupboard odours can interfere with smelling the wine.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_srv_comparison_temperature
    subject_id: n_srv_comparison_temperature
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_srv_comparison_temperature_point
    domain_id: service
    assertion_text: Wines of the same product type in a controlled sensory session should be assessed at
      the same temperature. Unequal temperatures introduce a difference unrelated to the wine
      itself.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_srv_visual_background
    subject_id: n_srv_visual_background
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_srv_visual_background_point
    domain_id: service
    assertion_text: Light, neutral surroundings support controlled sensory assessment. Strong background
      colour can interfere with judging the apparent colour of a wine.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_srv_sediment_decant
    subject_id: n_srv_sediment_decant
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_srv_sediment_decant_point
    domain_id: service
    assertion_text: For a red wine that has formed sediment, careful decanting separates clear wine from
      the deposit. Sediment removal and deliberate aeration are distinct purposes.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_srv_older_aeration
    subject_id: n_srv_older_aeration
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_srv_older_aeration_point
    domain_id: service
    assertion_text: An older red wine may be harmed by excessive oxygen exposure. When removing its
      sediment, a gentle pour into a narrower vessel can limit aeration; assess the bottle rather
      than applying a universal long decant.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_srv_young_aeration
    subject_id: n_srv_young_aeration
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_srv_young_aeration_point
    domain_id: service
    assertion_text: Château Margaux describes aeration as potentially helping young powerful red wines
      open aromatically. This producer practice is conditional and does not establish that every
      young wine benefits from a fixed decanting time.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_srv_cold_aroma
    subject_id: n_srv_cold_aroma
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_srv_cold_aroma_point
    domain_id: service
    assertion_text: Château Margaux notes that excessive chilling of its red Bordeaux wines can mute
      aromas and make them appear less expressive. This is a service observation, not a universal
      temperature prescription.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_srv_older_cork
    subject_id: n_srv_older_cork
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_srv_older_cork_point
    domain_id: service
    assertion_text: Taylor's preparation guidance recommends gently easing out a Vintage Port cork,
      particularly when older corks may be delicate. Forceful handling can crumble the cork and
      disturb the bottle.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_srv_storage_history
    subject_id: n_srv_storage_history
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_srv_storage_history_point
    domain_id: service
    assertion_text: Wine transport can expose bottles to temperature variation. Temperature records help
      investigate exposure; the label and an intact bottle alone cannot establish its storage
      history.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_srv_smell_environment
    subject_id: n_srv_smell_environment
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_srv_smell_environment_point
    domain_id: service
    assertion_text: Controlled sensory analysis uses ventilation and controlled room conditions to
      reduce outside sensory interference. Strong ambient odours should not be treated as evidence
      that the wine has the same aroma.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_case_wine_discount_action
    subject_id: n_biz_case_wine_discount
    relation_type: CASE_ACTION
    object_id: n_biz_case_wine_discount_action_point
    domain_id: business
    assertion_text: Under the stated assumptions, compare price less variable cost at both prices and
      test plausible sales volumes before judging the promotion.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_case_wine_discount_reason
    subject_id: n_biz_case_wine_discount
    relation_type: CASE_REASON
    object_id: n_biz_case_wine_discount_reason_point
    domain_id: business
    assertion_text: Here the unit contribution falls from 12 to 6 invented currency units. The new offer
      needs twice the bottle volume to retain the same total contribution, before fixed costs.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_case_wine_discount_tradeoff
    subject_id: n_biz_case_wine_discount
    relation_type: CASE_TRADEOFF
    object_id: n_biz_case_wine_discount_tradeoff_point
    domain_id: business
    assertion_text: The discount may attract buyers or clear stock, but each sale contributes less
      toward unchanged fixed costs. A volume gain must be large enough to offset that reduction.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_case_wine_discount_limitation
    subject_id: n_biz_case_wine_discount
    relation_type: CASE_LIMITATION
    object_id: n_biz_case_wine_discount_limitation_point
    domain_id: business
    assertion_text: The arithmetic describes the proposed prices and unchanged costs; it does not
      establish that demand will double or that the promotion will succeed.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_case_cellar_cash_action
    subject_id: n_biz_case_cellar_cash
    relation_type: CASE_ACTION
    object_id: n_biz_case_cellar_cash_action_point
    domain_id: business
    assertion_text: For this timing problem, compare expected receipt dates with supplier payment dates
      and available cash rather than relying on the reported profit figure.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_case_cellar_cash_reason
    subject_id: n_biz_case_cellar_cash
    relation_type: CASE_REASON
    object_id: n_biz_case_cellar_cash_reason_point
    domain_id: business
    assertion_text: Unpaid sales and cash spent on unsold inventory can create a payment shortfall
      despite accounting profit; cash flow and profit measure different things.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_case_cellar_cash_tradeoff
    subject_id: n_biz_case_cellar_cash
    relation_type: CASE_TRADEOFF
    object_id: n_biz_case_cellar_cash_tradeoff_point
    domain_id: business
    assertion_text: Buying less excess stock can free cash, but the restaurant must consider
      replenishment time and whether desired wines remain available.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_case_cellar_cash_limitation
    subject_id: n_biz_case_cellar_cash
    relation_type: CASE_LIMITATION
    object_id: n_biz_case_cellar_cash_limitation_point
    domain_id: business
    assertion_text: Expected customer payments and future stock sales can differ from forecasts. The
      stated information does not prove a particular loan, discount or stock sale will resolve the
      shortfall.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_case_export_currency_action
    subject_id: n_biz_case_export_currency
    relation_type: CASE_ACTION
    object_id: n_biz_case_export_currency_action_point
    domain_id: business
    assertion_text: For the stated fixed amount and date, evaluating a forward exchange contract
      illustrates how to fix the conversion rate for that receivable. Its suitability depends on
      actual contract terms and exposure.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_case_export_currency_reason
    subject_id: n_biz_case_export_currency
    relation_type: CASE_REASON
    object_id: n_biz_case_export_currency_reason_point
    domain_id: business
    assertion_text: If the invoice currency weakens against the exporter's currency before payment, the
      fixed unhedged invoice yields less home currency; a stronger invoice currency would yield
      more.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_case_export_currency_tradeoff
    subject_id: n_biz_case_export_currency
    relation_type: CASE_TRADEOFF
    object_id: n_biz_case_export_currency_tradeoff_point
    domain_id: business
    assertion_text: Insisting on home-currency payment shifts currency conversion exposure to the buyer
      but may lose a sale to a competitor prepared to accept the buyer's currency.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_biz_case_export_currency_limitation
    subject_id: n_biz_case_export_currency
    relation_type: CASE_LIMITATION
    object_id: n_biz_case_export_currency_limitation_point
    domain_id: business
    assertion_text: Fixing a currency conversion rate does not ensure that the customer pays the
      invoice. Exchange-rate risk and payment risk require separate consideration.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_srv_case_fragile_sediment_action
    subject_id: n_srv_case_fragile_sediment
    relation_type: CASE_ACTION
    object_id: n_srv_case_fragile_sediment_action_point
    domain_id: service
    assertion_text: For this fragile bottle, gentle decanting into a narrow vessel separates wine while
      limiting exposure to air. Use a light source to observe the deposit and stop before it
      transfers.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_srv_case_fragile_sediment_reason
    subject_id: n_srv_case_fragile_sediment
    relation_type: CASE_REASON
    object_id: n_srv_case_fragile_sediment_reason_point
    domain_id: service
    assertion_text: The purpose in this case is to keep the bottle deposit out of the served wine,
      rather than to maximise aeration.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_srv_case_fragile_sediment_tradeoff
    subject_id: n_srv_case_fragile_sediment
    relation_type: CASE_TRADEOFF
    object_id: n_srv_case_fragile_sediment_tradeoff_point
    domain_id: service
    assertion_text: Pouring exposes the wine to oxygen. Aeration that may help a young powerful red can
      be harmful to a fragile older bottle, so the sediment benefit must be balanced against that
      exposure.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
  - id: ki_srv_case_fragile_sediment_limitation
    subject_id: n_srv_case_fragile_sediment
    relation_type: CASE_LIMITATION
    object_id: n_srv_case_fragile_sediment_limitation_point
    domain_id: service
    assertion_text: This decision is conditional on the wine's fragility and sediment. Decanting does
      not guarantee improved flavour and cannot establish one beneficial duration for every older
      wine.
    verification_status: unverified
    last_verified_at: 2026-09-26T22:42:39.000Z
    mcq_disabled: true
