    {
      "id": "n_d3close_case_bordeaux_dry",
      "node_type": "production_case",
      "name": "A fictional Bordeaux cellar seeks a dry white for a specialist shop launch in six weeks. Two sound same-vintage Sauvignon Blanc/Sémillon batches are available. A steel-fermented 70:30 trial has the supplied panel's preferred citrus freshness; a 40:60 barrel-fermented trial has more breadth and wood influence. They differ in fruit, proportions and fermentation, so vessel is not isolated. A is stable and ready in week four; B still needs an estimated ten weeks and storage. The shop proposes 600 bottles at €8 net with payment 30 days after delivery. A restaurant proposes 120 prepaid bottles but needs winery delivery and tastings. Complete batch costs, liquidity, staffing and protected-origin records are absent. All proportions, observations, readiness and trade terms are invented. Evaluate product fit, evidence for quality and price, and a conditional route; do not assume a regional dry-white recipe or a wood premium."
    },
    {
      "id": "n_d3close_point_case_bordeaux_dry_action",
      "node_type": "learning_point",
      "name": "Reserve the brief-aligned A for a small conditional launch after stability, costs, cash, staffing and origin checks; compare both offers rather than assigning all stock automatically."
    },
    {
      "id": "n_d3close_point_case_bordeaux_dry_reason",
      "node_type": "learning_point",
      "name": "Sauvignon freshness and Sémillon breadth contextualise the contrast, but supplied panel fit and readiness drive this launch; confounded batch and process changes prevent a vessel-only cause."
    },
    {
      "id": "n_d3close_point_case_bordeaux_dry_tradeoff",
      "node_type": "learning_point",
      "name": "B ties up cellar space and cash past the launch; restaurant prepayment improves the stated receipt timing but adds estate labour, while the shop order is larger and paid later."
    },
    {
      "id": "n_d3close_point_case_bordeaux_dry_limitation",
      "node_type": "learning_point",
      "name": "Repeated blind comparison, full unit costs, actual demand, available cash, staff capacity and origin records are missing; neither higher costs nor a Bordeaux name proves superior quality or an attainable premium."
    },
    {
      "id": "n_d3close_case_bordeaux_sweet",
      "node_type": "production_case",
      "name": "A fictional Bordeaux grower compares a sweet-white project with a sound dry-white alternative. The supplied Sémillon inspections show suitably concentrated berries in parcel H, but damaging rot in wet parcel J. Three selective passes in H are forecast to yield 450 litres after sorting; an earlier sound-fruit dry route is forecast to yield 900 litres. The same €5,400 combined vineyard and harvest cost is assigned to either project solely for this exercise, excluding cellar, packaging, transport, selling, tax and finance. The sweet-wine buyer requests a sample and suggests €15 per bottle, without an order. A dry-white buyer offers a written 300-bottle prepaid pilot at €8 net. Fruit condition, yields, costs and offers are fictional. Compare costs per litre, sound-fruit selection, sweet-acid balance, remaining wine work and evidence for choosing a market route; no legal label entitlement is supplied."
    },
    {
      "id": "n_d3close_point_case_bordeaux_sweet_action",
      "node_type": "learning_point",
      "name": "Separate damaged fruit, assess the concentrated sound-fruit project and dry alternative independently, calculate the supplied cost burden, and choose a conditional route after wine and demand checks."
    },
    {
      "id": "n_d3close_point_case_bordeaux_sweet_reason",
      "node_type": "learning_point",
      "name": "Noble rot can concentrate sugars through berry dehydration; under the exercise's equal €5,400 cost, 450 litres carries €12 per litre and 900 litres €6 per litre before excluded costs."
    },
    {
      "id": "n_d3close_point_case_bordeaux_sweet_tradeoff",
      "node_type": "learning_point",
      "name": "Selective passes and reduced usable volume may support a distinctive sweet style but increase unit-cost exposure; the suggested sweet price is uncertain while the prepaid dry pilot is a bounded commitment."
    },
    {
      "id": "n_d3close_point_case_bordeaux_sweet_limitation",
      "node_type": "learning_point",
      "name": "No finished sweetness-acidity balance, fermentation/stability plan, full cost, market order for the sweet wine or legal product eligibility is established; concentration does not prove quality or margin."
    },
    {
