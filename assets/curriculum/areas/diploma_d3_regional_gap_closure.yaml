    {
      "id": "n_d3close_point_case_beaujolais_release_reason",
      "node_type": "learning_point",
      "name": "Regional extraction and vessel choices vary; the supplied structure and readiness distinguish these lots, while fruit differences prevent attributing the contrast only to contact or barrel use."
