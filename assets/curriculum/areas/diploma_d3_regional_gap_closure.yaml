      "id": "n_d3close_case_lisboa_route",
      "node_type": "production_case",
      "name": "A fictional Lisboa winery compares coastal and sheltered inland red lots after a wet harvest. The coastal lot loses 20% of its supplied gross volume during sorting; sound fruit gives a fresh moderate-tannin trial. The inland lot loses 5% and gives a riper fuller trial, with different grapes and cap work. These percentages are invented. A 70:30 trial blend fits a casual restaurant's supplied brief, but it is not a controlled climate comparison. Ready date is week five. A restaurant requests 180 prepaid bottles with producer delivery; a specialist distributor requests 1,200 bottles after 60 days and an exclusivity clause. Sorting, bottling, marketing, logistics, liquidity and label records are missing. Compare the regional context, saleable yield, blend/quality evidence, full contribution and channel risks without assigning one style or universal price to Lisboa."
    },
    {
      "id": "n_d3close_point_case_lisboa_route_action",
      "node_type": "learning_point",
      "name": "Assess sound lots and repeat the brief-aligned blend, cost the actual saleable volume, verify proposed origin records and pursue a bounded feasible launch after cash and service checks."
    },
    {
      "id": "n_d3close_point_case_lisboa_route_reason",
      "node_type": "learning_point",
      "name": "Coastal Atlantic and sheltered inland contexts differ, while the supplied sorting losses and wine fit drive this case; grape and cellar changes prevent assigning the contrast solely to climate."
    },
    {
      "id": "n_d3close_point_case_lisboa_route_tradeoff",
      "node_type": "learning_point",
      "name": "Greater sorting loss spreads costs over less saleable wine; a prepaid restaurant trial needs estate delivery, while distributor scale may reduce some direct work but adds later cash and exclusivity exposure."
    },
    {
      "id": "n_d3close_point_case_lisboa_route_limitation",
      "node_type": "learning_point",
      "name": "Protected-category eligibility, complete measured volumes/costs, stability, repeated quality evidence, credit, staff capacity and downstream demand remain unconfirmed; a coastal name or lower yield is not a quality/price ranking."
    },
    {
      "id": "n_d3close_case_olifants_chenin",
      "node_type": "production_case",
      "name": "A fictional Olifants River co-operative compares two Chenin Blanc parcels for an affordable fresh dry white. The coastal parcel's supplied log shows cooler ripening; the inland riverbank parcel has greater vigour and a different irrigation record. Both have sound measured fruit. Trial C from the coast, earlier harvest and steel is fresher in the panel; trial R from inland, later harvest and wood is fuller. Parcel, picking and vessel all differ, so no single cause is isolated. C is ready in four weeks and R in nine; a supermarket launch is week six. A retailer proposes 2,400 C bottles at R45 net, payment after 75 days, with promotional support funded by the co-operative. A cellar-door pilot of 180 bottles would prepay but needs estate staffing. All data and offers are invented. Compare site, canopy/water and style evidence, costs per saleable bottle, achievable price and a cash-backed route."
    },
    {
      "id": "n_d3close_point_case_olifants_chenin_action",
      "node_type": "learning_point",
      "name": "Confirm the fresh C trial against the affordable week-six brief, check stability and origin records, and test full contribution/cash and staffing before choosing retailer scale or a smaller pilot."
    },
    {
      "id": "n_d3close_point_case_olifants_chenin_reason",
      "node_type": "learning_point",
      "name": "Ocean proximity and riverbank vigour supply regional context, but the supplied fruit, trial and timing decide this comparison; confounded production choices stop a coast-only quality claim."
    },
    {
      "id": "n_d3close_point_case_olifants_chenin_tradeoff",
      "node_type": "learning_point",
      "name": "Retail volume may support scale but its delay and producer-funded promotion commit cash; the smaller prepaid pilot needs estate service and leaves stock, while R misses the launch and adds holding."
    },
    {
      "id": "n_d3close_point_case_olifants_chenin_limitation",
      "node_type": "learning_point",
      "name": "Actual irrigation access, representative crop/vigour measurements, repeated wine results, category/provenance records, full cost, cash, promotion terms and downstream demand remain missing; affordable positioning does not imply low quality."
    }
  ],
