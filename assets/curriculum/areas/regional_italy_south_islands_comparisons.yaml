# Original selected Italian regional explanations and conditional cases; all await qualified review.
# MCQ disabled: qualified site/style explanations and defensible case decisions admit alternatives.
# Dates record curation, not the start of regional growing conditions.
knowledge_nodes:
  - id: n_reg_isi_principle_irpinia_sites
    node_type: production_principle
    name: How do Irpinia’s terrain and local growing conditions qualify the assumption that all southern
      Italian vineyards are uniformly hot?
  - id: n_reg_isi_point_irpinia_terrain
    node_type: learning_point
    name: Irpinia has mountain and hill sites with varied growing conditions
  - id: n_reg_isi_point_fiano_local_moderation
    node_type: learning_point
    name: Fiano di Avellino sites have local terrain and woodland moderation
  - id: n_reg_isi_principle_taurasi_ripening
    node_type: production_principle
    name: Why do Aglianico ripening and tannin management matter when explaining Taurasi style?
  - id: n_reg_isi_point_taurasi_late
    node_type: learning_point
    name: Late-ripening Aglianico needs an adequately long growing season
  - id: n_reg_isi_point_taurasi_tannin
    node_type: learning_point
    name: Taurasi tannin requires considered extraction and maturation
  - id: n_reg_isi_principle_fiano_greco
    node_type: production_principle
    name: Which varietal and structural considerations make Fiano di Avellino and Greco di Tufo a useful
      white-wine comparison?
  - id: n_reg_isi_point_fiano_style
    node_type: learning_point
    name: Fiano can combine fresh acidity with floral fruit and evolving nutty notes
  - id: n_reg_isi_point_greco_style
    node_type: learning_point
    name: Greco di Tufo contributes a distinct structural comparison
  - id: n_reg_isi_principle_fiano_cellar
    node_type: production_principle
    name: How can stainless-steel and oak choices contribute to different Fiano di Avellino styles?
  - id: n_reg_isi_point_fiano_steel
    node_type: learning_point
    name: Temperature-controlled steel can support a fresh floral Fiano expression
  - id: n_reg_isi_point_fiano_wood
    node_type: learning_point
    name: Wood treatment can change Fiano structure and sensory expression
  - id: n_reg_isi_principle_vulture_taurasi
    node_type: production_principle
    name: What is shared, and what still differs, when comparing Aglianico del Vulture with Taurasi?
  - id: n_reg_isi_point_vulture_shared
    node_type: learning_point
    name: Taurasi and Vulture share late-ripening Aglianico
  - id: n_reg_isi_point_vulture_setting
    node_type: learning_point
    name: Vulture’s extinct-volcano setting differs from heterogeneous Taurasi terrain
  - id: n_reg_isi_principle_puglia_primitivo
    node_type: production_principle
    name: How do Primitivo ripening and wine-style variation qualify a simple Puglia equals high alcohol
      prediction?
  - id: n_reg_isi_point_primitivo_early
    node_type: learning_point
    name: Primitivo has an early-ripening tendency
  - id: n_reg_isi_point_primitivo_style
    node_type: learning_point
    name: Manduria Primitivo style requires actual sweetness and maturation evidence
  - id: n_reg_isi_principle_salice_comparison
    node_type: production_principle
    name: What connects Salice Salentino’s growing context with its red and rosato style diversity?
  - id: n_reg_isi_point_salice_context
    node_type: learning_point
    name: Salice Salentino combines Negroamaro traditions and maritime moderation
  - id: n_reg_isi_point_salice_styles
    node_type: learning_point
    name: Salice red and rosato expressions show distinct sensory targets
  - id: n_reg_isi_principle_etna_slopes
    node_type: production_principle
    name: Which Etna north-versus-east site influences support a qualified grape and style comparison?
  - id: n_reg_isi_point_etna_north
    node_type: learning_point
    name: Etna’s northern slope has cooler protected sites and Nerello Mascalese emphasis
  - id: n_reg_isi_point_etna_east
    node_type: learning_point
    name: Etna’s eastern slope is exposed to Ionian rain and wind with Carricante emphasis
  - id: n_reg_isi_principle_etna_variation
    node_type: production_principle
    name: Why should an Etna comparison consider several site factors rather than explaining every
      difference by volcanic soil?
  - id: n_reg_isi_point_etna_factors
    node_type: learning_point
    name: Etna exposure rainfall ventilation and temperature vary among sites
  - id: n_reg_isi_point_etna_human
    node_type: learning_point
    name: Etna site comparisons also require grape and producer choices
  - id: n_reg_isi_principle_etna_costs
    node_type: production_principle
    name: How can Etna terrace work contribute to a price explanation without proving a quality premium?
  - id: n_reg_isi_point_etna_labour
    node_type: learning_point
    name: Etna terraces can make vineyard work demanding
  - id: n_reg_isi_point_etna_market
    node_type: learning_point
    name: Higher documented Etna costs still require market demand evidence
  - id: n_reg_isi_principle_vittoria_blend
    node_type: production_principle
    name: How do Nero d’Avola and Frappato provide contrasting contributions for a Vittoria-area
      red-wine comparison?
  - id: n_reg_isi_point_nero_structure
    node_type: learning_point
    name: Nero d’Avola contributes colour and body in the consortium’s comparison
  - id: n_reg_isi_point_frappato_expression
    node_type: learning_point
    name: Frappato contributes a lighter-coloured fragrant expression
  - id: n_reg_isi_principle_gallura_vermentino
    node_type: production_principle
    name: What regional and climatic features matter when discussing Vermentino from Gallura?
  - id: n_reg_isi_point_gallura_identity
    node_type: learning_point
    name: Gallura is northeastern Sardinia’s Vermentino white-wine setting
  - id: n_reg_isi_point_gallura_wind
    node_type: learning_point
    name: Gallura’s wind and day–night variation qualify a simple warm-site prediction
  - id: n_reg_isi_principle_cannonau_ripeness
    node_type: production_principle
    name: Why does a Cannonau harvest assessment need thermal context and more than a single sugar
      reading?
  - id: n_reg_isi_point_cannonau_temperature
    node_type: learning_point
    name: Temperature influences Cannonau sugar acids phenolics and aromas
  - id: n_reg_isi_point_cannonau_measures
    node_type: learning_point
    name: Cannonau readiness should combine sugar acid pH and phenolic assessment
  - id: n_reg_isi_principle_abruzzo_contrasts
    node_type: production_principle
    name: How do Abruzzo’s landscape and grape-to-wine choices complicate a single regional style
      description?
  - id: n_reg_isi_point_abruzzo_climate
    node_type: learning_point
    name: Abruzzo includes continental interior and milder coastal hills
  - id: n_reg_isi_point_abruzzo_grapes_styles
    node_type: learning_point
    name: Abruzzo wine comparisons need grape and skin-contact distinctions
  - id: n_reg_isi_case_fiano_cellar_choice
    node_type: production_case
    name: A Campanian producer splits the same Fiano di Avellino fruit into two lots. One is fermented
      in temperature-controlled stainless steel for a fresh floral style; the other receives a
      deliberately pronounced oak treatment. The target customers prefer the fresh floral style, and
      both lots meet the budget. Propose a defensible selection process, explain the cellar
      contribution, and discuss one tradeoff and one limitation.
  - id: n_reg_isi_point_case_fiano_cellar_choice_action
    node_type: learning_point
    name: Compare the two Fiano lots with target customers under controlled conditions
  - id: n_reg_isi_point_case_fiano_cellar_choice_reason
    node_type: learning_point
    name: Cellar treatment can change Fiano sensory expression despite shared fruit
  - id: n_reg_isi_point_case_fiano_cellar_choice_tradeoff
    node_type: learning_point
    name: Fresh-style selection may forgo the oak expression desired by another segment
  - id: n_reg_isi_point_case_fiano_cellar_choice_limitation
    node_type: learning_point
    name: One Fiano split-lot trial cannot establish a rule for every producer or vintage
  - id: n_reg_isi_case_aglianico_comparison
    node_type: production_case
    name: A study group has one Taurasi and one Aglianico del Vulture from the same vintage, served
      blind at the same temperature. Both have substantial tannin, but their vineyards and
      maturation regimes differ. Design a useful regional comparison, give one mechanism, and
      discuss a tradeoff and a limitation. Do not claim that a tannic taste proves one origin.
  - id: n_reg_isi_point_case_aglianico_comparison_action
    node_type: learning_point
    name: Compare Aglianico sensory notes with vineyard and maturation records
  - id: n_reg_isi_point_case_aglianico_comparison_reason
    node_type: learning_point
    name: Shared late-ripening Aglianico supports a comparison of season and extraction
  - id: n_reg_isi_point_case_aglianico_comparison_tradeoff
    node_type: learning_point
    name: Using real regional bottles retains site and cellar confounding
  - id: n_reg_isi_point_case_aglianico_comparison_limitation
    node_type: learning_point
    name: Shared tannin and one pair cannot prove Aglianico origin or a regional ranking
  - id: n_reg_isi_case_etna_price
    node_type: production_case
    name: An Etna producer documents higher terrace-maintenance and hand-work costs for a Nerello
      Mascalese wine than a competing red made on an easier site. Independent tasting gives the two
      wines similar evaluations for balance and persistence. The Etna producer proposes a higher
      selling price, but customer demand is untested. Explain how to assess the proposal, with a
      cost mechanism, a tradeoff and a limitation.
  - id: n_reg_isi_point_case_etna_price_action
    node_type: learning_point
    name: Check Etna unit costs and test the proposed price against competing offers
  - id: n_reg_isi_point_case_etna_price_reason
    node_type: learning_point
    name: Additional terrace work can increase the price needed to cover costs
  - id: n_reg_isi_point_case_etna_price_tradeoff
    node_type: learning_point
    name: Higher Etna pricing can aid margin while weakening demand
  - id: n_reg_isi_point_case_etna_price_limitation
    node_type: learning_point
    name: Etna’s geography cannot replace actual demand and quality evidence
  - id: n_reg_isi_case_cannonau_harvest
    node_type: production_case
    name: A Sardinian grower compares two Cannonau blocks during a warm season. Both have reached the
      same sugar reading; one has lower acidity and less convincing phenolic maturity. The grower
      wants a balanced dry red and has not yet measured pH or checked the weather forecast. Propose
      a defensible next step, explain why sugar alone is insufficient, and discuss a tradeoff and a
      limitation without prescribing a universal harvest date.
  - id: n_reg_isi_point_case_cannonau_harvest_action
    node_type: learning_point
    name: Sample both Cannonau blocks for acidity pH and phenolic maturity before choosing dates
  - id: n_reg_isi_point_case_cannonau_harvest_reason
    node_type: learning_point
    name: Equal Cannonau sugar readings need not mean equal acid or phenolic readiness
  - id: n_reg_isi_point_case_cannonau_harvest_tradeoff
    node_type: learning_point
    name: Waiting for phenolic progress may change sugar and acid balance
  - id: n_reg_isi_point_case_cannonau_harvest_limitation
    node_type: learning_point
    name: Cannonau harvest recommendations require block and season evidence
