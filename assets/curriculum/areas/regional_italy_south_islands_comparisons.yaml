knowledge_items:
  - id: ki_reg_isi_irpinia_terrain
    subject_id: n_reg_isi_principle_irpinia_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_isi_point_irpinia_terrain
    domain_id: geography
    assertion_text: Irpinia lies in the Campanian Apennines. Hills, valleys and varied elevations create
      different growing environments for Fiano, Greco and Aglianico; its inland geography does not
      support one uniform hot-climate prediction.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_fiano_local_moderation
    subject_id: n_reg_isi_principle_irpinia_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_isi_point_fiano_local_moderation
    domain_id: viticulture
    assertion_text: The Fiano di Avellino area has substantial hills and pronounced summer day–night
      variation. The consortium describes local terrain and woodland as moderating summer
      temperature peaks; plot exposure and vintage still matter.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_taurasi_late
    subject_id: n_reg_isi_principle_taurasi_ripening
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_isi_point_taurasi_late
    domain_id: viticulture
    assertion_text: Aglianico for Taurasi ripens late, with the consortium describing harvest extending
      into autumn. Suitable exposure and a sufficient ripening season matter; a location in southern
      Italy does not guarantee full ripeness every year.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_taurasi_tannin
    subject_id: n_reg_isi_principle_taurasi_ripening
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_isi_point_taurasi_tannin
    domain_id: winemaking
    assertion_text: Aglianico’s substantial tannin makes maceration and wood choices important in
      Taurasi. Extraction and maturation should support balance in the actual fruit and wine, rather
      than treating maximum extraction or longest ageing as automatically best.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_fiano_style
    subject_id: n_reg_isi_principle_fiano_greco
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_isi_point_fiano_style
    domain_id: geography
    assertion_text: The Irpinia consortium describes Fiano with marked acidity and floral and
      white-fruit characters, with hazelnut-like notes developing with age. These are style
      tendencies rather than a fixed aromatic checklist for every bottle.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_greco_style
    subject_id: n_reg_isi_principle_fiano_greco
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_isi_point_greco_style
    domain_id: geography
    assertion_text: Greco is another established Irpinia white variety, associated with the Tufo area
      and wines described by its consortium as having substantial structure. Compare the actual
      wine’s acidity and texture; neither the region name nor soil descriptions prove a
      mineral-derived flavour.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_fiano_steel
    subject_id: n_reg_isi_principle_fiano_cellar
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_isi_point_fiano_steel
    domain_id: winemaking
    assertion_text: The consortium describes temperature-controlled stainless-steel elaboration as a
      common Fiano di Avellino approach for preserving fresh floral characters. This is an intended
      style, not proof that all Fiano avoids wood or tastes alike.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_fiano_wood
    subject_id: n_reg_isi_principle_fiano_cellar
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_isi_point_fiano_wood
    domain_id: winemaking
    assertion_text: Some Fiano di Avellino producers use wood maturation for a different structural and
      sensory expression. Oak origin, barrel age and treatment affect the result; using wood alone
      does not establish higher wine quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_vulture_shared
    subject_id: n_reg_isi_principle_vulture_taurasi
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_isi_point_vulture_shared
    domain_id: viticulture
    assertion_text: Both Taurasi and the Vulture area work with late-ripening Aglianico, so suitable
      ripening conditions are relevant to both. A shared variety makes comparison useful but does
      not remove differences in site or winemaking.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_vulture_setting
    subject_id: n_reg_isi_principle_vulture_taurasi
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_isi_point_vulture_setting
    domain_id: geography
    assertion_text: The Vulture vineyards lie around an extinct volcano in northern Basilicata, while
      the Taurasi consortium describes heterogeneous hill terrain and substrates in Irpinia. Compare
      exposure and local conditions; geology is not a direct recipe for wine aroma.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_primitivo_early
    subject_id: n_reg_isi_principle_puglia_primitivo
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_isi_point_primitivo_early
    domain_id: viticulture
    assertion_text: Primitivo’s name reflects its tendency to early maturation. A grower should consider
      that varietal timing within the actual season rather than predicting harvest date from
      latitude alone.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_primitivo_style
    subject_id: n_reg_isi_principle_puglia_primitivo
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_isi_point_primitivo_style
    domain_id: geography
    assertion_text: The Puglia government’s regional profile describes richly coloured Primitivo di
      Manduria examples with broad aromas and a range from dry to slightly sweet. Compare residual
      sweetness, balance and maturation in the actual bottles rather than equating a grape name with
      one finished style.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_salice_context
    subject_id: n_reg_isi_principle_salice_comparison
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_isi_point_salice_context
    domain_id: geography
    assertion_text: The Salice Salentino consortium describes Negroamaro as a central local grape and
      the sea as moderating climate. This provides a setting for comparison within Salento without
      treating all coastal and inland vineyards as identical.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_salice_styles
    subject_id: n_reg_isi_principle_salice_comparison
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_isi_point_salice_styles
    domain_id: geography
    assertion_text: The consortium describes structured, tannic red Salice Salentino and a lighter
      rosato expression. Compare colour, tannin and intended style in the actual wines; these
      descriptions do not grade all reds above all rosatos.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_etna_north
    subject_id: n_reg_isi_principle_etna_slopes
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_isi_point_etna_north
    domain_id: geography
    assertion_text: The Etna consortium describes the northern slope as relatively cold and protected by
      surrounding mountain ranges, with Nerello Mascalese prominent. Use this as a regional tendency
      while checking the individual site and season.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_etna_east
    subject_id: n_reg_isi_principle_etna_slopes
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_isi_point_etna_east
    domain_id: geography
    assertion_text: Etna’s eastern slope faces the Ionian Sea and is particularly exposed to rain and
      wind; the consortium describes Carricante as dominant there. This differs from the northern
      red-grape emphasis and complicates an island-wide climate label.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_etna_factors
    subject_id: n_reg_isi_principle_etna_variation
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_isi_point_etna_factors
    domain_id: geography
    assertion_text: Etna vineyard settings differ in orientation, sunlight exposure, elevation,
      rainfall, ventilation and temperature range. These interacting conditions support different
      ripening outcomes; elevation alone cannot establish a wine’s style or quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_etna_human
    subject_id: n_reg_isi_principle_etna_variation
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_isi_point_etna_human
    domain_id: geography
    assertion_text: Nerello Mascalese and Carricante are established Etna varieties, and the consortium
      describes site differences together with human choices. Wine comparisons must account for
      grapes and cellar treatment instead of assuming a direct transfer of volcanic-rock flavour.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_etna_labour
    subject_id: n_reg_isi_principle_etna_costs
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_isi_point_etna_labour
    domain_id: business
    assertion_text: The Etna consortium describes terraced slopes as demanding for vineyard work. Where
      the actual producer documents additional labour or maintenance costs, these belong in a
      production-cost explanation; no uniform cost is assumed for every Etna site.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_etna_market
    subject_id: n_reg_isi_principle_etna_costs
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_isi_point_etna_market
    domain_id: business
    assertion_text: Higher documented costs can increase the price needed to cover production and
      selling expenses, but achievable price also depends on customer value and competing offers.
      Terraces, volcano identity or old vines alone do not prove a quality ranking or a guaranteed
      premium.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_nero_structure
    subject_id: n_reg_isi_principle_vittoria_blend
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_isi_point_nero_structure
    domain_id: geography
    assertion_text: The Cerasuolo di Vittoria consortium describes Nero d’Avola with ruby colour and
      substantial body, alongside fresh fruit and floral characters. The description supplies a
      varietal contribution to compare, not a universal regional quality claim.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_frappato_expression
    subject_id: n_reg_isi_principle_vittoria_blend
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_isi_point_frappato_expression
    domain_id: geography
    assertion_text: The consortium describes Frappato with relatively light colour, floral and fruit
      aromas, and moderate body. Compared with Nero d’Avola this provides a basis for discussing
      blend balance, while the finished wine still depends on proportions and production.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_gallura_identity
    subject_id: n_reg_isi_principle_gallura_vermentino
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_isi_point_gallura_identity
    domain_id: geography
    assertion_text: Gallura lies in northeastern Sardinia, where Vermentino is the grape associated with
      the named white wines. The local reference describes coastal and inland settings, so a single
      coastal style cannot describe the entire area.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_gallura_wind
    subject_id: n_reg_isi_principle_gallura_vermentino
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_isi_point_gallura_wind
    domain_id: viticulture
    assertion_text: The Gallura consortium describes a warm temperate climate, regular wind and marked
      day–night temperature variation. These factors belong in an explanation of growing conditions;
      wind does not guarantee disease-free fruit or directly supply a salty wine flavour.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_cannonau_temperature
    subject_id: n_reg_isi_principle_cannonau_ripeness
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_isi_point_cannonau_temperature
    domain_id: viticulture
    assertion_text: Sardinian agrometeorological research describes temperature as influencing sugar
      accumulation, malic-acid degradation, phenolic composition and aromas during Cannonau
      ripening. It helps interpret a season’s progress but cannot set one ideal harvest date for
      every vineyard.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_cannonau_measures
    subject_id: n_reg_isi_principle_cannonau_ripeness
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_isi_point_cannonau_measures
    domain_id: viticulture
    assertion_text: For Cannonau, the regional research discusses sugar, total acidity, pH and phenolic
      ripeness in harvest assessment. Sugar increase and acid decrease are not in a fixed
      biochemical ratio, so a sugar reading or sugar-to-acid index alone cannot settle the decision.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_abruzzo_climate
    subject_id: n_reg_isi_principle_abruzzo_contrasts
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_isi_point_abruzzo_climate
    domain_id: geography
    assertion_text: Abruzzo lies between the Adriatic and the Gran Sasso and Maiella mountains. Its
      consortium distinguishes the mountainous continental interior from a milder coastal hill belt;
      compare named vineyard sites rather than assigning one climate to every wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_abruzzo_grapes_styles
    subject_id: n_reg_isi_principle_abruzzo_contrasts
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_isi_point_abruzzo_grapes_styles
    domain_id: winemaking
    assertion_text: Montepulciano is associated with Abruzzo’s red wines and Cerasuolo rosato, while
      Trebbiano d’Abruzzo is a white-wine reference. The Cerasuolo specification describes limited
      skin contact or white-style vinification, showing why a shared red grape need not produce an
      identical colour or tannin expression.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_case_fiano_cellar_choice_action
    subject_id: n_reg_isi_case_fiano_cellar_choice
    relation_type: CASE_ACTION
    object_id: n_reg_isi_point_case_fiano_cellar_choice_action
    domain_id: winemaking
    assertion_text: Taste the two lots under comparable conditions and test their fit with the target
      customers, then favour the fresh floral lot if the supplied preference is confirmed. This is a
      conditional selection, not a universal rejection of wood-aged Fiano.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_case_fiano_cellar_choice_reason
    subject_id: n_reg_isi_case_fiano_cellar_choice
    relation_type: CASE_REASON
    object_id: n_reg_isi_point_case_fiano_cellar_choice_reason
    domain_id: winemaking
    assertion_text: The fruit is held constant in the case, making the different cellar treatments an
      important explanation for sensory differences. Fresh floral preservation is an intended steel
      approach; oak treatment can add a different sensory contribution.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_case_fiano_cellar_choice_tradeoff
    subject_id: n_reg_isi_case_fiano_cellar_choice
    relation_type: CASE_TRADEOFF
    object_id: n_reg_isi_point_case_fiano_cellar_choice_tradeoff
    domain_id: winemaking
    assertion_text: Choosing the fresh lot fits the stated customer aim but gives up the oak expression
      some other customers might value. Style suitability and quality are separate questions; more
      obvious oak is not inherently better.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_case_fiano_cellar_choice_limitation
    subject_id: n_reg_isi_case_fiano_cellar_choice
    relation_type: CASE_LIMITATION
    object_id: n_reg_isi_point_case_fiano_cellar_choice_limitation
    domain_id: winemaking
    assertion_text: A single split-lot trial does not establish every Fiano producer’s ideal treatment.
      Barrel characteristics and other cellar details should be checked before extending the result
      to another wine or vintage.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_case_aglianico_comparison_action
    subject_id: n_reg_isi_case_aglianico_comparison
    relation_type: CASE_ACTION
    object_id: n_reg_isi_point_case_aglianico_comparison_action
    domain_id: geography
    assertion_text: Record the blind wines’ sensory differences, then compare the vineyard and
      maturation information. Holding grape and vintage broadly similar makes the exercise useful,
      while production records help distinguish regional hypotheses from other causes.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_case_aglianico_comparison_reason
    subject_id: n_reg_isi_case_aglianico_comparison
    relation_type: CASE_REASON
    object_id: n_reg_isi_point_case_aglianico_comparison_reason
    domain_id: viticulture
    assertion_text: Late-ripening Aglianico makes growing-season conditions relevant to both regions.
      The Taurasi reference also emphasises extraction and wood choices for tannin management, so
      the recorded cellar differences can help explain the wines.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_case_aglianico_comparison_tradeoff
    subject_id: n_reg_isi_case_aglianico_comparison
    relation_type: CASE_TRADEOFF
    object_id: n_reg_isi_point_case_aglianico_comparison_tradeoff
    domain_id: geography
    assertion_text: The actual bottles provide a practical regional comparison, but changing vineyards
      and maturation means several variables move together. The exercise can propose plausible
      explanations without isolating one regional cause.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_case_aglianico_comparison_limitation
    subject_id: n_reg_isi_case_aglianico_comparison
    relation_type: CASE_LIMITATION
    object_id: n_reg_isi_point_case_aglianico_comparison_limitation
    domain_id: geography
    assertion_text: Both samples share Aglianico and the case states substantial tannin in each. That
      trait cannot prove origin; one pair with different sites and cellar histories cannot establish
      a general quality ranking between Taurasi and Vulture.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_case_etna_price_action
    subject_id: n_reg_isi_case_etna_price
    relation_type: CASE_ACTION
    object_id: n_reg_isi_point_case_etna_price_action
    domain_id: business
    assertion_text: Check the documented unit costs, channel expenses and intended customers, then test
      the proposed price against competing offers. The supplied sensory assessment gives no
      automatic quality justification for a premium.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_case_etna_price_reason
    subject_id: n_reg_isi_case_etna_price
    relation_type: CASE_REASON
    object_id: n_reg_isi_point_case_etna_price_reason
    domain_id: business
    assertion_text: The case supplies higher terrace and hand-work costs. These can increase the price
      needed to cover expenses at a given sales volume; cost arithmetic explains a required return
      rather than sensory quality or willingness to pay.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_case_etna_price_tradeoff
    subject_id: n_reg_isi_case_etna_price
    relation_type: CASE_TRADEOFF
    object_id: n_reg_isi_point_case_etna_price_tradeoff
    domain_id: business
    assertion_text: A higher price can help cost recovery but may reduce sales if customers choose
      similarly evaluated alternatives. Test the margin and volume consequences together rather than
      assuming the higher unit price always improves profitability.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_case_etna_price_limitation
    subject_id: n_reg_isi_case_etna_price
    relation_type: CASE_LIMITATION
    object_id: n_reg_isi_point_case_etna_price_limitation
    domain_id: business
    assertion_text: Terrace work supports a cost explanation but does not establish a guaranteed
      premium, superior wine quality or sufficient demand. Actual customer evidence and costs remain
      necessary; the case gives no real market price.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_case_cannonau_harvest_action
    subject_id: n_reg_isi_case_cannonau_harvest
    relation_type: CASE_ACTION
    object_id: n_reg_isi_point_case_cannonau_harvest_action
    domain_id: viticulture
    assertion_text: Sample each block separately for acidity, pH and phenolic maturity alongside sugar,
      and review its fruit condition and near-term growing conditions. Use the results to choose
      block-specific dates for the stated balanced dry-red aim.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_case_cannonau_harvest_reason
    subject_id: n_reg_isi_case_cannonau_harvest
    relation_type: CASE_REASON
    object_id: n_reg_isi_point_case_cannonau_harvest_reason
    domain_id: viticulture
    assertion_text: Temperature affects sugar, malic acid, phenolics and aromas, and the source warns
      against assuming a fixed sugar–acid relationship. Equal sugar therefore does not establish
      equal acidity, texture potential or readiness in the supplied blocks.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_case_cannonau_harvest_tradeoff
    subject_id: n_reg_isi_case_cannonau_harvest
    relation_type: CASE_TRADEOFF
    object_id: n_reg_isi_point_case_cannonau_harvest_tradeoff
    domain_id: viticulture
    assertion_text: Waiting for further phenolic progress may change sugar and acid balance as
      conditions evolve. Earlier picking and later picking each need assessment against the actual
      block and intended wine; the same sugar target cannot resolve that tradeoff.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
  - id: ki_reg_isi_case_cannonau_harvest_limitation
    subject_id: n_reg_isi_case_cannonau_harvest
    relation_type: CASE_LIMITATION
    object_id: n_reg_isi_point_case_cannonau_harvest_limitation
    domain_id: viticulture
    assertion_text: The supplied comparison lacks pH, current weather and complete maturity evidence. No
      universal date or region-wide recipe follows; the grower needs further block-specific
      information before making a firm recommendation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:52.000Z
