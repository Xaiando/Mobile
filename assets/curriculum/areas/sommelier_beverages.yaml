# Sommelier basics for beer, cider, spirits, sake and cigars. Authored
# 27 September 2026. Every item is unverified. Mapped to CMS only, not to
# WSET Levels 1–3. Legal category facts are not instructions for making
# alcohol. No still construction, cuts or home-distillation procedure.
knowledge_nodes:
  - { id: n_bev_spirit_separate, node_type: production_principle, name: "Are beer, wine and cider spirit drinks under EU law?" }
  - { id: n_bev_spirit_separate_point, node_type: learning_point, name: "Spirit drinks are not beer, wine or cider" }
  - { id: n_bev_rum_cane, node_type: production_principle, name: "What is rum under the adopted EU spirit-drink categories?" }
  - { id: n_bev_rum_cane_point, node_type: learning_point, name: "Rum is distilled from fermented cane products" }
