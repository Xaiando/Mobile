knowledge_items:
  - id: ki_bev_spirit_separate
    subject_id: n_bev_spirit_separate
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_bev_spirit_separate_point
    domain_id: service
    assertion_text: "Under the adopted text of Regulation (EU) 2019/787, a spirit drink is an alcoholic beverage for human consumption with particular organoleptic qualities and, except for one listed category, at least 15 percent alcohol. It must not fall in the customs codes for beer, wine, vermouth, other fermented drinks or undenatured ethyl alcohol. Some spirit drinks are distillates of a fermented product. Others, such as gin, are agricultural alcohol that has been flavoured. Beer, wine and cider are not spirit drinks under that article."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_bev_rum_cane
    subject_id: n_bev_rum_cane
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_bev_rum_cane_point
    domain_id: service
    assertion_text: "In the adopted EU categories, rum is a spirit drink produced only by distilling the fermented product of molasses or syrup from cane-sugar manufacture, or of sugar-cane juice itself, at less than 96 percent alcohol so that the distillate still has the discernible character of rum."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_bev_gin_juniper
    subject_id: n_bev_gin_juniper
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_bev_gin_juniper_point
    domain_id: service
    assertion_text: "In the adopted EU categories, gin is a juniper-flavoured spirit drink made by flavouring ethyl alcohol of agricultural origin with juniper berries, Juniperus communis. Its minimum strength is 37.5 percent alcohol, and the taste must be predominantly that of juniper. It is not a grape wine and it is not a cane spirit."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_bev_vodka_neutral
    subject_id: n_bev_vodka_neutral
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_bev_vodka_neutral_point
    domain_id: service
    assertion_text: "In the adopted EU categories, vodka is a spirit drink from ethyl alcohol of agricultural origin, fermented by yeast from potatoes, cereals or other agricultural raw materials, and distilled so that the character of those raw materials and of fermentation by-products is selectively reduced. The category does not say the raw material must be one grain."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_bev_scotch_rules
    subject_id: n_bev_scotch_rules
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_bev_scotch_rules_point
    domain_id: service
    assertion_text: "Scotch Whisky is whisky produced in Scotland from water and malted barley, to which only whole grains of other cereals may be added. It is distilled below 94.8 percent alcohol so that aroma and taste from the raw materials remain, matured only in Scotland in oak casks of no more than 700 litres for at least three years, and bottled at at least 40 percent alcohol. Nothing may be added except water, plain caramel colouring, or both."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_bev_scotch_malt
    subject_id: n_bev_scotch_malt
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_bev_scotch_malt_point
    domain_id: service
    assertion_text: "Single Malt Scotch Whisky is distilled at a single distillery, from water and malted barley with no other cereal, in pot stills. Blended Scotch Whisky is a blend of one or more Single Malt Scotch Whiskies with one or more Single Grain Scotch Whiskies. A blend of malt and grain is not single malt."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_bev_scotch_age_statement
    subject_id: n_bev_scotch_age_statement
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_bev_scotch_age_statement_point
    domain_id: service
    assertion_text: "A maturation or age statement on Scotch Whisky may be used only when it refers to the youngest alcoholic component, and the Scotch Whisky Regulations require that stated age to be expressed in years. Older whisky may be in the same bottle. The stated age is not an average."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_bev_bourbon_corn
    subject_id: n_bev_bourbon_corn
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_bev_bourbon_corn_point
    domain_id: service
    assertion_text: "US rules define bourbon whisky as whisky from a fermented mash of not less than 51 percent corn, stored in charred new oak barrels. The word bourbon may not describe whisky that was not distilled and aged in the United States. Kentucky is not required. A state name may appear when distillation and any required aging took place in that state. Whisky in this class is bottled at not less than 40 percent alcohol."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_bev_bourbon_straight
    subject_id: n_bev_bourbon_straight
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_bev_bourbon_straight_point
    domain_id: service
    assertion_text: "Straight bourbon whisky uses the same mash of at least 51 percent corn and charred new oak, and it must be stored in those barrels for at least two years. The straight-bourbon standard allows no added coloring, flavoring or blending materials."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_bev_cognac_minimum
    subject_id: n_bev_cognac_minimum
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_bev_cognac_minimum_point
    domain_id: service
    assertion_text: "The BNIC states that Cognac, Eau-de-vie de Cognac or Eau-de-vie des Charentes cannot be sold until it has aged at least two years, without interruption, only in oak. The age of a blend is the age of its youngest eau-de-vie. At sale to the consumer the minimum strength is 40 percent alcohol. Ageing stops at bottling; the spirit does not continue to age under glass."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_bev_cognac_mentions
    subject_id: n_bev_cognac_mentions
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_bev_cognac_mentions_point
    domain_id: service
    assertion_text: "On the BNIC list, Very Special is at least 2 years, Very Superior Old Pale is at least 4, Napoleon is at least 6, Extra Old is at least 10, and Extra Extra Old is at least 14. Each figure is the youngest eau-de-vie, not an average. Napoleon on a Cognac label is this ageing mention. It is not evidence that Napoleon I made the bottle, and it is not the 1855 classification commissioned under Napoleon III."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_bev_cognac_fine_champagne
    subject_id: n_bev_cognac_fine_champagne
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_bev_cognac_fine_champagne_point
    domain_id: service
    assertion_text: "Cognac Fine Champagne is a blend made only from Grande Champagne and Petite Champagne, with at least 50 percent Grande Champagne. It is a cru designation. It does not mean the Champagne wine region, and it does not state a vintage."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_bev_cask_ale
    subject_id: n_bev_cask_ale
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_bev_cask_ale_point
    domain_id: service
    assertion_text: "CAMRA defines cask-conditioned beer as a live beer that continues to mature in the cask from which it is served, with excess carbon dioxide vented so that it is served at atmospheric pressure. It is not dispensed by injecting carbon dioxide. Unfined cask beer may be cloudy and is still cask-conditioned. This is a trade definition of beer, not a world beer statute, and it is not a distillation method."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_bev_cider_perry
    subject_id: n_bev_cider_perry
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_bev_cider_perry_point
    domain_id: service
    assertion_text: "Under the UK Finance (No. 2) Act 2023, section 44 excludes drinks at 1.2 percent alcohol or less from its alcohol-duty categories. Schedule 6 defines cider from fermented apple or pear juice, subject to permitted-addition and juice-content requirements, at less than 8.5 percent alcohol. Pear-based perry can therefore fall within the UK cider duty category. This is not a world definition of cider, and cider is not a distilled spirit."
    verification_status: unverified
    last_verified_at: "2026-09-28T00:00:00.000Z"
    mcq_disabled: true
  - id: ki_bev_sake_polish
    subject_id: n_bev_sake_polish
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_bev_sake_polish_point
    domain_id: service
    assertion_text: "The Japanese National Tax Agency defines the rice-polishing ratio as the percentage of the brown-rice weight that remains. A ratio of 60 percent means about 40 percent of the outer layer was removed. The labelling standard does not require sake to be served hot, and it does not make sake a grape wine or a distillate."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_bev_sake_junmai
    subject_id: n_bev_sake_junmai
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_bev_sake_junmai_point
    domain_id: service
    assertion_text: "Junmai uses rice, koji rice and water, and the National Tax Agency table gives it no added brewer's alcohol. A 2003 amendment deleted the old rule that junmai had to be polished to 70 percent or less, so junmai now has no single polishing-ratio ceiling. Koji rice, rice on which koji mold has been grown so that it can turn starch into sugar, must be at least 15 percent of the white-rice weight."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_bev_sake_ginjo
    subject_id: n_bev_sake_ginjo
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_bev_sake_ginjo_point
    domain_id: service
    assertion_text: "Ginjo requires a rice-polishing ratio of 60 percent or less, and daiginjo 50 percent or less, plus the ginjo method of careful polishing and low-temperature fermentation for a fragrant style. Junmai ginjo and junmai daiginjo are those classes made without added brewer's alcohol. The percentages are grain remaining, not grain removed."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_bev_sake_honjozo
    subject_id: n_bev_sake_honjozo
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_bev_sake_honjozo_point
    domain_id: service
    assertion_text: "Honjozo requires a rice-polishing ratio of 70 percent or less and may include brewer's alcohol. The National Tax Agency overview limits that alcohol to no more than 10 percent of the weight of the white rice. Junmai may not include it."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_bev_habano_name
    subject_id: n_bev_habano_name
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_bev_habano_name_point
    domain_id: service
    assertion_text: "Habanos is the protected denomination for selected cigars made in Cuba, to the Regulatory Council's standard, from tobacco grown only in particular protected areas of Cuba. Every Habano is Cuban. Not every Cuban cigar is a Habano, and a cigar made outside Cuba is not a Habano."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_bev_habano_leaves
    subject_id: n_bev_habano_leaves
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_bev_habano_leaves_point
    domain_id: service
    assertion_text: "Habanos describes a cigar as filler, binder and wrapper. The tripa, or filler, is the blend of leaves that supplies flavour. The capote, or binder, wraps that filler and sets the shape. The capa, or wrapper, is the outer leaf. Habanos says the wrapper contributes little of the flavour and that every leaf is grown in Cuba. A factory size name is not, by itself, an international statute."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_bev_tobacco_harm
    subject_id: n_bev_tobacco_harm
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_bev_tobacco_harm_point
    domain_id: service
    assertion_text: "The World Health Organization states that tobacco damages nearly every organ, causes cancer, heart disease, stroke and lung disease, and that there is no safe level of exposure. All forms of tobacco use are harmful. Cigar study does not make tobacco safe."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_bev_alcohol_harm
    subject_id: n_bev_alcohol_harm
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_bev_alcohol_harm_point
    domain_id: service
    assertion_text: "The World Health Organization states that ethanol is a toxic, dependence-producing Group 1 carcinogen and that it causes at least seven types of cancer. The cancer risk is from the alcohol itself, in any beverage, and current evidence does not show a threshold at which that risk switches on. Less drinking is safer. There is no safe level to teach."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true

