    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_taste_aroma_tertiary
    subject_id: n_wset_taste_principle_aroma_origins
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_taste_point_aroma_tertiary
    domain_id: tasting
    assertion_text: Tertiary aromas reflect development during maturation; these may coexist with fresh fruit.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_taste_palate_flavours
    subject_id: n_wset_taste_principle_palate_detail
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_taste_point_palate_flavours
    domain_id: tasting
    assertion_text: Record flavours and their strength separately from sweetness, acidity, tannin, alcohol and body.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_taste_palate_finish
    subject_id: n_wset_taste_principle_palate_detail
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_taste_point_palate_finish
    domain_id: tasting
    assertion_text: Describe how long pleasant flavour remains; lingering heat or harshness alone is not evidence
      of a fine finish.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_taste_palate_texture
    subject_id: n_wset_taste_principle_palate_detail
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_taste_point_palate_texture
    domain_id: tasting
    assertion_text: Describe tannin amount and its texture separately; equal amounts can feel differently grained.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_taste_palate_sparkle
    subject_id: n_wset_taste_principle_palate_detail
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_taste_point_palate_sparkle
    domain_id: tasting
    assertion_text: Carbon dioxide can add a prickling sensation; record it separately from the wine’s weight.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_taste_calibration_comparison
    subject_id: n_wset_taste_principle_calibration
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_taste_point_calibration_comparison
    domain_id: tasting
    assertion_text: Compare samples under consistent conditions and explain where your observations differ.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_taste_calibration_discussion
    subject_id: n_wset_taste_principle_calibration
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_taste_point_calibration_discussion
    domain_id: tasting
    assertion_text: Compare written notes with an experienced taster; disagreement can reveal calibration needs.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_taste_quality_balance
    subject_id: n_wset_taste_principle_quality
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_taste_point_quality_balance
    domain_id: tasting
    assertion_text: Explain how structure and flavour work together rather than merely calling the wine balanced.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_taste_quality_length
    subject_id: n_wset_taste_principle_quality
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_taste_point_quality_length
    domain_id: tasting
    assertion_text: Use pleasant flavour persistence as supporting quality evidence; heat alone is insufficient.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_taste_quality_intensity
    subject_id: n_wset_taste_principle_quality
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_taste_point_quality_intensity
    domain_id: tasting
    assertion_text: Intense aroma or a large body alone does not establish high quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_taste_quality_complexity
    subject_id: n_wset_taste_principle_quality
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_taste_point_quality_complexity
    domain_id: tasting
    assertion_text: Support complexity with distinct flavours or changing layers; oak and age are not compulsory.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_taste_quality_preference
    subject_id: n_wset_taste_principle_quality_preference
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_taste_point_quality_preference
    domain_id: tasting
    assertion_text: You may dislike a style while recognising well-made wine; state preference separately from
      quality evidence.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_taste_quality_fault_context
    subject_id: n_wset_taste_principle_quality_preference
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_taste_point_quality_fault_context
    domain_id: tasting
    assertion_text: Consider the intended style before treating an oxidative or strongly developed character as a fault.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_taste_ageing_not_all
    subject_id: n_wset_taste_principle_ageing
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_taste_point_ageing_not_all
    domain_id: tasting
    assertion_text: Many wines are made for early drinking or released ready; age does not automatically improve them.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_taste_ageing_support
    subject_id: n_wset_taste_principle_ageing
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_taste_point_ageing_support
    domain_id: tasting
    assertion_text: Consider flavour concentration with acidity, tannin or other protective structure when
      discussing development.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_taste_ageing_evolution
    subject_id: n_wset_taste_principle_ageing
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_taste_point_ageing_evolution
    domain_id: tasting
    assertion_text: Fresh fruit may recede as developed aromas emerge; tannin texture can soften with age.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_taste_ageing_now_future
    subject_id: n_wset_taste_principle_ageing
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_taste_point_ageing_now_future
    domain_id: tasting
    assertion_text: Explain whether the wine is enjoyable now and whether it has evidence supporting further development.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
  - id: ki_wset_taste_ageing_uncertain
    subject_id: n_wset_taste_principle_ageing
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_taste_point_ageing_uncertain
    domain_id: tasting
    assertion_text: Storage and bottle variation affect development; a tasting note cannot guarantee a future drinking date.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:00:00.000Z
