knowledge_items:
  - id: ki_wset_sfault_reduction
    subject_id: n_wset_sfault_principle_reduction
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sfault_point_reduction
    domain_id: service
    assertion_text: Reduction describes sensory effects from volatile sulfur compounds, such as hydrogen sulfide's rotten-egg smell or unwanted cabbage, onion and rubber notes from some thiols. It differs from the sharply pungent smell of excessive sulfur dioxide. Character and concentration matter; not every sulfur-associated note proves a fault. Aeration may help some examples but is not a universal cure and can change the compounds present.
    last_verified_at: 2026-09-27T00:00:00.000Z
    verification_status: unverified
    mcq_disabled: true
  - id: ki_wset_sfault_high_so2
    subject_id: n_wset_sfault_principle_high_so2
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sfault_point_high_so2
    domain_id: service
    assertion_text: Excessive sulfur dioxide can give a sharp, pungent, penetrating smell and irritate the nose. This is distinct from hydrogen sulfide's rotten-egg character. Sulfur dioxide also protects wine against oxidation and microbes, so its use or a sulfite declaration does not prove a sensory fault. Evaluate the wine; a total sulfur dioxide figure alone does not establish what the drinker smells.
    last_verified_at: 2026-09-27T00:00:00.000Z
    verification_status: unverified
    mcq_disabled: true
  - id: ki_wset_sfault_out_of_condition
    subject_id: n_wset_sfault_principle_out_of_condition
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sfault_point_out_of_condition
    domain_id: service
    assertion_text: An out-of-condition wine has deteriorated from its intended drinking condition; lost fruit and a dull, stale impression can indicate that it is past its best or has suffered poor storage. Beneficial maturity instead develops character while retaining enjoyable balance. Judge the actual aroma, palate and style, rather than age or brown colour alone; sound deliberately oxidative wines can share descriptors that would be undesirable in a fresh fruity wine.
    last_verified_at: 2026-09-27T00:00:00.000Z
    verification_status: unverified
    mcq_disabled: true
