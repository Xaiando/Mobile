# Original additional Oceania/Africa regional depth; all await qualified review.
# MCQ disabled: qualified site/style explanations and conditional case actions admit defensible alternatives.
# Dates record curation, not onset of environmental conditions. No geography edges or complete legal lists.
knowledge_nodes:
  - id: n_reg_oa_principle_hunter_style
    node_type: production_principle
    name: Why can classic Hunter Semillon be light and dry when young yet show toast after bottle storage
      without a barrel?
  - id: n_reg_oa_point_hunter_early
    node_type: learning_point
    name: Early-picked Hunter Semillon can reach flavour ripeness at relatively low sugar
  - id: n_reg_oa_point_hunter_bottle
    node_type: learning_point
    name: Classic unoaked Hunter Semillon can develop toast and honey in bottle
  - id: n_reg_oa_principle_hunter_harvest
    node_type: production_principle
    name: How do Hunter warmth moderation and possible harvest rain affect the evidence needed for an early
      Semillon picking decision?
  - id: n_reg_oa_point_hunter_moderation
    node_type: learning_point
    name: Hunter cloud and sea breezes qualify its warm humid growing context
  - id: n_reg_oa_point_hunter_rain
    node_type: learning_point
    name: Hunter harvest rain requires lot maturity and health checks rather than a calendar rule
  - id: n_reg_oa_principle_mclaren_routes
    node_type: production_principle
    name: How do Grenache wine routes and a named McLaren Vale berry-handling record differ from assuming
      that Grenache always means a stem-fermented blend?
  - id: n_reg_oa_point_mclaren_varietal_blend
    node_type: learning_point
    name: McLaren Grenache has both varietal and Grenache–Shiraz–Mourvedre blend routes
  - id: n_reg_oa_point_mclaren_whole_berries
    node_type: learning_point
    name: Yangarra 2024 Old Vine Grenache retains destemmed whole berries
  - id: n_reg_oa_principle_mclaren_cellar
    node_type: production_principle
    name: What do two documented 2024 Yangarra Grenache routes show about separating cap management and
      vessel choice from a McLaren Vale label?
  - id: n_reg_oa_point_mclaren_gentle_cap
    node_type: learning_point
    name: Yangarra combines gentle cap wetting with extended Grenache skin contact
  - id: n_reg_oa_point_mclaren_ceramic
    node_type: learning_point
    name: Ovitelli 2024 illustrates Grenache fermentation and maturation without oak
  - id: n_reg_oa_principle_adelaide_sites
    node_type: production_principle
    name: Why should an Adelaide Hills Sauvignon or Cabernet comparison identify its site rather than infer
      ripening suitability from the regional average?
  - id: n_reg_oa_point_adelaide_warm_slopes
    node_type: learning_point
    name: Some northern west-facing Adelaide Hills slopes can ripen Cabernet
  - id: n_reg_oa_point_adelaide_sauvignon
    node_type: learning_point
    name: Adelaide Hills Sauvignon can combine ripe tropical and herbal notes
  - id: n_reg_oa_principle_adelaide_m3
    node_type: production_principle
    name: How does the 2025 M3 Chardonnay record separate multi-site fruit sourcing from barrel and
      malolactic choices in an Adelaide Hills explanation?
  - id: n_reg_oa_point_adelaide_m3_sources
    node_type: learning_point
    name: M3 2025 combines named Adelaide Hills sites rather than one parcel
  - id: n_reg_oa_point_adelaide_m3_process
    node_type: learning_point
    name: M3 2025 combines whole-bunch pressing with barrel and malolactic fermentation
  - id: n_reg_oa_principle_nelson_sites
    node_type: production_principle
    name: Which Nelson Moutere–Waimea observations support a site comparison while avoiding a direct
      clay-to-flavour explanation?
  - id: n_reg_oa_point_nelson_moutere
    node_type: learning_point
    name: Moutere Hills are described as warmer and wetter than Waimea
  - id: n_reg_oa_point_nelson_waimea
    node_type: learning_point
    name: Waimea Plains combine alluvial stony soils with maritime moderation
  - id: n_reg_oa_principle_canterbury_sites
    node_type: production_principle
    name: How do shelter and the nor’wester distinguish a Waipara vineyard comparison from the Canterbury
      Plains without treating all sites as identical?
  - id: n_reg_oa_point_canterbury_waipara
    node_type: learning_point
    name: Waipara shelter can coexist with a challenging drying nor’wester
  - id: n_reg_oa_point_canterbury_plains
    node_type: learning_point
    name: Canterbury Plains contrast cooler flat sites and shallow free-draining gravels
  - id: n_reg_oa_principle_canterbury_styles
    node_type: production_principle
    name: Why should a North Canterbury tasting comparison check both Riesling sweetness and Pinot Noir
      expression rather than assign one style to the region?
  - id: n_reg_oa_point_canterbury_riesling
    node_type: learning_point
    name: North Canterbury Riesling spans dry through dessert styles
  - id: n_reg_oa_point_canterbury_pinot
    node_type: learning_point
    name: North Canterbury Pinot Noir is not restricted to a pale delicate style
  - id: n_reg_oa_principle_gisborne_sites
    node_type: production_principle
    name: How do inland Patutahi and coastal Manutuke provide different grape and site contexts within
      Gisborne?
  - id: n_reg_oa_point_gisborne_patutahi
    node_type: learning_point
    name: Patutahi provides a warmer inland setting for rich Gewurztraminer examples
  - id: n_reg_oa_point_gisborne_manutuke
    node_type: learning_point
    name: Coastal Manutuke includes Chardonnay sites and heavier western clay settings
  - id: n_reg_oa_principle_constantia_blocks
    node_type: production_principle
    name: How do Klein Constantia’s different slope ripening and separate Sauvignon block fermentation help
      explain its blending choices?
  - id: n_reg_oa_point_constantia_aspects
    node_type: learning_point
    name: Klein Constantia distinguishes earlier east-slope and later south-slope Sauvignon
  - id: n_reg_oa_point_constantia_assembly
    node_type: learning_point
    name: Klein Constantia ferments Sauvignon blocks separately before estate blending
  - id: n_reg_oa_principle_paarl_water
    node_type: production_principle
    name: Which Paarl water and vineyard observations qualify the assumption that all warm inland vineyards
      need identical irrigation or training?
  - id: n_reg_oa_point_paarl_water_sites
    node_type: learning_point
    name: Paarl valley and better-retaining slope sites have different irrigation contexts
  - id: n_reg_oa_point_paarl_fairview
    node_type: learning_point
    name: Fairview’s Paarl example combines warm-adapted grapes and mostly trellised drip-irrigated vines
  - id: n_reg_oa_principle_robertson_chardonnay
    node_type: production_principle
    name: How do Robertson water supply and a documented unwooded lees-matured Chardonnay qualify a simple
      warm-region or oak-richness explanation?
  - id: n_reg_oa_point_robertson_water
    node_type: learning_point
    name: Robertson combines lower rainfall, river water context and cooling winds
  - id: n_reg_oa_point_robertson_unwooded
    node_type: learning_point
    name: Limestone Hill 2025 combines tank fermentation with lees stirring without oak
  - id: n_reg_oa_principle_paarl_pinotage
    node_type: production_principle
    name: What do two Fairview 2018 Pinotage records show about separate extraction and oak choices within
      Paarl without converting them into a quality hierarchy?
  - id: n_reg_oa_point_pinotage_sort_cap
    node_type: learning_point
    name: Primo 2018 illustrates Pinotage sorting and manual cap work after destemming
  - id: n_reg_oa_point_pinotage_oak_comparison
    node_type: learning_point
    name: Fairview’s two 2018 Pinotages document different oak shares and maturation time
  - id: n_reg_oa_case_hunter_toast
    node_type: production_case
    name: "A tutor pours two dry Hunter Semillons from the same producer but different vintages: a current
      release with citrus-led freshness and a mature bottle with toast, honey and lemon-curd notes.
      Producer records say both were fermented and matured in stainless steel without oak before bottling. Storage history is
      documented only for the mature bottle after purchase, and vineyard lots differ. A student says the
      toast proves barrel ageing and higher quality. Explain an action, reason, tradeoff and limitation
      for a defensible teaching comparison."
  - id: n_reg_oa_point_case_hunter_toast_action
    node_type: learning_point
    name: Use production records to separate Hunter bottle development from oak claims
  - id: n_reg_oa_point_case_hunter_toast_reason
    node_type: learning_point
    name: Toast can develop in classic Hunter Semillon without wood
  - id: n_reg_oa_point_case_hunter_toast_tradeoff
    node_type: learning_point
    name: The vivid maturity contrast changes vintage and parcel as well as age
  - id: n_reg_oa_point_case_hunter_toast_limitation
    node_type: learning_point
    name: The pair cannot establish a universal Hunter ageing schedule or quality result
  - id: n_reg_oa_case_mclaren_cap_trial
    node_type: production_case
    name: A McLaren Vale grower divides one healthy Grenache lot into small trials, holding yeast,
      temperature, skin-contact duration and maturation vessel constant. Trial A uses gentle cap wetting;
      trial B uses a more intensive pump-over schedule. Both ferment dry. The panel finds A has the
      supple tannin sought for an early-drinking brief, while B is too firm for that brief but sound.
      Saleable trial quantities and full-scale labour requirements are still unknown. Explain an action,
      reason, tradeoff and limitation without treating gentle extraction as universally better.
  - id: n_reg_oa_point_case_mclaren_cap_trial_action
    node_type: learning_point
    name: Retain the gentler trial for the supplied McLaren supple-tannin brief
  - id: n_reg_oa_point_case_mclaren_cap_trial_reason
    node_type: learning_point
    name: Matched lot conditions make cap regime a more focused McLaren comparison
  - id: n_reg_oa_point_case_mclaren_cap_trial_tradeoff
    node_type: learning_point
    name: Choosing supple trial A gives up the firmer sound alternative
  - id: n_reg_oa_point_case_mclaren_cap_trial_limitation
    node_type: learning_point
    name: One McLaren trial does not validate every vintage or full-scale extraction regime
  - id: n_reg_oa_case_canterbury_riesling_offer
    node_type: production_case
    name: "A North Canterbury buyer needs a dry aromatic Riesling for a by-the-glass list. Two regional
      offers both have citrus and floral aromas: lot A is documented dry and meets the panel’s balance
      brief; lot B is documented sweet and balanced for a dessert use. The listed purchase cost is equal,
      but bottle quantities, expected turnover and supplier payment terms are not yet checked. Explain an
      action, reason, tradeoff and limitation without inferring sweetness or quality from perfume alone."
  - id: n_reg_oa_point_case_canterbury_riesling_offer_action
    node_type: learning_point
    name: Select the documented dry Canterbury candidate subject to supply checks
  - id: n_reg_oa_point_case_canterbury_riesling_offer_reason
    node_type: learning_point
    name: North Canterbury Riesling breadth requires product sweetness evidence
  - id: n_reg_oa_point_case_canterbury_riesling_offer_tradeoff
    node_type: learning_point
    name: A dry-list choice forgoes the sweet offer’s separate dessert use
  - id: n_reg_oa_point_case_canterbury_riesling_offer_limitation
    node_type: learning_point
    name: Two Canterbury offers cannot establish demand or all regional Riesling styles
  - id: n_reg_oa_case_robertson_water_plan
    node_type: production_case
    name: A Robertson grower plans dry Chardonnay from two blocks. Repeated vine-water measurements and
      soil-moisture checks show block A becoming excessively stressed while block B remains adequate;
      fruit maturity checks have not yet justified harvesting either block. The permitted water
      allocation is limited. Applying the proposed irrigation to A would use part of the remaining
      reserve and require an electricity payment before wine sales. Forecast rain is uncertain. Explain
      an action, reason, tradeoff and limitation without prescribing an unmeasured water dose or assuming
      smaller crops always improve quality.
  - id: n_reg_oa_point_case_robertson_water_plan_action
    node_type: learning_point
    name: Prioritise a measured Robertson response to the stressed block and reassess
  - id: n_reg_oa_point_case_robertson_water_plan_reason
    node_type: learning_point
    name: Cooling Robertson air does not supply the water needed by stressed vines
  - id: n_reg_oa_point_case_robertson_water_plan_tradeoff
    node_type: learning_point
    name: Responding to A consumes remaining water and cash before sale
  - id: n_reg_oa_point_case_robertson_water_plan_limitation
    node_type: learning_point
    name: The Robertson scenario lacks measurements needed for a fixed dose or harvest decision
