knowledge_items:
  - id: ki_reg_oa_hunter_early
    subject_id: n_reg_oa_principle_hunter_style
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_oa_point_hunter_early
    domain_id: viticulture
    assertion_text: Wine Australia describes Hunter Semillon picked early with ripe flavours at relatively
      low sugar, supporting a delicate, lower-alcohol dry style. This qualifies the shortcut that a warm
      region must produce a heavy white. Assess fruit flavour, sugar and acidity together rather than
      prescribing one harvest date or assuming every Semillon follows this style.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_hunter_bottle
    subject_id: n_reg_oa_principle_hunter_style
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_oa_point_hunter_bottle
    domain_id: winemaking
    assertion_text: Thomas Wines describes classic Hunter Semillon fermented in stainless steel without oak,
      with citrus-led youth developing toast, honey and lemon-curd characters in bottle. Toast therefore
      does not prove barrel use. Rate of development depends on vineyard, vintage and storage, and a
      mature expression is not automatically preferable to a fresh young one.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_hunter_moderation
    subject_id: n_reg_oa_principle_hunter_harvest
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_oa_point_hunter_moderation
    domain_id: geography
    assertion_text: Hunter Valley is warm and humid, but Wine Australia identifies cloud cover, rainfall and
      gentle sea breezes as moderating influences. These help explain why the label warm cannot
      substitute for actual ripening observations. They do not remove vintage variation, rainfall
      exposure or the need to assess a particular parcel.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_hunter_rain
    subject_id: n_reg_oa_principle_hunter_harvest
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_oa_point_hunter_rain
    domain_id: viticulture
    assertion_text: Wine Australia notes rain during Hunter harvest in some years. For an early-picked
      Semillon target, representative sugar, acid, pH and flavour assessment should be considered with
      fruit health, forecast rain and labour access. A forecast alone neither establishes that fruit is
      ready nor justifies delaying every block to a standard date.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_mclaren_varietal_blend
    subject_id: n_reg_oa_principle_mclaren_routes
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_oa_point_mclaren_varietal_blend
    domain_id: winemaking
    assertion_text: Wine Australia identifies Grenache as a component of McLaren Vale GSM blends as well as a
      varietal wine. Raspberry-led fruit and spice are described tendencies, not a unique origin
      signature. A varietal label and a blend use different component possibilities; neither route
      establishes a universal alcohol level, superior balance or higher price.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_mclaren_whole_berries
    subject_id: n_reg_oa_principle_mclaren_routes
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_oa_point_mclaren_whole_berries
    domain_id: winemaking
    assertion_text: Yangarra’s 2024 Old Vine Grenache record describes gentle destemming with both crushed
      and intact berries retained before stainless-steel fermentation. Whole berries here do not mean
      whole bunches with stems. This is a named vintage example of handling choices, not evidence that
      every McLaren Grenache uses one recipe or that vine age guarantees quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_mclaren_gentle_cap
    subject_id: n_reg_oa_principle_mclaren_cellar
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_oa_point_mclaren_gentle_cap
    domain_id: winemaking
    assertion_text: For 2024 Old Vine Grenache, Yangarra describes gentle pump overs, sometimes only wetting
      the cap, alongside extended skin contact for some parcels and exclusion of pressings. A gentle
      daily regime is therefore compatible with a longer maceration. Evaluate the complete extraction
      record and actual tannins rather than treating one intensity or duration as a quality rule.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_mclaren_ceramic
    subject_id: n_reg_oa_principle_mclaren_cellar
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_oa_point_mclaren_ceramic
    domain_id: winemaking
    assertion_text: Yangarra records 2024 Ovitelli Grenache fermented and matured in ceramic eggs without
      oak, whereas its 2024 Old Vine wine uses a mixture including older oak and nonwood vessels. These
      examples distinguish wood exposure from the shared grape and region. Differences cannot be assigned
      to vessel alone because parcel selection and extraction also differ.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_adelaide_warm_slopes
    subject_id: n_reg_oa_principle_adelaide_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_oa_point_adelaide_warm_slopes
    domain_id: geography
    assertion_text: Wine Australia describes a generally cool, hilly Adelaide Hills environment with varied
      valleys, yet some northern west-facing slopes are warm enough for Cabernet Sauvignon. This is a
      specific exception to a region-wide coolness shortcut. Grape suitability still needs actual
      exposure, season and fruit records; the statement does not cover every west-facing vineyard.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_adelaide_sauvignon
    subject_id: n_reg_oa_principle_adelaide_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_oa_point_adelaide_sauvignon
    domain_id: winemaking
    assertion_text: The Adelaide Hills profile describes Sauvignon Blanc with ripe tropical fruit, gooseberry
      or herbal nuances and crisp acidity. These tendencies can coexist in a cool region; herbaceousness
      is not the sole possible profile. Picking and production evidence should qualify a comparison, and
      overlapping aromas cannot establish an unknown wine’s origin.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_adelaide_m3_sources
    subject_id: n_reg_oa_principle_adelaide_m3
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_oa_point_adelaide_m3_sources
    domain_id: geography
    assertion_text: Shaw + Smith identifies Lenswood, Piccadilly and Lobethal fruit, supplemented by selected
      growers, for 2025 M3 Chardonnay. A multi-site wine cannot directly establish the style of one
      individual vineyard. Compare sourcing and season before attributing its profile to a single
      elevation, soil name or subregion.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_adelaide_m3_process
    subject_id: n_reg_oa_principle_adelaide_m3
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_oa_point_adelaide_m3_process
    domain_id: winemaking
    assertion_text: The 2025 M3 record describes whole-bunch pressing, French-oak alcoholic and malolactic
      fermentation, then blending batches in stainless steel. This separates pressing, fermentation and
      final assembly choices within one Chardonnay example. A stainless-steel blending vat does not mean
      the wine was unoaked, and this producer route is not mandatory for Adelaide Hills Chardonnay.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_nelson_moutere
    subject_id: n_reg_oa_principle_nelson_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_oa_point_nelson_moutere
    domain_id: geography
    assertion_text: New Zealand Winegrowers describes Nelson’s Moutere Hills as slightly warmer and wetter
      than Waimea, with gravel-threaded clay soils and Pinot Noir examples showing structure.
      Temperature, rainfall and soil texture are separate comparison variables. Their coexistence does
      not prove that clay directly creates richness, mineral flavour or better wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_nelson_waimea
    subject_id: n_reg_oa_principle_nelson_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_oa_point_nelson_waimea
    domain_id: geography
    assertion_text: Waimea Plains have stony alluvial soils and a moderating maritime influence; the regional
      body describes lighter, fresher tendencies relative to Moutere. These are broad observations to
      test with matched grape, vintage and cellar treatment. They do not establish uniform body or blind
      origin, and the page’s flinty soil-flavour suggestion is not a causal explanation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_canterbury_waipara
    subject_id: n_reg_oa_principle_canterbury_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_oa_point_canterbury_waipara
    domain_id: geography
    assertion_text: The North Canterbury profile describes surrounding Waipara hills providing protection and
      a somewhat warmer setting, while the drying nor’wester remains a challenge. A protected regional
      setting is not immunity from wind or water stress. Compare actual exposure and vine condition when
      explaining ripening rather than equating shelter with guaranteed balance.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_canterbury_plains
    subject_id: n_reg_oa_principle_canterbury_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_oa_point_canterbury_plains
    domain_id: geography
    assertion_text: The Canterbury Plains are described as predominantly flat or gently contoured, slightly
      cooler than Waipara and often on shallow free-draining greywacke gravels. This contrasts terrain,
      drainage and thermal context for Riesling or Pinot Noir. Parcel water availability and season
      remain necessary; the soil description does not by itself predict flavour, irrigation need or
      quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_canterbury_riesling
    subject_id: n_reg_oa_principle_canterbury_styles
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_oa_point_canterbury_riesling
    domain_id: winemaking
    assertion_text: New Zealand Winegrowers describes North Canterbury Riesling across dry and dessert
      expressions. A Riesling grape or regional label alone cannot establish residual sweetness; check
      the actual bottling and sensory balance. This breadth offers distinct product briefs, without
      making the sweeter or drier expression intrinsically better.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_canterbury_pinot
    subject_id: n_reg_oa_principle_canterbury_styles
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_oa_point_canterbury_pinot
    domain_id: winemaking
    assertion_text: The regional profile describes North Canterbury Pinot Noir from perfumed and lighter
      expressions to darker, more substantial examples. This range qualifies a single cool-region body or
      colour rule. Site, harvest and extraction records are needed to explain a particular pair; darkness
      does not establish a quality rank or uniquely identify origin.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_gisborne_patutahi
    subject_id: n_reg_oa_principle_gisborne_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_oa_point_gisborne_patutahi
    domain_id: geography
    assertion_text: The Gisborne profile places Patutahi inland with warmer, lower-rainfall conditions and
      well-draining sloping clay and silt soils, and describes rich Gewurztraminer examples. This is a
      site and grape association, not proof that clay creates the wine’s flavour or that all Gisborne
      whites are rich or sweet.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_gisborne_manutuke
    subject_id: n_reg_oa_principle_gisborne_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_oa_point_gisborne_manutuke
    domain_id: geography
    assertion_text: Manutuke offers a coastal Gisborne context with Chardonnay on well-drained sandy sites
      and heavier clay settings towards the hillier west. Near-river conditions can also support
      botrytised examples. Distinguish parcel, grape and intended product before transferring inland
      Patutahi observations to every coastal lot; coastal location alone does not guarantee dry wine or
      freedom from rot.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_constantia_aspects
    subject_id: n_reg_oa_principle_constantia_blocks
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_oa_point_constantia_aspects
    domain_id: geography
    assertion_text: Klein Constantia’s farming account describes earlier-ripening east-facing Sauvignon sites
      and later south-facing sites, with afternoon shadow extending ripening in some elevated blocks. Its
      varied slopes require different harvest assessment. This is an estate observation, not a guarantee
      that every Constantia vineyard ripens in the same order or shares one temperature.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_constantia_assembly
    subject_id: n_reg_oa_principle_constantia_blocks
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_oa_point_constantia_assembly
    domain_id: winemaking
    assertion_text: Klein Constantia describes monitoring individual Sauvignon Blanc blocks and fermenting
      them separately before its estate blend. This preserves component options for assembly instead of
      assuming that a single regional label requires simultaneous picking or one common fermentation. The
      procedure alone does not establish that blending or single-block bottling is better.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_paarl_water_sites
    subject_id: n_reg_oa_principle_paarl_water
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_oa_point_paarl_water_sites
    domain_id: viticulture
    assertion_text: WOSA contrasts Paarl valley land using supplementary irrigation during the hot growing
      season with some better water-retaining eastern slope vineyards that may need none. Treat this as a
      regional comparison, not a prohibition or prescription. Actual soil depth, rooting, rainfall and
      vine measurements determine whether a particular block needs water.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_paarl_fairview
    subject_id: n_reg_oa_principle_paarl_water
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_oa_point_paarl_fairview
    domain_id: viticulture
    assertion_text: Fairview describes Shiraz and Pinotage among the varieties selected at its warm Paarl
      sites, with most home vineyards trellised and given supplementary summer drip irrigation alongside
      an older bush-vine Pinotage block. A warm-region label therefore does not establish one training
      system or dry-farming recipe. This remains one producer’s context, not all Paarl.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_robertson_water
    subject_id: n_reg_oa_principle_robertson_chardonnay
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_oa_point_robertson_water
    domain_id: viticulture
    assertion_text: WOSA describes lower-rainfall Robertson with warm summers moderated by south-easterly
      winds and an important Breede River water context. De Wetshof’s 2025 Limestone Hill record adds
      soil-moisture-monitored irrigation. Cooling air is not a substitute for measuring water supply; a
      Chardonnay comparison should separate heat moderation from the grower’s irrigation decision.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_robertson_unwooded
    subject_id: n_reg_oa_principle_robertson_chardonnay
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_oa_point_robertson_unwooded
    domain_id: winemaking
    assertion_text: De Wetshof records stainless-steel fermentation and controlled-temperature lees contact
      with stirring for its unwooded 2025 Limestone Hill Chardonnay. Thus a Robertson Chardonnay can use
      lees handling without barrel maturation. Assess actual texture and fruit before assigning richness
      to oak or limestone; this is a product example, not a mandatory regional method.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_pinotage_sort_cap
    subject_id: n_reg_oa_principle_paarl_pinotage
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_oa_point_pinotage_sort_cap
    domain_id: winemaking
    assertion_text: Fairview’s Primo Pinotage 2018 record describes destemming, hand sorting to remove
      raisins and green stems, open-top fermentation and manual punch downs. These are selected handling
      and extraction choices for a dry-farmed Paarl bush-vine example. They do not mean that all Pinotage
      needs the same cap work, or that hand work and reduced crop guarantee quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_pinotage_oak_comparison
    subject_id: n_reg_oa_principle_paarl_pinotage
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_oa_point_pinotage_oak_comparison
    domain_id: winemaking
    assertion_text: "The 2018 Primo record uses a larger new-oak share and longer barrel maturation than the
      standard Fairview Pinotage 2018 record. This supplies a same-producer, same-year comparison of
      cellar choices, not an isolated experiment: sites and handling differ too. More new wood or time
      cannot alone prove better integration, sensory quality or a market premium."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_case_hunter_toast_action
    subject_id: n_reg_oa_case_hunter_toast
    relation_type: CASE_ACTION
    object_id: n_reg_oa_point_case_hunter_toast_action
    domain_id: winemaking
    assertion_text: Correct the barrel inference using the stated no-oak records and compare the actual young
      and mature profiles. Use bottle development as a supported explanation while retaining the
      different vintages and vineyard lots as variables. Assess quality separately from the presence of
      toast.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_case_hunter_toast_reason
    subject_id: n_reg_oa_case_hunter_toast
    relation_type: CASE_REASON
    object_id: n_reg_oa_point_case_hunter_toast_reason
    domain_id: winemaking
    assertion_text: The documented classic Hunter route can develop toast and honey with bottle age despite
      stainless-steel fermentation. The supplied records therefore support a mechanism other than oak for
      this tasting. The mature aroma is evidence of style development, not itself a ranking above the
      citrus-led young wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_case_hunter_toast_tradeoff
    subject_id: n_reg_oa_case_hunter_toast
    relation_type: CASE_TRADEOFF
    object_id: n_reg_oa_point_case_hunter_toast_tradeoff
    domain_id: winemaking
    assertion_text: This pair makes the young-to-mature style contrast easy to discuss but cannot isolate
      bottle age because vintage and vineyard lot also change. Adding a reliably stored same-lot series
      would improve attribution while requiring additional bottles and time. The illustrative comparison
      can still be useful if its confounding is stated.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_case_hunter_toast_limitation
    subject_id: n_reg_oa_case_hunter_toast
    relation_type: CASE_LIMITATION
    object_id: n_reg_oa_point_case_hunter_toast_limitation
    domain_id: winemaking
    assertion_text: The records exclude oak for these two wines but do not resolve all storage, vintage and
      parcel effects. Neither the aroma description nor age establishes a fixed drinking window, perfect
      preservation, higher quality or the origin of a different blind wine. Reassess each actual bottle.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_case_mclaren_cap_trial_action
    subject_id: n_reg_oa_case_mclaren_cap_trial
    relation_type: CASE_ACTION
    object_id: n_reg_oa_point_case_mclaren_cap_trial_action
    domain_id: winemaking
    assertion_text: Use trial A as the candidate for the stated early-drinking brief, then confirm
      repeatability, full-scale handling and saleable quantity. Keep trial B as a sound alternative for a
      different tannin target rather than classifying it as poor wine solely because it misses this
      brief.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_case_mclaren_cap_trial_reason
    subject_id: n_reg_oa_case_mclaren_cap_trial
    relation_type: CASE_REASON
    object_id: n_reg_oa_point_case_mclaren_cap_trial_reason
    domain_id: winemaking
    assertion_text: The same lot and held yeast, temperature, duration and vessel reduce several competing
      explanations, while the panel supplies the actual tannin result. Yangarra documents a gentle-cap
      route in McLaren Grenache, but that example does not establish the outcome here; the trial evidence
      supports this candidate selection.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_case_mclaren_cap_trial_tradeoff
    subject_id: n_reg_oa_case_mclaren_cap_trial
    relation_type: CASE_TRADEOFF
    object_id: n_reg_oa_point_case_mclaren_cap_trial_tradeoff
    domain_id: winemaking
    assertion_text: A fits this brief while B could fit customers seeking a firmer structure. Selecting A
      narrows the immediate style offer; retaining both would require separate handling and stock
      decisions. Unknown full-scale labour and volume prevent a claim that the gentler schedule
      necessarily costs less or earns more.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_case_mclaren_cap_trial_limitation
    subject_id: n_reg_oa_case_mclaren_cap_trial
    relation_type: CASE_LIMITATION
    object_id: n_reg_oa_point_case_mclaren_cap_trial_limitation
    domain_id: winemaking
    assertion_text: The trial does not establish repeatability across tanks, vineyards or vintages, nor the
      labour and saleable output of a commercial batch. Confirm those before treating A as a general
      production recipe. One preferred panel result is not proof that intensive extraction is
      intrinsically inferior.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_case_canterbury_riesling_offer_action
    subject_id: n_reg_oa_case_canterbury_riesling_offer
    relation_type: CASE_ACTION
    object_id: n_reg_oa_point_case_canterbury_riesling_offer_action
    domain_id: winemaking
    assertion_text: Shortlist A for the stated dry by-the-glass purpose and check available quantity,
      consistency and service trials. Keep B for a possible dessert slot because its supplied sweetness
      and balance suit a different product brief. Equal listed cost does not resolve inventory needs or
      likely sales.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_case_canterbury_riesling_offer_reason
    subject_id: n_reg_oa_case_canterbury_riesling_offer
    relation_type: CASE_REASON
    object_id: n_reg_oa_point_case_canterbury_riesling_offer_reason
    domain_id: winemaking
    assertion_text: The regional reference explicitly includes dry and dessert Riesling expressions, so
      floral or citrus perfume and shared origin do not distinguish sweetness. Here the product records
      and panel establish the two styles. The dry requirement, rather than an assumed regional quality
      rank, explains the candidate choice.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_case_canterbury_riesling_offer_tradeoff
    subject_id: n_reg_oa_case_canterbury_riesling_offer
    relation_type: CASE_TRADEOFF
    object_id: n_reg_oa_point_case_canterbury_riesling_offer_tradeoff
    domain_id: business
    assertion_text: A meets the immediate brief while adding B could broaden dessert options but commit extra
      stock and cash. Equal purchase cost does not make expected turnover or payment timing equal.
      Evaluate demand and terms before taking both; a narrower list can fit the brief without making the
      sweet wine inferior.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_case_canterbury_riesling_offer_limitation
    subject_id: n_reg_oa_case_canterbury_riesling_offer
    relation_type: CASE_LIMITATION
    object_id: n_reg_oa_point_case_canterbury_riesling_offer_limitation
    domain_id: winemaking
    assertion_text: These analyses and tastings apply to the supplied lots. Future replacements need fresh
      sweetness and balance checks, and no sales evidence currently establishes turnover. The comparison
      cannot define all North Canterbury Riesling or identify a blind origin from citrus and floral
      aromas.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_case_robertson_water_plan_action
    subject_id: n_reg_oa_case_robertson_water_plan
    relation_type: CASE_ACTION
    object_id: n_reg_oa_point_case_robertson_water_plan_action
    domain_id: viticulture
    assertion_text: Use the combined vine and soil measurements to prioritise an appropriate monitored
      response for A within the stated allocation, while continuing to assess B and both lots’ maturity.
      Check system performance and reassess after intervention. Neither a regional breeze nor uncertain
      rain justifies ignoring the measured stress.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_case_robertson_water_plan_reason
    subject_id: n_reg_oa_case_robertson_water_plan
    relation_type: CASE_REASON
    object_id: n_reg_oa_point_case_robertson_water_plan_reason
    domain_id: viticulture
    assertion_text: Robertson’s cooling winds moderate heat but do not establish adequate root-zone water.
      The supplied repeated measurements distinguish a stressed block from an adequate one, consistent
      with monitoring-based irrigation practice. A fixed dose for both blocks would ignore their
      different current conditions and rooting/soil context.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_case_robertson_water_plan_tradeoff
    subject_id: n_reg_oa_case_robertson_water_plan
    relation_type: CASE_TRADEOFF
    object_id: n_reg_oa_point_case_robertson_water_plan_tradeoff
    domain_id: business
    assertion_text: The response can address A’s measured stress but uses part of the limited reserve and
      requires the stated early electricity payment. Compare water needs, forecast changes and cash
      timing before committing further applications. Conserving all resources while stress worsens also
      has consequences; no cost or quality optimum is supplied.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
  - id: ki_reg_oa_case_robertson_water_plan_limitation
    subject_id: n_reg_oa_case_robertson_water_plan
    relation_type: CASE_LIMITATION
    object_id: n_reg_oa_point_case_robertson_water_plan_limitation
    domain_id: viticulture
    assertion_text: The facts do not supply a water dose, root-zone distribution, system efficiency or
      sufficient fruit maturity for harvesting. Monitor results and update the plan with qualified local
      assessment rather than deriving one universal schedule. Reduced growth or crop size is not evidence
      of better Chardonnay, and water spending alone cannot prove quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:06:45.000Z"
