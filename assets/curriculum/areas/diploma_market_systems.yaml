{
  "knowledge_nodes": [
    {
      "id": "n_d2market_us_tiers",
      "node_type": "production_principle",
      "name": "In the Texas regulator's model, which roles describe movement from production to the consumer?"
    },
    {
      "id": "n_d2market_us_tiers_point",
      "node_type": "learning_point",
      "name": "Manufacture, wholesale distribution and consumer retail"
    },
    {
      "id": "n_d2market_us_variation",
      "node_type": "production_principle",
      "name": "A wine partner offers the same route in every US state. What does TTB's guidance require the producer to investigate?"
    },
    {
      "id": "n_d2market_us_variation_point",
      "node_type": "learning_point",
      "name": "The relevant state and local requirements alongside federal rules"
    },
    {
      "id": "n_d2market_us_federal",
      "node_type": "production_principle",
      "name": "Which inference is justified when an importer presents a federal basic permit?"
    },
    {
      "id": "n_d2market_us_federal_point",
      "node_type": "learning_point",
      "name": "It addresses a federal role; destination requirements still need checking"
    },
    {
      "id": "n_d2market_ew_authority",
      "node_type": "production_principle",
      "name": "For an ordinary wine shop's premises-licence application in England and Wales, which authority is the relevant starting point?"
    },
    {
      "id": "n_d2market_ew_authority_point",
      "node_type": "learning_point",
      "name": "The relevant local licensing authority"
    },
    {
      "id": "n_d2market_ew_scope",
      "node_type": "production_principle",
      "name": "A proposed England and Wales shop will offer takeaway bottles and on-site drinking. Which distinction belongs in its operating schedule?"
    },
    {
      "id": "n_d2market_ew_scope_point",
      "node_type": "learning_point",
      "name": "Consumption on the premises, off the premises, or both"
    },
    {
      "id": "n_d2market_ew_personal",
      "node_type": "production_principle",
      "name": "An ordinary premises-licensed England and Wales shop plans authorised staff sales. Which statement matches the cited framework?"
    },
    {
      "id": "n_d2market_ew_personal_point",
      "node_type": "learning_point",
      "name": "Personal-licence holders can authorise sales by other staff"
    },
    {
      "id": "n_d2market_se_retail",
      "node_type": "production_principle",
      "name": "Which operator anchors Sweden's ordinary state-owned wine retail model?"
    },
    {
      "id": "n_d2market_se_retail_point",
      "node_type": "learning_point",
      "name": "Systembolaget"
    },
    {
      "id": "n_d2market_se_mission",
      "node_type": "production_principle",
      "name": "Which mission does Systembolaget state when explaining its retail monopoly?"
    },
    {
      "id": "n_d2market_se_mission_point",
      "node_type": "learning_point",
      "name": "Responsible sales to limit alcohol harm"
    },
    {
      "id": "n_d2market_se_supplier",
      "node_type": "production_principle",
      "name": "According to Systembolaget, how can an overseas producer approach its supplier route?"
    },
    {
      "id": "n_d2market_se_supplier_point",
      "node_type": "learning_point",
      "name": "Work through an approved Swedish supplier or establish one"
    },
    {
      "id": "n_d2market_se_serving",
      "node_type": "production_principle",
      "name": "Which distinction matters when comparing Swedish restaurant accounts with ordinary take-home wine retail?"
    },
    {
      "id": "n_d2market_se_serving_point",
      "node_type": "learning_point",
      "name": "Municipal serving permissions are distinct from the retail operator's role"
    },
    {
      "id": "n_d2market_se_farm",
      "node_type": "production_principle",
      "name": "A colleague says Sweden's 2025 farm-sales change permits unrestricted retail by any producer. Which interpretation is supported?"
    },
    {
      "id": "n_d2market_se_farm_point",
      "node_type": "learning_point",
      "name": "A restricted, permitted, visit-linked route exists"
    },
    {
      "id": "n_d2market_case_us_entry",
      "node_type": "production_case",
      "name": "Hypothetical overseas winery: a partner proposes importing wine into the US, wholesaling in Texas and selling to restaurant retailers. It offers an 800-bottle launch paid 60 days after delivery. A second offer is a 200-bottle prepaid Texas pilot with producer-funded tastings and follow-up. A supplier bill is due in 30 days, but available cash, full costs and account demand are unknown. The first partner claims its federal permit makes the same route available in every state. All volumes, dates and offers are fictional. Compare the roles, recommend a conditional launch, explain the evidence, weigh a trade-off and identify what could change the decision. No actual transaction permission is supplied."
    },
    {
      "id": "n_d2market_case_us_entry_action_point",
      "node_type": "learning_point",
      "name": "Trial a route after checking permissions, capacity and cash"
    },
    {
      "id": "n_d2market_case_us_entry_reason_point",
      "node_type": "learning_point",
      "name": "Federal and state roles differ; receipts follow the supplied bill"
    },
    {
      "id": "n_d2market_case_us_entry_tradeoff_point",
      "node_type": "learning_point",
      "name": "Partner scale against pilot size and producer support work"
    },
    {
      "id": "n_d2market_case_us_entry_limitation_point",
      "node_type": "learning_point",
      "name": "Actual permissions, terms, demand and liquidity remain unknown"
    },
    {
      "id": "n_d2market_case_ew_retail",
      "node_type": "production_case",
      "name": "Hypothetical independent wine shop in England and Wales: its manager holds a personal licence. The shop proposes takeaway bottles and a small paid on-site tasting area, but nobody has checked premises authorisation, conditions or the operating schedule. Bottles for each activity come from the same sound stock. A tasting proposal adds quoted staff and seating costs; its demand and incremental revenue are unknown. A bottle-only proposal has fewer supplied operating tasks but no profit estimate. All commercial inputs are fictional. Recommend a conditional operating model, explain the licensing-role distinction, weigh the customer and resource trade-off, and identify missing evidence. Do not infer permission from the manager's licence alone."
    },
    {
      "id": "n_d2market_case_ew_retail_action_point",
      "node_type": "learning_point",
      "name": "Check actual premises scope before selecting the operating model"
    },
    {
      "id": "n_d2market_case_ew_retail_reason_point",
      "node_type": "learning_point",
      "name": "Personal authorisation does not establish premises scope"
    },
    {
      "id": "n_d2market_case_ew_retail_tradeoff_point",
      "node_type": "learning_point",
      "name": "Tasting engagement against added staff and space costs"
    },
    {
      "id": "n_d2market_case_ew_retail_limitation_point",
      "node_type": "learning_point",
      "name": "Permissions, conditions and incremental returns are missing"
    },
    {
      "id": "n_d2market_case_sweden_access",
      "node_type": "production_case",
      "name": "Hypothetical overseas producer considering Sweden: one proposal uses a Swedish supplier to seek Systembolaget access; another targets restaurant accounts with producer tastings and follow-up. No listing, buyer demand, commercial prices, costs, supplier approval or venue permissions have been supplied. A colleague proposes direct unrestricted consumer sales because farm sales were introduced in 2025. The producer has no Swedish production or visit arrangements in this case. All business proposals are fictional. Recommend a conditional route investigation, explain the retail, supplier and serving distinction, weigh the trade-off in access and workload, and identify what still needs checking. Do not decide individual eligibility from the news."
    },
    {
      "id": "n_d2market_case_sweden_access_action_point",
      "node_type": "learning_point",
      "name": "Investigate supplier and restaurant routes within their own conditions"
    },
    {
      "id": "n_d2market_case_sweden_access_reason_point",
      "node_type": "learning_point",
      "name": "Retail access, serving and restricted farm sales are different routes"
    },
    {
      "id": "n_d2market_case_sweden_access_tradeoff_point",
      "node_type": "learning_point",
      "name": "Supplier reach against dependency and direct account-support work"
    },
    {
      "id": "n_d2market_case_sweden_access_limitation_point",
      "node_type": "learning_point",
      "name": "Supplier, venue and farm eligibility plus commercial evidence are missing"
    }
  ],
