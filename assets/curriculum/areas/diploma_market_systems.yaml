  "knowledge_items": [
    {
      "id": "ki_d2market_us_tiers",
      "subject_id": "n_d2market_us_tiers",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d2market_us_tiers_point",
      "domain_id": "business",
      "assertion_text": "Texas's regulator uses manufacturer, distributor or wholesaler, and retailer roles to explain its three-tier model. This illustrates one state; it does not require three separate businesses in every US transaction.",
      "verification_status": "unverified",
      "last_verified_at": "2026-10-02T22:15:36.000Z",
      "mcq_disabled": true
    },
    {
      "id": "ki_d2market_us_variation",
      "subject_id": "n_d2market_us_variation",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d2market_us_variation_point",
      "domain_id": "business",
      "assertion_text": "TTB describes state regulation of production, sale and distribution and warns that requirements differ. Investigate the destination's authorities rather than treating one state's route as a national permission.",
      "verification_status": "unverified",
      "last_verified_at": "2026-10-02T22:15:36.000Z",
      "mcq_disabled": true
    },
    {
      "id": "ki_d2market_us_federal",
      "subject_id": "n_d2market_us_federal",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d2market_us_federal_point",
      "domain_id": "business",
      "assertion_text": "27 USC 203 distinguishes federal importing and wholesale businesses. TTB guidance separately directs businesses to state and local authorities. A federal permit alone does not establish permission for every proposed sales channel.",
      "verification_status": "unverified",
      "last_verified_at": "2026-10-02T22:15:36.000Z",
      "mcq_disabled": true
    },
    {
      "id": "ki_d2market_ew_authority",
      "subject_id": "n_d2market_ew_authority",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d2market_ew_authority_point",
      "domain_id": "business",
      "assertion_text": "Section 17 places a premises-licence application with the relevant licensing authority. Home Office guidance usually identifies the local council. This lesson covers England and Wales, not Scotland or Northern Ireland.",
      "verification_status": "unverified",
      "last_verified_at": "2026-10-02T22:15:36.000Z",
      "mcq_disabled": true
    },
    {
      "id": "ki_d2market_ew_scope",
      "subject_id": "n_d2market_ew_scope",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d2market_ew_scope_point",
      "domain_id": "business",
      "assertion_text": "Section 17(4)(f) distinguishes on-premises and off-premises consumption. Proposed activities must be checked against actual authorisation and conditions; a commercial plan does not establish permission.",
      "verification_status": "unverified",
      "last_verified_at": "2026-10-02T22:15:36.000Z",
      "mcq_disabled": true
    },
    {
      "id": "ki_d2market_ew_personal",
      "subject_id": "n_d2market_ew_personal",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d2market_ew_personal_point",
      "domain_id": "business",
      "assertion_text": "Sections 19 and 111 distinguish personal authorisation from premises licensing. Home Office guidance does not require every authorised seller to hold a personal licence. Exceptions and the actual premises conditions must still be checked.",
      "verification_status": "unverified",
      "last_verified_at": "2026-10-02T22:15:36.000Z",
      "mcq_disabled": true
    },
    {
      "id": "ki_d2market_se_retail",
      "subject_id": "n_d2market_se_retail",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d2market_se_retail_point",
      "domain_id": "business",
      "assertion_text": "Systembolaget is the state-owned retail operator. The Alcohol Act's retail provisions are distinct from serving and restricted farm sales, so the model should not be described as every kind of alcohol sale.",
      "verification_status": "unverified",
      "last_verified_at": "2026-10-02T22:15:36.000Z",
      "mcq_disabled": true
    },
    {
      "id": "ki_d2market_se_mission",
      "subject_id": "n_d2market_se_mission",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d2market_se_mission_point",
      "domain_id": "business",
      "assertion_text": "The operator describes a public-health mission rather than maximising sales. That statement does not establish a particular wine's consumer demand, listing, profitability or health effect.",
      "verification_status": "unverified",
      "last_verified_at": "2026-10-02T22:15:36.000Z",
      "mcq_disabled": true
    },
    {
      "id": "ki_d2market_se_supplier",
      "subject_id": "n_d2market_se_supplier",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d2market_se_supplier_point",
      "domain_id": "business",
      "assertion_text": "Systembolaget describes buying through Swedish importers or beverage suppliers approved by tax authorities. A producer can partner with such a supplier or establish one; neither route guarantees approval or listing.",
      "verification_status": "unverified",
      "last_verified_at": "2026-10-02T22:15:36.000Z",
      "mcq_disabled": true
    },
    {
      "id": "ki_d2market_se_serving",
      "subject_id": "n_d2market_se_serving",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d2market_se_serving_point",
      "domain_id": "business",
      "assertion_text": "Chapter 8 addresses municipal serving permissions, with exceptions. The Public Health Agency describes serving supervision separately from Systembolaget's retail model. A supplier's retail relationship does not prove a venue's serving permission.",
      "verification_status": "unverified",
      "last_verified_at": "2026-10-02T22:15:36.000Z",
      "mcq_disabled": true
    },
    {
      "id": "ki_d2market_se_farm",
      "subject_id": "n_d2market_se_farm",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d2market_se_farm_point",
      "domain_id": "business",
      "assertion_text": "Chapter 5a requires a farm-sales permit and a paid visit with an educational component. Eligibility and other conditions apply; this is not general unrestricted retail. The operator and Parliament describe the route's introduction in 2025.",
      "verification_status": "unverified",
      "last_verified_at": "2026-10-02T22:15:36.000Z",
      "mcq_disabled": true
    },
    {
      "id": "ki_d2market_case_us_entry_action",
      "subject_id": "n_d2market_case_us_entry",
      "relation_type": "CASE_ACTION",
      "object_id": "n_d2market_case_us_entry_action_point",
      "domain_id": "business",
      "assertion_text": "Consider the prepaid pilot or the larger partner launch conditionally, after checking destination permissions, actual services, promotional capacity and cash needed before receipts.",
      "verification_status": "unverified",
      "last_verified_at": "2026-10-02T22:15:36.000Z",
      "mcq_disabled": true
    },
    {
      "id": "ki_d2market_case_us_entry_reason",
      "subject_id": "n_d2market_case_us_entry",
      "relation_type": "CASE_REASON",
      "object_id": "n_d2market_case_us_entry_reason_point",
      "domain_id": "business",
      "assertion_text": "The federal importing or wholesale role does not settle state access. The supplied 60-day receipt follows the 30-day bill, so revenue promised later is not cash available earlier.",
      "verification_status": "unverified",
      "last_verified_at": "2026-10-02T22:15:36.000Z",
      "mcq_disabled": true
    },
    {
      "id": "ki_d2market_case_us_entry_tradeoff",
      "subject_id": "n_d2market_case_us_entry",
      "relation_type": "CASE_TRADEOFF",
      "object_id": "n_d2market_case_us_entry_tradeoff_point",
      "domain_id": "business",
      "assertion_text": "The larger offer could expand account reach but commits more stock and delays receipts; the prepaid pilot reduces that timing exposure while requiring producer tastings and follow-up.",
      "verification_status": "unverified",
      "last_verified_at": "2026-10-02T22:15:36.000Z",
      "mcq_disabled": true
    },
    {
      "id": "ki_d2market_case_us_entry_limitation",
      "subject_id": "n_d2market_case_us_entry",
      "relation_type": "CASE_LIMITATION",
      "object_id": "n_d2market_case_us_entry_limitation_point",
      "domain_id": "business",
      "assertion_text": "Verify the proposed entities and destination permissions, contract services, complete prices and costs, account demand and available cash. Neither offer proves net profitability or nationwide access.",
      "verification_status": "unverified",
      "last_verified_at": "2026-10-02T22:15:36.000Z",
      "mcq_disabled": true
    },
    {
      "id": "ki_d2market_case_ew_retail_action",
      "subject_id": "n_d2market_case_ew_retail",
      "relation_type": "CASE_ACTION",
      "object_id": "n_d2market_case_ew_retail_action_point",
      "domain_id": "business",
      "assertion_text": "Check the actual authorisation and conditions for the planned on-site and takeaway activities before choosing bottle-only retail, a tasting trial or both.",
      "verification_status": "unverified",
      "last_verified_at": "2026-10-02T22:15:36.000Z",
      "mcq_disabled": true
    },
    {
      "id": "ki_d2market_case_ew_retail_reason",
      "subject_id": "n_d2market_case_ew_retail",
      "relation_type": "CASE_REASON",
      "object_id": "n_d2market_case_ew_retail_reason_point",
      "domain_id": "business",
      "assertion_text": "The manager's personal licence concerns individual sales authorisation; the premises operating schedule distinguishes on-site and off-site consumption. The proposed activity still needs the relevant authority's permissions checked.",
      "verification_status": "unverified",
      "last_verified_at": "2026-10-02T22:15:36.000Z",
      "mcq_disabled": true
    },
    {
      "id": "ki_d2market_case_ew_retail_tradeoff",
      "subject_id": "n_d2market_case_ew_retail",
      "relation_type": "CASE_TRADEOFF",
      "object_id": "n_d2market_case_ew_retail_tradeoff_point",
      "domain_id": "business",
      "assertion_text": "A tasting area could improve customer engagement but adds the supplied staff and space costs. Bottle-only retail has fewer supplied tasks; neither model has proven demand or net profit.",
      "verification_status": "unverified",
      "last_verified_at": "2026-10-02T22:15:36.000Z",
      "mcq_disabled": true
    },
    {
      "id": "ki_d2market_case_ew_retail_limitation",
      "subject_id": "n_d2market_case_ew_retail",
      "relation_type": "CASE_LIMITATION",
      "object_id": "n_d2market_case_ew_retail_limitation_point",
      "domain_id": "business",
      "assertion_text": "Check the actual licence and conditions, staff authorisation arrangements, full operating costs and incremental revenue evidence. England and Wales evidence does not establish Scotland or Northern Ireland rules.",
      "verification_status": "unverified",
      "last_verified_at": "2026-10-02T22:15:36.000Z",
      "mcq_disabled": true
    },
    {
      "id": "ki_d2market_case_sweden_access_action",
      "subject_id": "n_d2market_case_sweden_access",
      "relation_type": "CASE_ACTION",
      "object_id": "n_d2market_case_sweden_access_action_point",
      "domain_id": "business",
      "assertion_text": "Investigate supplier access and restaurant accounts separately; do not approve unrestricted direct sales from the farm-sales news.",
      "verification_status": "unverified",
      "last_verified_at": "2026-10-02T22:15:36.000Z",
      "mcq_disabled": true
    },
    {
      "id": "ki_d2market_case_sweden_access_reason",
      "subject_id": "n_d2market_case_sweden_access",
      "relation_type": "CASE_REASON",
      "object_id": "n_d2market_case_sweden_access_reason_point",
      "domain_id": "business",
      "assertion_text": "Systembolaget describes an approved Swedish supplier route. Municipal serving permissions and the permitted, visit-linked farm-sales framework are distinct.",
      "verification_status": "unverified",
      "last_verified_at": "2026-10-02T22:15:36.000Z",
      "mcq_disabled": true
    },
    {
      "id": "ki_d2market_case_sweden_access_tradeoff",
      "subject_id": "n_d2market_case_sweden_access",
      "relation_type": "CASE_TRADEOFF",
      "object_id": "n_d2market_case_sweden_access_tradeoff_point",
      "domain_id": "business",
      "assertion_text": "A supplier could contribute retail access but creates dependency on its capabilities and terms; restaurant trials require account selection, tastings and follow-up. Neither offer guarantees demand.",
      "verification_status": "unverified",
      "last_verified_at": "2026-10-02T22:15:36.000Z",
      "mcq_disabled": true
    },
    {
      "id": "ki_d2market_case_sweden_access_limitation",
      "subject_id": "n_d2market_case_sweden_access",
      "relation_type": "CASE_LIMITATION",
      "object_id": "n_d2market_case_sweden_access_limitation_point",
      "domain_id": "business",
      "assertion_text": "Check supplier approval and buying requirements, venue permissions, current farm eligibility if relevant, and complete prices, costs and demand. No Swedish production or visit arrangement has been supplied.",
      "verification_status": "unverified",
      "last_verified_at": "2026-10-02T22:15:36.000Z",
      "mcq_disabled": true
    }
