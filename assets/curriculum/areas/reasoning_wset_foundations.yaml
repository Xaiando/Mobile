knowledge_items:
  - id: ki_wset_reason_frost_shoots
    subject_id: n_wset_reason_frost_premise
    relation_type: CAUSES_STATE
    object_id: n_wset_reason_frost_shoots
    domain_id: viticulture
    assertion_text: "When spring frost kills a measured subset of fruitful primary shoots and no replacements emerge, fewer of those fruitful shoots remain. This does not assert that every frost has this effect."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T10:49:00.000Z"
  - id: ki_wset_reason_frost_clusters
    subject_id: n_wset_reason_frost_shoots
    relation_type: LEADS_TO
    object_id: n_wset_reason_frost_clusters
    domain_id: viticulture
    assertion_text: "With surviving shoots retaining the same cluster number and no compensating secondary or lateral clusters, loss of fruitful primary shoots reduces potential primary-shoot cluster number; final harvested yield may still vary."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T10:49:00.000Z"
  - id: ki_wset_reason_frost_contra_more_shoots
    subject_id: n_wset_reason_frost_premise
    relation_type: CONTRADICTS
    object_id: n_wset_reason_frost_wrong_more_shoots
    domain_id: viticulture
    assertion_text: "Killing a measured subset of initially equal fruitful primary shoots cannot increase the surviving count in the injured block under the specified no-replacement comparison."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T10:49:00.000Z"
  - id: ki_wset_reason_frost_contra_same_clusters
    subject_id: n_wset_reason_frost_premise
    relation_type: CONTRADICTS
    object_id: n_wset_reason_frost_wrong_same_clusters
    domain_id: viticulture
    assertion_text: "Loss of fruitful primary shoots reduces their cluster sites when clusters per surviving shoot stay fixed and no secondary or lateral shoots replace lost clusters."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T10:49:00.000Z"
  - id: ki_wset_reason_frost_contra_no_clusters
    subject_id: n_wset_reason_frost_premise
    relation_type: CONTRADICTS
    object_id: n_wset_reason_frost_wrong_no_clusters
    domain_id: viticulture
    assertion_text: "The premise explicitly leaves fruitful primary shoots alive with inflorescences, so it does not support total primary-shoot cluster loss in the injured block."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T10:49:00.000Z"
  - id: ki_wset_reason_ferment_consumed
    subject_id: n_wset_reason_ferment_premise
    relation_type: CAUSES_STATE
    object_id: n_wset_reason_ferment_consumed
    domain_id: winemaking
    assertion_text: "If equal-volume must A starts with more fermentable sugar and both musts finish dry, yeast consumes more fermentable sugar in A, with the other specified sugar fates matched."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T10:49:00.000Z"
  - id: ki_wset_reason_ferment_ethanol
    subject_id: n_wset_reason_ferment_consumed
    relation_type: LEADS_TO
    object_id: n_wset_reason_ferment_ethanol
    domain_id: winemaking
    assertion_text: "At the same ethanol yield per unit sugar consumed and equal final volume, the additional consumed fermentable sugar produces more ethanol; actual yield varies without these controls."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T10:49:00.000Z"
  - id: ki_wset_reason_ferment_contra_less_consumed
    subject_id: n_wset_reason_ferment_premise
    relation_type: CONTRADICTS
    object_id: n_wset_reason_ferment_wrong_less_consumed
    domain_id: winemaking
    assertion_text: "A begins with more fermentable sugar and both ferments finish dry; under the specified equal sugar fates, less sugar consumption in A contradicts the premise."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T10:49:00.000Z"
  - id: ki_wset_reason_ferment_contra_less_ethanol
    subject_id: n_wset_reason_ferment_premise
    relation_type: CONTRADICTS
    object_id: n_wset_reason_ferment_wrong_less_ethanol
    domain_id: winemaking
    assertion_text: "With more sugar consumed and identical ethanol yield per unit sugar, the controlled comparison cannot form less ethanol from that extra sugar."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T10:49:00.000Z"
  - id: ki_wset_reason_ferment_contra_no_co2
    subject_id: n_wset_reason_ferment_premise
    relation_type: CONTRADICTS
    object_id: n_wset_reason_ferment_wrong_no_co2
    domain_id: winemaking
    assertion_text: "Yeast alcoholic fermentation of sugar forms ethanol and carbon dioxide, contradicting a no-CO2 product claim for the additional sugar."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T10:49:00.000Z"
