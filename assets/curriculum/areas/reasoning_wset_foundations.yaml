# Original WSET Level 2/3 causal paths, also inherited by Diploma.
# Matched hypothetical comparisons isolate one mechanism; not reported trials.
# Each wrong option has direct cited contradiction evidence. Expert review pending.
knowledge_nodes:
  - id: n_wset_reason_frost_premise
    node_type: causal_premise
    name: "During early shoot growth after budbreak, two equally pruned blocks of the same cultivar have the same number of fruitful primary shoots and visible inflorescences per shoot. A spring frost kills a measured subset of these shoots in block A; block B is uninjured. Some fruitful primary shoots survive in A with their inflorescences. Through fruit set, secondary and lateral shoots add no replacement clusters, and surviving shoots retain the same inflorescence count per shoot. Compare potential primary-shoot cluster number before fruit set, not final harvested yield."
  - id: n_wset_reason_frost_shoots
    node_type: causal_state
    name: "Fewer living fruitful primary shoots in the frost-injured block"
  - id: n_wset_reason_frost_clusters
    node_type: causal_state
    name: "Fewer potential primary-shoot clusters in the frost-injured block"
  - id: n_wset_reason_frost_wrong_more_shoots
    node_type: causal_state
    name: "More fruitful primary shoots survive because of the frost"
  - id: n_wset_reason_frost_wrong_same_clusters
    node_type: causal_state
    name: "Unchanged primary-shoot cluster number despite lost fruitful shoots and no replacement"
  - id: n_wset_reason_frost_wrong_no_clusters
    node_type: causal_state
    name: "No primary-shoot clusters remain although fruitful primary shoots survived with inflorescences"
  - id: n_wset_reason_ferment_premise
    node_type: causal_premise
    name: "Equal-volume grape musts A and B are comparable except that A starts with a measured higher concentration of fermentable glucose and fructose. Both finish dry under the same yeast conversion yield per unit of sugar consumed and have the same final liquid volume. There is no added or removed alcohol, dilution, unequal sugar diversion to biomass, or unequal ethanol evaporation. Compare the ethanol made by alcoholic fermentation, without predicting an exact alcohol percentage."
  - id: n_wset_reason_ferment_consumed
    node_type: causal_state
    name: "More fermentable sugar is consumed by yeast in must A"
  - id: n_wset_reason_ferment_ethanol
    node_type: causal_state
    name: "More ethanol is formed by alcoholic fermentation in must A"
  - id: n_wset_reason_ferment_wrong_less_consumed
    node_type: causal_state
    name: "Less fermentable sugar is consumed in A although it starts higher and both finish dry"
  - id: n_wset_reason_ferment_wrong_less_ethanol
    node_type: causal_state
    name: "Less ethanol forms at the same conversion yield"
  - id: n_wset_reason_ferment_wrong_no_co2
    node_type: causal_state
    name: "No carbon dioxide is released when yeast ferments the additional sugar to ethanol"
node_alternative_names:
  - {knowledge_node_id: n_wset_reason_frost_shoots, name: "fewer surviving fruitful shoots", kind: synonym}
  - {knowledge_node_id: n_wset_reason_frost_clusters, name: "lower primary shoot cluster potential", kind: synonym}
  - {knowledge_node_id: n_wset_reason_ferment_consumed, name: "greater sugar consumption by yeast", kind: synonym}
  - {knowledge_node_id: n_wset_reason_ferment_ethanol, name: "greater ethanol formation from alcoholic fermentation", kind: synonym}
