# Original British sparkling category decisions. Source-bounded; expert review pending.
knowledge_nodes:
  - id: "n_d4brit_principle_pdo_origin"
    node_type: "production_principle"
    name: "What grape-origin evidence supports English or Welsh PDO sparkling?"
  - id: "n_d4brit_point_pdo_origin"
    node_type: "learning_point"
    name: "PDO sparkling uses only grapes from its named English or Welsh demarcation"
  - id: "n_d4brit_principle_pdo_grapes"
    node_type: "production_principle"
    name: "Does the English or Welsh PDO sparkling cultivar list stop at three Champagne grapes?"
  - id: "n_d4brit_point_pdo_grapes"
    node_type: "learning_point"
    name: "The sparkling PDO list also includes Pinot Noir Precoce, Pinot Blanc and Pinot Gris"
  - id: "n_d4brit_principle_pdo_method"
    node_type: "production_principle"
    name: "Which production commitments distinguish English and Welsh PDO quality sparkling?"
  - id: "n_d4brit_point_pdo_method"
    node_type: "learning_point"
    name: "PDO quality sparkling requires bottle second fermentation, nine months on lees and disgorgement"
  - id: "n_d4brit_principle_pgi_hybrid"
    node_type: "production_principle"
    name: "Can a hybrid-grown sparkling offer be considered for English or Welsh Regional PGI?"
  - id: "n_d4brit_point_pgi_hybrid"
    node_type: "learning_point"
    name: "PGI sparkling permits hybrids, including Seyval Blanc, subject to its other conditions"
  - id: "n_d4brit_principle_unprotected_origin"
    node_type: "production_principle"
    name: "Does Product of England or Product of Wales certify a protected sparkling name?"
  - id: "n_d4brit_point_unprotected_origin"
    node_type: "learning_point"
    name: "A product-origin statement and a protected scheme designation are different label claims"
  - id: "n_d4brit_principle_pdo_assessment"
    node_type: "production_principle"
    name: "What does the English or Welsh PDO sparkling assessment establish?"
  - id: "n_d4brit_point_pdo_assessment"
    node_type: "learning_point"
    name: "Analytical and no-fault tests support compliance, not a comparative tasting rank"
  - id: "n_d4brit_case_hybrid_offer"
    node_type: "production_case"
    name: "Hypothetical buying decision: an English estate offers sparkling made entirely from its own English-grown Seyval Blanc. Its draft label says English Protected Designation of Origin. No scheme approval or application test records are supplied, and the buyer needs a defensible protected local-origin claim. The print deadline is tomorrow. Explain a buying or label action, the category reason, a deadline or sourcing tradeoff, and what still needs checking. The estate and deadline are invented; the label is not a compliance certificate."
  - id: "n_d4brit_point_case_hybrid_offer_action"
    node_type: "learning_point"
    name: "Withhold the proposed PDO claim and investigate a properly approved PGI route"
  - id: "n_d4brit_point_case_hybrid_offer_reason"
    node_type: "learning_point"
    name: "English-grown hybrid fruit satisfies neither the PDO cultivar rule nor PGI approval by itself"
  - id: "n_d4brit_point_case_hybrid_offer_tradeoff"
    node_type: "learning_point"
    name: "A PGI investigation preserves the offered fruit but may miss the supplied print deadline"
  - id: "n_d4brit_point_case_hybrid_offer_limitation"
    node_type: "learning_point"
    name: "The origin and variety evidence do not establish an approved PGI bottle or correct final label"
  - id: "n_d4brit_case_category_quality"
    node_type: "production_case"
    name: "Hypothetical Welsh wine-list decision: one supplier offers approved Welsh PDO traditional-method Chardonnay and Pinot sparkling; another offers approved Welsh Regional PGI Seyval Blanc sparkling. The PDO purchase quote is higher for the same number of bottles. The restaurant wants fresh fruit, a persistent finish and a viable margin, but has no samples, landed costs or guest-demand evidence. The manager says PDO approval already proves the better buy. Explain a decision process, the assessment reason, a stock or trial tradeoff, and a limit on category-based quality claims. Offers and prices are invented."
  - id: "n_d4brit_point_case_category_quality_action"
    node_type: "learning_point"
    name: "Compare controlled samples and landed margins before choosing between the approved offers"
  - id: "n_d4brit_point_case_category_quality_reason"
    node_type: "learning_point"
    name: "Scheme tests check compliance and faults rather than ranking these two offered wines"
  - id: "n_d4brit_point_case_category_quality_tradeoff"
    node_type: "learning_point"
    name: "The higher supplied quote raises equal-volume stock spend, while a trial costs time and samples"
  - id: "n_d4brit_point_case_category_quality_limitation"
    node_type: "learning_point"
    name: "Approval and a higher quote do not establish sensory fit, final margin or demand"
