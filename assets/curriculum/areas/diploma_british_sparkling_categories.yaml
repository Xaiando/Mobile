knowledge_items:
  - id: "ki_d4brit_pdo_origin"
    subject_id: "n_d4brit_principle_pdo_origin"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_d4brit_point_pdo_origin"
    domain_id: "winemaking"
    assertion_text: "The FSA sparkling guidance requires every grape for English or Welsh PDO sparkling to come from the stated demarcation. England and Wales are separate claims; a UK winery address is insufficient origin evidence. Other scheme conditions still apply."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  - id: "ki_d4brit_pdo_grapes"
    subject_id: "n_d4brit_principle_pdo_grapes"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_d4brit_point_pdo_grapes"
    domain_id: "winemaking"
    assertion_text: "Part 2 of the registered English and Welsh PDO specifications lists Chardonnay, Pinot Noir, Pinot Noir Precoce, Pinot Meunier, Pinot Blanc and Pinot Gris for quality sparkling wine. This is the sparkling cultivar list, not the broader still-wine list or a list for every UK sparkling category."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  - id: "ki_d4brit_pdo_method"
    subject_id: "n_d4brit_principle_pdo_method"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_d4brit_point_pdo_method"
    domain_id: "winemaking"
    assertion_text: "Part 2 of each registered English and Welsh PDO specification requires traditional-method quality sparkling: second alcoholic fermentation in bottle, at least nine months on yeast lees, and separation from lees by disgorgement. A similar pressure or flavour does not substitute for that documented process."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  - id: "ki_d4brit_pgi_hybrid"
    subject_id: "n_d4brit_principle_pgi_hybrid"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_d4brit_point_pgi_hybrid"
    domain_id: "winemaking"
    assertion_text: "The FSA sparkling guide permits hybrids such as Seyval Blanc in the PGI category and requires at least 85% of grapes from the stated English or Welsh demarcation. Hybrid fruit can be considered for Regional PGI; neither its variety nor an origin percentage alone certifies the wine."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  - id: "ki_d4brit_unprotected_origin"
    subject_id: "n_d4brit_principle_unprotected_origin"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_d4brit_point_unprotected_origin"
    domain_id: "winemaking"
    assertion_text: "The FSA non-PDO/non-PGI sparkling label example includes Product of England while withholding the protected English and English Regional terms. A product-origin statement therefore does not establish PDO or PGI approval. Read the scheme designation and supporting records separately."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  - id: "ki_d4brit_pdo_assessment"
    subject_id: "n_d4brit_principle_pdo_assessment"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_d4brit_point_pdo_assessment"
    domain_id: "winemaking"
    assertion_text: "The registered English and Welsh quality sparkling specifications require an independent post-disgorgement analytical test and a no-fault tasting. Both must pass for category approval. These compliance checks are not a comparative score proving that an individual PDO wine tastes better than a PGI offer."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  - id: "ki_d4brit_case_hybrid_offer_action"
    subject_id: "n_d4brit_case_hybrid_offer"
    relation_type: "CASE_ACTION"
    object_id: "n_d4brit_point_case_hybrid_offer_action"
    domain_id: "winemaking"
    assertion_text: "Do not present the offered Seyval Blanc wine as English PDO quality sparkling. Ask for a corrected category proposal and investigate Regional PGI eligibility before committing to the protected-origin brief."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  - id: "ki_d4brit_case_hybrid_offer_reason"
    subject_id: "n_d4brit_case_hybrid_offer"
    relation_type: "CASE_REASON"
    object_id: "n_d4brit_point_case_hybrid_offer_reason"
    domain_id: "winemaking"
    assertion_text: "The English PDO sparkling list excludes Seyval Blanc, while the FSA guide permits this hybrid for PGI. The supplied English origin does not remove the cultivar restriction or establish scheme approval."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  - id: "ki_d4brit_case_hybrid_offer_tradeoff"
    subject_id: "n_d4brit_case_hybrid_offer"
    relation_type: "CASE_TRADEOFF"
    object_id: "n_d4brit_point_case_hybrid_offer_tradeoff"
    domain_id: "winemaking"
    assertion_text: "Investigating PGI keeps the offered fruit in consideration, but checking records and revising the draft can delay this hypothetical print deadline. If the buyer insists on PDO, an alternative compliant offer needs consideration."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  - id: "ki_d4brit_case_hybrid_offer_limitation"
    subject_id: "n_d4brit_case_hybrid_offer"
    relation_type: "CASE_LIMITATION"
    object_id: "n_d4brit_point_case_hybrid_offer_limitation"
    domain_id: "winemaking"
    assertion_text: "The scenario supplies no PGI approval or application test records. English origin and Seyval Blanc permission do not establish that the finished wine meets every PGI requirement or that its final label is correct."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  - id: "ki_d4brit_case_category_quality_action"
    subject_id: "n_d4brit_case_category_quality"
    relation_type: "CASE_ACTION"
    object_id: "n_d4brit_point_case_category_quality_action"
    domain_id: "winemaking"
    assertion_text: "Compare samples under controlled conditions against the restaurant brief and obtain landed costs before choosing. Communicate each supplied approved category accurately instead of deciding the better buy from its label alone."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  - id: "ki_d4brit_case_category_quality_reason"
    subject_id: "n_d4brit_case_category_quality"
    relation_type: "CASE_REASON"
    object_id: "n_d4brit_point_case_category_quality_reason"
    domain_id: "winemaking"
    assertion_text: "The PDO specification requires analytical and no-fault assessment; the FSA guide also describes tests for PGI. Approval establishes scheme compliance, not a sensory or value ranking between these two offers."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  - id: "ki_d4brit_case_category_quality_tradeoff"
    subject_id: "n_d4brit_case_category_quality"
    relation_type: "CASE_TRADEOFF"
    object_id: "n_d4brit_point_case_category_quality_tradeoff"
    domain_id: "winemaking"
    assertion_text: "At the same bottle quantity, the higher supplied PDO purchase quote commits more initial stock money. Trying both offers consumes samples and staff time; the restaurant must weigh that trial against the risk of a mismatch with its brief."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
  - id: "ki_d4brit_case_category_quality_limitation"
    subject_id: "n_d4brit_case_category_quality"
    relation_type: "CASE_LIMITATION"
    object_id: "n_d4brit_point_case_category_quality_limitation"
    domain_id: "winemaking"
    assertion_text: "Without samples, landed costs or demand evidence, neither approved category establishes which bottle fits the brief, yields a viable margin or sells faster. The supplied quotes are fictional, not evidence of current Welsh market prices."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T01:30:00.000Z"
