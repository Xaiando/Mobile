    node_type: learning_point
    name: Argentina’s Torrontés name covers three genetically distinct cultivars
  - id: n_reg_sa_point_torrontes_riojano
    node_type: learning_point
    name: Torrontés Riojano provides the principal aromatic northwestern association
  - id: n_reg_sa_principle_sanjuan
    node_type: production_principle
    name: Which climatic and exposure contrasts should a San Juan comparison examine beyond one
      provincial label?
  - id: n_reg_sa_point_sanjuan_valleys
    node_type: learning_point
    name: San Juan’s warm dry Tulum differs from cooler Pedernal conditions
  - id: n_reg_sa_point_pedernal_exposure
    node_type: learning_point
    name: Pedernal’s opposing slopes differ in timing of sun exposure
  - id: n_reg_sa_principle_mendoza_yeast
    node_type: production_principle
    name: How does a controlled Mendoza Malbec experiment separate grape-source effects from
      fermentation choices?
  - id: n_reg_sa_point_mendoza_yeast_factor
    node_type: learning_point
    name: A Mendoza Malbec trial found fermentation-strain effects across grape sources
  - id: n_reg_sa_point_mendoza_source_factor
    node_type: learning_point
    name: The same experiment found grape-source differences under its trial conditions
  - id: n_reg_sa_principle_mendoza_harvest
    node_type: production_principle
    name: How can compressed Mendoza ripening and fruit-responsive cellar decisions change the work
      required during harvest?
  - id: n_reg_sa_point_mendoza_capacity
    node_type: learning_point
    name: Mendoza’s 2020 report illustrates simultaneous red-grape maturity and winery pressure
  - id: n_reg_sa_point_mendoza_cellar_response
    node_type: learning_point
    name: Mendoza producers adjusted fermentation, maceration and pressing to observed fruit
  - id: n_reg_sa_principle_patagonia_provinces
    node_type: production_principle
    name: How do Río Negro site profiles and Neuquén grape associations qualify a single
      northern-Patagonia description?
  - id: n_reg_sa_point_rionegro_profiles
    node_type: learning_point
    name: Río Negro’s Alto Valle includes contrasting local soil textures
  - id: n_reg_sa_point_neuquen_grapes
    node_type: learning_point
    name: Neuquén’s San Patricio del Chañar includes selected reds and Chardonnay
  - id: n_reg_sa_case_maule_brand
    node_type: production_case
    name: A Maule producer group can document the origin and cultivation history of its rainfed old-vine
      Carignan lots. It proposes a new shared private brand with joint promotion, but the finished
      lots taste different, packaging and coordination add costs, and no buyer has committed to the
      proposed price. The manager assumes that an old-vine regional story guarantees a premium sale.
      Propose a defensible assessment, explain why, and discuss a tradeoff and a limitation.
  - id: n_reg_sa_point_case_maule_action
    node_type: learning_point
    name: Test the Maule proposition with distinct lot reviews, costs and buyer feedback
  - id: n_reg_sa_point_case_maule_reason
    node_type: learning_point
    name: A shared Maule story can differentiate an offer without proving price acceptance
  - id: n_reg_sa_point_case_maule_tradeoff
    node_type: learning_point
    name: Maule joint promotion combines a common image with coordination demands
  - id: n_reg_sa_point_case_maule_limit
    node_type: learning_point
    name: The Maule case lacks buyer commitment and measured commercial returns
  - id: n_reg_sa_case_itata_skin_trial
    node_type: production_case
    name: An Itata producer divides the same sound Moscatel de Alejandría harvest between a
      pressed-juice white and a tinaja lot fermented with skins. Both finish dry. Coded tasting at
      the same temperature finds the pressed wine more delicate and the skin-fermented wine more
      structured; neither has a detected fault. The buyer wants a structured dry white but has not
      tasted either sample, and the manager says clay guarantees the better wine. Propose a
      defensible selection process, explain why, and discuss a tradeoff and a limitation.
  - id: n_reg_sa_point_case_itata_action
    node_type: learning_point
    name: Present the sampled Itata styles against the buyer’s stated structure target
  - id: n_reg_sa_point_case_itata_reason
    node_type: learning_point
    name: Skin contact is a production difference distinct from the clay-vessel claim
  - id: n_reg_sa_point_case_itata_tradeoff
    node_type: learning_point
    name: Selecting the structured Itata sample changes the balance sought in the offer
  - id: n_reg_sa_point_case_itata_limit
    node_type: learning_point
    name: The Itata case does not isolate the clay effect or establish buyer acceptance
  - id: n_reg_sa_case_mendoza_capacity
    node_type: production_case
    name: A Mendoza winery has Cabernet Sauvignon and Malbec lots that representative sampling confirms
      are both ready for their intended wines in the same short window. Its own reception and
      fermentation capacity cannot handle both on time. A qualified outside facility confirms
      suitable capacity, but its fee and transport require payment before the eventual wine sale. No
      current cash forecast includes those costs. Propose a defensible capacity decision process,
      explain why, and discuss a tradeoff and a limitation.
  - id: n_reg_sa_point_case_capacity_action
    node_type: learning_point
    name: Cost and forecast Mendoza outside capacity before committing the fruit
  - id: n_reg_sa_point_case_capacity_reason
    node_type: learning_point
    name: Two ready Mendoza lots create an immediate throughput and payment constraint
  - id: n_reg_sa_point_case_capacity_tradeoff
    node_type: learning_point
    name: Additional Mendoza capacity uses cash and adds transport to preserve timing
  - id: n_reg_sa_point_case_capacity_limit
    node_type: learning_point
    name: The Mendoza case lacks affordability figures and a quantified delay outcome
  - id: n_reg_sa_case_mendoza_yeast_trial
    node_type: production_case
    name: A Mendoza producer splits one homogeneous Malbec must between two yeast treatments with
      matching temperature and handling. Both wines finish dry and sound. Repeated coded tasting
      finds treatment B fresher-fruited and less bitter, but it occupies its tank longer. The
      producer wants those sensory attributes and proposes launching every vineyard with B while
      claiming the trial proves a unique vineyard flavour. Propose a defensible next step, explain
      why, and discuss a tradeoff and a limitation.
  - id: n_reg_sa_point_case_yeast_action
    node_type: learning_point
    name: Evaluate the Mendoza yeast option with replicated lots and fermentation planning
  - id: n_reg_sa_point_case_yeast_reason
    node_type: learning_point
    name: The supplied same-must trial supports a yeast effect rather than unique-origin proof
  - id: n_reg_sa_point_case_yeast_tradeoff
    node_type: learning_point
    name: Mendoza treatment B’s desired sensory result uses tank space for longer
  - id: n_reg_sa_point_case_yeast_limit
    node_type: learning_point
    name: A one-must Mendoza trial does not establish every vineyard or future vintage response
