  - id: n_reg_sa_point_maule_trial_storage
    node_type: learning_point
    name: Maule’s 2015 trial linked different soil water storage with different vine performance
  - id: n_reg_sa_point_maule_trial_scope
    node_type: learning_point
    name: The Maule findings come from selected vineyards in one season
  - id: n_reg_sa_principle_biobio
    node_type: production_principle
    name: How do Bío-Bío’s selected grapes and wet windy setting add to an explanation of southern Chile?
  - id: n_reg_sa_point_biobio_grapes
    node_type: learning_point
    name: Bío-Bío’s cool setting includes Pinot Noir, Chardonnay and aromatic whites
  - id: n_reg_sa_point_biobio_weather
    node_type: learning_point
    name: Bío-Bío’s cool windy and relatively rainy setting warrants health and maturity checks
  - id: n_reg_sa_principle_salta
    node_type: production_principle
