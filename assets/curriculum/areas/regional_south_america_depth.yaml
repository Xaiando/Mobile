  - id: n_reg_sa_point_maule_carignan
    node_type: learning_point
    name: Maule Carignan heritage includes old head-trained rainfed vineyards
  - id: n_reg_sa_point_maule_collective
    node_type: learning_point
    name: VIGNO is a private collective brand with collaborative promotion
  - id: n_reg_sa_principle_maule_site_trial
    node_type: production_principle
    name: What did a Maule rainfed Carignan study find about water storage and why should its results
