  - id: n_reg_sa_point_salta_grapes
    node_type: learning_point
    name: Salta’s Calchaquí wine context includes several reds alongside Torrontés
  - id: n_reg_sa_point_salta_canopy
    node_type: learning_point
    name: Salta growers assess foliage management to limit overripeness
  - id: n_reg_sa_principle_torrontes
