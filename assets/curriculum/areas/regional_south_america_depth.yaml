    name: Itata includes traditional País and Moscatel alongside Cinsault
  - id: n_reg_sa_point_itata_dryfarm
    node_type: learning_point
    name: Guarilihue provides a concrete rainfed bush-vine example in coastal Itata
  - id: n_reg_sa_principle_itata_tinajas
