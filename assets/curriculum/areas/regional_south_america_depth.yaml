    name: Elqui includes Syrah and Sauvignon Blanc among its important associations
  - id: n_reg_sa_point_elqui_dry
    node_type: learning_point
    name: Elqui’s arid clear-sky setting contrasts with humid Itata conditions
  - id: n_reg_sa_principle_leyda
