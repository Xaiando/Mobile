knowledge_items:
  - id: ki_reg_sa_elqui_grapes
    subject_id: n_reg_sa_principle_elqui
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sa_point_elqui_grapes
    domain_id: geography
    assertion_text: Syrah and Sauvignon Blanc are important red and white associations respectively in
      Elqui. A regional comparison therefore needs to distinguish grape and colour as well as site;
      the northern valley is not adequately represented by a single red-wine style.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_elqui_dry
    subject_id: n_reg_sa_principle_elqui
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sa_point_elqui_dry
    domain_id: geography
    assertion_text: The Chilean regional body describes Elqui through arid conditions and clear skies,
      contrasting with Itata’s cooler, humid Mediterranean setting farther south. These are
      different growing contexts to investigate, without assigning identical water availability or
      fruit-health conditions to every vineyard in either valley.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_leyda_canopy
    subject_id: n_reg_sa_principle_leyda
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sa_point_leyda_canopy
    domain_id: viticulture
    assertion_text: The Garuma Sauvignon Blanc 2023 technical sheet records a cool, humid Leyda spring
      with vigorous canopies and fungal-disease monitoring needs. It illustrates why a cool-coastal
      white-wine setting can require active fruit-health and canopy assessment, rather than fog
      being only a beneficial ripening factor.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_leyda_cellar
    subject_id: n_reg_sa_principle_leyda
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sa_point_leyda_cellar
    domain_id: winemaking
    assertion_text: For its 2023 Garuma Sauvignon Blanc, Leyda combined whole-bunch pressing with a
      separately destemmed, press-macerated portion, then used steel, used barrels and lees
      stirring. This producer example shows how handling and maturation can shape a coastal white
      beyond its climate; it is not a compulsory regional recipe.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_peumo_water
    subject_id: n_reg_sa_principle_peumo
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sa_point_peumo_water
    domain_id: viticulture
    assertion_text: Concha y Toro describes its Peumo Carmenère vineyard along the Cachapoal River as
      having deep soils with moisture-retaining clay. That storage helps sustain vine activity
      through this relatively late harvest cycle; it is a physical water relationship, not clay
      transferring a flavour or guaranteeing ripeness.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_peumo_vintage
    subject_id: n_reg_sa_principle_peumo
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sa_point_peumo_vintage
    domain_id: viticulture
    assertion_text: In its Cachapoal 2024 harvest account, Concha y Toro links abundant winter rain with
      stronger vegetative growth at Peumo and reports more leaf removal and shoot pruning alongside
      less irrigation. This dated example contrasts stored-water support with the need to manage
      excess vigour when the season changes.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_itata_grapes
    subject_id: n_reg_sa_principle_itata_vineyards
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sa_point_itata_grapes
    domain_id: geography
    assertion_text: Itata’s traditional grape associations include País and Moscatel de Alejandría, with
      Cinsault also documented by the regional body. These selected associations broaden a
      comparison beyond Cabernet-family reds and coastal Sauvignon Blanc; they are not an exhaustive
      current list of permitted grapes.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_itata_dryfarm
    subject_id: n_reg_sa_principle_itata_vineyards
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sa_point_itata_dryfarm
    domain_id: viticulture
    assertion_text: De Martino’s 2018 Muscat sheet describes a Guarilihue vineyard trained as bush vines
      and grown without irrigation in a cool maritime area with rainfall concentrated in winter.
      This is a documented site and vintage example of Itata rainfed cultivation, rather than proof
      that every southern vineyard needs no irrigation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_itata_wholeberries
    subject_id: n_reg_sa_principle_itata_tinajas
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sa_point_itata_wholeberries
    domain_id: winemaking
    assertion_text: For Viejas Tinajas Muscat 2018, De Martino placed destemmed whole Moscatel de
      Alejandría berries in clay tinajas and used native-yeast fermentation. This preserves a
      whole-berry and skin-contact route during fermentation, contrasting with separating juice from
      skins before fermenting a white wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_itata_skin_time
    subject_id: n_reg_sa_principle_itata_tinajas
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sa_point_itata_skin_time
    domain_id: winemaking
    assertion_text: The same 2018 Muscat example retained the skins through an extended period including
      malolactic fermentation, then transferred the wine to another jar for further maturation.
      Distinguish maceration from later storage when explaining its production; the clay vessel
      alone cannot establish the finished texture or quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_maule_carignan
    subject_id: n_reg_sa_principle_maule_heritage
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sa_point_maule_carignan
    domain_id: viticulture
    assertion_text: Maule’s Carignan heritage includes old, head-trained vineyards in rainfed settings.
      These cultivation characteristics describe a growing system and preserved vineyard resource,
      rather than proving that vine age itself improves every wine or setting one vineyard’s yield.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_maule_collective
    subject_id: n_reg_sa_principle_maule_heritage
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sa_point_maule_collective
    domain_id: business
    assertion_text: VIGNO’s own account describes a nonprofit trade organisation and private collective
      brand built around Maule dryland Carignan, with shared image and promotional work. This
      explains coordinated differentiation among producers; it is not evidence that VIGNO is a
      statutory denomination or that membership guarantees demand.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_maule_trial_storage
    subject_id: n_reg_sa_principle_maule_site_trial
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sa_point_maule_trial_storage
    domain_id: viticulture
    assertion_text: A ten-site study of rainfed Maule Carignan in 2015 found relatively low
      water-holding capacity at Sauzal, Melozal and Curtiduría, with high grape sugars and lower
      productivity, while Caliboro’s greater storage accompanied higher yield and berry weight.
      These observed contrasts make local profile assessment relevant.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_maule_trial_scope
    subject_id: n_reg_sa_principle_maule_site_trial
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sa_point_maule_trial_scope
    domain_id: viticulture
    assertion_text: The Maule study selected one representative old, rainfed bush-vine Carignan vineyard
      in each of ten localities during 2015. Its measured differences do not establish a permanent
      site ranking or the same response in an irrigated vineyard, a different season or another
      variety; the experimental selection matters to interpretation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_biobio_grapes
    subject_id: n_reg_sa_principle_biobio
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sa_point_biobio_grapes
    domain_id: geography
    assertion_text: The Chilean regional body associates Bío-Bío’s cool setting with Pinot Noir and
      Chardonnay, and also describes Sauvignon Blanc and Riesling south of the river. Grape choice
      therefore matters alongside the southern location when comparing reds and whites; these are
      selected associations, not legal permissions.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_biobio_weather
    subject_id: n_reg_sa_principle_biobio
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sa_point_biobio_weather
    domain_id: viticulture
    assertion_text: "Around Bío-Bío, the regional account describes cool, windy conditions and
      substantial rainfall, contrasting with Elqui’s aridity. Assess seasonal fruit health, weather
      and maturity together: a cool-region label does not determine whether a particular lot has
      reached its intended ripeness or remained sound."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_salta_grapes
    subject_id: n_reg_sa_principle_salta
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sa_point_salta_grapes
    domain_id: geography
    assertion_text: The Calchaquí valleys include Salta’s Cafayate, San Carlos, Molinos and Cachi wine
      settings. Wines of Argentina’s producer account associates the area with Torrontés Riojano as
      well as Malbec, Cabernet Sauvignon and Tannat. These selected examples extend regional
      understanding without creating an exhaustive legal grape list.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_salta_canopy
    subject_id: n_reg_sa_principle_salta
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sa_point_salta_canopy
    domain_id: viticulture
    assertion_text: In Wines of Argentina’s 2025 Calchaquí account, Domingo Molina’s Rafael Domingo
      links good foliage management with avoiding overripeness while pursuing freshness. The
      observation makes canopy decisions part of explaining sunny Salta sites; neither sunshine nor
      regional identity dictates the final maturity of an individual lot.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_torrontes_identity
    subject_id: n_reg_sa_principle_torrontes
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sa_point_torrontes_identity
    domain_id: viticulture
    assertion_text: The Instituto Nacional de Vitivinicultura distinguishes Torrontés Riojano, Torrontés
      Sanjuanino and Torrontés Mendocino as genetically different cultivars. The shared name must
      not be treated as proof of identical grapes or interchangeable performance, and cultivar names
      alone do not prove where a vineyard is located.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_torrontes_riojano
    subject_id: n_reg_sa_principle_torrontes
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sa_point_torrontes_riojano
    domain_id: geography
    assertion_text: The INV account identifies Torrontés Riojano with aromatic Argentine whites and the
      northwest, while Wines of Argentina specifically associates it with the Calchaquí valleys. Use
      that cultivar and regional association when discussing Salta’s white wines; aromatic intensity
      alone cannot certify origin or sweetness.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_sanjuan_valleys
    subject_id: n_reg_sa_principle_sanjuan
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sa_point_sanjuan_valleys
    domain_id: geography
    assertion_text: Wines of Argentina describes Tulum as warm and dry, while Pedernal has cooler, dry
      growing conditions. This within-province contrast matters to ripening assessment and selected
      grape choices; a San Juan address does not establish one climate, and relative coolness is not
      an altitude-based quality ranking.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_pedernal_exposure
    subject_id: n_reg_sa_principle_sanjuan
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sa_point_pedernal_exposure
    domain_id: viticulture
    assertion_text: A Wines of Argentina interview with Peñaflor’s Marcelo Belmonte describes opposing
      Pedernal slopes receiving more morning or evening sun and differing in ripening. Examine
      actual orientation and seasonal fruit condition within the valley, rather than infer one
      maturity outcome from its average elevation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_mendoza_yeast_factor
    subject_id: n_reg_sa_principle_mendoza_yeast
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sa_point_mendoza_yeast_factor
    domain_id: winemaking
    assertion_text: A 2018 INTA-led Malbec experiment compared Ugarteche, El Cepillo and Gualtallary
      fruit with different yeast treatments. Yeast choice changed measured wine chemistry and
      fermentation duration. Descriptive sensory profiles also varied, although the panel’s sensory
      differences were not statistically significant; those impressions should not be promoted as
      proven sensory effects.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_mendoza_source_factor
    subject_id: n_reg_sa_principle_mendoza_yeast
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sa_point_mendoza_source_factor
    domain_id: winemaking
    assertion_text: "The experiment also found grape-source differences in parameters including pH,
      alcohol and colour-related measures. Compare grape source and yeast treatment together when
      explaining those wines: one study of particular lots cannot authenticate every Mendoza wine’s
      origin from a flavour or establish a permanent quality hierarchy."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_mendoza_capacity
    subject_id: n_reg_sa_principle_mendoza_harvest
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sa_point_mendoza_capacity
    domain_id: business
    assertion_text: In the 2020 harvest report, Grupo Peñaflor’s Marcelo Belmonte describes Cabernet and
      Malbec becoming ready together, compressing harvesting, pressing and fermentation into a short
      window. This historical producer observation explains a capacity constraint; it does not set
      the dates or capacity of a later Mendoza vintage.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_mendoza_cellar_response
    subject_id: n_reg_sa_principle_mendoza_harvest
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sa_point_mendoza_cellar_response
    domain_id: winemaking
    assertion_text: The same 2020 report records Mendoza producers using grape analyses to adjust
      fermentation models and paying particular attention to maceration and press work. This
      illustrates a cellar response to the actual fruit, rather than treating early picking or a
      warm year as a sufficient explanation of finished style.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_rionegro_profiles
    subject_id: n_reg_sa_principle_patagonia_provinces
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sa_point_rionegro_profiles
    domain_id: geography
    assertion_text: In the Alto Valle of Río Negro, Humberto Canale’s Horacio Bibiloni describes
      clay-rich settings near the middle barda alongside loamy-sandy and sandier profiles elsewhere.
      These local physical differences show why a northern-Patagonia site explanation needs its
      actual soil profile, rather than one texture for the whole province.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_neuquen_grapes
    subject_id: n_reg_sa_principle_patagonia_provinces
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_sa_point_neuquen_grapes
    domain_id: geography
    assertion_text: Wines of Argentina identifies San Patricio del Chañar as a Neuquén wine centre with
      selected associations including Malbec, Cabernet Sauvignon, Merlot, Pinot Noir and Chardonnay.
      Distinguish that provincial setting and grape choice from Río Negro’s local profiles; a
      regional comparison need not reduce Patagonia to latitude and wind.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_case_maule_action
    subject_id: n_reg_sa_case_maule_brand
    relation_type: CASE_ACTION
    object_id: n_reg_sa_point_case_maule_action
    domain_id: business
    assertion_text: Review the distinct lots against the intended offer, cost packaging and
      coordination, and test a limited shared-brand proposition with prospective buyers before
      scaling. Use the documented heritage accurately while assessing actual wines and willingness
      to pay.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_case_maule_reason
    subject_id: n_reg_sa_case_maule_brand
    relation_type: CASE_REASON
    object_id: n_reg_sa_point_case_maule_reason
    domain_id: business
    assertion_text: VIGNO illustrates coordinated promotion around Maule dryland Carignan, but an origin
      story does not replace product and customer assessment. In this case, differing lots and
      uncommitted buyers make a promised premium an unsupported business assumption.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_case_maule_tradeoff
    subject_id: n_reg_sa_case_maule_brand
    relation_type: CASE_TRADEOFF
    object_id: n_reg_sa_point_case_maule_tradeoff
    domain_id: business
    assertion_text: Joint promotion offers the group a common image and outreach effort, while
      packaging, coordination and communicating the supplied differences between lots require
      resources. Compare those costs with tested buyer response rather than assume every bottle
      should be identical or priced higher.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_case_maule_limit
    subject_id: n_reg_sa_case_maule_brand
    relation_type: CASE_LIMITATION
    object_id: n_reg_sa_point_case_maule_limit
    domain_id: business
    assertion_text: The case supplies no committed volume, accepted price or quantified programme
      return. A pilot can inform those questions but cannot guarantee a profitable premium sale. A
      hypothetical private brand also conveys no statutory denomination or entitlement to another
      organisation’s brand.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_case_itata_action
    subject_id: n_reg_sa_case_itata_skin_trial
    relation_type: CASE_ACTION
    object_id: n_reg_sa_point_case_itata_action
    domain_id: winemaking
    assertion_text: Use the fault-free coded samples to compare the measured structure with the buyer’s
      brief and invite the buyer to assess them before final selection. The supplied tasting makes
      the skin-fermented lot a candidate for the stated target, while the vessel claim alone cannot
      decide.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_case_itata_reason
    subject_id: n_reg_sa_case_itata_skin_trial
    relation_type: CASE_REASON
    object_id: n_reg_sa_point_case_itata_reason
    domain_id: winemaking
    assertion_text: The lots differ in juice separation and contact with skins during fermentation, as
      well as vessel route. Their observed structural difference is relevant to this brief, but the
      combined process comparison cannot isolate clay as its cause or turn the regional tradition
      into a quality guarantee.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_case_itata_tradeoff
    subject_id: n_reg_sa_case_itata_skin_trial
    relation_type: CASE_TRADEOFF
    object_id: n_reg_sa_point_case_itata_tradeoff
    domain_id: winemaking
    assertion_text: Choosing the more structured sample pursues the buyer’s stated aim but gives up the
      relative delicacy found in the other sample. The source’s extended skin-contact example also
      involves holding wine before later maturation, so a planned repetition would need its own
      capacity and time assessment.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_case_itata_limit
    subject_id: n_reg_sa_case_itata_skin_trial
    relation_type: CASE_LIMITATION
    object_id: n_reg_sa_point_case_itata_limit
    domain_id: winemaking
    assertion_text: Because skin contact and vessel route vary together, these samples cannot prove what
      clay alone contributed. The buyer has not tasted them, and a dry-white preference does not
      establish acceptance of the measured structure. Further feedback and controlled trials would
      be needed for those conclusions.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_case_capacity_action
    subject_id: n_reg_sa_case_mendoza_capacity
    relation_type: CASE_ACTION
    object_id: n_reg_sa_point_case_capacity_action
    domain_id: business
    assertion_text: Check the confirmed outside service against each lot’s handling needs and prepare a
      cost and cash forecast covering transport, the facility payment and later wine receipts. Use
      that assessment to decide whether the extra capacity is feasible while preserving the sampled
      harvest target.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_case_capacity_reason
    subject_id: n_reg_sa_case_mendoza_capacity
    relation_type: CASE_REASON
    object_id: n_reg_sa_point_case_capacity_reason
    domain_id: business
    assertion_text: Both lots are ready under the supplied sampling, so the issue is available
      processing capacity rather than deliberately waiting for an unripe variety. Outside capacity
      can address throughput, but its advance costs fall before sales receipts and therefore need a
      cash-timing check.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_case_capacity_tradeoff
    subject_id: n_reg_sa_case_mendoza_capacity
    relation_type: CASE_TRADEOFF
    object_id: n_reg_sa_point_case_capacity_tradeoff
    domain_id: business
    assertion_text: The outside facility offers a way to process both ready lots within the intended
      window, while adding the supplied fee, transport and coordination before wine revenue.
      Delaying fruit would avoid that immediate payment but risks departing from the confirmed
      maturity target; neither choice is free of consequences.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_case_capacity_limit
    subject_id: n_reg_sa_case_mendoza_capacity
    relation_type: CASE_LIMITATION
    object_id: n_reg_sa_point_case_capacity_limit
    domain_id: business
    assertion_text: No cash reserve, fee amount, sale timing or measured effect of delaying the lots is
      supplied. Confirmed outside capacity alone cannot prove affordability, and current readiness
      cannot specify how the fruit will change if left longer. The process requires those further
      checks before a commitment.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_case_yeast_action
    subject_id: n_reg_sa_case_mendoza_yeast_trial
    relation_type: CASE_ACTION
    object_id: n_reg_sa_point_case_yeast_action
    domain_id: winemaking
    assertion_text: Treat B as a candidate for the stated sensory target and test it across
      representative additional lots while tracking fermentation duration and tank availability.
      Keep grape source and yeast treatment distinguishable in the plan before extending the choice
      to every vineyard.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_case_yeast_reason
    subject_id: n_reg_sa_case_mendoza_yeast_trial
    relation_type: CASE_REASON
    object_id: n_reg_sa_point_case_yeast_reason
    domain_id: winemaking
    assertion_text: The starting must and handling are matched, so the supplied difference concerns the
      yeast treatments within that must. The INTA experiment likewise found yeast effects alongside
      grape-source effects. A treatment comparison cannot prove a vineyard-unique flavour when the
      trial contains no other vineyard source.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_case_yeast_tradeoff
    subject_id: n_reg_sa_case_mendoza_yeast_trial
    relation_type: CASE_TRADEOFF
    object_id: n_reg_sa_point_case_yeast_tradeoff
    domain_id: business
    assertion_text: B provides the supplied sensory attributes the producer wants, but its longer
      fermentation keeps a tank occupied and can reduce throughput during a busy window. Weigh that
      operational cost against the confirmed sensory target rather than regard one successful sample
      as a cost-free improvement.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
  - id: ki_reg_sa_case_yeast_limit
    subject_id: n_reg_sa_case_mendoza_yeast_trial
    relation_type: CASE_LIMITATION
    object_id: n_reg_sa_point_case_yeast_limit
    domain_id: winemaking
    assertion_text: The case includes one homogeneous must, no further vineyard sources and no later
      vintages or commercial-scale results. Replicated tasting within that lot supports its observed
      preference but cannot establish the same fermentation performance or sensory benefit
      everywhere; customer demand is also untested.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-27T11:13:23.416Z"
