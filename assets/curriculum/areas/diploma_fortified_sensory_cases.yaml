knowledge_items:
  -
    id: "ki_d5sensory_case_madeira_compare_action"
    subject_id: "n_d5sensory_case_madeira_compare"
    relation_type: "CASE_ACTION"
    object_id: "n_d5sensory_point_madeira_compare_action"
    domain_id: "tasting"
    assertion_text: "Provisionally offer B because its supplied sweetness and richer texture match this guest's brief. Keep the choice conditional on the guest's preference and the fictional observations; the supplied Boal identity is an assumption, not an identification earned through tasting."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T00:00:00.000Z"
  -
    id: "ki_d5sensory_case_madeira_compare_reason"
    subject_id: "n_d5sensory_case_madeira_compare"
    relation_type: "CASE_REASON"
    object_id: "n_d5sensory_point_madeira_compare_reason"
    domain_id: "tasting"
    assertion_text: "IVBAM associates Verdelho with an off-dry style and Boal with a rich, semi-sweet style. That context is compatible with the invented A/B contrast. The selection is supported by B's stated sweetness, texture and balancing acidity, not by treating the grape name as a quality score."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T00:00:00.000Z"
  -
    id: "ki_d5sensory_case_madeira_compare_tradeoff"
    subject_id: "n_d5sensory_case_madeira_compare"
    relation_type: "CASE_TRADEOFF"
    object_id: "n_d5sensory_point_madeira_compare_tradeoff"
    domain_id: "tasting"
    assertion_text: "A offers the brighter, less-sweet expression in this packet and may fit a guest who changes the brief. B's richer style is useful here, but greater sweetness or body does not make Boal universally better than Verdelho; both supplied finishes are persistent."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T00:00:00.000Z"
  -
    id: "ki_d5sensory_case_madeira_compare_limitation"
    subject_id: "n_d5sensory_case_madeira_compare"
    relation_type: "CASE_LIMITATION"
    object_id: "n_d5sensory_point_madeira_compare_limitation"
    domain_id: "tasting"
    assertion_text: "The observations cannot authenticate Verdelho or Boal, recover exact residual sugar or vineyard elevation, or establish a superior official quality grade. Confirm identity and composition through appropriate records when needed; actual sensory accuracy still needs physical tasting and qualified feedback."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T00:00:00.000Z"
  -
    id: "ki_d5sensory_case_rutherglen_muscat_action"
    subject_id: "n_d5sensory_case_rutherglen_muscat"
    relation_type: "CASE_ACTION"
    object_id: "n_d5sensory_point_rutherglen_muscat_action"
    domain_id: "tasting"
    assertion_text: "Provisionally offer C for the stated grape/floral fruit profile and less viscous texture. Compare sweetness, warmth, texture and finish across both samples; the supplied Grand identity of D does not override a guest specifically requesting the fresher and less-concentrated expression."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T00:00:00.000Z"
  -
    id: "ki_d5sensory_case_rutherglen_muscat_reason"
    subject_id: "n_d5sensory_case_rutherglen_muscat"
    relation_type: "CASE_REASON"
    object_id: "n_d5sensory_point_rutherglen_muscat_reason"
    domain_id: "tasting"
    assertion_text: "The regional source describes a progression of development, richness and complexity through the Muscat categories, with age only one factor and variation between producers. D's invented developed profile is compatible with that context; both samples have integrated warmth in the packet, so sweetness alone is not evidence of imbalance."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T00:00:00.000Z"
  -
    id: "ki_d5sensory_case_rutherglen_muscat_tradeoff"
    subject_id: "n_d5sensory_case_rutherglen_muscat"
    relation_type: "CASE_TRADEOFF"
    object_id: "n_d5sensory_point_rutherglen_muscat_tradeoff"
    domain_id: "tasting"
    assertion_text: "A guest seeking developed coffee/nut complexity or a more concentrated sip may prefer D, and its longer layered finish is a positive observation worth recording. C fits the present brief. Style preference and a category name should remain separate from a comparative quality argument based on the whole wine."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T00:00:00.000Z"
  -
    id: "ki_d5sensory_case_rutherglen_muscat_limitation"
    subject_id: "n_d5sensory_case_rutherglen_muscat"
    relation_type: "CASE_LIMITATION"
    object_id: "n_d5sensory_point_rutherglen_muscat_limitation"
    domain_id: "tasting"
    assertion_text: "The source's published category age ranges are averages, not minimum ages for every component. Coffee-like flavour, concentration and a supplied Grand name cannot prove exact blend age, the youngest component, an authenticity mark or the category of a real bottle. Verify product and producer records for those claims."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T00:00:00.000Z"
  -
    id: "ki_d5sensory_case_age_quality_action"
    subject_id: "n_d5sensory_case_age_quality"
    relation_type: "CASE_ACTION"
    object_id: "n_d5sensory_point_age_quality_action"
    domain_id: "tasting"
    assertion_text: "Under these repeated invented observations, support F's stronger current comparative quality from integrated warmth/texture, clear flavours and their longer persistence. Keep that conclusion specific to the packet and current condition; it does not authenticate either supplied identity or overrule an official judgement of a certified lot."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T00:00:00.000Z"
  -
    id: "ki_d5sensory_case_age_quality_reason"
    subject_id: "n_d5sensory_case_age_quality"
    relation_type: "CASE_REASON"
    object_id: "n_d5sensory_point_age_quality_reason"
    domain_id: "tasting"
    assertion_text: "F's integrated structure and longer flavour finish support the comparison; E's concentration alone is insufficient. If authentic, V.O.S. applies to an individual saca with average age over twenty years, evaluated for quality as well as average age. It does not mean every component is exactly twenty years old or replace assessment of this bottle's current condition."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T00:00:00.000Z"
  -
    id: "ki_d5sensory_case_age_quality_tradeoff"
    subject_id: "n_d5sensory_case_age_quality"
    relation_type: "CASE_TRADEOFF"
    object_id: "n_d5sensory_point_age_quality_tradeoff"
    domain_id: "tasting"
    assertion_text: "A taster may prefer E's intense wood/nut style despite supporting F on the given integration and finish evidence. Enjoying either now and predicting improvement are separate decisions. Reassess the actual bottle and intended use before a cellar recommendation; age or personal preference alone cannot supply that recommendation."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T00:00:00.000Z"
  -
    id: "ki_d5sensory_case_age_quality_limitation"
    subject_id: "n_d5sensory_case_age_quality"
    relation_type: "CASE_LIMITATION"
    object_id: "n_d5sensory_point_age_quality_limitation"
    domain_id: "tasting"
    assertion_text: "The invented packet cannot authenticate a V.O.S. seal or the individual saca's certification, calculate constituent ages, establish price or guarantee another ten years of improvement. Obtain certification and bottle/storage information for those claims. The exercise checks reasoning about supplied evidence; physical tasting with qualified feedback is still needed to evaluate sensory accuracy."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-30T00:00:00.000Z"
