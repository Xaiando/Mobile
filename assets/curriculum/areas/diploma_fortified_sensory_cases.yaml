# Original hypothetical sensory packets. Supplied identities are assumptions, not blind diagnoses.
# Source context does not authenticate a sample or establish an official quality grade.
# Citation IDs from the Madeira site/style pack require that pack to be integrated first.
knowledge_nodes:
  -
    id: "n_d5sensory_case_madeira_compare"
    node_type: "production_case"
    name: "Hypothetical Madeira style selection: a trainer supplies A as Verdelho and B as Boal; these identities are assumptions, not findings from blind tasting. At the same temperature in matching clean glasses, A shows citrus and nut aromas, off-dry sweetness, bright acidity, moderate body and a persistent finish. B shows dried-fruit and nut aromas, greater sweetness, richer texture, balancing acidity and a persistent finish. A guest requests a richer, intermediate-sweet after-dinner wine. Explain a provisional selection, the observation and source reasoning, an alternative preference or trade-off, and what the packet cannot authenticate. These invented observations do not grade your palate or establish an official quality grade."
  -
    id: "n_d5sensory_point_madeira_compare_action"
    node_type: "learning_point"
    name: "Provisionally offer B for the guest's richer and sweeter brief"
  -
    id: "n_d5sensory_point_madeira_compare_reason"
    node_type: "learning_point"
    name: "Relate the observed contrast to IVBAM's intermediate styles"
  -
    id: "n_d5sensory_point_madeira_compare_tradeoff"
    node_type: "learning_point"
    name: "Allow A for a less-sweet preference without ranking grapes by quality"
  -
    id: "n_d5sensory_point_madeira_compare_limitation"
    node_type: "learning_point"
    name: "Do not authenticate grape, composition or origin from the packet"
  -
    id: "n_d5sensory_case_rutherglen_muscat"
    node_type: "production_case"
    name: "Hypothetical Rutherglen Muscat selection: a trainer supplies C as Rutherglen Muscat and D as Grand Rutherglen Muscat. These category identities are assumptions, not blind identifications. Fresh pours at the same temperature show C with grape, raisin and floral notes, full body, pronounced sweetness, a less viscous texture and a moderately persistent finish. D has coffee, nut and dried-fruit notes, a more concentrated texture and a longer layered finish. The panel records warmth integrated with the sweetness and flavour in both. A guest wants the fresher fruit-led and less-concentrated expression. Explain a provisional choice, category and balance reasoning, an alternative preference or trade-off, and an age or authenticity limitation. These invented observations do not establish an official category, quality grade or your sensory accuracy."
  -
    id: "n_d5sensory_point_rutherglen_muscat_action"
    node_type: "learning_point"
    name: "Provisionally offer C for the fresher and less-concentrated brief"
  -
    id: "n_d5sensory_point_rutherglen_muscat_reason"
    node_type: "learning_point"
    name: "Use the category progression as context and assess the stated balance"
  -
    id: "n_d5sensory_point_rutherglen_muscat_tradeoff"
    node_type: "learning_point"
    name: "Recognise D's longer developed finish without imposing a richer preference"
  -
    id: "n_d5sensory_point_rutherglen_muscat_limitation"
    node_type: "learning_point"
    name: "Do not derive component ages or certify a regional category from flavour"
  -
    id: "n_d5sensory_case_age_quality"
    node_type: "production_case"
    name: "Hypothetical fortified age and quality review: a trainer supplies E as V.O.S. Oloroso and F as Oloroso without a certified-age claim. Those identities are assumptions; no seal, certification or bottle history is available. With fresh pours, matching clean glasses and one temperature, repeated notes for E show pronounced wood/nut concentration, but drying texture and warmth dominate a brief flavour finish. F shows clear nut and orange-peel flavours, integrated warmth and texture, and a longer layered finish. A colleague says E must contain only wine exactly twenty years old, must win this comparison and will improve for ten more years. Explain a justified current comparison, sensory and designation reasoning, a preference or readiness trade-off, and a verification or development limit. These invented observations are not a finding about a certified lot, an official quality grade or a test of your palate."
  -
    id: "n_d5sensory_point_age_quality_action"
    node_type: "learning_point"
    name: "Support F's current comparative quality from the repeated packet evidence"
  -
    id: "n_d5sensory_point_age_quality_reason"
    node_type: "learning_point"
    name: "Separate current sensory evidence from conditional age certification"
  -
    id: "n_d5sensory_point_age_quality_tradeoff"
    node_type: "learning_point"
    name: "Separate an intense mature-style preference from the quality and readiness argument"
  -
    id: "n_d5sensory_point_age_quality_limitation"
    node_type: "learning_point"
    name: "Verify the designation and avoid exact-age or ten-year improvement promises"
