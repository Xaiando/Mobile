{
  "knowledge_nodes": [
    {
      "id": "n_d3pacific_principle_ca_origin",
      "node_type": "production_principle",
      "name": "For ordinary unfortified grape wine claiming California origin, why is the federal state-origin floor insufficient?"
    },
    {
      "id": "n_d3pacific_point_ca_origin",
      "node_type": "learning_point",
      "name": "For a California or California-subdivision appellation, 17 CCR 17015(a)(1) requires all wine volume from fermented juice of California-grown fruit in the ordinary unfortified case. Its limited residue-wine-spirit exception is separate; this is not 100% from a single California AVA or one grape variety."
    },
    {
      "id": "n_d3pacific_principle_ca_finishing",
      "node_type": "production_principle",
      "name": "What California production condition accompanies its appellation claim?"
    },
    {
      "id": "n_d3pacific_point_ca_finishing",
      "node_type": "learning_point",
      "name": "17 CCR 17015(a)(2)-(3) also requires wine claiming California or its geographical subdivision to be fully produced and finished in California and satisfy the other applicable regulations. California fruit alone does not establish an approved label or a sensory quality level."
    },
    {
      "id": "n_d3pacific_principle_or_origin",
      "node_type": "production_principle",
      "name": "What origin conditions apply to an ordinary label claiming an AVA wholly within Oregon?"
    },
    {
      "id": "n_d3pacific_point_or_origin",
      "node_type": "learning_point",
      "name": "Within OAR 845-010-0910's scope, 845-010-0920(2) requires all grapes to be grown in Oregon and at least 95% within the claimed Oregon county or AVA wholly in Oregon; an Oregon state claim requires Oregon grapes. Cross-border AVAs have separate paragraph(3) conditions, so 95% is not a blanket rule for every associated AVA."
    },
    {
      "id": "n_d3pacific_principle_or_variety",
      "node_type": "production_principle",
      "name": "For wine subject to Oregon's grape-wine rules, how do Pinot Noir and Cabernet Sauvignon single-variety designations differ?"
    },
    {
      "id": "n_d3pacific_point_or_variety",
      "node_type": "learning_point",
      "name": "Within OAR 845-010-0910's scope, 845-010-0915 ordinarily requires at least 90% of wine volume from the named grape. Pinot Noir follows that condition; Cabernet Sauvignon is one of paragraph(2)'s listed exceptions permitting 75%. Origin and all other label conditions remain separate, and the exception list may be revised."
    },
    {
      "id": "n_d3pacific_principle_wa_origin",
      "node_type": "production_principle",
      "name": "What state fruit-source condition applies to an ordinary current unfortified wine labelled with Washington origin?"
    },
    {
      "id": "n_d3pacific_point_wa_origin",
      "node_type": "learning_point",
      "name": "For a Washington appellation claimed or implied, RCW 66.28.110(2)(a) requires at least 95% Washington-grown grapes, subject to paragraph(3)'s possible suspension for affected areas. Paragraph(5) excludes wines with added wine spirits, brandy or alcohol; the 2009 Act applies to wine from grapes harvested after 31 December 2009. AVA composition conditions remain separate; this does not impose 95% from every Washington AVA."
    },
    {
      "id": "n_d3pacific_case_release_compare",
      "node_type": "production_case",
      "name": "A fictional buyer compares three ordinary Vitis vinifera still wines, made exclusively from grapes harvested in 2025, for a prepaid 100-bottle pilot. No wine has added spirits, brandy or alcohol, no vintage date is claimed, and for this exercise no Washington suspension applies. A proposes California Chardonnay: 97% of wine volume is from California fruit and 3% from Oregon fruit, all Chardonnay, fully produced and finished in California; quote $10/bottle. B proposes Willamette Valley Pinot Noir: 94% of grapes from that wholly Oregon AVA and 6% from elsewhere in Oregon, with 88% of wine volume from Pinot Noir and 12% Chardonnay, fully produced and finished in Oregon; quote $11/bottle. C proposes Washington Chardonnay with no AVA: 96% Washington-grown grapes and 4% Oregon-grown grapes, all Chardonnay, fully produced and finished in Washington; quote $13/bottle. Records, quantities and quotes are invented. The buyer will consider C after complete label/record review and a repeat sample, then prepay; fresh fruit and moderate body are desired but no taste results or demand are supplied. A/B presentation changes need fresh review and buyer agreement and have unknown reprint costs/delay. Explain the separate gates, propose a conditional response, compare cash/cost tradeoffs and state the limits. Quoted costs omit delivery and all other expenses."
    },
    {
      "id": "n_d3pacific_point_case_release_compare_action",
      "node_type": "learning_point",
      "name": "Hold A's California claim and B's Willamette/Pinot presentation as proposed. Seek complete record and label review for C and a repeat sample against the buyer's brief before conditionally reserving the prepaid pilot; A/B alternative presentations require their own supporting records and buyer agreement."
    },
    {
      "id": "n_d3pacific_point_case_release_compare_reason",
      "node_type": "learning_point",
      "name": "A's 97% California fruit falls short of the ordinary all-California condition. B's 94% Willamette grape portion is below Oregon's 95% origin gate and its 88% Pinot Noir wine-volume portion is below 90%. Grape-source and finished-wine-volume measurements are not interchangeable. C's 96% Washington grape portion clears only the identified 95% state-source gate for this supplied 2025 harvest."
    },
    {
      "id": "n_d3pacific_point_case_release_compare_tradeoff",
      "node_type": "learning_point",
      "name": "The buyer's supplied 100-bottle purchase quotes are $1,300 for C, $1,000 for A and $1,100 for B. Prepayment reduces C's seller nonpayment exposure while tying up the buyer's cash and exposing that buyer to nondelivery. A small pilot limits the buyer's inventory commitment. C's higher quote, unresolved sensory fit and A/B revision costs or delay require consideration; omitted expenses and selling revenue prevent a full profit comparison."
    },
    {
      "id": "n_d3pacific_point_case_release_compare_limitation",
      "node_type": "learning_point",
      "name": "Fictional records and arithmetic do not authenticate origin or approve a complete label. No sensory results, sales pace, complete costs or actual suspension/contract evidence is supplied. These ordinary unfortified comparisons do not establish cross-border AVA or fortified-wine eligibility, guarantee quality or prove a profitable route."
    }
  ],
