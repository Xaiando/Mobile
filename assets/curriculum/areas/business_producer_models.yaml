knowledge_items:
  - id: "ki_biz_models_integration"
    subject_id: "n_biz_models_integration"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_biz_models_integration_point"
    domain_id: "business"
    assertion_text: "Reddy describes a business with both growing and winery roles. Combining those activities brings vineyard and cellar decisions within one enterprise; that is a coordination opportunity, not a guarantee of better wine."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T14:38:11.000Z"
  - id: "ki_biz_models_vineyard_commitment"
    subject_id: "n_biz_models_vineyard_commitment"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_biz_models_vineyard_commitment_point"
    domain_id: "business"
    assertion_text: "Producing own fruit adds vineyard establishment, land and equipment commitments. Penn State treats vineyards as perennial crops and warns that establishment requires substantial investment; owning a site does not establish demand or wine quality."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T14:38:11.000Z"
  - id: "ki_biz_models_custom_capacity"
    subject_id: "n_biz_models_custom_capacity"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_biz_models_custom_capacity_point"
    domain_id: "business"
    assertion_text: "Where a suitable service and capacity are available, custom production uses another winery's facility and expertise for the agreed work. Reddy explicitly serves start-ups without facilities; external capacity does not imply free production or unlimited availability."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T14:38:11.000Z"
  - id: "ki_biz_models_custom_scope"
    subject_id: "n_biz_models_custom_scope"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_biz_models_custom_scope_point"
    domain_id: "business"
    assertion_text: "Providers offer different combinations of sourcing, processing, storage and bottling. Peltier describes a private-label division of work with client-supplied labels; a service name alone does not establish every included task or approval role."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T14:38:11.000Z"
  - id: "ki_biz_models_cooperative_pool"
    subject_id: "n_biz_models_cooperative_pool"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_biz_models_cooperative_pool_point"
    domain_id: "business"
    assertion_text: "A producer cooperative can combine members' processing and marketing through a shared enterprise. USDA describes those functions; Plaimont's own history illustrates wine cellars and estates joining a cooperative union. Collective scale does not guarantee sales or a better return."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T14:38:11.000Z"
  - id: "ki_biz_models_cooperative_control"
    subject_id: "n_biz_models_cooperative_control"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_biz_models_cooperative_control_point"
    domain_id: "business"
    assertion_text: "USDA describes pooled funds, member ownership and democratic control, with financial benefits related to use. Participation shares enterprise decisions and funding rather than giving each grower sole control; actual terms and any distributable result must be checked."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T14:38:11.000Z"
  - id: "ki_biz_models_grape_purchase"
    subject_id: "n_biz_models_grape_purchase"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_biz_models_grape_purchase_point"
    domain_id: "business"
    assertion_text: "Penn State distinguishes growing grapes from producing wine and presents purchased fruit as an alternative to own production. Peltier offers both grape sales and outside-fruit access: buying grapes supplies fruit, not automatically the subsequent winemaking services."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T14:38:11.000Z"
  - id: "ki_biz_models_bulk_purchase"
    subject_id: "n_biz_models_bulk_purchase"
    relation_type: "PRINCIPLE_EXPLANATION"
    object_id: "n_biz_models_bulk_purchase_point"
    domain_id: "business"
    assertion_text: "Wineworks offers bulk-wine lots alongside bottling and private-label services. Selecting wine already made moves entry beyond grape-to-wine production, while lot suitability and remaining packaging work still need agreement; bulk supply is not a quality or continuity guarantee."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T14:38:11.000Z"
  - id: "ki_biz_models_case_contract_pilot_action"
    subject_id: "n_biz_models_case_contract_pilot"
    relation_type: "CASE_ACTION"
    object_id: "n_biz_models_case_contract_pilot_action_point"
    domain_id: "business"
    assertion_text: "Under the stated budget and confirmed proposal, commissioning the first lot through the service winery is a defensible way to begin without immediately building the unavailable cellar."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T14:38:11.000Z"
  - id: "ki_biz_models_case_contract_pilot_reason"
    subject_id: "n_biz_models_case_contract_pilot"
    relation_type: "CASE_REASON"
    object_id: "n_biz_models_case_contract_pilot_reason_point"
    domain_id: "business"
    assertion_text: "The supplied arrangement accesses the provider's production facility and expertise while the grower supplies the fruit. Custom-service providers expressly work with independent growers or brands lacking their own capacity."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T14:38:11.000Z"
  - id: "ki_biz_models_case_contract_pilot_tradeoff"
    subject_id: "n_biz_models_case_contract_pilot"
    relation_type: "CASE_TRADEOFF"
    object_id: "n_biz_models_case_contract_pilot_tradeoff_point"
    domain_id: "business"
    assertion_text: "Using the confirmed service avoids owning that first-lot production facility, but the grower depends on the agreed service scope, provider capacity and approval arrangements rather than controlling an owned cellar."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T14:38:11.000Z"
  - id: "ki_biz_models_case_contract_pilot_limitation"
    subject_id: "n_biz_models_case_contract_pilot"
    relation_type: "CASE_LIMITATION"
    object_id: "n_biz_models_case_contract_pilot_limitation_point"
    domain_id: "business"
    assertion_text: "The proposal supports this lot only. Future volumes, timing and production requirements need fresh agreement; neither the service model nor the prepared sales plan establishes repeat demand."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T14:38:11.000Z"
  - id: "ki_biz_models_case_cooperative_pool_action"
    subject_id: "n_biz_models_case_cooperative_pool"
    relation_type: "CASE_ACTION"
    object_id: "n_biz_models_case_cooperative_pool_action_point"
    domain_id: "business"
    assertion_text: "Under the supplied preference for shared processing and marketing over exclusive brand control, participating in the reviewed cooperative proposal is defensible; it is not the best model for every grower."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T14:38:11.000Z"
  - id: "ki_biz_models_case_cooperative_pool_reason"
    subject_id: "n_biz_models_case_cooperative_pool"
    relation_type: "CASE_REASON"
    object_id: "n_biz_models_case_cooperative_pool_reason_point"
    domain_id: "business"
    assertion_text: "The proposed enterprise combines services that each grower lacks individually. USDA describes shared processing and marketing functions, and Plaimont provides a wine-specific illustration of collective cellar organisation."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T14:38:11.000Z"
  - id: "ki_biz_models_case_cooperative_pool_tradeoff"
    subject_id: "n_biz_models_case_cooperative_pool"
    relation_type: "CASE_TRADEOFF"
    object_id: "n_biz_models_case_cooperative_pool_tradeoff_point"
    domain_id: "business"
    assertion_text: "The growers obtain collective resources while accepting the stated capital contributions, shared decisions and pool-proceeds method. That differs from retaining individual brand choices through a separate service arrangement."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T14:38:11.000Z"
  - id: "ki_biz_models_case_cooperative_pool_limitation"
    subject_id: "n_biz_models_case_cooperative_pool"
    relation_type: "CASE_LIMITATION"
    object_id: "n_biz_models_case_cooperative_pool_limitation_point"
    domain_id: "business"
    assertion_text: "Review actual acceptance, voting, funding and proceeds terms against each grower's needs. The hypothetical agreed terms do not establish universal cooperative rules, profitable sales or equal guaranteed payments."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T14:38:11.000Z"
