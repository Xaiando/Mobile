# Original Diploma producer-model principles and conditional applications.
# All 16 items await qualified expert review; curation timestamps are not expert verification.
# MCQ disabled: contextual business choices are not universal single-answer claims.
# No estate-label rule, universal cost/quality ranking, sales guarantee or official grading rubric.
knowledge_nodes:
  - id: "n_biz_models_integration"
    node_type: "production_principle"
    name: "What coordination opportunity comes from combining grape growing and winemaking in one producer business?"
  - id: "n_biz_models_integration_point"
    node_type: "learning_point"
    name: "Coordinate growing and winemaking"
  - id: "n_biz_models_vineyard_commitment"
    node_type: "production_principle"
    name: "What extra asset and site commitment accompanies producing grapes in an owned vineyard?"
  - id: "n_biz_models_vineyard_commitment_point"
    node_type: "learning_point"
    name: "Commit to vineyard assets and site"
  - id: "n_biz_models_custom_capacity"
    node_type: "production_principle"
    name: "How can a brand obtain wine-production capacity without building its own cellar?"
  - id: "n_biz_models_custom_capacity_point"
    node_type: "learning_point"
    name: "Use a service winery's capacity"
  - id: "n_biz_models_custom_scope"
    node_type: "production_principle"
    name: "Why must a custom-production proposal identify the services and client decisions it covers?"
  - id: "n_biz_models_custom_scope_point"
    node_type: "learning_point"
    name: "Agree production scope and client roles"
  - id: "n_biz_models_cooperative_pool"
    node_type: "production_principle"
    name: "How can a grower cooperative change access to processing and marketing resources?"
  - id: "n_biz_models_cooperative_pool_point"
    node_type: "learning_point"
    name: "Combine processing and marketing resources"
  - id: "n_biz_models_cooperative_control"
    node_type: "production_principle"
    name: "What ownership and control trade-off accompanies participation in the cooperative model described by USDA?"
  - id: "n_biz_models_cooperative_control_point"
    node_type: "learning_point"
    name: "Share ownership and member control"
  - id: "n_biz_models_grape_purchase"
    node_type: "production_principle"
    name: "How does buying grapes separate vineyard ownership from wine production?"
  - id: "n_biz_models_grape_purchase_point"
    node_type: "learning_point"
    name: "Buy fruit while retaining winemaking tasks"
  - id: "n_biz_models_bulk_purchase"
    node_type: "production_principle"
    name: "How does buying an existing bulk-wine lot differ from buying grapes?"
  - id: "n_biz_models_bulk_purchase_point"
    node_type: "learning_point"
    name: "Select wine already made and arrange remaining work"
  - id: "n_biz_models_case_contract_pilot"
    node_type: "production_case"
    name: "Hypothetical grower: saleable grapes are available for a first small branded wine, but the grower has no cellar. Available finance covers the quoted custom-production service and planned selling activities, not an equipped new winery. An independently reviewed proposal confirms harvest capacity, separate lot tracking, agreed wine specifications, approval roles, delivery window and service charges. A sales plan is prepared, but repeat demand is unknown. Compare commissioning that first lot with immediately building a winery. Explain a defensible action, its producer-model reason, one control trade-off and a limitation. No actual prices, legal label claim or guaranteed sales are supplied."
  - id: "n_biz_models_case_contract_pilot_action_point"
    node_type: "learning_point"
    name: "Commission the agreed first lot"
  - id: "n_biz_models_case_contract_pilot_reason_point"
    node_type: "learning_point"
    name: "Access external production capacity"
  - id: "n_biz_models_case_contract_pilot_tradeoff_point"
    node_type: "learning_point"
    name: "Exchange asset control for service dependence"
  - id: "n_biz_models_case_contract_pilot_limitation_point"
    node_type: "learning_point"
    name: "Review capacity and future requirements"
  - id: "n_biz_models_case_cooperative_pool"
    node_type: "production_case"
    name: "Hypothetical growers: several vineyard owners lack individual processing and marketing capacity. They explicitly prefer shared production and marketing resources over exclusive control of each grower's wine brand. A proposed cooperative has agreed fruit-acceptance standards, member capital contributions, democratic voting on shared production and sales policy, and a stated method for allocating any net pool proceeds after expenses. Each grower could instead buy a separate custom-production service and arrange an individual brand and sales effort. No sales or returns are guaranteed. Explain a defensible choice under those preferences, its reason, one ownership/control trade-off and a limit requiring review. These are supplied business assumptions, not rules for every cooperative."
  - id: "n_biz_models_case_cooperative_pool_action_point"
    node_type: "learning_point"
    name: "Choose the agreed shared-resource option"
  - id: "n_biz_models_case_cooperative_pool_reason_point"
    node_type: "learning_point"
    name: "Share processing and marketing capability"
  - id: "n_biz_models_case_cooperative_pool_tradeoff_point"
    node_type: "learning_point"
    name: "Accept shared decisions and funding"
  - id: "n_biz_models_case_cooperative_pool_limitation_point"
    node_type: "learning_point"
    name: "Check participation terms and outcomes"
