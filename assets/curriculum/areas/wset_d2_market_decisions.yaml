# Original Diploma D2 decisions on market evidence and measurable marketing.
# All case numbers and markets are hypothetical; expert review is outstanding.
knowledge_nodes:
  - id: n_d2_paired_shifts
    node_type: production_principle
    name: Why does a smaller wine crop not fix the price direction when demand also weakens?
  - id: n_d2_paired_shifts_point
    node_type: learning_point
    name: Compare the size of both shifts before inferring a price direction
  - id: n_d2_market_stock_context
    node_type: production_principle
    name: What must a buyer check before calling a low global wine vintage a shortage in one category?
  - id: n_d2_market_stock_context_point
    node_type: learning_point
    name: Check category demand, available stock and supply in the relevant market
  - id: n_d2_competitor_baseline
    node_type: production_principle
    name: What market comparison should precede a new wine's promotional positioning?
  - id: n_d2_competitor_baseline_point
    node_type: learning_point
    name: Compare the target offer with buyer needs and relevant competitors
  - id: n_d2_target_sample
    node_type: production_principle
    name: Why can a winery's existing club response mislead a restaurant-market launch?
  - id: n_d2_target_sample_point
    node_type: learning_point
    name: Test the offer with intended buyers beyond the current customer base
  - id: n_d2_marketing_objective
    node_type: production_principle
    name: How should a wine marketing objective be made assessable?
  - id: n_d2_marketing_objective_point
    node_type: learning_point
    name: State a relevant measure, baseline or target, and review date
  - id: n_d2_campaign_review
    node_type: production_principle
    name: How should a wine business judge a promotional activity against its objective?
  - id: n_d2_campaign_review_point
    node_type: learning_point
    name: Compare measured target-customer response with budget and goal
  - id: n_d2_case_supply_and_demand
    node_type: production_case
    name: >-
      Hypothetical wine merchant: a region's next vintage is 15% smaller, while its existing
      bottled stock is available and orders from the merchant's restaurant accounts have also
      slowed. A supplier asks for a 15% price increase solely because of the vintage loss.
      No category-wide demand, stock age, competing supply, supplier cost or price elasticity
      is supplied. Explain a defensible buying or pricing decision, why both market sides
      matter, a commercial trade-off and a limitation. More than one approach may be justified.
  - id: n_d2_case_supply_and_demand_action_point
    node_type: learning_point
    name: Check stock and account demand before accepting a fixed price rise
  - id: n_d2_case_supply_and_demand_reason_point
    node_type: learning_point
    name: Smaller harvest and weaker orders can move price in opposing directions
  - id: n_d2_case_supply_and_demand_tradeoff_point
    node_type: learning_point
    name: Secure needed volume against holding slow-moving stock at a higher cost
  - id: n_d2_case_supply_and_demand_limitation_point
    node_type: learning_point
    name: Supplied percentages do not establish the market clearing price
  - id: n_d2_case_market_launch
    node_type: production_case
    name: >-
      Hypothetical winery: it plans a dry white wine for independent restaurant by-the-glass
      lists. Its wine-club survey praises a gift carton, but no restaurant buyer has assessed
      the format, price or service plan. A rival offers a similarly styled wine at a known
      list price. The winery has a fixed promotional budget and wants repeat restaurant
      orders within six months. No pilot response or net return is supplied. Explain a
      defensible market test and objective, the evidence reason, a budget or positioning
      trade-off and a limitation. More than one approach may be justified.
  - id: n_d2_case_market_launch_action_point
    node_type: learning_point
    name: Test restaurant fit and set a dated repeat-order measure
  - id: n_d2_case_market_launch_reason_point
    node_type: learning_point
    name: Club approval does not establish restaurant demand or offer fit
  - id: n_d2_case_market_launch_tradeoff_point
    node_type: learning_point
    name: Allocate scarce budget between buyer trial, offer changes and promotion
  - id: n_d2_case_market_launch_limitation_point
    node_type: learning_point
    name: A competitor quote and pilot interest do not prove future repeat sales
