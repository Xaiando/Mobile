knowledge_items:
  - id: ki_d2_paired_shifts
    subject_id: n_d2_paired_shifts
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d2_paired_shifts_point
    domain_id: business
    assertion_text: If wine supply and demand both contract, the price direction cannot be inferred from the supply change alone; it depends on the relative shifts and responsiveness. Lower traded quantity does not itself determine the new price.
    verification_status: unverified
    last_verified_at: '2026-09-29T10:00:00.000Z'
    mcq_disabled: true
  - id: ki_d2_market_stock_context
    subject_id: n_d2_market_stock_context
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d2_market_stock_context_point
    domain_id: business
    assertion_text: The OIV's 2025 world-sector assessment describes another low-output year alongside weaker consumption and gradual stock adjustment, rather than a general shortage. A buying decision for a particular wine should check its relevant market, available inventory and buyer demand instead of inferring scarcity from the global crop alone.
    verification_status: unverified
    last_verified_at: '2026-09-29T10:00:00.000Z'
    mcq_disabled: true
  - id: ki_d2_competitor_baseline
    subject_id: n_d2_competitor_baseline
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d2_competitor_baseline_point
    domain_id: business
    assertion_text: Before positioning a proposed wine, examine target-buyer needs and comparable competitors' products, pricing, channels and communication. A rival's price alone does not establish the offer's fit or the buyer's willingness to purchase.
    verification_status: unverified
    last_verified_at: '2026-09-29T10:00:00.000Z'
    mcq_disabled: true
  - id: ki_d2_target_sample
    subject_id: n_d2_target_sample
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d2_target_sample_point
    domain_id: business
    assertion_text: Existing customer records and feedback can inform research but may not represent an intended new wine-buyer segment. Test the offer with the intended buyers, and where practical include noncustomers or competitors' customers, before generalising existing-club preferences to restaurant demand.
    verification_status: unverified
    last_verified_at: '2026-09-29T10:00:00.000Z'
    mcq_disabled: true
  - id: ki_d2_marketing_objective
    subject_id: n_d2_marketing_objective
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d2_marketing_objective_point
    domain_id: business
    assertion_text: A wine marketing objective should identify a relevant target and measurable result within a stated period, with a baseline or comparison where needed to assess change; an activity such as posting advertisements is not by itself an outcome objective.
    verification_status: unverified
    last_verified_at: '2026-09-29T10:00:00.000Z'
    mcq_disabled: true
  - id: ki_d2_campaign_review
    subject_id: n_d2_campaign_review
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_d2_campaign_review_point
    domain_id: business
    assertion_text: State the intended audience, activity, expected cost, response measure and review date for a promotion. Compare its measured outcome with the objective and budget before repeating or revising it; exposure or initial enquiries alone need not establish profitable repeat wine sales.
    verification_status: unverified
    last_verified_at: '2026-09-29T10:00:00.000Z'
    mcq_disabled: true
  - id: ki_d2_case_supply_and_demand_action
    subject_id: n_d2_case_supply_and_demand
    relation_type: CASE_ACTION
    object_id: n_d2_case_supply_and_demand_action_point
    domain_id: business
    assertion_text: Compare existing and incoming stock, recent restaurant orders, alternative supply and quoted terms before committing to the proposed 15% rise or a volume. A smaller trial, negotiated terms or a justified purchase can each be defensible with fuller evidence.
    verification_status: unverified
    last_verified_at: '2026-09-29T10:00:00.000Z'
    mcq_disabled: true
  - id: ki_d2_case_supply_and_demand_reason
    subject_id: n_d2_case_supply_and_demand
    relation_type: CASE_REASON
    object_id: n_d2_case_supply_and_demand_reason_point
    domain_id: business
    assertion_text: In the stated scenario, a smaller vintage tends to restrict incoming supply while slower restaurant orders suggest weaker demand; both can affect traded quantity and price. The crop-loss percentage alone is not a price-change equation.
    verification_status: unverified
    last_verified_at: '2026-09-29T10:00:00.000Z'
    mcq_disabled: true
  - id: ki_d2_case_supply_and_demand_tradeoff
    subject_id: n_d2_case_supply_and_demand
    relation_type: CASE_TRADEOFF
    object_id: n_d2_case_supply_and_demand_tradeoff_point
    domain_id: business
    assertion_text: Reserving incoming wine may protect availability if demand recovers, while taking too much at a higher cost may tie up cash beside the stated existing stock. The balance depends on order evidence, inventory and terms.
    verification_status: unverified
    last_verified_at: '2026-09-29T10:00:00.000Z'
    mcq_disabled: true
  - id: ki_d2_case_supply_and_demand_limitation
    subject_id: n_d2_case_supply_and_demand
    relation_type: CASE_LIMITATION
    object_id: n_d2_case_supply_and_demand_limitation_point
    domain_id: business
    assertion_text: The 15% crop decline and slower restaurant orders do not reveal the relative market-wide shifts, inventories, substitutes or responsiveness needed to calculate the new market price or a justified merchant margin.
    verification_status: unverified
    last_verified_at: '2026-09-29T10:00:00.000Z'
    mcq_disabled: true
  - id: ki_d2_case_market_launch_action
    subject_id: n_d2_case_market_launch
    relation_type: CASE_ACTION
    object_id: n_d2_case_market_launch_action_point
    domain_id: business
    assertion_text: Interview or trial with suitable restaurant buyers about format, list price and service, then set a time-bound repeat-order measure for a small launch before scaling promotion. The exact target should reflect the winery's baseline and capacity.
    verification_status: unverified
    last_verified_at: '2026-09-29T10:00:00.000Z'
    mcq_disabled: true
  - id: ki_d2_case_market_launch_reason
    subject_id: n_d2_case_market_launch
    relation_type: CASE_REASON
    object_id: n_d2_case_market_launch_reason_point
    domain_id: business
    assertion_text: Club respondents selected a gift carton as existing consumers, but restaurant buyers have different purchasing and service tasks. Their stated preference cannot be projected as restaurant demand without target-market evidence.
    verification_status: unverified
    last_verified_at: '2026-09-29T10:00:00.000Z'
    mcq_disabled: true
  - id: ki_d2_case_market_launch_tradeoff
    subject_id: n_d2_case_market_launch
    relation_type: CASE_TRADEOFF
    object_id: n_d2_case_market_launch_tradeoff_point
    domain_id: business
    assertion_text: A fixed promotional budget could fund target-buyer tasting, format or service changes, or broader advertising. A focused trial spends some budget on evidence and offer fit before broad reach, but reaches fewer potential accounts initially.
    verification_status: unverified
    last_verified_at: '2026-09-29T10:00:00.000Z'
    mcq_disabled: true
  - id: ki_d2_case_market_launch_limitation
    subject_id: n_d2_case_market_launch
    relation_type: CASE_LIMITATION
    object_id: n_d2_case_market_launch_limitation_point
    domain_id: business
    assertion_text: A known rival list price and a small buyer pilot do not establish all future account orders, net return or the best full-market price. Review actual response and costs before generalising beyond the test.
    verification_status: unverified
    last_verified_at: '2026-09-29T10:00:00.000Z'
    mcq_disabled: true
