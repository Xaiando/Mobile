knowledge_items:
  - id: ki_reg_ib_rioja_gradient
    subject_id: n_reg_ib_principle_es_rioja_climate
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ib_point_rioja_gradient
    domain_id: geography
    assertion_text: "Rioja combines Atlantic and Mediterranean influences: western areas generally have
      stronger Atlantic influence, while eastern areas are warmer and drier. This frames a ripening
      comparison without making every western site cooler than every eastern site."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_rioja_topography
    subject_id: n_reg_ib_principle_es_rioja_climate
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ib_point_rioja_topography
    domain_id: geography
    assertion_text: Rioja’s mountain barriers, vineyard elevation and aspect modify exposure and temperature
      within the broad climate gradient. Compare the actual sites and vintage before attributing a wine’s
      freshness or ripeness to its subregional name.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_rioja_red_cellar
    subject_id: n_reg_ib_principle_es_rioja_styles
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ib_point_rioja_red_cellar
    domain_id: winemaking
    assertion_text: Tempranillo is an established foundation of Rioja reds, but grape composition and
      maturation choices alter the result. Oak can add spice or toast; neither the regional name nor a
      ripe fruit profile establishes the exact barrel treatment or sensory quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_rioja_white_oak
    subject_id: n_reg_ib_principle_es_rioja_styles
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ib_point_rioja_white_oak
    domain_id: winemaking
    assertion_text: Rioja whites associated with Viura can show floral, citrus and white-fruit characters;
      some receive oak treatment that adds different aromas and texture. Compare actual production
      details rather than assuming all Rioja is red or all its whites are unoaked.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_ribera_elevation
    subject_id: n_reg_ib_principle_es_ribera
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ib_point_ribera_elevation
    domain_id: geography
    assertion_text: Ribera del Duero’s elevated plateau and river-valley vineyards must be considered
      alongside its continental climate. A warm summer daytime reading alone does not describe the site’s
      temperature variation or establish the finished red wine’s balance.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_ribera_season
    subject_id: n_reg_ib_principle_es_ribera
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ib_point_ribera_season
    domain_id: geography
    assertion_text: Ribera del Duero combines dry summers, long rigorous winters and substantial temperature
      variation, with relatively late ripening described by the council. These conditions create a
      seasonal constraint as well as ripening potential; vintage and vineyard decisions remain necessary
      evidence.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_rias_canopy_context
    subject_id: n_reg_ib_principle_es_galicia
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ib_point_rias_canopy_context
    domain_id: viticulture
    assertion_text: Rías Baixas has strong Atlantic influence and established Albariño production.
      Traditional pergolas raise foliage and grapes above damp ground and allow ventilation; this helps
      explain the training choice, without guaranteeing freedom from fungal disease at every site.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_sacra_terraces
    subject_id: n_reg_ib_principle_es_galicia
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ib_point_sacra_terraces
    domain_id: geography
    assertion_text: Ribeira Sacra’s Miño and Sil river-valley terraces provide a contrasting setting to
      coastal Rías Baixas. Mencía is an established red-wine association; differing valley climates and
      individual vineyards prevent one uniform ripening or wine-style rule for the whole region.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_rueda_ripening
    subject_id: n_reg_ib_principle_es_rueda
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ib_point_rueda_ripening
    domain_id: geography
    assertion_text: Rueda’s elevated setting and marked day–night temperature variation form part of
      Verdejo’s ripening environment. Assess those conditions with the vintage and picking decisions,
      rather than treating latitude or daytime heat as a complete explanation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_rueda_verdejo_style
    subject_id: n_reg_ib_principle_es_rueda
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ib_point_rueda_verdejo_style
    domain_id: geography
    assertion_text: Verdejo in Rueda is associated with fruit and herbal aromas and acidity.
      These are useful sensory expectations for a regional comparison, while grape composition
      and production details remain relevant; the description is not a guaranteed blind-origin test.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_priorat_access
    subject_id: n_reg_ib_principle_es_priorat_montsant
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ib_point_priorat_access
    domain_id: viticulture
    assertion_text: Priorat includes steep vineyards where access and slope restrict mechanisation and
      require traditional manual operations. This is a plausible labour constraint to investigate; it
      does not prove that every Priorat vineyard costs more or produces better wine than Montsant.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_montsant_controls
    subject_id: n_reg_ib_principle_es_priorat_montsant
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ib_point_montsant_controls
    domain_id: winemaking
    assertion_text: Montsant’s technical programme compares vineyard settings using Garnatxa and Carinyena;
      one study selected similarly aged vines, harvested at comparable maturity and used the same
      stainless-steel vinification without oak. Such controls reduce confounding, but do not prove that
      one soil type causes a particular flavour.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_levante_monastrell
    subject_id: n_reg_ib_principle_es_levante
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ib_point_levante_monastrell
    domain_id: viticulture
    assertion_text: Monastrell is established in Jumilla and Yecla’s hot, relatively dry settings and has a
      long ripening cycle. Jumilla’s council describes a balance between picking too early with vegetal
      character and too late with lost freshness; a warm origin alone cannot set the right harvest date.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_utiel_bobal
    subject_id: n_reg_ib_principle_es_levante
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ib_point_utiel_bobal
    domain_id: geography
    assertion_text: Utiel-Requena’s elevated continental plateau, with day–night temperature variation,
      provides a distinct Levante setting for Bobal. Its deep colour, body and natural acidity are useful
      regional associations, but site and production decisions still determine the individual wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_mancha_adaptation
    subject_id: n_reg_ib_principle_es_mancha_airen
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ib_point_mancha_adaptation
    domain_id: viticulture
    assertion_text: Airén is an established La Mancha white variety adapted to the region’s continental cold
      winters, hot summers and limited rainfall. Adaptation supplies growing context, but does not
      guarantee sufficient water, a fixed yield or a particular quality level in every vineyard.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_mancha_ferment
    subject_id: n_reg_ib_principle_es_mancha_airen
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ib_point_mancha_ferment
    domain_id: winemaking
    assertion_text: Temperature-controlled fermentation is one route to fresh, aromatic young Airén whites
      from La Mancha. The hot growing region does not require an oxidised or heavy style, and the cellar
      technique alone is insufficient evidence of the finished wine’s quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_douro_shelter
    subject_id: n_reg_ib_principle_pt_douro_climate
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ib_point_douro_shelter
    domain_id: geography
    assertion_text: The Douro is sheltered from direct Atlantic influence by mountains including the Serra do
      Marão, contributing to cold winters and hot summers. This supplies a still-wine growing context
      without implying uniform heat or ripeness across every slope and elevation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_douro_gradient
    subject_id: n_reg_ib_principle_pt_douro_climate
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ib_point_douro_gradient
    domain_id: geography
    assertion_text: Within the Douro, Baixo Corgo is generally cooler and wetter, while Douro Superior is
      hotter and drier. This gradient helps organise a ripening and water-availability comparison, with
      slope, elevation and the actual vintage still needed for a specific vineyard.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_douro_blends
    subject_id: n_reg_ib_principle_pt_douro_still
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ib_point_douro_blends
    domain_id: geography
    assertion_text: Douro still reds frequently blend native varieties such as Touriga Nacional, Touriga
      Franca and Tinta Roriz, with varietal examples also made. Blend composition helps explain structure
      and fruit expression; Port production methods must not be inferred from a Douro still-wine origin.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_douro_terrain
    subject_id: n_reg_ib_principle_pt_douro_still
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ib_point_douro_terrain
    domain_id: viticulture
    assertion_text: The Douro’s steep terrain and terrace configurations complicate vineyard operations such
      as pruning, soil work and spraying. These constraints can affect labour requirements, but a
      still-wine cost comparison needs actual access, equipment and cost records for the sites being
      compared.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_dao_mountains
    subject_id: n_reg_ib_principle_pt_dao
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ib_point_dao_mountains
    domain_id: geography
    assertion_text: Dão’s surrounding mountains modify direct maritime and continental influences, while
      varied vineyard elevations create different growing settings. The regional description therefore
      needs a specific site and vintage before it can explain a wine’s ripeness or acidity.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_dao_encruzado
    subject_id: n_reg_ib_principle_pt_dao
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ib_point_dao_encruzado
    domain_id: geography
    assertion_text: Encruzado is strongly associated with Dão and can combine acidity with a structured
      white-wine palate in varietal wines or blends. This supports comparison with lighter aromatic
      whites, while harvest and cellar choices prevent a fixed richness or ageing rule.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_bairrada_baga_ripening
    subject_id: n_reg_ib_principle_pt_bairrada
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ib_point_bairrada_baga_ripening
    domain_id: viticulture
    assertion_text: Bairrada has a strong Atlantic influence and relatively mild, wet conditions; its
      established Baga variety ripens late and is susceptible to rot in wet harvest periods. Suitable
      exposure and the particular season matter, rather than assuming that all regional fruit reaches the
      same maturity.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_baga_structure
    subject_id: n_reg_ib_principle_pt_bairrada
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ib_point_baga_structure
    domain_id: geography
    assertion_text: Well-ripened Baga can make deeply coloured reds with substantial acidity and tannin;
      youthful examples may be astringent and can soften with suitable ageing. This is potential, not a
      guarantee that every Bairrada red is Baga or every Baga wine benefits from prolonged storage.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_verde_atlantic
    subject_id: n_reg_ib_principle_pt_vinho_verde
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ib_point_verde_atlantic
    domain_id: geography
    assertion_text: Vinho Verde’s strong Atlantic influence, with substantial rainfall and moderate
      temperatures, supplies context for fresh aromatic whites from grapes including Alvarinho and
      Loureiro. The name does not establish that every wine is low in alcohol, lightly fizzy or made from
      unripe fruit.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_verde_shelter
    subject_id: n_reg_ib_principle_pt_vinho_verde
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ib_point_verde_shelter
    domain_id: geography
    assertion_text: Monção e Melgaço is more sheltered from direct Atlantic influence than exposed Vinho
      Verde sites and is associated with fuller whites with relatively higher alcohol. This is a useful
      contrast, while grape, vintage and picking decisions still matter for the individual wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_alentejo_heat
    subject_id: n_reg_ib_principle_pt_alentejo
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ib_point_alentejo_heat
    domain_id: geography
    assertion_text: Alentejo’s hot, dry Mediterranean and continental influences provide context for ripe,
      often fuller red styles from grapes such as Aragonez and Alicante Bouschet. These are associations
      rather than a complete grape list or proof that every Alentejo wine is heavy or high in quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_alentejo_portalegre
    subject_id: n_reg_ib_principle_pt_alentejo
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_ib_point_alentejo_portalegre
    domain_id: geography
    assertion_text: Portalegre’s Serra de São Mamede setting offers cooler, higher sites within Alentejo
      compared with warmer lowland settings. Compare the actual grape and cellar choices as well as
      elevation before treating this contrast as an explanation of freshness or a regional quality
      hierarchy.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_case_es_rioja_site_action
    subject_id: n_reg_ib_case_es_rioja_site
    relation_type: CASE_ACTION
    object_id: n_reg_ib_point_case_es_rioja_site_action
    domain_id: geography
    assertion_text: Compare recorded temperatures and picking conditions with the wines’ acidity and fruit
      expression. Use the cooler western-site premise as a possible explanation while checking elevation,
      exposure and harvest choices rather than attributing everything to the labels.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_case_es_rioja_site_reason
    subject_id: n_reg_ib_case_es_rioja_site
    relation_type: CASE_REASON
    object_id: n_reg_ib_point_case_es_rioja_site_reason
    domain_id: geography
    assertion_text: The cooler western period is consistent with Rioja’s broad Atlantic-to-Mediterranean
      gradient and offers a plausible ripening contribution. Similar blend and oak treatment reduce two
      competing explanations but do not make climate the only cause of the observed freshness.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_case_es_rioja_site_tradeoff
    subject_id: n_reg_ib_case_es_rioja_site
    relation_type: CASE_TRADEOFF
    object_id: n_reg_ib_point_case_es_rioja_site_tradeoff
    domain_id: geography
    assertion_text: "Matching blend and maturation makes this pair more informative about growing conditions,
      but sacrifices breadth: two sites cannot represent all Rioja. Add contrasting elevations or
      vintages when the learning goal is to test the wider regional pattern."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_case_es_rioja_site_limitation
    subject_id: n_reg_ib_case_es_rioja_site
    relation_type: CASE_LIMITATION
    object_id: n_reg_ib_point_case_es_rioja_site_limitation
    domain_id: winemaking
    assertion_text: Yield, fruit selection and other cellar decisions remain unrecorded. The sensory
      difference supports a qualified explanation, not proof that the western label caused higher quality
      or that an unknown fresher Rioja must come from the west.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_case_es_priorat_price_action
    subject_id: n_reg_ib_case_es_priorat_price
    relation_type: CASE_ACTION
    object_id: n_reg_ib_point_case_es_priorat_price_action
    domain_id: business
    assertion_text: Check the documented labour and selling costs, then test the proposed price against
      competing offers and the target buyer’s perceived value. A steep-site account helps explain costs;
      similar sensory assessments do not establish identical required or achievable prices.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_case_es_priorat_price_reason
    subject_id: n_reg_ib_case_es_priorat_price
    relation_type: CASE_REASON
    object_id: n_reg_ib_point_case_es_priorat_price_reason
    domain_id: business
    assertion_text: The stated higher labour cost can raise the price needed to cover costs despite similar
      sensory evaluations. Priorat’s access constraints make the premise plausible, but only the supplied
      parcel records establish that this pair actually has different unit costs.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_case_es_priorat_price_tradeoff
    subject_id: n_reg_ib_case_es_priorat_price
    relation_type: CASE_TRADEOFF
    object_id: n_reg_ib_point_case_es_priorat_price_tradeoff
    domain_id: business
    assertion_text: A higher price may recover the producer’s costs but lose buyers who perceive comparable
      value in the Montsant alternative. Market testing is needed to weigh cost recovery against
      achievable demand; regional reputation cannot remove this tradeoff.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_case_es_priorat_price_limitation
    subject_id: n_reg_ib_case_es_priorat_price
    relation_type: CASE_LIMITATION
    object_id: n_reg_ib_point_case_es_priorat_price_limitation
    domain_id: business
    assertion_text: This pair cannot establish that every Priorat wine costs more, tastes better or deserves
      a fixed premium over Montsant. Different access, production choices, quality assessments and
      customers would require a new cost and value comparison.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_case_pt_white_design_action
    subject_id: n_reg_ib_case_pt_white_design
    relation_type: CASE_ACTION
    object_id: n_reg_ib_point_case_pt_white_design_action
    domain_id: geography
    assertion_text: Compare the site records and sensory observations while recording the different grapes
      and the stated fermentation treatments separately. Add examples with closer grape and cellar
      matches before trying to isolate a regional contribution to acidity, aroma or texture.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_case_pt_white_design_reason
    subject_id: n_reg_ib_case_pt_white_design
    relation_type: CASE_REASON
    object_id: n_reg_ib_point_case_pt_white_design_reason
    domain_id: geography
    assertion_text: Dão’s mountain-buffered settings contrast with Vinho Verde’s strong Atlantic influence,
      and Encruzado’s structured palate differs from a typical fresh aromatic white brief. These are
      plausible contributors, while the specified barrel treatment is a separate production variable.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_case_pt_white_design_tradeoff
    subject_id: n_reg_ib_case_pt_white_design
    relation_type: CASE_TRADEOFF
    object_id: n_reg_ib_point_case_pt_white_design_tradeoff
    domain_id: winemaking
    assertion_text: The pair makes the style contrast easy to discuss, but changing grape and fermentation
      treatment together confounds a regional explanation. A more closely matched comparison improves
      attribution while reducing the breadth of styles shown in this exercise.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_case_pt_white_design_limitation
    subject_id: n_reg_ib_case_pt_white_design
    relation_type: CASE_LIMITATION
    object_id: n_reg_ib_point_case_pt_white_design_limitation
    domain_id: geography
    assertion_text: The pair cannot establish that all Dão whites are barrel-fermented and rich or all Vinho
      Verde whites are light. Vinho Verde’s sheltered Monção e Melgaço can make fuller examples, and
      actual wine records are needed before ranking quality or attributing texture to origin.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_case_pt_baga_inventory_action
    subject_id: n_reg_ib_case_pt_baga_inventory
    relation_type: CASE_ACTION
    object_id: n_reg_ib_point_case_pt_baga_inventory_action
    domain_id: business
    assertion_text: Request a mature sample or credible wine-specific ageing record, compare it with the
      customers’ preference, and budget the payment timing and stated storage costs before purchasing.
      The ready-to-sell Dão blend is a comparison option, not proof of regional superiority.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_case_pt_baga_inventory_reason
    subject_id: n_reg_ib_case_pt_baga_inventory
    relation_type: CASE_REASON
    object_id: n_reg_ib_point_case_pt_baga_inventory_reason
    domain_id: geography
    assertion_text: Well-ripened Baga can have substantial tannin and acidity and may soften with suitable
      ageing, so delaying sale has a plausible style rationale. The young bottle’s structure alone does
      not establish that this wine will become balanced or meet the customers’ preference after two
      years.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_case_pt_baga_inventory_tradeoff
    subject_id: n_reg_ib_case_pt_baga_inventory
    relation_type: CASE_TRADEOFF
    object_id: n_reg_ib_point_case_pt_baga_inventory_tradeoff
    domain_id: business
    assertion_text: Holding the Baga may produce a more suitable texture, but under the stated payment and
      storage terms it delays sales and ties cash to inventory while adding costs. Selling the already
      suitable Dão blend sooner forgoes that possible Baga development but releases cash earlier.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
  - id: ki_reg_ib_case_pt_baga_inventory_limitation
    subject_id: n_reg_ib_case_pt_baga_inventory
    relation_type: CASE_LIMITATION
    object_id: n_reg_ib_point_case_pt_baga_inventory_limitation
    domain_id: business
    assertion_text: Without wine-specific mature evidence, appropriate storage assurance and a customer
      trial, the two-year result remains uncertain. General Baga ageing potential cannot guarantee
      successful maturation, future demand or a price that recovers the added costs.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:54:00.000Z
