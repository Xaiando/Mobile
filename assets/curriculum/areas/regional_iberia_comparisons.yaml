# Original still-wine regional comparisons; all await qualified review.
# MCQ disabled: qualified site/style explanations and case actions permit defensible alternatives.
# Dates record curation, not the start of these regional conditions.
knowledge_nodes:
  - id: n_reg_ib_principle_es_rioja_climate
    node_type: production_principle
    name: How do Atlantic and Mediterranean influences, elevation and aspect complicate a single Rioja
      ripening prediction?
  - id: n_reg_ib_point_rioja_gradient
    node_type: learning_point
    name: Rioja has an Atlantic-to-Mediterranean climate contrast
  - id: n_reg_ib_point_rioja_topography
    node_type: learning_point
    name: Rioja mountains, altitude and aspect modify the regional gradient
  - id: n_reg_ib_principle_es_rioja_styles
    node_type: production_principle
    name: Which grape and cellar differences matter when comparing a Rioja red with a Rioja white rather than
      assuming one regional style?
  - id: n_reg_ib_point_rioja_red_cellar
    node_type: learning_point
    name: Tempranillo fruit and maturation choices both matter in Rioja reds
  - id: n_reg_ib_point_rioja_white_oak
    node_type: learning_point
    name: Rioja whites include fruit-led and oak-influenced expressions
  - id: n_reg_ib_principle_es_ribera
    node_type: production_principle
    name: How do Ribera del Duero’s elevated continental sites create both ripening opportunities and
      seasonal constraints?
  - id: n_reg_ib_point_ribera_elevation
    node_type: learning_point
    name: Ribera elevation adds context beyond warm daytime conditions
  - id: n_reg_ib_point_ribera_season
    node_type: learning_point
    name: Ribera dry summers and rigorous winters create a demanding season
  - id: n_reg_ib_principle_es_galicia
    node_type: production_principle
    name: How do Albariño in Atlantic Rías Baixas and Mencía on Ribeira Sacra’s river terraces connect
      growing conditions with different vineyard practices?
  - id: n_reg_ib_point_rias_canopy_context
    node_type: learning_point
    name: Rías Baixas pergolas address humid Atlantic growing conditions
  - id: n_reg_ib_point_sacra_terraces
    node_type: learning_point
    name: Ribeira Sacra Mencía comparisons need river-valley and terrace context
  - id: n_reg_ib_principle_es_rueda
    node_type: production_principle
    name: How do Rueda’s setting and Verdejo’s sensory characteristics help explain a fresh white style
      without fixing every wine’s profile?
  - id: n_reg_ib_point_rueda_ripening
    node_type: learning_point
    name: Rueda elevation and day–night variation frame Verdejo ripening
  - id: n_reg_ib_point_rueda_verdejo_style
    node_type: learning_point
    name: Verdejo combines fruit and herbal aromas with acidity
  - id: n_reg_ib_principle_es_priorat_montsant
    node_type: production_principle
    name: Why should a Priorat–Montsant Garnatxa comparison examine access, vineyard conditions and
      production controls instead of assuming a quality hierarchy?
  - id: n_reg_ib_point_priorat_access
    node_type: learning_point
    name: Steep Priorat vineyards can restrict mechanisation
  - id: n_reg_ib_point_montsant_controls
    node_type: learning_point
    name: Montsant comparisons can control harvest maturity and cellar treatment
  - id: n_reg_ib_principle_es_levante
    node_type: production_principle
    name: How do Monastrell’s ripening demands in Jumilla and Yecla compare with Bobal’s expression in
      elevated Utiel-Requena?
  - id: n_reg_ib_point_levante_monastrell
    node_type: learning_point
    name: Monastrell’s long cycle needs a qualified hot-site harvest decision
  - id: n_reg_ib_point_utiel_bobal
    node_type: learning_point
    name: Utiel-Requena elevation and Bobal broaden Levante red-wine comparisons
  - id: n_reg_ib_principle_es_mancha_airen
    node_type: production_principle
    name: How can La Mancha’s Airén adaptation and fermentation choices explain fresh white wines despite
      hot, dry growing conditions?
  - id: n_reg_ib_point_mancha_adaptation
    node_type: learning_point
    name: Airén is adapted to La Mancha’s continental temperature and drought conditions
  - id: n_reg_ib_point_mancha_ferment
    node_type: learning_point
    name: Temperature control can preserve Airén’s fresh aromatic expression
  - id: n_reg_ib_principle_pt_douro_climate
    node_type: production_principle
    name: How do Atlantic shelter and the west–east climate gradient distinguish still-wine sites within the
      Douro?
  - id: n_reg_ib_point_douro_shelter
    node_type: learning_point
    name: Mountain shelter reduces Atlantic moderation in the Douro
  - id: n_reg_ib_point_douro_gradient
    node_type: learning_point
    name: Douro Superior is generally hotter and drier than Baixo Corgo
  - id: n_reg_ib_principle_pt_douro_still
    node_type: production_principle
    name: Which grape and terrain considerations matter when comparing Douro still reds rather than
      transferring rules from Port?
  - id: n_reg_ib_point_douro_blends
    node_type: learning_point
    name: Douro still reds frequently blend native varieties
  - id: n_reg_ib_point_douro_terrain
    node_type: learning_point
    name: Douro steep terrain complicates vineyard work
  - id: n_reg_ib_principle_pt_dao
    node_type: production_principle
    name: How do Dão’s mountain setting and Encruzado’s characteristics support a qualified regional
      white-wine comparison?
  - id: n_reg_ib_point_dao_mountains
    node_type: learning_point
    name: Dão mountains modify maritime and continental influences
  - id: n_reg_ib_point_dao_encruzado
    node_type: learning_point
    name: Dão-associated Encruzado can combine structure with acidity
  - id: n_reg_ib_principle_pt_bairrada
    node_type: production_principle
    name: How do Bairrada’s Atlantic conditions interact with Baga ripening and the structure of its still
      reds?
  - id: n_reg_ib_point_bairrada_baga_ripening
    node_type: learning_point
    name: Baga’s late ripening makes wet Bairrada seasons consequential
  - id: n_reg_ib_point_baga_structure
    node_type: learning_point
    name: Well-ripened Baga can retain firm acidity and tannin
  - id: n_reg_ib_principle_pt_vinho_verde
    node_type: production_principle
    name: Why do Atlantic Vinho Verde whites and sheltered Monção e Melgaço examples resist one uniform
      regional style rule?
  - id: n_reg_ib_point_verde_atlantic
    node_type: learning_point
    name: Vinho Verde’s Atlantic influence supports fresh aromatic whites
  - id: n_reg_ib_point_verde_shelter
    node_type: learning_point
    name: Sheltered Monção e Melgaço can make fuller whites
  - id: n_reg_ib_principle_pt_alentejo
    node_type: production_principle
    name: How do Alentejo’s hot, dry environment and cooler Portalegre sites broaden its still-wine style
      possibilities?
  - id: n_reg_ib_point_alentejo_heat
    node_type: learning_point
    name: Hot, dry Alentejo supports ripe styles from varied grapes
  - id: n_reg_ib_point_alentejo_portalegre
    node_type: learning_point
    name: Portalegre’s Serra de São Mamede offers a cooler Alentejo contrast
  - id: n_reg_ib_case_es_rioja_site
    node_type: production_case
    name: A class compares two Tempranillo-based Rioja reds from the same vintage with similar blend
      composition and oak maturation. Records show that the western vineyard had a cooler ripening period
      and later picking than the eastern vineyard; the western wine tastes fresher and less ripe. Design
      an evidence-based explanation, with a reason, tradeoff and limitation. The regional labels alone
      provide no quality ranking.
  - id: n_reg_ib_point_case_es_rioja_site_action
    node_type: learning_point
    name: Compare recorded site conditions with harvest and sensory evidence
  - id: n_reg_ib_point_case_es_rioja_site_reason
    node_type: learning_point
    name: The recorded cooler western period is consistent with Rioja’s broad gradient
  - id: n_reg_ib_point_case_es_rioja_site_tradeoff
    node_type: learning_point
    name: A matched pair improves comparison but represents few sites
  - id: n_reg_ib_point_case_es_rioja_site_limitation
    node_type: learning_point
    name: Check unrecorded vineyard and cellar variables before a causal claim
  - id: n_reg_ib_case_es_priorat_price
    node_type: production_case
    name: A buyer compares a Priorat Garnatxa red from a steep parcel worked manually with a Montsant
      Garnatxa red from a parcel where tractor access is possible. Both receive similar blind evaluations
      for balance and persistence. The Priorat supplier documents higher labour cost per bottle and
      proposes a higher selling price. Assess the proposal with an action, reason, tradeoff and
      limitation; demand at the proposed price has not been measured.
  - id: n_reg_ib_point_case_es_priorat_price_action
    node_type: learning_point
    name: Check cost evidence and test the proposed price with buyers
  - id: n_reg_ib_point_case_es_priorat_price_reason
    node_type: learning_point
    name: Documented manual labour can raise the price needed to cover costs
  - id: n_reg_ib_point_case_es_priorat_price_tradeoff
    node_type: learning_point
    name: Cost recovery may reduce competitiveness for comparable wines
  - id: n_reg_ib_point_case_es_priorat_price_limitation
    node_type: learning_point
    name: Neither the two regions nor the two parcels establish a universal premium
  - id: n_reg_ib_case_pt_white_design
    node_type: production_case
    name: A study group compares a structured Dão Encruzado fermented in barrel with a fresh, aromatic Vinho
      Verde Loureiro fermented in stainless steel. The pair differs in grape and cellar treatment, and
      vineyard records are available. Design a useful regional comparison, give a reason, and discuss a
      tradeoff and limitation when explaining acidity, aroma and texture. Neither wine has an
      independently established quality advantage.
  - id: n_reg_ib_point_case_pt_white_design_action
    node_type: learning_point
    name: Separate site, grape and cellar variables in the Portuguese white comparison
  - id: n_reg_ib_point_case_pt_white_design_reason
    node_type: learning_point
    name: Dão mountain settings and Atlantic Vinho Verde supply different contexts
  - id: n_reg_ib_point_case_pt_white_design_tradeoff
    node_type: learning_point
    name: A vivid style contrast makes regional attribution less controlled
  - id: n_reg_ib_point_case_pt_white_design_limitation
    node_type: learning_point
    name: The pair cannot define all Dão or Vinho Verde white styles
  - id: n_reg_ib_case_pt_baga_inventory
    node_type: production_case
    name: A merchant’s customers prefer softer mature red wines. A young Bairrada Baga tastes firmly tannic,
      while a Dão red blend already meets that preference. The Baga supplier proposes two years of bottle
      storage but provides no mature sample. Both wines fit the purchase budget; storage would require
      payment now, space and insurance before later sales. Assess the Baga option with an action, reason,
      tradeoff and limitation without assuming it will mature successfully.
  - id: n_reg_ib_point_case_pt_baga_inventory_action
    node_type: learning_point
    name: Request ageing evidence and budget the proposed storage before buying Baga
  - id: n_reg_ib_point_case_pt_baga_inventory_reason
    node_type: learning_point
    name: Baga’s youthful structure offers conditional softening potential
  - id: n_reg_ib_point_case_pt_baga_inventory_tradeoff
    node_type: learning_point
    name: Holding Baga delays sales and ties cash to stock
  - id: n_reg_ib_point_case_pt_baga_inventory_limitation
    node_type: learning_point
    name: Vintage, wine condition and customer response make the storage outcome uncertain
