# Original conditional climate/weather causal paths. All items remain unverified.
# MCQ is disabled: these points require supplied controls and explicit cited contradictions.
# WSET_L4-only; no map edges, type declarations or new recall templates.
knowledge_nodes:
  - id: "n_climate_ripen_malate_premise"
    node_type: "causal_premise"
    name: "During post-veraison ripening, one batch of berries is moderately warmer than a matched batch,
      without heat injury. Measurements establish that its malate-consuming respiratory flux is higher over
      the same interval. Starting malate amount, cultivar, developmental stage, crop load, carbon supply,
      malate synthesis/import, other malate-consuming routes and berry volume are matched. Isolate that
      respiratory difference; do not predict finished-wine pH."
  - id: "n_climate_ripen_malate_respiration"
    node_type: "causal_state"
    name: "Greater use of berry malate as a respiratory substrate"
  - id: "n_climate_ripen_malate_remaining"
    node_type: "causal_state"
    name: "Less malate remaining per berry through the isolated respiratory difference"
  - id: "n_climate_ripen_malate_wrong_more"
    node_type: "causal_state"
    name: "More malate remaining per berry because respiratory malate consumption increased"
  - id: "n_climate_ripen_malate_wrong_unchanged"
    node_type: "causal_state"
    name: "Unchanged malate per berry despite greater consumption and matched replenishment"
  - id: "n_climate_ripen_malate_wrong_tartrate"
    node_type: "causal_state"
    name: "Necessary depletion of berry tartrate through the isolated malate respiratory pathway"
  - id: "n_climate_ripen_botrytis_premise"
    node_type: "causal_premise"
    name: "Susceptible mature grapes carry viable Botrytis cinerea conidia. Compare longer berry-surface wetness
      in a humid fruit zone with rapid surface drying, within a wetness-duration range conducive to
      infection. Both treatments have moderate temperatures suitable for germination and infection. Host
      stage, wounding, inoculum amount and disease controls are matched. Free water remains on berry
      surfaces in the longer-wet treatment; no disease outcome has yet been observed."
  - id: "n_climate_ripen_botrytis_conditions"
    node_type: "causal_state"
    name: "A more conducive wet-surface opportunity for Botrytis conidial germination and infection"
  - id: "n_climate_ripen_botrytis_risk"
    node_type: "causal_state"
    name: "Greater Botrytis infection risk in the longer-wet treatment without guaranteed disease"
  - id: "n_climate_ripen_botrytis_wrong_less"
    node_type: "causal_state"
    name: "Lower Botrytis infection risk caused by the longer conducive wetness period"
  - id: "n_climate_ripen_botrytis_wrong_blocked"
    node_type: "causal_state"
    name: "Botrytis conidial germination blocked by sustained free water at a suitable temperature"
  - id: "n_climate_ripen_botrytis_wrong_guaranteed"
    node_type: "causal_state"
    name: "Guaranteed Botrytis infection of every berry solely because surfaces stay wet longer"
