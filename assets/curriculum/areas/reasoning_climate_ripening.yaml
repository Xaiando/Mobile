knowledge_items:
  - id: "ki_climate_ripen_malate_respiration"
    subject_id: "n_climate_ripen_malate_premise"
    relation_type: "CAUSES_STATE"
    object_id: "n_climate_ripen_malate_respiration"
    domain_id: "viticulture"
    assertion_text: "The supplied higher malate-consuming respiratory flux uses more berry malate as substrate;
      warmth alone does not establish that response in every stage or thermal regime."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T13:38:31.811Z"
  - id: "ki_climate_ripen_malate_remaining"
    subject_id: "n_climate_ripen_malate_respiration"
    relation_type: "LEADS_TO"
    object_id: "n_climate_ripen_malate_remaining"
    domain_id: "viticulture"
    assertion_text: "With equal starting pools and matched replenishment and other losses, greater respiratory
      consumption leaves less malate per berry. This isolated balance does not predict wine pH."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T13:38:31.811Z"
  - id: "ki_climate_ripen_malate_contra_more"
    subject_id: "n_climate_ripen_malate_premise"
    relation_type: "CONTRADICTS"
    object_id: "n_climate_ripen_malate_wrong_more"
    domain_id: "viticulture"
    assertion_text: "Respiratory malate consumption draws down its substrate; with replenishment matched,
      increased consumption cannot produce a larger remaining malate pool."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T13:38:31.811Z"
  - id: "ki_climate_ripen_malate_contra_unchanged"
    subject_id: "n_climate_ripen_malate_premise"
    relation_type: "CONTRADICTS"
    object_id: "n_climate_ripen_malate_wrong_unchanged"
    domain_id: "viticulture"
    assertion_text: "The controlled balance excludes compensating malate inputs or losses: extra respiratory use
      changes the remaining pool, contradicting an unchanged amount."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T13:38:31.811Z"
  - id: "ki_climate_ripen_malate_contra_tartrate"
    subject_id: "n_climate_ripen_malate_premise"
    relation_type: "CONTRADICTS"
    object_id: "n_climate_ripen_malate_wrong_tartrate"
    domain_id: "viticulture"
    assertion_text: "Malate respiration does not require tartrate depletion. In the controlled microvine study,
      tartrate per berry was unaffected by the temperature treatment."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T13:38:31.811Z"
  - id: "ki_climate_ripen_botrytis_conditions"
    subject_id: "n_climate_ripen_botrytis_premise"
    relation_type: "CAUSES_STATE"
    object_id: "n_climate_ripen_botrytis_conditions"
    domain_id: "viticulture"
    assertion_text: "At the supplied suitable temperature, sustained free surface water provides a more
      conducive germination and infection opportunity than rapid drying; humidity alone is not substituted
      for wetness."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T13:38:31.811Z"
  - id: "ki_climate_ripen_botrytis_risk"
    subject_id: "n_climate_ripen_botrytis_conditions"
    relation_type: "LEADS_TO"
    object_id: "n_climate_ripen_botrytis_risk"
    domain_id: "viticulture"
    assertion_text: "With susceptible mature grapes and viable conidia supplied, the more conducive wet-surface
      opportunity increases infection risk. It does not establish disease in every berry."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T13:38:31.811Z"
  - id: "ki_climate_ripen_botrytis_contra_less"
    subject_id: "n_climate_ripen_botrytis_premise"
    relation_type: "CONTRADICTS"
    object_id: "n_climate_ripen_botrytis_wrong_less"
    domain_id: "viticulture"
    assertion_text: "Controlled inoculated mature-berry experiments found greater infection with longer
      conducive wetness. Matched host and inoculum conditions contradict reduced risk through that same
      wetness mechanism."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T13:38:31.811Z"
  - id: "ki_climate_ripen_botrytis_contra_blocked"
    subject_id: "n_climate_ripen_botrytis_premise"
    relation_type: "CONTRADICTS"
    object_id: "n_climate_ripen_botrytis_wrong_blocked"
    domain_id: "viticulture"
    assertion_text: "Grape-derived conidia germinated with free water at suitable temperatures in the laboratory
      study; sustained free water is not itself a germination block under the supplied conditions."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T13:38:31.811Z"
  - id: "ki_climate_ripen_botrytis_contra_guaranteed"
    subject_id: "n_climate_ripen_botrytis_premise"
    relation_type: "CONTRADICTS"
    object_id: "n_climate_ripen_botrytis_wrong_guaranteed"
    domain_id: "viticulture"
    assertion_text: "Infection varied among temperature/wetness combinations and did not reach every inoculated
      berry even under a favorable long-wet treatment. Conducive weather does not guarantee universal
      disease."
    verification_status: "unverified"
    mcq_disabled: true
    last_verified_at: "2026-09-27T13:38:31.811Z"
