knowledge_items:
  - id: ki_win_machine_contact
    subject_id: n_win_principle_machine_contact
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_machine_contact
    domain_id: winemaking
    assertion_text: Broken berries can expose juice to skins before winery intake; cool handling and prompt
      processing help control the resulting extraction. This does not make machine harvesting inherently
      unsuitable.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_gentle_press
    subject_id: n_win_principle_gentle_press
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_gentle_press
    domain_id: winemaking
    assertion_text: Gentle handling and prompt pressing can limit phenolic extraction for a delicate white style;
      longer contact may be chosen for other styles.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_rot_sort
    subject_id: n_win_principle_rot_sort
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_rot_sort
    domain_id: winemaking
    assertion_text: Where damaging Botrytis bunch rot is present, selective picking or sorting limits
      mould-affected material entering the winery. This is distinct from intentionally using suitable
      noble-rot fruit.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_laccase
    subject_id: n_win_principle_laccase
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_laccase
    domain_id: winemaking
    assertion_text: Botrytis can supply laccase that promotes oxidation in the presence of oxygen. Sulfur dioxide
      can support protection but does not inactivate this enzyme.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_press_fractions
    subject_id: n_win_principle_press_fractions
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_press_fractions
    domain_id: winemaking
    assertion_text: Processing free-run and press fractions separately allows the winemaker to assess and manage
      different phenolic characters before blending for the intended white-wine style.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_skin_flavour
    subject_id: n_win_principle_skin_flavour
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_skin_flavour
    domain_id: winemaking
    assertion_text: Contact between juice and white-grape skins can increase flavour and texture through
      extraction; excessive contact can also bring astringency or herbaceous character.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_warm_skin
    subject_id: n_win_principle_warm_skin
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_warm_skin
    domain_id: winemaking
    assertion_text: Warmer pre-fermentation skin contact can increase phenolic extraction and astringency; the
      outcome also depends on contact time, fruit condition and handling.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_amber_style
    subject_id: n_win_principle_amber_style
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_amber_style
    domain_id: winemaking
    assertion_text: An amber or orange style can be made by fermenting white grapes with their skins. Skin contact
      changes texture and flavour; the style is not defined by oxidising the wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_cap_contact
    subject_id: n_win_principle_cap_contact
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_cap_contact
    domain_id: winemaking
    assertion_text: The extent and duration of contact between fermenting red must and the cap influence the
      extraction of colour and tannin. More intensive treatment is not automatically preferable.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_colour_tannin
    subject_id: n_win_principle_colour_tannin
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_colour_tannin
    domain_id: winemaking
    assertion_text: In studied red fermentations, maximum colour extraction occurs before maximum tannin
      extraction. Extending contact to extract tannin does not necessarily keep increasing colour.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_alcoholic_products
    subject_id: n_win_principle_alcoholic_products
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_alcoholic_products
    domain_id: winemaking
    assertion_text: Wine yeast converts fermentable grape sugars principally into ethanol and carbon dioxide.
      Other metabolic products contribute to wine composition and aroma.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_grape_sugars
    subject_id: n_win_principle_grape_sugars
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_grape_sugars
    domain_id: winemaking
    assertion_text: Glucose and fructose are the principal grape-juice sugars used by Saccharomyces during wine
      fermentation; successful completion depends on a healthy yeast population.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_yeast_health
    subject_id: n_win_principle_yeast_health
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_yeast_health
    domain_id: winemaking
    assertion_text: A sufficient population of metabolically healthy yeast is needed to consume fermentable
      sugars. Inoculation alone does not guarantee completion under unsuitable conditions.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_yan_risk
    subject_id: n_win_principle_yan_risk
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_yan_risk
    domain_id: winemaking
    assertion_text: High sugar increases the fermentation workload while low yeast-assimilable nitrogen can limit
      yeast performance. Low nutrients and increasing alcohol are common causes of sluggish or stuck
      fermentation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_yan_measure
    subject_id: n_win_principle_yan_measure
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_yan_measure
    domain_id: winemaking
    assertion_text: Measuring YAN before fermentation helps tailor nutrient additions to the must and yeast strain
      instead of assuming that every juice has the same requirement.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_dap_scope
    subject_id: n_win_principle_dap_scope
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_dap_scope
    domain_id: winemaking
    assertion_text: Diammonium phosphate supplies available nitrogen but does not supply the vitamins and other
      micronutrients that a yeast culture may also need.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_late_nutrients
    subject_id: n_win_principle_late_nutrients
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_late_nutrients
    domain_id: winemaking
    assertion_text: Rising ethanol can hinder amino-acid uptake late in fermentation. A late nutrient addition is
      not a dependable substitute for diagnosing and preventing the underlying problem.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_white_cooling
    subject_id: n_win_principle_white_cooling
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_white_cooling
    domain_id: winemaking
    assertion_text: Cooler fermentation can help preserve delicate white-wine aroma character. The temperature
      still has to suit the yeast and allow reliable fermentation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_red_heat
    subject_id: n_win_principle_red_heat
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_red_heat
    domain_id: winemaking
    assertion_text: Warmer red fermentation can accelerate fermentation, generating further heat. Limited cooling
      capacity can allow the temperature to run away.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_yeast_heat
    subject_id: n_win_principle_yeast_heat
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_yeast_heat
    domain_id: winemaking
    assertion_text: Extreme fermentation temperatures can harm yeast health and increase stuck-fermentation risk.
      Temperature management must balance extraction goals with yeast viability.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_oxygen_active
    subject_id: n_win_principle_oxygen_active
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_oxygen_active
    domain_id: winemaking
    assertion_text: At a suitable stage of active fermentation, oxygen can help yeast synthesise sterols and
      unsaturated fatty acids needed for ethanol-tolerant membranes. Timing matters because other microbes and
      wine components also use oxygen.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_oxygen_stage
    subject_id: n_win_principle_oxygen_stage
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_oxygen_stage
    domain_id: winemaking
    assertion_text: Oxygen can support yeast during active fermentation and can promote chosen maturation
      reactions; unwanted exposure can also cause browning, aldehydic character or microbial growth. Its
      effect depends on wine and stage.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_sulfur_forms
    subject_id: n_win_principle_sulfur_forms
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_sulfur_forms
    domain_id: winemaking
    assertion_text: "Total sulfur dioxide alone does not describe protection: the free and bound fractions differ,
      and the useful concentration must be interpreted with the wine’s pH and condition."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_sulfur_ph
    subject_id: n_win_principle_sulfur_ph
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_sulfur_ph
    domain_id: winemaking
    assertion_text: At the same free sulfur dioxide concentration, a higher wine pH reduces the molecular fraction
      associated with antimicrobial protection. A single free-SO2 target does not suit all wines.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_mlf_conversion
    subject_id: n_win_principle_mlf_conversion
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_mlf_conversion
    domain_id: winemaking
    assertion_text: Lactic acid bacteria convert L-malic acid into L-lactic acid during MLF, reducing acidity.
      This is a different process from yeast converting sugars into alcohol.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_mlf_organism
    subject_id: n_win_principle_mlf_organism
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_mlf_organism
    domain_id: winemaking
    assertion_text: Oenococcus oeni is the principal bacterium used to conduct wine MLF. Other suitable bacterial
      species or strains can also carry out the conversion.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_mlf_butter
    subject_id: n_win_principle_mlf_butter
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_mlf_butter
    domain_id: winemaking
    assertion_text: Diacetyl formed through bacterial citric-acid metabolism can contribute buttery aroma. Its
      concentration and sensory impact depend on strain, timing, lees contact and the wine matrix; MLF is not
      invariably buttery.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_mlf_inhibitors
    subject_id: n_win_principle_mlf_inhibitors
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_mlf_inhibitors
    domain_id: winemaking
    assertion_text: Low pH, cool temperature, sulfur dioxide and alcohol can jointly inhibit malolactic bacteria.
      Choosing a strain requires assessing the combined conditions rather than one parameter alone.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_mlf_stability
    subject_id: n_win_principle_mlf_stability
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_mlf_stability
    domain_id: winemaking
    assertion_text: Removing malic acid through completed MLF removes a substrate that could otherwise support
      later bacterial activity. It does not replace broader hygiene and microbial stability controls.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_mlf_monitor
    subject_id: n_win_principle_mlf_monitor
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_mlf_monitor
    domain_id: winemaking
    assertion_text: MLF progress is monitored through declining malic acid and rising lactic acid using suitable
      analysis. The absence of visible bubbling does not establish completion.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_oak_flavours
    subject_id: n_win_principle_oak_flavours
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_oak_flavours
    domain_id: winemaking
    assertion_text: Oak can supply aroma compounds associated with vanilla, coconut, spice or toast and
      hydrolysable tannins. The sensory result depends on the wood and treatment.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_oak_variables
    subject_id: n_win_principle_oak_variables
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_oak_variables
    domain_id: winemaking
    assertion_text: Wood species, toast, vessel size, barrel age and cooperage affect oak influence. Geographic
      origin alone is insufficient to predict the finished wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_oak_reuse
    subject_id: n_win_principle_oak_reuse
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_oak_reuse
    domain_id: winemaking
    assertion_text: Repeated barrel use reduces the distinction in extractable oak character compared with new
      wood. Used barrels can still influence maturation and require care.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_lees_release
    subject_id: n_win_principle_lees_release
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_lees_release
    domain_id: winemaking
    assertion_text: During lees contact, yeast-derived compounds including polysaccharides and mannoproteins can
      alter texture and flavour integration. Results depend on management and time.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_lees_stirring
    subject_id: n_win_principle_lees_stirring
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_lees_stirring
    domain_id: winemaking
    assertion_text: Lees management can risk unwanted sulfur characters when oxygen is insufficient, while
      excessive oxygen during stirring can favour acetaldehyde and acetic acid formation. More stirring is not
      always better.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_fining_mechanism
    subject_id: n_win_principle_fining_mechanism
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_fining_mechanism
    domain_id: winemaking
    assertion_text: A fining agent reacts with target components to create material that can separate from the
      wine. Depending on the agent, treatment can reduce astringency, colour or haze-forming proteins.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_bentonite
    subject_id: n_win_principle_bentonite
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_bentonite
    domain_id: winemaking
    assertion_text: Negatively charged bentonite binds susceptible proteins, helping remove material that could
      form a later haze. The effective addition depends on the particular wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_fining_trials
    subject_id: n_win_principle_fining_trials
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_fining_trials
    domain_id: winemaking
    assertion_text: Laboratory trials against an untreated control help choose a fining treatment that achieves
      the target while assessing unwanted flavour or colour loss.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_filter_ratings
    subject_id: n_win_principle_filter_ratings
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_filter_ratings
    domain_id: winemaking
    assertion_text: A nominal pore-size rating allows wider tolerance and is not equivalent to an absolute
      membrane intended for microbial removal. Filter choice and integrity testing matter.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_packaging_hygiene
    subject_id: n_win_principle_packaging_hygiene
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_packaging_hygiene
    domain_id: winemaking
    assertion_text: Effective microbial filtration does not protect against contamination farther down an
      inadequately cleaned bottling line. Filtration and packaging hygiene must be assessed together.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_tartrate_cooling
    subject_id: n_win_principle_tartrate_cooling
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_tartrate_cooling
    domain_id: winemaking
    assertion_text: Lower temperature reduces potassium bitartrate solubility and can promote crystallisation
      before bottling; seeding can assist. This addresses tartrate stability rather than microbial or protein
      stability.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_stability_retest
    subject_id: n_win_principle_stability_retest
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_win_point_stability_retest
    domain_id: winemaking
    assertion_text: Changes in composition or pH through blending or MLF can change tartrate stability. A result
      from an earlier component does not establish stability of the final blend.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_case_fresh_white_action
    subject_id: n_win_case_fresh_white
    relation_type: CASE_ACTION
    object_id: n_win_point_case_fresh_white_action
    domain_id: winemaking
    assertion_text: For this target style, shorten and cool pre-fermentation skin contact and handle the fruit
      gently; rapid pressing is one defensible option.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_case_fresh_white_reason
    subject_id: n_win_case_fresh_white
    relation_type: CASE_REASON
    object_id: n_win_point_case_fresh_white_reason
    domain_id: winemaking
    assertion_text: The trial’s astringency is consistent with excessive phenolic extraction; limiting contact and
      temperature can reduce that extraction.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_case_fresh_white_tradeoff
    subject_id: n_win_case_fresh_white
    relation_type: CASE_TRADEOFF
    object_id: n_win_point_case_fresh_white_tradeoff
    domain_id: winemaking
    assertion_text: Reducing contact can also reduce desired skin-derived flavour or texture. The choice follows
      the specified delicate style rather than a universal quality rule.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_case_fresh_white_limitation
    subject_id: n_win_case_fresh_white
    relation_type: CASE_LIMITATION
    object_id: n_win_point_case_fresh_white_limitation
    domain_id: winemaking
    assertion_text: The response depends on fruit ripeness, condition and handling; assess batches and press
      fractions before committing to a final blend.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_case_hot_red_action
    subject_id: n_win_case_hot_red
    relation_type: CASE_ACTION
    object_id: n_win_point_case_hot_red_action
    domain_id: winemaking
    assertion_text: Use available heat-exchange cooling of the fermenting liquid and distribute it appropriately;
      monitor the trajectory rather than seeking maximum fermentation temperature.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_case_hot_red_reason
    subject_id: n_win_case_hot_red
    relation_type: CASE_REASON
    object_id: n_win_point_case_hot_red_reason
    domain_id: winemaking
    assertion_text: A warmer ferment can accelerate its own heat production; controlling temperature also reduces
      the risk of heat-related yeast injury.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_case_hot_red_tradeoff
    subject_id: n_win_case_hot_red
    relation_type: CASE_TRADEOFF
    object_id: n_win_point_case_hot_red_tradeoff
    domain_id: winemaking
    assertion_text: Reducing temperature can change colour and tannin extraction rates and slow fermentation. The
      intended moderate-tannin style helps justify that choice.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_case_hot_red_limitation
    subject_id: n_win_case_hot_red
    relation_type: CASE_LIMITATION
    object_id: n_win_point_case_hot_red_limitation
    domain_id: winemaking
    assertion_text: Must temperature can matter more than cap temperature for phenolic extraction, and
      insufficient cooling capacity still constrains control. Avoid repeated large temperature swings.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_case_low_yan_action
    subject_id: n_win_case_low_yan
    relation_type: CASE_ACTION
    object_id: n_win_point_case_low_yan_action
    domain_id: winemaking
    assertion_text: Use the YAN result, sugar concentration and yeast requirements to plan appropriate early
      nutrient additions instead of one unmeasured dose.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_case_low_yan_reason
    subject_id: n_win_case_low_yan
    relation_type: CASE_REASON
    object_id: n_win_point_case_low_yan_reason
    domain_id: winemaking
    assertion_text: A high sugar workload combined with low nutrients can contribute to a sluggish or stuck
      fermentation as alcohol accumulates.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_case_low_yan_tradeoff
    subject_id: n_win_case_low_yan
    relation_type: CASE_TRADEOFF
    object_id: n_win_point_case_low_yan_tradeoff
    domain_id: winemaking
    assertion_text: Excessive nutrient addition can cause overly vigorous fermentation, change aroma and leave
      nutrients available to unwanted microbes.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_case_low_yan_limitation
    subject_id: n_win_case_low_yan
    relation_type: CASE_LIMITATION
    object_id: n_win_point_case_low_yan_limitation
    domain_id: winemaking
    assertion_text: DAP does not supply micronutrients; the plan may need broader nutrition, and temperature,
      hydration or microbial problems can still cause failure.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_case_difficult_mlf_action
    subject_id: n_win_case_difficult_mlf
    relation_type: CASE_ACTION
    object_id: n_win_point_case_difficult_mlf_action
    domain_id: winemaking
    assertion_text: Measure the relevant wine conditions, select a compatible culture suited to them and use
      appropriate temperature or acclimatisation measures under the supplier’s guidance.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_case_difficult_mlf_reason
    subject_id: n_win_case_difficult_mlf
    relation_type: CASE_REASON
    object_id: n_win_point_case_difficult_mlf_reason
    domain_id: winemaking
    assertion_text: Low pH, cold conditions and sulfur dioxide can jointly inhibit bacteria. One favourable
      measurement cannot cancel all the other constraints.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_case_difficult_mlf_tradeoff
    subject_id: n_win_case_difficult_mlf
    relation_type: CASE_TRADEOFF
    object_id: n_win_point_case_difficult_mlf_tradeoff
    domain_id: winemaking
    assertion_text: Conditions made more permissive for MLF, especially a higher pH, can also favour spoilage
      organisms; the desired conversion must be balanced with microbial control.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_case_difficult_mlf_limitation
    subject_id: n_win_case_difficult_mlf
    relation_type: CASE_LIMITATION
    object_id: n_win_point_case_difficult_mlf_limitation
    domain_id: winemaking
    assertion_text: "A chosen culture or warmer cellar does not establish completion: follow malic-acid decline
      with analysis, while continuing to assess strain compatibility and wine conditions."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_case_protein_white_action
    subject_id: n_win_case_protein_white
    relation_type: CASE_ACTION
    object_id: n_win_point_case_protein_white_action
    domain_id: winemaking
    assertion_text: Run bentonite trials on the actual final blend and choose a treatment that passes the agreed
      protein-stability test. Assess an untreated control.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_case_protein_white_reason
    subject_id: n_win_case_protein_white
    relation_type: CASE_REASON
    object_id: n_win_point_case_protein_white_reason
    domain_id: winemaking
    assertion_text: Bentonite binds proteins that could later unfold and aggregate into haze; an apparently clear
      wine can still be protein unstable.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_case_protein_white_tradeoff
    subject_id: n_win_case_protein_white
    relation_type: CASE_TRADEOFF
    object_id: n_win_point_case_protein_white_tradeoff
    domain_id: winemaking
    assertion_text: Fining can create wine losses in sediment and may remove positive sensory components, so the
      appropriate effective treatment matters.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_case_protein_white_limitation
    subject_id: n_win_case_protein_white
    relation_type: CASE_LIMITATION
    object_id: n_win_point_case_protein_white_limitation
    domain_id: winemaking
    assertion_text: Subsequent blending, sweetening or protein-based fining can change stability; retest the final
      wine rather than assuming an earlier component result will persist.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_case_sweet_bottling_action
    subject_id: n_win_case_sweet_bottling
    relation_type: CASE_ACTION
    object_id: n_win_point_case_sweet_bottling_action
    domain_id: winemaking
    assertion_text: Use an appropriate absolute membrane with confirmed integrity and assess downstream cleaning
      and sanitation before packaging. Clear appearance or prior cross-flow treatment is insufficient.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_case_sweet_bottling_reason
    subject_id: n_win_case_sweet_bottling
    relation_type: CASE_REASON
    object_id: n_win_point_case_sweet_bottling_reason
    domain_id: winemaking
    assertion_text: Residual sugar can support post-bottling spoilage or renewed fermentation; organisms may also
      be introduced after the filter if the filling equipment is inadequately cleaned.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_case_sweet_bottling_tradeoff
    subject_id: n_win_case_sweet_bottling
    relation_type: CASE_TRADEOFF
    object_id: n_win_point_case_sweet_bottling_tradeoff
    domain_id: winemaking
    assertion_text: Even visually bright wine can foul a membrane, so checking filterability and choosing suitable
      preparation can affect practical throughput and filtration work.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
  - id: ki_win_case_sweet_bottling_limitation
    subject_id: n_win_case_sweet_bottling
    relation_type: CASE_LIMITATION
    object_id: n_win_point_case_sweet_bottling_limitation
    domain_id: winemaking
    assertion_text: "Microbial filtration is one control, not a guarantee of a sterile bottle: downstream
      contamination and the wine’s other stability risks still require assessment."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:42:55.000Z
