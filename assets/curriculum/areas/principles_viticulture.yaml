knowledge_items:
  - id: ki_vit_current_shoots
    subject_id: n_vit_principle_shoot_origin
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_current_shoots
    domain_id: viticulture
    assertion_text: Grapevine bunches are borne on new shoots that emerge from buds on the previous season’s wood.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_two_seasons
    subject_id: n_vit_principle_shoot_origin
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_two_seasons
    domain_id: viticulture
    assertion_text: "The reproductive cycle spans two seasons: potential flower clusters develop in buds
      before those buds grow into fruit-bearing shoots the following year."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_spring_reserves
    subject_id: n_vit_principle_reserve_cycle
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_spring_reserves
    domain_id: viticulture
    assertion_text: Early spring root and shoot growth draws on carbohydrates stored in the vine’s
      perennial roots and wood before the new canopy meets its demand.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_postharvest_reserves
    subject_id: n_vit_principle_reserve_cycle
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_postharvest_reserves
    domain_id: viticulture
    assertion_text: When leaves remain active after picking, continued photosynthesis helps replenish
      carbohydrate reserves used for growth the following season.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_photosynthesis
    subject_id: n_vit_principle_light_capture
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_photosynthesis
    domain_id: viticulture
    assertion_text: Light-exposed grapevine leaves produce carbohydrates through photosynthesis to
      support vegetative growth, fruit and reserves.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_interior_shade
    subject_id: n_vit_principle_light_capture
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_interior_shade
    domain_id: viticulture
    assertion_text: In a dense vine canopy, outer leaves intercept light and deeply shaded inner leaves
      contribute less carbohydrate production. More leaf area alone does not guarantee more useful
      photosynthesis.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_flower_set
    subject_id: n_vit_principle_flowering
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_flower_set
    domain_id: viticulture
    assertion_text: Fruit set follows flowering when successfully fertilized grape flowers develop into
      berries; flower number alone does not determine the final crop.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_flowering_water
    subject_id: n_vit_principle_flowering
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_flowering_water
    domain_id: viticulture
    assertion_text: Insufficient water during flowering and fruit set can lower the number of berries
      per bunch and reduce yield; a deficit intended for later growth should not be assumed harmless
      at flowering.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_softening
    subject_id: n_vit_principle_veraison
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_softening
    domain_id: viticulture
    assertion_text: Veraison marks the onset of ripening, including berry softening and changes in
      colour; the colour response depends on whether the cultivar has coloured skins.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_ripening_chemistry
    subject_id: n_vit_principle_veraison
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_ripening_chemistry
    domain_id: viticulture
    assertion_text: During grape ripening, sugars generally accumulate while acidity declines. The
      changing balance must be evaluated for the intended wine style rather than a universal harvest
      date.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_phylloxera_roots
    subject_id: n_vit_principle_rootstock_choice
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_phylloxera_roots
    domain_id: viticulture
    assertion_text: Grafting susceptible Vitis vinifera scions to suitably phylloxera-resistant
      rootstocks protects the roots; resistance does not mean all rootstocks are equally suitable at
      every site.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_nematode_species
    subject_id: n_vit_principle_rootstock_choice
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_nematode_species
    domain_id: viticulture
    assertion_text: Rootstocks differ in resistance to different plant-parasitic nematodes. Identify the
      local nematode problem and evaluate the relevant resistance rather than treating nematode
      resistance as universal.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_plant_soil
    subject_id: n_vit_principle_water_measurement
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_plant_soil
    domain_id: viticulture
    assertion_text: Vine water measurements and soil moisture monitoring complement one another when
      deciding irrigation; soil water readings alone may not describe the water stress experienced
      by the vine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_pressure_chamber
    subject_id: n_vit_principle_water_measurement
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_pressure_chamber
    domain_id: viticulture
    assertion_text: A pressure chamber measures leaf or stem water potential, providing a plant-based
      measurement of water status; readings need a consistent sampling method and timing.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_stress_photo
    subject_id: n_vit_principle_water_deficit
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_stress_photo
    domain_id: viticulture
    assertion_text: Severe or prolonged water stress can reduce grapevine photosynthesis, impair sugar
      and colour development, and reduce carbohydrate storage. Stress does not automatically improve
      wine quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_ripening_canopy
    subject_id: n_vit_principle_water_deficit
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_ripening_canopy
    domain_id: viticulture
    assertion_text: From veraison to harvest, water management should preserve healthy functioning
      leaves for ripening while avoiding unnecessary stimulation of excessive lateral growth.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_rdi_window
    subject_id: n_vit_principle_rdi_timing
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_rdi_window
    domain_id: viticulture
    assertion_text: One use of regulated deficit irrigation is a controlled deficit between fruit set
      and veraison to restrict excessive shoot growth and, in some circumstances, berry size.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_rdi_soil
    subject_id: n_vit_principle_rdi_timing
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_rdi_soil
    domain_id: viticulture
    assertion_text: Regulated deficit irrigation requires the root zone to dry at the intended stage and
      rewet sufficiently when irrigation resumes; persistent rain or slowly drying and rewetting
      soils can limit control.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_airflow
    subject_id: n_vit_principle_fruit_zone
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_airflow
    domain_id: viticulture
    assertion_text: In a humid vineyard with dense fruit-zone foliage, selective opening can improve
      airflow, drying and spray penetration, making the microclimate less favourable to bunch rot.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_exposure_limit
    subject_id: n_vit_principle_fruit_zone
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_exposure_limit
    domain_id: viticulture
    assertion_text: The appropriate amount of fruit-zone leaf removal depends on cultivar, weather,
      training and exposure. Hot afternoon-facing fruit may need retained shade to reduce sunburn.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_prebloom_set
    subject_id: n_vit_principle_leaf_timing
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_prebloom_set
    domain_id: viticulture
    assertion_text: Removing substantial leaf area before or during bloom can reduce carbohydrate supply
      to flowers, lowering fruit set and bunch weight; this can be useful for compact bunches but
      unacceptable when yield loss cannot be tolerated.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_late_leaf_burn
    subject_id: n_vit_principle_leaf_timing
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_late_leaf_burn
    domain_id: viticulture
    assertion_text: Berries that developed in shade may suffer sunburn if the fruit zone is heavily
      defoliated late in summer. Early acclimation and moderate removal reduce this particular risk.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_cold_air
    subject_id: n_vit_principle_site_drainage
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_cold_air
    domain_id: viticulture
    assertion_text: On radiation-frost nights, cold air can collect in low areas. Site selection should
      allow cold-air drainage and avoid obstructions that trap it around vines.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_saturated_soil
    subject_id: n_vit_principle_site_drainage
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_saturated_soil
    domain_id: viticulture
    assertion_text: Frequently saturated and poorly draining soils favour Phytophthora activity and
      grapevine root infection. Good site drainage addresses a different problem from simply
      supplying enough irrigation water.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_radiation_inversion
    subject_id: n_vit_principle_frost_types
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_radiation_inversion
    domain_id: viticulture
    assertion_text: During a radiation frost, the vineyard can have colder air near the ground with
      warmer air above. Wind machines use this inversion by mixing warmer air down toward vines.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_advective_limit
    subject_id: n_vit_principle_frost_types
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_advective_limit
    domain_id: viticulture
    assertion_text: Wind machines are suited to radiation frost with a usable inversion; a windy
      advective freeze without warmer air above is not the same protection problem.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_freezing_heat
    subject_id: n_vit_principle_sprinkler_frost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_freezing_heat
    domain_id: viticulture
    assertion_text: Properly designed overhead frost sprinkling protects tissue through the heat
      released as continuously applied water freezes; a static layer of ice is not a substitute for
      continued water supply.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_continuous_water
    subject_id: n_vit_principle_sprinkler_frost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_continuous_water
    domain_id: viticulture
    assertion_text: Overhead frost protection requires sufficient water, uniform coverage and reliable
      continuous operation through the protection period. Inadequate supply or a poorly suited windy
      event can make the technique ineffective.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_powdery_inoculum
    subject_id: n_vit_principle_powdery_risk
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_powdery_inoculum
    domain_id: viticulture
    assertion_text: Grape powdery mildew can overwinter in buds or fruiting bodies, and early infections
      supply spores for later spread. Reducing early inoculum is part of season-long management.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_powdery_resistance
    subject_id: n_vit_principle_powdery_risk
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_powdery_resistance
    domain_id: viticulture
    assertion_text: Repeated use of the same fungicide mode of action can select less sensitive powdery
      mildew populations. Resistance management rotates effective modes of action rather than merely
      changing brand names.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_downy_moisture
    subject_id: n_vit_principle_downy_risk
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_downy_moisture
    domain_id: viticulture
    assertion_text: Rain, wet plant surfaces and humid conditions favour downy mildew development and
      spread; irrigation practices that repeatedly wet the canopy can contribute to risk.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_downy_preventive
    subject_id: n_vit_principle_downy_risk
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_downy_preventive
    domain_id: viticulture
    assertion_text: Preventive downy mildew treatments protect covered tissues before an infection
      period. New growth appearing after application is not automatically protected by the earlier
      coverage.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_botrytis_wet
    subject_id: n_vit_principle_botrytis_risk
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_botrytis_wet
    domain_id: viticulture
    assertion_text: Wet conditions and dense damp canopy areas favour Botrytis infection and bunch rot.
      Opening the fruit zone and avoiding unnecessary wetting can reduce risk.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_botrytis_injury
    subject_id: n_vit_principle_botrytis_risk
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_botrytis_injury
    domain_id: viticulture
    assertion_text: Bird, insect or mechanical damage can create entry points for Botrytis and other
      decay organisms; protecting berry integrity is part of bunch-rot prevention.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_overcrop
    subject_id: n_vit_principle_crop_balance
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_overcrop
    domain_id: viticulture
    assertion_text: A crop too large for a vine’s effective canopy and available resources can strain
      fruit ripening and reserve replenishment. Suitable crop load depends on vine size and
      conditions.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_not_min_yield
    subject_id: n_vit_principle_crop_balance
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_not_min_yield
    domain_id: viticulture
    assertion_text: Vine balance aims to sustain canopy, crop and fruit quality. Crop removal should
      respond to vine capacity and production goals rather than an assumption that the smallest
      yield is always best.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_multiple_measures
    subject_id: n_vit_principle_harvest_maturity
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_multiple_measures
    domain_id: viticulture
    assertion_text: A harvest decision uses trends in soluble solids, pH and titratable acidity
      alongside sensory assessment and the intended wine style. A single Brix reading cannot
      establish complete maturity.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_representative_samples
    subject_id: n_vit_principle_harvest_maturity
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_representative_samples
    domain_id: viticulture
    assertion_text: Maturity samples should represent the vineyard’s variation rather than only
      attractive or exposed berries; repeating comparable sampling reveals ripening trends more
      reliably.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_style_gain
    subject_id: n_vit_principle_harvest_delay
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_style_gain
    domain_id: viticulture
    assertion_text: Leaving grapes on the vine can allow additional flavour, aroma or colour development
      for a desired style; that benefit has to be judged against crop condition and weather.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_delay_risk
    subject_id: n_vit_principle_harvest_delay
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_vit_point_delay_risk
    domain_id: viticulture
    assertion_text: Extending hang time exposes fruit to disease, weather and predators and can cause
      shrivel and less balanced sugar–acid chemistry. Higher sugar alone does not establish a net
      quality gain.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_case_humid_canopy_action
    subject_id: n_vit_case_humid_canopy
    relation_type: CASE_ACTION
    object_id: n_vit_point_case_humid_canopy_action
    domain_id: viticulture
    assertion_text: Selective removal around bunches after fruit set is a defensible way to open this
      dense fruit zone while retaining enough canopy to support the crop.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_case_humid_canopy_reason
    subject_id: n_vit_case_humid_canopy
    relation_type: CASE_REASON
    object_id: n_vit_point_case_humid_canopy_reason
    domain_id: viticulture
    assertion_text: Opening this humid fruit zone improves airflow, drying and spray penetration,
      reducing conditions favourable to bunch rot.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_case_humid_canopy_tradeoff
    subject_id: n_vit_case_humid_canopy
    relation_type: CASE_TRADEOFF
    object_id: n_vit_point_case_humid_canopy_tradeoff
    domain_id: viticulture
    assertion_text: Increasing cluster exposure can also increase heat and sunburn risk; retain more
      shade where the fruit faces hot afternoon sun.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_case_humid_canopy_limitation
    subject_id: n_vit_case_humid_canopy
    relation_type: CASE_LIMITATION
    object_id: n_vit_point_case_humid_canopy_limitation
    domain_id: viticulture
    assertion_text: The appropriate extent of removal depends on cultivar, training system, timing,
      climate and current disease pressure; the scenario does not justify stripping every leaf from
      every vine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_case_late_deficit_action
    subject_id: n_vit_case_late_deficit
    relation_type: CASE_ACTION
    object_id: n_vit_point_case_late_deficit_action
    domain_id: viticulture
    assertion_text: Restore sufficient water to sustain leaf function rather than deliberately
      prolonging severe stress, with the amount guided by measured vine and soil conditions.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_case_late_deficit_reason
    subject_id: n_vit_case_late_deficit
    relation_type: CASE_REASON
    object_id: n_vit_point_case_late_deficit_reason
    domain_id: viticulture
    assertion_text: Severe stress reduces photosynthesis and can impair fruit sugar development and
      carbohydrate storage, so keeping the canopy functional supports ripening.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_case_late_deficit_tradeoff
    subject_id: n_vit_case_late_deficit
    relation_type: CASE_TRADEOFF
    object_id: n_vit_point_case_late_deficit_tradeoff
    domain_id: viticulture
    assertion_text: Relieving stress must be balanced against excessive water that stimulates unwanted
      lateral growth; the aim is a functioning canopy without uncontrolled vegetative growth.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_case_late_deficit_limitation
    subject_id: n_vit_case_late_deficit
    relation_type: CASE_LIMITATION
    object_id: n_vit_point_case_late_deficit_limitation
    domain_id: viticulture
    assertion_text: Irrigation decisions need plant-based water status together with soil moisture,
      rooting conditions and the developmental stage; symptoms alone do not determine a universal
      water dose.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_case_radiation_frost_action
    subject_id: n_vit_case_radiation_frost
    relation_type: CASE_ACTION
    object_id: n_vit_point_case_radiation_frost_action
    domain_id: viticulture
    assertion_text: A correctly positioned wind machine is a defensible active protection option when a
      usable temperature inversion is measured during a radiation frost.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_case_radiation_frost_reason
    subject_id: n_vit_case_radiation_frost
    relation_type: CASE_REASON
    object_id: n_vit_point_case_radiation_frost_reason
    domain_id: viticulture
    assertion_text: The wind machine draws warmer air from above the inversion toward the colder vine
      zone, raising the temperature there if sufficient warmer air is available.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_case_radiation_frost_tradeoff
    subject_id: n_vit_case_radiation_frost
    relation_type: CASE_TRADEOFF
    object_id: n_vit_point_case_radiation_frost_tradeoff
    domain_id: viticulture
    assertion_text: Wind machines entail operating costs and noise, so protection planning includes
      economic and neighbouring-site considerations as well as crop risk.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_case_radiation_frost_limitation
    subject_id: n_vit_case_radiation_frost
    relation_type: CASE_LIMITATION
    object_id: n_vit_point_case_radiation_frost_limitation
    domain_id: viticulture
    assertion_text: The mechanism relies on accessible warmer air in an inversion. A windy advective
      freeze without that warmer layer is not a situation in which the same result should be
      assumed.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_case_rootstock_replant_action
    subject_id: n_vit_case_rootstock_replant
    relation_type: CASE_ACTION
    object_id: n_vit_point_case_rootstock_replant_action
    domain_id: viticulture
    assertion_text: Replant with clean material grafted to a suitably phylloxera-resistant rootstock,
      and evaluate the other site constraints before selecting the particular stock.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_case_rootstock_replant_reason
    subject_id: n_vit_case_rootstock_replant
    relation_type: CASE_REASON
    object_id: n_vit_point_case_rootstock_replant_reason
    domain_id: viticulture
    assertion_text: Phylloxera feeding damages susceptible roots and can stunt or kill vines; resistant
      root systems address the injury mechanism rather than relying on eradication by pesticide.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_case_rootstock_replant_tradeoff
    subject_id: n_vit_case_rootstock_replant
    relation_type: CASE_TRADEOFF
    object_id: n_vit_point_case_rootstock_replant_tradeoff
    domain_id: viticulture
    assertion_text: Rootstock choice influences vine vigour and therefore canopy and crop capacity;
      resistance must be considered alongside the intended vine balance and site resources.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_case_rootstock_replant_limitation
    subject_id: n_vit_case_rootstock_replant
    relation_type: CASE_LIMITATION
    object_id: n_vit_point_case_rootstock_replant_limitation
    domain_id: viticulture
    assertion_text: The tested nematode species and the stock’s resistance to each matter; a stock
      resistant to phylloxera is not automatically resistant to every local nematode.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_case_rain_harvest_action
    subject_id: n_vit_case_rain_harvest
    relation_type: CASE_ACTION
    object_id: n_vit_point_case_rain_harvest_action
    domain_id: viticulture
    assertion_text: For fruit already close to the intended maturity, bringing forward harvest of the
      vulnerable block is defensible when wet weather raises the risk of bunch rot.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_case_rain_harvest_reason
    subject_id: n_vit_case_rain_harvest
    relation_type: CASE_REASON
    object_id: n_vit_point_case_rain_harvest_reason
    domain_id: viticulture
    assertion_text: Wet conditions promote Botrytis, and injured berries create entry routes for decay
      organisms; waiting through prolonged rain may increase crop deterioration.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_case_rain_harvest_tradeoff
    subject_id: n_vit_case_rain_harvest
    relation_type: CASE_TRADEOFF
    object_id: n_vit_point_case_rain_harvest_tradeoff
    domain_id: viticulture
    assertion_text: Picking earlier can sacrifice possible additional flavour, aroma or colour
      development. The benefit of more hang time must be weighed against weather-related crop loss.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
  - id: ki_vit_case_rain_harvest_limitation
    subject_id: n_vit_case_rain_harvest
    relation_type: CASE_LIMITATION
    object_id: n_vit_point_case_rain_harvest_limitation
    domain_id: viticulture
    assertion_text: Recheck representative samples and the trends in soluble solids, pH, titratable
      acidity and sensory maturity for the planned style; acceptable sugar alone does not establish
      the harvest decision.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-26T22:45:00.000Z
