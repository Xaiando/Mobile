knowledge_items:
  - {"id":"ki_cms_calc_full_pours","subject_id":"n_cms_calc_full_pours","relation_type":"CALCULATED_VALUE","object_id":"n_qty_cms_calc_full_pours","domain_id":"business","assertion_text":"7 complete pours use 700 mL; 50 mL remains. Floor(750 / 100) = 7. This given serving size is an exercise assumption, not a standard or legal measure.","verification_status":"unverified","mcq_disabled":true,"last_verified_at":"2026-09-30T01:25:00.000Z"}
  - {"id":"ki_cms_calc_event_bottles","subject_id":"n_cms_calc_event_bottles","relation_type":"CALCULATED_VALUE","object_id":"n_qty_cms_calc_event_bottles","domain_id":"business","assertion_text":"40 x 2 x 125 = 10,000 mL. 10,000 / 750 = 13 1/3 bottles, so round up to 14 whole bottles. This is a stated planning scenario, not a consumption recommendation.","verification_status":"unverified","mcq_disabled":true,"last_verified_at":"2026-09-30T01:25:00.000Z"}
  - {"id":"ki_cms_calc_gross_profit","subject_id":"n_cms_calc_gross_profit","relation_type":"CALCULATED_VALUE","object_id":"n_qty_cms_calc_gross_profit","domain_id":"business","assertion_text":"Gross profit = net sales - cost of goods sold = 30 - 12 = EUR 18. It is not net profit; overheads and tax are excluded from these exercise inputs.","verification_status":"unverified","mcq_disabled":true,"last_verified_at":"2026-09-30T01:25:00.000Z"}
  - {"id":"ki_cms_calc_gross_margin","subject_id":"n_cms_calc_gross_margin","relation_type":"CALCULATED_VALUE","object_id":"n_qty_cms_calc_gross_margin","domain_id":"business","assertion_text":"Gross profit is EUR 18. Gross margin = 18 / 30 x 100 = 60%. The denominator is net sales, not cost; markup would instead be 150%.","verification_status":"unverified","mcq_disabled":true,"last_verified_at":"2026-09-30T01:25:00.000Z"}
  - {"id":"ki_cms_calc_markup","subject_id":"n_cms_calc_markup","relation_type":"CALCULATED_VALUE","object_id":"n_qty_cms_calc_markup","domain_id":"business","assertion_text":"Markup = (30 - 12) / 12 x 100 = 150%. This differs from the 60% gross margin because the denominator is cost rather than net sales.","verification_status":"unverified","mcq_disabled":true,"last_verified_at":"2026-09-30T01:25:00.000Z"}
  - {"id":"ki_cms_calc_target_price","subject_id":"n_cms_calc_target_price","relation_type":"CALCULATED_VALUE","object_id":"n_qty_cms_calc_target_price","domain_id":"business","assertion_text":"Price = cost / (1 - target gross margin) = 12 / (1 - 0.60) = EUR 30. Adding 60% to cost would give EUR 19.20 and would not achieve a 60% gross margin.","verification_status":"unverified","mcq_disabled":true,"last_verified_at":"2026-09-30T01:25:00.000Z"}

