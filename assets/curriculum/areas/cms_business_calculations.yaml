knowledge_nodes:
  - {"id":"n_cms_calc_full_pours","node_type":"worked_example","name":"In this hypothetical service, one bottle contains 750 mL. How many complete 100 mL pours can it provide if leftovers cannot count as a pour?"}
  - {"id":"n_qty_cms_calc_full_pours","node_type":"quantity","name":"7 pours"}
  - {"id":"n_cms_calc_event_bottles","node_type":"worked_example","name":"For a hypothetical event, 40 guests each receive two 125 mL pours. What is the minimum number of 750 mL bottles needed? Pool usable wine across bottles; ignore spillage and any reserve."}
  - {"id":"n_qty_cms_calc_event_bottles","node_type":"quantity","name":"14 bottles"}
  - {"id":"n_cms_calc_gross_profit","node_type":"worked_example","name":"A hypothetical bottle has tax-exclusive net sales of EUR 30 and cost of goods sold of EUR 12. What is its gross profit in EUR, before overheads?"}
  - {"id":"n_qty_cms_calc_gross_profit","node_type":"quantity","name":"18 EUR"}
  - {"id":"n_cms_calc_gross_margin","node_type":"worked_example","name":"A hypothetical bottle has tax-exclusive net sales of EUR 30 and cost of goods sold of EUR 12. What is its gross margin percentage? Use net sales as the denominator."}
  - {"id":"n_qty_cms_calc_gross_margin","node_type":"quantity","name":"60 %"}
  - {"id":"n_cms_calc_markup","node_type":"worked_example","name":"A hypothetical bottle has tax-exclusive net sales of EUR 30 and cost of goods sold of EUR 12. What is its markup percentage? Use cost of goods sold as the denominator."}
  - {"id":"n_qty_cms_calc_markup","node_type":"quantity","name":"150 %"}
  - {"id":"n_cms_calc_target_price","node_type":"worked_example","name":"A hypothetical bottle costs EUR 12 in goods sold. What tax-exclusive net selling price in EUR gives a 60% gross margin? Assume no discounts, commissions or rounding of cents."}
  - {"id":"n_qty_cms_calc_target_price","node_type":"quantity","name":"30 EUR"}

