knowledge_items:
  - id: ki_cms_irish_origin
    subject_id: n_cms_irish_whiskey
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_irish_origin
    domain_id: service
    assertion_text: "The Irish Whiskey technical file covers whiskey distilled on the island of Ireland, including Northern Ireland, from a fermented cereal mash. It requires at least three years' maturation in wooden casks no larger than 700 litres. 'Irish' is an origin and production claim, not a promise that every example tastes alike."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_irish_pot_malt
    subject_id: n_cms_irish_whiskey
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_irish_pot_malt
    domain_id: service
    assertion_text: "The Irish technical file distinguishes Pot Still Irish Whiskey, which uses malted and unmalted barley, from Malt Irish Whiskey, made with malted barley. Both are distilled in copper pot stills. 'Pot still' describes equipment too, but the named Irish category is not a synonym for single malt."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_irish_blend
    subject_id: n_cms_irish_whiskey
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_irish_blend
    domain_id: service
    assertion_text: "The technical file identifies Pot Still, Malt and Grain Irish Whiskey varieties; it says those varieties may be combined as Blended Irish Whiskey. A blend is not automatically a blend of Scotch whisky, and its exact component proportions cannot be inferred from the word 'blended' alone."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_liqueur_orange
    subject_id: n_cms_liqueur_extraction
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_liqueur_orange
    domain_id: service
    assertion_text: "Cointreau describes selecting sweet and bitter orange peels, blending them for aroma and distilling in copper equipment to make its orange liqueur. It is a citrus example of flavour extraction, not proof that every liqueur uses orange or that every extraction uses distillation."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_liqueur_herbal
    subject_id: n_cms_liqueur_extraction
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_liqueur_herbal
    domain_id: service
    assertion_text: "Chartreuse Diffusion describes Green Chartreuse as a herbal liqueur made with plants, bark, roots, spices and flowers. Its producer describes distillation for aroma and different macerations for extraction and colour. It is one producer's process, not a universal liqueur recipe."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_liqueur_compare
    subject_id: n_cms_liqueur_extraction
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_liqueur_compare
    domain_id: service
    assertion_text: "Orange-peel Cointreau and botanical Green Chartreuse illustrate different citrus and herbal flavour families. Both producers describe distillation, but Chartreuse additionally describes maceration. For a recommendation, ask separately about the guest's desired flavour and the specific product's production and service; a method alone does not determine flavour."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_irish_case_action
    subject_id: n_cms_irish_case
    relation_type: CASE_ACTION
    object_id: n_cms_irish_case_action
    domain_id: service
    assertion_text: "Clarify that the named Irish Pot Still and Malt Whiskey varieties have different barley bills. Ask whether the guest seeks a particular flavour or merely a category name before recommending a bottle."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_irish_case_reason
    subject_id: n_cms_irish_case
    relation_type: CASE_REASON
    object_id: n_cms_irish_case_reason
    domain_id: service
    assertion_text: "The Irish technical file uses both malted and unmalted barley for Pot Still Irish Whiskey; Malt Irish Whiskey uses malted barley. They cannot be equated merely because both may involve pot stills."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_irish_case_tradeoff
    subject_id: n_cms_irish_case
    relation_type: CASE_TRADEOFF
    object_id: n_cms_irish_case_tradeoff
    domain_id: service
    assertion_text: "If available, compare a specific Pot Still bottle with a specific Malt bottle for the guest. The specification describes category production and typical traits, but the final choice depends on the actual stock and preference."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_irish_case_limit
    subject_id: n_cms_irish_case
    relation_type: CASE_LIMITATION
    object_id: n_cms_irish_case_limit
    domain_id: service
    assertion_text: "The technical file does not authenticate an individual label or establish the exact sensory profile of a bottle. Verify the stocked product before making a specific recommendation."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_liqueur_case_action
    subject_id: n_cms_liqueur_case
    relation_type: CASE_ACTION
    object_id: n_cms_liqueur_case_action
    domain_id: service
    assertion_text: "Ask which herbal notes and serving style the guest wants. If Green Chartreuse is stocked, offer it as an herbal example instead of substituting an orange liqueur without explanation."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_liqueur_case_reason
    subject_id: n_cms_liqueur_case
    relation_type: CASE_REASON
    object_id: n_cms_liqueur_case_reason
    domain_id: service
    assertion_text: "Cointreau identifies orange peels as central to its liqueur, while Chartreuse identifies a broad botanical mixture in its Green Chartreuse. Both are liqueurs but answer different flavour requests."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_liqueur_case_tradeoff
    subject_id: n_cms_liqueur_case
    relation_type: CASE_TRADEOFF
    object_id: n_cms_liqueur_case_tradeoff
    domain_id: service
    assertion_text: "Both makers describe distillation in their processes, so the production method alone is not the deciding service distinction. The guest may prefer orange after tasting; ask rather than assuming."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"
  - id: ki_cms_liqueur_case_limit
    subject_id: n_cms_liqueur_case
    relation_type: CASE_LIMITATION
    object_id: n_cms_liqueur_case_limit
    domain_id: service
    assertion_text: "Producer descriptions concern their own products and cannot identify an unlabelled glass or guarantee a guest's preference. Check the bottle, list availability and any dietary constraints before service."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-28T00:00:00.000Z"

