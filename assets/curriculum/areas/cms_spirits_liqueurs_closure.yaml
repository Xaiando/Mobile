question_templates:
  - id: qt_cms_irish_case
    relation_type: CASE_ACTION
    direction: forward
    mode: short_answer
    variant: cms_irish_pot_malt
    prompt_template: >-
      A guest thinks Single Pot Still Irish Whiskey means Single Malt. How would
      you explain the barley-bill difference, offer a useful comparison and
      avoid promising that every bottle tastes the same?
    parameters:
      scope_node_ids: [n_cms_irish_case]
      key_points: {CASE_ACTION: Correction, CASE_REASON: Barley bill, CASE_TRADEOFF: Bottle comparison, CASE_LIMITATION: Product-specific check}
  - id: qt_cms_liqueur_case
    relation_type: CASE_ACTION
    direction: forward
    mode: short_answer
    variant: cms_liqueur_flavour
    prompt_template: >-
      A guest asks for a herbal liqueur but is offered an orange liqueur.
      Compare the two producer examples, explain what their extraction methods
      do and name the bottle or preference check needed before service.
    parameters:
      scope_node_ids: [n_cms_liqueur_case]
      key_points: {CASE_ACTION: Guest response, CASE_REASON: Flavour materials, CASE_TRADEOFF: Shared method, CASE_LIMITATION: Stock check}
