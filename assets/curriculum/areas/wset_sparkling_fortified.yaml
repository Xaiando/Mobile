knowledge_items:
  - id: ki_wset_sf_champagne_climate
    subject_id: n_wset_sf_principle_champagne_climate
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_champagne_climate
    domain_id: winemaking
    assertion_text: Cool northern conditions support acidity and moderate sugar in Champagne base wines. Spring frost and unreliable weather can reduce crops; slope, aspect and harvest choices still matter. A cool climate supports the sparkling objective without guaranteeing ripe, healthy fruit.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_champagne_grapes
    subject_id: n_wset_sf_principle_champagne_grapes
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_champagne_grapes
    domain_id: winemaking
    assertion_text: Chardonnay commonly brings freshness and finesse; Pinot Noir contributes body and structure; Meunier adds fruit expression. These are blending tendencies, not rules that every cuvée must contain all three or taste identically.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_champagne_districts
    subject_id: n_wset_sf_principle_champagne_districts
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_champagne_districts
    domain_id: winemaking
    assertion_text: Chardonnay is especially associated with the Côte des Blancs and Côte de Sézanne; Pinot Noir with the Montagne de Reims and Côte des Bar; Meunier is important in the Vallée de la Marne. These associations do not make each district exclusively one grape.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_champagne_chalk
    subject_id: n_wset_sf_principle_champagne_chalk
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_champagne_chalk
    domain_id: winemaking
    assertion_text: Porous chalk combines drainage with a water reserve available to vines. Champagne also contains marl, clay and sand; neither a chalk label nor a district name establishes identical water supply, ripeness or wine quality across its sites.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_champagne_white_black
    subject_id: n_wset_sf_principle_champagne_white_black
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_champagne_white_black
    domain_id: winemaking
    assertion_text: Blanc de Blancs uses white grapes, usually Chardonnay. Blanc de Noirs uses black grapes, Pinot Noir and/or Meunier, pressed for pale juice. The terms concern grape origin; Blanc de Noirs does not mean a red sparkling wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_champagne_cru
    subject_id: n_wset_sf_principle_champagne_cru
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_champagne_cru
    domain_id: winemaking
    assertion_text: Champagne Premier Cru and Grand Cru indicate grape origin from qualifying communes. They do not identify a Burgundy-style individual vineyard or a guaranteed preferred taste; producer selection, blending and maturation still influence quality and price.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_champagne_vintage
    subject_id: n_wset_sf_principle_champagne_vintage
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_champagne_vintage
    domain_id: winemaking
    assertion_text: Vintage Champagne uses grapes from its stated harvest; non-vintage blends commonly combine years for a house style. Minimum maturation before release is 15 months for non-vintage and three years for vintage; actual ageing often exceeds these minima. A vintage date alone does not prove higher quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_champagne_cost
    subject_id: n_wset_sf_principle_champagne_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_champagne_cost
    domain_id: winemaking
    assertion_text: Manual whole-bunch harvest, selective pressing and bottle ageing require labour, cellar capacity and tied-up stock. Longer maturation increases storage demands while developing the wine; reputation and demand also affect selling price, so cost alone cannot explain a particular Champagne’s market price.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_spark_sweetness
    subject_id: n_wset_sf_principle_spark_sweetness
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_spark_sweetness
    domain_id: winemaking
    assertion_text: In the cited Cava rules, Brut Nature is below 3 g/L with no added sugar, Brut below 12, Extra Dry 12–17, and Demi-Sec/Semi-Seco 32–50. Extra Dry is sweeter than Brut. Sweetness classification does not determine the wine’s method, grape or quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_alsace_cremant
    subject_id: n_wset_sf_principle_alsace_cremant
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_alsace_cremant
    domain_id: winemaking
    assertion_text: Crémant d’Alsace is a traditional-method sparkling wine. Pinot Blanc is important in white blends, alongside options including Riesling, Pinot Gris and Chardonnay; Pinot Noir makes rosé and Blanc de Noirs. Fresh fruit and acidity may be joined by lees-related complexity according to maturation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_bourgogne_cremant
    subject_id: n_wset_sf_principle_bourgogne_cremant
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_bourgogne_cremant
    domain_id: winemaking
    assertion_text: Chardonnay and Pinot Noir are central to Crémant de Bourgogne, though other authorised varieties also occur. Picking for a sparkling base preserves useful acidity and moderate sugar. Traditional bottle fermentation and lees maturation then add bubbles and potentially mature complexity.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_bourgogne_styles
    subject_id: n_wset_sf_principle_bourgogne_styles
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_bourgogne_styles
    domain_id: winemaking
    assertion_text: Grape mix, vineyard origin, pressing selection, dosage and time on lees influence Crémant de Bourgogne. A fresh fruit-led cuvée and a longer-aged complex cuvée can both be intentional; additional bottle storage ties up stock rather than automatically ensuring a better wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_loire_cremant
    subject_id: n_wset_sf_principle_loire_cremant
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_loire_cremant
    domain_id: winemaking
    assertion_text: Crémant de Loire covers defined sites in Anjou, Saumur and Touraine. Chenin Blanc is important, with other authorised grapes including Chardonnay and Cabernet Franc. Traditional bottle fermentation combines fresh base-wine acidity with possible lees character; rosé versions differ in colour and fruit expression.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_saumur_spark
    subject_id: n_wset_sf_principle_saumur_spark
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_saumur_spark
    domain_id: winemaking
    assertion_text: Saumur sparkling white commonly uses Chenin Blanc, sometimes blended with other authorised grapes. A fresh, acidic base undergoes traditional bottle fermentation; limestone cellars provide maturation space. The finished balance also depends on blending, lees ageing and dosage rather than Chenin alone.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_vouvray_spark
    subject_id: n_wset_sf_principle_vouvray_spark
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_vouvray_spark
    domain_id: winemaking
    assertion_text: Vouvray sparkling wine uses Chenin Blanc. Traditional bottle fermentation adds retained carbon dioxide to a fresh base wine, while lees ageing and finishing choices shape complexity and sweetness. The appellation also makes still wines, so Vouvray alone does not specify bubbles or sweetness.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_asti_grape
    subject_id: n_wset_sf_principle_asti_grape
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_asti_grape
    domain_id: winemaking
    assertion_text: Moscato Bianco, or Muscat Blanc à Petits Grains, supplies pronounced floral and grapey aromas to Asti. In the classic sweet style, stopping fermentation retains grape sugar and keeps alcohol relatively low; sweetness comes from the fruit rather than requiring a final sweet dosage.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_asti_method
    subject_id: n_wset_sf_principle_asti_method
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_asti_method
    domain_id: winemaking
    assertion_text: Classic Asti starts with clarified, chilled grape juice and uses one alcoholic fermentation, with part conducted under pressure to retain gas. Conventional Prosecco makes a dry base first and then a second tank fermentation. Both can use pressure tanks, but their fermentation sequences differ.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_asti_stop
    subject_id: n_wset_sf_principle_asti_stop
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_asti_stop
    domain_id: winemaking
    assertion_text: Chilling arrests the Asti fermentation at the intended sugar and alcohol balance; centrifugation or filtration removes yeast before pressure bottling. Retaining sugar demands microbiological control. This is fermentation arrest, not the spirit addition used in sweet fortified wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_asti_current
    subject_id: n_wset_sf_principle_asti_current
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_asti_current
    domain_id: winemaking
    assertion_text: Current Asti Spumante DOCG includes sweetness styles from Brut Nature to sweet and permits tank or traditional bottle production. The classic sweet single-fermentation Asti method remains a useful study example, but the DOCG name alone does not guarantee that exact style or route.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_prosecco_identity
    subject_id: n_wset_sf_principle_prosecco_identity
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_prosecco_identity
    domain_id: winemaking
    assertion_text: Prosecco DOC is a protected northeastern Italian origin centred on Glera, which must form at least 85% of its permitted blend. Prosecco is an appellation name; Glera is the grape name. The area spans Veneto and Friuli Venezia Giulia and includes plains as well as hills.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_prosecco_style
    subject_id: n_wset_sf_principle_prosecco_style
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_prosecco_style
    domain_id: winemaking
    assertion_text: Glera provides floral and fruity expression. Conventional Prosecco’s second fermentation in tank, followed by filtering and pressure bottling, suits a fresh style with limited mature lees character. Tank method does not mean injected carbon dioxide and does not itself make the wine sweet.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_prosecco_hills
    subject_id: n_wset_sf_principle_prosecco_hills
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_prosecco_hills
    domain_id: winemaking
    assertion_text: Conegliano-Valdobbiadene Prosecco Superiore DOCG comes from a defined hilly area within the wider northeastern Prosecco landscape. Steep slopes and widespread hand work complicate vineyard operations; differing slope and drainage conditions affect ripening. These choices can add labour cost while preserving distinct site expression.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_prosecco_labels
    subject_id: n_wset_sf_principle_prosecco_labels
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_prosecco_labels
    domain_id: winemaking
    assertion_text: Prosecco Extra Dry sits above Brut in residual sugar. Extra Dry is a classification term, not a promise of very dry taste; read the sweetness designation separately from DOC/DOCG origin, pressure category and producer quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_cava_grape_roles
    subject_id: n_wset_sf_principle_cava_grape_roles
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_cava_grape_roles
    domain_id: winemaking
    assertion_text: Macabeo supplies fresh delicate fruit; Xarel·lo contributes body and structure; Parellada contributes freshness and finesse and is well suited to higher Penedès sites. These complementary tendencies help explain the traditional blend without excluding Chardonnay, Pinot Noir or other authorised grapes.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_cava_sites
    subject_id: n_wset_sf_principle_cava_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_cava_sites
    domain_id: winemaking
    assertion_text: Most Cava comes from the Catalan production area, but the PDO covers several geographically separate zones. Mediterranean influence and differences in elevation create varied ripening conditions within Penedès; harvest for a fresh base balances aroma development with acidity before bottle fermentation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_cava_aging
    subject_id: n_wset_sf_principle_cava_aging
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_cava_aging
    domain_id: winemaking
    assertion_text: Cava’s minimum bottle contact from tirage to disgorgement is nine months; Reserva requires 18, Gran Reserva 30 and Paraje Calificado 36. Longer lees contact can develop mature complexity, but age category alone does not establish preferred balance or a fixed retail price.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_cava_guarda
    subject_id: n_wset_sf_principle_cava_guarda
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_cava_guarda
    domain_id: winemaking
    assertion_text: Cava Reserva, Gran Reserva and Paraje Calificado use Guarda Superior vineyard requirements, including minimum vine age and organic certification from the 2025 harvest. Read origin and category together; certification describes production requirements rather than guaranteeing a particular taste.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_cava_cost
    subject_id: n_wset_sf_principle_cava_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_cava_cost
    domain_id: winemaking
    assertion_text: Traditional bottle fermentation requires sediment removal and handling. Keeping Cava in bottle for longer uses cellar capacity and ties up inventory; vineyard requirements may affect costs. These are plausible price drivers, not a rule that every older Cava must sell above every younger one.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_sekt_origin
    subject_id: n_wset_sf_principle_sekt_origin
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_sekt_origin
    domain_id: winemaking
    assertion_text: Sekt is quality sparkling wine; bottling or making Sekt in Germany alone does not establish German grapes. Deutscher Sekt uses German base wines, while specified-region origin adds a narrower claim. The origin term must be read separately from grape, sweetness and production method.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_sekt_method
    subject_id: n_wset_sf_principle_sekt_method
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_sekt_method
    domain_id: winemaking
    assertion_text: Sekt may use tank, transfer or traditional bottle processes. Riesling is important in distinctive German examples, while other grapes and blends also occur. Winzersekt specifically follows traditional bottle fermentation and lees maturation; its fruity or mature expression depends on grape and cellar choices.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_cap_identity
    subject_id: n_wset_sf_principle_cap_identity
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_cap_identity
    domain_id: winemaking
    assertion_text: Cap Classique is South African sparkling wine made with a second fermentation in bottle by the traditional method. It identifies a production category rather than one grape or one vineyard district; carbonated wine is a different route. Lees maturation and dosage still shape its finished style.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_cap_style
    subject_id: n_wset_sf_principle_cap_style
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_cap_style
    domain_id: winemaking
    assertion_text: Chardonnay and Pinot Noir are important in Cap Classique, although other varieties occur. Cool-source base wines preserve freshness, and extended bottle lees ageing can add creamy texture and mature complexity. Producers use different sites and maturation lengths, so one national label is not one fixed taste.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_tasmania_spark
    subject_id: n_wset_sf_principle_tasmania_spark
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_tasmania_spark
    domain_id: winemaking
    assertion_text: Tasmania’s cool conditions favour Chardonnay and Pinot Noir with useful acidity and moderate sugar for sparkling bases. Much of this fruit supports premium traditional-method wine; bottle ageing can add complexity to the fresh structure. Site, season and harvest decisions still affect ripeness and yield.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_yarra_spark
    subject_id: n_wset_sf_principle_yarra_spark
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_yarra_spark
    domain_id: winemaking
    assertion_text: Cool Yarra Valley sites support Chardonnay and Pinot Noir for sparkling bases, often finished by traditional bottle fermentation. Cooler growing conditions support acidity; ripeness, base-wine selection and lees maturation determine the actual style. A Yarra origin does not imply every wine is sparkling or identically cool-grown.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_adelaide_spark
    subject_id: n_wset_sf_principle_adelaide_spark
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_adelaide_spark
    domain_id: winemaking
    assertion_text: Elevation provides cooler conditions in parts of the Adelaide Hills, including sites used for Chardonnay and Pinot Noir sparkling bases. Traditional bottle fermentation can add mature lees character while maintaining fresh structure. Altitude helps explain suitability; aspect, seasonal weather and harvest timing still affect results.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_marlborough_spark
    subject_id: n_wset_sf_principle_marlborough_spark
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_marlborough_spark
    domain_id: winemaking
    assertion_text: Marlborough’s cool climate with abundant sunshine supports fresh acidity and defined fruit in sparkling bases. Chardonnay and Pinot Noir are major grapes for traditional-method examples; bottle lees ageing can bring biscuit-like complexity. Sauvignon Blanc’s regional fame does not define the classic sparkling blend.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_anderson_spark
    subject_id: n_wset_sf_principle_anderson_spark
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_anderson_spark
    domain_id: winemaking
    assertion_text: Pacific-influenced cooling, morning fog and cool nights support freshness in Anderson Valley Pinot Noir and Chardonnay. These grapes are used in sparkling production as well as still wine. Cool conditions help the base-wine balance; the method and lees ageing must still be checked rather than inferred solely from origin.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_carneros_spark
    subject_id: n_wset_sf_principle_carneros_spark
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_carneros_spark
    domain_id: winemaking
    assertion_text: Los Carneros spans southern Napa and Sonoma near San Pablo Bay. Breezes and fog moderate temperatures and slow ripening of Chardonnay and Pinot Noir, useful for fresh sparkling bases. Domaine Carneros is a traditional-method example; the AVA itself does not require every wine to use that method.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_port_grapes
    subject_id: n_wset_sf_principle_port_grapes
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_port_grapes
    domain_id: winemaking
    assertion_text: Touriga Nacional, Touriga Franca, Tinta Roriz, Tinta Barroca and Tinto Cão are important red Port grapes. Many Port varieties have small thick-skinned berries, supporting concentrated colour, flavour and structure. Blending combines complementary fruit, floral, spice and tannin characteristics rather than requiring a single-variety identity.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_port_short_extraction
    subject_id: n_wset_sf_principle_port_short_extraction
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_port_short_extraction
    domain_id: winemaking
    assertion_text: Port retains grape sugar by fortifying before fermentation finishes, leaving a short period to extract colour, tannin and flavour from skins. Foot treading in shallow lagares crushes fruit and maintains skin contact; temperature and mechanical alternatives provide other ways to manage the extraction objective.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_port_autovinifier
    subject_id: n_wset_sf_principle_port_autovinifier
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_port_autovinifier
    domain_id: winemaking
    assertion_text: An autovinifier uses pressure from fermentation gas to drive liquid through its recirculation system and over the skins. It supports extraction during Port’s short fermentation without the same manual treading requirement; performance still depends on fermentation activity and process control.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_port_mechanical
    subject_id: n_wset_sf_principle_port_mechanical
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_port_mechanical
    domain_id: winemaking
    assertion_text: Mechanical plungers push the cap into liquid; robotic lagares can reproduce treading while controlling pressure and temperature. Both reduce dependence on manual labour but require equipment and maintenance. The finished extraction and balance must be evaluated rather than assuming automation means low quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_port_ruby_reserve
    subject_id: n_wset_sf_principle_port_ruby_reserve
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_port_ruby_reserve
    domain_id: winemaking
    assertion_text: Ruby Port emphasises youthful red or black fruit and deep colour. Reserve Ruby is a selected, approved blend with more intensity and structure, still directed towards fruit preservation. Reserve is a quality category, not a vintage year or a promise of oxidative Tawny character.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_port_tawny_labels
    subject_id: n_wset_sf_principle_port_tawny_labels
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_port_tawny_labels
    domain_id: winemaking
    assertion_text: Tawny styles show lighter brown colour and developed nut or dried-fruit character from maturation and blending choices. Reserve Tawny is a selected wood-aged category. A basic Tawny name does not promise the concentration or long maturation of a Tawny with an indication of age.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_port_age_label
    subject_id: n_wset_sf_principle_port_age_label
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_port_age_label
    domain_id: winemaking
    assertion_text: Age-indicated Tawny Port blends wood-aged wines to achieve the sensory character of the stated age. It is not a single harvest date or a guarantee that every component is exactly that old. Classic examples include 10, 20, 30 and 40 years; current categories also extend beyond 40.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_port_vintage_lbv
    subject_id: n_wset_sf_principle_port_vintage_lbv
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_port_vintage_lbv
    domain_id: winemaking
    assertion_text: LBV comes from one harvest and stays in bulk longer before bottling than Vintage Port. Filtered LBV is usually ready to drink; unfiltered examples may deposit sediment and evolve. Vintage Port is bottled earlier and can develop for decades, so a vintage date is not a promise of immediate maturity.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_port_cost
    subject_id: n_wset_sf_principle_port_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_port_cost
    domain_id: winemaking
    assertion_text: Steep Douro terrain makes vineyard operations demanding. Traditional treading adds labour, while mechanical extraction adds equipment costs. Long-aged Tawny stocks occupy cellar space and lose volume through evaporation; selection and maturation can therefore increase resources per bottle, while demand and reputation also affect price.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_sherry_grapes
    subject_id: n_wset_sf_principle_sherry_grapes
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_sherry_grapes
    domain_id: winemaking
    assertion_text: Palomino is the principal grape for familiar dry Sherry bases, whose character develops strongly during ageing. Pedro Ximénez supplies raisined, intensely sweet wine after grape drying; Moscatel contributes floral and citrus aroma in sweet styles. Sweetness route and ageing matter alongside grape identity.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_sherry_climate
    subject_id: n_wset_sf_principle_sherry_climate
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_sherry_climate
    domain_id: winemaking
    assertion_text: Jerez has hot dry summers and rainfall concentrated outside the growing season. Moist Atlantic Poniente winds moderate conditions, while hot dry Levante winds increase drying pressure. Growers must manage water availability and grape health; warmth alone does not determine the later flor or oxidative cellar style.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_sherry_albariza
    subject_id: n_wset_sf_principle_sherry_albariza
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_sherry_albariza
    domain_id: winemaking
    assertion_text: Albariza’s moisture-retaining structure stores winter rainfall for use during dry months. Its pale surface and crust also affect heat and evaporation. The soil helps explain water supply, not a direct transfer of a chalk flavour into Sherry; grape growing and cellar ageing remain separate influences.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_sherry_fino
    subject_id: n_wset_sf_principle_sherry_fino
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_sherry_fino
    domain_id: winemaking
    assertion_text: Fino is pale, dry and relatively light, with pungent yeast or dough and almond-like characters from flor ageing. In the traditional fortified route, completely fermented Palomino base is prepared around 15% for flor. Dryness is compatible with fortification; Fino is not sweet simply because spirit is used.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_sherry_manzanilla
    subject_id: n_wset_sf_principle_sherry_manzanilla
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_sherry_manzanilla
    domain_id: winemaking
    assertion_text: Manzanilla is dry wine biologically aged in Sanlúcar de Barrameda. Atlantic breezes, the river and wetlands moderate temperatures and raise humidity, favouring flor. Its pale, delicate, savoury profile may recall dough, almonds and floral notes; the place of ageing is integral to its protected identity.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_sherry_amontillado_style
    subject_id: n_wset_sf_principle_sherry_amontillado_style
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_sherry_amontillado_style
    domain_id: winemaking
    assertion_text: Amontillado begins with biological ageing and then ages oxidatively after flor disappears. It is dry, amber and nutty, combining a flor-derived foundation with developed aromas. It should not be classified as naturally sweet from its colour or richness.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_sherry_oloroso_style
    subject_id: n_wset_sf_principle_sherry_oloroso_style
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_sherry_oloroso_style
    domain_id: winemaking
    assertion_text: Oloroso’s oxidative maturation develops amber-to-mahogany colour, nut aromas and a fuller texture. The base is fermented dry; absence of flor preserves more glycerol than in a biologically aged wine. Sweetened blends can use Oloroso, but the dry Oloroso category itself is distinct from Cream.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_sherry_palo_cortado
    subject_id: n_wset_sf_principle_sherry_palo_cortado
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_sherry_palo_cortado
    domain_id: winemaking
    assertion_text: Palo Cortado is dry and predominantly oxidatively aged after loss of the initial flor. It combines aromatic delicacy associated with Amontillado with the body of Oloroso. Selection and cellar decisions matter; it need not be taught as an inexplicable accident or as a sweet style.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_sherry_pale_cream
    subject_id: n_wset_sf_principle_sherry_pale_cream
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_sherry_pale_cream
    domain_id: winemaking
    assertion_text: Pale Cream combines a biologically aged base with a sweetening component, commonly rectified concentrated grape must. This can preserve pale colour and flor-derived aromas while adding sweetness. It differs from a dark oxidative Cream blend and from fermenting all the base grape sugar incompletely.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_sherry_medium
    subject_id: n_wset_sf_principle_sherry_medium
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_sherry_medium
    domain_id: winemaking
    assertion_text: Medium Sherry blends an aged dry base with naturally sweet wine or grape-derived sweetener; Amontillado-like bases are common. It combines developed nutty aromas with a range of sweetness. Medium is a sweetened blending category, whereas Amontillado itself is a dry wine style.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_sherry_cream_style
    subject_id: n_wset_sf_principle_sherry_cream_style
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_sherry_cream_style
    domain_id: winemaking
    assertion_text: Cream is a sweet blend, often using dry oxidative Oloroso and a naturally sweet component such as PX. It combines mature nutty character with sweetness. PX is instead a naturally sweet raisined-grape wine; dry Oloroso and Cream should not be treated as interchangeable names.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_sherry_current_route
    subject_id: n_wset_sf_principle_sherry_current_route
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_sherry_current_route
    domain_id: winemaking
    assertion_text: The 2026 Jerez and Manzanilla specifications include both wine and liqueur-wine categories. Traditional fortified preparation remains central to classic study examples, but protected dry Sherry need not always receive added spirit. Describe the actual route and intended ageing rather than making fortification universal.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_sherry_cost
    subject_id: n_wset_sf_principle_sherry_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_sherry_cost
    domain_id: winemaking
    assertion_text: Sherry ageing ties up stocks in casks and requires withdrawals, refreshment and monitoring. Long maturation also causes evaporative loss and concentration. A solera blends successive ages to maintain style; it does not remove storage cost or make the bottle a single vintage, and retail price also depends on the market.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_beaumes_origin
    subject_id: n_wset_sf_principle_beaumes_origin
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_beaumes_origin
    domain_id: winemaking
    assertion_text: Muscat de Beaumes-de-Venise comes from Beaumes-de-Venise and Aubignan on the southern Dentelles de Montmirail slopes. Muscat à Petits Grains ripens in hot dry Mediterranean conditions, with the hills tempering the Mistral. This sweet fortified identity differs from the dry red Beaumes-de-Venise appellation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_beaumes_fresh
    subject_id: n_wset_sf_principle_beaumes_fresh
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_beaumes_fresh
    domain_id: winemaking
    assertion_text: Mutage interrupts fermentation to retain natural sugar. A maturation and bottling plan that limits oxidation preserves Muscat’s floral and ripe fruit aromas in the classic youthful Beaumes style. Fortification retains sweetness but does not itself create the long cask-aged raisin and rancio profile of Rutherglen Muscat.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_beaumes_cost
    subject_id: n_wset_sf_principle_beaumes_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_beaumes_cost
    domain_id: winemaking
    assertion_text: The regional board describes Muscat de Beaumes-de-Venise harvested by hand in several passes according to ripeness. Selecting ripe aromatic fruit adds labour and supports the intended sweet style; it does not by itself guarantee higher quality or a particular selling price.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_rutherglen_climate
    subject_id: n_wset_sf_principle_rutherglen_climate
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_rutherglen_climate
    domain_id: winemaking
    assertion_text: Rutherglen has an inland continental climate with hot summers and a long dry autumn. These conditions help Muscat ripen to high sugar, with shrivelling possible before harvest. Brown Muscat, Muscat à Petits Grains Rouge, is important; partial fermentation and fortification retain substantial grape sweetness.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_rutherglen_evolution
    subject_id: n_wset_sf_principle_rutherglen_evolution
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_rutherglen_evolution
    domain_id: winemaking
    assertion_text: Cask ageing and evaporation concentrate Rutherglen Muscat while oxidative development brings dried-fruit, caramel and rancio character. Blending young and mature parcels manages freshness and richness. Long-aged stocks require time and lose saleable volume, which can add cost without making age the sole measure of quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_rutherglen_tiers
    subject_id: n_wset_sf_principle_rutherglen_tiers
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_rutherglen_tiers
    domain_id: winemaking
    assertion_text: The regional Muscat progression runs from Rutherglen through Classic and Grand to Rare, broadly increasing mature richness, concentration and complexity. Producers blend stocks to their own styles; the tiers should not be reduced to an exact single-vintage age or a guarantee of the drinker’s preference.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_bourgogne_environment
    subject_id: n_wset_sf_principle_bourgogne_environment
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_bourgogne_environment
    domain_id: winemaking
    assertion_text: Crémant de Bourgogne draws on varied sites from northern Bourgogne to Beaujolais. Well-exposed slopes help ripening, while fresh conditions support acidity. Producers pick for the sparkling objective before excessive sugar accumulates; one broad appellation does not give every site the same ripening pace.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_vouvray_environment
    subject_id: n_wset_sf_principle_vouvray_environment
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_vouvray_environment
    domain_id: winemaking
    assertion_text: Loire-valley oceanic influence moderates Vouvray, but autumn conditions vary between years. Sunny autumns can favour concentrated fruit for sweet still Chenin. Sparkling production instead selects a fresh, moderately sugared base; suitability depends on harvest decisions as well as regional conditions. This comparison does not make all Vouvray sparkling.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_asti_environment
    subject_id: n_wset_sf_principle_asti_environment
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_asti_environment
    domain_id: winemaking
    assertion_text: Asti’s continental growing environment makes hillside exposure important for Moscato Bianco ripening. Vineyard slope and elevation vary; growers choose suitable exposures to obtain healthy aromatic fruit. Hills can complicate vineyard work, so an aromatic sweet style should not be explained solely by a pressure tank.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_prosecco_environment
    subject_id: n_wset_sf_principle_prosecco_environment
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_prosecco_environment
    domain_id: winemaking
    assertion_text: The Prosecco production area has temperate conditions influenced by Alpine shelter and the nearby Adriatic. Summer moisture supports vine growth; late-season cooling and day–night differences can help retain acidity and develop Glera aromas. Weather, site and harvest timing still determine the fresh base available for sparkling production.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_sekt_environment
    subject_id: n_wset_sf_principle_sekt_environment
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_sekt_environment
    domain_id: winemaking
    assertion_text: Riesling ripens slowly in northern German conditions, with sunny, well-exposed sites helping it reach ripeness while retaining marked acidity. That acidity suits fresh sparkling bases. Apply this explanation to German Riesling examples; generic Sekt may use other grapes or imported base wines with different growing conditions.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_cap_environment
    subject_id: n_wset_sf_principle_cap_environment
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_cap_environment
    domain_id: winemaking
    assertion_text: Cap Classique is made across South African sites rather than one uniform climate. Producers often pick its grapes earlier than still-wine grapes to obtain a fresh, moderately sugared base. Cooler sites and harvest timing can both support acidity; the national method term itself does not establish a coastal source.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_cremant_cellar_cost
    subject_id: n_wset_sf_principle_cremant_cellar_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_cremant_cellar_cost
    domain_id: winemaking
    assertion_text: Traditional-method Crémant d’Alsace, Crémant de Bourgogne, Crémant de Loire, Saumur and Vouvray require bottle fermentation and sediment removal. Keeping bottles longer on lees can add mature complexity but uses cellar space and ties up stock. These costs depend on the actual maturation and handling chosen; the regional name does not dictate a retail price.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_asti_cost
    subject_id: n_wset_sf_principle_asti_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_asti_cost
    domain_id: winemaking
    assertion_text: Classic single-fermentation Asti can retain Moscato fruit without years of bottle lees storage. Tank batches can reduce individual bottle handling, but chilling, filtration and pressure bottling require equipment and control. Steep Asti vineyard sites may increase growing costs. Neither a short cellar route nor sweetness guarantees a low retail price.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_prosecco_cost
    subject_id: n_wset_sf_principle_prosecco_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_prosecco_cost
    domain_id: winemaking
    assertion_text: Tank fermentation helps many Prosecco producers make fresh Glera wines with efficient batch handling and limited long-term bottle storage. Steep Conegliano Valdobbiadene vineyard work can instead require substantial labour. Compare the actual source, scale and cellar choices; DOC or DOCG reputation and distribution also affect price, so tank method alone does not settle it.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_sekt_cost
    subject_id: n_wset_sf_principle_sekt_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_sekt_cost
    domain_id: winemaking
    assertion_text: A tank Sekt can use efficient batch production; a traditional Winzersekt needs bottle fermentation, sediment removal and lees inventory. Longer bottle maturation may add complexity and costs, while grape source and scale differ between producers. Deutscher Sekt is an origin claim and does not by itself prove the more costly process.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
  - id: ki_wset_sf_newworld_spark_cost
    subject_id: n_wset_sf_principle_newworld_spark_cost
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sf_point_newworld_spark_cost
    domain_id: winemaking
    assertion_text: Traditional sparkling examples from Tasmania, Yarra Valley, Adelaide Hills, Marlborough, Anderson Valley and Los Carneros, and South African Cap Classique, combine suitable fresh base fruit with bottle fermentation. Longer lees storage can add mature complexity while tying up stock and cellar capacity. Vineyard source, maturation and scale must be compared; a cool-region name alone does not guarantee quality or price.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T18:00:00.000Z
