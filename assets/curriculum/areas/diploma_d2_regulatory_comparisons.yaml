  "knowledge_items": [
    {
      "id": "ki_d12depth_regcompare_excise",
      "subject_id": "n_d12depth_regcompare_excise",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d12depth_regcompare_excise_point",
      "domain_id": "business",
      "assertion_text": "US26U.S.C.5041 applies wine excise at removal for consumption/sale and distinguishes classes. Check actual product, removal and any credit assignment/eligibility; a customs duty quote or producer's size alone does not establish the final tax liability.",
      "verification_status": "unverified",
      "last_verified_at": "2026-10-02T23:14:50.000Z",
      "mcq_disabled": true
    },
    {
      "id": "ki_d12depth_regcompare_vat",
      "subject_id": "n_d12depth_regcompare_vat",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d12depth_regcompare_vat_point",
      "domain_id": "business",
      "assertion_text": "EU Directive2006/112/EC Articles168(e),173 and178(e) condition deduction on taxed transactions and documentation, with proportionate treatment for mixed use. Recovery timing and national procedure need checking; deductible tax may still create a cash requirement.",
      "verification_status": "unverified",
      "last_verified_at": "2026-10-02T23:14:50.000Z",
      "mcq_disabled": true
    },
    {
      "id": "ki_d12depth_regcompare_customs",
      "subject_id": "n_d12depth_regcompare_customs",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d12depth_regcompare_customs_point",
      "domain_id": "business",
      "assertion_text": "EU Union Customs Code Articles56,57 and64 link tariffs to classification and condition preferential treatment on origin rules. Check the actual wine/product category, agreement and proof; shipping through a partner country does not alone establish preference.",
      "verification_status": "unverified",
      "last_verified_at": "2026-10-02T23:14:50.000Z",
      "mcq_disabled": true
    },
    {
      "id": "ki_d12depth_regcompare_restriction",
      "subject_id": "n_d12depth_regcompare_restriction",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d12depth_regcompare_restriction_point",
      "domain_id": "business",
      "assertion_text": "19U.S.C.1307 prohibits entry of foreign goods made wholly or partly through the specified forced/convict/indentured labour. Establish supply-chain evidence and resolve applicable enforcement requirements before entry; ordinary payment of a charge does not remove a prohibition.",
      "verification_status": "unverified",
      "last_verified_at": "2026-10-02T23:14:50.000Z",
      "mcq_disabled": true
    },
    {
      "id": "ki_d12depth_regcompare_support",
      "subject_id": "n_d12depth_regcompare_support",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d12depth_regcompare_support_point",
      "domain_id": "business",
      "assertion_text": "15U.S.C.649(l) establishes grants to states assisting eligible small businesses with export activities. Statutory eligibility includes US organization/operation, business history, size and resources; state application rules, availability and approval must still be established before recording funding.",
      "verification_status": "unverified",
      "last_verified_at": "2026-10-02T23:14:50.000Z",
      "mcq_disabled": true
    },
    {
      "id": "ki_d12depth_regcompare_label",
      "subject_id": "n_d12depth_regcompare_label",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d12depth_regcompare_label_point",
      "domain_id": "business",
      "assertion_text": "27U.S.C.205(e) requires conforming packaging/labeling for the covered commerce and directs consumer information, including identity, contents and responsible business. The applicable regulations and label review remain necessary; one compliant-looking design is not proof of all-market access.",
      "verification_status": "unverified",
      "last_verified_at": "2026-10-02T23:14:50.000Z",
      "mcq_disabled": true
    },
    {
      "id": "ki_d12depth_case_regcompare_action",
