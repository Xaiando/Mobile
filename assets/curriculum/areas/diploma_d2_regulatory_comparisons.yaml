{
  "knowledge_nodes": [
    {
      "id": "n_d12depth_regcompare_excise",
      "node_type": "production_principle",
      "name": "Why must a US wine-import budget identify the actual tax category and credit entitlement?"
    },
    {
      "id": "n_d12depth_regcompare_excise_point",
      "node_type": "learning_point",
      "name": "Section5041 distinguishes wine categories and makes credits conditional; one rate or automatic credit cannot describe every shipment"
    },
    {
      "id": "n_d12depth_regcompare_vat",
      "node_type": "production_principle",
      "name": "Under the EU VAT Directive, is import VAT always an unrecoverable cost for every wine buyer?"
    },
    {
      "id": "n_d12depth_regcompare_vat_point",
      "node_type": "learning_point",
      "name": "No; deduction depends on taxable use and required import evidence, with national rules and mixed-use limits"
    },
    {
      "id": "n_d12depth_regcompare_customs",
      "node_type": "production_principle",
      "name": "Why is a supplier's claim 'our country has a trade agreement' insufficient for an EU preferential-duty budget?"
    },
    {
      "id": "n_d12depth_regcompare_customs_point",
      "node_type": "learning_point",
      "name": "The goods must meet the relevant tariff classification and preferential-origin conditions"
    },
    {
      "id": "n_d12depth_regcompare_restriction",
      "node_type": "production_principle",
      "name": "For US entry, why cannot a suspected forced-labour issue simply be budgeted as an extra duty?"
    },
    {
      "id": "n_d12depth_regcompare_restriction_point",
      "node_type": "learning_point",
      "name": "Section1307 is an import prohibition, not permission purchasable by paying more"
    },
    {
      "id": "n_d12depth_regcompare_support",
      "node_type": "production_principle",
      "name": "What does US STEP's existence establish for a winery seeking export-promotion help?"
    },
    {
      "id": "n_d12depth_regcompare_support_point",
      "node_type": "learning_point",
      "name": "A state-administered support framework for qualifying small businesses, not an automatic winery grant"
    },
    {
      "id": "n_d12depth_regcompare_label",
      "node_type": "production_principle",
      "name": "A US interstate wine proposal subject to the FAA Act uses a beautiful label with missing product information. What must its plan establish?"
    },
    {
      "id": "n_d12depth_regcompare_label_point",
      "node_type": "learning_point",
      "name": "Conformity with the relevant federal label rules and product-specific information requirements"
    },
    {
      "id": "n_d12depth_case_regcompare",
      "node_type": "production_case",
      "name": "Fictional comparison dated3October2026: a US importer budgets a shipment solely from a customs quote, assumes an excise credit without assignment evidence, and accepts incomplete supply-chain records. An EU buyer assumes immediate full import-VAT recovery despite mixed taxed/exempt use and missing importer documentation. The supplier promises preferential duty from transit through a trade-agreement country. A US winery records an unapproved STEP application as received cash and proposes interstate wine labels without checking mandatory product information. Determine the conditional sequence and compare tax, prohibition, support and labeling effects. All commercial proposals are fictional; no real customs rates, national VAT rates, awards or shipment permissions are supplied. All numbers and business proposals are original hypothetical inputs. Explain a conditional action, causal evidence, a trade-off and the remaining limitations. Self-review supports study; it does not certify real-world permission or professional competence."
    },
    {
      "id": "n_d12depth_case_regcompare_action_point",
      "node_type": "learning_point",
      "name": "Separate destination-specific tax, customs/origin, entry prohibition, label and support checks; keep unapproved support outside available cash and unresolved permissions outside approved shipment plans"
    },
    {
      "id": "n_d12depth_case_regcompare_reason_point",
      "node_type": "learning_point",
      "name": "A charge, deduction, preferential treatment, import prohibition and support application answer different questions; none substitutes for the other's conditions"
    },
    {
      "id": "n_d12depth_case_regcompare_tradeoff_point",
      "node_type": "learning_point",
      "name": "Evidence gathering and product-specific review add time/cost and can change funding and launch timing, but assumptions risk an unusable budget or interrupted route"
    },
    {
      "id": "n_d12depth_case_regcompare_limitation_point",
      "node_type": "learning_point",
      "name": "These selected statutory mechanisms do not establish any particular shipment's rate, deduction, award, label approval or retail permission; actual destination/product facts and current implementing requirements remain necessary"
    }
  ],
