      "id": "ki_d3labels_cl_origin",
      "subject_id": "n_d3labels_principle_cl_origin",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d3labels_point_cl_origin",
      "domain_id": "geography",
      "assertion_text": "For the ordinary geographical D.O. claims governed by Decree 464 article 3(a), at least 75% of the wine must be produced from grapes from the named place. Other category, permitted-grape, certification and domestic-packaging conditions remain; Secano Interior and additional territorial terms have distinct rules.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-02T23:09:26.000Z"
    },
    {
      "id": "ki_d3labels_cl_variety",
      "subject_id": "n_d3labels_principle_cl_variety",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d3labels_point_cl_variety",
      "domain_id": "geography",
      "assertion_text": "Decree 464 article 4(a) requires at least 75% of the named grape for a D.O. varietal claim, and that grape must be eligible under the applicable ordinary or Secano Interior provisions. A permitted name and enough grape do not by themselves establish all origin or label conditions.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-02T23:09:26.000Z"
    },
    {
      "id": "ki_d3labels_cl_vintage",
      "subject_id": "n_d3labels_principle_cl_vintage",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d3labels_point_cl_vintage",
      "domain_id": "geography",
      "assertion_text": "Decree 464 article 5 requires at least 75% from the indicated harvest year for a D.O. vintage claim. That domestic vintage condition differs from supplementary territorial claims and may not suffice for a particular export destination.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-02T23:09:26.000Z"
    },
    {
      "id": "ki_d3labels_cl_territorial",
      "subject_id": "n_d3labels_principle_cl_territorial",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d3labels_point_cl_territorial",
      "domain_id": "geography",
      "assertion_text": "Article 5 bis sets at least 85% by volume from eligible areas with the stated territorial condition, declared to SAG, for Costa, Andes or Entre Cordilleras. These supplementary terms require wine produced and packaged in Chile; basic D.O. percentages do not automatically justify them.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-02T23:09:26.000Z"
    },
    {
      "id": "ki_d3labels_za_origin_exceptions",
      "subject_id": "n_d3labels_principle_za_origin_exceptions",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d3labels_point_za_origin_exceptions",
      "domain_id": "geography",
      "assertion_text": "Section 9(1)(a) requires origin wine solely from grapes harvested in its named production area, subject to 9(2)'s specified deeming provisions. Check those provisions and certified records rather than silently treating cellar location or an 85% varietal percentage as origin entitlement.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-02T23:09:26.000Z"
    },
    {
      "id": "ki_d3labels_za_cultivar",
      "subject_id": "n_d3labels_principle_za_cultivar",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d3labels_point_za_cultivar",
      "domain_id": "geography",
      "assertion_text": "For current ordinary cultivar wine, section 10(1)(a)(ii) requires at least 85% of the contents from the named cultivar. If different cultivars are combined before, during or directly after crushing, at least 90% of grape mass must be that cultivar. Section 10's other conditions and deeming provisions still apply.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-02T23:09:26.000Z"
    },
    {
      "id": "ki_d3labels_za_vintage",
      "subject_id": "n_d3labels_principle_za_vintage",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d3labels_point_za_vintage",
      "domain_id": "geography",
      "assertion_text": "Under section 11(1)(a)(ii), at least 85% of a current vintage wine's contents must come from grapes harvested in the named year, subject to 11(2). Ordinary wine also requires the applicable origin and certification conditions. A year or certification mark does not establish one sensory style.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-02T23:09:26.000Z"
    },
    {
      "id": "ki_d3labels_case_us_ava_release_action",
      "subject_id": "n_d3labels_case_us_ava_release",
      "relation_type": "CASE_ACTION",
      "object_id": "n_d3labels_point_case_us_ava_release_action",
      "domain_id": "business",
      "assertion_text": "Hold the proposed vintage-labelled release and review a supported label or compliant lot composition with the responsible specialist; confirm the entire label, substantiating records and buyer acceptance before dispatch.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-02T23:09:26.000Z"
    },
    {
      "id": "ki_d3labels_case_us_ava_release_reason",
      "subject_id": "n_d3labels_case_us_ava_release",
      "relation_type": "CASE_REASON",
      "object_id": "n_d3labels_point_case_us_ava_release_reason",
      "domain_id": "geography",
      "assertion_text": "The supplied 90% clears the separate federal AVA-origin minimum and 80% qualifying local Riesling clears the ordinary varietal minimum, but 92% of the harvest year falls below the 95% required with an AVA vintage.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-02T23:09:26.000Z"
    },
    {
      "id": "ki_d3labels_case_us_ava_release_tradeoff",
      "subject_id": "n_d3labels_case_us_ava_release",
      "relation_type": "CASE_TRADEOFF",
      "object_id": "n_d3labels_point_case_us_ava_release_tradeoff",
      "domain_id": "business",
      "assertion_text": "A supported reprint would incur the supplied $250 and seven-day delay; dispatch before review exposes the invented $400 penalty and additional compliance/customer costs that have not been quantified.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-02T23:09:26.000Z"
    },
    {
      "id": "ki_d3labels_case_us_ava_release_limitation",
      "subject_id": "n_d3labels_case_us_ava_release",
      "relation_type": "CASE_LIMITATION",
      "object_id": "n_d3labels_point_case_us_ava_release_limitation",
      "domain_id": "business",
      "assertion_text": "The exercise clears only specified federal composition gates for ordinary vinifera wine. Record authenticity, stricter state requirements, other labelling duties, approval, buyer acceptance and actual quality or margin are not established.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-02T23:09:26.000Z"
    },
    {
      "id": "ki_d3labels_case_au_single_claim_action",
      "subject_id": "n_d3labels_case_au_single_claim",
      "relation_type": "CASE_ACTION",
      "object_id": "n_d3labels_point_case_au_single_claim_action",
      "domain_id": "business",
      "assertion_text": "Hold the proposed Chardonnay presentation and compare a supported revised grape description with a monitored reblend, subject to complete label review and the buyer's product brief.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-02T23:09:26.000Z"
    },
    {
      "id": "ki_d3labels_case_au_single_claim_reason",
      "subject_id": "n_d3labels_case_au_single_claim",
      "relation_type": "CASE_REASON",
      "object_id": "n_d3labels_point_case_au_single_claim_reason",
      "domain_id": "geography",
      "assertion_text": "The supplied GI and vintage portions meet their respective 85% single-claim gates in this defined context;82% Chardonnay fails the separate ordinary single-variety 85% gate.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-02T23:09:26.000Z"
    },
    {
      "id": "ki_d3labels_case_au_single_claim_tradeoff",
      "subject_id": "n_d3labels_case_au_single_claim",
      "relation_type": "CASE_TRADEOFF",
      "object_id": "n_d3labels_point_case_au_single_claim_tradeoff",
      "domain_id": "business",
      "assertion_text": "Relabelling adds the supplied A$180 and possible loss of buyer fit; reblending uses tank space, testing time and unknown cost, and can change the observed style.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-02T23:09:26.000Z"
    },
    {
      "id": "ki_d3labels_case_au_single_claim_limitation",
      "subject_id": "n_d3labels_case_au_single_claim",
      "relation_type": "CASE_LIMITATION",
      "object_id": "n_d3labels_point_case_au_single_claim_limitation",
      "domain_id": "business",
      "assertion_text": "No complete approved label, record authenticity, export eligibility, final reblend taste, attainable premium or profit follows from these composition checks; avoid assuming the GI proves sensory quality.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-02T23:09:26.000Z"
    },
    {
      "id": "ki_d3labels_case_cl_territorial_release_action",
      "subject_id": "n_d3labels_case_cl_territorial_release",
      "relation_type": "CASE_ACTION",
      "object_id": "n_d3labels_point_case_cl_territorial_release_action",
      "domain_id": "business",
      "assertion_text": "Hold the proposed Costa-labelled release, seek complete domestic label review for a supported alternative without that supplement or a supported different lot, and confirm the shop trial before allocation.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-02T23:09:26.000Z"
    },
    {
      "id": "ki_d3labels_case_cl_territorial_release_reason",
      "subject_id": "n_d3labels_case_cl_territorial_release",
      "relation_type": "CASE_REASON",
      "object_id": "n_d3labels_point_case_cl_territorial_release_reason",
      "domain_id": "geography",
      "assertion_text": "The supplied 80% meets each ordinary 75% composition gate specified here, but 82% from declared Costa-eligible areas is below the supplementary 85% requirement; the basic D.O. gate does not authorise Costa.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-02T23:09:26.000Z"
    },
    {
      "id": "ki_d3labels_case_cl_territorial_release_tradeoff",
      "subject_id": "n_d3labels_case_cl_territorial_release",
      "relation_type": "CASE_TRADEOFF",
      "object_id": "n_d3labels_point_case_cl_territorial_release_tradeoff",
      "domain_id": "business",
      "assertion_text": "Removing the supplement adds the supplied CLP 80,000 and buyer/sample work; changing composition could affect style, volume and cost. The export enquiry lacks destination compliance and reliable commercial terms.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-02T23:09:26.000Z"
    },
    {
      "id": "ki_d3labels_case_cl_territorial_release_limitation",
      "subject_id": "n_d3labels_case_cl_territorial_release",
      "relation_type": "CASE_LIMITATION",
      "object_id": "n_d3labels_point_case_cl_territorial_release_limitation",
      "domain_id": "business",
      "assertion_text": "Supplied percentages do not authenticate records or prove all D.O./label approval. No export clearance, consistent cool-climate taste, quality tier, final selling price or profit has been demonstrated.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-02T23:09:26.000Z"
    },
    {
      "id": "ki_d3labels_case_za_cultivar_release_action",
      "subject_id": "n_d3labels_case_za_cultivar_release",
      "relation_type": "CASE_ACTION",
      "object_id": "n_d3labels_point_case_za_cultivar_release_action",
      "domain_id": "business",
      "assertion_text": "Hold the proposed cultivar-labelled release, investigate complete certified records and a supported presentation or different eligible lot, and secure the buyer's agreement before allocating stock.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-02T23:09:26.000Z"
    },
    {
      "id": "ki_d3labels_case_za_cultivar_release_reason",
      "subject_id": "n_d3labels_case_za_cultivar_release",
      "relation_type": "CASE_REASON",
      "object_id": "n_d3labels_point_case_za_cultivar_release_reason",
      "domain_id": "geography",
      "assertion_text": "The supplied local-source and 88% vintage observations meet only the specified ordinary source/year gates; the 87% contents figure does not cure the 88% grape-mass failure against 90% for cultivars combined directly after crushing.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-02T23:09:26.000Z"
    },
    {
      "id": "ki_d3labels_case_za_cultivar_release_tradeoff",
      "subject_id": "n_d3labels_case_za_cultivar_release",
      "relation_type": "CASE_TRADEOFF",
      "object_id": "n_d3labels_point_case_za_cultivar_release_tradeoff",
      "domain_id": "business",
      "assertion_text": "A supported revised presentation brings the invented R 1,500 reprint and possible loss of buyer fit; a different eligible lot consumes stock and requires actual style, cost and certification checks.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-02T23:09:26.000Z"
    },
    {
      "id": "ki_d3labels_case_za_cultivar_release_limitation",
      "subject_id": "n_d3labels_case_za_cultivar_release",
      "relation_type": "CASE_LIMITATION",
      "object_id": "n_d3labels_point_case_za_cultivar_release_limitation",
      "domain_id": "business",
      "assertion_text": "All percentages are supplied fiction, not certified records. Whole-scheme compliance, record authenticity, final sensory quality, buyer acceptance, legal approval and profit remain unknown.",
      "verification_status": "unverified",
      "mcq_disabled": true,
