{
  "knowledge_nodes": [
    {
      "id": "n_d3labels_principle_us_variety",
      "node_type": "production_principle",
      "name": "What must an ordinary US Vitis vinifera single-variety label demonstrate?"
    },
    {
      "id": "n_d3labels_point_us_variety",
      "node_type": "learning_point",
      "name": "For ordinary grape wine under 27 CFR 4.23(b), a single-variety designation requires at least 75% of the wine from that grape, with that qualifying 75% grown in the labelled appellation. An appellation is also required. Exceptions under paragraph(c) and stricter state rules must be checked separately."
    },
    {
      "id": "n_d3labels_principle_us_vintage",
      "node_type": "production_principle",
      "name": "How do federal US vintage percentages differ with AVA and other origin labels?"
    },
    {
      "id": "n_d3labels_point_us_vintage",
      "node_type": "learning_point",
      "name": "Under 27 CFR 4.27(a), a vintage claim with a viticultural-area appellation requires at least 95% from the stated harvest year; other appellations require at least 85%. The vintage and grape-origin requirements are separate, and substantiating records and other applicable rules still matter."
    },
    {
      "id": "n_d3labels_principle_au_variety",
      "node_type": "production_principle",
      "name": "What is the ordinary Australian single-variety blending threshold?"
    },
    {
      "id": "n_d3labels_point_au_variety",
      "node_type": "learning_point",
      "name": "For wine originating in Australia made from multiple varieties, section 25(2) permits a single-variety presentation only when at least 850 mL/L, or 85%, comes from that variety. Recognised names and specified calculation adjustments also apply; the threshold alone does not approve the whole label."
    },
    {
      "id": "n_d3labels_principle_au_gi",
      "node_type": "production_principle",
      "name": "What origin percentage supports one ordinary Australian registered GI claim?"
    },
    {
      "id": "n_d3labels_point_au_gi",
      "node_type": "learning_point",
      "name": "Where section 26(2)'s conditions apply—one Australian registered GI with no foreign GI or foreign place name—at least 850 mL/L, or 85%, must come from grapes grown in that GI. Multiple-GI presentation follows different conditions; the named GI does not rank sensory quality."
    },
    {
      "id": "n_d3labels_principle_au_vintage",
      "node_type": "production_principle",
      "name": "What is the ordinary Australian single-vintage percentage?"
    },
    {
      "id": "n_d3labels_point_au_vintage",
      "node_type": "learning_point",
      "name": "Section 27(2) permits wine to be presented as one vintage when at least 850 mL/L, or 85%, is obtained from grapes harvested in that vintage. The date identifies harvest year, not bottling year; multi-vintage presentation and fortified-wine calculations have separate provisions."
    },
    {
      "id": "n_d3labels_principle_cl_origin",
      "node_type": "production_principle",
      "name": "Which ordinary Chilean D.O. geographical percentage is set by Decree 464?"
    },
    {
      "id": "n_d3labels_point_cl_origin",
      "node_type": "learning_point",
      "name": "For the ordinary geographical D.O. claims governed by Decree 464 article 3(a), at least 75% of the wine must be produced from grapes from the named place. Other category, permitted-grape, certification and domestic-packaging conditions remain; Secano Interior and additional territorial terms have distinct rules."
    },
    {
      "id": "n_d3labels_principle_cl_variety",
      "node_type": "production_principle",
      "name": "What supports a Chilean D.O. single-variety claim in the ordinary case?"
    },
    {
      "id": "n_d3labels_point_cl_variety",
      "node_type": "learning_point",
      "name": "Decree 464 article 4(a) requires at least 75% of the named grape for a D.O. varietal claim, and that grape must be eligible under the applicable ordinary or Secano Interior provisions. A permitted name and enough grape do not by themselves establish all origin or label conditions."
    },
    {
      "id": "n_d3labels_principle_cl_vintage",
      "node_type": "production_principle",
      "name": "What is the domestic single-vintage minimum for a Chilean D.O. wine?"
    },
    {
      "id": "n_d3labels_point_cl_vintage",
      "node_type": "learning_point",
      "name": "Decree 464 article 5 requires at least 75% from the indicated harvest year for a D.O. vintage claim. That domestic vintage condition differs from supplementary territorial claims and may not suffice for a particular export destination."
    },
    {
      "id": "n_d3labels_principle_cl_territorial",
      "node_type": "production_principle",
      "name": "Why distinguish Costa, Andes and Entre Cordilleras from the basic Chilean D.O. gate?"
    },
    {
      "id": "n_d3labels_point_cl_territorial",
      "node_type": "learning_point",
      "name": "Article 5 bis sets at least 85% by volume from eligible areas with the stated territorial condition, declared to SAG, for Costa, Andes or Entre Cordilleras. These supplementary terms require wine produced and packaged in Chile; basic D.O. percentages do not automatically justify them."
    },
    {
      "id": "n_d3labels_principle_za_origin_exceptions",
      "node_type": "production_principle",
      "name": "How should the South African Wine of Origin rule be read?"
    },
    {
      "id": "n_d3labels_point_za_origin_exceptions",
      "node_type": "learning_point",
      "name": "Section 9(1)(a) requires origin wine solely from grapes harvested in its named production area, subject to 9(2)'s specified deeming provisions. Check those provisions and certified records rather than silently treating cellar location or an 85% varietal percentage as origin entitlement."
    },
    {
      "id": "n_d3labels_principle_za_cultivar",
      "node_type": "production_principle",
      "name": "Which South African cultivar percentages must be distinguished?"
    },
    {
      "id": "n_d3labels_point_za_cultivar",
      "node_type": "learning_point",
      "name": "For current ordinary cultivar wine, section 10(1)(a)(ii) requires at least 85% of the contents from the named cultivar. If different cultivars are combined before, during or directly after crushing, at least 90% of grape mass must be that cultivar. Section 10's other conditions and deeming provisions still apply."
    },
    {
      "id": "n_d3labels_principle_za_vintage",
      "node_type": "production_principle",
      "name": "What current South African vintage condition is separate from origin?"
    },
    {
      "id": "n_d3labels_point_za_vintage",
      "node_type": "learning_point",
      "name": "Under section 11(1)(a)(ii), at least 85% of a current vintage wine's contents must come from grapes harvested in the named year, subject to 11(2). Ordinary wine also requires the applicable origin and certification conditions. A year or certification mark does not establish one sensory style."
    },
    {
      "id": "n_d3labels_case_us_ava_release",
      "node_type": "production_case",
      "name": "A fictional New York producer proposes 'Finger Lakes Riesling 2025' for an ordinary Vitis vinifera still wine sold under federal US rules. Batch records supplied for this exercise assign 90% to grapes grown within the named approved AVA,80% to Riesling with all of that qualifying portion grown within it, and 92% to grapes harvested in 2025. It was fully finished in New York, with no class/type-altering exception invoked. The records are invented; their authenticity and any stricter state or other label rules are not established. A shop offers a 300-bottle pilot after full compliant label review. Reprinting costs a fictional $250 and delays dispatch seven days; an early dispatch penalty is $400. Compare the separate federal origin, variety and vintage gates, propose a conditional release, and assess the tradeoff. No actual label approval or sensory-quality evidence is supplied."
    },
    {
      "id": "n_d3labels_point_case_us_ava_release_action",
      "node_type": "learning_point",
      "name": "Hold the proposed vintage-labelled release and review a supported label or compliant lot composition with the responsible specialist; confirm the entire label, substantiating records and buyer acceptance before dispatch."
    },
    {
      "id": "n_d3labels_point_case_us_ava_release_reason",
      "node_type": "learning_point",
      "name": "The supplied 90% clears the separate federal AVA-origin minimum and 80% qualifying local Riesling clears the ordinary varietal minimum, but 92% of the harvest year falls below the 95% required with an AVA vintage."
    },
    {
      "id": "n_d3labels_point_case_us_ava_release_tradeoff",
      "node_type": "learning_point",
      "name": "A supported reprint would incur the supplied $250 and seven-day delay; dispatch before review exposes the invented $400 penalty and additional compliance/customer costs that have not been quantified."
    },
    {
      "id": "n_d3labels_point_case_us_ava_release_limitation",
      "node_type": "learning_point",
      "name": "The exercise clears only specified federal composition gates for ordinary vinifera wine. Record authenticity, stricter state requirements, other labelling duties, approval, buyer acceptance and actual quality or margin are not established."
    },
    {
      "id": "n_d3labels_case_au_single_claim",
      "node_type": "production_case",
      "name": "A fictional Australian cellar proposes one registered Australian GI, Chardonnay and a 2025 harvest date on an ordinary still wine. No foreign GI/place name, excluded sweetening/culture allowance or fortifying spirit affects this exercise. Supplied batch records show 87% from the claimed GI,82% Chardonnay and 86% from 2025. All proportions and trade observations are invented. A buyer will reserve 500 bottles if a compliant approved label meets its Chardonnay brief; revising the grape presentation requires buyer review and a fictional A$180 reprint. Reblending would occupy limited tank space and require fresh analyses with unknown cost and style. Compare the three composition gates, a conditional response, style/quality uncertainty and commercial consequences. Current complete records, other obligations and label approval remain absent."
    },
    {
      "id": "n_d3labels_point_case_au_single_claim_action",
      "node_type": "learning_point",
      "name": "Hold the proposed Chardonnay presentation and compare a supported revised grape description with a monitored reblend, subject to complete label review and the buyer's product brief."
    },
    {
      "id": "n_d3labels_point_case_au_single_claim_reason",
      "node_type": "learning_point",
      "name": "The supplied GI and vintage portions meet their respective 85% single-claim gates in this defined context;82% Chardonnay fails the separate ordinary single-variety 85% gate."
    },
    {
      "id": "n_d3labels_point_case_au_single_claim_tradeoff",
      "node_type": "learning_point",
      "name": "Relabelling adds the supplied A$180 and possible loss of buyer fit; reblending uses tank space, testing time and unknown cost, and can change the observed style."
    },
    {
      "id": "n_d3labels_point_case_au_single_claim_limitation",
      "node_type": "learning_point",
      "name": "No complete approved label, record authenticity, export eligibility, final reblend taste, attainable premium or profit follows from these composition checks; avoid assuming the GI proves sensory quality."
    },
    {
      "id": "n_d3labels_case_cl_territorial_release",
      "node_type": "production_case",
      "name": "A fictional Chilean ordinary D.O. wine is proposed for domestic sale with one eligible grape, a named article 1 origin, a 2025 vintage and Costa as a supplementary term. Supplied fictional records show 80% grapes from the named D.O.,80% from the eligible variety,80% from 2025 and 82% by volume from the eligible areas with the Costa condition, declared to SAG. Production and packaging occurred in Chile. Assume no Secano Interior claim; category records and remaining label conditions still need full review. A specialist shop will reconsider a 200-bottle pilot if the supplementary term is removed after compliant review, but asks for a repeat sample. A new label costs a fictional CLP 80,000; an unconfirmed export enquiry gives no destination or payment terms. Compare the basic domestic composition gates, territorial claim, product evidence and conditional route."
    },
    {
      "id": "n_d3labels_point_case_cl_territorial_release_action",
      "node_type": "learning_point",
      "name": "Hold the proposed Costa-labelled release, seek complete domestic label review for a supported alternative without that supplement or a supported different lot, and confirm the shop trial before allocation."
    },
    {
      "id": "n_d3labels_point_case_cl_territorial_release_reason",
      "node_type": "learning_point",
      "name": "The supplied 80% meets each ordinary 75% composition gate specified here, but 82% from declared Costa-eligible areas is below the supplementary 85% requirement; the basic D.O. gate does not authorise Costa."
    },
    {
      "id": "n_d3labels_point_case_cl_territorial_release_tradeoff",
      "node_type": "learning_point",
      "name": "Removing the supplement adds the supplied CLP 80,000 and buyer/sample work; changing composition could affect style, volume and cost. The export enquiry lacks destination compliance and reliable commercial terms."
    },
    {
      "id": "n_d3labels_point_case_cl_territorial_release_limitation",
      "node_type": "learning_point",
      "name": "Supplied percentages do not authenticate records or prove all D.O./label approval. No export clearance, consistent cool-climate taste, quality tier, final selling price or profit has been demonstrated."
    },
    {
      "id": "n_d3labels_case_za_cultivar_release",
      "node_type": "production_case",
      "name": "A fictional South African cellar proposes an ordinary current Wine of Origin Chenin Blanc 2025. All source grapes came from the named demarcated area, and 88% of the finished wine derives from 2025 grapes. Different cultivars were combined directly after crushing; Chenin formed 88% of that combined grape mass, although separate finished-wine records assign 87% of the wine contents to Chenin. No deemed additions, fortification or alcohol-free/dealcoholised/low-alcohol exception is invoked. Percentages and observations are invented and certification is not supplied. A retailer provisionally requests 400 bottles subject to full lawful label and quality approval. A revised supported presentation could require an invented R 1,500 reprint and a new tasting; the buyer might reject a blend. Compare origin, vintage and cultivar conditions, the relevant denominator and a conditional commercial response."
    },
    {
      "id": "n_d3labels_point_case_za_cultivar_release_action",
      "node_type": "learning_point",
      "name": "Hold the proposed cultivar-labelled release, investigate complete certified records and a supported presentation or different eligible lot, and secure the buyer's agreement before allocating stock."
    },
    {
      "id": "n_d3labels_point_case_za_cultivar_release_reason",
      "node_type": "learning_point",
      "name": "The supplied local-source and 88% vintage observations meet only the specified ordinary source/year gates; the 87% contents figure does not cure the 88% grape-mass failure against 90% for cultivars combined directly after crushing."
    },
    {
      "id": "n_d3labels_point_case_za_cultivar_release_tradeoff",
      "node_type": "learning_point",
      "name": "A supported revised presentation brings the invented R 1,500 reprint and possible loss of buyer fit; a different eligible lot consumes stock and requires actual style, cost and certification checks."
    },
    {
      "id": "n_d3labels_point_case_za_cultivar_release_limitation",
      "node_type": "learning_point",
      "name": "All percentages are supplied fiction, not certified records. Whole-scheme compliance, record authenticity, final sensory quality, buyer acceptance, legal approval and profit remain unknown."
    }
  ],
