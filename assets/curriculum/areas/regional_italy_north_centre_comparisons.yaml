# Original northern and central Italian regional comparisons.
# All facts are unverified; curation date is not a wine-law effective date.
# MCQ is disabled because site, vintage, producer and target admit plausible alternatives.
knowledge_nodes:
  - id: n_reg_inc_principle_nebbiolo_sites
