    node_type: learning_point
    name: Bolgheri sea breezes moderate conditions and ventilate vineyards
  - id: n_reg_inc_point_bolgheri_soils
    node_type: learning_point
    name: Bolgheri combines diverse marine and alluvial soil origins
  - id: n_reg_inc_principle_verdicchio_regions
    node_type: production_principle
    name: How do Castelli di Jesi and Matelica provide contrasting Verdicchio geographic contexts?
  - id: n_reg_inc_point_jesi_air
    node_type: learning_point
    name: Castelli di Jesi combines mountain air and Adriatic influence
  - id: n_reg_inc_point_matelica_inland
    node_type: learning_point
    name: Matelica is the more inland mountain context for Verdicchio
  - id: n_reg_inc_principle_orvieto_range
    node_type: production_principle
    name: Why is Orvieto origin alone insufficient for choosing a dry or sweet white-wine slot?
  - id: n_reg_inc_point_orvieto_grapes
    node_type: learning_point
    name: Orvieto white blends centre on Procanico and Grechetto
  - id: n_reg_inc_point_orvieto_sweetness
    node_type: learning_point
    name: Orvieto includes dry through sweet styles
  - id: n_reg_inc_case_nebbiolo_list
    node_type: production_case
    name: A restaurant is comparing current Barolo and Barbaresco samples for a Nebbiolo slot intended for
      drinking this year. Both wines are available now. The Barolo quote is higher; neither sample has been
      tasted and no producer or vintage style is supplied. Give a defensible selection process, explain the
      growing-context issue, discuss a price/value tradeoff and state a limitation.
  - id: n_reg_inc_point_case_nebbiolo_list_action
    node_type: learning_point
    name: Compare coded Nebbiolo samples for current readiness
  - id: n_reg_inc_point_case_nebbiolo_list_reason
    node_type: learning_point
    name: Assess Nebbiolo site and vintage instead of assuming commune style
  - id: n_reg_inc_point_case_nebbiolo_list_tradeoff
    node_type: learning_point
    name: Weigh the stated Barolo premium against customer value
  - id: n_reg_inc_point_case_nebbiolo_list_limitation
    node_type: learning_point
    name: Neither Nebbiolo name proves immediate drinking readiness
  - id: n_reg_inc_case_valpolicella_buy
    node_type: production_case
    name: A buyer needs a fresh, moderate-weight red and can compare a basic Valpolicella, a Ripasso and an
      Amarone from current suppliers. All are within the buying budget and have cuvée specifications, but
      there are no tasting results. Propose an assessment process, explain the production contrasts, discuss a
      concentration/style tradeoff and state a limitation.
  - id: n_reg_inc_point_case_valpolicella_buy_action
    node_type: learning_point
    name: Compare the three Valpolicella samples against the fresh red brief
  - id: n_reg_inc_point_case_valpolicella_buy_reason
    node_type: learning_point
    name: Distinguish fresh vinification from Ripasso and dried-grape Amarone
  - id: n_reg_inc_point_case_valpolicella_buy_tradeoff
    node_type: learning_point
    name: Greater Valpolicella concentration may conflict with the light brief
  - id: n_reg_inc_point_case_valpolicella_buy_limitation
    node_type: learning_point
    name: Valpolicella categories do not supply exact cuvée balance
  - id: n_reg_inc_case_sangiovese_plots
    node_type: production_case
    name: A Chianti Classico grower has two Sangiovese plots. Repeated observations show a higher stony plot
      developing later and a lower clay-rich plot developing earlier with more vigour. Both have healthy
      fruit; the target is balanced ripeness. No picking date or water measurements are supplied. Propose a
      monitoring approach, explain the site comparison, discuss a water-management tradeoff and state a
      limitation.
  - id: n_reg_inc_point_case_sangiovese_plots_action
    node_type: learning_point
    name: Monitor each Sangiovese plot before picking
  - id: n_reg_inc_point_case_sangiovese_plots_reason
    node_type: learning_point
    name: Higher Sangiovese sites may develop more slowly
  - id: n_reg_inc_point_case_sangiovese_plots_tradeoff
    node_type: learning_point
    name: Balance upper stress against lower wetness
  - id: n_reg_inc_point_case_sangiovese_plots_limitation
    node_type: learning_point
    name: Plot observations do not yet establish the harvest date
  - id: n_reg_inc_case_white_slots
    node_type: production_case
    name: A restaurant needs one dry central Italian white for its main wine-list slot and one sweet white for
      dessert. Current offers are a Verdicchio dei Castelli di Jesi, an Orvieto secco and an Orvieto dolce.
      Samples, cuvée details and landed quotes are available, but no tasting results are supplied. Propose an
      allocation process, explain the grape/origin issue, discuss a value tradeoff and state a limitation.
  - id: n_reg_inc_point_case_white_slots_action
    node_type: learning_point
    name: Check and taste the central Italian whites before allocating slots
  - id: n_reg_inc_point_case_white_slots_reason
    node_type: learning_point
    name: Orvieto blend identity does not fix the finished sweetness
  - id: n_reg_inc_point_case_white_slots_tradeoff
    node_type: learning_point
    name: Weigh central Italian white style fit against landed value
  - id: n_reg_inc_point_case_white_slots_limitation
    node_type: learning_point
    name: Central Italian white aromas cannot prove origin or dessert suitability
