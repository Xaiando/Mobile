  - id: n_reg_inc_point_classico_altitude
    node_type: learning_point
    name: Higher Chianti Classico sites often ripen later
  - id: n_reg_inc_point_classico_water
    node_type: learning_point
    name: Chianti Classico slopes vary in water retention
