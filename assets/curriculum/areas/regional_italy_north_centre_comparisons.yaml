    name: Why do Barolo and Barbaresco Nebbiolo comparisons need site and ripening context?
  - id: n_reg_inc_point_nebbiolo_cycle
    node_type: learning_point
    name: Nebbiolo buds relatively early and ripens late
  - id: n_reg_inc_point_nebbiolo_site
