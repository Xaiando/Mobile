knowledge_items:
  - id: ki_reg_inc_nebbiolo_cycle
    subject_id: n_reg_inc_principle_nebbiolo_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_inc_point_nebbiolo_cycle
    domain_id: viticulture
    assertion_text: Nebbiolo combines relatively early budbreak with late ripening, so a Piedmont comparison
      should consider both spring cold exposure and the conditions available at the end of the growing season.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_nebbiolo_site
    subject_id: n_reg_inc_principle_nebbiolo_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_inc_point_nebbiolo_site
    domain_id: viticulture
    assertion_text: Nebbiolo is sensitive to exposure, temperature, moisture and soil water conditions. Wines from
      nearby Langhe sites can therefore differ; the grape name alone does not fix a Barolo or Barbaresco
      style.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_barbera_timing
    subject_id: n_reg_inc_principle_barbera_dolcetto
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_inc_point_barbera_timing
    domain_id: viticulture
    assertion_text: The consortium describes Barbera harvest as late September to early October and Dolcetto
      harvest as September. This is a typical regional sequence, rather than a fixed date for every site or
      vintage.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_dolcetto_dry
    subject_id: n_reg_inc_principle_barbera_dolcetto
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_inc_point_dolcetto_dry
    domain_id: geography
    assertion_text: The name Dolcetto does not mean a sweet finished wine. The consortium describes dry wines with
      modest acidity, ranging from youthful examples to more structured wines depending on site and
      vinification.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_valpolicella_fresh
    subject_id: n_reg_inc_principle_valpolicella_styles
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_inc_point_valpolicella_fresh
    domain_id: winemaking
    assertion_text: The consortium presents basic Valpolicella as a youthful, fresh wine made by conventional red
      vinification and a relatively short maturation. This description does not define all Superiore cuvées.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_amarone_drying
    subject_id: n_reg_inc_principle_valpolicella_styles
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_inc_point_amarone_drying
    domain_id: winemaking
    assertion_text: For Amarone, drying precedes vinification and concentrates berry constituents; subsequent
      fermentation produces a dry red with relatively high alcohol. Drying does not itself mean the finished
      wine must be sweet.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_ripasso_pomace
    subject_id: n_reg_inc_principle_ripasso_process
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_inc_point_ripasso_pomace
    domain_id: winemaking
    assertion_text: Ripasso uses an existing basic Valpolicella wine for refermentation on pomace from Amarone
      and/or Recioto. This differs from making Amarone directly from dried grapes.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_ripasso_structure
    subject_id: n_reg_inc_principle_ripasso_process
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_inc_point_ripasso_structure
    domain_id: winemaking
    assertion_text: The additional Ripasso process can increase alcohol, phenolic substances and extract compared
      with the basic wine used. The degree of change and final balance still depend on the starting wine and
      production choices.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_garganega_later
    subject_id: n_reg_inc_principle_soave_grapes
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_inc_point_garganega_later
    domain_id: viticulture
    assertion_text: Garganega has relatively loose bunches suited to air drying and ripens later than Trebbiano di
      Soave. Harvest and drying decisions vary with conditions and the intended wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_trebbiano_freshness
    subject_id: n_reg_inc_principle_soave_grapes
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_inc_point_trebbiano_freshness
    domain_id: winemaking
    assertion_text: The consortium describes Trebbiano di Soave as earlier ripening, relatively neutral and high
      in malic acid, making it a potential freshness component in a Soave blend. Final acidity also depends on
      harvest and cellar practice.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_alto_adige_air
    subject_id: n_reg_inc_principle_alto_adige_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_inc_point_alto_adige_air
    domain_id: geography
    assertion_text: The Alps shelter Alto Adige from northern cold, wet air masses, while warmer air can arrive
      from the south via Lake Garda and the Mediterranean. Alpine location alone therefore does not describe
      its whole growing climate.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_alto_adige_variation
    subject_id: n_reg_inc_principle_alto_adige_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_inc_point_alto_adige_variation
    domain_id: viticulture
    assertion_text: Alto Adige vineyards occupy varied elevations and topography, with substantial local climate
      differences. Site and variety choices are needed before predicting ripening or wine style from the
      regional name.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_friuli_ponca
    subject_id: n_reg_inc_principle_friuli_hills
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_inc_point_friuli_ponca
    domain_id: geography
    assertion_text: Friuli Colli Orientali hills include alternating marl and sandstone. Growers have shaped
      slopes into vineyard terraces; the geological description does not establish a mineral flavour in wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_friuli_position
    subject_id: n_reg_inc_principle_friuli_hills
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_inc_point_friuli_position
    domain_id: geography
    assertion_text: The consortium describes the Julian Alps behind Friuli Colli Orientali and the Adriatic in
      front, with shelter from northern cold currents and ventilation. This is regional context rather than an
      identical microclimate for every plot.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_classico_altitude
    subject_id: n_reg_inc_principle_chianti_site_gradients
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_inc_point_classico_altitude
    domain_id: viticulture
    assertion_text: Higher Chianti Classico sites often develop later than warmer lower sites; exposure and actual
      conditions can modify this comparison.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_classico_water
    subject_id: n_reg_inc_principle_chianti_site_gradients
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_inc_point_classico_water
    domain_id: viticulture
    assertion_text: Stony upper slopes may face water stress; clay-rich lower positions may retain water but
      become excessively wet. Quality is not implied.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_classico_heartland
    subject_id: n_reg_inc_principle_chianti_identity
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_inc_point_classico_heartland
    domain_id: geography
    assertion_text: Chianti Classico is associated with the historic wine territory between Florence and Siena.
      Keeping Classico in the name preserves this geographic identity when comparing it with wines labelled
      Chianti.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_chianti_separate
    subject_id: n_reg_inc_principle_chianti_identity
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_inc_point_chianti_separate
    domain_id: geography
    assertion_text: Chianti Classico gained an autonomous production code separate from generic Chianti. Classico
      should not be treated simply as a more expensive quality tier of every Chianti wine; the geographic and
      production identities differ.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_sangiovese_material
    subject_id: n_reg_inc_principle_sangiovese_vineyard_choices
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_inc_point_sangiovese_material
    domain_id: viticulture
    assertion_text: The Chianti Classico 2000 project compared clonal behaviour and rootstock suitability.
      Sangiovese grape identity alone is insufficient to explain performance when plant material and the
      growing environment differ.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_sangiovese_design
    subject_id: n_reg_inc_principle_sangiovese_vineyard_choices
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_inc_point_sangiovese_design
    domain_id: viticulture
    assertion_text: Chianti Classico research considered planting density in relation to environment and
      production goals, and training in relation to grape/wine outcomes and pruning costs. A single density or
      training system is not automatically best for all regional sites.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_brunello_maturation
    subject_id: n_reg_inc_principle_montalcino_styles
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_inc_point_brunello_maturation
    domain_id: geography
    assertion_text: The consortium contrasts Brunello, with its long maturation and ageing orientation, with a
      younger Rosso di Montalcino style. This gives a production and buying comparison without proving that
      every Brunello needs further bottle age.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_rosso_youth
    subject_id: n_reg_inc_principle_montalcino_styles
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_inc_point_rosso_youth
    domain_id: geography
    assertion_text: Rosso di Montalcino is presented as a fresher, fruit-focused Sangiovese wine generally suited
      to younger drinking. Individual producer choices and vintage can still make a specific Rosso more
      structured than the broad description suggests.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_bolgheri_breeze
    subject_id: n_reg_inc_principle_bolgheri_terroir
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_inc_point_bolgheri_breeze
    domain_id: geography
    assertion_text: Bolgheri faces the Tyrrhenian Sea and receives cooling, ventilating sea breezes. This coastal
      influence is useful context when comparing an actual site with inland Tuscany, but does not guarantee a
      fixed acidity or quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_bolgheri_soils
    subject_id: n_reg_inc_principle_bolgheri_terroir
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_inc_point_bolgheri_soils
    domain_id: geography
    assertion_text: Bolgheri soils have marine and alluvial origins with considerable variation over small
      distances. The consortium links this diversity with varied planting choices; a single regional soil
      label cannot explain every cuvée.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_jesi_air
    subject_id: n_reg_inc_principle_verdicchio_regions
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_inc_point_jesi_air
    domain_id: geography
    assertion_text: The Istituto Marchigiano describes the Castelli di Jesi area as receiving mountain air and
      Adriatic winds. The same Verdicchio grape can therefore be compared across local sites rather than
      assigned one regional taste.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_matelica_inland
    subject_id: n_reg_inc_principle_verdicchio_regions
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_inc_point_matelica_inland
    domain_id: geography
    assertion_text: Matelica is described as the inland, mountain counterpart to the more sea-influenced Castelli
      di Jesi setting. This is a broad geographic comparison; vintage, site and cellar details are still
      required for an actual wine comparison.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_orvieto_grapes
    subject_id: n_reg_inc_principle_orvieto_range
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_inc_point_orvieto_grapes
    domain_id: geography
    assertion_text: The Orvieto consortium identifies Procanico and Grechetto as central components alongside
      other white grapes. This describes the regional blend emphasis, not a complete legal list or a single
      producer recipe.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_orvieto_sweetness
    subject_id: n_reg_inc_principle_orvieto_range
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_inc_point_orvieto_sweetness
    domain_id: geography
    assertion_text: Orvieto covers secco, abboccato, amabile and dolce styles, with additional late-harvest and
      noble-rot expressions. Confirm the actual cuvée sweetness and specification rather than assume all
      Orvieto is dry.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_case_nebbiolo_list_action
    subject_id: n_reg_inc_case_nebbiolo_list
    relation_type: CASE_ACTION
    object_id: n_reg_inc_point_case_nebbiolo_list_action
    domain_id: geography
    assertion_text: Taste both current samples under comparable coded conditions, assess their structure and
      present readiness against the restaurant brief, and then compare the supplied quotes. Either wine could
      be suitable.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_case_nebbiolo_list_reason
    subject_id: n_reg_inc_case_nebbiolo_list
    relation_type: CASE_REASON
    object_id: n_reg_inc_point_case_nebbiolo_list_reason
    domain_id: viticulture
    assertion_text: Nebbiolo responds strongly to exposure and growing conditions. Site and vintage therefore help
      explain the actual wines, rather than assuming every Barolo is firmer or less ready than every
      Barbaresco.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_case_nebbiolo_list_tradeoff
    subject_id: n_reg_inc_case_nebbiolo_list
    relation_type: CASE_TRADEOFF
    object_id: n_reg_inc_point_case_nebbiolo_list_tradeoff
    domain_id: business
    assertion_text: The given higher Barolo quote needs to be weighed against the actual style fit and value to
      customers. Origin reputation may matter to demand, but cannot by itself justify the premium for this
      slot.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_case_nebbiolo_list_limitation
    subject_id: n_reg_inc_case_nebbiolo_list
    relation_type: CASE_LIMITATION
    object_id: n_reg_inc_point_case_nebbiolo_list_limitation
    domain_id: geography
    assertion_text: Barolo or Barbaresco on the label cannot establish current drinking readiness or the
      restaurant best buy. The sample, producer, vintage and intended service are still needed.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_case_valpolicella_buy_action
    subject_id: n_reg_inc_case_valpolicella_buy
    relation_type: CASE_ACTION
    object_id: n_reg_inc_point_case_valpolicella_buy_action
    domain_id: geography
    assertion_text: Check the cuvée data and compare coded samples for weight, freshness and alcohol balance.
      Basic Valpolicella is a sensible candidate to assess first, but none should be selected solely by
      category.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_case_valpolicella_buy_reason
    subject_id: n_reg_inc_case_valpolicella_buy
    relation_type: CASE_REASON
    object_id: n_reg_inc_point_case_valpolicella_buy_reason
    domain_id: winemaking
    assertion_text: Basic Valpolicella is conventionally vinified, Ripasso referments a base wine on Amarone or
      Recioto pomace, and Amarone is vinified from dried grapes. These different routes help explain potential
      weight and concentration.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_case_valpolicella_buy_tradeoff
    subject_id: n_reg_inc_case_valpolicella_buy
    relation_type: CASE_TRADEOFF
    object_id: n_reg_inc_point_case_valpolicella_buy_tradeoff
    domain_id: winemaking
    assertion_text: Extra concentration or structure can be attractive but may make the wine feel heavier than the
      requested fresh, moderate-weight style. Assess the actual balance rather than equate intensity with
      suitability.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_case_valpolicella_buy_limitation
    subject_id: n_reg_inc_case_valpolicella_buy
    relation_type: CASE_LIMITATION
    object_id: n_reg_inc_point_case_valpolicella_buy_limitation
    domain_id: geography
    assertion_text: A category does not reveal the exact alcohol, sweetness, oak influence or freshness of an
      individual cuvée. Supplier details and sample assessment remain necessary, even when all quotes fit the
      budget.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_case_sangiovese_plots_action
    subject_id: n_reg_inc_case_sangiovese_plots
    relation_type: CASE_ACTION
    object_id: n_reg_inc_point_case_sangiovese_plots_action
    domain_id: viticulture
    assertion_text: Monitor each plot against the shared ripeness target; the observed timing difference does not
      justify one automatic picking date.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_case_sangiovese_plots_reason
    subject_id: n_reg_inc_case_sangiovese_plots
    relation_type: CASE_REASON
    object_id: n_reg_inc_point_case_sangiovese_plots_reason
    domain_id: viticulture
    assertion_text: The given timing fits a cooler higher-site cycle and earlier lower-site cycle, subject to
      exposure and measurement checks.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_case_sangiovese_plots_tradeoff
    subject_id: n_reg_inc_case_sangiovese_plots
    relation_type: CASE_TRADEOFF
    object_id: n_reg_inc_point_case_sangiovese_plots_tradeoff
    domain_id: viticulture
    assertion_text: The upper plot may face water stress, while lower clay may retain excess moisture. Respond to
      measurements rather than prescribe identical management.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_case_sangiovese_plots_limitation
    subject_id: n_reg_inc_case_sangiovese_plots
    relation_type: CASE_LIMITATION
    object_id: n_reg_inc_point_case_sangiovese_plots_limitation
    domain_id: viticulture
    assertion_text: The supplied developmental observations do not establish sugar, acidity, phenolic ripeness or
      a best picking date. Site response and vineyard choices must be assessed rather than treating one
      altitude or training system as decisive.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_case_white_slots_action
    subject_id: n_reg_inc_case_white_slots
    relation_type: CASE_ACTION
    object_id: n_reg_inc_point_case_white_slots_action
    domain_id: geography
    assertion_text: Confirm sweetness and cuvée details, then assess the actual samples against each slot. Compare
      the dry candidates for the main list and evaluate the Orvieto dolce against the dessert brief without
      assuming suitability from its name alone.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_case_white_slots_reason
    subject_id: n_reg_inc_case_white_slots
    relation_type: CASE_REASON
    object_id: n_reg_inc_point_case_white_slots_reason
    domain_id: geography
    assertion_text: Orvieto blends centred on Procanico and Grechetto can have different sweetness styles. Grape
      and origin information therefore complements rather than replaces the specific cuvée designation and
      assessment.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_case_white_slots_tradeoff
    subject_id: n_reg_inc_case_white_slots
    relation_type: CASE_TRADEOFF
    object_id: n_reg_inc_point_case_white_slots_tradeoff
    domain_id: business
    assertion_text: A wine that meets the style brief still needs a workable landed cost and customer value. Use
      the actual quotes and customer expectations rather than presume Verdicchio or Orvieto is universally
      cheaper or better.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
  - id: ki_reg_inc_case_white_slots_limitation
    subject_id: n_reg_inc_case_white_slots
    relation_type: CASE_LIMITATION
    object_id: n_reg_inc_point_case_white_slots_limitation
    domain_id: geography
    assertion_text: Aromas alone cannot prove the geographic origin or full suitability of these whites. Confirm
      sweetness, balance and producer details, and treat the regional descriptions as context for the actual
      samples.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T05:49:30.000Z
