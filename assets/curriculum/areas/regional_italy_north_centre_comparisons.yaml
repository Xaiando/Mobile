  - id: n_reg_inc_point_valpolicella_fresh
    node_type: learning_point
    name: Basic Valpolicella uses conventional red vinification and short maturation
  - id: n_reg_inc_point_amarone_drying
    node_type: learning_point
    name: Amarone uses dried grapes for a concentrated dry red style
  - id: n_reg_inc_principle_ripasso_process
