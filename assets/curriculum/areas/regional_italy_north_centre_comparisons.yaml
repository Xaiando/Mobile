  - id: n_reg_inc_point_ripasso_structure
    node_type: learning_point
    name: Ripasso can increase alcohol and extract compared with its base wine
  - id: n_reg_inc_principle_soave_grapes
    node_type: production_principle
    name: How do Garganega and Trebbiano di Soave differ as growing and blending components?
  - id: n_reg_inc_point_garganega_later
    node_type: learning_point
    name: Garganega ripens later with loose bunches suited to drying
  - id: n_reg_inc_point_trebbiano_freshness
    node_type: learning_point
    name: Trebbiano di Soave can contribute malic acidity to a blend
  - id: n_reg_inc_principle_alto_adige_sites
    node_type: production_principle
    name: Why can two Alto Adige vineyards have different growing conditions despite an Alpine location?
  - id: n_reg_inc_point_alto_adige_air
    node_type: learning_point
    name: Alto Adige combines Alpine shelter and warmer southern air
  - id: n_reg_inc_point_alto_adige_variation
    node_type: learning_point
    name: Alto Adige altitude and terrain create contrasting local climates
  - id: n_reg_inc_principle_friuli_hills
