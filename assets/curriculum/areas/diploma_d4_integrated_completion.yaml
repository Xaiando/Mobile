{
  "knowledge_nodes": [
    {
      "id": "n_d4c_press_fraction_principle",
      "node_type": "production_principle",
      "name": "What does a sparkling press-fraction trial need before choosing yield over delicacy?"
    },
    {
      "id": "n_d4c_press_fraction_point",
      "node_type": "learning_point",
      "name": "Compare fractions by sensory and analytical suitability, then price usable yield and separation."
    },
    {
      "id": "n_d4c_method_cost_principle",
      "node_type": "production_principle",
      "name": "Why must a transfer-method offer identify both fermentation and clarification stages?"
    },
    {
      "id": "n_d4c_method_cost_point",
      "node_type": "learning_point",
      "name": "Bottle fermentation and bulk clarification are different process stages."
    },
    {
      "id": "n_d4c_ancestral_release_principle",
      "node_type": "production_principle",
      "name": "What extra evidence is needed before releasing an ancestral-method wine with fermentable sugar?"
    },
    {
      "id": "n_d4c_ancestral_release_point",
      "node_type": "learning_point",
      "name": "Establish fermentation, pressure and stability before promising a settled finished style."
    },
    {
      "id": "n_d456_case_champagne_stock",
      "node_type": "production_case",
      "name": "Original fictional Champagne planning exercise. Grower fruit contracted from two sites arrives after different ripening rates; the early-picked lot has higher measured acidity. A house's brief is a consistent, fresh non-vintage blend, not a single-vintage claim. Separate first and later press fractions have coded trial notes; a reserve blend meets the brief better than this year's unblended lot. Its usable yield is 8% lower and storage space is limited. A merchant offers payment after 60 days; cellar-door orders are prepaid but require producer delivery. These figures, findings and offers are invented. No complete costing, credit check or certification evidence is supplied. Recommend a conditional vineyard/press/blend and sales plan, explaining sensory evidence, cost and uncertainty."
    },
    {
      "id": "n_d456_champagne_stock_action_point",
      "node_type": "learning_point",
      "name": "Pilot the tested reserve blend with selected press fractions and verify a funded release plan."
    },
    {
      "id": "n_d456_champagne_stock_reason_point",
      "node_type": "learning_point",
      "name": "Different parcel ripeness and fraction records make lot selection relevant; the coded trial supports this blend's fit."
    },
    {
      "id": "n_d456_champagne_stock_tradeoff_point",
      "node_type": "learning_point",
      "name": "Lower usable yield and holding reserves compete with stock continuity; prepaid orders trade quicker cash for delivery work."
    },
    {
      "id": "n_d456_champagne_stock_limitation_point",
      "node_type": "learning_point",
      "name": "Check repeat sensory and stability results, full costs, cash timing, buyer credit and approval; house reputation cannot guarantee profitability."
    },
    {
      "id": "n_d456_case_cremant_loire",
      "node_type": "production_case",
      "name": "Original fictional comparison of Crémant d'Alsace, Crémant de Bourgogne, Crémant de Loire, Saumur and Vouvray. Supplier dossiers identify the actual grape blends, whole-bunch handling, parcel harvest dates, acidity, malolactic choices, reserve use and bottle-fermentation records. A fresh aperitif brief and a fuller food-pairing brief are separate. A coded tasting favours an Alsace lot for the first and a Chenin-led Vouvray lot for the second; Bourgogne, Loire and Saumur alternatives cost less but their samples have not arrived. All supplier findings, price rankings and preferences are fictional, not regional rankings. Two suppliers require larger minimum orders and later delivery. Design a comparison and conditional purchase decision without assuming that appellation establishes taste or margin."
    },
    {
      "id": "n_d456_cremant_loire_action_point",
      "node_type": "learning_point",
      "name": "Retain the two trial fits provisionally and taste the other named products against each brief before ordering."
    },
    {
      "id": "n_d456_cremant_loire_reason_point",
      "node_type": "learning_point",
      "name": "Compare supplied grape, harvest, acidity and cellar records to the actual observations rather than substitute a generic French sparkling profile."
    },
    {
      "id": "n_d456_cremant_loire_tradeoff_point",
      "node_type": "learning_point",
      "name": "Separate style slots may justify two purchases, but minimum orders and delivery dates can outweigh apparent unit-price savings."
    },
    {
      "id": "n_d456_cremant_loire_limitation_point",
      "node_type": "learning_point",
      "name": "Verify dossiers, samples, usable order volumes, label approval and landed costs; one trial does not rank whole appellations."
    },
    {
      "id": "n_d456_case_prosecco_supply",
      "node_type": "production_case",
      "name": "Original fictional Prosecco comparison. An accessible plain-site Glera lot has mechanised-harvest access and quick cellar transport; a named hillside supplier quotes more hand labour. Trial tank-fermented A fits a fresh-fruit launch in six weeks, while the hillside B proposal needs ten weeks and has no sample. The supplier proposes a Rive statement but has supplied no supporting records. A retailer requests a large discounted promotion with payment after 45 days; a specialist offers a small prepaid pilot. All site records, timings, offers and trial results are fictional. Neither actual permitted yields nor grape percentages are stated. Recommend a conditional production and market plan."
    },
    {
      "id": "n_d456_prosecco_supply_action_point",
      "node_type": "learning_point",
      "name": "Pilot documented A for the six-week brief while seeking B's sample and designation evidence."
    },
    {
      "id": "n_d456_prosecco_supply_reason_point",
      "node_type": "learning_point",
      "name": "A's supplied readiness and fruit-fit evidence are relevant; hillside source or proposed Rive wording cannot replace those findings."
    },
    {
      "id": "n_d456_prosecco_supply_tradeoff_point",
      "node_type": "learning_point",
      "name": "A larger discounted promotion increases volume exposure and delays cash; the stated prepaid pilot brings receipts earlier, but compare measured audience reach and demand for both offers."
    },
    {
      "id": "n_d456_prosecco_supply_limitation_point",
      "node_type": "learning_point",
      "name": "Check protected-name records, total production and delivery costs, stock financing, actual demand and repeat sample quality."
    },
    {
      "id": "n_d456_case_asti_aroma",
      "node_type": "production_case",
      "name": "Original fictional aromatic sparkling exercise, not an authentic Asti or Moscato d'Asti tasting. A supplier describes chilled aromatic Muscat must with fermentation stopped to preserve sweetness; the confirmed sample is sweet, aromatic and low in alcohol. Another supplier's traditional-method dry blend has more developed lees notes. A buyer asks for a sweet aromatic aperitif, while a restaurant asks for a dry savoury pairing. Must-storage cost, filtration/stability records and package pressure are missing. An advertising draft treats Asti and Moscato d'Asti as identical pressure and alcohol categories. All observations, requests and missing-record assumptions are fictional. Evaluate the two separate briefs and the unsupported category claim."
    },
    {
      "id": "n_d456_asti_aroma_action_point",
      "node_type": "learning_point",
      "name": "Provisionally trial the aromatic sweet sample for the sweet brief and assess the dry sample separately."
    },
    {
      "id": "n_d456_asti_aroma_reason_point",
      "node_type": "learning_point",
      "name": "Stopped fermentation preserves a different sugar/aroma balance from a completed dry base followed by bottle fermentation."
    },
    {
      "id": "n_d456_asti_aroma_tradeoff_point",
      "node_type": "learning_point",
      "name": "Cold must handling and stability controls carry costs; an aromatic sweet slot and a dry lees-driven slot address different demand."
    },
    {
      "id": "n_d456_asti_aroma_limitation_point",
      "node_type": "learning_point",
      "name": "Authenticate product category and package pressure, stability, costs and serving condition; the draft cannot establish identical category specifications."
    },
    {
      "id": "n_d456_case_italian_bottle",
      "node_type": "production_case",
      "name": "Original fictional Franciacorta and Trentodoc comparison. A Franciacorta supplier's parcel record shows moderate harvest acidity, while the Trentino mountain parcel records cooler nights and higher acidity that season. Both dossiers describe bottle fermentation; MLF use, base-wine oak and reserve proportions differ. The supplied panel finds one rounder and the other sharper, but fruit source and cellar methods also differ. The buyer wants freshness with some developed complexity at a fixed landed budget. One quoted older release ties up twice the buyer's stock budget and arrives too late for the first launch. All observations, times and amounts are hypothetical, not appellation-wide claims."
    },
    {
      "id": "n_d456_italian_bottle_action_point",
      "node_type": "learning_point",
      "name": "Compare coded samples against the budget and launch brief, provisionally retaining the on-time fit."
    },
    {
      "id": "n_d456_italian_bottle_reason_point",
      "node_type": "learning_point",
      "name": "Site records and cellar choices both plausibly contribute, so the comparison cannot isolate altitude or MLF as the sole cause."
    },
    {
      "id": "n_d456_italian_bottle_tradeoff_point",
      "node_type": "learning_point",
      "name": "Longer stock holding and small purchases may support developed styles but can increase financing and unit handling cost."
    },
    {
      "id": "n_d456_italian_bottle_limitation_point",
      "node_type": "learning_point",
      "name": "Check actual category approval, landed quotes, readiness and repeat panel evidence; more lees time is not a quality guarantee."
    },
    {
      "id": "n_d456_case_lambrusco_pairing",
      "node_type": "production_case",
      "name": "Original fictional Lambrusco comparison. Sorbara, Salamino and Grasparossa supplier records identify grape, plain or foothill source, harvest date, extraction and residual sweetness; the buyer cannot use 'Lambrusco' as a sweetness test. Coded A is pale, dry and fresh; B is darker, more tannic and dry; C is sweeter. The supplied panel prefers A for a light lunch and B for a richer dish. A cellar proposal increases maceration for A without a new trial, while a promotion proposes C for all guests because it has the lowest unit price. All observations, site details and offers are invented and do not establish universal styles."
    },
    {
      "id": "n_d456_lambrusco_pairing_action_point",
      "node_type": "learning_point",
      "name": "Keep A and B as conditional dish-specific choices and trial any extraction change before scaling it."
    },
    {
      "id": "n_d456_lambrusco_pairing_reason_point",
      "node_type": "learning_point",
      "name": "The supplied colour, tannin and sweetness findings distinguish actual bottles; category and grape help frame but do not replace the evidence."
    },
    {
      "id": "n_d456_lambrusco_pairing_tradeoff_point",
      "node_type": "learning_point",
      "name": "Two style slots increase inventory complexity, while one cheap sweet offer risks a mismatch to dry-wine requests."
    },
    {
      "id": "n_d456_lambrusco_pairing_limitation_point",
      "node_type": "learning_point",
      "name": "Check repeat trials, demand, residual-sugar and label records, wastage and full landed costs before setting quantities."
    },
    {
      "id": "n_d456_case_cava_water",
      "node_type": "production_case",
      "name": "Original fictional Cava vineyard and release exercise. A grower dossier records a dry season, water stress in Xarel-lo and variable disease pressure in a second parcel. Supplier A has complete organic certification and traceability records; supplier B only supplies a marketing claim. A preliminary base blend meets the acidity and structure brief, but the producer plans a longer-held category and cash is insufficient for the quoted storage bill. A merchant asks for a low-price early launch; a specialist offers a small later allocation. All agronomic records, costs, sample findings and offers are fictional. Current category compliance is to be independently checked; no new numeric ageing rule is supplied."
    },
    {
      "id": "n_d456_cava_water_action_point",
      "node_type": "learning_point",
      "name": "Review parcel water and disease evidence, verify the category records, and scale a funded release to the tested blend."
    },
    {
      "id": "n_d456_cava_water_reason_point",
      "node_type": "learning_point",
      "name": "Healthy suitable fruit, documented provenance and actual base-wine balance matter alongside any proposed category."
    },
    {
      "id": "n_d456_cava_water_tradeoff_point",
      "node_type": "learning_point",
      "name": "A later allocation may allow the intended cellar plan but delays revenue; an early order cannot erase required holding or funding needs."
    },
    {
      "id": "n_d456_cava_water_limitation_point",
      "node_type": "learning_point",
      "name": "Obtain actual current eligibility, vineyard treatment and certification records, total costs and buyer demand; a sustainability slogan proves neither compliance nor quality."
    },
    {
      "id": "n_d456_case_british_vintage",
      "node_type": "production_case",
      "name": "Original fictional England and Wales harvest/stock planning exercise. Two Chardonnay/Pinot Noir growers supply weather, budburst and frost logs for their actual parcels; the English parcel lost 25% of expected fruit and the Welsh parcel did not. The planned sparkling blend needs sound acidic fruit; base-wine trials are promising but wet harvest weather is forecast. Emergency fruit offers differ in ripeness and traceability. A launch promise assumes last year's volume and a uniform British vintage. All loss, forecasts, offers and findings are invented. Propose a contingent harvest and release plan, accounting for quality checks, vineyard protection costs and customer communication."
    },
    {
      "id": "n_d456_british_vintage_action_point",
      "node_type": "learning_point",
      "name": "Reforecast volume from actual parcel evidence, assess sound replacement fruit and communicate a conditional allocation."
    },
    {
      "id": "n_d456_british_vintage_reason_point",
      "node_type": "learning_point",
      "name": "The supplied frost and harvest records affect available fruit and brief suitability; country names cannot establish one shared vintage outcome."
    },
    {
      "id": "n_d456_british_vintage_tradeoff_point",
      "node_type": "learning_point",
      "name": "Protection, sorting and alternative sourcing can preserve usable volume while raising costs and changing the blend."
    },
    {
      "id": "n_d456_british_vintage_limitation_point",
      "node_type": "learning_point",
      "name": "Confirm forecast, fruit health, acidity, origin and approval records, financing and demand; the packet cannot prove either national crop size or final wine quality."
    },
    {
      "id": "n_d456_case_us_site_method",
      "node_type": "production_case",
      "name": "Original fictional California, Oregon and Washington comparison. Three Chardonnay/Pinot Noir base dossiers provide actual coastal cooling, Willamette seasonal rain and eastern Washington irrigation logs, respectively. Harvest acidity differs; trials also differ in MLF, oak and lees holding. A coded panel prefers California A for a fresh aperitif and Oregon B for a developed style; Washington C has no final sample. These are invented site-specific findings, not statewide rankings. A custom processor can bottle small lots for a fee; an estate facility has available equipment but insufficient storage for the full holding plan. Orders differ in price and payment delay. Compare the production and business options without inferring fermentation method from state origin."
    },
    {
      "id": "n_d456_us_site_method_action_point",
      "node_type": "learning_point",
      "name": "Make separate provisional style allocations and cost small-lot processing versus the estate's actual storage constraint."
    },
    {
      "id": "n_d456_us_site_method_reason_point",
      "node_type": "learning_point",
      "name": "Actual site and harvest records help interpret bases, while multiple cellar differences prevent attribution to state or climate alone."
    },
    {
      "id": "n_d456_us_site_method_tradeoff_point",
      "node_type": "learning_point",
      "name": "Outsourcing may solve capacity but adds a fee and coordination; estate processing retains control while tying up storage."
    },
    {
      "id": "n_d456_us_site_method_limitation_point",
      "node_type": "learning_point",
      "name": "Request C's sample, repeat trials, authentic method and label records, complete quotes and cash forecasts before committing volume."
    },
    {
      "id": "n_d456_case_chile_method",
      "node_type": "production_case",
      "name": "Original fictional Chilean sparkling plan. A coastal Casablanca Chardonnay parcel's supplied log records slow ripening and sound acidic fruit; an inland lot's log shows riper fruit and less acidity. A tank trial gives the requested fresh-fruit profile and readiness in eight weeks. A bottle-fermented trial is intended for later lees development and cannot meet the same launch. The two lots also use different yeast and MLF choices, so this is not a controlled method trial. Export demand is a tentative enquiry with no deposit; domestic restaurant demand is confirmed for a smaller quantity. All findings, timings and demand are invented. Evaluate a contingent production allocation."
    },
    {
      "id": "n_d456_chile_method_action_point",
      "node_type": "learning_point",
      "name": "Use a funded small tank-trial allocation for the confirmed fresh-fruit brief and keep the later bottle lot conditional."
    },
    {
      "id": "n_d456_chile_method_reason_point",
      "node_type": "learning_point",
      "name": "The supplied parcel and sensory evidence supports the immediate trial; different cellar choices prevent a sole-method causal conclusion."
    },
    {
      "id": "n_d456_chile_method_tradeoff_point",
      "node_type": "learning_point",
      "name": "A later developed release ties up stock and may reach another customer, while a smaller confirmed launch limits speculative export exposure."
    },
    {
      "id": "n_d456_chile_method_limitation_point",
      "node_type": "learning_point",
      "name": "Check full costs, stability and transport, actual label eligibility, credit and repeat demand; a coastal source alone guarantees neither acidity nor quality."
    },
    {
      "id": "n_d456_case_argentina_capacity",
      "node_type": "production_case",
      "name": "Original fictional Argentine producer exercise. Mendoza Chardonnay/Pinot Noir parcels supply harvest sugar/acidity and irrigation records; another parcel offers later riper fruit for a different blend. A tested fresh tank-fermented blend is ready for a domestic launch. A larger bottle-fermented proposal needs additional storage and unresolved cash financing. A distributor cites the INV's 2023 dispatch report as proof of current demand for this producer's premium export lot. The report is historical; no current orders, prices or source-origin records are supplied. All parcel findings, production schedules and commercial offers are fictional. Compare the allocation and the claim, distinguishing measured past dispatch from current lot eligibility and demand."
    },
    {
      "id": "n_d456_argentina_capacity_action_point",
      "node_type": "learning_point",
      "name": "Validate current domestic and export demand and cost a small domestic pilot before committing an allocation; finance the later lot before expansion."
    },
    {
      "id": "n_d456_argentina_capacity_reason_point",
      "node_type": "learning_point",
      "name": "Historical dispatch context cannot measure today's orders for this product; actual fruit and trial records support the immediate blend."
    },
    {
      "id": "n_d456_argentina_capacity_tradeoff_point",
      "node_type": "learning_point",
      "name": "A longer-held export programme needs stock funding and may diversify customers if orders are secured; assess currency exposure from the actual payment terms and compare current demand for both routes."
    },
    {
      "id": "n_d456_argentina_capacity_limitation_point",
      "node_type": "learning_point",
      "name": "Obtain dated current orders, payment and currency terms, full costs, authenticated origin/method/pressure records and category approval."
    },
    {
      "id": "n_d456_case_australia_portfolio",
      "node_type": "production_case",
      "name": "Original fictional Australian portfolio exercise. Supplier dossiers compare Adelaide Hills Chardonnay/Pinot Noir, a Victorian lot, a Tasmanian lot and a multi-region South Eastern Australia blend, with actual site, harvest, acidity and frost records. A separate Shiraz offer supplies ripe red-fruit and tannin notes. One documented transfer-method lot underwent bottle fermentation followed by bulk clarification; another underwent tank secondary fermentation. The coded panel fits the fresh white brief with A and a red-food slot with Shiraz. The longer-held Tasmanian proposal requires more capital than available. All supplied results, budgets and orders are invented. Choose a contingent portfolio and explain method, costs and quality limits."
    },
    {
      "id": "n_d456_australia_portfolio_action_point",
      "node_type": "learning_point",
      "name": "Retain the demonstrated white and red brief fits provisionally and phase quantities to verified cash and storage."
    },
    {
      "id": "n_d456_australia_portfolio_reason_point",
      "node_type": "learning_point",
      "name": "The documented fermentation and later clarification stages distinguish methods; actual tasting distinguishes this Shiraz food slot."
    },
    {
      "id": "n_d456_australia_portfolio_tradeoff_point",
      "node_type": "learning_point",
      "name": "A varied portfolio may serve different guest needs, but actual reach requires measurement; compare its stock and training requirements while the long-held lot competes with limited capital."
    },
    {
      "id": "n_d456_australia_portfolio_limitation_point",
      "node_type": "learning_point",
      "name": "Authenticate GI and method claims, costs, acidity/stability and sample repeatability; Tasmania, transfer or Shiraz alone cannot rank quality."
    },
    {
      "id": "n_d456_case_nz_harvest_blend",
      "node_type": "production_case",
      "name": "Original fictional New Zealand comparison. Marlborough, Hawke's Bay and Central Otago Chardonnay/Pinot Noir supplier dossiers provide their own season, water, crop and harvest records. Trial A is crisp and fruit-led; B is broader; C retains acidity but has less available volume after a supplied frost event. Different MLF, lees and dosage choices accompany the different sites. A separate aromatic-variety tank sample fits a short-term fresh-fruit slot. A buyer wants a consistent non-vintage style, a modest launch quantity and affordable stock holding. All findings, hazards, schedules and prices are hypothetical rather than universal regional descriptions. Evaluate source and blend choices."
    },
    {
      "id": "n_d456_nz_harvest_blend_action_point",
      "node_type": "learning_point",
      "name": "Trial a consistent, documented multi-lot blend for the specified slot, comparing the aromatic sample separately."
    },
    {
      "id": "n_d456_nz_harvest_blend_reason_point",
      "node_type": "learning_point",
      "name": "Actual harvest and cellar evidence explains candidate differences; the design cannot isolate region, vintage or dosage as the sole cause."
    },
    {
      "id": "n_d456_nz_harvest_blend_tradeoff_point",
      "node_type": "learning_point",
      "name": "Blending and alternative sourcing can smooth limited supply but change handling and provenance work; single-lot scarcity can constrain volume."
    },
    {
      "id": "n_d456_nz_harvest_blend_limitation_point",
      "node_type": "learning_point",
      "name": "Check sensory repeatability, available volume, origin/method records, stability, costs and actual demand before committing."
    },
    {
      "id": "n_d456_case_cap_classique_route",
      "node_type": "production_case",
      "name": "Original fictional Cap Classique buying and production exercise. Two Cape growers supply different Chardonnay/Pinot Noir and Chenin Blanc parcel records, with harvest acidity, water stress and bunch-health observations. Documented bottle-fermented A has the preferred balance in a coded panel; a longer-held B has no sample and costs more to hold. A's supplier is an association member. A restaurant programme requests training and small frequent deliveries; a supermarket proposes a large promotion with a discount and delayed payment. All parcel findings, preferences and offers are invented. Compare a conditional allocation and marketing plan without taking membership as certification of this wine's excellence."
    },
    {
      "id": "n_d456_cap_classique_route_action_point",
      "node_type": "learning_point",
      "name": "Pilot A with traceable production evidence and a costed route that meets the delivery and cash constraints."
    },
    {
      "id": "n_d456_cap_classique_route_reason_point",
      "node_type": "learning_point",
      "name": "The actual panel and parcel records support A; association promotion of bottle-fermented wine does not grade the individual bottle."
    },
    {
      "id": "n_d456_cap_classique_route_tradeoff_point",
      "node_type": "learning_point",
      "name": "The requested restaurant training and frequent delivery add work; compare the supermarket discount, stock and payment exposure, and measure audience reach and demand for both routes."
    },
    {
      "id": "n_d456_cap_classique_route_limitation_point",
      "node_type": "learning_point",
      "name": "Check samples, method and category records, total costs, supplier reliability, financing and repeat orders before expansion."
    }
  ],
