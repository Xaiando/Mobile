knowledge_items:
  - id: ki_reg_fe_alsace_shelter
    subject_id: n_reg_fe_principle_alsace_climate
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fe_point_alsace_shelter
    domain_id: geography
    assertion_text: The Vosges intercept moist western air, contributing to Alsace’s relatively dry
      semi-continental setting. Actual seasonal rain and disease observations remain necessary for a vineyard
      decision.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_alsace_autumn
    subject_id: n_reg_fe_principle_alsace_climate
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fe_point_alsace_autumn
    domain_id: geography
    assertion_text: Warm autumn days and cool nights can support extended Alsace ripening and freshness. Site,
      variety and vintage still determine the outcome; this pattern cannot prescribe a picking date.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_alsace_foliage
    subject_id: n_reg_fe_principle_alsace_practices
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fe_point_alsace_foliage
    domain_id: viticulture
    assertion_text: Raised Alsace foliage can improve sun exposure and limit some frost damage. This explains a
      training choice, without making canopy height sufficient protection against every frost event.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_alsace_cover
    subject_id: n_reg_fe_principle_alsace_practices
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fe_point_alsace_cover
    domain_id: viticulture
    assertion_text: Managed Alsace ground cover helps retain soil and water and curb hillside erosion. Plot and
      season still matter; cover alone guarantees neither adequate water nor finished-wine quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_alsace_riesling
    subject_id: n_reg_fe_principle_alsace_riesling_gewurz
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fe_point_alsace_riesling
    domain_id: geography
    assertion_text: Alsace Riesling is associated with citrus and floral aromas and a vivid acidic framework.
      These are useful comparison expectations, while sweetness, ripeness and cellar information are needed
      for the actual cuvée; aroma alone cannot prove origin.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_alsace_gewurz
    subject_id: n_reg_fe_principle_alsace_riesling_gewurz
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fe_point_alsace_gewurz
    domain_id: geography
    assertion_text: Gewurztraminer in Alsace is associated with pronounced rose, exotic-fruit and spice aromas and
      a weighty palate, with freshness described as less prominent than in other regional whites. Aromatic
      intensity does not by itself establish sweetness, balance or superior quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_alsace_pinot_gris
    subject_id: n_reg_fe_principle_alsace_pinot_whites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fe_point_alsace_pinot_gris
    domain_id: geography
    assertion_text: CIVA describes Pinot Gris whites with weight, roundness and an acidic framework. This supports
      a fuller-white comparison brief, but individual sweetness and production choices must be checked before
      assigning a role or judging balance.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_alsace_pinot_blanc
    subject_id: n_reg_fe_principle_alsace_pinot_whites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fe_point_alsace_pinot_blanc
    domain_id: geography
    assertion_text: Pinot Blanc in Alsace is associated with restrained peach, apple and floral character and a
      lighter palate with measured acidity. This contrasts with the fuller Pinot Gris description without
      requiring every example to be lighter or less complex.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_alsace_muscat_dry
    subject_id: n_reg_fe_principle_alsace_aroma_sweetness
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fe_point_alsace_muscat_dry
    domain_id: geography
    assertion_text: Alsace Muscat can show an intense fresh-grape fragrance while being dry on the palate. A
      fragrant nose therefore does not establish residual sweetness; use the actual cuvée specification and
      taste when matching a dry-wine brief.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_alsace_late_fruit
    subject_id: n_reg_fe_principle_alsace_aroma_sweetness
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fe_point_alsace_late_fruit
    domain_id: geography
    assertion_text: CIVA illustrates a rich, sweet-style late-harvest example with concentrated fruit. Actual
      cuvée sweetness and balance still need checking; this illustration supplies neither a complete legal
      definition nor a dessert-suitability guarantee.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_beaujolais_gamay
    subject_id: n_reg_fe_principle_beaujolais_grapes
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fe_point_beaujolais_gamay
    domain_id: geography
    assertion_text: "Gamay is the established red-wine association of Beaujolais: its thin dark skins and early
      ripening accompany a broad range of fruit-led wines. That association does not fix extraction, drinking
      readiness or the structure of every cuvée."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_beaujolais_chardonnay
    subject_id: n_reg_fe_principle_beaujolais_grapes
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fe_point_beaujolais_chardonnay
    domain_id: geography
    assertion_text: Beaujolais also produces Chardonnay whites. The interprofession describes pressing followed by
      fermentation in tanks or wooden vessels, with lees maturation common. Compare actual cellar details
      rather than transfer whole-bunch red-wine methods to every regional white.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_beaujolais_hills
    subject_id: n_reg_fe_principle_beaujolais_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fe_point_beaujolais_hills
    domain_id: geography
    assertion_text: Beaujolais vineyards occupy a hill landscape between Massif Central foothills and the Saône
      plain. The varied terrain is a reason to compare actual slope and exposure, rather than infer identical
      growing conditions from the regional name.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_beaujolais_parcels
    subject_id: n_reg_fe_principle_beaujolais_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fe_point_beaujolais_parcels
    domain_id: geography
    assertion_text: Inter Beaujolais commissioned a detailed field soil survey with Sigales and the Rhône
      agriculture chamber, documenting substantial variation and supporting parcel work. A soil description is
      site evidence; it does not prove direct mineral transfer into flavour or a universal quality hierarchy.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_beaujolais_intact
    subject_id: n_reg_fe_principle_beaujolais_semicarbonic
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fe_point_beaujolais_intact
    domain_id: winemaking
    assertion_text: In traditional semi-carbonic Beaujolais vinification, intact berries near the top of the vat
      undergo intracellular metabolism in an atmosphere increasingly rich in carbon dioxide. This process
      contributes aroma and some alcohol, but does not complete the whole wine’s fermentation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_beaujolais_yeast
    subject_id: n_reg_fe_principle_beaujolais_semicarbonic
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fe_point_beaujolais_yeast
    domain_id: winemaking
    assertion_text: Bunch weight releases juice at the bottom of a Beaujolais vat, where yeast fermentation
      produces alcohol and carbon dioxide. After draining and pressing, juice continues fermenting;
      semi-carbonic vinification therefore includes ordinary yeast fermentation as well as intact-berry
      metabolism.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_beaujolais_pressing
    subject_id: n_reg_fe_principle_beaujolais_extraction
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fe_point_beaujolais_pressing
    domain_id: winemaking
    assertion_text: Earlier carbonic-style pressing reduces phenolic extraction and can support supple tannins.
      This is a Beaujolais style lever, not a universal quality rule; carbonic techniques can also produce
      wines for ageing.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_beaujolais_maturation
    subject_id: n_reg_fe_principle_beaujolais_extraction
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fe_point_beaujolais_maturation
    domain_id: winemaking
    assertion_text: Beaujolais producers vary extraction operations and use vats, casks or barrels for maturation.
      These choices help explain structural and aroma differences; a cru name or Gamay identity alone cannot
      establish oak treatment, ageability or sensory quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_jura_season
    subject_id: n_reg_fe_principle_jura_climate_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fe_point_jura_season
    domain_id: geography
    assertion_text: CIVJ describes a semi-continental Jura climate with generally warm, dry summers and often
      rainy springs. This contrast frames seasonal ripening and vineyard monitoring; current weather records
      are still needed for a specific plot and vintage.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_jura_exposure
    subject_id: n_reg_fe_principle_jura_climate_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fe_point_jura_exposure
    domain_id: geography
    assertion_text: Jura’s relief, exposure, altitude and slope produce contrasting vineyard microclimates, with
      many sites facing south or southwest. Compare those conditions with the grape’s ripening demands instead
      of treating a broad regional climate or soil name as a complete explanation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_jura_chardonnay
    subject_id: n_reg_fe_principle_jura_white_grapes
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fe_point_jura_chardonnay
    domain_id: geography
    assertion_text: Adaptable Jura Chardonnay can give floral, fruit-led whites. Site, blends and maturation
      qualify that expectation; the grape name cannot identify topping up or sous-voile treatment.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_jura_savagnin
    subject_id: n_reg_fe_principle_jura_white_grapes
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fe_point_jura_savagnin
    domain_id: geography
    assertion_text: Slow-ripening Jura Savagnin appears in topped-up and sous-voile whites. Check production
      records before identifying its maturation or calling a particular wine Vin Jaune.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_jura_poulsard
    subject_id: n_reg_fe_principle_jura_red_grapes
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fe_point_jura_poulsard
    domain_id: viticulture
    assertion_text: Thin-skinned Poulsard, also called Ploussard, can give pale reds with red-fruit character.
      Pale colour alone establishes neither rosé production, weak flavour nor inferior quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_jura_trousseau
    subject_id: n_reg_fe_principle_jura_red_grapes
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fe_point_jura_trousseau
    domain_id: viticulture
    assertion_text: Later-ripening Trousseau favours warmer, lighter Jura sites and can give fruit/spice
      expressions. Its name guarantees neither successful ripening in every vintage nor higher quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_jura_topped
    subject_id: n_reg_fe_principle_jura_ouillage
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fe_point_jura_topped
    domain_id: winemaking
    assertion_text: Jura ouillage replaces evaporated barrel wine. Topped-up floral whites include Chardonnay and
      Savagnin; grape alone therefore cannot identify the method used for an individual wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_jura_non_topped
    subject_id: n_reg_fe_principle_jura_ouillage
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fe_point_jura_non_topped
    domain_id: winemaking
    assertion_text: Non-topped-up Jura whites offer a more oxidative traditional expression, using Savagnin alone
      or with Chardonnay. Check maturation and condition; intentional style must be distinguished from bottle
      damage.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_jura_jaune_time
    subject_id: n_reg_fe_principle_jura_patient_wines
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fe_point_jura_jaune_time
    domain_id: winemaking
    assertion_text: Vin Jaune matures Savagnin for a prolonged period without topping up, under a surface yeast
      veil. Time and evaporation merit cost investigation, without proving a price or quality premium.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_jura_paille_drying
    subject_id: n_reg_fe_principle_jura_patient_wines
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_fe_point_jura_paille_drying
    domain_id: winemaking
    assertion_text: Vin de Paille concentrates selected Jura grapes through ventilated drying before pressing and
      fermentation. This sweet-wine route differs from Vin Jaune maturation; assess the actual wine’s dessert
      suitability.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_case_alsace_dry_aromatic_action
    subject_id: n_reg_fe_case_alsace_dry_aromatic
    relation_type: CASE_ACTION
    object_id: n_reg_fe_point_case_alsace_dry_aromatic_action
    domain_id: geography
    assertion_text: Check the supplied sweetness specifications against the dry brief, then taste the current
      wines under comparable conditions. The Muscat is the documented dry candidate, but aroma, balance and
      condition still need assessment before a final listing.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_case_alsace_dry_aromatic_reason
    subject_id: n_reg_fe_case_alsace_dry_aromatic
    relation_type: CASE_REASON
    object_id: n_reg_fe_point_case_alsace_dry_aromatic_reason
    domain_id: geography
    assertion_text: Muscat can be dry despite strong grape perfume, while Gewurztraminer brings a different
      intense aroma and weight profile. In this case the producer records, rather than those general aromas,
      establish the candidates’ sweetness difference.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_case_alsace_dry_aromatic_tradeoff
    subject_id: n_reg_fe_case_alsace_dry_aromatic
    relation_type: CASE_TRADEOFF
    object_id: n_reg_fe_point_case_alsace_dry_aromatic_tradeoff
    domain_id: business
    assertion_text: The dry candidate better matches the stated sweetness brief, while the sweeter Gewurztraminer
      may suit a different slot or customer preference. Budget fit alone does not establish demand or value;
      test the intended listing and quoted cost against the restaurant’s customers.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_case_alsace_dry_aromatic_limitation
    subject_id: n_reg_fe_case_alsace_dry_aromatic
    relation_type: CASE_LIMITATION
    object_id: n_reg_fe_point_case_alsace_dry_aromatic_limitation
    domain_id: geography
    assertion_text: No sample result is given, so the records do not establish flavour balance, condition or
      customer acceptance. Nor can this pair prove that all Muscats are dry, all Gewurztraminers are sweet, or
      either grape is universally superior.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_case_beaujolais_berry_handling_action
    subject_id: n_reg_fe_case_beaujolais_berry_handling
    relation_type: CASE_ACTION
    object_id: n_reg_fe_point_case_beaujolais_berry_handling_action
    domain_id: winemaking
    assertion_text: Assess berry integrity and run separate monitored trials before committing the harvest.
      Preserve intact fruit for the intracellular component; test the crushed lot as a different fermentation
      option rather than assume identical carbonic response.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_case_beaujolais_berry_handling_reason
    subject_id: n_reg_fe_case_beaujolais_berry_handling
    relation_type: CASE_REASON
    object_id: n_reg_fe_point_case_beaujolais_berry_handling_reason
    domain_id: winemaking
    assertion_text: Intracellular metabolism depends on intact berries in a low-oxygen atmosphere, while exposed
      juice ferments through yeasts. The stated berry damage therefore changes the process opportunity, though
      ripeness and sound condition alone do not establish the finished wine’s tannin or aroma.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_case_beaujolais_berry_handling_tradeoff
    subject_id: n_reg_fe_case_beaujolais_berry_handling
    relation_type: CASE_TRADEOFF
    object_id: n_reg_fe_point_case_beaujolais_berry_handling_tradeoff
    domain_id: business
    assertion_text: The more expensive intact lot offers a better starting condition for this intended process,
      but uses more of the production budget. Compare the trials and actual handling costs before assuming the
      style benefit will recover that expense through sales.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_case_beaujolais_berry_handling_limitation
    subject_id: n_reg_fe_case_beaujolais_berry_handling
    relation_type: CASE_LIMITATION
    object_id: n_reg_fe_point_case_beaujolais_berry_handling_limitation
    domain_id: winemaking
    assertion_text: "Assess fermentation and finished samples: intact berries are only one condition and carbonic
      production has risks. Handling and origin cannot guarantee quality, release readiness or an achievable
      price."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_case_jura_white_comparison_action
    subject_id: n_reg_fe_case_jura_white_comparison
    relation_type: CASE_ACTION
    object_id: n_reg_fe_point_case_jura_white_comparison_action
    domain_id: winemaking
    assertion_text: Compare coded samples under the same conditions and record the different vineyard sources and
      maturation treatments separately. Add a closer site match if the aim is to isolate maturation rather
      than simply describe this useful style contrast.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_case_jura_white_comparison_reason
    subject_id: n_reg_fe_case_jura_white_comparison
    relation_type: CASE_REASON
    object_id: n_reg_fe_point_case_jura_white_comparison_reason
    domain_id: winemaking
    assertion_text: The documented topping-up and yeast-veil treatments plausibly contribute to the observed
      contrast. The specific aroma observations are scenario premises, not universal signatures of Savagnin’s
      soil or origin.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_case_jura_white_comparison_tradeoff
    subject_id: n_reg_fe_case_jura_white_comparison
    relation_type: CASE_TRADEOFF
    object_id: n_reg_fe_point_case_jura_white_comparison_tradeoff
    domain_id: winemaking
    assertion_text: Showing these two styles makes the maturation question accessible, but different vineyard
      sources confound a causal explanation. Closer site matching improves attribution while reducing the
      range of sites demonstrated; several wines or vintages would test the pattern more broadly.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_case_jura_white_comparison_limitation
    subject_id: n_reg_fe_case_jura_white_comparison
    relation_type: CASE_LIMITATION
    object_id: n_reg_fe_point_case_jura_white_comparison_limitation
    domain_id: winemaking
    assertion_text: The pair cannot assign the aroma difference to soil, prove the origin of an unknown wine or
      rank regional quality. Even with producer and vintage matched, harvest and other cellar differences need
      checking; intentional maturation character must be distinguished from a damaged bottle.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_case_jura_maturation_cash_action
    subject_id: n_reg_fe_case_jura_maturation_cash
    relation_type: CASE_ACTION
    object_id: n_reg_fe_point_case_jura_maturation_cash_action
    domain_id: business
    assertion_text: Build a cash forecast using the recorded payment dates, storage expenses, likely sale timing
      and actual volume losses. Compare it with the sooner-sale option and test demand before expanding; a
      production tradition does not itself fund the waiting period.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_case_jura_maturation_cash_reason
    subject_id: n_reg_fe_case_jura_maturation_cash
    relation_type: CASE_REASON
    object_id: n_reg_fe_point_case_jura_maturation_cash_reason
    domain_id: winemaking
    assertion_text: Prolonged maturation without topping up entails evaporative loss. Together with the scenario’s
      payment and storage records, this explains less saleable volume and delayed revenue, without proving an
      attainable premium.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_case_jura_maturation_cash_tradeoff
    subject_id: n_reg_fe_case_jura_maturation_cash
    relation_type: CASE_TRADEOFF
    object_id: n_reg_fe_point_case_jura_maturation_cash_tradeoff
    domain_id: business
    assertion_text: Waiting may develop the intended distinctive style, but commits space and spending and leaves
      cash tied to stock for longer. Selling the topped-up wine sooner forgoes that possible style development
      while releasing cash earlier; use actual customer and cost evidence to assess the choice.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
  - id: ki_reg_fe_case_jura_maturation_cash_limitation
    subject_id: n_reg_fe_case_jura_maturation_cash
    relation_type: CASE_LIMITATION
    object_id: n_reg_fe_point_case_jura_maturation_cash_limitation
    domain_id: business
    assertion_text: A forecast must test loss, timing, condition and demand assumptions. Neither the Vin Jaune
      association nor prolonged maturation guarantees successful development, a fixed evaporation rate or a
      price that covers the additional costs; review the winery’s own evidence.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T06:14:33.000Z
