# Original Alsace, Beaujolais and Jura regional comparisons.
# All items are unverified; dates record curation, not a wine-law effective date.
# MCQ disabled throughout: qualified explanations and case decisions permit defensible alternatives.
knowledge_nodes:
  - id: n_reg_fe_principle_alsace_climate
    node_type: production_principle
    name: How do Vosges shelter and autumn temperature patterns frame an Alsace ripening comparison without
      guaranteeing the harvest outcome?
  - id: n_reg_fe_point_alsace_shelter
    node_type: learning_point
    name: Vosges shelter reduces Atlantic rainfall in Alsace
  - id: n_reg_fe_point_alsace_autumn
    node_type: learning_point
    name: Alsace autumn days and nights can support extended ripening
  - id: n_reg_fe_principle_alsace_practices
    node_type: production_principle
    name: Why do Alsace growers consider foliage height and managed soil cover alongside the site rather than
      assume the dry regional climate removes all vineyard risks?
  - id: n_reg_fe_point_alsace_foliage
    node_type: learning_point
    name: Raised Alsace foliage addresses exposure and frost risk
  - id: n_reg_fe_point_alsace_cover
    node_type: learning_point
    name: Managed ground cover helps retain Alsace hillside soil
  - id: n_reg_fe_principle_alsace_riesling_gewurz
    node_type: production_principle
    name: How do Riesling and Gewurztraminer supply different aroma and palate expectations for an Alsace
      comparison?
  - id: n_reg_fe_point_alsace_riesling
    node_type: learning_point
    name: Alsace Riesling offers citrus, floral notes and vivid acidity
  - id: n_reg_fe_point_alsace_gewurz
    node_type: learning_point
    name: Alsace Gewurztraminer combines intense perfume with palate weight
  - id: n_reg_fe_principle_alsace_pinot_whites
    node_type: production_principle
    name: What grape-related palate contrast is useful between Pinot Gris and Pinot Blanc in Alsace without fixing
      their exact sweetness or production?
  - id: n_reg_fe_point_alsace_pinot_gris
    node_type: learning_point
    name: Alsace Pinot Gris can combine roundness with acidic structure
  - id: n_reg_fe_point_alsace_pinot_blanc
    node_type: learning_point
    name: Alsace Pinot Blanc offers restrained fruit and a lighter palate
  - id: n_reg_fe_principle_alsace_aroma_sweetness
    node_type: production_principle
    name: Why should an Alsace sweetness comparison distinguish fragrant Muscat from the ripe-fruit character of
      late-harvest wines?
  - id: n_reg_fe_point_alsace_muscat_dry
    node_type: learning_point
    name: Fragrant Alsace Muscat can be vinified dry
  - id: n_reg_fe_point_alsace_late_fruit
    node_type: learning_point
    name: CIVA illustrates a rich Alsace late-harvest style
  - id: n_reg_fe_principle_beaujolais_grapes
    node_type: production_principle
    name: How do Gamay reds and Chardonnay whites prevent a single grape or production stereotype from describing
      all Beaujolais?
  - id: n_reg_fe_point_beaujolais_gamay
    node_type: learning_point
    name: Beaujolais Gamay combines thin skins with varied fruit expression
  - id: n_reg_fe_point_beaujolais_chardonnay
    node_type: learning_point
    name: Beaujolais Chardonnay whites allow different vessels and lees choices
  - id: n_reg_fe_principle_beaujolais_sites
    node_type: production_principle
    name: Why do Beaujolais hill and parcel observations matter more than assigning one soil-derived flavour or
      quality level to the whole region?
  - id: n_reg_fe_point_beaujolais_hills
    node_type: learning_point
    name: Beaujolais hills sit between upland foothills and the Saône plain
  - id: n_reg_fe_point_beaujolais_parcels
    node_type: learning_point
    name: Beaujolais soil surveying supports comparisons at parcel scale
  - id: n_reg_fe_principle_beaujolais_semicarbonic
    node_type: production_principle
    name: How do intact berries and yeast fermentation coexist in traditional Beaujolais semi-carbonic
      vinification?
  - id: n_reg_fe_point_beaujolais_intact
    node_type: learning_point
    name: Beaujolais intact berries undergo intracellular fermentation
  - id: n_reg_fe_point_beaujolais_yeast
    node_type: learning_point
    name: Yeast fermentation of Beaujolais juice supplies carbon dioxide
  - id: n_reg_fe_principle_beaujolais_extraction
    node_type: production_principle
    name: How do maceration and maturation decisions widen Beaujolais style beyond the image of a single
      early-drinking red?
  - id: n_reg_fe_point_beaujolais_pressing
    node_type: learning_point
    name: Earlier pressing can reduce carbonic-wine phenolic extraction
  - id: n_reg_fe_point_beaujolais_maturation
    node_type: learning_point
    name: Beaujolais extraction and vessel choices influence structure and maturation
  - id: n_reg_fe_principle_jura_climate_sites
    node_type: production_principle
    name: How do Jura’s semi-continental season and varied slopes affect a site comparison without giving all Jura
      wines one ripeness pattern?
  - id: n_reg_fe_point_jura_season
    node_type: learning_point
    name: Jura combines warm summers with often rainy springs
  - id: n_reg_fe_point_jura_exposure
    node_type: learning_point
    name: Jura exposure, altitude and slope create contrasting microclimates
  - id: n_reg_fe_principle_jura_white_grapes
    node_type: production_principle
    name: How do Chardonnay and Savagnin provide different Jura growing and white-wine comparisons without
      assuming all Savagnin is Vin Jaune?
  - id: n_reg_fe_point_jura_chardonnay
    node_type: learning_point
    name: Jura Chardonnay offers adaptable growing and varied white styles
  - id: n_reg_fe_point_jura_savagnin
    node_type: learning_point
    name: Jura Savagnin ripens slowly and has several cellar expressions
  - id: n_reg_fe_principle_jura_red_grapes
    node_type: production_principle
    name: How do Poulsard and Trousseau create different Jura red-wine expectations and ripening considerations?
  - id: n_reg_fe_point_jura_poulsard
    node_type: learning_point
    name: Jura Poulsard’s thin skins accompany light red colour
  - id: n_reg_fe_point_jura_trousseau
    node_type: learning_point
    name: Jura Trousseau’s later ripening needs a suitable warm site
  - id: n_reg_fe_principle_jura_ouillage
    node_type: production_principle
    name: Why can Jura Chardonnay or Savagnin give different white-wine styles depending on whether the producer
      tops up the barrel?
  - id: n_reg_fe_point_jura_topped
    node_type: learning_point
    name: Jura ouillage replenishes evaporated wine
  - id: n_reg_fe_point_jura_non_topped
    node_type: learning_point
    name: Non-topped-up Jura whites require cellar context
  - id: n_reg_fe_principle_jura_patient_wines
    node_type: production_principle
    name: How do Vin Jaune maturation and Vin de Paille grape drying create different Jura wine and commercial
      comparisons?
  - id: n_reg_fe_point_jura_jaune_time
    node_type: learning_point
    name: Jura Vin Jaune develops under a surface yeast veil
  - id: n_reg_fe_point_jura_paille_drying
    node_type: learning_point
    name: Jura Vin de Paille concentrates grapes before fermentation
  - id: n_reg_fe_case_alsace_dry_aromatic
    node_type: production_case
    name: A restaurant needs a dry, aromatic Alsace white for its main wine-list slot. Offers include a Muscat
      with a producer specification confirming a dry palate and a Gewurztraminer with a specification
      confirming noticeable residual sweetness. Both landed quotes fit the purchase budget; current samples
      are available but have not been tasted. Propose an action, explain the regional style context, discuss a
      tradeoff and give a limitation without treating perfume as a sweetness or quality test.
  - id: n_reg_fe_point_case_alsace_dry_aromatic_action
    node_type: learning_point
    name: Check the Alsace specifications and compare coded samples
  - id: n_reg_fe_point_case_alsace_dry_aromatic_reason
    node_type: learning_point
    name: Alsace grape perfume does not establish residual sweetness
  - id: n_reg_fe_point_case_alsace_dry_aromatic_tradeoff
    node_type: learning_point
    name: Weigh the dry Alsace style fit against customer value
  - id: n_reg_fe_point_case_alsace_dry_aromatic_limitation
    node_type: learning_point
    name: Alsace specifications do not yet establish full wine-list suitability
  - id: n_reg_fe_case_beaujolais_berry_handling
    node_type: production_case
    name: "A Beaujolais grower wants a fruit-led Gamay red with supple tannin for relatively early release. Two
      sound lots have comparable ripeness: one was gently hand-picked and arrives with mostly intact bunches;
      the cheaper second lot has many crushed berries. The grower can run small trials and has berry-condition
      and cost records. Assess an action, reason, tradeoff and limitation for a carbonic-style approach; no
      finished wine or universal quality advantage is given."
  - id: n_reg_fe_point_case_beaujolais_berry_handling_action
    node_type: learning_point
    name: Assess berry integrity and trial the Beaujolais lots separately
  - id: n_reg_fe_point_case_beaujolais_berry_handling_reason
    node_type: learning_point
    name: Intact Gamay berries support the intracellular component
  - id: n_reg_fe_point_case_beaujolais_berry_handling_tradeoff
    node_type: learning_point
    name: Balance Beaujolais fruit handling costs against the style target
  - id: n_reg_fe_point_case_beaujolais_berry_handling_limitation
    node_type: learning_point
    name: Berry integrity cannot guarantee Beaujolais quality or release readiness
  - id: n_reg_fe_case_jura_white_comparison
    node_type: production_case
    name: A class compares two sound Jura Savagnins from one producer and vintage. Records identify one as topped
      up in barrel and the other as matured without topping up under a surface yeast veil; samples show
      respectively citrus/floral and walnut-like characters. Vineyard sources differ and their detailed
      records are available. Design a comparison with an action, reason, tradeoff and limitation, without
      treating a soil name or aroma as proof of origin or superior quality.
  - id: n_reg_fe_point_case_jura_white_comparison_action
    node_type: learning_point
    name: Separate Jura site records from maturation when comparing samples
  - id: n_reg_fe_point_case_jura_white_comparison_reason
    node_type: learning_point
    name: The Jura white comparison contains a documented cellar difference
  - id: n_reg_fe_point_case_jura_white_comparison_tradeoff
    node_type: learning_point
    name: The Jura contrast is vivid but changes both site and cellar
  - id: n_reg_fe_point_case_jura_white_comparison_limitation
    node_type: learning_point
    name: The Jura pair cannot isolate soil effects or establish a ranking
  - id: n_reg_fe_case_jura_maturation_cash
    node_type: production_case
    name: A Jura winery considers expanding a Savagnin lot intended for prolonged Vin Jaune-style maturation
      instead of selling its sound topped-up Savagnin sooner. Its records show that the longer route ties up
      cellar space, requires storage spending and loses saleable volume through evaporation. Payment for fruit
      and work is due before sales, and no future premium or demand is assured. Propose an action, explain a
      reason, discuss a tradeoff and state a limitation without making a legal-release-date decision.
  - id: n_reg_fe_point_case_jura_maturation_cash_action
    node_type: learning_point
    name: Forecast the Jura maturation route’s cash and saleable volume
  - id: n_reg_fe_point_case_jura_maturation_cash_reason
    node_type: learning_point
    name: Long Jura maturation combines delayed sale with evaporation
  - id: n_reg_fe_point_case_jura_maturation_cash_tradeoff
    node_type: learning_point
    name: Balance Jura style development against inventory and cash costs
  - id: n_reg_fe_point_case_jura_maturation_cash_limitation
    node_type: learning_point
    name: Jura maturation tradition cannot guarantee profitable expansion
