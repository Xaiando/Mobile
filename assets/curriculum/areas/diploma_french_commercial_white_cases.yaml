{
  "knowledge_nodes": [
    {
      "id": "n_d3fr2_case_bordeaux_route",
      "node_type": "production_case",
      "name": "Fictional Bordeaux ready-stock exercise: an estate has 2,400 saleable bottles and a supplier bill due in 20 days. Whether existing cash can meet that bill is unconfirmed. A merchant requests all 2,400 bottles, with payment 60 days after shipment, and offers warehousing and sales to restaurants; no credit references, account-sales evidence or agreed division of selling and delivery work is supplied. Its sales sheet mentions a classification without naming the system or showing current status, and claims that classification guarantees demand. A restaurant group proposes a 360-bottle trial, payment on confirmed order before shipment and producer tasting/delivery work. Staff capacity, complete prices and costs, actual receipts and buyer reliability are unknown. These offers, quantities and terms are invented exercise inputs, not standard Bordeaux trade practices or payment law. Recommend a conditional sales process, explain the evidence, weigh stock, cash and workload, and identify checks before committing the remaining bottles."
    },
    {
      "id": "n_d3fr2_point_bordeaux_route_action",
      "node_type": "learning_point",
      "name": "Check partner evidence, responsibilities and dated cash needs before making a limited conditional commitment"
    },
    {
      "id": "n_d3fr2_point_bordeaux_route_reason",
      "node_type": "learning_point",
      "name": "A classification claim, shipment or invoice does not establish consumer demand or available cash"
    },
    {
      "id": "n_d3fr2_point_bordeaux_route_tradeoff",
      "node_type": "learning_point",
      "name": "The merchant reduces some distribution work but delays cash and concentrates stock; the restaurant trial needs estate service"
    },
    {
      "id": "n_d3fr2_point_bordeaux_route_limitation",
      "node_type": "learning_point",
      "name": "Current classification status, partner performance, real receipts, full costs and liquidity remain unresolved"
    },
    {
      "id": "n_d3fr2_case_rhone_white",
      "node_type": "production_case",
      "name": "Fictional Rhône white-wine exercise: a producer has sound, same-vintage Marsanne and Roussanne lots. The supplied Roussanne parcel log records extra sorting after a wet spell; this is one invented season, not every Roussanne harvest. The brief is a dry white with fresh floral character, texture and restrained oak for a launch in eight weeks. Two pilot routes use the same fictional 70:30 Marsanne:Roussanne blend. A uses stainless steel, no malolactic fermentation and four weeks of fine-lees contact; a preliminary coded panel finds it closer to the brief, with estimated direct production cost EUR 9 per bottle and release in week six. B uses new oak, completed malolactic fermentation and twelve weeks of fine-lees contact; its preliminary panel finds broader texture but toast dominates and freshness is less suitable for this brief, with direct cost EUR 12 and release in week twelve. Several cellar variables differ. Selling prices, full selling/overhead/finance costs, repeat-panel results, stability and current origin/label-compliance records are missing. All trial findings, durations, proportions, costs and dates are app-authored assumptions, not legal minima, regional price data or guarantees. Recommend a conditional production/release process, explain the sensory mechanisms, assess the cost and timing tradeoff, and identify evidence needed to set quality and price."
    },
    {
      "id": "n_d3fr2_point_rhone_white_action",
      "node_type": "learning_point",
      "name": "Repeat the brief-aligned pilot and check stability, origin and capacity before a limited six-week release"
    },
    {
      "id": "n_d3fr2_point_rhone_white_reason",
      "node_type": "learning_point",
      "name": "Marsanne and Roussanne context, MLF, oak and lees inform the comparison without isolating the cause or guaranteeing quality"
    },
    {
      "id": "n_d3fr2_point_rhone_white_tradeoff",
      "node_type": "learning_point",
      "name": "The earlier, lower-direct-cost pilot fits the launch; the later oak route needs a demonstrated premium and extra holding capacity"
    },
    {
      "id": "n_d3fr2_point_rhone_white_limitation",
      "node_type": "learning_point",
      "name": "Confounded trials, provisional panels, incomplete stability/compliance records and missing market costs prevent a final quality-price conclusion"
    }
  ],
