  "knowledge_items": [
    {
      "id": "ki_d3fr2_case_bordeaux_route_action",
      "subject_id": "n_d3fr2_case_bordeaux_route",
      "relation_type": "CASE_ACTION",
      "object_id": "n_d3fr2_point_bordeaux_route_action",
      "domain_id": "business",
      "assertion_text": "Request relevant account-sales and credit evidence, clarify ordering, selling, storage and delivery responsibilities, and make a dated cash plan before allocating the whole batch. Consider the restaurant trial only if the actual order, receipt, stock, service capacity and applicable label evidence are satisfactory. Reconsider the merchant on verified performance and workable terms; neither a large request nor a classification claim is enough to choose a final route.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-09-30T15:02:01.000Z"
    },
    {
      "id": "ki_d3fr2_case_bordeaux_route_reason",
      "subject_id": "n_d3fr2_case_bordeaux_route",
      "relation_type": "CASE_REASON",
      "object_id": "n_d3fr2_point_bordeaux_route_reason",
      "domain_id": "business",
      "assertion_text": "Bordeaux has distinct classification systems, and the unnamed claim cannot establish this estate's current status or the lot's tasted quality. Partner account sales and customer evidence are needed to evaluate demand. Under the supplied offer, merchant payment 60 days after shipment would not itself fund the bill due in 20 days; a requested order, dispatched stock or invoice is not a cash receipt or proof of profit.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-09-30T15:02:01.000Z"
    },
    {
      "id": "ki_d3fr2_case_bordeaux_route_tradeoff",
      "subject_id": "n_d3fr2_case_bordeaux_route",
      "relation_type": "CASE_TRADEOFF",
      "object_id": "n_d3fr2_point_bordeaux_route_tradeoff",
      "domain_id": "business",
      "assertion_text": "The merchant requests the whole batch and offers warehousing and restaurant selling, but its 60-day receipt timing and one-buyer stock commitment need credit and cash checks. The 360-bottle restaurant trial could bring cash before shipment if payment is actually received, while leaving more stock uncommitted, but requires estate tasting and delivery work. Without complete prices, costs, capacity and receipts, neither route is a proven profit winner or a demonstrated solution to the supplier bill.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-09-30T15:02:01.000Z"
    },
    {
      "id": "ki_d3fr2_case_bordeaux_route_limitation",
      "subject_id": "n_d3fr2_case_bordeaux_route",
      "relation_type": "CASE_LIMITATION",
      "object_id": "n_d3fr2_point_bordeaux_route_limitation",
      "domain_id": "business",
      "assertion_text": "The classification system and current entitlement, buyer credit and account performance, final prices, all route costs, service capacity and actual payment evidence remain missing. Existing cash and financing arrangements are not supplied, so the exercise cannot establish insolvency, quantify the bill shortfall or produce a reliable profit or cash forecast. The fictional terms do not establish regional defaults, legal transfer of title, commissions or current en-primeur practice.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-09-30T15:02:01.000Z"
    },
    {
      "id": "ki_d3fr2_case_rhone_white_action",
      "subject_id": "n_d3fr2_case_rhone_white",
      "relation_type": "CASE_ACTION",
      "object_id": "n_d3fr2_point_rhone_white_action",
      "domain_id": "winemaking",
      "assertion_text": "Repeat a coded comparison and consider a limited A release for the eight-week launch only if the desired sensory fit, saleable quantity, stability, applicable origin/label requirements and operational capacity are confirmed. Keep B for later evaluation or matched one-variable trials rather than declaring it intrinsically better or unusable. A's no-MLF route needs a deliberate stability plan; sensory preference alone does not clear a wine for sale.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-09-30T15:02:01.000Z"
    },
    {
      "id": "ki_d3fr2_case_rhone_white_reason",
      "subject_id": "n_d3fr2_case_rhone_white",
      "relation_type": "CASE_REASON",
      "object_id": "n_d3fr2_point_rhone_white_reason",
      "domain_id": "winemaking",
      "assertion_text": "Marsanne can give broad texture with moderate-to-low acidity; Roussanne supplies useful floral/structural context and has disease sensitivities, but the supplied sorting record is not every harvest. Malolactic fermentation can reduce acidity, while oak and managed lees contact can influence aroma and texture. Because vessel, MLF and lees duration all differ, the preliminary A/B comparison cannot attribute the entire result to one intervention or establish a universal Rhône blend or quality recipe.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-09-30T15:02:01.000Z"
    },
    {
      "id": "ki_d3fr2_case_rhone_white_tradeoff",
      "subject_id": "n_d3fr2_case_rhone_white",
      "relation_type": "CASE_TRADEOFF",
      "object_id": "n_d3fr2_point_rhone_white_tradeoff",
      "domain_id": "business",
      "assertion_text": "The supplied A estimate is EUR 9 per bottle and week-six release, versus B at EUR 12 and week twelve; B would miss the eight-week launch if those dates hold. Later release and higher direct cost require more holding capacity and a justified customer value proposition. Neither lower direct cost nor oak and longer lees contact establishes higher net profit or a selling-price premium: complete costs, actual achievable prices and demand are absent.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-09-30T15:02:01.000Z"
    },
    {
      "id": "ki_d3fr2_case_rhone_white_limitation",
      "subject_id": "n_d3fr2_case_rhone_white",
      "relation_type": "CASE_LIMITATION",
      "object_id": "n_d3fr2_point_rhone_white_limitation",
      "domain_id": "business",
      "assertion_text": "The same blend does not make the routes a single-variable experiment: vessel, MLF and lees duration differ. Repeat independent sensory work, check the actual malic-acid/stability plan and current origin/label evidence, and obtain full costs, capacity, customer feedback and achievable selling prices before scaling or setting a premium. The fictional 70:30 blend and four/twelve-week contact are not permission or ageing minima, and the preliminary panel is not qualified sensory acceptance or proof of demand.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-09-30T15:02:01.000Z"
    }
  ],
