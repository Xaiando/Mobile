  # EU zones
  - id: ki_baden_zone
    subject_id: n_geo_baden
    relation_type: IN_WINE_ZONE
    object_id: n_zone_b
    domain_id: geography
    assertion_text: "Baden is the only German region in EU wine-growing zone B; every other German vineyard area is in zone A."
    last_verified_at: "2026-09-26T08:00:00.000Z"
    is_distinctive: true
  - id: ki_mosel_zone
    subject_id: n_geo_mosel
    relation_type: IN_WINE_ZONE
    object_id: n_zone_a
    domain_id: geography
    assertion_text: "The Mosel, like every German vineyard area outside Baden, lies in EU wine-growing zone A."
    last_verified_at: "2026-09-26T08:00:00.000Z"
  # Categories
  - id: ki_qualitaetswein_protection
    subject_id: n_term_qualitaetswein
    relation_type: PROTECTED_AS
    object_id: n_gi_pdo
    domain_id: geography
    assertion_text: "Qualitätswein is a wine with a protected designation of origin that has passed the official analytical and sensory quality test."
    last_verified_at: "2026-09-26T08:00:00.000Z"
    mcq_disabled: true
  - id: ki_praedikatswein_protection
    subject_id: n_term_praedikatswein
    relation_type: PROTECTED_AS
    object_id: n_gi_pdo
    domain_id: geography
    assertion_text: "Prädikatswein is a wine with a protected designation of origin that has passed the official quality test and meets requirements stricter than those for Qualitätswein."
    last_verified_at: "2026-09-26T08:00:00.000Z"
    mcq_disabled: true
  - id: ki_landwein_protection
    subject_id: n_term_landwein
    relation_type: PROTECTED_AS
    object_id: n_gi_pgi
    domain_id: geography
    assertion_text: "Landwein is a wine with a protected geographical indication."
    last_verified_at: "2026-09-26T08:00:00.000Z"
    mcq_disabled: true
  # Prädikate
  - id: ki_kabinett_rule
    subject_id: n_term_kabinett
    relation_type: LEGAL_DEFINITION
    object_id: n_rule_not_enriched
    domain_id: viticulture
    assertion_text: "The Prädikat Kabinett is awarded only to a wine made without enrichment; every higher Prädikat must also be unenriched."
    last_verified_at: "2026-09-26T08:00:00.000Z"
  - id: ki_spaetlese_rule
    subject_id: n_term_spaetlese
    relation_type: LEGAL_DEFINITION
    object_id: n_rule_late_harvest
    domain_id: viticulture
    assertion_text: "A Spätlese may be made only from fully ripe grapes picked in a late harvest."
    last_verified_at: "2026-09-26T08:00:00.000Z"
  - id: ki_auslese_rule
    subject_id: n_term_auslese
    relation_type: LEGAL_DEFINITION
    object_id: n_rule_ripe_or_noble_rot
    domain_id: viticulture
    assertion_text: "An Auslese may be made only from fully ripe or nobly rotten grapes."
    last_verified_at: "2026-09-26T08:00:00.000Z"
  - id: ki_beerenauslese_rule
    subject_id: n_term_beerenauslese
    relation_type: LEGAL_DEFINITION
    object_id: n_rule_noble_rot_or_overripe
    domain_id: viticulture
    assertion_text: "A Beerenauslese may be made only from nobly rotten or at least overripe berries, picked by hand."
    last_verified_at: "2026-09-26T08:00:00.000Z"
  - id: ki_trockenbeerenauslese_rule
    subject_id: n_term_trockenbeerenauslese
    relation_type: LEGAL_DEFINITION
    object_id: n_rule_shrivelled_noble_rot
    domain_id: viticulture
    assertion_text: "A Trockenbeerenauslese may be made only from largely shrivelled, nobly rotten berries, picked by hand; where noble rot exceptionally fails, overripe shrivelled berries suffice."
    last_verified_at: "2026-09-26T08:00:00.000Z"
    is_distinctive: true
  - id: ki_eiswein_rule
    subject_id: n_term_eiswein
    relation_type: LEGAL_DEFINITION
    object_id: n_rule_frozen_grapes
    domain_id: viticulture
    assertion_text: "The grapes for an Eiswein must be frozen when they are harvested and pressed."
    last_verified_at: "2026-09-26T08:00:00.000Z"
    is_distinctive: true
  # Origin units
  - id: ki_ortswein_release
    subject_id: n_term_ortswein
    relation_type: RELEASED_NOT_BEFORE
    object_id: n_date_15_december
    domain_id: geography
    assertion_text: "For the 2026 vintage onwards, a quality wine labelled with a village name (an Ortswein) may not be sold to consumers before 15 December of its harvest year, and its must needs at least the Kabinett natural minimum alcohol; wines through the 2025 vintage may follow the previous labelling rules."
    last_verified_at: "2026-09-26T08:00:00.000Z"
    mcq_disabled: true
  - id: ki_lagenwein_release
    subject_id: n_term_lagenwein
    relation_type: RELEASED_NOT_BEFORE
    object_id: n_date_1_march
    domain_id: geography
    assertion_text: "For the 2026 vintage onwards, a quality wine labelled with an Einzellage (a Lagenwein) may not be sold before 1 March of the year after harvest, carries its village name, and uses only varieties listed in its specification; wines through the 2025 vintage may follow the previous labelling rules."
    last_verified_at: "2026-09-26T08:00:00.000Z"
    mcq_disabled: true
  # Wine types
  - id: ki_roseewein_rule
    subject_id: n_wine_roseewein
    relation_type: LEGAL_DEFINITION
    object_id: n_rule_red_grapes_pale
    domain_id: winemaking
    assertion_text: "A German Qualitätswein or Prädikatswein may be called Roséwein only if it is made solely from red grapes and is pale to light red."
    last_verified_at: "2026-09-26T08:00:00.000Z"
  - id: ki_rotling_rule
    subject_id: n_wine_rotling
    relation_type: LEGAL_DEFINITION
    object_id: n_rule_white_and_red_blended
    domain_id: winemaking
    assertion_text: "A Rotling is a pale to light red German wine made by blending white and red grapes, which may also be blended as mash."
    last_verified_at: "2026-09-26T08:00:00.000Z"
  - id: ki_blanc_de_noirs_rule
    subject_id: n_wine_blanc_de_noirs
    relation_type: LEGAL_DEFINITION
    object_id: n_rule_red_pressed_as_white
    domain_id: winemaking
    assertion_text: "A German Blanc de Noirs is made from fresh red grapes pressed like a white wine, and has the colour typical of white wine."
    last_verified_at: "2026-09-26T08:00:00.000Z"
  - id: ki_weissherbst_rule
    subject_id: n_wine_weissherbst
    relation_type: LEGAL_DEFINITION
    object_id: n_rule_one_red_light_pressed
    domain_id: winemaking
    assertion_text: "A Weißherbst is a Qualitätswein or Prädikatswein from a single red variety and at least 95 % light-pressed must; the variety is named with it, and it may not also be called Roséwein."
    last_verified_at: "2026-09-26T08:00:00.000Z"
    is_distinctive: true
  - id: ki_schillerwein_region
    subject_id: n_wine_schillerwein
    relation_type: RESERVED_FOR_REGION
    object_id: n_geo_wuerttemberg
    domain_id: geography
    assertion_text: "Schillerwein, a Rotling Qualitätswein or Prädikatswein, may come only from grapes harvested in Württemberg."
    last_verified_at: "2026-09-26T08:00:00.000Z"
  - id: ki_badisch_rotgold_region
    subject_id: n_wine_badisch_rotgold
    relation_type: RESERVED_FOR_REGION
    object_id: n_geo_baden
    domain_id: geography
    assertion_text: "Badisch Rotgold, a Rotling of Grauburgunder and Spätburgunder, may come only from grapes harvested in Baden."
    last_verified_at: "2026-09-26T08:00:00.000Z"
  - id: ki_schieler_region
    subject_id: n_wine_schieler
    relation_type: RESERVED_FOR_REGION
    object_id: n_geo_sachsen
    domain_id: geography
    assertion_text: "Schieler, a Rotling Qualitätswein or Prädikatswein, may come only from grapes harvested in Sachsen."
    last_verified_at: "2026-09-26T08:00:00.000Z"
  - id: ki_winzersekt_method
    subject_id: n_wine_winzersekt
    relation_type: REQUIRES_METHOD
    object_id: n_method_traditional
    domain_id: winemaking
    assertion_text: "Winzersekt is a Sekt b.A. made by traditional bottle fermentation from the estate's own grapes or, for a producer group, its members' grapes; its label names the estate or group, the variety and the vintage."
    last_verified_at: "2026-09-26T08:00:00.000Z"
  - id: ki_winzersekt_lees
    subject_id: n_wine_winzersekt
    relation_type: MIN_AGEING
    object_id: n_qty_9_months
    domain_id: winemaking
    assertion_text: "Winzersekt must rest on its lees for at least nine months without interruption, in the same estate, before it is disgorged."
    last_verified_at: "2026-09-26T08:00:00.000Z"
  # Quality marks
  - id: ki_erstes_gewaechs_awarder
    subject_id: n_mark_erstes_gewaechs
    relation_type: AWARDED_BY
    object_id: n_org_komitee
    domain_id: geography
    assertion_text: "From 2 September 2026, Erstes Gewächs is a legal quality mark of the Komitee – Klassifikation Erster und Großer Lagen in Deutschland for qualifying PDO wines. The earlier rules may cover wines through the 2030 vintage, but only until the committee's approved rules become effective if that happens sooner; compliant stocks may then be sold until exhausted."
