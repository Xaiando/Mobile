# Germany: the specified regions and the core of German wine law, at the
# certification level of docs/content/spaetburgunder-study-tree.md §11.1
# (backlog C6). Legal facts cite the current Weingesetz (WeinG),
# Weinverordnung (WeinV) or EU law. Dated vineyard figures cite the DWI's
# publication of the Destatis survey; private VDP terms cite the VDP's rules.
# Part of the curriculum release in ../curriculum.yaml, in the format of
# docs/domain-model.md §7.

node_types:
  - { id: label_term, label: label term }
  - { id: wine_type, label: wine type }
  - { id: ripeness_rule, label: ripeness rule }
  - { id: making_rule, label: production rule }
  - { id: quality_mark, label: quality mark }
  - { id: organisation, label: organisation }
  - { id: date_rule, label: release date }
  - { id: statistic, label: dated vineyard statistic }
  - { id: origin_unit, label: origin unit }

relation_types:
  - id: RESERVED_FOR_REGION
    label: is reserved for wines from
    reverse_label: reserves the term
    cardinality: one
    is_reverse_safe: true
    default_domain_id: geography
  # Not reverse-safe: every Prädikat must meet the Kabinett rule, and every
  # Rotling the Rotling rule. Only the items marked distinctive are asked
  # in reverse.
  - id: LEGAL_DEFINITION
    label: is legally defined by
    reverse_label: legally defines
    cardinality: many
    default_domain_id: winemaking
  - id: AWARDED_BY
    label: is awarded by
    reverse_label: awards
    cardinality: one
    default_domain_id: geography
  - id: RELEASED_NOT_BEFORE
    label: may first be sold to consumers from
    reverse_label: is the earliest release of
    cardinality: one
    default_domain_id: geography
  - id: STATISTIC_VALUE
    label: has the reported value
    reverse_label: is the reported value of
    cardinality: one
    default_domain_id: viticulture
  - id: PLANTED_AREA
    label: has the dated planted-area statistic
    reverse_label: reports the planted area of
    cardinality: many
    default_domain_id: viticulture
  - id: STATISTIC_IN_AREA
    label: describes vineyards in
    reverse_label: has the vineyard statistic
    cardinality: one
    default_domain_id: viticulture
  - id: LEADING_RED_GRAPE
    label: has the most planted red grape
    reverse_label: is the most planted red grape in
    cardinality: one
    default_domain_id: viticulture
    distractor_match_relation_type: HAS_BERRY_COLOUR
  - id: PRIVATE_CLASSIFICATION_OF
    label: belongs to the private classification of
    reverse_label: uses the private classification term
    cardinality: one
    default_domain_id: geography

relation_type_signatures:
  - { relation_type: RESERVED_FOR_REGION, subject_node_type: wine_type, object_node_type: region }
  - { relation_type: LEGAL_DEFINITION, subject_node_type: label_term, object_node_type: ripeness_rule }
  - { relation_type: LEGAL_DEFINITION, subject_node_type: wine_type, object_node_type: making_rule }
  - { relation_type: AWARDED_BY, subject_node_type: quality_mark, object_node_type: organisation }
  - { relation_type: RELEASED_NOT_BEFORE, subject_node_type: label_term, object_node_type: date_rule }
  - { relation_type: REQUIRES_METHOD, subject_node_type: wine_type, object_node_type: winemaking_method }
  - { relation_type: MIN_AGEING, subject_node_type: wine_type, object_node_type: quantity }
  - { relation_type: LEGAL_DEFINITION, subject_node_type: label_term, object_node_type: origin_unit }
  - { relation_type: STATISTIC_VALUE, subject_node_type: statistic, object_node_type: quantity }
  - { relation_type: PLANTED_AREA, subject_node_type: grape, object_node_type: statistic }
  - { relation_type: STATISTIC_IN_AREA, subject_node_type: statistic, object_node_type: country }
  - { relation_type: STATISTIC_IN_AREA, subject_node_type: statistic, object_node_type: region }
  - { relation_type: LEADING_RED_GRAPE, subject_node_type: statistic, object_node_type: grape }
  - { relation_type: PRIVATE_CLASSIFICATION_OF, subject_node_type: label_term, object_node_type: organisation }

