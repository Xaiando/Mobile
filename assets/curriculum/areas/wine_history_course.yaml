    relation_type: CASE_REASON
    object_id: n_hcourse_case_letters_reason
    domain_id: service
    assertion_text: "The 1963 article 2 did not use the abbreviations. The 2016 article 28 does, and it places DOC and DOCG inside the DOP class. Treating them as unrelated systems contradicts that article."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_case_letters_tradeoff
    subject_id: n_hcourse_case_letters
    relation_type: CASE_TRADEOFF
    object_id: n_hcourse_case_letters_tradeoff
    domain_id: service
    assertion_text: "A label that says only DOC, or DOC together with DOP, can both fit article 28. Do not correct a bottle for choosing one of those two presentations."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true
  - id: ki_hcourse_case_letters_limit
    subject_id: n_hcourse_case_letters
    relation_type: CASE_LIMITATION
    object_id: n_hcourse_case_letters_limit
    domain_id: service
    assertion_text: "Article 28 does not say every Italian wine is a DOCG, and it does not inspect the bottle. IGT is the traditional mention for an IGP, not a third DOP. The page also allows other language mentions in Bolzano, Valle d'Aosta, and the Slovene-speaking provinces. Those mentions were not copied into a pronunciation guide."
    verification_status: unverified
    last_verified_at: "2026-09-27T23:59:00.000Z"
    mcq_disabled: true

