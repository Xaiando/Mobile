# Expanded wine-history course. Register only in a new dataset release.
# Resolves source ids already defined in areas/wine_history.yaml and
# areas/sommelier_beverages.yaml, plus src_hcourse_columella below.
# Do not copy those existing URLs into this file. All items unverified.
# No WSET Level 1–3 mappings. mcq_disabled because several wordings can be right.
knowledge_nodes:
  - { id: n_hcourse_evidence, node_type: production_principle, name: "How should a claim about the oldest wine be split?" }
  - { id: n_hcourse_evidence_residue, node_type: learning_point, name: "A residue is not a winery" }
  - { id: n_hcourse_evidence_later, node_type: learning_point, name: "Areni is a later installation" }
  - { id: n_hcourse_rome, node_type: production_principle, name: "What can Roman wine writing show, and what can it not?" }
  - { id: n_hcourse_rome_rank, node_type: learning_point, name: "Pliny distinguishes Falernian styles and slope sites" }
  - { id: n_hcourse_rome_site, node_type: learning_point, name: "Columella matches vine to site" }
  - { id: n_hcourse_rome_not_law, node_type: learning_point, name: "Roman advice is not an appellation" }
  - { id: n_hcourse_commerce, node_type: production_principle, name: "How do the Methuen treaty and the Douro charter differ?" }
  - { id: n_hcourse_commerce_duty, node_type: learning_point, name: "Methuen is a duty, not a boundary" }
  - { id: n_hcourse_commerce_charter, node_type: learning_point, name: "Douro 1756 is not the first line" }
  - { id: n_hcourse_names, node_type: production_principle, name: "Which three Napoleons matter in wine?" }
  - { id: n_hcourse_names_blockade, node_type: learning_point, name: "1806 is a blockade" }
  - { id: n_hcourse_names_list, node_type: learning_point, name: "1855 is Napoleon III's list" }
  - { id: n_hcourse_names_age, node_type: learning_point, name: "Cognac Napoleon is six years" }
  - { id: n_hcourse_sparkling, node_type: production_principle, name: "What records the sparkling method, and what does not?" }
  - { id: n_hcourse_sparkling_paper, node_type: learning_point, name: "Merrett's 1662 paper" }
  - { id: n_hcourse_sparkling_myth, node_type: learning_point, name: "Perignon is not that paper's inventor" }
  - { id: n_hcourse_phylloxera, node_type: production_principle, name: "What does the opened phylloxera page support?" }
  - { id: n_hcourse_phylloxera_root, node_type: learning_point, name: "Rootstocks, not a cure-all spray" }
  - { id: n_hcourse_phylloxera_limit, node_type: learning_point, name: "No European year from that page" }
  - { id: n_hcourse_modern, node_type: production_principle, name: "How do appellation law, Prohibition, and the 1976 tasting differ in scale?" }
  - { id: n_hcourse_modern_aoc, node_type: learning_point, name: "A name can be legally controlled" }
  - { id: n_hcourse_modern_ban, node_type: learning_point, name: "Repeal is not a quality law" }
  - { id: n_hcourse_modern_tasting, node_type: learning_point, name: "1976 is one tasting" }
  - { id: n_hcourse_case_oldest, node_type: production_case, name: "A guest says Areni is the oldest wine" }
  - { id: n_hcourse_case_oldest_action, node_type: learning_point, name: "Split residue from installation" }
  - { id: n_hcourse_case_oldest_reason, node_type: learning_point, name: "The papers measure different things" }
  - { id: n_hcourse_case_oldest_tradeoff, node_type: learning_point, name: "A press phrase is not the paper" }
  - { id: n_hcourse_case_oldest_limit, node_type: learning_point, name: "Neither paper closes the search" }
  - { id: n_hcourse_case_napoleon, node_type: production_case, name: "A guest treats every Napoleon as one event" }
  - { id: n_hcourse_case_napoleon_action, node_type: learning_point, name: "Separate the three uses" }
  - { id: n_hcourse_case_napoleon_reason, node_type: learning_point, name: "Each use has its own date and job" }
  - { id: n_hcourse_case_napoleon_tradeoff, node_type: learning_point, name: "An age word is not an authentication" }
  - { id: n_hcourse_case_napoleon_limit, node_type: learning_point, name: "Naming the word does not prove the bottle" }
  - { id: n_hcourse_case_boundary, node_type: production_case, name: "A guest says Methuen created the Douro" }
  - { id: n_hcourse_case_boundary_action, node_type: learning_point, name: "Separate tax from demarcation" }
  - { id: n_hcourse_case_boundary_reason, node_type: learning_point, name: "1703 and 1756 solve different problems" }
  - { id: n_hcourse_case_boundary_tradeoff, node_type: learning_point, name: "Earlier lines already existed" }
  - { id: n_hcourse_case_boundary_limit, node_type: learning_point, name: "The charter is not today's map" }
  - { id: n_hcourse_case_bubble, node_type: production_case, name: "A guest credits Dom Perignon with inventing Champagne" }
  - { id: n_hcourse_case_bubble_action, node_type: learning_point, name: "Do not credit him with Merrett's method" }
  - { id: n_hcourse_case_bubble_reason, node_type: learning_point, name: "The paper is earlier than his appointment" }
  - { id: n_hcourse_case_bubble_tradeoff, node_type: learning_point, name: "Cellar work is not invention" }
  - { id: n_hcourse_case_bubble_limit, node_type: learning_point, name: "One account is not every archive" }

  - { id: n_hcourse_phylloxera_year, node_type: learning_point, name: "1863 to 1893 is one page's French range" }
  - { id: n_hcourse_case_phylloxera, node_type: production_case, name: "A guest says every European vine died in 1863" }
  - { id: n_hcourse_case_phylloxera_action, node_type: learning_point, name: "Give the range and refuse the census" }
  - { id: n_hcourse_case_phylloxera_reason, node_type: learning_point, name: "The disappearance clause is in the same sentence" }
  - { id: n_hcourse_case_phylloxera_tradeoff, node_type: learning_point, name: "The French range can be repeated" }
  - { id: n_hcourse_case_phylloxera_limit, node_type: learning_point, name: "One encyclopaedia page is not every history" }

  - { id: n_hcourse_doc, node_type: production_principle, name: "What did the opened 1963 article define?" }
  - { id: n_hcourse_doc_name, node_type: learning_point, name: "A geographic name tied to vines and environment" }
  - { id: n_hcourse_doc_unread, node_type: learning_point, name: "This view stopped before any later article" }
  - { id: n_hcourse_case_doc, node_type: production_case, name: "A guest says 1963 invented the letters DOC" }
  - { id: n_hcourse_case_doc_action, node_type: learning_point, name: "Quote article 1 and stop" }
  - { id: n_hcourse_case_doc_reason, node_type: learning_point, name: "The loaded text does not use those abbreviations" }
  - { id: n_hcourse_case_doc_tradeoff, node_type: learning_point, name: "The definition can still be taught" }
  - { id: n_hcourse_case_doc_limit, node_type: learning_point, name: "Unread articles are not a denial" }

  - { id: n_hcourse_doc_three, node_type: learning_point, name: "Three 1963 names, and no DOC abbreviation" }
  - { id: n_hcourse_doc_semplice, node_type: learning_point, name: "Semplice is traditional grapes and local use" }
  - { id: n_hcourse_doc_repeal, node_type: learning_point, name: "The current Normattiva view says the decree is abrogated" }
  - { id: n_hcourse_case_repeal, node_type: production_case, name: "A guest treats the 1963 decree as today's code" }
  - { id: n_hcourse_case_repeal_action, node_type: learning_point, name: "Date the categories and say they are not current" }
  - { id: n_hcourse_case_repeal_reason, node_type: learning_point, name: "Two opened pages mark the repeal" }
  - { id: n_hcourse_case_repeal_tradeoff, node_type: learning_point, name: "The 1963 distinction can still be studied" }
  - { id: n_hcourse_case_repeal_limit, node_type: learning_point, name: "The 2016 law was not opened" }

  - { id: n_hcourse_doc_2010, node_type: learning_point, name: "The 2010 decree defined DOP and IGP, then was itself repealed" }

  - { id: n_hcourse_doc_now, node_type: learning_point, name: "DOC and DOCG are traditional mentions for a DOP" }
  - { id: n_hcourse_case_letters, node_type: production_case, name: "A guest says DOC is not a DOP" }
  - { id: n_hcourse_case_letters_action, node_type: learning_point, name: "Put the abbreviation on the 2016 article" }
  - { id: n_hcourse_case_letters_reason, node_type: learning_point, name: "Article 28 classifies DOP into DOC and DOCG" }
  - { id: n_hcourse_case_letters_tradeoff, node_type: learning_point, name: "The label may show either wording" }
  - { id: n_hcourse_case_letters_limit, node_type: learning_point, name: "Not every bottle is a DOCG" }

