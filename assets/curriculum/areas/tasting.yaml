# The app's own tasting frameworks (backlog T1, legal review L-2).
# Their names, sections, attributes and scale words are written for this app
# and copy no examining body's grid: a structured grid for the WSET track
# and a deductive one for the CMS track. The framework column names only
# which track a grid serves.

tasting_grids:
  - { id: tg_structured, framework: WSET_SAT, version: "1.0", display_name: "Structured tasting" }
  - { id: tg_deductive, framework: CMS_DTM, version: "1.0", display_name: "Deductive tasting" }

