knowledge_items:
  - id: ki_cms_example_distillation
    subject_id: n_cms_example_distillation
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_example_distillation_point
    domain_id: service
    assertion_text: "At Introductory level, distillation follows fermentation: a fermented liquid is heated, separated and condensed. The European Commission describes this sequence for Irish Whiskey wash and distinguishes pot and column methods. The principle alone cannot predict a specific bottle's flavour."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T00:00:00.000Z"
  - id: ki_cms_example_islay
    subject_id: n_cms_example_islay
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_example_islay_point
    domain_id: service
    assertion_text: "The Scotch Whisky Association lists Islay among five Scotch Whisky regions and describes it as an island famous for heavily peated whiskies. Bruichladdich describes its own Islay single-malt range as unpeated. Islay therefore identifies a region, not a rule that every Islay bottling must taste smoky."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T00:00:00.000Z"
  - id: ki_cms_example_mezcal
    subject_id: n_cms_example_mezcal
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_example_mezcal_point
    domain_id: service
    assertion_text: "Mexico's Mezcal NOM defines a 100% maguey or agave distilled beverage and permits qualifying Agave species grown in its protected area. The Tequila NOM specifies Agave tequilana Weber blue variety as its agave source. These are distinct protected names; neither designation alone establishes a bottle's smoky flavour."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T00:00:00.000Z"
  - id: ki_cms_example_grappa
    subject_id: n_cms_example_grappa
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_example_grappa_point
    domain_id: service
    assertion_text: "Italy's Grappa geographical-indication technical sheet identifies it as grape marc spirit and describes Italian production requirements. EU Annex I category 6 distinguishes grape marc spirit from wine spirit. Grappa is not a synonym for every grape distillate."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T00:00:00.000Z"
  - id: ki_cms_example_fruit_eau_de_vie
    subject_id: n_cms_example_fruit_eau_de_vie
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_example_fruit_eau_de_vie_point
    domain_id: service
    assertion_text: "EU Annex I category 9 fruit spirit is made by fermenting and distilling fresh fleshy fruit or its must, berries, or vegetables; kirsch is an allowed name for cherry spirit. A fruit eau-de-vie example is thus different in base material from grape marc spirit. The category does not prescribe an individual bottle's exact aroma."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T00:00:00.000Z"
  - id: ki_cms_example_chambord
    subject_id: n_cms_example_liqueur_families
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_example_chambord
    domain_id: service
    assertion_text: "Chambord's producer describes a berry infusion involving blackberries, raspberries and blackcurrants, later blended with other flavours. It is a berry-led fruit-liqueur example, not evidence that all fruit liqueurs use the same berries or infusion method."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T00:00:00.000Z"
  - id: ki_cms_example_frangelico
    subject_id: n_cms_example_liqueur_families
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_example_frangelico
    domain_id: service
    assertion_text: "Frangelico's producer identifies Italian hazelnuts as its main flavour source, alongside cocoa, vanilla and coffee notes. It is a nut-flavour liqueur example, not a guarantee about a guest's allergies or the ingredients of other nut liqueurs."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T00:00:00.000Z"
  - id: ki_cms_example_st_germain
    subject_id: n_cms_example_liqueur_families
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_example_st_germain
    domain_id: service
    assertion_text: "St-Germain's producer describes fresh elderflower blossoms and maceration for its liqueur. It is a flower-flavour example; a floral recommendation still depends on the actual stocked product and the guest's preference."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T00:00:00.000Z"
  - id: ki_cms_example_baileys
    subject_id: n_cms_example_liqueur_families
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_example_baileys
    domain_id: service
    assertion_text: "The maker describes Baileys Original Irish Cream as containing Irish whiskey and spirits, Irish dairy cream, and chocolate and vanilla flavours. It offers a cream-liqueur example beyond the fruit, nut and flower examples; do not present this product as dairy-free or infer every cream liqueur's recipe from it."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T00:00:00.000Z"
  - id: ki_cms_example_agave_action
    subject_id: n_cms_example_agave_case
    relation_type: CASE_ACTION
    object_id: n_cms_example_agave_action
    domain_id: service
    assertion_text: "If a guest requests Mezcal but the list has only Tequila, explain that they are distinct Mexican designations and ask whether the available Tequila would meet the guest's preference instead of presenting it as Mezcal."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T00:00:00.000Z"
  - id: ki_cms_example_agave_reason
    subject_id: n_cms_example_agave_case
    relation_type: CASE_REASON
    object_id: n_cms_example_agave_reason
    domain_id: service
    assertion_text: "The Tequila NOM specifies blue Agave tequilana Weber as its agave source. The Mezcal NOM permits qualifying Agave species in its protected area and requires the species used to be named on the label. They should not be treated as interchangeable names."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T00:00:00.000Z"
  - id: ki_cms_example_agave_tradeoff
    subject_id: n_cms_example_agave_case
    relation_type: CASE_TRADEOFF
    object_id: n_cms_example_agave_tradeoff
    domain_id: service
    assertion_text: "A particular Tequila might suit the guest's flavour request, but substituting it changes the requested designation. Ask about the desired taste instead of assuming all Mezcal is smoky or all Tequila is alike."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T00:00:00.000Z"
  - id: ki_cms_example_agave_limit
    subject_id: n_cms_example_agave_case
    relation_type: CASE_LIMITATION
    object_id: n_cms_example_agave_limit
    domain_id: service
    assertion_text: "Check the current bottle label and actual stock. The NOMs define categories and labelling, but they do not establish an individual bottle's sensory profile or the guest's preference."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T00:00:00.000Z"
  - id: ki_cms_example_marc_action
    subject_id: n_cms_example_marc_case
    relation_type: CASE_ACTION
    object_id: n_cms_example_marc_action
    domain_id: service
    assertion_text: "For a guest asking for Grappa, offer a labelled Grappa if stocked. If offering kirsch instead, say clearly that it is a cherry fruit spirit rather than the requested grape marc spirit."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T00:00:00.000Z"
  - id: ki_cms_example_marc_reason
    subject_id: n_cms_example_marc_case
    relation_type: CASE_REASON
    object_id: n_cms_example_marc_reason
    domain_id: service
    assertion_text: "Italy's Grappa technical sheet identifies it as grape marc spirit, while EU fruit-spirit rules identify kirsch as cherry spirit. Fermented grape press residue and fermented cherries are different raw materials."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T00:00:00.000Z"
  - id: ki_cms_example_marc_tradeoff
    subject_id: n_cms_example_marc_case
    relation_type: CASE_TRADEOFF
    object_id: n_cms_example_marc_tradeoff
    domain_id: service
    assertion_text: "If Grappa is unavailable, a fruit eau-de-vie or another grape marc spirit is an alternative only after the guest agrees; identify the category and raw-material change rather than using the names as synonyms."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T00:00:00.000Z"
  - id: ki_cms_example_marc_limit
    subject_id: n_cms_example_marc_case
    relation_type: CASE_LIMITATION
    object_id: n_cms_example_marc_limit
    domain_id: service
    assertion_text: "A geographical-indication technical sheet and category definitions cannot authenticate an unlabelled bottle or confirm restaurant stock. Check the actual label and availability before naming an individual spirit."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T00:00:00.000Z"
  - id: ki_cms_example_liqueur_action
    subject_id: n_cms_example_liqueur_case
    relation_type: CASE_ACTION
    object_id: n_cms_example_liqueur_action
    domain_id: service
    assertion_text: "For a guest asking for a floral liqueur, ask about flavour and serving preference, then check whether St-Germain is stocked as an elderflower example. Do not call Baileys Original a floral substitute simply because both are liqueurs."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T00:00:00.000Z"
  - id: ki_cms_example_liqueur_reason
    subject_id: n_cms_example_liqueur_case
    relation_type: CASE_REASON
    object_id: n_cms_example_liqueur_reason
    domain_id: service
    assertion_text: "St-Germain's maker identifies elderflowers; Baileys Original's maker identifies dairy cream, whiskey and chocolate and vanilla flavours. The two named products answer different flavour requests."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T00:00:00.000Z"
  - id: ki_cms_example_liqueur_tradeoff
    subject_id: n_cms_example_liqueur_case
    relation_type: CASE_TRADEOFF
    object_id: n_cms_example_liqueur_tradeoff
    domain_id: service
    assertion_text: "If the guest changes preference after discussion, Chambord provides a berry-led example and Frangelico a hazelnut-led example if stocked. Those are alternatives to a floral request, not evidence that all fruit or nut liqueurs share their recipes."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T00:00:00.000Z"
  - id: ki_cms_example_liqueur_limit
    subject_id: n_cms_example_liqueur_case
    relation_type: CASE_LIMITATION
    object_id: n_cms_example_liqueur_limit
    domain_id: service
    assertion_text: "Confirm current stock, product label and any dietary needs before service. A producer's flavour description does not certify another brand's ingredients or establish allergy safety; Baileys Original specifically contains dairy cream."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T00:00:00.000Z"
  - id: ki_cms_example_zwarte_kip
    subject_id: n_cms_example_other_liqueur
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_cms_example_zwarte_kip
    domain_id: service
    assertion_text: "Lucas Bols describes Zwarte Kip Advocaat as a thick egg liqueur made with fresh free-range eggs and brandy. It is a concrete example outside fruit, citrus, herb, bean/nut and flower flavour requests in the CMS study inventory. The syllabus's 'non-classified' heading is not an EU legal category or a claim that every such liqueur uses eggs; EU law separately defines egg liqueur or advocaat. Check the current bottle and dietary needs."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T00:00:00.000Z"
  - id: ki_cms_example_egg_action
    subject_id: n_cms_example_egg_case
    relation_type: CASE_ACTION
    object_id: n_cms_example_egg_action
    domain_id: service
    assertion_text: "Ask whether eggs are acceptable and check the current list and label. If Zwarte Kip Advocaat is stocked and suits the guest, offer it as an egg-led dessert liqueur. If it is unavailable or eggs must be avoided, discuss a different labelled product instead of promising an equivalent recipe."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T00:00:00.000Z"
  - id: ki_cms_example_egg_reason
    subject_id: n_cms_example_egg_case
    relation_type: CASE_REASON
    object_id: n_cms_example_egg_reason
    domain_id: service
    assertion_text: "Lucas Bols identifies Zwarte Kip as an egg liqueur containing fresh free-range eggs and brandy; its own guide places Advocaat near cream styles. It therefore answers a rich, egg-led request rather than a berry, hazelnut or elderflower request."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T00:00:00.000Z"
  - id: ki_cms_example_egg_tradeoff
    subject_id: n_cms_example_egg_case
    relation_type: CASE_TRADEOFF
    object_id: n_cms_example_egg_tradeoff
    domain_id: service
    assertion_text: "Baileys Original offers a different cream-liqueur example if stocked and desired, but its maker describes dairy cream and whiskey, not an Advocaat recipe. Treat it as a different option and verify the current label before any dietary recommendation."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T00:00:00.000Z"
  - id: ki_cms_example_egg_limit
    subject_id: n_cms_example_egg_case
    relation_type: CASE_LIMITATION
    object_id: n_cms_example_egg_limit
    domain_id: service
    assertion_text: "The CMS 'non-classified' heading is a study grouping, not an ingredient or allergy certification. The maker's account describes one product at publication time; neither it nor the EU egg-liqueur category proves the stocked bottle's full ingredient list or a guest's tolerance."
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: "2026-09-29T00:00:00.000Z"

certification_knowledge_mappings:
  # Introductory retains recognition at depth 1. The Certified override adds
  # ordinary forward recall at depth 2 for the same distillation principle.
  # Named spirit and liqueur examples remain Certified.
  - { certification_id: CMS_INTRODUCTORY, knowledge_item_id: ki_cms_example_distillation, importance: core, minimum_depth: 1 }
  - { certification_id: CMS_CERTIFIED, knowledge_item_id: ki_cms_example_distillation, importance: core, minimum_depth: 2 }
  - { certification_id: CMS_CERTIFIED, knowledge_item_id: ki_cms_example_islay, importance: core, minimum_depth: 2 }
