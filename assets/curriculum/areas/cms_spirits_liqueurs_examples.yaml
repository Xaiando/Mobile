# CMS Europe 2026/27, printed pp. 24-25: Introductory distillation principle;
# Certified named-spirit identification and liqueur-family recommendation.
# The Introductory principle is inherited by the selectable Certified track.
# Producer examples describe specific products, never a whole flavour family.
# All assertions await qualified review.
knowledge_nodes:
  - { id: n_cms_example_distillation, node_type: production_principle, name: "What does distillation do after fermentation?" }
  - { id: n_cms_example_distillation_point, node_type: learning_point, name: "Fermented liquid is heated, separated and condensed" }
  - { id: n_cms_example_islay, node_type: production_principle, name: "How should an Islay Scotch label be understood?" }
  - { id: n_cms_example_islay_point, node_type: learning_point, name: "Islay is a Scotch Whisky region associated with peat" }
  - { id: n_cms_example_mezcal, node_type: production_principle, name: "How do Mezcal and Tequila standards differ?" }
  - { id: n_cms_example_mezcal_point, node_type: learning_point, name: "The two Mexican designations specify different agave requirements" }
  - { id: n_cms_example_grappa, node_type: production_principle, name: "What is Grappa's raw material and protected identity?" }
  - { id: n_cms_example_grappa_point, node_type: learning_point, name: "Grappa illustrates the grape marc spirit category" }
  - { id: n_cms_example_fruit_eau_de_vie, node_type: production_principle, name: "What identifies a fruit eau-de-vie?" }
  - { id: n_cms_example_fruit_eau_de_vie_point, node_type: learning_point, name: "Kirsch illustrates the EU fruit-spirit category" }
  - { id: n_cms_example_liqueur_families, node_type: production_principle, name: "Which named products illustrate missing liqueur flavour families?" }
  - { id: n_cms_example_chambord, node_type: learning_point, name: "Chambord illustrates a berry-led fruit liqueur" }
  - { id: n_cms_example_frangelico, node_type: learning_point, name: "Frangelico illustrates a hazelnut liqueur" }
  - { id: n_cms_example_st_germain, node_type: learning_point, name: "St-Germain illustrates an elderflower liqueur" }
  - { id: n_cms_example_baileys, node_type: learning_point, name: "Baileys Original illustrates an Irish cream liqueur" }
  - { id: n_cms_example_other_liqueur, node_type: production_principle, name: "What illustrates the CMS non-classified liqueur group?" }
  - { id: n_cms_example_zwarte_kip, node_type: learning_point, name: "Zwarte Kip Advocaat is an egg-led liqueur example" }
  - { id: n_cms_example_agave_case, node_type: production_case, name: "A guest requests Mezcal but the list has only Tequila" }
  - { id: n_cms_example_agave_action, node_type: learning_point, name: "Explain the substitution and ask whether it suits the guest" }
  - { id: n_cms_example_agave_reason, node_type: learning_point, name: "Their agave-source standards differ" }
  - { id: n_cms_example_agave_tradeoff, node_type: learning_point, name: "A Tequila may suit a flavour request without becoming Mezcal" }
  - { id: n_cms_example_agave_limit, node_type: learning_point, name: "Check the bottle and do not infer smoke from designation" }
  - { id: n_cms_example_marc_case, node_type: production_case, name: "A guest requests Grappa but is offered cherry eau-de-vie" }
  - { id: n_cms_example_marc_action, node_type: learning_point, name: "Offer labelled Grappa if stocked or explain the alternative" }
  - { id: n_cms_example_marc_reason, node_type: learning_point, name: "Grape marc and fermented cherry are different bases" }
  - { id: n_cms_example_marc_tradeoff, node_type: learning_point, name: "An alternative spirit changes the requested category" }
  - { id: n_cms_example_marc_limit, node_type: learning_point, name: "The standards cannot authenticate an unlabelled bottle" }
  - { id: n_cms_example_liqueur_case, node_type: production_case, name: "A guest wants a floral liqueur and is offered Irish cream" }
  - { id: n_cms_example_liqueur_action, node_type: learning_point, name: "Ask about flavour and check a stocked floral example" }
  - { id: n_cms_example_liqueur_reason, node_type: learning_point, name: "St-Germain and Baileys Original use different flavour materials" }
  - { id: n_cms_example_liqueur_tradeoff, node_type: learning_point, name: "Berry and hazelnut examples answer other preferences" }
  - { id: n_cms_example_liqueur_limit, node_type: learning_point, name: "Check stock, current label and dietary needs" }
  - { id: n_cms_example_egg_case, node_type: production_case, name: "A guest asks for a rich dessert liqueur beyond fruit, nut and flower" }
  - { id: n_cms_example_egg_action, node_type: learning_point, name: "Check stock and egg suitability before offering Advocaat" }
  - { id: n_cms_example_egg_reason, node_type: learning_point, name: "Zwarte Kip is described with eggs and brandy" }
  - { id: n_cms_example_egg_tradeoff, node_type: learning_point, name: "A different cream liqueur needs a new ingredient check" }
  - { id: n_cms_example_egg_limit, node_type: learning_point, name: "Non-classified is a study heading, not an allergy rule" }

