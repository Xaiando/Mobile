question_templates:
  - id: qt_cms_example_recognition
    relation_type: PRINCIPLE_EXPLANATION
    direction: forward
    mode: authored_choice
    variant: cms_spirit_liqueur_examples
    prompt_template: "{subject.name}"
    parameters:
      item_choices:
        ki_cms_example_distillation:
          prompt: A learner equates fermentation with distillation. Which correction matches the Irish Whiskey GI explanation?
          options:
            - After fermentation, the wash is heated, separated and condensed.
            - After maturation, yeast changes spirit back into fermented wash.
            - During pressing, grape solids become bottled whiskey directly.
            - During service, filtration changes still wine into whiskey.
          correctIndex: 0
          explanation: The Commission describes fermented wash moving into a distinct heating, separation and condensation stage.
          sourceCitationId: src_cms_example_ec_irish_gi
        ki_cms_example_islay:
          prompt: A guest asks for a Scotch from Islay. Which statement is supported by the Scotch Whisky Association?
          options:
            - Islay is a Scotch style that legally requires peat smoke.
            - Islay is a Scotch region on an island associated with peated whisky.
            - Islay is a Scotch category requiring triple distillation.
            - Islay is a Scotch region that includes all Scottish islands.
          correctIndex: 1
          explanation: Islay is one of the five Scotch Whisky regions; the SWA describes the island as famous for peated whiskies.
          sourceCitationId: src_cms_example_swa_regions
        ki_cms_example_mezcal:
          prompt: A guest asks what the Mexican Mezcal standard allows. Which answer fits that standard?
          options:
            - Only blue Weber agave, as specified for Tequila.
            - Any Agave species, regardless of where it grows.
            - Qualifying Agave species grown in the protected Mezcal area.
            - Only agave grown in Jalisco, for every Mezcal.
          correctIndex: 2
          explanation: NOM-070 permits qualifying Agave species grown in the protected area and requires species identification on the bottle.
          sourceCitationId: src_cms_example_mezcal_nom
        ki_cms_example_grappa:
          prompt: Which category does the cited Italian technical sheet assign to Grappa?
          options:
            - Fruit spirit, from fermented cherries.
            - Wine spirit, from distilled wine.
            - Nut liqueur, from hazelnuts.
            - Grape marc spirit, from grape press residue.
          correctIndex: 3
          explanation: Italy's GI technical sheet identifies Grappa as a grape marc spirit.
          sourceCitationId: src_cms_example_grappa_italian_file
        ki_cms_example_fruit_eau_de_vie:
          prompt: A guest asks for a cherry eau-de-vie. Which EU fruit-spirit name matches that base?
          options:
            - Kirsch, from fermented cherries.
            - Grappa, from fermented grape marc.
            - Cognac, from distilled grape wine.
            - Frangelico, from infused hazelnuts.
          correctIndex: 0
          explanation: EU Annex I permits kirsch as a name for cherry fruit spirit, distinct from grape marc spirit.
          sourceCitationId: src_cms_example_eu_spirits_annex
        ki_cms_example_chambord:
          prompt: A guest wants a berry-led liqueur. Which listed producer example matches that request?
          options:
            - Baileys Original, described through Irish dairy cream.
            - Chambord, described through several berry infusions.
            - Frangelico, described through Italian hazelnuts.
            - St-Germain, described through elderflower blossoms.
          correctIndex: 1
          explanation: Chambord describes infusions involving blackberries, raspberries and blackcurrants.
          sourceCitationId: src_cms_example_chambord_maker
        ki_cms_example_frangelico:
          prompt: Which named liqueur is the maker's hazelnut-led example for a nut-flavour request?
          options:
            - St-Germain, with elderflower blossoms.
            - Chambord, with mixed berry infusions.
            - Frangelico, with Italian hazelnuts.
            - Baileys Original, with Irish dairy cream.
          correctIndex: 2
          explanation: Frangelico identifies Italian hazelnuts as a central flavour source; check the bottle for dietary needs.
          sourceCitationId: src_cms_example_frangelico_maker
        ki_cms_example_st_germain:
          prompt: Which named liqueur is the maker's floral example for an elderflower request?
          options:
            - Chambord, built around berry infusions.
            - Frangelico, built around hazelnuts.
            - Baileys Original, built around cream.
            - St-Germain, built around elderflowers.
          correctIndex: 3
          explanation: St-Germain's FAQ identifies elderflower blossoms and describes a maceration step.
          sourceCitationId: src_cms_example_st_germain_maker
        ki_cms_example_baileys:
          prompt: Which named example must not be presented as dairy-free on the maker's current description?
          options:
            - Baileys Original, which includes Irish dairy cream.
            - St-Germain, which describes elderflower blossoms.
            - Chambord, which describes several berry infusions.
            - Frangelico, which describes Italian hazelnuts.
          correctIndex: 0
          explanation: Baileys Original explicitly includes Irish dairy cream; still confirm the current bottle and guest needs.
          sourceCitationId: src_cms_example_baileys_maker
        ki_cms_example_zwarte_kip:
          prompt: Which producer example helps a learner practise the CMS non-classified liqueur heading beyond fruit, nut and flower flavours?
          options:
            - Chambord, described through berry infusions.
            - Frangelico, described through hazelnuts.
            - Zwarte Kip Advocaat, described through eggs and brandy.
            - St-Germain, described through elderflower blossoms.
          correctIndex: 2
          explanation: Lucas Bols identifies Zwarte Kip as an egg liqueur; CMS does not define a legal non-classified category or name this brand.
          sourceCitationId: src_cms_example_zwarte_kip_maker
  - id: qt_cms_example_scenario_choice
    relation_type: CASE_ACTION
    direction: forward
    mode: authored_choice
    variant: cms_spirit_liqueur_service
    prompt_template: "{subject.name}"
    parameters:
      item_choices:
        ki_cms_example_agave_action:
          prompt: A guest requests Mezcal, but the list offers only Tequila. What should the server do first?
          options:
            - Present Tequila as Mezcal because both names involve agave.
            - Promise every Mezcal is smoky and dismiss the request.
            - Explain the names differ and ask before substituting.
            - Pour a clear spirit without checking its actual label.
          correctIndex: 2
          explanation: Mezcal has its own defined, labelled designation; verify stock and seek the guest's agreement before a different offer.
          sourceCitationId: src_cms_example_mezcal_nom
        ki_cms_example_marc_action:
          prompt: A guest asks for Grappa. Which category should the server check on a labelled bottle?
          options:
            - French fruit spirit made from cherries.
            - Generic wine spirit made from wine.
            - Cream liqueur made with dairy.
            - Grape marc spirit named Grappa.
          correctIndex: 3
          explanation: Italy's GI technical sheet identifies Grappa as grape marc spirit; check the specific label and stock.
          sourceCitationId: src_cms_example_grappa_italian_file
        ki_cms_example_liqueur_action:
          prompt: A guest requests a floral liqueur. Which first recommendation is grounded in the cited maker account?
          options:
            - Check whether St-Germain elderflower is stocked and suits the guest.
            - Assume Baileys Original is floral because it is a liqueur.
            - Promise any hazelnut liqueur has an elderflower profile.
            - Offer any berry liqueur without asking about preference.
          correctIndex: 0
          explanation: St-Germain's maker identifies elderflower blossoms; any recommendation also needs a stock and preference check.
          sourceCitationId: src_cms_example_st_germain_maker
        ki_cms_example_egg_action:
          prompt: A guest wants a rich dessert liqueur rather than fruit or flowers and asks about eggs. Zwarte Kip appears on the list. What should the server do?
          options:
            - Serve Zwarte Kip immediately because a menu listing guarantees the current bottle and its ingredients.
            - Promise that every CMS non-classified liqueur is free from egg and dairy.
            - Substitute St-Germain because flower liqueurs have the same egg-led profile.
            - Check the stocked bottle and label, ask whether eggs are acceptable, then offer Zwarte Kip only if suitable.
          correctIndex: 3
          explanation: Lucas Bols describes Zwarte Kip as an egg liqueur; a conditional recommendation must verify stock, label and guest needs.
          sourceCitationId: src_cms_example_zwarte_kip_maker
  - id: qt_cms_example_case_agave
    relation_type: CASE_ACTION
    direction: forward
    mode: short_answer
    variant: cms_agave_substitution
    prompt_template: >-
      A guest asks for Mezcal, but your current list has only Tequila. How do
      you explain the distinction, offer a conditional alternative and check
      the bottle and guest preference without assuming either tastes smoky?
    parameters:
      scope_node_ids: [n_cms_example_agave_case]
      key_points: {CASE_ACTION: Guest response, CASE_REASON: Agave standard, CASE_TRADEOFF: Conditional alternative, CASE_LIMITATION: Bottle check}
  - id: qt_cms_example_case_marc
    relation_type: CASE_ACTION
    direction: forward
    mode: short_answer
    variant: cms_marc_fruit_substitution
    prompt_template: >-
      A guest asks for Grappa but a colleague offers cherry eau-de-vie. Explain
      the raw-material distinction, propose a response if Grappa is unavailable
      and state what must be checked before naming a bottle.
    parameters:
      scope_node_ids: [n_cms_example_marc_case]
