  "knowledge_items": [
    {
      "id": "ki_d45body_champagne",
      "subject_id": "n_d45body_champagne",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d45body_champagne_point",
      "domain_id": "business",
      "assertion_text": "Comite Champagne works across growers and houses on industry balance, the shared reserve, vineyard and wine research, and defence and education for the Champagne designation. Collective support does not establish one producer's realised price or a buyer's preference.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-02T23:10:43.000Z"
    },
    {
      "id": "ki_d45body_cava",
      "subject_id": "n_d45body_cava",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d45body_cava_point",
      "domain_id": "business",
      "assertion_text": "The Cava Regulatory Board describes delegated product control and certification under the competent public authority, covering origin, method and analytical and sensory characteristics against the specification. It also defends and promotes Cava. Training attendance or a producer's advertisement is not a product certification record.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-02T23:10:43.000Z"
    },
    {
      "id": "ki_d45body_cap",
      "subject_id": "n_d45body_cap",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d45body_cap_point",
      "domain_id": "business",
      "assertion_text": "The Cap Classique Producers Association describes promotion of the South African bottle-fermented category, producer interests and member technical and base-wine assessment work. This description supports its industry role; a membership statement alone does not supply a named finished lot's release or compliance evidence.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-02T23:10:43.000Z"
    },
    {
      "id": "ki_d45body_sherry",
      "subject_id": "n_d45body_sherry",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d45body_sherry_point",
      "domain_id": "business",
      "assertion_text": "The Sherry Regulatory Council groups its functions into control and certification, protection of the shared heritage, and promotion. Vineyard and cellar controls support designation claims; educational courses communicate the wines. Completing a course is distinct from obtaining evidence for the particular product being sold.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-02T23:10:43.000Z"
    },
    {
      "id": "ki_d45body_ivdp",
      "subject_id": "n_d45body_ivdp",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d45body_ivdp_point",
      "domain_id": "business",
      "assertion_text": "IVDP's mission combines certification, control, defence and promotion of the Porto and Douro protected designations. Its institutional remit is broader than Port advertising or a single merchant's marketing. A general Douro provenance document is not by itself the evidence for a specific Port category claim.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-02T23:10:43.000Z"
    },
    {
      "id": "ki_d45body_ivbam",
      "subject_id": "n_d45body_ivbam",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d45body_ivbam_point",
      "domain_id": "business",
      "assertion_text": "IVBAM's control and certification service explicitly covers DO Madeira, DO Madeirense and IG Terras Madeirenses, alongside other stated responsibilities. The institute's functions also include control and promotion of regional quality wine. A producer's laboratory sheet may inform a dossier, but is not by itself evidence that the intended designation and release have been approved.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-02T23:10:43.000Z"
    },
    {
      "id": "ki_d45body_muscat",
      "subject_id": "n_d45body_muscat",
      "relation_type": "PRINCIPLE_EXPLANATION",
      "object_id": "n_d45body_muscat_point",
      "domain_id": "business",
      "assertion_text": "Campbells' producer history identifies the Muscat of Rutherglen Network with classification development. The trade code describes a voluntary producer-developed Rutherglen scheme, and the regional brochure presents four richness and complexity classes. This establishes industry classification work, not a government PDO authority, a single vintage for a blend, or current legal numeric limits.",
      "verification_status": "unverified",
      "mcq_disabled": true,
      "last_verified_at": "2026-10-02T23:10:43.000Z"
    },
