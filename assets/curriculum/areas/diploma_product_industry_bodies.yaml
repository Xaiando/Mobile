{
  "knowledge_nodes": [
    {
      "id": "n_d45body_champagne",
      "node_type": "production_principle",
      "name": "Which work distinguishes Comite Champagne from a single Champagne producer's sales department?"
    },
    {
      "id": "n_d45body_champagne_point",
      "node_type": "learning_point",
      "name": "It coordinates shared grower-house interests, supply and reserves, technical research and protection and promotion of the designation."
    },
    {
      "id": "n_d45body_cava",
      "node_type": "production_principle",
      "name": "What control role does the Cava Regulatory Board describe alongside promotion?"
    },
    {
      "id": "n_d45body_cava_point",
      "node_type": "learning_point",
      "name": "It is the delegated control body for certification of DOP Cava's origin, production method and product characteristics against its specification."
    },
    {
      "id": "n_d45body_cap",
      "node_type": "production_principle",
      "name": "What does the Cap Classique Producers Association's own account establish about its work?"
    },
    {
      "id": "n_d45body_cap_point",
      "node_type": "learning_point",
      "name": "It promotes the category and members' interests and supports member technical and base-wine assessment work."
    },
    {
      "id": "n_d45body_sherry",
      "node_type": "production_principle",
      "name": "Which complementary functions does the Sherry Regulatory Council describe?"
    },
    {
      "id": "n_d45body_sherry_point",
      "node_type": "learning_point",
      "name": "Control and certification, defence of the shared designation, and promotion including professional education."
    },
    {
      "id": "n_d45body_ivdp",
      "node_type": "production_principle",
      "name": "Which protected wine designations does IVDP's stated mission cover?"
    },
    {
      "id": "n_d45body_ivdp_point",
      "node_type": "learning_point",
      "name": "Porto and Douro: certification, control, defence and promotion are combined responsibilities."
    },
    {
      "id": "n_d45body_ivbam",
      "node_type": "production_principle",
      "name": "How does IVBAM's wine remit differ from a Madeira producer's promotional brochure?"
    },
    {
      "id": "n_d45body_ivbam_point",
      "node_type": "learning_point",
      "name": "Its services control and certify DO Madeira and other stated designations, while the institute also supports and promotes regional wine."
    },
    {
      "id": "n_d45body_muscat",
      "node_type": "production_principle",
      "name": "What is the source-supported role of the Muscat of Rutherglen Network in classification?"
    },
    {
      "id": "n_d45body_muscat_point",
      "node_type": "learning_point",
      "name": "Producer collaboration developed a style-classification system to help buyers distinguish wines; the cited trade code describes the Rutherglen scheme as voluntary."
    },
    {
      "id": "n_d45body_case_sparkling_roles",
      "node_type": "production_case",
      "name": "Original fictional importer exercise. A Champagne house asks where to discuss shared reserve/supply planning and technical research. A Cava supplier offers a generic training attendance certificate instead of records for the named shipment's claimed DOP category. A South African supplier cites its CCPA membership but supplies no lot analysis or production dossier. No origin, category approval, costs or buyer preference is supplied for these wines. Route the three different enquiries to the relevant named bodies and evidence processes, and distinguish technical or promotional support from proof of the actual shipment. These records and requests are invented; the organisations' documented roles are factual study content."
    },
    {
      "id": "n_d45body_sparkling_roles_action_point",
      "node_type": "learning_point",
      "name": "Use Comite Champagne for shared industry/technical enquiries; obtain the relevant Cava certification dossier, and request the Cap Classique supplier's actual lot and compliance evidence separately from CCPA membership."
    },
    {
      "id": "n_d45body_sparkling_roles_reason_point",
      "node_type": "learning_point",
      "name": "Champagne interprofessional coordination, Cava delegated product certification and CCPA member promotion/technical work answer different questions; none of the supplied substitute documents proves this shipment's claims."
    },
    {
      "id": "n_d45body_sparkling_roles_tradeoff_point",
      "node_type": "learning_point",
      "name": "Collective technical and training support can inform planning and communication, while lot documentation and competent product checks take time and may change the release schedule."
    },
    {
      "id": "n_d45body_sparkling_roles_limitation_point",
      "node_type": "learning_point",
      "name": "Confirm the current procedure, lot identity and complete approval records with the responsible parties; organisational descriptions cannot establish the wine's condition, commercial return or all current legal rules."
    },
    {
      "id": "n_d45body_case_fortified_roles",
      "node_type": "production_case",
      "name": "Original fictional wine buyer exercise. A supplier's intended Port lot has only a general Douro origin statement. A Sherry seller substitutes a seminar attendance certificate for the named wine's product documentation. A Madeira seller supplies a producer laboratory sheet without the intended DO and release documentation. The buyer wants truthful product claims rather than a generic regional advert; no category approvals are supplied. Identify the relevant council or institute for each dossier and the different value of their product control and educational or promotional work. All supplier documents and offers are invented; no real product is judged."
    },
    {
      "id": "n_d45body_fortified_roles_action_point",
      "node_type": "learning_point",
      "name": "Seek the appropriate IVDP evidence for Port, Sherry Council product-control evidence for Sherry and IVBAM DO Madeira dossier evidence, rather than treating origin notes, seminar attendance or a lab sheet as complete approval."
    },
    {
      "id": "n_d45body_fortified_roles_reason_point",
      "node_type": "learning_point",
      "name": "The named bodies have distinct territorial and product-control remits as well as promotional roles; the supplied documents answer only part of the intended wine claims."
    },
    {
      "id": "n_d45body_fortified_roles_tradeoff_point",
      "node_type": "learning_point",
      "name": "A coordinated education plan can help staff explain the wines, but completing missing product checks requires separate work and can delay the promised buying or launch schedule."
    },
    {
      "id": "n_d45body_fortified_roles_limitation_point",
      "node_type": "learning_point",
      "name": "Authenticate the actual lot, designation and category documents and current process; the packet establishes neither finished-wine quality, legal permission for release nor a profitable order."
    },
    {
      "id": "n_d45body_case_muscat_classification",
      "node_type": "production_case",
      "name": "Original fictional Rutherglen label and training exercise. A supplier says it participates in producer classification work and proposes Grand on a blended Muscat label. It supplies neither the applicable classification evidence nor the blend records. The oldest component is highlighted in an advert as though it were the vintage of every component. The buyer has a regional four-class style brochure and a legacy trade code, but no current label review or lot sample. Decide what the Network's classification role can explain and which evidence is still needed. All supplier statements, records and planned claims are invented; no age range, membership rule or statutory power is asserted."
    },
    {
      "id": "n_d45body_muscat_classification_action_point",
      "node_type": "learning_point",
      "name": "Use the producer classification framework for style education, but obtain the actual blend and classification evidence and current label review before repeating the proposed Grand and vintage claims."
    },
    {
      "id": "n_d45body_muscat_classification_reason_point",
      "node_type": "learning_point",
      "name": "The Network's historical classification work and the voluntary scheme organise style descriptors; participation or a highlighted old component does not substantiate this blended lot's class or a single harvest year."
    },
    {
      "id": "n_d45body_muscat_classification_tradeoff_point",
      "node_type": "learning_point",
      "name": "A shared style vocabulary helps communication, while documenting the actual blend and intended label takes work and may require revising the supplier's promotional story."
    },
    {
      "id": "n_d45body_muscat_classification_limitation_point",
      "node_type": "learning_point",
      "name": "Check the scheme's current applicable criteria, authentic lot records, sample condition and destination labelling requirements; the legacy code is not a current-law certificate or a guarantee of sales."
    }
  ],
