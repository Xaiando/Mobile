  - id: n_reg_am_case_california_sites
    node_type: production_case
    name: "California site choice: Carneros Pinot Noir and warmer Napa Cabernet targets. A grower can
      contract a cool, bay-influenced Carneros parcel or a warmer upper Napa parcel. The plans are a
      fresh Pinot Noir and a fully ripe Cabernet Sauvignon. Both sites have adequate water and suitable
      soils; the warmer parcel has the lower quoted fruit cost. Propose a defensible site allocation,
      explain the regional mechanism, and discuss a commercial tradeoff and a limitation before
      contracting. Do not infer quality from the appellation alone."
  - id: n_reg_am_point_case_california_sites_action
    node_type: learning_point
    name: Trial Pinot Noir in Carneros and Cabernet at the warmer site
  - id: n_reg_am_point_case_california_sites_reason
    node_type: learning_point
    name: Different marine exposure alters ripening conditions
  - id: n_reg_am_point_case_california_sites_tradeoff
    node_type: learning_point
    name: Style fit can outweigh the lower quote
  - id: n_reg_am_point_case_california_sites_limitation
    node_type: learning_point
    name: Check vineyard and vintage evidence before commitment
  - id: n_reg_am_case_pacific_northwest
    node_type: production_case
    name: "Pacific Northwest sourcing: Willamette Pinot Noir versus Columbia Valley Cabernet. A buyer needs
      two dry wines: a fresh Pinot Noir and a ripe Cabernet Sauvignon with retained acidity. A Willamette
      supplier offers Pinot Noir; an eastern Columbia Valley supplier offers Cabernet with documented
      irrigation. The latter quote is cheaper but requires a larger order. Propose a defensible sourcing
      plan, compare growing conditions, and explain a tradeoff and the evidence needed before promising
      quality or price."
  - id: n_reg_am_point_case_pacific_northwest_action
    node_type: learning_point
    name: Assess both regional offers against their stated targets
  - id: n_reg_am_point_case_pacific_northwest_reason
    node_type: learning_point
    name: Different regional conditions allow ripeness and acidity
  - id: n_reg_am_point_case_pacific_northwest_tradeoff
    node_type: learning_point
    name: The larger cheap order ties up more inventory
  - id: n_reg_am_point_case_pacific_northwest_limitation
    node_type: learning_point
    name: Northern latitude and region cannot certify wine quality
  - id: n_reg_am_case_chile_white
    node_type: production_case
    name: "Chile fresh-white procurement: cool coastal parcel versus warmer inland offer. A Chilean supplier
      offers Chardonnay from a cooler coastal Aconcagua parcel or a warmer inland parcel. Samples from
      the coast meet the buyer's freshness target; the inland sample is fuller and riper. The coastal
      quote is higher and volume smaller. The buyer wants a fresh dry white for prompt release. Recommend
      a defensible offer, explain the regional context, a commercial tradeoff and a limitation. No soil
      name alone proves a mineral flavour."
  - id: n_reg_am_point_case_chile_white_action
    node_type: learning_point
    name: Select the coastal sample if cost and volume fit
  - id: n_reg_am_point_case_chile_white_reason
    node_type: learning_point
    name: Coastal conditions support cooler-climate grape growing
  - id: n_reg_am_point_case_chile_white_tradeoff
    node_type: learning_point
    name: Freshness fit comes with the stated higher cost
  - id: n_reg_am_point_case_chile_white_limitation
    node_type: learning_point
    name: A regional tendency does not prove every bottle style
  - id: n_reg_am_case_mendoza_claim
    node_type: production_case
    name: "Mendoza Malbec procurement: altitude claim versus observed value. Two dry Mendoza Malbec samples
      are available from the same vintage: one from a higher Uco Valley site and one from a lower warmer
      site. Their suppliers use different harvest dates and oak regimes. The higher-site quote is
      greater. A retailer wants balanced fruit and acidity within a fixed margin and asks whether
      altitude justifies the premium. Propose a defensible evaluation, explain a mechanism, and give a
      tradeoff and a limitation."
  - id: n_reg_am_point_case_mendoza_claim_action
    node_type: learning_point
    name: Compare samples and total quoted cost against the target
  - id: n_reg_am_point_case_mendoza_claim_reason
    node_type: learning_point
    name: Higher Mendoza sites may alter temperature and UV-B
  - id: n_reg_am_point_case_mendoza_claim_tradeoff
    node_type: learning_point
    name: The premium can reduce margin unless target fit improves
  - id: n_reg_am_point_case_mendoza_claim_limitation
    node_type: learning_point
    name: Different harvest and oak confound an altitude comparison
