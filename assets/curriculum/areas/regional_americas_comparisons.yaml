knowledge_items:
  - id: ki_reg_am_carneros_cooling
    subject_id: n_reg_am_principle_napa_contrast
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_am_point_carneros_cooling
    domain_id: geography
    assertion_text: Marine air arriving across San Pablo Bay moderates Carneros temperatures, making it
      cooler than many sites farther up Napa Valley.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_upper_napa_warmth
    subject_id: n_reg_am_principle_napa_contrast
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_am_point_upper_napa_warmth
    domain_id: geography
    assertion_text: Sites farther up Napa Valley generally receive less Pacific moderation and have warmer
      summers; elevation, exposure and hills still differentiate individual vineyards.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_russian_river_pinot
    subject_id: n_reg_am_principle_sonoma_contrast
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_am_point_russian_river_pinot
    domain_id: geography
    assertion_text: Pacific fog cools Russian River Valley and extends ripening; Pinot Noir and Chardonnay
      are established regional examples, rather than an exclusive legal grape set.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_alexander_cabernet
    subject_id: n_reg_am_principle_sonoma_contrast
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_am_point_alexander_cabernet
    domain_id: geography
    assertion_text: Warmer inland Alexander Valley has heat for Cabernet Sauvignon ripening while cool
      evenings can help retain acidity; Sonoma is not one uniform growing environment.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_templeton_air
    subject_id: n_reg_am_principle_paso_contrast
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_am_point_templeton_air
    domain_id: geography
    assertion_text: Gaps in the Santa Lucia Range channel cool Pacific air into Templeton Gap and farther
      inland, moderating temperatures relative to less marine-influenced Paso sites.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_templeton_ripening
    subject_id: n_reg_am_principle_paso_contrast
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_am_point_templeton_ripening
    domain_id: viticulture
    assertion_text: The cooler Templeton Gap can extend the ripening period and supports Chardonnay and Pinot
      Noir; actual harvest timing depends on the vineyard and vintage.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_willamette_pinot
    subject_id: n_reg_am_principle_oregon_range
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_am_point_willamette_pinot
    domain_id: geography
    assertion_text: Willamette Valley combines warm summers, cool evenings and a long growing season; Pinot
      Noir is its flagship grape, alongside several other varieties.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_rogue_diversity
    subject_id: n_reg_am_principle_oregon_range
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_am_point_rogue_diversity
    domain_id: geography
    assertion_text: Rogue Valley contains progressively warmer microclimates that accommodate both cool- and
      warm-climate varieties; the Oregon state name alone cannot specify a wine style.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_eola_wind
    subject_id: n_reg_am_principle_eola_planning
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_am_point_eola_wind
    domain_id: geography
    assertion_text: Cool Pacific air passes through the Van Duzer Corridor to Eola-Amity Hills, lowering
      late-summer afternoon temperatures and helping grapes retain acidity as they ripen.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_eola_grapes
    subject_id: n_reg_am_principle_eola_planning
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_am_point_eola_grapes
    domain_id: geography
    assertion_text: Pinot Noir and Chardonnay are among the established Eola-Amity Hills grapes; their
      presence is useful regional context, but climate and grape name do not guarantee final wine
      quality.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_washington_irrigation
    subject_id: n_reg_am_principle_washington_contrast
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_am_point_washington_irrigation
    domain_id: viticulture
    assertion_text: The Cascades and Olympics reduce rainfall reaching Columbia Valley, so irrigation is
      needed in most eastern Washington vineyards; this differs from the maritime west.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_washington_diurnal
    subject_id: n_reg_am_principle_washington_contrast
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_am_point_washington_diurnal
    domain_id: geography
    assertion_text: Long warm summer days encourage ripening in eastern Washington, while cool nights and
      harvest-season cooling can help retain acidity; a northern latitude alone does not mean cool
      summers.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_finger_spring
    subject_id: n_reg_am_principle_finger_seasons
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_am_point_finger_spring
    domain_id: viticulture
    assertion_text: In spring, lake water warms more slowly than surrounding land; nearby Finger Lakes
      vineyards can have delayed budbreak and reduced exposure to some spring frosts.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_finger_autumn
    subject_id: n_reg_am_principle_finger_seasons
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_am_point_finger_autumn
    domain_id: viticulture
    assertion_text: In autumn, lake water cools more slowly than surrounding land and can add warmth to
      nearby Finger Lakes vineyards, extending ripening opportunities without eliminating cold risk.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_niagara_water
    subject_id: n_reg_am_principle_canada_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_am_point_niagara_water
    domain_id: geography
    assertion_text: Lake Ontario and the Niagara River moderate Niagara-on-the-Lake temperatures and can
      reduce spring and autumn frost risk; vineyards farther from the water receive less moderation.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_okanagan_variation
    subject_id: n_reg_am_principle_canada_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_am_point_okanagan_variation
    domain_id: geography
    assertion_text: Okanagan Valley contains subregions with different soils and climates suited to a range
      of varieties, so a specific site matters when predicting style rather than a country-wide Canadian
      climate.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_aconcagua_coast
    subject_id: n_reg_am_principle_chile_coast_inland
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_am_point_aconcagua_coast
    domain_id: geography
    assertion_text: Coastal Aconcagua supports Chardonnay, Sauvignon Blanc and Pinot Noir, contrasting with
      the red-variety tradition farther inland; this is regional context, not grape exclusivity.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_maipo_cabernet
    subject_id: n_reg_am_principle_chile_coast_inland
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_am_point_maipo_cabernet
    domain_id: geography
    assertion_text: Maipo has hot dry summers and an established Cabernet Sauvignon focus; its inland context
      contrasts with the cooler coastal grape-growing opportunities of Aconcagua.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_casablanca_low
    subject_id: n_reg_am_principle_casablanca_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_am_point_casablanca_low
    domain_id: geography
    assertion_text: Lower cooler Casablanca sites favour Sauvignon Blanc and Chardonnay within a region
      moderated by Pacific air and morning fog.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_casablanca_high
    subject_id: n_reg_am_principle_casablanca_sites
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_am_point_casablanca_high
    domain_id: geography
    assertion_text: Some higher Casablanca sites are warmer and less frost-prone, accommodating Merlot and
      Syrah; local topography means greater elevation does not always imply cooler conditions.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_limari_chardonnay
    subject_id: n_reg_am_principle_chile_style_range
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_am_point_limari_chardonnay
    domain_id: geography
    assertion_text: Coastal Limari combines maritime influence and morning Camanchaca fog in a semi-arid
      setting, providing an established context for Chardonnay.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_colchagua_reds
    subject_id: n_reg_am_principle_chile_style_range
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_am_point_colchagua_reds
    domain_id: geography
    assertion_text: Colchagua has a strong red-variety tradition including Carmenere, Cabernet Sauvignon and
      Merlot; Pacific and Andean breezes can extend ripening and help preserve acidity.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_mendoza_temperature
    subject_id: n_reg_am_principle_mendoza_altitude
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_am_point_mendoza_temperature
    domain_id: geography
    assertion_text: At the Adrianna vineyard in Gualtallary, Uco Valley, high elevation moderates
      temperatures relative to warmer lower sites; altitude is one site factor rather than a quality
      ranking.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_malbec_uv
    subject_id: n_reg_am_principle_mendoza_altitude
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_am_point_malbec_uv
    domain_id: viticulture
    assertion_text: Catena and university investigations at high-altitude Mendoza sites report increased UV-B
      and changes in berry phenolics; the response depends on conditions and does not prove every higher
      wine is better.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_andes_irrigation
    subject_id: n_reg_am_principle_mendoza_water
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_am_point_andes_irrigation
    domain_id: viticulture
    assertion_text: Many traditional Argentine mountain wine valleys are arid and use Andean meltwater for
      irrigation; water availability must be part of site planning rather than assuming rainfall meets
      vine demand.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_argentina_methods
    subject_id: n_reg_am_principle_mendoza_water
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_am_point_argentina_methods
    domain_id: viticulture
    assertion_text: Flood and drip irrigation are both documented in Argentine vineyards; the existence of
      two methods does not establish one universal optimum for every Mendoza site.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_patagonia_latitude
    subject_id: n_reg_am_principle_patagonia_comparison
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_am_point_patagonia_latitude
    domain_id: geography
    assertion_text: Patagonian temperatures generally become cooler farther south, so latitude helps explain
      regional differences alongside altitude and local exposure; Patagonia is climatically diverse.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_patagonia_evaporation
    subject_id: n_reg_am_principle_patagonia_comparison
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_reg_am_point_patagonia_evaporation
    domain_id: viticulture
    assertion_text: Climate research describes eastern Patagonia as arid and highly evaporative with strong
      winds; cool conditions alone therefore do not remove the need to assess vineyard water supply.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_case_california_sites_action
    subject_id: n_reg_am_case_california_sites
    relation_type: CASE_ACTION
    object_id: n_reg_am_point_case_california_sites_action
    domain_id: viticulture
    assertion_text: Trial Carneros for the fresh Pinot Noir target and the warmer upper Napa parcel for
      Cabernet Sauvignon, confirming actual ripeness before contracting.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_case_california_sites_reason
    subject_id: n_reg_am_case_california_sites
    relation_type: CASE_REASON
    object_id: n_reg_am_point_case_california_sites_reason
    domain_id: geography
    assertion_text: Carneros receives greater marine cooling, while reduced Pacific influence farther up Napa
      Valley can provide more summer warmth for ripening.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_case_california_sites_tradeoff
    subject_id: n_reg_am_case_california_sites
    relation_type: CASE_TRADEOFF
    object_id: n_reg_am_point_case_california_sites_tradeoff
    domain_id: business
    assertion_text: In this scenario, choosing the lower quoted parcel for both grapes saves fruit cost but
      may compromise the desired fresh Pinot Noir style; compare total costs with target fit.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_case_california_sites_limitation
    subject_id: n_reg_am_case_california_sites
    relation_type: CASE_LIMITATION
    object_id: n_reg_am_point_case_california_sites_limitation
    domain_id: viticulture
    assertion_text: Inspect actual block exposure, grape performance and vintage conditions because the broad
      Napa label does not replace vineyard-level suitability evidence.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_case_pacific_northwest_action
    subject_id: n_reg_am_case_pacific_northwest
    relation_type: CASE_ACTION
    object_id: n_reg_am_point_case_pacific_northwest_action
    domain_id: geography
    assertion_text: Assess Willamette Pinot Noir for the fresh target and Columbia Valley Cabernet Sauvignon
      for the ripe target using samples and producer records.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_case_pacific_northwest_reason
    subject_id: n_reg_am_case_pacific_northwest
    relation_type: CASE_REASON
    object_id: n_reg_am_point_case_pacific_northwest_reason
    domain_id: geography
    assertion_text: Willamette has a long season with cool evenings; eastern Washington combines warm summer
      days, cool nights and irrigation in a rain shadow.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_case_pacific_northwest_tradeoff
    subject_id: n_reg_am_case_pacific_northwest
    relation_type: CASE_TRADEOFF
    object_id: n_reg_am_point_case_pacific_northwest_tradeoff
    domain_id: business
    assertion_text: The hypothetical lower unit quote trades against a larger inventory commitment; compare
      working capital and likely sales rather than treating region as a price guarantee.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_case_pacific_northwest_limitation
    subject_id: n_reg_am_case_pacific_northwest
    relation_type: CASE_LIMITATION
    object_id: n_reg_am_point_case_pacific_northwest_limitation
    domain_id: geography
    assertion_text: Region and latitude provide context, but site diversity and actual production choices
      require sample assessment and records before guaranteeing the finished wine.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_case_chile_white_action
    subject_id: n_reg_am_case_chile_white
    relation_type: CASE_ACTION
    object_id: n_reg_am_point_case_chile_white_action
    domain_id: geography
    assertion_text: Select the coastal Chardonnay that demonstrably meets the freshness target if its quoted
      cost and available volume suit the business plan.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_case_chile_white_reason
    subject_id: n_reg_am_case_chile_white
    relation_type: CASE_REASON
    object_id: n_reg_am_point_case_chile_white_reason
    domain_id: geography
    assertion_text: Coastal Aconcagua supports cooler-climate varieties including Chardonnay, contrasting
      with inland red-variety traditions; the stated samples provide the final style evidence.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_case_chile_white_tradeoff
    subject_id: n_reg_am_case_chile_white
    relation_type: CASE_TRADEOFF
    object_id: n_reg_am_point_case_chile_white_tradeoff
    domain_id: business
    assertion_text: The scenario trades a closer style fit against a higher quoted price and smaller supply;
      plan the required margin and volume without declaring all coastal wines expensive.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_case_chile_white_limitation
    subject_id: n_reg_am_case_chile_white
    relation_type: CASE_LIMITATION
    object_id: n_reg_am_point_case_chile_white_limitation
    domain_id: winemaking
    assertion_text: Coastal origin is useful context, but verify the batch and production choices; region
      does not guarantee quality, exact flavour or absence of oak.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_case_mendoza_claim_action
    subject_id: n_reg_am_case_mendoza_claim
    relation_type: CASE_ACTION
    object_id: n_reg_am_point_case_mendoza_claim_action
    domain_id: business
    assertion_text: Compare both samples and their total quoted cost against balance and margin targets; do
      not accept altitude alone as justification for the higher price.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_case_mendoza_claim_reason
    subject_id: n_reg_am_case_mendoza_claim
    relation_type: CASE_REASON
    object_id: n_reg_am_point_case_mendoza_claim_reason
    domain_id: viticulture
    assertion_text: High-altitude Mendoza conditions can moderate temperature and increase UV-B exposure,
      affecting ripening and Malbec phenolics; these are mechanisms rather than a universal quality
      score.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_case_mendoza_claim_tradeoff
    subject_id: n_reg_am_case_mendoza_claim
    relation_type: CASE_TRADEOFF
    object_id: n_reg_am_point_case_mendoza_claim_tradeoff
    domain_id: business
    assertion_text: Under the stated quotes, paying more reduces margin unless the actual style or sales case
      justifies it; a physical site effect is not itself evidence of commercial value.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
  - id: ki_reg_am_case_mendoza_claim_limitation
    subject_id: n_reg_am_case_mendoza_claim
    relation_type: CASE_LIMITATION
    object_id: n_reg_am_point_case_mendoza_claim_limitation
    domain_id: winemaking
    assertion_text: The samples differ in harvest date and oak regime, so the comparison cannot isolate
      altitude; obtain matched production information before claiming the cause of their sensory
      differences.
    verification_status: unverified
    mcq_disabled: true
    last_verified_at: 2026-09-27T00:25:07.000Z
