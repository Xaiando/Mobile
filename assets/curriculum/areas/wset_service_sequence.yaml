knowledge_items:
  - id: ki_wset_sseq_lineup
    subject_id: n_wset_sseq_principle_lineup
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sseq_point_lineup
    domain_id: service
    assertion_text: When serving several wines, a useful starting order moves from lighter, less intense examples towards fuller, more powerful ones. Consider aroma intensity, flavour and texture with the menu. Colour is a shortcut rather than a rule; a fuller white can follow a lighter red, and the planned food or a fragile mature bottle may justify a different order.
    last_verified_at: 2026-09-27T00:00:00.000Z
    verification_status: unverified
    mcq_disabled: true
  - id: ki_wset_sseq_table
    subject_id: n_wset_sseq_principle_table
    relation_type: PRINCIPLE_EXPLANATION
    object_id: n_wset_sseq_point_table
    domain_id: service
    assertion_text: Confirm the ordered wine and vintage by presenting the label, prepare suitable glasses and temperature, and open the bottle safely. Offer a small tasting sample to check its condition before pouring the full servings. Investigate a suspected fault and replace faulty wine rather than continue pouring it. Complete service without overfilling the glasses; adapt the table's pouring order to the venue and guests.
    last_verified_at: 2026-09-27T00:00:00.000Z
    verification_status: unverified
    mcq_disabled: true
