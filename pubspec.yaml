name: sommelier
description: "Sommelier study app: spaced repetition, tasting practice and a wine journal."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  clock: ^1.1.3
  # Cupertino widgets that Material's adaptive constructors use on iOS draw
  # their icons from this font. Unused glyphs are tree-shaken.
  cupertino_icons: ^1.0.8
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0
  # Test-only until Phase 3: proves review_states is a projection of the log.
  fsrs: ^2.0.1
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
