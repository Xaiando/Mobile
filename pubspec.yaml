name: sommelier
description: "Sommelier study app: spaced repetition, tasting practice and a wine journal."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  clock: ^1.1.3
  crypto: ^3.0.7
  # Cupertino widgets that Material's adaptive constructors use on iOS draw
  # their icons from this font. Unused glyphs are tree-shaken.
  cupertino_icons: ^1.0.8
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.4.3
  # FSRS-6 scheduling (architecture audit FS-1).
  fsrs: ^2.0.1
  go_router: ^18.0.1
  yaml: ^3.1.4
  file_picker: 13.1.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # Runs the real app on a device (integration_test/, Windows in CI).
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    # The curriculum's manifest and the folders of the files it includes.
    # New area and template files need no entry here. The review ledger
    # (reviews/) is authoring data and is not bundled.
    - assets/curriculum/curriculum.yaml
    - assets/curriculum/areas/
    - assets/curriculum/templates/
