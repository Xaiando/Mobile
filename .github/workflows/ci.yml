name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read the pinned Flutter version
        id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generated code and schema snapshot are up to date
        run: |
          dart run build_runner build
          dart run drift_dev make-migrations
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated files are stale. Run build_runner and make-migrations, then commit."
            git status --short
            git diff
            exit 1
          fi
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart' ':!:*.g.dart')
      - run: flutter analyze
      - run: flutter test
      - name: Web assets match pubspec.lock
        run: tool/web_assets.sh check

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Read the pinned Flutter version
        id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
      - run: flutter build apk --debug
      # On main only, and only once the repository has the private release
      # key (tool/android/make_release_key.ps1), so pull requests never see
      # it and every APK from main can update the one before.
      - name: Sign with the release key
        if: github.event_name == 'push'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No release key yet: this APK is signed with a debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=release"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties
      - run: flutter build apk --release
      - name: Native libraries are 16 KB aligned
        run: tool/check_16kb_alignment.sh build/app/outputs/flutter-apk/app-release.apk
      - name: Keep the APK to install
        uses: actions/upload-artifact@v5
        with:
          name: sommelier-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Windows build and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read the pinned Flutter version
        id: flutter
        shell: bash
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
      - name: The app starts, installs the curriculum and studies a card
        run: flutter test integration_test -d windows --dart-define=SOMMELIER_DATABASE=integration
      - run: flutter build windows --release
      - name: Bundle the Visual C++ runtime next to the app
        shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:SystemRoot/System32/$dll" build/windows/x64/runner/Release/
          }
      - name: Build the installer
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version: (\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" windows\installer\sommelier.iss
      - name: Keep the installer
        uses: actions/upload-artifact@v5
        with:
          name: sommelier-windows-installer
          path: build/installer/*.exe
      - name: Keep the portable app
        uses: actions/upload-artifact@v5
        with:
          name: sommelier-windows-portable
          path: build/windows/x64/runner/Release/

  ios:
    name: iOS build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read the pinned Flutter version
        id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
      - run: flutter build ios --debug --no-codesign

  web:
    name: Web build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read the pinned Flutter version
        id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
      - run: tool/web_assets.sh check
      - name: Build the app
        run: flutter build web --release --no-web-resources-cdn
      - name: Build the database smoke test
        run: flutter build web -t tool/web_smoke/main.dart -o build/web_smoke --no-web-resources-cdn
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Map layers match their manifest
        working-directory: tool/geography
        run: |
          npm ci
          npm test
          npm run check
      - name: Install Playwright
        working-directory: tool/web_smoke
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the smoke test in headless Chromium
        run: node tool/web_smoke/run.mjs build/web_smoke
