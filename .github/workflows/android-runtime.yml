name: Android runtime

# ci.yml only compiles the Android app. Nothing else starts it on Android.
# This workflow does, on Android 16 emulators, and holds the built APKs to the
# app's Android contract (tool/android/verify_apk.py): no network permission,
# API 35+, 16 KB-aligned native libraries, signed.
#
# It runs only when Android files change, and can be run by hand.
on:
  # Temporary: lets this branch iterate without running the whole of ci.yml.
  push:
    branches: ['claude/android-**']
  pull_request:
    paths:
      - 'android/**'
      - 'tool/android/**'
      - 'integration_test/**'
      - '.github/workflows/android-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Android APK contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Read the pinned Flutter version
        id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
      - name: The verifier and the smoke script behave
        run: |
          python3 -m unittest discover -s tool/android -p "test_*.py"
          bash tool/android/test_emulator_smoke.sh
          bash tool/android/test_ocr_smoke.sh
      - run: flutter build apk --release
      - name: The release APK is offline, signed, 16 KB aligned and targets API 35 or later
        run: python3 tool/android/verify_apk.py build/app/outputs/flutter-apk/app-release.apk
      # For a phone: arm64 only, about half the size of the universal APK.
      # Signed with the debug key this run made, so it cannot update an app
      # installed from another run (docs/android-acceptance.md).
      - name: Build the phone APK
        run: flutter build apk --release --target-platform android-arm64
      - name: The phone APK meets the same contract
        run: python3 tool/android/verify_apk.py build/app/outputs/flutter-apk/app-release.apk
      - name: Keep the phone APK to install
        uses: actions/upload-artifact@v5
        with:
          name: sommelier-android-arm64-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - run: flutter build apk --debug
      - name: The debug APK keeps INTERNET for the Flutter tool
        run: >
          python3 tool/android/verify_apk.py --debug
          --require-permission android.permission.INTERNET
          build/app/outputs/flutter-apk/app-debug.apk

  emulator:
    name: Emulator, ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android 16 with 4 KB pages
            target: google_apis
          - name: Android 16 with 16 KB pages
            target: google_apis_ps16k
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Read the pinned Flutter version
        id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/sommelier-release.apk
      # One emulator session for the checks. The smoke test installs the
      # release APK, launches it twice and scans logcat; a failure is recorded
      # so that the integration test still runs, then fails the job below.
      - name: Smoke test the release app, then run the integration test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 4096M
          heap-size: 576M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            bash tool/android/emulator_smoke.sh --uninstall-after --control --timeout 600 build/sommelier-release.apk build/android-smoke || touch build/android-smoke/FAILED
            flutter test integration_test --dart-define=SOMMELIER_DATABASE=integration
      - name: Keep the smoke test report, screenshot and logcat
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-smoke-${{ matrix.target }}
          path: build/android-smoke
          if-no-files-found: ignore
      - name: The smoke test passed
        run: test ! -e build/android-smoke/FAILED

  # The integration test builds the debug app, which R8 does not shrink, so it
  # cannot see what R8 strips from a release build. This job builds a tiny app
  # in release mode (tool/android_smoke) that reads a drawn label with the
  # cellar's own OCR function and calls the other plugins that have Android
  # code, with requests that need no screen. It runs on an emulator, in an APK
  # that holds no INTERNET permission, and answers in minutes rather than after
  # the long first-launch test.
  release-plugins:
    name: Text recognition and plugins in a release build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Read the pinned Flutter version
        id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the check app
        run: flutter build apk --release -t tool/android_smoke/main.dart --target-platform android-x64
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/ocr-check.apk
      - name: The check app holds no network permission either
        run: python3 tool/android/verify_apk.py build/ocr-check.apk
      - name: Read a label and call the plugins on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 4096M
          heap-size: 576M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tool/android/ocr_smoke.sh --uninstall-after build/ocr-check.apk build/android-release-plugins
      - name: Keep the report and logcat
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-release-plugins
          path: build/android-release-plugins
          if-no-files-found: ignore
