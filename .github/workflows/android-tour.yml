name: Android emulator acceptance

# Walks the real app on an Android 16 emulator through every main screen, in
# light, dark and large text (tool/android_tour), takes a screenshot of each
# and fails on any layout overflow. It is how the app's look on a phone is
# seen without a phone: download the artifact and open the pictures.
#
# The walk runs in five window shapes: the emulator's own phone screen, and
# the Galaxy Z Fold 6's cover screen, inner screen, inner screen sideways and
# half of the inner screen (tool/android/window_shape.sh). In the phone run the
# app is also resized under a half-filled form, as folding and unfolding does,
# and must keep what was typed.
#
# A second job kills the release app part-way through its first launch, sends
# it Home, rotates it, trims its memory and kills it in the background, and
# checks that it comes back each time (tool/android/resilience.sh).
#
# A third job exports a wine and its photo through the real Your data screen,
# loses them, imports the file and checks they are back, and that a file that
# is not a backup changes nothing (tool/android/data_roundtrip.sh).
#
# It runs by hand and on pull requests that change the tour itself. It is
# deliberately not run on every change to lib/: a renamed button would then
# fail every other pull request. test/tool/android_tour_test.dart keeps the
# tour in step with the screens in the normal suite.
on:
  pull_request:
    paths:
      - 'tool/android_tour/**'
      - 'tool/android/screen_tour.sh'
      - 'tool/android/test_screen_tour.sh'
      - 'tool/android/window_shape.sh'
      - 'tool/android/test_window_shape.sh'
      - 'tool/android/testdata/**'
      - 'tool/android/resilience.sh'
      - 'tool/android/test_resilience.sh'
      - 'tool/android/data_roundtrip.sh'
      - 'tool/android/test_data_roundtrip.sh'
      - '.github/workflows/android-tour.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-tour-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tour:
    name: Screen tour on Android 16 (${{ matrix.shape }})
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - shape: phone
            options: --resize-walk
          - shape: fold-cover
            options: ''
          - shape: fold-open
            options: ''
          - shape: fold-open-wide
            options: ''
          - shape: fold-split
            options: ''
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Read the pinned Flutter version
        id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
      - name: The tour script and the window shapes behave
        run: |
          bash tool/android/test_window_shape.sh
          bash tool/android/test_screen_tour.sh
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Walk the screens on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 4096M
          heap-size: 576M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tool/android/screen_tour.sh --shape ${{ matrix.shape }} ${{ matrix.options }} build/android-tour
      - name: Keep the screenshots and logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-screen-tour-${{ matrix.shape }}
          path: build/android-tour
          if-no-files-found: ignore

  # The release app, as a learner has it, on an emulator. The first launch
  # installs the whole curriculum, which takes a minute or more on a phone and
  # is the longest window in which Android can kill the app.
  resilience:
    name: Resilience on Android 16
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Read the pinned Flutter version
        id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
      - name: The resilience script behaves
        run: bash tool/android/test_resilience.sh
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/sommelier-release.apk
      - name: Kill, background, rotate and trim the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 4096M
          heap-size: 576M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tool/android/resilience.sh build/sommelier-release.apk build/android-resilience
      - name: Keep the report, screenshots and logcat
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-resilience
          path: build/android-resilience
          if-no-files-found: ignore

  # The one way to keep the journal across a move to a new phone, or to a build
  # signed with another key: Settings, Your data, export, then import. Only the
  # platform's file dialog is replaced; the phone checks Samsung's own.
  roundtrip:
    name: Backup round trip on Android 16
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Read the pinned Flutter version
        id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
      - name: The round trip script behaves
        run: bash tool/android/test_data_roundtrip.sh
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Export, lose, import and check on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 4096M
          heap-size: 576M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tool/android/data_roundtrip.sh build/android-roundtrip
      - name: Keep the report and logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-roundtrip
          path: build/android-roundtrip
          if-no-files-found: ignore
