name: Android screen tour

# Walks the real app on an Android 16 emulator through every main screen, in
# light, dark and large text (tool/android_tour), takes a screenshot of each
# and fails on any layout overflow. It is how the app's look on a phone is
# seen without a phone: download the artifact and open the pictures.
#
# It runs by hand and on pull requests that change the tour itself. It is
# deliberately not run on every change to lib/: a renamed button would then
# fail every other pull request. test/tool/android_tour_test.dart keeps the
# tour in step with the screens in the normal suite.
on:
  pull_request:
    paths:
      - 'tool/android_tour/**'
      - 'tool/android/screen_tour.sh'
      - '.github/workflows/android-tour.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-tour-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tour:
    name: Screen tour on Android 16
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Read the pinned Flutter version
        id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
      - name: The tour script behaves
        run: bash tool/android/test_screen_tour.sh
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Walk the screens on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 4096M
          heap-size: 576M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tool/android/screen_tour.sh build/android-tour
      - name: Keep the screenshots and logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-screen-tour
          path: build/android-tour
          if-no-files-found: ignore
