excluded:
  - name: Eurostat GISCO / EuroGeographics administrative boundaries
    reason: Non-commercial use only.
  - name: OpenStreetMap
    reason: ODbL share-alike could extend to a bundled derived database.
  - name: data.gouv.fr "Contours administratifs" (Etalab)
    reason: Published under ODbL, being derived in part from OpenStreetMap.
  - name: Map artwork of trade bodies, publishers and wine atlases
    reason: Copyrighted artwork; nothing is traced from it.
  - name: Google Maps, Mapbox and other online tile services
    reason: Online and paid, and the app studies offline (GEO-3).
