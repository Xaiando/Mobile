# The map layers (docs/design/geography.md §7). `npm run build` turns each
# into assets/geography/<asset>, records it in assets/geography/manifest.yaml
# and writes the build report, report.md.
#
# A feature keyed by a node ID draws that knowledge node (node_geometries).
# Other features are context: named, drawn, never askable.
#
# zoom: the Web Mercator zoom range the layer is drawn in, [min, max).
# simplify: the share of vertices kept (Visvalingam, shapes kept).
# quantization: the TopoJSON grid, per axis of the layer's bounding box.

# Communes that INAO's list still names by a code that ADMIN EXPRESS no
# longer has, even as a delegated commune: each merged into a commune
# nouvelle, whose own area includes it. The build draws the successor only
# where INAO lists it for the same area, so no area grows.
commune_successors:
  "21658": "21195" # Vauchignon, now part of Cormot-Vauchignon
  "37120": "37232" # Ingrandes-de-Touraine, now part of Coteaux-sur-Loire
  "37227": "37232" # Saint-Michel-sur-Loire, now part of Coteaux-sur-Loire
  "44160": "44003" # Saint-Géréon, now part of Ancenis-Saint-Géréon
  "69144": "69208" # Nuelles, merged into Saint-Germain-Nuelles (INSEE 2026).
  "33091": "33268" # Cantenac, now Margaux-Cantenac (INSEE).
  "33092": "33008" # Cantois, now Porte-de-Benauge (INSEE).
  "33338": "33055" # Prignac-en-Médoc, now Blaignan-Prignac (INSEE).
  # INSEE COG 2026, v_mvt_commune_2026.csv (src_insee_cog_movements).
  "12020": "12090" # Balsac → Druelle Balsac
  "24181": "24534" # Flaugeac → Sigoulès-et-Flaugeac
  "25134": "25185" # Châtillon-sur-Lison → Cussey-sur-Lison
  "25399": "25460" # Montfort → Le Val
  "26371": "26289" # Véronne → Saillans
  "39023": "39378" # L'Aubépin → Les Trois-Châteaux
  "39135": "39378" # Chazelles → Les Trois-Châteaux
  "39395": "39043" # Orbagna → Beaufort-Orbagna
  "39484": "39378" # Saint-Jean-d'Étreux → Les Trois-Châteaux
  "39488": "39021" # Saint-Laurent-la-Roche → La Chailleuse
  "66163": "66106" # Riunoguès → Maureillas-las-Illas
  "81155": "81026" # Marsal → Bellegarde-Marsal

layers:
  # World context, from Natural Earth 1:50m.
  - id: ml_world_continents
    asset: world_continents.topo.json
    display_name: Continents
    geometry: area
    zoom: [ 0, 3 ]
    sources: [ src_ne_regions ]
    natural_earth:
      input: ne_50m_geography_regions_polys
      where: FEATURECLA == 'Continent'
      name: NAME
    simplify: 8%
    quantization: 20000

  - id: ml_world_countries
    asset: world_countries.topo.json
    display_name: Countries
    geometry: area
    zoom: [ 0, 10 ]
    sources: [ src_ne_countries, src_ne_map_units, src_ne_americas_island_parts ]
    natural_earth:
      input: ne_50m_admin_0_countries
      name: NAME_EN
      key: ADM0_A3
      # France's map units, so that metropolitan France (FXX) is the node's
      # feature and each overseas department is context of its own.
      replace:
        input: ne_50m_admin_0_map_units
        where: ADM0_A3 == 'FRA'
        key: GU_A3
      # Complete 10m source island parts omitted by the 50m country outlines.
      # Existing country shapes and France's map-unit replacement remain.
      supplement:
        source: src_ne_americas_island_parts
        key: key
        name: name
      nodes:
        FXX: n_geo_france
        ITA: n_geo_italy
        DEU: n_geo_germany
        AUT: n_geo_austria
        CHE: n_geo_switzerland
        HUN: n_geo_hungary
        GRC: n_geo_greece
        ESP: n_geo_spain
        PRT: n_geo_portugal
        USA: n_geo_united_states
        CAN: n_geo_canada
        CHL: n_geo_chile
        ARG: n_geo_argentina
        AUS: n_geo_australia
        NZL: n_geo_new_zealand
        ZAF: n_geo_south_africa
        GEO: n_geo_georgia
        LBN: n_geo_lebanon
        GBR: n_geo_united_kingdom
        CHN: n_geo_china
    simplify: 40%
    quantization: 100000

  - id: ml_world_coastline
    asset: world_coastline.topo.json
    display_name: Coastlines
    geometry: line
    zoom: [ 0, 10 ]
    sources: [ src_ne_coastline ]
    natural_earth:
      input: ne_50m_coastline
    simplify: 40%
    quantization: 100000

  - id: ml_world_marine
    asset: world_marine.topo.json
    display_name: Seas and oceans
    geometry: area
    zoom: [ 0, 8 ]
    sources: [ src_ne_marine ]
    natural_earth:
      input: ne_50m_geography_marine_polys
      name: name
    simplify: 25%
    quantization: 50000

  - id: ml_world_lakes
    asset: world_lakes.topo.json
    display_name: Lakes
    geometry: area
    zoom: [ 2, 10 ]
    sources: [ src_ne_lakes ]
    natural_earth:
      input: ne_50m_lakes
      name: name
    simplify: 40%
    quantization: 100000

  - id: ml_world_rivers
    asset: world_rivers.topo.json
    display_name: Major rivers
    geometry: line
    zoom: [ 3, 10 ]
    sources: [ src_ne_rivers ]
    natural_earth:
      input: ne_50m_rivers_lake_centerlines
      where: featurecla == 'River'
      name: name_en
    simplify: 40%
    quantization: 100000

  - id: ml_world_physical
    asset: world_physical.topo.json
    display_name: Mountain ranges, plateaus and plains
    geometry: area
    zoom: [ 2, 7 ]
    sources: [ src_ne_regions ]
    natural_earth:
      input: ne_50m_geography_regions_polys
      where: "['Range/mtn', 'Plateau', 'Plain', 'Valley', 'Basin', 'Foothills',
        'Lowland'].includes(FEATURECLA)"
      name: NAME
    simplify: 15%
    quantization: 50000

