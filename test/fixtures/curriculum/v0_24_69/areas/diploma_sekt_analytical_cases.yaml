    {
      "id": "n_d4sekt_case_winzersekt_allocation",
      "node_type": "production_case",
      "name": "An invented estate in the Pfalz has sound, hand-picked Riesling lots from the same harvest: one lot from a sheltered sandstone terrace and another from a loess slope. The estate brief is a brisk, autolytic sparkling wine for release in 12 months. Lot A underwent traditional bottle fermentation (Klassische FlaschengÃ¤rung) with estate fruit, currently planned for 10 months on lees and disgorgement in month 11. Lot B was vinified by contract pressurised tank fermentation (Deutscher Sekt b.A.) that has already completed its statutory six-month production duration, permitting immediate commercial packaging and release within week 8. A preliminary coded sensory panel judges Lot A closer to the autolytic brief; Lot B is judged fruit-forward and simpler. A specialised wine merchant offers a prepaid order for 360 bottles at a premium unit price with required estate staff attendance at two promotional tastings. A regional wholesale distributor requests an allocation of 2,400 bottles of Lot B with payment 60 days after shipment, but provides no credit history or account sell-through data. A bottling and press leasing instalment of 8,500 EUR is due in 24 days. Liquid cash balances, full production cost accounting, repeat panel stability records, official A.P.-Nr. certification for the lots, and distributor credit references are missing. All lots, methods, timings, volumes and financial terms are fictional and do not represent statutory norms or guaranteed returns. Recommend a conditional production and sales action, explain the technical and comparative evidence, weigh the operational and commercial tradeoffs, and identify the unresolved variables that must be verified."
    },
    {
      "id": "n_d4sekt_case_winzersekt_allocation_action",
      "node_type": "learning_point",
      "name": "Progress Lot A as a conditional pilot for the autolytic brief, complete required A.P.-Nr. testing and stability checks, accept the prepaid merchant order to assist near-term liquidity while verifying net cash receipts against dated lease liabilities in a cash-flow forecast, and verify distributor creditworthiness before committing inventory to extended payment terms"
    },
    {
      "id": "n_d4sekt_case_winzersekt_allocation_reason",
      "node_type": "learning_point",
      "name": "The 10-month traditional lees aging of Lot A aligns with the Winzersekt autolytic brief and deadline; Lot B's tank method preserves fruit rather than autolysis. The different terroir lots and secondary fermentation routes represent confounded variables that prevent attributing sensory differences to lees aging alone"
    },
    {
      "id": "n_d4sekt_case_winzersekt_allocation_tradeoff",
      "node_type": "learning_point",
      "name": "Earlier cash inflow from the prepaid merchant order assists near-term liquidity ahead of the 24-day lease payment, but cannot be assumed sufficient without a dated cash forecast and verified margins; the distributor order absorbs volume but delays cash collection and exposes credit risk"
    },
    {
      "id": "n_d4sekt_case_winzersekt_allocation_limitation",
      "node_type": "learning_point",
      "name": "Official A.P.-Nr. quality wine certification, repeat panel and cold stability data, full bottle-cost accounting, distributor downstream sell-through rates, and estate staffing capacity remain unconfirmed and cannot be inferred from the preliminary trial"
    },
    {
      "id": "n_d4sekt_case_extended_lees_positioning",
      "node_type": "production_case",
      "name": "An invented Rheingau estate evaluates two Pinot Noir and Chardonnay sparkling base blends from single-vineyard parcels: Lot C is a non-vintage (NV) cuvÃ©e, and Lot D is a single-vintage cuvÃ©e. The strategic brief is a high-prestige sparkling cuvÃ©e for on-premise gastronomy placement in 18 months. Lot C has completed 15 months on lees in bottle (conforming to the baseline non-vintage VDP.SEKT standard of 15 months minimum; vintage releases require at least 24 months), with estimated sensory readiness and disgorgement in month 16. Lot D is held for extended 36-month lees aging (conforming to the VDP.SEKT.PRESTIGE benchmark of 36 months minimum), estimated ready for market release in month 38. A preliminary sensory panel finds Lot C shows crisp citrus, red berry and light pastry notes, ready for near-term service; Lot D is judged tightly wound with developing yeast autolysis and chalky minerality, but unready for release within the 18-month target. A luxury fine-dining restaurant group offers a standing prepaid order for 240 bottles of Lot C with sommelier training workshops. An export broker requests 1,800 bottles of Lot D on a 90-day consignment/credit arrangement for an overseas market, without providing secondary market price realisation or account sell-through history. A cellar storage and climate-control lease invoice falls due in 30 days. Liquid reserves, total cellaring and inventory holding costs, disgorgement dosage trials, formal association certification, and overseas broker solvency are unknown. All parameters are fictional. Recommend a conditional commercial and cellar action, explain the enological and timing evidence, weigh the working-capital and channel tradeoffs, and specify the critical factors that require formal verification."
    },
    {
      "id": "n_d4sekt_case_extended_lees_positioning_action",
      "node_type": "learning_point",
      "name": "Disgorge and release non-vintage Lot C conditionally for the 18-month restaurant brief, secure the prepaid gastronomy contract to assist near-term cash requirements, and maintain Lot D on lees until maturity while verifying export market demand and distributor credit before committing the extended inventory"
    },
    {
      "id": "n_d4sekt_case_extended_lees_positioning_reason",
      "node_type": "learning_point",
      "name": "Lot C (as a non-vintage cuvÃ©e) meets the 18-month target window and the 15-month VDP.SEKT non-vintage lees requirement (whereas vintage VDP.SEKT mandates at least 24 months on lees), whereas Lot D requires 38 months to fulfill the Prestige profile and would miss the deadline. The parcel variations and differing lees durations confound direct quality ranking without standardized disgorgement and dosage trials"
    },
    {
      "id": "n_d4sekt_case_extended_lees_positioning_tradeoff",
      "node_type": "learning_point",
      "name": "The restaurant allocation provides early cash inflow assisting near-term liquidity ahead of the 30-day lease invoice, though prepayment volume alone does not guarantee full coverage without opening cash balances and a dated forecast; the export consignment contract moves larger volume but ties up working capital for 38+ months, defers cash collection, and concentrates overseas credit risk"
    },
    {
      "id": "n_d4sekt_case_extended_lees_positioning_limitation",
      "node_type": "learning_point",
      "name": "Association certification status, repeat disgorgement dosage trials, full inventory holding and riddling costs, export account sell-through evidence, and winery labour capacity remain unverified and cannot be substituted by prestige label terminology"
    }
  ],
